[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambihtmlbench"
version = "0.1.0"
description = "AmbiHTMLBench objective + human-like subjective reconstruction benchmark"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.53.0",
  "rapidfuzz>=3.9.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "Pillow>=11.0.0",
  "requests>=2.32.0",
  "tqdm>=4.66.0"
]

[project.scripts]
ambihtmlbench = "benchmark.cli:main"
ambibench = "benchmark.cli:main"
ambihtmlbench-proxy = "benchmark.frozen_proxy_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.setuptools.package-data]
benchmark = ["prompts/*.md", "prompts/*.txt"]
