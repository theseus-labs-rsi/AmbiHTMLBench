<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育原则答题模板</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #1f2020;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      position: relative;
      width: 539px;
      height: 675px;
      overflow: hidden;
      padding: 39px 33px 24px 34px;
      color: #e7e7e7;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.018) 0 1px, transparent 1.4px) 0 0 / 7px 7px,
        #202121;
    }

    .title {
      position: relative;
      z-index: 2;
      margin: 0 0 14px;
      color: #ffba18;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.95;
      letter-spacing: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.88;
      letter-spacing: 0;
    }

    .item {
      margin: 0;
    }

    .indent {
      display: inline-block;
      width: 11px;
    }

    .watermark {
      position: absolute;
      z-index: 1;
      left: 143px;
      top: 318px;
      width: 310px;
      color: #08713f;
      opacity: 0.45;
      font-size: 37px;
      line-height: 2.2;
      text-align: center;
      transform: rotate(-35deg);
      transform-origin: center;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">7.当题目中出现“原则”时，可用<br>以下模板：</h1>

    <section class="content">
      <p class="item">(一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展</p>
      <p class="item">(二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教</p>
      <p class="item"><span class="indent"></span>（三）科学性原则。...能给幼儿正确的启蒙教<br>育</p>
      <p class="item">(四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点</p>
      <p class="item"><span class="indent"></span>（五）整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展</p>
      <p class="item"><span class="indent"></span>（六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主</p>
    </section>

    <div class="watermark" aria-hidden="true">[illegible]<br>[illegible]</div>
  </main>
</body>
</html>
