<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频剪辑素材</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #ffffe9;
      color: #303030;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }

    .page {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      padding-top: 23px;
      background: #ffffe9;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      color: #050505;
      text-align: center;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 45px;
      letter-spacing: 5px;
    }

    .content-card {
      width: 510px;
      height: 620px;
      margin: 7px auto 0;
      padding: 7px 8px 5px;
      border-radius: 23px;
      background: #ffffff;
      text-align: center;
      overflow: hidden;
    }

    .resource {
      margin: 0;
    }

    .resource-name {
      margin: 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 26px;
    }

    .resource-description {
      margin: 2px 0 0;
      font-size: 17px;
      font-weight: 400;
      line-height: 28px;
      white-space: nowrap;
    }

    .resource-1 {
      margin-top: 0;
    }

    .resource-2 {
      margin-top: 17px;
    }

    .resource-3 {
      margin-top: 16px;
    }

    .resource-4 {
      margin-top: 16px;
    }

    .resource-5 {
      margin-top: 14px;
    }

    .resource-6 {
      margin-top: 13px;
    }

    .resource-6 .resource-description {
      white-space: normal;
      line-height: 28px;
    }

    .resource-7 {
      margin-top: 14px;
    }

    .resource-8 {
      margin-top: 15px;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <h1>视频剪辑素材</h1>

    <section class="content-card">
      <div class="resource resource-1">
        <h2 class="resource-name">Videezy</h2>
        <p class="resource-description">提供免F高清视频素材、音频素材和音效素材</p>
      </div>

      <div class="resource resource-2">
        <h2 class="resource-name">Coverr</h2>
        <p class="resource-description">每周更新免F高清视频素材库，可以下zai和使用</p>
      </div>

      <div class="resource resource-3">
        <h2 class="resource-name">Pixabay</h2>
        <p class="resource-description">提供免F高清视频素材、照片素材和插图素材，可下zai和使用</p>
      </div>

      <div class="resource resource-4">
        <h2 class="resource-name">Life of Vids</h2>
        <p class="resource-description">提供免F高清视频素材，可以使用</p>
      </div>

      <div class="resource resource-5">
        <h2 class="resource-name">视频中国</h2>
        <p class="resource-description">提供各种类型的免F视频素材，可以按照分类进行检索</p>
      </div>

      <div class="resource resource-6">
        <h2 class="resource-name">无版权素材库</h2>
        <p class="resource-description">提供各种类型的免F剪辑素材，包括视频、音乐、插件等，所有素<br>材均为无版权素材，可自由使用</p>
      </div>

      <div class="resource resource-7">
        <h2 class="resource-name">Pexels Videos</h2>
        <p class="resource-description">提供免F高清视频素材和动画素材，可下zai和使用</p>
      </div>

      <div class="resource resource-8">
        <h2 class="resource-name">找台词</h2>
        <p class="resource-description">可以根据想要的台词找到影视片段</p>
      </div>
    </section>
  </main>
</body>
</html>
