<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内知名设计工作室的官网</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d8;
  }

  body {
    display: flex;
    justify-content: center;
    font-family: Arial, "Helvetica Neue", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: #050505;
  }

  .page {
    position: relative;
    width: 540px;
    height: 720px;
    overflow: hidden;
    background: #fff;
  }

  .header {
    position: relative;
    height: 79px;
    background: #fff;
  }

  .brand {
    position: absolute;
    top: 19px;
    left: 17px;
    height: 43px;
    display: flex;
    align-items: flex-start;
    white-space: nowrap;
  }

  .brand-mark {
    position: relative;
    display: inline-block;
    width: 112px;
    height: 40px;
    margin-right: 2px;
    transform: skew(-12deg);
  }

  .brand-mark .stroke {
    position: absolute;
    height: 4px;
    background: #050505;
    border-radius: 4px;
    transform-origin: left center;
  }

  .brand-mark .s1 {
    width: 57px;
    left: 0;
    top: 27px;
    transform: rotate(-35deg);
  }

  .brand-mark .s2 {
    width: 61px;
    left: 18px;
    top: 8px;
    transform: rotate(153deg);
  }

  .brand-mark .s3 {
    width: 56px;
    left: 49px;
    top: 12px;
    transform: rotate(-7deg);
  }

  .brand-mark .s4 {
    width: 43px;
    left: 64px;
    top: 25px;
    transform: rotate(13deg);
  }

  .brand-mark .s5 {
    width: 31px;
    left: 77px;
    top: 15px;
    transform: rotate(83deg);
  }

  .brand-mark .s6 {
    width: 34px;
    left: 58px;
    top: 31px;
    transform: rotate(-20deg);
  }

  .brand-mark .dot {
    position: absolute;
    right: -2px;
    top: 11px;
    width: 5px;
    height: 5px;
    border: 1px solid #050505;
    border-radius: 50%;
  }

  .share {
    margin-top: 3px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -2px;
  }

  .volume {
    margin-top: 4px;
    margin-left: 4px;
    font-size: 16px;
    font-weight: 700;
  }

  .web-label {
    position: absolute;
    right: 18px;
    top: 27px;
    height: 30px;
    display: flex;
    align-items: center;
    border: 3px solid #050505;
    background: #fff;
  }

  .web-icon {
    position: relative;
    width: 30px;
    height: 25px;
    background: #050505;
  }

  .web-icon::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 4px;
    width: 16px;
    height: 16px;
    background: linear-gradient(135deg, #e5edf1 0%, #9aa7ad 50%, #606a70 100%);
    transform: skewY(-9deg);
  }

  .web-text {
    padding: 0 7px 1px;
    font-size: 19px;
    line-height: 24px;
    white-space: nowrap;
  }

  .header-rule {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 1px;
    height: 3px;
    background: #050505;
  }

  .showcase {
    position: relative;
    height: 276px;
    background: #fff;
  }

  .folder {
    position: absolute;
    z-index: 2;
    border: 1px solid #d9d9d9;
    border-radius: 7px 7px 2px 2px;
    background:
      linear-gradient(to bottom, rgba(255,255,255,.95), rgba(221,221,221,.94)),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.03) 3px 4px);
    box-shadow:
      inset 0 -6px 0 rgba(0,0,0,.035),
      0 1px 1px rgba(0,0,0,.08);
  }

  .folder::before {
    content: "";
    position: absolute;
    z-index: -1;
    left: 0;
    top: -17px;
    width: 58px;
    height: 26px;
    border: 1px solid #dedede;
    border-bottom: 0;
    border-radius: 7px 9px 0 0;
    background: linear-gradient(#fafafa, #ececec);
    transform: skewX(28deg);
    transform-origin: left bottom;
  }

  .folder::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 8px;
    height: 3px;
    background: rgba(255,255,255,.8);
    border-top: 1px solid rgba(0,0,0,.05);
  }

  .number {
    position: absolute;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(190,190,190,.46);
    color: rgba(255,255,255,.72);
    font-size: 22px;
    font-weight: 700;
  }

  .folder-left {
    left: 25px;
    top: 91px;
    width: 155px;
    height: 112px;
    transform: rotate(-48deg);
  }

  .folder-left .number {
    left: 6px;
    bottom: 7px;
  }

  .folder-left .card-copy {
    position: absolute;
    left: 42px;
    top: 14px;
    line-height: .92;
  }

  .folder-left .abcd {
    font-size: 35px;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .folder-left .small-stack {
    margin-top: 5px;
    font-size: 17px;
    font-weight: 700;
    line-height: .95;
  }

  .folder-center {
    left: 208px;
    top: 75px;
    width: 137px;
    height: 91px;
  }

  .folder-center::before {
    width: 48px;
  }

  .folder-center .number {
    left: 5px;
    bottom: 9px;
  }

  .folder-center .cn {
    position: absolute;
    top: 19px;
    left: 5px;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -2px;
    white-space: nowrap;
  }

  .folder-center .en {
    position: absolute;
    right: 6px;
    bottom: 8px;
    text-align: right;
    font-size: 18px;
    font-weight: 800;
    line-height: .9;
  }

  .folder-right {
    right: 17px;
    top: 82px;
    width: 145px;
    height: 112px;
    transform: rotate(34deg);
  }

  .folder-right::before {
    width: 55px;
  }

  .folder-right .number {
    right: 5px;
    bottom: 7px;
  }

  .folder-right .studio {
    position: absolute;
    top: 14px;
    left: 10px;
    font-size: 17px;
    font-weight: 800;
    line-height: .92;
  }

  .folder-right .forbidden {
    position: absolute;
    left: 8px;
    bottom: 10px;
    font-size: 29px;
    font-weight: 800;
    letter-spacing: -2px;
    white-space: nowrap;
  }

  .folder-lower-left {
    left: 113px;
    top: 185px;
    width: 140px;
    height: 92px;
  }

  .folder-lower-left::before {
    width: 55px;
  }

  .folder-lower-left .number {
    right: 4px;
    top: 11px;
  }

  .folder-lower-left .name-cn {
    position: absolute;
    left: 5px;
    top: 12px;
    font-size: 31px;
    font-weight: 800;
    letter-spacing: -2px;
    white-space: nowrap;
  }

  .folder-lower-left .name-en {
    position: absolute;
    left: 6px;
    bottom: 10px;
    font-size: 16px;
    font-weight: 800;
    white-space: nowrap;
  }

  .folder-lower-right {
    left: 301px;
    top: 185px;
    width: 140px;
    height: 92px;
  }

  .folder-lower-right::before {
    width: 55px;
  }

  .folder-lower-right .number {
    right: 5px;
    top: 11px;
  }

  .folder-lower-right .nice {
    position: absolute;
    left: 5px;
    top: 10px;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -2px;
  }

  .folder-lower-right .nice-sub {
    position: absolute;
    left: 6px;
    bottom: 11px;
    font-size: 13px;
    font-weight: 900;
    line-height: .86;
  }

  .folder-lower-right .lab {
    position: absolute;
    right: 4px;
    bottom: 7px;
    font-size: 31px;
    font-weight: 800;
    letter-spacing: -2px;
  }

  .blue-band {
    height: 43px;
    background: #3028ec;
  }

  .main-panel {
    position: relative;
    height: 322px;
    padding-top: 18px;
    background: #83f1f1;
  }

  .headline {
    margin: 0 17px;
    font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-weight: 900;
    white-space: nowrap;
    letter-spacing: -7px;
  }

  .headline.first {
    height: 108px;
    border-bottom: 3px solid #050505;
    font-size: 76px;
    line-height: 95px;
  }

  .headline.second {
    height: 116px;
    border-bottom: 4px solid #050505;
    padding-top: 7px;
    font-size: 68px;
    line-height: 98px;
  }

  .footer {
    position: absolute;
    left: 17px;
    right: 17px;
    bottom: 12px;
    height: 56px;
    display: flex;
    align-items: flex-end;
  }

  .copyright {
    width: 277px;
    padding-bottom: 6px;
    font-size: 19px;
    font-weight: 800;
    line-height: .85;
    letter-spacing: -1.2px;
    white-space: nowrap;
  }

  .site-note {
    position: absolute;
    left: 209px;
    top: 3px;
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
  }

  .triangle-logo {
    position: absolute;
    left: 283px;
    bottom: 8px;
    width: 39px;
    height: 35px;
  }

  .triangle-logo::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 2px;
    width: 27px;
    height: 27px;
    border: 4px solid #111;
    border-radius: 5px;
    transform: rotate(60deg) skew(-5deg);
  }

  .triangle-logo::after {
    content: "△";
    position: absolute;
    left: 12px;
    top: 9px;
    font-size: 18px;
    font-weight: 900;
  }

  .barcode-wrap {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 163px;
    height: 49px;
  }

  .barcode {
    width: 163px;
    height: 35px;
    background:
      repeating-linear-gradient(
        to right,
        #111 0 2px,
        transparent 2px 4px,
        #111 4px 5px,
        transparent 5px 8px,
        #111 8px 11px,
        transparent 11px 13px,
        #111 13px 14px,
        transparent 14px 17px,
        #111 17px 20px,
        transparent 20px 22px
      );
  }

  .barcode-text {
    margin-top: 1px;
    text-align: center;
    font-size: 8px;
    line-height: 10px;
    white-space: nowrap;
  }
</style>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-label="优设">
          <i class="stroke s1"></i>
          <i class="stroke s2"></i>
          <i class="stroke s3"></i>
          <i class="stroke s4"></i>
          <i class="stroke s5"></i>
          <i class="stroke s6"></i>
          <i class="dot"></i>
        </span>
        <span class="share">·(分享)</span>
        <span class="volume">Vol.07</span>
      </div>

      <div class="web-label">
        <span class="web-icon"></span>
        <span class="web-text">Design studio web</span>
      </div>

      <div class="header-rule"></div>
    </header>

    <section class="showcase">
      <article class="folder folder-left">
        <span class="number">1</span>
        <div class="card-copy">
          <div class="abcd">ABCD</div>
          <div class="small-stack">A　BLACK<br>COVER DESIGN</div>
        </div>
      </article>

      <article class="folder folder-center">
        <span class="number">2</span>
        <div class="cn">条件反射</div>
        <div class="en">REFLEX<br>DESIGN</div>
      </article>

      <article class="folder folder-right">
        <span class="number">3</span>
        <div class="studio">STUDIO<br>MA. · EO</div>
        <div class="forbidden">立入禁止</div>
      </article>

      <article class="folder folder-lower-left">
        <span class="number">4</span>
        <div class="name-cn">王志弘</div>
        <div class="name-en">WANG ZHI HONG</div>
      </article>

      <article class="folder folder-lower-right">
        <span class="number">5</span>
        <div class="nice">NICE</div>
        <div class="nice-sub">NICE LAB<br>STUDIO</div>
        <div class="lab">LAB</div>
      </article>
    </section>

    <div class="blue-band"></div>

    <section class="main-panel">
      <h1 class="headline first">国内知名设计</h1>
      <h1 class="headline second">工作室的官网</h1>

      <footer class="footer">
        <div class="copyright">
          Copyright© 2023<br>
          Jidnshare all rights reserved.
        </div>

        <div class="site-note">（官网）</div>
        <div class="triangle-logo" aria-label="[Logo]"></div>

        <div class="barcode-wrap">
          <div class="barcode" aria-label="[Barcode]"></div>
          <div class="barcode-text">CCC　JIDN SHARE ©2023　)))</div>
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
