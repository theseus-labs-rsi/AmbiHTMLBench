<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Sustainability Summit</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d8d8d0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .document {
      position: relative;
      width: min(100vw, 1728px);
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #00762d;
      color: #18271c;
    }

    .left-panel,
    .right-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      overflow: hidden;
    }

    .left-panel {
      left: 0;
      background: #00762d;
    }

    .right-panel {
      right: 0;
      background: #00762d;
    }

    .upper-cream {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 80.9%;
      background: #f5f0df;
      border-bottom-right-radius: 50% 18%;
    }

    .lower-cream {
      position: absolute;
      z-index: 2;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 19.1%;
      background: #f5f0df;
      border-top-right-radius: 50% 100%;
    }

    .summit-title {
      position: absolute;
      z-index: 3;
      left: 22.5%;
      top: 46.7%;
      display: flex;
      align-items: flex-end;
      gap: 2.2%;
      width: 70%;
      height: 8%;
      color: #00762d;
      transform: rotate(-90deg);
      transform-origin: left top;
      white-space: nowrap;
      font-size: clamp(40px, 6.25vw, 108px);
      font-weight: 700;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .summit-title span:nth-child(1) {
      margin-right: 4%;
    }

    .summit-title span:nth-child(2) {
      margin-right: 2%;
    }

    .registration {
      position: absolute;
      z-index: 4;
      top: 52.4%;
      left: 27%;
      width: 47%;
    }

    .registration::before {
      content: "";
      display: block;
      width: 100%;
      height: 2px;
      margin-bottom: 10.5%;
      background: #00762d;
    }

    .section-label {
      margin: 0 0 3%;
      color: #4dce48;
      font-size: clamp(18px, 2.15vw, 38px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .price-label {
      margin: 0;
      color: #1e2b20;
      font-size: clamp(17px, 1.75vw, 31px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .price {
      margin: 1.2% 0 7%;
      color: #00762d;
      font-size: clamp(27px, 3.2vw, 56px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .visit {
      position: absolute;
      z-index: 4;
      left: 27%;
      top: 84.6%;
      width: 55%;
    }

    .visit .section-label {
      margin-bottom: 3%;
    }

    .visit p {
      margin: 0;
      color: #1e2b20;
      font-size: clamp(17px, 1.75vw, 31px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .logo {
      position: absolute;
      z-index: 4;
      top: 6.3%;
      right: 14.5%;
      width: 21%;
      color: #fff;
      text-align: left;
      line-height: 0.77;
    }

    .logo-top {
      display: flex;
      align-items: center;
      gap: 5%;
      font-size: clamp(19px, 2.3vw, 40px);
      font-weight: 300;
      white-space: nowrap;
    }

    .logo-mark {
      position: relative;
      display: inline-block;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 38%;
      background: #fff;
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      background: #00762d;
      border-radius: 50%;
    }

    .logo-mark::before {
      width: 23%;
      height: 23%;
      top: 18%;
      left: 38%;
    }

    .logo-mark::after {
      width: 23%;
      height: 23%;
      right: 18%;
      bottom: 18%;
    }

    .registered {
      align-self: flex-start;
      margin-left: -2%;
      font-size: clamp(7px, 0.9vw, 16px);
      line-height: 1;
    }

    .logo-bottom {
      margin-top: 3%;
      font-size: clamp(25px, 3vw, 52px);
      font-weight: 800;
      line-height: 0.8;
      white-space: nowrap;
    }

    .tree-photo {
      position: absolute;
      z-index: 2;
      top: 14.7%;
      left: 0;
      width: 100%;
      height: 48.7%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 0;
      background:
        radial-gradient(ellipse at 48% 35%, #506d15 0 20%, transparent 21%),
        radial-gradient(ellipse at 68% 37%, #405d12 0 23%, transparent 24%),
        radial-gradient(ellipse at 28% 39%, #587619 0 25%, transparent 26%),
        linear-gradient(#00762d, #00762d);
      color: transparent;
      font-size: 0;
    }

    .tree-photo::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -2%;
      width: 11%;
      height: 69%;
      background: #47321f;
      clip-path: polygon(42% 100%, 60% 100%, 68% 56%, 92% 13%, 76% 8%, 55% 34%, 51% 0, 39% 0, 40% 34%, 16% 10%, 4% 18%, 35% 57%);
    }

    .tree-photo::after {
      content: "";
      position: absolute;
      left: 5%;
      top: 10%;
      width: 95%;
      height: 54%;
      border-radius: 50% 48% 45% 52%;
      background:
        radial-gradient(circle at 13% 60%, #304d10 0 8%, transparent 9%),
        radial-gradient(circle at 29% 30%, #62821b 0 13%, transparent 14%),
        radial-gradient(circle at 47% 23%, #537416 0 15%, transparent 16%),
        radial-gradient(circle at 64% 32%, #4d6e16 0 17%, transparent 18%),
        radial-gradient(circle at 82% 50%, #385b12 0 20%, transparent 21%),
        radial-gradient(ellipse at center, #466514 0 68%, transparent 69%);
      filter: contrast(1.15);
    }

    .details-field {
      position: absolute;
      z-index: 3;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 36.7%;
      background: #4dce48;
    }

    .details-circle {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #00762d;
    }

    .details {
      position: absolute;
      z-index: 4;
      left: 27%;
      top: 73%;
      width: 61%;
      color: #fff;
    }

    .details-group {
      margin-bottom: 9%;
    }

    .details-label {
      margin: 0 0 2.5%;
      color: #4dce48;
      font-size: clamp(18px, 2.15vw, 38px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .details p {
      margin: 0;
      font-size: clamp(17px, 1.75vw, 31px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0;
    }

    @media (max-width: 700px) {
      .registration::before {
        height: 1px;
      }

      .summit-title {
        gap: 1.5%;
      }
    }
  </style>
</head>
<body>
  <main class="document">
    <section class="left-panel">
      <div class="upper-cream"></div>
      <div class="lower-cream"></div>

      <div class="summit-title" aria-label="Global Sustainability Summit">
        <span>Global</span>
        <span>Sustainability</span>
        <span>Summit</span>
      </div>

      <section class="registration">
        <h2 class="section-label">REGISTRATION</h2>
        <p class="price-label">General Admission</p>
        <p class="price">$350</p>
        <p class="price-label">Students &amp; Nonprofits</p>
        <p class="price">$200</p>
      </section>

      <section class="visit">
        <h2 class="section-label">VISIT</h2>
        <p>www.yourwebsite.com for more<br>details and to register today!</p>
      </section>
    </section>

    <section class="right-panel">
      <div class="logo" aria-label="Your LOGO">
        <div class="logo-top">
          <span>Your</span>
          <span class="logo-mark"></span>
          <span class="registered">®</span>
        </div>
        <div class="logo-bottom">LOGO</div>
      </div>

      <figure class="placeholder tree-photo" aria-label="Photo: large tree centered on green background">
        [Photo: large tree centered]
      </figure>

      <div class="details-field">
        <div class="details-circle"></div>
      </div>

      <section class="details">
        <div class="details-group">
          <h2 class="details-label">DATE</h2>
          <p>27 January 2026<br>10:00 PM</p>
        </div>

        <div class="details-group">
          <h2 class="details-label">LOCATION</h2>
          <p>Grand Hall, Convention<br>Center, Chicago, IL</p>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
