<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句合集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
    }

    .topbar {
      height: 96px;
      padding: 29px 14px 0 15px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #cdb51f;
    }

    .top-left,
    .top-right {
      display: flex;
      align-items: center;
    }

    .back {
      width: 17px;
      height: 17px;
      margin: 11px 15px 0 2px;
      border-left: 4px solid #cdb51f;
      border-bottom: 4px solid #cdb51f;
      transform: rotate(45deg);
    }

    .page-title {
      font-size: 25px;
      line-height: 40px;
      font-weight: 400;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .top-right {
      gap: 31px;
      padding-top: 3px;
    }

    .people-icon {
      position: relative;
      width: 39px;
      height: 39px;
    }

    .people-icon .head {
      position: absolute;
      top: 2px;
      right: 5px;
      width: 13px;
      height: 13px;
      border: 3px solid #d0b817;
      border-radius: 50%;
    }

    .people-icon .body {
      position: absolute;
      top: 16px;
      right: 1px;
      width: 25px;
      height: 18px;
      border: 3px solid #d0b817;
      border-bottom: 0;
      border-radius: 15px 15px 0 0;
      transform: rotate(-5deg);
    }

    .people-icon .small-head {
      position: absolute;
      top: 15px;
      left: 2px;
      width: 11px;
      height: 11px;
      border: 3px solid #d0b817;
      border-radius: 50%;
    }

    .people-icon .small-body {
      position: absolute;
      left: 0;
      bottom: 2px;
      width: 19px;
      height: 13px;
      border: 3px solid #d0b817;
      border-radius: 12px;
      background: #ffffff;
      transform: rotate(-42deg);
    }

    .share-icon {
      position: relative;
      width: 34px;
      height: 38px;
      margin-top: 1px;
    }

    .share-box {
      position: absolute;
      left: 4px;
      bottom: 0;
      width: 25px;
      height: 26px;
      border: 2.5px solid #d0b817;
      border-radius: 3px;
      background: #ffffff;
    }

    .share-arrow {
      position: absolute;
      left: 15px;
      top: 0;
      width: 3px;
      height: 22px;
      background: #d0b817;
      z-index: 2;
    }

    .share-arrow::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 0;
      width: 10px;
      height: 10px;
      border-left: 3px solid #d0b817;
      border-top: 3px solid #d0b817;
      transform: rotate(45deg);
    }

    .more-icon {
      width: 31px;
      height: 31px;
      margin-top: 1px;
      border: 2.5px solid #d0b817;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .more-icon span {
      width: 3px;
      height: 3px;
      background: #d0b817;
      border-radius: 50%;
    }

    main {
      padding: 7px 35px 30px 36px;
    }

    .quote-section {
      width: 100%;
    }

    .section-heading {
      display: flex;
      align-items: center;
      min-height: 42px;
    }

    .check {
      flex: 0 0 auto;
      width: 33px;
      height: 33px;
      margin-right: 18px;
      border-radius: 50%;
      background: #f4bd18;
      color: #ffffff;
      font-size: 22px;
      line-height: 33px;
      text-align: center;
      font-weight: 400;
    }

    .heading-text {
      font-size: 24px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .quote {
      margin: 35px 0 0 0;
      font-size: 24px;
      line-height: 1.47;
      font-weight: 400;
      letter-spacing: 0.15px;
      text-align: left;
    }

    .quote-section + .quote-section {
      margin-top: 77px;
    }

    .quote-section + .quote-section .quote {
      margin-top: 34px;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
      }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="top-left">
        <div class="back" aria-hidden="true"></div>
        <div class="page-title">金句合集</div>
      </div>

      <div class="top-right" aria-hidden="true">
        <div class="people-icon">
          <span class="head"></span>
          <span class="body"></span>
          <span class="small-head"></span>
          <span class="small-body"></span>
        </div>

        <div class="share-icon">
          <span class="share-box"></span>
          <span class="share-arrow"></span>
        </div>

        <div class="more-icon">
          <span></span><span></span><span></span>
        </div>
      </div>
    </header>

    <main>
      <section class="quote-section">
        <div class="section-heading">
          <span class="check">✓</span>
          <div class="heading-text">他写「成长」，正是你所亲历</div>
        </div>

        <p class="quote">“我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”<br>——《病隙碎笔》</p>
      </section>

      <section class="quote-section">
        <div class="section-heading">
          <span class="check">✓</span>
          <div class="heading-text">他写「磨难」，报之以歌</div>
        </div>

        <p class="quote">“大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》</p>
      </section>
    </main>
  </div>
</body>
</html>
