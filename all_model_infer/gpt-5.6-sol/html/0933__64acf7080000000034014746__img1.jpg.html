<!DOCTYPE html>

  <script>
    window.MathJax = {

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ecece8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      position: relative;
      width: 540px;
      height: 722px;
      overflow: hidden;
      background-color: #fbfdf9;
      background-image:
        linear-gradient(rgba(92, 177, 186, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 177, 186, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(92, 177, 186, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 177, 186, 0.08) 1px, transparent 1px);
      background-size:
        15px 15px,
        15px 15px,
        5px 5px,
        5px 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.18);
      font-family: "KaiTi", "STKaiti", "Kaiti SC", "Microsoft YaHei", sans-serif;
    }

    .dot-rail {
      position: absolute;
      inset: 0 auto 0 0;
      width: 40px;
      z-index: 1;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      left: 15px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(113, 149, 167, 0.62);
      box-shadow: 0 0 1px rgba(72, 111, 131, 0.25);
    }

    .title {
      position: absolute;
      z-index: 2;
      top: 1px;
      left: 30px;
      margin: 0;
      color: #27156f;
      font-size: 29px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: 5px;
      white-space: nowrap;
      text-shadow: 0.3px 0.3px 0 #27156f;
    }

    .main-copy {
      position: absolute;
      z-index: 2;
      top: 53px;
      left: 38px;
      color: #ed5656;
      font-size: 27px;
      line-height: 42px;
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-shadow: 0.25px 0.25px 0 #ed5656;
    }

    .main-copy .line {
      height: 42px;
    }

    .main-copy .indent {
      padding-left: 3px;
    }

    .sticky-note {
      position: absolute;
      z-index: 5;
      top: 50px;
      left: 379px;
      width: 145px;
      height: 151px;
      padding: 8px 10px 11px 12px;
      color: #0e0e0d;
      background:
        linear-gradient(138deg, transparent 0 91%, #d8c98c 91% 100%),
        linear-gradient(135deg, #fff9c5 0%, #fff3a7 72%, #f5e79d 100%);
      border: 1px solid #c7bb89;
      box-shadow: 3px 4px 5px rgba(65, 54, 31, 0.28);
      transform: rotate(0.8deg);
      transform-origin: center center;
      font-size: 22px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .sticky-note::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 31px;
      height: 31px;
      background: linear-gradient(135deg, rgba(216, 201, 140, 0) 48%, #f9efbb 49% 70%, #c9b985 71%);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
      filter: drop-shadow(-1px -1px 1px rgba(90, 76, 43, 0.14));
    }

    .data-table {
      position: absolute;
      z-index: 3;
      top: 467px;
      left: 42px;
      width: 482px;
      height: 209px;
      border-collapse: collapse;
      table-layout: fixed;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #91b64e;
      box-shadow: 1px 1px 2px rgba(83, 116, 39, 0.18);
      font-family: "KaiTi", "STKaiti", "Kaiti SC", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      color: #292929;
    }

    .data-table col:first-child {
      width: 95px;
    }

    .data-table col:not(:first-child) {
      width: 96px;
    }

    .data-table th,
    .data-table td {
      height: 29px;
      padding: 1px 4px;
      border: 1px solid rgba(126, 159, 60, 0.5);
      text-align: center;
      vertical-align: middle;
      font-weight: 400;
    }

    .data-table thead th {
      height: 30px;
      padding-top: 2px;
      color: #f7fae8;
      background: #8bb449;
      border-color: rgba(236, 246, 205, 0.55);
      font-size: 18px;
    }

    .data-table tbody tr:nth-child(odd) td {
      background: rgba(214, 226, 173, 0.78);
    }

    .data-table tbody tr:nth-child(even) td {
      background: rgba(251, 252, 239, 0.86);
    }
  </style>
</head>
