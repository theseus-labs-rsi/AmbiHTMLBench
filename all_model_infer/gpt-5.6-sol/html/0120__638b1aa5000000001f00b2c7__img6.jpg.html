<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>句式练习与阅读训练</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #a98bc8;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      color: #111;
    }

    .page {
      position: relative;
      width: 500px;
      min-height: 669px;
      margin: 23px auto 29px;
      padding: 100px 22px 62px;
      overflow: hidden;
      background: #fff;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    h1,
    h2 {
      margin: 0;
      color: #4d126d;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    h1 {
      margin-left: 8px;
      margin-bottom: 14px;
      font-size: 29px;
      line-height: 1.25;
    }

    h2 {
      margin-left: 3px;
      margin-bottom: 12px;
      font-size: 29px;
      line-height: 1.2;
    }

    .section {
      margin-bottom: 15px;
    }

    .section p {
      margin: 0;
      font-size: 20px;
      line-height: 1.33;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .reading {
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .training {
      margin-top: 4px;
    }

    .training h2 {
      margin-bottom: 12px;
    }

    .training ol {
      margin: 0;
      padding-left: 31px;
      font-size: 20px;
      line-height: 1.32;
    }

    .training li {
      padding-left: 0;
      margin: 0;
    }

    .placeholder {
      position: absolute;
      pointer-events: none;
      color: transparent;
      font-size: 1px;
      line-height: 1;
    }

    .top-decoration {
      top: -7px;
      left: -7px;
      width: 126px;
      height: 115px;
      z-index: 3;
      transform: rotate(-6deg);
      background:
        linear-gradient(145deg, transparent 0 19%, #eadbb4 20% 36%, transparent 37%) 16px 5px / 63px 74px no-repeat,
        linear-gradient(35deg, transparent 0 24%, #e8d4aa 25% 43%, transparent 44%) 22px 8px / 72px 73px no-repeat,
        linear-gradient(160deg, transparent 0 31%, #f3e4bd 32% 48%, transparent 49%) 34px 0 / 63px 76px no-repeat,
        linear-gradient(55deg, transparent 0 29%, #e8d4a5 30% 45%, transparent 46%) 4px 13px / 78px 75px no-repeat;
    }

    .top-decoration::after {
      content: "AGiC Jmmy";
      position: absolute;
      top: 35px;
      left: 27px;
      width: 66px;
      height: 76px;
      padding-top: 30px;
      color: #fff;
      text-align: center;
      font-size: 12px;
      font-family: Georgia, serif;
      letter-spacing: 1px;
      border: 2px solid #5b348d;
      border-radius: 2px;
      background:
        radial-gradient(ellipse at 50% 47%, #fff 0 13%, transparent 14%),
        radial-gradient(ellipse at 50% 54%, #fff 0 8%, transparent 9%),
        #51317e;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
      transform: rotate(-12deg);
    }

    .top-decoration::before {
      content: "★";
      position: absolute;
      left: 1px;
      top: 54px;
      color: #f6b83e;
      font-size: 22px;
      text-shadow: 0 0 0 #78457e;
      transform: rotate(10deg);
    }

    .watermark {
      top: 386px;
      right: 47px;
      width: 132px;
      height: 45px;
      opacity: .2;
      background:
        radial-gradient(ellipse at 18% 38%, #fff 0 10%, transparent 11%),
        radial-gradient(ellipse at 27% 61%, #fff 0 8%, transparent 9%),
        linear-gradient(165deg, transparent 0 38%, #fff 39% 43%, transparent 44%) 15px 6px / 29px 30px no-repeat;
    }

    .bottom-decoration {
      right: -6px;
      bottom: -7px;
      width: 112px;
      height: 105px;
      z-index: 1;
      background:
        radial-gradient(ellipse at 76% 73%, #f7a7bd 0 25%, transparent 26%),
        radial-gradient(ellipse at 55% 87%, #f5a0bb 0 28%, transparent 29%),
        radial-gradient(ellipse at 88% 96%, #f6b2c7 0 28%, transparent 29%);
    }

    .bottom-decoration::before {
      content: "";
      position: absolute;
      left: 30px;
      top: 7px;
      width: 30px;
      height: 42px;
      border: 1px solid #bd5d83;
      border-radius: 50%;
      background: #ffd7e2;
      transform: rotate(-27deg);
      box-shadow:
        26px 10px 0 -7px #fff,
        26px 10px 0 -6px #d884a0;
    }

    .bottom-decoration::after {
      content: "••";
      position: absolute;
      left: 66px;
      top: 31px;
      color: #ad557e;
      font-size: 17px;
      letter-spacing: 5px;
      transform: rotate(19deg);
    }

    @media (max-width: 540px) {
      .page {
        width: calc(100vw - 40px);
        margin-left: 20px;
        margin-right: 20px;
        padding-left: 22px;
        padding-right: 18px;
      }

      .section p,
      .training ol {
        font-size: clamp(14px, 3.7vw, 20px);
      }

      h1,
      h2 {
        font-size: clamp(21px, 5.4vw, 29px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder top-decoration">[图案：左上]</div>
    <div class="placeholder watermark">[水印：中右]</div>
    <div class="placeholder bottom-decoration">[图案：右下]</div>

    <div class="content">
      <section class="section">
        <h1>四，句式练习</h1>
        <p>仿写、修改病句、把字句被字句、反问句变陈述句、</p>
        <p>陈述句变感叹句、缩句扩句等等</p>
      </section>

      <section class="section reading">
        <h2>五，阅读理解</h2>
        <p>课内阅读理解：主要复习课文笔记、中心思想以及</p>
        <p>课后习题。</p>
        <p>课外阅读理解：主要是要掌握好答题技巧。</p>
      </section>

      <section class="section training">
        <h2>六，阅读训练</h2>
        <ol>
          <li>圈出题目里面的关键词。</li>
          <li>记住答案的宗旨就是答案都在原文里。</li>
          <li>掌握表达方式，修辞手法的运用，解释词语，<br>找近反义词。</li>
          <li>概括主要内容就是，时间，地点，人物，事情。</li>
          <li>答题技巧，人物评价围绕品质，景物围绕热爱<br>之情来答。</li>
        </ol>
      </section>
    </div>
  </main>
</body>
</html>
