<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唐诗六首</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 23px 24px 31px;
      background: #f5ce8b;
      color: #111;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif CJK SC", serif;
    }

    .page {
      width: 492px;
      height: 678px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 238px 232px 208px;
      overflow: hidden;
      border: 1px solid #ead0ab;
      background-color: #fffefb;
      background-image:
        linear-gradient(rgba(109, 151, 170, 0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(109, 151, 170, 0.13) 1px, transparent 1px);
      background-size: 20px 20px;
      box-shadow: 0 1px 2px rgba(113, 73, 32, 0.14);
    }

    .poem {
      position: relative;
      min-width: 0;
      padding: 10px 18px 7px 25px;
    }

    .poem:nth-child(odd) {
      border-right: 6px solid rgba(229, 169, 130, 0.7);
    }

    .poem:nth-child(-n+4) {
      border-bottom: 6px solid rgba(229, 169, 130, 0.7);
    }

    h2 {
      margin: 0;
      white-space: nowrap;
      text-align: center;
      font-size: 31px;
      line-height: 1.32;
      font-weight: 700;
      letter-spacing: 0;
    }

    .author {
      margin: 0 0 10px;
      text-align: right;
      font-size: 20px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .lines {
      margin: 0;
      padding-left: 20px;
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .middle {
      padding-top: 8px;
    }

    .middle .author {
      margin-bottom: 13px;
    }

    .bottom {
      padding-top: 5px;
    }

    .bottom .author {
      margin-bottom: 6px;
    }

    .bottom .lines {
      line-height: 1.18;
    }

    @media (max-width: 539px) {
      body {
        padding: 4.26vw 4.44vw 5.74vw;
      }

      .page {
        width: 91.12vw;
        height: 125.56vw;
        grid-template-rows: 44.08vw 42.97vw 38.51vw;
      }

      .poem {
        padding: 1.85vw 3.33vw 1.3vw 4.63vw;
      }

      .poem:nth-child(odd) {
        border-right-width: 1.11vw;
      }

      .poem:nth-child(-n+4) {
        border-bottom-width: 1.11vw;
      }

      h2 {
        font-size: 5.74vw;
      }

      .author {
        margin-bottom: 1.85vw;
        font-size: 3.7vw;
      }

      .lines {
        padding-left: 3.7vw;
        font-size: 5vw;
      }

      .middle {
        padding-top: 1.48vw;
      }

      .middle .author {
        margin-bottom: 2.41vw;
      }

      .bottom {
        padding-top: 0.93vw;
      }

      .bottom .author {
        margin-bottom: 1.11vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="poem">
      <h2>《登鹳雀楼》</h2>
      <p class="author">（唐-王之涣）</p>
      <p class="lines">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</p>
    </section>

    <section class="poem">
      <h2>《静夜思》</h2>
      <p class="author">（唐-李白）</p>
      <p class="lines">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</p>
    </section>

    <section class="poem middle">
      <h2>《古朗月行》</h2>
      <p class="author">（唐-李白）</p>
      <p class="lines">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</p>
    </section>

    <section class="poem middle">
      <h2>《寻隐者不遇》</h2>
      <p class="author">（唐-贾岛）</p>
      <p class="lines">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</p>
    </section>

    <section class="poem bottom">
      <h2>《咏鹅》</h2>
      <p class="author">（唐-骆宾王）</p>
      <p class="lines">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</p>
    </section>

    <section class="poem bottom">
      <h2>《草》</h2>
      <p class="author">（唐-白居易）</p>
      <p class="lines">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</p>
    </section>
  </main>
</body>
</html>
