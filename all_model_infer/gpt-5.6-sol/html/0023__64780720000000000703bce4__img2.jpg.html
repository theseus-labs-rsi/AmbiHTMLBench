<body>
  <main class="page">
    <header class="section-title title-one">《达摩流浪者》</header>

      <div class="cn-cover-title">达摩流浪者</div>
      <div class="en-cover-title">DHARMA<br>BUMS</div>

      <div class="wire"></div>
      <div class="pole"></div>
      <div class="figure-hair"></div>
      <div class="figure-head"></div>
      <div class="figure-body"></div>
      <div class="figure-board"></div>
      <div class="ground"></div>
    </figure>

    <section class="description description-one">
      <p class="rating">评分：8.5</p>
      <p>永远年轻，永远热泪盈眶</p>
      <p>相信每个理想主义的nfper，每个</p>
      <p>在庸碌生活中迷茫的人，每个还</p>
      <p>没被社会总开关控制的人，都会</p>
      <p>被书中纯净又赤诚的灵魂打动。</p>
    </section>

    <header class="section-title title-two">《深时之旅》</header>

    <figure class="book-cover placeholder cover-two">
      <figcaption class="ph-caption">[Book cover: left]</figcaption>
      <div class="underland">UNDERLAND</div>
      <div class="deep-time">A Deep Time<br>Journey</div>
      <div class="cover-author">Robert Macfarlane</div>
      <div class="large-char char-zhi">之</div>
      <div class="large-char char-lv">旅</div>
      <div class="large-char char-shen">深</div>
      <div class="large-char char-shi">时</div>
    </figure>

    <section class="description description-two">
      <p class="rating">评分：8.7</p>
      <p>地下，有另外一个世界！</p>
      <p>作者以充满灵性的语言，描绘了地</p>
      <p>下世界一个又一个奇妙的科学现</p>
      <p>象，神秘的传说和感人的故事。</p>
      <p>天呐！惊叹，将是你的主旋律</p>
    </section>

    <footer class="footer">分 享 好 书 的 <span class="latin">Grit</span></footer>
  </main>
