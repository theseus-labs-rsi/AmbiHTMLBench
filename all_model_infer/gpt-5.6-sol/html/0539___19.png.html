<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Into the Darkness</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      container-type: inline-size;
      position: relative;
      width: min(100vw, 794px);
      aspect-ratio: 794 / 1124;
      overflow: hidden;
      background: #000;
    }

    .presenter {
      position: absolute;
      z-index: 5;
      top: 6.55%;
      left: 0;
      width: 100%;
      margin: 0;
      color: #f4f4f4;
      text-align: center;
      font-size: 2.55cqw;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.72em;
      padding-left: 0.72em;
      white-space: nowrap;
    }

    .title {
      position: absolute;
      z-index: 5;
      top: 12.45%;
      left: 11.2%;
      width: 77.6%;
      color: #c5353d;
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      font-size: 12.55cqw;
      font-weight: 700;
      line-height: 0.965;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .title div {
      white-space: nowrap;
    }

    .title .second-line {
      margin-top: 1.1cqw;
      font-size: 0.99em;
    }

    .placeholder.garage-photo {
      position: absolute;
      z-index: 1;
      top: 31.15%;
      left: 0;
      width: 100%;
      height: 60.2%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 48% 81%, rgba(73, 73, 73, 0.46) 0%, rgba(25, 25, 25, 0.58) 38%, rgba(0, 0, 0, 0.95) 78%),
        linear-gradient(to bottom, #000 0%, #020202 31%, #282828 44%, #171717 72%, #000 100%);
      filter: grayscale(1) contrast(1.24);
    }

    .placeholder-caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .upper-light {
      position: absolute;
      height: 2.4%;
      background: #f5f5f5;
      box-shadow: 0 0 2px #fff;
      transform: skewX(-25deg) rotate(-3deg);
    }

    .upper-light.one {
      top: 4.2%;
      left: 17.4%;
      width: 4.6%;
      height: 9.6%;
      transform: rotate(-18deg) skewY(7deg);
    }

    .upper-light.two {
      top: 4.2%;
      left: 61.8%;
      width: 5.1%;
      height: 9.8%;
      transform: rotate(27deg) skewY(-4deg);
    }

    .upper-light.three {
      top: 19.2%;
      left: -1.5%;
      width: 7%;
      height: 1.6%;
      transform: rotate(8deg);
    }

    .upper-light.four {
      top: 17.9%;
      right: -1.2%;
      width: 4.5%;
      height: 2%;
      transform: rotate(-8deg);
    }

    .ceiling-edge {
      position: absolute;
      top: 17.2%;
      right: 5.6%;
      width: 45%;
      height: 4.2%;
      background:
        repeating-linear-gradient(
          166deg,
          #e8e8e8 0,
          #e8e8e8 2px,
          #444 3px,
          #444 6px
        );
      clip-path: polygon(10% 14%, 100% 0, 91% 50%, 0 100%);
      opacity: 0.9;
    }

    .beam {
      position: absolute;
      top: 25.2%;
      left: 0;
      width: 100%;
      height: 15.4%;
      background: linear-gradient(to bottom, #050505 0%, #0b0b0b 75%, #171717 100%);
      border-bottom: 1px solid #383838;
      box-shadow: 0 3px 8px #000;
    }

    .clearance-sign {
      position: absolute;
      z-index: 4;
      top: 27.1%;
      left: 50.5%;
      width: 35.2%;
      height: 4.2%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #090909;
      background: #f2f2f2;
      border: 1px solid #a6a6a6;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 2.25cqw;
      font-stretch: condensed;
      letter-spacing: 0.045em;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(0.5deg);
    }

    .slatted-ceiling {
      position: absolute;
      top: 40.2%;
      left: 4%;
      width: 96%;
      height: 14.6%;
      background:
        repeating-linear-gradient(
          96deg,
          #0e0e0e 0,
          #0e0e0e 6px,
          #353535 7px,
          #0a0a0a 10px
        );
      clip-path: polygon(0 0, 100% 3%, 100% 50%, 40% 100%, 18% 82%);
    }

    .strip-light {
      position: absolute;
      z-index: 2;
      height: 1.3%;
      background: #fff;
      box-shadow: 0 0 2px #fff;
    }

    .strip-light.l1 {
      top: 45.2%;
      left: 9%;
      width: 10%;
      transform: rotate(31deg);
    }

    .strip-light.l2 {
      top: 47.1%;
      left: 26%;
      width: 10%;
      transform: rotate(74deg);
    }

    .strip-light.l3 {
      top: 45.1%;
      left: 44%;
      width: 11%;
      transform: rotate(-58deg);
    }

    .strip-light.l4 {
      top: 44.1%;
      left: 61%;
      width: 9%;
      transform: rotate(-34deg);
    }

    .strip-light.l5 {
      top: 43.7%;
      left: 77%;
      width: 12%;
      transform: rotate(-21deg);
    }

    .left-wall {
      position: absolute;
      top: 41%;
      left: 0;
      width: 28.8%;
      height: 42%;
      background:
        linear-gradient(90deg, #252525 0 9%, #a4a4a4 9% 13%, #3c3c3c 13% 18%, #999 18% 22%, #242424 22% 33%, #777 33% 39%, #151515 39% 100%);
      clip-path: polygon(0 0, 100% 14%, 100% 76%, 0 100%);
      opacity: 0.75;
    }

    .right-wall {
      position: absolute;
      top: 47%;
      right: 0;
      width: 35%;
      height: 34%;
      background:
        repeating-linear-gradient(
          4deg,
          #161616 0,
          #161616 2px,
          #303030 3px,
          #171717 5px
        );
      clip-path: polygon(0 0, 100% 5%, 100% 100%, 19% 80%);
      border-left: 9px solid #858585;
      opacity: 0.78;
    }

    .far-floor {
      position: absolute;
      top: 53%;
      left: 20%;
      width: 51%;
      height: 14%;
      background: linear-gradient(to bottom, #a7a7a7, #666);
      clip-path: polygon(15% 0, 100% 0, 88% 100%, 0 100%);
      opacity: 0.78;
    }

    .car {
      position: absolute;
      z-index: 3;
      top: 51.9%;
      left: 28.8%;
      width: 10.4%;
      height: 10.3%;
      background: linear-gradient(to bottom, #dadada 0 19%, #777 21%, #0b0b0b 53%, #050505 100%);
      clip-path: polygon(20% 0, 77% 0, 94% 31%, 100% 88%, 88% 100%, 8% 100%, 0 86%, 6% 29%);
      border-radius: 20% 20% 8% 8%;
      box-shadow: 0 2px 4px #000;
    }

    .car::before {
      content: "";
      position: absolute;
      top: 21%;
      left: 18%;
      width: 65%;
      height: 23%;
      background: #222;
      clip-path: polygon(12% 0, 86% 0, 100% 100%, 0 100%);
    }

    .car::after {
      content: "";
      position: absolute;
      bottom: 22%;
      left: 43%;
      width: 18%;
      height: 12%;
      border: 1px solid #aaa;
      background: #111;
    }

    .cone {
      position: absolute;
      z-index: 3;
      top: 60.8%;
      left: 23.7%;
      width: 1.8%;
      height: 5.6%;
      background: #050505;
      clip-path: polygon(43% 0, 60% 0, 100% 86%, 79% 100%, 11% 100%, 0 87%);
    }

    .road {
      position: absolute;
      top: 63%;
      left: 0;
      width: 100%;
      height: 39%;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(88, 88, 88, 0.72) 0%, rgba(48, 48, 48, 0.7) 34%, rgba(9, 9, 9, 0.98) 88%),
        #161616;
      clip-path: polygon(25% 0, 70% 0, 100% 39%, 100% 100%, 0 100%, 0 45%);
    }

    .road-line {
      position: absolute;
      z-index: 2;
      top: 79.5%;
      right: -5%;
      width: 51%;
      height: 0.8%;
      background: #a0a0a0;
      transform: rotate(21deg);
      transform-origin: right center;
      opacity: 0.72;
    }

    .direction-arrow {
      position: absolute;
      z-index: 2;
      top: 67%;
      left: 37.2%;
      width: 13%;
      height: 5%;
      background: #aaa;
      clip-path: polygon(0 29%, 48% 29%, 48% 0, 100% 50%, 48% 100%, 48% 70%, 0 70%, 18% 50%);
      transform: rotate(3deg);
      opacity: 0.8;
    }

    .foreground-rail {
      position: absolute;
      z-index: 3;
      left: -2%;
      bottom: 4%;
      width: 30%;
      height: 29%;
      border-top: 7px solid #080808;
      border-right: 12px solid #090909;
      transform: skewY(-18deg);
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 16px,
          #080808 17px,
          #080808 22px
        );
      opacity: 0.95;
    }

    .photo-fade {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, #000 0%, transparent 9%, transparent 71%, rgba(0, 0, 0, 0.32) 82%, #000 100%),
        linear-gradient(to right, rgba(0, 0, 0, 0.45), transparent 20%, transparent 76%, rgba(0, 0, 0, 0.25));
    }

    .event-details {
      position: absolute;
      z-index: 6;
      top: 83.55%;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .director {
      margin: 0 0 2.55cqw;
      color: #c5353d;
      font-size: 2.85cqw;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.105em;
    }

    .event-lines {
      margin: 0;
      color: #f4f4f4;
      font-size: 2.68cqw;
      font-weight: 600;
      line-height: 1.47;
      letter-spacing: 0.105em;
    }

    @media (max-width: 420px) {
      .clearance-sign {
        border-width: 0.5px;
      }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page" aria-label="Into the Darkness film poster">
    <p class="presenter">SOULFUL FILM PRESENTS</p>

    <div class="title" aria-label="INTO THE DARKNESS">
      <div>INTO THE</div>
      <div class="second-line">DARKNESS</div>
    </div>

    <figure class="placeholder garage-photo" aria-label="Black-and-white photograph of a parking garage entrance">
      <figcaption class="placeholder-caption">[Photo: black-and-white parking garage entrance]</figcaption>

      <div class="upper-light one"></div>
      <div class="upper-light two"></div>
      <div class="upper-light three"></div>
      <div class="upper-light four"></div>
      <div class="ceiling-edge"></div>

      <div class="beam"></div>
      <div class="clearance-sign">SELF PARK 6′-0″ CLEARANCE</div>

      <div class="slatted-ceiling"></div>
      <div class="strip-light l1"></div>
      <div class="strip-light l2"></div>
      <div class="strip-light l3"></div>
      <div class="strip-light l4"></div>
      <div class="strip-light l5"></div>

      <div class="left-wall"></div>
      <div class="right-wall"></div>
      <div class="far-floor"></div>
      <div class="car"></div>
      <div class="cone"></div>

      <div class="road"></div>
      <div class="direction-arrow"></div>
      <div class="road-line"></div>
      <div class="foreground-rail"></div>
      <div class="photo-fade"></div>
    </figure>

    <section class="event-details" aria-label="Event information">
      <p class="director">Directed by Levi Stanford</p>
      <p class="event-lines">
        May 23, 2019 | 2:00 pm<br>
        Michael Hopper Auditorium<br>
        Oreixs university, OH
      </p>
    </section>
  </main>
</body>
</html>
