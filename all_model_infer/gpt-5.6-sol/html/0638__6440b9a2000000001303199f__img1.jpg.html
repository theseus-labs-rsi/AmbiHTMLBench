<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #e8e4d8;
}

body {
  color: #8a897d;
  font-family: "SimSun", "Songti SC", serif;
}

.page {
  position: relative;
  width: 540px;
  height: 769px;
  margin: 0 auto;
  overflow: hidden;
  background-color: #f7f6ed;
  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(132, 131, 115, 0.018) 0,
      rgba(132, 131, 115, 0.018) 1px,
      transparent 1px,
      transparent 4px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(132, 131, 115, 0.012) 0,
      rgba(132, 131, 115, 0.012) 1px,
      transparent 1px,
      transparent 5px
    ),
    radial-gradient(
      ellipse at center,
      rgba(255, 255, 255, 0.55) 0%,
      rgba(244, 243, 232, 0.7) 76%,
      rgba(227, 223, 207, 0.75) 100%
    );
  box-shadow: 0 0 7px rgba(75, 70, 52, 0.24);
}

.top-nav {
  display: grid;
  grid-template-columns: 61px 59px 59px 59px 59px 59px 78px 52px 54px;
  width: 540px;
  height: 25px;
  border-bottom: 1px solid rgba(127, 120, 95, 0.42);
  background: linear-gradient(
    to bottom,
    rgba(196, 184, 151, 0.88),
    rgba(211, 201, 173, 0.84)
  );
  color: rgba(92, 86, 66, 0.7);
  font-family: "SimSun", serif;
  font-size: 10px;
  line-height: 24px;
  text-align: center;
}

.nav-item {
  height: 25px;
  white-space: nowrap;
}

.nav-item.active {
  border-left: 1px solid rgba(117, 108, 83, 0.38);
  border-right: 1px solid rgba(117, 108, 83, 0.38);
  background: rgba(180, 163, 124, 0.34);
  color: rgba(80, 74, 56, 0.78);
}

.heading {
  height: 40px;
  padding: 12px 0 0 9px;
  color: rgba(92, 91, 77, 0.9);
  font-size: 15px;
  letter-spacing: 5px;
}

.heading .dot {
  display: inline-block;
  margin-right: 5px;
  font-size: 11px;
  vertical-align: 2px;
}

.sheet {
  position: relative;
  width: 526px;
  height: 687px;
  margin: 0 7px;
  border: 1px solid rgba(131, 132, 116, 0.35);
  color: rgba(120, 120, 105, 0.81);
  font-size: 10px;
}

.line-row {
  height: 30px;
  padding-left: 21px;
  border-bottom: 1px solid rgba(131, 132, 116, 0.31);
  line-height: 30px;
}

.line-row.first {
  height: 31px;
  line-height: 31px;
}

.analysis-options {
  height: 110px;
  padding: 7px 0 0 7px;
  border-bottom: 1px solid rgba(131, 132, 116, 0.34);
}

.option {
  display: flex;
  align-items: center;
  height: 24px;
  color: rgba(116, 116, 103, 0.76);
}

.radio {
  width: 11px;
  height: 11px;
  margin-right: 8px;
  border: 1px solid rgba(136, 137, 122, 0.34);
  border-radius: 50%;
}

.analysis-head {
  display: grid;
  grid-template-columns: 148px 148px 228px;
  height: 31px;
  border-bottom: 1px solid rgba(131, 132, 116, 0.34);
}

.analysis-title {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 31px;
  letter-spacing: 1px;
}

.analysis-title:nth-child(2) {
  border-right: 1px solid rgba(131, 132, 116, 0.34);
}

.analysis-title .radio {
  margin-right: 7px;
}

.analysis-body {
  display: grid;
  grid-template-columns: 296px 228px;
  height: 192px;
  border-bottom: 1px solid rgba(131, 132, 116, 0.34);
}

.analysis-left {
  border-right: 1px solid rgba(131, 132, 116, 0.34);
}

.transfer-row {
  display: grid;
  grid-template-columns: 60px 464px;
  height: 90px;
  border-bottom: 1px solid rgba(131, 132, 116, 0.34);
}

.transfer-row.method {
  height: 82px;
}

.transfer-label {
  display: flex;
  align-items: center;
  padding-left: 8px;
  border-right: 1px solid rgba(131, 132, 116, 0.34);
  letter-spacing: 2px;
}

.notes {
  height: 29px;
  padding: 8px 0 0 17px;
  letter-spacing: 2px;
}

.watermark {
  position: absolute;
  right: 7px;
  bottom: 3px;
  color: rgba(255, 255, 255, 0.78);
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: -1px;
  text-shadow:
    0 1px 2px rgba(119, 118, 106, 0.3),
    1px 0 0 rgba(255, 255, 255, 0.4);
}
</style>
</head>
<body>
<div class="page">
  <nav class="top-nav">
    <div class="nav-item">行测　&gt;</div>
    <div class="nav-item">常识</div>
    <div class="nav-item">言语</div>
    <div class="nav-item">数量</div>
    <div class="nav-item">判断</div>
    <div class="nav-item">资料</div>
    <div class="nav-item active">申论</div>
    <div class="nav-item">政策</div>
    <div class="nav-item">计划</div>
  </nav>

  <header class="heading"><span class="dot">·</span>晨读笔记</header>

  <main class="sheet">
    <div class="line-row first">主题</div>
    <div class="line-row">应用领域</div>
    <div class="line-row">热门事件</div>
    <div class="line-row">宏观政策</div>
    <div class="line-row">媒体评论</div>

    <section class="analysis-options">
      <div class="option"><span class="radio"></span><span>意义</span></div>
      <div class="option"><span class="radio"></span><span>原因</span></div>
      <div class="option"><span class="radio"></span><span>问题</span></div>
      <div class="option"><span class="radio"></span><span>危害</span></div>
    </section>

    <section class="analysis-head">
      <div class="analysis-title"><span class="radio"></span><span>问题分析</span></div>
      <div class="analysis-title"><span class="radio"></span><span>原因分析</span></div>
      <div class="analysis-title"><span>对策分析</span></div>
    </section>

    <section class="analysis-body">
      <div class="analysis-left"></div>
      <div></div>
    </section>

    <section class="transfer-row">
      <div class="transfer-label">句子迁移</div>
      <div></div>
    </section>

    <section class="transfer-row method">
      <div class="transfer-label">方法迁移</div>
      <div></div>
    </section>

    <section class="notes">备注</section>
  </main>

  <div class="watermark">粉笔学堂</div>
</div>
</body>
</html>
