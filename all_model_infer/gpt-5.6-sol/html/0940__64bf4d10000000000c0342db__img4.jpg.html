<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    color: #111;
  }

  .document {
    width: 540px;
    height: 540px;
    margin: 0 auto;
    overflow: hidden;
    background: #fff;
  }

  .title-zone {
    height: 85px;
    padding-top: 14px;
    color: #fff;
    text-align: center;
    background: #66877d;
  }

  .title-zone h1 {
    margin: 0;
    font-size: 25px;
    line-height: 34px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .subtitle {
    margin-top: 0;
    font-size: 13px;
    line-height: 20px;
    letter-spacing: 1px;
  }

  table {
    width: 540px;
    height: 455px;
    border-collapse: collapse;
    table-layout: fixed;
  }

  col.tool-col {
    width: 87px;
  }

  col.use-col {
    width: 219px;
  }

  col.advice-col {
    width: 138px;
  }

  col.image-col {
    width: 96px;
  }

  th,
  td {
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }

  thead tr {
    height: 58px;
  }

  thead th {
    color: #fff;
    background: #5f8076;
    border-top: 3px solid #f6f3f1;
    border-right: 3px solid #f6f3f1;
    border-bottom: 3px solid #eee9e6;
    font-size: 17px;
    font-weight: 700;
  }

  thead th:last-child {
    border-right: 0;
  }

  tbody td {
    background: #fff;
    border-right: 3px solid #f1e9e6;
    border-bottom: 3px solid #f1e9e6;
    font-size: 15px;
    line-height: 21px;
  }

  tbody td:last-child {
    border-right: 0;
  }

  tbody tr.row-one {
    height: 137px;
  }

  tbody tr.row-two {
    height: 114px;
  }

  tbody tr.row-three {
    height: 80px;
  }

  tbody tr.row-four {
    height: 66px;
  }

  .tool-name {
    font-size: 16px;
    line-height: 22px;
    font-weight: 700;
  }

  .required {
    display: block;
    color: #e7382f;
    font-size: 13px;
    line-height: 18px;
    font-weight: 700;
  }

  .use-text {
    padding: 5px 10px;
    font-size: 15px;
    line-height: 21px;
  }

  .advice-text {
    padding: 3px 8px;
    font-size: 15px;
    line-height: 21px;
  }

  .placeholder {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .placeholder svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .placeholder-caption {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  @media (max-width: 540px) {
    .document {
      transform-origin: top left;
      transform: scale(calc(100vw / 540));
    }

    body {
      width: 100vw;
      height: calc(100vw);
      overflow: hidden;
    }
  }
</style>
</head>
<body>
<div class="document">
  <header class="title-zone">
    <h1>钩针工具选择指南</h1>
    <div class="subtitle">——only手作集——</div>
  </header>

  <table aria-label="钩针工具选择指南">
    <colgroup>
      <col class="tool-col">
      <col class="use-col">
      <col class="advice-col">
      <col class="image-col">
    </colgroup>
    <thead>
      <tr>
        <th>工具</th>
        <th>用途</th>
        <th>初学者建议</th>
        <th>实物图</th>
      </tr>
    </thead>
    <tbody>
      <tr class="row-one">
        <td>
          <div class="tool-name">钩针</div>
          <span class="required">（必备）</span>
        </td>
        <td>
          <div class="use-text">
            钩针是钩针编织的必备工具，<br>
            有多种尺寸与规格，具体如何<br>
            选择可参考《钩针毛线对照<br>
            表》、《如何选择钩针和毛<br>
            线》
          </div>
        </td>
        <td>
          <div class="advice-text">
            3mm左右的钩针<br>
            最实用
          </div>
        </td>
        <td>
          <div class="placeholder">
            <span class="placeholder-caption">[实物图：多支彩色钩针]</span>
            <svg viewBox="0 0 96 137" aria-hidden="true">
              <defs>
                <linearGradient id="hookBg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ffffff"/>
                  <stop offset="1" stop-color="#f8f8f8"/>
                </linearGradient>
              </defs>
              <rect x="7" y="45" width="82" height="55" fill="url(#hookBg)"/>
              <g stroke-linecap="round">
                <line x1="16" y1="94" x2="73" y2="62" stroke="#f0a91c" stroke-width="4"/>
                <line x1="13" y1="90" x2="70" y2="57" stroke="#d743ad" stroke-width="4"/>
                <line x1="17" y1="84" x2="76" y2="51" stroke="#20a8d1" stroke-width="4"/>
                <line x1="18" y1="78" x2="77" y2="48" stroke="#784cc1" stroke-width="4"/>
                <line x1="20" y1="73" x2="78" y2="45" stroke="#228fbc" stroke-width="4"/>
                <path d="M73 62 q9 -4 6 -9" fill="none" stroke="#f0a91c" stroke-width="2"/>
                <path d="M70 57 q9 -4 6 -9" fill="none" stroke="#d743ad" stroke-width="2"/>
                <path d="M76 51 q8 -4 5 -9" fill="none" stroke="#20a8d1" stroke-width="2"/>
              </g>
            </svg>
          </div>
        </td>
      </tr>

      <tr class="row-two">
        <td>
          <div class="tool-name">毛线</div>
          <span class="required">（必备）</span>
        </td>
        <td>
          <div class="use-text">
            毛线种类很多，新手建议选择<br>
            股数较少的，可减少失误次<br>
            数。具体如何选择参考《如何<br>
            选择钩针和毛线》
          </div>
        </td>
        <td>
          <div class="advice-text">
            中粗的宝宝棉/牛<br>
            奶棉
          </div>
        </td>
        <td>
          <div class="placeholder">
            <span class="placeholder-caption">[实物图：篮子中的彩色毛线]</span>
            <svg viewBox="0 0 96 114" aria-hidden="true">
              <rect width="96" height="114" fill="#fff"/>
              <g>
                <ellipse cx="49" cy="68" rx="37" ry="13" fill="#9a633c"/>
                <path d="M13 67 Q17 94 49 96 Q80 93 85 67 Z" fill="#a66f46"/>
                <path d="M17 72 Q48 84 81 72" fill="none" stroke="#694226" stroke-width="2"/>
                <path d="M20 78 Q49 89 78 78" fill="none" stroke="#70472b" stroke-width="2"/>
                <path d="M25 85 Q49 93 73 85" fill="none" stroke="#734a2d" stroke-width="2"/>
                <path d="M18 57 Q49 35 80 57" fill="none" stroke="#7a4a2a" stroke-width="4"/>
                <circle cx="29" cy="61" r="12" fill="#f4c05a"/>
                <circle cx="43" cy="57" r="13" fill="#f095aa"/>
                <circle cx="57" cy="59" r="13" fill="#a5ca73"/>
                <circle cx="70" cy="62" r="11" fill="#72b8cf"/>
                <g fill="none" stroke-width="1.2" opacity=".6">
                  <path d="M20 60 q9 -8 18 0 q-8 9 -17 1" stroke="#bd8529"/>
                  <path d="M34 56 q9 -8 18 1 q-8 9 -17 0" stroke="#c65372"/>
                  <path d="M48 58 q9 -8 18 1 q-8 8 -17 0" stroke="#658d3e"/>
                  <path d="M62 62 q7 -8 15 0 q-7 7 -14 0" stroke="#3f819a"/>
                </g>
              </g>
            </svg>
          </div>
        </td>
      </tr>

      <tr class="row-three">
        <td>
          <div class="tool-name">剪刀</div>
          <span class="required">（必备）</span>
        </td>
        <td>
          <div class="use-text">剪断编织过程中的编织线</div>
        </td>
        <td>
          <div class="advice-text">必备</div>
        </td>
        <td>
          <div class="placeholder">
            <span class="placeholder-caption">[实物图：剪刀]</span>
            <svg viewBox="0 0 96 80" aria-hidden="true">
              <rect width="96" height="80" fill="#fff"/>
              <g transform="translate(48 40) rotate(-30) translate(-48 -40)">
                <path d="M47 35 L70 12 L75 14 L54 39 Z" fill="#bec5c5"/>
                <path d="M51 40 L76 23 L79 27 L56 45 Z" fill="#707979"/>
                <circle cx="43" cy="46" r="9" fill="none" stroke="#222a2b" stroke-width="5"/>
                <circle cx="57" cy="52" r="8" fill="none" stroke="#222a2b" stroke-width="5"/>
                <circle cx="51" cy="40" r="2.5" fill="#d8d8d8" stroke="#333" stroke-width="1"/>
              </g>
            </svg>
          </div>
        </td>
      </tr>

      <tr class="row-four">
        <td>
          <div class="tool-name">缝合针</div>
        </td>
        <td>
          <div class="use-text">缝合、修补和连接编织面料</div>
        </td>
        <td>
          <div class="advice-text">非必须</div>
        </td>
        <td>
          <div class="placeholder">
            <span class="placeholder-caption">[实物图：彩色缝合针]</span>
            <svg viewBox="0 0 96 66" aria-hidden="true">
              <rect width="96" height="66" fill="#fff"/>
              <g stroke-linecap="round" stroke-width="3.5">
                <line x1="18" y1="58" x2="50" y2="9" stroke="#e6453a"/>
                <line x1="29" y1="61" x2="60" y2="11" stroke="#86b722"/>
                <line x1="40" y1="61" x2="69" y2="15" stroke="#f1b21a"/>
                <line x1="51" y1="62" x2="79" y2="22" stroke="#df39a2"/>
                <line x1="62" y1="62" x2="86" y2="29" stroke="#26badd"/>
              </g>
              <g fill="none" stroke="#666" stroke-width="1">
                <ellipse cx="50" cy="9" rx="2.3" ry="4"/>
                <ellipse cx="60" cy="11" rx="2.3" ry="4"/>
                <ellipse cx="69" cy="15" rx="2.3" ry="4"/>
                <ellipse cx="79" cy="22" rx="2.3" ry="4"/>
                <ellipse cx="86" cy="29" rx="2.3" ry="4"/>
              </g>
            </svg>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
