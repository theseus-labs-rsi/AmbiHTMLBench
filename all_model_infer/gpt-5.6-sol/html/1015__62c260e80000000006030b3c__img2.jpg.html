<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建议、提案写作格式</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #dedbcf;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "FangSong", serif;
  }

  .document {
    position: relative;
    width: 540px;
    height: 717px;
    overflow: hidden;
    background: #e5e1d5;
  }

  .tabs {
    position: absolute;
    top: 0;
    right: 0;
    width: 31px;
    height: 717px;
    z-index: 1;
    background: #c5c3b9;
  }

  .tab {
    position: absolute;
    right: -3px;
    width: 32px;
    height: 76px;
    border: 1px solid rgba(90, 90, 80, 0.22);
    border-radius: 0 14px 14px 0;
    box-shadow: inset 1px 0 3px rgba(255,255,255,0.6);
  }

  .tab:nth-child(1) { top: -8px; background: #d9cdb9; }
  .tab:nth-child(2) { top: 56px; background: #d0c0a9; }
  .tab:nth-child(3) { top: 120px; background: #d8d0c7; }
  .tab:nth-child(4) { top: 184px; background: #c4d0bd; }
  .tab:nth-child(5) { top: 248px; background: #d5d0ca; }
  .tab:nth-child(6) { top: 312px; background: #c9b99f; }
  .tab:nth-child(7) { top: 376px; background: #d4d1ca; }
  .tab:nth-child(8) { top: 440px; background: #c9baa3; }
  .tab:nth-child(9) { top: 504px; background: #d7d4cf; }
  .tab:nth-child(10) { top: 568px; background: #c5cdc5; }
  .tab:nth-child(11) { top: 632px; background: #d5d4cd; }
  .tab:nth-child(12) { top: 687px; background: #b8c8bd; }

  .sheet {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    width: 511px;
    height: 717px;
    padding: 17px 20px 20px 21px;
    color: #121212;
    background:
      radial-gradient(circle at 24% 28%, rgba(135,115,75,0.035), transparent 26%),
      linear-gradient(90deg, #f4f2e8 0%, #f7f5ec 52%, #f0eee4 100%);
    border-right: 2px solid rgba(80, 80, 70, 0.45);
    border-radius: 0 0 3px 0;
    box-shadow: 4px 0 7px rgba(60, 60, 50, 0.18);
  }

  .heading {
    margin: 0 0 2px;
    text-align: center;
    color: #b82226;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .intro {
    margin: 2px 0 32px;
    font-size: 20px;
    line-height: 1.58;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .format-label {
    margin: 0 0 4px;
    color: #b75b30;
    font-size: 19px;
    line-height: 1.3;
    font-weight: 700;
  }

  .sample-title {
    margin: 5px 0 0;
    text-align: center;
    font-size: 20px;
    line-height: 1.55;
    font-weight: 600;
  }

  .sample-subtitle {
    margin: 0;
    text-align: center;
    font-size: 20px;
    line-height: 1.45;
    font-weight: 600;
  }

  .sample-body {
    margin-top: 2px;
    font-size: 19.5px;
    line-height: 1.57;
    font-weight: 600;
    letter-spacing: 0.25px;
  }

  .line {
    white-space: nowrap;
  }

  .underlined {
    display: inline;
    border-bottom: 1.6px solid currentColor;
    padding-bottom: 1px;
  }

  .address {
    margin-bottom: 1px;
  }

  .indent {
    padding-left: 39px;
  }

  .blank {
    display: inline-block;
    width: 23px;
    height: 18px;
    vertical-align: -1px;
    border-bottom: 1.6px solid #171717;
  }

  .blue {
    color: #2f79a4;
  }

  .suggestions {
    margin-top: 4px;
    padding-left: 40px;
    font-size: 19.5px;
    line-height: 1.52;
    font-weight: 600;
  }

  .suggestion-row {
    height: 30px;
    white-space: nowrap;
  }

  .item-label {
    display: inline-block;
    min-width: 59px;
    border-bottom: 1.5px solid #1b1b1b;
    line-height: 22px;
  }

  .third-note {
    display: inline;
    margin-left: 1px;
    border-bottom: 1.5px solid #2f79a4;
    padding-bottom: 1px;
  }

  .continuation {
    margin-left: -40px;
    color: #2f79a4;
    line-height: 1.45;
  }

  .continuation span {
    border-bottom: 1.5px solid #2f79a4;
    padding-bottom: 1px;
  }

  .signature {
    margin-top: 2px;
    padding-right: 1px;
    text-align: right;
    font-size: 19px;
    line-height: 1.7;
    font-weight: 600;
  }

  .signature .agency {
    display: inline-block;
    min-width: 78px;
    text-align: center;
    border-bottom: 1.5px solid #171717;
    line-height: 25px;
  }

  .signature .date {
    display: inline-block;
    min-width: 142px;
    text-align: center;
    border-bottom: 1.5px solid #171717;
    line-height: 25px;
  }
</style>
</head>
<body>
  <main class="document">
    <aside class="tabs" aria-hidden="true">
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
      <div class="tab"></div>
    </aside>

    <article class="sheet">
      <h1 class="heading">二、建议、提案</h1>

      <div class="intro">
        建议是指下级部门因为某个重要事项的解决,需要向上<br>
        级提出解决问题想法的文体.具体写作技巧包括以下几<br>
        个方面。提案一般为政协提案，具体格式见示例。
      </div>

      <div class="format-label">格式：</div>

      <div class="sample-title">关于 xxxx 的建议</div>
      <div class="sample-subtitle">（“发文机关+关于+内容+文种”）</div>

      <section class="sample-body">
        <div class="line address">
          <span class="underlined">各级领导(称谓要根据具体题目要求分析得出):</span>
        </div>

        <div class="line indent">
          <span class="underlined">当前，等问题比较突出(或做了什么工作)，为了</span>
        </div>

        <div class="line">
          <span class="underlined">做好<span class="blank"></span>工作，提出以下建议:</span><span class="blue underlined">(开头为背景分析，指出存</span>
        </div>

        <div class="line">
          <span class="blue underlined">在的主要问题和目的意义)</span>
        </div>
      </section>

      <section class="suggestions">
        <div class="suggestion-row"><span class="item-label">一、……</span></div>
        <div class="suggestion-row"><span class="item-label">二、……</span></div>
        <div class="suggestion-row">
          <span class="item-label">三、……</span><span class="blue third-note">(主体内容还原为对策题,提出解决问题的措</span>
        </div>
        <div class="continuation"><span>施)</span></div>
      </section>

      <div class="signature">
        <div><span class="agency">发文机关</span></div>
        <div><span class="date">xx 年 xx 月xx日</span></div>
      </div>
    </article>
  </main>
</body>
</html>
