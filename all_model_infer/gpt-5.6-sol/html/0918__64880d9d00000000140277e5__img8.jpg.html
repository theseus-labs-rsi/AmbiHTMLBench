<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2023新菜单·必胜客餐厅周</title>
<script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #dedbd2;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
    color: #625444;
  }
  .page {
    position: relative;
    width: 540px;
    height: 733px;
    overflow: hidden;
    background:
      radial-gradient(circle at 85% 13%, rgba(255,255,255,.48) 0 52px, transparent 54px),
      radial-gradient(circle at 7% 55%, rgba(255,255,255,.34) 0 105px, transparent 108px),
      linear-gradient(107deg, rgba(255,255,255,.35), transparent 31%),
      #f4f0df;
    box-shadow: 0 2px 16px rgba(50, 43, 31, .25);
  }

  .outer-border {
    position: absolute;
    inset: 8px 11px 7px;
    border: 1px solid rgba(172, 155, 105, .58);
    pointer-events: none;
    z-index: 10;
  }
  .outer-border::before,
  .outer-border::after {
    content: "❧";
    position: absolute;
    top: -8px;
    color: rgba(161, 143, 91, .7);
    font-size: 22px;
    line-height: 1;
  }
  .outer-border::before { left: 4px; transform: rotate(-24deg); }
  .outer-border::after { right: 4px; transform: scaleX(-1) rotate(-24deg); }

  .top-line {
    position: absolute;
    top: 30px;
    left: 130px;
    width: 280px;
    height: 1px;
    background: linear-gradient(to right, transparent, #a99355 12%, #a99355 88%, transparent);
  }
  .top-flourish {
    position: absolute;
    top: 17px;
    left: 230px;
    width: 80px;
    color: #a99458;
    text-align: center;
    font: 28px/1 Georgia, serif;
    letter-spacing: -5px;
  }

  header {
    position: absolute;
    top: 48px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 4;
  }
  .year {
    color: #9c8a51;
    font-size: 20px;
    letter-spacing: 2px;
    line-height: 25px;
  }
  h1 {
    margin: 6px 0 3px;
    color: #bf1f2e;
    font-weight: 400;
    font-size: 49px;
    line-height: 1.08;
    letter-spacing: 3px;
  }
  .offer {
    color: #a78d56;
    font-size: 20px;
    letter-spacing: 2px;
  }
  .offer .price {
    color: #c52331;
    font-size: 35px;
    line-height: 1;
    letter-spacing: 0;
  }

  .mid-ornament {
    position: absolute;
    top: 194px;
    left: 128px;
    width: 282px;
    height: 20px;
    z-index: 4;
  }
  .mid-ornament::before,
  .mid-ornament::after {
    content: "";
    position: absolute;
    top: 4px;
    width: 108px;
    height: 1px;
    background: linear-gradient(to right, transparent, #b2a064);
  }
  .mid-ornament::before { left: 0; }
  .mid-ornament::after {
    right: 0;
    transform: scaleX(-1);
  }
  .mid-ornament span {
    display: block;
    margin: -9px auto 0;
    width: 68px;
    color: #a18d4d;
    text-align: center;
    font: 27px/20px Georgia, serif;
  }

  .date {
    position: absolute;
    top: 219px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #887a5c;
    font-size: 14px;
    letter-spacing: .3px;
    z-index: 4;
  }
  .rule {
    position: absolute;
    top: 247px;
    left: 31px;
    right: 31px;
    height: 1px;
    background: #c7bfa8;
    z-index: 3;
  }

  .menu-columns {
    position: absolute;
    top: 258px;
    left: 39px;
    right: 34px;
    z-index: 6;
    display: grid;
    grid-template-columns: 185px 1fr;
    column-gap: 22px;
  }
  .menu-block {
    margin: 0 0 18px;
  }
  .menu-block h2 {
    margin: 0 0 5px;
    color: #a91f2d;
    font-size: 16px;
    line-height: 1.25;
    font-weight: 700;
  }
  .menu-block p {
    margin: 0 0 4px;
    color: #645a4a;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .right-column {
    padding-left: 19px;
    border-left: 1px solid rgba(193, 183, 157, .75);
  }

  .placeholder {
    position: absolute;
    overflow: hidden;
    z-index: 2;
  }
  .placeholder figcaption {
    position: absolute;
    left: 50%;
    bottom: 4px;
    transform: translateX(-50%);
    max-width: 90%;
    color: rgba(80, 63, 41, .34);
    font: 8px/1.1 Arial, sans-serif;
    white-space: nowrap;
    text-align: center;
  }

  .menu-board {
    left: 366px;
    top: 238px;
    width: 164px;
    height: 219px;
    border-radius: 8px 10px 2px 4px;
    transform: rotate(4deg);
    background:
      linear-gradient(112deg, rgba(255,255,255,.48), transparent 32%),
      linear-gradient(135deg, #d9cdbd, #eee5d8 65%, #cfc2b0);
    box-shadow: -5px 8px 14px rgba(76, 60, 40, .14);
    color: rgba(178, 163, 143, .28);
  }
  .board-copy {
    position: absolute;
    inset: 20px 12px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.55;
    letter-spacing: 1px;
    transform: rotate(-2deg);
  }
  .board-copy strong {
    display: block;
    font-size: 25px;
    font-weight: 400;
    line-height: 1.1;
  }

  .pasta {
    left: 169px;
    top: 382px;
    width: 210px;
    height: 119px;
    overflow: visible;
  }
  .pasta .plate {
    position: absolute;
    left: 0;
    top: 14px;
    width: 205px;
    height: 92px;
    border-radius: 50%;
    background: radial-gradient(ellipse, #b83418 0 19%, #c85121 21% 34%, #e4c57b 36% 42%, #faf8ef 44% 67%, #d3cec0 70%, transparent 72%);
    box-shadow: 0 9px 10px rgba(60, 39, 20, .18);
  }
  .pasta .plate::before {
    content: "";
    position: absolute;
    inset: 29px 52px 25px;
    border-radius: 50%;
    background: repeating-linear-gradient(13deg, #6d2518 0 4px, #de8729 5px 8px, #8f301c 9px 12px);
    transform: rotate(-8deg);
  }
  .pasta .stand {
    position: absolute;
    left: 95px;
    top: 91px;
    width: 47px;
    height: 75px;
    clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%);
    background: linear-gradient(to right, #a63720, #e25e32 47%, #8f291d);
  }

  .bread {
    left: 334px;
    top: 446px;
    width: 151px;
    height: 113px;
    transform: rotate(-5deg);
  }
  .bread .pan {
    position: absolute;
    left: 4px;
    top: 31px;
    width: 141px;
    height: 71px;
    border-radius: 8px 8px 48% 48%;
    background: #161719;
    box-shadow: 0 8px 7px rgba(58, 42, 24, .2);
  }
  .bread .piece {
    position: absolute;
    width: 62px;
    height: 38px;
    border-radius: 48% 42% 31% 45%;
    background: radial-gradient(circle at 50% 25%, #fff2bf, transparent 17%), linear-gradient(145deg, #efce72, #c8892f);
    box-shadow: 0 2px 4px rgba(75, 48, 19, .3);
  }
  .bread .b1 { left: 22px; top: 15px; transform: rotate(12deg); }
  .bread .b2 { left: 70px; top: 14px; transform: rotate(-9deg); }
  .bread .b3 { left: 48px; top: 44px; transform: rotate(5deg); }

  .green-drink {
    left: 446px;
    top: 372px;
    width: 62px;
    height: 135px;
    border-radius: 5px 5px 15px 15px;
    background:
      radial-gradient(circle at 23px 69px, #7da443 0 6px, transparent 7px),
      radial-gradient(circle at 37px 91px, #91af4b 0 8px, transparent 9px),
      radial-gradient(circle at 20px 103px, #b1c55e 0 7px, transparent 8px),
      linear-gradient(to top, #d8e5aa 0 67%, rgba(255,255,255,.7) 69%);
    border: 1px solid rgba(185, 181, 153, .7);
    box-shadow: 3px 6px 9px rgba(61, 53, 38, .13);
  }
  .green-drink::before {
    content: "";
    position: absolute;
    top: -9px;
    left: 29px;
    width: 3px;
    height: 32px;
    background: #9c8d61;
    transform: rotate(5deg);
  }

  .pink-drink {
    left: 483px;
    top: 454px;
    width: 53px;
    height: 113px;
    border-radius: 4px 4px 12px 12px;
    background:
      radial-gradient(circle at 23px 60px, #f5dfc0 0 13px, #df9d8b 14px, transparent 15px),
      linear-gradient(to top, #df635b 0 69%, rgba(255,255,255,.8) 72%);
    border: 1px solid rgba(177, 150, 128, .65);
    box-shadow: 2px 6px 8px rgba(72, 52, 33, .15);
  }
  .pink-drink::before {
    content: "";
    position: absolute;
    top: -11px;
    left: 29px;
    width: 3px;
    height: 29px;
    background: #998c68;
    transform: rotate(10deg);
  }

  .pizza {
    left: 77px;
    top: 500px;
    width: 300px;
    height: 210px;
    overflow: visible;
  }
  .pizza .board {
    position: absolute;
    left: 2px;
    top: 40px;
    width: 292px;
    height: 164px;
    border-radius: 50%;
    background: linear-gradient(#d8ab63, #b77a35);
    box-shadow: 0 7px 10px rgba(69, 48, 27, .28);
  }
  .pizza .handle {
    position: absolute;
    left: 81px;
    top: 0;
    width: 62px;
    height: 103px;
    border-radius: 25px 24px 9px 9px;
    background: linear-gradient(95deg, #ddb267, #b97b33);
    transform: rotate(-43deg);
  }
  .pizza .pie {
    position: absolute;
    left: 18px;
    top: 41px;
    width: 263px;
    height: 153px;
    border-radius: 50%;
    border: 14px solid #d9a556;
    background:
      radial-gradient(ellipse at 25% 34%, #8b3224 0 14px, transparent 15px),
      radial-gradient(ellipse at 47% 28%, #963426 0 18px, transparent 19px),
      radial-gradient(ellipse at 69% 39%, #7d2b22 0 17px, transparent 18px),
      radial-gradient(ellipse at 38% 61%, #8b3025 0 16px, transparent 17px),
      radial-gradient(ellipse at 72% 65%, #8a3023 0 17px, transparent 18px),
      radial-gradient(circle at 55% 54%, #f1c84e 0 9px, transparent 10px),
      linear-gradient(135deg, #d94d25, #e58b30 47%, #c74022);
    box-shadow: inset 0 0 0 3px #efc477, 0 3px 4px rgba(69, 40, 19, .2);
  }

  .skillet {
    left: 368px;
    top: 566px;
    width: 169px;
    height: 113px;
    overflow: visible;
  }
  .skillet .handle {
    position: absolute;
    right: 0;
    top: 11px;
    width: 73px;
    height: 15px;
    border-radius: 10px;
    background: #252526;
    transform: rotate(-20deg);
  }
  .skillet .pan {
    position: absolute;
    left: 0;
    top: 24px;
    width: 128px;
    height: 82px;
    border-radius: 40% 40% 50% 50%;
    background:
      radial-gradient(circle at 43% 38%, #fff0a0 0 7px, transparent 8px),
      radial-gradient(circle at 65% 45%, #da3121 0 8px, transparent 9px),
      radial-gradient(circle at 34% 65%, #d64321 0 7px, transparent 8px),
      radial-gradient(circle at 72% 68%, #f0b22d 0 9px, transparent 10px),
      repeating-radial-gradient(circle at 50% 52%, #f0ba33 0 5px, #c93720 6px 10px);
    border: 8px solid #282829;
    box-shadow: 0 7px 7px rgba(60, 43, 25, .28);
  }

  .fine-print {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 9px;
    height: 15px;
    border-top: 1px solid rgba(137, 128, 108, .35);
    color: rgba(92, 85, 72, .48);
    font-family: Arial, sans-serif;
    font-size: 5px;
    line-height: 7px;
    z-index: 8;
    overflow: hidden;
  }

  @media (max-width: 540px) {
    body { display: block; }
    .page {
      width: 100vw;
      height: calc(100vw * 1.3574074);
      transform-origin: top left;
    }
  }
</style>
</head>
<body>
<main class="page">
  <div class="outer-border"></div>
  <div class="top-line"></div>
  <div class="top-flourish">❧❧</div>

  <header>
    <div class="year">2023新菜单</div>
    <h1>必胜客餐厅周</h1>
    <div class="offer">新品套餐<span class="price">99</span>元5件</div>
  </header>

  <div class="mid-ornament"><span>❧❧</span></div>
  <div class="date">活动时间:2023.6.5-2023.7.9</div>
  <div class="rule"></div>

  <section class="menu-columns">
    <div class="left-column">
      <div class="menu-block">
        <h2>主食（5选1）</h2>
        <p>孜香牛肉比萨（铁盘普装/手拍）</p>
        <p>超级至尊比萨（铁盘普装/手拍）</p>
        <p>意式肉酱风味牛肉比萨（铁盘普装/手拍）</p>
        <p>炙烤牛排佐和风烧肉汁</p>
        <p>那不勒斯式肉丸意面</p>
      </div>
      <div class="menu-block">
        <h2>饮料（4选2）</h2>
        <p>卡曼橘暴打柠檬</p>
        <p>大红袍手打柠檬（冰/温）</p>
        <p>粉红斑马暴打柠檬</p>
        <p>百事可乐无糖（冰）</p>
      </div>
    </div>

    <div class="right-column">
      <div class="menu-block">
        <h2>小食（5选2）</h2>
        <p>意式肉酱芝士波纹薯条</p>
        <p>奶香芝士菠萝卷</p>
        <p>一口波波香肠卷</p>
        <p>双芝香酥骨TAPAS</p>
        <p>甘梅红薯条</p>
      </div>
    </div>
  </section>

  <figure class="placeholder menu-board">
    <div class="board-copy">
      Dessert<br>
      <strong>PIZZA</strong>
      <strong>FRUIT</strong>
      <strong>MENU</strong>
      Drink
    </div>
    <figcaption>[Menu board: upper-right]</figcaption>
  </figure>

  <figure class="placeholder pasta">
    <div class="stand"></div>
    <div class="plate"></div>
    <figcaption>[Pasta dish: center]</figcaption>
  </figure>

  <figure class="placeholder bread">
    <div class="pan"></div>
    <div class="piece b1"></div>
    <div class="piece b2"></div>
    <div class="piece b3"></div>
    <figcaption>[Bread rolls: right-center]</figcaption>
  </figure>

  <figure class="placeholder green-drink">
    <figcaption>[Green drink]</figcaption>
  </figure>

  <figure class="placeholder pink-drink">
    <figcaption>[Pink drink]</figcaption>
  </figure>

  <figure class="placeholder pizza">
    <div class="handle"></div>
    <div class="board"></div>
    <div class="pie"></div>
    <figcaption>[Pizza: bottom-left]</figcaption>
  </figure>

  <figure class="placeholder skillet">
    <div class="handle"></div>
    <div class="pan"></div>
    <figcaption>[Skillet side dish: bottom-right]</figcaption>
  </figure>

  <div class="fine-print">[illegible]</div>
</main>
</body>
</html>
