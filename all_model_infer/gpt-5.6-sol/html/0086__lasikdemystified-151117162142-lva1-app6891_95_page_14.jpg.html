<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA Should Be Less Than 40 %</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #587568;
      font-family: Arial, Helvetica, sans-serif;
      padding: 25px 6.35vw 32px;
    }

    .title-banner {
      width: 100%;
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: linear-gradient(to bottom, #7bc4ce 0%, #218a9a 100%);
      color: #ffff00;
      font-size: clamp(27px, 4.55vw, 48px);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .content-panel {
      width: min(733px, calc(100% - 40px));
      height: 381px;
      margin: 74px auto 0;
      background: #ffffff;
      padding-top: 67px;
      color: #1239a2;
      font-weight: 700;
    }

    .equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-size: 29px;
      line-height: 1;
    }

    .fraction {
      display: inline-flex;
      width: 135px;
      flex-direction: column;
      align-items: center;
      font-size: 29px;
      line-height: 1.1;
    }

    .fraction .numerator {
      width: 100%;
      padding-bottom: 7px;
      text-align: center;
      border-bottom: 3px solid #1239a2;
    }

    .fraction .denominator {
      padding-top: 7px;
    }

    .limit {
      margin-left: 38px;
      color: #ad3737;
      font-size: 23px;
    }

    .definitions {
      margin: 45px 0 0 109px;
      font-size: 28px;
      line-height: 1.9;
    }

    .definition {
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      body {
        padding: 18px 4vw 24px;
      }

      .title-banner {
        height: auto;
        min-height: 58px;
        padding: 10px 8px;
        font-size: clamp(20px, 6vw, 36px);
        white-space: normal;
      }

      .content-panel {
        width: 100%;
        height: auto;
        min-height: 381px;
        margin-top: 52px;
        padding: 58px 20px 34px;
      }

      .equation {
        gap: 13px;
        font-size: 24px;
      }

      .fraction {
        width: 112px;
        font-size: 24px;
      }

      .limit {
        margin-left: 6px;
        font-size: 19px;
      }

      .definitions {
        margin: 42px 0 0;
        font-size: clamp(18px, 4.8vw, 28px);
        line-height: 1.9;
      }
    }
  </style>
</head>
<body>
  <header class="title-banner">PTA SHOULD BE LESS THAN 40 %</header>

  <main class="content-panel">
    <div class="equation" aria-label="PTA equals FT plus AD divided by CCT, less than 40 percent">
      <span>PTA =</span>
      <span class="fraction">
        <span class="numerator">(FT + AD)</span>
        <span class="denominator">CCT</span>
      </span>
      <span class="limit">&lt; 40%</span>
    </div>

    <section class="definitions">
      <div class="definition">FT = flap thickness</div>
      <div class="definition">AD = ablation depth</div>
      <div class="definition">CCT = central corneal thickness</div>
    </section>
  </main>
</body>
</html>
