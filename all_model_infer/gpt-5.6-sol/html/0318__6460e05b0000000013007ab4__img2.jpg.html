<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王源最新机场私服Look</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #d7d7d7;
      font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #111;
    }

    .page {
      width: 540px;
      height: 722px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 200px 140px 200px;
      overflow: hidden;
      background: #fff;
    }

    .photo {
      position: relative;
      height: 722px;
      overflow: hidden;
    }

    .photo .placeholder-caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .left-photo {
      background:
        radial-gradient(ellipse at 60% 14%, #efc7e9 0 10%, transparent 10.5%),
        radial-gradient(ellipse at 53% 19%, #f1d9eb 0 15%, transparent 15.5%),
        linear-gradient(108deg, #7a9bb2 0 9%, #18212b 9% 19%, #afc2d0 19% 22%, #d8d5dd 22% 45%, #b9d0d5 45% 59%, #4d555d 59% 65%, #15191d 65% 100%);
    }

    .right-photo {
      background:
        radial-gradient(ellipse at 52% 10%, #f0dce1 0 13%, transparent 13.5%),
        radial-gradient(ellipse at 57% 18%, #e9f0ed 0 19%, transparent 19.5%),
        linear-gradient(120deg, #53604d 0 15%, #c0b8a6 15% 26%, #827966 26% 47%, #d2c7bc 47% 66%, #566150 66% 100%);
    }

    .left-photo::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 36px;
      width: 145px;
      height: 190px;
      border-radius: 48% 44% 42% 48%;
      background: #eacbe9;
      transform: rotate(-8deg);
      box-shadow: inset 35px -6px 0 #d9bada;
    }

    .left-photo::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 218px;
      width: 157px;
      height: 380px;
      border-radius: 34% 34% 8% 8%;
      background: #f4f5f1;
      box-shadow: 18px 248px 0 -17px #181d23;
    }

    .right-photo::before {
      content: "";
      position: absolute;
      left: 43px;
      top: 21px;
      width: 105px;
      height: 155px;
      border-radius: 48% 48% 44% 44%;
      background: #efdde1;
      transform: rotate(8deg);
      box-shadow: inset -25px 2px 0 #dfc8ce;
    }

    .right-photo::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 113px;
      width: 183px;
      height: 405px;
      border-radius: 35% 35% 15% 15%;
      background: #f6f7f3;
      box-shadow: 3px 365px 0 -21px #172131;
    }

    .center {
      height: 722px;
      background: #fff;
      text-align: center;
      padding: 4px 10px 0;
      overflow: hidden;
    }

    .title {
      margin: 0;
      height: 61px;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 49px;
      line-height: 53px;
      font-weight: 900;
      letter-spacing: -4px;
      white-space: nowrap;
    }

    .subtitle {
      height: 22px;
      font-size: 9px;
      font-weight: 700;
      line-height: 17px;
    }

    .sunglasses {
      height: 48px;
      margin: 0 9px 3px;
      border: 1px solid #d6d6d6;
      position: relative;
      background:
        linear-gradient(12deg, transparent 37%, #777 38% 41%, transparent 42%) 0 0 / 100% 100%,
        linear-gradient(-12deg, transparent 37%, #777 38% 41%, transparent 42%) 0 0 / 100% 100%,
        #eee;
    }

    .sunglasses::before,
    .sunglasses::after {
      content: "";
      position: absolute;
      top: 12px;
      width: 41px;
      height: 23px;
      border: 2px solid #969696;
      background: rgba(180, 205, 208, .62);
    }

    .sunglasses::before {
      left: 18px;
    }

    .sunglasses::after {
      right: 18px;
    }

    .product-title {
      margin-top: 2px;
      font-size: 17px;
      line-height: 20px;
      font-weight: 900;
    }

    .product-note {
      font-size: 9px;
      line-height: 14px;
      white-space: nowrap;
    }

    .shirt {
      height: 84px;
      margin: 4px auto 4px;
      width: 112px;
      position: relative;
      background: #fafafa;
      clip-path: polygon(28% 8%, 41% 0, 59% 0, 72% 8%, 100% 25%, 85% 48%, 72% 38%, 72% 100%, 28% 100%, 28% 38%, 15% 48%, 0 25%);
      box-shadow: 0 0 2px #bbb;
    }

    .shirt::after {
      content: "✦ ✦ ✦\A ✦  ✦\A  ✦ ✦";
      white-space: pre;
      position: absolute;
      left: 33px;
      top: 25px;
      color: #16734b;
      font-size: 13px;
      line-height: 14px;
    }

    .jeans {
      height: 151px;
      margin: 3px auto 5px;
      width: 117px;
      position: relative;
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: flex-start;
    }

    .jeans::before,
    .jeans::after {
      content: "";
      display: block;
      width: 48px;
      height: 140px;
      background: linear-gradient(90deg, #172d50 0 18%, #213d68 19% 78%, #112849 79%);
      clip-path: polygon(7% 0, 93% 0, 83% 80%, 100% 100%, 57% 100%, 48% 81%, 40% 100%, 0 100%, 16% 80%);
    }

    .shoe {
      height: 47px;
      width: 116px;
      margin: 4px auto 5px;
      position: relative;
      background: #f1f1ed;
      border-radius: 48% 52% 25% 25%;
      transform: skewX(-12deg);
      box-shadow: inset 17px 9px 0 #d6d6cd, inset -5px -6px 0 #fafaf7, 0 2px 2px #aaa;
    }

    .shoe::after {
      content: "";
      position: absolute;
      left: 29px;
      top: 17px;
      width: 54px;
      height: 3px;
      background: #b6b7b2;
      box-shadow: 0 8px 0 #c8c8c2;
    }

    .bottom-title {
      margin-top: 1px;
      font-size: 19px;
      line-height: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }

    .bottom-note {
      font-size: 9px;
      line-height: 14px;
      white-space: nowrap;
    }

    .spacer {
      height: 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <figure class="photo left-photo placeholder" aria-label="[Photo: left portrait]">
      <figcaption class="placeholder-caption">[Photo: left portrait]</figcaption>
    </figure>

    <section class="center">
      <h1 class="title">王源</h1>
      <div class="subtitle">最新机场私服Look</div>

      <div class="sunglasses placeholder" aria-label="[Product photo: sunglasses]">
        <span class="placeholder-caption">[Product photo: sunglasses]</span>
      </div>
      <div class="product-title">PSR帕莎</div>
      <div class="product-note">品牌定制款</div>

      <div class="shirt placeholder" aria-label="[Product photo: white T-shirt]">
        <span class="placeholder-caption">[Product photo: white T-shirt]</span>
      </div>
      <div class="product-title">Etudes</div>
      <div class="product-note">LOGO印花圆领短袖T恤</div>
      <div class="product-note">参考价￥1,080</div>

      <div class="jeans placeholder" aria-label="[Product photo: jeans]">
        <span class="placeholder-caption">[Product photo: jeans]</span>
      </div>
      <div class="product-title">LOEWE</div>
      <div class="product-note">单宁布渔夫蓝边牛仔裤</div>
      <div class="product-note">参考价￥7,700</div>

      <div class="shoe placeholder" aria-label="[Product photo: sneakers]">
        <span class="placeholder-caption">[Product photo: sneakers]</span>
      </div>
      <div class="bottom-title">GUCCI</div>
      <div class="bottom-note">MAC80系列男士运动鞋</div>
      <div class="bottom-note">参考价￥7,600</div>
    </section>

    <figure class="photo right-photo placeholder" aria-label="[Photo: right rear portrait]">
      <figcaption class="placeholder-caption">[Photo: right rear portrait]</figcaption>
    </figure>
  </main>
</body>
</html>
