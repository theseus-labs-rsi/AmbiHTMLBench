<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #d7d6cb;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "KaiTi", "STKaiti", "FangSong", serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 720px;
    overflow: hidden;
    color: #171717;
    background-color: #e8e9df;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 21px,
        rgba(80, 93, 90, 0.43) 22px,
        transparent 23px
      ),
      repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 21px,
        rgba(80, 93, 90, 0.43) 22px,
        transparent 23px
      );
    box-shadow:
      inset 17px 0 17px rgba(44, 45, 40, 0.24),
      inset -2px 0 5px rgba(70, 70, 65, 0.15);
  }

  .page::before {
    content: "";
    position: absolute;
    z-index: 0;
    left: 15px;
    top: 0;
    width: 2px;
    height: 100%;
    background: rgba(87, 91, 86, 0.45);
  }

  .binding {
    position: absolute;
    z-index: 3;
    top: 0;
    left: 0;
    width: 34px;
    height: 30px;
    background: #242721;
    clip-path: polygon(0 0, 100% 0, 100% 7%, 52% 31%, 0 6%);
    opacity: 0.96;
  }

  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  .red {
    color: #8d1627;
  }

  .title {
    position: absolute;
    top: 43px;
    left: 96px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    transform: rotate(-0.8deg);
    white-space: nowrap;
    text-shadow: 0.4px 0 #8d1627;
  }

  .questions-label {
    position: absolute;
    top: 116px;
    left: 64px;
    width: 32px;
    font-size: 29px;
    line-height: 1.48;
    font-weight: 700;
    text-align: center;
    transform: rotate(-1deg);
  }

  .questions {
    position: absolute;
    top: 118px;
    left: 116px;
    width: 405px;
    font-size: 20px;
    line-height: 3.18;
    font-weight: 500;
    transform: rotate(-0.6deg);
  }

  .questions div {
    height: 62px;
    white-space: nowrap;
  }

  .formula-label {
    position: absolute;
    top: 332px;
    left: 66px;
    width: 33px;
    font-size: 29px;
    line-height: 1.48;
    font-weight: 700;
    text-align: center;
    transform: rotate(-1.3deg);
  }

  .formula {
    position: absolute;
    top: 314px;
    left: 124px;
    width: 397px;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.95;
    transform: rotate(-0.7deg);
  }

  .formula-row {
    white-space: nowrap;
  }

  .formula-row.indent {
    padding-left: 29px;
  }

  .formula-row + .formula-row {
    margin-top: 10px;
  }

  .blank {
    color: #8d1627;
    font-weight: 500;
    letter-spacing: 4px;
  }

  .seal {
    position: absolute;
    top: 332px;
    right: 38px;
    width: 58px;
    height: 108px;
    border-radius: 29px 26px 18px 20px;
    background: #971527;
    color: #f0eadf;
    border: 2px solid rgba(151, 21, 39, 0.95);
    box-shadow: inset 0 0 0 2px rgba(241, 230, 213, 0.12);
    transform: rotate(3deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 33px;
    line-height: 1.05;
    font-weight: 700;
  }

  .seal::before,
  .seal::after {
    content: "";
    position: absolute;
    left: 7px;
    right: 7px;
    height: 1px;
    background: rgba(241, 230, 213, 0.35);
  }

  .seal::before { top: 8px; }
  .seal::after { bottom: 8px; }

  .mnemonic {
    position: absolute;
    top: 514px;
    left: 80px;
    width: 430px;
    font-size: 29px;
    font-weight: 700;
    white-space: nowrap;
    transform: rotate(-1.5deg);
  }

  .mnemonic .lead {
    color: #20234e;
  }

  .mnemonic .text {
    color: #92192a;
    letter-spacing: 3px;
  }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div class="binding"></div>

    <div class="content">
      <header class="title red">句段结构作用好处赏析</header>

      <aside class="questions-label red">
        常<br>见<br>问<br>法
      </aside>

      <section class="questions red">
        <div>1. 请分析这句话的作用是什么？</div>
        <div>2. 这句话这样描写有什么好处？</div>
        <div>3. 请分析这句话这样描写的表达效果.</div>
      </section>

      <aside class="formula-label red">
        满<br>分<br>公<br>式
      </aside>

      <section class="formula">
        <div class="formula-row">① 这是<span class="blank">（　　）</span>描写</div>
        <div class="formula-row indent">生动形象地写出<span class="blank">（　　）</span>，</div>
        <div class="formula-row">② 更突出了<span class="blank">（　　）</span>.</div>
        <div class="formula-row">③ 前后文呼应／为后文<span class="blank">（　）</span>做了铺垫.</div>
      </section>

      <div class="seal" aria-label="印章">
        <span>字</span>
        <span>真</span>
      </div>

      <div class="mnemonic">
        <span class="lead">口诀：</span><span class="text">生动质　感心头　句句手</span>
      </div>
    </div>
  </main>
</body>
</html>
