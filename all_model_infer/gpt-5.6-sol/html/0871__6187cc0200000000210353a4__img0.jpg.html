<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief Is Life, But Love Is Long</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #dedbd4;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      position: relative;
      width: min(100vw, 540px);
      aspect-ratio: 540 / 763;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 28% 28%, rgba(255,255,255,.98) 0 11%, transparent 12%),
        radial-gradient(ellipse at 54% 55%, rgba(255,255,255,.98) 0 26%, transparent 27%),
        #fffdf8;
      color: #ef6100;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: transparent;
      pointer-events: none;
    }

    .wash {
      position: absolute;
      opacity: .72;
      filter: blur(.4px);
      background: #ffdcb8;
    }

    .wash-1 {
      width: 380px;
      height: 150px;
      top: 11px;
      left: -17px;
      border-radius: 45% 51% 37% 48%;
      transform: rotate(-8deg);
      clip-path: polygon(0 27%, 18% 8%, 30% 21%, 45% 0, 61% 25%, 78% 12%, 100% 43%, 83% 67%, 62% 56%, 44% 87%, 22% 67%, 2% 100%);
    }

    .wash-2 {
      width: 265px;
      height: 365px;
      top: 29px;
      left: 18px;
      border: 18px solid #ffd2a5;
      border-right-width: 33px;
      border-radius: 52% 48% 50% 45%;
      transform: rotate(24deg);
      background: transparent;
      opacity: .65;
    }

    .wash-3 {
      width: 145px;
      height: 310px;
      top: 24px;
      left: 232px;
      border-radius: 52% 34% 63% 20%;
      transform: rotate(31deg);
      clip-path: polygon(11% 0, 46% 8%, 57% 29%, 89% 19%, 72% 45%, 100% 59%, 61% 66%, 55% 100%, 27% 74%, 0 86%, 17% 51%, 1% 30%);
    }

    .wash-4 {
      width: 213px;
      height: 468px;
      top: 121px;
      right: -24px;
      border: 27px solid #ffd6aa;
      border-left-width: 42px;
      border-radius: 49% 52% 45% 55%;
      transform: rotate(-13deg);
      background: transparent;
    }

    .wash-5 {
      width: 155px;
      height: 325px;
      right: -31px;
      top: 292px;
      border-radius: 57% 42% 60% 31%;
      transform: rotate(-15deg);
      clip-path: polygon(44% 0, 100% 8%, 77% 26%, 97% 41%, 67% 52%, 100% 73%, 64% 79%, 75% 100%, 25% 87%, 0 57%, 28% 34%, 6% 17%);
    }

    .wash-6 {
      width: 242px;
      height: 306px;
      left: 2px;
      bottom: -24px;
      border-radius: 45% 42% 30% 48%;
      transform: rotate(-17deg);
      clip-path: polygon(0 8%, 30% 22%, 48% 2%, 70% 22%, 91% 12%, 82% 39%, 100% 52%, 73% 65%, 91% 89%, 54% 81%, 42% 100%, 21% 73%, 0 88%, 12% 54%);
    }

    .wash-7 {
      width: 155px;
      height: 197px;
      left: 76px;
      top: 436px;
      border-radius: 50%;
      transform: rotate(21deg);
      clip-path: polygon(20% 0, 61% 11%, 78% 0, 100% 33%, 72% 52%, 90% 78%, 55% 100%, 38% 72%, 0 88%, 16% 51%, 0 27%);
    }

    .stripe {
      position: absolute;
      height: 13px;
      border-radius: 50%;
      background: rgba(250, 173, 102, .35);
      transform-origin: left center;
    }

    .stripe.s1 { width: 218px; left: 112px; top: 46px; transform: rotate(27deg); }
    .stripe.s2 { width: 194px; left: 137px; top: 77px; transform: rotate(32deg); }
    .stripe.s3 { width: 135px; left: 176px; top: 111px; transform: rotate(39deg); }
    .stripe.s4 { width: 131px; right: -3px; top: 175px; transform: rotate(-9deg); }
    .stripe.s5 { width: 116px; right: -15px; top: 220px; transform: rotate(-14deg); }
    .stripe.s6 { width: 105px; right: -3px; top: 265px; transform: rotate(-20deg); }

    .top-left {
      position: absolute;
      top: 19px;
      left: 27px;
      z-index: 2;
      font-weight: 900;
      line-height: 1;
    }

    .edition {
      margin-bottom: 5px;
      font-size: 17px;
      font-style: italic;
      letter-spacing: 1px;
      transform: rotate(-5deg);
    }

    .credit {
      font-size: 10px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .top-right {
      position: absolute;
      top: 14px;
      right: 25px;
      z-index: 2;
      width: 265px;
      text-align: right;
      font-weight: 900;
    }

    .headline {
      white-space: nowrap;
      font-size: 29px;
      line-height: .95;
      letter-spacing: 0;
    }

    .subheadline {
      margin-top: 7px;
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0;
    }

    .foreign-copy {
      margin-top: 11px;
      font-family: serif;
      font-size: 10px;
      line-height: 1.7;
      letter-spacing: 5px;
    }

    .main-title {
      position: absolute;
      top: 131px;
      left: 19px;
      bottom: 62px;
      z-index: 2;
      display: flex;
      gap: 22px;
      align-items: flex-start;
      font-family: Impact, "Arial Black", Georgia, serif;
      font-size: 56px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .vertical-line {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .love-you {
      height: 294px;
    }

    .three-thousand {
      height: 560px;
    }

    .side-copy {
      position: absolute;
      z-index: 2;
      top: 188px;
      right: 23px;
      height: 277px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 9px;
      line-height: 1;
      letter-spacing: 6px;
      border-left: 1px solid rgba(239, 97, 0, .43);
      padding-left: 5px;
    }

    .bottom-copy {
      position: absolute;
      z-index: 2;
      right: 26px;
      bottom: 65px;
      width: 225px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .faith {
      position: absolute;
      z-index: 2;
      right: 26px;
      bottom: 25px;
      padding: 2px 4px 1px;
      background: #ef6100;
      color: #fff9ee;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }

    @media (max-width: 539px) {
      .page {
        transform-origin: top center;
      }

      .headline { font-size: 5.35vw; }
      .subheadline { font-size: 3.15vw; }
      .main-title { font-size: 10.35vw; }
      .faith { font-size: 2.6vw; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Poster">
    <figure class="placeholder" aria-label="Abstract pale orange watercolor tiger illustration">
      <figcaption>[Illustration: abstract pale orange watercolor tiger, full-page background]</figcaption>
      <div class="wash wash-1"></div>
      <div class="wash wash-2"></div>
      <div class="wash wash-3"></div>
      <div class="wash wash-4"></div>
      <div class="wash wash-5"></div>
      <div class="wash wash-6"></div>
      <div class="wash wash-7"></div>
      <div class="stripe s1"></div>
      <div class="stripe s2"></div>
      <div class="stripe s3"></div>
      <div class="stripe s4"></div>
      <div class="stripe s5"></div>
      <div class="stripe s6"></div>
    </figure>

    <header>
      <div class="top-left">
        <div class="edition">1/02</div>
        <div class="credit">DESIGNED BY<br>KERRBLEE</div>
      </div>

      <div class="top-right">
        <div class="headline">BRIEF IS LIFE</div>
        <div class="subheadline">BUT LOVE IS LONG</div>
        <div class="foreign-copy">[illegible]<br>[illegible]</div>
      </div>
    </header>

    <section class="main-title" aria-label="LOVE YOU THREE THOUSAND">
      <div class="vertical-line three-thousand">THREE THOUSAND</div>
      <div class="vertical-line love-you">LOVE YOU</div>
    </section>

    <aside class="side-copy">[illegible]</aside>

    <footer>
      <div class="bottom-copy">
        Life was like a box of chocolates,<br>
        you never know what you are gonna get.
      </div>
      <div class="faith">YOU GOTTA HAVE LITTLE FAITH</div>
    </footer>
  </main>
</body>
</html>
