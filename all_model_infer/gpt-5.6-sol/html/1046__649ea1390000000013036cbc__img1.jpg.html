<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如何挑选性格好的猫咪</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      color: #080808;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    .page {
      width: 540px;
      min-width: 540px;
      height: 722px;
      overflow: hidden;
      background: #fff;
      position: relative;
      padding-top: 18px;
    }

    .main-title {
      height: 67px;
      margin: 0 5px;
      white-space: nowrap;
      font-size: 45px;
      line-height: 55px;
      letter-spacing: -2.8px;
      font-weight: 1000;
      transform: scaleX(0.99);
      transform-origin: left center;
    }

    .main-title .red {
      color: #f53335;
    }

    .intro {
      position: relative;
      height: 157px;
    }

    .checklist {
      position: absolute;
      top: 15px;
      left: 33px;
      width: 351px;
      z-index: 2;
    }

    .check-row {
      height: 32px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      font-size: 19px;
      line-height: 28px;
      font-weight: 800;
      letter-spacing: 0.1px;
    }

    .check-row .text {
      display: inline-block;
      padding: 0 6px 1px 6px;
      background: linear-gradient(
        to bottom,
        transparent 8%,
        #fff7e9 8%,
        #fff7e9 91%,
        transparent 91%
      );
    }

    .checkbox {
      width: 23px;
      height: 23px;
      margin-right: 10px;
      border: 3px solid #f2a627;
      background: #fff;
      position: relative;
      flex: 0 0 23px;
      box-shadow: 0 0 0 1px #ffe4a8;
    }

    .checkbox::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 0;
      width: 8px;
      height: 13px;
      border: solid #ee6a3b;
      border-width: 0 3px 3px 0;
      transform: rotate(43deg);
    }

    .hero-cat {
      position: absolute;
      right: 15px;
      top: 19px;
      width: 140px;
      height: 126px;
    }

    .hero-cat .head {
      position: absolute;
      left: 28px;
      top: 20px;
      width: 105px;
      height: 91px;
      border: 3px solid #1a1010;
      border-radius: 47% 49% 45% 45%;
      background: #fffafa;
      transform: rotate(1deg);
      z-index: 2;
    }

    .hero-cat .ear {
      position: absolute;
      top: -17px;
      width: 39px;
      height: 42px;
      background: #fffafa;
      border: 3px solid #1a1010;
      z-index: -1;
    }

    .hero-cat .ear.left {
      left: 4px;
      transform: rotate(-27deg) skewY(-9deg);
      border-radius: 7px 0 2px 0;
    }

    .hero-cat .ear.right {
      right: 3px;
      transform: rotate(27deg) skewY(9deg);
      border-radius: 0 7px 0 2px;
    }

    .hero-cat .ear.left::after,
    .hero-cat .ear.right::after {
      content: "";
      position: absolute;
      width: 19px;
      height: 23px;
      top: 7px;
      background: #f6aaa5;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .hero-cat .ear.left::after {
      left: 6px;
    }

    .hero-cat .ear.right::after {
      right: 6px;
    }

    .hero-cat .patch {
      position: absolute;
      left: -3px;
      top: 5px;
      width: 49px;
      height: 43px;
      background: #e98e55;
      border-radius: 60% 25% 65% 30%;
      transform: rotate(-15deg);
    }

    .hero-cat .eye {
      position: absolute;
      top: 39px;
      width: 21px;
      height: 9px;
      border-bottom: 4px solid #201010;
      border-radius: 50%;
      z-index: 4;
    }

    .hero-cat .eye.left {
      left: 22px;
      transform: rotate(17deg);
    }

    .hero-cat .eye.right {
      right: 19px;
      transform: rotate(-17deg);
    }

    .hero-cat .mouth {
      position: absolute;
      left: 39px;
      top: 49px;
      width: 39px;
      height: 27px;
      background: #9c1e2d;
      border: 3px solid #1c1010;
      border-radius: 46% 47% 58% 58%;
      transform: rotate(-4deg);
      z-index: 4;
      overflow: hidden;
    }

    .hero-cat .mouth::after {
      content: "";
      position: absolute;
      left: 9px;
      bottom: -2px;
      width: 22px;
      height: 10px;
      border-radius: 50%;
      background: #ee6671;
    }

    .hero-cat .nose {
      position: absolute;
      left: 52px;
      top: 42px;
      width: 10px;
      height: 7px;
      border-radius: 50%;
      background: #251315;
      z-index: 5;
    }

    .hero-cat .paw {
      position: absolute;
      top: 83px;
      width: 31px;
      height: 54px;
      border: 3px solid #1a1010;
      border-radius: 50% 50% 12px 12px;
      z-index: 5;
    }

    .hero-cat .paw.left {
      left: 40px;
      background: #fffdfa;
      transform: rotate(13deg);
    }

    .hero-cat .paw.right {
      right: 5px;
      background: #e79969;
      transform: rotate(-12deg);
    }

    .hero-cat .motion {
      position: absolute;
      height: 3px;
      width: 22px;
      background: #18100f;
      border-radius: 3px;
      transform-origin: right center;
    }

    .hero-cat .motion.m1 {
      left: 2px;
      top: 46px;
      transform: rotate(24deg);
    }

    .hero-cat .motion.m2 {
      left: 0;
      top: 59px;
      transform: rotate(3deg);
    }

    .hero-cat .motion.m3 {
      left: 8px;
      top: 71px;
      transform: rotate(-25deg);
    }

    .section-title {
      position: relative;
      display: inline-block;
      margin: 0 0 0 17px;
      padding: 0 2px;
      font-size: 30px;
      line-height: 39px;
      font-weight: 1000;
      letter-spacing: -1.8px;
      color: #111;
      -webkit-text-stroke: 1.5px #fff;
      text-shadow:
        -2px -2px 0 #111,
        2px -2px 0 #111,
        -2px 2px 0 #111,
        2px 2px 0 #111;
      z-index: 2;
    }

    .section-title::before {
      content: "";
      position: absolute;
      left: -7px;
      right: -9px;
      bottom: 1px;
      height: 22px;
      background: #f3a932;
      transform: skewX(-7deg);
      z-index: -2;
    }

    .section-title::after {
      content: "";
      position: absolute;
      left: -1px;
      right: -3px;
      bottom: 5px;
      height: 28px;
      background: #fff;
      z-index: -1;
    }

    .cat-grid {
      margin-top: 13px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 194px 194px;
      row-gap: 25px;
    }

    .cat-card {
      position: relative;
      width: 180px;
      height: 194px;
      text-align: center;
    }

    .photo {
      width: 111px;
      height: 108px;
      margin: 0 auto;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background: #fff0d2;
    }

    .photo .body {
      position: absolute;
      left: 30px;
      bottom: -22px;
      width: 55px;
      height: 91px;
      border-radius: 46% 46% 34% 34%;
      background: var(--fur);
      box-shadow: inset 9px 0 0 var(--shade), inset -7px 0 0 rgba(255,255,255,.22);
    }

    .photo .head {
      position: absolute;
      left: 30px;
      top: 18px;
      width: 56px;
      height: 54px;
      border-radius: 45% 45% 48% 48%;
      background: var(--fur);
      box-shadow: inset 7px 0 0 var(--shade), inset -5px 0 0 rgba(255,255,255,.18);
      z-index: 2;
    }

    .photo .ear {
      position: absolute;
      top: -12px;
      width: 25px;
      height: 27px;
      background: var(--dark);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      z-index: -1;
    }

    .photo .ear.left {
      left: 1px;
      transform: rotate(-12deg);
    }

    .photo .ear.right {
      right: 1px;
      transform: rotate(12deg);
    }

    .photo .eye {
      position: absolute;
      top: 24px;
      width: 7px;
      height: 8px;
      border-radius: 50%;
      background: var(--eye);
      border: 1.5px solid #111;
    }

    .photo .eye.left {
      left: 13px;
    }

    .photo .eye.right {
      right: 13px;
    }

    .photo .nose {
      position: absolute;
      left: 25px;
      top: 35px;
      width: 7px;
      height: 5px;
      border-radius: 50%;
      background: #bd777b;
    }

    .photo .chest {
      position: absolute;
      left: 39px;
      top: 56px;
      width: 36px;
      height: 48px;
      border-radius: 50%;
      background: var(--chest);
      z-index: 3;
    }

    .photo .stripe {
      display: none;
      position: absolute;
      left: 6px;
      width: 44px;
      height: 4px;
      background: var(--dark);
      border-radius: 50%;
      opacity: .7;
    }

    .photo.striped .stripe {
      display: block;
    }

    .photo .stripe.s1 {
      top: 10px;
      transform: rotate(4deg);
    }

    .photo .stripe.s2 {
      top: 17px;
      transform: rotate(-3deg);
    }

    .photo .stripe.s3 {
      top: 45px;
      width: 27px;
      left: 15px;
    }

    .photo.ragdoll {
      --fur: #f3f2ed;
      --shade: #b8b3af;
      --dark: #716d73;
      --eye: #68b9e9;
      --chest: #ffffff;
    }

    .photo.british {
      --fur: #72777b;
      --shade: #4a4e51;
      --dark: #383b3e;
      --eye: #c68f39;
      --chest: #686d70;
    }

    .photo.american {
      --fur: #bfc2c1;
      --shade: #85898b;
      --dark: #4e5457;
      --eye: #88b19c;
      --chest: #efefec;
    }

    .photo.li-hua {
      --fur: #8b8066;
      --shade: #665b45;
      --dark: #302f28;
      --eye: #b3a543;
      --chest: #a99b7c;
    }

    .photo.siamese {
      --fur: #e7e2d8;
      --shade: #beb5aa;
      --dark: #4b4646;
      --eye: #67acd8;
      --chest: #f1eee7;
    }

    .photo.munchkin {
      --fur: #e4e0df;
      --shade: #aaa4ad;
      --dark: #807782;
      --eye: #bd9670;
      --chest: #f7f4f4;
    }

    .cat-name {
      margin-top: -1px;
      height: 36px;
      font-size: 25px;
      line-height: 35px;
      font-weight: 1000;
      letter-spacing: 0.5px;
    }

    .description {
      width: 100%;
      padding: 0 9px;
      text-align: left;
      font-size: 18px;
      line-height: 27px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <h1 class="main-title">如何挑选<span class="red">性格好的</span>猫咪</h1>

    <section class="intro">
      <div class="checklist">
        <div class="check-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="text">伸手摸它，看会不会主动过来蹭</span>
        </div>
        <div class="check-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="text">抱一下猫咪，看会不会抗拒</span>
        </div>
        <div class="check-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="text">喂食物，看会不会主动积极吃</span>
        </div>
        <div class="check-row">
          <span class="checkbox" aria-hidden="true"></span>
          <span class="text">对猫咪喵喵叫，看会不会积极回应</span>
        </div>
      </div>

      <div class="hero-cat placeholder" aria-label="猫咪卡通图">
        <span class="sr-only">[卡通图：右侧猫咪]</span>
        <span class="motion m1"></span>
        <span class="motion m2"></span>
        <span class="motion m3"></span>
        <div class="head">
          <span class="ear left"></span>
          <span class="ear right"></span>
          <span class="patch"></span>
          <span class="eye left"></span>
          <span class="eye right"></span>
          <span class="nose"></span>
          <span class="mouth"></span>
        </div>
        <span class="paw left"></span>
        <span class="paw right"></span>
      </div>
    </section>

    <section>
      <h2 class="section-title">猫咪品种看性格</h2>

      <div class="cat-grid">
        <article class="cat-card">
          <div class="photo ragdoll placeholder">
            <span class="sr-only">[照片：布偶猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">布偶</div>
          <div class="description">性格温和，外表美丽<br>肠胃不太好</div>
        </article>

        <article class="cat-card">
          <div class="photo british placeholder">
            <span class="sr-only">[照片：英短猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">英短</div>
          <div class="description">体型圆胖、毛短而密<br>温柔平静、对人友善</div>
        </article>

        <article class="cat-card">
          <div class="photo american striped placeholder">
            <span class="sr-only">[照片：美短猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="stripe s1"></span>
              <span class="stripe s2"></span>
              <span class="stripe s3"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">美短</div>
          <div class="description">性格活泼好动<br>适应能力也比较强</div>
        </article>

        <article class="cat-card">
          <div class="photo li-hua striped placeholder">
            <span class="sr-only">[照片：狸花猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="stripe s1"></span>
              <span class="stripe s2"></span>
              <span class="stripe s3"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">狸花</div>
          <div class="description">身体素质好，聪明<br>好养活，寿命长</div>
        </article>

        <article class="cat-card">
          <div class="photo siamese placeholder">
            <span class="sr-only">[照片：暹罗猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">暹罗</div>
          <div class="description">活泼好动，智商高<br>胆子比较大</div>
        </article>

        <article class="cat-card">
          <div class="photo munchkin placeholder">
            <span class="sr-only">[照片：曼基康猫]</span>
            <div class="body"></div>
            <div class="chest"></div>
            <div class="head">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
            </div>
          </div>
          <div class="cat-name">曼基康</div>
          <div class="description">活泼友善，性格好<br>小短腿底盘容易弄脏</div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
