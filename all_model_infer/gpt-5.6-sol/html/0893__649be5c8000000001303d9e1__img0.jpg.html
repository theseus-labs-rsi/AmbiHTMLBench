<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富人眼中的富人是咋样？</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #071226;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 730px;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.78);
      background:
        radial-gradient(ellipse at 52% 17%, rgba(65, 95, 169, 0.82) 0%, rgba(32, 62, 127, 0.6) 35%, transparent 60%),
        radial-gradient(ellipse at 15% 4%, rgba(65, 92, 153, 0.72) 0%, transparent 29%),
        radial-gradient(ellipse at 81% 0%, rgba(65, 89, 148, 0.72) 0%, transparent 29%),
        linear-gradient(180deg, #172f6a 0%, #0b2b63 46%, #071a3d 78%, #050c18 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      top: 188px;
      right: -42px;
      width: 410px;
      height: 145px;
      opacity: 0.25;
      transform: rotate(8deg);
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 4px,
          rgba(137, 165, 220, 0.48) 5px,
          transparent 7px
        );
      border-radius: 50%;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 23% 56%, rgba(75, 112, 190, 0.11) 0 2px, transparent 3px),
        radial-gradient(circle at 71% 69%, rgba(62, 101, 180, 0.12) 0 2px, transparent 3px),
        linear-gradient(90deg, transparent 0%, rgba(15, 34, 73, 0.08) 50%, transparent 100%);
      background-size: 19px 19px, 27px 27px, 100% 100%;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 136px 20px 24px 24px;
      color: #fff;
      font-family: "STSong", "SimSun", "Songti SC", serif;
      font-size: 44px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
    }

    .table-wrap {
      position: relative;
      z-index: 1;
      width: 494px;
      margin-left: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 16px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(4, 25, 65, 0.14);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    col:first-child {
      width: 315px;
    }

    col:last-child {
      width: 179px;
    }

    th,
    td {
      border: 1px solid rgba(255, 255, 255, 0.84);
      padding: 0 7px;
      vertical-align: middle;
    }

    th {
      height: 35px;
      text-align: center;
      font-size: 16px;
      font-weight: 300;
    }

    td {
      height: 52px;
    }

    td:first-child {
      text-align: left;
    }

    td:last-child {
      text-align: center;
    }

    .note td {
      height: 40px;
      padding-right: 8px;
      text-align: right;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        height: calc(100vw * 1.35185185);
        transform-origin: top center;
      }

      h1 {
        margin-top: 25.185vw;
        margin-left: 4.444vw;
        margin-bottom: 4.444vw;
        font-size: 8.148vw;
      }

      .table-wrap {
        width: 91.481vw;
        margin-left: 3.333vw;
      }

      table {
        font-size: 2.963vw;
      }

      th {
        height: 6.481vw;
        font-size: 2.963vw;
      }

      td {
        height: 9.63vw;
      }

      .note td {
        height: 7.407vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>富人眼中的富人是咋样？</h1>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col>
          <col>
        </colgroup>
        <thead>
          <tr>
            <th>问题</th>
            <th>回答</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1.您觉得高净值人群资产拥有多少钱才算是?</td>
            <td>1亿7,388.4万元</td>
          </tr>
          <tr class="note">
            <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
          </tr>
          <tr>
            <td>2.请问您每天工作小时数是?</td>
            <td>8.2小时</td>
          </tr>
          <tr>
            <td>3.您预计退休年龄?</td>
            <td>59岁</td>
          </tr>
          <tr>
            <td>4.您希望能活到多少岁?</td>
            <td>88.2岁</td>
          </tr>
          <tr class="note">
            <td colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
          </tr>
          <tr>
            <td>5.请问您曾去过国家数量（包括商务出差）</td>
            <td>6.2个国家</td>
          </tr>
          <tr>
            <td>6.请问您平均每月阅读书籍数量</td>
            <td>2.4本书</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
