<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Up in the Biz</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #171717;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster {
      position: relative;
      width: min(100vw, 503px);
      aspect-ratio: 503 / 752;
      overflow: hidden;
      background: #eee9dc;
      color: #111;
    }

    .photo {
      position: absolute;
      top: 10%;
      left: 0;
      width: 100%;
      height: 70%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 51% 78%, #080808 0 4%, transparent 4.8%),
        radial-gradient(ellipse at 34% 79%, #080808 0 4%, transparent 4.8%),
        radial-gradient(ellipse at 51% 76%, #c7c7c2 0 8%, transparent 9%),
        radial-gradient(ellipse at 34% 77%, #c7c7c2 0 8%, transparent 9%),
        linear-gradient(to bottom, transparent 0 67%, rgba(20,20,20,.75) 68% 100%),
        radial-gradient(ellipse at 50% 21%, #595959 0 36%, #202020 37% 46%, transparent 47%),
        radial-gradient(ellipse at 50% 57%, #747474 0 37%, #292929 54%, #111 71%);
      filter: grayscale(1) contrast(1.15);
    }

    .photo::before {
      content: "";
      position: absolute;
      left: 4%;
      top: 47%;
      width: 94%;
      height: 18%;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 5px 7px rgba(0,0,0,.7);
      transform: rotate(-1deg);
    }

    .photo::after {
      content: "[Photo: close-up portrait of Biz Markie wearing a cap]";
      position: absolute;
      left: 0;
      bottom: 1px;
      width: 100%;
      color: transparent;
      font-size: 1px;
      text-align: center;
    }

    .top {
      position: absolute;
      z-index: 3;
      top: 2.5%;
      left: 6%;
      right: 6%;
      height: 7%;
      color: #fff;
    }

    .festival {
      position: absolute;
      top: 0;
      left: 0;
      width: 19%;
      text-align: center;
      font-size: clamp(5px, 1.35vw, 7px);
      line-height: 1.02;
      font-weight: 700;
    }

    .laurel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .laurel::before,
    .laurel::after {
      content: "❧";
      font-size: clamp(18px, 5vw, 27px);
      font-weight: normal;
      transform: rotate(-25deg);
    }

    .laurel::after {
      transform: scaleX(-1) rotate(-25deg);
    }

    .showtime-original {
      position: absolute;
      top: 0;
      left: 20%;
      right: 4%;
      text-align: center;
      font-size: clamp(11px, 3.1vw, 16px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: .3em;
    }

    .credit {
      position: absolute;
      z-index: 4;
      top: 7%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(7px, 2vw, 10px);
      font-weight: 700;
    }

    .title-block {
      position: absolute;
      z-index: 5;
      top: 17%;
      left: 10%;
      width: 80%;
      text-align: center;
      color: #edc623;
    }

    .all-up {
      margin: 0;
      font-size: clamp(26px, 8.2vw, 42px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: 0;
    }

    .biz {
      margin: -.04em 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(105px, 33vw, 168px);
      line-height: .82;
      font-weight: 900;
      letter-spacing: -.08em;
      transform: scaleY(1.12);
      text-shadow: 1px 1px 0 #edc623;
    }

    .subtitle {
      position: absolute;
      z-index: 5;
      top: 51.1%;
      left: 18%;
      width: 64%;
      color: #edc623;
      text-align: center;
      font-size: clamp(13px, 3.8vw, 19px);
      line-height: 1.17;
      font-weight: 900;
    }

    .footer {
      position: absolute;
      z-index: 6;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 20.4%;
      background: #000;
      color: #fff;
      text-align: center;
    }

    .documentary {
      margin-top: 2.1%;
      font-size: clamp(12px, 3.4vw, 17px);
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .date {
      font-size: clamp(12px, 3.4vw, 17px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .streaming {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3.1%;
      margin-top: 2.3%;
      height: 33%;
    }

    .showtime {
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(28px, 9.4vw, 47px);
      line-height: 1;
      letter-spacing: -.07em;
      transform: scaleX(.82);
    }

    .divider {
      height: 77%;
      width: 2px;
      background: #fff;
    }

    .paramount {
      position: relative;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(27px, 8.8vw, 44px);
      line-height: .8;
      white-space: nowrap;
    }

    .stream-label {
      display: block;
      margin-bottom: -1px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(5px, 1.4vw, 7px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: .16em;
      text-align: center;
    }

    .plus {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 300;
      font-size: .85em;
    }

    .plan {
      position: absolute;
      bottom: 6.1%;
      width: 100%;
      font-size: clamp(8px, 2.5vw, 12px);
      letter-spacing: .03em;
      color: #cfcfcf;
    }

    @media (max-width: 350px) {
      .festival {
        transform: scale(.9);
        transform-origin: top left;
      }

      .showtime-original {
        letter-spacing: .22em;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="All Up in the Biz documentary film poster">
    <div class="photo placeholder" role="img" aria-label="Close-up portrait of Biz Markie wearing a cap"></div>

    <header class="top">
      <div class="festival">
        <div class="laurel">
          <span>TRIBECA<br>FESTIVAL<br>2023</span>
        </div>
        <div>OFFICIAL SELECTION</div>
      </div>
      <div class="showtime-original">SHOWTIME ORIGINAL</div>
    </header>

    <div class="credit">A SACHA JENKINS JAMMIE</div>

    <section class="title-block">
      <h1 class="all-up">ALL UP IN THE</h1>
      <div class="biz">BIZ</div>
    </section>

    <div class="subtitle">
      THE LIFE AND RHYMES<br>
      OF BIZ MARKIE
    </div>

    <footer class="footer">
      <div class="documentary">DOCUMENTARY FILM</div>
      <div class="date">AUGUST 11</div>

      <div class="streaming">
        <div class="showtime">SHOWTIME</div>
        <div class="divider"></div>
        <div class="paramount">
          <span class="stream-label">STREAMING ON</span>
          Paramount<span class="plus">+</span>
        </div>
      </div>

      <div class="plan">PARAMOUNT+ WITH SHOWTIME PLAN ONLY</div>
    </footer>
  </main>
</body>
</html>
