<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用暗示的积极力量养出优秀孩子</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #363744;
    }

    .page {
      position: relative;
      width: 540px;
      height: 752px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
      padding-top: 32px;
    }

    .title-box {
      width: 462px;
      height: 50px;
      margin-left: 46px;
      border: 1px solid #8295ae;
      border-radius: 9px;
      background: linear-gradient(180deg, #e1e6f5 0%, #d5ddef 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-box h1 {
      margin: -1px 0 0;
      color: #141526;
      font-size: 26px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .subtitle {
      margin: 31px 0 24px 44px;
      color: #363744;
      font-size: 20px;
      line-height: 28px;
      font-weight: 400;
      white-space: nowrap;
    }

    .content-panel {
      width: 468px;
      height: 516px;
      margin-left: 40px;
      padding: 6px 7px 4px 8px;
      border-top: 1px solid #d1d5df;
      border-left: 1px solid #c8ccd5;
      border-right: 2px solid #818993;
      border-bottom: 2px solid #757d87;
      background: linear-gradient(180deg, #e8ebf7 0%, #dce3f5 100%);
      box-shadow: 1px 1px 2px rgba(62, 67, 74, 0.35);
    }

    .row {
      display: flex;
      align-items: center;
      height: 36.05px;
      white-space: nowrap;
    }

    .icon {
      position: relative;
      flex: 0 0 26px;
      width: 26px;
      height: 22px;
      margin-right: 0;
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 2px;
      width: 6px;
      height: 19px;
      border-radius: 1px;
      background: #c5000c;
      box-shadow: 1px 1px 1px rgba(62, 0, 0, 0.55);
    }

    .cross::before {
      transform: rotate(43deg);
    }

    .cross::after {
      transform: rotate(-43deg);
    }

    .check {
      color: #72ac57;
      font-family: Arial, sans-serif;
      font-size: 24px;
      line-height: 22px;
      font-weight: bold;
      padding-left: 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .text {
      font-size: 19.5px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
    }

    .negative .text {
      color: #454653;
    }

    .positive .text {
      color: #844584;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="title-box">
      <h1>用暗示的积极力量养出优秀孩子</h1>
    </header>

    <div class="subtitle">学习上，让孩子体验一个个小成功</div>

    <section class="content-panel">
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">你磨蹭半天了，没写几个字，再磨下去就别睡了</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">越早完成作业，休息的时间就越多！</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">这么简单的题都不会做？</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">这道题你觉得难，不太会是吗？</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">赶紧写作业，一点都不自觉</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">你很少忘记写作业的，如果需要帮助就告诉我。</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">你这孩子怎么这么犟呢，你要听话</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">你可以说“不”，但我想听听你的理由理解你。</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">你怎么这么烦人呢，就不能安静一会儿吗？</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">你自己先去玩一会，妈妈忙完就马上找你。</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">勇敢点，这有什么的啊？</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">我相信你行的，再试试看，我陪着你</span>
      </div>
      <div class="row negative">
        <span class="icon cross" aria-hidden="true"></span>
        <span class="text">快点走，再拖拖拉拉你就别出去了。</span>
      </div>
      <div class="row positive">
        <span class="icon check" aria-hidden="true">✓</span>
        <span class="text">我们来比一比，看谁更快出门。</span>
      </div>
    </section>
  </main>
</body>
</html>
