<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我介绍</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcefee;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 304px;
      overflow: hidden;
      color: #292929;
      background:
        radial-gradient(ellipse at 17% 4%, rgba(250, 234, 45, .72) 0 4%, rgba(250, 235, 56, .30) 10%, transparent 22%),
        radial-gradient(ellipse at 33% 27%, rgba(250, 241, 83, .46), transparent 21%),
        radial-gradient(ellipse at 75% 20%, rgba(105, 205, 190, .34), transparent 27%),
        radial-gradient(ellipse at 7% 80%, rgba(99, 206, 191, .54), transparent 29%),
        radial-gradient(ellipse at 92% 83%, rgba(86, 194, 183, .42), transparent 28%),
        linear-gradient(135deg, #b9e7df 0%, #d8f2e7 43%, #aedfd9 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .42;
      background:
        repeating-linear-gradient(11deg, transparent 0 9px, rgba(255,255,255,.13) 10px, transparent 12px),
        repeating-linear-gradient(98deg, transparent 0 13px, rgba(49,156,151,.08) 14px, transparent 16px);
      mix-blend-mode: soft-light;
    }

    .header {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 200px;
      width: 142px;
      text-align: center;
    }

    .title-bubbles {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 41px;
    }

    .title-bubbles span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      margin-left: -4px;
      border-radius: 52% 48% 46% 54%;
      color: white;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 25px;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(154, 111, 0, .25);
      background: linear-gradient(145deg, #ffd846, #f3bc27);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.30);
    }

    .title-bubbles span:nth-child(2) {
      transform: translateY(1px) rotate(-3deg);
    }

    .title-bubbles span:nth-child(3) {
      transform: translateY(2px) rotate(4deg);
    }

    .title-bubbles span:nth-child(4) {
      transform: rotate(3deg);
    }

    .subtitle {
      margin-top: 3px;
      color: #4d4c49;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .7px;
      transform: rotate(-1deg);
      text-shadow: 0 1px 1px rgba(255,255,255,.75);
    }

    .card {
      position: absolute;
      z-index: 2;
      top: 84px;
      left: 22px;
      width: 497px;
      height: 207px;
      border-radius: 36px 35px 31px 36px;
      background:
        radial-gradient(circle at 37% 9%, rgba(255,249,191,.52), transparent 31%),
        radial-gradient(circle at 87% 24%, rgba(247,246,202,.48), transparent 22%),
        rgba(255, 255, 255, .84);
      box-shadow:
        0 2px 8px rgba(34, 132, 131, .14),
        inset 0 0 20px rgba(255,255,255,.68);
    }

    .details {
      position: absolute;
      top: 42px;
      left: 39px;
      width: 130px;
      color: #a65b21;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 21px;
      white-space: nowrap;
    }

    .goal-cloud {
      position: absolute;
      top: 20px;
      left: 171px;
      width: 179px;
      height: 106px;
      z-index: 2;
    }

    .goal-cloud .shape {
      position: absolute;
      inset: 12px 8px 5px 8px;
      border-radius: 42% 47% 45% 46%;
      background: #f9bd22;
      box-shadow: 0 2px 3px rgba(184, 126, 0, .17);
    }

    .goal-cloud .shape::before,
    .goal-cloud .shape::after {
      content: "";
      position: absolute;
      background: #f9bd22;
      border-radius: 50%;
    }

    .goal-cloud .shape::before {
      width: 70px;
      height: 61px;
      left: 3px;
      top: -14px;
      box-shadow:
        55px -2px 0 5px #f9bd22,
        97px 16px 0 -1px #f9bd22,
        -16px 25px 0 -1px #f9bd22;
    }

    .goal-cloud .shape::after {
      width: 76px;
      height: 43px;
      left: 41px;
      bottom: -8px;
      box-shadow:
        49px -3px 0 -4px #f9bd22,
        -37px -7px 0 -7px #f9bd22;
    }

    .goal-text {
      position: relative;
      z-index: 2;
      width: 156px;
      margin: 4px auto 0;
      text-align: center;
      color: #7b5717;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 11px;
      line-height: 15px;
    }

    .goal-heading {
      margin-bottom: 0;
      color: #fff6ca;
      font-size: 14px;
      line-height: 19px;
    }

    .dots {
      position: absolute;
      top: 31px;
      left: 352px;
      width: 31px;
      height: 29px;
    }

    .dots i {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: #f6b51e;
    }

    .dots i:nth-child(1) {
      left: 0;
      top: 12px;
      width: 14px;
      height: 14px;
    }

    .dots i:nth-child(2) {
      left: 14px;
      top: 7px;
      width: 11px;
      height: 11px;
    }

    .dots i:nth-child(3) {
      left: 26px;
      top: 3px;
      width: 7px;
      height: 7px;
    }

    .photo {
      position: absolute;
      top: 16px;
      right: 38px;
      width: 76px;
      height: 97px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 54% 29%, #f0c2a1 0 8%, transparent 9%),
        radial-gradient(ellipse at 57% 26%, #23130d 0 16%, transparent 17%),
        linear-gradient(118deg, transparent 44%, #fff 45% 70%, transparent 71%),
        linear-gradient(150deg, #fff 0 32%, transparent 33%),
        linear-gradient(145deg, #ff361d, #e74717 70%, #f4832c);
      box-shadow: 0 2px 5px rgba(92, 86, 60, .25);
    }

    .photo::before {
      content: "";
      position: absolute;
      left: 23px;
      top: 27px;
      width: 29px;
      height: 60px;
      border-radius: 43% 45% 31% 35%;
      transform: rotate(-9deg);
      background: linear-gradient(107deg, #fff 0 65%, #e9e8e4 66%);
      box-shadow: -8px 13px 0 -4px white;
    }

    .photo figcaption {
      position: absolute;
      left: -9999px;
    }

    .body-copy {
      position: absolute;
      left: 29px;
      right: 28px;
      top: 132px;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 11px;
      line-height: 18px;
      color: #252525;
      text-align: justify;
    }

    .body-copy p {
      margin: 0;
    }

    .body-copy .opening {
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="title-bubbles" aria-label="自我介绍">
        <span>自</span>
        <span>我</span>
        <span>介</span>
        <span>绍</span>
      </div>
      <div class="subtitle">SELF INTRODUCTION</div>
    </header>

    <section class="card">
      <div class="details">
        姓名：咸鱼<br>
        年龄：20<br>
        爱好：看电影，打游戏
      </div>

      <div class="goal-cloud">
        <div class="shape"></div>
        <div class="goal-text">
          <div class="goal-heading">工作目标：</div>
          1.学习好专业知识，同时广泛<br>
          涉及其他专业知识。<br>
          2.尽量多争取一些考级证书，<br>
          这不仅是能力的证明，也是<br>
          就业的有力武器。
        </div>
      </div>

      <div class="dots" aria-hidden="true">
        <i></i><i></i><i></i>
      </div>

      <figure class="placeholder photo">
        <figcaption>[照片：右侧]</figcaption>
      </figure>

      <div class="body-copy">
        <p class="opening">大家好，我叫咸鱼，来自山东青岛。</p>
        <p>本人性格沉稳、细致、观体，发挥所长。在工作上，细致入微，认真负责。具有很好的团队合作精神；注重团体的利益，集体意识强。能够与人充分合作，充分听取他人的意见和建议，并不断进步。观察力强、上进心强而且为人随和，易于沟通，能够快速地融入工作群团队及成员给出良好的意见。</p>
      </div>
    </section>
  </main>
</body>
</html>
