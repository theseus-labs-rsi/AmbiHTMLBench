<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班队会记录</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #e9e6dc;
      color: #242424;
      font-family: "KaiTi", "STKaiti", "楷体", serif;
    }

    .page {
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      padding: 58px 76px 18px 40px;
      background: #f4f2e9;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.18);
    }

    .record-title {
      height: 23px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 3px;
      line-height: 23px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 16px;
      line-height: 1.6;
    }

    td {
      border: 1px solid #777;
      vertical-align: top;
      padding: 3px 7px;
      word-break: break-all;
    }

    .label {
      width: 63px;
      text-align: center;
      vertical-align: middle;
      font-weight: bold;
      padding: 4px 2px;
    }

    .time {
      height: 35px;
      padding-top: 2px;
      padding-bottom: 2px;
    }

    .time .date {
      display: inline-block;
      width: 126px;
    }

    .time .class-label {
      display: inline-block;
      width: 106px;
      text-align: right;
      padding-right: 5px;
    }

    .subject {
      height: 40px;
      padding-top: 4px;
    }

    .requirements {
      height: 83px;
      padding-top: 4px;
      line-height: 1.45;
    }

    .process {
      height: 280px;
      padding: 7px 8px;
      line-height: 1.8;
    }

    .result {
      height: 111px;
      padding: 10px 8px;
      line-height: 1.9;
    }

    .remarks {
      height: 47px;
      padding-top: 6px;
    }

    .page-number {
      position: absolute;
      bottom: 7px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: "Times New Roman", serif;
      font-size: 10px;
      color: #333;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="record-title">班队会记录</div>

    <table aria-label="班队会记录表">
      <tr class="time">
        <td class="label">时间</td>
        <td colspan="2">
          <span class="date">2023.5.22</span>
          <span class="class-label">班级（中队）</span>
          五1[?]中队
        </td>
      </tr>

      <tr class="subject">
        <td class="label">主题</td>
        <td colspan="2">争做良好习惯的小标兵</td>
      </tr>

      <tr class="requirements">
        <td class="label">目<br>的<br><br>要<br>求</td>
        <td colspan="2">
          教育同学养成良好习惯，养成文明礼貌
          的言行。[illegible]<br>
          通过本次班队会，促使同学养成良好习惯。
        </td>
      </tr>

      <tr class="process">
        <td class="label">过<br><br><br><br><br><br>程</td>
        <td colspan="2">
          一、观看事例。<br>
          故事告诉我们的道理：世界上最可怕的就是习惯，<br>
          世界上最宝贵的财富也是习惯。<br>
          二、小品《发生在我们身边的事》。<br>
          三、怎样告别坏习惯。<br>
          四、分享好习惯。<br>
          五、养成好习惯。
        </td>
      </tr>

      <tr class="result">
        <td class="label">效<br><br>果</td>
        <td colspan="2">
          本次班队会举行很成功，相信大家也受到了<br>
          很好的教育和促进，我相信我们的学校会更加美好。
        </td>
      </tr>

      <tr class="remarks">
        <td class="label">备注</td>
        <td colspan="2">争做良好习惯</td>
      </tr>
    </table>

    <div class="page-number">-46-</div>
  </main>
</body>
</html>
