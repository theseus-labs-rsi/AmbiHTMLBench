<style>

  .main-title {

    line-height: 1.2;
    font-weight: 800;

  }

  .lesson-pill {

    font-size: 32px;
    font-weight: 800;

       2px -2px 0 #462827,
      -2px  2px 0 #462827,
       2px  2px 0 #462827,

  }

    z-index: 5;
    top: 118px;
    left: 47px;
    width: 78px;
    height: 99px;
    transform: rotate(-9deg);
    font-size: 0;
  }

  .brush .caption {

    height: 1px;
    overflow: hidden;
  }

  .brush-handle {

    left: 19px;

  }

  .brush-metal {
    position: absolute;
    top: 50px;
    left: 28px;

    height: 18px;

  .brush-bristles {

    left: 36px;
    width: 38px;

        #c68f67 0,
        #c68f67 3px,
        #e0b089 3px,
        #e0b089 6px
      );
  }

    z-index: 3;
    left: 0;
    width: 100%;
  }

  .section-one {
    top: 232px;

  .section-two {

  .section-one .section-title-wrap {
    width: 234px;
  }

  .section-two .section-title-wrap {
    width: 226px;
  }

  table {
    border-collapse: collapse;
    table-layout: fixed;
  }

  th,
  td {
    border: 1px solid rgba(255,255,255,.68);
    text-align: center;
    vertical-align: middle;
    padding: 2px 4px;
    font-weight: 400;
  }

  .comparison-table {
    position: absolute;
    top: 53px;
    left: 50px;
    width: 439px;
    height: 96px;
    font-size: 11px;
    line-height: 16px;

  .comparison-table col:nth-child(2) { width: 96px; }
  .comparison-table col:nth-child(3) { width: 79px; }
  .comparison-table col:nth-child(4) { width: 90px; }
  .comparison-table col:nth-child(5) { width: 87px; }

  .comparison-table thead {

  .comparison-table tbody tr {

    background: #f8e3ca;
  }

  .comparison-table tbody tr:nth-child(2) {
    background: #f6dfc7;
  }

  .comparison-table tbody td:first-child {
    text-align: left;
    padding-left: 4px;
  }

  .commerce-table {
    position: absolute;
    top: 63px;
    left: 54px;
    width: 435px;
    height: 83px;
    font-size: 14px;
    line-height: 18px;

  .commerce-table col:nth-child(1) { width: 75px; }

  .commerce-table col:nth-child(3) { width: 177px; }

  .commerce-table thead {

  .commerce-table thead tr {

  .commerce-table thead th {

  .commerce-table tbody tr {

  .commerce-table tbody td:first-child {

  .bottom-dashes {

    height: 5px;

  .bottom-dashes span {

    height: 2px;
    background: #eeb323;

  .bottom-band {

    width: 434px;
    height: 21px;

      <span class="brush-handle"></span>
      <span class="brush-metal"></span>
      <span class="brush-bristles"></span>

    <div class="lesson-pill-shadow"></div>

    <section class="section section-one">

      <div class="section-title-wrap">

      </div>

      <table class="comparison-table">
        <colgroup>
          <col><col><col><col><col>

        <thead>
          <tr>
            <th></th>

          </tr>
          <tr>

          <col><col><col>

        <thead>
          <tr>
            <th></th>
            <th>产品定位</th>
            <th>重点指标</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>抖音电商</td>

            <td>复购</td>
          </tr>
        </tbody>
      </table>
    </section>

    <div class="bottom-dashes" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
