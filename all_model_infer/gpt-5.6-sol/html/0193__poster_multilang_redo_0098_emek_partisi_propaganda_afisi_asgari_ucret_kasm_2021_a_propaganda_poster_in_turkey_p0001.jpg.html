<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emek Partisi Ankara İl Örgütü</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #aaa99c;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 7.5vh 0;
    }

    .poster {
      width: min(76vw, 900px);
      min-height: 1250px;
      background: #f1f1f4;
      transform: rotate(0.7deg);
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .top {
      position: relative;
      height: 510px;
      padding: 47px 32px 30px 125px;
      background: #f3e908;
    }

    .pushpins {
      position: absolute;
      left: 52px;
      top: 52px;
      display: flex;
      flex-direction: column;
      gap: 115px;
    }

    .pin {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #b72e31;
      box-shadow: 5px 8px 0 -3px #8f2730;
    }

    .pin::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 17px;
      width: 7px;
      height: 17px;
      border-radius: 0 0 5px 5px;
      background: #afb1bd;
      transform: rotate(-12deg);
    }

    .top-content {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      height: 100%;
    }

    .claims {
      position: relative;
      z-index: 2;
      width: 53%;
      color: #252525;
      font-size: clamp(35px, 4.7vw, 64px);
      font-weight: 800;
      line-height: 1.07;
      letter-spacing: -1px;
    }

    .claim {
      margin: 0 0 22px;
    }

    .claim:last-child {
      margin-top: 28px;
      margin-bottom: 0;
    }

    .illustration {
      position: relative;
      width: 42%;
      height: 300px;
      margin-top: 15px;
      border-radius: 50%;
      background: #de8b43;
      overflow: visible;
    }

    .illustration::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 23%;
      width: 66%;
      height: 15%;
      border-top: 17px solid #343131;
      border-right: 15px solid #343131;
      transform: rotate(34deg) skewX(-18deg);
    }

    .illustration::after {
      content: "";
      position: absolute;
      left: 22%;
      top: 43%;
      width: 58%;
      height: 22%;
      border-top: 16px solid #343131;
      border-right: 14px solid #343131;
      transform: rotate(-39deg) skewX(-12deg);
    }

    .arrow {
      position: absolute;
      right: 3%;
      top: 8%;
      width: 69%;
      height: 40%;
      border-top: 24px solid #c8323d;
      border-right: 24px solid #c8323d;
      transform: rotate(-17deg);
    }

    .arrow::after {
      content: "";
      position: absolute;
      right: -38px;
      top: -37px;
      width: 0;
      height: 0;
      border-left: 42px solid #c8323d;
      border-top: 33px solid transparent;
      border-bottom: 33px solid transparent;
      transform: rotate(-27deg);
    }

    .coin {
      position: absolute;
      left: 13%;
      bottom: 18%;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 8px solid #be9b25;
      border-radius: 50%;
      background: #e8dc38;
      color: #f4f4e8;
      font-size: 55px;
      font-weight: 800;
      box-shadow: 7px 7px 0 #353232;
    }

    .money {
      position: absolute;
      right: 13%;
      bottom: 18%;
      width: 112px;
      height: 73px;
      border: 8px solid #b6a92a;
      background: repeating-linear-gradient(
        to bottom,
        #e9d73f 0 11px,
        #f7e773 11px 17px
      );
      box-shadow: 7px 7px 0 #353232;
    }

    .money::before,
    .money::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 11px;
      height: 73px;
      background: rgba(255, 255, 255, 0.55);
    }

    .money::before {
      left: 22px;
    }

    .money::after {
      right: 23px;
    }

    .message {
      min-height: 280px;
      padding: 35px 43px 28px;
      color: #b72e31;
      font-size: clamp(38px, 5vw, 67px);
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: -2px;
    }

    .message p {
      margin: 0;
    }

    .minimum {
      min-height: 165px;
      display: flex;
      align-items: center;
      padding: 10px 35px 14px;
      background: #bd1f27;
      color: #f4f4f4;
      font-size: clamp(48px, 6.6vw, 86px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      white-space: nowrap;
    }

    .footer {
      min-height: 320px;
      position: relative;
      padding: 45px 42px 25px;
      color: #b72e31;
    }

    .party {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
    }

    .emblem {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 17px solid #b72e31;
      border-radius: 50%;
      background: #e8d32c;
      color: #b72e31;
      font-size: 26px;
      font-weight: 900;
      box-shadow:
        0 -22px 0 -12px #b72e31,
        0 22px 0 -12px #b72e31,
        22px 0 0 -12px #b72e31,
        -22px 0 0 -12px #b72e31;
    }

    .emblem::before,
    .emblem::after {
      content: "";
      position: absolute;
      background: #b72e31;
    }

    .emblem::before {
      width: 2px;
      height: 94px;
    }

    .emblem::after {
      width: 94px;
      height: 2px;
    }

    .party-name {
      font-size: clamp(27px, 3.6vw, 48px);
      font-weight: 900;
      line-height: 1.04;
    }

    .district {
      margin-top: 7px;
      font-size: clamp(17px, 2vw, 25px);
      font-weight: 800;
    }

    .contacts {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 20px;
      margin-top: 47px;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 700;
      white-space: nowrap;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social-icon {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #b72e31;
      font-size: 25px;
      font-weight: 900;
    }

    .facebook {
      font-family: Arial, Helvetica, sans-serif;
    }

    .instagram {
      border-radius: 10px;
      font-size: 22px;
    }

    .phone {
      border-radius: 50%;
      font-size: 22px;
      transform: rotate(-35deg);
    }

    @media (max-width: 700px) {
      body {
        padding: 0;
      }

      .poster {
        width: 100vw;
        min-height: 100vh;
        transform: none;
      }

      .top {
        height: 43vw;
        min-height: 330px;
        padding-left: 18%;
      }

      .pushpins {
        left: 7%;
        top: 11%;
        gap: 19vw;
      }

      .pin {
        transform: scale(0.75);
      }

      .illustration {
        height: 43vw;
        margin-top: 5%;
      }

      .coin {
        width: 70px;
        height: 70px;
        font-size: 35px;
        border-width: 5px;
      }

      .money {
        width: 75px;
        height: 48px;
        border-width: 5px;
      }

      .money::before,
      .money::after {
        height: 48px;
        top: -5px;
      }

      .message {
        min-height: 24vw;
        padding: 4% 5%;
      }

      .minimum {
        min-height: 14vw;
        padding-left: 4%;
      }

      .footer {
        min-height: 265px;
        padding: 6% 4% 3%;
      }

      .party {
        gap: 18px;
      }

      .emblem {
        width: 85px;
        height: 85px;
        border-width: 11px;
        font-size: 17px;
      }

      .emblem::before {
        height: 63px;
      }

      .emblem::after {
        width: 63px;
      }

      .contacts {
        margin-top: 35px;
        gap: 10px;
        font-size: clamp(11px, 2.8vw, 18px);
      }

      .social-icon {
        width: 28px;
        height: 28px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="poster">
    <section class="top">
      <div class="pushpins" aria-hidden="true">
        <span class="pin"></span>
        <span class="pin"></span>
        <span class="pin"></span>
      </div>

      <div class="top-content">
        <div class="claims">
          <p class="claim">Enflasyon<br>yükseliyor</p>
          <p class="claim">TL değer<br>kaybediyor</p>
          <p class="claim">Ücretler eriyor</p>
        </div>

        <div class="illustration placeholder" role="img" aria-label="[Illustration]">
          <div class="arrow"></div>
          <div class="coin">1</div>
          <div class="money"></div>
        </div>
      </div>
    </section>

    <section class="message">
      <p>Vergiden muaf,<br>İnsanca yaşanacak</p>
    </section>

    <section class="minimum">
      ASGARİ ÜCRET!
    </section>

    <footer class="footer">
      <div class="party">
        <div class="emblem" aria-label="EMEP">EMEP</div>
        <div>
          <div class="party-name">EMEK<br>PARTİSİ</div>
          <div class="district">Ankara İl Örgütü</div>
        </div>
      </div>

      <div class="contacts">
        <div class="contact">
          <span class="social-icon facebook">f</span>
          <span>/ankaraemep</span>
        </div>
        <div class="contact">
          <span class="social-icon instagram">◎</span>
          <span>@emepankara</span>
        </div>
        <div class="contact">
          <span class="social-icon phone">☎</span>
          <span>0 (312) 232 41 97</span>
        </div>
      </div>
    </footer>
  </main>
</body>
</html>
