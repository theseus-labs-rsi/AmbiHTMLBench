<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anything's Possible Prime Video Poster</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #efd5df;
    font-family: Arial, Helvetica, sans-serif;
  }

  .canvas {
    position: relative;
    width: 510px;
    height: 755px;
    background: #efd5df;
    overflow: hidden;
  }

  .poster {
    position: absolute;
    top: 19px;
    left: 19px;
    width: 472px;
    height: 716px;
    overflow: hidden;
    background: #fff;
  }

  .prime-logo {
    position: absolute;
    z-index: 5;
    top: 4px;
    left: 0;
    width: 100%;
    color: #080808;
    text-align: center;
  }

  .prime-logo .wordmark {
    font-size: 43px;
    line-height: 52px;
    font-weight: 700;
    letter-spacing: -1.7px;
  }

  .smile {
    position: absolute;
    top: 46px;
    left: 178px;
    width: 116px;
    height: 29px;
    border-bottom: 5px solid #080808;
    border-radius: 0 0 70% 70%;
    transform: rotate(1deg);
  }

  .smile::after {
    content: "";
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 14px;
    height: 14px;
    border-top: 5px solid #080808;
    border-right: 5px solid #080808;
    border-radius: 2px;
    transform: rotate(-18deg);
  }

  .director-intro {
    position: absolute;
    z-index: 6;
    top: 98px;
    left: 111px;
    width: 250px;
    color: #18234f;
    text-align: center;
    text-transform: uppercase;
  }

  .director-intro .small {
    display: block;
    font-size: 9.5px;
    line-height: 13px;
    font-weight: 500;
    letter-spacing: 1.35px;
  }

  .director-intro .name {
    display: block;
    font-size: 14px;
    line-height: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
  }

  .tagline {
    position: absolute;
    z-index: 7;
    top: 135px;
    left: 199px;
    width: 77px;
    color: #c43a72;
    text-align: center;
    text-transform: uppercase;
    font-size: 11px;
    line-height: 17px;
    letter-spacing: 1.25px;
  }

  .cast-photo {
    position: absolute;
    z-index: 1;
    top: 106px;
    left: 30px;
    width: 410px;
    height: 532px;
    margin: 0;
    overflow: hidden;
    border: 0;
    background:
      radial-gradient(ellipse at 75% 18%, #d4d4d4 0 10%, transparent 11%),
      radial-gradient(ellipse at 33% 34%, #d7d7d7 0 14%, transparent 15%),
      linear-gradient(to bottom, transparent 0 22%, #f4f4f4 43%, #ebebeb 75%, rgba(255,255,255,.15) 92%, transparent 100%);
  }

  .cast-photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 73%, rgba(255,255,255,.95) 98%);
  }

  .cast-photo figcaption {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    width: 220px;
    padding: 3px 5px;
    color: #888;
    background: rgba(255,255,255,.72);
    text-align: center;
    font-size: 9px;
    letter-spacing: .2px;
  }

  .title {
    position: absolute;
    z-index: 9;
    top: 535px;
    left: 29px;
    width: 420px;
    height: 100px;
    white-space: nowrap;
  }

  .title .anything {
    position: relative;
    display: inline-block;
    color: #151b62;
    font-family: "Brush Script MT", "Segoe Script", "Snell Roundhand", cursive;
    font-size: 58px;
    font-weight: 400;
    line-height: 86px;
    letter-spacing: -4px;
    transform: rotate(-3deg);
  }

  .title .possible {
    position: relative;
    display: inline-block;
    margin-left: -11px;
    color: #dd2270;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 49px;
    line-height: 72px;
    font-weight: 800;
    letter-spacing: -2.6px;
  }

  .credits {
    position: absolute;
    z-index: 10;
    top: 639px;
    left: 47px;
    width: 378px;
    height: 30px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: #15205c;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .credit-block {
    display: flex;
    align-items: flex-start;
  }

  .credit-label {
    margin-top: 4px;
    margin-right: 3px;
    color: #8a8a9c;
    font-size: 5px;
    line-height: 6px;
    font-weight: 500;
    text-align: right;
  }

  .credit-name {
    font-size: 12px;
    line-height: 17px;
    font-weight: 800;
    letter-spacing: 1.25px;
  }

  .credit-divider-space {
    width: 8px;
  }

  .footer {
    position: absolute;
    z-index: 11;
    bottom: 8px;
    left: 11px;
    width: 450px;
    height: 38px;
  }

  .orion {
    position: absolute;
    left: 0;
    bottom: 6px;
    width: 42px;
    color: #8781bd;
    font-size: 8px;
    line-height: 9px;
    font-style: italic;
    font-weight: 700;
    letter-spacing: -.5px;
    text-align: center;
  }

  .orion::after {
    content: "";
    display: block;
    width: 34px;
    margin: -1px auto 0;
    border-bottom: 1px solid #8781bd;
    transform: skewX(-25deg);
  }

  .ua {
    position: absolute;
    left: 57px;
    bottom: 4px;
    width: 29px;
    color: #aaa5ca;
    font-family: Georgia, serif;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }

  .release {
    position: absolute;
    left: 98px;
    bottom: 0;
    display: flex;
    align-items: center;
    height: 38px;
    color: #0a0a0a;
  }

  .date {
    font-size: 21px;
    line-height: 29px;
    font-weight: 800;
    letter-spacing: .8px;
    white-space: nowrap;
  }

  .vertical-rule {
    width: 2px;
    height: 38px;
    margin: 0 15px;
    background: #111;
  }

  .new-movie {
    font-size: 22px;
    line-height: 29px;
    font-weight: 400;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .rating {
    position: absolute;
    right: 56px;
    bottom: 7px;
    width: 32px;
    min-height: 14px;
    padding: 2px 1px;
    border: 1px solid #c4bfd5;
    color: #9993b8;
    text-align: center;
    font-size: 4.5px;
    line-height: 5px;
    text-transform: uppercase;
  }

  .studios {
    position: absolute;
    right: 0;
    bottom: 4px;
    width: 43px;
    color: #77738f;
    text-align: center;
    text-transform: uppercase;
    font-size: 5.5px;
    line-height: 7px;
    letter-spacing: 1.8px;
  }

  @media (max-width: 510px) {
    .canvas {
      transform-origin: top center;
      transform: scale(calc(100vw / 510));
      margin-bottom: calc((100vw / 510 - 1) * 755px);
      flex: 0 0 510px;
    }
  }
</style>
</head>
<body>
  <main class="canvas">
    <section class="poster" aria-label="Anything's Possible movie poster">
      <header class="prime-logo" aria-label="prime video">
        <div class="wordmark">prime video</div>
        <div class="smile" aria-hidden="true"></div>
      </header>

      <div class="director-intro">
        <span class="small">FROM THE HEART &amp; SOUL OF DIRECTOR</span>
        <span class="name">BILLY PORTER</span>
      </div>

      <div class="tagline">
        WHEN IT<br>
        COMES<br>
        TO LOVE...
      </div>

      <figure class="placeholder cast-photo">
        <figcaption>[Photo: two people, centered]</figcaption>
      </figure>

      <div class="title" aria-label="anything's possible">
        <span class="anything">anything's</span><span class="possible">possible</span>
      </div>

      <div class="credits">
        <div class="credit-block">
          <span class="credit-label">WRITTEN<br>BY</span>
          <span class="credit-name">XIMENA GARCÍA LECUONA</span>
        </div>
        <span class="credit-divider-space"></span>
        <div class="credit-block">
          <span class="credit-label">DIRECTED<br>BY</span>
          <span class="credit-name">BILLY PORTER</span>
        </div>
      </div>

      <footer class="footer">
        <div class="orion">ORION</div>
        <div class="ua">UA</div>

        <div class="release">
          <span class="date">JULY 22</span>
          <span class="vertical-rule" aria-hidden="true"></span>
          <span class="new-movie">NEW MOVIE</span>
        </div>

        <div class="rating">[illegible]</div>

        <div class="studios">
          AMAZON<br>
          STUDIOS
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
