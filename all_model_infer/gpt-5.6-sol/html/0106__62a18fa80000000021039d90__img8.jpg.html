<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫砂都有哪些款？</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f4dfd2;
      color: #25272b;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    .canvas {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #f4dfd2;
    }

    .sheet {
      position: absolute;
      top: 54px;
      left: 15px;
      width: 510px;
      height: 643px;
      padding: 39px 12px 12px;
      background: #fff;
      border: 5px solid #a6ceca;
      border-radius: 12px;
    }

    .title {
      position: absolute;
      z-index: 4;
      top: 20px;
      left: 79px;
      width: 383px;
      height: 69px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      background: #fff;
      border: 5px solid #a6ceca;
      border-radius: 12px;
      color: #292b2d;
      font-size: 37px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 1px 1px 0 #777;
    }

    .question-mark {
      margin-left: 10px;
      color: #ffdf46;
      font-family: Arial, sans-serif;
      font-size: 49px;
      font-weight: 900;
      -webkit-text-stroke: 4px #25282b;
      paint-order: stroke fill;
      text-shadow: none;
      transform: translateY(-1px);
    }

    .section-heading {
      position: relative;
      z-index: 2;
      height: 39px;
      display: flex;
      align-items: center;
      padding-left: 18px;
      color: #ffdf51;
      font-size: 21px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      text-shadow:
        -2px -2px 0 #25282b,
         2px -2px 0 #25282b,
        -2px  2px 0 #25282b,
         2px  2px 0 #25282b,
         0    3px 0 #25282b;
    }

    .pin {
      position: absolute;
      left: 1px;
      top: 9px;
      width: 11px;
      height: 11px;
      border: 2px solid #bc3541;
      border-radius: 50%;
      background: #f05d63;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }

    .pin::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 3px;
      width: 3px;
      height: 11px;
      background: #8d3037;
      transform: rotate(-5deg);
      transform-origin: top;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      color: #282b30;
      font-size: 17px;
      line-height: 1.38;
    }

    th,
    td {
      border: 1px solid #d7d7d7;
      text-align: center;
      vertical-align: middle;
      font-weight: 500;
    }

    th {
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .size-table th {
      height: 50px;
      background: #626b7c;
    }

    .size-table td {
      height: 57px;
      padding: 3px 7px;
    }

    .size-table col {
      width: 25%;
    }

    .circle {
      position: relative;
      display: inline-block;
      z-index: 2;
    }

    .circle::after {
      content: "";
      position: absolute;
      z-index: -1;
      border: 3px solid rgba(200, 83, 95, 0.72);
      border-radius: 50%;
      transform: rotate(-10deg);
    }

    .circle-size::after {
      top: -17px;
      left: -14px;
      width: 72px;
      height: 43px;
    }

    .size-note {
      position: absolute;
      z-index: 4;
      top: 229px;
      left: 66px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      text-shadow:
        -2px -2px 0 #202226,
         2px -2px 0 #202226,
        -2px  2px 0 #202226,
         2px  2px 0 #202226,
         0    3px 0 #202226;
    }

    .second-header-row {
      position: relative;
      height: 48px;
      display: flex;
      align-items: flex-end;
    }

    .second-header-row .section-heading {
      width: 100%;
      padding-bottom: 8px;
    }

    .summary {
      position: absolute;
      z-index: 5;
      right: 4px;
      top: 9px;
      min-width: 199px;
      height: 33px;
      padding: 4px 10px 3px;
      background: #bd351d;
      color: #fff;
      font-size: 16px;
      line-height: 26px;
      white-space: nowrap;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    }

    .type-table col:nth-child(1) {
      width: 23.5%;
    }

    .type-table col:nth-child(2) {
      width: 33.5%;
    }

    .type-table col:nth-child(3) {
      width: 43%;
    }

    .type-table th {
      height: 37px;
      background: #2b6e77;
    }

    .type-table td {
      height: 49px;
      padding: 3px 6px;
    }

    .type-table tr:nth-child(3) td {
      height: 62px;
    }

    .type-table tr:nth-child(4) td {
      height: 63px;
    }

    .type-table tr:nth-child(5) td {
      height: 40px;
    }

    .type-table tr:nth-child(6) td {
      height: 40px;
    }

    .circle-type::after {
      top: -10px;
      left: -13px;
      width: 83px;
      height: 47px;
      transform: rotate(-8deg);
    }

    .ratio {
      color: #d73539;
      font-weight: 900;
      white-space: nowrap;
    }

    .family-note {
      position: absolute;
      z-index: 6;
      left: 46px;
      top: 536px;
      color: #ffeb62;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      text-shadow:
        -2px -2px 0 #34363a,
         2px -2px 0 #34363a,
        -2px  2px 0 #34363a,
         2px  2px 0 #34363a;
    }

    .home-icon {
      display: inline-flex;
      position: relative;
      top: 2px;
      width: 18px;
      height: 16px;
      margin-right: 3px;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: #447d9e;
      color: #fff;
      font-size: 13px;
      text-shadow: none;
    }

    .check {
      display: inline-flex;
      width: 18px;
      height: 18px;
      margin-left: 4px;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: #08ad39;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 900;
      text-shadow: none;
    }

    @media (max-width: 540px) {
      .canvas {
        width: 100vw;
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="title">
      猫砂都有哪些款<span class="question-mark">?</span>
    </div>

    <section class="sheet">
      <div class="section-heading">
        <span class="pin" aria-hidden="true"></span>
        三种猫砂尺寸哪个是你最爱
      </div>

      <table class="size-table">
        <colgroup>
          <col><col><col><col>
        </colgroup>
        <thead>
          <tr>
            <th>尺寸</th>
            <th>重量</th>
            <th>结团效果</th>
            <th>其他</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1.5mm</td>
            <td>轻</td>
            <td>上</td>
            <td>易带出，价格<br>略高</td>
          </tr>
          <tr>
            <td><span class="circle circle-size">2mm</span></td>
            <td>中</td>
            <td>中</td>
            <td>综合性价比高</td>
          </tr>
          <tr>
            <td>3mm</td>
            <td>重</td>
            <td>67</td>
            <td>推荐度低，但<br>价格也低</td>
          </tr>
        </tbody>
      </table>

      <div class="size-note">综合性价比推荐</div>

      <div class="second-header-row">
        <div class="section-heading">
          <span class="pin" aria-hidden="true"></span>
          猫砂都有哪些种类
        </div>
        <div class="summary">总结：2mm混合砂yyyds</div>
      </div>

      <table class="type-table">
        <colgroup>
          <col><col><col>
        </colgroup>
        <thead>
          <tr>
            <th>种类</th>
            <th>优点</th>
            <th>其他</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>膨润土</td>
            <td>价格低廉</td>
            <td>粉尘大</td>
          </tr>
          <tr>
            <td>豆腐猫砂</td>
            <td>原料更安全，闻起来<br>也比较好</td>
            <td>价格偏高，纯豆腐结团略差</td>
          </tr>
          <tr>
            <td><span class="circle circle-type">混合猫砂</span></td>
            <td>结合上述优点，价格<br>适中</td>
            <td>比例推荐 <span class="ratio">7:3或6:4</span>，结团<br>快且用量省</td>
          </tr>
          <tr>
            <td>沸石</td>
            <td>可循环利用</td>
            <td>需要自己洗</td>
          </tr>
          <tr>
            <td>其他新型原料</td>
            <td>价格高，新颖</td>
            <td>效果待考核，贵</td>
          </tr>
        </tbody>
      </table>

      <div class="family-note">
        <span class="home-icon">⌂</span>普通养宠家庭足以满足需求<span class="check">✓</span>
      </div>
    </section>
  </main>
</body>
</html>
