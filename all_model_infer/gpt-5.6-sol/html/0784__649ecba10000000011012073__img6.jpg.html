<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #52618f;
  }

  body {
    display: flex;
    justify-content: center;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 720px;
    overflow: hidden;
    background: #52618f;
  }

  .vertical {
    position: absolute;
    writing-mode: vertical-rl;
    -webkit-writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
  }

  .title-column {
    top: 112px;
    color: #29345d;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
    font-size: 48px;
    line-height: 1;
    letter-spacing: 14px;
    font-weight: 400;
  }

  .title-right {
    right: 42px;
  }

  .title-left {
    right: 114px;
  }

  .poem-column {
    top: 186px;
    color: #fffbe8;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
    font-size: 34px;
    line-height: 1;
    letter-spacing: 6px;
    font-weight: 400;
    text-shadow: 0 1px 1px rgba(33, 39, 63, 0.5);
  }

  .poem-right {
    right: 298px;
  }

  .poem-left {
    right: 355px;
  }

  .author {
    left: 25px;
    color: rgba(255, 252, 232, 0.82);
    font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
    font-weight: 400;
    text-shadow: 0 1px 1px rgba(38, 44, 69, 0.45);
  }

  .dynasty {
    top: 113px;
    font-size: 16px;
    letter-spacing: 1px;
  }

  .name {
    top: 156px;
    font-size: 17px;
    letter-spacing: 2px;
  }

  .work-title {
    top: 216px;
    font-size: 16px;
    letter-spacing: 2px;
  }

  .footer {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 45px;
    border-top: 1px solid #e9dbb9;
    background: #fff4d9;
    color: #36342f;
    text-align: center;
    padding-top: 14px;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    font-size: 11px;
    line-height: 16px;
    letter-spacing: 0.45px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="page">
    <div class="vertical title-column title-right">朝辞白帝彩云间</div>
    <div class="vertical title-column title-left">千里江陵一日还</div>

    <div class="vertical poem-column poem-right">两岸猿声啼不住，</div>
    <div class="vertical poem-column poem-left">轻舟已过万重山。</div>

    <div class="vertical author dynasty">唐</div>
    <div class="vertical author name">李白</div>
    <div class="vertical author work-title">早发白帝城</div>

    <footer class="footer">两岸猿声，还在耳边不停地啼叫；不知不觉，轻舟已穿过万重青山。</footer>
  </main>
</body>
</html>
