<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4.语法</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 0;
      background: #79b39b;
    }

    .paper {
      position: relative;
      width: 416px;
      min-height: 672px;
      padding: 52px 16px 38px;
      overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(rgba(192, 204, 200, 0.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(192, 204, 200, 0.22) 1px, transparent 1px);
      background-size: 21.2px 21.2px;
      box-shadow: 0 1px 2px rgba(45, 91, 73, 0.18);
      color: #252525;
      font-family: "KaiTi", "STKaiti", "Kaiti SC", "FangSong", serif;
    }

    .top-strip {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #fff;
      border-bottom: 1px solid rgba(192, 204, 200, 0.22);
    }

    .binding {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
    }

    .binding span {
      position: relative;
      display: block;
      width: 20px;
      height: 28px;
      background: #79b39b;
      border-radius: 0 0 11px 11px;
    }

    .binding span::after {
      content: "";
      position: absolute;
      top: 24px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #79b39b;
    }

    h1 {
      position: relative;
      z-index: 4;
      margin: 4px 0 12px;
      text-align: center;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .content {
      position: relative;
      z-index: 4;
      font-size: 20px;
      line-height: 1.42;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      text-align: left;
    }

    .paragraph-one {
      margin-bottom: 27px;
    }

    .paragraph-two {
      margin: 0 11px 28px;
      text-align: center;
    }

    .paragraph-three {
      margin-bottom: 27px;
    }

    .paragraph-four {
      text-align: center;
    }

    .mark {
      position: relative;
      display: inline;
    }

    .mark::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -1px;
      right: -1px;
      bottom: 1px;
      height: 7px;
      border-radius: 50%;
      background: rgba(250, 221, 57, 0.72);
      transform: rotate(-3deg);
    }

    .mark-short::after {
      left: 1px;
      right: 2px;
      transform: rotate(3deg);
    }

    .star {
      position: absolute;
      z-index: 5;
      width: 23px;
      height: 23px;
      color: rgba(242, 215, 65, 0.64);
      font-family: Arial, sans-serif;
      font-size: 29px;
      font-weight: 400;
      line-height: 23px;
      transform: rotate(-12deg);
    }

    .star-one {
      top: 197px;
      left: 45px;
    }

    .star-two {
      bottom: 53px;
      left: 48px;
    }

    .flower {
      position: absolute;
      z-index: 6;
      right: 17px;
      bottom: 14px;
      width: 54px;
      height: 54px;
    }

    .petal,
    .flower-center {
      position: absolute;
      border: 2px solid #dd696d;
      background: transparent;
    }

    .petal {
      left: 20px;
      top: 2px;
      width: 15px;
      height: 24px;
      border-radius: 50%;
      transform-origin: 7px 25px;
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(45deg); }
    .petal:nth-child(3) { transform: rotate(90deg); }
    .petal:nth-child(4) { transform: rotate(135deg); }
    .petal:nth-child(5) { transform: rotate(180deg); }
    .petal:nth-child(6) { transform: rotate(225deg); }
    .petal:nth-child(7) { transform: rotate(270deg); }
    .petal:nth-child(8) { transform: rotate(315deg); }

    .flower-center {
      left: 20px;
      top: 20px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
    }

    .leaves {
      position: absolute;
      z-index: 5;
      right: 1px;
      bottom: -1px;
      width: 31px;
      height: 31px;
      border-left: 2px solid #69aa90;
      transform: rotate(-38deg);
      transform-origin: bottom left;
    }

    .leaf {
      position: absolute;
      width: 13px;
      height: 8px;
      border: 2px solid #69aa90;
      border-radius: 100% 0 100% 0;
      background: #fff;
    }

    .leaf-one {
      left: -13px;
      top: 7px;
      transform: rotate(22deg);
    }

    .leaf-two {
      left: 1px;
      top: 13px;
      transform: rotate(54deg);
    }

    .leaf-three {
      left: -12px;
      top: 20px;
      transform: rotate(16deg);
    }

    @media (max-width: 440px) {
      body {
        padding: 0;
      }

      .paper {
        width: 100vw;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <main class="paper">
    <div class="top-strip"></div>

    <div class="binding" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span>
    </div>

    <h1>4.语法</h1>

    <section class="content">
      <p class="paragraph-one">
        语法是语言的框架。光知道单词却不懂<br>
        语法，你就无法完整地说出一个句子，<br>
        有时候还可能让人产生误解；单词都认<br>
        识<span class="mark mark-short">，但</span>是凑在一起就不知道句子是什么<br>
        意思，也会感到尴尬。
      </p>

      <p class="paragraph-two">
        虽然提起学语法，大家都是感觉头都<br>
        大，各种时态错综复杂怎么记？<span class="mark">但是</span>任<br>
        何一门学科都是由浅入深的，<span class="mark">英语</span>也不<br>
        例外。
      </p>

      <p class="paragraph-three">
        学习语法就像造房子，首先要把基础的<br>
        语法脉络理清，打好根基，之后再慢慢<br>
        补充和拓展，让知识巩固起来。
      </p>

      <p class="paragraph-four">
        零基础的同学在学习英语语法时可以先<br>
        从简单的开始，比如五大基本句型和八<br>
        大时态等。
      </p>
    </section>

    <div class="star star-one" aria-hidden="true">☆</div>
    <div class="star star-two" aria-hidden="true">☆</div>

    <div class="flower" aria-hidden="true">
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="flower-center"></span>
    </div>

    <div class="leaves" aria-hidden="true">
      <span class="leaf leaf-one"></span>
      <span class="leaf leaf-two"></span>
      <span class="leaf leaf-three"></span>
    </div>
  </main>
</body>
</html>
