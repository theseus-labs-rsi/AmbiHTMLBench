<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2017年 12月第一套 Text 1</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #151515;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5vw;
    }

    .document {
      position: relative;
      width: min(100vw - 3vw, 1024px);
      aspect-ratio: 1.3333;
      overflow: hidden;
      border: 3px solid #151515;
      background:
        radial-gradient(circle at 50% 55%, rgba(255,255,255,.98), rgba(246,246,244,.98) 68%, rgba(226,226,222,.96));
      color: #222;
      transform: rotate(-0.15deg);
      box-shadow: 0 1px 8px rgba(0,0,0,.55);
    }

    .status {
      position: absolute;
      top: 0.6%;
      left: 0.8%;
      z-index: 4;
      font-family: Arial, sans-serif;
      font-size: clamp(5px, .72vw, 8px);
      color: #171717;
      white-space: nowrap;
    }

    .camera {
      position: absolute;
      top: 2.2%;
      left: 28%;
      width: 7.3%;
      aspect-ratio: 1;
      border-radius: 17%;
      background: rgba(105,105,105,.72);
      box-shadow: inset 0 0 0 1px rgba(80,80,80,.2);
    }

    .camera::after {
      content: "";
      position: absolute;
      width: 42%;
      aspect-ratio: 1;
      top: 29%;
      left: 29%;
      border-radius: 50%;
      background: rgba(180,180,180,.4);
    }

    .video-inset {
      position: absolute;
      z-index: 3;
      top: 2.1%;
      right: 0.8%;
      width: 18.2%;
      height: 14.2%;
      overflow: hidden;
      border: 2px solid #222;
      background:
        linear-gradient(90deg, #a9b0a4 0 18%, #e3d7ba 18% 45%, #70665d 45% 65%, #c3b58e 65% 100%);
    }

    .video-inset::before {
      content: "";
      position: absolute;
      left: 39%;
      top: 13%;
      width: 27%;
      height: 54%;
      border-radius: 48% 48% 42% 42%;
      background: #d4a08e;
      box-shadow:
        -10px 7px 0 -4px #2b2524,
        10px 7px 0 -4px #2b2524;
    }

    .video-inset::after {
      content: "";
      position: absolute;
      left: 25%;
      bottom: 0;
      width: 53%;
      height: 35%;
      border-radius: 50% 50% 0 0;
      background: #5e7891;
    }

    .main {
      position: absolute;
      top: 21.5%;
      left: 10.5%;
      right: 8%;
      bottom: 9%;
      font-size: clamp(12px, 1.7vw, 22px);
    }

    .heading {
      margin: 0 0 3.6% 0;
      color: #d84242;
      font-size: 1em;
      font-weight: 600;
    }

    .line {
      color: #df3f3f;
      white-space: nowrap;
      line-height: 1.35;
    }

    .line-one {
      margin-bottom: 8.5%;
    }

    .title {
      margin: 0 0 4% 17%;
      color: #222;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 1.28em;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 51% 49%;
      grid-template-rows: auto auto auto;
      column-gap: 0;
      row-gap: 2.1em;
      color: #df3f3f;
    }

    .item {
      line-height: 1.25;
      white-space: nowrap;
    }

    .item-two {
      grid-column: 1 / 3;
      margin-bottom: .05em;
    }

    .item-three {
      grid-column: 1;
    }

    .item-six {
      grid-column: 2;
      padding-left: 4%;
    }

    .item-four {
      grid-column: 1;
    }

    .item-note {
      grid-column: 2;
      padding-left: 12%;
    }

    .item-five {
      grid-column: 1;
      margin-top: -.1em;
    }

    .placeholder {
      position: absolute;
      pointer-events: none;
      color: transparent;
      font-size: 0;
    }

    .placeholder span {
      visibility: hidden;
    }

    @media (max-width: 600px) {
      body {
        padding: 1vw;
      }

      .document {
        width: 98vw;
      }

      .main {
        left: 10%;
        right: 5%;
      }

      .content-grid {
        row-gap: 1.8em;
      }
    }
  </style>
</head>
<body>
  <main class="document">
    <div class="status">19:29&nbsp;&nbsp;5月14日周五</div>
    <div class="camera" aria-hidden="true"></div>

    <figure class="placeholder video-inset" aria-label="视频画面">
      <figcaption><span>[视频画面]</span></figcaption>
    </figure>

    <section class="main">
      <p class="heading">固化的做题思维：</p>

      <div class="line line-one">1. 喜欢关于自己的内心和感觉。</div>

      <h1 class="title">2017年&nbsp; 12月第一套 Text 1</h1>

      <div class="content-grid">
        <div class="item item-two">2. 喜欢选符合常识的选项。&nbsp;&nbsp;&nbsp;&nbsp;20年左右的常识和经验的累积</div>
        <div class="item item-three">3. 喜欢选自己认识的选项。</div>
        <div class="item item-six">6. 圈圈套套选择法</div>
        <div class="item item-four">4. 喜欢选自己不认识的选项。</div>
        <div class="item item-note">（有逃避，有厌烦）</div>
        <div class="item item-five">5. 火急火燎一把火</div>
      </div>
    </section>
  </main>
</body>
</html>
