<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAY3 特色路线</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eee;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      color: #111;
    }

    .placeholder {
      position: absolute;
      overflow: hidden;
      margin: 0;
      border: 0;
    }

    .placeholder figcaption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .day {
      position: absolute;
      top: 29px;
      left: 38px;
      z-index: 3;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 45px;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      transform: rotate(-2deg);
      -webkit-text-stroke: 7px #efa64c;
      paint-order: stroke fill;
      text-shadow: 1px 2px 0 #d7792d;
    }

    .day-doodle {
      position: absolute;
      top: 17px;
      left: 7px;
      width: 50px;
      height: 42px;
    }

    .title {
      position: absolute;
      top: 32px;
      left: 209px;
      width: 319px;
      height: 60px;
      border-radius: 22px;
      background: #b9ec00;
      font-size: 45px;
      font-weight: 900;
      line-height: 60px;
      text-align: center;
      letter-spacing: -2px;
    }

    .art-copy {
      position: absolute;
      top: 111px;
      left: 219px;
      z-index: 4;
      width: 82px;
      color: #705495;
      font-family: SimSun, "Songti SC", serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 23px;
    }

    .beach {
      top: 179px;
      left: 31px;
      width: 192px;
      height: 130px;
      background:
        radial-gradient(ellipse at 27% 45%, #a88a58 0 23%, transparent 24%),
        radial-gradient(ellipse at 65% 43%, #9c8154 0 30%, transparent 31%),
        linear-gradient(90deg, transparent 24%, #4d3b26 25% 27%, transparent 28%),
        linear-gradient(90deg, transparent 67%, #483a27 68% 70%, transparent 71%),
        linear-gradient(to bottom, #3788d2 0 51%, #65b4d1 52% 64%, #e7d6b2 65%);
    }

    .sunset {
      top: 123px;
      left: 301px;
      width: 203px;
      height: 138px;
      background:
        radial-gradient(circle at 29% 50%, #f55c50 0 3px, transparent 4px),
        linear-gradient(174deg, transparent 61%, #332a30 62% 64%, transparent 65%),
        linear-gradient(to bottom, #dd8d7f, #dca08e 49%, #a87f80 51%, #786b78);
    }

    .island {
      top: 363px;
      left: 9px;
      width: 201px;
      height: 137px;
      background:
        linear-gradient(164deg, transparent 54%, #245d83 55% 61%, transparent 62%),
        linear-gradient(to bottom, #2179dc 0 60%, #7ec2d6 61% 68%, #b2bbb8 69%);
    }

    .cable {
      top: 326px;
      left: 316px;
      width: 204px;
      height: 138px;
      background:
        linear-gradient(145deg, transparent 48%, rgba(29, 44, 45, .85) 49% 50%, transparent 51%),
        linear-gradient(16deg, transparent 58%, rgba(29, 44, 45, .55) 59% 60%, transparent 61%),
        linear-gradient(to bottom, #77c0e6 0 60%, #3d8e82 61% 71%, #c5b48e 72%);
    }

    .station {
      top: 518px;
      left: 181px;
      width: 211px;
      height: 142px;
      background:
        linear-gradient(90deg, transparent 19%, #edf2ef 20% 31%, transparent 32%),
        linear-gradient(90deg, transparent 37%, #f6f5ef 38% 54%, transparent 55%),
        linear-gradient(to bottom, #b2c3cf 0 50%, #80966a 51% 71%, #829caa 72%);
    }

    .wind {
      position: absolute;
      width: 3px;
      height: 67px;
      background: #4e5960;
      transform-origin: bottom center;
    }

    .wind::before,
    .wind::after {
      content: "";
      position: absolute;
      left: 1px;
      bottom: 61px;
      width: 45px;
      height: 2px;
      background: #53636b;
      transform-origin: left center;
    }

    .wind::before {
      transform: rotate(20deg);
    }

    .wind::after {
      transform: rotate(143deg);
    }

    .wind.one {
      left: 235px;
      top: 532px;
      transform: rotate(-3deg);
    }

    .wind.two {
      left: 320px;
      top: 550px;
      height: 50px;
      transform: scale(.72);
    }

    .label {
      position: absolute;
      z-index: 5;
      height: 31px;
      padding: 2px 13px 3px 22px;
      border-radius: 48% 16px 48% 12px;
      background: #ffd0bc;
      font-family: SimSun, "Songti SC", serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 26px;
      white-space: nowrap;
    }

    .label::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff9a8f 0 18%, #d8453c 23% 67%, #9b2924 70%);
      box-shadow: 0 1px 2px #7d3932;
    }

    .label::after {
      content: "";
      position: absolute;
      left: 9px;
      top: 16px;
      width: 2px;
      height: 15px;
      background: #9d4139;
    }

    .beach-label {
      top: 309px;
      left: 63px;
    }

    .sunset-label {
      top: 262px;
      left: 299px;
      padding-left: 21px;
    }

    .island-label {
      top: 496px;
      left: 52px;
    }

    .cable-label {
      top: 461px;
      left: 340px;
    }

    .station-label {
      top: 658px;
      left: 202px;
    }

    .copy {
      position: absolute;
      z-index: 6;
      color: #71558f;
      font-family: SimSun, "Songti SC", serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
    }

    .cliff-copy {
      top: 394px;
      left: 224px;
      width: 93px;
    }

    .coast-copy {
      top: 636px;
      left: 15px;
      width: 174px;
      line-height: 25px;
    }

    .mountain-copy {
      top: 580px;
      left: 405px;
      width: 126px;
      line-height: 25px;
    }

    .taxi {
      position: absolute;
      z-index: 8;
      color: #e64518;
      font-family: SimSun, "Songti SC", serif;
      font-size: 19px;
      font-weight: 900;
      line-height: 22px;
    }

    .taxi-11 {
      top: 306px;
      left: 260px;
    }

    .taxi-33 {
      top: 296px;
      left: 408px;
    }

    .taxi-5 {
      top: 581px;
      left: 22px;
    }

    .taxi-20 {
      top: 523px;
      left: 467px;
    }

    .routes {
      position: absolute;
      inset: 0;
      z-index: 7;
      width: 540px;
      height: 720px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <svg class="day-doodle" viewBox="0 0 50 42" aria-hidden="true">
      <path d="M3 29 C12 31,18 35,24 34 C19 29,13 24,10 20 C17 21,24 26,30 28 C27 19,24 13,25 7 C29 13,33 19,36 21 C36 13,37 7,40 4"
            fill="none" stroke="#efa64c" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="45" cy="8" rx="3" ry="6" fill="none" stroke="#efa64c" stroke-width="2"/>
    </svg>

    <div class="day">DAY3</div>
    <div class="title">3.特色路线</div>
    <div class="art-copy">艺术感满<br>满，适合<br>出片</div>

    <figure class="placeholder beach">
      <figcaption>[Photo: beach umbrellas]</figcaption>
    </figure>

    <figure class="placeholder sunset">
      <figcaption>[Photo: 那香海落日]</figcaption>
    </figure>

    <figure class="placeholder island">
      <figcaption>[Photo: 鸡鸣岛]</figcaption>
    </figure>

    <figure class="placeholder cable">
      <figcaption>[Photo: 摩天岭索道]</figcaption>
    </figure>

    <figure class="placeholder station">
      <figcaption>[Photo: 小五队抱海驿站]</figcaption>
    </figure>

    <span class="wind one" aria-hidden="true"></span>
    <span class="wind two" aria-hidden="true"></span>

    <div class="label beach-label">那香海</div>
    <div class="label sunset-label">那香海落日</div>
    <div class="label island-label">鸡鸣岛</div>
    <div class="label cable-label">摩天岭索道</div>
    <div class="label station-label">小五队抱海驿站</div>

    <div class="copy cliff-copy">悬崖书吧<br>、婚礼教<br>堂、悬崖<br>咖啡厅</div>
    <div class="copy coast-copy">威海绝美海岸线<br>和藏童话般露营地</div>
    <div class="copy mountain-copy">荡漾在山海间<br>看风景、吹海<br>风、享受时光</div>

    <div class="taxi taxi-11">打车11<br>分钟</div>
    <div class="taxi taxi-33">打车33分钟</div>
    <div class="taxi taxi-5">打车5<br>分钟</div>
    <div class="taxi taxi-20">打车20<br>分钟</div>

    <svg class="routes" viewBox="0 0 540 720" aria-hidden="true">
      <defs>
        <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
          <path d="M0,1 L9,5.5 L0,10" fill="none" stroke="#ef4b13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <path d="M245 272 C265 285,263 331,226 379"
            fill="none" stroke="#ef4b13" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <path d="M511 316 C533 298,533 252,513 230"
            fill="none" stroke="#ef4b13" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <path d="M58 518 C47 552,76 586,143 597"
            fill="none" stroke="#ef4b13" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

      <path d="M402 570 C448 566,473 528,479 482"
            fill="none" stroke="#ef4b13" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    </svg>
  </main>
</body>
</html>
