<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桂花露与荷花露</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e7c6d2;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #666466;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      flex: 0 0 540px;
      overflow: hidden;
      background: #e7c6d2;
    }

    .frame {
      position: absolute;
      top: 21px;
      left: 22px;
      width: 499px;
      height: 651px;
      border: 1px solid #777174;
    }

    .content {
      position: absolute;
      left: 65px;
      top: 83px;
      width: 420px;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.5px;
    }

    .section {
      position: absolute;
      left: 0;
      width: 420px;
    }

    .section-one {
      top: 0;
    }

    .section-two {
      top: 286px;
    }

    .heading,
    .entry {
      margin: 0;
    }

    .heading {
      height: 53px;
    }

    .entry {
      margin-left: 10px;
    }

    .entry.function {
      height: 52px;
    }

    .entry.medicine {
      height: 53px;
    }

    .entry.method {
      line-height: 1.34;
      white-space: nowrap;
    }

    .footer-left {
      position: absolute;
      left: 23px;
      top: 682px;
      color: #81777b;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .footer-right {
      position: absolute;
      right: 17px;
      top: 680px;
      display: flex;
      align-items: center;
      gap: 3px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      white-space: nowrap;
    }

    .app-icon {
      display: inline-flex;
      width: 15px;
      height: 15px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.68);
      font-family: "SimSun", serif;
      font-size: 10px;
      line-height: 1;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div class="frame" aria-hidden="true"></div>

    <div class="content">
      <section class="section section-one">
        <p class="heading">△桂花露</p>
        <p class="entry function">〔功用〕开胃消食，宽胸化痰</p>
        <p class="entry medicine">〔药物〕桂花500克</p>
        <p class="entry method">〔制法〕于9月底开花时采收，阴干，拣去<br>
          杂质。先加水浸泡2小时，放入蒸馏器蒸2<br>
          次，收集蒸馏液</p>
      </section>

      <section class="section section-two">
        <p class="heading">△荷花露</p>
        <p class="entry function">〔功用〕清暑凉营</p>
        <p class="entry medicine">〔药物〕白荷花500克</p>
        <p class="entry method">〔制法〕取含花未放的大花蕾或开放的<br>
          花，阴干切碎，加水浸泡2小时。放入蒸馏<br>
          器蒸2小时，收集蒸馏液</p>
      </section>
    </div>

    <div class="footer-left">〔中国色・藕荷〕</div>
    <div class="footer-right">
      <span class="app-icon">图</span>
      <span>图曰APP</span>
    </div>
  </main>
</body>
</html>
