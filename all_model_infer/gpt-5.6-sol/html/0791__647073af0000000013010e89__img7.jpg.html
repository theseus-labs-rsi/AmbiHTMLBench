<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>步行游览区北线</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      color: #111111;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-columns: 152px 388px;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
    }

    .sidebar {
      position: relative;
      height: 720px;
      border-right: 2px solid #4d5558;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      top: 0;
      right: -6px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #47798a;
      z-index: 3;
    }

    .route-title {
      position: absolute;
      top: 20px;
      left: 79px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .route-title span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 51px;
      height: 51px;
      color: #ffffff;
      background: #386779;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 39px;
      font-weight: 500;
      line-height: 1;
    }

    .route-title span:last-child {
      position: relative;
      margin-top: 1px;
    }

    .route-title span:last-child::after {
      content: "";
      position: absolute;
      left: 1px;
      bottom: -16px;
      width: 65px;
      border-bottom: 2px solid #657175;
    }

    .route-title span:last-child::before {
      content: "";
      position: absolute;
      left: 51px;
      top: 31px;
      width: 20px;
      border-bottom: 3px dotted #c8c8c8;
    }

    .direction {
      position: absolute;
      top: 365px;
      left: 90px;
      width: 40px;
      text-align: center;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 29px;
      line-height: 1;
    }

    .direction .character {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 37px;
      height: 37px;
      border: 1px solid #dddddd;
      background: #ffffff;
    }

    .direction .arrow {
      width: 0;
      height: 0;
      margin: 11px 0 10px 12px;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 17px solid #4a7786;
      transform: rotate(-12deg);
    }

    .sidebar-rule {
      position: absolute;
      top: 502px;
      left: 71px;
      width: 80px;
      border-top: 2px solid #5b5b5b;
    }

    .decorative-six {
      position: absolute;
      left: 66px;
      bottom: 0;
      width: 84px;
      height: 168px;
      overflow: hidden;
      background:
        radial-gradient(circle at 22px 55px, rgba(243, 75, 157, .5) 0 2px, transparent 3px),
        radial-gradient(circle at 35px 79px, rgba(30, 211, 207, .22) 0 2px, transparent 3px),
        linear-gradient(140deg, rgba(244, 249, 251, .95), rgba(222, 231, 237, .85));
    }

    .decorative-six::before {
      content: "6";
      position: absolute;
      top: 10px;
      left: 21px;
      color: #14b9bd;
      font-family: Arial, sans-serif;
      font-size: 70px;
      font-weight: 900;
      line-height: 1;
      transform: rotate(14deg);
    }

    .content {
      position: relative;
      height: 720px;
      padding-left: 8px;
    }

    .top-rule {
      position: absolute;
      top: 8px;
      left: 5px;
      width: 308px;
      border-top: 2px solid #899397;
    }

    .continuation {
      position: absolute;
      top: 14px;
      left: 178px;
      color: #3c6979;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }

    .continuation::before {
      content: "◆";
      display: inline-block;
      margin-right: 5px;
      color: #3c6979;
      font-size: 17px;
      vertical-align: 3px;
    }

    .mountains {
      position: absolute;
      top: 15px;
      right: 83px;
      width: 36px;
      height: 44px;
    }

    .mountains::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      border-right: 14px solid transparent;
      border-bottom: 34px solid #454649;
      border-left: 10px solid transparent;
    }

    .mountains::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      border-right: 10px solid transparent;
      border-bottom: 22px solid #454649;
      border-left: 12px solid transparent;
    }

    .folded-map {
      position: absolute;
      top: 26px;
      left: 107px;
      width: 53px;
      height: 30px;
      transform: rotate(-10deg);
      border: 1px solid #6a6a6a;
      background:
        linear-gradient(75deg, transparent 31%, #777 32%, transparent 34%),
        linear-gradient(105deg, transparent 64%, #777 65%, transparent 67%),
        repeating-linear-gradient(15deg, transparent 0 5px, rgba(80, 80, 80, .45) 6px);
      clip-path: polygon(0 15%, 28% 0, 53% 18%, 77% 4%, 100% 16%, 96% 83%, 71% 100%, 48% 81%, 24% 96%, 0 72%);
    }

    .section {
      position: absolute;
      left: 7px;
      width: 373px;
    }

    .section-one {
      top: 62px;
      height: 225px;
    }

    .section-two {
      top: 287px;
      height: 194px;
    }

    .section-three {
      top: 482px;
      height: 238px;
    }

    .hanging-sign {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 144px;
      height: 70px;
      border: 2px solid #3e6c7a;
      border-radius: 13px 12px 10px 12px;
      color: #3a6a7b;
      background: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      transform: rotate(-1deg);
      box-shadow: inset 4px 0 0 #e9eff0;
      z-index: 2;
    }

    .hanging-sign::before,
    .hanging-sign::after {
      content: "";
      position: absolute;
      top: -24px;
      width: 59px;
      height: 26px;
      border-top: 2px solid #3e6c7a;
    }

    .hanging-sign::before {
      left: 10px;
      transform: rotate(-35deg);
      transform-origin: left bottom;
    }

    .hanging-sign::after {
      right: 10px;
      transform: rotate(35deg);
      transform-origin: right bottom;
    }

    .peg-left,
    .peg-right {
      position: absolute;
      top: 11px;
      width: 7px;
      height: 7px;
      border: 2px solid #3e6c7a;
      border-radius: 50%;
      background: #ffffff;
    }

    .peg-left {
      left: 15px;
    }

    .peg-right {
      right: 15px;
    }

    .section-one .hanging-sign {
      top: 8px;
      left: 8px;
    }

    .section-two .hanging-sign {
      top: 10px;
      left: 7px;
      height: 71px;
    }

    .section-three .hanging-sign {
      top: 17px;
      left: 7px;
      height: 72px;
    }

    .photo {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 0;
      color: transparent;
      background: #d7d2c5;
      font-size: 10px;
      text-align: center;
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 62% 36%, rgba(255,255,255,.25) 0 8%, transparent 9%),
        linear-gradient(145deg, rgba(99,120,62,.8), rgba(189,158,111,.65) 42%, rgba(42,87,48,.75));
      opacity: .85;
    }

    .section-one .photo {
      top: 0;
      right: 12px;
      width: 139px;
      height: 95px;
      transform: rotate(7deg);
      background: #8b7759;
    }

    .section-two .photo {
      top: 5px;
      right: 23px;
      width: 113px;
      height: 113px;
      transform: rotate(12deg);
      background: #71664b;
    }

    .section-three .photo {
      top: 5px;
      right: 10px;
      width: 137px;
      height: 96px;
      transform: rotate(8deg);
      background: #b7a36e;
    }

    .section-three .photo::after {
      background:
        radial-gradient(ellipse at 54% 52%, #e0c373 0 20%, #7f773c 22% 34%, #d4b86a 36% 47%, transparent 49%),
        linear-gradient(155deg, #545b34, #b4a26b);
    }

    .body-copy {
      position: absolute;
      left: 1px;
      width: 370px;
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.43;
      letter-spacing: 0;
    }

    .section-one .body-copy {
      top: 99px;
    }

    .section-two .body-copy {
      top: 116px;
    }

    .section-three .body-copy {
      top: 126px;
    }

    .curved-arrow {
      position: absolute;
      width: 46px;
      height: 31px;
      border-right: 3px solid #4b5558;
      border-bottom: 3px solid #4b5558;
      border-radius: 0 0 20px 0;
    }

    .curved-arrow::after {
      content: "";
      position: absolute;
      right: -8px;
      bottom: -7px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid #4b5558;
      transform: rotate(30deg);
    }

    .section-one .curved-arrow {
      left: 107px;
      top: 73px;
      transform: rotate(4deg);
    }

    .section-two .curved-arrow {
      left: 104px;
      top: 83px;
      transform: rotate(5deg);
    }

    .section-three .curved-arrow {
      left: 102px;
      top: 87px;
      transform: rotate(6deg);
    }
  </style>
</head>
<body>
  <main class="page">
    <aside class="sidebar">
      <div class="route-title" aria-label="步行游览区">
        <span>步</span>
        <span>行</span>
        <span>游</span>
        <span>览</span>
        <span>区</span>
      </div>

      <div class="direction" aria-label="北线">
        <div class="character">北</div>
        <div class="arrow"></div>
        <div class="character">线</div>
      </div>

      <div class="sidebar-rule"></div>
      <div class="decorative-six" aria-hidden="true"></div>
    </aside>

    <article class="content">
      <div class="top-rule"></div>
      <div class="folded-map" aria-hidden="true"></div>
      <div class="continuation">接上篇</div>
      <div class="mountains" aria-hidden="true"></div>

      <section class="section section-one">
        <div class="hanging-sign">
          <span class="peg-left"></span>
          <span class="peg-right"></span>
          马戏加油站<br>人猿
        </div>
        <figure class="photo placeholder" aria-label="环尾狐猴照片">[Photo: top-right]</figure>
        <div class="curved-arrow" aria-hidden="true"></div>
        <p class="body-copy">
          环尾狐猴的天堂，成群结队的环尾狐<br>
          猴在这里攀爬跳跃，在零距离投喂专<br>
          属食物的时候有可能会跳到你的肩膀<br>
          上哦，这时候就是拍照留念的最佳时<br>
          机啦！
        </p>
      </section>

      <section class="section section-two">
        <div class="hanging-sign">
          <span class="peg-left"></span>
          <span class="peg-right"></span>
          小熊猫展区
        </div>
        <figure class="photo placeholder" aria-label="小熊猫照片">[Photo: right]</figure>
        <div class="curved-arrow" aria-hidden="true"></div>
        <p class="body-copy">
          北野里最受欢迎的网红打卡地之一，里<br>
          面设有零食铺子可以买竹叶和小熊猫<br>
          互动，注：自带的食物不能给它吃哦！
        </p>
      </section>

      <section class="section section-three">
        <div class="hanging-sign">
          <span class="peg-left"></span>
          <span class="peg-right"></span>
          爬行动物馆
        </div>
        <figure class="photo placeholder" aria-label="黄金蟒照片">[Photo: bottom-right]</figure>
        <div class="curved-arrow" aria-hidden="true"></div>
        <p class="body-copy">
          喜欢蟒蛇、蜥蜴的小伙伴们千万不要错<br>
          过这里，黄金蟒、网纹蟒、红鬣蜥、绿<br>
          鬣蜥、黑白泰加等等都有昂！PS:怕蛇<br>
          的小伙伴就不要挑战自己啦！
        </p>
      </section>
    </article>
  </main>
</body>
</html>
