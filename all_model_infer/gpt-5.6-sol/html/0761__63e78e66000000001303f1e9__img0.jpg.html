<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>侦探能量站</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d8d5cc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #34332f;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif CJK SC", serif;
    }

    .page {
      position: relative;
      width: 540px;
      min-height: 698px;
      padding: 18px 42px 56px 69px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(104, 93, 70, 0.09), transparent 7%, transparent 94%, rgba(96, 91, 75, 0.07)),
        linear-gradient(180deg, #f4f1e7 0%, #f1eee5 48%, #ebe8df 100%);
      box-shadow:
        inset 12px 0 18px rgba(72, 68, 57, 0.08),
        0 2px 16px rgba(39, 38, 33, 0.24);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 4px,
          rgba(76, 71, 59, 0.025) 5px
        );
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 4px 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: 0;
      transform: rotate(-2deg);
      transform-origin: left center;
    }

    .body-text {
      position: relative;
      z-index: 1;
      margin: 2px 0 0 13px;
      font-size: 20px;
      line-height: 2.03;
      font-weight: 400;
      letter-spacing: 0;
    }

    .body-text p {
      margin: 0;
      text-indent: 1.7em;
    }

    .closing {
      position: relative;
      z-index: 1;
      margin: 1px 0 0 36px;
      color: #8c4141;
      font-size: 20px;
      line-height: 1.85;
      letter-spacing: 0;
      transform: rotate(-1.3deg);
      transform-origin: left top;
    }

    .closing .second-line {
      display: block;
      margin-left: 82px;
    }

    @media (max-width: 560px) {
      body {
        justify-content: flex-start;
      }

      .page {
        width: 100vw;
        min-height: 129.26vw;
        padding-left: 12.78vw;
        padding-right: 7.78vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>侦探能量站</h1>

    <section class="body-text">
      <p>
        当腐朽裹挟认知，在权力量子，操纵舆论的事发<br>
        生，我们该如何对待？<br>
        如果我不害怕个人微言轻，也许你就不会经历<br>
        人言可畏，用心辨别真相，用爱和勇气可以消<br>
        融谣言。正如女性作家林[?]言，“4号[?]月经历的<br>
        时候，小小的一阵[?]都有可能导致命伤，我们<br>
        唯有不想成为这样的人，我们也不要成为加<br>
        害的人”，遭遇不公时，隐忍不是唯一道路，<br>
        我们可以向不公平呐喊，只有大家都勇敢<br>
        起来，加害者才会觉得我们没有那么好<br>
        欺负。
      </p>
    </section>

    <section class="closing">
      愿你笔尖下皆自由之风，一笔一画，<br>
      <span class="second-line">一字一句，黑白分明。</span>
    </section>
  </main>
</body>
</html>
