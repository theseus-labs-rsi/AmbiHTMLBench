<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三阶段 认识自我，找到自我</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 540px;
      min-height: 516px;
      background: #ffffff;
    }

    body {
      color: #202428;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .document {
      position: relative;
      width: 540px;
      height: 516px;
      overflow: hidden;
      background:
        linear-gradient(to right, transparent 0, transparent 511px, #fafafa 511px, #fafafa 540px);
    }

    .row {
      position: relative;
      display: flex;
      align-items: flex-start;
      width: 100%;
      min-height: 40px;
      line-height: 1.45;
    }

    .row::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 29px;
      height: 1px;
      background: #f6f6f6;
    }

    .bullet {
      flex: 0 0 auto;
      color: #68727a;
      font-family: Arial, sans-serif;
      font-size: 23px;
      line-height: 31px;
      text-align: center;
    }

    .text {
      white-space: nowrap;
    }

    .level-0 {
      height: 40px;
      padding-top: 1px;
    }

    .level-0 .bullet {
      width: 59px;
      padding-left: 18px;
    }

    .level-0 .text {
      color: #bd433d;
    }

    .level-1 {
      padding-top: 2px;
      padding-left: 58px;
    }

    .level-1 .bullet {
      width: 38px;
    }

    .level-2 {
      padding-top: 2px;
      padding-left: 95px;
    }

    .level-2 .bullet {
      width: 36px;
    }

    .branch {
      position: relative;
    }

    .branch::before {
      content: "";
      position: absolute;
      left: 37px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #d8dcde;
    }

    .children {
      position: relative;
    }

    .children::before {
      content: "";
      position: absolute;
      left: 73px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #d8dcde;
    }

    .country {
      height: 120px;
    }

    .country .level-1 {
      height: 41px;
    }

    .country .level-2 {
      height: 40px;
    }

    .celebrity {
      height: 240px;
    }

    .celebrity .level-1 {
      height: 40px;
    }

    .celebrity .level-2 {
      height: 40px;
    }

    .style {
      height: 116px;
    }

    .style .level-1 {
      height: 40px;
    }

    .style .level-2 {
      min-height: 76px;
    }

    .style .text {
      white-space: normal;
      width: 390px;
    }

    .chevron {
      position: absolute;
      right: 7px;
      top: 16px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #879198;
    }

    .country > .level-1 .chevron,
    .celebrity > .level-1 .chevron,
    .style > .level-1 .chevron {
      top: 17px;
    }
  </style>
</head>
<body>
  <main class="document">
    <div class="row level-0">
      <span class="bullet">•</span>
      <span class="text">第三阶段 认识自我，找到自我</span>
      <span class="chevron" aria-hidden="true"></span>
    </div>

    <section class="branch country">
      <div class="row level-1">
        <span class="bullet">•</span>
        <span class="text">不同国家的妆容模仿</span>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="children">
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">不同国家妆容特点分析</span>
        </div>
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">逐个部位模仿</span>
        </div>
      </div>
    </section>

    <section class="branch celebrity">
      <div class="row level-1">
        <span class="bullet">•</span>
        <span class="text">明星出圈妆容模仿</span>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="children">
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">鞠婧祎妆容</span>
        </div>
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">虞书欣妆容</span>
        </div>
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">宋慧乔妆容</span>
        </div>
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">女团妆容</span>
        </div>
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">日本杂志妆容</span>
        </div>
      </div>
    </section>

    <section class="branch style">
      <div class="row level-1">
        <span class="bullet">•</span>
        <span class="text">找到适合自己的风格和妆容</span>
        <span class="chevron" aria-hidden="true"></span>
      </div>
      <div class="children">
        <div class="row level-2">
          <span class="bullet">•</span>
          <span class="text">根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
