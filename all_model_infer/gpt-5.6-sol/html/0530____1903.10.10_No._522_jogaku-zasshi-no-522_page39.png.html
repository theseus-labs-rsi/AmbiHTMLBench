<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Character Chart</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
  }

  body {
    min-width: 4394px;
    color: #176e12;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP",
                 "MS Mincho", serif;
  }

  .page {
    position: relative;
    width: 4394px;
    height: 3295px;
    overflow: hidden;
    background: #fff;
  }

  .faint-mark {
    position: absolute;
    left: 72px;
    top: 205px;
    width: 44px;
    height: 370px;
    opacity: .28;
    background:
      linear-gradient(to bottom,
        #79662c 0 25%,
        transparent 25% 28%,
        #83752e 28% 57%,
        transparent 57% 61%,
        #817327 61% 68%,
        transparent 68%);
    filter: blur(2px);
  }

  .chart {
    position: absolute;
    left: 285px;
    top: 907px;
    width: 3230px;
    height: 2145px;
    box-sizing: border-box;
    border: 7px solid #168514;
    border-radius: 11px 8px 5px 10px;
    color: rgba(47, 143, 36, .72);
  }

  .chart-top {
    position: absolute;
    inset: 0 0 auto 0;
    height: 820px;
  }

  .green-item {
    position: absolute;
    font-weight: 600;
    line-height: .9;
    color: rgba(66, 153, 49, .68);
    text-shadow: 0 0 4px rgba(46, 135, 34, .25);
  }

  .g1 {
    left: 350px;
    top: 330px;
    font-size: 290px;
  }

  .g2 {
    left: 1045px;
    top: 325px;
    font-size: 280px;
  }

  .g3 {
    left: 1830px;
    top: 325px;
    font-size: 290px;
  }

  .g4 {
    left: 2525px;
    top: 320px;
    font-size: 290px;
  }

  .g5 {
    left: 1815px;
    top: 690px;
    font-size: 270px;
  }

  .g6 {
    left: 2525px;
    top: 685px;
    font-size: 275px;
  }

  .g7 {
    left: 350px;
    top: 1010px;
    font-size: 275px;
  }

  .g8 {
    left: 1030px;
    top: 1010px;
    font-size: 265px;
  }

  .g9 {
    left: 1810px;
    top: 1005px;
    font-size: 265px;
  }

  .g10 {
    left: 2520px;
    top: 1005px;
    font-size: 275px;
  }

  .small-green {
    position: absolute;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 53px;
    line-height: 1.55;
    color: rgba(45, 132, 30, .68);
  }

  .sg1 { left: 740px; top: 452px; }
  .sg2 { left: 1440px; top: 432px; }
  .sg3 { left: 2700px; top: 500px; }
  .sg4 { left: 755px; top: 1170px; }
  .sg5 { left: 1450px; top: 1135px; }

  .wavy {
    position: absolute;
    left: 690px;
    top: 1245px;
    width: 1850px;
    height: 18px;
    background:
      radial-gradient(circle at 12px 0, transparent 12px, rgba(66,153,49,.72) 13px 19px, transparent 20px)
      0 0 / 54px 22px repeat-x;
  }

  .red-zone {
    position: absolute;
    left: 0;
    top: 1375px;
    width: 100%;
    height: 730px;
    color: #ed451f;
  }

  .red-edge {
    position: absolute;
    top: 50px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Yu Mincho", "MS Mincho", serif;
    font-size: 128px;
    font-weight: 600;
    line-height: .9;
    letter-spacing: 8px;
    color: rgba(239, 57, 23, .92);
  }

  .red-edge.left {
    left: 185px;
  }

  .red-edge.right {
    right: 185px;
  }

  .red-columns {
    position: absolute;
    left: 800px;
    top: 5px;
    width: 1660px;
    height: 690px;
    display: flex;
    flex-direction: row-reverse;
    justify-content: space-between;
  }

  .red-column {
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: normal;
    height: 680px;
    color: rgba(234, 68, 30, .89);
    font-size: 77px;
    line-height: 1.18;
    letter-spacing: 4px;
  }

  .red-column.large {
    font-size: 91px;
    font-weight: 600;
  }

  .red-column.small {
    font-size: 66px;
  }

  .vertical-note {
    position: absolute;
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    font-size: 45px;
    line-height: 1.25;
    letter-spacing: 5px;
    color: rgba(10, 111, 9, .91);
  }

  .left-note {
    left: 178px;
    top: 1135px;
    height: 1785px;
  }

  .right-note {
    left: 3572px;
    top: 920px;
    height: 2130px;
    color: rgba(71, 143, 41, .58);
  }

  .right-rule {
    position: absolute;
    left: 3477px;
    top: 1180px;
    width: 2px;
    height: 1860px;
    background: rgba(126, 105, 44, .34);
  }

  .footer {
    position: absolute;
    left: 0;
    top: 3050px;
    width: 100%;
    height: 245px;
    color: #777;
    font-family: Arial, Helvetica, sans-serif;
  }

  .digitized {
    position: absolute;
    left: 780px;
    top: 105px;
    display: flex;
    align-items: baseline;
    color: #999;
    white-space: nowrap;
  }

  .digitized .label {
    font-size: 54px;
    font-weight: 300;
    margin-right: 22px;
  }

  .digitized .google {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 123px;
    line-height: .7;
    letter-spacing: -9px;
    color: #666;
  }

  .original {
    position: absolute;
    left: 2640px;
    top: 90px;
    width: 735px;
    text-align: center;
    color: #999;
    font-size: 50px;
    line-height: 1.25;
    font-weight: 300;
  }

  .original .university {
    display: block;
    margin-top: 7px;
    font-size: 58px;
    white-space: nowrap;
  }

  .page-number {
    position: absolute;
    right: 114px;
    bottom: 35px;
    color: rgba(125, 104, 179, .45);
    font: 58px Arial, sans-serif;
  }

  .placeholder {
    border: 0;
    background: transparent;
  }

  .illegible {
    color: inherit;
  }
</style>
</head>
<body>
<main class="page">
  <div class="faint-mark" aria-hidden="true"></div>

  <aside class="vertical-note left-note">
    副　活　三　十　六　年　十　六　月　十　七　日　第　三　種　郵　便　物　認　可　（五三）
  </aside>

  <section class="chart" aria-label="Japanese character chart">
    <div class="chart-top">
      <div class="green-item g1">彌</div>
      <div class="green-item g2">石</div>
      <div class="green-item g3">十</div>
      <div class="green-item g4">前</div>
      <div class="green-item g5">郎</div>
      <div class="green-item g6">月</div>
      <div class="green-item g7">丁</div>
      <div class="green-item g8"><span class="illegible">[?]</span></div>
      <div class="green-item g9"><span class="illegible">[?]</span></div>
      <div class="green-item g10">間</div>

      <div class="small-green sg1">ラ<br>イ</div>
      <div class="small-green sg2">し<br>や</div>
      <div class="small-green sg3"><span class="illegible">[?]</span></div>
      <div class="small-green sg4">オ<br>ン</div>
      <div class="small-green sg5"><span class="illegible">[?]</span></div>

      <div class="wavy" aria-hidden="true"></div>
    </div>

    <div class="red-zone">
      <div class="red-edge left">ライオン薔薇</div>

      <div class="red-columns">
        <div class="red-column large">花　に　び　は　<span class="illegible">[illegible]</span></div>
        <div class="red-column">げ　に　び　<span class="illegible">[illegible]</span></div>
        <div class="red-column">び　<span class="illegible">[illegible]</span></div>
        <div class="red-column large">花　<span class="illegible">[illegible]</span></div>
        <div class="red-column small"><span class="illegible">[illegible]</span></div>
        <div class="red-column large"><span class="illegible">[illegible]</span></div>
      </div>

      <div class="red-edge right">ライオン薔薇</div>
    </div>
  </section>

  <div class="right-rule" aria-hidden="true"></div>

  <aside class="vertical-note right-note">
    女　組　補　記　第　五　十　日　<span class="illegible">[illegible]</span>
  </aside>

  <footer class="footer">
    <div class="digitized">
      <span class="label">Digitized by</span>
      <span class="google">Google</span>
    </div>

    <div class="original">
      Original from
      <span class="university">CORNELL UNIVERSITY</span>
    </div>

    <div class="page-number">2</div>
  </footer>
</main>
</body>
</html>
