<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民日报心态主题金句摘抄</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      background: #ded4c5;
      color: #292824;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    }

    .page {
      width: 540px;
      min-height: 720px;
      background: #d8cab5;
      overflow: hidden;
    }

    .masthead {
      height: 174px;
      display: grid;
      grid-template-columns: 57% 43%;
      background: #f8ece2;
      border-bottom: 4px solid #e8ddd1;
    }

    .brand {
      position: relative;
      padding: 23px 0 0 25px;
    }

    .brand-cn {
      color: #d0141e;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
      font-size: 69px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transform: rotate(-2deg);
      transform-origin: left center;
    }

    .brand-en {
      margin-top: 5px;
      margin-left: 58px;
      color: #9d4951;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .heading {
      padding-top: 30px;
      text-align: center;
    }

    .heading-top {
      display: inline-flex;
      align-items: center;
      padding: 0 5px 7px;
      border-bottom: 2px solid #292824;
      font-size: 31px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .heading-divider {
      height: 37px;
      margin: 0 14px;
      border-left: 2px solid #292824;
    }

    .heading-main {
      display: inline-block;
      margin-top: 13px;
      padding: 0 6px 3px;
      border-bottom: 3px solid #292824;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    .content {
      padding: 17px 22px 15px;
    }

    .quotation {
      margin: 0;
      text-align: center;
      font-size: 43px;
      font-weight: 500;
      line-height: 1.33;
      letter-spacing: 0;
    }

    .label {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
    }

    .explanation {
      margin: 22px 0 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 18px;
      line-height: 1.28;
      text-align: justify;
      letter-spacing: 0;
    }

    .first-label {
      margin-top: 1px;
    }

    .second-quotation {
      margin-top: 17px;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.22;
    }

    .second-label {
      margin-top: -8px;
      margin-left: 13px;
    }

    .second-explanation {
      margin: 23px 13px 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-cn">人民日报</div>
        <div class="brand-en">RENMIN RIBAO</div>
      </div>
      <div class="heading">
        <div class="heading-top">
          <span>金句</span>
          <span class="heading-divider"></span>
          <span>摘抄</span>
        </div>
        <div class="heading-main">心态主题</div>
      </div>
    </header>

    <section class="content">
      <p class="quotation">且行且忘且随风，<br>且行且看且从容。</p>

      <p class="label first-label">释义：</p>

      <p class="explanation">意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。</p>

      <p class="quotation second-quotation">我将玫瑰藏于身后风起花落，<br>从此鲜花赠自己，<br>纵马踏花向自由。</p>

      <p class="label second-label">释义：</p>

      <p class="explanation second-explanation">我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。</p>
    </section>
  </main>
</body>
</html>
