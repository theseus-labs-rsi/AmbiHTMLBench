<body>
<main class="page">
  <header class="hero">
    <div class="hero-banner"></div>

    <div class="deer placeholder" aria-label="鹿插图">
      <span class="body"></span>
      <span class="head"></span>
      <span class="caption">[Illustration: deer]</span>
    </div>

    <div class="hero-title">家长需要关注什么</div>
    <div class="hero-subtitle">[?]・[?]・[?]</div>
    <div class="hero-mark">[?]</div>
  </header>

  <section class="panel panel-one">
    <div class="left-column">
      <div class="block">
        <span class="badge">壹</span>
        <p>看单科成绩<br>分析优势与劣势科目</p>
      </div>
      <div class="block">
        <span class="badge">贰</span>
        <p>看进步<br>横向整体水平<br>纵向看进退情况</p>
      </div>
      <div class="block">
        <span class="badge">叁</span>
        <p>分析错题</p>
      </div>
    </div>

    <div class="circle-feature" aria-label="成绩怎么看">
      <div class="lattice left"></div>
      <div class="lattice right"></div>
      <div class="center-strip"></div>
      <div class="vertical-title">成绩怎么看</div>
    </div>

    <div class="right-column">
      <div class="block">
        <span class="badge">肆</span>
        <p>分析题错：<br>
        是遗憾丢分？是模糊丢分？<br>
        是不全做丢分？<br>
        策略：消除遗憾，纠正模<br>
        糊，力争突破</p>
      </div>
      <div class="block">
        <span class="badge">伍</span>
        <p>分析考试技巧<br>
        策略是否得当？<br>
        是否投标准答案？<br>
        是否摆正心态？</p>
      </div>
    </div>
  </section>

  <section class="panel panel-two">
    <div class="bottom-item bottom-one">
      <span class="badge">壹</span>
      <p>不要过度焦虑</p>
    </div>

    <div class="bottom-item bottom-two">
      <span class="badge">贰</span>
      <p>不要过度关注孩子</p>
    </div>

    <div class="bottom-item bottom-three">
      <span class="badge">叁</span>
      <p>不要给孩子过高的期望</p>
    </div>

    <div class="circle-feature" aria-label="家长五不要">
      <div class="lattice left"></div>
      <div class="lattice right"></div>
      <div class="center-strip"></div>
      <div class="vertical-title">家长五不要</div>
    </div>

    <div class="bottom-item bottom-four">
      <span class="badge">肆</span>
      <p>不要过度唠叨</p>
    </div>

    <div class="bottom-item bottom-five">
      <span class="badge">伍</span>
      <p>不要盲目攀比和迷信</p>
    </div>
  </section>
