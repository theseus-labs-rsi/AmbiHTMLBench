<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三课 社会生活离不开规则</title>
  <script>
    window.MathJax = {

        inlineMath: [['$', '$']],

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ececec;
      color: #171717;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 763px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .header {
      position: absolute;
      top: 56px;
      left: 47px;
    }

    .lesson-number {
      margin: 0 0 7px;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .lesson-title {
      margin: 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .intro {
      position: absolute;
      top: 164px;
      left: 47px;
      width: 321px;
      margin: 0;
      color: #66707a;
      font-size: 11px;
      line-height: 1.48;
      text-indent: 2em;
      letter-spacing: 1.2px;
    }

    .section-title {
      position: absolute;
      top: 268px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 19px;
      line-height: 24px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      width: 4px;
      height: 21px;
      background: #276287;
    }

    .experience {
      position: absolute;
      top: 302px;
      left: 47px;
      width: 425px;
    }

    .experience-heading {
      display: flex;
      height: 26px;
      align-items: center;
    }

    .experience-icon {
      position: relative;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      margin-right: 6px;
      border-radius: 50%;
      background: #35739c;
    }

    .experience-icon::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 4px;
      width: 5px;
      height: 6px;
      border-radius: 50% 50% 20% 20%;
      background: #35739c;
      box-shadow:
        6px -2px 0 -1px #35739c,
        12px 0 0 -1px #35739c,
        16px 5px 0 -1px #35739c;
    }

    .experience-label {
      flex: 0 0 auto;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .dotted-line {
      flex: 1;
      margin-left: 8px;
      border-top: 1px dotted #777;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 177px 176px;
      column-gap: 32px;
      row-gap: 9px;
      margin-top: 4px;
      margin-left: 25px;
    }

    .photo-item {
      width: 177px;
      margin: 0;
      text-align: center;
    }

    .placeholder {
      position: relative;
      display: flex;
      width: 177px;
      height: 122px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #ccd2d3;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.92);
      font-family: Arial, sans-serif;
      font-size: 9px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
    }

    .security {
      background:
        linear-gradient(180deg, rgba(102, 149, 174, .25) 0 33%, transparent 33%),
        repeating-linear-gradient(90deg, transparent 0 13px, rgba(31, 76, 96, .25) 13px 16px),
        linear-gradient(145deg, #d9e4e3 0 34%, #778b89 35% 52%, #c9b89f 53% 67%, #47595b 68%);
    }

    .factory {
      background:
        linear-gradient(90deg, rgba(194, 205, 207, .65), transparent 39%),
        repeating-linear-gradient(165deg, transparent 0 13px, rgba(232, 239, 239, .7) 14px 17px),
        linear-gradient(140deg, #758d9b 0 32%, #bdc8c9 33% 59%, #d0d9d7 60%);
    }

    .traffic {
      background:
        linear-gradient(36deg, transparent 0 45%, rgba(245, 245, 240, .9) 46% 55%, transparent 56%),
        linear-gradient(144deg, transparent 0 44%, rgba(224, 225, 217, .9) 45% 57%, transparent 58%),
        repeating-linear-gradient(40deg, #7c8580 0 11px, #6a746e 12px 24px);
    }

    .quiet {
      background:
        linear-gradient(90deg, #dde6e3 0 33%, transparent 34%),
        linear-gradient(145deg, #f3f3ef 0 46%, #aeb3af 47% 59%, #5d6768 60%);
    }

    .quiet::before {
      content: "静";
      position: absolute;
      top: 8px;
      left: 14px;
      color: #1a3936;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 47px;
      font-weight: 800;
      line-height: 1;
      text-shadow: none;
      transform: rotate(-5deg);
    }

    figcaption {
      height: 13px;
      margin-top: 5px;
      color: #555;
      font-size: 9px;
      line-height: 13px;
      white-space: nowrap;
    }

    .questions {
      position: absolute;
      top: 636px;
      left: 78px;
      width: 396px;
      color: #263943;
      font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
      font-size: 10px;
      line-height: 15px;
    }

    .question {
      position: relative;
      margin: 0;
      padding-left: 13px;
    }

    .question::before {
      content: "›";
      position: absolute;
      top: 1px;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4a83a9;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 8px;
      text-align: center;
    }

    .answer {
      color: #277c9c;
    }

    .footer-rule {
      position: absolute;
      top: 673px;
      left: 47px;
      width: 425px;
      border-top: 1px dotted #777;
    }

    .footer {
      position: absolute;
      top: 697px;
      left: 47px;
      display: flex;
      align-items: baseline;
      color: #4d4d4d;
      font-size: 9px;
      line-height: 1;
    }

    .page-number {
      margin-right: 13px;
      font-family: Arial, sans-serif;
      font-size: 10px;
    }

    .watermark {
      position: absolute;
      right: 15px;
      bottom: 14px;
      width: 155px;
      height: 152px;
      opacity: .045;
      transform: rotate(-18deg);
      color: #3e7793;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 62px;
      line-height: .85;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        height: calc(100vw * 1.412963);
        transform-origin: top left;
      }

      body {
        overflow-x: hidden;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="lesson-number">第三课</h1>
      <h2 class="lesson-title">社会生活离不开规则</h2>
    </header>

    <p class="intro">井然有序的社会生活离不开社会规则的维系，规则划定自由的边界、保障人们的自由，我们应该自觉遵守规则，坚定维护规则，积极改进规则，与规则同行，创建美好生活。</p>

    <div class="section-title">维护秩序</div>

    <section class="experience">
      <div class="experience-heading">
        <span class="experience-icon" aria-hidden="true"></span>
        <span class="experience-label">运用你的经验</span>
        <span class="dotted-line"></span>
      </div>

      <div class="photo-grid">
        <figure class="photo-item">
          <div class="placeholder security">[Photo: security checkpoint]</div>
          <figcaption>人们排队进行安全检查</figcaption>
        </figure>

        <figure class="photo-item">
          <div class="placeholder factory">[Photo: factory worker]</div>
          <figcaption>纺纱工人按操作规程工作</figcaption>
        </figure>

        <figure class="photo-item">
          <div class="placeholder traffic">[Photo: city intersection]</div>
          <figcaption>行人、自行车、机动车各行其道</figcaption>
        </figure>

        <figure class="photo-item">
          <div class="placeholder quiet">[Photo: public waiting area]</div>
          <figcaption>人们在公共场所保持安静</figcaption>
        </figure>
      </div>
    </section>

    <section class="questions">
      <p class="question">以上图片体现了哪些方面的社会秩序？<span class="answer">社会管理秩序、生产秩序、交通秩序、公共场所秩序</span></p>
      <p class="question">如果没有秩序，我们的生活将会怎样？<span class="answer">将会陷入无序化状态，混乱不堪，社会将不能正常运转，人民将不能安居乐业</span></p>
    </section>

    <div class="footer-rule"></div>

    <footer class="footer">
      <span class="page-number">22</span>
      <span>第二单元&nbsp;&nbsp;遵守社会规则</span>
    </footer>

    <div class="watermark" aria-hidden="true">知识<br>拓展</div>
  </main>
</body>
</html>
