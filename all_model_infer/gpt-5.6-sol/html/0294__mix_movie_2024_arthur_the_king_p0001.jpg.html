<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur the King Poster</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #161a12;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }

    .poster {
      position: relative;
      width: min(100vw, 510px);
      aspect-ratio: 510 / 755;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 91% 28%, rgba(255,255,220,.93) 0 2%, rgba(212,223,174,.45) 7%, transparent 19%),
        radial-gradient(circle at 76% 61%, #d1ad63 0 11%, #87673b 27%, transparent 42%),
        linear-gradient(112deg, #10120d 0 25%, #3c3524 43%, #8a9d67 72%, #d9ddbd 100%);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: transparent;
      user-select: none;
    }

    .placeholder::before {
      content: "";
      position: absolute;
      top: -3%;
      left: 10%;
      width: 63%;
      height: 49%;
      border-radius: 42% 48% 45% 38%;
      background:
        radial-gradient(circle at 68% 38%, #d1a46c 0 2%, transparent 2.6%),
        radial-gradient(ellipse at 69% 49%, #9a5e3e 0 11%, transparent 12%),
        linear-gradient(115deg, #161817 0 29%, #3c3025 44%, #bc8d61 62%, #d5b17c 76%, transparent 77%);
      filter: contrast(1.1);
      transform: rotate(-3deg);
    }

    .placeholder::after {
      content: "";
      position: absolute;
      left: -12%;
      bottom: -8%;
      width: 111%;
      height: 61%;
      border-radius: 46% 54% 20% 10%;
      background:
        radial-gradient(circle at 70% 33%, #16150f 0 2.1%, #b59156 2.5% 5%, transparent 5.5%),
        radial-gradient(ellipse at 88% 46%, #121a17 0 7%, #685537 8% 12%, transparent 13%),
        radial-gradient(ellipse at 69% 57%, #342619 0 14%, transparent 15%),
        repeating-linear-gradient(103deg, #bd8c4b 0 4px, #76502d 5px 9px, #d1a663 10px 13px, #50361f 14px 18px);
      transform: rotate(-3deg);
      opacity: .96;
    }

    .actor {
      position: absolute;
      top: 4.15%;
      left: 8.2%;
      right: 7%;
      z-index: 2;
      margin: 0;
      font-size: clamp(13px, 3.85vw, 20px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .56em;
      white-space: nowrap;
    }

    .tagline {
      position: absolute;
      top: 35.7%;
      left: 8.2%;
      z-index: 2;
      margin: 0;
      font-size: clamp(7px, 2.05vw, 11px);
      font-weight: 500;
      line-height: 1.27;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .title {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: #ffc900;
      font-size: clamp(42px, 13.2vw, 68px);
      font-weight: 800;
      line-height: .94;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .title span {
      position: absolute;
      left: 8.2%;
      white-space: nowrap;
    }

    .title .arthur {
      top: 41.5%;
    }

    .title .the {
      top: 59.5%;
    }

    .title .king {
      top: 77.5%;
    }

    .based-on {
      position: absolute;
      right: 8.1%;
      bottom: 5.1%;
      z-index: 2;
      width: 39%;
      margin: 0;
      text-align: right;
      font-size: clamp(8px, 2.25vw, 12px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .rating {
      position: absolute;
      left: 8.5%;
      bottom: 1.75%;
      z-index: 2;
      width: 9%;
      min-width: 42px;
      height: 2.15%;
      border: 1px solid rgba(255,255,255,.55);
      color: rgba(255,255,255,.76);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(4px, 1.05vw, 6px);
      line-height: 1;
      text-transform: uppercase;
    }

    .release {
      position: absolute;
      right: 8.1%;
      bottom: 2.6%;
      z-index: 2;
      margin: 0;
      text-align: right;
      font-size: clamp(6px, 1.45vw, 8px);
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
    }

    .studio {
      position: absolute;
      right: 8.1%;
      bottom: 1.45%;
      z-index: 2;
      margin: 0;
      font-size: clamp(4px, 1vw, 6px);
      line-height: 1;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Arthur the King film poster">
    <div class="placeholder" role="img" aria-label="Photo: Mark Wahlberg in profile above a large shaggy dog">[Photo: Mark Wahlberg in profile above a large shaggy dog]</div>

    <p class="actor">MARK WAHLBERG</p>

    <p class="tagline">
      AN UNEXPECTED ENCOUNTER<br>
      AN UNLIKELY BOND<br>
      AN UNFORGETTABLE ADVENTURE
    </p>

    <div class="title" aria-label="Arthur the King">
      <span class="arthur">ARTHUR</span>
      <span class="the">THE</span>
      <span class="king">KING</span>
    </div>

    <p class="based-on">
      BASED ON THE<br>
      INCREDIBLE TRUE STORY
    </p>

    <div class="rating">PG-13</div>
    <p class="release">COMING SOON</p>
    <p class="studio">LIONSGATE</p>
  </main>
</body>
</html>
