<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端午万宁三日游安排</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      background: #d9edf8;
      color: #2c2c2c;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 732px;
      overflow: hidden;
      padding: 27px 14px 17px;
      background:
        linear-gradient(rgba(209, 237, 251, 0.78), rgba(219, 241, 250, 0.74)),
        repeating-linear-gradient(
          168deg,
          rgba(255, 255, 255, 0.18) 0,
          rgba(255, 255, 255, 0.18) 34px,
          rgba(163, 209, 229, 0.12) 35px,
          rgba(163, 209, 229, 0.12) 67px
        ),
        #cceafa;
    }

    .page::after {
      content: "";
      position: absolute;
      right: -36px;
      bottom: -18px;
      width: 245px;
      height: 175px;
      border-top: 2px solid rgba(255, 255, 255, 0.62);
      transform: skewY(-7deg);
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.18) 0,
          rgba(255, 255, 255, 0.18) 10px,
          rgba(140, 180, 196, 0.12) 11px,
          rgba(140, 180, 196, 0.12) 12px
        );
      pointer-events: none;
    }

    .title {
      position: relative;
      z-index: 1;
      margin: 0;
      white-space: nowrap;
      color: #191919;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 37px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: 0;
      text-align: center;
      text-shadow:
        1px 0 #fff,
        -1px 0 #fff,
        0 1px #fff,
        0 -1px #fff,
        2px 2px 0 rgba(255, 255, 255, 0.9);
    }

    .title .red {
      color: #e61919;
      font-size: 47px;
    }

    .title-underline {
      position: relative;
      z-index: 1;
      height: 12px;
      margin: -4px 3px 17px;
      border-bottom: 4px solid #ffe300;
      border-radius: 50%;
      transform: rotate(0.8deg);
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 120px 151px 1fr;
      column-gap: 14px;
    }

    .timeline {
      position: relative;
      height: 592px;
      padding-top: 5px;
    }

    .day {
      width: 120px;
      height: 39px;
      border-radius: 22px;
      background: #ffe000;
      color: #202020;
      font-size: 27px;
      font-weight: 800;
      line-height: 39px;
      text-align: center;
    }

    .route {
      position: relative;
      width: 120px;
      height: 118px;
    }

    .route.short {
      height: 119px;
    }

    .route.last {
      height: 118px;
    }

    .route::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 58px;
      width: 5px;
      height: 60px;
      background: #e5cc00;
    }

    .route::after {
      content: "";
      position: absolute;
      top: 59px;
      left: 52px;
      width: 0;
      height: 0;
      border-top: 13px solid #e5cc00;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
    }

    .time {
      position: absolute;
      top: 76px;
      left: 0;
      width: 110px;
      height: 31px;
      background: #ffe000;
      color: #272727;
      font-size: 18px;
      font-weight: 800;
      line-height: 31px;
      text-align: center;
    }

    .route.last .time {
      width: 115px;
    }

    .route.final::before {
      height: 56px;
    }

    .route.final::after {
      top: 54px;
    }

    .photos {
      display: grid;
      grid-template-rows: 109px 109px 109px 109px 109px;
      row-gap: 11px;
    }

    .placeholder {
      display: flex;
      width: 151px;
      height: 109px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(65, 83, 76, 0.35);
      background: #78978e;
      color: rgba(255, 255, 255, 0.92);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .photo-1 {
      background: linear-gradient(135deg, #2d5c43 0 28%, #a87d5f 29% 71%, #42694d 72%);
    }

    .photo-2 {
      background: linear-gradient(168deg, #254d28 0 47%, #83a064 48% 57%, #313f3d 58% 62%, #8bb0a2 63%);
    }

    .photo-3 {
      background: linear-gradient(#90b7d0 0 78%, #d7d7d3 79%);
    }

    .photo-4 {
      background: radial-gradient(circle at 50% 42%, #4983a5 0 23%, #172421 24% 48%, #8e9c9b 49%);
    }

    .photo-5 {
      background:
        linear-gradient(155deg, transparent 0 15%, rgba(242, 181, 43, 0.9) 16% 25%, transparent 26%),
        linear-gradient(25deg, #9d2922, #d7a42d 40%, #537f38 72%, #433329);
    }

    .descriptions {
      display: grid;
      grid-template-rows: 109px 109px 109px 109px 109px;
      row-gap: 11px;
      min-width: 0;
    }

    .entry {
      padding-top: 5px;
    }

    .entry h2 {
      margin: 0 0 3px;
      color: #ffe000;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0;
      -webkit-text-stroke: 1px #272727;
      text-shadow: 1px 1px 0 #272727;
    }

    .entry p {
      margin: 0;
      color: #3d3d3d;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.34;
      letter-spacing: 0;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        height: calc(100vw * 1.35556);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">端午万宁<span class="red">三日游</span>安排得明明白白</h1>
    <div class="title-underline"></div>

    <section class="content">
      <aside class="timeline">
        <div class="day">第二天</div>
        <div class="route">
          <div class="time">打车25分钟</div>
        </div>
        <div class="route short">
          <div class="time">打车10分钟</div>
        </div>
        <div class="route">
          <div class="time">打车1小时</div>
        </div>
        <div class="route last">
          <div class="time">打车1小时</div>
        </div>
        <div class="route final"></div>
      </aside>

      <div class="photos">
        <figure class="placeholder photo-1">[Photo: 巴厘村]</figure>
        <figure class="placeholder photo-2">[Photo: 桥海牧场]</figure>
        <figure class="placeholder photo-3">[Photo: 神州半岛灯塔]</figure>
        <figure class="placeholder photo-4">[Photo: 山钦湾]</figure>
        <figure class="placeholder photo-5">[Photo: 兴隆夜市]</figure>
      </div>

      <div class="descriptions">
        <article class="entry">
          <h2>巴厘村</h2>
          <p>去巴厘村拍照，假装自己在泰国，租一套服装(80/人)而且还需要门票。</p>
        </article>

        <article class="entry">
          <h2>桥海牧场</h2>
          <p>是类似于农村的田地，有一群牛羊鹅等农家动物!体验感一般，但拍照不错。</p>
        </article>

        <article class="entry">
          <h2>神州半岛灯塔</h2>
          <p>拍照真的很出片，不要去太早，很有宫崎骏漫画的感觉</p>
        </article>

        <article class="entry">
          <h2>山钦湾</h2>
          <p>傍晚的时候可以去燕子洞拍夕阳剪影，还有很多礁石，真的是分分钟氛围感大片!</p>
        </article>

        <article class="entry">
          <h2>兴隆夜市</h2>
          <p>如果想吃南洋风味等一系列东南亚美食，可以看看这里便宜好吃实惠!</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
