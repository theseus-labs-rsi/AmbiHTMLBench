<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一月-任务</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      color: #222222;
      font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
    }

    .page {
      width: 540px;
      height: 373px;
      padding-top: 64px;
      background: #ffffff;
    }

    h1 {
      margin: 0 0 15px 16px;
      font-size: 24px;
      line-height: 33px;
      font-weight: 400;
      letter-spacing: 0;
    }

    table {
      width: 505px;
      margin-left: 13px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    col.serial {
      width: 37px;
    }

    col.task {
      width: 103px;
    }

    col.position {
      width: 65px;
    }

    col.action {
      width: 130px;
    }

    col.time {
      width: 62px;
    }

    col.note {
      width: 108px;
    }

    th,
    td {
      height: 31px;
      padding: 2px 4px;
      border: 1px solid #777777;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      font-weight: 400;
    }

    thead th {
      height: 28px;
      background: #ffffff;
      font-weight: 600;
    }

    tbody tr:nth-child(odd) td {
      background: #dce8f4;
    }

    tbody tr:nth-child(even) td {
      background: #ffffff;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>一月-任务</h1>

    <table aria-label="一月任务表">
      <colgroup>
        <col class="serial">
        <col class="task">
        <col class="position">
        <col class="action">
        <col class="time">
        <col class="note">
      </colgroup>
      <thead>
        <tr>
          <th>序号</th>
          <th>任务描述</th>
          <th>岗位</th>
          <th>操作动作</th>
          <th>开始时间</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>租厂房</td>
          <td>总经理</td>
          <td>申请60w租厂房</td>
          <td>1月1日</td>
          <td>花60w租A厂房</td>
        </tr>
        <tr>
          <td>2</td>
          <td>资质开发</td>
          <td>总经理</td>
          <td>P3资质开发</td>
          <td>1月1日</td>
          <td>申请20w 资质开发</td>
        </tr>
        <tr>
          <td>3</td>
          <td>批拨款</td>
          <td>财务</td>
          <td>批准</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>支付管理费</td>
          <td>财务</td>
          <td>5w管理费</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>5</td>
          <td>建设生产线</td>
          <td>生产</td>
          <td>4条自动线生产P3</td>
          <td>1月1日</td>
          <td>申请200w资金建线</td>
        </tr>
        <tr>
          <td>6</td>
          <td>iso开发</td>
          <td>总经理</td>
          <td>两个iso的开发</td>
          <td>1月1日</td>
          <td>申请资金开发</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
