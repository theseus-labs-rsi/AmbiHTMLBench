<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三天路线规划</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7e7;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 722px;
      overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(rgba(198, 198, 198, 0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(198, 198, 198, 0.45) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .title {
      position: absolute;
      top: 15px;
      left: 74px;
      margin: 0;
      color: #050505;
      font-size: 51px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .title .blue {
      color: #07399c;
    }

    .day-label {
      position: absolute;
      top: 97px;
      left: 37px;
      width: 125px;
      height: 41px;
      padding-top: 2px;
      background: #a9edcb;
      color: #080808;
      font-size: 31px;
      font-weight: 800;
      line-height: 39px;
      text-align: center;
      white-space: nowrap;
    }

    .left-route {
      position: absolute;
      top: 150px;
      left: 19px;
      width: 178px;
      height: 572px;
    }

    .place {
      position: absolute;
      left: 0;
      width: 178px;
      color: #080808;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .place-1 { top: 64px; }
    .place-2 { top: 180px; }
    .place-3 { top: 295px; }
    .place-4 { top: 411px; }
    .place-5 { top: 525px; }

    .transit {
      position: absolute;
      left: 1px;
      width: 176px;
      height: 29px;
      background: rgba(255, 237, 240, 0.72);
      color: #171717;
      font-size: 23px;
      font-weight: 500;
      line-height: 29px;
      white-space: nowrap;
    }

    .transit .start {
      display: inline-block;
      width: 76px;
      text-align: center;
    }

    .transit .end {
      display: inline-block;
      margin-left: 17px;
    }

    .transit-1 { top: 115px; }
    .transit-2 { top: 230px; }
    .transit-3 { top: 346px; left: 20px; width: 157px; }
    .transit-4 { top: 461px; left: 20px; width: 157px; }

    .transit-3 .start,
    .transit-4 .start {
      width: 58px;
    }

    .arrow {
      position: absolute;
      z-index: 3;
      width: 25px;
      height: 61px;
    }

    .arrow::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      width: 10px;
      height: 38px;
      background: #ffc31a;
      border: 1px solid #565656;
    }

    .arrow::after {
      content: "";
      position: absolute;
      top: 35px;
      left: 0;
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 25px solid #ffc31a;
      filter: drop-shadow(0 1px 0 #565656);
    }

    .arrow-1 { top: 0; left: 68px; }
    .arrow-2 { top: 83px; left: 69px; }
    .arrow-3 { top: 198px; left: 69px; }
    .arrow-4 { top: 314px; left: 69px; }
    .arrow-5 { top: 429px; left: 69px; }

    .details {
      position: absolute;
      top: 118px;
      left: 215px;
      width: 305px;
    }

    .detail-box {
      position: absolute;
      left: 0;
      width: 305px;
      border: 3px solid #9d0a0a;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 4px 3px;
      color: #171717;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.38;
      letter-spacing: 0;
    }

    .detail-box strong {
      color: #123d92;
      font-weight: 500;
    }

    .detail-1 {
      top: 0;
      height: 92px;
    }

    .detail-2 {
      top: 127px;
      height: 92px;
    }

    .detail-3 {
      top: 253px;
      height: 92px;
    }

    .detail-4 {
      top: 380px;
      height: 92px;
      padding-top: 13px;
    }

    .detail-5 {
      top: 507px;
      height: 91px;
      padding-top: 4px;
    }

    @media (max-width: 540px) {
      body {
        display: block;
        width: 100vw;
        overflow-x: hidden;
      }

      .page {
        transform: scale(calc(100vw / 540));
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title"><span class="blue">第三天</span>路线规划</h1>

    <div class="day-label">第三天</div>

    <section class="left-route" aria-label="路线">
      <div class="arrow arrow-1" aria-hidden="true"></div>
      <div class="place place-1">磁器口</div>

      <div class="transit transit-1">
        <span class="start">1号线</span><span class="end">30分钟</span>
      </div>
      <div class="arrow arrow-2" aria-hidden="true"></div>
      <div class="place place-2">罗中立美术馆</div>

      <div class="transit transit-2">
        <span class="start">1号线</span><span class="end">80分钟</span>
      </div>
      <div class="arrow arrow-3" aria-hidden="true"></div>
      <div class="place place-3">山城步道</div>

      <div class="transit transit-3">
        <span class="start">公交</span><span class="end">32分钟</span>
      </div>
      <div class="arrow arrow-4" aria-hidden="true"></div>
      <div class="place place-4">观音桥</div>

      <div class="transit transit-4">
        <span class="start">步行</span><span class="end">15分钟</span>
      </div>
      <div class="arrow arrow-5" aria-hidden="true"></div>
      <div class="place place-5">九街</div>
    </section>

    <section class="details" aria-label="景点介绍">
      <div class="detail-box detail-1">
        <strong>磁器口（免费）</strong>：汇聚美食、重庆特色伴手礼，始建于宋代“一江两流三山四巷”独特地貌
      </div>

      <div class="detail-box detail-2">
        <strong>罗中立美术馆（免费）</strong>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
      </div>

      <div class="detail-box detail-3">
        <strong>山城步道（免费）</strong>：建在悬崖边的临江步道，汇聚老重庆特色步道
      </div>

      <div class="detail-box detail-4">
        <strong>观音桥（免费）</strong>：超大商圈，还有很多地道重庆小吃
      </div>

      <div class="detail-box detail-5">
        <strong>九街（免费）</strong>：酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
      </div>
    </section>
  </main>
</body>
</html>
