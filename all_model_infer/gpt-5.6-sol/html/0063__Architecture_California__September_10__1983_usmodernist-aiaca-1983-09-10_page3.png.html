<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heath Ceramics Advertisement — Transpacific Building</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: #f4f0df;
  }

  body {
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    width: 1000px;
    height: 1319px;
    margin: 0 auto;
    padding-top: 51px;
    background:
      radial-gradient(circle at 8% 12%, rgba(204,190,136,.11), transparent 18%),
      radial-gradient(circle at 88% 77%, rgba(203,188,130,.10), transparent 22%),
      linear-gradient(90deg, #f7f4e6 0%, #fffef5 12%, #fffef8 88%, #f4efdf 100%);
  }

  .advertisement {
    width: 839px;
    height: 1203px;
    margin-left: 84px;
    border: 5px solid #090909;
    background: #fffefa;
  }

  .placeholder.photo {
    position: relative;
    width: 100%;
    height: 845px;
    overflow: hidden;
    border-bottom: 5px solid #090909;
    color: transparent;
    font-size: 0;
    background:
      linear-gradient(153deg, transparent 0 49%, rgba(221,219,187,.96) 49.2% 57%, transparent 57.2%) 0 285px / 450px 420px no-repeat,
      linear-gradient(28deg, transparent 0 48%, rgba(183,181,148,.9) 48.2% 54%, transparent 54.2%) 55px 285px / 500px 250px no-repeat,
      radial-gradient(ellipse at 52% 73%, #a98d58 0 8%, #6d5332 8.5% 11%, transparent 11.5%),
      repeating-linear-gradient(58deg, transparent 0 77px, rgba(221,219,183,.76) 78px 86px, transparent 87px 151px),
      repeating-linear-gradient(-58deg, transparent 0 88px, rgba(218,216,178,.68) 89px 97px, transparent 98px 164px),
      linear-gradient(to bottom,
        #d8c998 0 14%,
        #b3a56f 14% 25%,
        #46482d 25% 32%,
        #66843d 32% 43%,
        #a5a06f 43% 55%,
        #4f5732 55% 100%);
  }

  .photo::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(20,30,18,.72) 0 6%, transparent 6% 48%, rgba(16,22,17,.55) 48% 52%, transparent 52%),
      linear-gradient(to bottom, transparent 0 28%, rgba(38,40,24,.75) 28% 31%, transparent 31% 100%),
      linear-gradient(90deg, transparent 0 65%, rgba(236,229,188,.75) 65% 68%, transparent 68%),
      radial-gradient(circle at 53% 76%, #5f7b2e 0 2.5%, #b9a944 2.7% 4%, transparent 4.3%);
    opacity: .82;
  }

  .photo::after {
    content: "[Photograph: interior atrium of the Transpacific Building]";
    position: absolute;
    left: -9999px;
  }

  .caption-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    min-height: 66px;
    padding: 13px 19px 10px 20px;
    font-size: 21px;
    font-style: italic;
    font-weight: 300;
    white-space: nowrap;
    letter-spacing: -.5px;
  }

  .caption-row .architect {
    text-align: right;
  }

  .slogan {
    height: 205px;
    padding-top: 54px;
    text-align: center;
    font-size: 53px;
    line-height: 1;
    font-style: italic;
    font-weight: 300;
    letter-spacing: -.7px;
  }

  .contact-area {
    display: grid;
    grid-template-columns: 2fr 1fr;
    padding: 0 19px 0 20px;
  }

  .company-line {
    margin-top: 1px;
    font-size: 24px;
    line-height: 1.25;
    white-space: nowrap;
  }

  .company-name {
    font-weight: 700;
  }

  .address {
    font-size: 22px;
    font-weight: 300;
  }

  .tagline {
    margin-top: 21px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 300;
    white-space: nowrap;
  }

  .tagline em {
    font-style: italic;
  }

  .contact-right {
    padding-top: 3px;
    text-align: right;
    font-size: 21px;
    line-height: 1.13;
    font-weight: 300;
  }

  .contact-right .phone-label {
    font-style: italic;
  }

  .footer {
    position: absolute;
    right: 46px;
    bottom: 27px;
    display: flex;
    align-items: baseline;
    gap: 13px;
    font-family: Georgia, "Times New Roman", serif;
    color: #29251f;
    font-size: 11px;
    white-space: nowrap;
  }

  .page-number {
    margin-left: 3px;
    font-weight: 700;
  }

  @media (max-width: 1000px) {
    .page {
      transform-origin: top left;
    }
  }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <section class="advertisement">
      <figure class="placeholder photo" role="img" aria-label="Photograph: interior atrium of the Transpacific Building">
        [Photograph: interior atrium of the Transpacific Building]
      </figure>

      <div class="caption-row">
        <div>Transpacific Building — Oakland, CA</div>
        <div class="architect">Wong &amp; Tung International Architects</div>
      </div>

      <div class="slogan">“tile that humanizes”</div>

      <div class="contact-area">
        <div class="contact-left">
          <div class="company-line">
            <span class="company-name">Heath Ceramics,</span>
            <span class="address"> Sausalito, CA 94965</span>
          </div>
          <div class="tagline">(Custom-made <em>by</em> people—not automated)</div>
        </div>

        <div class="contact-right">
          <div><span class="phone-label">Phone</span> (415) 332-3732</div>
          <div>Edith Heath</div>
          <div>Jon Brooder</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>September/October 1983</span>
      <span>Architecture California</span>
      <span class="page-number">3</span>
    </footer>
  </main>
</body>
</html>
