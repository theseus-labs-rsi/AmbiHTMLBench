<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十一月-任务(必做:支付管理费+拨款)</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      color: #161616;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    .page {
      width: 540px;
      height: 405px;
      padding-top: 62px;
      background: #ffffff;
      overflow: hidden;
    }

    h1 {
      margin: 0 14px 6px;
      font-size: 23px;
      line-height: 29px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    table {
      width: 514px;
      margin-left: 7px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
      line-height: 1.15;
    }

    col.sequence {
      width: 38px;
    }

    col.description {
      width: 105px;
    }

    col.position {
      width: 67px;
    }

    col.action {
      width: 132px;
    }

    col.start-time {
      width: 65px;
    }

    col.notes {
      width: 107px;
    }

    th,
    td {
      height: 31px;
      padding: 2px 4px;
      border: 1px solid #595959;
      text-align: center;
      vertical-align: middle;
      font-weight: 400;
      white-space: nowrap;
    }

    thead th {
      height: 29px;
      background: #ffffff;
      font-size: 10px;
      font-weight: 700;
    }

    tbody tr:nth-child(odd) td {
      background: #dce9f4;
    }

    tbody tr:nth-child(even) td {
      background: #ffffff;
    }

    @media (max-width: 540px) {
      .page {
        transform-origin: top left;
        transform: scale(calc(100vw / 540));
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>十一月-任务(必做:支付管理费+拨款)</h1>

    <table aria-label="十一月任务表">
      <colgroup>
        <col class="sequence">
        <col class="description">
        <col class="position">
        <col class="action">
        <col class="start-time">
        <col class="notes">
      </colgroup>
      <thead>
        <tr>
          <th>序号</th>
          <th>任务描述</th>
          <th>岗位</th>
          <th>操作动作</th>
          <th>开始时间</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>柔性线推进</td>
          <td>生产</td>
          <td>申请200w推进</td>
          <td>11月1日</td>
          <td>柔性线推进</td>
        </tr>
        <tr>
          <td>2</td>
          <td>订购原材料</td>
          <td>采购</td>
          <td>4份P3+4份P5</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>3</td>
          <td>九月订购的原料入库</td>
          <td>采购</td>
          <td>申请资金入库</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>申请贷款</td>
          <td>财务</td>
          <td>没钱就申请,有钱就不申请</td>
          <td>11月1日</td>
          <td>申请四季短贷</td>
        </tr>
        <tr>
          <td>5</td>
          <td>生产线预配</td>
          <td>生产</td>
          <td>全线开产</td>
          <td>11月1日</td>
          <td>收下9月的产品</td>
        </tr>
        <tr>
          <td>6</td>
          <td>交货</td>
          <td>销售</td>
          <td>交第三个订单</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>7</td>
          <td>应收账款</td>
          <td>财务</td>
          <td>收钱</td>
          <td>11月</td>
          <td>尽量不贴现</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
