<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女儿在国家展览馆看到的东西</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #fff;
  }

  body {
    display: flex;
    justify-content: center;
    font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
  }

  .canvas {
    position: relative;
    width: 760px;
    height: 760px;
    overflow: hidden;
    background: #fff;
  }

  .tabletop {
    position: absolute;
    top: 157px;
    left: 0;
    width: 760px;
    height: 405px;
    overflow: hidden;
    background:
      linear-gradient(104deg,
        #31210b 0%,
        #5f4614 18%,
        #8c7435 29%,
        #c5ab6d 44%,
        #ddc997 63%,
        #d5bd88 78%,
        #d9c79e 100%);
  }

  .tabletop::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .32;
    background:
      repeating-linear-gradient(
        8deg,
        rgba(76, 47, 8, .38) 0,
        rgba(76, 47, 8, .38) 1px,
        transparent 2px,
        transparent 8px
      );
  }

  .shadow {
    position: absolute;
    top: -38px;
    left: 82px;
    width: 255px;
    height: 220px;
    transform: rotate(-9deg);
    background: rgba(29, 18, 6, .28);
    filter: blur(16px);
  }

  .yellow-edge {
    position: absolute;
    top: 106px;
    left: 14px;
    width: 32px;
    height: 260px;
    transform: rotate(4deg);
    background: #c1a900;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  .paper {
    position: absolute;
    top: 90px;
    left: 24px;
    width: 708px;
    height: 320px;
    padding: 31px 30px 20px 59px;
    background:
      radial-gradient(circle at 48% 47%, rgba(240,236,218,.38), transparent 55%),
      linear-gradient(97deg, #f4f4ee 0%, #fbfaf5 73%, #efeee8 100%);
    transform: rotate(.55deg);
    clip-path: polygon(1% 0, 92% 1%, 100% 8%, 100% 100%, 0 100%);
    box-shadow: 0 2px 8px rgba(0,0,0,.24);
  }

  .question-number {
    position: absolute;
    top: 29px;
    left: 18px;
    font-family: "KaiTi", "STKaiti", cursive;
    font-size: 31px;
    font-style: italic;
    line-height: 1;
    transform: rotate(-7deg);
    color: #111;
  }

  .prompt {
    position: relative;
    width: 530px;
    color: #3f3d38;
    font-size: 13px;
    line-height: 1.85;
    letter-spacing: .15px;
  }

  .prompt .second-line {
    display: block;
  }

  .answer {
    position: absolute;
    top: 72px;
    left: 59px;
    width: 593px;
    color: #151515;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", cursive;
    font-size: 42px;
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -2px;
    transform: rotate(-1.1deg);
    text-shadow: .25px 0 #111;
  }

  .answer-line {
    position: relative;
    height: 43px;
    white-space: nowrap;
  }

  .line-one { transform: rotate(-.7deg); }
  .line-two { margin-left: -10px; transform: rotate(.2deg); }
  .line-three { margin-left: -18px; transform: rotate(-1deg); }
  .line-four { margin-left: -23px; transform: rotate(.6deg); }
  .line-five { margin-left: -20px; transform: rotate(-1.2deg); }

  .adjacent-page {
    position: absolute;
    top: 98px;
    right: -87px;
    width: 128px;
    height: 315px;
    transform: rotate(1.4deg);
    background: #f7f7f5;
    border-left: 1px solid rgba(130,130,120,.28);
    box-shadow: -2px 0 3px rgba(0,0,0,.08);
    color: #5b5b57;
    font-size: 7px;
    line-height: 2;
    padding: 31px 4px;
  }

  .adjacent-page .tiny {
    display: block;
    margin-bottom: 7px;
  }

  .adjacent-page .rule {
    width: 78px;
    margin: 24px 0 0 10px;
    border-top: 1px solid #aaa;
  }

  .bottom-white {
    position: absolute;
    top: 562px;
    left: 0;
    width: 760px;
    height: 198px;
    background: #fff;
  }
</style>
</head>
<body>
<main class="canvas" aria-label="手写回答页面">
  <section class="tabletop">
    <div class="shadow"></div>
    <div class="yellow-edge"></div>

    <article class="paper">
      <div class="question-number">26</div>

      <div class="prompt">
        你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>
        <span class="second-line">她看到了什么呢？</span>
      </div>

      <div class="answer" aria-label="手写回答">
        <div class="answer-line line-one">我蹲下来，“这根肋骨让你感</div>
        <div class="answer-line line-two">到不舒服吗？”</div>
        <div class="answer-line line-three">展览台上是一尊白玉莹莹的肋</div>
        <div class="answer-line line-four">骨，下面的文字介绍引用了夏娃</div>
        <div class="answer-line line-five">的来历，说女人都是由肋骨所化。</div>
      </div>
    </article>

    <aside class="adjacent-page" aria-label="右侧部分可见页面">
      <span class="tiny">[illegible]</span>
      <span class="tiny">[illegible]</span>
      <div class="rule"></div>
    </aside>
  </section>

  <div class="bottom-white"></div>
</main>
</body>
</html>
