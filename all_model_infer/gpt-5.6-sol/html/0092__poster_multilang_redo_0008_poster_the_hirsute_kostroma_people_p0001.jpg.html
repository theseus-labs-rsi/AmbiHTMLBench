<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Middlesex Music Hall - S. Emanuel's Benefit</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      padding: 20px;
      color: #211810;
      background: #080806;
      font-family: Georgia, "Times New Roman", serif;
    }

    .poster {
      width: min(100%, 1030px);
      min-height: 1480px;
      margin: 0 auto;
      padding: 24px 76px 88px;
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(circle at 16% 23%, rgba(98, 69, 31, 0.09), transparent 23%),
        radial-gradient(circle at 81% 70%, rgba(140, 92, 31, 0.07), transparent 28%),
        linear-gradient(90deg, rgba(91, 63, 31, 0.09), transparent 7%, transparent 93%, rgba(91, 63, 31, 0.08)),
        #e8d9b5;
      border: 1px solid #6d604a;
      box-shadow: 0 0 0 8px #080806;
    }

    .venue {
      margin: 0;
      font-family: Rockwell, "Roboto Slab", "Courier New", serif;
      font-size: clamp(38px, 5.4vw, 64px);
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #4b3c2c;
    }

    .address {
      width: 78%;
      margin: 0 auto 8px;
      padding: 0 0 7px;
      border-bottom: 3px solid #30271c;
      font-family: "Courier New", monospace;
      font-size: clamp(17px, 2.1vw, 25px);
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .benefit {
      margin: 4px -35px 0;
      font-family: Rockwell, "Roboto Slab", "Courier New", serif;
      font-size: clamp(43px, 6.4vw, 76px);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -1px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .date {
      margin: 2px 0 0;
      font-size: clamp(38px, 5.1vw, 61px);
      font-weight: 700;
      line-height: 1;
    }

    .notice {
      margin: 4px 0 20px;
      font-family: "Courier New", monospace;
      font-size: clamp(17px, 2.3vw, 27px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 2px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .debut {
      margin: 0;
      font-family: "Courier New", monospace;
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .people {
      margin: 0 -35px;
      color: #c63e24;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: clamp(61px, 9.4vw, 113px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .origin {
      margin: 1px 0 10px;
      font-size: clamp(17px, 2.2vw, 27px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .placeholder {
      display: flex;
      width: 100%;
      height: 850px;
      align-items: center;
      justify-content: center;
      margin: 8px auto 12px;
      border: 16px solid #d8ad18;
      outline: 2px solid rgba(120, 86, 17, 0.35);
      outline-offset: -10px;
      color: #30271c;
      background: #e3bd29;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-style: italic;
    }

    .image-caption {
      width: 100%;
      margin: 0;
      padding: 0 12px 7px;
      border-bottom: 2px solid #382d20;
      font-size: clamp(17px, 2.1vw, 25px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 1px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .poster {
        min-height: auto;
        padding: 18px 6vw 55px;
      }

      .venue,
      .benefit,
      .notice,
      .people,
      .origin,
      .image-caption {
        white-space: normal;
      }

      .benefit,
      .people {
        margin-right: -2vw;
        margin-left: -2vw;
      }

      .placeholder {
        height: 82vw;
        min-height: 360px;
        max-height: 850px;
        border-width: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="poster">
    <header>
      <h1 class="venue">MIDDLESEX MUSIC HALL,</h1>
      <div class="address">DRURY LANE,</div>
      <h2 class="benefit">S. EMANUEL'S BENEFIT</h2>
      <p class="date">Wednesday, Feb. 25th.</p>
      <p class="notice">POSITIVELY FOR THIS NIGHT ONLY.</p>
    </header>

    <section aria-label="The Hirsute Kostroma People">
      <p class="debut">THE HIRSUTE</p>
      <h2 class="people">KOSTROMA PEOPLE</h2>
      <p class="origin">FROM THE PRIMEVAL FORESTS OF CENTRAL RUSSIA.</p>

      <figure class="placeholder" role="img" aria-label="Illustration of the Kostroma People">
        <figcaption>[Illustration: a seated hirsute man and child]</figcaption>
      </figure>

      <p class="image-caption">THE FIRST OF THEIR KIND EVER SEEN IN ENGLAND.</p>
    </section>
  </main>
</body>
</html>
