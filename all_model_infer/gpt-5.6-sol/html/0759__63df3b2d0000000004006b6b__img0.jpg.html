  <section class="copy top-copy">
    <p>①前期<span class="u-blue">可以选择靠墙位置</span>，用玩具<br>或零食吸引狗狗注意力<span class="u-red">在人身上</span></p>
    <p>②如果狗狗出现前冲或者爆冲行<br>为，<span class="u-red">主人要握紧牵绳</span>，原地保持不<br>动，或者右转90度，让狗狗走在你<br>身后</p>
  </section>

  <section class="item3">
    ③狗狗一旦回头找你或者牵引绳恢复了松弛状态，<br>
    你再继续走，重复多次
  </section>

  <section class="bottom-copy1">
    <p>①系上牵引绳，将狗狗爱吃的零食<br>
    放在手上，当它想吃的时候，拉绳<br>
    子说NO,并握紧食物，反复训练直<br>
    到狗狗看到手中食物就避开</p>
  </section>

  <section class="bottom-copy2">
    <p>②当狗狗能做到在手里的食物可以成功<br>
    拒食后，<span class="u-red">可以把食物放在地上</span>，带狗狗经过，狗<br>
    狗嗅闻的时候，拉绳子说NO，直到狗狗无视地<br>
    上食物</p>
  </section>
