<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国际博物馆日</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d8d7cd;
    }

    body {
      display: flex;
      justify-content: center;
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      color: #123f39;
    }

    .poster {
      position: relative;
      width: 440px;
      height: 622px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 82% 10%, rgba(255,255,255,.42), transparent 25%),
        radial-gradient(ellipse at 15% 82%, rgba(255,255,255,.28), transparent 30%),
        #e5e4db;
      box-shadow: 0 0 0 1px rgba(40, 49, 43, .15);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      background:
        repeating-radial-gradient(ellipse at 82% 12%, transparent 0 17px, #817d6f 18px 20px, transparent 21px 35px),
        repeating-radial-gradient(ellipse at 10% 76%, transparent 0 26px, #817d6f 27px 29px, transparent 30px 48px);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 17px;
      left: 28px;
      z-index: 2;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .title-cn {
      font-size: 58px;
      line-height: .98;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-weight: 500;
    }

    .title-en {
      padding-top: 8px;
      width: 62px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.48;
      letter-spacing: 1px;
      color: #173b36;
    }

    .seal {
      position: absolute;
      top: 26px;
      left: 228px;
      width: 35px;
      height: 40px;
      border-radius: 5px;
      background: #c92b28;
      color: #f7d7a9;
      writing-mode: vertical-rl;
      text-align: center;
      padding: 3px 6px;
      font-size: 15px;
      line-height: 1.05;
      transform: rotate(-4deg);
    }

    .top-vertical {
      position: absolute;
      top: 20px;
      right: 13px;
      display: flex;
      gap: 5px;
      color: #213d38;
      font-size: 12px;
      line-height: 1.18;
      z-index: 2;
    }

    .top-vertical span {
      writing-mode: vertical-rl;
      border-left: 1px solid rgba(39, 64, 59, .55);
      padding-left: 3px;
    }

    .date-block {
      position: absolute;
      top: 178px;
      left: 16px;
      width: 80px;
      color: #163e38;
      z-index: 2;
    }

    .date-block::before,
    .date-block::after {
      content: "";
      position: absolute;
      left: 3px;
      width: 1px;
      background: #25453e;
    }

    .date-block::before {
      top: 35px;
      height: 82px;
    }

    .date-block::after {
      top: 245px;
      height: 84px;
    }

    .date-label {
      font-size: 21px;
      line-height: 1;
      margin-left: 12px;
    }

    .year {
      margin: 8px 0 0 14px;
      font-size: 17px;
    }

    .date {
      margin: 1px 0 0 13px;
      font-family: Georgia, serif;
      font-size: 22px;
      line-height: 1.12;
    }

    .date .slash {
      display: inline-block;
      margin: 0 4px;
      font-size: 29px;
      font-weight: 300;
      transform: rotate(10deg);
    }

    .date-note {
      margin: 13px 0 0 25px;
      font-size: 13px;
      line-height: 1.7;
      writing-mode: vertical-rl;
    }

    .side-words {
      position: absolute;
      top: 316px;
      left: 41px;
      z-index: 2;
      font-size: 14px;
      line-height: 2.55;
      writing-mode: vertical-rl;
    }

    .vessel {
      position: absolute;
      left: 104px;
      top: 174px;
      width: 250px;
      height: 417px;
      z-index: 1;
      border-radius: 44% 44% 35% 35% / 16% 16% 12% 12%;
      background:
        radial-gradient(ellipse at 50% 14%, #183f38 0 10%, #6a8176 11% 14%, transparent 16%),
        radial-gradient(ellipse at 50% 70%, #294c43 0 19%, #6d776b 20% 22%, transparent 24%),
        radial-gradient(ellipse at 28% 76%, #1a443c 0 14%, #839086 15% 17%, transparent 20%),
        radial-gradient(ellipse at 73% 76%, #173c35 0 14%, #77867c 15% 17%, transparent 20%),
        linear-gradient(90deg, #173d35 0 9%, #718379 15%, #31584c 27%, #74887b 42%, #1d473e 53%, #718277 68%, #21483e 84%, #12382f 94%);
      box-shadow:
        inset 10px 0 12px rgba(0,0,0,.35),
        inset -10px 0 12px rgba(0,0,0,.38),
        0 5px 5px rgba(34,47,40,.28);
      filter: saturate(.78);
    }

    .vessel::before {
      content: "[青铜器]";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(214, 215, 194, .26);
      font-size: 12px;
      letter-spacing: 3px;
      text-shadow: 0 1px 2px #16362f;
    }

    .vessel::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 0;
      height: 21px;
      border-radius: 50%;
      background: #21483e;
      box-shadow: inset 0 4px 5px rgba(181,181,151,.35), 0 3px 2px rgba(0,0,0,.3);
    }

    .small-vessel {
      position: absolute;
      left: 36px;
      top: 424px;
      width: 37px;
      height: 70px;
      z-index: 2;
      border-radius: 38% 38% 18% 18%;
      background: linear-gradient(90deg, #153b34, #6d8074 42%, #264e44 61%, #173a32);
      box-shadow: inset 0 0 6px rgba(0,0,0,.5);
    }

    .small-vessel::after {
      content: "";
      position: absolute;
      left: -5px;
      right: -5px;
      bottom: 0;
      height: 7px;
      border-radius: 50%;
      background: #173b33;
    }

    .right-copy {
      position: absolute;
      top: 143px;
      right: 10px;
      width: 55px;
      height: 132px;
      overflow: hidden;
      color: #263f3a;
      font-size: 7px;
      line-height: 1.35;
      writing-mode: vertical-rl;
      text-orientation: upright;
      z-index: 2;
    }

    .right-copy p {
      margin: 0;
    }

    .bottom-left,
    .bottom-right {
      position: absolute;
      bottom: 25px;
      z-index: 3;
      color: #16423b;
      font-size: 14px;
      line-height: 1.45;
    }

    .bottom-left {
      left: 24px;
    }

    .bottom-right {
      right: 24px;
    }

    .bottom-left::before,
    .bottom-right::before {
      content: "•";
      position: absolute;
      top: -21px;
      font-size: 17px;
    }

    .bottom-left::before {
      left: -9px;
    }

    .bottom-right::before {
      left: -9px;
    }

    .bottom-left .en,
    .bottom-right .en {
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="poster">
    <header class="title">
      <div class="title-cn">国际<br>博物馆日</div>
      <div class="title-en">International<br>Museum<br>Day</div>
    </header>

    <div class="seal">重<br>型</div>

    <div class="top-vertical">
      <span>遗梦今古</span>
      <span>穿越古今</span>
    </div>

    <section class="date-block">
      <div class="date-label">时间：</div>
      <div class="year">2021</div>
      <div class="date">5<span class="slash">/</span>18</div>
      <div class="date-note">一 两</div>
    </section>

    <div class="side-words">处处<br>文情<br>物怀</div>

    <div class="right-copy">
      <p>1国际博物馆日为每年的5月18日。国际博物馆协会于1977年发起，旨在促进全球博物馆事业的发展。</p>
    </div>

    <div class="vessel" role="img" aria-label="[青铜器：中央]"></div>
    <div class="small-vessel" role="img" aria-label="[青铜器：左下]"></div>

    <div class="bottom-left">与历史相遇<br><span class="en">MING</span><br>明兴亡</div>
    <div class="bottom-right">打开时代<br><span class="en">DE</span><br>任意门</div>
  </main>
</body>
</html>
