<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句摘抄——坚持奋斗主题</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #d8cbb7;
    }

    body {
      font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      color: #393432;
      background: #d8cbb7;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 540px;
      height: 174px;
      background: #fff2e9;
      border-bottom: 3px solid #c9c1b5;
    }

    .logo {
      position: absolute;
      top: 32px;
      left: 24px;
      width: 260px;
      height: 108px;
      color: #cf1d2c;
    }

    .logo-cn {
      white-space: nowrap;
      font-family: "STKaiti", "KaiTi", "FZKai-Z03", cursive;
      font-size: 64px;
      line-height: 88px;
      font-weight: 700;
      letter-spacing: 1px;
      transform: scaleX(1.04);
      transform-origin: left center;
    }

    .logo-en {
      position: absolute;
      top: 108px;
      left: 60px;
      white-space: nowrap;
      color: #9c6565;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 2px;
    }

    .top-heading {
      position: absolute;
      top: 28px;
      left: 358px;
      width: 182px;
      height: 52px;
      display: flex;
      align-items: flex-start;
      padding-left: 2px;
      border-bottom: 3px solid #3d3936;
      white-space: nowrap;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 30px;
      line-height: 39px;
      font-weight: 700;
    }

    .top-heading .divider {
      height: 34px;
      margin: 1px 15px 0 14px;
      border-left: 2px solid #3d3936;
    }

    .sub-heading {
      position: absolute;
      top: 101px;
      left: 308px;
      width: 232px;
      height: 53px;
      padding-left: 11px;
      border-bottom: 3px solid #3d3936;
      white-space: nowrap;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 30px;
      line-height: 41px;
      font-weight: 700;
    }

    .main-title {
      position: absolute;
      top: 178px;
      left: 0;
      width: 540px;
      text-align: center;
      white-space: nowrap;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 43px;
      line-height: 59px;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .example-one-label {
      position: absolute;
      top: 300px;
      left: 27px;
      font-size: 17px;
      line-height: 24px;
    }

    .example-one-text {
      position: absolute;
      top: 349px;
      left: 27px;
      white-space: nowrap;
      font-size: 18px;
      line-height: 23px;
    }

    .large-quote {
      position: absolute;
      top: 428px;
      left: 0;
      width: 540px;
      text-align: center;
      white-space: nowrap;
      font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
      font-size: 43px;
      line-height: 59px;
      font-weight: 400;
      letter-spacing: 3px;
    }

    .example-two-label {
      position: absolute;
      top: 576px;
      left: 35px;
      font-size: 17px;
      line-height: 24px;
    }

    .example-two-text {
      position: absolute;
      top: 621px;
      left: 35px;
      width: 490px;
      font-size: 17px;
      line-height: 22px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="logo">
        <div class="logo-cn">人民日报</div>
        <div class="logo-en">RENMIN RIBAO</div>
      </div>

      <div class="top-heading">
        <span>金句</span>
        <span class="divider"></span>
        <span>摘抄</span>
      </div>

      <div class="sub-heading">坚持奋斗主题</div>
    </header>

    <div class="main-title">
      夜色难免黑凉<br>
      前行必有曙光
    </div>

    <div class="example-one-label">举例:</div>

    <div class="example-one-text">
      夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，<br>
      只要勇敢向前必定成功!
    </div>

    <div class="large-quote">
      道虽远，笃行可至<br>
      事虽巨，坚为必成
    </div>

    <div class="example-two-label">举例:</div>

    <div class="example-two-text">
      道虽远，笃行可至;事虽巨，坚为必成。一个人也好，一个<br>
      个国家也好，最可贵的就是心中有梦想，并且为实现梦想<br>
      不惧风雨、实干笃行、砥砺奋斗。
    </div>
  </div>
</body>
</html>
