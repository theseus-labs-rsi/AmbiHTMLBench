<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业思维｜底层逻辑｜个人提升</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f2f1ed;
  }

  body {
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Heiti SC", sans-serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 722px;
    overflow: hidden;
    background: #f2f1ed;
    color: #090909;
  }

  .section {
    position: absolute;
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.76;
    letter-spacing: -0.55px;
    white-space: nowrap;
  }

  .section-one {
    top: 24px;
    left: 34px;
  }

  .section-two {
    top: 272px;
    left: 40px;
  }

  .section-three {
    top: 429px;
    left: 40px;
  }

  .accent {
    color: #51a198;
  }

  .footer {
    position: absolute;
    top: 667px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #4d9c94;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0;
    white-space: nowrap;
  }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<main class="page">
  <p class="section section-one">
    1、<span class="accent">你开始炫耀自己，往往都是灾难的开始。</span><br>
    就像老子在《道德经》里写到：“光而不耀，<br>
    静水流深。” 意思就是，无论身处什么位置，<br>
    什么环境，嘴上不逞强、不炫耀、不狂妄才能<br>
    兜住自己的福气。
  </p>

  <p class="section section-two">
    2、一个冷知识：<span class="accent">屏蔽力是一个人最顶级</span><br>
    <span class="accent">的能力</span>，任何消耗你的人和事，多看一眼<br>
    都是你的不对。
  </p>

  <p class="section section-three">
    3、大学时辅导员说了一句受益一生的<br>
    话：“<span class="accent">你不用变得很外向，内向挺好的，</span><br>
    <span class="accent">但需要你发言的时候，一定要勇敢。</span>”&ensp;正<br>
    所谓：君子可内敛不可懦弱，面不公可起<br>
    而论之。
  </p>

  <div class="footer">商业思维｜底层逻辑｜个人提升</div>
</main>
</body>
</html>
