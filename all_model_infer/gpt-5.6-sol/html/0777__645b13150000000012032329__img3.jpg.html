<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三页手写文稿</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d4d1c9;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
      font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 405px;
      overflow: hidden;
      background:
        linear-gradient(to right, rgba(114, 132, 129, 0.27) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(114, 132, 129, 0.20) 1px, transparent 1px),
        #d8d7d1;
      background-size: 30px 100%, 100% 24px;
      background-position: 16px 38px;
      box-shadow: inset 0 0 42px rgba(55, 48, 38, 0.16);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(70, 62, 52, 0.08),
        transparent 9%,
        transparent 89%,
        rgba(70, 62, 52, 0.09)
      );
      pointer-events: none;
    }

    .page-number {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 34px;
      color: #fff35a;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 27px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0;
      line-height: 1;
      text-shadow:
        -2px -2px 0 #24231b,
        2px -2px 0 #24231b,
        -2px 2px 0 #24231b,
        2px 2px 0 #24231b;
      transform: rotate(-3deg);
    }

    .manuscript {
      position: absolute;
      top: 31px;
      right: 29px;
      bottom: 49px;
      left: 27px;
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
      align-items: flex-start;
      color: #25231e;
    }

    .column {
      width: 27px;
      height: 314px;
      overflow: hidden;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 20px;
      line-height: 1.22;
      letter-spacing: 1px;
      white-space: normal;
      transform-origin: top center;
    }

    .c1 {
      margin-top: 8px;
      transform: rotate(2deg);
    }

    .c2 {
      margin-top: 14px;
      transform: rotate(-1deg);
    }

    .c3 {
      margin-top: 0;
      transform: rotate(2deg);
    }

    .c4 {
      margin-top: 1px;
      transform: rotate(-2deg);
    }

    .c5 {
      margin-top: 5px;
      transform: rotate(1deg);
    }

    .c6 {
      margin-top: 17px;
      transform: rotate(-2deg);
    }

    .c7 {
      margin-top: 1px;
      transform: rotate(3deg);
    }

    .c8 {
      margin-top: 5px;
      transform: rotate(-1deg);
    }

    .c9 {
      margin-top: 17px;
      transform: rotate(2deg);
    }

    .c10 {
      margin-top: 8px;
      transform: rotate(-2deg);
    }

    .c11 {
      margin-top: 58px;
      transform: rotate(2deg);
    }

    .c12 {
      margin-top: 94px;
      transform: rotate(-2deg);
    }

    .seal {
      position: absolute;
      left: 72px;
      bottom: 140px;
      width: 27px;
      height: 39px;
      border: 3px solid #a73329;
      color: #a73329;
      background: rgba(222, 215, 199, 0.65);
      font-family: serif;
      font-size: 7px;
      font-weight: bold;
      line-height: 1.05;
      text-align: center;
      writing-mode: vertical-rl;
      padding: 2px;
      transform: rotate(-4deg);
    }
  </style>
</head>
<body>
  <main class="page" aria-label="第三页手写文稿">
    <div class="page-number">第三页</div>

    <section class="manuscript" aria-label="竖排手写正文">
      <div class="column c1">因为它的[illegible]，才[illegible]</div>
      <div class="column c2">南[illegible]一[?]下去了，也是不会</div>
      <div class="column c3">用今古[illegible]令人[illegible]</div>
      <div class="column c4">的[illegible]，故而令人抱憾的又何</div>
      <div class="column c5">上终于鸣叫[illegible]</div>
      <div class="column c6">于是，[illegible]说话声[illegible]</div>
      <div class="column c7">多，也要尽量训练出来才好。</div>
      <div class="column c8">甚[illegible]，以他偏颇的[illegible]</div>
      <div class="column c9">我[illegible]来，却是大[illegible]</div>
      <div class="column c10">请记吧。小[illegible]，身体健康！</div>
      <div class="column c11">莫言</div>
      <div class="column c12">给了我七日的[illegible]</div>
    </section>

    <div class="seal placeholder" role="img" aria-label="左下方红色印章">[印章]</div>
  </main>
</body>
</html>
