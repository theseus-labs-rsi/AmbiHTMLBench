<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypertension – Therapy goal</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000008;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .slide {
      position: relative;
      width: min(100vw, 133.333vh);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      color: #f3f3f3;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 8px,
          rgba(111, 111, 166, 0.42) 8px,
          rgba(111, 111, 166, 0.42) 9px
        ),
        linear-gradient(
          to bottom,
          #010108 0%,
          #01010d 43%,
          #00003b 74%,
          #000050 100%
        );
    }

    .title {
      position: absolute;
      top: 9.4%;
      left: 4.1%;
      margin: 0;
      color: #ffff00;
      font-size: clamp(20px, 5.3vw, 54px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .rule {
      position: absolute;
      height: max(2px, 0.38%);
      background: #d51d26;
      box-shadow: 0 0 2px rgba(255, 40, 40, 0.45);
    }

    .rule-top {
      top: 19.8%;
      left: 4.1%;
      width: 91.8%;
    }

    .rule-bottom {
      top: 93.1%;
      left: 1%;
      width: 91.7%;
      height: max(2px, 0.25%);
      background: #ba2939;
    }

    .section {
      position: absolute;
      left: 4.15%;
      right: 3%;
    }

    .goal {
      top: 27.2%;
    }

    .truth {
      top: 57.0%;
    }

    .heading {
      position: relative;
      margin: 0;
      padding-left: 2.55%;
      color: #f3f3f3;
      font-size: clamp(18px, 4.65vw, 48px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .heading::before {
      content: "•";
      position: absolute;
      left: 0;
      top: -0.02em;
      color: #f3f3f3;
      font-size: 0.68em;
    }

    .subpoints {
      margin-top: 0.2%;
      margin-left: 5%;
      color: #5795e7;
      font-size: clamp(15px, 3.75vw, 39px);
      font-weight: 400;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .subpoint {
      position: relative;
      margin: 0;
      padding-left: 3.5%;
      white-space: nowrap;
    }

    .subpoint::before {
      content: "–";
      position: absolute;
      left: 0;
      top: 0;
    }

    .truth .subpoints {
      margin-top: 0.7%;
      margin-left: 2.5%;
    }

    .truth .subpoint {
      padding-left: 3.2%;
    }
  </style>
</head>
<body>
  <main class="slide" aria-label="Presentation slide">
    <h1 class="title">Hypertension – Therapy goal</h1>

    <div class="rule rule-top" aria-hidden="true"></div>

    <section class="section goal">
      <h2 class="heading">Goal BP</h2>
      <div class="subpoints">
        <p class="subpoint">To Keep B.P. &lt; 140/90 mm Hg in each patient</p>
        <p class="subpoint">This may be revised to 120/80&nbsp; may be ? 110/70</p>
        <p class="subpoint">MRFIT’s cut off values are 115/75 mm Hg</p>
      </div>
    </section>

    <section class="section truth">
      <h2 class="heading">The Truth is</h2>
      <div class="subpoints">
        <p class="subpoint">It is essential to keep the B.P at or below the goal</p>
        <p class="subpoint">But, It also matters how the goal B.P. is achieved !</p>
      </div>
    </section>

    <div class="rule rule-bottom" aria-hidden="true"></div>
  </main>
</body>
</html>
