<!DOCTYPE html>
<html lang="zh-CN">

  <script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #285844;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    .poster {
      position: relative;
      width: min(540px, 100vw);

      overflow: hidden;
      container-type: inline-size;
      background: #285844;
      color: #ffffff;
    }

    .title {

      font-size: 10.4cqw;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.1cqw;
      white-space: nowrap;
    }

    .title span {
      display: block;
    }

    .account {
      position: absolute;
      top: 31.1%;
      left: 6.9%;
      width: 39.1%;
      height: 4.8%;
      padding: 0 2.4%;
      display: flex;
      align-items: center;
      background: #f4c900;
      color: #ffffff;
      font-size: 3.2cqw;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .panel {
      position: absolute;
      padding: 2.1% 2.4%;
      color: #ffffff;
      font-size: 3.3cqw;
      line-height: 1.28;
    }

    .panel .part {
      display: block;
      margin-bottom: 8.5%;
      font-weight: 400;
    }

    .panel .content {
      display: block;
      font-weight: 700;
    }

    .muted {
      background: #91a47f;
    }

    .bright {
      background: #62a161;
    }

    .part01 {
      top: 40.6%;
      left: 6.9%;
      width: 18.1%;
      height: 36%;
    }

    .part01 .part {

    .part02 {

      left: 27.4%;
      width: 21.5%;
      height: 13.2%;
    }

    .part03 {
      top: 55.3%;
      left: 27.4%;
      width: 21.5%;
      height: 21.3%;
    }

    .part04 {
      top: 78.2%;
      left: 6.9%;
      width: 42%;
      height: 13.3%;
    }

    .part04 .part {
      margin-bottom: 11%;

    <section class="panel muted part02">
      <span class="part">Part 02</span>

    <section class="panel muted part03">
