<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语C术语说明</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    .page {
      width: 535px;
      min-height: 953px;
      padding: 3px 34px 12px 35px;
      color: #414141;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.29;
      letter-spacing: 0;
    }

    dl,
    dt,
    dd {
      margin: 0;
      padding: 0;
    }

    dt {
      font-weight: 700;
      line-height: 1.27;
    }

    dd {
      line-height: 1.29;
    }
  </style>
</head>
<body>
  <main class="page">
    <dl>
      <dt>审核：</dt>
      <dd>指进入语c群时，被群主审看人设、皮气等<br>行为。</dd>

      <dt>新人：</dt>
      <dd>指初入某个圈子的人。</dd>

      <dt>纯白：</dt>
      <dd>完全不了解语c的人或刚接触语c。</dd>

      <dt>小白：</dt>
      <dd>指出入语c圈或对语c一无所知的人。</dd>

      <dt>小窗：</dt>
      <dd>指聊天会话的窗口（与QQ的私聊差不多）</dd>

      <dt>隔壁：</dt>
      <dd>指代另一个地方（隔壁群，隔壁平台）</dd>

      <dt>首页：</dt>
      <dd>在语c平台中，上皮发言互动的地方。</dd>

      <dt>水区：</dt>
      <dd>在语c平台中，皮下发言探讨问题或闲聊的<br>地方。</dd>

      <dt>扩列：</dt>
      <dd>扩充列表，即加好友的意思。</dd>

      <dt>掌控：</dt>
      <dd>指开戏文字超过七百一段的人。</dd>

      <dt>字控：</dt>
      <dd>夸张手法，指一次开几个字为一段的人。</dd>

      <dt>句控：</dt>
      <dd>指开戏只开一行～三行为一段的人。</dd>
    </dl>
  </main>
</body>
</html>
