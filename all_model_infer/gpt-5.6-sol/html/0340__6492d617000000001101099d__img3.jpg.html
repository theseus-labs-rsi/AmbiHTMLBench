<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算思维二：分解思维</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f2f2f2;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", SimHei, sans-serif;
      color: #090909;
    }

    .page {
      position: relative;
      width: 540px;
      height: 730px;
      overflow: hidden;
      background: #fff;
    }

    .corner {
      position: absolute;
      width: 67px;
      height: 77px;
      border-color: #9ab7aa;
      border-style: solid;
      border-width: 0;
    }

    .corner.top-left {
      top: 29px;
      left: 27px;
      border-top-width: 2px;
      border-left-width: 2px;
    }

    .corner.top-right {
      top: 29px;
      right: 27px;
      border-top-width: 2px;
      border-right-width: 2px;
    }

    .corner.bottom-left {
      bottom: 38px;
      left: 27px;
      border-bottom-width: 2px;
      border-left-width: 2px;
    }

    .corner.bottom-right {
      right: 27px;
      bottom: 38px;
      border-right-width: 2px;
      border-bottom-width: 2px;
    }

    h1 {
      position: absolute;
      top: 49px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-family: SimHei, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .content {
      position: absolute;
      top: 118px;
      left: 66px;
      width: 410px;
      font-size: 18px;
      line-height: 1.36;
    }

    .intro {
      margin: 0 0 21px;
    }

    .red {
      color: #e41420;
    }

    .section {
      margin: 0 0 19px;
    }

    .section-title {
      margin: 0 0 22px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .section-text {
      margin: 0;
      line-height: 1.32;
    }

    .section.two {
      margin-top: 22px;
      margin-bottom: 25px;
    }

    .section.two .section-title {
      margin-bottom: 26px;
    }

    .section.three .section-title {
      margin-bottom: 24px;
    }

    .next-page {
      position: absolute;
      right: 47px;
      bottom: 51px;
      width: 66px;
      height: 52px;
    }

    .next-page .shaft {
      position: absolute;
      top: 13px;
      left: 0;
      width: 39px;
      height: 27px;
      background: #050505;
    }

    .next-page .head {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 26px solid transparent;
      border-bottom: 26px solid transparent;
      border-left: 27px solid #050505;
    }

    .next-page .label {
      position: absolute;
      z-index: 1;
      top: 16px;
      left: 9px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 21px;
      white-space: nowrap;
    }

    .footer {
      position: absolute;
      bottom: 18px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"]],
        displayMath: [["$$", "$$"]]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div class="corner top-left" aria-hidden="true"></div>
    <div class="corner top-right" aria-hidden="true"></div>
    <div class="corner bottom-left" aria-hidden="true"></div>
    <div class="corner bottom-right" aria-hidden="true"></div>

    <h1>计算思维二：分解思维</h1>

    <div class="content">
      <p class="intro">
        分解思维是指<span class="red">将复杂的问题（或任务）拆解成一<br>个个更易于解决的小问题（或任务）</span>。
      </p>

      <section class="section one">
        <h2 class="section-title">1、问题梳理</h2>
        <p class="section-text">
          先明确这个复杂问题到底是什么，最终要达到什<br>
          么目的或效果。
        </p>
      </section>

      <section class="section two">
        <h2 class="section-title">2、问题分解</h2>
        <p class="section-text">
          将复杂问题进行分解，梳理解决这个问题需要哪<br>
          几步，每一步需要干什么事情，具体要怎么做，<br>
          这就是一个个的小任务。
        </p>
      </section>

      <section class="section three">
        <h2 class="section-title">3、整合方案</h2>
        <p class="section-text">
          制定方案去解决每个小任务，然后将解决方案整<br>
          合起来，就能轻松解决这个复杂问题了。
        </p>
      </section>
    </div>

    <div class="next-page" aria-label="翻页">
      <div class="shaft"></div>
      <div class="head"></div>
      <span class="label">翻 页</span>
    </div>

    <p class="footer">原创：学习方法社</p>
  </main>
</body>
</html>
