<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用合理的标点符号</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ededed;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #171717;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #fff;
    }

    .header {
      position: absolute;
      top: 28px;
      left: 88px;
      right: 89px;
      height: 135px;
    }

    .title {
      position: absolute;
      top: 7px;
      left: 0;
      margin: 0;
      font-size: 31px;
      line-height: 1.46;
      font-weight: 900;
      letter-spacing: 0;
    }

    .title-line {
      position: relative;
      display: table;
      height: 42px;
      z-index: 1;
    }

    .title-line::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -2px;
      right: -4px;
      bottom: 6px;
      height: 24px;
      background: #ffeb24;
    }

    .number {
      position: absolute;
      top: 12px;
      right: 1px;
      width: 76px;
      height: 76px;
      border: 1px solid #dedede;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      color: #282828;
    }

    .subtitle {
      position: absolute;
      left: 0;
      bottom: 4px;
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      white-space: nowrap;
    }

    .panel {
      position: absolute;
      left: 88px;
      width: 363px;
    }

    .panel-good {
      top: 176px;
      height: 232px;
      background: #fff7f4;
    }

    .panel-bad {
      top: 428px;
      height: 231px;
      background: #f3f7ff;
    }

    .panel-heading {
      position: absolute;
      top: 28px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0;
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
    }

    .mark-circle {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      border: 2px solid #d8a164;
      border-radius: 50%;
    }

    .mark-cross {
      position: relative;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
    }

    .mark-cross::before,
    .mark-cross::after {
      content: "";
      position: absolute;
      top: 11px;
      left: 1px;
      width: 25px;
      height: 2px;
      background: #74a5d3;
    }

    .mark-cross::before {
      transform: rotate(45deg);
    }

    .mark-cross::after {
      transform: rotate(-45deg);
    }

    .example {
      position: absolute;
      left: 98px;
      font-size: 14px;
      line-height: 1.55;
      white-space: nowrap;
    }

    .good-first {
      top: 78px;
    }

    .good-second {
      top: 150px;
    }

    .bad-example {
      top: 98px;
    }

    .example-row {
      height: 22px;
    }

    .label {
      display: inline-block;
      min-width: 34px;
      font-weight: 800;
    }

    .divider {
      display: inline-block;
      margin: 0 6px 0 1px;
      color: #333;
      font-weight: 400;
    }

    .boxed-label {
      display: inline-block;
      width: 33px;
      height: 18px;
      margin-right: 6px;
      color: #fff;
      background: #ff6f74;
      text-align: center;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      vertical-align: 1px;
    }

    .colon-label {
      display: inline-block;
      font-weight: 800;
    }

    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #7b5939;
      border: 1px dashed rgba(123, 89, 57, 0.35);
      background: rgba(255, 255, 255, 0.26);
      text-align: center;
      font-size: 8px;
      line-height: 1.15;
    }

    .good-illustration {
      right: 8px;
      bottom: -14px;
      width: 68px;
      height: 78px;
    }

    .bad-illustration {
      right: 7px;
      bottom: -18px;
      width: 69px;
      height: 77px;
    }

    .footer-rule {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 38px;
      height: 1px;
      background: #e4e4e4;
    }

    .footer-left {
      position: absolute;
      left: 28px;
      bottom: 13px;
      font-family: Arial, sans-serif;
      font-size: 5px;
      line-height: 1.2;
      font-weight: 700;
      color: #242424;
    }

    .footer-badge {
      position: absolute;
      right: 27px;
      bottom: 12px;
      width: 43px;
      height: 22px;
      border: 1px solid #8b8b8b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      font-family: Arial, sans-serif;
      font-size: 4px;
      line-height: 1.05;
      text-align: center;
      color: #222;
    }

    @media (max-width: 540px) {
      .page {
        transform-origin: top center;
        transform: scale(calc(100vw / 540));
        margin-bottom: calc((100vw / 540 - 1) * 720px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 class="title">
        <span class="title-line">使用合理的</span>
        <span class="title-line">标点符号</span>
      </h1>
      <div class="number">01</div>
      <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>
    </header>

    <section class="panel panel-good">
      <h2 class="panel-heading">
        <span class="mark-circle" aria-hidden="true"></span>
        <span>使用直线或外框</span>
      </h2>

      <div class="example good-first">
        <div class="example-row">
          <span class="label">地点</span><span class="divider">|</span><span>武汉国际会展中心</span>
        </div>
        <div class="example-row">
          <span class="label">时间</span><span class="divider">|</span><span>2018 年 8 月 20 日</span>
        </div>
      </div>

      <div class="example good-second">
        <div class="example-row">
          <span class="boxed-label">地点</span><span>武汉国际会展中心</span>
        </div>
        <div class="example-row">
          <span class="boxed-label">时间</span><span>2018 年 8 月 20 日</span>
        </div>
      </div>

      <figure class="placeholder good-illustration">[Illustration:<br>bottom-right]</figure>
    </section>

    <section class="panel panel-bad">
      <h2 class="panel-heading">
        <span class="mark-cross" aria-hidden="true"></span>
        <span>使用冒号</span>
      </h2>

      <div class="example bad-example">
        <div class="example-row">
          <span class="colon-label">地点：</span><span>武汉国际会展中心</span>
        </div>
        <div class="example-row">
          <span class="colon-label">时间：</span><span>2018 年 8 月 20 日</span>
        </div>
      </div>

      <figure class="placeholder bad-illustration">[Illustration:<br>bottom-right]</figure>
    </section>

    <div class="footer-rule"></div>
    <div class="footer-left">
      ADVERTISING CREATIVITY<br>
      2023.05
    </div>
    <div class="footer-badge">[illegible]</div>
  </main>
</body>
</html>
