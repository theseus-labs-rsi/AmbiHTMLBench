      margin: 0;
      background: #fff;

      border-radius: 60% 35% 30% 45%;
      background: linear-gradient(145deg, #f4f4f4, #dedede);

      z-index: 1;
      left: 5px;
      right: 5px;
      top: 50%;

      font-family: Arial, sans-serif;

      line-height: 11px;
      text-align: center;

      color: #4b4b4b;

      font-size: 15.5px;
