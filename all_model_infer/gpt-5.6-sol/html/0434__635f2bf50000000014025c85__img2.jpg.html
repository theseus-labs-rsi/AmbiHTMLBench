<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民族追梦史海报</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #eeeeee;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.poster {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  font-family: "STKaiti", "KaiTi", "FangSong", serif;
  background: #413f5e;
}

.top-zone {
  position: relative;
  width: 100%;
  height: 294px;
  overflow: hidden;
  background: #ead3a2;
  color: #393952;
}

.top-heading {
  position: absolute;
  z-index: 4;
  top: 75px;
  left: 57px;
  margin: 0;
  font-size: 31px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}

.red-ring {
  position: absolute;
  z-index: 4;
  top: 60px;
  left: 201px;
  width: 68px;
  height: 68px;
  border: 13px solid #cf0000;
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 1px 2px rgba(80, 0, 0, 0.25);
}

.top-copy {
  position: absolute;
  z-index: 4;
  top: 158px;
  left: 57px;
  margin: 0;
  font-size: 22px;
  line-height: 42px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.watermark {
  position: absolute;
  z-index: 3;
  color: rgba(255, 245, 215, 0.38);
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 27px;
  font-weight: 700;
  white-space: nowrap;
  transform: rotate(-17deg);
  pointer-events: none;
}

.top-watermark {
  top: 147px;
  left: 151px;
}

.photo-placeholder {
  position: absolute;
  z-index: 2;
  top: 81px;
  right: -2px;
  width: 201px;
  height: 216px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
  clip-path: polygon(
    29% 7%, 42% 1%, 58% 2%, 69% 8%, 76% 21%,
    77% 51%, 68% 65%, 84% 73%, 100% 90%, 100% 100%,
    0 100%, 5% 81%, 20% 72%, 23% 57%, 20% 40%
  );
  background:
    radial-gradient(circle at 49% 35%, #b27b5d 0 19%, transparent 20%),
    radial-gradient(circle at 48% 23%, #4d342b 0 24%, transparent 25%),
    linear-gradient(145deg, #313454 8%, #50547a 52%, #292b47 100%);
  color: rgba(255, 255, 255, 0.62);
  border: 5px solid #3d4167;
  font: 11px/1.25 Arial, sans-serif;
  text-align: center;
}

.photo-caption {
  transform: translateY(-8px);
}

.photo-slogan {
  position: absolute;
  z-index: 7;
  right: 6px;
  bottom: -2px;
  color: #ffffff;
  font-family: "Microsoft YaHei", "SimHei", sans-serif;
  font-size: 27px;
  line-height: 34px;
  font-weight: 900;
  letter-spacing: -1px;
  white-space: nowrap;
  text-shadow:
    2px 2px 0 #b52228,
    3px 3px 0 #7f1c28,
    -1px 1px 0 #b52228;
}

.bottom-zone {
  position: relative;
  width: 100%;
  height: 426px;
  background: #413f5e;
  color: #f3dca9;
  border-top: 2px solid rgba(35, 34, 52, 0.55);
}

.bottom-heading {
  position: absolute;
  z-index: 4;
  top: 61px;
  left: 57px;
  margin: 0;
  font-size: 35px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}

.checkmark {
  position: absolute;
  z-index: 4;
  top: 37px;
  left: 293px;
  width: 89px;
  height: 66px;
  transform: rotate(-8deg);
}

.checkmark::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 31px;
  width: 31px;
  height: 13px;
  border-radius: 4px;
  background: #72be45;
  transform: rotate(53deg);
  box-shadow: 0 1px 1px rgba(16, 69, 14, 0.25);
}

.checkmark::after {
  content: "";
  position: absolute;
  left: 23px;
  top: 23px;
  width: 72px;
  height: 14px;
  border-radius: 5px;
  background: #72be45;
  transform: rotate(-43deg);
  transform-origin: left center;
  box-shadow: 0 1px 1px rgba(16, 69, 14, 0.25);
}

.bottom-copy {
  position: absolute;
  z-index: 4;
  top: 123px;
  left: 57px;
  width: 430px;
  margin: 0;
  color: #f1d9a5;
  font-size: 20px;
  line-height: 37px;
  font-weight: 700;
  letter-spacing: 0.25px;
  white-space: nowrap;
}

.bottom-watermark {
  z-index: 3;
  top: 194px;
  left: 206px;
  color: rgba(246, 226, 173, 0.17);
  font-size: 27px;
}

.attribution {
  position: absolute;
  z-index: 4;
  right: 37px;
  bottom: 14px;
  margin: 0;
  color: #ffffff;
  font-family: "SimSun", serif;
  font-size: 14px;
  line-height: 1;
  font-weight: 700;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="poster">
  <section class="top-zone">
    <h1 class="top-heading">我写的：</h1>
    <div class="red-ring" aria-label="红色圆圈"></div>

    <p class="top-copy">我们民族的追梦史充满<br>艰辛。</p>

    <div class="watermark top-watermark">青春女纸</div>

    <figure class="placeholder photo-placeholder">
      <figcaption class="photo-caption">[Photo: upper-right]</figcaption>
    </figure>

    <div class="photo-slogan">学习使我妈快乐</div>
  </section>

  <section class="bottom-zone">
    <h2 class="bottom-heading">人民日报写的：</h2>
    <div class="checkmark" aria-label="绿色对勾"></div>

    <div class="watermark bottom-watermark">青春女纸</div>

    <p class="bottom-copy">我们这个民族，有数千年辉煌文明、有数百年<br>深重苦难，也有百余年不息奋斗、追寻梦想的<br>道路尤其艰难曲折。百余年来的救亡图存、道<br>路探索，多少仁人志士留下“有心杀贼，无力<br>回天”的悲愤，付出“春云碧血，秋雨黄花”<br>的牺牲，发出“拼将十万头颅血，须把乾坤力<br>挽回”的呐喊。</p>

    <p class="attribution">——2013.4.1《筑就民族复兴的“中国梦”》</p>
  </section>
</main>
</body>
</html>
