<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>为新疆人民打出一个民主联合政府</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #293858;
    }

    body {
      display: flex;
      justify-content: center;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
      color: #252525;
    }

    .page {
      width: 540px;
      min-height: 720px;
      background: #fff;
    }

    .ornament {
      width: 100%;
      height: 99px;
      background-color: #2c3c5e;
      background-image:
        radial-gradient(circle at 25px 32px, transparent 17px, #151515 18px, #151515 20px, transparent 21px),
        radial-gradient(circle at 0 32px, transparent 17px, #151515 18px, #151515 20px, transparent 21px),
        radial-gradient(circle at 50px 32px, transparent 17px, #151515 18px, #151515 20px, transparent 21px),
        radial-gradient(circle at 12.5px 10px, transparent 17px, #151515 18px, #151515 20px, transparent 21px),
        radial-gradient(circle at 37.5px 10px, transparent 17px, #151515 18px, #151515 20px, transparent 21px);
      background-size: 50px 44px;
    }

    .ornament.bottom {
      height: 81px;
      background-position: 0 1px;
    }

    main {
      position: relative;
      height: 540px;
      padding: 21px 20px 0 21px;
      overflow: hidden;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .section {
      margin: 40px 0 0;
      font-size: 20px;
      line-height: 36px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .section.second {
      margin-top: 39px;
    }

    .section.final {
      position: relative;
      margin-top: 39px;
      line-height: 36px;
      z-index: 1;
    }

    .underlined-line {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }

    .underlined-line::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -4px;
      right: -4px;
      bottom: 2px;
      height: 7px;
      opacity: 0.94;
      background:
        linear-gradient(
          176deg,
          transparent 0 20%,
          #ee1d18 22% 44%,
          transparent 46% 52%,
          #f11c17 54% 78%,
          transparent 80%
        );
      filter: saturate(1.2);
    }

    .underlined-line.short::after {
      right: 12px;
      bottom: 1px;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
      }

      main {
        height: 75vw;
        min-height: 540px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="ornament" aria-hidden="true"></div>

    <main>
      <h1>2、为新疆人民打出一个民主联合政府</h1>

      <p class="section">
        受到长期迫害的新疆各族人民奋勇反抗，发动了伊犁、<br>
        塔城、阿山三区人民革命。革命军队很快占领了以上三<br>
        个地区，成立了临时革命政府。
      </p>

      <p class="section second">
        三区人民革命让盛世才感受到了各族人民抗争的力量，<br>
        最终在革命力量和国民政府的双重压力下败走新疆。<br>
        1945年日本投降以后，国民政府在全国各族人民的多<br>
        方压力下，与临时革命政府开启谈判，假借谈判的手段<br>
        分化瓦解革命力量。
      </p>

      <p class="section final">
        <span class="underlined-line">恐怕谈判桌上的所有人都不会想到，赛福鼎以后会成为</span><br>
        <span class="underlined-line short">新中国的副国级领导人。</span>
      </p>
    </main>

    <div class="ornament bottom" aria-hidden="true"></div>
  </div>
</body>
</html>
