<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>做好竞品分析</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #e8c7aa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      color: #171a1b;
    }

    .page {
      position: relative;
      width: 540px;
      height: 722px;
      flex: 0 0 540px;
      overflow: hidden;
      background: #e8c7aa;
    }

    .card {
      position: absolute;
      top: 30px;
      left: 25px;
      width: 490px;
      height: 661px;
      overflow: hidden;
      background: #faf7f2;
      border-radius: 14px;
      box-shadow:
        1px 3px 4px rgba(91, 64, 44, 0.18),
        0 0 2px rgba(91, 64, 44, 0.08);
    }

    .main-content {
      position: relative;
      width: 100%;
      height: 608px;
      padding-top: 1px;
      background: #faf7f2;
    }

    .ribbon-shadow {
      position: absolute;
      top: 13px;
      left: 16px;
      width: 199px;
      height: 35px;
      background: #f1e3d8;
    }

    .ribbon {
      position: absolute;
      top: 19px;
      left: 25px;
      width: 207px;
      height: 28px;
      padding: 4px 22px 0 9px;
      color: #fffaf5;
      background: #a76139;
      clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
      font-size: 14px;
      font-weight: 500;
      line-height: 21px;
      letter-spacing: 2px;
      white-space: nowrap;
      text-shadow: 0 1px 1px rgba(70, 35, 18, 0.25);
    }

    .headline {
      position: absolute;
      top: 82px;
      left: 26px;
      display: flex;
      align-items: baseline;
      white-space: nowrap;
      font-family: "Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-weight: 900;
      color: #191c1d;
      line-height: 1;
    }

    .headline .number {
      margin-right: 20px;
      font-size: 41px;
      letter-spacing: 1px;
    }

    .headline .title {
      font-size: 39px;
      letter-spacing: 0;
    }

    .intro {
      position: absolute;
      top: 170px;
      left: 27px;
      font-size: 18px;
      font-weight: 500;
      line-height: 27px;
      letter-spacing: 0.1px;
    }

    .analysis {
      position: absolute;
      top: 250px;
      left: 27px;
      font-size: 18px;
      font-weight: 500;
      line-height: 27px;
      letter-spacing: 0.1px;
    }

    .steps {
      position: absolute;
      top: 327px;
      left: 26px;
      width: 425px;
      font-size: 18px;
      font-weight: 600;
      line-height: 27px;
      letter-spacing: 0.1px;
    }

    .step {
      position: relative;
      margin: 0;
      min-height: 27px;
    }

    .step-number {
      display: inline-block;
      width: 28px;
      font-weight: 500;
    }

    .continuation {
      padding-left: 28px;
      font-weight: 500;
    }

    .footer {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 55px;
      background: #ecd7c8;
      border-top: 3px dotted #f9f4ee;
      color: #171717;
      text-align: center;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 52px;
    }

    .footer::before,
    .footer::after {
      content: "";
      position: absolute;
      top: -19px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e8c7aa;
    }

    .footer::before {
      left: -10px;
    }

    .footer::after {
      right: -10px;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="main-content">
        <div class="ribbon-shadow"></div>
        <div class="ribbon">新媒体账号运营6种方法</div>

        <header class="headline">
          <span class="number">03</span>
          <span class="title">做好竞品分析</span>
        </header>

        <div class="intro">
          前期的竞品分析<br>
          一定要花大量的时间和精力去收集信息
        </div>

        <div class="analysis">
          仔细分析<br>
          可以从以下几个方面来看
        </div>

        <div class="steps">
          <div class="step"><span class="step-number">1、</span>账号人设标 签</div>
          <div class="step"><span class="step-number">2、</span>账号选题规划</div>
          <div class="step"><span class="step-number">3、</span>内容脚本拆解：</div>
          <div class="continuation">结构、矛盾点、金句、痒点</div>
          <div class="step"><span class="step-number">4、</span>内容形式：</div>
          <div class="continuation">场景道具服装、拍摄剪辑节奏</div>
          <div class="step"><span class="step-number">5、</span>运营策略：</div>
          <div class="continuation">发布时间和频率，封面，文案，线上互动</div>
          <div class="continuation">用户运营，引流途径</div>
        </div>
      </div>

      <footer class="footer">@新媒体运营的十万个为什么</footer>
    </section>
  </main>
</body>
</html>
