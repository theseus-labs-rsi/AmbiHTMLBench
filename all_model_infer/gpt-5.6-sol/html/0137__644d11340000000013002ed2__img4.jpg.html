<!DOCTYPE html>

<head>

  <title>国家名</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }

      position: absolute;
      top: 118px;
      left: 83px;
      display: flex;
      gap: 105px;
    }

    .column {
      width: 134px;
      font-size: 21px;
      line-height: 42px;
