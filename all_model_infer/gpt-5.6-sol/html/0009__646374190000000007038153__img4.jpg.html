<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖胖和丫丫</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e8ece4;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    }

    .page {
      position: relative;
      width: min(100vw, 540px);
      aspect-ratio: 540 / 496;
      overflow: hidden;
      background: #fffef7;
    }

    .text {
      position: absolute;
      z-index: 2;
      top: 6px;
      left: 25px;
      right: 13px;
      color: #363532;
      font-size: clamp(15px, 4.05vw, 22px);
      line-height: 1.52;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .text p {
      margin: 0;
    }

    .text .indent {
      padding-left: 58px;
    }

    .illustration.placeholder {
      position: absolute;
      top: 140px;
      left: 0;
      width: 100%;
      height: calc(100% - 140px);
      overflow: hidden;
      border: 0;
      background:
        linear-gradient(90deg,
          rgba(81, 139, 91, 0.85) 0 2.5%,
          transparent 2.5% 35.5%,
          rgba(71, 130, 82, 0.9) 35.5% 39%,
          transparent 39% 61%,
          rgba(71, 130, 82, 0.9) 61% 64%,
          transparent 64% 96%,
          rgba(81, 139, 91, 0.85) 96% 100%
        ),
        linear-gradient(180deg,
          #cce5c1 0 11%,
          #eef5dc 11% 27%,
          #fffca9 48%,
          #fffcd0 100%
        );
    }

    .window-bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 27px;
      height: 14px;
      background: #6ba073;
      border-top: 3px solid #3f704e;
      border-bottom: 3px solid #477c54;
      transform: rotate(-0.4deg);
    }

    .left-pane,
    .right-pane {
      position: absolute;
      top: 41px;
      bottom: 14px;
      width: 34%;
      border: 4px solid #467853;
      background: linear-gradient(#f5f4dc 0 14%, #fff68e 40%, #fff8b2);
    }

    .left-pane {
      left: 3%;
    }

    .right-pane {
      right: 3%;
    }

    .curtain {
      position: absolute;
      top: 45px;
      width: 27%;
      height: 54px;
      background:
        repeating-linear-gradient(
          90deg,
          #fffef1 0 10px,
          #eee9c7 10px 14px,
          #fffff7 14px 24px
        );
      border-bottom: 3px wavy #c8b977;
      filter: drop-shadow(0 2px 1px rgba(116, 100, 50, 0.25));
    }

    .curtain.left {
      left: 9%;
    }

    .curtain.right {
      right: 9%;
    }

    .lattice {
      position: absolute;
      z-index: 1;
      top: 38px;
      bottom: 6px;
      left: 39%;
      width: 22%;
      border: 5px solid #477c54;
      background:
        repeating-linear-gradient(45deg, transparent 0 27px, #568664 28px 31px),
        repeating-linear-gradient(-45deg, transparent 0 27px, #568664 28px 31px),
        #eaf1e8;
    }

    .side-window {
      position: absolute;
      top: 34px;
      bottom: 0;
      width: 11%;
      border: 4px solid #467853;
      background:
        repeating-linear-gradient(
          to bottom,
          #eaf7f3 0 65px,
          #487b58 66px 70px,
          #edf8f2 71px 135px
        );
    }

    .side-window.left {
      left: -4%;
      transform: skewY(8deg);
    }

    .side-window.right {
      right: -4%;
      transform: skewY(-8deg);
    }

    .duck {
      position: absolute;
      z-index: 3;
      left: 13%;
      bottom: 28px;
      width: 66px;
      height: 112px;
    }

    .duck .body {
      position: absolute;
      bottom: 0;
      left: 8px;
      width: 48px;
      height: 69px;
      border: 2px solid #6d6750;
      border-radius: 48% 52% 43% 44%;
      background: #fffdf0;
    }

    .duck .head {
      position: absolute;
      top: 0;
      left: 10px;
      width: 48px;
      height: 50px;
      border: 2px solid #6d6750;
      border-radius: 50%;
      background: #fffdf4;
    }

    .duck .hair {
      position: absolute;
      top: -7px;
      left: 7px;
      width: 37px;
      height: 19px;
      border-radius: 50% 50% 10% 10%;
      background: #67624a;
    }

    .duck .beak {
      position: absolute;
      top: 24px;
      right: -16px;
      width: 27px;
      height: 15px;
      border: 2px solid #9c552d;
      border-radius: 60% 70% 55% 40%;
      background: #de7135;
      transform: rotate(13deg);
    }

    .duckling {
      position: absolute;
      z-index: 4;
      left: 24%;
      bottom: 28px;
      width: 48px;
      height: 68px;
    }

    .duckling::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      width: 34px;
      height: 34px;
      border: 2px solid #917126;
      border-radius: 50%;
      background: #f2d44d;
    }

    .duckling::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 5px;
      width: 40px;
      height: 43px;
      border: 2px solid #917126;
      border-radius: 46%;
      background:
        radial-gradient(circle, #c14836 0 3px, transparent 4px) 0 0 / 13px 13px,
        #f2d44d;
    }

    .pig {
      position: absolute;
      z-index: 4;
      right: 12%;
      bottom: 20px;
      width: 110px;
      height: 191px;
    }

    .pig .body {
      position: absolute;
      bottom: 0;
      left: 12px;
      width: 91px;
      height: 126px;
      border: 3px solid #835b53;
      border-radius: 45% 45% 18% 18%;
      background:
        repeating-linear-gradient(
          90deg,
          #865164 0 8px,
          #e3bfd0 8px 15px
        );
    }

    .pig .head {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 103px;
      height: 88px;
      border: 3px solid #885f58;
      border-radius: 48%;
      background: radial-gradient(circle at 65% 45%, #f2a09b, #f8c5b4 65%);
    }

    .pig .ear {
      position: absolute;
      top: 7px;
      width: 25px;
      height: 28px;
      border: 3px solid #885f58;
      background: #eca7a0;
      transform: rotate(35deg);
    }

    .pig .ear.left {
      left: 0;
    }

    .pig .ear.right {
      right: 0;
      transform: rotate(-35deg);
    }

    .pig .snout {
      position: absolute;
      z-index: 2;
      top: 45px;
      left: 34px;
      width: 41px;
      height: 26px;
      border: 2px solid #a55f59;
      border-radius: 50%;
      background: #efaaa5;
    }

    .pig .snout::before,
    .pig .snout::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 5px;
      height: 7px;
      border-radius: 50%;
      background: #9f5a58;
    }

    .pig .snout::before {
      left: 10px;
    }

    .pig .snout::after {
      right: 10px;
    }

    .small-pig {
      position: absolute;
      z-index: 5;
      right: 18%;
      bottom: 20px;
      width: 65px;
      height: 102px;
    }

    .small-pig .head {
      position: absolute;
      top: 0;
      width: 61px;
      height: 53px;
      border: 2px solid #855953;
      border-radius: 48%;
      background: #f5b6ad;
    }

    .small-pig .snout {
      position: absolute;
      top: 27px;
      left: 18px;
      width: 28px;
      height: 18px;
      border: 2px solid #a55f59;
      border-radius: 50%;
      background: #ee9e9a;
    }

    .small-pig .clothes {
      position: absolute;
      bottom: 0;
      left: 5px;
      width: 54px;
      height: 59px;
      border-radius: 20% 20% 12% 12%;
      background: linear-gradient(#f5e59c 0 30%, #267cb3 31%);
      border: 2px solid #596b68;
    }

    .flowers {
      position: absolute;
      z-index: 6;
      top: 3px;
      left: 41%;
      width: 59%;
      height: 55px;
      transform: rotate(-4deg);
      background:
        radial-gradient(circle at 9% 60%, #bd6e69 0 4px, #f6c4b5 5px 8px, transparent 9px),
        radial-gradient(circle at 25% 42%, #bd6e69 0 4px, #f6c4b5 5px 9px, transparent 10px),
        radial-gradient(circle at 42% 57%, #bd6e69 0 4px, #f6c4b5 5px 9px, transparent 10px),
        radial-gradient(circle at 60% 35%, #bd6e69 0 4px, #f6c4b5 5px 9px, transparent 10px),
        radial-gradient(circle at 78% 52%, #bd6e69 0 4px, #f6c4b5 5px 9px, transparent 10px),
        radial-gradient(circle at 94% 25%, #bd6e69 0 4px, #f6c4b5 5px 9px, transparent 10px);
      border-bottom: 5px solid #547b43;
    }

    .placeholder-caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .text {
        top: 4px;
        left: 18px;
        right: 8px;
      }

      .text .indent {
        padding-left: 43px;
      }

      .illustration.placeholder {
        top: 28.2%;
        height: 71.8%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="text">
      <p class="indent">“胖胖，中午好！”丫丫一进屋就看见了胖胖，</p>
      <p>胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微</p>
      <p>笑来和我打招呼的！”听到丫丫的话，</p>
      <p>大家都笑了起来。</p>
    </section>

    <figure class="illustration placeholder">
      <figcaption class="placeholder-caption">[Illustration: open green window with a duck, a duckling, and two pigs]</figcaption>
      <div class="window-bar"></div>
      <div class="left-pane"></div>
      <div class="right-pane"></div>
      <div class="curtain left"></div>
      <div class="curtain right"></div>
      <div class="lattice"></div>
      <div class="side-window left"></div>
      <div class="side-window right"></div>
      <div class="flowers"></div>

      <div class="duck">
        <div class="body"></div>
        <div class="head">
          <div class="hair"></div>
          <div class="beak"></div>
        </div>
      </div>

      <div class="duckling"></div>

      <div class="pig">
        <div class="body"></div>
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="snout"></div>
        </div>
      </div>

      <div class="small-pig">
        <div class="head">
          <div class="snout"></div>
        </div>
        <div class="clothes"></div>
      </div>
    </figure>
  </main>
</body>
</html>
