<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三大核心参数解读</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #111111;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #ffffff;
    }

    .hole {
      position: absolute;
      top: 14px;
      width: 23px;
      height: 23px;
      border: 2px solid #b8b8b8;
      border-radius: 50%;
      background: #ffffff;
      box-shadow:
        inset 1px 1px 2px rgba(70, 70, 70, 0.35),
        0 1px 1px rgba(180, 180, 180, 0.3);
    }

    .hole-1 { left: -11px; }
    .hole-2 { left: 48px; }
    .hole-3 { left: 108px; }
    .hole-4 { left: 168px; }
    .hole-5 { left: 228px; }
    .hole-6 { left: 288px; }
    .hole-7 { left: 348px; }
    .hole-8 { left: 408px; }
    .hole-9 { left: 468px; }

    .side-label {
      position: absolute;
      left: -1px;
      top: 72px;
      width: 44px;
      height: 108px;
      overflow: hidden;
      border-radius: 0 7px 7px 0;
      background:
        linear-gradient(145deg, #30264b 0%, #4d2c62 30%, #a33758 65%, #e45448 100%);
    }

    .side-label .side-text {
      position: absolute;
      top: 17px;
      left: 7px;
      color: #ffffff;
      font-size: 20px;
      line-height: 27px;
      font-weight: 700;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    h1 {
      position: absolute;
      top: 60px;
      left: 114px;
      margin: 0;
      white-space: nowrap;
      font-size: 36px;
      line-height: 46px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .subtitle {
      position: absolute;
      top: 119px;
      left: 164px;
      margin: 0;
      white-space: nowrap;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
    }

    .content-row {
      position: absolute;
      left: 0;
      width: 540px;
      height: 78px;
    }

    .row-one {
      top: 214px;
    }

    .row-two {
      top: 375px;
    }

    .row-three {
      top: 538px;
    }

    .copy {
      position: absolute;
      top: 0;
      white-space: nowrap;
    }

    .row-one .copy,
    .row-three .copy {
      left: 114px;
    }

    .row-two .copy {
      left: 124px;
    }

    .heading {
      height: 29px;
      margin: 0;
      font-size: 21px;
      line-height: 29px;
      font-weight: 400;
    }

    .description {
      margin: 2px 0 0;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
    }

    .icon {
      position: absolute;
      display: block;
    }

    .memory-icon {
      top: 1px;
      left: 35px;
      width: 65px;
      height: 75px;
    }

    .cpu-icon {
      top: 1px;
      left: 31px;
      width: 78px;
      height: 75px;
    }

    .resolution-icon {
      top: 1px;
      left: 35px;
      width: 56px;
      height: 75px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="hole hole-1"></div>
    <div class="hole hole-2"></div>
    <div class="hole hole-3"></div>
    <div class="hole hole-4"></div>
    <div class="hole hole-5"></div>
    <div class="hole hole-6"></div>
    <div class="hole hole-7"></div>
    <div class="hole hole-8"></div>
    <div class="hole hole-9"></div>

    <div class="side-label placeholder">
      <span class="side-text">第一步</span>
      <span class="sr-only">[Graphic: vertical first-step label]</span>
    </div>

    <h1>三大核心参数解读</h1>
    <p class="subtitle">内存/芯片/分辨率参数解读</p>

    <section class="content-row row-one">
      <div class="icon memory-icon placeholder" aria-label="[Icon: memory card]">
        <svg viewBox="0 0 65 75" aria-hidden="true">
          <path d="M16 3H53C58 3 61 6 61 11V64C61 69 58 72 53 72H13C8 72 5 69 5 64V18L16 3Z"
                fill="#ffffff" stroke="#373737" stroke-width="4" stroke-linejoin="round"/>
          <g stroke="#373737" stroke-width="4" stroke-linecap="round">
            <path d="M17 8V19"/>
            <path d="M24 8V19"/>
            <path d="M31 8V19"/>
            <path d="M38 8V19"/>
            <path d="M45 8V19"/>
          </g>
          <path d="M14 31H48V59H14Z" fill="#ffffff" stroke="#373737" stroke-width="4" stroke-linejoin="round"/>
          <path d="M21 38V51H34" fill="none" stroke="#373737" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sr-only">[Icon: memory card]</span>
      </div>
      <div class="copy">
        <h2 class="heading">1.看内存</h2>
        <p class="description">内存越大速度越快，小于8GB不建议购买。（画圈：<br>GB≠Gb,大GB是小Gb的8倍，尽量选择大GB)</p>
      </div>
    </section>

    <section class="content-row row-two">
      <div class="icon cpu-icon placeholder" aria-label="[Icon: CPU chip]">
        <svg viewBox="0 0 78 75" aria-hidden="true">
          <g stroke="#373737" stroke-width="4" stroke-linecap="round">
            <path d="M23 10V4"/>
            <path d="M30 10V4"/>
            <path d="M38 10V4"/>
            <path d="M46 10V4"/>
            <path d="M54 10V4"/>
            <path d="M23 65V71"/>
            <path d="M30 65V71"/>
            <path d="M38 65V71"/>
            <path d="M46 65V71"/>
            <path d="M54 65V71"/>
            <path d="M13 20H7"/>
            <path d="M13 28H7"/>
            <path d="M13 37H7"/>
            <path d="M13 46H7"/>
            <path d="M65 20H71"/>
            <path d="M65 28H71"/>
            <path d="M65 37H71"/>
            <path d="M65 46H71"/>
          </g>
          <rect x="14" y="11" width="51" height="55" rx="6" fill="#373737"/>
          <rect x="20" y="17" width="39" height="43" rx="2" fill="#373737" stroke="#373737" stroke-width="2"/>
          <text x="39.5" y="44" text-anchor="middle"
                font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">CPU</text>
        </svg>
        <span class="sr-only">[Icon: CPU chip]</span>
      </div>
      <div class="copy">
        <h2 class="heading">2.看芯片</h2>
        <p class="description">主流芯片A73和A53。追求性能玩游戏选A73，看<br>看电视想省电选A53。</p>
      </div>
    </section>

    <section class="content-row row-three">
      <div class="icon resolution-icon placeholder" aria-label="[Icon: 4K UHD resolution]">
        <svg viewBox="0 0 56 75" aria-hidden="true">
          <rect x="4" y="2" width="48" height="71" rx="8" fill="#373737"/>
          <text x="28" y="29" text-anchor="middle"
                font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">4K</text>
          <path d="M8 38H48" stroke="#ffffff" stroke-width="2"/>
          <text x="28" y="60" text-anchor="middle"
                font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">UHD</text>
        </svg>
        <span class="sr-only">[Icon: 4K UHD resolution]</span>
      </div>
      <div class="copy">
        <h2 class="heading">3.看分辨率</h2>
        <p class="description">分辨率越高越清晰。（目前电视基本都是超高清4K<br>也就是3840×2160的分辨率）</p>
      </div>
    </section>
  </main>
</body>
</html>
