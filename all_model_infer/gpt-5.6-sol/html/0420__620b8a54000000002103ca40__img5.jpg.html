<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习建议</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #171717;
    }

    .page {
      position: relative;
      width: 540px;
      height: 721px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .header {
      position: relative;
      height: 117px;
    }

    .title {
      position: absolute;
      top: 31px;
      left: 187px;
      margin: 0;
      color: #fff;
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 1px;
      -webkit-text-stroke: 2px #5599ca;
      text-shadow:
        1px 1px 0 #5599ca,
        -1px 1px 0 #5599ca,
        1px -1px 0 #5599ca,
        -1px -1px 0 #5599ca;
      transform: rotate(-1deg);
      white-space: nowrap;
    }

    .small-doodle {
      position: absolute;
      top: 14px;
      left: 164px;
      width: 38px;
      height: 21px;
      border: 2px solid #f2d66b;
      border-radius: 50% 45% 50% 45%;
      transform: rotate(-8deg);
    }

    .small-doodle::before {
      content: "";
      position: absolute;
      top: 3px;
      right: -15px;
      width: 18px;
      height: 7px;
      border: 2px solid #75a9cc;
      border-radius: 5px;
      transform: rotate(17deg);
    }

    .small-doodle::after {
      content: "";
      position: absolute;
      left: 12px;
      bottom: -5px;
      width: 9px;
      height: 5px;
      border-left: 2px solid #f2d66b;
      transform: rotate(18deg);
    }

    .sparkle {
      position: absolute;
      top: 18px;
      left: 344px;
      width: 13px;
      height: 13px;
      transform: rotate(45deg);
      border: 2px solid #f1d25c;
      border-radius: 45% 0;
    }

    .wave {
      position: absolute;
      left: 104px;
      top: 87px;
      width: 321px;
      height: 18px;
    }

    .wave span {
      position: absolute;
      left: 0;
      width: 321px;
      height: 9px;
      border-top: 3px solid #efd04c;
      border-radius: 50%;
      transform: rotate(-1deg);
    }

    .wave span:nth-child(1) {
      top: 0;
    }

    .wave span:nth-child(2) {
      top: 5px;
      left: 7px;
      width: 313px;
    }

    .wave span:nth-child(3) {
      top: 10px;
      left: 13px;
      width: 302px;
    }

    .wave-knot {
      position: absolute;
      top: 92px;
      left: 106px;
      width: 17px;
      height: 11px;
      border-top: 2px solid #6b9dc1;
      border-bottom: 2px solid #6b9dc1;
      transform: rotate(18deg);
    }

    .section-heading {
      display: grid;
      grid-template-columns: 75px 1fr;
      align-items: center;
      margin-left: 28px;
      margin-right: 25px;
    }

    .section-heading .number {
      color: #b24b9c;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .section-heading .heading-text {
      color: #b34b9a;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .section-one .section-heading {
      height: 46px;
      padding-top: 6px;
    }

    .body-copy {
      margin-left: 27px;
      margin-right: 20px;
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.1px;
    }

    .line {
      height: 42px;
      line-height: 42px;
      white-space: nowrap;
    }

    .highlight {
      display: inline-block;
      height: 34px;
      padding: 0 5px;
      margin: 0 -1px;
      line-height: 34px;
      background: #ffe579;
      border-radius: 16px 11px 15px 13px;
    }

    .highlight.first {
      padding-left: 7px;
      padding-right: 8px;
    }

    .highlight.wide {
      padding-left: 4px;
      padding-right: 6px;
    }

    .highlight.last {
      padding-left: 5px;
      padding-right: 7px;
    }

    .attribution {
      margin-top: 4px;
      margin-right: 31px;
      text-align: right;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .section-two {
      margin-top: 50px;
    }

    .section-two .section-heading {
      height: 42px;
    }

    .section-two .body-copy {
      margin-top: 3px;
    }

    .emphasis {
      color: #e23b57;
      font-weight: 800;
    }

    .placeholder.illustration {
      position: absolute;
      right: 29px;
      bottom: 0;
      width: 88px;
      height: 101px;
    }

    .girl-head {
      position: absolute;
      top: 7px;
      left: 39px;
      width: 22px;
      height: 24px;
      background: #f0c7a7;
      border: 1px solid #9d664e;
      border-radius: 48% 48% 42% 44%;
      z-index: 3;
    }

    .girl-hair {
      position: absolute;
      top: 3px;
      left: 35px;
      width: 29px;
      height: 20px;
      background: #75462f;
      border-radius: 55% 55% 30% 35%;
      transform: rotate(-5deg);
      z-index: 2;
    }

    .girl-hair::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 9px;
      width: 8px;
      height: 17px;
      background: #75462f;
      border-radius: 50%;
      transform: rotate(-17deg);
    }

    .girl-body {
      position: absolute;
      top: 29px;
      left: 35px;
      width: 31px;
      height: 40px;
      background: #5c9a8b;
      border: 1px solid #47786e;
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
      z-index: 1;
    }

    .girl-skirt {
      position: absolute;
      top: 62px;
      left: 32px;
      width: 37px;
      height: 18px;
      background: #5b9386;
      border: 1px solid #48796f;
      clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
    }

    .leg {
      position: absolute;
      top: 77px;
      width: 6px;
      height: 21px;
      background: #f0c7a7;
      border: 1px solid #a5745a;
      border-radius: 0 0 4px 4px;
    }

    .leg.left {
      left: 39px;
      transform: rotate(2deg);
    }

    .leg.right {
      left: 56px;
      transform: rotate(-3deg);
    }

    .shoe {
      position: absolute;
      bottom: 1px;
      width: 10px;
      height: 4px;
      background: #72402f;
      border-radius: 5px 5px 2px 2px;
    }

    .shoe.left {
      left: 36px;
    }

    .shoe.right {
      left: 54px;
    }

    .banner {
      position: absolute;
      top: 27px;
      left: 2px;
      width: 76px;
      height: 30px;
      color: #ffd746;
      background: #d93630;
      border: 2px solid #e4ad31;
      clip-path: polygon(0 28%, 18% 20%, 23% 0, 100% 8%, 88% 53%, 94% 92%, 27% 76%, 20% 100%, 15% 73%);
      transform: rotate(-14deg);
      z-index: 4;
    }

    .banner-text {
      position: absolute;
      top: 9px;
      left: 21px;
      font-size: 6px;
      font-weight: 700;
      white-space: nowrap;
      transform: rotate(2deg);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="small-doodle" aria-hidden="true"></div>
      <div class="sparkle" aria-hidden="true"></div>
      <h1 class="title">学习建议</h1>
      <div class="wave" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="wave-knot" aria-hidden="true"></div>
    </header>

    <section class="section-one">
      <div class="section-heading">
        <div class="number">09</div>
        <div class="heading-text">「 教材远比练习册重要 」</div>
      </div>

      <div class="body-copy">
        <div class="line">教材远比练习册重要。</div>
        <div class="line">教材就是我们做题之前所要构建的一个框架，<span class="highlight first">先熟</span></div>
        <div class="line"><span class="highlight wide">悉框架，然后不断地练题，才能将自己学习的这座</span></div>
        <div class="line"><span class="highlight last">大厦构建得更加完整。</span></div>
      </div>

      <div class="attribution">——陈哲峰(被北京大学物理学院录取)</div>
    </section>

    <section class="section-two">
      <div class="section-heading">
        <div class="number">10</div>
        <div class="heading-text">「 有关数学与英语的学习方法 」</div>
      </div>

      <div class="body-copy">
        <div class="line">数学压轴大题的第二问我没有做出来，但这并没有</div>
        <div class="line">影响接下来的考试中我的发挥。</div>
        <div class="line">我要保证的，<span class="emphasis">不是做出难题，而是做到容易题不丢</span></div>
        <div class="line"><span class="emphasis">分，难题多得分。</span>最后，我数学只有压轴题扣了</div>
        <div class="line">分。</div>
      </div>
    </section>

    <div class="placeholder illustration" role="img" aria-label="Illustration: student holding a red banner at bottom-right">
      <span class="sr-only">[Illustration: bottom-right]</span>
      <div class="girl-hair"></div>
      <div class="girl-head"></div>
      <div class="girl-body"></div>
      <div class="girl-skirt"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="shoe left"></div>
      <div class="shoe right"></div>
      <div class="banner">
        <span class="banner-text">[illegible]</span>
      </div>
    </div>
  </main>
</body>
</html>
