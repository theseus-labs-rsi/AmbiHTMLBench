<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界气候类型的分布</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333333;
      font-family: "SimSun", "Songti SC", serif;
    }

    .page {
      width: 680px;
      min-height: 900px;
      margin: 0 auto;
      padding: 58px 68px 38px;
      position: relative;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
      color: #222;
    }

    .intro {
      margin: 0 0 10px;
      padding-left: 22px;
      font-size: 14px;
      line-height: 1.75;
      text-align: left;
      text-indent: 0;
    }

    .highlight {
      background: #f6bd79;
      border-radius: 3px;
      padding: 0 2px;
    }

    .figure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 28px;
      row-gap: 16px;
      margin-top: 7px;
    }

    figure {
      margin: 0;
      width: 100%;
    }

    .placeholder {
      width: 100%;
      height: 166px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d8d8d8;
      background: #eef0ed;
      color: #777;
      font-family: "SimSun", serif;
      font-size: 12px;
      text-align: center;
    }

    .forest {
      background:
        linear-gradient(145deg, rgba(34, 60, 32, .82), rgba(135, 154, 119, .58)),
        repeating-linear-gradient(115deg, #607653 0 10px, #263d29 11px 20px);
    }

    .grassland {
      background:
        linear-gradient(to bottom, #77a7c6 0 54%, #c8b66a 55% 73%, #c39b49 74%);
    }

    .temperate {
      background:
        linear-gradient(115deg, rgba(113, 72, 34, .65), rgba(203, 153, 76, .6)),
        repeating-linear-gradient(90deg, #3d5a35 0 7px, #9c742d 8px 15px);
    }

    .polar {
      background:
        linear-gradient(to bottom, #185e83 0 17%, #f4f7f6 18% 27%, #77a9c6 28% 42%, #f9fbfa 43% 57%, #9fc9df 58% 73%, #f5f8f7 74%);
    }

    figcaption {
      margin-top: 5px;
      min-height: 58px;
      font-size: 12px;
      line-height: 1.55;
      text-align: left;
      color: #444;
    }

    .marker {
      color: #15945d;
      font-family: sans-serif;
      font-size: 13px;
      margin-right: 2px;
    }

    .caption-highlight {
      background: #f7bd78;
      border-radius: 3px;
      padding: 0 1px;
    }

    .figure-label {
      margin: 2px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }

    .closing {
      width: 300px;
      margin: 24px 0 0 auto;
      font-size: 14px;
      line-height: 1.75;
      text-align: left;
      text-indent: 2em;
    }

    .footer {
      position: absolute;
      left: 68px;
      right: 68px;
      bottom: 39px;
      display: flex;
      align-items: center;
      gap: 17px;
      font-size: 11px;
      color: #555;
    }

    .page-number {
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>世界气候类型的分布</h1>

    <p class="intro">
      虽然世界的气候复杂多样（图3.27），但是它们的分布有一定规律。例如，
      <span class="highlight">由赤道向两极地区，有规律地分布着热带的、亚热带的、温带的和寒带的气候</span>。
      不同的气候类型呈现出不同的自然景观。
    </p>

    <section class="figure-grid" aria-label="四种气候类型的自然景观">
      <figure>
        <div class="placeholder forest">[照片：左上]</div>
        <figcaption>
          <span class="marker">●</span>
          <span class="caption-highlight">热带雨林气候主要分布在赤道附近地区。</span>
          这里全年高温多雨，植物终年常绿，许多地方分布着茂密的热带雨林。
        </figcaption>
      </figure>

      <figure>
        <div class="placeholder grassland">[照片：右上]</div>
        <figcaption>
          <span class="marker">●</span>
          <span class="caption-highlight">热带草原气候主要分布在热带雨林气候的南北两侧。</span>
          这里全年高温，分干湿两季，旱季的草木枯黄，地面上树木稀疏，长着较高的草。
        </figcaption>
      </figure>

      <figure>
        <div class="placeholder temperate">[照片：左下]</div>
        <figcaption>
          <span class="marker">●</span>
          <span class="caption-highlight">温带季风气候主要分布在温带大陆东部。</span>
          这里四季分明，夏季高温多雨，冬季寒冷干燥，生长着落叶阔叶林。
        </figcaption>
      </figure>

      <figure>
        <div class="placeholder polar">[照片：右下]</div>
        <figcaption>
          <span class="marker">●</span>
          <span class="caption-highlight">极地气候主要分布在极圈以内，大部分地区终年寒冷。</span>
          地面被冰雪覆盖，植被稀少。
        </figcaption>
      </figure>
    </section>

    <p class="figure-label">图3.27 四种气候类型的自然景观</p>

    <p class="closing">
      其中，热带的气候大致分布在南、北回归线之间，寒带的气候大致分布在北、南极圈内，亚热带和温带的气候大致分布在北回归线与北极圈之间、南回归线与南极圈之间。在中纬度地区，由大陆东岸、大陆西岸向大陆内部，气候类型的分布也是有规律的。
    </p>

    <footer class="footer">
      <span class="page-number">64</span>
      <span>第二章&nbsp;&nbsp;天气与气候</span>
    </footer>
  </main>
</body>
</html>
