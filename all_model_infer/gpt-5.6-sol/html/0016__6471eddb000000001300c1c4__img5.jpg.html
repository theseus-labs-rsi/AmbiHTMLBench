<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓解痛经</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #171717;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
    }

    .status-bar {
      position: relative;
      width: 100%;
      height: 42px;
      color: #5e5e5e;
      font-family: Arial, sans-serif;
      font-size: 10px;
    }

    .status-left {
      position: absolute;
      top: 18px;
      left: 212px;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 10px;
    }

    .hd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 10px;
      height: 8px;
      border: 1px solid #6a6a6a;
      border-radius: 1px;
      font-size: 5px;
      font-weight: 700;
      line-height: 1;
    }

    .signal {
      display: inline-flex;
      align-items: flex-end;
      gap: 1px;
      height: 8px;
    }

    .signal i {
      display: block;
      width: 1px;
      background: #696969;
    }

    .signal i:nth-child(1) { height: 2px; }
    .signal i:nth-child(2) { height: 4px; }
    .signal i:nth-child(3) { height: 6px; }
    .signal i:nth-child(4) { height: 8px; }

    .network {
      font-size: 7px;
      line-height: 8px;
    }

    .wifi {
      position: relative;
      width: 12px;
      height: 9px;
      overflow: hidden;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 1px solid #686868;
      border-color: #686868 transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before {
      top: 0;
      width: 12px;
      height: 12px;
    }

    .wifi::after {
      top: 3px;
      width: 7px;
      height: 7px;
    }

    .wifi-dot {
      position: absolute;
      bottom: 0;
      left: 5px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #686868;
    }

    .status-right {
      position: absolute;
      top: 18px;
      left: 365px;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 10px;
    }

    .battery {
      position: relative;
      width: 16px;
      height: 8px;
      border: 1px solid #777777;
      border-radius: 1px;
    }

    .battery::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 11px;
      height: 4px;
      background: #777777;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 2px;
      right: -3px;
      width: 2px;
      height: 4px;
      background: #777777;
      border-radius: 0 1px 1px 0;
    }

    .time {
      font-size: 10px;
      line-height: 10px;
    }

    .content {
      width: 298px;
      margin-left: 121px;
    }

    .close {
      position: relative;
      width: 15px;
      height: 15px;
      margin-top: 7px;
      margin-bottom: 14px;
    }

    .close::before,
    .close::after {
      content: "";
      position: absolute;
      top: 7px;
      left: -1px;
      width: 17px;
      height: 1.5px;
      background: #161616;
      transform-origin: center;
    }

    .close::before {
      transform: rotate(45deg);
    }

    .close::after {
      transform: rotate(-45deg);
    }

    .notice-heading {
      display: flex;
      align-items: center;
      width: max-content;
      height: 27px;
      margin: 0;
      border-bottom: 2px solid #d68d9f;
      color: #6750b6;
      font-size: 16px;
      font-weight: 700;
      line-height: 26px;
    }

    .notice-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 17px;
      margin-right: 7px;
      border-radius: 2px;
      background: #df899a;
      color: #7660b6;
      font-size: 13px;
      font-weight: 500;
      line-height: 17px;
    }

    p {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: 0;
      text-align: left;
    }

    .notice-copy {
      margin-top: 8px;
    }

    .section-title {
      position: relative;
      width: 116px;
      height: 46px;
      margin: 68px auto 24px;
      color: #6651b7;
    }

    .section-title .number {
      position: absolute;
      left: 10px;
      top: -19px;
      z-index: 2;
      padding: 0 3px;
      background: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 45px;
      font-weight: 500;
      line-height: 48px;
    }

    .section-title .dot {
      position: absolute;
      left: 41px;
      top: 14px;
      z-index: 3;
      width: 7px;
      height: 7px;
      background: #765bc2;
    }

    .section-title .label {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 116px;
      height: 30px;
      border: 1px solid #9185a5;
      padding: 6px 4px 0 40px;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      white-space: nowrap;
    }

    .intro {
      margin-bottom: 8px;
    }

    .tag {
      position: relative;
      display: inline-block;
      height: 30px;
      margin: 0 0 7px 0;
      padding: 3px 13px 3px 8px;
      background: #6550b4;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
    }

    .tag::before {
      content: "";
      position: absolute;
      top: 0;
      right: -15px;
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 15px solid #6550b4;
    }

    .tag::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -11px;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 12px solid #ffffff;
    }

    .explanation {
      margin-bottom: 25px;
    }

    .methods-intro {
      margin-bottom: 24px;
    }

    .method {
      margin-bottom: 25px;
    }

    @media (max-width: 539px) {
      .page {
        width: 100vw;
      }

      .content {
        margin-left: calc((100vw - 298px) / 2);
      }

      .status-left {
        left: calc(50% - 58px);
      }

      .status-right {
        left: calc(50% + 95px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="status-bar" aria-label="状态栏">
      <div class="status-left">
        <span class="hd">HD</span>
        <span class="network">5G</span>
        <span class="signal" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span class="wifi" aria-hidden="true"><span class="wifi-dot"></span></span>
      </div>
      <div class="status-right">
        <span class="battery" aria-hidden="true"></span>
        <span class="time">19:43</span>
      </div>
    </div>

    <article class="content">
      <div class="close" aria-label="关闭"></div>

      <h1 class="notice-heading">
        <span class="notice-number">5</span>
        <span>月经来潮需停药</span>
      </h1>

      <p class="notice-copy">
        药物推迟月经可能会失败，服药过程中如月<br>
        经来潮需停药。
      </p>

      <div class="section-title">
        <span class="number">2</span>
        <span class="dot"></span>
        <span class="label">缓解痛经</span>
      </div>

      <p class="intro">
        如果上述方法推迟月经失败，对于痛经明显<br>
        的，我们可以使用缓解痛经的方法来减少痛<br>
        经对考试状态的影响。
      </p>

      <div class="tag">常用方案</div>

      <p class="explanation">
        痛经的发生与月经来潮时子宫内膜前列腺素<br>
        含量增高有关，因此，可以通过服用前列腺<br>
        素合成酶抑制剂来缓解痛经。
      </p>

      <p class="methods-intro">
        以下三种方法，选其中一种方法即可：
      </p>

      <p class="method">
        1.布洛芬 首剂 800 mg，之后根据需要<br>
        400～800 mg 每8小时一次，可在月经来<br>
        潮前1天开始服用，连续服用3天。
      </p>

      <p class="method">
        2.甲芬那酸首剂 500 mg，之后根据需要<br>
        250 mg 每6小时一次。
      </p>
    </article>
  </main>
</body>
</html>
