<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖　昨表帖</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f6f5f1;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "DFKai-SB",
                 "Noto Serif CJK TC", "Songti TC", serif;
  }

  .scan {
    position: relative;
    width: 540px;
    height: 1153px;
    flex: 0 0 540px;
    overflow: hidden;
    background:
      radial-gradient(circle at 8% 3%, rgba(110, 95, 72, 0.035) 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 2%, rgba(110, 95, 72, 0.025) 0 1px, transparent 1.5px),
      linear-gradient(#f8f7f3, #f8f7f3);
  }

  .paper {
    position: absolute;
    top: 54px;
    left: 0;
    width: 540px;
    height: 1049px;
    overflow: hidden;
    background:
      linear-gradient(90deg,
        transparent 0,
        transparent 24px,
        rgba(107, 83, 57, 0.12) 25px,
        transparent 26px,
        transparent 89px,
        rgba(107, 83, 57, 0.10) 90px,
        transparent 91px,
        transparent 144px,
        rgba(107, 83, 57, 0.09) 145px,
        transparent 146px,
        transparent 209px,
        rgba(107, 83, 57, 0.09) 210px,
        transparent 211px,
        transparent 276px,
        rgba(107, 83, 57, 0.10) 277px,
        transparent 278px,
        transparent 339px,
        rgba(107, 83, 57, 0.10) 340px,
        transparent 341px,
        transparent 401px,
        rgba(107, 83, 57, 0.11) 402px,
        transparent 403px,
        transparent 465px,
        rgba(107, 83, 57, 0.12) 466px,
        transparent 467px),
      radial-gradient(ellipse at 25% 24%, rgba(255,255,255,0.14), transparent 43%),
      radial-gradient(ellipse at 82% 80%, rgba(115,91,61,0.035), transparent 45%),
      repeating-linear-gradient(
        0deg,
        rgba(91, 74, 52, 0.018) 0,
        rgba(91, 74, 52, 0.018) 1px,
        transparent 1px,
        transparent 4px
      ),
      linear-gradient(90deg, #ded6c5 0%, #e4dccb 48%, #dcd2c0 100%);
    box-shadow:
      inset 0 1px rgba(109, 88, 63, 0.18),
      inset 0 -1px rgba(109, 88, 63, 0.16);
  }

  .paper::before {
    content: "";
    position: absolute;
    left: 37px;
    right: 73px;
    top: 20px;
    height: 1px;
    background: rgba(105, 81, 54, 0.12);
  }

  .paper::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 17% 15%, rgba(74, 56, 37, 0.035) 0 0.6px, transparent 1px),
      radial-gradient(circle at 79% 42%, rgba(74, 56, 37, 0.025) 0 0.7px, transparent 1.1px);
    background-size: 31px 37px, 43px 47px;
    opacity: 0.5;
  }

  .vertical {
    position: absolute;
    z-index: 2;
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    color: #15110e;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 5px;
    text-rendering: optimizeLegibility;
  }

  .main {
    width: 38px;
    font-size: 31px;
  }

  .col-1 {
    top: 27px;
    left: 417px;
    transform: rotate(-0.25deg);
  }

  .col-2 {
    top: 27px;
    left: 352px;
    transform: rotate(0.2deg);
  }

  .col-3 {
    top: 28px;
    left: 287px;
    transform: rotate(-0.15deg);
  }

  .col-4 {
    top: 27px;
    left: 222px;
    transform: rotate(0.16deg);
  }

  .col-5 {
    top: 26px;
    left: 157px;
    transform: rotate(-0.18deg);
  }

  .col-6 {
    top: 27px;
    left: 96px;
    transform: rotate(0.2deg);
  }

  .side-title {
    top: 68px;
    left: 477px;
    width: 28px;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 7px;
    transform: rotate(0.4deg);
  }

  .side-subtitle {
    top: 170px;
    left: 477px;
    width: 28px;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 7px;
    transform: rotate(-0.35deg);
  }

  .colophon {
    top: 201px;
    left: 43px;
    width: 34px;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 7px;
    transform: rotate(-0.35deg);
  }

  .placeholder.seal {
    position: absolute;
    z-index: 3;
    left: 50px;
    width: 27px;
    height: 28px;
    overflow: hidden;
    border: 2px solid rgba(194, 60, 35, 0.72);
    color: transparent;
    font-size: 0;
    box-shadow:
      inset 0 0 0 2px rgba(194, 60, 35, 0.17),
      0 0 1px rgba(160, 49, 27, 0.25);
    transform: rotate(-1.2deg);
  }

  .placeholder.seal::before,
  .placeholder.seal::after {
    content: "";
    position: absolute;
    border-color: rgba(194, 60, 35, 0.55);
  }

  .placeholder.seal::before {
    inset: 4px;
    border: 1px solid rgba(194, 60, 35, 0.55);
  }

  .placeholder.seal::after {
    left: 8px;
    top: 4px;
    width: 8px;
    height: 17px;
    border-left: 2px solid rgba(194, 60, 35, 0.52);
    border-right: 1px solid rgba(194, 60, 35, 0.48);
    box-shadow:
      4px 3px 0 -3px rgba(194, 60, 35, 0.55),
      -3px 7px 0 -3px rgba(194, 60, 35, 0.55);
  }

  .seal-one {
    top: 711px;
  }

  .seal-two {
    top: 768px;
    left: 51px;
    width: 26px;
    height: 27px;
    transform: rotate(-2deg);
  }

  @media (max-width: 540px) {
    body {
      display: block;
      overflow-x: hidden;
    }

    .scan {
      transform-origin: top left;
      transform: scale(calc(100vw / 540));
    }
  }
</style>
</head>
<body>
  <main class="scan" aria-label="祥除帖及昨表帖書法文獻">
    <section class="paper">
      <div class="vertical side-title">祥除帖</div>
      <div class="vertical side-subtitle">昨表帖</div>

      <div class="vertical main col-1">臣廙言臣祥除以後五日寢思永遠肝心寸截甘雪應時嚴寒奉被</div>
      <div class="vertical main col-2">手詔伏承聖體御膳勝常以慰下情臣故患勿勿氣上頓乏勿勿愁</div>
      <div class="vertical main col-3">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>
      <div class="vertical main col-4">頓首死罪死罪臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
      <div class="vertical main col-5">慰下情不審宿昔復何如承鄭夫人乃爾委頓今復增損伏惟哀亡</div>
      <div class="vertical main col-6">愍存益勞聖心謹附承動靜臣廙言</div>

      <div class="vertical colophon">歲在癸卯暮春仿書於未央雲舍</div>

      <div class="placeholder seal seal-one" aria-label="Seal: lower-left">[Seal: lower-left]</div>
      <div class="placeholder seal seal-two" aria-label="Seal: lower-left beneath first seal">[Seal: lower-left]</div>
    </section>
  </main>
</body>
</html>
