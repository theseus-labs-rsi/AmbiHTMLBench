<main class="page">
  <h1 class="main-title">NF-κB信号通路</h1>

  <p class="intro">
    相对于RTK相关信号通路，NF-κB信号通路的功能也更加特<br>
    化一些，与TGF-β和Wnt信号相比高度集中于炎症反应。
  </p>

  <figure class="top-figure">
    <div class="figure-heading">
      <span class="figure-mark"></span>
      经典NF-κB信号的功能
    </div>
    <div class="function-chart placeholder">
      <span class="placeholder-caption">[Diagram: centered]</span>
      <div class="level-label cell">细胞水平</div>
      <div class="branch cell-top">细胞增殖和凋亡</div>
      <div class="branch cell-bottom">炎症细胞的活化</div>
      <div class="connector c1"></div>
      <div class="connector c2"></div>

      <div class="level-label body">个体水平</div>
      <div class="branch body-top">肿瘤发生和发展</div>
      <div class="branch body-bottom">炎症反应</div>
      <div class="connector c3"></div>
      <div class="connector c4"></div>
    </div>
    <figcaption class="top-caption">
      相对于RTK相关信号通路，NF-κB信号通路的功能也更加特化一些，与TGF-β和Wnt信号相比，<br>
      高度集中于炎症反应。
    </figcaption>
  </figure>

  <h2 class="second-title">Notch信号通路</h2>

  <p class="notch-text">
    通过膜蛋白作为配体和受体，介导两个细胞相互靠近接<br>
    触之后的活化效应。Notch 与配体结合，经过 ADAM 剪<br>
    切释放胞外段与配体一同降解，经 γ-secretase 剪切释放<br>
    胞内段传导信号 Notch 胞内段进入细胞质传导信号。
  </p>

  <figure class="bottom-figure">
    <div class="bottom-heading">
      <span class="figure-mark"></span>
      Notch信号通路的调控
    </div>
    <div class="notch-diagram placeholder">
      <span class="placeholder-caption">[Diagram: centered]</span>
      <div class="upper-cell"></div>
      <div class="lower-cell"></div>
      <div class="signal-panel">
        <div class="signal-line s1"></div>
        <div class="signal-line s2"></div>
        <div class="signal-line s3"></div>
        <div class="signal-node n1"></div>
        <div class="signal-node n2"></div>
        <div class="signal-node n3"></div>
      </div>
      <div class="nucleus"></div>
      <div class="receptor"></div>
      <div class="arrow a1"></div>
      <div class="arrow a2"></div>
      <div class="arrow a3"></div>
      <div class="info-box i1">[illegible]</div>
      <div class="info-box i2">[illegible]</div>
      <div class="info-box i3">[illegible]</div>
    </div>
    <figcaption class="figure-credit">Chris Siebel and Urban Lendahl, <i>Physiol Rev.</i> 2017</figcaption>
    <div class="figure-note">Notch和配体的双向调控</div>
  </figure>

  <div class="speaker" aria-label="[Icon: speaker, bottom-right]">
    <div class="speaker-box"></div>
    <div class="speaker-cone"></div>
    <div class="wave w1"></div>
    <div class="wave w2"></div>
  </div>
