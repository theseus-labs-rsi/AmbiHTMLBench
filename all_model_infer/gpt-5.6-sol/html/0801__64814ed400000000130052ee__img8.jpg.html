<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loneliness Quote</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #2c2140;
    }

    body {
      display: flex;
      justify-content: center;
      color: #b8a170;
      font-family: Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 717px;
      overflow: hidden;
      background: #2c2140;
    }

    .emblem {
      position: absolute;
      top: 129px;
      left: 190px;
      width: 160px;
      height: 162px;
    }

    .sun {
      position: absolute;
      top: 4px;
      left: 12px;
      width: 136px;
      height: 82px;
      overflow: hidden;
    }

    .sun::before {
      content: "";
      position: absolute;
      top: 0;
      left: 7px;
      width: 120px;
      height: 120px;
      border: 2px solid #ae9868;
      border-radius: 50%;
      background:
        repeating-conic-gradient(
          from -8deg,
          #ae9868 0deg 1.5deg,
          transparent 1.5deg 15deg
        );
    }

    .sun::after {
      content: "";
      position: absolute;
      top: 9px;
      left: 16px;
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background: #b49d6b;
    }

    .diamond-outer,
    .diamond-inner {
      position: absolute;
      transform: rotate(45deg);
      background: #2c2140;
    }

    .diamond-outer {
      top: 24px;
      left: 24px;
      width: 112px;
      height: 112px;
      border: 2px solid #ae9868;
    }

    .diamond-inner {
      top: 31px;
      left: 31px;
      width: 98px;
      height: 98px;
      border: 1px solid #ae9868;
    }

    .female-symbol {
      position: absolute;
      top: 51px;
      left: 58px;
      width: 44px;
      height: 67px;
    }

    .female-symbol .circle {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border: 2px solid #b49d6b;
      border-radius: 50%;
      background: #2c2140;
    }

    .female-symbol .stem {
      position: absolute;
      top: 43px;
      left: 21px;
      width: 2px;
      height: 24px;
      background: #b49d6b;
    }

    .female-symbol .crossbar {
      position: absolute;
      top: 53px;
      left: 11px;
      width: 22px;
      height: 2px;
      background: #b49d6b;
    }

    .translation-row {
      position: absolute;
      top: 329px;
      left: 43px;
      width: 454px;
      display: grid;
      grid-template-columns: 24px 1fr 24px;
      column-gap: 12px;
      align-items: start;
    }

    .sparkle {
      position: relative;
      width: 22px;
      height: 22px;
      margin-top: 0;
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      background: #c1a96f;
    }

    .sparkle::before {
      top: 0;
      left: 9px;
      width: 4px;
      height: 22px;
      border-radius: 50%;
    }

    .sparkle::after {
      top: 9px;
      left: 0;
      width: 22px;
      height: 4px;
      border-radius: 50%;
    }

    .translation {
      margin: 1px 0 0;
      color: #b5a176;
      font-size: 13px;
      line-height: 22px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
    }

    .quote {
      position: absolute;
      top: 396px;
      left: 100px;
      width: 340px;
      margin: 0;
      color: #bda56f;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 29px;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 0 1px rgba(189, 165, 111, 0.5);
    }

    .quote-mark {
      display: inline-block;
      font-size: 18px;
      line-height: 18px;
      vertical-align: 7px;
    }

    .opening {
      margin-right: 7px;
    }

    .closing {
      margin-left: 7px;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        height: calc(100vw * 1.32778);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="emblem" aria-label="[Diagram: centered geometric female symbol]">
      <div class="sun"></div>
      <div class="diamond-outer"></div>
      <div class="diamond-inner"></div>
      <div class="female-symbol">
        <div class="circle"></div>
        <div class="stem"></div>
        <div class="crossbar"></div>
      </div>
    </div>

    <section class="translation-row">
      <span class="sparkle" aria-hidden="true"></span>
      <p class="translation">
        I think the so-called loneliness refers to the person you are facing,<br>
        whose emotions are not on the same frequency as your own.
      </p>
      <span class="sparkle" aria-hidden="true"></span>
    </section>

    <blockquote class="quote">
      <span class="quote-mark opening">“</span>我想所谓孤独，<br>
      就是你面对的那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。<span class="quote-mark closing">”</span>
    </blockquote>
  </main>
</body>
</html>
