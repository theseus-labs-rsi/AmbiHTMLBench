<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兰州旅行文案</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f4f4f4;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #393939;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #fff;
    }

    .card {
      position: absolute;
      width: 152px;
      text-align: center;
    }

    .location {
      height: 14px;
      font-size: 7.5px;
      line-height: 12px;
      white-space: nowrap;
    }

    .pin {
      display: inline-block;
      margin-right: 2px;
      color: #c72035;
      font-size: 8px;
      transform: translateY(-0.2px);
    }

    .quote {
      height: 18px;
      margin-top: 8px;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 7.5px;
      line-height: 12px;
      white-space: nowrap;
    }

    .placeholder {
      position: relative;
      width: 152px;
      height: 152px;
      margin-top: 7px;
      overflow: hidden;
      background: #ddd;
    }

    .mosaic {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      padding: 0;
      background: #fff;
    }

    .mosaic span {
      display: block;
      min-width: 0;
      min-height: 0;
      background-size: cover;
      background-position: center;
    }

    .placeholder figcaption {
      position: absolute;
      right: 3px;
      bottom: 2px;
      z-index: 4;
      padding: 1px 2px;
      color: rgba(255,255,255,.82);
      background: rgba(0,0,0,.22);
      font-size: 4.5px;
      line-height: 6px;
      letter-spacing: .1px;
    }

    .theme-night span:nth-child(1),
    .theme-night span:nth-child(3),
    .theme-night span:nth-child(5),
    .theme-night span:nth-child(7) {
      background:
        radial-gradient(circle at 65% 65%, #e84527 0 2%, transparent 3%),
        linear-gradient(150deg, #162153 0 40%, #9e2448 42%, #060c2e 70%);
    }

    .theme-night span:nth-child(2),
    .theme-night span:nth-child(6) {
      background:
        linear-gradient(110deg, transparent 0 45%, rgba(224,185,111,.85) 47% 51%, transparent 53%),
        linear-gradient(#cdb48e 0 55%, #6f6757 56%);
    }

    .theme-night span:nth-child(4) {
      background:
        repeating-linear-gradient(8deg, #d9d2c3 0 7px, #9f7f65 8px 10px);
    }

    .theme-night span:nth-child(8) {
      background:
        radial-gradient(circle at 35% 55%, #d5dce1 0 7%, transparent 8%),
        linear-gradient(#92b5d0 0 55%, #586876 56%);
    }

    .theme-night span:nth-child(9) {
      background:
        linear-gradient(#7ca5ca 0 56%, #ece4d9 57% 74%, #63636a 75%);
    }

    .theme-bridge span:nth-child(1),
    .theme-bridge span:nth-child(2),
    .theme-bridge span:nth-child(7),
    .theme-bridge span:nth-child(9) {
      background:
        linear-gradient(170deg, transparent 0 40%, #cad8da 42% 48%, #6ea0ae 50% 70%, #e2e4dc 71%),
        linear-gradient(#7fb1c9, #d4e4e2);
    }

    .theme-bridge span:nth-child(3),
    .theme-bridge span:nth-child(5),
    .theme-bridge span:nth-child(6) {
      background:
        repeating-linear-gradient(75deg, transparent 0 14px, rgba(62,74,65,.5) 15px 17px),
        linear-gradient(145deg, #78aa73 0 42%, #b7cdd0 43% 67%, #727979 68%);
    }

    .theme-bridge span:nth-child(4) {
      background:
        linear-gradient(90deg, #507f55 0 20%, #89b77b 21% 40%, #395f45 41% 60%, #87ad72 61%);
    }

    .theme-bridge span:nth-child(8) {
      background:
        linear-gradient(#8cb5c7 0 55%, #5f929c 56% 66%, #c4bfae 67%);
    }

    .theme-food span:nth-child(odd) {
      background:
        radial-gradient(ellipse at center, #bd531c 0 23%, #e3a94f 24% 33%, #ece1c9 34% 47%, #76513b 48% 50%, transparent 51%),
        linear-gradient(135deg, #9f5a2a, #ded2b9);
    }

    .theme-food span:nth-child(even) {
      background:
        radial-gradient(ellipse at center, #e7d4a4 0 28%, #9d582b 29% 34%, #ede6d5 35% 52%, transparent 53%),
        linear-gradient(120deg, #b97a43, #e8ddc9);
    }

    .theme-alley span:nth-child(odd) {
      background:
        repeating-linear-gradient(90deg, rgba(67,82,86,.45) 0 8px, transparent 9px 18px),
        linear-gradient(145deg, #9a5b4f, #789397 48%, #c67d5c 49%, #564d45);
    }

    .theme-alley span:nth-child(even) {
      background:
        radial-gradient(circle at 50% 35%, #d7a182 0 11%, transparent 12%),
        linear-gradient(125deg, #5c7a84, #bf6d55 55%, #50595b);
    }

    .theme-museum span:nth-child(odd) {
      background:
        radial-gradient(ellipse at center, #77614d 0 13%, #b2936e 14% 25%, #e1d3bb 26% 42%, transparent 43%),
        linear-gradient(#92795e, #ddd0b8);
    }

    .theme-museum span:nth-child(even) {
      background:
        repeating-linear-gradient(0deg, #b68959 0 5px, #dbc39e 6px 12px),
        linear-gradient(#705b49, #d7c3a1);
    }

    .theme-park span:nth-child(odd) {
      background:
        linear-gradient(155deg, #66a65e 0 25%, #92b875 26% 43%, #d9d0a7 44% 58%, #618fa0 59%);
    }

    .theme-park span:nth-child(even) {
      background:
        repeating-linear-gradient(90deg, transparent 0 12px, rgba(48,93,62,.45) 13px 16px),
        linear-gradient(#6da6cf 0 50%, #4f9a62 51%);
    }

    .theme-city span:nth-child(odd) {
      background:
        radial-gradient(circle at 70% 72%, #e23854 0 2%, transparent 3%),
        repeating-linear-gradient(90deg, #111d4d 0 9px, #28356e 10px 15px),
        linear-gradient(#10204e, #ca2458);
    }

    .theme-city span:nth-child(even) {
      background:
        radial-gradient(circle at 26% 72%, #f27c3c 0 3%, transparent 4%),
        linear-gradient(160deg, #152553 0 48%, #a62055 49% 70%, #111832 71%);
    }

    .theme-streetfood span:nth-child(odd) {
      background:
        radial-gradient(ellipse at center, #b74d24 0 24%, #dc8a3a 25% 34%, #e1d5b5 35% 47%, transparent 48%),
        linear-gradient(135deg, #677f76, #bd6c3d);
    }

    .theme-streetfood span:nth-child(even) {
      background:
        radial-gradient(circle at 50% 32%, #d4a47c 0 10%, transparent 11%),
        linear-gradient(130deg, #50656c, #cf7b48 52%, #675047);
    }

    .top-left   { left: 15px;  top: 27px; }
    .top-center { left: 194px; top: 27px; }
    .top-right  { left: 373px; top: 27px; }

    .mid-left   { left: 15px;  top: 261px; }
    .mid-right  { left: 374px; top: 261px; }

    .bottom-left   { left: 15px;  top: 508px; }
    .bottom-center { left: 194px; top: 508px; }
    .bottom-right  { left: 374px; top: 508px; }

    .vertical-title {
      position: absolute;
      left: 259px;
      top: 302px;
      height: 116px;
      color: #ae1730;
      font-family: "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 22px;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    @media (max-width: 540px) {
      .page {
        transform-origin: top center;
        transform: scale(calc(100vw / 540));
        margin-bottom: calc((100vw / 540 - 1) * 720px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card top-left">
      <div class="location"><span class="pin">📍</span>金城兰州</div>
      <div class="quote">“淌不完的黄河水向东流”</div>
      <figure class="placeholder mosaic theme-night">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 金城兰州]</figcaption>
      </figure>
    </section>

    <section class="card top-center">
      <div class="location"><span class="pin">📍</span>中山桥</div>
      <div class="quote">“陌生的人 请给我一支兰州”</div>
      <figure class="placeholder mosaic theme-bridge">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 中山桥]</figcaption>
      </figure>
    </section>

    <section class="card top-right">
      <div class="location"><span class="pin">📍</span>兰州美食</div>
      <div class="quote">“四方食事 不过一碗人间烟火”</div>
      <figure class="placeholder mosaic theme-food">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 兰州美食]</figcaption>
      </figure>
    </section>

    <section class="card mid-left">
      <div class="location"><span class="pin">📍</span>骆驼巷</div>
      <div class="quote">“繁华城市背后的另一面”</div>
      <figure class="placeholder mosaic theme-alley">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 骆驼巷]</figcaption>
      </figure>
    </section>

    <div class="vertical-title">兰州旅行文案</div>

    <section class="card mid-right">
      <div class="location"><span class="pin">📍</span>甘肃省博物馆</div>
      <div class="quote">“守河西魂魄 传丝路文明”</div>
      <figure class="placeholder mosaic theme-museum">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 甘肃省博物馆]</figcaption>
      </figure>
    </section>

    <section class="card bottom-left">
      <div class="location"><span class="pin">📍</span>白塔山公园</div>
      <div class="quote">“行走在西北 看尽黄河水”</div>
      <figure class="placeholder mosaic theme-park">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 白塔山公园]</figcaption>
      </figure>
    </section>

    <section class="card bottom-center">
      <div class="location"><span class="pin">📍</span>兰山公园</div>
      <div class="quote">“白天阿富汗 晚上曼哈顿”</div>
      <figure class="placeholder mosaic theme-city">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 兰山公园]</figcaption>
      </figure>
    </section>

    <section class="card bottom-right">
      <div class="location"><span class="pin">📍</span>正宁路小吃街</div>
      <div class="quote">“人间烟火气 最抚凡人心”</div>
      <figure class="placeholder mosaic theme-streetfood">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <figcaption>[Photo collage: 正宁路小吃街]</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
