<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All In: The Fight for Democracy</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #eeeeee;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    width: 515px;
    height: 755px;
    overflow: hidden;
    background: #ffffff;
    color: #080808;
  }

  .amazon-original {
    position: absolute;
    top: 31px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 20px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: 8px;
    white-space: nowrap;
  }

  .main-title {
    position: absolute;
    top: 217px;
    left: 38px;
    width: 436px;
    height: 168px;
    color: #0868c8;
  }

  .subtitle {
    position: absolute;
    top: 0;
    left: 47px;
    font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
    font-stretch: condensed;
    font-size: 27px;
    line-height: 31px;
    letter-spacing: -0.7px;
    white-space: nowrap;
  }

  .title-row {
    position: absolute;
    top: 39px;
    left: 0;
    display: flex;
    align-items: flex-start;
    width: 100%;
  }

  .all-in {
    flex: 0 0 236px;
    height: 128px;
    font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
    font-size: 124px;
    line-height: 0.98;
    letter-spacing: -5px;
    white-space: nowrap;
  }

  .right-title {
    flex: 0 0 192px;
    margin-left: 8px;
    padding-top: 7px;
    font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
    font-size: 35px;
    line-height: 1;
    letter-spacing: -0.8px;
  }

  .right-line {
    display: block;
    width: max-content;
    white-space: nowrap;
  }

  .red-rule {
    height: 10px;
    margin: 7px 0 3px;
    background: #f02f36;
  }

  .red-rule.first {
    width: 191px;
  }

  .red-rule.second {
    width: 191px;
    margin-top: 4px;
  }

  .festival {
    position: absolute;
    top: 509px;
    left: 204px;
    width: 108px;
    height: 49px;
    color: #4c98db;
    text-align: center;
  }

  .festival-laurel {
    position: absolute;
    top: -1px;
    font-family: Georgia, serif;
    font-size: 38px;
    line-height: 45px;
    font-weight: 400;
    color: #62a6df;
  }

  .festival-laurel.left {
    left: 5px;
    transform: scaleX(.55);
  }

  .festival-laurel.right {
    right: 5px;
    transform: scaleX(.55);
  }

  .festival-text {
    position: relative;
    z-index: 1;
    padding-top: 3px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    line-height: 10px;
    font-style: italic;
  }

  .festival-year {
    margin-top: 1px;
    font-family: Arial, sans-serif;
    font-size: 8px;
    line-height: 9px;
    font-style: normal;
  }

  .credits {
    position: absolute;
    top: 570px;
    left: 91px;
    width: 334px;
    color: #3186cf;
    text-align: center;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-stretch: condensed;
    font-size: 7px;
    line-height: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .credits .label {
    font-size: 5px;
    font-weight: 500;
  }

  .coming-soon {
    position: absolute;
    top: 607px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 18px;
    line-height: 22px;
    font-weight: 400;
    letter-spacing: -0.3px;
  }

  .release-row {
    position: absolute;
    top: 638px;
    left: 0;
    width: 100%;
    height: 47px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .date {
    padding-top: 7px;
    font-size: 20px;
    line-height: 25px;
    font-weight: 400;
    letter-spacing: 1.8px;
    white-space: nowrap;
  }

  .divider {
    width: 3px;
    height: 34px;
    margin: 0 11px 0 10px;
    background: #171717;
  }

  .prime-video {
    position: relative;
    width: 135px;
    height: 45px;
    font-size: 25px;
    line-height: 27px;
    font-weight: 700;
    letter-spacing: -1.3px;
    white-space: nowrap;
  }

  .prime-video .prime {
    font-weight: 700;
  }

  .prime-video .video {
    font-weight: 600;
  }

  .smile {
    position: absolute;
    left: 37px;
    top: 28px;
    width: 64px;
    height: 16px;
    border-bottom: 4px solid #000;
    border-radius: 0 0 65% 65%;
    transform: rotate(4deg);
  }

  .smile::after {
    content: "";
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 10px;
    height: 7px;
    border-right: 4px solid #000;
    transform: rotate(24deg);
  }

  .hashtag {
    position: absolute;
    top: 696px;
    left: 179px;
    width: 155px;
    height: 30px;
    color: #0870ca;
    text-align: center;
    font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
    font-size: 18px;
    line-height: 23px;
    letter-spacing: 0.2px;
    border-top: 4px solid #f12f37;
    border-bottom: 4px solid #f12f37;
  }

  .rating {
    position: absolute;
    left: 38px;
    bottom: 31px;
    width: 43px;
    height: 16px;
    border: 1px solid #555;
    color: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .rating-top {
    height: 7px;
    padding-left: 1px;
    border-bottom: 1px solid #555;
    font-size: 5px;
    line-height: 6px;
    font-weight: 700;
  }

  .rating-bottom {
    display: flex;
    align-items: center;
    height: 8px;
  }

  .rating-code {
    padding: 0 2px;
    border-right: 1px solid #555;
    font-size: 6px;
    line-height: 7px;
    font-weight: 700;
  }

  .rating-copy {
    padding-left: 1px;
    font-size: 3px;
    line-height: 3px;
  }

  .amazon-studios {
    position: absolute;
    right: 38px;
    bottom: 29px;
    width: 38px;
    text-align: center;
    font-size: 5px;
    line-height: 5px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .amazon-studios .studios {
    font-size: 4px;
    letter-spacing: 1.4px;
  }

  @media (max-width: 515px) {
    body {
      background: #ffffff;
    }

    .page {
      transform-origin: top left;
      transform: scale(calc(100vw / 515));
    }
  }
</style>
</head>
<body>
  <main class="page">
    <header class="amazon-original">AMAZON ORIGINAL</header>

    <section class="main-title" aria-label="All In: The Fight for Democracy">
      <div class="subtitle">HOW THE RIGHT TO VOTE WENT WRONG</div>
      <div class="title-row">
        <div class="all-in">ALL IN</div>
        <div class="right-title">
          <span class="right-line">THE FIGHT FOR</span>
          <div class="red-rule first"></div>
          <span class="right-line">DEMOCRACY</span>
          <div class="red-rule second"></div>
        </div>
      </div>
    </section>

    <section class="festival" aria-label="Telluride Film Festival 2020">
      <span class="festival-laurel left">❮</span>
      <div class="festival-text">
        Telluride<br>
        Film Festival
        <div class="festival-year">2020</div>
      </div>
      <span class="festival-laurel right">❯</span>
    </section>

    <div class="credits">
      <span class="label">WRITTEN BY</span> JACK YOUNGELSON
      &nbsp;&nbsp;&nbsp;
      <span class="label">DIRECTED BY</span> LIZ GARBUS <span class="label">AND</span> LISA CORTÉS
    </div>

    <div class="coming-soon">COMING SOON TO THEATERS</div>

    <div class="release-row">
      <div class="date">SEPTEMBER 18</div>
      <div class="divider"></div>
      <div class="prime-video">
        <span class="prime">prime</span> <span class="video">video</span>
        <span class="smile"></span>
      </div>
    </div>

    <div class="hashtag">#ALLINFORVOTING</div>

    <div class="rating" aria-label="PG-13 certification mark">
      <div class="rating-top">PG-13</div>
      <div class="rating-bottom">
        <div class="rating-code">PG-13</div>
        <div class="rating-copy">[illegible]</div>
      </div>
    </div>

    <div class="amazon-studios">
      AMAZON<br>
      <span class="studios">STUDIOS</span>
    </div>
  </main>
</body>
</html>
