<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>侵权责任构成</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d7d2c7;
    }

    body {
      padding: 22px;
      color: #263633;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
    }

    .page {
      position: relative;
      width: 1060px;
      height: 760px;
      margin: 0 auto;
      overflow: hidden;
      background-color: #f4f3e9;
      background-image:
        linear-gradient(rgba(118, 145, 143, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 145, 143, 0.18) 1px, transparent 1px);
      background-size: 22px 22px;
      border-radius: 5px 20px 20px 5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.28);
      transform-origin: top center;
    }

    .binding {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 58px;
      border-right: 1px solid rgba(85, 105, 101, 0.25);
      background: rgba(244, 243, 233, 0.8);
    }

    .holes {
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 18px;
      width: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .hole {
      width: 17px;
      height: 17px;
      border: 1px solid #8e8c80;
      border-radius: 50%;
      background: #c4bfb2;
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.45);
    }

    .content {
      position: absolute;
      inset: 30px 37px 30px 78px;
    }

    .title {
      position: absolute;
      top: 7px;
      left: 9px;
      margin: 0;
      color: #1d514d;
      font-size: 31px;
      font-weight: 500;
      letter-spacing: 12px;
      writing-mode: vertical-rl;
    }

    .diagram {
      position: absolute;
      top: 8px;
      left: 80px;
      right: 0;
      bottom: 5px;
      font-size: 19px;
      line-height: 1.65;
    }

    .root {
      position: absolute;
      top: 4px;
      right: 8px;
      width: 700px;
      text-align: right;
      font-size: 19px;
      white-space: nowrap;
    }

    .root::after {
      content: "";
      position: absolute;
      right: 604px;
      top: 32px;
      width: 2px;
      height: 54px;
      background: #31817b;
    }

    .branch {
      position: absolute;
      border-left: 3px solid #31817b;
    }

    .branch::before {
      content: "";
      position: absolute;
      top: 0;
      left: -3px;
      height: 3px;
      background: #31817b;
    }

    .branch-main {
      top: 86px;
      left: 146px;
      width: 690px;
      height: 97px;
    }

    .branch-main::before {
      width: 690px;
    }

    .main-items {
      display: grid;
      grid-template-columns: 125px 141px 142px 282px;
      height: 100%;
    }

    .main-item {
      position: relative;
      padding: 13px 8px 0 15px;
      text-align: center;
      white-space: nowrap;
    }

    .main-item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 13px;
      background: #31817b;
    }

    .note {
      display: block;
      margin-top: 5px;
      font-size: 16px;
      line-height: 1.5;
      white-space: normal;
    }

    .branch-sub {
      top: 184px;
      left: 146px;
      width: 366px;
      height: 86px;
    }

    .branch-sub::before {
      width: 366px;
    }

    .sub-items {
      display: grid;
      grid-template-columns: 120px 120px 126px;
    }

    .sub-item {
      position: relative;
      padding-top: 13px;
      text-align: center;
      white-space: nowrap;
    }

    .sub-item::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 13px;
      background: #31817b;
    }

    .details {
      position: absolute;
      top: 274px;
      left: 192px;
      width: 700px;
      font-size: 18px;
      line-height: 1.75;
    }

    .detail-line {
      min-height: 31px;
      white-space: nowrap;
    }

    .detail-line.indent {
      margin-left: 95px;
    }

    .side-branch {
      position: absolute;
      top: 242px;
      left: 67px;
      width: 106px;
      height: 214px;
      border-left: 3px solid #31817b;
    }

    .side-branch::before,
    .side-branch::after {
      content: "";
      position: absolute;
      left: -3px;
      width: 106px;
      height: 3px;
      background: #31817b;
    }

    .side-branch::before {
      top: 0;
    }

    .side-branch::after {
      bottom: 0;
    }

    .side-label {
      position: absolute;
      left: 14px;
      font-size: 18px;
      white-space: nowrap;
    }

    .side-label.first {
      top: 8px;
    }

    .side-label.second {
      bottom: 6px;
    }

    .bottom-text {
      position: absolute;
      left: 118px;
      right: 5px;
      bottom: 3px;
      font-size: 18px;
      line-height: 1.7;
    }

    .bottom-text p {
      margin: 0;
    }

    @media (max-width: 1120px) {
      body {
        padding: 8px;
        overflow-x: auto;
      }

      .page {
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <aside class="binding" aria-hidden="true">
      <div class="holes">
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
        <span class="hole"></span><span class="hole"></span><span class="hole"></span>
      </div>
    </aside>

    <section class="content">
      <h1 class="title">侵权责任构成</h1>

      <div class="diagram">
        <div class="root">行为因未介入他人权利范围而具有违法性，须具有侵权行为</div>

        <div class="branch branch-main">
          <div class="main-items">
            <div class="main-item">行为</div>
            <div class="main-item">违法性</div>
            <div class="main-item">损害事实</div>
            <div class="main-item">
              因果关系
              <span class="note">事实上的因果关系：若无该行为，则损害不会发生</span>
            </div>
          </div>
        </div>

        <div class="branch branch-sub">
          <div class="sub-items">
            <div class="sub-item">权利侵害</div>
            <div class="sub-item">违反保护他人之法律</div>
            <div class="sub-item">故意背于善良风俗</div>
          </div>
        </div>

        <div class="side-branch">
          <span class="side-label first">相当因果关系</span>
          <span class="side-label second">法规目的说</span>
        </div>

        <div class="details">
          <div class="detail-line">损害赔偿之债权，以实际发生损害为成立要件</div>
          <div class="detail-line">损害包括财产上损害与非财产上损害</div>
          <div class="detail-line indent">损害须为行为所造成</div>
          <div class="detail-line">依一般情形，此种行为通常会发生此种结果</div>
          <div class="detail-line">行为与损害间须有相当因果关系</div>
        </div>

        <div class="bottom-text">
          <p>因果关系之判断，应依具体个案事实认定。</p>
          <p>侵权行为须具备行为、违法性、损害及因果关系等要件。</p>
          <p>[illegible]</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
