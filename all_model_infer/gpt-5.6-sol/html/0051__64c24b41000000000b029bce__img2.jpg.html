<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Happiness of Midsummer</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f8f6ef;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 720px;
    overflow: hidden;
    background: #f8f6ef;
    color: #2587bd;
  }

  .masthead {
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    height: 70px;
    text-align: center;
    color: #2788bd;
    font-family: Georgia, "Times New Roman", serif;
  }

  .masthead .the {
    height: 18px;
    font-size: 18px;
    line-height: 18px;
    font-style: italic;
  }

  .masthead .happiness {
    height: 26px;
    font-size: 26px;
    line-height: 26px;
    font-weight: bold;
    font-style: italic;
  }

  .masthead .midsummer {
    height: 29px;
    font-size: 28px;
    line-height: 27px;
    font-weight: normal;
    letter-spacing: -0.5px;
  }

  .masthead sup {
    position: relative;
    top: -8px;
    margin-left: 2px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
  }

  .photo-labels {
    position: absolute;
    top: 89px;
    left: 66px;
    width: 408px;
    height: 12px;
    color: #2784b6;
    font-size: 7px;
    line-height: 10px;
    font-weight: bold;
  }

  .photo-labels .left {
    float: left;
  }

  .photo-labels .right {
    float: right;
  }

  .placeholder.photo {
    position: absolute;
    top: 103px;
    left: 66px;
    width: 408px;
    height: 543px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 28%, rgba(255,255,255,.92) 0 4%, rgba(255,255,255,.64) 5% 9%, transparent 17%),
      radial-gradient(ellipse at 72% 28%, rgba(255,255,255,.86) 0 6%, rgba(255,255,255,.55) 10%, transparent 21%),
      radial-gradient(ellipse at 64% 46%, rgba(255,255,255,.83) 0 7%, rgba(255,255,255,.44) 12%, transparent 24%),
      radial-gradient(ellipse at 19% 45%, rgba(255,255,255,.78) 0 5%, rgba(255,255,255,.35) 12%, transparent 24%),
      linear-gradient(to bottom, #5798d4 0%, #70afe0 52%, #b9d6e6 79%, #9fc0c9 100%);
  }

  .placeholder-caption {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .tree {
    position: absolute;
    z-index: 5;
    top: 9px;
    right: -2px;
    width: 82px;
    height: 346px;
    background: #0b3216;
    clip-path: polygon(
      83% 0, 100% 0, 100% 100%, 54% 94%, 60% 86%, 36% 87%,
      48% 78%, 19% 79%, 45% 68%, 31% 61%, 55% 55%, 34% 51%,
      61% 43%, 44% 35%, 68% 28%, 54% 20%, 76% 15%
    );
  }

  .tree::before,
  .tree::after {
    content: "";
    position: absolute;
    background: #123d1c;
    border-radius: 50%;
  }

  .tree::before {
    width: 58px;
    height: 72px;
    top: 58px;
    left: 12px;
    box-shadow:
      -7px 62px 0 -4px #113b1b,
      13px 113px 0 -8px #0c3417,
      -13px 165px 0 -9px #123c1b,
      17px 216px 0 -12px #0a2f15;
  }

  .tree::after {
    width: 37px;
    height: 230px;
    top: 72px;
    right: 0;
    background: #102d17;
  }

  .building {
    position: absolute;
    z-index: 2;
    right: 17px;
    bottom: 82px;
    width: 118px;
    height: 102px;
    border: 1px solid rgba(45, 58, 59, .75);
    background:
      repeating-linear-gradient(to right, transparent 0 10px, rgba(42,57,58,.62) 11px 12px),
      repeating-linear-gradient(to bottom, transparent 0 9px, rgba(42,57,58,.53) 10px 11px),
      linear-gradient(to right, #8f9e9d, #bbc3bc 48%, #8e9a98);
    clip-path: polygon(10% 19%, 34% 11%, 38% 0, 68% 0, 73% 18%, 100% 26%, 100% 100%, 0 100%, 0 28%);
  }

  .wire {
    position: absolute;
    z-index: 7;
    left: -32px;
    width: 505px;
    height: 1px;
    background: rgba(22, 28, 30, .85);
    transform-origin: left center;
  }

  .wire.one {
    top: 174px;
    transform: rotate(31deg);
  }

  .wire.two {
    top: 204px;
    transform: rotate(26deg);
  }

  .wire.three {
    left: 159px;
    top: 268px;
    width: 310px;
    transform: rotate(-34deg);
  }

  .power-arm {
    position: absolute;
    z-index: 8;
    top: 267px;
    left: 166px;
    width: 275px;
    height: 6px;
    background: #2d3434;
    transform: rotate(-4deg);
    transform-origin: left center;
  }

  .power-arm::before {
    content: "";
    position: absolute;
    left: 12px;
    top: -4px;
    width: 52px;
    height: 8px;
    border-bottom: 3px solid #171d1d;
  }

  .cable-drop {
    position: absolute;
    z-index: 8;
    top: 270px;
    width: 2px;
    height: 29px;
    background: #202828;
  }

  .cable-drop.d1 {
    left: 182px;
    transform: rotate(10deg);
  }

  .cable-drop.d2 {
    left: 217px;
    transform: rotate(-8deg);
  }

  .cable-drop.d3 {
    left: 257px;
    transform: rotate(-14deg);
  }

  .bridge {
    position: absolute;
    z-index: 10;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 272px;
    background:
      linear-gradient(174deg, transparent 0 11%, #667176 11.5% 14%, #273136 14.5% 22%, #172126 22.5% 100%);
    clip-path: polygon(0 4%, 100% 59%, 100% 100%, 0 100%);
  }

  .bridge::before {
    content: "";
    position: absolute;
    left: 0;
    top: 51px;
    width: 440px;
    height: 9px;
    background: #a2aaa9;
    border-top: 2px solid #1e282c;
    border-bottom: 3px solid #283236;
    transform: rotate(20.6deg);
    transform-origin: left center;
  }

  .bridge::after {
    content: "";
    position: absolute;
    left: 0;
    top: 112px;
    width: 465px;
    height: 7px;
    background: #0c1519;
    transform: rotate(20.6deg);
    transform-origin: left center;
    box-shadow: 0 12px 0 #263035, 0 25px 0 #11191d;
  }

  .underpass-light {
    position: absolute;
    z-index: 12;
    left: 57px;
    bottom: 0;
    width: 147px;
    height: 44px;
    border-left: 5px solid #10191c;
    border-top: 5px solid #10191c;
    background: rgba(183, 208, 206, .35);
  }

  .support {
    position: absolute;
    z-index: 13;
    bottom: -10px;
    width: 17px;
    height: 130px;
    background: #131c20;
    transform: skewX(-4deg);
  }

  .support.s1 {
    left: 42px;
  }

  .support.s2 {
    left: 268px;
    height: 91px;
  }

  .traffic-pole {
    position: absolute;
    z-index: 20;
    right: 13px;
    bottom: 70px;
    width: 2px;
    height: 145px;
    background: #394345;
  }

  .signals {
    position: absolute;
    z-index: 21;
    right: 7px;
    bottom: 72px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }

  .signal {
    position: relative;
    width: 17px;
    height: 34px;
    border-radius: 10px;
    background: #182326;
    border: 1px solid #536163;
    box-shadow: 0 0 1px #000;
  }

  .signal.small {
    width: 14px;
    height: 28px;
    margin-bottom: 3px;
  }

  .signal .light {
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 8px;
    height: 8px;
    transform: translateX(-50%);
    color: #00f5c0;
    font-size: 12px;
    line-height: 7px;
    text-align: center;
    text-shadow: 0 0 4px #00dcae;
  }

  .signal .number {
    position: absolute;
    top: 4px;
    left: 2px;
    color: #00f2bc;
    font-size: 9px;
    line-height: 9px;
    text-shadow: 0 0 4px #00dcae;
  }

  .footer {
    position: absolute;
    top: 658px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #2a8dc2;
  }

  .footer .cn {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: bold;
  }

  .footer .good {
    margin-top: 6px;
    font-size: 8px;
    line-height: 10px;
    font-weight: normal;
    letter-spacing: .4px;
  }

  .footer .quotation {
    width: 100%;
    margin-top: 2px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 5px;
    line-height: 6px;
    font-weight: normal;
    color: #2588bb;
    white-space: nowrap;
  }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <div class="the">The</div>
    <div class="happiness">(Happiness of)</div>
    <div class="midsummer">Midsummer<sup>®</sup></div>
  </header>

  <div class="photo-labels">
    <span class="left">MOMENTS</span>
    <span class="right">S/S 2023</span>
  </div>

  <figure class="placeholder photo">
    <figcaption class="placeholder-caption">[Photo: blue sky, clouds, trees, power lines, traffic signals, buildings, and an urban overpass]</figcaption>
    <div class="building"></div>
    <div class="tree"></div>
    <div class="wire one"></div>
    <div class="wire two"></div>
    <div class="wire three"></div>
    <div class="power-arm"></div>
    <div class="cable-drop d1"></div>
    <div class="cable-drop d2"></div>
    <div class="cable-drop d3"></div>
    <div class="bridge"></div>
    <div class="underpass-light"></div>
    <div class="support s1"></div>
    <div class="support s2"></div>
    <div class="traffic-pole"></div>
    <div class="signals">
      <div class="signal small"><span class="number">0</span><span class="light">↑</span></div>
      <div class="signal"><span class="number">01</span><span class="light">↑</span></div>
      <div class="signal small"><span class="light">→</span></div>
    </div>
  </figure>

  <footer class="footer">
    <p class="cn">【2023仲夏 正在进行时】</p>
    <div class="good">HAVE A GOOD ONE</div>
    <div class="quotation">
      Through fire do wander every where, Swifter than the moon's sphere, To dew her orbs<br>
      upon the green. The cowslips tall her pensioners be; In their gold coats spots you see, Farewell, I'll be gone
    </div>
  </footer>
</main>
</body>
</html>
