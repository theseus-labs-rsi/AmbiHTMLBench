<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句合集系列</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #d8c29a;
      color: #17120d;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }

    .page {
      width: 540px;
      min-height: 714px;
      margin: 0 auto;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          2deg,
          rgba(80, 57, 27, 0.025) 0,
          rgba(80, 57, 27, 0.025) 1px,
          transparent 1px,
          transparent 5px
        ),
        repeating-linear-gradient(
          91deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 7px
        ),
        #d5bd91;
    }

    .masthead {
      height: 149px;
      display: grid;
      grid-template-columns: 55% 45%;
      background: #f2e5ad;
      border-bottom: 2px solid rgba(75, 53, 28, 0.22);
    }

    .brand {
      position: relative;
      padding: 5px 0 0 10px;
    }

    .brand-cn {
      color: #c9251d;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      white-space: nowrap;
      transform: rotate(-2deg);
      transform-origin: left center;
      text-shadow:
        1px 1px 1px rgba(104, 22, 14, 0.5),
        3px 2px 3px rgba(104, 22, 14, 0.22);
    }

    .brand-en {
      position: absolute;
      top: 114px;
      left: 69px;
      color: #8c4a3a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .series {
      padding-top: 8px;
      overflow: hidden;
      font-family: "Songti SC", "SimSun", serif;
    }

    .series-top {
      width: 245px;
      padding: 0 0 15px 43px;
      border-bottom: 3px solid #241b12;
      font-size: 24px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .series-title {
      width: 245px;
      margin-top: 31px;
      padding: 0 0 4px 37px;
      border-bottom: 3px solid #241b12;
      font-size: 28px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .content {
      padding: 34px 12px 4px 13px;
    }

    .entry {
      margin: 0;
    }

    .entry + .entry {
      margin-top: 16px;
    }

    .quote {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: start;
    }

    .number {
      font-size: 39px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .verse {
      font-size: 38px;
      line-height: 1.18;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .meaning {
      margin-top: 19px;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 16px;
      line-height: 1.18;
    }

    .meaning-label {
      display: block;
    }

    .meaning-text {
      display: block;
    }

    .entry:nth-child(2) {
      margin-top: 16px;
    }

    .entry:nth-child(2) .meaning {
      margin-top: 12px;
    }

    .entry:nth-child(3) {
      margin-top: 24px;
    }

    .entry:nth-child(3) .meaning {
      margin-top: 12px;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        min-height: 132.222vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-cn">人民日报</div>
        <div class="brand-en">RENMIN RIBAO</div>
      </div>
      <div class="series">
        <div class="series-top">金句｜素材｜摘抄</div>
        <div class="series-title">金句合集系列</div>
      </div>
    </header>

    <section class="content">
      <article class="entry">
        <div class="quote">
          <div class="number">1、</div>
          <div class="verse">愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          <span class="meaning-text">希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝<br>与琐事而烦恼忧愁。</span>
        </div>
      </article>

      <article class="entry">
        <div class="quote">
          <div class="number">2、</div>
          <div class="verse">总有人间一两风，<br>填我十万八千梦。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          <span class="meaning-text">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成<br>全你的理想。</span>
        </div>
      </article>

      <article class="entry">
        <div class="quote">
          <div class="number">3、</div>
          <div class="verse">日出有盼， 日落有思，<br>平平安安， 所遇皆甜。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          <span class="meaning-text">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，<br>遇到的都是美好。</span>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
