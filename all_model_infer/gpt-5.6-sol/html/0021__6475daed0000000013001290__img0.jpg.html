<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Make Progress</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      color: #f2f2f2;
      font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      position: relative;
      width: min(100vw, 512px);
      aspect-ratio: 512 / 735;
      overflow: hidden;
      background: #000;
    }

    .heading {
      position: absolute;
      top: 4.6%;
      left: 6.8%;
      margin: 0;
      font-size: clamp(15px, 4.25vw, 22px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .progress-list {
      position: absolute;
      top: 26.1%;
      left: 7.2%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .progress-list li {
      display: grid;
      grid-template-columns: 72px auto;
      align-items: baseline;
      height: clamp(30px, 7.03vw, 36px);
      font-size: clamp(18px, 4.7vw, 24px);
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .number {
      font-weight: 700;
    }

    .item {
      font-weight: 400;
    }

    .footer {
      position: absolute;
      left: 7.2%;
      bottom: 6.6%;
      color: #8c8c8c;
      font-size: clamp(9px, 2.4vw, 12px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="heading">HOW TO MAKE PROGRESS</h1>

    <ol class="progress-list">
      <li><span class="number">01</span><span class="item">设定明确的目标</span></li>
      <li><span class="number">02</span><span class="item">学习新知识</span></li>
      <li><span class="number">03</span><span class="item">发展技能</span></li>
      <li><span class="number">04</span><span class="item">持续反思和改进</span></li>
      <li><span class="number">05</span><span class="item">与优秀的人合作</span></li>
      <li><span class="number">06</span><span class="item">克服困难</span></li>
      <li><span class="number">07</span><span class="item">坚持努力</span></li>
      <li><span class="number">08</span><span class="item">接受反馈</span></li>
      <li><span class="number">09</span><span class="item">健康生活方式</span></li>
      <li><span class="number">10</span><span class="item">保持积极心态</span></li>
    </ol>

    <footer class="footer">@ THE LAB C</footer>
  </main>
</body>
</html>
