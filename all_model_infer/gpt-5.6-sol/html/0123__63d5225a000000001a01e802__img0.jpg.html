<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这是好的开始</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d9d4c7;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #171712;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "FangSong", serif;
    }

    .page {
      position: relative;
      width: min(100vw, 540px);
      aspect-ratio: 3 / 4;
      min-height: 720px;
      overflow: hidden;
      background-color: #e7e3d5;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 39px,
          rgba(55, 55, 48, 0.78) 40px,
          transparent 41px,
          transparent 42px
        );
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.18);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(40, 35, 20, 0.05), transparent 8%, transparent 91%, rgba(40, 35, 20, 0.06)),
        radial-gradient(circle at 45% 20%, transparent 0, transparent 57%, rgba(88, 79, 55, 0.045) 100%);
    }

    .planner-header {
      position: relative;
      z-index: 1;
      height: 29px;
      border-bottom: 1px solid rgba(38, 38, 34, 0.85);
      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 600;
    }

    .days {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      height: 23px;
      transform: rotate(-2deg);
      transform-origin: left top;
    }

    .day {
      width: 14px;
      padding-top: 7px;
      text-align: center;
      border-right: 1px solid #68675f;
      border-bottom: 1px solid #68675f;
    }

    .date {
      position: absolute;
      top: 3px;
      right: 5px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 10px;
    }

    .date-label {
      margin-right: 8px;
    }

    .date-slot {
      display: inline-block;
      min-width: 16px;
      text-align: center;
    }

    .content {
      position: relative;
      z-index: 1;
      padding-left: 50px;
      padding-right: 18px;
      font-size: 31px;
      font-weight: 600;
      line-height: 41px;
      letter-spacing: 0;
      transform: rotate(-0.4deg);
      transform-origin: center top;
    }

    .title {
      height: 83px;
      padding-top: 6px;
      padding-left: 14px;
      font-size: 32px;
      line-height: 41px;
      white-space: nowrap;
    }

    .writing {
      margin: 0;
      white-space: nowrap;
    }

    @media (max-width: 539px) {
      .page {
        min-height: 0;
      }

      .content {
        padding-left: 9.2vw;
        padding-right: 3.3vw;
        font-size: 5.7vw;
        line-height: 7.6vw;
      }

      .title {
        height: 15.4vw;
        padding-top: 1.1vw;
        padding-left: 2.6vw;
        font-size: 5.9vw;
        line-height: 7.6vw;
      }

      .planner-header {
        height: 5.4vw;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="planner-header">
      <div class="days" aria-label="Days of the week">
        <span class="day">Tu</span>
        <span class="day">We</span>
        <span class="day">Th</span>
        <span class="day">Fr</span>
        <span class="day">Sa</span>
        <span class="day">Su</span>
      </div>
      <div class="date">
        <span class="date-label">Date.</span>
        <span class="date-slot">/</span>
        <span class="date-slot">/</span>
        <span class="date-slot">/</span>
      </div>
    </header>

    <section class="content">
      <div class="title">这是好的开始</div>
      <p class="writing">从你看到这篇文章开始.<br>
        你会越来越有钱<br>
        越来越好看.<br>
        生活和心态.也会越来越好.<br>
        请相信大数据.<br>
        是你自己把一切美好的东西.<br>
        都吸引了过来<br>
        你已经调到了接收钱的频率<br>
        接收美的频率<br>
        你的能量频率对了才接收到这<br>
        条信息.<br>
        留下一句“全收到”.<br>
        愿所有的愿望全能实现！
      </p>
    </section>
  </main>
</body>
</html>
