<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT快捷键</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #f49ab8;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: #202020;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 709px;
    overflow: hidden;
    background: #f49ab8;
  }

  .sheet {
    position: absolute;
    top: 85px;
    left: 43px;
    width: 453px;
    height: 603px;
    padding: 27px 16px 24px;
    background: #fff;
  }

  .header-sign {
    position: absolute;
    z-index: 2;
    top: 25px;
    left: 123px;
    width: 290px;
    height: 77px;
    background: #f7dbe6;
    border: 2px solid #292929;
    transform: rotate(0.2deg);
  }

  .header-sign::before {
    content: "";
    position: absolute;
    inset: 5px;
    background: #fff;
    border: 1.5px solid #292929;
  }

  .hanger {
    position: absolute;
    z-index: 1;
    top: 4px;
    width: 0;
    height: 0;
    border-right: 12px solid transparent;
    border-bottom: 22px solid #292929;
    border-left: 12px solid transparent;
  }

  .hanger::after {
    content: "";
    position: absolute;
    top: 3px;
    left: -10px;
    width: 0;
    height: 0;
    border-right: 10px solid transparent;
    border-bottom: 19px solid #fff;
    border-left: 10px solid transparent;
  }

  .hanger.left {
    left: 183px;
  }

  .hanger.right {
    left: 333px;
  }

  .sign-content {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 1px;
  }

  .check-box {
    display: inline-flex;
    width: 43px;
    height: 43px;
    align-items: center;
    justify-content: center;
    margin-right: 2px;
    border: 1px solid #6a9d00;
    border-radius: 7px;
    background: linear-gradient(135deg, #8ed11b 0%, #4ba500 100%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
  }

  .sign-title {
    color: #181818;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .stitch {
    position: absolute;
    z-index: 3;
    width: 36px;
    height: 6px;
    border-top: 2px solid #282828;
    border-radius: 50%;
    background: transparent;
  }

  .stitch.left {
    left: -11px;
    transform: rotate(10deg);
  }

  .stitch.right {
    right: -11px;
    transform: rotate(-10deg);
  }

  .stitch.l1,
  .stitch.r1 {
    top: 17px;
  }

  .stitch.l2,
  .stitch.r2 {
    top: 34px;
  }

  .stitch.l3,
  .stitch.r3 {
    top: 51px;
  }

  .shortcut-list {
    display: grid;
    grid-template-columns: 155px 1fr;
    grid-auto-rows: 40px;
    align-items: start;
    width: 100%;
  }

  .key,
  .description {
    margin: 0;
    white-space: nowrap;
    font-size: 21px;
    font-weight: 700;
    line-height: 27px;
    letter-spacing: 0;
  }

  .key {
    padding-left: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }

  .description {
    padding-left: 16px;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }

  @media (max-width: 540px) {
    .page {
      width: 100vw;
      height: calc(100vw * 709 / 540);
      transform-origin: top left;
    }

    .page-inner {
      width: 540px;
      height: 709px;
      transform: scale(calc(100vw / 540));
      transform-origin: top left;
    }
  }
</style>
</head>
<body>
<main class="page">
  <div class="page-inner">
    <div class="hanger left" aria-hidden="true"></div>
    <div class="hanger right" aria-hidden="true"></div>

    <header class="header-sign">
      <span class="stitch left l1" aria-hidden="true"></span>
      <span class="stitch left l2" aria-hidden="true"></span>
      <span class="stitch left l3" aria-hidden="true"></span>
      <span class="stitch right r1" aria-hidden="true"></span>
      <span class="stitch right r2" aria-hidden="true"></span>
      <span class="stitch right r3" aria-hidden="true"></span>
      <div class="sign-content">
        <span class="check-box">✓</span>
        <span class="sign-title">PPT快捷键</span>
      </div>
    </header>

    <section class="sheet" aria-label="PPT快捷键列表">
      <div class="shortcut-list">
        <div class="key">B</div>
        <div class="description">黑屏(在演示时)</div>

        <div class="key">W</div>
        <div class="description">切换至白屏/从黑白屏恢复放映</div>

        <div class="key">F4</div>
        <div class="description">重复上一步操作</div>

        <div class="key">Ctrl+D</div>
        <div class="description">快速复制选中对象</div>

        <div class="key">Ctrl+G</div>
        <div class="description">组合对象</div>

        <div class="key">Ctrl+ Shift+ G</div>
        <div class="description">取消组合</div>

        <div class="key">Ctrl+Alt+V</div>
        <div class="description">打开选择性粘贴窗口</div>

        <div class="key">Ctrl+单击</div>
        <div class="description">选择多个对象</div>

        <div class="key">Shift+鼠标</div>
        <div class="description">拖动等比例缩放图片</div>

        <div class="key">Shift+ F5</div>
        <div class="description">从当前页开始放映</div>

        <div class="key">Ctrl+ Shift+C</div>
        <div class="description">复制格式</div>

        <div class="key">Ctrl+ Shift+V</div>
        <div class="description">粘贴格式</div>

        <div class="key">Ctrl+ Shift+ &lt;</div>
        <div class="description">快速缩小字号</div>

        <div class="key">Ctrl+ Shift+&gt;</div>
        <div class="description">快速增大字号</div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
