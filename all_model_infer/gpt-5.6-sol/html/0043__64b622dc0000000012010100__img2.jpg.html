<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对比色配色</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eeeeec;
    }

    body {
      color: #090909;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
    }

    .header {
      position: relative;
      width: 512px;
      height: 139px;
      margin-left: 14px;
      overflow: hidden;
      background: #ed5a00;
      border-radius: 0 0 53% 9% / 0 0 15% 13%;
    }

    .copyright {
      position: absolute;
      top: 16px;
      left: 21px;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 27px;
      line-height: 1;
    }

    .diamonds {
      position: absolute;
      top: 53px;
      left: 29px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
      font-size: 15px;
      line-height: 12px;
    }

    .year {
      position: absolute;
      top: 19px;
      right: 23px;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 800;
      line-height: 1;
    }

    .main-title {
      position: absolute;
      top: 39px;
      left: 72px;
      margin: 0;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 63px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .mark {
      position: absolute;
      right: 23px;
      bottom: 10px;
      font-family: "SimHei", sans-serif;
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
    }

    .intro {
      width: 472px;
      margin: 11px 0 0 35px;
      font-size: 12.5px;
      line-height: 15px;
      letter-spacing: 0;
    }

    .card {
      position: absolute;
      left: 24px;
      width: 492px;
      background: #ffffff;
      border: 2px solid #db620d;
      border-radius: 25px;
      box-shadow: 0 5px 8px rgba(73, 73, 73, 0.24);
    }

    .card-one {
      top: 237px;
      height: 198px;
    }

    .card-two {
      top: 484px;
      height: 196px;
    }

    .card-title {
      height: 40px;
      margin: 0;
      padding: 15px 8px 0;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 19px;
      font-weight: 800;
      line-height: 23px;
      letter-spacing: 0;
    }

    .title-diamond {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-left: 5px;
      transform: rotate(45deg) translateY(-2px);
      background: #eb6500;
    }

    .composition {
      position: relative;
      height: 104px;
      overflow: hidden;
    }

    .card-one .composition {
      width: 444px;
      margin-left: 16px;
    }

    .card-two .composition {
      width: 444px;
      margin-left: 27px;
    }

    .first-green,
    .first-blue,
    .first-yellow,
    .second-lime,
    .second-pink,
    .second-black {
      position: absolute;
    }

    .first-green {
      inset: 0 auto 0 0;
      width: 50%;
      background: #009c51;
    }

    .first-blue {
      inset: 0 0 0 auto;
      width: 50%;
      background: #0865ad;
    }

    .first-yellow {
      top: -20px;
      left: 97px;
      width: 249px;
      height: 126px;
      background: #fff200;
      clip-path: path("M 41 0 C 56 9, 31 25, 43 39 C 55 54, 98 51, 107 64 C 117 79, 91 86, 98 99 C 108 117, 161 121, 198 111 C 224 104, 230 90, 247 78 C 261 68, 253 52, 230 45 C 205 37, 169 40, 148 29 C 132 21, 143 9, 146 0 Z");
    }

    .caption {
      margin: 8px 5px 0;
      color: #888888;
      font-size: 11.5px;
      line-height: 15px;
      letter-spacing: 0;
    }

    .card-two .caption {
      margin-top: 3px;
    }

    .second-lime {
      inset: 0 auto 0 0;
      width: 50%;
      background: #86c712;
    }

    .second-pink {
      inset: 0 0 0 auto;
      width: 50%;
      background: #ff1c5a;
    }

    .second-black {
      top: -13px;
      left: 101px;
      width: 248px;
      height: 127px;
      background: #000000;
      clip-path: path("M 43 0 C 52 13, 41 22, 29 31 C 14 42, 1 49, 1 62 C 1 79, 17 86, 33 94 C 48 102, 41 118, 37 127 L 210 127 C 207 111, 199 101, 218 92 C 238 83, 249 75, 247 57 C 245 39, 222 33, 201 29 C 176 25, 151 25, 138 16 C 129 10, 132 4, 134 0 Z");
    }

    .bottom-band {
      position: absolute;
      left: 14px;
      bottom: 0;
      width: 512px;
      height: 25px;
      background: #ec5b00;
    }

    @media (max-width: 540px) {
      .page {
        transform-origin: top left;
        transform: scale(calc(100vw / 540));
      }

      body {
        width: 100vw;
        height: calc(100vw * 1.333333);
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="copyright">©</div>
      <div class="diamonds" aria-hidden="true">
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
        <span>◆</span>
      </div>
      <div class="year">2023</div>
      <h1 class="main-title">对比色配色</h1>
      <div class="mark">瑞</div>
    </header>

    <section class="intro">
      对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都<br>
      使用对比强烈的色彩,所以配色清晰而有力。
    </section>

    <section class="card card-one">
      <h2 class="card-title">富有朝气的配色<span class="title-diamond" aria-hidden="true"></span></h2>
      <div class="composition placeholder" role="img" aria-label="黄色、绿色和蓝紫色的对比色组合">
        <div class="first-green"></div>
        <div class="first-blue"></div>
        <div class="first-yellow"></div>
      </div>
      <p class="caption">以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合,给人未来充满希望的感觉。</p>
    </section>

    <section class="card card-two">
      <h2 class="card-title">视觉冲击强烈的配色<span class="title-diamond" aria-hidden="true"></span></h2>
      <div class="composition placeholder" role="img" aria-label="黄绿色、黑色和深红色的对比色组合">
        <div class="second-lime"></div>
        <div class="second-pink"></div>
        <div class="second-black"></div>
      </div>
      <p class="caption">黄绿色相中选择华丽鲜艳的色调,同时在相反色中选择活泼的深红色调在与黑色进行组合,<br>视觉冲击强烈。</p>
    </section>

    <div class="bottom-band"></div>
  </main>
</body>
</html>
