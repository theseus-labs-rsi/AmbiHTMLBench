<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals &amp; Objectives</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      width: 1024px;
      height: 768px;
      overflow: hidden;
      background: #ffffff;
      color: #422322;
      flex: 0 0 auto;
    }

    .title {
      position: absolute;
      top: 17px;
      left: 475px;
      margin: 0;
      white-space: nowrap;
      font-size: 62px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -1.2px;
    }

    .date-line {
      position: absolute;
      top: 143px;
      left: 62px;
      margin: 0;
      white-space: nowrap;
      font-size: 39px;
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.4px;
    }

    .goal {
      position: absolute;
      left: 40px;
      margin: 0;
      color: #197d7e;
      white-space: nowrap;
      font-size: 44px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -1px;
    }

    .goal-1 { top: 257px; }
    .goal-2 { top: 335px; }
    .goal-3 { top: 414px; }
    .goal-4 { top: 542px; }
    .goal-5 {
      top: 620px;
      font-size: 42px;
      letter-spacing: -1.1px;
    }

    .braces {
      position: absolute;
      inset: 0;
      width: 1024px;
      height: 768px;
      pointer-events: none;
    }

    .arrow {
      position: absolute;
      width: 110px;
      height: 88px;
      background: #197d7e;
      clip-path: polygon(
        0 50%,
        43px 0,
        43px 25%,
        110px 25%,
        110px 75%,
        43px 75%,
        43px 100%
      );
    }

    .arrow-top {
      left: 665px;
      top: 313px;
    }

    .arrow-bottom {
      left: 665px;
      top: 552px;
    }

    .theory-label {
      position: absolute;
      top: 282px;
      left: 815px;
      width: 185px;
      margin: 0;
      color: #422322;
      text-align: center;
      font-size: 41px;
      line-height: 1.12;
      font-weight: 400;
      letter-spacing: -0.8px;
    }

    .organization-label {
      position: absolute;
      top: 544px;
      left: 784px;
      width: 218px;
      margin: 0;
      color: #422322;
      text-align: center;
      font-size: 40px;
      line-height: 1.13;
      font-weight: 400;
      letter-spacing: -1px;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <h1 class="title">Goals &amp; Objectives</h1>

    <p class="date-line">From January 1, 2016 – December 31, 2018, we will:</p>

    <p class="goal goal-1">Goal 1: XX</p>
    <p class="goal goal-2">Goal 2: XX</p>
    <p class="goal goal-3">Goal 3: XX</p>

    <p class="goal goal-4">Goal 4: Money</p>
    <p class="goal goal-5">Goal 5: People &amp; Infrastructure</p>

    <svg class="braces" viewBox="0 0 1024 768" aria-hidden="true">
      <path
        d="M558 253
           C589 253, 625 254, 642 257
           C648 258, 651 260, 651 264
           L651 496
           C651 501, 648 502, 642 503
           C622 507, 590 507, 558 507"
        fill="none"
        stroke="#4b2422"
        stroke-width="8"
        stroke-linecap="butt"
        stroke-linejoin="round"
      />
      <path
        d="M565 537
           C599 537, 632 538, 649 542
           C655 543, 658 546, 658 550
           L658 695
           C658 700, 654 701, 648 702
           C626 706, 596 707, 565 706"
        fill="none"
        stroke="#4b2422"
        stroke-width="8"
        stroke-linecap="butt"
        stroke-linejoin="round"
      />
    </svg>

    <div class="arrow arrow-top" aria-hidden="true"></div>
    <div class="arrow arrow-bottom" aria-hidden="true"></div>

    <p class="theory-label">Theory<br>of<br>Change<br>Goals</p>
    <p class="organization-label">Organization<br>Goals</p>
  </main>
</body>
</html>
