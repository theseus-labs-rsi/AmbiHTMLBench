<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回避行为</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #173db8;
    }

    .card {
      position: absolute;
      top: 11px;
      right: 15px;
      bottom: 15px;
      left: 17px;
      z-index: 1;
      overflow: hidden;
      border-radius: 20px;
      background: #ffffff;
    }

    .top-mask {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      width: 370px;
      height: 28px;
      background: #ffffff;
      clip-path: polygon(3% 0, 100% 0, 100% 100%, 0 100%);
    }

    .left-notch {
      position: absolute;
      top: 193px;
      left: 0;
      z-index: 3;
      width: 18px;
      height: 18px;
      background: #ffffff;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .right-upper-mask {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 3;
      width: 15px;
      height: 190px;
      background: #ffffff;
    }

    .right-notch-top {
      position: absolute;
      top: 190px;
      right: 0;
      z-index: 3;
      width: 15px;
      height: 10px;
      background: #ffffff;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .right-notch-bottom {
      position: absolute;
      top: 320px;
      right: 0;
      z-index: 3;
      width: 15px;
      height: 10px;
      background: #ffffff;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .right-lower-mask {
      position: absolute;
      top: 329px;
      right: 0;
      z-index: 3;
      width: 15px;
      height: 279px;
      background: #ffffff;
    }

    .left-lower-mask {
      position: absolute;
      top: 208px;
      left: 0;
      z-index: 3;
      width: 17px;
      height: 375px;
      background: #ffffff;
    }

    .left-bottom-notch {
      position: absolute;
      top: 583px;
      left: 0;
      z-index: 3;
      width: 18px;
      height: 22px;
      background: #ffffff;
      clip-path: polygon(0 0, 100% 100%, 100% 0);
    }

    .bottom-mask {
      position: absolute;
      right: 0;
      bottom: 0;
      z-index: 3;
      width: 126px;
      height: 15px;
      background: #ffffff;
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    }

    .content {
      position: relative;
      z-index: 4;
      height: 100%;
      padding: 49px 15px 36px 15px;
      color: #000000;
    }

    .number {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 67px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
    }

    h1 {
      margin: 15px 0 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-size: 60px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -4px;
    }

    .description {
      margin: 107px 0 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-size: 29px;
      font-weight: 800;
      line-height: 1.46;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .example {
      margin: 17px 0 0;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 27px;
      font-weight: 400;
      line-height: 1.67;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div class="card">
      <section class="content">
        <div class="number">03</div>
        <h1>回避行为</h1>

        <p class="description">
          自觉或不自觉地回避曾经的某些人、<br>
          事、物。
        </p>

        <p class="example">
          比如，学生时代受过伤，可能回避同<br>
          学聚会，不再听某些歌、看某些电影、<br>
          去某家餐厅……
        </p>
      </section>
    </div>

    <div class="top-mask"></div>
    <div class="left-notch"></div>
    <div class="right-upper-mask"></div>
    <div class="right-notch-top"></div>
    <div class="right-notch-bottom"></div>
    <div class="right-lower-mask"></div>
    <div class="left-lower-mask"></div>
    <div class="left-bottom-notch"></div>
    <div class="bottom-mask"></div>
  </main>
</body>
</html>
