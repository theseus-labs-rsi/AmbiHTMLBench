<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奔驰 大G</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #080808;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
    }

    .vehicle.placeholder {
      position: absolute;
      top: 8px;
      left: 104px;
      width: 296px;
      height: 181px;
      overflow: hidden;
      background: #fff;
    }

    .vehicle .car-body {
      position: absolute;
      left: 19px;
      top: 45px;
      width: 266px;
      height: 101px;
      border: 4px solid #242624;
      border-radius: 34px 18px 18px 16px;
      background: linear-gradient(165deg, #303330 0%, #111311 54%, #292b29 55%, #0d0f0d 100%);
      transform: skewX(-3deg);
      box-shadow: 0 12px 7px rgba(0, 0, 0, 0.18);
    }

    .vehicle .car-roof {
      position: absolute;
      left: 80px;
      top: 10px;
      width: 189px;
      height: 69px;
      border: 4px solid #242624;
      border-radius: 24px 18px 3px 3px;
      background: #171917;
      transform: skewX(5deg);
    }

    .vehicle .window {
      position: absolute;
      top: 25px;
      height: 45px;
      border: 3px solid #050605;
      background: linear-gradient(135deg, #dcebea, #8a9896 60%, #333837);
    }

    .vehicle .window.front {
      left: 83px;
      width: 78px;
      transform: skewX(-10deg);
    }

    .vehicle .window.middle {
      left: 166px;
      width: 51px;
    }

    .vehicle .window.rear {
      left: 222px;
      width: 41px;
    }

    .vehicle .grille {
      position: absolute;
      left: 20px;
      top: 99px;
      width: 72px;
      height: 34px;
      border: 3px solid #303330;
      background:
        repeating-linear-gradient(
          to bottom,
          #1b1d1b 0,
          #1b1d1b 4px,
          #9ca09c 5px,
          #9ca09c 7px
        );
    }

    .vehicle .badge {
      position: absolute;
      left: 49px;
      top: 106px;
      width: 19px;
      height: 19px;
      border: 2px solid #c9ccc9;
      border-radius: 50%;
    }

    .vehicle .headlight {
      position: absolute;
      top: 98px;
      width: 20px;
      height: 20px;
      border: 3px solid #303230;
      border-radius: 50%;
      background: #e7e9df;
    }

    .vehicle .headlight.left {
      left: 7px;
    }

    .vehicle .headlight.right {
      left: 109px;
    }

    .vehicle .wheel {
      position: absolute;
      top: 125px;
      width: 52px;
      height: 52px;
      border: 8px solid #1b1c1b;
      border-radius: 50%;
      background: repeating-conic-gradient(#d7dad6 0 9deg, #777c78 10deg 18deg);
      box-shadow: inset 0 0 0 4px #b9bdb9;
    }

    .vehicle .wheel.front {
      left: 43px;
    }

    .vehicle .wheel.rear {
      right: 18px;
    }

    .vehicle .bumper {
      position: absolute;
      left: 4px;
      top: 130px;
      width: 286px;
      height: 13px;
      border-radius: 2px;
      background: #161816;
    }

    .vehicle .caption {
      position: absolute;
      right: 5px;
      bottom: 2px;
      padding: 2px 5px;
      font-size: 7px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 0, 0.34);
    }

    h1 {
      position: absolute;
      top: 188px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 38px;
      line-height: 47px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      position: absolute;
      top: 237px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      white-space: nowrap;
      font-size: 29px;
      line-height: 38px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .watermark.placeholder {
      position: absolute;
      z-index: 0;
      right: -40px;
      top: 468px;
      width: 230px;
      height: 218px;
      border: 7px solid rgba(188, 197, 199, 0.25);
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .watermark.placeholder::before {
      content: "";
      position: absolute;
      left: 93px;
      top: 104px;
      width: 135px;
      height: 42px;
      border: 7px solid rgba(188, 197, 199, 0.25);
      border-left: 0;
      background: rgba(202, 210, 211, 0.16);
      transform: rotate(34deg);
      transform-origin: left center;
    }

    .watermark.placeholder::after {
      content: "";
      position: absolute;
      left: 100px;
      top: 31px;
      width: 7px;
      height: 157px;
      background: rgba(188, 197, 199, 0.17);
      transform: rotate(4deg);
    }

    .watermark .caption {
      opacity: 0;
      font-size: 1px;
    }

    .table-wrap {
      position: absolute;
      z-index: 2;
      top: 290px;
      left: 42px;
      width: 456px;
      height: 410px;
    }

    table {
      width: 100%;
      height: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.89);
      font-size: 17px;
      font-weight: 700;
    }

    col:nth-child(1) {
      width: 34.5%;
    }

    col:nth-child(2) {
      width: 38.5%;
    }

    col:nth-child(3) {
      width: 27%;
    }

    th,
    td {
      height: 41px;
      padding: 0 9px;
      text-align: left;
      vertical-align: middle;
      border: 1.4px solid #d3d3d3;
      white-space: nowrap;
    }

    thead th {
      height: 42px;
      background: #d1d1d1;
      border-color: #d1d1d1;
      font-size: 17px;
      font-weight: 800;
    }

    .footnote {
      position: absolute;
      right: 43px;
      bottom: 3px;
      margin: 0;
      color: #8b8b8b;
      font-size: 7px;
      line-height: 10px;
      white-space: nowrap;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <div class="vehicle placeholder" aria-label="Photo: black Mercedes-Benz G-Class, centered">
      <div class="car-roof"></div>
      <div class="car-body"></div>
      <div class="window front"></div>
      <div class="window middle"></div>
      <div class="window rear"></div>
      <div class="grille"></div>
      <div class="badge"></div>
      <div class="headlight left"></div>
      <div class="headlight right"></div>
      <div class="bumper"></div>
      <div class="wheel front"></div>
      <div class="wheel rear"></div>
      <span class="caption">[Photo: black Mercedes-Benz G-Class, centered]</span>
    </div>

    <h1>奔驰 大G</h1>
    <p class="subtitle">普通人 赚一辆豪车 需要多久？</p>

    <div class="watermark placeholder" aria-label="Decorative diagram: bottom-right">
      <span class="caption">[Diagram: bottom-right]</span>
    </div>

    <div class="table-wrap">
      <table>
        <colgroup>
          <col>
          <col>
          <col>
        </colgroup>
        <thead>
          <tr>
            <th>职业</th>
            <th>月薪</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>外卖员</td>
            <td>5000元/月</td>
            <td>大约45年</td>
          </tr>
          <tr>
            <td>建筑工人</td>
            <td>6000元/月</td>
            <td>大约38年</td>
          </tr>
          <tr>
            <td>出租车司机</td>
            <td>6500元/月</td>
            <td>大约35年</td>
          </tr>
          <tr>
            <td>教师</td>
            <td>8000元/月</td>
            <td>大约28年</td>
          </tr>
          <tr>
            <td>医生</td>
            <td>10000元/月</td>
            <td>大约23年</td>
          </tr>
          <tr>
            <td>互联网职工</td>
            <td>15000元/月</td>
            <td>大约15年</td>
          </tr>
          <tr>
            <td>银行职员</td>
            <td>20000元/月</td>
            <td>大约11年</td>
          </tr>
          <tr>
            <td>销售</td>
            <td>25000元/月</td>
            <td>大约9年</td>
          </tr>
          <tr>
            <td>私企老板</td>
            <td>50000元/月</td>
            <td>大约5年</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="footnote">*月薪资30%作为日常基本开销</p>
  </main>
</body>
</html>
