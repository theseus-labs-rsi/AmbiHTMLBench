<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>七8班期末质量分析会</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #e7e7e3;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #002f70;
    }

    .page {
      position: relative;
      width: 540px;
      height: 540px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, rgba(248, 246, 241, 0.96), rgba(248, 247, 243, 0.92)),
        repeating-linear-gradient(
          0deg,
          rgba(40, 90, 78, 0.025) 0,
          rgba(40, 90, 78, 0.025) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .wash {
      position: absolute;
      border-radius: 50%;
      background: rgba(86, 199, 167, 0.14);
      filter: blur(9px);
    }

    .wash-left {
      left: -42px;
      top: 64px;
      width: 230px;
      height: 231px;
    }

    .wash-center {
      left: 130px;
      top: 181px;
      width: 257px;
      height: 122px;
    }

    .wash-right {
      right: -44px;
      top: 190px;
      width: 215px;
      height: 102px;
    }

    .leaf-cluster {
      position: absolute;
      pointer-events: none;
    }

    .leaf-cluster.top {
      top: -20px;
      right: -8px;
      width: 172px;
      height: 120px;
      transform: rotate(-5deg);
    }

    .leaf-cluster.left {
      left: -26px;
      top: 222px;
      width: 191px;
      height: 103px;
      transform: rotate(-5deg);
    }

    .stem {
      position: absolute;
      height: 3px;
      border-radius: 50%;
      background: #277e59;
      transform-origin: left center;
    }

    .top .stem {
      top: 71px;
      left: 25px;
      width: 151px;
      transform: rotate(-30deg);
    }

    .left .stem {
      top: 64px;
      left: 35px;
      width: 137px;
      transform: rotate(-13deg);
    }

    .leaf {
      position: absolute;
      width: 17px;
      height: 45px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(145deg, #0c6e43 10%, #159764 55%, #64bd85);
      transform-origin: bottom center;
      opacity: 0.96;
    }

    .top .l1 { left: 25px; top: 7px; transform: rotate(52deg); }
    .top .l2 { left: 53px; top: 17px; transform: rotate(70deg); }
    .top .l3 { left: 79px; top: 30px; transform: rotate(82deg); }
    .top .l4 { left: 105px; top: 45px; transform: rotate(96deg); }
    .top .l5 { left: 132px; top: 60px; transform: rotate(111deg); }
    .top .l6 { left: 82px; top: 4px; transform: rotate(27deg); }
    .top .l7 { left: 121px; top: 18px; transform: rotate(31deg); }
    .top .l8 { left: 151px; top: 31px; transform: rotate(19deg); }

    .left .leaf {
      width: 13px;
      height: 34px;
    }

    .left .l1 { left: 51px; top: 35px; transform: rotate(51deg); }
    .left .l2 { left: 77px; top: 29px; transform: rotate(65deg); }
    .left .l3 { left: 101px; top: 21px; transform: rotate(73deg); }
    .left .l4 { left: 125px; top: 15px; transform: rotate(84deg); }
    .left .l5 { left: 145px; top: 7px; transform: rotate(94deg); }
    .left .l6 { left: 75px; top: 53px; transform: rotate(127deg); }
    .left .l7 { left: 111px; top: 45px; transform: rotate(138deg); }
    .left .l8 { left: 143px; top: 37px; transform: rotate(147deg); }

    .artichoke {
      position: absolute;
      left: -15px;
      top: 237px;
      width: 89px;
      height: 72px;
      border-radius: 48% 48% 38% 38%;
      background:
        radial-gradient(ellipse at 50% 15%, #a5c97d 0 16%, transparent 17%),
        radial-gradient(ellipse at 31% 30%, #82b76f 0 18%, transparent 19%),
        radial-gradient(ellipse at 69% 30%, #78a965 0 18%, transparent 19%),
        radial-gradient(ellipse at 18% 52%, #b0cb80 0 20%, transparent 21%),
        radial-gradient(ellipse at 50% 53%, #93b969 0 26%, transparent 27%),
        radial-gradient(ellipse at 82% 52%, #709957 0 20%, transparent 21%),
        #d1d59a;
      opacity: 0.9;
    }

    .bird {
      position: absolute;
      left: 147px;
      top: 249px;
      width: 31px;
      height: 44px;
      transform: rotate(21deg);
    }

    .bird-body {
      position: absolute;
      left: 5px;
      top: 15px;
      width: 20px;
      height: 27px;
      border-radius: 55% 55% 65% 35%;
      background: linear-gradient(145deg, #3566a0, #59a99a 62%, #d5b667);
    }

    .bird-head {
      position: absolute;
      left: 12px;
      top: 4px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #496ca6;
    }

    .bird-beak {
      position: absolute;
      top: 8px;
      left: 26px;
      width: 0;
      height: 0;
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 8px solid #ca9f48;
    }

    .semester {
      position: absolute;
      top: 55px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: SimSun, "Songti SC", serif;
      font-size: 20px;
      line-height: 1;
      color: #073b7e;
    }

    h1 {
      position: absolute;
      top: 95px;
      left: 25px;
      width: 490px;
      margin: 0;
      text-align: center;
      white-space: nowrap;
      font-family: SimHei, "Microsoft YaHei", sans-serif;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0;
      color: #003a80;
    }

    .meeting {
      position: absolute;
      top: 145px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.2;
      color: #e21b20;
    }

    .school,
    .author {
      position: absolute;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-family: SimSun, "Songti SC", serif;
      color: #123b78;
    }

    .school {
      top: 191px;
      font-size: 15px;
    }

    .author {
      top: 225px;
      font-size: 16px;
    }

    .watermark {
      position: absolute;
      z-index: 5;
      color: #111;
      font-family: SimSun, "Songti SC", serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow:
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        1px 1px 0 #fff;
    }

    .watermark.top-mark {
      top: 50px;
      left: 304px;
      transform: rotate(34deg);
    }

    .watermark.center-mark {
      top: 150px;
      left: 127px;
      transform: rotate(-4deg);
    }

    .watermark.lower-mark {
      top: 292px;
      left: 57px;
      font-size: 16px;
      transform: rotate(-2deg);
    }

    .lower-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: 347px;
      height: 193px;
      padding: 15px 35px 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(22, 80, 70, 0.025) 0,
          rgba(22, 80, 70, 0.025) 1px,
          transparent 1px,
          transparent 4px
        ),
        rgba(251, 249, 246, 0.96);
    }

    .process {
      position: relative;
      display: grid;
      grid-template-columns: 112px 112px 112px 104px;
      gap: 6px;
      height: 32px;
    }

    .step {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 31px;
      padding: 0 5px;
      background: #088f88;
      color: #fff;
      font-family: SimSun, "Songti SC", serif;
      font-size: 14px;
      white-space: nowrap;
    }

    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      right: -11px;
      width: 0;
      height: 0;
      border-top: 15.5px solid transparent;
      border-bottom: 15.5px solid transparent;
      border-left: 11px solid #088f88;
    }

    .step:not(:first-child)::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      width: 7px;
      height: 31px;
      background: #fbf9f6;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 45% 50%, 100% 65%, 100% 100%, 0 100%);
    }

    .notes {
      display: grid;
      grid-template-columns: 110px 110px 110px 110px;
      gap: 9px;
      margin-top: 16px;
    }

    .note {
      position: relative;
      height: 114px;
      padding: 10px 7px 5px;
      border: 2px solid #05998d;
      border-radius: 13px;
      background: rgba(252, 250, 247, 0.9);
      color: #222;
      font-family: SimSun, "Songti SC", serif;
      font-size: 14px;
      line-height: 1.12;
    }

    .note::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 16px;
      width: 34px;
      height: 24px;
      background: #05998d;
      clip-path: polygon(0 100%, 48% 0, 100% 100%, 92% 100%, 48% 18%, 8% 100%);
    }

    .note::after {
      content: "";
      position: absolute;
      top: -16px;
      left: 20px;
      width: 27px;
      height: 20px;
      background: #fbf9f6;
      clip-path: polygon(0 100%, 48% 0, 100% 100%, 90% 100%, 48% 22%, 10% 100%);
    }

    .note p {
      position: relative;
      z-index: 2;
      margin: 0;
    }

    @media (max-width: 540px) {
      .page {
        width: 100vw;
        height: 100vw;
        min-height: 540px;
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="2022--2023学年第一学期七8班期末质量分析会">
    <div class="wash wash-left"></div>
    <div class="wash wash-center"></div>
    <div class="wash wash-right"></div>

    <div class="leaf-cluster top" aria-hidden="true">
      <span class="stem"></span>
      <span class="leaf l1"></span>
      <span class="leaf l2"></span>
      <span class="leaf l3"></span>
      <span class="leaf l4"></span>
      <span class="leaf l5"></span>
      <span class="leaf l6"></span>
      <span class="leaf l7"></span>
      <span class="leaf l8"></span>
    </div>

    <div class="artichoke" aria-label="[Illustration: bottom-left plant]"></div>
    <div class="leaf-cluster left" aria-hidden="true">
      <span class="stem"></span>
      <span class="leaf l1"></span>
      <span class="leaf l2"></span>
      <span class="leaf l3"></span>
      <span class="leaf l4"></span>
      <span class="leaf l5"></span>
      <span class="leaf l6"></span>
      <span class="leaf l7"></span>
      <span class="leaf l8"></span>
    </div>
    <div class="bird" aria-label="[Illustration: bird]">
      <span class="bird-body"></span>
      <span class="bird-head"></span>
      <span class="bird-beak"></span>
    </div>

    <div class="semester">2022--2023学年第一学期</div>
    <h1>追光而遇有思&nbsp;&nbsp;&nbsp;沐光而行致远</h1>
    <p class="meeting">七8班期末质量分析会</p>
    <p class="school">红薯街道实验XXXX</p>
    <p class="author">海淀小萌</p>

    <span class="watermark top-mark">©薛淑小萌</span>
    <span class="watermark center-mark">©薛淑小萌</span>
    <span class="watermark lower-mark">期末考试成绩©薛淑小萌</span>

    <section class="lower-panel">
      <div class="process">
        <div class="step">注重基础和积累</div>
        <div class="step">重视运用</div>
        <div class="step">联系生活原则</div>
        <div class="step">难易程度适中</div>
      </div>

      <div class="notes">
        <div class="note">
          <p>尤其是古诗文和<br>名言警句积累占<br>的比例很大，反<br>映了对传统文化<br>的重视。</p>
        </div>
        <div class="note">
          <p>突出能力，重视<br>运用。阅读题体<br>现了核心素养中<br>重视思维发展与<br>提升的要求。</p>
        </div>
        <div class="note">
          <p>写作的安排正是<br>学生生活中外出<br>的经历，易于选<br>材，适合个性发<br>展。</p>
        </div>
        <div class="note">
          <p>只要认真积累和<br>复习的孩子基本<br>上可以取得不错<br>的成绩。</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
