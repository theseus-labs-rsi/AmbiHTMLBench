<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销——第③步：调整所得税</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #f2eee3;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 730px;
    overflow: hidden;
    color: #111;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(177, 150, 98, 0.16) 0,
        rgba(177, 150, 98, 0.16) 1px,
        transparent 1px,
        transparent 4px
      ),
      #f8f4e8;
  }

  .sheet {
    position: absolute;
    left: 21px;
    top: 28px;
    width: 498px;
    height: 704px;
    overflow: hidden;
    background: #fff;
    border: 1.5px solid #77542e;
    border-radius: 11px 11px 0 0;
  }

  .title {
    position: absolute;
    top: 28px;
    left: 62px;
    width: 374px;
    color: #76501e;
    text-align: center;
    font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
    font-weight: 800;
    line-height: 1.22;
  }

  .title .line-one {
    font-size: 37px;
    white-space: nowrap;
  }

  .title .line-two {
    margin-top: 1px;
    font-size: 37px;
    white-space: nowrap;
  }

  .paw {
    position: absolute;
    width: 31px;
    height: 28px;
  }

  .paw-left {
    left: 122px;
    top: 14px;
    transform: rotate(-20deg);
  }

  .paw-right {
    right: 86px;
    top: 10px;
    transform: rotate(24deg);
  }

  .paw .pad,
  .paw .toe {
    position: absolute;
    display: block;
    background: #9a7034;
    border-radius: 50%;
  }

  .paw-right .pad,
  .paw-right .toe {
    background: #e6b467;
  }

  .paw .pad {
    left: 10px;
    top: 13px;
    width: 13px;
    height: 12px;
    transform: rotate(-8deg);
  }

  .paw .toe:nth-child(2) {
    left: 2px;
    top: 8px;
    width: 7px;
    height: 8px;
  }

  .paw .toe:nth-child(3) {
    left: 10px;
    top: 1px;
    width: 7px;
    height: 9px;
  }

  .paw .toe:nth-child(4) {
    left: 20px;
    top: 3px;
    width: 7px;
    height: 9px;
  }

  .paw .toe:nth-child(5) {
    left: 24px;
    top: 12px;
    width: 6px;
    height: 8px;
  }

  .highlight {
    position: absolute;
    left: 48px;
    top: 169px;
    width: 225px;
    height: 27px;
    color: #79521e;
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    line-height: 26px;
    text-align: center;
    white-space: nowrap;
    background:
      linear-gradient(
        176deg,
        transparent 6%,
        rgba(238, 190, 94, 0.38) 14%,
        rgba(238, 190, 94, 0.62) 48%,
        rgba(238, 190, 94, 0.38) 86%,
        transparent 94%
      );
  }

  .content {
    position: absolute;
    left: 46px;
    top: 228px;
    width: 421px;
    font-family: "SimSun", "Songti SC", serif;
  }

  .section {
    position: relative;
    width: 100%;
  }

  .section-two {
    margin-top: 35px;
  }

  .heading {
    height: 27px;
    font-size: 17px;
    line-height: 27px;
    white-space: nowrap;
  }

  .heading strong {
    font-weight: 800;
  }

  .calculation {
    position: relative;
    height: 68px;
  }

  .values {
    position: absolute;
    left: 39px;
    top: 2px;
    width: 91px;
    font-size: 16px;
    line-height: 31px;
    text-align: right;
    white-space: nowrap;
  }

  .brace {
    position: absolute;
    left: 128px;
    top: -2px;
    color: #58a5d7;
    font-family: "Times New Roman", serif;
    font-size: 61px;
    font-weight: 300;
    line-height: 62px;
    transform: scaleX(0.48);
    transform-origin: left center;
  }

  .formula {
    position: absolute;
    left: 143px;
    top: 20px;
    font-size: 15px;
    white-space: nowrap;
  }

  .group-note {
    position: absolute;
    left: 350px;
    top: 62px;
    width: 78px;
    text-align: center;
    font-family: "SimSun", "Songti SC", serif;
    font-size: 16px;
    line-height: 31px;
    white-space: nowrap;
  }

  .group-note .angle {
    font-weight: 700;
  }

  .arrow {
    position: absolute;
    left: 337px;
    top: 58px;
    width: 9px;
    height: 99px;
    background: #58a5d7;
  }

  .arrow::after {
    content: "";
    position: absolute;
    left: -6px;
    bottom: -8px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 13px solid #58a5d7;
  }

  .accounting {
    position: absolute;
    left: 60px;
    top: 474px;
    width: 350px;
    color: #806d48;
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 16px;
    line-height: 33px;
  }

  .accounting .credit {
    padding-left: 95px;
  }

  .placeholder {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgba(74, 54, 39, 0.72);
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 9px;
    line-height: 1.15;
  }

  .sleeping-cat {
    left: 12px;
    bottom: 7px;
    width: 132px;
    height: 87px;
    border-radius: 52% 48% 42% 45%;
    background:
      radial-gradient(ellipse at 52% 78%, #e9c779 0 47%, transparent 49%),
      radial-gradient(ellipse at 49% 51%, #eee 0 43%, #655044 45% 47%, transparent 49%);
  }

  .standing-cat {
    right: 0;
    bottom: -5px;
    width: 116px;
    height: 142px;
    border-radius: 50% 45% 28% 31%;
    background:
      radial-gradient(ellipse at 48% 55%, #f7f5ef 0 44%, #604d40 45% 46%, transparent 48%);
  }

  .sleeping-cat span,
  .standing-cat span {
    padding: 2px 4px;
    background: rgba(255, 255, 255, 0.72);
  }

  .cat-hat {
    position: absolute;
    right: 18px;
    bottom: 113px;
    width: 78px;
    height: 24px;
    border: 1.5px solid #5d4837;
    border-radius: 50%;
    background: #dfad62;
    transform: rotate(5deg);
  }

  .cat-hat::before {
    content: "";
    position: absolute;
    left: 17px;
    top: -13px;
    width: 42px;
    height: 22px;
    border: 1.5px solid #5d4837;
    border-radius: 50% 50% 30% 30%;
    background: #e7ba75;
  }
</style>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']]
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="page">
    <section class="sheet">
      <div class="paw paw-left" aria-label="爪印装饰">
        <span class="pad"></span>
        <span class="toe"></span>
        <span class="toe"></span>
        <span class="toe"></span>
        <span class="toe"></span>
      </div>

      <div class="paw paw-right" aria-label="爪印装饰">
        <span class="pad"></span>
        <span class="toe"></span>
        <span class="toe"></span>
        <span class="toe"></span>
        <span class="toe"></span>
      </div>

      <header class="title">
        <div class="line-one">内部交易抵销</div>
        <div class="line-two">第③步：调整所得税</div>
      </header>

      <div class="highlight">若实现60%对外销售</div>

      <div class="content">
        <section class="section section-one">
          <div class="heading"><strong>个别报表层面</strong>因为存货跌价准备:</div>
          <div class="calculation">
            <div class="values">
              账面价值900<br>
              计税基础1200
            </div>
            <div class="brace">}</div>
            <div class="formula">递延所得税资产300*25%=75</div>
          </div>
        </section>

        <section class="section section-two">
          <div class="heading"><strong>合并报表层面</strong>因为存货跌价准备:</div>
          <div class="calculation">
            <div class="values">
              账面价值800<br>
              计税基础1200
            </div>
            <div class="brace">}</div>
            <div class="formula">递延所得税资产400*25%=100</div>
          </div>
        </section>

        <div class="arrow"></div>
        <div class="group-note">
          <div class="angle">【集团角度】</div>
          <div>调增25</div>
        </div>
      </div>

      <div class="accounting">
        <div>会计处理：借：递延所得税资产25</div>
        <div class="credit">贷：所得税费用25</div>
      </div>

      <div class="placeholder sleeping-cat">
        <span>[Illustration: sleeping cat]</span>
      </div>

      <div class="placeholder standing-cat">
        <span>[Illustration: standing cat]</span>
      </div>
      <div class="cat-hat" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
