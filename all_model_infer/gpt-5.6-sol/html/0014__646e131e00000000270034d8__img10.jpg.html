<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老吴の创业随笔</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
html, body {
  margin: 0;
  min-height: 100%;
}
body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: #d5b487;
}
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #111;
  background:
    radial-gradient(ellipse at 9% 4%, rgba(104, 51, 20, .22) 0, rgba(104, 51, 20, .06) 11%, transparent 25%),
    radial-gradient(ellipse at 92% 8%, rgba(116, 59, 26, .18) 0, rgba(116, 59, 26, .04) 14%, transparent 29%),
    radial-gradient(ellipse at 2% 54%, rgba(105, 55, 23, .17) 0, transparent 24%),
    radial-gradient(ellipse at 96% 63%, rgba(107, 57, 25, .16) 0, transparent 25%),
    radial-gradient(ellipse at 52% 101%, rgba(99, 48, 19, .24) 0, transparent 29%),
    linear-gradient(90deg, rgba(101, 49, 18, .12), transparent 7%, transparent 93%, rgba(101, 49, 18, .13)),
    linear-gradient(180deg, rgba(105, 52, 20, .16), transparent 9%, transparent 91%, rgba(96, 46, 17, .20)),
    #e7c99d;
  box-shadow: inset 0 0 22px rgba(92, 44, 16, .22);
}
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .55;
  background:
    repeating-radial-gradient(circle at 17% 23%, rgba(84, 43, 18, .16) 0 0.7px, transparent 0.9px 5px),
    repeating-radial-gradient(circle at 71% 66%, rgba(255,255,255,.14) 0 0.6px, transparent 0.8px 6px);
  mix-blend-mode: multiply;
}
.page::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow:
    inset 0 0 7px rgba(67, 31, 11, .28),
    inset 0 0 40px rgba(119, 67, 29, .10);
}
.header,
.main-text,
.footer {
  position: absolute;
  z-index: 1;
}
.header {
  top: 34px;
  left: 0;
  width: 100%;
  text-align: center;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
  font-size: 28px;
  line-height: 36px;
  letter-spacing: 2px;
  white-space: nowrap;
}
.main-text {
  top: 105px;
  left: 25px;
  width: 490px;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
  font-size: 40px;
  line-height: 74px;
  font-weight: 400;
  white-space: nowrap;
}
.line {
  height: 74px;
}
.line.first {
  margin-left: 83px;
  letter-spacing: 0;
}
.line.full {
  width: 478px;
  letter-spacing: 3px;
}
.line.last {
  letter-spacing: 5px;
}
.footer {
  left: 55px;
  bottom: 25px;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
  font-size: 22px;
  line-height: 28px;
  letter-spacing: 1px;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="page">
  <header class="header">老吴の创业随笔</header>

  <section class="main-text">
    <div class="line first">《易经》中说：“小财</div>
    <div class="line full">靠勤，大财靠德，德不厚</div>
    <div class="line full">，无以载物。”靠出卖时</div>
    <div class="line full">间和劳动力 赚钱的人，</div>
    <div class="line full">只能发点小财。一个人每</div>
    <div class="line full">天，时间有限，精力有限</div>
    <div class="line last">，分身乏术。</div>
  </section>

  <footer class="footer">商业思维|个人提升|创业心得|认知觉醒</footer>
</main>
</body>
</html>
