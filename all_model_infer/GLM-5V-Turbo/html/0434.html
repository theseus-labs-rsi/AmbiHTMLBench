<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写作对比图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
        }
        
        /* 上半部分 - 米色背景 */
        .top-section {
            background-color: #E6D9BD;
            padding: 40px 30px 30px 30px;
            position: relative;
            min-height: 280px;
        }
        
        .top-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }
        
        .top-left {
            flex: 1;
            padding-right: 20px;
        }
        
        .label {
            font-size: 36px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .red-circle {
            width: 50px;
            height: 50px;
            border: 12px solid #CC0000;
            border-radius: 50%;
            display: inline-block;
        }
        
        .content-text {
            font-size: 22px;
            line-height: 1.6;
            color: #1a1a1a;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        
        .image-container {
            position: relative;
            width: 200px;
            height: 220px;
            flex-shrink: 0;
        }
        
        .placeholder-image {
            width: 100%;
            height: 100%;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .placeholder-image::after {
            content: "[Image: Crying Child Meme]";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
            text-align: center;
            width: 80%;
        }
        
        .overlay-text {
            position: absolute;
            bottom: 20px;
            right: 0;
            background-color: rgba(255,255,255,0.9);
            padding: 5px 10px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            white-space: nowrap;
            z-index: 3;
        }
        
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 48px;
            color: rgba(255,255,255,0.25);
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 5px;
        }
        
        /* 下半部分 - 深蓝色背景 */
        .bottom-section {
            background-color: #3D4260;
            padding: 40px 30px 30px 30px;
            color: #F5DEB3;
        }
        
        .bottom-label {
            font-size: 36px;
            font-weight: bold;
            color: #F5DEB3;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .green-check {
            width: 60px;
            height: 45px;
            position: relative;
            display: inline-block;
        }
        
        .green-check::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 8px;
            background-color: #7CB342;
            transform: rotate(45deg);
            top: 22px;
            left: 5px;
            border-radius: 4px;
        }
        
        .green-check::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 8px;
            background-color: #7CB342;
            transform: rotate(-45deg);
            top: 14px;
            left: 18px;
            border-radius: 4px;
        }
        
        .article-text {
            font-size: 21px;
            line-height: 1.7;
            color: #F5DEB3;
            text-align: justify;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        
        .source {
            font-size: 16px;
            color: #D4C5A9;
            text-align: right;
            margin-top: 15px;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上半部分 -->
        <div class="top-section">
            <div class="watermark">省高考作文纸</div>
            
            <div class="top-content">
                <div class="top-left">
                    <div class="label">
                        我写的:<span class="red-circle"></span>
                    </div>
                    <div class="content-text">
                        我们民族的追梦史充满<br>艰辛。
                    </div>
                </div>
                
                <div class="image-container">
                    <div class="placeholder-image"></div>
                    <div class="overlay-text">学习使我快乐</div>
                </div>
            </div>
        </div>
        
        <!-- 下半部分 -->
        <div class="bottom-section">
            <div class="bottom-label">
                人民日报写的:<span class="green-check"></span>
            </div>
            
            <div class="article-text">
                我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来 的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
            </div>
            
            <div class="source">
                ——2013.4.1《筑就民族复兴的“中国梦”》
            </div>
        </div>
    </div>
    
    <!-- MathJax Script -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
