<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长需要关注什么</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #e6dccb;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        .container {
            width: 600px;
            background-color: #e6dccb;
            position: relative;
        }
        
        /* Header Section */
        .header {
            background-color: #5a8f8f;
            height: 180px;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 2px;
        }
        
        .deer-placeholder {
            position: absolute;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 140px;
            opacity: 0.9;
        }
        
        .header-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            margin-left: 60px;
        }
        
        .main-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        
        .sub-title {
            font-size: 14px;
            letter-spacing: 8px;
            opacity: 0.9;
        }
        
        .seal {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 24px;
            height: 30px;
            background-color: #c45c5c;
            border: 1px solid #a04040;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            writing-mode: vertical-rl;
            border-radius: 2px;
        }
        
        /* Content Sections */
        .section {
            background-color: #fdfbf7;
            margin-bottom: 20px;
            padding: 30px;
            position: relative;
            border: 1px solid #d4c4b0;
            min-height: 280px;
        }
        
        .center-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 3px solid #8b7355;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fdfbf7;
            z-index: 10;
            box-shadow: 0 0 0 4px #fdfbf7, 0 0 0 7px #8b7355;
        }
        
        .center-circle::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border: 2px solid #d4c4b0;
            border-radius: 50%;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                #d4c4b0 8px,
                #d4c4b0 10px
            ),
            repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                #d4c4b0 8px,
                #d4c4b0 10px
            );
            opacity: 0.3;
        }
        
        .center-text {
            font-size: 18px;
            font-weight: bold;
            color: #5a4a3a;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            position: relative;
            z-index: 2;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 40px;
            position: relative;
            z-index: 5;
        }
        
        .item {
            position: relative;
            padding-left: 35px;
            line-height: 1.6;
        }
        
        .label {
            position: absolute;
            left: 0;
            top: 0;
            width: 26px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            border-radius: 2px;
            font-weight: bold;
        }
        
        .label.green { background-color: #6ba36b; }
        .label.teal { background-color: #5a9e9e; }
        .label.olive { background-color: #8faa5a; }
        
        .item-title {
            font-weight: bold;
            font-size: 15px;
            color: #333;
            margin-bottom: 4px;
        }
        
        .item-content {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
        }
        
        .strategy {
            color: #c45c5c;
            font-weight: bold;
        }
        
        .left-col {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-top: 10px;
        }
        
        .seal-small {
            position: absolute;
            left: 10px;
            bottom: 10px;
            width: 20px;
            height: 26px;
            background-color: #c45c5c;
            border: 1px solid #a04040;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            writing-mode: vertical-rl;
            border-radius: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="deer-placeholder">
                <svg viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="100" cy="110" rx="70" ry="15" fill="#4a8e8e" opacity="0.3"/>
                    <path d="M70 90 Q65 70 75 55 Q85 40 95 45 L105 45 Q115 40 125 55 Q135 70 130 90 L125 95 L115 85 L105 95 L95 85 L85 95 Z" fill="#f5f0e6"/>
                    <circle cx="88" cy="58" r="3" fill="#333"/>
                    <circle cx="112" cy="58" r="3" fill="#333"/>
                    <path d="M85 50 Q95 42 105 50" stroke="#8b7355" stroke-width="1.5" fill="none"/>
                    <path d="M78 48 L72 35 M82 45 L78 30 M118 45 L122 30 M122 48 L128 35" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>
                    <ellipse cx="100" cy="62" rx="8" ry="5" fill="#f0e6d6"/>
                    <path d="M92 68 Q100 74 108 68" stroke="#c4a882" stroke-width="1" fill="none"/>
                    <text x="98" y="75" font-size="16" fill="#d4a574" font-family="serif">♡</text>
                </svg>
            </div>
            <div class="header-content">
                <div class="main-title">家长需要关注什么</div>
                <div class="sub-title">春·节·睦</div>
            </div>
            <div class="seal">印</div>
        </div>

        <!-- Middle Section: How to View Grades -->
        <div class="section">
            <div class="center-circle">
                <div class="center-text">成绩怎么看</div>
            </div>
            
            <div class="content-grid">
                <div class="left-col">
                    <div class="item">
                        <div class="label green">壹</div>
                        <div class="item-title">看单科成绩</div>
                        <div class="item-content">分析优势与劣势科目</div>
                    </div>
                    
                    <div class="item">
                        <div class="label teal">贰</div>
                        <div class="item-title">看进步</div>
                        <div class="item-content">横向整体水平<br>纵向看进退情况</div>
                    </div>
                    
                    <div class="item">
                        <div class="label green">叁</div>
                        <div class="item-title">分析错题</div>
                    </div>
                </div>
                
                <div class="right-col">
                    <div class="item">
                        <div class="label teal">肆</div>
                        <div class="item-title">分析错题：</div>
                        <div class="item-content">
                            是遗憾丢分？是模糊丢分？<br>
                            是不会做丢分？<br>
                            <span class="strategy">策略</span>：消除遗憾、纠正模<br>糊、力争突破
                        </div>
                    </div>
                    
                    <div class="item">
                        <div class="label olive">伍</div>
                        <div class="item-title">分析考试技巧</div>
                        <div class="item-content">
                            策略是否得当？<br>
                            是否按标准答题？<br>
                            是否摆正心态？
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="seal-small">印</div>
        </div>

        <!-- Bottom Section: Five Don'ts -->
        <div class="section">
            <div class="center-circle">
                <div class="center-text">家长五不要</div>
            </div>
            
            <div class="content-grid">
                <div class="left-col">
                    <div class="item">
                        <div class="label green">壹</div>
                        <div class="item-title">不要过度焦虑</div>
                    </div>
                    
                    <div class="item">
                        <div class="label teal">贰</div>
                        <div class="item-title">不要过度关注孩子</div>
                    </div>
                    
                    <div class="item">
                        <div class="label green">叁</div>
                        <div class="item-title">不要给孩子过高的期望</div>
                    </div>
                </div>
                
                <div class="right-col">
                    <div class="item">
                        <div class="label teal">肆</div>
                        <div class="item-title">不要过度唠叨</div>
                    </div>
                    
                    <div class="item">
                        <div class="label olive">伍</div>
                        <div class="item-title">不要盲目攀比和迷信</div>
                    </div>
                </div>
            </div>
            
            <div class="seal-small">印</div>
        </div>
    </div>
</body>
</html>
