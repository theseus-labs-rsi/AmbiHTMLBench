<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur The King - Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .poster-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2/3;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 50%, #8fbc3f 100%);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.3) 0%, 
                rgba(0,0,0,0.1) 30%, 
                rgba(0,0,0,0.4) 70%,
                rgba(0,0,0,0.6) 100%
            );
            z-index: 2;
        }

        /* Top Actor Name */
        .actor-name {
            position: absolute;
            top: 8%;
            left: 5%;
            right: 5%;
            text-align: center;
            color: #ffffff;
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Left Tagline */
        .tagline {
            position: absolute;
            top: 38%;
            left: 6%;
            max-width: 45%;
            color: #ffffff;
            font-size: clamp(11px, 2vw, 14px);
            font-weight: 600;
            letter-spacing: 0.05em;
            line-height: 1.4;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .tagline div {
            margin-bottom: 2px;
        }

        /* Main Title */
        .title-container {
            position: absolute;
            top: 42%;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
            padding: 0 5%;
        }

        .title-line {
            color: #FFD700;
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 0.9;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 20px rgba(255,215,0,0.3);
        }

        .title-arthur {
            font-size: clamp(48px, 12vw, 90px);
            margin-bottom: 5px;
        }

        .title-the {
            font-size: clamp(40px, 10vw, 75px);
            margin-bottom: 5px;
            margin-left: 5%;
        }

        .title-king {
            font-size: clamp(44px, 11vw, 82px);
            margin-left: 3%;
        }

        /* Bottom Right Info */
        .bottom-info {
            position: absolute;
            bottom: 8%;
            right: 6%;
            text-align: right;
            color: #ffffff;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .true-story {
            font-size: clamp(13px, 2.5vw, 18px);
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.3;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .coming-soon {
            font-size: clamp(11px, 2vw, 15px);
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* PG-13 Rating Box */
        .rating-box {
            position: absolute;
            bottom: 4%;
            left: 5%;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 4px 8px;
            z-index: 10;
            display: inline-block;
        }

        .rating-text {
            color: #ffffff;
            font-size: clamp(9px, 1.5vw, 11px);
            font-weight: 700;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

        .rating-subtext {
            color: #ffffff;
            font-size: clamp(6px, 1vw, 8px);
            opacity: 0.6;
            margin-top: 1px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- Placeholder for the actual movie poster image -->
        <div class="placeholder-bg"></div>
        
        <!-- Actor Name -->
        <div class="actor-name">MARK WAHLBERG</div>

        <!-- Tagline -->
        <div class="tagline">
            <div>AN UNEXPECTED ENCOUNTER</div>
            <div>AN UNLIKELY BOND</div>
            <div>AN UNFORGETTABLE ADVENTURE</div>
        </div>

        <!-- Main Title -->
        <div class="title-container">
            <div class="title-line title-arthur">ARTHUR</div>
            <div class="title-line title-the">THE</div>
            <div class="title-line title-king">KING</div>
        </div>

        <!-- Bottom Right Information -->
        <div class="bottom-info">
            <div class="true-story">BASED ON THE<br>INCREDIBLE TRUE STORY</div>
            <div class="coming-soon">COMING SOON</div>
        </div>

        <!-- MPAA Rating -->
        <div class="rating-box">
            <div class="rating-text">PG-13</div>
            <div class="rating-subtext">PARENTS STRONGLY CAUTIONED</div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
