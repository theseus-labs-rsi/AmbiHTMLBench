<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生智慧</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .point {
            margin-bottom: 35px;
            font-size: 22px;
            line-height: 1.7;
            color: #000000;
        }
        
        .point:last-of-type {
            margin-bottom: 50px;
        }
        
        .highlight {
            color: #5aab9d;
        }
        
        .footer {
            text-align: center;
            color: #5aab9d;
            font-size: 18px;
            letter-spacing: 2px;
            padding-top: 20px;
            border-top: 1px solid transparent;
        }
        
        .number {
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="point">
            <span class="number">1、</span><span class="highlight">你开始炫耀自己，往往都是灾难的开始。</span>就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
        </div>
        
        <div class="point">
            <span class="number">2、</span><span class="highlight">一个冷知识：屏蔽力是一个人最顶级的能力，</span>任何消耗你的人和事，多看一眼都是你的不对。
        </div>
        
        <div class="point">
            <span class="number">3、</span>大学时辅导员说了一句受益一生的话：<span class="highlight">“你不用变得很外向，内向挺好的，</span>但需要你发言的时候，一定要勇敢。”正所谓：君子可内敛不可懦弱，面不公可起而论之。
        </div>
        
        <div class="footer">
            商业思维 | 底层逻辑 | 个人提升
        </div>
    </div>
</body>
</html>
