<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals & Objectives</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #ffffff;
            color: #333;
        }
        
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #3E2723;
            font-size: 52px;
            margin-bottom: 25px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        
        .subtitle {
            text-align: center;
            color: #3E2723;
            font-size: 30px;
            margin-bottom: 60px;
            font-weight: normal;
        }
        
        .main-content {
            display: flex;
            position: relative;
            padding-left: 20px;
        }
        
        .goals-list {
            flex: 0 0 420px;
            padding-right: 20px;
        }
        
        .goal {
            color: #00897B;
            font-size: 34px;
            margin-bottom: 18px;
            line-height: 1.3;
            font-weight: normal;
        }
        
        .spacer {
            height: 35px;
        }
        
        .diagram-area {
            flex: 1;
            position: relative;
            min-height: 400px;
        }
        
        .group-container {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
        }
        
        .theory-group {
            top: 0;
            height: 190px;
        }
        
        .org-group {
            top: 225px;
            height: 130px;
        }
        
        .bracket {
            width: 55px;
            height: 100%;
            border-top: 4px solid #3E2723;
            border-bottom: 4px solid #3E2723;
            border-right: 4px solid #3E2723;
            border-radius: 0 15px 15px 0;
            box-sizing: border-box;
        }
        
        .annotation {
            display: flex;
            align-items: center;
            margin-left: 25px;
        }
        
        .left-arrow {
            width: 65px;
            height: 38px;
            background-color: #00897B;
            clip-path: polygon(100% 15%, 100% 85%, 75% 85%, 75% 100%, 0% 50%, 75% 0%, 75% 15%);
            flex-shrink: 0;
        }
        
        .label-text {
            color: #3E2723;
            font-size: 32px;
            line-height: 1.25;
            margin-left: 18px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Goals & Objectives</h1>
        <div class="subtitle">From January 1, 2016 – December 31, 2018, we will:</div>
        
        <div class="main-content">
            <div class="goals-list">
                <div class="goal">Goal 1: XX</div>
                <div class="goal">Goal 2: XX</div>
                <div class="goal">Goal 3: XX</div>
                
                <div class="spacer"></div>
                
                <div class="goal">Goal 4: Money</div>
                <div class="goal">Goal 5: People & Infrastructure</div>
            </div>
            
            <div class="diagram-area">
                <div class="group-container theory-group">
                    <div class="bracket"></div>
                    <div class="annotation">
                        <div class="left-arrow"></div>
                        <div class="label-text">
                            Theory<br>
                            of<br>
                            Change<br>
                            Goals
                        </div>
                    </div>
                </div>
                
                <div class="group-container org-group">
                    <div class="bracket"></div>
                    <div class="annotation">
                        <div class="left-arrow"></div>
                        <div class="label-text">
                            Organization<br>
                            Goals
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
