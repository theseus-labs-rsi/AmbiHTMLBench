<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一张图搞定HMO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #b8dce8;
            background-image: 
                linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            border-radius: 30px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .header {
            position: relative;
            margin-bottom: 20px;
        }
        
        .title-box {
            background-color: white;
            border-radius: 25px;
            padding: 15px 30px;
            display: inline-block;
            border: 3px solid #e8e8e8;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .title-text {
            font-size: 36px;
            font-weight: bold;
            color: #d9534f;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                1px 1px 0 #fff,
                2px 2px 0 rgba(0,0,0,0.1);
            font-style: italic;
        }
        
        .cow-mascot {
            position: absolute;
            top: 40px;
            right: -10px;
            width: 80px;
            height: 80px;
            z-index: 10;
        }
        
        .cow-placeholder {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            border: 2px solid #ddd;
        }
        
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .intro-box {
            background-color: #a8dff0;
            border-radius: 15px;
            padding: 18px;
            line-height: 1.6;
            color: #333;
            font-size: 16px;
            border: 2px solid #8ed4eb;
        }
        
        .section {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        
        .section-header {
            background-color: #ff9966;
            color: white;
            padding: 10px 20px;
            border-radius: 20px 20px 0 0;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .section-content {
            background-color: #e8e8e8;
            padding: 18px;
            border-radius: 0 0 20px 20px;
            line-height: 1.7;
            color: #444;
            font-size: 16px;
        }
        
        sup {
            font-size: 0.75em;
            vertical-align: super;
        }
        
        .hanging-line {
            position: absolute;
            top: -30px;
            width: 2px;
            height: 30px;
            background-color: #999;
        }
        
        .left-line {
            left: 80px;
        }
        
        .right-line {
            right: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="hanging-line left-line"></div>
            <div class="hanging-line right-line"></div>
            
            <div class="title-box">
                <div class="title-text">一张图搞定HMO</div>
            </div>
            
            <div class="cow-mascot">
                <div class="cow-placeholder">[奶牛卡通形象]</div>
            </div>
        </div>
        
        <div class="content-area">
            <div class="intro-box">
                HMO-中文“母乳低聚糖”，是源乳中的第一大免疫活性营养，而且含量还是乳铁蛋白的1倍<sup>7</sup>，在牛乳、羊乳中都没有这个成分，被誉为“乳黄金”。
            </div>
            
            <div class="section">
                <div class="section-header">HMO具有调节肠道菌群平衡作用<sup>3-6</sup></div>
                <div class="section-content">
                    肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自于肠道，因此呵护好宝宝肠道对提升保护力非常重要。而HMO可以促进有益菌生长，提高保护力。
                </div>
            </div>
            
            <div class="section">
                <div class="section-header">HMO为宝宝建立一道健康防护屏障<sup>5-6</sup></div>
                <div class="section-content">
                    HMO能够为宝宝建立一道健康防护屏障，防止有害菌侵扰。
                </div>
            </div>
            
            <div class="section">
                <div class="section-header">HMO激发免疫系统，提高宝宝保护力<sup>6</sup></div>
                <div class="section-content">
                    HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝保护力，增强宝宝体质。<sup>7-8</sup>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
