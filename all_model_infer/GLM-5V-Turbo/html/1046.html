<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何挑选性格好的猫咪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #fff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .container {
            width: 100%;
        }
        
        .main-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .highlight-red {
            color: #ff0000;
        }
        
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            padding: 10px;
        }
        
        .checklist {
            flex: 1;
            list-style: none;
        }
        
        .checklist li {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .checkbox-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ff6600;
            margin-right: 10px;
            position: relative;
            flex-shrink: 0;
        }
        
        .checkbox-icon::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6600;
            font-size: 14px;
            font-weight: bold;
        }
        
        .cat-cartoon {
            width: 150px;
            height: 120px;
            margin-left: 20px;
            flex-shrink: 0;
        }
        
        .section-header {
            background-color: #ffb84d;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 5px 15px;
            display: inline-block;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        
        .breeds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .breed-card {
            text-align: center;
            background-color: #fff9f0;
            padding: 15px 10px;
            border-radius: 50% 50% 10px 10px;
        }
        
        .breed-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            background-color: #ffe4c4;
            display: block;
        }
        
        .breed-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #000;
        }
        
        .breed-desc {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            text-align: left;
        }
        
        @media (max-width: 600px) {
            .breeds-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .main-title {
                font-size: 28px;
            }
        }
    </style>
    <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
            displayMath: []
          },
          svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="main-title">如何挑选<span class="highlight-red">性格好</span>的猫咪</h1>
        
        <div class="top-section">
            <ul class="checklist">
                <li><span class="checkbox-icon"></span>伸手摸它，看会不会主动过来蹭</li>
                <li><span class="checkbox-icon"></span>抱一下猫咪，看会不会抗拒</li>
                <li><span class="checkbox-icon"></span>喂食物，会不会主动积极吃</li>
                <li><span class="checkbox-icon"></span>对猫咪喵喵叫，看会不会积极回应</li>
            </ul>
            <div class="cat-cartoon placeholder" style="background-color: #ffe4e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999;">
                [Cartoon Cat Image]
            </div>
        </div>
        
        <div class="section-header">猫咪品种看性格</div>
        
        <div class="breeds-grid">
            <div class="breed-card">
                <img src="" alt="布偶猫" class="breed-image placeholder" style="background-color: #f5f5dc;">
                <div class="breed-name">布偶</div>
                <div class="breed-desc">性格温和，外表美丽<br>肠胃不太好</div>
            </div>
            
            <div class="breed-card">
                <img src="" alt="英短猫" class="breed-image placeholder" style="background-color: #d3d3d3;">
                <div class="breed-name">英短</div>
                <div class="breed-desc">体型圆胖、毛短而密<br>温柔平静、对人友善</div>
            </div>
            
            <div class="breed-card">
                <img src="" alt="美短猫" class="breed-image placeholder" style="background-color: #e6e6fa;">
                <div class="breed-name">美短</div>
                <div class="breed-desc">性格活泼好动<br>适应能力也比较强</div>
            </div>
            
            <div class="breed-card">
                <img src="" alt="狸花猫" class="breed-image placeholder" style="background-color: #deb887;">
                <div class="breed-name">狸花</div>
                <div class="breed-desc">身体素质好，聪明<br>好养活，寿命长</div>
            </div>
            
            <div class="breed-card">
                <img src="" alt="暹罗猫" class="breed-image placeholder" style="background-color: #f0f8ff;">
                <div class="breed-name">暹罗</div>
                <div class="breed-desc">活泼好动，智商高<br>胆子比较大</div>
            </div>
            
            <div class="breed-card">
                <img src="" alt="曼基康猫" class="breed-image placeholder" style="background-color: #e6e6fa;">
                <div class="breed-name">曼基康</div>
                <div class="breed-desc">活泼友善，性格好<br>小短腿底盘容易弄脏</div>
            </div>
        </div>
    </div>
</body>
</html>
