<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育原则模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #2b2b2b;
            color: #ffffff;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 120px;
            color: rgba(76, 175, 80, 0.15);
            font-weight: bold;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
            letter-spacing: 20px;
        }
        
        h1 {
            color: #ffd700;
            font-size: 36px;
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.4;
        }
        
        .principle-list {
            list-style: none;
        }
        
        .principle-list li {
            font-size: 28px;
            margin-bottom: 18px;
            line-height: 1.5;
            padding-left: 10px;
        }
        
        .principle-list li:nth-child(1),
        .principle-list li:nth-child(2) {
            /* Arabic numerals style */
        }
        
        .principle-list li:nth-child(3),
        .principle-list li:nth-child(4),
        .principle-list li:nth-child(5),
        .principle-list li:nth-child(6) {
            /* Chinese numerals style */
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            
            .principle-list li {
                font-size: 20px;
            }
            
            .watermark {
                font-size: 60px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="watermark">琳子幼安</div>
    
    <div class="container">
        <h1>7.当题自中出现“原则”时，可用以下模板：</h1>
        
        <ol class="principle-list">
            <li>(一)教育性原则。...体现教育目标，有利于幼儿身的全面发展</li>
            <li>(二)个别差异性原则。每个幼儿不一样，教师要因材施教</li>
            <li>（三）科学性原则。...能给幼儿正确的启蒙教育</li>
            <li>（四）发展适宜性原则。考虑到不同年龄段孩子的特点</li>
            <li>（五）整体性原则。考虑到多方面的要素，促进幼儿整体的发展</li>
            <li>（六）活动性原则。注重幼儿亲身体验，直接参与，以各种游戏活动为主</li>
        </ol>
    </div>
</body>
</html>
