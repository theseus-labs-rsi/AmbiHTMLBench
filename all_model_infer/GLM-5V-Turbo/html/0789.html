<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刚从长沙回来总结</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }
        
        .header {
            border-bottom: 4px solid #4a90e2;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        
        .title .highlight {
            color: #4a90e2;
        }
        
        .subtitle {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e67e22;
            margin-top: 15px;
        }
        
        .main-content {
            display: flex;
            gap: 30px;
        }
        
        .timeline {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-block {
            text-align: center;
            margin-bottom: 5px;
        }
        
        .time-label {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
        
        .arrow {
            width: 40px;
            height: 60px;
            background-color: #5dade2;
            clip-path: polygon(50% 100%, 0% 20%, 35% 20%, 35% 0%, 65% 0%, 65% 20%, 100% 20%);
            margin: 5px auto;
        }
        
        .attractions {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .attraction-card {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        
        .attraction-image {
            width: 200px;
            height: 130px;
            background-color: #ddd;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .attraction-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .attraction-details {
            flex: 1;
        }
        
        .attraction-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .price-tag {
            color: #27ae60;
            font-size: 18px;
        }
        
        .time-info {
            color: #e74c3c;
            font-size: 18px;
            margin: 5px 0;
        }
        
        .description {
            font-size: 16px;
            color: #555;
            line-height: 1.5;
        }
        
        .star {
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">刚从<span class="highlight">长沙</span>回来总结</div>
            <div class="subtitle">3天2晚　1000元</div>
        </div>
        
        <div class="main-content">
            <div class="timeline">
                <div class="time-block">
                    <div class="time-label">第一天</div>
                    <div class="arrow"></div>
                </div>
                <div class="time-block">
                    <div class="time-label">上午</div>
                    <div class="arrow"></div>
                </div>
                <div class="time-block">
                    <div class="time-label">下午</div>
                    <div class="arrow"></div>
                </div>
                <div class="time-block">
                    <div class="time-label">晚上</div>
                </div>
            </div>
            
            <div class="attractions">
                <div class="attraction-card">
                    <div class="attraction-image">
                        <img src="https://via.placeholder.com/200x130/e74c3c/ffffff?text=五一广场" alt="五一广场">
                    </div>
                    <div class="attraction-details">
                        <div class="attraction-title"><span class="star">✦</span>五一广场 <span class="price-tag">(免费)</span></div>
                        <div class="time-info">🎮游玩时间：2h</div>
                        <div class="description">长沙商圈老大，就近可打卡IFS国金中心、黄兴路步行街、坡子街等</div>
                    </div>
                </div>
                
                <div class="attraction-card">
                    <div class="attraction-image">
                        <img src="https://via.placeholder.com/200x130/ecf0f1/7f8c8d?text=南门口" alt="南门口">
                    </div>
                    <div class="attraction-details">
                        <div class="attraction-title"><span class="star">✦</span>南门口 <span class="price-tag">(免费)</span></div>
                        <div class="time-info">🎮游玩时间：1h</div>
                        <div class="description">南门口是很多长沙人生活的地方，附近有很多地道的美食和小吃</div>
                    </div>
                </div>
                
                <div class="attraction-card">
                    <div class="attraction-image">
                        <img src="https://via.placeholder.com/200x130/85c1e9/2980b9?text=橘子洲" alt="橘子洲">
                    </div>
                    <div class="attraction-details">
                        <div class="attraction-title"><span class="star">✦</span>橘子洲 <span class="price-tag">(免费)</span></div>
                        <div class="time-info">🎮游玩时间：2h</div>
                        <div class="description">我个人是不推荐橘子洲和岳麓山放在同一天的，傍晚的橘子洲更有韵味</div>
                    </div>
                </div>
                
                <div class="attraction-card">
                    <div class="attraction-image">
                        <img src="https://via.placeholder.com/200x130/2c3e50/f39c12?text=湘江游轮" alt="湘江游轮">
                    </div>
                    <div class="attraction-details">
                        <div class="attraction-title"><span class="star">✦</span>湘江游轮 <span class="price-tag">(180/人)</span></div>
                        <div class="time-info">🎮游玩时间：1h</div>
                        <div class="description">夜游湘江绝对是一种不容错过的体验，江风清爽，夜景特别美</div>
                    </div>
                </div>
                
                <div class="attraction-card">
                    <div class="attraction-image">
                        <img src="https://via.placeholder.com/200x130/d35400/f1c40f?text=杜甫江阁" alt="杜甫江阁">
                    </div>
                    <div class="attraction-details">
                        <div class="attraction-title"><span class="star">✦</span>杜甫江阁 <span class="price-tag">(10/人)</span></div>
                        <div class="time-info">🎮游玩时间：1h</div>
                        <div class="description">为纪念杜甫江阁而建，夜景美，是观看湘江夜景的最佳观看地点</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
