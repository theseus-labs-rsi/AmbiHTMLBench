<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>细胞结构笔记</title>
    <style>
        body {
            font-family: "KaiTi", "楷体", serif;
            background-color: #f5f5f0;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .notebook-page {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .section {
            margin-bottom: 30px;
        }
        .flow-line {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .arrow {
            font-weight: bold;
        }
        .sub-items {
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .item-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .label {
            font-weight: bold;
            min-width: 60px;
        }
        .numbered-list {
            margin-left: 30px;
            margin-top: 15px;
        }
        .list-item {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .highlight-box {
            border: 1px solid #ccc;
            padding: 8px 15px;
            display: inline-block;
            margin: 20px 0 10px 20px;
            background: #fafafa;
            font-size: 18px;
            font-weight: bold;
        }
        .nucleus-diagram {
            margin-left: 60px;
            margin-top: 10px;
        }
        .nucleus-item {
            margin: 8px 0;
            padding-left: 20px;
            position: relative;
        }
        .nucleus-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 15px;
            height: 1px;
            background: #333;
        }
        .sub-point {
            margin-left: 25px;
            margin-top: 5px;
            color: #555;
        }
        .indent {
            padding-left: 40px;
        }
        .handwriting {
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="notebook-page">
        <div class="section handwriting">
            <div class="flow-line">
                <span>内质网</span>
                <span class="arrow">→</span>
                <span>高尔基体</span>
                <span>，</span>
            </div>
            
            <div class="flow-line">
                <span>cell的生物膜系统</span>
                <span>≈</span>
                <span>cell膜</span>
            </div>
            
            <div class="sub-items">
                <div class="item-row">
                    <span class="arrow">↓</span>
                    <span class="label">作用</span>
                    <span class="arrow">↗</span>
                    <span>cell器膜</span>
                </div>
                <div style="margin-left: 70px;">
                    <span class="arrow">↘</span>
                    <span>核膜</span>
                </div>
            </div>

            <div class="numbered-list">
                <div class="list-item">
                    <span>① 使cell具有相对稳定的内部环境</span><br>
                    <span class="indent">同时，在cell与外部环境进行物质运输、能量转<br>化、信息传递的过程中起决定性作用。</span>
                </div>
                
                <div class="list-item">
                    <span>② 广阔的膜面积为多种酶提供了附着位点，</span>
                </div>
                
                <div class="list-item">
                    <span>③ 外界 → 保证cell生命活动高效、有序的<br>进行。</span>
                </div>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #333; margin: 30px 0;">

        <div class="section handwriting">
            <div class="highlight-box">
                cell核控制着cell的代谢和遗传
            </div>
            
            <div class="nucleus-diagram">
                <div style="display: inline-block; vertical-align: top; margin-right: 20px;">
                    cell核
                </div>
                
                <div style="display: inline-block; vertical-align: top;">
                    <div class="nucleus-item">
                        核膜：双层，外隙
                    </div>
                    
                    <div class="nucleus-item">
                        核仁：与某种RNA的合成以及核糖<br>体的形成有关
                    </div>
                    
                    <div class="nucleus-item">
                        染色质→由DNA和蛋白质组成
                        <div class="sub-point">
                            ↘ 遗传信息的载体
                        </div>
                    </div>
                    
                    <div class="nucleus-item">
                        核孔：实现核质之间频繁的物质交<br>换和信息交流
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
