<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30天学会自然拼读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 600px;
            background: white;
            border: 4px solid #333;
            position: relative;
            padding: 30px;
            box-shadow: 0 0 0 8px #ffa500, 0 0 0 12px #1e90ff;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .title-box {
            display: inline-block;
            background-color: #ff6b81;
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 8px 25px;
            border-radius: 8px;
            position: relative;
            border: 3px solid #ff4757;
        }
        
        .section {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
            align-items: flex-start;
        }
        
        .left-col {
            width: 45%;
        }
        
        .right-col {
            width: 55%;
        }
        
        .label {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .label-blue {
            background-color: #87ceeb;
        }
        
        .label-green {
            background-color: #d4ed91;
        }
        
        .english-title {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .avatars {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            justify-content: flex-start;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            background: #ddd;
            border-radius: 50%;
            border: 2px solid #666;
        }
        
        .description {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            background-color: #ffe4e1;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #ff6b81;
        }
        
        .poem {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            background-color: #ffe4e1;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #9acd32;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
        }
        
        .word-item {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 20px;
            font-weight: bold;
        }
        
        .word-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
        }
        
        .word-item-list {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 19px;
            font-weight: bold;
        }
        
        .red-text {
            color: #dc143c;
        }
        
        .character-placeholder {
            width: 80px;
            height: 140px;
            background: #ffe4e1;
            border: 2px dashed #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            border-radius: 5px;
        }
        
        .decoration-top-right {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            height: 60px;
            background: radial-gradient(circle, #ffb6c1 40%, transparent 41%);
            opacity: 0.8;
        }
        
        .footer-deco {
            text-align: center;
            margin-top: 20px;
            position: relative;
        }
        
        .footer-text {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        
        .mascot {
            width: 100px;
            height: 60px;
            background: #deb887;
            border-radius: 50% 50% 40% 40%;
            margin: 0 auto;
            position: relative;
            border: 2px solid #8b4513;
        }
        
        .mascot::before {
            content: "6000";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decoration-top-right"></div>
        
        <div class="header">
            <div class="title-box">30天学会自然拼读</div>
        </div>
        
        <!-- Section 1: Syllable Counting -->
        <div class="section">
            <div class="left-col">
                <div class="label label-blue">数音节</div>
                <div class="avatars">
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                    <div class="avatar"></div>
                </div>
                <div class="description">
                    •有几个发音的元音（或元<br>音组合）就有几个音节。
                </div>
            </div>
            
            <div class="right-col">
                <div class="english-title">Syllable Counting</div>
                <div class="word-grid">
                    <div class="word-item">cat</div>
                    <div class="word-item"><span class="red-text">cake</span></div>
                    
                    <div class="word-item">rain</div>
                    <div class="word-item"><span class="red-text">row</span></div>
                    
                    <div class="word-item">robot</div>
                    <div class="word-item"><span class="red-text">teacher</span></div>
                    
                    <div class="word-item">table</div>
                    <div class="word-item"><span class="red-text">apple</span></div>
                </div>
            </div>
        </div>
        
        <!-- Section 2: Syllable Division -->
        <div class="section">
            <div class="left-col">
                <div class="label label-green">划分音节</div>
                <div class="poem">
                    有时一靠后，<br>
                    常常二分手。<br>
                    组合共发音，<br>
                    一起被分走。<br>
                    词根词缀分离，<br>
                    多音节词不易，<br>
                    还请多多练多听。
                </div>
                <div class="character-placeholder">[Character]</div>
            </div>
            
            <div class="right-col">
                <div class="english-title">Syllable Division</div>
                <div class="word-list">
                    <div class="word-item-list">rab<span class="red-text">bit</span></div>
                    <div class="word-item-list">bas<span class="red-text">ket</span></div>
                    
                    <div class="word-item-list">ba<span class="red-text">by</span></div>
                    <div class="word-item-list">ro<span class="red-text">bot</span></div>
                    
                    <div class="word-item-list">clo<span class="red-text">set</span></div>
                    <div class="word-item-list">plan<span class="red-text">et</span></div>
                    
                    <div class="word-item-list">des<span class="red-text">troy</span></div>
                    <div class="word-item-list">com<span class="red-text">plex</span></div>
                    
                    <div class="word-item-list">un<span class="red-text">happy</span></div>
                    <div class="word-item-list">hope<span class="red-text">fully</span></div>
                </div>
            </div>
        </div>
        
        <div class="footer-deco">
            <div class="mascot"></div>
            <div class="footer-text">哆来咪爱学习</div>
            <div class="footer-text" style="font-size: 12px;">From 小红书</div>
        </div>
    </div>
</body>
</html>
