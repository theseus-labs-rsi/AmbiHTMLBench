<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三大核心参数解读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            padding: 40px 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        /* Top decorative holes */
        .top-holes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .hole {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #ddd;
            background-color: #fff;
        }
        
        /* Main title area */
        .header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 50px;
            position: relative;
        }
        
        .step-badge {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 4px;
            margin-right: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        
        .title-area {
            flex: 1;
            text-align: center;
            padding-top: 5px;
        }
        
        .main-title {
            font-size: 36px;
            font-weight: bold;
            color: #222;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            letter-spacing: 1px;
        }
        
        /* Parameter sections */
        .param-section {
            display: flex;
            align-items: flex-start;
            margin-bottom: 45px;
            gap: 20px;
        }
        
        .icon-container {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-placeholder {
            width: 60px;
            height: 60px;
            border: 3px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            background-color: #fafafa;
        }
        
        .icon-ram {
            border-radius: 6px;
            position: relative;
        }
        
        .icon-ram::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                #333 0,
                #333 3px,
                transparent 3px,
                transparent 6px
            );
        }
        
        .icon-cpu {
            border-radius: 4px;
            position: relative;
            background: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 12px 12px;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .icon-cpu::after {
            content: 'CPU';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fafafa;
            padding: 2px 4px;
            font-size: 11px;
            z-index: 1;
        }
        
        .icon-4k {
            border: 3px solid #333;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 4px;
        }
        
        .content-area {
            flex: 1;
            padding-top: 5px;
        }
        
        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }
        
        .section-text {
            font-size: 17px;
            color: #444;
            line-height: 1.7;
        }
        
        /* Specific styling for 4K icon text */
        .text-4k {
            font-size: 18px;
            font-weight: bold;
        }
        
        .text-uhd {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top decorative holes -->
        <div class="top-holes">
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
        </div>
        
        <!-- Header with step badge and titles -->
        <div class="header">
            <div class="step-badge">第一步</div>
            <div class="title-area">
                <h1 class="main-title">三大核心参数解读</h1>
                <p class="subtitle">内存/芯片/分辨率参数解读</p>
            </div>
        </div>
        
        <!-- Parameter 1: Memory -->
        <div class="param-section">
            <div class="icon-container">
                <div class="icon-placeholder icon-ram" style="font-size: 20px;">E</div>
            </div>
            <div class="content-area">
                <h2 class="section-title">1.看内存</h2>
                <p class="section-text">内存越大速度越快，小于8GB不建议购买。(画圈：<br>GB≠Gb,大GB是小Bb的8倍，尽量选择大GB)</p>
            </div>
        </div>
        
        <!-- Parameter 2: Chip -->
        <div class="param-section">
            <div class="icon-container">
                <div class="icon-placeholder icon-cpu"></div>
            </div>
            <div class="content-area">
                <h2 class="section-title">2.看芯片</h2>
                <p class="section-text">主流芯片A73和A53。追求性能玩游戏选A73，看看电视想省电选A53。</p>
            </div>
        </div>
        
        <!-- Parameter 3: Resolution -->
        <div class="param-section">
            <div class="icon-container">
                <div class="icon-placeholder icon-4k">
                    <span class="text-4k">4K</span>
                    <span class="text-uhd">UHD</span>
                </div>
            </div>
            <div class="content-area">
                <h2 class="section-title">3.看分辨率</h2>
                <p class="section-text">分辨率越高越清晰。（目前电视基本都是超高清4K也就是3840×2160的分辨率）</p>
            </div>
        </div>
    </div>
</body>
</html>
