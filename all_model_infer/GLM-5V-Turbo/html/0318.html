<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王源最新机场私服Look</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            display: flex;
            background-color: #fff;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .photo-section {
            width: 38%;
            position: relative;
            background-color: #e8e8e8;
        }
        .photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .content-section {
            width: 28%;
            padding: 30px 20px;
            background-color: #fff;
            border-left: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }
        .back-photo-section {
            width: 34%;
            position: relative;
            background-color: #e0e0e0;
        }
        .back-photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .main-title {
            font-size: 52px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 4px;
            line-height: 1;
            color: #000;
        }
        .sub-title {
            font-size: 14px;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .product-block {
            margin-bottom: 28px;
            text-align: center;
        }
        .product-img-small {
            width: 140px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto 10px;
            display: block;
        }
        .product-img-medium {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 0 auto 10px;
            display: block;
        }
        .brand-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #000;
            letter-spacing: 1px;
        }
        .desc-text {
            font-size: 13px;
            color: #444;
            line-height: 1.5;
            margin-bottom: 4px;
        }
        .price-text {
            font-size: 13px;
            color: #666;
        }
        .placeholder-box {
            background-color: #f5f5f5;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left: Front Photo -->
        <div class="photo-section">
            <div class="placeholder-box" style="width: 100%; height: 100%; min-height: 600px;">
                [Photo: 王源粉色头发正面照，佩戴黑框眼镜与黑色口罩，身穿白色印花T恤]
            </div>
        </div>

        <!-- Center: Content Column -->
        <div class="content-section">
            <h1 class="main-title">王源</h1>
            <p class="sub-title">最新机场私服Look</p>

            <!-- Product 1: Glasses -->
            <div class="product-block">
                <div class="placeholder-box product-img-small">[Image: PRSR眼镜特写]</div>
                <div class="brand-text">PRSR帕莎</div>
                <div class="desc-text">品牌定制款</div>
            </div>

            <!-- Product 2: T-shirt -->
            <div class="product-block">
                <div class="placeholder-box product-img-medium">[Image: Etudes白色星星印花T恤]</div>
                <div class="brand-text">Etudes</div>
                <div class="desc-text">LOGO印花圆领短袖T恤</div>
                <div class="price-text">参考价¥1,080</div>
            </div>

            <!-- Product 3: Jeans -->
            <div class="product-block">
                <div class="placeholder-box product-img-medium">[Image: LOEWE深蓝色翻脚牛仔裤]</div>
                <div class="brand-text">LOEWE</div>
                <div class="desc-text">单宁布夫系翻脚牛仔裤</div>
                <div class="price-text">参考价¥7,700</div>
            </div>

            <!-- Product 4: Shoes -->
            <div class="product-block">
                <div class="placeholder-box product-img-medium">[Image: GUCCI白色男士运动鞋]</div>
                <div class="brand-text">GUCCI</div>
                <div class="desc-text">MAC80系列男士运动鞋</div>
                <div class="price-text">参考价¥7,600</div>
            </div>
        </div>

        <!-- Right: Back Photo -->
        <div class="back-photo-section">
            <div class="placeholder-box" style="width: 100%; height: 100%; min-height: 600px;">
                [Photo: 王源背影照，展示白色T恤背部与深色牛仔裤及白色运动鞋]
            </div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
