<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富人眼中的富人是咋样？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background: linear-gradient(135deg, #1a2a4a 0%, #2d4a6e 50%, #1e3a5f 100%);
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            color: #ffffff;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 15px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(10, 25, 50, 0.6);
            border: 2px solid rgba(255,255,255,0.4);
        }
        
        th, td {
            border: 1px solid rgba(255,255,255,0.4);
            padding: 18px 24px;
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
        }
        
        th {
            background-color: rgba(30, 60, 100, 0.8);
            font-weight: bold;
            font-size: 20px;
            text-align: center;
        }
        
        td:first-child {
            width: 65%;
            background-color: rgba(20, 45, 80, 0.5);
        }
        
        td:last-child {
            width: 35%;
            text-align: center;
            background-color: rgba(15, 35, 65, 0.5);
            font-weight: 500;
        }
        
        .info-row {
            text-align: center !important;
            background-color: rgba(40, 70, 110, 0.6) !important;
            font-style: italic;
            font-size: 17px;
        }
        
        tr:hover td {
            background-color: rgba(50, 90, 140, 0.4);
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
            
            th, td {
                padding: 12px 16px;
                font-size: 16px;
                display: block;
                width: 100% !important;
            }
            
            th {
                display: none;
            }
            
            td:first-child {
                border-bottom: none;
                font-weight: bold;
            }
            
            td:last-child {
                border-top: 1px solid rgba(255,255,255,0.2);
            }
            
            .info-row {
                border-top: 2px solid rgba(255,255,255,0.3);
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>富人眼中的富人是咋样？</h1>
        <table>
            <thead>
                <tr>
                    <th>问题</th>
                    <th>回答</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1.您觉得高净值人群资产拥有多少钱才算是?</td>
                    <td>11亿7,388.4万元</td>
                </tr>
                <tr>
                    <td colspan="2" class="info-row">本次调研的平均家庭资产:2,265.8万元</td>
                </tr>
                <tr>
                    <td>2.请问您每天工作小时数是?</td>
                    <td>8.2小时</td>
                </tr>
                <tr>
                    <td>3.您预计退休年龄?</td>
                    <td>59岁</td>
                </tr>
                <tr>
                    <td>4.您希望能活到多少岁?</td>
                    <td>88.2岁</td>
                </tr>
                <tr>
                    <td colspan="2" class="info-row">小知识:2021年中国平均寿命:77.3岁</td>
                </tr>
                <tr>
                    <td>5.请问您曾去过国家数量（包括商务出差）</td>
                    <td>6.2个国家</td>
                </tr>
                <tr>
                    <td>6.请问您平均每月阅读书籍数量</td>
                    <td>2.4本书</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
