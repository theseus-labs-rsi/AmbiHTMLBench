<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026破晓艺术跨界展览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster {
            width: 800px;
            height: 1200px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(200, 200, 210, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 200, 210, 0.3) 1px, transparent 1px);
            background-size: 80px 80px;
            padding: 40px;
        }
        
        .bg-text-new {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 140px;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.04);
            letter-spacing: 10px;
            z-index: 0;
            line-height: 1;
        }
        
        .bg-text-year {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 160px;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.04);
            letter-spacing: 15px;
            z-index: 0;
        }
        
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .year-title {
            font-size: 110px;
            font-weight: 900;
            color: #1a237e;
            line-height: 1;
            margin-top: 20px;
            margin-left: -5px;
            letter-spacing: -2px;
        }
        
        .sub-title-box {
            background-color: #1a237e;
            display: inline-block;
            padding: 8px 12px;
            margin-top: 15px;
            align-self: flex-start;
        }
        
        .sub-title {
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 2px;
        }
        
        .char-red {
            color: #e91e63;
        }
        
        .char-white {
            color: #ffffff;
        }
        
        .main-title {
            font-size: 180px;
            font-weight: 900;
            color: #1a237e;
            line-height: 0.95;
            margin-top: 10px;
            letter-spacing: -5px;
            position: relative;
        }
        
        .main-title-line {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            height: 28px;
            background-color: #e91e63;
            z-index: -1;
        }
        
        .info-container {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            padding-bottom: 40px;
        }
        
        .left-info {
            flex: 1;
        }
        
        .price-section {
            margin-bottom: 20px;
        }
        
        .price {
            font-size: 48px;
            font-weight: 700;
            color: #e91e63;
            line-height: 1.2;
        }
        
        .yen {
            font-size: 32px;
        }
        
        .qi {
            font-size: 24px;
            font-weight: 400;
        }
        
        .ticket-type {
            font-size: 24px;
            color: #333;
            margin-top: 5px;
        }
        
        .right-info {
            flex: 1;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .info-block {
            margin-bottom: 25px;
        }
        
        .label {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .date-value {
            font-size: 42px;
            font-weight: 700;
            color: #e91e63;
            line-height: 1.2;
            letter-spacing: 2px;
        }
        
        .date-separator {
            font-size: 36px;
            color: #e91e63;
            margin: 5px 0;
            font-weight: 300;
        }
        
        .location-value {
            font-size: 32px;
            color: #1a237e;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 2px solid #1a237e;
            padding-top: 20px;
            margin-top: 20px;
        }
        
        .organizer {
            font-size: 26px;
            color: #333;
        }
        
        .org-label {
            font-size: 22px;
            margin-bottom: 5px;
            color: #555;
        }
        
        .contact {
            text-align: right;
        }
        
        .contact-label {
            font-size: 22px;
            color: #555;
            margin-bottom: 5px;
        }
        
        .phone {
            font-size: 32px;
            font-weight: 700;
            color: #1a237e;
            letter-spacing: 1px;
        }
        
        .decorative-line {
            width: 40px;
            height: 4px;
            background-color: #1a237e;
            margin: 10px 0;
        }
        
        .decorative-line-short {
            width: 25px;
            height: 4px;
            background-color: #1a237e;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="bg-text-new">NEW</div>
        <div class="bg-text-year">YEAR</div>
        
        <div class="content">
            <div class="decorative-line"></div>
            
            <div class="year-title">2026</div>
            
            <div class="sub-title-box">
                <span class="sub-title">
                    <span class="char-red">破</span><span class="char-white">晓艺术</span>
                </span>
            </div>
            
            <div class="main-title">
                跨界展览
                <div class="main-title-line"></div>
            </div>
            
            <div class="info-container">
                <div class="left-info">
                    <div class="price-section">
                        <div class="price">
                            <span class="yen">¥</span>60<span class="qi">起</span>
                        </div>
                        <div class="ticket-type">单人票价</div>
                    </div>
                </div>
                
                <div class="right-info">
                    <div class="info-block">
                        <div class="label">活动时间</div>
                        <div class="date-value">01/01</div>
                        <div class="date-separator">—</div>
                        <div class="date-value">01/03</div>
                    </div>
                    
                    <div class="decorative-line-short" style="margin-left: auto;"></div>
                    
                    <div class="info-block">
                        <div class="label">活动地点</div>
                        <div class="location-value">厦门湖里区稿定艺术馆</div>
                    </div>
                </div>
            </div>
            
            <div class="footer">
                <div class="organizer">
                    <div class="org-label">主办方：</div>
                    <div>稿定集团</div>
                </div>
                
                <div class="contact">
                    <div class="contact-label">联系电话</div>
                    <div class="phone">0592-88888888</div>
                </div>
            </div>
            
            <div class="decorative-line" style="margin-top: 15px; width: 30px;"></div>
        </div>
    </div>
</body>
</html>
