<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京剧艺术节</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #f5f5f5;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            height: 100%;
            position: relative;
            padding: 40px;
        }
        
        /* Left Section - Main Title */
        .left-section {
            position: absolute;
            left: 60px;
            top: 50px;
            display: flex;
            gap: 15px;
        }
        
        .role-circles {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .circle {
            width: 50px;
            height: 50px;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: normal;
        }
        
        .main-title {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        
        .title-char {
            font-size: 72px;
            font-weight: bold;
        }
        
        .red-text {
            color: #d32f2f;
        }
        
        .black-text {
            color: #000;
        }
        
        .sub-title-vertical {
            writing-mode: vertical-rl;
            font-size: 22px;
            letter-spacing: 6px;
            margin-top: 30px;
            margin-left: 10px;
            color: #000;
        }
        
        /* Top Right */
        .top-right {
            position: absolute;
            right: 60px;
            top: 50px;
            text-align: center;
        }
        
        .grid-icon {
            width: 40px;
            height: 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            margin-bottom: 10px;
        }
        
        .grid-dot {
            background-color: #d32f2f;
            width: 100%;
            height: 100%;
        }
        
        .grid-dot:nth-child(even) {
            opacity: 0.3;
        }
        
        .english-text {
            writing-mode: vertical-rl;
            font-size: 18px;
            letter-spacing: 4px;
            font-family: Georgia, serif;
        }
        
        /* Geometric Shapes Area */
        .geometric-area {
            position: absolute;
            right: 80px;
            top: 200px;
            width: 400px;
            height: 500px;
        }
        
        .shape-circle-pink {
            position: absolute;
            width: 90px;
            height: 90px;
            background-color: #c06c84;
            border-radius: 50%;
            left: 120px;
            top: 0;
        }
        
        .shape-circle-red {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: #c62828;
            border-radius: 50%;
            left: 70px;
            top: 180px;
        }
        
        .shape-black-large {
            position: absolute;
            width: 200px;
            height: 250px;
            background-color: #1a1a1a;
            clip-path: polygon(0% 0%, 100% 35%, 75% 100%, 25% 100%);
            right: 0;
            top: 80px;
        }
        
        .shape-pink-mountain {
            position: absolute;
            width: 150px;
            height: 130px;
            background: linear-gradient(to bottom, #f48fb1, #f8bbd9);
            right: 0;
            top: 220px;
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
        }
        
        .shape-triangle-small {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 35px solid #ec407a;
            right: 40px;
            top: 310px;
        }
        
        .shape-triangle-tiny {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #212121;
            right: 55px;
            top: 330px;
        }
        
        .vertical-bar-red {
            position: absolute;
            width: 28px;
            height: 280px;
            background-color: #c62828;
            right: 95px;
            top: 360px;
        }
        
        .magenta-corner {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-top: 60px solid #e91e63;
            right: -20px;
            top: 100px;
            transform: rotate(-45deg);
        }
        
        /* Bottom Info Section */
        .info-section {
            position: absolute;
            left: 60px;
            bottom: 140px;
            line-height: 1.8;
        }
        
        .info-line {
            font-size: 26px;
            color: #000;
            margin-bottom: 5px;
        }
        
        .date-label {
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: -5px;
        }
        
        .date-main {
            font-size: 48px;
            font-family: Georgia, serif;
            letter-spacing: 2px;
        }
        
        .date-suffix {
            font-size: 16px;
            vertical-align: super;
            margin: 0 5px;
        }
        
        .phone-line {
            font-size: 26px;
            margin-top: 5px;
        }
        
        .red-dot-decor {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: #c62828;
            border-radius: 50%;
            right: 220px;
            bottom: 270px;
            opacity: 0.8;
        }
        
        /* Background Mountains */
        .background-art {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            pointer-events: none;
        }
        
        .mountain-back {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 150px;
            background: linear-gradient(to top, rgba(0,0,0,0.1), transparent);
            clip-path: polygon(0% 100%, 20% 40%, 45% 70%, 65% 30%, 85% 60%, 100% 100%);
            opacity: 0.3;
        }
        
        .mountain-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 700px;
            height: 200px;
            background: linear-gradient(to top, #333, #666);
            clip-path: polygon(0% 100%, 10% 50%, 25% 70%, 40% 40%, 55% 65%, 70% 35%, 85% 60%, 100% 80%, 100% 100%);
            opacity: 0.7;
        }
        
        .birds {
            position: absolute;
            right: 80px;
            bottom: 160px;
            font-size: 14px;
            color: #333;
            transform: rotate(-10deg);
        }
        
        .trees {
            position: absolute;
            bottom: 20px;
            right: 150px;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Main Title -->
        <div class="left-section">
            <div class="role-circles">
                <div class="circle">生</div>
                <div class="circle">旦</div>
                <div class="circle">净</div>
                <div class="circle">末</div>
                <div class="circle">丑</div>
            </div>
            <div class="main-title">
                <span class="title-char red-text">京</span>
                <span class="title-char red-text">剧</span>
                <span class="title-char black-text">艺</span>
                <span class="title-char black-text">术</span>
                <span class="title-char black-text">节</span>
                <div class="sub-title-vertical">稿定艺术展</div>
            </div>
        </div>

        <!-- Top Right -->
        <div class="top-right">
            <div class="grid-icon">
                <div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div>
                <div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div>
                <div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div>
                <div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div><div class="grid-dot"></div>
            </div>
            <div class="english-text">Gao<br>Ding<br>Yi<br>Shu</div>
        </div>

        <!-- Geometric Shapes -->
        <div class="geometric-area">
            <div class="shape-circle-pink"></div>
            <div class="shape-circle-red"></div>
            <div class="shape-black-large"></div>
            <div class="shape-pink-mountain"></div>
            <div class="shape-triangle-small"></div>
            <div class="shape-triangle-tiny"></div>
            <div class="vertical-bar-red"></div>
            <div class="magenta-corner"></div>
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <div class="info-line">主办方：稿定集团</div>
            <div class="info-line">地点：厦门市稿定剧院</div>
            <div class="date-label">DATE.</div>
            <div class="date-main">
                12.20<span class="date-suffix">SUN</span> / 12.30<span class="date-suffix">SAT</span>
            </div>
            <div class="phone-line">联系电话：0592-8888888</div>
        </div>

        <div class="red-dot-decor"></div>

        <!-- Background Art -->
        <div class="background-art">
            <div class="mountain-back"></div>
            <div class="mountain-front"></div>
            <div class="birds">🐦‍⬛ 🐦 🐦‍⬛<br>🐦 🐦<br>🐦 🐦</div>
            <div class="trees">🌲 🌲</div>
        </div>
    </div>
</body>
</html>
