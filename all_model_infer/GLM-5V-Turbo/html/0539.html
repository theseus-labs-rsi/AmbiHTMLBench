<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into The Darkness - Film Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 20px;
        }

        .poster-container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-text {
            font-size: 1.4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            margin-bottom: 50px;
            opacity: 0.95;
        }

        .main-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 6.5rem;
            color: #c41e3a;
            text-transform: uppercase;
            line-height: 1.05;
            margin-bottom: 60px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .image-section {
            width: 100%;
            max-width: 850px;
            margin-bottom: 70px;
            position: relative;
        }

        .parking-image {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(100%) contrast(1.1);
        }

        .clearance-sign {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f0f0f0;
            color: #000000;
            padding: 10px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #333;
        }

        .director-credit {
            font-size: 1.7rem;
            color: #c41e3a;
            margin-bottom: 35px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .event-info {
            font-size: 1.55rem;
            line-height: 1.7;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .event-info div {
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 4rem;
            }
            
            .header-text {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
            
            .director-credit {
                font-size: 1.3rem;
            }
            
            .event-info {
                font-size: 1.2rem;
            }
            
            .clearance-sign {
                font-size: 0.9rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="header-text">Soulful Film Presents</div>
        
        <h1 class="main-title">Into The<br>Darkness</h1>
        
        <div class="image-section">
            <svg class="parking-image" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
                <rect fill="#0a0a0a" width="900" height="650"/>
                <!-- Parking garage structure -->
                <rect fill="#151515" x="0" y="200" width="900" height="150"/>
                <!-- Ceiling lights -->
                <rect fill="#ffffff" x="150" y="220" width="80" height="15" transform="skewX(-10)"/>
                <rect fill="#ffffff" x="350" y="220" width="80" height="15" transform="skewX(-10)"/>
                <rect fill="#ffffff" x="550" y="220" width="80" height="15" transform="skewX(-10)"/>
                <rect fill="#ffffff" x="750" y="220" width="80" height="15" transform="skewX(-10)"/>
                
                <rect fill="#ffffff" x="200" y="380" width="60" height="12" transform="skewX(10)"/>
                <rect fill="#ffffff" x="360" y="380" width="60" height="12" transform="skewX(10)"/>
                <rect fill="#ffffff" x="520" y="380" width="60" height="12" transform="skewX(10)"/>
                <rect fill="#ffffff" x="680" y="380" width="60" height="12" transform="skewX(10)"/>
                
                <!-- Walls -->
                <rect fill="#1a1a1a" x="0" y="280" width="120" height="370"/>
                <rect fill="#1a1a1a" x="780" y="280" width="120" height="370"/>
                
                <!-- Floor with perspective lines -->
                <polygon fill="#222" points="120,450 780,450 900,650 0,650"/>
                
                <!-- Car silhouette -->
                <ellipse cx="450" cy="480" rx="60" ry="25" fill="#0a0a0a"/>
                <rect fill="#0a0a0a" x="395" y="455" width="110" height="30" rx="5"/>
                <rect fill="#333" x="420" y="460" width="30" height="15" rx="2" opacity="0.6"/>
                <rect fill="#333" x="460" y="460" width="30" height="15" rx="2" opacity="0.6"/>
                
                <!-- Railing left -->
                <line x1="0" y1="520" x2="250" y2="580" stroke="#444" stroke-width="3"/>
                <line x1="0" y1="540" x2="250" y2="600" stroke="#444" stroke-width="3"/>
                
                <!-- Ground markings -->
                <path d="M 320 530 L 380 530 L 350 550 Z" fill="#444" opacity="0.6"/>
                <path d="M 400 590 L 460 590 L 430 610 Z" fill="#444" opacity="0.6"/>
            </svg>
            <div class="clearance-sign">SELF PARK 6'-0'' CLEARANCE</div>
        </div>
        
        <div class="director-credit">Directed by Levi Stanford</div>
        
        <div class="event-info">
            <div>May 23, 2019 | 2:00 pm</div>
            <div>Michael Hopper Auditorium</div>
            <div>Oreixs university, OH</div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
