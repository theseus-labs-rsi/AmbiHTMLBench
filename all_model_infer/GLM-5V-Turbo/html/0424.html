<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Cliff L.I. WPA Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            background-color: #1e4d9b;
            color: #fff;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .poster-container {
            width: 600px;
            height: 900px;
            position: relative;
            background-color: #1e4d9b;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Background elements */
        .foliage {
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 60%;
            background-color: #2d5016;
            clip-path: polygon(0 0, 100% 0, 80% 40%, 100% 70%, 70% 100%, 0 100%);
            z-index: 1;
        }
        
        .water {
            position: absolute;
            top: 25%;
            right: 0;
            width: 65%;
            height: 35%;
            background-color: #1e4d9b;
            z-index: 2;
        }
        
        .land-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background-color: #3d5c22;
            z-index: 3;
            border-radius: 50% 50% 0 0 / 20% 20% 0 0;
        }
        
        /* Text styling */
        .text-yellow {
            color: #f4d03f;
            font-weight: bold;
        }
        
        .text-white {
            color: #ffffff;
            font-weight: bold;
        }
        
        /* Top text */
        .top-text-1 {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 10;
            text-align: center;
            line-height: 1.1;
        }
        
        .top-text-2 {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 52px;
            letter-spacing: 2px;
            z-index: 10;
        }
        
        .middle-text-1 {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 56px;
            z-index: 10;
        }
        
        .middle-text-2 {
            position: absolute;
            top: 340px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 56px;
            z-index: 10;
        }
        
        .lower-text-1 {
            position: absolute;
            top: 600px;
            left: 60px;
            font-size: 42px;
            z-index: 10;
        }
        
        .lower-text-2 {
            position: absolute;
            top: 650px;
            left: 60px;
            font-size: 64px;
            z-index: 10;
        }
        
        .main-title {
            position: absolute;
            top: 710px;
            left: 20px;
            font-size: 110px;
            line-height: 0.9;
            z-index: 10;
            text-shadow: 4px 4px 0px #1e4d9b;
            letter-spacing: -2px;
        }
        
        .subtitle-1 {
            position: absolute;
            top: 830px;
            left: 30px;
            font-size: 28px;
            z-index: 10;
            line-height: 1.3;
        }
        
        .subtitle-2 {
            position: absolute;
            top: 885px;
            left: 220px;
            font-size: 32px;
            z-index: 10;
        }
        
        .sponsor {
            position: absolute;
            top: 925px;
            left: 140px;
            font-size: 16px;
            z-index: 10;
            letter-spacing: 1px;
        }
        
        .wpa-code {
            position: absolute;
            top: 948px;
            left: 210px;
            font-size: 14px;
            z-index: 10;
            letter-spacing: 2px;
        }
        
        /* Decorative elements */
        .lighthouse {
            position: absolute;
            bottom: 38%;
            left: 30px;
            width: 80px;
            height: 120px;
            background-color: #ffffff;
            z-index: 5;
            clip-path: polygon(30% 0, 70% 0, 85% 100%, 15% 100%);
        }
        
        .lighthouse-top {
            position: absolute;
            bottom: 52%;
            left: 35px;
            width: 70px;
            height: 30px;
            background-color: #ffffff;
            z-index: 6;
            border-radius: 5px 5px 0 0;
        }
        
        .light-beam {
            position: absolute;
            bottom: 45%;
            left: 80px;
            width: 200px;
            height: 150px;
            background: linear-gradient(135deg, transparent 49%, #f4d03f 49%, #f4d03f 51%, transparent 51%);
            transform: rotate(-30deg);
            z-index: 4;
            opacity: 0.9;
        }
        
        .boat {
            position: absolute;
            bottom: 32%;
            right: 40px;
            width: 180px;
            height: 80px;
            background-color: #ffffff;
            z-index: 6;
            clip-path: polygon(20% 100%, 0% 60%, 10% 40%, 90% 20%, 100% 40%, 95% 70%, 80% 100%);
        }
        
        .boat-cabin {
            position: absolute;
            bottom: 36%;
            right: 100px;
            width: 50px;
            height: 40px;
            background-color: #f4d03f;
            z-index: 7;
        }
        
        .buildings {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-30%);
            width: 400px;
            height: 100px;
            background-color: #ffffff;
            z-index: 3;
            opacity: 0.9;
            clip-path: polygon(0% 100%, 0% 40%, 10% 40%, 10% 20%, 20% 20%, 20% 50%, 30% 50%, 30% 30%, 40% 30%, 40% 60%, 50% 60%, 50% 10%, 60% 10%, 60% 50%, 70% 50%, 70% 25%, 80% 25%, 80% 55%, 90% 55%, 90% 35%, 100% 35%, 100% 100%);
        }
        
        .sphere {
            position: absolute;
            top: 150px;
            right: 60px;
            width: 100px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 4;
        }
        
        .tower {
            position: absolute;
            top: 0;
            right: 80px;
            width: 40px;
            height: 160px;
            background-color: #ffffff;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- Background layers -->
        <div class="foliage"></div>
        <div class="buildings"></div>
        <div class="tower"></div>
        <div class="sphere"></div>
        <div class="water"></div>
        <div class="land-bottom"></div>
        
        <!-- Illustrations -->
        <div class="lighthouse"></div>
        <div class="lighthouse-top"></div>
        <div class="light-beam"></div>
        <div class="boat-cabin"></div>
        <div class="boat"></div>
        
        <!-- Text Content -->
        <div class="top-text-1 text-yellow">While visiting</div>
        <div class="top-text-2 text-yellow">THE FAIR</div>
        
        <div class="middle-text-1 text-yellow">commute</div>
        <div class="middle-text-2 text-yellow">by land or water</div>
        
        <div class="lower-text-1 text-white">to</div>
        <div class="lower-text-2 text-white">beautiful</div>
        
        <div class="main-title text-white">SEA CLIFF L.I.</div>
        
        <div class="subtitle-1 text-white">250 feet above sea level. NO MOSQUITOS</div>
        <div class="subtitle-2 text-white">golf and bathing</div>
        
        <div class="sponsor text-white">SPONSORED BY THE VILLAGE OF SEA CLIFF</div>
        <div class="wpa-code text-white">WPA FEDERAL ART PROJECT 0154</div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
