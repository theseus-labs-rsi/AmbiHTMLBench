<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三阶段 认识自我，找到自我</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 20px;
            line-height: 1.6;
            font-size: 16px;
        }
        
        .outline-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }
        
        li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
        }
        
        li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #666666;
            font-weight: bold;
        }
        
        .main-title {
            color: #c0504d;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 12px;
        }
        
        .level-1 > li {
            margin-bottom: 16px;
        }
        
        .level-1 > li::before {
            color: #c0504d;
        }
        
        .level-2 {
            padding-left: 24px;
            margin-top: 8px;
        }
        
        .level-2 > li {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .expand-icon {
            float: right;
            color: #999999;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
            displayMath: []
          },
          svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="outline-container">
        <ul class="level-1">
            <li>
                <div class="title-row">
                    <span class="main-title">第三阶段 认识自我，找到自我</span>
                    <span class="expand-icon">▼</span>
                </div>
                <ul class="level-2">
                    <li>
                        <div class="title-row">
                            <span>不同国家的妆容模仿</span>
                            <span class="expand-icon">▼</span>
                        </div>
                        <ul class="level-2" style="padding-left: 40px; margin-top: 6px;">
                            <li>不同国家妆容特点分析</li>
                            <li>逐个部位模仿</li>
                        </ul>
                    </li>
                    <li>
                        <div class="title-row">
                            <span>明星出圈妆容模仿</span>
                            <span class="expand-icon">▼</span>
                        </div>
                        <ul class="level-2" style="padding-left: 40px; margin-top: 6px;">
                            <li>鞠婧祎妆容</li>
                            <li>虞书欣妆容</li>
                            <li>宋慧乔妆容</li>
                            <li>女团妆容</li>
                            <li>日本杂志妆容</li>
                        </ul>
                    </li>
                    <li>
                        <div class="title-row">
                            <span>找到适合自己的风格和妆容</span>
                            <span class="expand-icon">▼</span>
                        </div>
                        <ul class="level-2" style="padding-left: 40px; margin-top: 6px;">
                            <li>根据自己的穿衣风格，职业，谈吐等确定自己适合的风格</li>
                        </ul>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
