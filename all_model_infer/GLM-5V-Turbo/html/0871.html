<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Poster Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background-color: #FFFBF5;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
        }
        
        .swirl-1 {
            position: absolute;
            top: -5%;
            left: -10%;
            width: 70%;
            height: 50%;
            background: radial-gradient(ellipse at 30% 30%, #FFA54F 0%, rgba(255,165,79,0) 70%);
            filter: blur(40px);
            transform: rotate(-15deg);
        }
        
        .swirl-2 {
            position: absolute;
            top: 10%;
            right: -15%;
            width: 65%;
            height: 75%;
            background: radial-gradient(ellipse at 70% 40%, #FF8C42 0%, rgba(255,140,66,0) 70%);
            filter: blur(45px);
            transform: rotate(20deg);
        }
        
        .swirl-3 {
            position: absolute;
            bottom: -5%;
            left: 5%;
            width: 55%;
            height: 45%;
            background: radial-gradient(ellipse at 50% 80%, #FFCC99 0%, rgba(255,204,153,0) 70%);
            filter: blur(35px);
        }
        
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            color: #E67E22;
            padding: 35px 45px;
        }
        
        .header-left {
            position: absolute;
            top: 28px;
            left: 38px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.7;
            letter-spacing: 1.5px;
        }
        
        .header-right {
            position: absolute;
            top: 28px;
            right: 38px;
            text-align: right;
            font-weight: bold;
        }
        
        .title-main {
            font-size: 34px;
            letter-spacing: 3px;
            margin-bottom: 6px;
            line-height: 1.1;
        }
        
        .title-sub {
            font-size: 19px;
            letter-spacing: 2px;
            margin-bottom: 18px;
            font-weight: normal;
        }
        
        .chinese-text {
            font-size: 11px;
            line-height: 2;
            letter-spacing: 3px;
            font-weight: normal;
        }
        
        .vertical-left {
            position: absolute;
            left: 38px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: center center;
            display: flex;
            gap: 55px;
            align-items: center;
            white-space: nowrap;
        }
        
        .text-three-thousand {
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 10px;
            line-height: 1;
        }
        
        .text-i-love-you {
            font-size: 46px;
            font-weight: bold;
            letter-spacing: 8px;
            line-height: 1;
        }
        
        .vertical-right {
            position: absolute;
            right: 48px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 11px;
            letter-spacing: 5px;
            white-space: nowrap;
            font-weight: normal;
        }
        
        .quote-section {
            position: absolute;
            bottom: 85px;
            right: 115px;
            text-align: right;
            font-size: 13px;
            line-height: 1.7;
            font-style: italic;
            font-weight: normal;
        }
        
        .footer-box {
            position: absolute;
            bottom: 32px;
            right: 115px;
            border: 2.5px solid #E67E22;
            padding: 7px 18px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="background-layer">
        <div class="swirl-1"></div>
        <div class="swirl-2"></div>
        <div class="swirl-3"></div>
    </div>
    
    <div class="content">
        <div class="header-left">
            <div>11/07</div>
            <div>DESIGNED BY</div>
            <div>KERLLEE</div>
        </div>
        
        <div class="header-right">
            <div class="title-main">BRIEFE IS LIFE</div>
            <div class="title-sub">BUT LOVE IS LONG</div>
            <div class="chinese-text">
                <div>朝暮与年岁并往，愿我们偕行</div>
                <div>爱你三千遍</div>
            </div>
        </div>
        
        <div class="vertical-left">
            <div class="text-three-thousand">THREE THOUSAND</div>
            <div class="text-i-love-you">I LOVE YOU</div>
        </div>
        
        <div class="vertical-right">AUGENSTERN</div>
        
        <div class="quote-section">
            <div>Life was like a box of chocolates,</div>
            <div>you never know what you are gonna get.</div>
        </div>
        
        <div class="footer-box">YOU GOTTA HAVE LITTLE FAITH</div>
    </div>
</body>
</html>
