<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vol 106: 招商手册写作/创作全流程SOP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #0a0e27;
            background-image: radial-gradient(circle at 50% 50%, #1a1f4e 0%, #0a0e27 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Dotted pattern overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .vol-tag {
            display: inline-block;
            background: transparent;
            border: 2px solid #5b5fc7;
            color: #fff;
            padding: 8px 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            position: relative;
        }

        .vol-tag::after {
            content: '■ ■ ■ ■ ■';
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            color: #5b5fc7;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .main-headline {
            color: #ffd700;
            font-size: 32px;
            font-weight: 900;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
            margin-bottom: 5px;
        }

        .sub-headline {
            color: #ffd700;
            font-size: 28px;
            font-weight: 900;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }

        /* Main Card */
        .main-card {
            background: #ffffff;
            border-radius: 30px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            min-height: 600px;
        }

        /* Geometric Shapes */
        .shape-purple-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 55%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-bottom-right-radius: 100px;
            z-index: 1;
        }

        .shape-blue-small {
            position: absolute;
            top: 80px;
            left: 42%;
            width: 120px;
            height: 40px;
            background: #3b82f6;
            transform: skewX(-20deg);
            z-index: 2;
        }

        .shape-teal {
            position: absolute;
            bottom: 180px;
            left: 100px;
            width: 200px;
            height: 120px;
            background: #14b8a6;
            clip-path: polygon(0% 100%, 30% 0%, 70% 100%);
            z-index: 1;
        }

        .shape-green-left {
            position: absolute;
            bottom: 150px;
            left: 0;
            width: 80px;
            height: 80px;
            background: #86efac;
            border-top-right-radius: 60px;
            z-index: 1;
        }

        .shape-green-right {
            position: absolute;
            top: 280px;
            right: 0;
            width: 100px;
            height: 140px;
            background: #86efac;
            border-bottom-left-radius: 80px;
            z-index: 1;
        }

        .shape-purple-bottom {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 65%;
            height: 55%;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            border-top-left-radius: 100px;
            z-index: 1;
        }

        .shape-blue-bottom {
            position: absolute;
            bottom: 0;
            left: 100px;
            width: 140px;
            height: 70px;
            background: #3b82f6;
            clip-path: polygon(0% 0%, 100% 100%, 0% 100%);
            z-index: 2;
        }

        /* Content Layer */
        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Title Section */
        .title-section {
            padding-top: 60px;
            padding-right: 40px;
            text-align: right;
            margin-bottom: 80px;
        }

        .year {
            font-size: 48px;
            font-weight: bold;
            color: #7c3aed;
            line-height: 1;
            margin-bottom: 10px;
        }

        .main-title {
            font-size: 32px;
            font-weight: bold;
            color: #7c3aed;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 20px;
            color: #374151;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .tag-pill {
            display: inline-block;
            background: #7c3aed;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Table of Contents */
        .toc-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-left: 20px;
        }

        .toc-label {
            flex-shrink: 0;
            margin-right: 40px;
            padding-top: 10px;
        }

        .toc-chinese {
            font-size: 48px;
            font-weight: bold;
            color: #1f2937;
            line-height: 1;
            margin-bottom: 5px;
        }

        .toc-english {
            font-size: 12px;
            color: #6b7280;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .toc-list {
            flex-grow: 1;
            list-style: none;
        }

        .toc-item {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: 600;
        }

        .toc-number {
            font-size: 28px;
            font-weight: bold;
            margin-right: 15px;
            min-width: 40px;
            color: #fff;
        }

        .toc-text {
            color: #fff;
        }

        /* Side decorative text */
        .side-text {
            position: fixed;
            writing-mode: vertical-rl;
            text-orientation: upright;
            color: rgba(91, 95, 199, 0.6);
            font-size: 14px;
            letter-spacing: 8px;
            font-weight: bold;
            z-index: 0;
        }

        .side-text.left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-text.right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Bottom text strip */
        .bottom-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 39, 0.9);
            color: #5b5fc7;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

        <div class="header-section">

            <h1 class="main-headline">招商手册写作一全流程SOP</h1>

        <div class="main-card">
            <!-- Geometric Shapes -->
            <div class="shape-purple-top"></div>

            <div class="content-layer">

                <div class="title-section">

                <div class="toc-container">

                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Strip -->
    <div class="bottom-strip">

    <script>

</body>
