<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中药露剂配方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        .document-frame {
            background-color: #f4cece;
            width: 100%;
            max-width: 580px;
            border: 1px solid #888;
            padding: 70px 55px 60px 50px;
            position: relative;
            color: #3a3a3a;
            line-height: 1.9;
        }
        
        .recipe-section {
            margin-bottom: 45px;
        }
        
        .recipe-title {
            font-size: 21px;
            font-weight: normal;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        
        .recipe-item {
            font-size: 19px;
            margin-bottom: 12px;
            padding-left: 5px;
        }
        
        .footer-note {
            position: absolute;
            bottom: 18px;
            left: 25px;
            font-size: 13px;
            color: #666;
            letter-spacing: 0.5px;
        }
        
        .app-watermark {
            position: absolute;
            bottom: 18px;
            right: 25px;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="document-frame">
        <div class="recipe-section">
            <div class="recipe-title">△桂花露</div>
            <div class="recipe-item">【功用】开胃消食，宽胸化痰</div>
            <div class="recipe-item">【药物】桂花500克</div>
            <div class="recipe-item">【制法】于9月底开花时采收，阴于，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</div>
        </div>
        
        <div class="recipe-section">
            <div class="recipe-title">△荷花露</div>
            <div class="recipe-item">【功用】清暑凉营</div>
            <div class="recipe-item">【药物】白荷花500克</div>
            <div class="recipe-item">【制法】取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</div>
        </div>
        
        <div class="footer-note">[中国色：藕荷]</div>
        <div class="app-watermark">图治APP</div>
    </div>
</body>
</html>
