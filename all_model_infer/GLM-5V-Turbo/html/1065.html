<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你能接受孩子的平庸吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
            color: #333;
            padding-bottom: 60px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background-color: #fff;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 500;
            color: #333;
            flex: 1;
        }
        
        .back-arrow {
            font-size: 20px;
            color: #333;
            cursor: pointer;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .write-answer {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #576b95;
            font-size: 15px;
            cursor: pointer;
        }
        
        .edit-icon {
            width: 18px;
            height: 18px;
            border: 2px solid #576b95;
            border-radius: 2px;
            position: relative;
        }
        
        .edit-icon::before {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 2px;
            width: 8px;
            height: 2px;
            background-color: #576b95;
        }
        
        .more-dots {
            font-size: 20px;
            color: #666;
            cursor: pointer;
            letter-spacing: 2px;
        }
        
        /* Content */
        .content {
            padding: 20px 20px 30px;
        }
        
        .paragraph {
            margin-bottom: 18px;
            font-size: 16px;
            line-height: 1.7;
            text-align: justify;
            color: #333;
        }
        
        .highlighted {
            background-color: #ffecec;
            padding: 4px 0;
            display: inline;
        }
        
        /* Footer Meta */
        .footer-meta {
            padding: 0 20px 20px;
            font-size: 13px;
            color: #999;
            line-height: 1.6;
        }
        
        /* Share Bar */
        .share-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0;
            z-index: 200;
        }
        
        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 12px;
        }
        
        .share-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }
        
        .wechat-icon {
            background-color: #07c160;
        }
        
        .moments-icon {
            background: linear-gradient(135deg, #fa9d3b, #ff6b35);
        }
        
        .qq-icon {
            background-color: #12b7f5;
        }
        
        .share-icon-img {
            background-color: #576b95;
        }
        
        .share-text {
            font-size: 11px;
            color: #666;
        }
        
        /* Superscript for author note */
        sup {
            font-size: 0.75em;
            vertical-align: super;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="back-arrow">&lt;</span>
                <span>你能接受孩子的平庸吗？</span>
            </div>
            <div class="header-right">
                <div class="write-answer">
                    <div class="edit-icon"></div>
                    <span>写回答</span>
                </div>
                <span class="more-dots">···</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <p class="paragraph">
                以上是我最近在读的一本书，作家刘继荣<sup>○</sup><br>
                《坐在路边鼓掌的人》里面讲的小故事。
            </p>
            
            <p class="paragraph">
                <span class="highlighted">天下有多少雄心勃勃的父母，奢望自己的孩子既能做顶天立地的栋梁，又能开繁花结硕果。我们的欲望有多深，孩子就有多累。</span>
            </p>
            
            <p class="paragraph">
                如果孩子能自己找到出路，快乐与成就兼得，如果能平庸而幸福地过一生，父母又何必强求。
            </p>
            
            <p class="paragraph">
                如果他们健康、快乐，如果那是他们想要的生活，我们的孩子，又何妨做一个普通人。
            </p>
        </div>

        <!-- Footer Meta -->
        <div class="footer-meta">
            编辑于 2023-03-03 10:44 • IP 属地江苏
        </div>
    </div>

    <!-- Share Bar -->
    <div class="share-bar">
        <div class="share-item">
            <div class="share-icon wechat-icon">微</div>
            <span class="share-text">微信</span>
        </div>
        <div class="share-item">
            <div class="share-icon moments-icon">圈</div>
            <span class="share-text">朋友圈</span>
        </div>
        <div class="share-item">
            <div class="share-icon qq-icon">Q</div>
            <span class="share-text">QQ</span>
        </div>
        <div class="share-item">
            <div class="share-icon share-icon-img">图</div>
            <span class="share-text">图片分享</span>
        </div>
    </div>

    <!-- MathJax Script -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
