<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #ffffff;
            color: #222222;
            padding: 20px 16px;
            line-height: 1.6;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding: 0 4px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #D4A84E;
            font-size: 19px;
            font-weight: 500;
        }
        
        .back-icon {
            width: 20px;
            height: 20px;
            border-left: 2.5px solid #D4A84E;
            border-bottom: 2.5px solid #D4A84E;
            transform: rotate(45deg);
            margin-left: 2px;
        }
        
        .header-right {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .nav-icon {
            width: 26px;
            height: 26px;
            border: 2px solid #D4A84E;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-icon.people::after {
            content: "";
            width: 12px;
            height: 6px;
            border: 2px solid #D4A84E;
            border-top: none;
            border-radius: 0 0 6px 6px;
            position: absolute;
            top: 8px;
        }
        
        .nav-icon.people::before {
            content: "";
            width: 6px;
            height: 6px;
            background: #D4A84E;
            border-radius: 50%;
            position: absolute;
            top: 6px;
        }
        
        .nav-icon.upload::after {
            content: "";
            width: 10px;
            height: 10px;
            border-top: 2.5px solid #D4A84E;
            border-right: 2.5px solid #D4A84E;
            transform: translateY(2px) rotate(-45deg);
        }
        
        .nav-icon.more::after {
            content: "•••";
            color: #D4A84E;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: bold;
            transform: translateY(-1px);
        }
        
        .section {
            margin-bottom: 36px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .check-circle {
            width: 24px;
            height: 24px;
            background-color: #F7C948;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .check-circle::after {
            content: "✓";
            color: white;
            font-size: 15px;
            font-weight: 600;
            margin-top: -1px;
        }
        
        .section-title {
            font-size: 18px;
            color: #222222;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        
        .quote-body {
            font-size: 16px;
            line-height: 1.75;
            color: #222222;
            text-align: justify;
            padding-left: 36px;
            margin-bottom: 6px;
        }
        
        .quote-source {
            font-size: 15px;
            color: #555555;
            text-align: right;
            padding-left: 36px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="back-icon"></div>
            <span>金句合集</span>
        </div>
        <div class="header-right">
            <div class="nav-icon people"></div>
            <div class="nav-icon upload"></div>
            <div class="nav-icon more"></div>
        </div>
    </header>

    <main>
        <article class="section">
            <div class="section-header">
                <div class="check-circle"></div>
                <h2 class="section-title">他写「成长」，正是你所亲历</h2>
            </div>
            <blockquote class="quote-body">
                “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永远驻进我的灵魂，雕琢我，塑造我，锤炼我，融入我而成为我。”
            </blockquote>
            <cite class="quote-source">——《病隙碎笔》</cite>
        </article>

        <article class="section">
            <div class="section-header">
                <div class="check-circle"></div>
                <h2 class="section-title">他写「磨难」，报之以歌</h2>
            </div>
            <blockquote class="quote-body">
                “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”
            </blockquote>
            <cite class="quote-source">——《好运设计》</cite>
        </article>
    </main>
</body>
</html>
