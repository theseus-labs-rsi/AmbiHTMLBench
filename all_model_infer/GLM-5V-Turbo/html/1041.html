<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用暗示的积极力量养出优秀孩子</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            background-color: #ffffff;
            margin: 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
        }
        
        .title-box {
            border: 2px solid #7B8BB0;
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 25px;
            text-align: center;
            background-color: #E8EDF5;
        }
        
        .title-box h1 {
            margin: 0;
            font-size: 26px;
            color: #333;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 22px;
            color: #000;
            margin-bottom: 15px;
            padding-left: 5px;
        }
        
        .content-box {
            background-color: #DDE4F0;
            border: 1px solid #AAB4C9;
            padding: 20px 25px;
            border-radius: 3px;
        }
        
        .item-pair {
            margin-bottom: 14px;
            line-height: 1.6;
        }
        
        .item-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
            font-size: 19px;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 20px;
        }
        
        .cross {
            color: #CC0000;
        }
        
        .check {
            color: #00AA00;
        }
        
        .text-content {
            color: #4B0082;
        }
        
        .negative-text {
            color: #333;
        }
        
        .positive-text {
            color: #4B0082;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">
            <h1>用暗示的积极力量养出优秀孩子</h1>
        </div>
        
        <div class="subtitle">学习上，让孩子体验一个个小成功</div>
        
        <div class="content-box">
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">你磨蹭半天了，没写几个字，再磨下去就别睡了</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">越早完成作业，休息的时间就越多！</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">这么简单的题都不会做？</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">这道题你觉得难，不太会是吗？</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">赶紧写作业，一点都不自觉</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">你很少忘记写作业的，如果需要帮助就告诉我。</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">你这孩子怎么这么犟呢，你要听话</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">你可以说“不”，但我想听听你的理由理解你。</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">你怎么这么烦人呢，就不能安静一会儿吗？</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">你自己先去玩一会，妈妈忙完就马上找你。</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">勇敢点，这有什么的啊？</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">我相信你行的，再试试看，我陪着你</span>
                </div>
            </div>
            
            <div class="item-pair">
                <div class="item-row">
                    <span class="icon cross">✖</span>
                    <span class="text-content negative-text">快点走，再拖拖拉拉你就别出去了。</span>
                </div>
                <div class="item-row">
                    <span class="icon check">✔</span>
                    <span class="text-content positive-text">我们来比一比，看谁更快出门。</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
