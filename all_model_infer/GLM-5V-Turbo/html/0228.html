<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Sustainability Summit</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: #1a5d1a;
}

.container {
  display: flex;
  width: 100%;
  height: 100%;
  position: relative;
}

.left-panel {
  flex: 1;
  background-color: #e8e4c9;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 80px 60px;
  overflow: hidden;
  z-index: 2;
}

.right-panel {
  flex: 1;
  background-color: #1a7a3f;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Vertical Title Styling */
.title-wrapper {
  flex: 1;
  display: flex;
  align-items: flex-start;
  padding-top: 40px;
}

.vertical-title {
  font-size: 88px;
  font-weight: 800;
  color: #1a5d1a;
  line-height: 0.85;
  letter-spacing: -4px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  height: fit-content;
}

/* Registration Section */
.registration-section {
  margin-top: auto;
  margin-bottom: 60px;
  position: relative;
  z-index: 10;
}

.section-label {
  color: #4caf50;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.price-row {
  margin-bottom: 18px;
}

.ticket-type {
  font-size: 17px;
  color: #2c2c2c;
  margin-bottom: 4px;
  font-weight: 500;
}

.price-amount {
  font-size: 32px;
  font-weight: 700;
  color: #1a5d1a;
}

/* Visit Section */
.visit-section {
  position: relative;
  z-index: 10;
  margin-bottom: 40px;
}

.visit-url {
  font-size: 16px;
  line-height: 1.5;
  color: #2c2c2c;
  max-width: 320px;
}

/* Bottom Curves Decoration */
.curve-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 35%;
  pointer-events: none;
}

.curve-shape-1 {
  position: absolute;
  bottom: -20%;
  left: -10%;
  width: 65%;
  height: 150%;
  background-color: #1a7a3f;
  border-radius: 50%;
  z-index: 1;
}

.curve-shape-2 {
  position: absolute;
  bottom: -20%;
  right: -15%;
  width: 55%;
  height: 140%;
  background-color: #1a7a3f;
  border-radius: 50%;
  z-index: 1;
}

/* Right Panel Content */
.logo-area {
  position: absolute;
  top: 35px;
  right: 40px;
  color: white;
  font-weight: 700;
  font-size: 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 20;
}

.logo-icon {
  font-size: 18px;
  color: white;
}

.tree-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin-top: 60px;
}

.tree-placeholder {
  width: 140%;
  height: auto;
  min-height: 70%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(1.05) contrast(1.05);
}

/* Bottom Info Circle */
.info-circle {
  position: absolute;
  bottom: -12%;
  right: -8%;
  width: 95%;
  height: 75%;
  background-color: #52b788;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 48%;
  padding-right: 8%;
  z-index: 15;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.info-group {
  margin-bottom: 28px;
}

.info-title {
  color: #a7e4c4;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.info-details {
  color: white;
  font-size: 16px;
  line-height: 1.5;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="container">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="title-wrapper">
      <h1 class="vertical-title">Global<br>Sustainability<br>Summit</h1>
    </div>
    
    <div class="registration-section">
      <div class="section-label">REGISTRATION</div>
      
      <div class="price-row">
        <div class="ticket-type">General Admission</div>
        <div class="price-amount">$350</div>
      </div>
      
      <div class="price-row">
        <div class="ticket-type">Students & Nonprofits</div>
        <div class="price-amount">$200</div>
      </div>
    </div>
    
    <div class="visit-section">
      <div class="section-label">VISIT</div>
      <div class="visit-url">www.yourwebsite.com for more details and to register today!</div>
    </div>
    
    <!-- Decorative Curves -->
    <div class="curve-container">
      <div class="curve-shape-1"></div>
      <div class="curve-shape-2"></div>
    </div>
  </div>
  
  <!-- Right Panel -->
  <div class="right-panel">
    <div class="logo-area">
      Your<span class="logo-icon">✿</span>LOGO<sup style="font-size: 12px;">®</sup>
    </div>
    
    <div class="tree-wrapper">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Crect fill='%231a7a3f' width='600' height='800'/%3E%3Cg opacity='0.9'%3E%3Cpath d='M300 650 Q280 550 260 450 Q240 350 220 250 Q200 150 300 100 Q400 150 380 250 Q360 350 340 450 Q320 550 300 650 Z' fill='%232d5016' stroke='%231a3d0c' stroke-width='2'/%3E%3Cpath d='M300 650 L290 750 Q295 780 300 800 Q305 780 310 750 Z' fill='%235d4037'/%3E%3Ccircle cx='300' cy='650' r='15' fill='%234e342e'/%3E%3C/g%3E%3Ctext x='300' y='400' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-size='24' opacity='0.7'%3E[Tree Image Placeholder]%3C/text%3E%3C/svg%3E" alt="Large pine tree representing sustainability" class="tree-placeholder">
    </div>
    
    <div class="info-circle">
      <div class="info-group">
        <div class="info-title">DATE</div>
        <div class="info-details">
          27 January 2026<br>
          10:00 PM
        </div>
      </div>
      
      <div class="info-group">
        <div class="info-title">LOCATION</div>
        <div class="info-details">
          Grand Hall, Convention<br>
          Center, Chicago, IL
        </div>
      </div>
    </div>
  </div>
</div>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
    displayMath: []
  },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

</body>
</html>
