<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江戸時代のやきもの - 湯木美術館</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
            background-color: #f5f3ef;
            width: 100vw;
            height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            display: flex;
            width: 100%;
            max-width: 900px;
            height: auto;
            aspect-ratio: 0.7;
            background-color: #f5f3ef;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .left-content {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        
        .right-sidebar {
            width: 180px;
            background-color: #2c4a52;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 25px;
        }
        
        .header-text {
            font-size: 14px;
            letter-spacing: 0.05em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #333;
        }
        
        .main-title {
            font-size: 110px;
            line-height: 1.1;
            font-weight: normal;
            writing-mode: horizontal-tb;
            margin-bottom: 10px;
            font-family: "Yu Kyokasho", "Kouzan Sho", cursive, serif;
            letter-spacing: 0.05em;
            color: #1a1a1a;
        }
        
        .english-subtitle {
            font-size: 16px;
            color: #555;
            font-family: Georgia, serif;
            letter-spacing: 0.08em;
            margin-top: -10px;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        .subtitle-text {
            font-size: 28px;
            line-height: 1.5;
            letter-spacing: 0.05em;
            margin-bottom: 40px;
            color: #222;
        }
        
        .date-info {
            font-size: 18px;
            letter-spacing: 0.03em;
            margin-bottom: auto;
            color: #333;
        }
        
        .venue-section {
            margin-top: auto;
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
        
        .venue-name-jp {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }
        
        .venue-name-en {
            font-size: 13px;
            letter-spacing: 0.15em;
            color: #444;
            margin-bottom: 12px;
            font-family: Georgia, serif;
        }
        
        .venue-details {
            font-size: 11px;
            line-height: 1.7;
            color: #555;
            letter-spacing: 0.02em;
        }
        
        .ceramic-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .ceramic-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        .ceramic-caption {
            font-size: 9px;
            color: #e0e0e0;
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.02em;
            max-width: 150px;
        }
        
        .bottom-ceramic {
            position: absolute;
            bottom: 80px;
            left: 120px;
            width: 130px;
            z-index: 10;
        }
        
        .bottom-ceramic img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                aspect-ratio: auto;
                min-height: auto;
            }
            
            .right-sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 20px;
            }
            
            .main-title {
                font-size: 60px;
            }
            
            .ceramic-image {
                width: 100px;
                height: 100px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <div class="left-content">
            <div class="top-section">
                <div class="header-text">
                    いと目でわかる京焼300年の歴史<br>
                    平成29年春季展
                </div>
                
                <div class="main-title">
                    江戸<br>時代の<br>やきもの
                </div>
                
                <div class="english-subtitle">
                    Ceramics of the Edo Period
                </div>
                
                <div class="subtitle-text">
                    仁清・乾山窯と<br>
                    後期京焼の<br>
                    食器を中心に
                </div>
                
                <div class="date-info">
                    平成29年4月8日(土)～7月30日(日)
                </div>
            </div>
            
            <div class="venue-section">
                <div class="venue-name-jp">湯木美術館</div>
                <div class="venue-name-en">YUKI MUSEUM OF ART</div>
                <div class="venue-details">
                    〒542-0066 大阪市中央区瓦屋町3-5<br>
                    TEL:06-6231-7180 FAX:06-6231-7190<br>
                    http://www.yukimuseum.jp/
                </div>
            </div>
            
            <div class="bottom-ceramic">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%23222'/%3E%3Cpath d='M70 90 Q100 70 130 90 Q130 130 100 145 Q70 130 70 90' fill='%23c44' stroke='%23933' stroke-width='2'/%3E%3C/svg%3E" alt="赤色の陶磁器">
            </div>
        </div>
        
        <div class="right-sidebar">
            <div class="ceramic-item">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 160'%3E%3Cellipse cx='100' cy='80' rx='85' ry='65' fill='%23d4c5b0' stroke='%23554' stroke-width='2'/%3E%3Cpath d='M40 60 Q100 30 160 60' stroke='%23333' stroke-width='3' fill='none'/%3E%3Ccircle cx='80' cy='75' r='8' fill='%23333'/%3E%3Ccircle cx='120' cy='75' r='8' fill='%23333'/%3E%3C/svg%3E" alt="茶碗" class="ceramic-image">
                <div class="ceramic-caption">乾山窯「風流図手蓋付茶碗」</div>
            </div>
            
            <div class="ceramic-item">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 170'%3E%3Cpath d='M30 100 Q100 20 170 100 Q170 150 100 165 Q30 150 30 100' fill='%23f5f0e8' stroke='%23666' stroke-width='2'/%3E%3Cpath d='M60 80 Q100 50 140 80' stroke='%23444' stroke-width='4' fill='none'/%3E%3Cpath d='M80 95 L80 135 M120 95 L120 135' stroke='%23444' stroke-width='3'/%3E%3Ccircle cx='100' cy='125' r='15' fill='%23689' opacity='0.6'/%3E%3C/svg%3E" alt="鉢" class="ceramic-image">
                <div class="ceramic-caption">[仁清風]魚「南天画文鉢」</div>
            </div>
            
            <div class="ceramic-item">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 140'%3E%3Cellipse cx='100' cy='90' rx='75' ry='45' fill='%23888' stroke='%23444' stroke-width='2'/%3E%3Cpath d='M50 80 Q100 60 150 80' stroke='%23333' stroke-width='2' fill='none' opacity='0.5'/%3E%3Cpath d='M70 85 L70 105 M130 85 L130 105' stroke='%23333' stroke-width='1.5' opacity='0.4'/%3E%3C/svg%3E" alt="向付" class="ceramic-image">
                <div class="ceramic-caption">幸入「山水画文」五寸向付</div>
            </div>
            
            <div class="ceramic-item">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 200'%3E%3Cellipse cx='110' cy='140' rx='100' ry='50' fill='%23d4b896' stroke='%23886' stroke-width='2'/%3E%3Cellipse cx='110' cy='115' rx='95' ry='35' fill='%23c4a882' stroke='%23886' stroke-width='1.5'/%3E%3Ccircle cx='110' cy='115' r='25' fill='%23b49872' stroke='%23776' stroke-width='1'/%3E%3Crect x='90' y='108' width='40' height='14' rx='3' fill='%23a07858'/%3E%3C/svg%3E" alt="飾皿" class="ceramic-image">
                <div class="ceramic-caption">銅製代蓋「素三」御所丸文飾皿 東京国立博物館</div>
            </div>
        </div>
    </div>
</body>
</html>
