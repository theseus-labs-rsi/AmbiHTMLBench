<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children's Book Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #fefefe;
            font-family: "Songti SC", "SimSun", "STSong", serif;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .page-container {
            max-width: 800px;
            width: 100%;
            background-color: #fff;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .text-content {
            font-size: 22px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: justify;
            letter-spacing: 1px;
        }
        
        .text-content p {
            margin: 0;
            text-indent: 0;
        }
        
        .illustration {
            width: 100%;
            height: 400px;
            border: 2px solid #5a9e6f;
            background: linear-gradient(to bottom, #fff9e6 0%, #fffff0 100%);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .window-frame {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            border: 12px solid #5a9e6f;
            box-sizing: border-box;
        }
        
        .window-pane {
            flex: 1;
            border-right: 8px solid #5a9e6f;
            position: relative;
            background: rgba(255,255,240,0.5);
        }
        
        .window-pane:last-child {
            border-right: none;
        }
        
        .window-pane.center {
            background-image: 
                linear-gradient(45deg, transparent 48%, #a8c9b8 49%, #a8c9b8 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #a8c9b8 49%, #a8c9b8 51%, transparent 52%);
            background-size: 30px 30px;
            opacity: 0.6;
        }
        
        .curtain {
            position: absolute;
            top: 0;
            left: 10px;
            right: 10px;
            height: 60px;
            background: repeating-linear-gradient(
                90deg,
                #f5f5dc,
                #f5f5dc 10px,
                #ebebd0 10px,
                #ebebd0 20px
            );
            border-bottom: 2px solid #d4d4aa;
            z-index: 2;
        }
        
        .character-left {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 120px;
            height: 150px;
            background: rgba(200,220,255,0.3);
            border-radius: 50% 50% 45% 45%;
            border: 2px dashed #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .character-right {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 140px;
            height: 180px;
            background: rgba(255,200,200,0.3);
            border-radius: 50% 50% 45% 45%;
            border: 2px dashed #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        .flowers {
            position: absolute;
            top: -15px;
            right: 80px;
            width: 300px;
            height: 80px;
            z-index: 3;
        }
        
        .flower-branch {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #c8a882 0%, transparent 70%);
            opacity: 0.6;
        }
        
        .caption {
            text-align: center;
            font-size: 16px;
            color: #888;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="text-content">
            <p>“胖胖,中午好!”丫丫一进屋就看见了胖胖,</p>
            <p>胖胖害羞地冲丫丫笑。“阿姨,胖胖是用微</p>
            <p>笑来和我打招呼的!”听到丫丫的话,</p>
            <p>大家都笑了起来。</p>
        </div>
        
        <div class="illustration">
            <div class="window-frame">
                <div class="window-pane">
                    <div class="curtain"></div>
                    <div class="character-left">[鸭妈妈和小鸭子]</div>
                </div>
                <div class="window-pane center">
                    <div class="curtain"></div>
                </div>
                <div class="window-pane">
                    <div class="curtain"></div>
                    <div class="character-right">[猪阿姨抱着胖胖]</div>
                </div>
            </div>
            <div class="flowers">
                <div class="flower-branch"></div>
            </div>
        </div>
        <div class="caption">[插图：窗边的场景，左侧是鸭子角色，右侧是猪角色]</div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
