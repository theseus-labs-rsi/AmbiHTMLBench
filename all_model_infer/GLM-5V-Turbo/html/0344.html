<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 40px;
            background-color: #ffffff;
        }
        
        h1 {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #000000;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000000;
            font-size: 14px;
        }
        
        th, td {
            border: 1px solid #000000;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }
        
        th {
            background-color: #f5f5f5;
            font-weight: normal;
        }
        
        tr:nth-child(even) {
            background-color: #f0f7ff;
        }
        
        .title-cell {
            text-align: left;
            padding-left: 15px;
        }
    </style>
    <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
            displayMath: []
          },
          svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

<h1>一月-任务</h1>

<table>
    <thead>
        <tr>
            <th style="width: 8%;">序号</th>
            <th style="width: 18%;">任务描述</th>
            <th style="width: 12%;">岗位</th>
            <th style="width: 25%;">操作动作</th>
            <th style="width: 17%;">开始时间</th>
            <th style="width: 20%;">备注</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td class="title-cell">租厂房</td>
            <td>总经理</td>
            <td>申请60w租厂房</td>
            <td>1月1日</td>
            <td>花60w租A厂房</td>
        </tr>
        <tr>
            <td>2</td>
            <td class="title-cell">资质开发</td>
            <td>总经理</td>
            <td>P3资质开发</td>
            <td>1月1日</td>
            <td>申请20w资质开发</td>
        </tr>
        <tr>
            <td>3</td>
            <td class="title-cell">批拨款</td>
            <td>财务</td>
            <td>批准</td>
            <td>1月1日</td>
            <td></td>
        </tr>
        <tr>
            <td>4</td>
            <td class="title-cell">支付管理费</td>
            <td>财务</td>
            <td>5w管理费</td>
            <td>1月1日</td>
            <td></td>
        </tr>
        <tr>
            <td>5</td>
            <td class="title-cell">建设生产线</td>
            <td>生产</td>
            <td>4条自动线生产P3</td>
            <td>1月1日</td>
            <td>申请200w资金建线</td>
        </tr>
        <tr>
            <td>6</td>
            <td class="title-cell">iso开发</td>
            <td>总经理</td>
            <td>两个iso的开发</td>
            <td>1月1日</td>
            <td>申请资金开发</td>
        </tr>
    </tbody>
</table>

</body>
</html>
