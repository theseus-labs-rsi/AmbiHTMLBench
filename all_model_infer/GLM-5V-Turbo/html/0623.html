<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音 VS 快手 - 产品小课堂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #E8D4A0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #FFFFFF;
            position: relative;
            padding-bottom: 40px;
        }
        
        /* Header Styles */
        .header {
            text-align: center;
            padding-top: 30px;
            position: relative;
        }
        
        .main-title {
            font-size: 48px;
            font-weight: 900;
            color: #5D4037;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
            margin-bottom: 15px;
            text-shadow: 
                3px 3px 0 #fff,
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                1px 1px 0 #fff,
                2px 2px 0 #5D4037;
        }
        
        .subtitle-container {
            position: relative;
            display: inline-block;
            margin-top: -10px;
        }
        
        .subtitle-bg {
            background-color: #F4D03F;
            padding: 12px 50px;
            border-radius: 30px;
            border: 3px solid #5D4037;
            box-shadow: 3px 3px 0 rgba(93, 64, 55, 0.3);
        }
        
        .subtitle {
            font-size: 28px;
            font-weight: bold;
            color: #5D4037;
        }
        
        .paintbrush-icon {
            position: absolute;
            left: -60px;
            top: -20px;
            width: 80px;
            height: 80px;
            transform: rotate(-25deg);
        }
        
        .paintbrush-icon::before {
            content: '🖌️';
            font-size: 50px;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2));
        }
        
        .yellow-bar {
            position: absolute;
            right: 0;
            top: 80px;
            width: 120px;
            height: 35px;
            background-color: #F4B942;
            opacity: 0.9;
        }
        
        /* Section Styles */
        .section {
            padding: 25px 20px 0 20px;
            position: relative;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
        }
        
        .section-number {
            width: 45px;
            height: 45px;
            background-color: #5D4037;
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #5D4037;
            flex-grow: 1;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100px;
            height: 6px;
            background-color: #F4D03F;
        }
        
        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        
        th {
            background-color: #F4C430;
            color: #5D4037;
            font-weight: bold;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #E6B800;
            font-size: 13px;
        }
        
        td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #E0E0E0;
            color: #333;
            line-height: 1.4;
            vertical-align: middle;
        }
        
        tr:nth-child(even) {
            background-color: #FFF9E6;
        }
        
        tr:nth-child(odd) {
            background-color: #FFFEF5;
        }
        
        td:first-child {
            font-weight: bold;
            color: #5D4037;
            background-color: #FFF8DC;
        }
        
        /* Bottom Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18px;
            background-color: #F4B942;
        }
        
        .divider-line {
            width: 100px;
            height: 4px;
            background-color: #F4D03F;
            margin: 20px auto 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="yellow-bar"></div>
        
        <div class="header">
            <h1 class="main-title">抖音 VS 快手</h1>
            
            <div class="subtitle-container">
                <div class="paintbrush-icon"></div>
                <div class="subtitle-bg">
                    <span class="subtitle">产品小课堂</span>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <div class="section-number">03</div>
                <div class="section-title">抖音与快手</div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;"></th>
                        <th style="width: 17%;">slogan</th>
                        <th style="width: 17%;">产品定位</th>
                        <th style="width: 28%;">策略</th>
                        <th style="width: 23%;">变现</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>抖音</td>
                        <td>记录美好生活</td>
                        <td>短视频媒体</td>
                        <td>以优质内容为中心</td>
                        <td>广告收入、电商</td>
                    </tr>
                    <tr>
                        <td>快手</td>
                        <td>拥抱每一种生活</td>
                        <td>短视频社区</td>
                        <td>以社交中心、大部分流量</td>
                        <td>直播收入、电商</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <div class="section-header">
                <div class="section-number">04</div>
                <div class="section-title">抖音电商与快手电商</div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;"></th>
                        <th style="width: 55%;">产品定位</th>
                        <th style="width: 25%;">重点指标</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>抖音电商</td>
                        <td>兴趣逻辑，内容场景刺激需求</td>
                        <td>直播间GPM</td>
                    </tr>
                    <tr>
                        <td>快手电商</td>
                        <td>信任逻辑，头部主播优势</td>
                        <td>复购</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="divider-line"></div>
        </div>
        
        <div class="bottom-bar"></div>
    </div>
</body>
</html>
