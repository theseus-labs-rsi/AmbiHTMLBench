<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨读笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            font-size: 14px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
        }
        
        /* Top Navigation */
        .nav-bar {
            display: flex;
            border-bottom: 1px solid #d4d4d4;
            background-color: #fafafa;
        }
        
        .nav-item {
            padding: 10px 20px;
            border-right: 1px solid #e0e0e0;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            position: relative;
        }
        
        .nav-item:first-child {
            border-left: 1px solid #e0e0e0;
        }
        
        .nav-item.active {
            background-color: #ebebeb;
            color: #333;
            font-weight: bold;
        }
        
        .nav-arrow {
            font-size: 10px;
            margin-left: 2px;
        }
        
        /* Title */
        .title-section {
            padding: 15px 20px;
            border-bottom: 1px solid #d4d4d4;
            display: flex;
            align-items: center;
        }
        
        .bullet {
            width: 4px;
            height: 4px;
            background-color: #666;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .main-title {
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        
        /* Main Table */
        .form-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }
        
        .form-table td {
            border: 1px solid #d4d4d4;
            padding: 12px 15px;
            vertical-align: middle;
            min-height: 40px;
        }
        
        .label-cell {
            background-color: #f7f7f7;
            width: 100px;
            color: #555;
            font-size: 14px;
        }
        
        .content-cell {
            background-color: #fcfcfc;
            min-height: 45px;
        }
        
        /* Media Comments Section with Radio Buttons */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 5px 0;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }
        
        .radio-circle {
            width: 14px;
            height: 14px;
            border: 1px solid #999;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }
        
        /* Analysis Section */
        .analysis-header {
            display: flex;
            gap: 30px;
            padding: 5px 0;
        }
        
        .analysis-radio {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
        }
        
        .analysis-content {
            min-height: 200px;
            background-image: 
                linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #fff;
        }
        
        /* Bottom Sections */
        .bottom-label {
            background-color: #f7f7f7;
            width: 80px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }
        
        .large-cell {
            min-height: 120px;
            background-image: 
                linear-gradient(#f9f9f9 1px, transparent 1px),
                linear-gradient(90deg, #f9f9f9 1px, transparent 1px);
            background-size: 15px 15px;
        }
        
        .remarks-cell {
            background-color: #f7f7f7;
            color: #555;
            font-size: 14px;
        }
        
        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 30px;
            opacity: 0.3;
            font-size: 16px;
            color: #999;
            font-family: serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-item">行测<span class="nav-arrow">▼</span></div>
            <div class="nav-item">常识</div>
            <div class="nav-item">言语</div>
            <div class="nav-item">数量</div>
            <div class="nav-item">判断</div>
            <div class="nav-item">资料</div>
            <div class="nav-item active">申论</div>
            <div class="nav-item">联考</div>
            <div class="nav-item">计划</div>
        </div>
        
        <!-- Title -->
        <div class="title-section">
            <div class="bullet"></div>
            <h1 class="main-title">晨读笔记</h1>
        </div>
        
        <!-- Main Form Table -->
        <table class="form-table">
            <!-- Row 1: Topic -->
            <tr>
                <td class="label-cell">主题</td>
                <td class="content-cell"></td>
            </tr>
            
            <!-- Row 2: Applicable Field -->
            <tr>
                <td class="label-cell">适用领域</td>
                <td class="content-cell"></td>
            </tr>
            
            <!-- Row 3: Hot Events -->
            <tr>
                <td class="label-cell">热门事件</td>
                <td class="content-cell"></td>
            </tr>
            
            <!-- Row 4: Macro Policy -->
            <tr>
                <td class="label-cell">宏观政策</td>
                <td class="content-cell"></td>
            </tr>
            
            <!-- Row 5: Media Comments with Radio Options -->
            <tr>
                <td class="label-cell">媒体评论</td>
                <td class="content-cell">
                    <div class="radio-group">
                        <div class="radio-option">
                            <span class="radio-circle"></span>
                            <span>意义</span>
                        </div>
                        <div class="radio-option">
                            <span class="radio-circle"></span>
                            <span>原因</span>
                        </div>
                        <div class="radio-option">
                            <span class="radio-circle"></span>
                            <span>问题</span>
                        </div>
                        <div class="radio-option">
                            <span class="radio-circle"></span>
                            <span>对策</span>
                        </div>
                    </div>
                </td>
            </tr>
            
            <!-- Row 6: Analysis Section -->
            <tr>
                <td colspan="2" style="padding: 0; border: none;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr>
                            <td style="border: 1px solid #d4d4d4; border-right: none; padding: 10px 15px; background-color: #f7f7f7;">
                                <div class="analysis-header">
                                    <div class="analysis-radio">
                                        <span class="radio-circle"></span>
                                        <span>问题分析</span>
                                    </div>
                                    <div class="analysis-radio">
                                        <span class="radio-circle"></span>
                                        <span>原因分析</span>
                                    </div>
                                </div>
                            </td>
                            <td style="border: 1px solid #d4d4d4; padding: 10px 15px; background-color: #f7f7f7; text-align: center; color: #555; width: 33%;">
                                对策分析
                            </td>
                        </tr>
                        <tr>
                            <td style="border: 1px solid #d4d4d4; border-top: none; border-right: none;" class="analysis-content"></td>
                            <td style="border: 1px solid #d4d4d4; border-top: none;" class="analysis-content"></td>
                        </tr>
                    </table>
                </td>
            </tr>
            
            <!-- Row 7 & 8: Sentence and Method Migration -->
            <tr>
                <td class="bottom-label">句子迁移</td>
                <td rowspan="2" class="large-cell"></td>
            </tr>
            <tr>
                <td class="bottom-label">方法迁移</td>
            </tr>
            
            <!-- Row 9: Remarks -->
            <tr>
                <td colspan="2" class="remarks-cell">备注</td>
            </tr>
        </table>
    </div>
    
    <div class="watermark">PC悦笔记</div>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
