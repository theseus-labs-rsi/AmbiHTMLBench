<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回避行为</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 3/4;
            padding: 70px 55px;
            position: relative;
            overflow: hidden;
        }
        
        /* Blue Corner Decorations */
        .corner-tl {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            background-color: #1e3a8a;
            clip-path: polygon(0 0, 100% 0, 0 100%, 0 85%, 15% 0);
        }
        
        .corner-tr {
            position: absolute;
            top: 180px;
            right: 0;
            width: 35px;
            height: 90px;
            background-color: #1e3a8a;
            clip-path: polygon(100% 0, 100% 100%, 65% 100%, 100% 65%);
        }
        
        .corner-bl {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 90px;
            height: 35px;
            background-color: #1e3a8a;
            clip-path: polygon(0 100%, 100% 100%, 35% 100%, 0 65%);
        }
        
        .corner-br {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 110px;
            height: 110px;
            background-color: #1e3a8a;
            clip-path: polygon(100% 100%, 100% 0, 0 100%, 15% 100%, 100% 85%);
        }
        
        .number {
            font-size: 80px;
            font-weight: 900;
            color: #000000;
            line-height: 0.9;
            margin-bottom: 10px;
            letter-spacing: -3px;
        }
        
        .title {
            font-size: 72px;
            font-weight: 900;
            color: #000000;
            line-height: 1.1;
            margin-bottom: 100px;
            letter-spacing: -2px;
        }
        
        .content-area {
            margin-top: 20px;
        }
        
        .definition {
            font-size: 30px;
            font-weight: 700;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        
        .example {
            font-size: 28px;
            font-weight: 400;
            color: #000000;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
        
        <div class="number">03</div>
        <div class="title">回避行为</div>
        
        <div class="content-area">
            <div class="definition">自觉或不自觉地回避曾经的某些人、<br>事、物。</div>
            
            <div class="example">比如，学生时代受过伤，可能回避同<br>学聚会，不再听某些歌、看某些电影、<br>去某家餐厅……</div>
        </div>
    </div>
    
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
        displayMath: []
      },
      svg: { fontCache: 'global' }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
