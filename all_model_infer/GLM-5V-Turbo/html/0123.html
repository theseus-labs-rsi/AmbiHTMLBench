<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是好的开始</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }
        .notebook {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #e0e0e0 31px,
                #e0e0e0 32px
            );
            background-position: 0 60px;
            line-height: 32px;
            min-height: 800px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            font-size: 14px;
        }
        .days {
            display: flex;
            gap: 8px;
            font-size: 12px;
        }
        .day-box {
            width: 18px;
            height: 18px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        .date-label {
            font-family: serif;
            letter-spacing: 1px;
        }
        .content {
            font-size: 24px;
            color: #000;
        }
        .title {
            font-size: 28px;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: normal;
        }
        .line {
            display: block;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .indent {
            padding-left: 2em;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <div class="header">
            <div class="days">
                <div class="day-box">Tu</div>
                <div class="day-box">We</div>
                <div class="day-box">Th</div>
                <div class="day-box">Fr</div>
                <div class="day-box">Sa</div>
                <div class="day-box">Su</div>
            </div>
            <div class="date-label">Date.</div>
        </div>
        
        <div class="content">
            <div class="line title">这是好的开始</div>
            
            <div class="line">从你看到这篇文章开始.</div>
            <div class="line">你会越来越有钱</div>
            <div class="line">越来越好.</div>
            <div class="line">生活和心态也会越来越好.</div>
            <div class="line">请相信大数据.</div>
            <div class="line">是你自己把一切美好的东西.</div>
            <div class="line">都吸引了过来</div>
            <div class="line">你已经调到了了接收钱的频率</div>
            <div class="line">接收美的频率.</div>
            <div class="line">你的能量频率对了才接收到这</div>
            <div class="line">条信息.</div>
            <div class="line">留下一句“全收到”;</div>
            <div class="line">愿所有的愿望全能实现！</div>
        </div>
    </div>
</body>
</html>
