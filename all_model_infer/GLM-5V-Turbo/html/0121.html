<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞吉欧Reggio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect fill="%23332a20" width="400" height="600"/><text x="50%" y="50%" font-size="24" fill="%23654321" opacity="0.3" text-anchor="middle">Background Image Placeholder</text></svg>');
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.6;
        }
        
        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 50px 30px;
            border-radius: 8px;
        }
        
        h1 {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .content-list {
            list-style: none;
            padding-left: 10px;
        }
        
        .content-list li {
            font-size: 22px;
            line-height: 1.8;
            margin-bottom: 18px;
            position: relative;
            padding-left: 30px;
            text-align: justify;
            font-weight: 500;
        }
        
        .content-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 12px;
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
        }
        
        .highlight {
            background: linear-gradient(to bottom, transparent 60%, #ffd700 60%);
            padding: 0 2px;
            display: inline;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
            
            .content-list li {
                font-size: 18px;
                padding-left: 25px;
            }
            
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    
    <div class="container">
        <h1>瑞吉欧Reggio</h1>
        
        <ul class="content-list">
            <li>基于皮亚杰和维果斯基等心理学家的<span class="highlight">建构主义心理学</span>。</li>
            
            <li><span class="highlight">走进儿童心灵的主观</span>，以<span class="highlight">孩子的思维、孩子的立场</span>来看待一场<br>不压制孩子，让其充分表现潜能</li>
            
            <li><span class="highlight">弹性课程</span>，从<span class="highlight">儿童的兴趣和需要出发</span><br>不让孩子生活在成人的包围之中。</li>
            
            <li>教师必须<span class="highlight">尽可能地减少介入</span>，更不可过度介入。<br>与其牵着儿童的手，不如让他们用自己的双脚站立。</li>
            
            <li><span class="highlight">儿童的自我表达和相互交流</span>特别重要，是儿童探索、<br>研究、解决问题过程中的基本活动。</li>
            
            <li>在共同分享中，每个人均可提出最好的想法，<br><span class="highlight">提升和加强团队间意见交流、并刺激新奇或出乎意料的事情发生</span>。</li>
        </ul>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
