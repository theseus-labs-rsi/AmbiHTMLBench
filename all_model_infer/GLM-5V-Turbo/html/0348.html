<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部交易抵销 - 第③步：调整所得税</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 600px;
            max-width: 95%;
            background-color: #fffaf4;
            border: 2px solid #d7ccc8;
            border-radius: 15px;
            padding: 40px 50px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #6d4c41;
        }
        
        .header-title {
            font-size: 32px;
            font-weight: bold;
            color: #8d6e63;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .paw-icon {
            color: #a1887f;
            font-size: 28px;
            margin: 0 10px;
        }
        
        .subtitle {
            background-color: #fff3e0;
            color: #e65100;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 35px;
            margin-left: 40px;
        }
        
        .content-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            margin-bottom: 30px;
        }
        
        .column {
            flex: 1;
            padding: 0 10px;
        }
        
        .column-title {
            font-size: 16px;
            font-weight: bold;
            color: #4e342e;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .data-row {
            font-size: 15px;
            color: #5d4037;
            margin: 6px 0;
            padding-left: 10px;
            line-height: 1.6;
        }
        
        .calculation {
            font-size: 14px;
            color: #6d4c41;
            margin-top: 8px;
            padding-left: 10px;
        }
        
        .bracket-group {
            position: relative;
            display: inline-block;
            margin-right: 5px;
        }
        
        .bracket-content {
            display: block;
        }
        
        .arrow-section {
            position: absolute;
            right: -30px;
            top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
        }
        
        .arrow-line {
            width: 2px;
            height: 60px;
            background-color: #1976d2;
            position: relative;
        }
        
        .arrow-head {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #1976d2;
            margin-top: -2px;
        }
        
        .group-note {
            background-color: #e3f2fd;
            color: #1565c0;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            margin-top: 5px;
            border: 1px solid #90caf9;
        }
        
        .accounting-entry {
            margin-top: 30px;
            padding-left: 20px;
            font-size: 15px;
            color: #4e342e;
            line-height: 1.8;
        }
        
        .entry-label {
            font-weight: normal;
            color: #5d4037;
        }
        
        .cat-decoration {
            position: absolute;
            bottom: 10px;
            width: 90px;
            height: 90px;
        }
        
        .cat-left {
            left: 10px;
        }
        
        .cat-right {
            right: 10px;
        }
        
        .placeholder-cat {
            width: 100%;
            height: 100%;
            background-color: #efebe9;
            border-radius: 50% 50% 45% 45%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #8d6e63;
            text-align: center;
            border: 1px solid #d7ccc8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <span class="paw-icon">🐾</span>内部交易抵销<span class="paw-icon">🐾</span>
            </div>
            <div style="font-size: 28px; color: #8d6e63; font-weight: bold;">第③步：调整所得税</div>
        </div>
        
        <div class="subtitle">若实现60%对外销售</div>
        
        <div class="content-wrapper">
            <div class="column">
                <div class="column-title">个别报表表面因为存货跌价准备:</div>
                <div class="data-row">账面价值900</div>
                <div class="data-row">计税基础1200</div>
                <div class="calculation">
                    <span class="bracket-group">
                        <span class="bracket-content"></span>
                    </span>
                    递延所得税资产300*25%=75
                </div>
            </div>
            
            <div class="column">
                <div class="column-title">合并报表表面因为存货跌价准备:</div>
                <div class="data-row">账面价值800</div>
                <div class="data-row">计税基础1200</div>
                <div class="calculation">
                    <span class="bracket-group">
                        <span class="bracket-content"></span>
                    </span>
                    递延所得税资产400*25%=100
                </div>
            </div>
            
            <div class="arrow-section">
                <div class="arrow-line">
                    <div class="arrow-head"></div>
                </div>
                <div class="group-note">
                    【集团角度】<br>调增25
                </div>
            </div>
        </div>
        
        <div class="accounting-entry">
            <div><span class="entry-label">会计处理：</span>借：递延所得税资产25</div>
            <div style="padding-left: 70px;">贷：所得税费用25</div>
        </div>
        
        <div class="cat-decoration cat-left">
            <div class="placeholder-cat">[Cat Illustration]</div>
        </div>
        
        <div class="cat-decoration cat-right">
            <div class="placeholder-cat">[Cat Illustration]</div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
