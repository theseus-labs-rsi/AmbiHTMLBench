<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祥除帖 昨表帖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f5f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: "Kaiti SC", "STKaiti", "楷体", serif;
        }
        
        .document-container {
            background-color: #e8e4d9;
            padding: 40px 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: relative;
            max-width: 900px;
            width: 100%;
        }
        
        .text-content {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 25px;
            height: auto;
            min-height: 600px;
        }
        
        .column {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 28px;
            line-height: 1.8;
            letter-spacing: 8px;
            color: #1a1a1a;
            font-weight: 400;
        }
        
        .title-column {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .signature-area {
            position: absolute;
            bottom: 60px;
            left: 50px;
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: flex-end;
        }
        
        .signature-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 24px;
            color: #1a1a1a;
            letter-spacing: 6px;
        }
        
        .seals {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .seal {
            width: 32px;
            height: 32px;
            border: 2px solid #c41e3a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c41e3a;
            font-size: 16px;
            font-weight: bold;
            background-color: rgba(196, 30, 58, 0.05);
        }
        
        @media (max-width: 768px) {
            .document-container {
                padding: 20px 30px;
            }
            
            .column {
                font-size: 22px;
                letter-spacing: 4px;
                gap: 15px;
            }
            
            .signature-text {
                font-size: 18px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="document-container">
        <div class="text-content">
            <div class="column title-column">祥除帖 昨表帖</div>
            
            <div class="column">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時嚴寒奉被</div>
            
            <div class="column">手詔伏承聖體御膳勝常以慰下情臣故患匈滿氣上損乏匆匆慈</div>
            
            <div class="column">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>
            
            <div class="column">頓首死罪死罪 臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
            
            <div class="column">慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀</div>
            
            <div class="column">愍存益勞聖心謹附承動靜臣廙言</div>
        </div>
        
        <div class="signature-area">
            <div class="signature-text">歲在癸卯蒼耀陽書於未央雲舍</div>
            <div class="seals">
                <div class="seal">印</div>
                <div class="seal">記</div>
            </div>
        </div>
    </div>
</body>
</html>
