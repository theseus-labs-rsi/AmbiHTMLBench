<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固化的做题思维</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }
        
        .slide-container {
            position: relative;
            width: 960px;
            height: 640px;
            background-color: #e8e8e8;
            margin: 0 auto;
            padding: 40px 60px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .timestamp {
            position: absolute;
            top: 15px;
            left: 25px;
            font-size: 13px;
            color: #333;
            font-family: Arial, sans-serif;
        }
        
        .video-feed {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 180px;
            height: 120px;
            background-color: #666;
            border: 2px solid #999;
            overflow: hidden;
        }
        
        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .content {
            margin-top: 60px;
            color: #c41e3a; /* Reddish color matching the image */
        }
        
        .main-title {
            font-size: 22px;
            margin-bottom: 35px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        
        .list-item {
            font-size: 19px;
            line-height: 1.8;
            margin-bottom: 18px;
            display: flex;
            align-items: baseline;
        }
        
        .item-number {
            margin-right: 8px;
        }
        
        .center-title {
            text-align: center;
            font-size: 32px;
            margin: 25px 0 30px 0;
            letter-spacing: 2px;
            color: #000;
        }
        
        .underlined {
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .sub-text {
            font-size: 17px;
            margin-left: 45px;
            margin-top: -10px;
            margin-bottom: 15px;
            color: #c41e3a;
        }
        
        /* Specific positioning for scattered items */
        .item-2 { margin-left: 80px; }
        .item-3 { margin-left: 80px; }
        .item-6 { 
            margin-left: 280px; 
            margin-top: -55px;
        }
        .item-4 { 
            margin-left: 80px;
            clear: both;
        }
        .item-5 { 
            margin-left: 80px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="timestamp">19:28 9月14日周五</div>
        
        <div class="video-feed">
            <div style="width:100%;height:100%;background:#888;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;">[Video Feed: Person in room with bookshelves]</div>
        </div>
        
        <div class="content">
            <div class="main-title">固化的做题思维:</div>
            
            <div class="list-item">
                <span class="item-number">1.</span>
                <span>喜欢忠于自己的内心和感觉。</span>
            </div>
            
            <div class="center-title">2017年 12月第一套 Text 1</div>
            
            <div class="list-item item-2">
                <span class="item-number">2.</span>
                <span>喜欢选<span class="underlined">符合常识的选项。</span><span style="font-size:16px;margin-left:5px;">20年左右的常识和经验的累积</span></span>
            </div>
            
            <div class="list-item item-3">
                <span class="item-number">3.</span>
                <span>喜欢选自己认识的选项。</span>
            </div>
            
            <div class="list-item item-6">
                <span class="item-number">6.</span>
                <span>圆囵吞枣选择法</span>
            </div>
            <div class="sub-text">(有遗憾，有厌烦)</div>
            
            <div class="list-item item-4">
                <span class="item-number">4.</span>
                <span>喜欢选自己不认识的选项。</span>
            </div>
            
            <div class="list-item item-5">
                <span class="item-number">5.</span>
                <span>火急火燎一把火</span>
            </div>
        </div>
    </div>
</body>
</html>
