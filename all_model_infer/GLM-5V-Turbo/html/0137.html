<!DOCTYPE html>

<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">

    <title>国家名</title>

        body {
            margin: 0;

            justify-content: center;
            align-items: flex-start;

        .container {

        }
        
        .column {

            gap: 18px;
        }
        
        .country-item {
            text-align: left;
            font-size: 22px;
            color: #000;
            line-height: 1.4;
            padding-left: 10px;
        }
    </style>
</head>
