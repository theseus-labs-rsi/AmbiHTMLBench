<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业长图设计分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f0f0;
            overflow-x: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 3px solid #000;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        
        .header-center {
            position: relative;
            font-family: Arial, sans-serif;
            letter-spacing: 8px;
            font-style: italic;
        }
        
        .header-center::before,
        .header-center::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 80px;
            height: 2px;
            background: #000;
        }
        
        .header-center::before {
            right: 105%;
            margin-right: 10px;
        }
        
        .header-center::after {
            left: 105%;
            margin-left: 10px;
        }
        
        .arrow-decor {
            position: absolute;
            top: -5px;
            font-size: 20px;
            font-style: normal;
        }
        
        .arrow-left { right: 100%; margin-right: 95px; }
        .arrow-right { left: 100%; margin-left: 95px; }
        
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        
        .column {
            flex: 1;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .left-column {
            background: #ccff00;
            color: #000;
        }
        
        .right-column {
            background: #a78bfa;
            color: #fff;
        }
        
        .intro-text {
            text-align: center;
            font-size: 20px;
            line-height: 1.8;
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        .title-frame {
            border: 4px solid #000;
            padding: 12px 25px;
            display: inline-block;
            font-size: 32px;
            font-weight: 900;
            background: #fff;
            margin: 10px auto;
            position: relative;
            z-index: 10;
        }
        
        .sub-frame {
            border: 4px solid #000;
            padding: 10px 20px;
            display: inline-block;
            font-size: 26px;
            font-weight: 900;
            background: #fff;
            margin: 10px auto;
            position: relative;
            z-index: 10;
        }
        
        .slogan {
            font-size: 24px;
            font-weight: 900;
            margin: 20px 0;
            letter-spacing: 3px;
            text-align: center;
        }
        
        .fist-decoration {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50% 50% 45% 45%;
            z-index: 5;
            top: 220px;
        }
        
        .fist-left {
            left: -15px;
            background: #6366f1;
            transform: rotate(-25deg);
        }
        
        .fist-right {
            right: -15px;
            background: #ec4899;
            transform: rotate(25deg);
        }
        
        .pk-zone {
            position: relative;
            height: 300px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .red-lines-bg {
            position: absolute;
            left: 20px;
            top: 50px;
            width: 140px;
            height: 120px;
            z-index: 1;
        }
        
        .r-line {
            width: 90px;
            height: 4px;
            background: #ef4444;
            margin: 10px 0;
            transform-origin: left center;
        }
        
        .r-line:nth-child(1) { transform: rotate(-35deg); width: 70px; }
        .r-line:nth-child(2) { transform: rotate(-17deg); width: 90px; }
        .r-line:nth-child(3) { transform: rotate(0deg); width: 100px; }
        .r-line:nth-child(4) { transform: rotate(17deg); width: 90px; }
        .r-line:nth-child(5) { transform: rotate(35deg); width: 70px; }
        
        .letter-pk {
            position: absolute;
            font-size: 200px;
            font-weight: 900;
            font-style: italic;
            z-index: 3;
        }
        
        .p-char {
            color: #6366f1;
            left: 30px;
            top: 60px;
            transform: rotate(-8deg);
        }
        
        .k-char {
            color: #ec4899;
            right: 30px;
            top: 90px;
            z-index: 4;
        }
        
        .arena-text {
            position: absolute;
            bottom: 20px;
            font-size: 80px;
            font-weight: 900;
            color: #4338ca;
            z-index: 5;
            letter-spacing: -5px;
            text-shadow: 3px 3px 0 rgba(255,255,255,0.5);
        }
        
        .banner-launch {
            background: linear-gradient(135deg, #ff006e, #fb5607);
            color: #fff;
            font-size: 38px;
            font-weight: 900;
            padding: 12px 30px;
            display: inline-block;
            transform: skewX(-12deg);
            margin-top: -20px;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
            border: 3px solid #000;
            z-index: 6;
            position: relative;
        }
        
        .info-panel {
            background: #d4ff00;
            border: 3px solid #000;
            padding: 20px;
            margin-top: 30px;
        }
        
        .info-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
            font-weight: bold;
        }
        
        .icon-symbol {
            width: 28px;
            height: 28px;
            border: 3px solid #000;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            background: #fff;
        }
        
        .emphasis-purple {
            color: #7c3aed;
            font-size: 26px;
            font-weight: 900;
            margin: 15px 0 5px 0;
        }
        
        .emphasis-blue {
            color: #2563eb;
            font-size: 20px;
            font-weight: 900;
            text-decoration: underline;
            margin: 5px 0;
        }
        
        .exclamation {
            font-size: 24px;
            font-weight: 900;
            margin: 5px 0;
        }
        
        .question-text {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .black-bars {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .bar-black {
            height: 45px;
            background: #000;
            transform: skewX(-20deg);
            margin-left: 25px;
            margin-top: -12px;
        }
        
        .bar-1 { width: 90px; }
        .bar-2 { width: 110px; }
        
        /* Right Column Styles */
        .rings-area {
            position: relative;
            height: 220px;
            margin-bottom: 20px;
        }
        
        .ring-shape {
            position: absolute;
            width: 220px;
            height: 220px;
            border: 28px solid #6366f1;
            border-radius: 50%;
            opacity: 0.85;
        }
        
        .ring-a {
            top: 20px;
            left: 40px;
            transform: rotate(-25deg);
            border-color: #8b5cf6;
        }
        
        .ring-b {
            top: 50px;
            left: 130px;
            transform: rotate(15deg);
            border-color: #a78bfa;
        }
        
        .ring-text {
            position: absolute;
            color: #fff;
            font-weight: 900;
            font-size: 15px;
            white-space: nowrap;
        }
        
        .rt-1 {
            top: 70px;
            left: 75px;
            transform: rotate(-25deg);
        }
        
        .rt-2 {
            top: 115px;
            left: 175px;
            transform: rotate(15deg);
        }
        
        .checkered-bar {
            height: 12px;
            background: repeating-linear-gradient(
                90deg,
                #000 0,
                #000 15px,
                transparent 15px,
                transparent 30px
            );
            margin: 25px 0;
        }
        
        .star-group {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        
        .star-icon {
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 30px solid #000;
        }
        
        .main-heading {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.2;
            margin: 30px 0;
            text-shadow: 4px 4px 0 #000;
            letter-spacing: 2px;
        }
        
        .arrow-indicator {
            text-align: right;
            font-size: 48px;
            color: #fff;
            margin: 15px 0;
            letter-spacing: 12px;
            font-weight: 300;
        }
        
        .text-card {
            background: rgba(255,255,255,0.95);
            color: #000;
            padding: 18px 20px;
            margin: 12px 0;
            font-size: 19px;
            line-height: 1.6;
            font-weight: bold;
            border-left: 5px solid #000;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }
        
        .highlight-term {
            background: #000;
            color: #fff;
            padding: 2px 8px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>商业长图</div>
        <div class="header-center">
            <span class="arrow-decor arrow-left">&lt;</span>
            DESIGN
            <span class="arrow-decor arrow-right">&gt;</span>
        </div>
        <div>设计分享</div>
    </div>

    <div class="main-container">
        <!-- Left Column -->
        <div class="column left-column">
            <div class="intro-text">
                <div>两大征稿专栏</div>
                <div>将在本期</div>
                <div>与大家做个正式的告别</div>
            </div>
            
            <div class="fist-decoration fist-left"></div>
            <div class="fist-decoration fist-right"></div>
            
            <div style="position: relative; z-index: 8; text-align: center;">
                <div class="title-frame">江湖从不缺传奇</div>
                <div class="sub-frame">这一次</div>
                <div class="slogan">TA燃情出炉,战力拉满</div>
                
                <div class="pk-zone">
                    <div class="red-lines-bg">
                        <div class="r-line"></div>
                        <div class="r-line"></div>
                        <div class="r-line"></div>
                        <div class="r-line"></div>
                        <div class="r-line"></div>
                    </div>
                    <div class="letter-pk p-char">P</div>
                    <div class="letter-pk k-char">K</div>
                    <div class="arena-text">天都擂台</div>
                </div>
                
                <div class="banner-launch">专栏今日上线</div>
            </div>
            
            <div class="info-panel">
                <div class="info-row">
                    <div class="icon-symbol">↳</div>
                    <div>正反两派 互相PK</div>
                </div>
                <div class="info-row">
                    <div class="icon-symbol">💬</div>
                    <div>征稿玩法大升级，狂掀创意浪潮<br><strong>注意！注意！注意！</strong></div>
                </div>
                <div class="info-row">
                    <div class="icon-symbol">🎁</div>
                    <div>入选参赛的投稿者都将收获礼品一份</div>
                </div>
            </div>
            
            <div class="emphasis-purple">但是！</div>
            <div class="emphasis-blue">败者一方 将抢走更加超值的奖励</div>
            <div class="exclamation">!!!!!!</div>
            <div class="question-text">具体怎么参与？</div>
            
            <div class="black-bars">
                <div class="bar-black bar-1"></div>
                <div class="bar-black bar-2"></div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="column right-column">
            <div class="rings-area">
                <div class="ring-shape ring-a"></div>
                <div class="ring-shape ring-b"></div>
                <div class="ring-text rt-1">重磅·SO升级</div>
                <div class="ring-text rt-2">重磅升级02</div>
            </div>
            
            <div class="checkered-bar"></div>
            
            <div class="star-group">
                <div class="star-icon"></div>
                <div class="star-icon"></div>
                <div class="star-icon"></div>
                <div class="star-icon"></div>
            </div>
            
            <div class="main-heading">
                擂台大比拼<br>
                一切“我”掌控
            </div>
            
            <div class="star-group">
                <div class="star-icon"></div>
                <div class="star-icon"></div>
            </div>
            
            <div class="arrow-indicator">← ←</div>
            
            <div class="text-card">
                公众号每期的「饮茶福利文」
            </div>
            
            <div class="text-card">
                都向家人们抛出了各种<br>
                <span class="highlight-term">热议的话题</span>
            </div>
            
            <div class="text-card">
                送出了一轮又一轮的奖励
            </div>
            
            <div class="text-card">
                而“侃侃而谈”和“开店风云”
            </div>
            
            <div class="text-card">
                两大征稿专栏
            </div>
            
            <div class="text-card">
                将在本期<br>
                与大家做个正式的告别
            </div>
        </div>
    </div>
</body>
</html>
