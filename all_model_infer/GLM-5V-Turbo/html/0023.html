<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendations</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #ffffff;
            padding: 20px;
        }
        
        .book-section {
            margin-bottom: 30px;
        }
        
        .title-bar {
            background-color: #fce4e4;
            padding: 12px 0;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .content-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .book-cover {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }
        
        .book-details {
            flex: 1;
            line-height: 1.6;
            font-size: 14px;
            color: #333;
        }
        
        .rating {
            margin-bottom: 10px;
            font-weight: normal;
        }
        
        .description {
            white-space: pre-line;
            line-height: 1.7;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 13px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- First Book -->
        <div class="book-section">
            <div class="title-bar">《达摩流浪者》</div>
            <div class="content-wrapper">
                <img src="https://via.placeholder.com/140x200/e74c3c/ffffff?text=DHARMA+BUMS" alt="达摩流浪者封面" class="book-cover">
                <div class="book-details">
                    <div class="rating">评分：8.5</div>
                    <div class="description">永远年轻，永远热泪盈眶
相信每个理想主义的nfper，每个在庸碌生活中迷茫的人，每个还没被社会总开关控制的人，都会被书中纯净又赤诚的灵魂打动。</div>
                </div>
            </div>
        </div>

        <!-- Second Book -->
        <div class="book-section">
            <div class="title-bar">《深时之旅》</div>
            <div class="content-wrapper">
                <img src="https://via.placeholder.com/140x200/d35400/ffffff?text=UNDERLAND" alt="深时之旅封面" class="book-cover">
                <div class="book-details">
                    <div class="rating">评分：8.7</div>
                    <div class="description">地下，有另外一个世界！
作者以充满灵性的语言，描绘了地下世界一个又一个奇妙的科学现象，神秘的传说和感人的故事。
天呐！惊叹，将是你的主旋律</div>
                </div>
            </div>
        </div>

        <div class="footer">分享好書的 Grit</div>
    </div>
</body>
</html>
