<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫砂种类指南</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #fdf6e9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            border: 2px solid #4a5568;
            border-radius: 12px;
            padding: 24px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .main-title {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            color: #1a202c;
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .main-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 4px;
            background-color: #1a202c;
            border-radius: 2px;
        }
        .section {
            margin-top: 28px;
            position: relative;
        }
        .section-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .pin-icon {
            color: #e53e3e;
            margin-right: 8px;
            font-size: 22px;
            filter: drop-shadow(0 1px 2px rgba(229,62,62,0.3));
        }
        .summary-badge {
            background-color: #c53030;
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            margin-left: auto;
            box-shadow: 0 2px 4px rgba(197,48,48,0.3);
            white-space: nowrap;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            margin-top: 8px;
        }
        th {
            background-color: #4a5568;
            color: #fff;
            padding: 12px 8px;
            text-align: center;
            font-weight: 700;
            border: 1px solid #2d3748;
        }
        td {
            padding: 14px 10px;
            text-align: center;
            border: 1px solid #e2e8f0;
            color: #2d3748;
            vertical-align: middle;
        }
        tr:nth-child(even) td {
            background-color: #f7fafc;
        }
        .red-circle {
            border: 2.5px solid #e53e3e;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 36px;
            color: #e53e3e;
            font-weight: 700;
            font-size: 16px;
            box-sizing: border-box;
        }
        .recommendation-note {
            color: #4a5568;
            font-size: 14px;
            padding: 8px 12px !important;
            text-align: left !important;
            background-color: transparent !important;
            border: none !important;
        }
        .yellow-highlight-row {
            background-color: #fefcbf !important;
            border: none !important;
        }
        .yellow-text {
            color: #744210;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .check-icon {
            color: #38a169;
            font-weight: 900;
        }
        strong {
            color: #c53030;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">猫砂都有哪些款❓</h1>
        
        <div class="section">
            <div class="section-title">
                <span class="pin-icon">📍</span>
                三种猫砂尺寸哪个是你最爱
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">尺寸</th>
                        <th style="width: 15%;">重量</th>
                        <th style="width: 20%;">结团效果</th>
                        <th style="width: 45%;">其他</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1.5mm</td>
                        <td>轻</td>
                        <td>上</td>
                        <td>易带出，价格<br>略高</td>
                    </tr>
                    <tr>
                        <td><span class="red-circle">2mm</span></td>
                        <td>中</td>
                        <td>中</td>
                        <td>综合性价比高</td>
                    </tr>
                    <tr>
                        <td colspan="4" class="recommendation-note">综合性价比推荐</td>
                    </tr>
                    <tr>
                        <td>3mm</td>
                        <td>重</td>
                        <td>67</td>
                        <td>推荐度低，但<br>价格也低</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="pin-icon">📍</span>
                猫砂都有哪些种类
                <div class="summary-badge">总结: 2mm混合砂yyds</div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 22%;">种类</th>
                        <th style="width: 40%;">优点</th>
                        <th style="width: 38%;">其他</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>膨润土</td>
                        <td>价格低廉</td>
                        <td>粉尘大</td>
                    </tr>
                    <tr>
                        <td>豆腐猫砂</td>
                        <td>原料更安全，闻起来<br>也比较好</td>
                        <td>价格偏高，纯豆腐结团略差</td>
                    </tr>
                    <tr>
                        <td><span class="red-circle" style="min-width: 80px; font-size: 15px;">混合猫砂</span></td>
                        <td>结合上述优点，价格<br>适中</td>
                        <td>比例推荐 <strong>7:3或6:4</strong>，结团快且用量省</td>
                    </tr>
                    <tr class="yellow-highlight-row">
                        <td colspan="3" style="padding: 10px 16px;">
                            <div class="yellow-text">
                                🏠 普通养宠家庭是以满足需求<span class="check-icon">✅</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>沸石</td>
                        <td>可循环利用</td>
                        <td>需要自己洗</td>
                    </tr>
                    <tr>
                        <td>其他新型原料</td>
                        <td>价格高，新颖</td>
                        <td>效果待考核，贵</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
