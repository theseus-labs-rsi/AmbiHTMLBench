<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忽视你的需求，内耗你的精力</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 40px 20px;
            margin: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 35px 45px;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #4a6b5d;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 6px;
            margin-bottom: 28px;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .battery-icon {
            width: 38px;
            height: 52px;
            background-color: #a8d0db;
            border: 2.5px solid #3d5a4c;
            border-radius: 3px;
            position: relative;
            flex-shrink: 0;
            margin-left: 15px;
        }
        
        .battery-icon::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 5px;
            background-color: #3d5a4c;
            border-radius: 2px 2px 0 0;
        }
        
        .battery-icon::after {
            content: "⚡";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            color: #e85a5a;
        }
        
        p {
            margin: 0 0 20px 0;
            text-align: justify;
            font-size: 17px;
            line-height: 1.85;
            color: #3d5a4c;
            font-weight: 500;
        }
        
        .advice-section {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 28px 0 25px 0;
            padding-left: 2px;
        }
        
        .checkmark {
            color: #4a6b5d;
            font-size: 22px;
            font-weight: bold;
            flex-shrink: 0;
            line-height: 1.85;
            margin-top: 1px;
        }
        
        .advice-text {
            flex: 1;
            line-height: 1.85;
            font-size: 17px;
            color: #3d5a4c;
            font-weight: 500;
        }
        
        .closing-text {
            margin-top: 28px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>3. 忽视你的需求，内耗你的精力</span>
            <div class="battery-icon"></div>
        </div>
        
        <p>这一种人，不仅可能是身边的朋友，亲密关系中也会出现。爱我们的人，也可能会“害”我们。</p>
        
        <p>忽视需求，是关系中隐藏的一把刀，对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>
        
        <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>
        
        <p>经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</p>
        
        <div class="advice-section">
            <span class="checkmark">✓</span>
            <div class="advice-text">
                面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。
            </div>
        </div>
        
        <p class="closing-text">与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。</p>
    </div>
</body>
</html>
