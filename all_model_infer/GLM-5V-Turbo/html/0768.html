<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的分类 - 打造超级学习个体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #e6e6e6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #e6e6e6;
        }
        .header {
            background-color: #2d2d2d;
            color: white;
            padding: 15px 20px;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #d4a574;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #333;
            border: 2px solid #999;
            position: relative;
            overflow: hidden;
        }
        .brand {
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .brand-icon {
            color: #f5a623;
            font-size: 20px;
            vertical-align: middle;
        }
        .brand-sub {
            font-size: 11px;
            color: #bbb;
            display: block;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .rating {
            text-align: right;
            font-size: 11px;
            line-height: 1.6;
            color: #ddd;
        }
        .stars {
            color: #f5a623;
        }
        .title-section {
            padding: 10px 0 20px 0;
            display: flex;
            align-items: flex-start;
            gap: 25px;
        }
        .number {
            font-size: 64px;
            font-weight: bold;
            color: #6fa8bc;
            line-height: 1;
            font-family: Arial, sans-serif;
        }
        .title-content {
            flex: 1;
            padding-top: 5px;
        }
        .main-title {
            font-size: 46px;
            color: #5a8fa8;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 3px;
        }
        .quote {
            font-size: 14px;
            color: #fff;
            font-weight: normal;
            letter-spacing: 0.5px;
        }
        .model-header {
            background-color: #555;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 15px;
            padding: 35px 25px;
        }
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .icon-placeholder {
            width: 72px;
            height: 72px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .item-label {
            font-size: 14px;
            color: #222;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        /* Icon Styles Approximation */
        .icon-1 { 
            background: linear-gradient(135deg, rgba(120,160,200,0.6) 0%, rgba(160,190,220,0.6) 50%, rgba(140,170,210,0.6) 100%);
            border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
            transform: rotate(-10deg);
        }
        .icon-2 { 
            background: rgba(130,170,220,0.5);
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 -12px 0 rgba(255,255,255,0.9);
        }
        .icon-3 { 
            background: #666;
            clip-path: polygon(0 0, 48% 0, 48% 100%, 0 100%);
            position: relative;
        }
        .icon-3::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 52%;
            height: 100%;
            background: #888;
            clip-path: polygon(52% 0, 100% 0, 100% 100%, 52% 100%);
        }
        .icon-3-plus {
            position: absolute;
            color: white;
            font-size: 32px;
            font-weight: bold;
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .icon-4 { 
            background: #c44;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-4::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 10px;
            border: 2px solid rgba(255,215,0,0.8);
            border-bottom: none;
            border-radius: 50% 50% 0 0;
        }
        .icon-5 { 
            background: conic-gradient(from 180deg at 50% 50%, #333 0deg, #666 90deg, #fcc 180deg, #fcc 270deg, #333 360deg);
            border-radius: 50%;
            position: relative;
        }
        .icon-6 { 
            border: 3px solid #666;
            border-radius: 50%;
            background: transparent;
            position: relative;
        }
        .icon-6::after {
            content: '♥';
            color: #c44;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
        }
        .icon-7 { 
            background: none;
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .icon-7::before, .icon-7::after {
            content: '♥';
            font-size: 26px;
            color: #ccc;
        }
        .icon-8 { 
            background: #ec3;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-8::after {
            content: '👁';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
        }
        .icon-9 { 
            background: linear-gradient(90deg, #000 50%, #4af 50%);
            border-radius: 50% 50% 45% 45%;
        }
        .icon-10 { 
            background: #c44;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-10::after {
            content: '👑';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }
        .icon-11 { 
            background: none;
            position: relative;
        }
        .icon-11::before {
            content: '♥ ♥';
            color: #faa;
            font-size: 22px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 2px;
        }
        .icon-11::after {
            content: '♥';
            color: #4af;
            font-size: 18px;
            position: absolute;
            bottom: 5px;
            right: 12px;
        }
        .icon-12 { 
            background: #6c6;
            border-radius: 50% 50% 45% 45%;
            opacity: 0.75;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 6px,
                rgba(255,255,255,0.3) 6px,
                rgba(255,255,255,0.3) 12px
            );
        }
        .icon-13 { 
            background: none;
            position: relative;
        }
        .icon-13::before {
            content: '♥';
            font-size: 34px;
            color: #444;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .icon-13::after {
            content: '♥';
            font-size: 28px;
            color: #777;
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
        }
        .icon-14 { 
            border: 3px solid #999;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
            position: relative;
        }
        .icon-14::after {
            content: '♥';
            font-size: 22px;
            color: #999;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
        }
        .icon-15 { 
            background: #fcc;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-15::after {
            content: '☝';
            font-size: 22px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
        }
        .icon-16 { 
            background: none;
            position: relative;
        }
        .icon-16::before {
            content: '♥';
            color: #c44;
            font-size: 30px;
            position: absolute;
            left: 2px;
            top: 6px;
        }
        .icon-16::after {
            content: '♥';
            color: #4af;
            font-size: 30px;
            position: absolute;
            right: 2px;
            top: 6px;
        }
        .icon-17 { 
            background: #111;
            border-radius: 50% 50% 45% 45%;
            border: 3px solid #c00;
            position: relative;
            overflow: hidden;
        }
        .icon-17::before {
            content: '';
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg 8deg,
                #c00 8deg 16deg
            );
            opacity: 0.9;
        }
        .icon-18 { 
            background: none;
            position: relative;
        }
        .icon-18::before {
            content: '♥';
            font-size: 38px;
            color: #999;
            letter-spacing: -6px;
            position: relative;
            z-index: 1;
        }
        .icon-19 { 
            background: #4af;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-19::after {
            content: '+';
            color: white;
            font-size: 32px;
            font-weight: bold;
            position: absolute;
            right: -6px;
            top: -6px;
        }
        .icon-20 { 
            background: #fd3;
            border-radius: 50% 50% 45% 45%;
            position: relative;
        }
        .icon-20::after {
            content: '✦';
            color: white;
            font-size: 18px;
            position: absolute;
            top: 6px;
            right: 12px;
        }
        .icon-21 { 
            background: none;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .icon-21::before, .icon-21::after {
            content: '♥';
            font-size: 30px;
            color: #e99;
        }
        .icon-22 { 
            background: none;
            position: relative;
        }
        .icon-22::before {
            content: '♥';
            font-size: 30px;
            color: #222;
            position: absolute;
            left: 0;
            top: 6px;
        }
        .icon-22::after {
            content: '♥';
            font-size: 26px;
            color: #633;
            position: absolute;
            right: 6px;
            top: 12px;
        }
        .icon-23 { 
            border: 3px solid #c44;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
        }
        .icon-24 { 
            border: 3px dashed #666;
            border-radius: 50% 50% 45% 45%;
            background: transparent;
        }
    </style>
</head>

    <script>
