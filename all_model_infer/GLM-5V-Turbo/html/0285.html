<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All In: The Fight for Democracy - Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .amazon-original {
            letter-spacing: 6px;
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 120px;
            color: #000000;
        }
        
        .tagline {
            color: #0057b8;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .main-title-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 15px;
            margin-bottom: 180px;
        }
        
        .all-in {
            color: #0057b8;
            font-size: 140px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
        }
        
        .subtitle-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 10px;
        }
        
        .fight-for {
            color: #0057b8;
            font-size: 42px;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        
        .democracy {
            color: #0057b8;
            font-size: 42px;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            position: relative;
            padding: 4px 0;
        }
        
        .red-bar {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 12px;
            background-color: #e31837;
            z-index: -1;
        }
        
        .festival-logo {
            margin-bottom: 25px;
            opacity: 0.9;
        }
        
        .festival-text {
            color: #0057b8;
            font-family: serif;
            font-style: italic;
            font-size: 18px;
            line-height: 1.2;
        }
        
        .festival-year {
            font-size: 14px;
            font-weight: 600;
        }
        
        .credits {
            color: #0057b8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            text-transform: uppercase;
            line-height: 1.6;
        }
        
        .coming-soon {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #000000;
        }
        
        .release-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #000000;
        }
        
        .divider {
            width: 2px;
            height: 24px;
            background-color: #000000;
        }
        
        .prime-video {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .hashtag-box {
            border: 3px solid #e31837;
            padding: 8px 20px;
            margin-bottom: 40px;
            display: inline-block;
        }
        
        .hashtag {
            color: #0057b8;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .footer-logos {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: flex-end;
            padding: 0 10px;
        }
        
        .pg-rating {
            border: 1px solid #999;
            padding: 2px 4px;
            font-size: 8px;
            color: #666;
            width: 50px;
            text-align: center;
            line-height: 1.2;
        }
        
        .amazon-studios {
            font-size: 8px;
            letter-spacing: 2px;
            color: #666;
            text-align: right;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="poster-container">
