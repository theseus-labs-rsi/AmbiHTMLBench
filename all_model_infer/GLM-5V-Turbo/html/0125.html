<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 - 金句摘抄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #e8dfd0;
            font-family: "SimSun", "Songti SC", serif;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #e8dfd0;
        }
        
        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        
        .logo-section {
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            font-size: 72px;
            color: #c41e3a;
            font-family: "KaiTi", "STKaiti", serif;
            font-weight: bold;
            letter-spacing: 5px;
            line-height: 1;
        }
        
        .logo-sub {
            font-size: 14px;
            color: #666;
            letter-spacing: 4px;
            margin-top: 5px;
            font-family: Arial, sans-serif;
        }
        
        .title-section {
            text-align: right;
        }
        
        .top-title {
            font-size: 36px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
        }
        
        .main-title {
            font-size: 48px;
            font-weight: bold;
            color: #000;
            border-bottom: 3px solid #000;
            display: inline-block;
            padding-bottom: 5px;
        }
        
        /* Content Section */
        .content {
            padding: 20px 40px;
        }
        
        .quote-block {
            margin-bottom: 40px;
        }
        
        .quote-text {
            font-size: 48px;
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.4;
        }
        
        .interpretation-label {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            font-weight: normal;
        }
        
        .interpretation-text {
            font-size: 18px;
            color: #333;
            text-align: justify;
            line-height: 1.8;
            text-indent: 2em;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo">人民日報</div>
                <div class="logo-sub">RENMIN RIBAO</div>
            </div>
            <div class="title-section">
                <div class="top-title">金句 | 摘抄</div>
                <div class="main-title">心态主题</div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="content">
            <!-- First Quote -->
            <div class="quote-block">
                <div class="quote-text">
                    且行且忘且随风，<br>
                    且行且看且从容。
                </div>
                <div class="interpretation-label">释义：</div>
                <div class="interpretation-text">
                    意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
                </div>
            </div>
            
            <!-- Second Quote -->
            <div class="quote-block">
                <div class="quote-text">
                    我将玫瑰藏于身后风起花落，<br>
                    从此鲜花赠自己，<br>
                    纵马踏花向自由。
                </div>
                <div class="interpretation-label">释义：</div>
                <div class="interpretation-text">
                    我把心中的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
                </div>
            </div>
        </div>
    </div>
</body>
</html>
