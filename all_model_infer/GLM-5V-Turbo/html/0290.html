<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anything's Possible - Prime Video Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .poster-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .pink-border {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 20px solid #f8d7e6;
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .prime-video {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #000;
            line-height: 1;
            margin-bottom: 5px;
        }

        .amazon-logo {
            width: 80px;
            height: auto;
            margin-top: -5px;
        }

        .director-credit {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #000080;
            margin-top: 25px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 16px;
            color: #d63384;
            letter-spacing: 3px;
            margin-top: 15px;
            line-height: 1.5;
            font-weight: 400;
        }

        .main-image {
            width: 100%;
            height: 500px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ffffff 0%, #f5f5f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .actor-left {
            position: absolute;
            bottom: 50px;
            left: 60px;
            width: 280px;
            height: 400px;
            background: linear-gradient(135deg, #e0c3a8 0%, #d4b89a 100%);
            border-radius: 200px 200px 150px 150px;
            opacity: 0.9;
        }

        .actor-right {
            position: absolute;
            bottom: 40px;
            right: 80px;
            width: 260px;
            height: 420px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 180px 180px 140px 140px;
            opacity: 0.9;
        }

        .title-section {
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .title {
            font-size: 64px;
            line-height: 0.9;
            font-weight: 400;
        }

        .title-script {
            font-family: 'Brush Script MT', cursive;
            color: #000080;
            font-style: italic;
            font-weight: 400;
        }

        .title-bold {
            font-family: Arial, sans-serif;
            color: #d63384;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .credits {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000080;
            margin-bottom: 30px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        .release-info {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo-item {
            font-size: 9px;
            font-weight: 700;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .rating-box {
            border: 1px solid #999;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="pink-border"></div>
        <div class="content">
            <div class="header">
                <div class="prime-video">prime video</div>
                <svg class="amazon-logo" viewBox="0 0 100 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M62.5 18C61.5 19.5 59.5 21 57 21C54.5 21 53 19.5 52.5 17.5C51.5 14 54 9 58.5 9C61 9 63 11 63.5 13L65 12.5C64 9 61 7 58 7C52 7 49 13 50 17.5C51 21 54 23 57.5 23C61 23 63.5 21 65 18.5L62.5 18Z" fill="#000"/>
                    <path d="M70 7.5C67 7.5 65 9.5 65 12.5V22H67.5V16H72.5V22H75V12.5C75 9.5 73 7.5 70 7.5ZM67.5 14V12.5C67.5 10.5 68.5 9.5 70 9.5C71.5 9.5 72.5 10.5 72.5 12.5V14H67.5Z" fill="#000"/>
                    <path d="M85 7.5C82 7.5 80 9.5 80 12.5V22H82.5V16H87.5V22H90V12.5C90 9.5 88 7.5 85 7.5ZM82.5 14V12.5C82.5 10.5 83.5 9.5 85 9.5C86.5 9.5 87.5 10.5 87.5 12.5V14H82.5Z" fill="#000"/>
                    <path d="M95 7.5C93 7.5 91.5 8.5 91 10V8H88.5V22H91V14.5C91 12 92 10.5 94 10.5C96 10.5 96.5 12 96.5 13.5V22H99V13C99 9.5 97.5 7.5 95 7.5Z" fill="#000"/>
                    <path d="M25 20C20 22 15 23 10 23C5 23 2 21 2 17C2 13 5 11 10 11C15 11 20 12 25 14" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                    <path d="M28 16C28 16 26 18 24 18C22 18 21 16 21 14C21 12 22 10 24 10C26 10 28 12 28 12" fill="#FF9900"/>
                </svg>
            </div>

            <div class="director-credit">
                FROM THE HEART & SOUL OF DIRECTOR<br>
                BILLY PORTER
            </div>

            <div class="tagline">
                WHEN IT<br>
                COMES<br>
                TO LOVE...
            </div>

            <div class="main-image">
                <div class="image-placeholder">
                    <div class="actor-left"></div>
                    <div class="actor-right"></div>
                    <div style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #999;">[Image: Two actors posing back-to-back]</div>
                </div>
            </div>

            <div class="title-section">
                <div class="title">
                    <span class="title-script">anything's</span><span class="title-bold">possible</span>
                </div>
            </div>

            <div class="credits">
                WRITTEN BY XIMENA GARCÍA LECUONA &nbsp;&nbsp; DIRECTED BY BILLY PORTER
            </div>

            <div class="release-info">
                JULY 22 | NEW MOVIE
            </div>

            <div class="logos">
                <div class="logo-item">ORION</div>
                <div class="logo-item rating-box">U/A</div>
                <div class="logo-item">MGM</div>
                <div class="logo-item">AMAZON<br>STUDIOS</div>
            </div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
