<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新媒体账号运营6种方法</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #efe0d1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: #fffaf5;
            width: 100%;
            max-width: 600px;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(139, 115, 85, 0.15);
            position: relative;
        }
        
        .header-tag {
            display: inline-block;
            background-color: #8b7355;
            color: #fff;
            padding: 8px 24px;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            top: 30px;
            left: 30px;
            clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
            padding-right: 35px;
        }
        
        .main-title {
            font-size: 42px;
            font-weight: 900;
            color: #2c2c2c;
            margin-top: 60px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .intro-section {
            margin-bottom: 25px;
            line-height: 1.8;
        }
        
        .intro-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .emphasis-text {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }
        
        .analysis-header {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .content-list {
            list-style: none;
            counter-reset: item;
            padding-left: 10px;
        }
        
        .content-list li {
            counter-increment: item;
            margin-bottom: 15px;
            font-size: 17px;
            line-height: 1.7;
            color: #222;
            font-weight: 500;
        }
        
        .content-list li::before {
            content: counter(item)、;
            font-weight: bold;
            margin-right: 4px;
        }
        
        .sub-details {
            color: #444;
            font-size: 16px;
            margin-left: 20px;
            margin-top: 4px;
            font-weight: normal;
        }
        
        .footer-text {
            text-align: center;
            margin-top: 40px;
            font-size: 16px;
            color: #555;
            font-weight: 600;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
            }
            
            .main-title {
                font-size: 32px;
            }
            
            .header-tag {
                font-size: 14px;
                padding: 6px 18px;
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-tag">新媒体账号运营6种方法</div>
        
        <h1 class="main-title">03 做好竞品分析</h1>
        
        <div class="intro-section">
            <p class="intro-text">前期的竞品分析</p>
            <p class="emphasis-text">一定要花大量的时间和精力去收集信息</p>
        </div>
        
        <div class="analysis-header">
            <p>仔细分析</p>
            <p>可以从以下几个方面来看</p>
        </div>
        
        <ol class="content-list">
            <li>账号人设标签</li>
            <li>账号选题规划</li>
            <li>内容脚本拆解：
                <div class="sub-details">结构、矛盾点、金句、痒点</div>
            </li>
            <li>内容形式：
                <div class="sub-details">场景道具服装，拍摄剪辑节奏</div>
            </li>
            <li>运营策略：
                <div class="sub-details">发布时间和频率，封面，文案，线上互动<br>用户运营，引流途径</div>
            </li>
        </ol>
        
        <div class="footer-text">@新媒体运营的十万个为什么</div>
    </div>
</body>
</html>
