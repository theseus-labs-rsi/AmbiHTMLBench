<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝果食谱卡片</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffecd9;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            display: flex;
            justify-content: center;
        }
        
        .container {
            width: 700px;
            background-color: #fffaf5;
            background-image: 
                linear-gradient(90deg, rgba(255,182,131,0.1) 50%, transparent 50%),
                linear-gradient(rgba(255,182,131,0.1) 50%, transparent 50%);
            background-size: 30px 30px;
            border: 12px solid #f4a460;
            padding: 25px;
            position: relative;
        }
        
        .recipe-section {
            position: relative;
            margin-bottom: 20px;
        }
        
        .divider {
            border-top: 4px dashed #f4a460;
            margin: 25px 0;
            opacity: 0.7;
        }
        
        /* Header Styles */
        .header-area {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            position: relative;
        }
        
        .energy-badge {
            background-color: #87ceeb;
            color: #2c5aa0;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transform: rotate(-8deg);
            border: 3px solid #5cacee;
            line-height: 1.2;
            text-align: center;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            margin-right: 15px;
            min-width: 60px;
        }
        
        .main-title {
            font-size: 38px;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bagel-icon {
            font-size: 32px;
        }
        
        .attribution {
            position: absolute;
            right: 0;
            top: 5px;
            font-size: 16px;
            color: #666;
        }
        
        /* Materials */
        .step-header {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 15px 0 10px 0;
        }
        
        .materials-row {
            display: flex;
            gap: 25px;
            margin-bottom: 15px;
            align-items: flex-end;
        }
        
        .material-item {
            text-align: center;
            font-size: 14px;
            color: #444;
        }
        
        .material-placeholder {
            width: 75px;
            height: 55px;
            background-color: #e8e8e8;
            border: 2px solid #bbb;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #666;
            overflow: hidden;
        }
        
        /* Instructions */
        .instruction {
            font-size: 17px;
            line-height: 1.6;
            color: #222;
            margin: 15px 0;
            padding-left: 5px;
        }
        
        /* Layout Grid */
        .visual-layout {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .left-panel {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Placeholders */
        .large-bagel {
            width: 240px;
            height: 190px;
            background: radial-gradient(circle at 30% 30%, #d2b48c, #8b7355);
            border-radius: 50%;
            position: relative;
            border: 3px solid #6b5344;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }
        
        .large-bagel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #5d4e37, #3e3428);
            border-radius: 50%;
            border: 2px solid #2d251b;
        }
        
        .cartoon-girl {
            width: 130px;
            height: 170px;
            background-color: #ffe4c4;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            margin-top: -20px;
            z-index: 5;
            border: 2px solid #deb887;
        }
        
        .cartoon-girl::before {
            content: '👧';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
        }
        
        /* Process Flow */
        .process-chain {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        
        .oven-icon {
            width: 85px;
            height: 65px;
            background: linear-gradient(to bottom, #f5f5f5, #ddd);
            border: 3px solid #888;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .oven-icon::after {
            content: '🔥';
            font-size: 24px;
        }
        
        .arrow {
            font-size: 28px;
            color: #888;
            font-weight: bold;
        }
        
        .bowl-mix {
            width: 75px;
            height: 50px;
            background-color: #fff;
            border: 3px solid #888;
            border-radius: 0 0 40px 40px;
            position: relative;
        }
        
        .mixture-result {
            width: 70px;
            height: 70px;
            background-color: #f5deb3;
            border-radius: 50%;
            border: 2px solid #d2b48c;
            position: relative;
            overflow: hidden;
        }
        
        .mixture-result::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 30% 30%, #8b7355 2px, transparent 2px),
                              radial-gradient(circle at 70% 60%, #8b7355 2px, transparent 2px),
                              radial-gradient(circle at 40% 70%, #8b7355 2px, transparent 2px);
            background-size: 15px 15px;
        }
        
        /* Stamp */
        .lucky-stamp {
            position: absolute;
            right: 20px;
            top: 60px;
            width: 95px;
            height: 95px;
            background-color: #ef5350;
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(12deg);
            border: 4px solid #c62828;
            font-weight: bold;
            font-size: 22px;
            line-height: 1.2;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        /* Bottom Section Specifics */
        .final-bagel-banana {
            width: 230px;
            height: 170px;
            background: radial-gradient(circle at 30% 30%, #cd853f, #8b4513);
            border-radius: 50%;
            position: relative;
            border: 3px solid #654321;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        
        .final-bagel-banana::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #5d4037, #3e2723);
            border-radius: 50%;
            border: 2px solid #2d1f1a;
        }
        
        .banana-slice {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 35px;
            background: linear-gradient(to bottom, #ffd700, #daa520);
            border-radius: 20px;
            border: 2px solid #b8860b;
            z-index: 2;
        }
        
        .cocoa-spread {
            width: 65px;
            height: 45px;
            background-color: #5d4037;
            border-radius: 50%;
            border: 2px solid #3e2723;
        }
        
        .banana-topping {
            width: 65px;
            height: 55px;
            background-color: #ffd700;
            border-radius: 50%;
            border: 2px solid #daa520;
            position: relative;
        }
        
        .banana-topping::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 30px;
            background-color: #fff8dc;
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 第一部分：核桃奶酪贝果 -->
        <div class="recipe-section">
            <div class="header-area">
                <div class="energy-badge">元气<br>满满</div>
                <h1 class="main-title">核桃奶酪贝果<span class="bagel-icon">🥯</span></h1>
            </div>
            
            <div class="step-header">1.准备材料</div>
            <div class="materials-row">
                <div class="material-item">
                    <div class="material-placeholder">[奶酪]</div>
                    <div>奶酪</div>
                </div>
                <div class="material-item">
                    <div class="material-placeholder">[贝果]</div>
                    <div>贝果</div>
                </div>
                <div class="material-item">
                    <div class="material-placeholder">[核桃仁]</div>
                    <div>核桃仁</div>
                </div>
            </div>
            
            <div class="instruction">
                2.核桃仁烤2分钟左右，搓掉皮，<br>
                捣碎后和奶酪混合到一起，涂抹<br>
                在贝果上
            </div>
            
            <div class="visual-layout">
                <div class="left-panel">
                    <div class="large-bagel"></div>
                    <div class="cartoon-girl"></div>
                </div>
                <div class="right-panel">
                    <div class="process-chain">
                        <div class="oven-icon"></div>
                        <div class="arrow">→</div>
                        <div class="bowl-mix"></div>
                        <div class="arrow">→</div>
                        <div class="mixture-result"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <!-- 第二部分：香蕉可可贝果 -->
        <div class="recipe-section">
            <div class="lucky-stamp">
                <div>平安</div>
                <div>喜乐</div>
            </div>
            
            <div class="header-area">
                <h1 class="main-title">香蕉可可贝果<span class="bagel-icon">🥯</span></h1>
                <div class="attribution">@哎呀睥绿豆汤</div>
            </div>
            
            <div class="step-header">1.准备材料</div>
            <div class="materials-row">
                <div class="material-item">
                    <div class="material-placeholder">[奶酪]</div>
                    <div>奶酪</div>
                </div>
                <div class="material-item">
                    <div class="material-placeholder">[贝果]</div>
                    <div>贝果</div>
                </div>
                <div class="material-item">
                    <div class="material-placeholder">[香蕉]</div>
                    <div>香蕉</div>
                </div>
                <div class="material-item">
                    <div class="material-placeholder">[可可粉]</div>
                    <div>可可粉</div>
                </div>
            </div>
            
            <div class="instruction">
                2.奶酪加入可可粉，搅拌均匀涂<br>
                抹在贝果上摆上水果
            </div>
            
            <div class="visual-layout">
                <div class="left-panel" style="align-items: flex-start; padding-top: 20px;">
                    <div class="process-chain" style="justify-content: flex-start;">
                        <div class="bowl-mix"></div>
                        <div class="arrow">→</div>
                        <div class="cocoa-spread"></div>
                        <div class="arrow">→</div>
                        <div class="banana-topping"></div>
                    </div>
                </div>
                <div class="right-panel">
                    <div class="final-bagel-banana">
                        <div class="banana-slice"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
