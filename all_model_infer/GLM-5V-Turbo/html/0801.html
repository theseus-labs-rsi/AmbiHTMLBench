<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loneliness Quote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #252138;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Times New Roman', serif;
            color: #c9a96e;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        .symbol-container {
            margin-bottom: 60px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .symbol {
            width: 180px;
            height: 180px;
            border: 2px solid #c9a96e;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: transparent;
        }
        
        .female-symbol {
            transform: rotate(-45deg);
            font-size: 80px;
            line-height: 1;
        }
        
        .arc {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%) rotate(-45deg);
            width: 140px;
            height: 70px;
            border: 2px solid #c9a96e;
            border-bottom: none;
            border-radius: 140px 140px 0 0;
            overflow: hidden;
        }
        
        .arc-lines {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 136px;
            height: 68px;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 6px,
                #c9a96e 6px,
                #c9a96e 7px
            );
            opacity: 0.6;
        }
        
        .english-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            letter-spacing: 0.5px;
        }
        
        .sparkle {
            font-size: 20px;
            color: #c9a96e;
        }
        
        .chinese-quote {
            font-size: 28px;
            line-height: 1.8;
            font-weight: bold;
            letter-spacing: 2px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .quote-mark {
            font-size: 36px;
            line-height: 0;
            vertical-align: -10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="symbol-container">
            <div class="arc">
                <div class="arc-lines"></div>
            </div>
            <div class="symbol">
                <div class="female-symbol">♀</div>
            </div>
        </div>
        
        <div class="english-text">
            <span class="sparkle">✦</span>
            <span>I think the so-called loneliness refers to the person you are facing,<br>whose emotions are not on the same frequency as your own.</span>
            <span class="sparkle">✦</span>
        </div>
        
        <div class="chinese-quote">
            <span class="quote-mark">“</span><br>
            我想所谓孤独，<br>
            就是你面对的那个人，<br>
            他的情绪和你自己的情绪，<br>
            不在同一个频率。<br>
            <span class="quote-mark” style="vertical-align: 10px;">”</span>
        </div>
    </div>
</body>
</html>
