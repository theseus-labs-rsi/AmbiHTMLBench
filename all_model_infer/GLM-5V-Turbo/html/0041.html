<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形的稳定性</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Songti SC", "SimSun", "STSong", serif;
            line-height: 1.8;
            color: #333;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
        }
        
        p {
            text-indent: 2em;
            margin-bottom: 12px;
            font-size: 16px;
            text-align: justify;
        }
        
        .figure-row {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            margin: 20px 0;
            gap: 20px;
        }
        
        .figure-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .placeholder {
            width: 100%;
            max-width: 280px;
            height: 140px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        .placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .caption {
            font-size: 14px;
            color: #333;
            text-align: center;
        }
        
        .figure-caption {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        
        .exercise-section {
            border: 2px dashed #d4a574;
            border-radius: 15px;
            padding: 20px;
            margin: 30px 0;
            position: relative;
            background-color: #fffcf8;
        }
        
        .exercise-title {
            position: absolute;
            top: -15px;
            left: 25px;
            background-color: #e89b3c;
            color: white;
            padding: 4px 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
        }
        
        .exercise-content {
            margin-top: 10px;
        }
        
        .exercise-question {
            font-size: 15px;
            margin-bottom: 20px;
            padding-left: 10px;
        }
        
        .problems-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px 20px;
            padding: 10px;
        }
        
        .problem-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .problem-placeholder {
            width: 100px;
            height: 80px;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            margin-bottom: 8px;
        }
        
        .problem-label {
            font-size: 13px;
            color: #666;
        }
        
        .footer {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-top: 40px;
            padding-right: 10px;
        }
        
        /* Specific placeholder styles for different images */
        .img-bridge { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .img-crane { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .img-hanger { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .img-door { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <p>还可以发现，斜钉一根木条的四边形木架的形状不会改变，这是因为斜钉一根木条后，四边形变成两个三角形。由于三角形有稳定性，斜钉一根木条的木架在未安装好之前也不会变形。</p>
    
    <p>三角形的稳定性有广泛的应用，图11.1-8表示其中一些例子，你能再举一些例子吗？</p>
    
    <div class="figure-row">
        <div class="figure-item">
            <div class="placeholder img-bridge">
                <span style="color:white; font-weight:bold;">[图：钢架桥]</span>
            </div>
            <div class="caption">钢架桥</div>
        </div>
        <div class="figure-item">
            <div class="placeholder img-crane">
                <span style="color:white; font-weight:bold;">[图：起重机]</span>
            </div>
            <div class="caption">起重机</div>
        </div>
    </div>
    
    <div class="figure-caption">图11.1-8</div>
    
    <p>四边形的不稳定性也有广泛的应用，图11.1-9表示其中一些例子。</p>
    
    <div class="figure-row">
        <div class="figure-item">
            <div class="placeholder img-hanger">
                <span style="color:#333; font-weight:bold;">[图：活动挂架]</span>
            </div>
            <div class="caption">活动挂架</div>
        </div>
        <div class="figure-item">
            <div class="placeholder img-door">
                <span style="color:white; font-weight:bold;">[图：伸缩门]</span>
            </div>
            <div class="caption">伸缩门</div>
        </div>
    </div>
    
    <div class="figure-caption">图11.1-9</div>
    
    <div class="exercise-section">
        <div class="exercise-title">练习</div>
        <div class="exercise-content">
            <div class="exercise-question">下列图形中哪些具有稳定性？</div>
            
            <div class="problems-grid">
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <polygon points="10,50 70,50 40,10"/>
                            <line x1="10" y1="50" x2="40" y2="10"/>
                        </svg>
                    </div>
                    <div class="problem-label">(1)</div>
                </div>
                
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <rect x="10" y="15" width="60" height="35"/>
                            <line x1="40" y1="15" x2="40" y2="50"/>
                        </svg>
                    </div>
                    <div class="problem-label">(2)</div>
                </div>
                
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <rect x="15" y="25" width="50" height="25"/>
                            <polyline points="15,25 40,10 65,25"/>
                        </svg>
                    </div>
                    <div class="problem-label">(3)</div>
                </div>
                
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <polygon points="40,5 75,25 65,55 15,55 5,25"/>
                            <line x1="40" y1="5" x2="15" y2="55"/>
                            <line x1="40" y1="5" x2="65" y2="55"/>
                        </svg>
                    </div>
                    <div class="problem-label">(4)</div>
                </div>
                
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <polygon points="25,5 55,5 75,30 55,55 25,55 5,30"/>
                            <line x1="25" y1="5" x2="55" y2="55"/>
                        </svg>
                    </div>
                    <div class="problem-label">(5)</div>
                </div>
                
                <div class="problem-item">
                    <div class="problem-placeholder">
                        <svg width="80" height="60" viewBox="0 0 80 60" fill="none" stroke="#333" stroke-width="1.5">
                            <polygon points="40,5 65,17 65,43 40,55 15,43 15,17"/>
                            <line x1="40" y1="5" x2="15" y2="17"/>
                            <line x1="40" y1="5" x2="65" y2="17"/>
                            <line x1="40" y1="5" x2="15" y2="43"/>
                            <line x1="40" y1="5" x2="65" y2="43"/>
                            <line x1="40" y1="5" x2="40" y2="55"/>
                        </svg>
                    </div>
                    <div class="problem-label">(6)</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        第十一章 三角形 7
    </div>
</body>
</html>
