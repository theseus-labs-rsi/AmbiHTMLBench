<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头孢菌素分类</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 15px;
        }
        .title-row {
            display: flex;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }
        .star-icon {
            color: #FFD700;
            margin-left: 10px;
            font-size: 28px;
        }
        .main-layout {
            display: flex;
            gap: 15px;
        }
        .left-content {
            flex: 1;
        }
        .right-images {
            width: 200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .image-placeholder {
            border: 2px solid #ccc;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            overflow: hidden;
            position: relative;
        }
        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            border: 2px solid #006400;
        }
        th, td {
            border: 1px solid #006400;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        .header-cell {
            background-color: #006400;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .generation-cell {
            background-color: #90EE90;
            font-size: 18px;
            font-weight: bold;
            width: 80px;
        }
        .drug-cell {
            background-color: #98FB98;
            text-align: left;
            padding-left: 15px;
            font-size: 18px;
            line-height: 1.6;
        }
        .circled {
            border: 3px solid #000;
            border-radius: 50%;
            display: inline-block;
            padding: 2px 8px;
            position: relative;
        }
        .memory-table {
            border: 2px solid #006400;
        }
        .memory-header {
            background-color: #006400;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .memory-gen {
            background-color: #90EE90;
            font-size: 18px;
            font-weight: bold;
            width: 100px;
        }
        .memory-content {
            background-color: #fff;
            text-align: left;
            padding-left: 15px;
            font-size: 18px;
        }
        .highlight {
            background-color: #FFFF00;
            text-decoration: underline;
            text-decoration-color: #FFFF00;
            text-decoration-thickness: 3px;
        }
        .yellow-underline {
            text-decoration: underline;
            text-decoration-color: #FFFF00;
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-row">
            <span>1.头孢菌素分类</span>
            <span class="star-icon">☆</span>
        </div>
        
        <div class="main-layout">
            <div class="left-content">
                <!-- Main Classification Table -->
                <table>
                    <tr>
                        <td rowspan="4" class="header-cell" style="writing-mode: vertical-lr; letter-spacing: 10px;">头孢菌素类</td>
                        <td class="generation-cell">第一代</td>
                        <td class="drug-cell">头孢唑林、氨苄、羟氨苄、拉定、硫脒、噻吩</td>
                    </tr>
                    <tr>
                        <td class="generation-cell">第二代</td>
                        <td class="drug-cell">头孢呋辛、孟多、替安、克洛、丙烯</td>
                    </tr>
                    <tr>
                        <td class="generation-cell"><span class="circled">第三代</span></td>
                        <td class="drug-cell">头孢他啶、他美、匹胺、哌酮、曲松、噻肟<br>克肟、唑肟、甲肟、泊肟、<span class="yellow-underline">地嗪</span></td>
                    </tr>
                    <tr>
                        <td class="generation-cell">第四代</td>
                        <td class="drug-cell">头孢匹罗、<span class="yellow-underline">吡肟</span></td>
                    </tr>
                </table>

                <!-- Memory Aid Table -->
                <table class="memory-table">
                    <tr>
                        <td colspan="2" class="memory-header">记忆一下</td>
                    </tr>
                    <tr>
                        <td class="memory-gen">第一代</td>
                        <td class="memory-content">一头坐便拉定，米粉吃多了</td>
                    </tr>
                    <tr>
                        <td class="memory-gen">第二代</td>
                        <td class="memory-content">二呋孟多，<span class="yellow-underline">替俺克丙</span></td>
                    </tr>
                    <tr>
                        <td class="memory-gen">第三代</td>
                        <td class="memory-content"><span class="yellow-underline">他胺哌曲肟三昧地</span></td>
                    </tr>
                    <tr>
                        <td class="memory-gen">第四代</td>
                        <td class="memory-content"><span class="yellow-underline">四匹罗子吡肟牛</span></td>
                    </tr>
                </table>
            </div>

            <div class="right-images">
                <div class="image-placeholder" style="height: 120px;">
                    [Image: Running figure]
                </div>
                <div class="image-placeholder" style="height: 120px;">
                    [Image: Baby lying down]
                </div>
                <div class="image-placeholder" style="height: 120px;">
                    [Image: Dancing couple]
                </div>
                <div class="image-placeholder" style="height: 120px;">
                    [Image: Donkey/Mule]
                </div>
            </div>
        </div>
    </div>
</body>
</html>
