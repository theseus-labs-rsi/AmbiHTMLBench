<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句摘抄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", "STSong", serif;
            background-color: #e8dfd0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #e8dfd0;
        }
        
        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 30px 15px 30px;
            border-bottom: 2px solid #000;
            margin-bottom: 40px;
            position: relative;
        }
        
        .logo-section {
            flex: 1;
        }
        
        .logo {
            font-size: 72px;
            color: #c41e1e;
            font-family: "KaiTi", "STKaiti", "楷体", cursive;
            font-weight: bold;
            letter-spacing: 5px;
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: #666;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            margin-top: 5px;
        }
        
        .header-right {
            text-align: right;
            flex-shrink: 0;
        }
        
        .category {
            font-size: 32px;
            color: #000;
            font-weight: normal;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .theme {
            font-size: 28px;
            color: #000;
            border-top: 2px solid #000;
            padding-top: 8px;
            letter-spacing: 3px;
            font-weight: normal;
        }
        
        /* Content Sections */
        .quote-section {
            margin-bottom: 50px;
            padding: 0 20px;
        }
        
        .main-quote {
            font-size: 42px;
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
            letter-spacing: 3px;
            line-height: 1.4;
            font-weight: 500;
        }
        
        .example-label {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
            font-weight: normal;
        }
        
        .example-text {
            font-size: 19px;
            color: #222;
            line-height: 1.7;
            text-align: justify;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <div class="logo">人民日报</div>
                <div class="logo-subtitle">RENMIN RIBAO</div>
            </div>
            <div class="header-right">
                <div class="category">金句 | 摘抄</div>
                <div class="theme">坚持奋斗主题</div>
            </div>
        </div>

        <!-- Quote 1 -->
        <div class="quote-section">
            <div class="main-quote">
                夜色难免黑凉<br>前行必有曙光
            </div>
            <div class="example-label">举例：</div>
            <div class="example-text">
                夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功！
            </div>
        </div>

        <!-- Quote 2 -->
        <div class="quote-section">
            <div class="main-quote">
                道固远，笃行可至<br>事虽巨，坚为必成
            </div>
            <div class="example-label">举例：</div>
            <div class="example-text">
                道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
            </div>
        </div>
    </div>
</body>
</html>
