<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福国夫人震怒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", "STSong", serif;
            background-color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .document-container {
            display: flex;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }
        
        .vertical-columns {
            display: flex;
            gap: 4px;
        }
        
        .vertical-column {
            writing-mode: vertical-rl;
            font-size: 22px;
            line-height: 1.4;
            letter-spacing: 2px;
            padding: 10px 5px;
            border: 3px solid #000;
            background-color: #c0c0c0;
            height: auto;
            min-height: 400px;
            font-weight: bold;
        }
        
        .main-content {
            flex: 1;
            background-color: #c8c8c8;
            padding: 25px 30px;
            border-left: 1px solid #999;
        }
        
        .paragraph {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: justify;
            text-indent: 2em;
        }
        
        .source-line {
            font-size: 17px;
            margin-bottom: 20px;
            text-indent: 2em;
        }
        
        .quote-block {
            font-size: 17px;
            line-height: 1.9;
            text-align: justify;
            text-indent: 2em;
        }
        
        @media (max-width: 600px) {
            .document-container {
                flex-direction: column;
            }
            
            .vertical-column {
                writing-mode: horizontal-tb;
                min-height: auto;
                padding: 10px;
            }
            
            .vertical-columns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="document-container">
        <div class="vertical-columns">
            <div class="vertical-column">福國王夫人震怒欲逐之</div>
            <div class="vertical-column">國朝妻管嚴疑有私生子</div>
        </div>
        
        <div class="main-content">
            <p class="paragraph">瞳孔地震！將王安石抬進孔廟的好女婿蔡卞近日疑似陷入私生子風波。蔡卞妻福國夫人王氏聞之震怒，欲除妾生子，因故生病。</p>
            
            <p class="source-line">本消息來自翰林醫官院藥方筆錄：</p>
            
            <p class="quote-block">《香木散》：治妊娠五個月已後。常胸腹間氣刺滿痛，或腸鳴，以至嘔逆減食。此由喜怒憂慮過度、飲食失節之所致。蔡元度寵人有子，夫人生怒，欲逐之，遂病。醫官王師復處此方三服而癒，後用果驗。</p>
        </div>
    </div>

    <script>

</body>
</html>
