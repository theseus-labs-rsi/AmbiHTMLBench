<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句合集系列</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #d4b896;
            background-image: linear-gradient(rgba(212, 184, 150, 0.9), rgba(196, 176, 148, 0.95)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.15"/></svg>');
            font-family: "SimSun", "Songti SC", serif;
            padding: 20px;
            min-height: 100vh;
            color: #1a1a1a;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: rgba(212, 184, 150, 0.6);
            padding: 30px;
            border-radius: 2px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            position: relative;
        }
        
        .logo-section {
            flex: 1;
        }
        
        .main-title {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 72px;
            color: #c62828;
            font-weight: bold;
            letter-spacing: 5px;
            line-height: 1;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }
        
        .sub-title {
            font-family: "Times New Roman", serif;
            font-size: 16px;
            color: #8b4513;
            letter-spacing: 8px;
            margin-left: 5px;
            font-weight: bold;
        }
        
        .meta-section {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .meta-top {
            font-size: 22px;
            color: #000;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: normal;
        }
        
        .series-title {
            font-size: 26px;
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: 3px;
            letter-spacing: 3px;
            font-weight: normal;
        }
        
        .content {
            margin-top: 40px;
        }
        
        .item {
            margin-bottom: 35px;
        }
        
        .quote-number {
            font-size: 32px;
            color: #000;
            font-weight: bold;
            margin-right: 8px;
        }
        
        .quote-text {
            font-size: 36px;
            line-height: 1.4;
            color: #000;
            font-weight: 500;
            display: inline;
            letter-spacing: 1px;
        }
        
        .explanation {
            margin-top: 12px;
            margin-left: 10px;
            font-size: 18px;
            line-height: 1.6;
            color: #2c2c2c;
        }
        
        .explanation-label {
            font-weight: bold;
            color: #000;
        }
        
        @media (max-width: 600px) {
            .main-title {
                font-size: 48px;
            }
            .quote-text {
                font-size: 28px;
            }
            .explanation {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-section">
                <div class="main-title">人民日报</div>
                <div class="sub-title">RENMIN RIBAO</div>
            </div>
            <div class="meta-section">
                <div class="meta-top">金句|素材|摘抄</div>
                <div class="series-title">金句合集系列</div>
            </div>
        </div>
        
        <div class="content">
            <div class="item">
                <span class="quote-number">1、</span><span class="quote-text">愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</span>
                <div class="explanation">
                    <span class="explanation-label">释义:</span><br>
                    希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝与琐事而烦恼忧愁。
                </div>
            </div>
            
            <div class="item">
                <span class="quote-number">2、</span><span class="quote-text">总有人间一两风，<br>填我十万八千梦。</span>
                <div class="explanation">
                    <span class="explanation-label">释义:</span><br>
                    人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。
                </div>
            </div>
            
            <div class="item">
                <span class="quote-number">3、</span><span class="quote-text">日出有盼，日落有思，<br>平平安安，所遇皆甜。</span>
                <div class="explanation">
                    <span class="explanation-label">释义:</span><br>
                    只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。
                </div>
            </div>
        </div>
    </div>
</body>
</html>
