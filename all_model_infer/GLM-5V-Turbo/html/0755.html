<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唐诗选</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5deb3;
            font-family: "SimSun", "宋体", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .poetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background-color: #fff;
            padding: 15px;
            border: 2px solid #d2b48c;
            max-width: 700px;
        }
        
        .poem-card {
            border: 1px solid #8b7355;
            padding: 25px 30px;
            text-align: center;
            background-color: #fffef5;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .poem-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .poem-author {
            font-size: 18px;
            color: #5c4033;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        
        .poem-text {
            font-size: 24px;
            line-height: 1.6;
            letter-spacing: 3px;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="poetry-grid">
        <div class="poem-card">
            <div class="poem-title">《登鹳雀楼》</div>
            <div class="poem-author">(唐-王之涣)</div>
            <div class="poem-text">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</div>
        </div>
        
        <div class="poem-card">
            <div class="poem-title">《静夜思》</div>
            <div class="poem-author">(唐-李白)</div>
            <div class="poem-text">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</div>
        </div>
        
        <div class="poem-card">
            <div class="poem-title">《古朗月行》</div>
            <div class="poem-author">(唐-李白)</div>
            <div class="poem-text">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</div>
        </div>
        
        <div class="poem-card">
            <div class="poem-title">《寻隐者不遇》</div>
            <div class="poem-author">(唐-贾岛)</div>
            <div class="poem-text">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</div>
        </div>
        
        <div class="poem-card">
            <div class="poem-title">《咏鹅》</div>
            <div class="poem-author">(唐-骆宾王)</div>
            <div class="poem-text">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</div>
        </div>
        
        <div class="poem-card">
            <div class="poem-title">《草》</div>
            <div class="poem-author">(唐-白居易)</div>
            <div class="poem-text">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</div>
        </div>
    </div>
</body>
</html>
