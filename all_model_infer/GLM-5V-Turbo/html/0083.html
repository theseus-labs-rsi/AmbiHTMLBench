<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝術攝影展 - 瞬息之間</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #b3b3b3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            color: #000000;
            padding: 50px 60px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 35px;
        }

        .header-left {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .main-title-cn {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .main-title-en {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.3em;
            height: 120px;
        }

        .divider {
            width: 100%;
            height: 3px;
            background-color: #000;
            margin: 25px 0 45px 0;
        }

        /* Main Content Grid */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
            margin-bottom: 50px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
        }

        .giant-text-shunxi {
            font-size: 200px;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -10px;
            margin-bottom: 15px;
        }

        .artist-section {
            margin-top: 10px;
        }

        .artist-label {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .artist-names {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 110px;
            font-weight: 900;
            line-height: 1;
            margin-top: 5px;
            letter-spacing: -5px;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: relative;
        }

        .english-main-title {
            font-size: 78px;
            font-weight: 900;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin-bottom: 20px;
        }

        .giant-text-zhijian {
            font-size: 220px;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -12px;
            position: relative;
            z-index: 1;
        }

        /* Quote Section */
        .quote-section {
            margin-top: 70px;
            max-width: 600px;
        }

        .quote-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            margin-top: 80px;
            display: flex;
            gap: 15px;
            font-size: 19px;
            font-weight: 500;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-divider {
            width: 2px;
            height: 18px;
            background-color: #000;
            margin: 0 5px;
        }

        .coffee-brand {
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            opacity: 0.9;
        }

        .xiaohongshu-badge {
            background-color: rgba(255,255,255,0.9);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #ff2442;
        }

        .user-id {
            font-size: 13px;
            color: #333;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="main-title-cn">
                    藝術<br>攝影展
                </div>
                <div class="main-title-en">
                    ARTIST<br>PHOTO<br>EXHIBITION
                </div>
            </div>
            <div class="vertical-text">定格光影</div>
        </div>

        <div class="divider"></div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="left-column">
                <div class="giant-text-shunxi">瞬息</div>
                <div class="artist-section">
                    <div class="artist-label">藝術家</div>
                    <div class="artist-names">森蘭 王沐春</div>
                </div>
                <div class="date-display">08/14</div>
            </div>

            <div class="right-column">
                <div class="english-main-title">
                    IN THE<br>BLINK OF<br>AN EYE
                </div>
                <div class="giant-text-zhijian">之間</div>
            </div>
        </div>

        <!-- Quote -->
        <div class="quote-section">
            <p class="quote-text">
                IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
                YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
                EVERYTHING IN MY MIND AS AN EXERCISE.
            </p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>活動地址：濱江西路西溪街二十七號</span>
            <div class="footer-divider"></div>
            <span>主辦單位：壹畫咖啡館</span>
            <span class="coffee-brand">ONE COFFEE</span>
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        <div class="xiaohongshu-badge">小紅書</div>
        <div class="user-id">小红书号: bewo11221</div>
    </div>
</body>
</html>
