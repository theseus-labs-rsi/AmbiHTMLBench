<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房注意事项</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #8fa884;
            background-image: 
                radial-gradient(circle at 95% 35%, rgba(255,223,0,0.3) 0%, transparent 20%),
                radial-gradient(circle at 98% 50%, rgba(255,223,0,0.2) 0%, transparent 15%),
                radial-gradient(circle at 90% 65%, rgba(255,223,0,0.25) 0%, transparent 18%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 40px 50px 50px 40px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .main-title {
            text-align: center;
            font-size: 36px;
            color: #4a5d3e;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .section {
            margin-bottom: 30px;
            position: relative;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        
        .circle-icon {
            width: 36px;
            height: 36px;
            border: 3px solid #d32f2f;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
        }
        
        .section-title {
            line-height: 1;
        }
        
        .content-list {
            list-style: none;
            padding-left: 10px;
            font-size: 20px;
            line-height: 1.7;
            color: #222;
        }
        
        .content-list li {
            margin-bottom: 8px;
            padding-left: 5px;
        }
        
        .cat-illustration {
            position: absolute;
            right: 20px;
            top: 380px;
            width: 140px;
            height: 160px;
            z-index: 10;
        }
        
        .watermark {
            position: absolute;
            top: 45%;
            left: 55%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 18px;
            color: rgba(200, 200, 200, 0.5);
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            font-family: cursive, sans-serif;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
            }
            
            .main-title {
                font-size: 28px;
            }
            
            .section-header {
                font-size: 26px;
            }
            
            .content-list {
                font-size: 16px;
            }
            
            .cat-illustration {
                width: 100px;
                height: 120px;
                right: 10px;
                top: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">租房注意事项</h1>
        
        <div class="watermark">@带毛的栗子<br>from小红书</div>
        
        <div class="section">
            <div class="section-header">
                <span class="circle-icon"></span>
                <span class="section-title">卧室</span>
            </div>
            <ol class="content-list">
                <li>1.空调是否正常使用，空调排水位置，外机位置</li>
                <li>2.所有电灯，插座是否ok</li>
                <li>3.床都否OK，躺下翻身是否有响声</li>
                <li>4.卧室地板情况</li>
                <li>5.衣柜是否完好</li>
                <li>6.各个房间是否能反锁</li>
                <li>7.装修情况，不要太新，也不要太久</li>
                <li>8.排查针孔摄像头</li>
                <li>9.wifi信号情况</li>
            </ol>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="circle-icon"></span>
                <span class="section-title">其他</span>
            </div>
            <ol class="content-list">
                <li>1.各类遥控器清点　2.所有钥匙清点</li>
                <li>3.所有墙面情况，有无裂痕掉漆，脱皮</li>
                <li>4.所有水龙头一起打开，看水压是否足够</li>
                <li>5.如果是燃气热水器，也留意下安全使用情况</li>
            </ol>
        </div>
        
        <div class="cat-illustration placeholder">
            <svg viewBox="0 0 140 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cat body -->
                <ellipse cx="70" cy="115" rx="38" ry="42" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
                
                <!-- Cat head -->
                <circle cx="70" cy="75" r="32" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
                
                <!-- Ears -->
                <path d="M42 58 L48 35 L60 52 Z" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
                <path d="M98 58 L92 35 L80 52 Z" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
                
                <!-- Headphones -->
                <rect x="34" y="62" width="12" height="18" rx="6" fill="#ff6b6b" stroke="#333" stroke-width="1.5"/>
                <rect x="94" y="62" width="12" height="18" rx="6" fill="#ff6b6b" stroke="#333" stroke-width="1.5"/>
                <path d="M46 68 Q70 45 94 68" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
                
                <!-- Eyes closed -->
                <path d="M56 78 Q60 82 64 78" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M76 78 Q80 82 84 78" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                
                <!-- Nose -->
                <ellipse cx="70" cy="86" rx="3" ry="2" fill="#ffb6c1"/>
                
                <!-- Mouth -->
                <path d="M66 91 Q70 95 74 91" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                
                <!-- Arms/Paws -->
                <ellipse cx="85" cy="105" rx="10" ry="14" fill="#f5f5f5" stroke="#333" stroke-width="2" transform="rotate(20 85 105)"/>
                <ellipse cx="92" cy="112" rx="8" ry="10" fill="#f5f5f5" stroke="#333" stroke-width="2" transform="rotate(-10 92 112)"/>
                
                <!-- Tail -->
                <path d="M108 130 Q125 125 128 145 Q130 155 122 158" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
    </div>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
