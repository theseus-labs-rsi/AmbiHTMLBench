<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用合理的标点符号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #ffffff;
            padding: 40px;
            line-height: 1.6;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            position: relative;
        }
        
        .title-area {
            flex: 1;
        }
        
        .main-title {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        
        .highlight {
            background-color: #FFF200;
            padding: 2px 6px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #555;
            margin-top: 10px;
        }
        
        .number-badge {
            width: 80px;
            height: 80px;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin-left: 20px;
            flex-shrink: 0;
        }
        
        .content-section {
            margin-top: 25px;
            border-radius: 4px;
            padding: 30px;
            position: relative;
            min-height: 280px;
        }
        
        .section-pink {
            background-color: #FFF5F0;
        }
        
        .section-blue {
            background-color: #F5FAFF;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 600;
        }
        
        .icon-circle {
            width: 28px;
            height: 28px;
            border: 2px solid #E8A87C;
            border-radius: 50%;
            margin-right: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #E8A87C;
            font-size: 18px;
        }
        
        .icon-cross {
            width: 28px;
            height: 28px;
            border: 2px solid #7FB3D5;
            border-radius: 4px;
            margin-right: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #7FB3D5;
            font-size: 18px;
            transform: rotate(0deg);
        }
        
        .info-block {
            margin-bottom: 20px;
            font-size: 17px;
            line-height: 1.8;
        }
        
        .info-row {
            margin-bottom: 8px;
        }
        
        .label-tag {
            display: inline-block;
            background-color: #FF6B6B;
            color: white;
            padding: 3px 10px;
            font-size: 14px;
            margin-right: 10px;
            border-radius: 2px;
            font-weight: 500;
        }
        
        .character-placeholder {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 100px;
            height: 100px;
            background-color: rgba(255,255,255,0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            text-align: center;
            border: 1px dashed #ccc;
        }
        
        .footer {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 11px;
            color: #999;
            letter-spacing: 1px;
        }
        
        .footer-logo {
            border: 1px solid #333;
            padding: 4px 8px;
            font-weight: bold;
            color: #333;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <div class="title-area">
                <h1 class="main-title">
                    <span class="highlight">使用合理的</span><br>
                    标点符号
                </h1>
                <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>
            </div>
            <div class="number-badge">01</div>
        </div>

        <!-- Positive Example Section -->
        <div class="content-section section-pink">
            <div class="section-header">
                <span class="icon-circle">○</span>
                <span>使用直线或外框</span>
            </div>
            
            <div class="info-block">
                <div class="info-row">地点 | 武汉国际会展中心</div>
                <div class="info-row">时间 | 2018 年 8 月 20 日</div>
            </div>
            
            <div class="info-block">
                <div class="info-row">
                    <span class="label-tag">地点</span>武汉国际会展中心
                </div>
                <div class="info-row">
                    <span class="label-tag">时间</span>2018 年 8 月 20 日
                </div>
            </div>
            
            <div class="character-placeholder">
                [Cartoon Character: Happy Chicken]
            </div>
        </div>

        <!-- Negative Example Section -->
        <div class="content-section section-blue">
            <div class="section-header">
                <span class="icon-cross">×</span>
                <span>使用冒号</span>
            </div>
            
            <div class="info-block">
                <div class="info-row">地点：武汉国际会展中心</div>
                <div class="info-row">时间：2018 年 8 月 20 日</div>
            </div>
            
            <div class="character-placeholder">
                [Cartoon Character: Angry Chicken]
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div>
                ADVERTISING CREATIVITY<br>
                设计小贴士
            </div>
            <div class="footer-logo">
                CREATIVE<br>TIPS
            </div>
        </div>
    </div>
</body>
</html>
