<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Up In The Biz - Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        .poster-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 2/3;
            background: linear-gradient(to bottom, #e8e8e8 0%, #d0d0d0 50%, #888 100%);
            overflow: hidden;
        }
        
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            z-index: 1;
        }
        
        .content-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        /* Top Section */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .tribeca-logo {
            width: 80px;
            height: 80px;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 8px;
            text-align: center;
            line-height: 1.2;
            position: relative;
        }
        
        .tribeca-logo::before,
        .tribeca-logo::after {
            content: '❧';
            position: absolute;
            font-size: 24px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .tribeca-logo::before { left: -8px; }
        .tribeca-logo::after { right: -8px; transform: translateY(-50%) scaleX(-1); }
        
        .header-text {
            text-align: right;
            flex: 1;
            margin-left: 20px;
        }
        
        .showtime-original {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 300;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        
        .director-credit {
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 400;
            opacity: 0.9;
        }
        
        /* Main Title Section */
        .title-section {
            margin-top: 40px;
            text-align: center;
            position: relative;
            z-index: 15;
        }
        
        .main-title-top {
            font-size: 36px;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: -10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-title-biz {
            font-size: 140px;
            font-weight: 900;
            color: #D4AF37;
            line-height: 0.85;
            letter-spacing: -5px;
            font-family: 'Times New Roman', serif;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.4);
            margin: 0;
            padding: 0;
        }
        
        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: #D4AF37;
            letter-spacing: 1px;
            margin-top: 30px;
            line-height: 1.4;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        /* Bottom Section */
        .bottom-section {
            margin-top: auto;
            background-color: #000;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            z-index: 20;
        }
        
        .film-type {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 400;
            margin-bottom: 5px;
        }
        
        .release-date {
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        
        .streaming-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .showtime-logo {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -1px;
            font-style: italic;
        }
        
        .divider {
            width: 1px;
            height: 25px;
            background-color: #666;
        }
        
        .paramount-text {
            font-size: 11px;
            text-align: left;
            line-height: 1.3;
        }
        
        .paramount-text strong {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 18px;
            display: block;
            font-weight: normal;
        }
        
        .disclaimer {
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        
        /* Placeholder for the actual image */
        .image-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 82%;
            background: #333;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <!-- Background Image Placeholder -->
        <div class="image-placeholder">[Image: Black & white photograph of person in baseball cap]</div>
        
        <div class="content-layer">
            <!-- Top Section -->
            <div class="top-section">
                <div class="tribeca-logo">
                    <span>TRIBECA<br>FESTIVAL</span>
                    <strong style="font-size: 10px;">2023</strong>
                </div>
                <div class="header-text">
                    <div class="showtime-original">SHOWTIME ORIGINAL</div>
                    <div class="director-credit">A SACHA JENKINS JAMMIE</div>
                </div>
            </div>
            
            <!-- Main Title Section -->
            <div class="title-section">
                <div class="main-title-top">ALL UP IN THE</div>
                <h1 class="main-title-biz">BIZ</h1>
                <div class="subtitle">
                    THE LIFE AND RHYMES<br>
                    OF BIZ MARKIE
                </div>
            </div>
            
            <!-- Bottom Section -->
            <div class="bottom-section">
                <div class="film-type">DOCUMENTARY FILM</div>
                <div class="release-date">AUGUST 11</div>
                
                <div class="streaming-info">
                    <div class="showtime-logo">SHOWTIME</div>
                    <div class="divider"></div>
                    <div class="paramount-text">
                        STREAMING ON<br>
                        <strong>Paramount+</strong>
                    </div>
                </div>
                
                <div class="disclaimer">PARAMOUNT+ WITH SHOWTIME PLAN ONLY.</div>
            </div>
        </div>
    </div>
</body>
</html>
