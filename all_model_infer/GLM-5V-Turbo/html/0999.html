<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Notes - Meteorology</title>
    <style>
        body {
            background-color: #e8e8e8;
            margin: 0;
            padding: 20px;
            font-family: "KaiTi", "STKaiti", "楷体", "SimKai", serif;
        }
        .notebook-page {
            background-color: #fff;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 25mm 15mm 15mm 15mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 27px,
                #e0e0e0 28px
            );
            background-position: 0 0;
            line-height: 28px;
            font-size: 16px;
            color: #333;
        }
        .content {
            position: relative;
            z-index: 1;
        }
        .line {
            margin-bottom: 0;
            white-space: pre-wrap;
        }
        .indent-1 { padding-left: 2em; }
        .indent-2 { padding-left: 4em; }
        .definition {
            color: #0055aa;
        }
        .watermark {
            position: absolute;
            top: 15mm;
            right: 18mm;
            font-size: 13px;
            color: #888;
            transform: rotate(12deg);
            opacity: 0.8;
            z-index: 2;
        }
        .line-numbers {
            position: absolute;
            right: 5mm;
            top: 25mm;
            font-size: 11px;
            color: #aaa;
            text-align: right;
            line-height: 28px;
            font-family: Arial, sans-serif;
        }
        .campus-logo {
            position: absolute;
            bottom: 12mm;
            left: 15mm;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #666;
            font-style: italic;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="notebook-page">
        <div class="watermark">@田三岁爱学习呀🌟</div>
        
        <div class="line-numbers">
            19<br>
            20<br>
            21<br>
            22<br>
            23<br>
            24<br>
            25<br>
            26<br>
            27<br>
            28<br>
            29<br>
            30<br>
            31
        </div>

        <div class="content">
            <div class="line">了东南季风，形成强降水。</div>
            
            <div class="line">(3)受台风‘烟花’逼近，带来了大量水汽</div>
            
            <div class="line">(4)这次降水过程中，中小尺度对流反复在伏牛山前地</div>
            <div class="line indent-1">区频繁并向郑州方向移动，也就形成了“列车效应”，</div>
            <div class="line indent-2">导致降水强度大、维持时间长，引起局地极端降水。</div>
            
            <div class="line definition">△列车效应：指长时间的降水并不是因为一块稳定不动的</div>
            <div class="line definition indent-2">降雨云团造成，而是对流系统反复生成发展，</div>
            <div class="line definition indent-2">使很多降水云团先后经过同一个地方，造成同</div>
            <div class="line definition indent-2">一地区出现长时间降水情况。就像列车的</div>
            <div class="line definition indent-2">不同车厢先后经过同一块铁轨一样，这种情</div>
            <div class="line definition indent-2">况叫做列车效应。</div>
        </div>

        <div class="campus-logo">Campus</div>
    </div>
</body>
</html>
