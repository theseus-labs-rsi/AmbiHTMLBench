<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指读 (Pointing Reading) - 方法40</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #f5f5f0;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .header-label {
            font-weight: bold;
        }
        
        .title-bar {
            border: 2px solid #333;
            padding: 8px 20px;
            margin-bottom: 25px;
            position: relative;
        }
        
        .title-main {
            font-size: 18px;
            letter-spacing: 2px;
        }
        
        .method-header {
            background-color: #333;
            color: #fff;
            padding: 8px 15px;
            font-size: 22px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .content-area {
            position: relative;
        }
        
        .instruction-box {
            border: 3px solid #ff9933;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: inline-block;
            background-color: #fff;
            position: relative;
        }
        
        .instruction-box::before {
            content: "";
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 1px solid #ffcc99;
            pointer-events: none;
        }
        
        .instruction-number {
            font-weight: bold;
            font-size: 16px;
            margin-right: 5px;
        }
        
        .instruction-text {
            font-size: 16px;
            font-weight: bold;
        }
        
        .sub-instruction {
            margin-left: 60px;
            margin-bottom: 25px;
            font-size: 15px;
            color: #555;
            padding: 5px 0;
            border-bottom: 2px solid #ffcc99;
            display: inline-block;
        }
        
        .body-text {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: justify;
            text-indent: 2em;
        }
        
        .highlight-text {
            background-color: transparent;
            border-bottom: 2px solid #ff9933;
            padding-bottom: 1px;
        }
        
        .suggestion-box {
            margin-left: 80px;
            margin-top: 20px;
            font-size: 15px;
            line-height: 1.8;
        }
        
        .suggestion-line {
            margin-bottom: 5px;
            border-bottom: 2px solid #ffcc99;
            display: inline-block;
        }
        
        .illustration {
            float: right;
            width: 200px;
            height: 220px;
            margin-left: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .illustration-placeholder {
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        
        .cat-drawing {
            width: 180px;
            height: auto;
        }
        
        .side-label {
            position: absolute;
            right: -50px;
            top: 150px;
            writing-mode: vertical-rl;
            font-size: 12px;
            color: #666;
            border: 1px solid #999;
            padding: 5px 2px;
        }
        
        @media (max-width: 600px) {
            .illustration {
                float: none;
                margin: 20px auto;
            }
            
            .suggestion-box {
                margin-left: 20px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="page-container">
        <div class="header-top">
            <span class="header-label">平读</span>
            <span>Plain reading</span>
        </div>
        
        <div class="title-bar">
            <div class="title-main">用手指来指引读书的方向</div>
        </div>
        
        <div class="method-header">
            方法40　指读（Pointing Reading）
        </div>
        
        <div class="content-area">
            <div class="instruction-box">
                <span class="instruction-number">①</span>
                <span class="instruction-text">用手指或是笔尖指着当前读到的位置</span>
            </div>
            
            <div class="sub-instruction">
                视线聚焦在手指或笔尖。
            </div>
            
            <div class="instruction-box">
                <span class="instruction-number">②</span>
                <span class="instruction-text">沿着阅读的方向移动手指或笔尖</span>
            </div>
            
            <div class="illustration">
                <svg class="cat-drawing" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                    <!-- Cat head -->
                    <ellipse cx="100" cy="120" rx="70" ry="65" fill="none" stroke="#333" stroke-width="2"/>
                    <!-- Ears -->
                    <path d="M45 75 L35 40 L70 65 Z" fill="none" stroke="#333" stroke-width="2"/>
                    <path d="M155 75 L165 40 L130 65 Z" fill="none" stroke="#333" stroke-width="2"/>
                    <!-- Eyes -->
                    <ellipse cx="75" cy="115" rx="18" ry="22" fill="none" stroke="#333" stroke-width="2"/>
                    <ellipse cx="125" cy="115" rx="18" ry="22" fill="none" stroke="#333" stroke-width="2"/>
                    <circle cx="78" cy="118" r="6" fill="#333"/>
                    <circle cx="128" cy="118" r="6" fill="#333"/>
                    <!-- Nose -->
                    <path d="M95 140 L105 140 L100 145 Z" fill="#333"/>
                    <!-- Body -->
                    <path d="M50 175 Q100 165 150 175 L160 210 Q100 220 40 210 Z" fill="none" stroke="#333" stroke-width="2"/>
                    <!-- Arms -->
                    <path d="M70 185 Q85 195 90 205" fill="none" stroke="#333" stroke-width="2"/>
                    <path d="M130 185 Q115 195 110 205" fill="none" stroke="#333" stroke-width="2"/>
                    <!-- Book -->
                    <rect x="60" y="200" width="80" height="15" fill="none" stroke="#333" stroke-width="2"/>
                    <line x1="100" y1="200" x2="100" y2="215" stroke="#333" stroke-width="1"/>
                </svg>
            </div>
            
            <div class="body-text">
                一边往下读，一边<span class="highlight-text">移动手指或笔尖</span>。此时视线依然聚焦在<span class="highlight-text">手指或笔尖</span>。<span class="highlight-text">手指（或笔尖）的移动速度与我们阅读的速度相同</span>。这样一来，我们的阅读速度会受到<span class="highlight-text">手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。</span>
            </div>
            
            <div class="suggestion-box">
                <div><span class="suggestion-line">大家也可以试着将</span></div>
                <div><span class="suggestion-line">这种方式与朗读结合起</span></div>
                <div><span class="suggestion-line">来，将指着的内容出声</span></div>
                <div><span class="suggestion-line">读出来。</span></div>
            </div>
            
            <div class="side-label">方法40</div>
        </div>
    </div>
</body>
</html>
