<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习资料 - 句式练习与阅读理解</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            position: relative;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(128, 90, 180, 0.2);
            border: 3px solid #9b7ec8;
        }
        
        /* Book Icon */
        .book-icon {
            position: absolute;
            top: -15px;
            left: 20px;
            width: 100px;
            height: 100px;
            z-index: 10;
        }
        
        .book-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Decorative stars */
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 16px;
        }
        
        .star-1 { top: 50px; left: 10px; transform: rotate(15deg); }
        .star-2 { top: 80px; left: 5px; transform: rotate(-20deg); font-size: 12px; }
        .star-3 { top: 35px; left: 120px; transform: rotate(45deg); font-size: 14px; }
        
        /* Section Styles */
        section {
            margin-bottom: 25px;
            position: relative;
        }
        
        h2 {
            color: #6b4c9a;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        h2 span {
            color: #6b4c9a;
        }
        
        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 10px;
            text-align: justify;
        }
        
        .subsection {
            margin-left: 0;
            margin-bottom: 8px;
        }
        
        ol {
            color: #333;
            font-size: 17px;
            line-height: 1.7;
            padding-left: 25px;
        }
        
        li {
            margin-bottom: 6px;
        }
        
        /* Character decoration bottom right */
        .character {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            opacity: 0.9;
        }
        
        /* Watermark */
        .watermark {
            position: absolute;
            top: 55%;
            right: 40px;
            color: #d4c4e8;
            font-size: 14px;
            transform: rotate(-10deg);
            pointer-events: none;
            opacity: 0.6;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h2 {
                font-size: 24px;
            }
            
            p, ol {
                font-size: 16px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <!-- Book Icon Placeholder -->
        <div class="book-icon placeholder" style="background: linear-gradient(135deg, #6b4c9a 0%, #8b6fc4 100%); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 2px 2px 8px rgba(0,0,0,0.2);">
            <div style="color: white; font-size: 24px;">📚</div>
            <div style="color: white; font-size: 11px; margin-top: 5px; font-weight: bold;">Jenny</div>
            <div style="position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; background: rgba(255,255,255,0.3); border-radius: 50%;"></div>
        </div>
        
        <!-- Decorative Stars -->
        <div class="star star-1">⭐</div>
        <div class="star star-2">✨</div>
        <div class="star star-3">🌟</div>
        
        <!-- Section Four -->
        <section>
            <h2><span>四,</span> 句式练习</h2>
            <p>仿写、修改病句、把字句变被字句、反问句变陈述句、陈述句变感叹句、缩句扩句等等</p>
        </section>
        
        <!-- Section Five -->
        <section>
            <h2><span>五,</span> 阅读理解</h2>
            <p class="subsection"><strong>课内阅读理解：</strong>主要复习课文笔记、中心思想以及课后习题。</p>
            <p class="subsection"><strong>课外阅读理解：</strong>主要是要掌握好答题技巧。</p>
        </section>
        
        <!-- Section Six -->
        <section>
            <h2><span>六,</span> 阅读训练</h2>
            <ol>
                <li>圈出题目里面的关键词。</li>
                <li>记住答案的宗旨就是答案都在原文里。</li>
                <li>掌握表达方式，修辞手法的运用，解释词语，找近反义词。</li>
                <li>概括主要内容就是，时间，地点，人物，事情。</li>
                <li>答题技巧，人物评价围绕品质，景物围绕热爱之情来答。</li>
            </ol>
        </section>
        
        <!-- Watermark -->
        <div class="watermark">小语老师小课堂<br>From 小红书</div>
        
        <!-- Character Decoration Bottom Right -->
        <div class="character placeholder" style="background: linear-gradient(to bottom, #fff 0%, #ffe4e9 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; display: flex; justify-content: center; align-items: flex-end;">
            <div style="font-size: 30px; margin-bottom: 5px;">🐰</div>
            <div style="position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 8px;">● ●</div>
            <div style="position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 6px; height: 4px; background: #ffb6c1; border-radius: 50%;"></div>
            <div style="position: absolute; right: -5px; top: 40%; font-size: 20px; transform: rotate(15deg);">💗</div>
        </div>
    </div>
</body>
</html>
