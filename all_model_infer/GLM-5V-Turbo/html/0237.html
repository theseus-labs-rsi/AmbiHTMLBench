<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公益广告 - 绿色出行 低碳环保</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #e8f4e8;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        
        .page-container {
            width: 100%;
            min-height: 1700px;
            background-color: #e8f4e8;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(139, 195, 74, 0.03) 2px,
                rgba(139, 195, 74, 0.03) 4px
            );
            padding: 20px;
            position: relative;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1a4d7a;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        
        .logo {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 36px;
            color: #c41e3a;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .header-right {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        
        .date {
            font-size: 12px;
            color: #333;
        }
        
        .section-title {
            font-size: 32px;
            color: #1a4d7a;
            font-weight: bold;
        }
        
        .page-num {
            font-size: 32px;
            color: #1a4d7a;
            font-weight: bold;
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 24px;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 80px;
            letter-spacing: 1px;
        }
        
        /* Main Content Area */
        .main-content {
            position: relative;
            width: 100%;
            height: 900px;
            margin-bottom: 60px;
        }
        
        /* Right Side Title */
        .main-title {
            position: absolute;
            top: 50px;
            right: 80px;
            font-size: 72px;
            color: #2e7d32;
            font-weight: bold;
            line-height: 1.2;
            text-align: left;
            z-index: 10;
        }
        
        /* Central Graphic */
        .graphic-container {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 600px;
        }
        
        .bicycle-graphic {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* SVG Placeholder for the bicycle/leaf illustration */
        .illustration-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Body Text */
        .body-text {
            position: absolute;
            bottom: 20px;
            left: 60px;
            width: 600px;
            font-size: 18px;
            line-height: 2;
            color: #1a1a1a;
            text-align: justify;
        }
        
        /* Bottom Wave */
        .bottom-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }
        
        .wave-svg {
            width: 100%;
            height: 100%;
        }
        
        /* Footer */
        .footer-logo {
            position: absolute;
            bottom: 40px;
            right: 60px;
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 36px;
            color: #fff;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 20;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .main-title {
                font-size: 48px;
                right: 20px;
            }
            
            .body-text {
                font-size: 16px;
                left: 20px;
                width: calc(100% - 40px);
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">光明日报</div>
            <div class="header-right">
                <span class="date">2025年1月5日 星期日</span>
                <span class="section-title">公益广告</span>
                <span class="page-num">05</span>
            </div>
        </div>
        
        <!-- Subtitle -->
        <div class="subtitle">绿色生活系列公益广告</div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Main Title -->
            <div class="main-title">
                绿色出行<br>低碳环保
            </div>
            
            <!-- Central Graphic Area -->
            <div class="graphic-container">
                <div class="illustration-placeholder">
                    <svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; max-height: 500px;">
                        <!-- Leaf base -->
                        <path d="M300 380 C150 350 50 280 80 220 C110 160 200 140 300 150 C400 140 490 160 520 220 C550 280 450 350 300 380 Z" fill="#4caf50"/>
                        <path d="M120 230 Q250 260 480 230 Q420 290 300 320 Q180 290 120 230 Z" fill="#66bb6a" opacity="0.6"/>
                        <path d="M100 240 Q200 270 300 330 M150 225 Q250 255 350 315 M200 215 Q280 245 360 295" stroke="#81c784" stroke-width="3" fill="none"/>
                        
                        <!-- Bicycle wheels (green circles) -->
                        <circle cx="210" cy="260" r="55" fill="none" stroke="#9ccc65" stroke-width="12"/>
                        <circle cx="390" cy="260" r="55" fill="none" stroke="#9ccc65" stroke-width="12"/>
                        
                        <!-- Cyclist figure (black) -->
                        <g transform="translate(300, 180)">
                            <!-- Head -->
                            <circle cx="0" cy="-70" r="15" fill="#000"/>
                            <!-- Body -->
                            <path d="M0 -55 L-25 0 L-35 40 L-10 30 L10 50 L40 20 L20 -10 Z" fill="#000"/>
                            <!-- Arms -->
                            <path d="M-10 -35 L-50 -10" stroke="#000" stroke-width="12" stroke-linecap="round"/>
                            <path d="M10 -35 L50 -10" stroke="#000" stroke-width="12" stroke-linecap="round"/>
                        </g>
                        
                        <!-- Shadow under leaf -->
                        <ellipse cx="300" cy="395" rx="180" ry="15" fill="rgba(0,0,0,0.1)"/>
                    </svg>
                </div>
            </div>
            
            <!-- Body Text -->
            <div class="body-text">
                选择绿色出行方式，既节约能源、减少污染，又益于健康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具，或者选择步行、骑自行车等出行方式，降低出行中产生的能耗和污染，绿色出行、低碳出行、文明出行。
            </div>
            
            <!-- Bottom Green Wave -->
            <div class="bottom-wave">
                <svg class="wave-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
                    <path d="M0 100 Q300 50 600 100 T1200 100 L1200 200 L0 200 Z" fill="#66bb6a"/>
                    <path d="M0 130 Q300 80 600 130 T1200 130 L1200 200 L0 200 Z" fill="#4caf50"/>
                    <path d="M0 160 Q300 110 600 160 T1200 160 L1200 200 L0 200 Z" fill="#388e3c"/>
                </svg>
                
                <!-- Footer Logo on wave -->
                <div class="footer-logo">光明日报社</div>
            </div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
