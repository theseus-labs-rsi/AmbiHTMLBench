<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兰州旅行文案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #ffffff;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            grid-auto-flow: dense;
        }

        .card {
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .pin-icon {
            color: #e74c3c;
            margin-right: 5px;
            font-size: 14px;
        }

        .card-subtitle {
            text-align: center;
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
            font-style: italic;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            width: 100%;
        }

        .img-placeholder {
            width: 100%;
            aspect-ratio: 1;
            background-color: #e0e0e0;
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), 
                              linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            opacity: 0.8;
            border-radius: 2px;
        }

        /* Center special card */
        .center-card {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .vertical-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 42px;
            color: #c0392b;
            letter-spacing: 12px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-family: "STKaiti", "KaiTi", serif;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
            .center-card {
                grid-column: span 2;
                order: -1;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

<div class="container">
    <!-- Row 1 -->
    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>金城兰州
        </div>
        <div class="card-subtitle">“流淌在黄河水的东流”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>中山桥
        </div>
        <div class="card-subtitle">“陌生的人 请给我一支兰州”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>兰州美食
        </div>
        <div class="card-subtitle">“四方食事 不过一碗人间烟火”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <!-- Row 2 -->
    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>镇远巷
        </div>
        <div class="card-subtitle">“繁华城市背后的另一面”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <div class="center-card">
        <div class="vertical-title">兰州旅行文案</div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>甘肃省博物馆
        </div>
        <div class="card-subtitle">“守河湟雄魂 传丝路文脉”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <!-- Row 3 -->
    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>白塔山公园
        </div>
        <div class="card-subtitle">“行走在西北 眺望黄河水”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>兰山公园
        </div>
        <div class="card-subtitle">“白天阿诗玛 晚上蹦迪”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="pin-icon">📍</span>正宁路小吃街
        </div>
        <div class="card-subtitle">“人间烟火气 最抚凡人心”</div>
        <div class="image-grid">
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
            <div class="img-placeholder"></div><div class="img-placeholder"></div><div class="img-placeholder"></div>
        </div>
    </div>
</div>

</body>
</html>
