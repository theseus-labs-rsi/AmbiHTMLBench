<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名和考试</title>
    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
            background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .header-box {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            padding: 8px 24px;
            display: inline-block;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .text-block {
            font-size: 20px;
            line-height: 1.7;
            color: #000000;
            margin-bottom: 35px;
            text-align: left;
        }
        .text-block ol {
            margin: 0;
            padding-left: 42px;
        }
        .text-block li {
            margin-bottom: 14px;
        }
        .graphics-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 20px;
            padding: 0 10px;
            gap: 20px;
        }
        .placeholder {
            border: 2px solid #92400e;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #78350f;
            font-size: 13px;
            position: relative;
        }
        .chart-radar {
            width: 220px;
            height: 190px;
            border-radius: 50%;
        }
        .chart-bar {
            width: 260px;
            height: 170px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">报名和考试</div>
        <div class="text-block">
            个人参赛，由所在中学进行统一报名；<br>
            均为笔试考试，预赛为各省市自行组织、自主命题；<br>
            剩余考试环节均为全国统一命题。
        </div>

        <div class="header-box">可以自学吗？</div>
        <div class="text-block">
            <ol>
                <li>高中课本内容可以自学，当然我们也有初高中基础知识课程，让你快速掌握竞赛考点。</li>
                <li>一些难的知识点和不知道如何规划学习进度的时候，最好选择报课，大部分学生在有人一起学的情况下会比较好。</li>
            </ol>
            有时候你以为自己自学的挺好，但是很多竞赛技巧、思维是需要老师来指导的。时间和钱，不能兼得。
        </div>

        <div class="graphics-area">
            <div class="placeholder chart-radar">[Diagram: Radar Chart]</div>
            <div class="placeholder chart-bar">[Chart: Bar Graph]</div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
