<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲线式构图 - 版式设计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
            width: 100%;
            min-height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chinese-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .english-subtitle {
            font-size: 11px;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }

        /* Main Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            position: relative;
        }

        /* Block Styles */
        .block-yellow {
            background-color: #FFE600;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .block-black {
            background-color: #000000;
            color: #FFE600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Specific Elements */
        .ku-char {
            grid-column: 1 / 4;
            grid-row: 1 / 3;
            height: 180px;
            font-size: 100px;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        .cools-main {
            grid-column: 5 / 13;
            grid-row: 1 / 2;
            height: 140px;
            flex-direction: column;
            gap: 5px;
        }

        .cools-chinese {
            font-size: 56px;
            letter-spacing: 8px;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        .cools-english {
            font-size: 52px;
            letter-spacing: 6px;
            font-family: "Arial", sans-serif;
        }

        .small-black-bar-1 {
            grid-column: 2 / 4;
            grid-row: 3 / 4;
            height: 25px;
            margin-top: 10px;
        }

        .importance-box {
            grid-column: 1 / 4;
            grid-row: 4 / 6;
            height: 160px;
            font-size: 36px;
            line-height: 1.3;
            text-align: center;
            padding: 20px;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        .forever-box {
            grid-column: 8 / 12;
            grid-row: 3 / 6;
            height: 200px;
            font-size: 48px;
            line-height: 1.2;
            text-align: center;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        .english-importance {
            grid-column: 1 / 4;
            grid-row: 7 / 9;
            height: 130px;
            font-size: 13px;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
            font-family: "Arial", sans-serif;
        }

        .at-top-box {
            grid-column: 4 / 12;
            grid-row: 7 / 9;
            height: 150px;
            font-size: 80px;
            letter-spacing: 10px;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        .small-black-bar-2 {
            grid-column: 10 / 12;
            grid-row: 6 / 7;
            height: 25px;
            justify-self: end;
        }

        .small-yellow-bar {
            grid-column: 2 / 4;
            grid-row: 10 / 11;
            height: 30px;
            width: 80px;
        }

        .yellow-circle {
            grid-column: 1 / 3;
            grid-row: 11 / 13;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #FFE600;
            justify-self: start;
        }

        .text-strips {
            grid-column: 4 / 12;
            grid-row: 10 / 12;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .strip {
            background-color: #000000;
            color: #FFE600;
            font-size: 10px;
            padding: 4px 8px;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: 1px;
            font-family: "SimSun", serif;
        }

        .cool-set-bar {
            grid-column: 4 / 10;
            grid-row: 12 / 13;
            background-color: #000000;
            color: #FFE600;
            font-size: 14px;
            letter-spacing: 2px;
            padding: 8px 15px;
            font-family: "Arial", sans-serif;
            white-space: nowrap;
        }

        .small-yellow-square {
            grid-column: 11 / 13;
            grid-row: 12 / 14;
            width: 90px;
            height: 90px;
            background-color: #FFE600;
            justify-self: end;
        }

        .footer-text {
            grid-column: 1 / 13;
            grid-row: 14 / 15;
            text-align: center;
            font-size: 16px;
            letter-spacing: 12px;
            margin-top: 30px;
            font-weight: bold;
            font-family: "SimHei", "Noto Sans SC", sans-serif;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            
            .ku-char { font-size: 70px; }
            .cools-chinese { font-size: 40px; }
            .cools-english { font-size: 36px; }
            .importance-box { font-size: 28px; }
            .forever-box { font-size: 36px; }
            .at-top-box { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="chinese-title">曲线式构图</div>
                <div class="english-subtitle">CURVILINEAR COMPOSITION</div>
            </div>
            <div class="header-right">
                <div>版式设计</div>
                <div style="font-size: 12px; margin-top: 2px;">2023 / 6/07</div>
            </div>
        </div>

        <!-- Main Composition Grid -->
        <div class="grid-container">
            <!-- 酷 -->
            <div class="block-yellow ku-char">酷</div>

            <!-- 酷设而遇 COOLS -->
            <div class="block-black cools-main">
                <span class="cools-chinese">酷设而遇</span>
                <span class="cools-english">COOLS</span>
            </div>

            <!-- Small black bar under 酷 -->
            <div class="block-black small-black-bar-1"></div>

            <!-- 构图的重要性 -->
            <div class="block-yellow importance-box">
                构图的<br>重要性
            </div>

            <!-- 酷设永远 -->
            <div class="block-black forever-box">
                酷设<br>永远
            </div>

            <!-- THE IMPORTANCE OF COMPOSITION -->
            <div class="block-black english-importance">
                THE IMPORTANCE<br>OF COMPOSITION
            </div>

            <!-- 在顶点 -->
            <div class="block-black at-top-box">在顶点</div>

            <!-- Small black bar right of 在顶点 -->
            <div class="block-black small-black-bar-2"></div>

            <!-- Small yellow bar -->
            <div class="block-yellow small-yellow-bar"></div>

            <!-- Yellow circle -->
            <div class="yellow-circle"></div>

            <!-- Repeated text strips -->
            <div class="text-strips">
                <div class="strip">都可以是图片　都可以是图片　都可以是图片　都可以是图片　都可以</div>
                <div class="strip">都可以是图片　都可以是图片　都可以是图片　都可以是图片　都可以</div>
                <div class="strip">都可以是图片　都可以是图片　都可以是图片　都可以是图片　都可以</div>
            </div>

            <!-- COOL SET IS ALWAYS AT THE TOP -->
            <div class="cool-set-bar">COOL SET IS ALWAYS AT THE TOP</div>

            <!-- Small yellow square bottom right -->
            <div class="small-yellow-square"></div>

            <!-- Footer text -->
            <div class="footer-text">我 / 看 / 不 / 懂 / 但 / 大 / 受 / 震 / 撼</div>
        </div>
    </div>
</body>
</html>
