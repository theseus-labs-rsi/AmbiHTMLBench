<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Shoes Comparison - Takumi Sen9 vs Streakfly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #000;
            color: #000;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .left-panel {
            flex: 1;
            background: #fff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .right-panel {
            flex: 1;
            background: #000;
            color: #fff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .brand-logo {
            font-size: 48px;
            font-weight: bold;
        }
        
        .adidas-logo {
            color: #000;
        }
        
        .nike-logo {
            color: #fff;
            font-style: italic;
        }
        
        .center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        .title-cn {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .title-en {
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        
        .vs-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            width: 100%;
        }
        
        .vs-text {
            font-size: 64px;
            font-weight: 900;
            font-style: italic;
            color: #000;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            z-index: 10;
        }
        
        .shoes-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
        }
        
        .shoe-image {
            width: 280px;
            height: 140px;
            object-fit: contain;
        }
        
        .shoe-placeholder {
            width: 280px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            border: 2px dashed #ccc;
        }
        
        .right-panel .shoe-placeholder {
            border-color: #444;
            color: #888;
        }
        
        .distance-label {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0 40px 0;
            letter-spacing: 2px;
        }
        
        .specs-container {
            display: flex;
            width: 100%;
            max-width: 700px;
            justify-content: space-between;
        }
        
        .spec-column {
            width: 48%;
            text-align: center;
        }
        
        .spec-item {
            margin: 15px 0;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
        }
        
        .spec-item.small {
            font-size: 20px;
        }
        
        .spec-item.medium {
            font-size: 24px;
        }
        
        .price {
            font-size: 32px;
            font-weight: bold;
            margin-top: 25px;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .shoes-display {
                flex-direction: column;
                gap: 30px;
            }
            
            .specs-container {
                flex-direction: column;
                gap: 40px;
            }
            
            .spec-column {
                width: 100%;
            }
            
            .center-title {
                position: static;
                transform: none;
                order: -1;
                margin-bottom: 10px;
            }
            
            .header {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="header">
                <div class="brand-logo adidas-logo">▲▲▲</div>
                <div class="center-title">
                    <div class="title-cn">奔跑的小小宇</div>
                    <div class="title-en">RUNNING XIAOYU</div>
                </div>
            </div>
            
            <div class="shoe-image" style="background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 280 140%22><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23333%22 font-size=%2214%22>[Image: Adidas Takumi Sen9 Shoe]</text></svg>') no-repeat center; background-size: contain;"></div>
            
            <div class="spec-column">
                <div class="spec-item medium">Takumi Sen9</div>
                <div class="spec-item">181g</div>
                <div class="spec-item small">(27/33) 6mm</div>
                <div class="spec-item small">LIGHTWEIGHT MESH</div>
                <div class="spec-item small">Lightstrike Pro</div>
                <div class="spec-item small">ENERGYROD玻纤柱</div>
                <div class="spec-item small">Continental™</div>
                <div class="price">1499</div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="header">
                <div class="center-title" style="visibility: hidden;">Placeholder</div>
                <div class="brand-logo nike-logo">✓</div>
            </div>
            
            <div class="shoe-image" style="background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 280 140%22><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23888%22 font-size=%2214%22>[Image: Nike Streakfly Shoe]</text></svg>') no-repeat center; background-size: contain;"></div>
            
            <div class="spec-column">
                <div class="spec-item medium">Streakfly</div>
                <div class="spec-item">165g</div>
                <div class="spec-item small">8mm (26/32)</div>
                <div class="spec-item small">织物鞋面</div>
                <div class="spec-item small">ZoomX</div>
                <div class="spec-item small">半掌碳板</div>
                <div class="spec-item small">贴片橡胶</div>
                <div class="price">999</div>
            </div>
        </div>
        
        <div style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); z-index: 100;">
            <div class="vs-text">VS</div>
        </div>
        
        <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); z-index: 100;">
            <div class="distance-label" style="color: #000; background: transparent;">5-10KM</div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
