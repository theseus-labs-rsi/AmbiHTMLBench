<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEK PARTİSİ - Asgari Ücret</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #d5d5d5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .poster-container {
            width: 420px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .yellow-zone {
            background-color: #fff200;
            padding: 35px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }
        
        .text-column {
            flex: 1;
            padding-right: 15px;
        }
        
        .issue-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 18px;
            line-height: 1.1;
        }
        
        .issue-item:last-child {
            margin-bottom: 0;
        }
        
        .pushpin-icon {
            color: #d32f2f;
            font-size: 22px;
            margin-right: 12px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        
        .issue-text {
            font-size: 32px;
            font-weight: bold;
            color: #000000;
        }
        
        .illustration-area {
            width: 170px;
            height: 150px;
            flex-shrink: 0;
            position: relative;
        }
        
        .chart-graphic {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffb74d 0%, #f57c00 70%, #ef6c00 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chart-graphic::before {
            content: "";
            position: absolute;
            width: 120%;
            height: 80%;
            border-top: 8px solid #c62828;
            transform: rotate(-45deg) translate(-20%, 20%);
            border-radius: 4px;
        }
        
        .chart-graphic::after {
            content: "↑";
            position: absolute;
            font-size: 60px;
            color: #c62828;
            font-weight: bold;
            top: 15%;
            right: 10%;
            transform: rotate(-15deg);
        }
        
        .coin-stack {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 35px;
            background: repeating-linear-gradient(
                0deg,
                #ffee58,
                #ffee58 6px,
                #fdd835 6px,
                #fdd835 12px
            );
            border: 2px solid #f9a825;
            border-radius: 4px;
        }
        
        .coin-one {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 38px;
            height: 38px;
            background: #ffee58;
            border: 3px solid #f9a825;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #f57f17;
            font-size: 20px;
            z-index: 2;
        }
        
        .pencil-element {
            position: absolute;
            top: 20px;
            left: 30px;
            width: 50px;
            height: 12px;
            background: #d32f2f;
            transform: rotate(45deg);
            border-radius: 2px;
        }
        
        .pencil-element::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 0;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 8px solid #ffebee;
        }
        
        .white-slogan {
            background-color: #ffffff;
            padding: 28px 25px;
            text-align: center;
        }
        
        .slogan-text {
            color: #c62828;
            font-size: 34px;
            font-weight: bold;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        
        .red-banner {
            background-color: #c62828;
            padding: 22px 20px;
            text-align: center;
        }
        
        .banner-title {
            color: #ffffff;
            font-size: 44px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: Arial Black, Arial, sans-serif;
        }
        
        .footer-zone {
            background-color: #ffffff;
            padding: 30px 25px;
        }
        
        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .emep-logo-container {
            width: 75px;
            height: 75px;
            position: relative;
            margin-right: 18px;
            flex-shrink: 0;
        }
        
        .gear-bg {
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, #c62828 0deg 15deg, transparent 15deg 30deg);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gear-inner {
            width: 55px;
            height: 55px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #c62828;
        }
        
        .globe-lines {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #c62828;
            border-radius: 50%;
            opacity: 0.3;
        }
        
        .globe-lines::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            background: #c62828;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.3;
        }
        
        .globe-lines::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 100%;
            background: #c62828;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.3;
        }
        
        .logo-text {
            position: absolute;
            color: #c62828;
            font-weight: bold;
            font-size: 13px;
            z-index: 10;
        }
        
        .org-details {
            flex: 1;
        }
        
        .party-name-main {
            color: #c62828;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 0.5px;
        }
        
        .org-sub {
            color: #c62828;
            font-size: 16px;
            margin-top: 3px;
            font-weight: 500;
        }
        
        .contacts-bar {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 14px;
            color: #333;
            padding-left: 5px;
        }
        
        .contact-entry {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .fb-icon {
            width: 20px;
            height: 20px;
            border: 2px solid #c62828;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #c62828;
            font-weight: bold;
            font-family: serif;
            font-style: italic;
            font-size: 13px;
        }
        
        .ig-icon {
            width: 19px;
            height: 19px;
            border: 2px solid #c62828;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #c62828;
            font-size: 11px;
            position: relative;
        }
        
        .ig-icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            border: 1.5px solid #c62828;
            border-radius: 50%;
        }
        
        .phone-icon {
            width: 19px;
            height: 19px;
            border: 2px solid #c62828;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #c62828;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="yellow-zone">
            <div class="text-column">
                <div class="issue-item">
                    <span class="pushpin-icon">📍</span>
                    <span class="issue-text">Enflasyon<br>yükseliyor</span>
                </div>
                <div class="issue-item">
                    <span class="pushpin-icon">📍</span>
                    <span class="issue-text">TL değer<br>kaybediyor</span>
                </div>
                <div class="issue-item">
                    <span class="pushpin-icon">📍</span>
                    <span class="issue-text">Ücretler eriyor</span>
                </div>
            </div>
            
            <div class="illustration-area placeholder" title="[Graphic: Economic crisis illustration with rising graph, coins and pencil]">
                <div class="chart-graphic">
                    <div class="pencil-element"></div>
                    <div class="coin-one">1</div>
                    <div class="coin-stack"></div>
                </div>
            </div>
        </div>
        
        <div class="white-slogan">
            <div class="slogan-text">Vergiden muaf,<br>insanca yaşanacak</div>
        </div>
        
        <div class="red-banner">
            <div class="banner-title">ASGARİ ÜCRET!</div>
        </div>
        
        <div class="footer-zone">
            <div class="header-row">
                <div class="emep-logo-container">
                    <div class="gear-bg">
                        <div class="gear-inner">
                            <div class="globe-lines"></div>
                            <span class="logo-text">EMEP</span>
                        </div>
                    </div>
                </div>
                
                <div class="org-details">
                    <div class="party-name-main">EMEK<br>PARTİSİ</div>
                    <div class="org-sub">Ankara İl Örgütü</div>
                </div>
            </div>
            
            <div class="contacts-bar">
                <span class="contact-entry">
                    <span class="fb-icon">f</span>
                    <span>/ankaraemep</span>
                </span>
                <span class="contact-entry">
                    <span class="ig-icon"></span>
                    <span>@emepankara</span>
                </span>
                <span class="contact-entry">
                    <span class="phone-icon">☎</span>
                    <span>0 (312) 232 41 97</span>
                </span>
            </div>
        </div>
    </div>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
