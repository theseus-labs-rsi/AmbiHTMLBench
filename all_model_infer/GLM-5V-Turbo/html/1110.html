<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok运营 48个必备工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background-color: #2d5a3d;
            color: #ffffff;
            padding: 60px 40px;
            min-height: 100vh;
            line-height: 1.2;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 80px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 3px;
            color: #ffffff;
        }
        
        h2 {
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 35px;
            letter-spacing: 3px;
            color: #ffffff;
        }
        
        .author-tag {
            display: inline-block;
            background-color: #f0ad4e;
            color: #333333;
            padding: 12px 25px;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 40px;
            border-radius: 3px;
            letter-spacing: 1px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 18px;
            grid-auto-flow: dense;
        }
        
        .card {
            padding: 25px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .card-olive {
            background-color: #7a8b6e;
        }
        
        .card-green {
            background-color: #5a9c6a;
        }
        
        .part-num {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 8px;
            opacity: 0.95;
        }
        
        .part-content {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
        }
        
        /* Specific positioning */
        .part-01 {
            grid-row: span 2;
            align-self: stretch;
        }
        
        .part-04 {
            grid-column: 1;
        }
        
        .part-02 {
            grid-column: 2;
            grid-row: 1;
        }
        
        .part-03 {
            grid-column: 2;
            grid-row: 2;
        }
        
        .right-section {
            grid-column: 3;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            gap: 18px;
        }
        
        .part-05 {
            grid-column: 1 / -1;
        }
        
        .part-06 {
            grid-column: 1;
            grid-row: 2 / 4;
        }
        
        .part-07 {
            grid-column: 2;
            grid-row: 2;
        }
        
        .part-08 {
            grid-column: 2;
            grid-row: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok运营</h1>
        <h2>48个必备工具</h2>
        
        <div class="author-tag">@ 徐徐教你做TikTok</div>
        
        <div class="main-grid">
            <!-- Left Column -->
            <div class="card card-olive part-01">
                <div class="part-num">Part 01</div>
                <div class="part-content">7个TK<br>数据平台</div>
            </div>
            
            <div class="card card-olive part-04">
                <div class="part-num">Part 04</div>
                <div class="part-content">6个TK数据分析网站</div>
            </div>
            
            <!-- Middle Column -->
            <div class="card card-olive part-02">
                <div class="part-num">Part 02</div>
                <div class="part-content">3个好用<br>选品网站</div>
            </div>
            
            <div class="card card-olive part-03">
                <div class="part-num">Part 03</div>
                <div class="part-content">5个视频<br>素材网站</div>
            </div>
            
            <!-- Right Section -->
            <div class="right-section">
                <div class="card card-green part-05">
                    <div class="part-num">Part 05</div>
                    <div class="part-content">4个剪辑<br>4个翻译软件</div>
                </div>
                
                <div class="card card-green part-06">
                    <div class="part-num">Part 06</div>
                    <div class="part-content">8个TK<br>传输管理<br>网站</div>
                </div>
                
                <div class="card card-green part-07">
                    <div class="part-num">Part 07</div>
                    <div class="part-content">5个BGM<br>网站</div>
                </div>
                
                <div class="card card-green part-08">
                    <div class="part-num">Part 08</div>
                    <div class="part-content">7个投放<br>联盟网站</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
