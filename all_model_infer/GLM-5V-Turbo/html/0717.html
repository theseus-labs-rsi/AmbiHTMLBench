<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端午万宁三日游安排</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #e6f7ff;
            padding: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #e6f7ff;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 42px;
            font-weight: bold;
            color: #000;
            letter-spacing: 2px;
        }
        
        .title .highlight-red {
            color: #ff0000;
        }
        
        .main-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .timeline-column {
            width: 140px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .day-label {
            background-color: #ffd700;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 25px;
            border-radius: 25px;
            margin-bottom: 15px;
            white-space: nowrap;
        }
        
        .timeline-line {
            width: 3px;
            background-color: #ffd700;
            position: absolute;
            top: 60px;
            bottom: 40px;
            z-index: 1;
        }
        
        .time-node {
            background-color: #ffd700;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
            width: fit-content;
            min-width: 120px;
            text-align: center;
        }
        
        .time-node:last-child {
            margin-bottom: 0;
        }
        
        .arrow-down {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #ffd700;
            margin: 5px auto;
        }
        
        .content-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .location-card {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        
        .image-placeholder {
            width: 180px;
            height: 130px;
            background-color: #ccc;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .location-info {
            flex: 1;
        }
        
        .location-title {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin-bottom: 6px;
        }
        
        .location-desc {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }
        
        @media (max-width: 600px) {
            .main-content {
                flex-direction: column;
            }
            
            .timeline-column {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                margin-bottom: 20px;
            }
            
            .timeline-line {
                display: none;
            }
            
            .time-node {
                margin-bottom: 0;
                font-size: 14px;
                padding: 6px 10px;
            }
            
            .arrow-down {
                transform: rotate(90deg);
                margin: 0 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">端午万宁<span class="highlight-red">三日游</span>安排得明明白白</h1>
        </div>
        
        <div class="main-content">
            <!-- 左侧时间轴 -->
            <div class="timeline-column">
                <div class="day-label">第二天</div>
                
                <div class="time-node">打车25分钟</div>
                <div class="arrow-down"></div>
                
                <div class="time-node">打车10分钟</div>
                <div class="arrow-down"></div>
                
                <div class="time-node">打车1小时</div>
                <div class="arrow-down"></div>
                
                <div class="time-node">打车1小时</div>
                <div class="arrow-down"></div>
                
                <div class="timeline-line"></div>
            </div>
            
            <!-- 右侧内容 -->
            <div class="content-column">
                <!-- 巴厘村 -->
                <div class="location-card">
                    <div class="image-placeholder">
                        <img src="https://via.placeholder.com/180x130/8B4513/FFFFFF?text=Bali+Village" alt="巴厘村">
                    </div>
                    <div class="location-info">
                        <div class="location-title">巴厘村</div>
                        <div class="location-desc">去巴厘村拍照，假装自己在泰国，租一套服装(80/人)而且还需要门票。</div>
                    </div>
                </div>
                
                <!-- 桥海牧场 -->
                <div class="location-card">
                    <div class="image-placeholder">
                        <img src="https://via.placeholder.com/180x130/228B22/FFFFFF?text=Ranch" alt="桥海牧场">
                    </div>
                    <div class="location-info">
                        <div class="location-title">桥海牧场</div>
                        <div class="location-desc">是类似于农村的田地，有一群牛羊鹅等农家动物;体验感一般，但拍照不错。</div>
                    </div>
                </div>
                
                <!-- 神州半岛灯塔 -->
                <div class="location-card">
                    <div class="image-placeholder">
                        <img src="https://via.placeholder.com/180x130/87CEEB/FFFFFF?text=Lighthouse" alt="神州半岛灯塔">
                    </div>
                    <div class="location-info">
                        <div class="location-title">神州半岛灯塔</div>
                        <div class="location-desc">拍照真的很出片，不要去太早，很有宫崎骏漫画的感觉</div>
                    </div>
                </div>
                
                <!-- 山钦湾 -->
                <div class="location-card">
                    <div class="image-placeholder">
                        <img src="https://via.placeholder.com/180x130/4682B4/FFFFFF?text=Bay" alt="山钦湾">
                    </div>
                    <div class="location-info">
                        <div class="location-title">山钦湾</div>
                        <div class="location-desc">傍晚的时候可以去燕子洞拍夕阳剪影，还有很多礁石，真的是分分钟氛围感大片！</div>
                    </div>
                </div>
                
                <!-- 兴隆夜市 -->
                <div class="location-card">
                    <div class="image-placeholder">
                        <img src="https://via.placeholder.com/180x130/FFD700/000000?text=Night+Market" alt="兴隆夜市">
                    </div>
                    <div class="location-info">
                        <div class="location-title">兴隆夜市</div>
                        <div class="location-desc">如果想吃南洋风味等一系列东南亚美食，可以看看这里便宜好吃实惠！</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
