<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Happiness of Midsummer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 600px;
            background-color: white;
            padding: 40px 30px;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }
        
        .title {
            font-family: 'Brush Script MT', cursive;
            font-size: 42px;
            color: #4A90E2;
            line-height: 1.2;
            letter-spacing: 2px;
        }
        
        .title-line1 {
            display: block;
            font-size: 28px;
            font-style: italic;
        }
        
        .title-line2 {
            display: block;
            font-size: 38px;
        }
        
        .registered {
            vertical-align: super;
            font-size: 20px;
        }
        
        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #4A90E2;
            letter-spacing: 2px;
            margin-top: 15px;
            font-weight: bold;
        }
        
        .photo-frame {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
        }
        
        .photo-placeholder {
            width: 100%;
            height: 650px;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #555 60%, #555 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the sky */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(180deg, #6BB3F8 0%, #B8DFF7 50%, #FFFFFF 100%);
        }
        
        /* Simulating clouds */
        .clouds {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            height: 40%;
            opacity: 0.8;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, transparent 70%);
            filter: blur(10px);
        }
        
        /* Simulating the overpass */
        .overpass {
            position: absolute;
            bottom: 25%;
            left: 0;
            width: 100%;
            height: 25%;
            background: #3a3a3a;
            transform: perspective(500px) rotateX(10deg);
            transform-origin: bottom;
        }
        
        /* Power lines */
        .power-lines {
            position: absolute;
            top: 30%;
            left: 0;
            width: 100%;
            height: 35%;
        }
        
        .wire {
            position: absolute;
            width: 120%;
            height: 1px;
            background: #333;
            left: -10%;
        }
        
        .wire:nth-child(1) { top: 20%; transform: rotate(-5deg); }
        .wire:nth-child(2) { top: 50%; transform: rotate(-3deg); }
        .wire:nth-child(3) { top: 80%; transform: rotate(-4deg); }
        
        .pole {
            position: absolute;
            top: 45%;
            right: 25%;
            width: 200px;
            height: 4px;
            background: #666;
        }
        
        /* Traffic lights */
        .traffic-lights {
            position: absolute;
            bottom: 22%;
            right: 12%;
            display: flex;
            gap: 8px;
        }
        
        .light {
            width: 24px;
            height: 50px;
            background: #222;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 4px 0;
        }
        
        .light-display {
            color: #00FF00;
            font-size: 14px;
            font-family: monospace;
            font-weight: bold;
        }
        
        .arrow {
            color: #00FF00;
            font-size: 16px;
        }
        
        /* Building silhouette */
        .buildings {
            position: absolute;
            bottom: 25%;
            right: 5%;
            width: 150px;
            height: 120px;
            background: repeating-linear-gradient(
                90deg,
                #888 0px,
                #888 20px,
                #999 20px,
                #999 22px,
                #777 22px,
                #777 40px,
                #888 40px,
                #888 42px
            );
            opacity: 0.6;
        }
        
        /* Tree on right */
        .tree {
            position: absolute;
            top: 15%;
            right: 0;
            width: 80px;
            height: 50%;
            background: #2d5016;
            clip-path: polygon(30% 0%, 70% 0%, 90% 20%, 100% 40%, 85% 60%, 95% 80%, 70% 100%, 30% 100%, 5% 80%, 15% 60%, 0% 40%, 10% 20%);
        }
        
        .footer {
            margin-top: 25px;
            text-align: center;
        }
        
        .chinese-text {
            font-size: 18px;
            color: #4A90E2;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-family: sans-serif;
        }
        
        .have-good-one {
            font-size: 11px;
            color: #4A90E2;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .fine-print {
            font-size: 7px;
            color: #999;
            line-height: 1.4;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <span class="title-line1">The</span>
                <span class="title-line2">(Happiness of)<br>Midsummer<span class="registered">®</span></span>
            </div>
        </div>
        
        <div class="meta-info">
            <span>MOMENTS</span>
            <span>5/5 2023</span>
        </div>
        
        <div class="photo-frame">
            <div class="photo-placeholder">
                <div class="sky"></div>
                <div class="clouds"></div>
                <div class="power-lines">
                    <div class="wire"></div>
                    <div class="wire"></div>
                    <div class="wire"></div>
                    <div class="pole"></div>
                </div>
                <div class="tree"></div>
                <div class="buildings"></div>
                <div class="overpass"></div>
                <div class="traffic-lights">
                    <div class="light">
                        <span class="light-display">01</span>
                        <span class="arrow">↑</span>
                    </div>
                    <div class="light">
                        <span class="light-display">01</span>
                        <span class="arrow">↑</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="chinese-text">「2023仲夏 正在进行时」</div>
            <div class="have-good-one">HAVE A GOOD ONE</div>
            <div class="fine-print">
                Through first do wander every minute. Doubt than from moon's sphere. To draw her ails,<br>
                spite the green. The coward fits her prisoners be. In their gold comes spots you see. Forewell. Fits gone.
            </div>
        </div>
    </div>
</body>
</html>
