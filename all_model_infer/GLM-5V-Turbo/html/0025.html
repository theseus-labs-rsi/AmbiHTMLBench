<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Conversation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ededed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .chat-container {
            width: 100%;
            max-width: 480px;
            background-color: #ededed;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .message-row.left {
            justify-content: flex-start;
        }
        
        .message-row.right {
            justify-content: flex-end;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background-color: #ddd;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .bubble {
            max-width: 70%;
            padding: 12px 14px;
            border-radius: 8px;
            position: relative;
            line-height: 1.5;
            font-size: 15px;
            color: #000;
            word-wrap: break-word;
        }
        
        .left .bubble {
            background-color: #ffffff;
            border-top-left-radius: 0;
        }
        
        .right .bubble {
            background-color: #95ec69;
            border-top-right-radius: 0;
        }
        
        .number {
            color: #576b95;
            font-weight: bold;
            margin-right: 2px;
        }
        
        .right-avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .right-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="message-row left">
            <div class="avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2387CEEB' width='100' height='50'/%3E%3Crect fill='%234682B4' y='50' width='100' height='50'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="bubble">
                <span class="number">⑥</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。
            </div>
        </div>

        <div class="message-row left">
            <div class="avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2387CEEB' width='100' height='50'/%3E%3Crect fill='%234682B4' y='50' width='100' height='50'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="bubble">
                <span class="number">⑦</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰
            </div>
        </div>

        <div class="message-row left">
            <div class="avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2387CEEB' width='100' height='50'/%3E%3Crect fill='%234682B4' y='50' width='100' height='50'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="bubble">
                <span class="number">⑧</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on the contrary,in contrast这类连接词。
            </div>
        </div>

        <div class="message-row left">
            <div class="avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2387CEEB' width='100' height='50'/%3E%3Crect fill='%234682B4' y='50' width='100' height='50'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="bubble">
                你重新写吧
            </div>
        </div>

        <div class="message-row right">
            <div class="right-avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23D2691E' width='100' height='100'/%3E%3Ctext x='50' y='55' font-size='40' text-anchor='middle' fill='white'%3E👤%3C/text%3E%3C/svg%3E" alt="User Avatar">
            </div>
            <div class="bubble">
                好的，谢谢老师
            </div>
        </div>
    </div>
</body>
</html>
