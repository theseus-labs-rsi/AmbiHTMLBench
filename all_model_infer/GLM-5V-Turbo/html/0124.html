<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Notebook</title>
    <style>
        body {
            background-color: #d4cfc4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .notebook {
            width: 600px;
            background-color: #f9f7f1;
            background-image: 
                linear-gradient(#e8e4d9 1px, transparent 1px),
                linear-gradient(90deg, #f0ece1 1px, transparent 1px);
            background-size: 100% 36px, 100% 100%;
            background-position: 0 18px, 0 0;
            padding: 50px 60px;
            box-shadow: 2px 4px 12px rgba(0,0,0,0.2);
            position: relative;
            min-height: 800px;
        }
        
        .entry {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }
        
        .english {
            font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
            font-size: 26px;
            color: #2c2c2c;
            flex: 0 0 45%;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .chinese {
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            font-size: 24px;
            color: #1a237e;
            flex: 0 0 55%;
            text-align: left;
            padding-left: 10px;
        }
        
        .group-spacing {
            height: 24px;
        }
        
        .underlined {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }
        
        /* Simulate the curve of the notebook binding on the right */
        .notebook::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(to left, rgba(0,0,0,0.05), transparent);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <div class="entry">
            <span class="english">charity</span>
            <span class="chinese">n.慈善机构</span>
        </div>
        
        <div class="entry">
            <span class="english">clarity</span>
            <span class="chinese">n.(思,隐,图)清晰</span>
        </div>
        
        <div class="entry">
            <span class="english">clarify</span>
            <span class="chinese">v.阐明,阐释</span>
        </div>
        
        <div class="group-spacing"></div>
        
        <div class="entry">
            <span class="english">consistent</span>
            <span class="chinese">adj.一贯的,一...致的</span>
        </div>
        
        <div class="entry">
            <span class="english">resist</span>
            <span class="chinese">v.抵制</span>
        </div>
        
        <div class="entry">
            <span class="english">insist</span>
            <span class="chinese">v.坚持</span>
        </div>
        
        <div class="group-spacing"></div>
        
        <div class="entry">
            <span class="english">insert</span>
            <span class="chinese">v.插入,嵌入</span>
        </div>
        
        <div class="entry">
            <span class="english underlined">assert</span>
            <span class="chinese">v.断言;坚持主张</span>
        </div>
        
        <div class="group-spacing"></div>
        
        <div class="entry">
            <span class="english">eminent</span>
            <span class="chinese">adj.杰出的</span>
        </div>
        
        <div class="entry">
            <span class="english">Prominent</span>
            <span class="chinese">adj.杰出的,重要的</span>
        </div>
        
        <div class="entry">
            <span class="english">eliminate</span>
            <span class="chinese">v.消除;淘汰</span>
        </div>
        
        <div class="group-spacing"></div>
        
        <div class="entry">
            <span class="english">integral</span>
            <span class="chinese">adj.必不可少的</span>
        </div>
        
        <div class="entry">
            <span class="english">integrity</span>
            <span class="chinese">n.诚实,正直</span>
        </div>
        
        <div class="entry">
            <span class="english">integrate</span>
            <span class="chinese">v.(使)融入</span>
        </div>
        
        <div class="group-spacing"></div>
        
        <div class="entry">
            <span class="english">fabricate</span>
            <span class="chinese">v.捏造</span>
        </div>
        
        <div class="entry">
            <span class="english">fluctuate</span>
            <span class="chinese">v.波动,上下浮动</span>
        </div>
    </div>
</body>
</html>
