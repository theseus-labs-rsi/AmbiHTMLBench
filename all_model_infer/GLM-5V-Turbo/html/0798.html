<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新手佩戴水晶常见30个问题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: linear-gradient(to bottom, #ffffff 0%, #f9f9f9 100%);
            border: 4px solid #555;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .main-title {
            font-size: 36px;
            font-weight: 900;
            color: #000;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        
        .sub-title {
            font-size: 38px;
            font-weight: 900;
            color: #d35400;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(211,84,0,0.2);
        }
        
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            position: relative;
        }
        
        .divider-line {
            height: 3px;
            background: linear-gradient(to right, transparent, #d35400, transparent);
            flex-grow: 1;
            max-width: 200px;
        }
        
        .ribbon-icon {
            width: 50px;
            height: 24px;
            background: #d35400;
            margin: 0 15px;
            position: relative;
            clip-path: polygon(0% 20%, 15% 0%, 85% 0%, 100% 20%, 100% 80%, 85% 100%, 15% 100%, 0% 80%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .ribbon-icon::before,
        .ribbon-icon::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
        
        .ribbon-icon::before {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 8px 6px 0;
            border-color: transparent #d35400 transparent transparent;
        }
        
        .ribbon-icon::after {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 6px 0 6px 8px;
            border-color: transparent transparent transparent #d35400;
        }
        
        .question-block {
            margin-bottom: 28px;
            position: relative;
        }
        
        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 26px;
            font-weight: 900;
            color: #000;
        }
        
        .crystal-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: auto;
            flex-shrink: 0;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .answer-text {
            font-size: 18px;
            line-height: 1.7;
            color: #222;
            font-weight: 600;
        }
        
        .numbered-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        
        .number-badge {
            background-color: #2980b9;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin-right: 8px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .item-content {
            flex: 1;
        }
        
        .list-text {
            line-height: 1.8;
            letter-spacing: 0.5px;
        }
        
        /* Specific image placeholders */
        .img-yellow { background: radial-gradient(circle at 30% 30%, #f39c12, #e67e22, #d35400); }
        .img-red { background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b, #922b21); }
        .img-pink { background: radial-gradient(circle at 30% 30%, #fadbd8, #f5b7b1, #f1948a); }
        .img-spotted { 
            background: radial-gradient(circle at 30% 30%, #ecf0f1, #bdc3c7, #95a5a6);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(192,57,43,0.4) 2px, transparent 2px),
                radial-gradient(circle at 70% 60%, rgba(192,57,43,0.4) 2px, transparent 2px),
                radial-gradient(circle at 40% 80%, rgba(192,57,43,0.4) 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, rgba(192,57,43,0.4) 2px, transparent 2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="main-title">新手佩戴水晶</div>
            <div class="sub-title">常见30个问题</div>
        </div>
        
        <div class="divider">
            <div class="divider-line"></div>
            <div class="ribbon-icon"></div>
            <div class="divider-line"></div>
        </div>
        
        <!-- Question 1 -->
        <div class="question-block">
            <div class="question-header">
                <span>Q:水晶戴左手还是右手?</span>
                <div class="crystal-img img-yellow placeholder" title="[Image: Yellow Crystal]"></div>
            </div>
            <div class="answer-text">
                <div class="numbered-item">
                    <span class="number-badge">1</span>
                    <span class="item-content">黄水晶、草莓晶、紫水晶、海蓝宝、粉晶、<br>月光石、萤石等常佩戴在左手;</span>
                </div>
                <div class="numbered-item">
                    <span class="number-badge">2</span>
                    <span class="item-content">黑/银曜石、白水晶、虎眼石等常佩戴在右手。</span>
                </div>
            </div>
        </div>
        
        <!-- Question 2 -->
        <div class="question-block">
            <div class="question-header">
                <span>Q:哪些水晶不能碰水?</span>
                <div class="crystal-img img-red placeholder" title="[Image: Red Crystal]"></div>
            </div>
            <div class="answer-text list-text">
                太阳石、方解石、萤石、孔雀石、天青石<br>
                青金石、海纹石、月光石、天河石、绿松石<br>
                蓝铜矿、蓝晶石、堇青石、紫龙晶、紫锂辉石<br>
                透石膏、灰月光、赤铁矿、紫锂云母
            </div>
        </div>
        
        <!-- Question 3 -->
        <div class="question-block">
            <div class="question-header">
                <span>Q:水晶怎么消磁?</span>
                <div class="crystal-img img-pink placeholder" title="[Image: Pink Crystal]"></div>
            </div>
            <div class="answer-text list-text">
                碎石消磁、海盐消磁、鼠尾草消磁、月光消磁<br>
                流水消磁
            </div>
        </div>
        
        <!-- Question 4 -->
        <div class="question-block">
            <div class="question-header">
                <span>Q:不佩戴水晶的时候放哪里?</span>
                <div class="crystal-img img-spotted placeholder" title="[Image: Spotted Crystal]"></div>
            </div>
            <div class="answer-text">
                <div class="numbered-item">
                    <span class="number-badge">1</span>
                    <span class="item-content">可以放在装有消磁石的盒子里存放起来;</span>
                </div>
                <div class="numbered-item">
                    <span class="number-badge">2</span>
                    <span class="item-content">可以放在水晶簇或水晶洞里面;</span>
                </div>
                <div class="numbered-item">
                    <span class="number-badge">3</span>
                    <span class="item-content">可以放一个软布在木盒，然后将水晶放里面。</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
