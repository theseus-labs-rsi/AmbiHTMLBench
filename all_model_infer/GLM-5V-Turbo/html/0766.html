<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三天路线规划</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f8f8f8;
            background-image: 
                linear-gradient(#d4d4d4 1px, transparent 1px),
                linear-gradient(90deg, #d4d4d4 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
        }
        
        h1 {
            color: #00008B;
            text-align: center;
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }
        
        .itinerary-wrapper {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }
        
        .timeline {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .day-badge {
            background-color: #90EE90;
            color: #000;
            padding: 12px 28px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .arrow {
            color: #FFD700;
            font-size: 42px;
            line-height: 1;
            margin: 6px 0;
            font-weight: bold;
        }
        
        .location-name {
            font-size: 30px;
            font-weight: bold;
            color: #000;
            margin: 12px 0;
            text-align: center;
        }
        
        .transport-line {
            font-size: 22px;
            color: #333;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .transport-arrow {
            color: #FFD700;
            font-size: 36px;
            line-height: 1;
        }
        
        .details-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 5px;
        }
        
        .info-card {
            border: 3px solid #B22222;
            padding: 16px 20px;
            min-height: 85px;
            display: flex;
            align-items: center;
            font-size: 19px;
            line-height: 1.6;
            background: #fff;
        }
        
        .place-title {
            color: #00008B;
            font-weight: bold;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>第三天路线规划</h1>
        
        <div class="itinerary-wrapper">
            <div class="timeline">
                <div class="day-badge">第三天</div>
                <div class="arrow">↓</div>
                
                <div class="location-name">磁器口</div>
                
                <div class="transport-line">
                    1号线<span class="transport-arrow">↓</span>30分钟
                </div>
                
                <div class="location-name">罗中立美术馆</div>
                
                <div class="transport-line">
                    1号线<span class="transport-arrow">↓</span>80分钟
                </div>
                
                <div class="location-name">山城步道</div>
                
                <div class="transport-line">
                    公交<span class="transport-arrow">↓</span>32分钟
                </div>
                
                <div class="location-name">观音桥</div>
                
                <div class="transport-line">
                    步行<span class="transport-arrow">↓</span>15分钟
                </div>
                
                <div class="location-name">九街</div>
            </div>
            
            <div class="details-panel">
                <div class="info-card">
                    <span><span class="place-title">磁器口（免费）</span>：汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌</span>
                </div>
                
                <div class="info-card">
                    <span><span class="place-title">罗中立美术馆（免费）</span>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服</span>
                </div>
                
                <div class="info-card">
                    <span><span class="place-title">山城步道（免费）</span>：建在悬崖边的临江步道，汇聚老重庆特色步道</span>
                </div>
                
                <div class="info-card">
                    <span><span class="place-title">观音桥（免费）</span>：超大商圈，还有很多地道重庆小吃</span>
                </div>
                
                <div class="info-card">
                    <span><span class="place-title">九街（免费）</span>：酒吧一条街，娱乐夜生活开天地，和式风格的酒吧都有</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
