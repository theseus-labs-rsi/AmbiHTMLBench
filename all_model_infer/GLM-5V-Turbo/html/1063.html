<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奔驰大G购车时间计算</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            padding-bottom: 20px;
        }
        
        .car-image {
            width: 80%;
            max-width: 450px;
            display: block;
            margin: 0 auto 10px auto;
        }
        
        .main-title {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .sub-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #000000;
        }
        
        .data-table {
            width: 95%;
            margin: 0 auto;
            border-collapse: collapse;
            border: 1px solid #cccccc;
        }
        
        .data-table th,
        .data-table td {
            border: 1px solid #cccccc;
            padding: 12px 15px;
            text-align: left;
            font-size: 18px;
        }
        
        .data-table th {
            background-color: #e6e6e6;
            font-weight: 700;
            text-align: center;
        }
        
        .data-table td {
            text-align: center;
        }
        
        .data-table td:first-child {
            text-align: left;
            font-weight: 600;
        }
        
        .footer-note {
            text-align: right;
            font-size: 11px;
            color: #666666;
            margin-top: 8px;
            padding-right: 3%;
        }
        
        .watermark {
            position: absolute;
            right: -50px;
            bottom: 50px;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Watermark Background -->
        <div class="watermark">
            <svg width="300" height="300" viewBox="0 0 200 200">
                <circle cx="100" cy="70" r="60" fill="none" stroke="black" stroke-width="8"/>
                <path d="M40 130 L160 130 L100 190 Z" fill="none" stroke="black" stroke-width="8"/>
                <line x1="100" y1="130" x2="100" y2="30" stroke="black" stroke-width="8"/>
            </svg>
        </div>

        <!-- Car Image -->
        <img src="mercedes-g-class.png" alt="奔驰大G黑色SUV车辆图片" class="car-image" style="background-color: #f0f0f0; height: 220px; object-fit: cover; object-position: center;">
        
        <!-- Titles -->
        <h1 class="main-title">奔驰 大G</h1>
        <h2 class="sub-title">普通人 赚一辆豪车 需要多久？</h2>
        
        <!-- Data Table -->
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 25%;">职业</th>
                    <th style="width: 35%;">月薪</th>
                    <th style="width: 40%;">时间</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>外卖员</td>
                    <td>5000元/月</td>
                    <td>大约45年</td>
                </tr>
                <tr>
                    <td>建筑工人</td>
                    <td>6000元/月</td>
                    <td>大约38年</td>
                </tr>
                <tr>
                    <td>出租车司机</td>
                    <td>6500元/月</td>
                    <td>大约35年</td>
                </tr>
                <tr>
                    <td>教师</td>
                    <td>8000元/月</td>
                    <td>大约28年</td>
                </tr>
                <tr>
                    <td>医生</td>
                    <td>10000元/月</td>
                    <td>大约23年</td>
                </tr>
                <tr>
                    <td>互联网职工</td>
                    <td>15000元/月</td>
                    <td>大约15年</td>
                </tr>
                <tr>
                    <td>银行职员</td>
                    <td>20000元/月</td>
                    <td>大约11年</td>
                </tr>
                <tr>
                    <td>销售</td>
                    <td>25000元/月</td>
                    <td>大约9年</td>
                </tr>
                <tr>
                    <td>私企老板</td>
                    <td>50000元/月</td>
                    <td>大约5年</td>
                </tr>
            </tbody>
        </table>
        
        <!-- Footer Note -->
        <div class="footer-note">*月薪前30%作为日常基本开销</div>
    </div>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
