<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钩针工具选择指南</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
        }
        
        .header {
            background-color: #6b7c7a;
            color: white;
            text-align: center;
            padding: 20px 10px 15px 10px;
        }
        
        .main-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        
        .sub-title {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 1px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            vertical-align: middle;
            text-align: left;
        }
        
        th {
            background-color: #6b7c7a;
            color: white;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
            padding: 15px 12px;
        }
        
        td:first-child {
            width: 100px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        
        td:nth-child(2) {
            width: 45%;
            line-height: 1.6;
            font-size: 14px;
        }
        
        td:nth-child(3) {
            width: 25%;
            font-size: 14px;
        }
        
        td:last-child {
            width: 120px;
            text-align: center;
        }
        
        .required-tag {
            color: #d9534f;
            font-size: 13px;
            display: block;
            margin-top: 2px;
            font-weight: normal;
        }
        
        .placeholder {
            width: 80px;
            height: 60px;
            background-color: #f0f0f0;
            border: 1px dashed #ccc;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #999;
            overflow: hidden;
        }
        
        .placeholder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="main-title">钩针工具选择指南</div>
            <div class="sub-title">——only手作集——</div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>工具</th>
                    <th>用途</th>
                    <th>初学者建议</th>
                    <th>实物图</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        钩针<br>
                        <span class="required-tag">(必备)</span>
                    </td>
                    <td>钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》</td>
                    <td>3mm左右的钩针最实用</td>
                    <td>
                        <div class="placeholder">
                            [Image: 彩色钩针]
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        毛线<br>
                        <span class="required-tag">(必备)</span>
                    </td>
                    <td>毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》</td>
                    <td>中粗的宝宝棉/牛奶棉</td>
                    <td>
                        <div class="placeholder">
                            [Image: 毛线球]
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        剪刀<br>
                        <span class="required-tag">(必备)</span>
                    </td>
                    <td>剪断编织过程中的编织线</td>
                    <td>必备</td>
                    <td>
                        <div class="placeholder">
                            [Image: 剪刀]
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>缝合针</td>
                    <td>缝合、修补和连接编织面料</td>
                    <td>非必须</td>
                    <td>
                        <div class="placeholder">
                            [Image: 缝合针]
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
