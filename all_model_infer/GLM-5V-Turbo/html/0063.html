<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture California - September/October 1983</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f5f5f0;
            color: #000;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            border: 3px solid #000;
            background-color: #fff;
            padding: 0;
        }
        
        .photo-container {
            width: 100%;
            border-bottom: 3px solid #000;
            position: relative;
        }
        
        .photo-placeholder {
            width: 100%;
            height: 700px;
            background: linear-gradient(135deg, #2d4a3e 0%, #4a6b5a 50%, #8b7355 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .photo-placeholder::after {
            content: "[Photograph: Transpacific Building Interior - Oakland, CA]";
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            color: #fff;
            font-size: 14px;
        }
        
        /* Simulating the interior architecture elements */
        .arch-element {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .floor-pattern {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: 
                repeating-linear-gradient(45deg, #5c4033 0px, #5c4033 20px, transparent 20px, transparent 40px),
                repeating-linear-gradient(-45deg, #8b7355 0px, #8b7355 20px, transparent 20px, transparent 40px);
            opacity: 0.6;
        }
        
        .caption-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 15px 30px;
            border-bottom: 3px solid #000;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        
        .caption-left {
            flex: 1;
        }
        
        .caption-right {
            flex: 1;
            text-align: right;
        }
        
        .quote-section {
            padding: 60px 30px 80px 30px;
            text-align: center;
            border-bottom: 3px solid #000;
        }
        
        .quote-text {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -1px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        .info-section {
            display: flex;
            justify-content: space-between;
            padding: 40px 30px 60px 30px;
        }
        
        .info-left {
            flex: 1;
            padding-right: 40px;
        }
        
        .company-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .address {
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        
        .tagline {
            font-size: 16px;
            color: #333;
            margin-top: 12px;
        }
        
        .info-right {
            flex: 1;
            text-align: right;
            padding-top: 5px;
        }
        
        .phone {
            font-size: 18px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .names {
            font-size: 18px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }
        
        .footer {
            padding: 15px 30px;
            text-align: right;
            font-size: 11px;
            color: #333;
            border-top: 1px solid #ccc;
            margin-top: auto;
        }
        
        .page-number {
            float: right;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Photograph -->
        <div class="photo-container">
            <div class="photo-placeholder">
                <div class="floor-pattern"></div>
                <div class="arch-element" style="top: 10%; left: 10%; width: 30%; height: 25%;"></div>
                <div class="arch-element" style="top: 15%; right: 15%; width: 25%; height: 20%;"></div>
                <div class="arch-element" style="bottom: 45%; left: 30%; width: 20%; height: 15%;"></div>
            </div>
        </div>
        
        <!-- Caption Row -->
        <div class="caption-row">
            <span class="caption-left">Transpacific Building — Oakland, CA</span>
            <span class="caption-right">Wong & Tung International Architects</span>
        </div>
        
        <!-- Quote Section -->
        <div class="quote-section">
            <h1 class="quote-text">“tile that humanizes”</h1>
        </div>
        
        <!-- Information Section -->
        <div class="info-section">
            <div class="info-left">
                <div class="company-name">Heath Ceramics,</div>
                <div class="address">Sausalito, CA 94965</div>
                <div class="tagline">(Custom-made by people—not automated)</div>
            </div>
            
            <div class="info-right">
                <div class="phone">Phone (415) 332-3732</div>
                <div class="names">
                    Edith Heath<br>
                    Jon Brooder
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <span>September/October 1983&nbsp;&nbsp;&nbsp;Architecture California</span>
            <span class="page-number">3</span>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
