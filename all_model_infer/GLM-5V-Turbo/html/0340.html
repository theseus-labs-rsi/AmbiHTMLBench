<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算思维二：分解思维</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .slide-container {
            width: 100%;
            max-width: 750px;
            min-height: 600px;
            position: relative;
            padding: 70px 70px 90px 70px;
            background: #ffffff;
        }
        
        /* Corner bracket decorations */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border-color: #a0bfa0;
            border-style: solid;
            border-width: 0;
        }
        
        .corner-tl {
            top: 20px;
            left: 20px;
            border-top-width: 3px;
            border-left-width: 3px;
        }
        
        .corner-tr {
            top: 20px;
            right: 20px;
            border-top-width: 3px;
            border-right-width: 3px;
        }
        
        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }
        
        .corner-br {
            bottom: 20px;
            right: 20px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }
        
        h1 {
            font-size: 38px;
            font-weight: normal;
            text-align: center;
            margin-bottom: 35px;
            color: #000000;
            letter-spacing: 2px;
        }
        
        .definition {
            font-size: 19px;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #000000;
        }
        
        .highlight-red {
            color: #e63946;
        }
        
        .content-section {
            margin-bottom: 28px;
        }
        
        .section-header {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #000000;
        }
        
        .section-body {
            font-size: 19px;
            line-height: 1.7;
            color: #000000;
            padding-left: 5px;
        }
        
        .attribution {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: #333333;
            white-space: nowrap;
        }
        
        .page-nav {
            position: absolute;
            bottom: 45px;
            right: 55px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        
        .nav-label {
            background-color: #000000;
            color: #ffffff;
            font-size: 14px;
            padding: 4px 12px;
            margin-right: -2px;
            z-index: 2;
            position: relative;
        }
        
        .nav-arrow {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 32px solid #000000;
            z-index: 1;
            position: relative;
            left: -2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Corner Brackets -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        
        <!-- Main Title -->
        <h1>计算思维二：分解思维</h1>
        
        <!-- Definition Paragraph -->
        <div class="definition">
            分解思维是指将复杂的问题（或任务）<span class="highlight-red">拆解成一个更易于解决的小问题（或任务）</span>。
        </div>
        
        <!-- Section 1 -->
        <div class="content-section">
            <div class="section-header">1、问题梳理</div>
            <div class="section-body">
                先明确这个复杂问题到底是什么，最终要达到什么目的或效果。
            </div>
        </div>
        
        <!-- Section 2 -->
        <div class="content-section">
            <div class="section-header">2、问题分解</div>
            <div class="section-body">
                将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。
            </div>
        </div>
        
        <!-- Section 3 -->
        <div class="content-section">
            <div class="section-header">3、整合方案</div>
            <div class="section-body">
                制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。
            </div>
        </div>
        
        <!-- Attribution Footer -->
        <div class="attribution">原创：学习方法社</div>
        
        <!-- Page Turn Navigation -->
        <div class="page-nav">
            <div class="nav-label">翻页</div>
            <div class="nav-arrow"></div>
        </div>
    </div>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
