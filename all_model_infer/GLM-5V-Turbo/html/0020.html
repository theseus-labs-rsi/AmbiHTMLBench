<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侵权责任与权利界限</title>
    <style>
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            background-color: white;
            padding: 40px;
            max-width: 900px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .grid-paper {
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 800px;
            padding: 20px;
        }
        
        .mind-map {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 30px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .branch {
            display: flex;
            flex-direction: column;
            border-right: 2px solid #4a90a4;
            padding-right: 15px;
            position: relative;
        }
        
        .branch::before {
            content: '';
            position: absolute;
            right: -7px;
            top: 20px;
            width: 12px;
            height: 2px;
            background-color: #4a90a4;
        }
        
        .node {
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            padding: 10px 5px;
            border-left: 2px solid #4a90a4;
            margin-left: 15px;
            position: relative;
            letter-spacing: 3px;
        }
        
        .node::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 50%;
            width: 14px;
            height: 2px;
            background-color: #4a90a4;
        }
        
        .root-node {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 18px;
            font-weight: bold;
            color: #2c5f6f;
            letter-spacing: 5px;
            padding: 20px 10px;
            border: 3px solid #4a90a4;
            background-color: #f0f7f9;
        }
        
        .level-1 {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .level-2 {
            font-size: 14px;
            color: #444;
        }
        
        .level-3 {
            font-size: 13px;
            color: #555;
        }
        
        .level-4 {
            font-size: 12px;
            color: #666;
        }
        
        .children {
            display: flex;
            flex-direction: row-reverse;
            gap: 20px;
            margin-top: 0;
            padding-top: 0;
        }
        
        .leaf {
            border-left: none;
            margin-left: 25px;
        }
        
        .leaf::before {
            left: -11px;
        }

        @media (max-width: 768px) {
            .mind-map {
                flex-direction: column;
            }
            .node, .root-node {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
            }
            .branch {
                border-right: none;
                border-bottom: 2px solid #4a90a4;
                padding-right: 0;
                padding-bottom: 15px;
            }
            .branch::before {
                right: auto;
                left: 50%;
                top: auto;
                bottom: -7px;
                width: 2px;
                height: 12px;
            }
            .node {
                border-left: none;
                border-top: 2px solid #4a90a4;
                margin-left: 0;
                margin-top: 15px;
            }
            .node::before {
                left: 50%;
                top: -11px;
                width: 2px;
                height: 14px;
            }
            .children {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="container">
        <div class="grid-paper">
            <div class="mind-map">
                <div class="root-node">侵权责任与权利界限</div>
                
                <div class="children">
                    <!-- 左侧分支：侵权责任构成要件 -->
                    <div class="branch">
                        <div class="node level-1">侵权责任构成要件</div>
                        <div class="children">
                            <div class="branch">
                                <div class="node level-2">承担侵权责任</div>
                                <div class="children">
                                    <div class="branch">
                                        <div class="node level-2">行为人侵害民事权益</div>
                                        <div class="children">
                                            <div class="branch">
                                                <div class="node level-3">一般侵权责任</div>
                                                <div class="children">
                                                    <div class="branch">
                                                        <div class="node level-3">过错责任原则</div>
                                                        <div class="children">
                                                            <div class="branch">
                                                                <div class="node level-4">过错推定</div>
                                                                <div class="children">
                                                                    <div class="branch">
                                                                        <div class="node leaf level-4">举证责任倒置</div>
                                                                        <div class="children">
                                                                            <div class="node leaf level-4">立法例</div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="branch">
                                                <div class="node level-3">损害后果</div>
                                                <div class="children">
                                                    <div class="branch">
                                                        <div class="node level-4">实际损害和危险状态</div>
                                                        <div class="children">
                                                            <div class="branch">
                                                                <div class="node level-4">财产损害和非财产损害</div>
                                                                <div class="children">
                                                                    <div class="branch">
                                                                        <div class="node leaf level-4">人身损害</div>
                                                                        <div class="children">
                                                                            <div class="node leaf level-4">精神损害</div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="branch">
                                                <div class="node level-3">因果关系</div>
                                                <div class="children">
                                                    <div class="node leaf level-4">条件说、相当因果关系说等</div>
                                                </div>
                                            </div>
                                            <div class="branch">
                                                <div class="node level-3">违法性</div>
                                                <div class="children">
                                                    <div class="branch">
                                                        <div class="node level-4">违反法律规定</div>
                                                        <div class="children">
                                                            <div class="node leaf level-4">违背公序良俗</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧分支：权利界限 -->
                    <div class="branch">
                        <div class="node level-1">权利界限</div>
                        <div class="children">
                            <div class="branch">
                                <div class="node level-2">权利冲突</div>
                                <div class="children">
                                    <div class="branch">
                                        <div class="node level-3">以利益衡量、价值判断解决</div>
                                        <div class="children">
                                            <div class="branch">
                                                <div class="node level-3">相邻权使用</div>
                                                <div class="children">
                                                    <div class="branch">
                                                        <div class="node level-4">合理使用</div>
                                                        <div class="children">
                                                            <div class="branch">
                                                                <div class="node level-4">公益性使用</div>
                                                                <div class="children">
                                                                    <div class="branch">
                                                                        <div class="node level-4">必要且不超过必要限度</div>
                                                                        <div class="children">
                                                                            <div class="branch">
                                                                                <div class="node level-4">不影响权利人正常行使</div>
                                                                                <div class="children">
                                                                                    <div class="branch">
                                                                                        <div class="node level-4">造成轻微损失可容忍</div>
                                                                                        <div class="children">
                                                                                            <div class="branch">
                                                                                                <div class="node level-4">邻里之间相互谅解</div>
                                                                                                <div class="children">
                                                                                                    <div class="branch">
                                                                                                        <div class="node level-4">符合当地习惯</div>
                                                                                                        <div class="children">
                                                                                                            <div class="branch">
                                                                                                                <div class="node level-4">不得滥用权利</div>
                                                                                                                <div class="children">
                                                                                                                    <div class="branch">
                                                                                                                        <div class="node level-4">权利行使不得损害他人合法权益</div>
                                                                                                                        <div class="children">
                                                                                                                            <div class="branch">
                                                                                                                                <div class="node level-4">善意行使</div>
                                                                                                                                <div class="children">
                                                                                                                                    <div class="branch">
                                                                                                                                        <div class="node level-4">尊重他人权利边界</div>
                                                                                                                                        <div class="children">
                                                                                                                                            <div class="node leaf level-4">寻求协商或司法救济</div>
                                                                                                                                        </div>
                                                                                                                                    </div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>
                                                                                                                    </div>
                                                                                                                </div>
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </div>
                                                                                                </div>
                                                                                            </div>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
