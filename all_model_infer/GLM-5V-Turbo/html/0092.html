<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middlesex Music Hall Poster</title>
    <style>
        body {
            background-color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster {
            background-color: #f4f1e6; /* Aged paper color */
            width: 100%;
            max-width: 750px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: "Times New Roman", Times, serif;
            color: #000;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        /* Typography */
        h1, h2, h3, p, div {
            margin: 0;
            padding: 0;
            line-height: 1.2;
        }

        .venue-name {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .venue-location {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .date-info {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sub-info {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .attraction-label {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .attraction-title {
            font-size: 5rem;
            color: #c0392b; /* Reddish brown */
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 5px;
            line-height: 1;
            letter-spacing: -2px;
        }

        .attraction-origin {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        /* Image Frame Area */
        .frame-container {
            background-color: #f4d03f; /* Bright yellow/gold */
            border: 6px double #d4ac0d; /* Double border simulation */
            padding: 10px;
            margin: 0 auto 25px auto;
            width: 90%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .placeholder {
            width: 100%;
            height: 500px; /* Fixed height to match aspect ratio */
            background-color: transparent; /* Let the yellow show through or add subtle pattern */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the illustration presence without external assets */
        .placeholder::after {
            content: "[Illustration: The Hirsute Kostroma People]";
            color: rgba(0,0,0,0.3);
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        .footer-text {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-top: 1px solid #000;
            display: inline-block;
            padding-top: 10px;
            margin-top: 10px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .poster { padding: 20px; }
            .venue-name { font-size: 2rem; }
            .main-title { font-size: 2.5rem; }
            .attraction-title { font-size: 3rem; }
            .date-info { font-size: 1.5rem; }
            .placeholder { height: 350px; }
        }
    </style>
</head>
<body>

<div class="poster">
    <header>
        <div class="venue-name">Middlesex Music Hall,</div>
        <div class="venue-location">Drury Lane,</div>
        
        <h2 class="main-title">S. Emanuel's Benefit</h2>
        
        <div class="date-info">Wednesday, Feb. 25th.</div>
        <div class="sub-info">Positively For This Night Only.</div>
        
        <div class="attraction-label">The Hirsute</div>
        <h3 class="attraction-title">Kostroma People</h3>
        <div class="attraction-origin">From The Primeval Forests Of Central Russia.</div>
    </header>

    <main class="frame-container">
        <figure class="placeholder">
            <!-- Visual representation of the two seated figures -->
        </figure>
    </main>

    <footer>
        <div class="footer-text">The First Of Their Kind Ever Seen In England.</div>
    </footer>
</div>

</body>
</html>
