<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为新疆人民打出一个民主联合政府</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2c3e5f;
            background-image: 
                repeating-radial-gradient(
                    circle at 0 0,
                    transparent 0,
                    transparent 15px,
                    #1a2538 16px,
                    #1a2538 20px,
                    transparent 21px
                ),
                repeating-linear-gradient(
                    90deg,
                    #2c3e5f 0px,
                    #2c3e5f 30px,
                    #24334d 31px,
                    #24334d 60px
                );
            background-size: 60px 60px;
            padding: 40px 20px;
            font-family: "SimSun", "宋体", serif;
            min-height: 100vh;
        }

        .document-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fafafa;
            padding: 50px 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 26px;
            font-weight: bold;
            color: #000;
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 20px;
            line-height: 1.9;
            color: #000;
            margin-bottom: 28px;
            text-align: justify;
            text-indent: 0;
        }

        .highlight-text {
            position: relative;
            display: inline-block;
            padding-bottom: 6px;
        }

        .highlight-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            right: -4px;
            height: 4px;
            background-color: #e60000;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .document-container {
                padding: 30px 25px;
            }
            
            h2 {
                font-size: 22px;
            }
            
            p {
                font-size: 17px;
                line-height: 1.7;
            }
        }
    </style>
</head>
<body>
    <div class="document-container">
        <h2>2、为新疆人民打出一个民主联合政府</h2>
        
        <p>受到长期迫害的新疆各族人民奋勇反抗，发动了伊犁、塔城、阿山三区人民革命。革命军队很快占领了以上三个地区，成立了临时革命政府。</p>
        
        <p>三区人民革命让盛世才感受到了各族人民抗争的力量，最终在革命力量和国民政府的双重压力下败走新疆。1945年日本投降以后，国民政府在全国各族人民的多方压力下，与临时革命政府开启谈判，假借谈判的手段分化瓦解革命力量。</p>
        
        <p><span class="highlight-text">恐怕谈判桌上的所有人都不会想到，赛福鼎以后会成为新中国的副国级领导人。</span></p>
    </div>
</body>
