    <div class="container">
        <h1>住宿建议</h1>
        <h2>[选酒店关注点]<span class="subtitle-decoration">ooo</span></h2>
        
        <div class="section">
            <span class="section-title">【沙滩】：</span>亲子家庭出行游，对沙滩的质量和海水的选择上要干净、清澈，沙子细软不扎脚的。有私人海滩更佳
        </div>
        
        <div class="section">
            <span class="section-title">【酒店设施】：</span>针对酒店的洗护有没有提供宝宝专用，以及宝宝专用的洗漱台和马桶等等，以及<span class="wavy-underline">有没有婴儿床、床围等床上用品提供</span>
        </div>
        
        <div class="section">
            <span class="section-title">【房间】：</span>房间主题最好有小朋友喜欢的主题，比如太空主题房间或者星空主题的房间；以及房间有没有提供儿童帐篷、滑梯等玩乐设施。房型<span class="wavy-underline">面积最好大一些，有足够的空间</span>给小朋友跑跳玩乐
        </div>
        
        <div class="section">
            <span class="section-title">【儿童玩乐设施】：</span>看酒店儿童玩乐设施室内还是室外.设施是不是每日一消毒，看空间宽不宽敞。有没有家长休息区。<span class="wavy-underline">有没有托管服务，托管时间，托管玩的项目等具体小朋友玩乐细节</span>
        </div>
    </div>
