<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早发白帝城 - 李白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Songti SC", "SimSun", "STSong", serif;
            background-color: #4b5a7a;
            color: #e8e8e8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }
        
        .column {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            line-height: 1.6;
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .author-column {
            font-size: 1.8rem;
            letter-spacing: 0.3rem;
            gap: 1rem;
        }
        
        .poem-line {
            margin-bottom: 1rem;
        }
        
        footer {
            width: 100%;
            max-width: 600px;
            background-color: #f5f0e6;
            color: #333;
            padding: 1rem 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
            border-top: 1px solid #ddd;
            margin-top: auto;
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: row-reverse;
                gap: 1rem;
                padding: 1rem;
            }
            
            .column {
                font-size: 1.8rem;
                height: 60vh;
            }
            
            .author-column {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- First column (rightmost in visual, first in DOM due to flex-direction: row-reverse) -->
        <div class="column">
            <div>朝辭白帝彩雲間</div>
            <div>千里江陵一日還</div>
        </div>
        
        <!-- Second column -->
        <div class="column">
            <div>兩岸猿聲啼不住，</div>
            <div>輕舟已過萬重山。</div>
        </div>
        
        <!-- Third column (leftmost, author info) -->
        <div class="column author-column">
            <div>唐</div>
            <div>李白</div>
            <div>早發白帝城</div>
        </div>
    </div>
    
    <footer>
        两岸猿声，还在耳边不停地啼叫叫不知不覺，輕舟已穿過萬重青山。
    </footer>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
