<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句段结构作用好处赏析</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            background-color: #f5f5f5;
            background-image: 
                linear-gradient(rgba(200, 220, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 220, 255, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #8b0000;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding: 40px 20px;
        }
        
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }
        
        .left-section {
            flex: 1;
            display: flex;
            gap: 20px;
        }
        
        .vertical-label {
            writing-mode: vertical-rl;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            line-height: 1.5;
        }
        
        .content-block {
            margin-bottom: 25px;
        }
        
        .question-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .question-list li {
            font-size: 18px;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #cc0000;
        }
        
        .formula-item {
            font-size: 18px;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .formula-sub {
            padding-left: 20px;
            margin-top: 5px;
        }
        
        .seal-container {
            width: 80px;
            height: 80px;
            border: 3px solid #8b0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(139, 0, 0, 0.1);
            position: absolute;
            right: 50px;
            top: 180px;
        }
        
        .seal-text {
            writing-mode: vertical-rl;
            font-size: 32px;
            font-weight: bold;
            color: #8b0000;
            letter-spacing: 5px;
        }
        
        .mnemonic {
            text-align: center;
            font-size: 22px;
            margin-top: 30px;
            letter-spacing: 3px;
            color: #333;
        }
        
        .blank {
            display: inline-block;
            min-width: 60px;
            border-bottom: 1px solid #8b0000;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">句段结构作用好处赏析</h1>
        
        <div class="main-content">
            <div class="left-section">
                <!-- 常见问法 Section -->
                <div style="display: flex; gap: 15px; margin-bottom: 30px;">
                    <div class="vertical-label">常见问法</div>
                    <ul class="question-list">
                        <li>1.请分析这句话的作用是什么!</li>
                        <li>2.这句话这样写有什么好处!</li>
                        <li>3.请分析这句话这样描写的表达效果.</li>
                    </ul>
                </div>
                
                <!-- 满分公式 Section -->
                <div style="display: flex; gap: 15px;">
                    <div class="vertical-label">满分公式</div>
                    <div class="content-block">
                        <div class="formula-item">①这是(<span class="blank"></span>)描写</div>
                        <div class="formula-sub">生动形象地写出(<span class="blank"></span>).</div>
                        
                        <div class="formula-item">②更突出了(<span class="blank"></span>).</div>
                        
                        <div class="formula-item">③前后文呼应/为后文(<span class="blank"></span>)做了铺垫</div>
                    </div>
                </div>
            </div>
            
            <!-- Seal -->
            <div class="seal-container placeholder">
                <div class="seal-text">字真</div>
            </div>
        </div>
        
        <div class="mnemonic">
            口诀：生动秀 感心头 勾勾手
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
