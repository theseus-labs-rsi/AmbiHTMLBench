<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侦探能量站</title>
    <style>
        body {
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            background-color: #f5f5f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .notebook-page {
            width: 600px;
            min-height: 800px;
            background-color: #fffef8;
            padding: 40px 50px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            position: relative;
            border-left: 1px solid #e0e0d0;
            border-right: 1px solid #e0e0d0;
        }
        
        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        
        .content {
            font-size: 19px;
            line-height: 1.8;
            letter-spacing: 1px;
            text-align: justify;
        }
        
        .paragraph {
            margin-bottom: 15px;
            text-indent: 0;
        }
        
        .red-text {
            color: #8b0000;
            font-size: 20px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.8;
        }
        
        .side-notes {
            position: absolute;
            left: 8px;
            top: 550px;
            writing-mode: vertical-rl;
            font-size: 16px;
            color: #666;
            letter-spacing: 3px;
        }
        
        .line-break {
            display: block;
        }
    </style>
</head>
<body>
    <div class="notebook-page">
        <div class="side-notes">右移<br>队列<br>角</div>
        
        <div class="title">侦探能量站</div>
        
        <div class="content">
            <div class="paragraph">
                当偏见裹挟认知，无视事实，操纵舆论的事发<span class="line-break"></span>
                生，我们该如何对待？
            </div>
            
            <div class="paragraph">
                如果我不害怕人微言轻，也许你就不会给历<span class="line-break"></span>
                人言可畏，用心辩别真相，用爱和真诚可以消<span class="line-break"></span>
                融流言。正如老侦探所言，“4军万马踩过的<span class="line-break"></span>
                时候，小小的一脚都有可能是致命伤，我们<span class="line-break"></span>
                谁都不想成为这样的人，我们也不要成为加<span class="line-break"></span>
                害的人”，遭遇不公时，隐忍不是唯一道路，<span class="line-break"></span>
                我们可以同不公平呐喊，只有大家都勇敢<span class="line-break"></span>
                起来，加害者才会觉得我们没有那么好<span class="line-break"></span>
                欺负。
            </div>
            
            <div class="red-text">
                愿你笔尖下皆自由之风，一笔一画，<br>
                一字一句，黑白分明
            </div>
        </div>
    </div>
</body>
</html>
