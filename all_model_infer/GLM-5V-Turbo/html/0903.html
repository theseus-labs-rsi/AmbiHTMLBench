<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #c8e6c9 30%, #f0f4c3 70%, #b2ebf2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .title-cn {
            display: inline-block;
            background-color: #fff9c4;
            color: #ffb300;
            font-size: 38px;
            font-weight: bold;
            padding: 12px 45px;
            border-radius: 50px;
            margin-bottom: 12px;
            letter-spacing: 8px;
            box-shadow: 0 4px 15px rgba(255,179,0,0.2);
            border: 2px solid #ffe082;
        }

        .title-en {
            color: #757575;
            font-size: 16px;
            letter-spacing: 6px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 45px 50px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 180px 1fr 160px;
            gap: 25px;
            align-items: start;
            margin-bottom: 25px;
        }

        .basic-info {
            color: #bf360c;
            font-size: 17px;
            line-height: 2.4;
            padding-top: 15px;
            font-weight: 500;
        }

        .info-item {
            margin-bottom: 8px;
        }

        .goals-section {
            position: relative;
            padding-top: 10px;
        }

        .speech-bubble {
            background-color: #fff176;
            border-radius: 25px;
            padding: 28px 32px;
            position: relative;
            color: #37474f;
            font-size: 15.5px;
            line-height: 1.9;
            box-shadow: 0 6px 20px rgba(255,213,79,0.4);
            max-width: 380px;
            margin-left: auto;
            margin-right: 20px;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            right: -18px;
            top: 35px;
            width: 0;
            height: 0;
            border-left: 18px solid #fff176;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
        }

        .bubble-title {
            font-weight: bold;
            color: #ef6c00;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .bubble-item {
            margin-bottom: 8px;
        }

        .photo-wrapper {
            width: 140px;
            height: 170px;
            position: relative;
        }

        .photo-circle {
            width: 100%;
            height: 100%;
            background-color: #ef5350;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid white;
            box-shadow: 0 8px 25px rgba(239,83,80,0.3);
            position: relative;
        }

        .photo-placeholder {
            color: rgba(255,255,255,0.9);
            font-size: 11px;
            text-align: center;
            padding: 10px;
            line-height: 1.4;
        }

        .description {
            color: #263238;
            font-size: 15.5px;
            line-height: 1.95;
            text-align: justify;
            text-indent: 2em;
            margin-top: 20px;
            padding: 0 10px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .speech-bubble {
                margin-right: 0;
                max-width: 100%;
            }
            
            .speech-bubble::after {
                display: none;
            }
            
            .photo-wrapper {
                margin: 0 auto;
            }
            
            .basic-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title-cn">自我介绍</h1>
            <p class="title-en">SELF INTRODUCTION</p>
        </header>

        <main class="main-card">
            <div class="content-grid">
                <aside class="basic-info">
                    <div class="info-item">姓名：咸鱼</div>
                    <div class="info-item">年龄：20</div>
                    <div class="info-item">爱好：看电影、打游戏</div>
                </aside>

                <section class="goals-section">
                    <article class="speech-bubble">
                        <div class="bubble-title">工作目标：</div>
                        <div class="bubble-item">1.学习好专业知识，同时广泛涉及其他职业知识。</div>
                        <div class="bubble-item">2.尽量多考取一些等级证书，这不仅是能力的证明，也是就业的有力底牌。</div>
                    </article>
                </section>

                <figure class="photo-wrapper">
                    <div class="photo-circle">
                        <div class="photo-placeholder">
                            [Photo: Woman wearing white<br>clothing and sunglasses,<br>red circular background]
                        </div>
                    </div>
                </figure>
            </div>

            <article class="description">
                大家好，我叫咸鱼，来自山东青岛。<br><br>
                本人性格沉稳、细致、观体、发挥所长。在工作上，细入微、认真负责，具有很好的团队合作精神。注重团体的利益、集体意识强。能够与人充分合作，充分听取他人意见和建议，并不断进步，观察力强、上进心强而且为人随和、易于沟通，能够快速地融入工作群队及成员给出良好的意见。
            </article>
        </main>
    </div>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
