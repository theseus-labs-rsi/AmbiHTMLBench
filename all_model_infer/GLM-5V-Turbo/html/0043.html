<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对比色配色 - 2023</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: #ffffff;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background-color: #f97316;
            color: #000000;
            padding: 30px 40px;
            position: relative;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .copyright-symbol {
            font-size: 36px;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .vertical-dots {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 5px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            transform: rotate(45deg);
        }
        
        .main-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 5px;
            flex-grow: 1;
            margin-left: 20px;
        }
        
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        
        .year {
            font-size: 32px;
            font-weight: bold;
        }
        
        .side-char {
            font-size: 28px;
            font-weight: bold;
        }
        
        .intro-text {
            background-color: #f97316;
            color: #000000;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .card {
            border: 2px solid #333;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fff;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }
        
        .diamond-bullet {
            width: 12px;
            height: 12px;
            background-color: #f97316;
            transform: rotate(45deg);
            display: inline-block;
        }
        
        .color-display {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }
        
        .card-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        
        /* First color scheme: Green, Yellow, Blue */
        .scheme-1 {
            background: linear-gradient(to bottom, 
                #22c55e 0%, 
                #22c55e 35%, 
                #facc15 35%, 
                #facc15 65%, 
                #2563eb 65%, 
                #2563eb 100%);
            position: relative;
        }
        
        .wave-overlay-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Second color scheme: Lime Green, Black, Magenta */
        .scheme-2 {
            background: linear-gradient(to bottom,
                #84cc16 0%,
                #84cc16 35%,
                #000000 35%,
                #000000 65%,
                #ec4899 65%,
                #ec4899 100%);
            position: relative;
        }
        
        .wave-overlay-2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        svg {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="copyright-symbol">©</div>
            <div class="vertical-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <h1 class="main-title">对比色配色</h1>
        </div>
        <div class="header-right">
            <div class="year">2023</div>
            <div class="side-char">端</div>
        </div>
    </div>

    <div class="intro-text">
        对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法.因为色相和色调都使用对比强烈的色彩,所以配色清晰而有力.
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title">富有朝气的配色</span>
            <span class="diamond-bullet"></span>
        </div>
        <div class="color-display scheme-1">
            <svg viewBox="0 0 400 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,0 L400,0 L400,50 Q300,60 250,80 Q200,100 150,85 Q100,70 50,90 Q0,110 0,90 Z" fill="#22c55e"/>
                <path d="M0,90 Q50,70 100,85 Q150,100 200,80 Q250,60 350,55 Q380,53 400,52 L400,95 Q320,105 260,95 Q200,85 150,100 Q100,115 50,105 Q0,95 0,110 Z" fill="#facc15"/>
                <path d="M0,110 Q50,120 100,108 Q150,96 200,110 Q250,124 320,112 Q380,102 400,105 L400,140 L0,140 Z" fill="#2563eb"/>
            </svg>
        </div>
        <div class="card-description">
            以明亮色调的黄色为中心与鲜艳色调的绿色和蓝紫色进行组合,给人未来充满希望的感觉.
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title">视觉冲击强烈的配色</span>
            <span class="diamond-bullet"></span>
        </div>
        <div class="color-display scheme-2">
            <svg viewBox="0 0 400 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,0 L400,0 L400,50 Q320,58 270,75 Q220,92 170,78 Q120,64 70,82 Q20,100 0,88 Z" fill="#84cc16"/>
                <path d="M0,88 Q20,100 70,85 Q120,70 170,85 Q220,100 280,88 Q340,76 400,82 L400,105 Q330,118 270,108 Q210,98 160,112 Q110,126 60,114 Q10,102 0,115 Z" fill="#000000"/>
                <path d="M0,115 Q10,105 60,116 Q110,127 160,113 Q210,99 275,110 Q340,121 400,108 L400,140 L0,140 Z" fill="#ec4899"/>
            </svg>
        </div>
        <div class="card-description">
            黄绿色相中选择华丽鲜艳的色调,同时在相反色中选择浅淡的深红色调在与黑色进行组合,视觉冲击强烈.
        </div>
    </div>

</body>
</html>
