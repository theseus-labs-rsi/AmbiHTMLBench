<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效背书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #4a5d53;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header {
            background-color: #3d4f46;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .content {
            padding: 24px 20px;
        }
        
        .section {
            margin-bottom: 18px;
            line-height: 1.6;
        }
        
        .section-title {
            color: #2d5a27;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        
        .section-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.7;
        }
        
        .example-box {
            margin-top: 8px;
            margin-left: 4px;
        }
        
        .example-line {
            margin-bottom: 6px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .label {
            display: inline-block;
            background-color: #fff44f;
            color: #000000;
            font-weight: bold;
            padding: 0 4px;
            margin-right: 4px;
        }
        
        .footer {
            background-color: #f5f5f5;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #e0e0e0;
        }
        
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #e8e8e8;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .quote-text {
            flex: 1;
            color: #666666;
            font-size: 15px;
            padding: 0 8px;
        }
        
        .play-btn {
            width: 36px;
            height: 36px;
            background-color: #4a5d53;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .play-icon {
            width: 0;
            height: 0;
            border-left: 12px solid #ffffff;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            margin-left: 3px;
        }
        
        .watermark {
            text-align: right;
            color: #999999;
            font-size: 11px;
            padding: 8px 16px 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">高效背书</div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">01.理解背诵</div>
                <div class="section-text">还有几天考试，很多东西还没背。不要慌张，先理解再背诵，考试运用得心应手</div>
            </div>
            
            <div class="section">
                <div class="section-title">02.关键复述</div>
                <div class="section-text">边读边画关键词，再把关键词抄在草稿纸上。把内容都遮住，然后就看自己写在草稿纸上的关键词，进行复述</div>
                
                <div class="example-box">
                    <div class="example-line"><span class="label">原文：</span>德思礼夫妇总是得意地说他们是非常规矩的人家</div>
                    <div class="example-line"><span class="label">关键：</span>德思礼夫妇 + 得意 + 非常规矩</div>
                    <div class="example-line"><span class="label">复述：</span>德思礼夫妇得意地说他们是非常规矩的一家</div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">03.关键背诵</div>
                <div class="section-text">这样就背关键词，考试的时候也能顺利展开内容</div>
            </div>
            
            <div class="section">
                <div class="section-title">04.睡觉记忆</div>
                <div class="section-text">睡前30分钟再复习背诵的内容。睡醒后10分钟，再看关键词进行复述，并默写出来</div>
            </div>
        </div>
        
        <div class="footer">
            <div class="avatar">🐻</div>
            <div class="quote-text">这样背书，就像用了魔法，过目不忘</div>
            <div class="play-btn">
                <div class="play-icon"></div>
            </div>
        </div>
        
        <div class="watermark">小红书号: 4141895475</div>
    </div>
</body>
</html>
