<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "SimSun", "宋体", serif;
            background-color: #f5f5f5;
        }
        
        .paper {
            background-color: white;
            width: 90%;
            max-width: 700px;
            padding: 40px 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            line-height: 1.8;
        }
        
        .question-number {
            font-size: 28px;
            color: #333;
            float: left;
            margin-right: 15px;
            line-height: 1.2;
        }
        
        .question-content {
            overflow: hidden;
        }
        
        .main-question {
            font-size: 16px;
            color: #222;
            margin-bottom: 10px;
        }
        
        .sub-question {
            font-size: 15px;
            color: #444;
            margin-left: 20px;
            margin-top: 12px;
            display: block;
        }
        
        .answer-area {
            margin-top: 25px;
            clear: both;
            padding-left: 10px;
        }
        
        .handwritten {
            font-family: "KaiTi", "楷体", "STKaiti", cursive;
            font-size: 26px;
            color: #2c2c2c;
            line-height: 1.9;
            letter-spacing: 1px;
        }
        
        .line {
            border-bottom: 1px solid #d0d0d0;
            height: 36px;
            margin-bottom: 4px;
        }
    </style>
    <script>
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
            displayMath: []
          },
          svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="paper">
        <div class="question-number">26</div>
        <div class="question-content">
            <div class="main-question">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</div>
            <div class="sub-question">她看到了什么呢？</div>
            
            <div class="answer-area">
                <div class="handwritten">
                    我蹲下来，“这根肋骨让你感<br>
                    到不舒服吗？”<br>
                    展览台上是一弯白玉莹莹的肋<br>
                    骨，下面的文字介绍引用了夏娃<br>
                    的来历，说女人都是由肋骨所化。
                </div>
            </div>
        </div>
    </div>
</body>
</html>
