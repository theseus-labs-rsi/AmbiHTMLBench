<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山里的約會</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", "STSong", serif;
            background-color: #c5d9d4;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .poster-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, #b8d4cf 0%, #dce8e4 40%, #c9ddd7 70%, #bdd6cf 100%);
        }
        
        .vertical-text-left-main {
            position: absolute;
            left: 35px;
            top: 25px;
            writing-mode: vertical-rl;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #1a3328;
            line-height: 1.4;
        }
        
        .vertical-text-left-sub {
            position: absolute;
            left: 65px;
            top: 290px;
            writing-mode: vertical-rl;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #0f1f18;
            line-height: 1.5;
        }
        
        .top-header-text {
            position: absolute;
            top: 8px;
            left: 220px;
            right: 40px;
            font-size: 15px;
            line-height: 1.7;
            color: #2d3e36;
            text-align: justify;
            letter-spacing: 1px;
        }
        
        .main-title-area {
            position: absolute;
            top: 75px;
            left: 48%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row-reverse;
            align-items: flex-start;
            gap: 10px;
        }
        
        .main-title-large {
            writing-mode: vertical-rl;
            font-size: 85px;
            font-weight: bold;
            color: #153d2a;
            letter-spacing: 15px;
            line-height: 1.1;
        }
        
        .main-title-small {
            writing-mode: vertical-rl;
            font-size: 58px;
            font-weight: bold;
            color: #153d2a;
            letter-spacing: 10px;
            line-height: 1.2;
            margin-top: 5px;
        }
        
        .watermark-area {
            position: absolute;
            top: 56%;
            left: 53%;
            transform: translate(-50%, -50%);
            font-size: 17px;
            color: #4a5f54;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        
        .heart-icon {
            color: #fff;
            font-size: 20px;
        }
        
        .illustration-zone {
            position: absolute;
            bottom: 140px;
            left: 0;
            right: 0;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }
        
        .illustration-placeholder {
            width: 90%;
            height: 100%;
            background: rgba(139, 169, 158, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a7268;
            font-size: 14px;
            border: 1px dashed rgba(90, 114, 104, 0.3);
        }
        
        .footer-text-grid {
            position: absolute;
            bottom: 35px;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 0 180px;
            gap: 40px;
            font-size: 16px;
            line-height: 1.8;
            color: #2d3e36;
        }
        
        .footer-col {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="vertical-text-left-main">大姫綜合</div>
        
        <div class="vertical-text-left-sub">TongCai 2021<br>Autumn</div>
        
        <div class="top-header-text">
            地上的路原來很平坦可是有太多人走過這些路過的人們太累了　於是他們決定扔下一些東西
        </div>
        
        <div class="main-title-area">
            <div class="main-title-small">約會</div>
            <div class="main-title-large">山里的</div>
        </div>
        
        <div class="watermark-area">
            <span class="heart-icon">♥</span>
            <span>@Hiro豆豆老师</span>
            <span style="font-size: 14px; margin-left: 4px;">From 小红书</span>
        </div>
        
        <div class="illustration-zone">
            <div class="placeholder illustration-placeholder">
                [Illustration: Pastoral scene with people gathering, farming, cooking outdoors among fields and trees with mountain backdrop]
            </div>
        </div>
        
        <div class="footer-text-grid">
            <div class="footer-col">有的人扔下了悲傷<br>變成了路上的石頭</div>
            <div class="footer-col">有的人留下快樂<br>變成了山上的樹苗</div>
            <div class="footer-col">我把裝在箱子裡的思念<br>放在高高的山頂上<br>交成了黑夜的眼睛</div>
        </div>
    </div>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
