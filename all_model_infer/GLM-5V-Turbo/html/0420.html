<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习建议</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #ffffff;
            padding: 20px 40px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .header {
            text-align: center;
            position: relative;
            margin-bottom: 30px;
            padding-top: 10px;
        }
        
        .header-title {
            font-size: 48px;
            color: #5DADE2;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #AED6F1;
            display: inline-block;
            position: relative;
            z-index: 1;
        }
        
        .decoration-line {
            height: 12px;
            background: linear-gradient(to right, transparent, #F9E79F, #F9E79F, transparent);
            border-radius: 6px;
            margin-top: -10px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 0;
        }
        
        .star-decoration {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 40px;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            color: #F7DC6F;
            font-size: 16px;
        }
        
        .star.left { left: 25%; top: 5px; transform: rotate(-15deg); }
        .star.right { right: 25%; top: 5px; transform: rotate(15deg); }
        .star.top-left { left: 35%; top: 0; font-size: 14px; opacity: 0.7; }
        .star.top-right { right: 30%; top: 0; font-size: 18px; opacity: 0.8; }
        
        .section {
            margin-bottom: 35px;
            position: relative;
        }
        
        .section-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
        }
        
        .section-number {
            font-size: 24px;
            color: #AF7AC5;
            font-weight: normal;
            margin-right: 15px;
            min-width: 40px;
        }
        
        .section-title {
            font-size: 22px;
            color: #AF7AC5;
            font-weight: normal;
        }
        
        .content-text {
            font-size: 19px;
            color: #2C3E50;
            line-height: 1.8;
            margin-bottom: 10px;
            text-align: justify;
        }
        
        .highlight-yellow {
            background-color: #FFF59D;
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        .text-red {
            color: #E74C3C;
            font-weight: 500;
        }
        
        .attribution {
            text-align: right;
            font-size: 17px;
            color: #555;
            margin-top: 8px;
            padding-right: 10px;
        }
        
        .image-container {
            float: right;
            margin-left: 20px;
            margin-bottom: 10px;
            clear: both;
        }
        
        .placeholder-image {
            width: 70px;
            height: 100px;
            background-color: #f0f0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #999;
            border: 1px dashed #ccc;
            overflow: hidden;
        }
        
        .placeholder-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="header">
        <div class="star-decoration">
            <span class="star top-left">✦</span>
            <span class="star left">★</span>
            <span class="star right">★</span>
            <span class="star top-right">✦</span>
        </div>
        <h1 class="header-title">学习建议</h1>
        <div class="decoration-line"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">09</span>
            <span class="section-title">「教材远比练习册重要」</span>
        </div>
        <div class="content-text">
            教材远比练习册重要。
        </div>
        <div class="content-text">
            教材就是我们做题之前所要构建的一个框架，<span class="highlight-yellow">先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。</span>
        </div>
        <div class="attribution">
            ——陈若峰(被北京大学物理学院录取)
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">10</span>
            <span class="section-title">「有关数学与英语的学习方法」</span>
        </div>
        <div style="position: relative;">
            <div class="image-container">
                <div class="placeholder-image">
                    [Image: 卡通人物举横幅]
                </div>
            </div>
            <div class="content-text">
                数学压轴题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。
            </div>
            <div class="content-text">
                我要保证的，<span class="text-red">不是做出难题，而是做到容易题不丢分，难题多得分。</span>最后，我数学只有压轴题扣了分。
            </div>
        </div>
    </div>
</body>
</html>
