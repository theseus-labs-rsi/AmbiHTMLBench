<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>市川團十郎の石橋獅子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .document-container {
            background-color: white;
            width: 800px;
            height: 1100px;
            border: 3px solid #2e7d32;
            padding: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }
        
        /* Left margin text */
        .left-margin {
            position: absolute;
            left: -25px;
            top: 100px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 12px;
            color: #2e7d32;
            letter-spacing: 2px;
            line-height: 1.4;
        }
        
        /* Right margin text */
        .right-margin {
            position: absolute;
            right: -30px;
            top: 80px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 14px;
            color: #2e7d32;
            letter-spacing: 3px;
            line-height: 1.5;
        }
        
        .issue-number-left {
            position: absolute;
            left: -30px;
            bottom: 50px;
            writing-mode: vertical-rl;
            font-size: 16px;
            color: #2e7d32;
            letter-spacing: 2px;
        }
        
        /* Main title area */
        .title-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 60px;
            position: relative;
        }
        
        .main-title {
            display: flex;
            align-items: baseline;
            gap: 20px;
            color: #2e7d32;
        }
        
        .title-char {
            font-size: 90px;
            font-weight: bold;
            line-height: 1;
            position: relative;
        }
        
        .title-char.large {
            font-size: 95px;
        }
        
        .furigana {
            position: absolute;
            font-size: 14px;
            color: #c62828;
            font-weight: normal;
        }
        
        .title-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .subtitle-row {
            display: flex;
            gap: 15px;
        }
        
        .divider-line {
            width: 500px;
            height: 8px;
            border-bottom: 3px solid #2e7d32;
            border-style: dashed;
            margin: 20px auto;
            opacity: 0.6;
        }
        
        /* Advertisement section */
        .ad-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: auto;
            padding: 0 40px;
            position: relative;
        }
        
        .ad-header {
            writing-mode: vertical-rl;
            font-size: 42px;
            color: #d32f2f;
            font-weight: bold;
            letter-spacing: 8px;
            line-height: 1.2;
        }
        
        .ad-divider {
            width: 2px;
            height: 280px;
            background-color: #d32f2f;
            margin: 0 40px;
        }
        
        .ad-text-container {
            display: flex;
            gap: 30px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        
        .ad-column {
            font-size: 26px;
            color: #d32f2f;
            line-height: 1.8;
            letter-spacing: 4px;
            font-weight: 500;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }
        
        .footer-google {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .footer-cornell {
            font-size: 12px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="document-container">
        <!-- Left Margin Text -->
        <div class="left-margin">
            （明治三十六年六月十七日第三種郵便物認可）
        </div>
        
        <!-- Issue Number -->
        <div class="issue-number-left">
            （五二二）
        </div>
        
        <!-- Right Margin Text -->
        <div class="right-margin">
            女學雜誌第五百二十二號<br>
            （明治卅六年十月十日發行）（時價一錢五厘）
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <div class="title-area">
                <div class="main-title">
                    <div class="title-group">
                        <div class="title-char" style="position: relative;">
                            獅
                            <span class="furigana" style="top: 10px; right: -20px;">ライ</span>
                        </div>
                        <div class="title-char" style="position: relative; margin-top: 10px;">
                            子
                            <span class="furigana" style="top: 10px; right: -20px;">オン</span>
                        </div>
                    </div>
                    
                    <div class="title-group">
                        <div class="title-char large">石</div>
                        <div class="title-char large" style="position: relative; margin-top: 10px;">
                            橋
                            <span class="furigana" style="top: 10px; right: -20px;">はし</span>
                        </div>
                    </div>
                    
                    <div class="title-group">
                        <div class="title-char large">十</div>
                        <div class="title-char large" style="margin-top: 10px;">郎</div>
                        <div class="title-char large" style="margin-top: 10px; position: relative;">
                            の
                            <span class="furigana" style="top: 5px; right: -15px;">しゃく</span>
                        </div>
                    </div>
                    
                    <div class="title-group">
                        <div class="title-char large">市</div>
                        <div class="title-char large" style="margin-top: 10px;">川</div>
                        <div class="title-char large" style="margin-top: 10px;">團</div>
                    </div>
                </div>
            </div>
            
            <div class="divider-line"></div>
            
            <!-- Advertisement Section -->
            <div class="ad-section">
                <div class="ad-header">ライオン齒磨</div>
                
                <div class="ad-divider"></div>
                
                <div class="ad-text-container">
                    <div class="ad-column">
                        花にたはぶれ、枝に伏しゝろぶ、<br>
                        けにみ上なき獅子王のいきほひ<br>
                        ひ、なびかぬ草木もなき時なれ<br>
                        や。萬歲千秋と舞ひをさめ、萬<br>
                        歲千秋と舞ひをさめ 獅子の座<br>
                        にこそなほりけれ。
                    </div>
                </div>
                
                <div class="ad-divider"></div>
                
                <div class="ad-header">ライオン齒磨</div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-google">Digitized by Google</div>
            <div class="footer-cornell">Original from<br>CORNELL UNIVERSITY</div>
        </div>
    </div>
</body>
</html>
