<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江雪 - 柳宗元</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "SimSun", "Songti SC", "STSong", serif;
            background: linear-gradient(180deg, #fef5f5 0%, #f5f7ff 50%, #ede7f6 100%);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 40px 30px;
        }
        
        /* Decorative Mountains */
        .mountain-bg-left {
            position: absolute;
            left: -80px;
            bottom: 180px;
            width: 280px;
            height: 220px;
            background: linear-gradient(135deg, #b39ddb 0%, #5c6bc0 100%);
            clip-path: polygon(0% 100%, 45% 15%, 90% 85%, 100% 100%);
            opacity: 0.35;
            z-index: 0;
        }
        
        .mountain-bg-right {
            position: absolute;
            right: -60px;
            bottom: 170px;
            width: 300px;
            height: 200px;
            background: linear-gradient(135deg, #ce93d8 0%, #7e57c2 100%);
            clip-path: polygon(10% 100%, 55% 10%, 100% 90%, 100% 100%);
            opacity: 0.3;
            z-index: 0;
        }
        
        .water-reflection {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, rgba(179, 157, 219, 0.15) 100%);
            z-index: 0;
        }
        
        /* Header Section */
        .header {
            text-align: center;
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }
        
        .title-pinyin {
            font-size: 17px;
            color: #555;
            letter-spacing: 3px;
            margin-bottom: 8px;
            font-family: Arial, sans-serif;
        }
        
        .main-title {
            font-size: 52px;
            color: #1a1a1a;
            letter-spacing: 12px;
            font-weight: 400;
            margin: 10px 0;
            line-height: 1.2;
        }
        
        .author-pinyin {
            font-size: 15px;
            color: #666;
            margin-top: 12px;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
        }
        
        .author-name {
            font-size: 20px;
            color: #333;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        /* Poem Content */
        .poem-body {
            text-align: center;
            position: relative;
            z-index: 1;
            margin: 50px 0;
        }
        
        .verse-line {
            margin: 22px 0;
            line-height: 1.6;
        }
        
        .verse-pinyin {
            font-size: 16px;
            color: #555;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
            font-family: Arial, sans-serif;
        }
        
        .verse-chinese {
            font-size: 34px;
            color: #000;
            letter-spacing: 5px;
            font-weight: 500;
        }
        
        /* Translation Section */
        .translation-block {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-top: 50px;
            position: relative;
            z-index: 1;
        }
        
        .label-box {
            background-color: #ef5350;
            color: white;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 19px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.4;
        }
        
        .translation-content {
            font-size: 21px;
            line-height: 1.65;
            color: #222;
            text-align: justify;
            letter-spacing: 1px;
        }
        
        /* Illustration Placeholder */
        .illustration-area {
            position: absolute;
            bottom: 25px;
            right: 30px;
            width: 240px;
            height: 130px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 1px solid rgba(206, 147, 216, 0.3);
        }
        
        .placeholder-text {
            font-size: 13px;
            color: #888;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Decorative Background Elements -->
        <div class="mountain-bg-left"></div>
        <div class="mountain-bg-right"></div>
        <div class="water-reflection"></div>
        
        <!-- Title Section -->
        <div class="header">
            <div class="title-pinyin">jiāng xuě</div>
            <h1 class="main-title">江 雪</h1>
            <div class="author-pinyin">táng liǔ zōng yuán</div>
            <div class="author-name">[唐] 柳宗元</div>
        </div>
        
        <!-- Poem Lines -->
        <div class="poem-body">
            <div class="verse-line">
                <div class="verse-pinyin">qiān shān niǎo fēi jué</div>
                <div class="verse-chinese">千山鸟飞绝，</div>
            </div>
            
            <div class="verse-line">
                <div class="verse-pinyin">wàn jìng rén zōng mì</div>
                <div class="verse-chinese">万径人踪灭。</div>
            </div>
            
            <div class="verse-line">
                <div class="verse-pinyin">gū zhōu suō lì wēng</div>
                <div class="verse-chinese">孤舟蓑笠翁，</div>
            </div>
            
            <div class="verse-line">
                <div class="verse-pinyin">dú diào hán jiāng xuě</div>
                <div class="verse-chinese">独钓寒江雪。</div>
            </div>
        </div>
        
        <!-- Translation Section -->
        <div class="translation-block">
            <div class="label-box">译文:</div>
            <div class="translation-content">
                群山之间，没有一只鸟儿飞过。<br>
                纵横的小路上，见不到行人的踪迹。<br>
                只有一位身披蓑衣、头戴笠帽<br>
                的渔翁，架着小船，冒着风雪，<br>
                在寒冷的江上独自垂钓。
            </div>
        </div>
        
        <!-- Illustration Placeholder -->
        <div class="illustration-area placeholder">
            <div class="placeholder-text">[Illustration: Fisherman<br>fishing alone in snow]</div>
        </div>
    </div>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)'], ['$$', '$$'], ['\\[', '\\]']], 
                displayMath: []
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</body>
</html>
