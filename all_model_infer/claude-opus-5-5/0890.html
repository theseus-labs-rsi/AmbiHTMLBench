<style>
body{margin:0;background:#888;}

.logo .cn{font-size:62px;color:#d0121b;font-family:"STXingkai","KaiTi",cursive;font-weight:bold;letter-spacing:4px;}
.logo .en{font-size:14px;color:#c0161f;letter-spacing:3px;margin-top:2px;}

.tag{font-size:30px;font-weight:bold;text-align:center;padding:6px 0;border-bottom:2px solid #333;}

<div class="page">
<div class="header">
<div class="logo"><div class="cn">人民日报</div><div class="en">RENMIN RIBAO</div></div>

<div class="tag top">金句 | 摘抄</div>
<div class="tag">坚持奋斗主题</div>
</div>
</div>
<h1>夜色难免黑凉<br>前行必有曙光</h1>
<div class="label">举例:</div>
<div class="text">夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，<br>只要勇敢向前必定成功!</div>
<div class="s2">
<h1 style="margin-top:30px;">道固远，笃行可至<br>事虽巨，坚为必成</h1>
<div class="label" style="margin-top:28px;">举例:</div>
<div class="text">道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。</div>
</div>
</div>
