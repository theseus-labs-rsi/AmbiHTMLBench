  <p class="s1">1、<span class="hl">你开始炫耀自己，往往都是灾难的开始。</span><br>就像老子在《道德经》里写到：“光而不耀，<br>静水流深。”意思就是，无论身处什么位置，<br>什么环境，嘴上不逞强、不炫耀、不狂妄才能<br>兜住自己的福气。</p>
  <p class="s2">2、一个冷知识：<span class="hl">屏蔽力是一个人最顶级<br>的能力</span>，任何消耗你的人和事，多看一眼<br>都是你的不对。</p>
  <p class="s3">3、大学时辅导员说了一句受益一生的<br>话：“<span class="hl">你不用变得很外向，内向挺好的</span>，<br>但需要你发言的时候，一定要勇敢。”正<br>所谓：君子可内敛不可懦弱，面不公可起<br>而论之。</p>
