<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT快捷键</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body { margin:0; background:#f2a5b8; font-family:"Arial","Microsoft YaHei",sans-serif; }
.page { position:relative; width:540px; height:720px; margin:0 auto; background:#f4a3b6; }
.title-wrap { position:absolute; left:125px; top:18px; width:290px; height:82px; }
.title { position:absolute; left:10px; top:12px; width:268px; height:62px; background:#fff; border:2px solid #222; box-shadow:4px 4px 0 #c9a3dc; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:bold; color:#111; }
.ear { position:absolute; top:0; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:16px solid #fff; }
.card { position:absolute; left:44px; top:85px; width:452px; height:602px; background:#fff; }
.row { position:absolute; left:16px; font-weight:bold; font-size:20px; color:#111; display:flex; }
.key { width:170px; }
.desc { font-size:17px; }
</style>
</head>
<body>
<div class="page">
<div class="card">
  <div class="row" style="top:32px"><span class="key">B</span><span class="desc" style="margin-left:2px">黑屏(在演示时)</span></div>
  <div class="row" style="top:72px"><span class="key">W</span><span class="desc" style="margin-left:2px">切换至白屏/从黑白屏恢复放映</span></div>
  <div class="row" style="top:111px"><span class="key">F4</span><span class="desc" style="margin-left:2px">重复上一步操作</span></div>
  <div class="row" style="top:151px"><span class="key">Ctrl+D</span><span class="desc" style="margin-left:2px">快速复制选中对象</span></div>
  <div class="row" style="top:190px"><span class="key">Ctrl+G</span><span class="desc" style="margin-left:8px">组合对象</span></div>
  <div class="row" style="top:230px"><span class="key">Ctrl+ Shift+ G</span><span class="desc" style="margin-left:6px">取消组合</span></div>
  <div class="row" style="top:269px"><span class="key">Ctrl+Alt+V</span><span class="desc" style="margin-left:6px">打开选择性粘贴窗口</span></div>
  <div class="row" style="top:309px"><span class="key">Ctrl+单击</span><span class="desc" style="margin-left:8px">选择多个对象</span></div>
  <div class="row" style="top:348px"><span class="key">Shift+鼠标</span><span class="desc" style="margin-left:10px">拖动等比例缩放图片</span></div>
  <div class="row" style="top:388px"><span class="key">Shift+ F5</span><span class="desc" style="margin-left:10px">从当前页开始放映</span></div>
  <div class="row" style="top:427px"><span class="key">Ctrl+ Shift+C</span><span class="desc" style="margin-left:10px">复制格式</span></div>
  <div class="row" style="top:467px"><span class="key">Ctrl+ Shift+V</span><span class="desc" style="margin-left:10px">粘贴格式</span></div>
  <div class="row" style="top:506px"><span class="key">Ctrl+ Shift+ &lt;</span><span class="desc" style="margin-left:8px">快速缩小字号</span></div>
  <div class="row" style="top:546px"><span class="key">Ctrl+ Shift+&gt;</span><span class="desc" style="margin-left:8px">快速增大字号</span></div>
</div>
<div class="title-wrap">
  <div class="ear" style="left:58px"></div>
  <div class="ear" style="left:210px"></div>
  <div class="title">✅PPT快捷键</div>
</div>
</div>
</body>
</html>
