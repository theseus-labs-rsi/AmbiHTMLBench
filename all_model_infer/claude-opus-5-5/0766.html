<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#eee;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
.page{position:relative;width:540px;height:722px;margin:0 auto;background:#fafafa;
background-image:linear-gradient(#e6e6e6 1px,transparent 1px),linear-gradient(90deg,#e6e6e6 1px,transparent 1px);background-size:18px 18px;overflow:hidden;}
h1{position:absolute;top:12px;left:0;width:100%;text-align:center;margin:0;font-size:46px;font-weight:900;}
h1 .blue{color:#1a3a9c;}
.day{position:absolute;top:96px;left:38px;width:124px;height:42px;background:#a8e6c0;font-size:30px;font-weight:bold;text-align:center;line-height:42px;}
.stop{position:absolute;font-size:26px;font-weight:bold;text-align:center;width:200px;left:0;}
.arrow{position:absolute;left:89px;width:22px;height:40px;}
.arrow::before{content:"";position:absolute;left:5px;top:0;width:12px;height:22px;background:#f7b500;border:1px solid #c58a00;border-bottom:none;}
.arrow::after{content:"";position:absolute;left:0;top:22px;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #f7b500;}
.trans{position:absolute;left:30px;width:160px;font-size:19px;display:flex;justify-content:space-between;}
.trans span{background:#fbe0de;padding:1px 4px;}
.box{position:absolute;left:216px;width:300px;border:2px solid #9b2a2a;background:#fff;box-shadow:3px 3px 0 #9b2a2a;padding:6px 8px;font-size:16px;line-height:26px;}
.box b{color:#1a3a9c;font-weight:normal;}
</style>
</head>
<body>
<div class="page">
<h1><span class="blue">第三天</span>路线规划</h1>
<div class="day">第三天</div>
<div class="arrow" style="top:152px"></div>
<div class="stop" style="top:214px">磁器口</div>
<div class="trans" style="top:266px"><span>1号线</span><span>30分钟</span></div>
<div class="arrow" style="top:266px"></div>
<div class="stop" style="top:330px">罗中立美术馆</div>
<div class="trans" style="top:382px"><span>1号线</span><span>80分钟</span></div>
<div class="arrow" style="top:382px"></div>
<div class="stop" style="top:446px">山城步道</div>
<div class="trans" style="top:496px"><span>公交</span><span>32分钟</span></div>
<div class="arrow" style="top:496px"></div>
<div class="stop" style="top:560px">观音桥</div>
<div class="trans" style="top:614px"><span>步行</span><span>15分钟</span></div>
<div class="arrow" style="top:614px"></div>
<div class="stop" style="top:676px">九街</div>

<div class="box" style="top:118px"><b>磁器口（免费）</b>：汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌</div>
<div class="box" style="top:244px"><b>罗中立美术馆（免费）</b>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服</div>
<div class="box" style="top:372px"><b>山城步道（免费）</b>：建在悬崖边的临江步道，汇聚老重庆特色步道</div>
<div class="box" style="top:510px"><b>观音桥（免费）</b>：超大商圈，还有很多地道重庆小吃</div>
<div class="box" style="top:626px"><b>九街（免费）</b>：酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有</div>
</div>
</body>
</html>
