<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat Chat Screenshot</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']]}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#ededed;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
.chat{width:540px;margin:0 auto;padding:4px 0;background:#ededed;}
.row{display:flex;align-items:flex-start;margin:0 0 20px 0;}
.row.left{padding-left:32px;}
.row.right{justify-content:flex-end;padding-right:32px;}
.avatar{width:52px;height:52px;flex:0 0 52px;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;}
.placeholder{border-radius:4px;background:linear-gradient(#7a9cc0,#3f5f80);}
.avatar.me{background:linear-gradient(#c09060,#6a4a30);}
.bubble{background:#fff;border-radius:6px;padding:12px 14px;font-size:21px;line-height:32px;color:#111;max-width:300px;margin-left:14px;}
.bubble.green{background:#95ec69;margin-left:0;margin-right:14px;}
.num{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:#3b7dd8;color:#fff;font-size:16px;border-radius:3px;margin-right:6px;vertical-align:2px;}
</style>
</head>
<body>
<div class="chat">
<div class="row left">
<div class="avatar placeholder">[Avatar]</div>
<div class="bubble"><span class="num">6</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。</div>
</div>
<div class="row left">
<div class="avatar placeholder">[Avatar]</div>
<div class="bubble"><span class="num">7</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰</div>
</div>
<div class="row left">
<div class="avatar placeholder">[Avatar]</div>
<div class="bubble"><span class="num">8</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。</div>
</div>
<div class="row left">
<div class="avatar placeholder">[Avatar]</div>
<div class="bubble">你重新写吧</div>
</div>
<div class="row right">
<div class="bubble green">好的，谢谢老师</div>
<div class="avatar placeholder me">[Avatar]</div>
</div>
</div>
</body>
</html>
