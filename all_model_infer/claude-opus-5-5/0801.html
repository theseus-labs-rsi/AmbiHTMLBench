<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loneliness Quote</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body { margin: 0; background: #1e1830; }
  .page {
    width: 540px; height: 717px; margin: 0 auto;
    background: #2d2148; position: relative; overflow: hidden;
    font-family: "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
  }
  .placeholder {
    position: absolute; left: 190px; top: 130px; width: 160px; height: 160px;
    display: flex; align-items: center; justify-content: center;
    color: #c9a96a; font-size: 11px; text-align: center;
    border: 1px dashed rgba(201,169,106,0.5);
  }
  .en {
    position: absolute; top: 330px; left: 0; width: 540px;
    text-align: center; color: #d4c9dc; font-size: 13.5px; line-height: 21px;
  }
  .star { position: absolute; top: 326px; color: #c9a96a; font-size: 24px; }
  .star.l { left: 42px; } .star.r { right: 36px; }
  .zh {
    position: absolute; top: 398px; left: 0; width: 540px;
    color: #c9a96a; font-family: "Songti SC", "SimSun", serif;
    font-weight: bold; font-size: 21px; line-height: 30px; letter-spacing: 1px;
  }
  .zh div { white-space: nowrap; }
</style>
</head>
<body>
<div class="page">
  <div class="placeholder">[Emblem: gold diamond frame with half-sun and female symbol ♀, centered]</div>
  <span class="star l">✦</span><span class="star r">✦</span>
  <div class="en">
    I think the so-called loneliness refers to the person you are facing,<br>
    whose emotions are not on the same frequency as your own.
  </div>
  <div class="zh">
    <div style="padding-left:165px;">“ &nbsp;我想所谓孤独，</div>
    <div style="padding-left:162px;">就是你面对的那个人，</div>
    <div style="padding-left:137px;">他的情绪和你自己的情绪，</div>
    <div style="padding-left:187px;">不在同一个频率。”</div>
  </div>
</div>
