<div class="content">
<p>以上是我最近在读的一本书，作家<span class="link">刘继荣</span><br>《坐在路边鼓掌的人》里面讲的小故事。</p>
<p><span class="hl">天下有多少雄心勃勃的父母，奢望自己的孩</span><br><span class="hl">子既能做顶天立地的栋梁，又能开繁花结硕</span><br><span class="hl">果。我们的欲望有多深，孩子就有多累。</span></p>
<p>如果孩子能自己找到出路，快乐与成就兼<br>得，如果能平庸而幸福地过一生，父母又何<br>必强求。</p>
<p>如果他们健康、快乐，如果那是他们想要的<br>生活，我们的孩子，又何妨做一个普通人。</p>
