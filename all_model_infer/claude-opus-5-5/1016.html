.w{text-decoration:underline wavy #d9534f;text-underline-offset:4px;}

<div class="page">
<h1>住宿<span class="u">建议</span></h1>
<h2>[选酒店关注点]</h2>
<p><b>[<span class="w">沙滩</span>]</b>：亲子家庭出行游，<span class="u">对沙滩的质量</span>和海水的选择上要干净、清澈，<span class="u">沙子细软不扎脚</span>的。有私人海滩更佳</p>
<p><b>[<span class="w">酒店设施</span>]</b>：针对酒店的洗护<span class="u">有没有提供宝宝</span>专用，以及宝宝专用的洗漱台和马桶等等，以及<span class="u">有没有婴儿床、床围</span>等床上用品提供</p>
<p><b>[<span class="w">房间</span>]</b>：房间主题最好有小朋友喜欢的主题，<span class="u">比如太空主题</span>的房间或者星空主题的房间；以及房间有没有提供儿童帐篷、滑梯等玩乐设施。房型<span class="u">面积最好大</span>一些，<span class="u">有足够的空间</span>给小朋友跑跳玩乐</p>
<p><b>[<span class="w">儿童玩乐设施</span>]</b>：看酒店儿童<span class="u">玩乐设施室内还是</span>室外.设施是不是<span class="u">每日一消毒</span>，看空间宽不宽敞。有没有家长休息区。有没有<span class="u">托管服务</span>，托管时间，托管玩的项目等具体小朋友玩乐细节</p>
</div>
</body>
