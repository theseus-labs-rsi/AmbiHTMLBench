    &emsp;&emsp;《易经》中说：“小财<br>
    靠勤，大财靠德，德不厚<br>
    ，无以载物。”靠出卖时<br>
    间和劳动力 赚钱的人，<br>
    只能发点小财。一个人每<br>
    天，时间有限，精力有限<br>
    ，分身乏术。
