<html lang="zh">
<head>

<title>三大核心参数解读</title>

<style>
body{margin:0;background:#ddd;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
.page{position:relative;width:540px;height:720px;margin:0 auto;background:#fff;overflow:hidden;}
.holes{position:absolute;top:12px;left:40px;right:20px;display:flex;justify-content:space-between;}
.hole{width:22px;height:22px;border-radius:50%;background:#e6e6e6;box-shadow:inset 1px 1px 3px #999;}
.tag{position:absolute;left:0;top:72px;width:42px;height:108px;background:linear-gradient(160deg,#c33,#334,#d55);border-radius:0 6px 6px 0;color:#fff;font-weight:bold;font-size:18px;writing-mode:vertical-rl;text-align:center;line-height:42px;}
h1{position:absolute;top:58px;left:0;right:0;text-align:center;margin:0;font-size:36px;font-weight:normal;letter-spacing:2px;}
.sub{position:absolute;top:122px;left:0;right:0;text-align:center;font-size:14px;color:#333;}
.item{position:absolute;left:36px;display:flex;}
.icon{width:62px;height:62px;flex:none;margin-right:20px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #333;border-radius:6px;}
.text{width:400px;}
.text h2{margin:0 0 4px;font-size:20px;font-weight:normal;}
.text p{margin:0;font-size:15px;line-height:24px;letter-spacing:0.5px;}

<body>
<div class="page">
<div class="holes"><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div></div>
<div class="tag">第二步</div>
<h1>三大核心参数解读</h1>
<div class="sub">内存/芯片/分辨率参数解读</div>

<div class="item" style="top:215px;">
<div class="icon placeholder">[Icon: SD]</div>
<div class="text"><h2>1.看内存</h2><p>内存越大速度越快，小于8GB不建议购买。(画圈：GB≠Gb,大GB是小Gb的8倍，尽量选择大GB)</p></div>
</div>

<div class="item" style="top:378px;">
<div class="icon placeholder">CPU</div>
<div class="text"><h2>2.看芯片</h2><p>主流芯片A73和A53。追求性能玩游戏选A73，看看电视想省电选A53。</p></div>
</div>

<div class="item" style="top:540px;">
<div class="icon placeholder" style="background:#333;color:#fff;width:46px;font-size:14px;">4K<br>UHD</div>
<div class="text"><h2>3.看分辨率</h2><p>分辨率越高越清晰。（目前电视基本都是超高清4K也就是3840×2160的分辨率）</p></div>
</div>
</div>
</body>
</html>
