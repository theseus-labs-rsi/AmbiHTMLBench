<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>我写的 vs 人民日报写的</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#ccc;font-family:"SimSun","Songti SC",serif;}
.page{width:540px;height:720px;margin:0 auto;position:relative;overflow:hidden;}

.bottom{background:#45425f;height:425px;position:relative;color:#f3e6c4;}
.h1{position:absolute;left:58px;top:78px;font-size:30px;font-weight:bold;color:#3d3a52;}
.circle{position:absolute;left:204px;top:62px;width:42px;height:42px;border:12px solid #b5212a;border-radius:50%;}
.t1{position:absolute;left:58px;top:160px;font-size:19px;font-weight:bold;color:#3d3a52;line-height:40px;}
.photo{position:absolute;right:0;top:75px;width:170px;height:220px;}
.caption{position:absolute;right:6px;top:262px;font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 4px #000;font-family:sans-serif;}
.h2{position:absolute;left:58px;top:65px;font-size:30px;font-weight:bold;color:#f3e6c4;}
.check{position:absolute;left:295px;top:42px;width:80px;height:65px;}
.t2{position:absolute;left:58px;top:128px;width:430px;font-size:18.5px;font-weight:bold;line-height:38.5px;}

<body>
<div class="page">
<div class="top">
<div class="h1">我写的:</div>
<div class="circle"></div>
<div class="t1">我们民族的追梦史充满<br>艰辛。</div>
<div class="wm" style="left:150px;top:150px;">看版的美女纸</div>
<div class="photo placeholder" style="background:#8a6f5a;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;">[Photo: smiling child, right]</div>
<div class="caption">学习使我妈快乐</div>
</div>
<div class="bottom">
<div class="h2">人民日报写的:</div>
<div class="check placeholder" style="color:#6cc04a;font-size:60px;line-height:65px;">✔</div>
<div class="t2">我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。</div>
<div class="wm" style="left:190px;top:200px;">看版的美女纸</div>
<div class="src">——2013.4.1《筑就民族复兴的“中国梦”》</div>
</div>
</div>
