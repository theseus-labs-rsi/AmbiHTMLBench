<style>
body{margin:0;background:#ccc;font-family:"Songti SC","SimSun",serif;}
.page{width:540px;height:720px;margin:0 auto;background:#d6cbbd;position:relative;overflow:hidden;}
.header{height:170px;background:#f5ece6;position:relative;}
.logo{position:absolute;left:20px;top:28px;width:230px;}
.logo .cn{color:#d0101b;font-size:58px;font-style:italic;font-weight:bold;letter-spacing:4px;font-family:"STXingkai","KaiTi",cursive;}
.logo .en{color:#d0101b;font-size:13px;letter-spacing:3px;margin-left:58px;margin-top:4px;}
.right{position:absolute;right:20px;top:30px;width:215px;text-align:center;}
.r1{font-size:28px;font-weight:bold;border-bottom:2px solid #222;padding-bottom:6px;}
.r1 span{border-left:2px solid #222;margin:0 12px;}
.r2{font-size:40px;font-weight:bold;border-bottom:3px solid #222;padding:8px 0 6px;font-family:"KaiTi",serif;}
.title1{text-align:center;font-size:38px;font-weight:bold;line-height:50px;margin-top:28px;color:#222;}
.label{font-size:15px;color:#333;margin-left:24px;}
.text{font-size:16px;line-height:24px;color:#222;margin:12px 24px 0 24px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}

<body>
<div class="page">
<div class="header">
<div class="logo"><div class="cn">人民日報</div><div class="en">RENMIN RIBAO</div></div>
<div class="right"><div class="r1">金句<span></span>摘抄</div><div class="r2">心态主题</div></div>
</div>
<div class="title1">且行且忘且随风,<br>且行且看且从容。</div>
<div class="label">释义:</div>
<div class="text">意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们]遇到非常不平静的时候，只要能有-一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。</div>
<div class="title2">我将玫瑰藏于身后风起花落,<br>从此鲜花赠自己,<br>纵马踏花向自由。</div>
<div class="label" style="margin-left:36px;margin-top:2px;">释义:</div>
<div class="text" style="margin-top:22px;margin-left:36px;">我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。</div>
</div>
