    <p class="indent">当偏见裹挟认知，无视事实，操纵舆论的事发生，我们该如何对待？</p>
    <p class="indent">如果我不害怕人微言轻，也许你就不会经历人言可畏，用心辨别真相，用爱和真诚可以消融流言。正如名侦探所言，“千军万马踩过的时候，小小的一脚都有可能是致命伤，我们谁都不想成为这样的人，我们也不要成为加害的人”，遭遇不公时，隐忍不是唯一道路，我们可以向不公平呐喊，只有大家都勇敢起来，加害者才会觉得我们没有那么好欺负。</p>
    <div class="red red1">愿你笔尖下皆自由之风，一笔一画，</div>
