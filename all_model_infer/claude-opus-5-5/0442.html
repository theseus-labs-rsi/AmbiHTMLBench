<div class="heading"><span class="check">&#10003;</span>他写「成长」，正是你所亲历</div>
<div class="quote">“我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”<br>——《病隙碎笔》</div>
<div class="heading h2"><span class="check">&#10003;</span>他写「磨难」，报之以歌</div>
<div class="quote">“大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》</div>
