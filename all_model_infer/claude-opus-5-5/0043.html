<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#ddd;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
.page{width:540px;height:720px;margin:0 auto;background:#fff;position:relative;overflow:hidden;}
.header{background:#ec6a12;height:135px;position:relative;border-radius:0 0 20px 20px;}
.copy{position:absolute;left:35px;top:18px;font-size:28px;color:#fff;font-weight:bold;}
.stars{position:absolute;left:40px;top:58px;color:#fff;font-size:12px;line-height:13px;}
.title{position:absolute;left:90px;top:30px;font-size:68px;font-weight:900;color:#111;letter-spacing:2px;}
.year{position:absolute;right:38px;top:20px;font-size:22px;font-weight:bold;color:#111;}
.logo{position:absolute;right:15px;top:110px;font-size:18px;font-weight:bold;color:#111;}
.intro{position:absolute;left:35px;top:150px;width:470px;font-size:11px;line-height:16px;color:#222;}
.card{position:absolute;left:26px;width:488px;border:2px solid #ec6a12;border-radius:22px;background:#fff;}
.card h2{margin:0;font-size:18px;font-weight:bold;color:#111;}
.card h2 span{color:#ec6a12;font-size:16px;}
.placeholder{display:flex;align-items:center;justify-content:center;font-size:11px;color:#333;}
.cap{font-size:10.5px;color:#777;line-height:15px;}
.footer{position:absolute;bottom:0;left:30px;right:30px;height:20px;background:#ec6a12;}
</style>
</head>
<body>
<div class="page">
<div class="header">
<div class="copy">©</div>
<div class="stars">✦<br>✦<br>✦<br>✦<br>✦</div>
<div class="title">对比色配色</div>
<div class="year">2023</div>
<div class="logo">瑞</div>
</div>
<div class="intro">对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。</div>

<div class="card" style="top:238px;height:192px;">
<h2 style="padding:16px 0 0 6px;">富有朝气的配色 <span>✦</span></h2>
<div class="placeholder" style="margin:4px 0 0 14px;width:444px;height:104px;background:linear-gradient(90deg,#0a9b4a 0 30%,#ffee00 30% 55%,#0a5ca8 55% 100%);">[Image: green / yellow / blue wavy color blocks]</div>
<div class="cap" style="padding:6px 0 0 4px;">以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。</div>
</div>

<div class="card" style="top:487px;height:190px;">
<h2 style="padding:10px 0 0 4px;">视觉冲击强烈的配色 <span>✦</span></h2>
<div class="placeholder" style="margin:4px 0 0 26px;width:444px;height:104px;background:linear-gradient(90deg,#8cc21f 0 30%,#000 30% 55%,#ff2a68 55% 100%);color:#fff;">[Image: lime / black / pink wavy color blocks]</div>
<div class="cap" style="padding:6px 0 0 4px;">黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，<br>视觉冲击强烈。</div>
</div>

<div class="footer"></div>
</div>
</body>
</html>
