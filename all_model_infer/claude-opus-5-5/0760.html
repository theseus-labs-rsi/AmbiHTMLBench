<div class="title">四、类比推理</div>

<div class="block">
<div class="h"><span class="num">1</span>语义关系</div>
①近反义词②比喻象征<br>
③谦词，敬词，语体色彩（褒义词，贬义词）
</div>

<div class="block">
<div class="h"><span class="num">2</span>逻辑关系</div>
①并列关系②矛盾关系（非此即彼）③反对关系（存在小三）
</div>

<div class="block h">👉二级辨析：同一范畴<span class="gap"></span>并列+对应考察</div>

<div class="block">
<div class="h"><span class="num">3</span>包容关系</div>
种属：①…是…　②特指<br>
③…不是…<br>
④主要/次要，必然/或然　 组成：零部件
</div>

<div class="block">
<div class="h"><span class="num">4</span>交叉关系：</div>
<div class="h">从不同角度描述同一事物，有交集，用有的是有的不是造句</div>
</div>

<div class="block">
<div class="h"><span class="num">5</span>对应关系</div>
1.材料<br>
2.工艺，二级辨析：物理化学变化，是否有新生物质生成<br>
3.功能：主要/次要<br>
4.属性：必然/或然<br>
5.时间顺序<br>
<span class="h">👉二级辨析：行为发出主体<span class="gap"></span>必要条件、因果</span>
</div>

<div class="block">
<div class="h"><span class="num">5</span>语法关系</div>
主谓/主宾/动宾
</div>
</div>
