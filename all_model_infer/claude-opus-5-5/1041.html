<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用暗示的积极力量养出优秀孩子</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body { margin:0; background:#fff; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
.page { width:552px; margin:0 auto; padding:30px 0 40px; }
.title { width:458px; margin:0 auto 0 48px; border:1px solid #6a7fb0; border-radius:8px; background:linear-gradient(#f4f6fb,#dfe5f2); text-align:center; font-size:27px; padding:6px 0; color:#111; }
.title .hl { color:#6b2a9a; }
.sub { margin:32px 0 26px 46px; font-size:19px; color:#222; }
.box { width:466px; margin-left:40px; background:#dde2f3; border-right:4px solid #8a8fa0; border-bottom:4px solid #8a8fa0; padding:6px 0 4px; }
.row { display:flex; align-items:center; height:36.4px; font-size:19px; padding-left:10px; }
.mark { width:26px; display:inline-block; text-align:center; margin-right:4px; }
.x { color:#c00; font-weight:bold; }
.c { color:#3a9a3a; }
.neg { color:#222; }
.pos { color:#6b2a9a; font-weight:bold; }
</style>
</head>
<body>
<div class="page">
<div class="title">用<span class="hl">暗示</span>的积极力量养出优秀孩子</div>
<div class="sub">学习上，让孩子体验一个个小成功</div>
<div class="box">
<div class="row"><span class="mark x">✖</span><span class="neg">你磨蹭半天了，没写几个字，再磨下去就别睡了</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">越早完成作业，休息的时间就越多！</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">这么简单的题都不会做？</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">这道题你觉得难，不太会是吗？</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">赶紧写作业，一点都不自觉</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">你很少忘记写作业的，如果需要帮助就告诉我。</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">你这孩子怎么这么犟呢，你要听话</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">你可以说“不”，但我想听听你的理由理解你。</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">你怎么这么烦人呢，就不能安静一会儿吗？</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">你自己先去玩一会，妈妈忙完就马上找你。</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">勇敢点，这有什么的啊？</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">我相信你行的，再试试看，我陪着你</span></div>
<div class="row"><span class="mark x">✖</span><span class="neg">快点走，再拖拖拉拉你就别出去了。</span></div>
<div class="row"><span class="mark c">✓</span><span class="pos">我们来比一比，看谁更快出门。</span></div>
</div>
</div>
</body>
</html>
