<div class="sec"><span class="num">09</span><span class="t">「 教材远比练习册重要 」</span></div>
<p style="margin-top:20px">教材远比练习册重要。<br>
教材就是我们做题之前所要构建的一个框架，<span class="hl">先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。</span></p>
<div class="sig">——陈哲峰<small>(被北京大学物理学院录取)</small></div>
<div class="sec" style="margin-top:55px"><span class="num">10</span><span class="t">「 有关数学与英语的学习方法 」</span></div>
<p style="margin-top:20px">数学压轴大题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。<br>
我要保证的，<span class="red">不是做出难题，而是做到容易题不丢分，难题多得分。</span>最后，我数学只有压轴题扣了分。</p>
