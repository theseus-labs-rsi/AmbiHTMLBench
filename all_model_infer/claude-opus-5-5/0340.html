<h1>计算思维二：分解思维</h1>
<div class="content">
<p>分解思维是指<span class="red">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）</span>。</p>
<p class="head">1、问题梳理</p>
<p>先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</p>
<p class="head">2、问题分解</p>
<p>将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</p>
<p class="head">3、整合方案</p>
<p>制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</p>
</div>
