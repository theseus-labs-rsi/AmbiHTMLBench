    <p class="indent">“胖胖,中午好!”丫丫一进屋就看见了胖胖,</p>
    <p>胖胖害羞地冲丫丫笑。“阿姨,胖胖是用微</p>
    <p>笑来和我打招呼的!”听到丫丫的话,</p>
    <p>大家都笑了起来。</p>
