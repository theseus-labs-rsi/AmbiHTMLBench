<p>△桂花露</p>
<p>〔功用〕开胃消食，宽胸化痰</p>
<p>〔药物〕桂花500克</p>
<p>〔制法〕于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</p>
<p class="gap">△荷花露</p>
<p>〔功用〕清暑凉营</p>
<p>〔药物〕白荷花500克</p>
<p>〔制法〕取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</p>
