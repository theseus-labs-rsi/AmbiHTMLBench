<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语c术语解释</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body {
  margin: 0;
  background: #fff;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: #111;
}
.page {
  width: 540px;
  padding: 4px 18px 10px 36px;
  box-sizing: border-box;
  font-size: 21px;
  line-height: 34.5px;
}
.term { font-weight: bold; margin: 0; }
.def { margin: 0; }
</style>
</head>
<body>
<div class="page">
<p class="term">审核：</p>
<p class="def">指进入语c群时，被群主审看人设、皮气等行为。</p>
<p class="term">新人：</p>
<p class="def">指初入某个圈子的人。</p>
<p class="term">纯白：</p>
<p class="def">完全不了解语c的人或刚接触语c。</p>
<p class="term">小白：</p>
<p class="def">指出入语c圈或对语c一无所知的人。</p>
<p class="term">小窗：</p>
<p class="def">指聊天会话的窗口（与QQ的私聊差不多）</p>
<p class="term">隔壁：</p>
<p class="def">指代另一个地方（隔壁群，隔壁平台）</p>
<p class="term">首页：</p>
<p class="def">在语c平台中，上皮发言互动的地方。</p>
<p class="term">水区：</p>
<p class="def">在语c平台中，皮下发言探讨问题或闲聊的地方。</p>
<p class="term">扩列：</p>
<p class="def">扩充列表，即加好友的意思。</p>
<p class="term">掌控：</p>
<p class="def">指开戏文字超过七百一段的人。</p>
<p class="term">字控：</p>
<p class="def">夸张手法，指一次开几个字为一段的人。</p>
<p class="term">句控：</p>
<p class="def">指开戏只开一行～三行为一段的人。</p>
</div>
</body>
</html>
