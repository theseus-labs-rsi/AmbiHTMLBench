<div class="vcol c2">国朝妻管严疑有私生子</div>
<div class="right">
<p class="indent">瞳孔地震！将王安石抬进孔庙的好女婿蔡卞近日疑似陷入私生子风波。蔡卞妻福国夫人王氏闻之震怒，欲除妾生子，因故生病。</p>
<p class="mid">本消息来自翰林医官院药方笔录：</p>
<p>《香术散》：治妊娠五个月已后。常胸腹间气刺满痛，或肠鸣，以至呕逆减食。此由喜怒忧虑过度、饮食失节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病。医官王师复处此方三服而愈，后用果验。</p>
