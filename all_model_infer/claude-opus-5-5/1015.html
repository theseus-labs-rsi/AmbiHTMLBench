<h2>二、建议、提案</h2>
<p>建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。</p>
<p class="red">格式：</p>
<p class="center">关于 xxxxx 的建议</p>
<p class="center">（“发文机关+关于+内容+文种”）</p>
<p><span class="u">各级领导(称谓要根据具体题目要求分析得出)：</span></p>
<p><span class="u" style="margin-left:40px">当前，…等问题比较突出(或做了什么工作)，为了</span><br><span class="u">做好…..工作，提出以下建议：</span><span class="blue u">(开头为背景分析，指出存在的主要问题和目的意义)</span></p>
<p class="indent"><span class="u">一、…..</span></p>
<p class="indent"><span class="u">二、…..</span></p>
<p class="indent"><span class="u">三、……</span><span class="blue u">(主体内容还原为对策题,提出解决问题的措施)</span></p>
<p class="right"><span class="u">发文机关</span></p>
<p class="right"><span class="u">xx 年 xx 月 xX 日</span></p>
</div>
