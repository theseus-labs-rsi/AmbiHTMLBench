<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Should Be Less Than 40 %</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body { margin: 0; padding: 0; }
  .slide {
    position: relative;
    width: 1024px;
    height: 576px;
    background: linear-gradient(to bottom, #5f7a68 0%, #4a6552 50%, #3a5242 100%);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .title {
    position: absolute;
    left: 66px; top: 26px;
    width: 912px; height: 63px;
    background: linear-gradient(to bottom, #2fb3d0, #1b8fae);
    color: #ffff00;
    font-weight: bold;
    font-size: 44px;
    line-height: 63px;
    padding-left: 10px;
    box-sizing: border-box;
    letter-spacing: 1px;
  }
  .panel {
    position: absolute;
    left: 120px; top: 164px;
    width: 733px; height: 380px;
    background: #ffffff;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    color: #2b35b8;
    font-weight: bold;
  }
  .panel .shade {
    position: absolute; left: 0; top: 0; width: 100%; height: 40px;
    background: linear-gradient(to bottom, #e8ecf0, #ffffff);
  }
  .formula {
    position: absolute; left: 220px; top: 68px;
    display: flex; align-items: center;
    font-size: 26px;
  }
  .frac { display: inline-flex; flex-direction: column; align-items: center; margin-left: 34px; }
  .frac .num { padding-bottom: 6px; }
  .frac .bar { width: 130px; border-top: 2px solid #2b35b8; }
  .frac .den { padding-top: 10px; }
  .lt { position: absolute; left: 530px; top: 100px; color: #e02020; font-size: 22px; }
  .defs { position: absolute; left: 110px; top: 202px; font-size: 26px; line-height: 53px; }
</style>
</head>
<body>
<div class="slide">
  <div class="title">PTA SHOULD BE LESS THAN 40 %</div>
  <div class="panel">
    <div class="shade"></div>
    <div class="formula">
      <span>PTA =</span>
      <span class="frac">
        <span class="num">(FT + AD)</span>
        <span class="bar"></span>
        <span class="den">CCT</span>
      </span>
    </div>
    <div class="lt">&lt; 40%</div>
    <div class="defs">
      FT = flap thickness<br>
      AD = ablation depth<br>
      CCT = central corneal thickness
    </div>
  </div>
</div>
</body>
</html>
