<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asgari Ücret - Emek Partisi Ankara İl Örgütü Poster</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body { margin: 0; background: #d6d4cc; font-family: "Montserrat", "Arial Black", Arial, sans-serif; }
  .poster { width: 860px; margin: 120px auto; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.2); }
  .top { background: #f7e33a; display: flex; justify-content: space-between; padding: 40px 40px 30px 60px; }
  .bullets { list-style: none; margin: 0; padding: 0; }
  .bullets li { position: relative; padding-left: 70px; font-size: 44px; font-weight: 700; color: #1d1d1b; line-height: 1.6; margin-bottom: 10px; }
  .bullets li::before { content: ""; position: absolute; left: 10px; top: 18px; width: 18px; height: 18px; border-radius: 50%; background: #c8202e; }
  .placeholder { border: 2px dashed #b55; display: flex; align-items: center; justify-content: center; text-align: center; color: #333; font-size: 14px; font-family: Arial, sans-serif; }
  .chart { width: 320px; height: 320px; border-radius: 50%; background: #f0a03a; }
  .middle { padding: 45px 50px 25px; color: #d0202e; font-size: 56px; font-weight: 900; line-height: 1.25; }
  .banner { background: #cc2229; color: #fff; text-align: center; font-size: 72px; font-weight: 900; padding: 30px 0; letter-spacing: 1px; }
  .footer { padding: 50px 40px 40px; }
  .org { display: flex; justify-content: center; align-items: center; gap: 30px; }
  .logo { width: 140px; height: 140px; border-radius: 50%; }
  .orgname { color: #cc2229; text-align: center; font-weight: 800; font-size: 34px; line-height: 1.3; }
  .orgname small { display: block; font-size: 20px; font-weight: 700; }
  .contacts { display: flex; justify-content: space-around; margin-top: 35px; color: #cc2229; font-size: 20px; font-family: Arial, sans-serif; }
  .contacts span.icon { display: inline-block; border: 3px solid #cc2229; border-radius: 6px; padding: 0 8px; margin-right: 8px; font-weight: 700; }
</style>
</head>
<body>
<div class="poster">
  <div class="top">
    <ul class="bullets">
      <li>Enflasyon<br>yükseliyor</li>
      <li>TL değer<br>kaybediyor</li>
      <li>Ücretler eriyor</li>
    </ul>
    <div class="placeholder chart">[Illustration: pencil drawing rising red arrow over coins, orange circle]</div>
  </div>
  <div class="middle">Vergiden muaf,<br>İnsanca yaşanacak</div>
  <div class="banner">ASGARİ ÜCRET!</div>
  <div class="footer">
    <div class="org">
      <div class="placeholder logo">[Logo: EMEP gear &amp; globe]</div>
      <div class="orgname">EMEK<br>PARTİSİ<small>Ankara İl Örgütü</small></div>
    </div>
    <div class="contacts">
      <div><span class="icon">f</span>/ankaraemep</div>
      <div><span class="icon">◎</span>@emepankara</div>
      <div><span class="icon">☏</span>0 (312) 232 41 97</div>
    </div>
  </div>
</div>
</body>
</html>
