<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句合集系列</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#ccc;font-family:"SimHei","Microsoft YaHei",sans-serif;}
.page{width:540px;height:714px;margin:0 auto;background:#d9c8a6;position:relative;overflow:hidden;}
.header{height:150px;background:#f7f5f0;position:relative;border-bottom:2px solid #8a7a5a;}
.logo{position:absolute;left:10px;top:10px;font-family:"STXingkai","KaiTi",serif;font-size:58px;color:#c0201c;font-weight:bold;letter-spacing:4px;}
.logo-sub{position:absolute;left:70px;top:118px;font-size:12px;letter-spacing:3px;color:#555;font-family:serif;}
.tags{position:absolute;right:8px;top:12px;font-size:20px;color:#111;border-bottom:1px solid #333;padding-bottom:6px;}
.series{position:absolute;right:30px;top:92px;font-size:22px;color:#111;border-bottom:1px solid #333;padding-bottom:4px;}
.content{padding:30px 20px 0 18px;}
.quote{font-size:31px;line-height:46px;color:#111;margin:0;}
.quote .l2{padding-left:55px;}
.label{font-size:13px;margin-top:12px;color:#222;}
.expl{font-size:13px;line-height:18px;color:#222;margin-bottom:18px;}
</style>
</head>
<body>
<div class="page">
<div class="header">
<div class="logo">人民日報</div>
<div class="logo-sub">RENMIN RIBAO</div>
<div class="tags">金句 | 素材 | 摘抄</div>
<div class="series">金句合集系列</div>
</div>
<div class="content">
<p class="quote">1、愿你千山暮雪海棠依旧,<br><span class="l2">不为岁月惊扰平添忧愁。</span></p>
<div class="label">释义:</div>
<div class="expl">希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝<br>与琐事而烦恼忧愁。</div>
<p class="quote">2、总有人间一两风,<br><span class="l2">填我十万八千梦。</span></p>
<div class="label">释义:</div>
<div class="expl">人间总有那么几处善良和美好的事情,满足你对世界的所有遐想,成<br>全你的理想。</div>
<p class="quote">3、日出有盼,日落有思,<br><span class="l2">平平安安,所遇皆甜。</span></p>
<div class="label">释义:</div>
<div class="expl">只要日出就会有盼头,只要有日落就会有思念,祈祷大家平平安安,<br>遇到的都是美好。</div>
</div>
</div>
</body>
