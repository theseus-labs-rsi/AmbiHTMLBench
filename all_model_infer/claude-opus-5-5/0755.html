<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐诗六首</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{margin:0;background:#f3d5b5;}
.page{width:540px;height:720px;margin:0 auto;background-color:#fff;
background-image:linear-gradient(#e6e6e6 1px,transparent 1px),linear-gradient(90deg,#e6e6e6 1px,transparent 1px);
background-size:18px 18px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:252px 236px 232px;
border:6px solid #f3d5b5;box-sizing:border-box;}
.cell{border-right:4px solid #f3d5b5;border-bottom:4px solid #f3d5b5;padding:8px 10px;box-sizing:border-box;font-family:"KaiTi","STKaiti","SimSun",serif;}
.cell:nth-child(2n){border-right:none;}
.cell:nth-child(n+5){border-bottom:none;}
h2{margin:6px 0 0;text-align:center;font-size:30px;font-weight:bold;font-family:"SimHei","Heiti SC",sans-serif;}
.author{text-align:right;font-size:14px;margin:4px 10px 8px 0;}
.poem{text-align:center;font-size:23px;line-height:34px;}
</style>
</head>
<body>
<div class="page">
<div class="cell"><h2>《登鹳雀楼》</h2><div class="author">（唐–王之涣）</div><div class="poem">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</div></div>
<div class="cell"><h2>《静夜思》</h2><div class="author">（唐–李白）</div><div class="poem">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</div></div>
<div class="cell"><h2>《古朗月行》</h2><div class="author">（唐–李白）</div><div class="poem">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</div></div>
<div class="cell"><h2>《寻隐者不遇》</h2><div class="author">（唐–贾岛）</div><div class="poem">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</div></div>
<div class="cell"><h2>《咏鹅》</h2><div class="author">（唐–骆宾王）</div><div class="poem">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</div></div>
<div class="cell"><h2>《草》</h2><div class="author">（唐–白居易）</div><div class="poem">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</div></div>
</div>
</body>
</html>
