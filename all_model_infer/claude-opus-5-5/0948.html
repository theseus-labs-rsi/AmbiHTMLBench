  <h1>1、会被无缘无故讨厌的原因有哪些?</h1>
  <div class="body">
    <p class="indent">“无缘无故的讨厌”有很多原因，比如:</p>
    <p>①长相凶狠的人让我们害怕(承认吧，我们都是外貌协会);</p>
    <p>②刻板印象让你对一个人产生先入为主的偏见:印象里重庆人火爆，上海人爱计较。于是你真去到重庆，并且正好遇到重庆人当街斗殴，你的大脑就会激活“重庆人火爆”的认知并加强;</p>
    <p class="green">③心理学上认为的:对一个人的好恶可能是“投射效应”在起作用。</p>
    <p>那么，“投射效应”到底是如何会让别人无缘无故讨厌你的呢?</p>
