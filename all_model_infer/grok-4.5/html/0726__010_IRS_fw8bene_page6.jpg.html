<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12pt;
            line-height: 1.4;
            margin: 40px auto;
            max-width: 800px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        h1, h2, h3 {
            font-size: 16pt;
            margin-top: 20px;
        }
        .placeholder {
            width: 100%;
            height: 300px;
            background: #f0f0f0;
            border: 1px dashed #999;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        .placeholder img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        [Figure: centered, full-width image or diagram]
    </div>

    <p>[illegible] text block or paragraph</p>

    <div class="placeholder">
        [Chart: positioned bottom-left or as indicated]
    </div>

    <p>[unreadable word/segment] [?] unclear character</p>
</body>
</html>
