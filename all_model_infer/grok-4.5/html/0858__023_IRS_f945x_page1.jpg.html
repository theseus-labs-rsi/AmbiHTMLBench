<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman&display=swap');
        body {
            font-family: 'Times New Roman', serif;
            margin: 40px auto;
            max-width: 850px;
            line-height: 1.4;
            font-size: 16px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 12px;
            text-align: left;
        }
        .placeholder {
            width: 100%;
            height: 180px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            text-align: center;
            padding: 10px;
        }
        .placeholder img {
            max-width: 100%;
            max-height: 160px;
        }
    </style>
</head>
<body>
    <h1>[Document Title Placeholder]</h1>
    <p>[illegible] [illegible] [illegible]</p>
    <p>[illegible] [illegible]</p>
    <div class="placeholder">[Chart: bottom-left]</div>
    <p>[illegible] [illegible] [illegible]</p>
    <p>[illegible] [illegible]</p>
    <div class="placeholder">[Photo / Diagram]</div>
    <p>[illegible] [illegible] [illegible]</p>
</body>
</html>
