<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文复习笔记</title>
<style>
    body {
        background-color: #dcd0e8;
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        background-color: #fff;
        width: 100%;
        max-width: 600px;
        padding: 40px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        position: relative;
        box-sizing: border-box;
    }
    .top-decoration {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
    }
    .top-decoration img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .content {
        margin-top: 80px; /* Space for the top decoration */
    }
    h2 {
        color: #4a148c;
        font-size: 24px;
        margin-top: 25px;
        margin-bottom: 15px;
        border-bottom: 2px solid #4a148c;
        display: inline-block;
        padding-bottom: 2px;
    }
    p {
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        margin: 10px 0;
    }
    ol {
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        margin: 10px 0;
        padding-left: 20px;
    }
    li {
        margin-bottom: 8px;
    }
    .bottom-decoration {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 120px;
        height: 120px;
    }
    .bottom-decoration img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    .watermark {
        position: absolute;
        right: 40px;
        top: 450px;
        font-size: 12px;
        color: #ccc;
        opacity: 0.6;
        pointer-events: none;
    }
</style>
</head>
<body>

<div class="container">
    <div class="top-decoration">
        <img src="https://via.placeholder.com/100x100?text=Book+Icon" alt="Book Icon Placeholder">
    </div>

    <div class="content">
        <h2>四，句式练习</h2>
        <p>仿写、修改病句、把字句变被字句、反问句变陈述句、陈述句变感叹句、缩句扩句等等</p>

        <h2>五，阅读理解</h2>
        <p>课内阅读理解：主要复习课文笔记、中心思想以及课后习题。</p>
        <p>课外阅读理解：主要是要掌握好答题技巧。</p>

        <h2>六，阅读训练</h2>
        <ol>
            <li>1，圈出题目里面的关键词。</li>
            <li>2，记住答案的宗旨就是答案都在原文里。</li>
            <li>3，掌握表达方式，修辞手法的运用，解释词语，找近反义词。</li>
            <li>4，概括主要内容就是，时间，地点，人物，事情。</li>
            <li>5，答题技巧，人物评价围绕品质，景物围绕热爱之情来答。</li>
        </ol>
    </div>

    <div class="watermark">@小琪老师小学... From 小红书</div>

    <div class="bottom-decoration">
        <img src="https://via.placeholder.com/120x120?text=Mascot" alt="Mascot Placeholder">
    </div>
</div>

</body>
</html>
