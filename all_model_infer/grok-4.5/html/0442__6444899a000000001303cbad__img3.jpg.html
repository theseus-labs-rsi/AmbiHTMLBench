<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: #ffffff;
        margin: 0;
        color: #333;
        line-height: 1.6;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: #fff;
        border-bottom: 1px solid #f0f0f0;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-left {
        display: flex;
        align-items: center;
        color: #dcb336;
        font-size: 18px;
        font-weight: 500;
    }

    .header-left .arrow {
        margin-right: 5px;
        font-size: 20px;
    }

    .header-right {
        display: flex;
        gap: 20px;
        color: #dcb336;
        font-size: 22px;
    }

    .content {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
    }

    .item {
        margin-bottom: 40px;
    }

    .item-header {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
    }

    .check-icon {
        width: 24px;
        height: 24px;
        background-color: #f2c94c;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 12px;
        flex-shrink: 0;
    }

    .check-icon::after {
        content: '';
        width: 8px;
        height: 4px;
        border-left: 2px solid #fff;
        border-bottom: 2px solid #fff;
        transform: rotate(-45deg) translate(1px, -1px);
    }

    .item-title {
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }

    .quote-text {
        font-size: 16px;
        color: #444;
        text-align: justify;
        margin: 0 0 10px 0;
    }

    .source {
        font-size: 15px;
        color: #666;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <span class="arrow">&lt;</span>
        <span>金句合集</span>
    </div>
    <div class="header-right">
        <span>&#128100;</span>
        <span>&#10148;</span>
        <span>&#8942;</span>
    </div>
</div>

<div class="content">
    <div class="item">
        <div class="item-header">
            <div class="check-icon"></div>
            <div class="item-title">他写「成长」，正是你所亲历</div>
        </div>
        <p class="quote-text">“我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”</p>
        <p class="source">——《病隙碎笔》</p>
    </div>

    <div class="item">
        <div class="item-header">
            <div class="check-icon"></div>
            <div class="item-title">他写「磨难」，报之以歌</div>
        </div>
        <p class="quote-text">“大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”</p>
        <p class="source">——《好运设计》</p>
    </div>
</div>

</body>
</html>
