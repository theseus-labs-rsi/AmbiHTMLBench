<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 12px;
        }
        .placeholder {
            width: 200px;
            height: 150px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            display: inline-block;
            margin: 10px;
            text-align: center;
            line-height: 150px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Document Title</h1>
    <p>[illegible]</p>
    <p>Some text here.</p>
    <div class="placeholder">[Chart: bottom-left]</div>
</body>
</html>
