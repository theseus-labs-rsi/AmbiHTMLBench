<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .document {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border: 1px solid black;
            padding: 40px 30px;
            box-sizing: border-box;
            position: relative;
        }
        .text-block {
            margin-bottom: 20px;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            border: 2px dashed #888;
            background-color: #f9f9f9;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="document">
        <div class="text-block">
            <p>Sample OCR result from an image document.</p>
        </div>
        <div class="placeholder">
            [Diagram: top-center]
        </div>
        <div class="text-block">
            <p>Second paragraph of extracted text.</p>
        </div>
        <div class="text-block">
            <p><strong>Bold</strong> and <em>italic</em> text preserved.</p>
        </div>
    </div>
</body>
</html>
