<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三阶段 认识自我，找到自我</title>
<style>
    body {
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .container {
        background-color: #fff;
        padding: 20px 40px;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        max-width: 800px;
        margin: 0 auto;
    }
    ul {
        list-style-type: none;
        padding-left: 0;
        margin: 0;
    }
    li {
        position: relative;
        padding: 8px 0 8px 24px;
        font-size: 16px;
        line-height: 1.5;
    }
    /* Main vertical line for the first level of children */
    .tree-level-1 {
        border-left: 1px solid #ccc;
        margin-left: 12px;
        padding-left: 12px;
    }
    /* Sub vertical lines for nested lists */
    .tree-level-2 {
        border-left: 1px solid #ccc;
        margin-left: 12px;
        padding-left: 12px;
    }
    
    /* Bullet points */
    li::before {
        content: "•";
        position: absolute;
        left: 0;
        top: 8px;
        color: #666;
        font-size: 18px;
    }
    
    /* Header styling */
    .header-item {
        color: #a52a2a;
        font-weight: bold;
        font-size: 18px;
        padding-left: 0;
    }
    .header-item::before {
        left: -12px;
    }

    /* Chevron styling */
    .chevron {
        position: absolute;
        right: 0;
        top: 10px;
        width: 10px;
        height: 10px;
        border-right: 2px solid #ccc;
        border-bottom: 2px solid #ccc;
        transform: rotate(45deg);
        opacity: 0.6;
    }

    /* Text wrapping for the last item */
    .wrap-text {
        display: block;
        width: 100%;
    }
</style>
</head>
<body>

<div class="container">
    <ul>
        <li class="header-item">
            第三阶段 认识自我，找到自我
            <div class="chevron"></div>
            <ul class="tree-level-1">
                <li>
                    不同国家的妆容模仿
                    <div class="chevron"></div>
                    <ul class="tree-level-2">
                        <li>不同国家妆容特点分析</li>
                        <li>逐个部位模仿</li>
                    </ul>
                </li>
                <li>
                    明星出圈妆容模仿
                    <div class="chevron"></div>
                    <ul class="tree-level-2">
                        <li>鞠婧祎妆容</li>
                        <li>虞书欣妆容</li>
                        <li>宋慧乔妆容</li>
                        <li>女团妆容</li>
                        <li>日本杂志妆容</li>
                    </ul>
                </li>
                <li>
                    找到适合自己的风格和妆容
                    <div class="chevron"></div>
                    <ul class="tree-level-2">
                        <li>
                            <span class="wrap-text">根据自己的穿衣风格，职业，谈吐等确定自己适合的风格</span>
                        </li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</div>

</body>
</html>
