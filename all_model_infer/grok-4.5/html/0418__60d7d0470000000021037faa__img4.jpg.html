    <style>
        body {
            font-family: "Times New Roman", serif;
            max-width: 800px;
            margin: 40px auto;

        }
        h1, h2, h3 {
            font-family: "Times New Roman", serif;
            margin-top: 20px;
            margin-bottom: 10px;
