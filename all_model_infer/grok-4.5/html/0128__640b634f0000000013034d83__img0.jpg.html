<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育原则模板</title>
<style>
    body {
        background-color: #1e1e1e;
        color: #f5f5f5;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        margin: 0;
        padding: 40px;
        line-height: 1.6;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
    }
    .header {
        color: #f2c14e;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 25px;
        line-height: 1.4;
    }
    .item {
        font-size: 20px;
        margin-bottom: 18px;
        color: #ffffff;
    }
    .item-title {
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">7.当题目中出现“原则”时，可用以下模板：</div>
        
        <div class="item">
            (一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展
        </div>
        
        <div class="item">
            (二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教
        </div>
        
        <div class="item">
            (三)科学性原则。...能给幼儿正确的启蒙教<br>育
        </div>
        
        <div class="item">
            (四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点
        </div>
        
        <div class="item">
            (五)整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展
        </div>
        
        <div class="item">
            (六)活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主
        </div>
    </div>
</body>
</html>
