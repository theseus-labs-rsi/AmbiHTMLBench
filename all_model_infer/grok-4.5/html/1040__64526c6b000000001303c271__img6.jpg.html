<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&amp;family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            line-height: 1.4;
            background: #fff;
            color: #000;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        h1, h2, h3 {
            font-family: 'Georgia', serif;
        }
        
        h1 {
            text-align: center;
            font-size: 24pt;
            margin-bottom: 20pt;
            border-bottom: 2px solid #000;
            padding-bottom: 10pt;
        }
        
        .column {
            display: flex;
            gap: 40px;
        }
        
        .col-left, .col-right {
            flex: 1;
        }
        
        p {
            margin: 0 0 12pt 0;
            text-align: justify;
        }
        
        .placeholder {
            width: 100%;
            height: 200px;
            background: #f5f5f5;
            border: 1px dashed #999;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
        }
        
        .footer {
            text-align: center;
            font-size: 10pt;
            margin-top: 40px;
            border-top: 1px solid #000;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <h1>TITLE HERE</h1>
    
    <div class="column">
        <!-- Left column -->
        <div class="col-left">
            <p>This is the first column of text.</p>
            <p>Additional paragraph in column one.</p>
        </div>
        
        <!-- Right column -->
        <div class="col-right">
            <p>Second column text here.</p>
            <p>Another line in column two.</p>
        </div>
    </div>
    
    <div class="placeholder">
        [Placeholder: image or diagram centered at this position]
    </div>
    
    <p>Text after the placeholder block.</p>
    
    <div class="footer">
        Footer text or page number
    </div>
    
    <script>
        MathJax.typeset();
    </script>
</body>
</html>
