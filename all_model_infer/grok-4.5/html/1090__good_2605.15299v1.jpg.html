<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        body {
            font-family: 'Times New Roman', serif;
            margin: 0.75in 1in;
            line-height: 1.15;
            font-size: 11pt;
            max-width: 7in;
        }
        h1 {
            font-size: 16pt;
            margin-bottom: 0.5em;
            text-align: center;
            font-weight: bold;
        }
        h2 {
            font-size: 14pt;
            margin-top: 1.2em;
            margin-bottom: 0.4em;
            font-weight: bold;
        }
        p {
            margin: 0.4em 0;
            text-indent: 0.5em;
        }
        .section {
            margin-bottom: 0.6em;
        }
        .placeholder {
            width: 100%;
            min-height: 120px;
            border: 1px dashed #000;
            margin: 0.8em 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-style: italic;
            color: #666;
            background: #f9f9f9;
            position: relative;
        }
        .placeholder::after {
            content: "Diagram / Chart placeholder";
            font-size: 10pt;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        ul, ol {
            margin: 0.4em 0;
            padding-left: 1.2em;
        }
        li {
            margin: 0.2em 0;
        }
    </style>
</head>
<body>

<h1>Untitled Document</h1>

<p>[illegible]</p>
<p>[illegible]</p>

<div class="placeholder">[Chart: top-left]</div>

<p>[illegible]</p>

<div class="placeholder">[Diagram: centered]</div>

<p>[illegible]</p>

</body>
</html>
