<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.4;
            background: #fff;
        }
        .header {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 20px;
        }
        .title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .date {
            font-style: italic;
            margin-bottom: 20px;
        }
        ul {
            margin-left: 30px;
        }
        .placeholder {
            background: #f0f0f0;
            border: 2px dashed #999;
            width: 600px;
            height: 400px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .placeholder-caption {
            font-size: 0.9em;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="header">[Header / Logo area]</div>

<div class="section">
    <div class="title">[Title]</div>
    <div class="date">[Date]</div>
</div>

<div class="section">
    <p>[Body text line 1]<br>[Body text line 2]<br>[Body text line 3]</p>
</div>

<div class="section">
    <ul>
        <li>[Bullet 1]</li>
        <li>[Bullet 2]</li>
    </ul>
</div>

<div class="section">
    <div class="placeholder" style="width: 400px; height: 300px;">
        [Image / Chart / Diagram / Photo]
        <div class="placeholder-caption">[Diagram / Chart: placeholder]</div>
    </div>
</div>

<div class="section">
    <p>[Paragraph 1]<br>[Paragraph 2]</p>
</div>

</body>
</html>
