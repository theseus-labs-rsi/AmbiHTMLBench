<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
            margin: 40px auto;
            max-width: 800px;
            padding: 20px;
            border: 1px solid #ccc;
            background: white;
        }
        h1, h2 {
            font-family: 'Arial', sans-serif;
            margin-top: 1.5em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        td, th {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: top;
        }
        .placeholder {
            border: 2px dashed #666;
            background: #f8f8f8;
            color: #666;
            text-align: center;
            padding: 10px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="placeholder" style="width:100%; height:150px; margin:10px 0;">[Photo: top-center]</div>
    <h1>Document Title</h1>
    <p>Author Name</p>
    <p>Date</p>
    <p>Address</p>
    
    <table>
        <tr>
            <td><strong>Column 1</strong><br>Text in first column</td>
            <td><strong>Column 2</strong><br>Text in second column</td>
        </tr>
    </table>
    
    <p>Single column text continuing below the table.</p>
    
    <div class="placeholder" style="width:300px; height:100px; margin:15px auto;">[Chart: centered]</div>
    
    <ul>
        <li>Item one</li>
        <li>Item two</li>
    </ul>
    
    <ol>
        <li>First ordered item</li>
        <li>Second ordered item</li>
    </ol>
    
    <p>[illegible] text at the end</p>
</body>
</html>
