<!DOCTYPE html>
<html lang="en">
<head>

    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@family=Times+New+Roman:wght@400;700&display=swap');
        body {
            font-family: 'Times New Roman', serif;
            margin: 50px auto;
            max-width: 800px;
            line-height: 1.5;
            color: #000;
            background: #fff;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        p {
            margin: 8px 0;
            text-align: justify;
        }
        .center {
            text-align: center;
        }
        .placeholder {
            border: 1px solid #000;
            background: #f9f9f9;
            text-align: center
