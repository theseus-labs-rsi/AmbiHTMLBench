<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报金句摘抄</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "SimSun", "Songti SC", serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        width: 100%;
        max-width: 600px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
        background-color: #fdfbf7;
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid #ddd;
    }
    .logo-area {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .logo-text {
        font-family: "KaiTi", "STKaiti", serif;
        font-size: 56px;
        color: #c8102e;
        line-height: 1;
        font-weight: bold;
        letter-spacing: 2px;
    }
    .logo-sub {
        font-family: "Times New Roman", serif;
        font-size: 14px;
        color: #333;
        margin-top: 8px;
        letter-spacing: 1px;
    }
    .title-area {
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .title-line {
        font-size: 24px;
        font-weight: bold;
        color: #000;
        border-bottom: 2px solid #000;
        padding-bottom: 4px;
        display: inline-block;
    }
    .title-line.small {
        font-size: 20px;
    }
    .content {
        background-color: #e6dcc8;
        padding: 40px 30px;
        color: #1a1a1a;
    }
    .quote-block {
        margin-bottom: 50px;
    }
    .quote-text {
        font-size: 36px;
        font-weight: bold;
        text-align: center;
        line-height: 1.4;
        margin-bottom: 20px;
        font-family: "SimHei", "Heiti SC", sans-serif;
    }
    .example-label {
        font-size: 16px;
        margin-bottom: 10px;
        font-weight: bold;
    }
    .example-text {
        font-size: 16px;
        line-height: 1.6;
        text-align: justify;
    }
    .divider {
        height: 1px;
        background-color: rgba(0,0,0,0.1);
        margin: 30px 0;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-text">人民日报</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="title-area">
            <div class="title-line">金句 | 摘抄</div>
            <div class="title-line small">坚持奋斗主题</div>
        </div>
    </div>
    
    <div class="content">
        <div class="quote-block">
            <div class="quote-text">
                夜色难免黑凉<br>
                前行必有曙光
            </div>
            <div class="example-label">举例:</div>
            <div class="example-text">
                夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
            </div>
        </div>

        <div class="quote-block">
            <div class="quote-text">
                道固远，笃行可至<br>
                事虽巨，坚为必成
            </div>
            <div class="example-label">举例:</div>
            <div class="example-text">
                道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
            </div>
        </div>
    </div>
</div>
</body>
</html>
