<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山里的约会 - 大班综合</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
    }

    .poster {
        position: relative;
        width: 600px;
        height: 850px;
        background-color: #e6f2e8;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Background Placeholder representing the illustration */
    .bg-illustration {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #dceef0 0%, #c2d6c2 50%, #d4c4a8 100%);
        z-index: 1;
    }
    
    .bg-illustration::after {
        content: "[Illustration: Rural landscape with people working in fields, mountains, and sky]";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(0,0,0,0.1);
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        width: 80%;
    }

    /* Top Text */
    .top-text {
        position: absolute;
        top: 20px;
        width: 90%;
        left: 5%;
        text-align: center;
        font-size: 14px;
        color: #333;
        line-height: 1.6;
        z-index: 10;
    }

    /* Left Vertical Text - Top */
    .left-vertical-top {
        position: absolute;
        top: 30px;
        left: 20px;
        writing-mode: vertical-rl;
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
        letter-spacing: 4px;
        z-index: 10;
    }

    /* Main Title */
    .main-title {
        position: absolute;
        top: 120px;
        left: 220px;
        width: 200px;
        height: 250px;
        display: flex;
        flex-direction: row-reverse; /* To make right column first */
        z-index: 10;
    }

    .title-col {
        writing-mode: vertical-rl;
        font-family: "KaiTi", "STKaiti", serif;
        font-size: 56px;
        font-weight: bold;
        color: #1a472a;
        line-height: 1.2;
        margin: 0 10px;
    }

    .title-col.right {
        margin-right: 0;
    }

    .title-col.left {
        margin-left: 0;
        font-size: 48px;
        margin-top: 20px;
    }

    /* Left Vertical Text - Middle */
    .left-vertical-mid {
        position: absolute;
        top: 320px;
        left: 20px;
        writing-mode: vertical-rl;
        font-size: 22px;
        font-weight: bold;
        color: #2c3e50;
        letter-spacing: 2px;
        z-index: 10;
    }

    /* Watermark */
    .watermark {
        position: absolute;
        top: 480px;
        left: 380px;
        font-size: 12px;
        color: #555;
        display: flex;
        align-items: center;
        gap: 5px;
        z-index: 10;
        background: rgba(255,255,255,0.6);
        padding: 5px 10px;
        border-radius: 15px;
    }

    .watermark .heart {
        color: #ff6b6b;
    }

    /* Left Vertical Text - Bottom */
    .left-vertical-bottom {
        position: absolute;
        bottom: 30px;
        left: 20px;
        writing-mode: vertical-rl;
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
        letter-spacing: 2px;
        z-index: 10;
    }

    /* Bottom Text Blocks */
    .bottom-text-container {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 60px;
        box-sizing: border-box;
        z-index: 10;
    }

    .text-block {
        width: 30%;
        font-size: 13px;
        color: #333;
        line-height: 1.8;
        text-align: center;
    }

    .text-block.right {
        text-align: left;
        width: 35%;
    }
</style>
</head>
<body>

<div class="poster">
    <div class="bg-illustration"></div>

    <div class="top-text">
        地上的路原来很平坦可是有太多人走过这些路过的人们太累了<br>
        于是他们决定扔下一些东西
    </div>

    <div class="left-vertical-top">大班综合</div>

    <div class="main-title">
        <div class="title-col right">山里的</div>
        <div class="title-col left">约会</div>
    </div>

    <div class="left-vertical-mid">TongCai 2021</div>

    <div class="watermark">
        <span class="heart">♥</span> @Hiro豆豆老师<br>From 小红书
    </div>

    <div class="left-vertical-bottom">Autumn</div>

    <div class="bottom-text-container">
        <div class="text-block">
            有的人扔下了悲伤<br>
            变成了路上的石头
        </div>
        <div class="text-block">
            有的人留下快乐<br>
            变成了山上的树苗
        </div>
        <div class="text-block right">
            我把装在瓶子里的思念<br>
            放在高高的山顶上<br>
            交成了黑夜的眼睛
        </div>
    </div>
</div>

</body>
</html>
