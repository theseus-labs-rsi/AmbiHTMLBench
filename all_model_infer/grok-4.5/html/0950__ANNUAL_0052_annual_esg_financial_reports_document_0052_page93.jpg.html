<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.3;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            text-align: center;
            margin: 20px 0 10px;
        }
        p {
            text-align: justify;
            margin: 12px 0;
        }
        .placeholder {
            width: 100%;
            height: 150px;
            border: 1px solid #ccc;
            background: #f8f8f8;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>[Title]</h1>
    <p>[Text extracted: first paragraph here]</p>
    <div class="placeholder">[Diagram: top-left]</div>
    <p>[Text extracted: second paragraph here]</p>
    <div class="placeholder">[Chart: bottom-right]</div>
    <p>[Text extracted: third paragraph here]</p>
</body>
</html>
