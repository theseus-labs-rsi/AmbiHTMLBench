<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刚从长沙回来总结</title>
<style>
    body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #fdfbf7;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .header {
        text-align: center;
        padding: 20px 10px 10px 10px;
        background-color: #fdfbf7;
    }
    .header h1 {
        margin: 0;
        font-size: 36px;
        font-weight: 900;
        color: #000;
        letter-spacing: 2px;
    }
    .header h1 span {
        color: #4da6ff;
    }
    .header h2 {
        margin: 10px 0 0 0;
        font-size: 24px;
        font-weight: 800;
        color: #d35400;
        background-color: #fff;
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        border: 2px solid #d35400;
    }
    .blue-bar {
        height: 6px;
        background-color: #4da6ff;
        width: 100%;
    }
    .main-content {
        display: flex;
        padding: 20px 10px;
        gap: 15px;
    }
    .timeline {
        width: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding-top: 10px;
    }
    .timeline-text {
        font-size: 20px;
        font-weight: 900;
        color: #1a5fb4;
        text-align: center;
        line-height: 1.2;
    }
    .arrow {
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 25px solid #4da6ff;
        margin: 5px 0;
    }
    .activities {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .activity {
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }
    .activity-img {
        width: 110px;
        height: 90px;
        background-color: #eee;
        border-radius: 5px;
        overflow: hidden;
        flex-shrink: 0;
        position: relative;
    }
    .activity-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .activity-text {
        flex: 1;
        font-size: 13px;
        line-height: 1.5;
    }
    .title-pill {
        display: inline-block;
        background-color: #dceeff;
        color: #1a5fb4;
        font-weight: bold;
        padding: 3px 8px;
        border-radius: 10px;
        margin-bottom: 4px;
        font-size: 14px;
    }
    .time {
        color: #d35400;
        font-weight: bold;
        margin-bottom: 4px;
        display: block;
    }
    .desc {
        color: #555;
    }
    .star {
        color: #f1c40f;
        margin-right: 4px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>刚从<span>长沙</span>回来总结</h1>
        <h2>3天2晚 1000元</h2>
    </div>
    <div class="blue-bar"></div>
    
    <div class="main-content">
        <div class="timeline">
            <div class="timeline-text">第一天</div>
            <div class="arrow"></div>
            <div class="timeline-text">上午</div>
            <div class="arrow"></div>
            <div class="timeline-text">下午</div>
            <div class="arrow"></div>
            <div class="timeline-text">晚上</div>
        </div>

        <div class="activities">
            <div class="activity">
                <div class="activity-img">
                    <img src="https://via.placeholder.com/110x90/ffcccc/000000?text=May+1st+Square" alt="五一广场">
                </div>
                <div class="activity-text">
                    <span class="title-pill"><span class="star">★</span>五一广场 (免费)</span>
                    <span class="time">游玩时间: 2h</span>
                    <div class="desc">长沙商圈老大，就近可打卡IFS国金中心、黄兴路步行街、坡子街等</div>
                </div>
            </div>

            <div class="activity">
                <div class="activity-img">
                    <img src="https://via.placeholder.com/110x90/cccccc/000000?text=South+Gate" alt="南门口">
                </div>
                <div class="activity-text">
                    <span class="title-pill"><span class="star">★</span>南门口 (免费)</span>
                    <span class="time">游玩时间: 1h</span>
                    <div class="desc">南门口是很多长沙人生活的地方，附近有很多地道的美食和小吃</div>
                </div>
            </div>

            <div class="activity">
                <div class="activity-img">
                    <img src="https://via.placeholder.com/110x90/87ceeb/000000?text=Orange+Isle" alt="橘子洲">
                </div>
                <div class="activity-text">
                    <span class="title-pill"><span class="star">★</span>橘子洲 (免费)</span>
                    <span class="time">游玩时间: 2h</span>
                    <div class="desc">我个人是不推荐橘子洲和岳麓山放在同一天的，傍晚的橘子洲更有韵味</div>
                </div>
            </div>

            <div class="activity">
                <div class="activity-img">
                    <img src="https://via.placeholder.com/110x90/333333/ffffff?text=Cruise" alt="湘江游轮">
                </div>
                <div class="activity-text">
                    <span class="title-pill"><span class="star">★</span>湘江游轮 (180/人)</span>
                    <span class="time">游玩时间: 1h</span>
                    <div class="desc">夜游湘江绝对是一种不容错过的体验，江风清爽，夜景特别美</div>
                </div>
            </div>

            <div class="activity">
                <div class="activity-img">
                    <img src="https://via.placeholder.com/110x90/ffaa00/000000?text=Du+Fu+Pavilion" alt="杜甫江阁">
                </div>
                <div class="activity-text">
                    <span class="title-pill"><span class="star">★</span>杜甫江阁 (10/人)</span>
                    <span class="time">游玩时间: 1h</span>
                    <div class="desc">为纪念杜甫江阁而建，夜景美，是观看湘江夜景的最佳观看地点</div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
