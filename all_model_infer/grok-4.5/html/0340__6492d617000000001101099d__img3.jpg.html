<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维二：分解思维</title>
<style>
    body {
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .page-container {
        position: relative;
        width: 600px;
        background-color: #fff;
        padding: 60px 50px;
        box-sizing: border-box;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    /* Corner Brackets */
    .corner {
        position: absolute;
        width: 40px;
        height: 40px;
        border-color: #a0a0a0;
        border-style: solid;
    }
    .corner-tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 25px;
        color: #333;
    }
    .definition {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
        color: #333;
    }
    .definition .highlight {
        color: #d93025;
    }
    .section {
        margin-bottom: 25px;
    }
    .section-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #000;
    }
    .section-text {
        font-size: 15px;
        line-height: 1.6;
        color: #333;
        text-align: justify;
    }
    .footer {
        position: absolute;
        bottom: 40px;
        left: 50px;
        right: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .footer-left {
        font-size: 14px;
        color: #333;
    }
    .footer-right {
        background-color: #000;
        color: #fff;
        padding: 8px 20px 8px 15px;
        font-size: 14px;
        font-weight: bold;
        display: flex;
        align-items: center;
        clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);
    }
</style>
</head>
<body>
    <div class="page-container">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <h1>计算思维二：分解思维</h1>

        <p class="definition">
            分解思维是指<span class="highlight">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）。</span>
        </p>

        <div class="section">
            <div class="section-title">1、问题梳理</div>
            <div class="section-text">先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</div>
        </div>

        <div class="section">
            <div class="section-title">2、问题分解</div>
            <div class="section-text">将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</div>
        </div>

        <div class="section">
            <div class="section-title">3、整合方案</div>
            <div class="section-text">制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</div>
        </div>

        <div class="footer">
            <div class="footer-left">原创：学习方法社</div>
            <div class="footer-right">翻页</div>
        </div>
    </div>
</body>
</html>
