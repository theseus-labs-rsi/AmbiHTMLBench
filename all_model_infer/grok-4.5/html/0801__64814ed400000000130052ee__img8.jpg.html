<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loneliness Quote</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #2a1b3d;
        color: #dcd0b5;
        font-family: "Georgia", "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 800px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .graphic {
        width: 200px;
        height: 200px;
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .english-quote {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #cbbfa0;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        max-width: 600px;
    }

    .diamond-icon {
        width: 10px;
        height: 10px;
        background-color: #dcd0b5;
        transform: rotate(45deg);
        flex-shrink: 0;
    }

    .chinese-quote {
        font-family: "Songti SC", "SimSun", serif;
        font-size: 24px;
        line-height: 1.8;
        color: #e8dcc0;
        font-weight: 500;
        letter-spacing: 2px;
    }

    .chinese-quote span {
        display: block;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="graphic">
            <svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Arc with ticks -->
                <path d="M 30 90 A 60 60 0 0 1 150 90" fill="none" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 45 85 L 45 95" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 60 75 L 60 85" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 75 65 L 75 75" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 90 60 L 90 70" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 105 65 L 105 75" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 120 75 L 120 85" stroke="#dcd0b5" stroke-width="1.5"/>
                <path d="M 135 85 L 135 95" stroke="#dcd0b5" stroke-width="1.5"/>
                
                <!-- Diamond -->
                <polygon points="90,40 140,90 90,140 40,90" fill="none" stroke="#dcd0b5" stroke-width="1.5"/>
                <polygon points="90,55 125,90 90,125 55,90" fill="none" stroke="#dcd0b5" stroke-width="1"/>
                
                <!-- Female Symbol -->
                <circle cx="90" cy="80" r="12" fill="none" stroke="#dcd0b5" stroke-width="1.5"/>
                <line x1="90" y1="92" x2="90" y2="110" stroke="#dcd0b5" stroke-width="1.5"/>
                <line x1="82" y1="102" x2="98" y2="102" stroke="#dcd0b5" stroke-width="1.5"/>
            </svg>
        </div>

        <div class="english-quote">
            <div class="diamond-icon"></div>
            <div>I think the so-called loneliness refers to the person you are facing,<br>whose emotions are not on the same frequency as your own.</div>
            <div class="diamond-icon"></div>
        </div>

        <div class="chinese-quote">
            <span>“ 我想所谓孤独，</span>
            <span>就是你面对的那个人，</span>
            <span>他的情绪和你自己的情绪，</span>
            <span>不在同一个频率。”</span>
        </div>
    </div>
</body>
</html>
