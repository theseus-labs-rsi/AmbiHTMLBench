<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman&display=swap');
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            line-height: 1.4;
            font-size: 16px;
            color: #000;
        }
        .page {
            page-break-after: always;
            position: relative;
        }
        .placeholder {
            border: 1px dashed #000;
            background: #f9f9f9;
            text-align: center;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="page">
        <p style="text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px;">[Diagram: centered]</p>
        <div class="placeholder" style="width: 400px; height: 200px; margin: 20px auto;">
            [Chart: bottom-left]
        </div>
    </div>
</body>
</html>
