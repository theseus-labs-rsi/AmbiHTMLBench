<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.4;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 30px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: #fff;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Times New Roman', serif;
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        
        h1 {
            font-size: 24pt;
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        
        h2 {
            font-size: 18pt;
            text-align: center;
        }
        
        p {
            margin: 0.8em 0;
            text-align: justify;
        }
        
        .center {
            text-align: center;
        }
        
        .italic {
            font-style: italic;
        }
        
        .bold {
            font-weight: bold;
        }
        
        ul, ol {
            margin: 0.8em 0;
            padding-left: 1.5em;
        }
        
        li {
            margin: 0.3em 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 6px 10px;
            text-align: left;
        }
        
        th {
            font-weight: bold;
        }
        
        .placeholder {
            width: 100%;
            height: 200px;
            border: 2px dashed #999;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            background: #f9f9f9;
            position: relative;
        }
        
        .placeholder::after {
            content: attr(data-caption);
            text-align: center;
            position: absolute;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Untitled Document</h1>
    <p class="center">[Document image not provided - no text or layout to extract]</p>
    <p class="center">No visible content could be processed.</p>
    <p class="center">Please provide a document image URL or upload an image for OCR conversion.</p>
</body>
</html>
