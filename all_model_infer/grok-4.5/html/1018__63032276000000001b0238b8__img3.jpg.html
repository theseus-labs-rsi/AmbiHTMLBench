<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f9f9f9;
        }
        .placeholder {
            background: #f0f0f0;
            color: #333;
            font-size: 0.9em;
            text-align: center;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 20px auto;
        }
        .placeholder::before {
            content: "[Diagram: centered]";
            display: block;
            font-style: italic;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="placeholder" style="width: 600px; height: 400px;">[Chart: centered]</div>
    <div class="placeholder" style="width: 400px; height: 300px;">[Chart: bottom-left]</div>
</body>
</html>
