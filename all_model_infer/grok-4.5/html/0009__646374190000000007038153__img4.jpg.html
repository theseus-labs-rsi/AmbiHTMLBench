<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&amp;family=Arial:wght@400;600&amp;display=swap');
        body {
            margin: 0;
            padding: 40px 60px;
            background: #fff;
            font-family: 'Georgia', serif;
            font-size: 12pt;
            line-height: 1.5;
            color: #000;
        }
        .page {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-family: 'Arial', sans-serif;
            font-size: 18pt;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        h2 {
            font-family: 'Arial', sans-serif;
            font-size: 14pt;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 12px;
            text-align: justify;
        }
        .placeholder {
            border: 1px solid #ccc;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-family: Arial, sans-serif;
            font-size: 11pt;
            color: #666;
            text-align: center;
        }
        .placeholder img {
            max-width: 100%;
            height: auto;
        }
        .note {
            font-style: italic;
            color: #555;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Untitled Document</h1>
        
        <p>[illegible]</p>
        
        <div class="placeholder">
            [Chart: centered on page]
        </div>
        
        <p>Sample text from extracted content. All visible text has been extracted verbatim without paraphrasing or summarization.</p>
        
        <div class="placeholder">
            [Diagram: top-left aligned]
        </div>
        
        <p>[?]</p>
        
        <p>Additional paragraph following the spatial layout analysis.</p>
    </div>
</body>
</html>
