<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary List</title>
<style>
    body {
        background-color: #f4f4f4;
        font-family: 'Kalam', 'Comic Sans MS', 'Caveat', cursive, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
        margin: 0;
    }
    .page {
        background-color: #fffdf5;
        width: 100%;
        max-width: 800px;
        min-height: 1000px;
        padding: 40px 50px;
        box-sizing: border-box;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        /* Simulating lined paper */
        background-image: linear-gradient(to bottom, transparent 39px, #dcdcdc 40px);
        background-size: 100% 40px;
        color: #2b2b8f; /* Blue ink color */
    }
    .entry-group {
        margin-bottom: 40px; /* Space between groups */
    }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        height: 40px; /* Match line height */
        padding: 0 10px;
    }
    .word {
        font-size: 24px;
        font-weight: 500;
        width: 45%;
    }
    .definition {
        font-size: 22px;
        width: 55%;
        text-align: left;
    }
    .pos {
        font-style: italic;
        margin-right: 5px;
    }
    /* Specific adjustments for alignment based on visual inspection */
    .group-1 .row:nth-child(1) { margin-top: 0; }
    .group-2 .row:nth-child(1) { margin-top: 10px; }
    
    /* Underlines for specific words if visible (assert has a line under it) */
    .underlined {
        border-bottom: 1px solid #2b2b8f;
    }
</style>
</head>
<body>

<div class="page">

    <div class="entry-group group-1">
        <div class="row">
            <span class="word">charity</span>
            <span class="definition"><span class="pos">n.</span>慈善机构</span>
        </div>
        <div class="row">
            <span class="word">clarity</span>
            <span class="definition"><span class="pos">n.</span>(思路, 图像) 清晰</span>
        </div>
        <div class="row">
            <span class="word">clarify</span>
            <span class="definition"><span class="pos">v.</span>阐明, 阐释</span>
        </div>
    </div>

    <div class="entry-group group-2">
        <div class="row">
            <span class="word">consistent</span>
            <span class="definition"><span class="pos">adj.</span>一贯的, 与...一致的</span>
        </div>
        <div class="row">
            <span class="word">resist</span>
            <span class="definition"><span class="pos">v.</span>抵制</span>
        </div>
        <div class="row">
            <span class="word">insist</span>
            <span class="definition"><span class="pos">v.</span>坚持</span>
        </div>
    </div>

    <div class="entry-group group-3">
        <div class="row">
            <span class="word">insert</span>
            <span class="definition"><span class="pos">v.</span>插入, 嵌入</span>
        </div>
        <div class="row">
            <span class="word underlined">assert</span>
            <span class="definition"><span class="pos">v.</span>断言; 坚持主张</span>
        </div>
    </div>

    <div class="entry-group group-4">
        <div class="row">
            <span class="word">eminent</span>
            <span class="definition"><span class="pos">adj.</span>杰出的</span>
        </div>
        <div class="row">
            <span class="word">prominent</span>
            <span class="definition"><span class="pos">adj.</span>杰出的, 重要的</span>
        </div>
        <div class="row">
            <span class="word">eliminate</span>
            <span class="definition"><span class="pos">v.</span>消除; 淘汰</span>
        </div>
    </div>

    <div class="entry-group group-5">
        <div class="row">
            <span class="word">integral</span>
            <span class="definition"><span class="pos">adj.</span>必不可少的</span>
        </div>
        <div class="row">
            <span class="word">integrity</span>
            <span class="definition"><span class="pos">n.</span>诚实, 正直</span>
        </div>
        <div class="row">
            <span class="word">integrate</span>
            <span class="definition"><span class="pos">v.</span>(使) 融入</span>
        </div>
    </div>

    <div class="entry-group group-6">
        <div class="row">
            <span class="word">fabricate</span>
            <span class="definition"><span class="pos">v.</span>捏造</span>
        </div>
        <div class="row">
            <span class="word">fluctuate</span>
            <span class="definition"><span class="pos">v.</span>波动, 上下浮动</span>
        </div>
    </div>

</div>

</body>
</html>
