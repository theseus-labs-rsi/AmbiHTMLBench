<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .document {
            border: 1px solid #000;
            padding: 40px 50px;
        }
        h1 {
            font-size: 24pt;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            font-size: 12pt;
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .column {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        .left-col, .right-col {
            flex: 1;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            border: 1px dashed #666;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14pt;
            background-color: #f5f5f5;
        }
        .placeholder-caption {
            font-size: 10pt;
            margin-top: 8px;
            text-align: center;
        }
        .footer {
            text-align: center;
            font-size: 10pt;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="document">
        <h1>Sample Document Title</h1>
        
        <p>Sample paragraph text 1.</p>
        
        <div class="column">
            <div class="left-col">
                <p>Left column text here.</p>
                <div class="placeholder">[Image: top-left]</div>
                <p>More left column text.</p>
            </div>
            <div class="right-col">
                <p>Right column text here.</p>
                <div class="placeholder">[Image: top-right]</div>
            </div>
        </div>
        
        <p>Paragraph spanning both columns.</p>
        
        <div class="column">
            <div class="left-col">
                <p>Left column continuation.</p>
                <div class="placeholder">[Chart: bottom-left]</div>
            </div>
            <div class="right-col">
                <p>Right column continuation.</p>
            </div>
        </div>
        
        <p>Footer text.</p>
        <div class="footer">
            Page 1 of 1
        </div>
    </div>
</body>
</html>
