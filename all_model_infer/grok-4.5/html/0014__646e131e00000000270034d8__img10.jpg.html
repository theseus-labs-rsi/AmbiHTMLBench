<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老吴の创业随笔</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #e6d5b8; /* Approximating the paper texture color */
        font-family: "Songti SC", "SimSun", "STSong", serif;
        color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        width: 90%;
        max-width: 800px;
        padding: 40px 20px;
        text-align: center;
        box-sizing: border-box;
    }
    .header {
        font-size: 28px;
        margin-bottom: 40px;
        letter-spacing: 2px;
    }
    .content {
        font-size: 32px;
        line-height: 1.8;
        margin-bottom: 50px;
        text-align: center;
    }
    .footer {
        font-size: 20px;
        color: #333;
        letter-spacing: 1px;
        border-top: 1px solid rgba(0,0,0,0.1);
        padding-top: 20px;
        margin-top: 40px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">老吴の创业随笔</div>
        <div class="content">
            《易经》中说：“小财靠勤，大财靠德，德不厚，无以载物。”靠出卖时间和劳动力赚钱的人，只能发点小财。一个人每天，时间有限，精力有限，分身乏术。
        </div>
        <div class="footer">
            商业思维 | 个人提升 | 创业心得 | 认知觉醒
        </div>
    </div>
</body>
</html>
