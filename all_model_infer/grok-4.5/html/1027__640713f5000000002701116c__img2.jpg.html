<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&amp;display=swap');
        body {
            font-family: 'Times New Roman', serif;
            line-height: 1.4;
            margin: 40px auto;
            max-width: 800px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18pt;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .placeholder {
            border: 2px solid #000;
            background: #f9f9f9;
            text-align: center;
            padding: 15px;
            margin: 15px 0;
        }
        .placeholder-caption {
            font-size: 12pt;
            font-style: italic;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">Document Title</div>

    <div class="section">
        <div class="section-title">Section 1</div>
        [illegible]<br>
        <div class="placeholder">[Chart: centered]</div>
        <div class="placeholder-caption">[Chart: bottom-left]</div>
    </div>

    <div class="section">
        <div class="section-title">Section 2</div>
        <div style="column-count: 2; column-gap: 40px;">
            <p>Text in column 1</p>
            <p>Text in column 2</p>
        </div>
    </div>

</body>
</html>
