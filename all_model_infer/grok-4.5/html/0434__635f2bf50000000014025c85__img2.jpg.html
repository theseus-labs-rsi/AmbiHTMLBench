<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的 vs 人民日报写的</title>
<style>
    body {
        margin: 0;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        width: 100%;
        max-width: 800px;
        background-color: #efe6cc;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .top-section {
        background-color: #efe6cc;
        padding: 40px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        position: relative;
        min-height: 250px;
    }
    .top-left {
        width: 60%;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .header-row {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .title-text {
        font-size: 32px;
        font-weight: bold;
        color: #2c3e50;
    }
    .red-circle {
        width: 60px;
        height: 60px;
        background-color: #d62728;
        border-radius: 50%;
        display: inline-block;
    }
    .child-text {
        font-size: 24px;
        line-height: 1.6;
        color: #2c3e50;
        font-weight: bold;
    }
    .top-right {
        width: 35%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        position: relative;
    }
    .boy-image {
        width: 180px;
        height: 220px;
        background-color: #ddd;
        border: 2px solid #2c3e50;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }
    .boy-image-placeholder {
        font-size: 12px;
        color: #666;
        text-align: center;
    }
    .image-caption {
        position: absolute;
        bottom: 10px;
        right: 0;
        background-color: rgba(255, 255, 255, 0.9);
        color: #2c3e50;
        font-weight: bold;
        font-size: 20px;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
    }
    .watermark {
        position: absolute;
        top: 40%;
        left: 10%;
        font-size: 40px;
        color: rgba(255, 255, 255, 0.4);
        transform: rotate(-15deg);
        pointer-events: none;
        z-index: 10;
    }
    .bottom-section {
        background-color: #4b4b66;
        color: #f5f5dc;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .bottom-header {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .bottom-title {
        font-size: 32px;
        font-weight: bold;
        color: #f5f5dc;
    }
    .green-check {
        font-size: 50px;
        color: #2ecc71;
        font-weight: bold;
    }
    .main-text {
        font-size: 20px;
        line-height: 1.8;
        text-align: justify;
        color: #f5f5dc;
    }
    .citation {
        text-align: right;
        font-size: 16px;
        color: #f5f5dc;
        margin-top: 10px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="top-section">
        <div class="watermark">看破的美女纸</div>
        <div class="top-left">
            <div class="header-row">
                <span class="title-text">我写的：</span>
                <span class="red-circle"></span>
            </div>
            <div class="child-text">
                我们民族的追梦史充满<br>艰辛。
            </div>
        </div>
        <div class="top-right">
            <div class="boy-image">
                <div class="boy-image-placeholder">[Image: Crying Boy]</div>
            </div>
            <div class="image-caption">学习使我妈快乐</div>
        </div>
    </div>
    <div class="bottom-section">
        <div class="bottom-header">
            <span class="bottom-title">人民日报写的：</span>
            <span class="green-check">✔</span>
        </div>
        <div class="main-text">
            我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
        </div>
        <div class="citation">
            ——2013.4.1《筑就民族复兴的“中国梦”》
        </div>
    </div>
</div>
</body>
</html>
