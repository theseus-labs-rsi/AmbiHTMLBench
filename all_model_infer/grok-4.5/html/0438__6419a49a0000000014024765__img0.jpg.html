<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Transcription</title>
<style>
    body {
        background-color: #e0e0e0;
        font-family: "SimSun", "Songti SC", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .paper {
        background-color: #fff;
        width: 850px;
        padding: 50px 60px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        position: relative;
        transform: rotate(-1deg);
    }
    .header {
        display: flex;
        align-items: flex-start;
        margin-bottom: 25px;
    }
    .q-num {
        font-size: 24px;
        font-weight: bold;
        margin-right: 15px;
        width: 40px;
        line-height: 1.2;
    }
    .q-text {
        font-size: 16px;
        line-height: 1.6;
        flex: 1;
    }
    .answer {
        font-family: "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
        font-size: 26px;
        line-height: 1.5;
        color: #000;
        margin-top: 10px;
    }
    .side-note {
        position: absolute;
        right: 20px;
        top: 60px;
        font-size: 12px;
        color: #666;
        line-height: 1.5;
    }
</style>
</head>
<body>
    <div class="paper">
        <div class="side-note">
            外...<br>
            名...
        </div>
        <div class="header">
            <div class="q-num">26</div>
            <div class="q-text">
                你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>
                她看到了什么呢？
            </div>
        </div>
        <div class="answer">
            我蹲下来，“这根肋骨让你感<br>
            到不舒服吗？”<br>
            展览台上是一尊白玉莹莹的肋<br>
            骨，下面的文字介绍引用了夏娃<br>
            的来历，说女人都是由肋骨所化。
        </div>
    </div>
</body>
</html>
