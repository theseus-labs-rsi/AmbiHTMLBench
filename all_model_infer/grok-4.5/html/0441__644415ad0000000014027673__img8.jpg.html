<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长需要关注什么</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 100%;
        max-width: 800px;
        background-color: #e6d5b8; /* Beige background */
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    
    /* Header Section */
    .header {
        background-color: #e6d5b8;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid #8b5a2b;
        position: relative;
    }
    .header-img-placeholder {
        width: 200px;
        height: 150px;
        background-color: #a8c6a8; /* Placeholder color for deer image */
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 12px;
        text-align: center;
        overflow: hidden;
        position: relative;
    }
    .header-img-placeholder::after {
        content: "[Illustration: Deer]";
        position: absolute;
    }
    .header-text {
        text-align: right;
        color: #5c4033;
    }
    .header-text h1 {
        margin: 0;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
    }
    .header-text p {
        margin: 10px 0 0 0;
        font-size: 16px;
        letter-spacing: 4px;
    }
    .red-stamp {
        position: absolute;
        left: 20px;
        bottom: 10px;
        width: 20px;
        height: 30px;
        background-color: #b22222;
        color: white;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        border-radius: 2px;
    }

    /* Content Boxes */
    .content-box {
        background-color: #fff;
        margin: 20px;
        padding: 20px;
        border: 1px solid #dcdcdc;
        display: grid;
        grid-template-columns: 1fr 140px 1fr;
        gap: 20px;
        align-items: center;
        position: relative;
    }
    
    .col-left, .col-right {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }
    
    .item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }
    
    .num-badge {
        background-color: #7fa686;
        color: white;
        padding: 4px 10px;
        border-radius: 15px 15px 15px 0;
        font-size: 14px;
        font-weight: bold;
        min-width: 30px;
        text-align: center;
        margin-top: 2px;
    }
    
    .item-text {
        font-size: 15px;
        line-height: 1.6;
        color: #333;
    }
    .item-text strong {
        color: #b22222;
    }

    /* Center Circle */
    .center-circle {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid #8d6e63;
        background-color: #fdfbf7;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 0 auto;
        box-shadow: inset 0 0 0 4px #fdfbf7, inset 0 0 0 6px #8d6e63;
    }
    .center-circle::before {
        content: "";
        position: absolute;
        top: 10px; left: 10px; right: 10px; bottom: 10px;
        border: 1px solid #8d6e63;
        border-radius: 50%;
        background-image: 
            linear-gradient(45deg, transparent 45%, #8d6e63 45%, #8d6e63 55%, transparent 55%),
            linear-gradient(-45deg, transparent 45%, #8d6e63 45%, #8d6e63 55%, transparent 55%);
        background-size: 10px 10px;
        opacity: 0.3;
    }
    .circle-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 20px;
        font-weight: bold;
        color: #5c4033;
        letter-spacing: 4px;
        z-index: 2;
        background-color: #fdfbf7;
        padding: 10px 5px;
        border-radius: 4px;
    }

    /* Bottom Stamp */
    .bottom-stamp {
        position: absolute;
        left: 20px;
        bottom: 10px;
        width: 20px;
        height: 30px;
        background-color: #b22222;
        color: white;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        border-radius: 2px;
    }

</style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="header">
        <div class="header-img-placeholder"></div>
        <div class="header-text">
            <h1>家长需要关注什么</h1>
            <p>章·节·肆</p>
        </div>
        <div class="red-stamp">章</div>
    </div>

    <!-- Middle Section -->
    <div class="content-box">
        <div class="col-left">
            <div class="item">
                <span class="num-badge">壹</span>
                <div class="item-text">看单科成绩<br>分析优势与劣势科目</div>
            </div>
            <div class="item">
                <span class="num-badge">贰</span>
                <div class="item-text">看进步<br>横向整体水平<br>纵向看进退情况</div>
            </div>
            <div class="item">
                <span class="num-badge">叁</span>
                <div class="item-text">分析错题</div>
            </div>
        </div>

        <div class="center-circle">
            <div class="circle-text">成绩怎么看</div>
        </div>

        <div class="col-right">
            <div class="item">
                <span class="num-badge">肆</span>
                <div class="item-text">分析错题：<br>是遗憾丢分？是模糊丢分？<br>是不会做丢分？<br><strong>策略：</strong>消除遗憾、纠正模糊、力争突破</div>
            </div>
            <div class="item">
                <span class="num-badge">伍</span>
                <div class="item-text">分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</div>
            </div>
        </div>
        <div class="bottom-stamp">章</div>
    </div>

    <!-- Bottom Section -->
    <div class="content-box">
        <div class="col-left">
            <div class="item">
                <span class="num-badge">壹</span>
                <div class="item-text">不要过度焦虑</div>
            </div>
            <div class="item">
                <span class="num-badge">贰</span>
                <div class="item-text">不要过度关注孩子</div>
            </div>
            <div class="item">
                <span class="num-badge">叁</span>
                <div class="item-text">不要给孩子过高的期望</div>
            </div>
        </div>

        <div class="center-circle">
            <div class="circle-text">家长五不要</div>
        </div>

        <div class="col-right">
            <div class="item">
                <span class="num-badge">肆</span>
                <div class="item-text">不要过度唠叨</div>
            </div>
            <div class="item">
                <span class="num-badge">伍</span>
                <div class="item-text">不要盲目攀比和迷信</div>
            </div>
        </div>
        <div class="bottom-stamp">章</div>
    </div>

</div>

</body>
</html>
