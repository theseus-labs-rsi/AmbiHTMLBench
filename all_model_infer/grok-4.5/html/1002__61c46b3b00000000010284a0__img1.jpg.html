<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 800px;
            line-height: 1.4;
        }
        .placeholder {
            border: 1px dashed #999;
            background: #f0f0f0;
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            font-style: italic;
            color: #666;
        }
        .placeholder[title="chart"] {
            width: 100%;
            height: 300px;
        }
        .placeholder[title="signature"] {
            width: 200px;
            height: 100px;
        }
        h1 { font-size: 24pt; text-align: center; }
        h2 { font-size: 18pt; margin-top: 20px; }
        p { margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1>[Title: Extracted from Image]</h1>
    
    <p>[illegible]</p>
    <p>[illegible]</p>
    
    <div class="placeholder" title="chart">[Chart: top-center, full-width]</div>
    
    <p>[Text from first column]</p>
    <p>[Text from first column, second paragraph]</p>
    
    <div class="placeholder" title="chart">[Chart: middle-left]</div>
    
    <p>[Text from second column]</p>
    <p>[Text from second column, second paragraph]</p>
    
    <div class="placeholder" title="signature">[Signature: bottom-right]</div>
    
    <p>[illegible]</p>

</body>
</html>
