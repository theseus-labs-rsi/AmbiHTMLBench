<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled Document</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #222;
    line-height: 1.5;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page {
    background: white;
    width: 100%;
    max-width: 800px;
    min-height: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
    padding: 60px 50px;
    position: relative;
  }
  .placeholder {
    border: 2px dashed #999;
    background: #fafafa;
    color: #666;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 15px;
    padding: 40px 20px;
    margin: 20px 0;
    min-height: 180px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: #333;
  }
  p {
    font-size: 0.95rem;
    color: #555;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>No document image provided</h1>
    <p>Unable to perform OCR-to-HTML conversion.</p>
    <div class="placeholder">
      [No source image / document detected]<br>
      Please supply a document image to convert.
    </div>
  </div>
</body>
</html>
