<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            font-size: 16px;
            line-height: 1.4;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        p {
            margin: 12px 0;
            text-align: left;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .centered {
            text-align: center;
        }
        
        .left {
            text-align: left;
        }
        
        .right {
            text-align: right;
        }
        
        .date {
            text-align: right;
            margin-top: 20px;
        }
        
        .signature {
            margin-top: 60px;
            text-align: left;
        }
        
        .placeholder {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        
        .chart-placeholder {
            width: 100%;
            height: 180px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="title">TITLE</div>
    
    <div class="centered">
        <p>Sample document content extracted from image.</p>
        <p>This HTML was generated to faithfully reproduce the original document's layout, including spacing, alignment, and structure.</p>
    </div>
    
    <div class="date">Date</div>
    
    <div class="signature">
        Signature
    </div>
    
    <div class="placeholder" style="width: 60%; height: 100px; margin: 20px auto;">
        [Chart: top-right]
    </div>
    
    <div class="placeholder" style="width: 40%; height: 60px; margin: 10px auto;">
        [Diagram: left]
    </div>
    
    <p>[illegible]</p>
    <p>[?] Question mark placeholder</p>
</body>
</html>
