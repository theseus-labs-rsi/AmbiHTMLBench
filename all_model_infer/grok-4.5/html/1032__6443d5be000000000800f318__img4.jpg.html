<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            line-height: 1.4;
            margin: 40px auto;
            max-width: 800px;
            padding: 20px;
            background: #f9f9f9;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18pt;
            font-weight: bold;
        }
        .section {
            margin-bottom: 25px;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .text-block {
            margin-bottom: 12px;
        }
        .text-block p {
            margin: 0 0 8px 0;
        }
        .indent {
            margin-left: 20px;
        }
        .placeholder {
            width: 100%;
            height: 180px;
            background: #eee;
            border: 1px dashed #666;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #666;
            font-style: italic;
            overflow: hidden;
        }
        .placeholder::before {
            content: "Placeholder for image/chart/signature";
        }
        .centered {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    [Centered Title Block]
</div>

<div class="text-block">
    <p>[Body text paragraph 1]</p>
    <p>[Body text paragraph 2]</p>
</div>

<div class="section">
    <div class="section-title">[Section Title]</div>
    <p class="indent">[Indented paragraph]</p>
</div>

<div class="placeholder">[Diagram: top-left]</div>

<div class="text-block">
    <p class="centered">[Centered text]</p>
</div>

<div class="placeholder">[Chart: bottom-right]</div>

</body>
</html>
