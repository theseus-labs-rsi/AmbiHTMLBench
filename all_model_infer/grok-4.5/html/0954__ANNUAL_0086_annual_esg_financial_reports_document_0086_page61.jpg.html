<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 40px;
            font-family: "Times New Roman", serif;
            line-height: 1.4;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .document {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .date {
            font-size: 10pt;
            margin-bottom: 15px;
        }
        
        .columns {
            display: flex;
            gap: 40px;
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        p {
            margin: 0 0 12px 0;
            text-align: justify;
            text-indent: 0;
        }
        
        .indent {
            text-indent: 25px;
        }
        
        .center {
            text-align: center;
        }
        
        .right {
            text-align: right;
        }
        
        .signature {
            margin-top: 30px;
            border-top: 1px solid #000;
            padding-top: 5px;
            width: 200px;
        }
        
        .placeholder {
            border: 1px dashed #666;
            background-color: #f9f9f9;
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            color: #666;
            font-style: italic;
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .placeholder img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="document">
        <div class="header">
            <div class="title">[Title]</div>
            <div class="date">[Date]</div>
        </div>
        
        <div class="columns">
            <div class="column">
                <p class="indent">[First paragraph text goes here...]</p>
                <p class="indent">[Second paragraph text goes here...]</p>
            </div>
            <div class="column">
                <p class="indent">[Third paragraph text goes here...]</p>
                <p class="indent">[Fourth paragraph text goes here...]</p>
            </div>
        </div>
        
        <div class="center">
            <div class="placeholder" style="width: 80%; height: 150px;">
                [Chart / Diagram: centered]
            </div>
        </div>
        
        <div class="signature">
            [Signature]
        </div>
        
        <div class="placeholder" style="margin-top: 40px; height: 100px;">
            [Image / Photo: placed here]
        </div>
    </div>
</body>
</html>
