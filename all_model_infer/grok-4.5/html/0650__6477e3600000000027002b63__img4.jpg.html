<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&amp;family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Georgia', serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #222;
            background: #fff;
        }
        
        h1, h2, h3 {
            font-family: 'Times New Roman', serif;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        
        p {
            margin-bottom: 1em;
            text-align: justify;
        }
        
        ul, ol {
            margin-bottom: 1em;
            padding-left: 2em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        
        .placeholder {
            border: 2px dashed #999;
            background: #f9f9f9;
            margin: 1em 0;
            text-align: center;
            color: #666;
        }
        
        .math {
            font-family: "Times New Roman", serif;
        }
    </style>
</head>
<body>
    <h1>Untitled Document</h1>
    <p>[Document image content not available]</p>
    <p class="placeholder" style="width: 100%; height: 300px; margin: 20px 0;">
        [Image: Document page]
    </p>
</body>
</html>
