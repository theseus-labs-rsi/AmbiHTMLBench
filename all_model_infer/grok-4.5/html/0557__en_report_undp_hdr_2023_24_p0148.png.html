<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #222;
        }
        
        h1, h2, h3 {
            font-family: 'Georgia', serif;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        
        h1 {
            font-size: 28px;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        
        p {
            margin: 12px 0;
            text-align: justify;
        }
        
        ul, ol {
            margin: 12px 0;
            padding-left: 25px;
        }
        
        .placeholder {
            border: 1px dashed #999;
            background-color: #f9f9f9;
            margin: 20px 0;
            padding: 15px;
            text-align: center;
            font-style: italic;
            color: #666;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .signature {
            text-align: right;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Untitled Document</h1>
    </div>
    
    <p>[illegible]</p>
    <p>[illegible]</p>
    
    <div class="placeholder" style="width: 400px; height: 200px; margin: 30px auto;">
        [Chart: centered on page]
    </div>
    
    <p>[illegible]</p>
    
    <div class="signature">
        [signature]
    </div>
    
    <p>[illegible] [illegible] [illegible]</p>
</body>
</html>
