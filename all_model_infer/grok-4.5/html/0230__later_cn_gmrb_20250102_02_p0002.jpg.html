<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Layout</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .page {
            max-width: 800px;
            margin: 20px auto;
            padding: 40px 60px;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative;
            min-height: 1100px;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: bold;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .content {
            line-height: 1.6;
            font-size: 16px;
        }
        .section {
            margin-bottom: 25px;
        }
        .placeholder {
            width: 200px;
            height: 150px;
            background-color: #f0f0f0;
            border: 1px dashed #999;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
            text-align: center;
            position: relative;
        }
        .placeholder::after {
            content: "[Chart: bottom-left]";
            position: absolute;
            bottom: 10px;
            font-size: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">Header Text</div>
        
        <div class="title">Main Title</div>
        
        <div class="section">
            <p>Body paragraph one. This
