<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Calculation Slide</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #5d7363;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    .banner {
        width: 90%;
        max-width: 1000px;
        background: linear-gradient(180deg, #87CEEB 0%, #20B2AA 100%);
        color: #FFFF00;
        text-align: center;
        font-size: 48px;
        font-weight: bold;
        padding: 15px 0;
        margin-top: 20px;
        margin-bottom: 40px;
        border: 1px solid #000;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    .content-box {
        background-color: white;
        width: 80%;
        max-width: 900px;
        height: 400px;
        padding: 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .formula-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
        color: #0000CC;
        font-size: 32px;
        font-weight: bold;
    }

    .fraction {
        display: flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
    }

    .numerator {
        padding: 0 10px;
    }

    .fraction-bar {
        width: 100%;
        height: 2px;
        background-color: #0000CC;
        margin: 5px 0;
    }

    .denominator {
        padding: 0 10px;
    }

    .limit {
        color: #CC0000;
        font-size: 28px;
        font-weight: bold;
    }

    .definitions {
        color: #0000CC;
        font-size: 24px;
        font-weight: bold;
        line-height: 1.6;
        text-align: left;
        width: 100%;
        max-width: 600px;
    }
</style>
</head>
<body>

    <div class="banner">
        PTA SHOULD BE LESS THAN 40 %
    </div>

    <div class="content-box">
        <div class="formula-container">
            <span>PTA =</span>
            <div class="fraction">
                <div class="numerator">(FT + AD)</div>
                <div class="fraction-bar"></div>
                <div class="denominator">CCT</div>
            </div>
            <span class="limit">&lt; 40%</span>
        </div>

        <div class="definitions">
            <div>FT = flap thickness</div>
            <div>AD = ablation depth</div>
            <div>CCT = central corneal thickness</div>
        </div>
    </div>

</body>
</html>
