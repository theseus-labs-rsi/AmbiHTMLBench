<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.语法</title>
<style>
    body {
        background-color: #88c9a1;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .notebook-page {
        background-color: #fff;
        width: 100%;
        max-width: 600px;
        min-height: 800px;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        padding: 40px 50px;
        box-sizing: border-box;
        /* Grid pattern */
        background-image: 
            linear-gradient(to right, #f0f0f0 1px, transparent 1px),
            linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
        background-size: 25px 25px;
    }

    .binding {
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
        padding: 0 10px;
    }

    .hole {
        width: 20px;
        height: 20px;
        background-color: #6ab38a;
        border-radius: 50%;
        box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: #333;
        margin-bottom: 30px;
        margin-top: 10px;
    }

    p {
        font-size: 18px;
        line-height: 1.8;
        color: #444;
        margin-bottom: 25px;
        text-align: justify;
    }

    .highlight {
        background-color: #fff59d;
        padding: 0 4px;
        border-radius: 2px;
    }

    .decoration-flower {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 80px;
        height: 80px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 20 Q60 10 70 20 Q80 30 70 40 Q80 50 70 60 Q60 70 50 60 Q40 70 30 60 Q20 50 30 40 Q20 30 30 20 Q40 10 50 20 Z" fill="%23ff9999" stroke="%23cc6666" stroke-width="2"/><circle cx="50" cy="40" r="10" fill="%23ffcc00"/></svg>');
        background-repeat: no-repeat;
        background-size: contain;
        opacity: 0.8;
    }

    .decoration-star {
        position: absolute;
        width: 30px;
        height: 30px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z" fill="%23ffeb3b" opacity="0.5"/></svg>');
        background-repeat: no-repeat;
    }
    
    .star-1 { top: 250px; left: 30px; }
    .star-2 { top: 550px; left: 40px; }

</style>
</head>
<body>

<div class="notebook-page">
    <div class="binding">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
    </div>

    <h1>4.语法</h1>

    <p>语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。</p>

    <p>虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？<span class="highlight">但是任何</span>一门学科都是由浅入深的，英语也不例外。</p>

    <p>学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。</p>

    <p>零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。</p>

    <div class="decoration-star star-1"></div>
    <div class="decoration-star star-2"></div>
    <div class="decoration-flower"></div>
</div>

</body>
</html>
