<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 2cm;
            max-width: 800px;
        }
        .header {
            text-align: center;
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 20px;
        }
        .subsection {
            font-size: 14pt;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .math {
            display: block;
            text-align: center;
            margin: 15px 0;
            font-size: 18pt;
        }
        .placeholder {
            width: 100%;
            height: 150px;
            border: 1px dashed #000;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            margin: 15px 0;
        }
        .placeholder::after {
            content: "[Chart: bottom-left]";
        }
        ul, ol {
            margin-left: 20px;
        }
    </style>
</head>
<body>

<h1 class="header">My Document Title</h1>

<p>This is a sample paragraph with <span style="font-style:italic;">italic text</span> and <strong>bold text</strong>.</p>

<h2 class="subsection">Section 1</h2>
<p>Content here.</p>

<h2 class="subsection">Section 2</h2>
<ul>
    <li>Item 1</li>
    <li>Item 2</li>
</ul>

<h3 class="subsection">Subsection</h3>
<p>Inline math: <span class="math">$x^2 + y^2 = z^2$</span></p>

<div class="placeholder">
    [Diagram: centered]
</div>

<h2 class="subsection">Section 3</h2>
<p>More text with a chart placeholder below.</p>

<div class="placeholder">
    [Chart: bottom-left]
</div>

</body>
</html>
