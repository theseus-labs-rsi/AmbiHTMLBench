<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: "Times New Roman", serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0;
            line-height: 1.4;
            color: #000;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
        }
        .section {
            margin-bottom: 20px;
        }
        .text-block {
            margin-bottom: 12px;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            font-style: italic;
            color: #666;
        }
        .placeholder-caption {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        Header Content
    </div>

    <div class="section">
        <div class="text-block">
            This is a sample document layout.
        </div>
    </div>

    <div class="section">
        <div class="text-block">
            [illegible] text here
        </div>
    </div>

    <div class="section">
        <div class="placeholder">
            [Diagram: centered diagram placeholder]
        </div>
        <div class="placeholder-caption">
            [Diagram: centered]
        </div>
    </div>

</body>
</html>
