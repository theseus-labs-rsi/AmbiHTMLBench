<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        body {
            font-family: "Times New Roman", serif;
            margin: 0.75in;
            line-height: 1.3;
            font-size: 11pt;
        }
        .centered {
            text-align: center;
        }
        .title {
            font-size: 18pt;
            font-weight: bold;
            margin-bottom: 18pt;
        }
        .heading {
            font-size: 14pt;
            font-weight: bold;
            margin: 12pt 0 6pt 0;
        }
        .normal {
            font-size: 11pt;
        }
        .small {
            font-size: 10pt;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12pt 0;
        }
        td, th {
            border: 1px solid black;
            padding: 4pt 8pt;
        }
        .placeholder {
            display: inline-block;
            background: #f8f8f8;
            border: 2px dashed #666;
            text-align: center;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

<div class="centered">
    <p class="title">SAMPLE DOCUMENT</p>
    <p class="heading">Introduction</p>
    <p class="normal">This is a sample document to demonstrate layout extraction.</p>
</div>

<div class="heading">Main Content</div>

<table>
    <tr>
        <td><strong>Left Cell</strong><br>Text here</td>
        <td><strong>Right Cell</strong><br>More text</td>
    </tr>
</table>

<div style="margin: 20pt 0 10pt 0;">
    <div class="placeholder" style="width: 300px; height: 200px;">
        [Diagram: top-center]
    </div>
</div>

<ol>
    <li>Step one</li>
    <li>Step two</li>
</ol>

<div class="heading">Conclusion</div>

</body>
</html>
