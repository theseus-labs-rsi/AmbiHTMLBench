<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Design</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .poster {
        position: relative;
        width: 600px;
        height: 800px;
        background-color: #fffaf5;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Abstract Background Blobs */
    .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.6;
        z-index: 0;
    }
    .blob-1 {
        top: -100px;
        left: -100px;
        width: 400px;
        height: 400px;
        background: #ffcc99;
    }
    .blob-2 {
        top: 100px;
        right: -50px;
        width: 300px;
        height: 500px;
        background: #ffddc2;
        transform: rotate(20deg);
    }
    .blob-3 {
        bottom: -100px;
        left: 100px;
        width: 400px;
        height: 300px;
        background: #ffe0c2;
    }

    .content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
    }

    /* Top Left */
    .top-left {
        position: absolute;
        top: 40px;
        left: 40px;
        font-size: 14px;
        font-weight: bold;
        color: #d67b2e;
        line-height: 1.4;
        text-transform: uppercase;
    }

    /* Top Right */
    .top-right {
        position: absolute;
        top: 40px;
        right: 40px;
        text-align: right;
        color: #d67b2e;
    }
    .top-right h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 1px;
    }
    .top-right .chinese {
        margin-top: 15px;
        font-size: 12px;
        color: #d67b2e;
        letter-spacing: 2px;
        font-weight: bold;
    }
    .top-right .chinese-2 {
        margin-top: 5px;
        font-size: 14px;
        color: #d67b2e;
        letter-spacing: 4px;
        font-weight: bold;
    }

    /* Vertical Left Text */
    .vertical-left {
        position: absolute;
        top: 150px;
        left: 40px;
        display: flex;
        flex-direction: row;
        height: 500px;
    }
    .v-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 60px;
        font-weight: 900;
        color: #e67e22;
        line-height: 1;
        letter-spacing: 2px;
    }
    .v-text-1 {
        margin-right: 20px;
    }
    .v-text-2 {
        font-size: 50px;
    }

    /* Vertical Right Text */
    .vertical-right {
        position: absolute;
        top: 200px;
        right: 40px;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        font-size: 16px;
        font-weight: bold;
        color: #d67b2e;
        letter-spacing: 8px;
        height: 300px;
    }

    /* Bottom Right */
    .bottom-right {
        position: absolute;
        bottom: 60px;
        right: 40px;
        width: 300px;
        text-align: right;
    }
    .quote {
        font-size: 14px;
        color: #8c5a2b;
        line-height: 1.5;
        margin-bottom: 15px;
        font-style: italic;
    }
    .faith-bar {
        display: inline-block;
        background-color: #e67e22;
        color: white;
        padding: 8px 15px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
    }

</style>
</head>
<body>

<div class="poster">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="content">
        <div class="top-left">
            11/07<br>
            DESIGNED BY<br>
            KERRILEE
        </div>

        <div class="top-right">
            <h1>BRIEF IS LIFE<br>BUT LOVE IS LONG</h1>
            <div class="chinese">你要知道生命虽短，但爱却绵长</div>
            <div class="chinese-2">爱你三千遍</div>
        </div>

        <div class="vertical-left">
            <div class="v-text v-text-1">THREE THOUSAND</div>
            <div class="v-text v-text-2">I LOVE YOU</div>
        </div>

        <div class="vertical-right">
            A U G E N S T E R N
        </div>

        <div class="bottom-right">
            <div class="quote">
                Life was like a box of chocolates,<br>
                you never know what you are gonna get.
            </div>
            <div class="faith-bar">YOU GOTTA HAVE LITTLE FAITH</div>
        </div>
    </div>
</div>

</body>
</html>
