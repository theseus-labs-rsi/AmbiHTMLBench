<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<style>
    body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #f9f9f9;
        background-image: 
            linear-gradient(#e0e0e0 1px, transparent 1px), 
            linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
        background-size: 20px 20px;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 800px;
        width: 100%;
        background: #fff; /* Optional: to make it pop against grid if needed, but image shows grid everywhere */
        /* Actually, the grid is the background of the whole image, so I'll keep the body background */
    }
    h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 30px;
        font-weight: 900;
    }
    .title-blue { color: #0056b3; }
    .title-black { color: #000; }
    
    .layout {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
    }
    
    .left-col {
        width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    
    .right-col {
        flex: 1;
        display: flex;
        justify-content: flex-start;
    }
    
    .day-box {
        background-color: #90ee90;
        padding: 5px 20px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 10px;
    }
    
    .arrow {
        color: #ffd700;
        font-size: 30px;
        line-height: 1;
        margin: 5px 0;
        font-weight: bold;
    }
    
    .location-name {
        font-size: 24px;
        font-weight: bold;
        margin: 10px 0;
    }
    
    .transport-info {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        margin: 10px 0;
        font-size: 16px;
        font-weight: bold;
    }
    
    .transport-label {
        background-color: #ffe4e1;
        padding: 2px 8px;
        border-radius: 4px;
    }
    
    .info-box {
        border: 2px solid #b22222;
        background-color: #fff;
        padding: 12px;
        font-size: 16px;
        line-height: 1.6;
        text-align: left;
        width: 100%;
        box-sizing: border-box;
    }
    
    .info-title {
        color: #0056b3;
        font-weight: bold;
    }
    
    .spacer {
        height: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <h1><span class="title-blue">第三天</span><span class="title-black">路线规划</span></h1>
    
    <div class="layout">
        <!-- Row 1: Day 3 Label -->
        <div class="row">
            <div class="left-col">
                <div class="day-box">第三天</div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 2: Arrow -->
        <div class="row">
            <div class="left-col">
                <div class="arrow">↓</div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 3: Ciqikou -->
        <div class="row">
            <div class="left-col">
                <div class="location-name">磁器口</div>
            </div>
            <div class="right-col">
                <div class="info-box">
                    <span class="info-title">磁器口（免费）：</span>汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌
                </div>
            </div>
        </div>
        
        <!-- Row 4: Transport 1 -->
        <div class="row">
            <div class="left-col">
                <div class="transport-info">
                    <span class="transport-label">1号线</span>
                    <span class="arrow">↓</span>
                    <span>30分钟</span>
                </div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 5: Luo Zhongli Art Museum -->
        <div class="row">
            <div class="left-col">
                <div class="location-name">罗中立美术馆</div>
            </div>
            <div class="right-col">
                <div class="info-box">
                    <span class="info-title">罗中立美术馆（免费）：</span>拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
                </div>
            </div>
        </div>
        
        <!-- Row 6: Transport 2 -->
        <div class="row">
            <div class="left-col">
                <div class="transport-info">
                    <span class="transport-label">1号线</span>
                    <span class="arrow">↓</span>
                    <span>80分钟</span>
                </div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 7: Mountain City Walkway -->
        <div class="row">
            <div class="left-col">
                <div class="location-name">山城步道</div>
            </div>
            <div class="right-col">
                <div class="info-box">
                    <span class="info-title">山城步道（免费）：</span>建在悬崖边的临江步道，汇聚老重庆特色步道
                </div>
            </div>
        </div>
        
        <!-- Row 8: Transport 3 -->
        <div class="row">
            <div class="left-col">
                <div class="transport-info">
                    <span class="transport-label">公交</span>
                    <span class="arrow">↓</span>
                    <span>32分钟</span>
                </div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 9: Guanyinqiao -->
        <div class="row">
            <div class="left-col">
                <div class="location-name">观音桥</div>
            </div>
            <div class="right-col">
                <div class="info-box">
                    <span class="info-title">观音桥（免费）：</span>超大商圈，还有很多地道重庆小吃
                </div>
            </div>
        </div>
        
        <!-- Row 10: Transport 4 -->
        <div class="row">
            <div class="left-col">
                <div class="transport-info">
                    <span class="transport-label">步行</span>
                    <span class="arrow">↓</span>
                    <span>15分钟</span>
                </div>
            </div>
            <div class="right-col"></div>
        </div>
        
        <!-- Row 11: Jiu Street -->
        <div class="row">
            <div class="left-col">
                <div class="location-name">九街</div>
            </div>
            <div class="right-col">
                <div class="info-box">
                    <span class="info-title">九街（免费）：</span>酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
