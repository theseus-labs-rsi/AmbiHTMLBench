<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月经推迟与痛经缓解指南</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
    }
    .container {
        background-color: #ffffff;
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
        position: relative;
    }
    .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #333;
        margin-bottom: 10px;
        padding: 0 10px;
    }
    .status-icons {
        display: flex;
        gap: 5px;
    }
    .close-btn {
        font-size: 20px;
        color: #333;
        margin-bottom: 20px;
        cursor: pointer;
    }
    .section-1 {
        margin-bottom: 40px;
    }
    .step-header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }
    .step-num {
        background-color: #d89ba8;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 14px;
        margin-right: 10px;
        font-weight: bold;
    }
    .step-title {
        font-size: 16px;
        font-weight: bold;
        color: #5a4b8c;
    }
    .text-body {
        font-size: 14px;
        line-height: 1.6;
        color: #444;
        margin: 0 0 15px 0;
    }
    .section-2 {
        margin-bottom: 30px;
    }
    .main-step-header {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
    }
    .big-num-box {
        border: 2px solid #5a4b8c;
        color: #5a4b8c;
        font-size: 32px;
        font-weight: bold;
        padding: 5px 15px;
        border-radius: 4px;
        margin-right: 10px;
    }
    .main-title {
        font-size: 18px;
        font-weight: bold;
        color: #5a4b8c;
    }
    .sub-header {
        background-color: #5a4b8c;
        color: white;
        display: inline-block;
        padding: 5px 20px 5px 10px;
        font-size: 14px;
        font-weight: bold;
        margin: 15px 0;
        position: relative;
        clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%);
    }
    .list-item {
        font-size: 14px;
        line-height: 1.6;
        color: #333;
        margin-bottom: 15px;
    }
    .highlight {
        font-weight: bold;
    }
</style>
</head>
<body>
<div class="container">
    <div class="status-bar">
        <div class="status-icons">
            <span>📶</span>
            <span>📶</span>
            <span>📶</span>
        </div>
        <div>19:43</div>
    </div>
    
    <div class="close-btn">✕</div>

    <div class="section-1">
        <div class="step-header">
            <span class="step-num">5</span>
            <span class="step-title">月经来潮需停药</span>
        </div>
        <p class="text-body">药物推迟月经可能会失败，服药过程中如月经来潮需停药。</p>
    </div>

    <div class="section-2">
        <div class="main-step-header">
            <div class="big-num-box">2</div>
            <div class="main-title">缓解痛经</div>
        </div>
        
        <p class="text-body">如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。</p>
        
        <div class="sub-header">常用方案</div>
        
        <p class="text-body">痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。</p>
        
        <p class="text-body">以下三种方法，选其中一种方法即可：</p>
        
        <p class="list-item">1.布洛芬 首剂 800 mg，之后根据需要 400 ~ 800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。</p>
        
        <p class="list-item">2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。</p>
    </div>
</div>
</body>
</html>
