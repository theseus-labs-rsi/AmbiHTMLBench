<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Georgia', serif;
            line-height: 1.5;
            margin: 40px auto;
            max-width: 800px;
            padding: 0 20px;
            color: #111;
            background: #fff;
        }
        
        h1, h2, h3 {
            font-family: 'Georgia', serif;
            font-weight: normal;
        }
        
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        
        .placeholder {
            border: 1px dashed #999;
            background: #f8f8f8;
            margin: 20px 0;
            padding: 15px;
            text-align: center;
            font-style: italic;
            color: #555;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        
        .signature {
            margin-top: 40px;
            text-align: right;
        }
        
        .signature-line {
            border-top: 1px solid #333;
            display: inline-block;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>[Title: Centered Large]</h1>
    
    <p>[illegible] line 1</p>
    <p>[illegible] line 2</p>
    
    <div class="placeholder" style="width: 600px; height: 400px; margin: 30px auto;">
        [Diagram: centered full-width]
    </div>
    
    <table>
        <tr>
            <th>Column 1 Header</th>
            <th>Column 2 Header</th>
        </tr>
        <tr>
            <td>[illegible] text in first column</td>
            <td>[illegible] text in second column</td>
        </tr>
    </table>
    
    <p style="text-align: center;">[illegible] centered paragraph
