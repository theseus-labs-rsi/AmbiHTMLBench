<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2017年 12月第一套 Text 1</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .slide-container {
        width: 1000px;
        height: 600px;
        background-color: white;
        position: relative;
        padding: 40px 60px;
        box-sizing: border-box;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    .top-bar {
        position: absolute;
        top: 10px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        font-size: 12px;
        color: #333;
    }
    .camera-placeholder {
        width: 60px;
        height: 60px;
        background-color: #ddd;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #666;
        font-size: 10px;
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
    }
    .video-placeholder {
        width: 120px;
        height: 90px;
        background-color: #ccc;
        border: 1px solid #999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #666;
        font-size: 10px;
        text-align: center;
    }
    .content {
        margin-top: 60px;
        color: #d63031;
        font-size: 20px;
        line-height: 1.6;
    }
    .header-text {
        font-weight: bold;
        margin-bottom: 20px;
    }
    .item-1 {
        margin-bottom: 30px;
    }
    .title {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #000;
        margin: 20px 0 30px 0;
    }
    .item-2 {
        margin-bottom: 30px;
    }
    .underline {
        text-decoration: underline;
        text-decoration-color: #d63031;
        text-decoration-thickness: 2px;
    }
    .bottom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 40px;
        margin-top: 20px;
    }
    .col-left {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .col-right {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding-top: 5px;
    }
    .subtext {
        font-size: 18px;
        margin-top: 5px;
    }
</style>
</head>
<body>
    <div class="slide-container">
        <div class="top-bar">
            <div>19:28 5月14日 周五</div>
            <div class="video-placeholder">[Video Feed]</div>
        </div>
        <div class="camera-placeholder">[Camera]</div>

        <div class="content">
            <div class="header-text">固化的做题思维：</div>
            <div class="item-1">1. 喜欢忠于自己的内心和感觉。</div>
            
            <div class="title">2017年 12月第一套 Text 1</div>
            
            <div class="item-2">2. 喜欢选<span class="underline">符合常识的选项</span>。 20年左右的常识和经验的累积</div>
            
            <div class="bottom-grid">
                <div class="col-left">
                    <div>3. 喜欢选自己认识的选项。</div>
                    <div>4. 喜欢选自己不认识的选项。</div>
                    <div>5. 火急火燎一把火</div>
                </div>
                <div class="col-right">
                    <div>6. 囫囵吞枣选择法</div>
                    <div class="subtext">(有逃避，有厌烦)</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
