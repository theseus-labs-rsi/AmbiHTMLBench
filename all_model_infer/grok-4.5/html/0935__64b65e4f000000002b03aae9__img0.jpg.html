<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            font-size: 14pt;
        }
        .column {
            column-count: 2;
            column-gap: 40px;
        }
        .title {
            font-size: 18pt;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            text-align: center;
        }
        .placeholder::after {
            content: "[Chart: centered]";
        }
    </style>
</head>
<body>
    <div class="column">
        <h1 class="title">Document Title</h1>
        
        <p><strong>Page 1</strong></p>
        <p>This is the first paragraph of the document.</p>
        <p>Second paragraph with longer text to demonstrate layout.</p>
        
        <div class="placeholder"></div>
        
        <p>Continue with text in the first column.</p>
        
        <div class="column">
            <!-- Second column content -->
            <p>Second column starts here.</p>
            <p>More text in column 2.</p>
        </div>
    </div>
    
    <p>End of document content.</p>
</body>
</html>
