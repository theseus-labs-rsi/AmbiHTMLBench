<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
    <style>
        body {
            margin: 0;
            padding: 40px 60px;
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            color: black;
        }
        .placeholder {
            width: 100%;
            height: 300px;
            background-color: #f0f0f0;
            border: 2px dashed #888;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-style: italic;
        }
        .placeholder::after {
            content: "[Diagram: centered]";
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        td, th {
            border: 1px solid #000;
            padding: 8px;
        }
        ul, ol {
            margin-left: 30px;
        }
    </style>
</head>
<body>

<h1 style="text-align: center; font-size: 24pt;">Document Title</h1>
<h2 style="text-align: center; font-size: 18pt;">Subtitle</h2>

<p style="text-align: justify;">This is a sample multi-column layout document.</p>

<div style="display: flex; gap: 40px; margin: 30px 0;">
    <div style="flex: 1;">
        <p><strong>Column 1:</strong></p>
        <p>First column text line one.</p>
        <p>First column text line two.</p>
    </div>
    <div style="flex: 1;">
        <p><strong>Column 2:</strong></p>
        <p>Second column text line one.</p>
        <p>Second column text line two.</p>
    </div>
</div>

<p>Single column continuation.</p>

<div class="placeholder"></div>

<table>
    <tr>
        <th>Header 1</th>
        <th>Header 2</th>
    </tr>
    <tr>
        <td>Data 1</td>
        <td>Data 2</td>
    </tr>
</table>

<p>Footer text.</p>

</body>
</html>
