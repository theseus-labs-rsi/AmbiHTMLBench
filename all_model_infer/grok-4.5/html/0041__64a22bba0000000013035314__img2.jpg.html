<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第十一章 三角形 - 稳定性与不稳定性</title>
<style>
    body {
        font-family: "SimSun", "Songti SC", serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        background-color: #fff;
    }
    p {
        margin-bottom: 15px;
        text-align: justify;
    }
    .figure-container {
        display: flex;
        justify-content: space-between;
        margin: 20px 0;
        gap: 20px;
    }
    .figure-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .placeholder {
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
        box-sizing: border-box;
    }
    .caption {
        font-size: 14px;
        text-align: center;
        margin-top: 5px;
    }
    .figure-label {
        text-align: center;
        font-size: 14px;
        margin-top: 10px;
        margin-bottom: 20px;
    }
    .practice-box {
        border: 2px dashed #d4a373;
        border-radius: 15px;
        padding: 20px;
        margin-top: 30px;
        background-color: #fffaf0;
    }
    .practice-header {
        display: inline-block;
        background-color: #d4a373;
        color: white;
        padding: 5px 20px;
        border-radius: 20px;
        font-weight: bold;
        margin-bottom: 15px;
        font-size: 16px;
    }
    .shapes-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
    }
    .shape-item {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .shape-label {
        margin-top: 5px;
        font-size: 14px;
    }
    .footer {
        margin-top: 40px;
        text-align: right;
        font-size: 14px;
        color: #666;
    }
    svg {
        stroke: #333;
        stroke-width: 2;
        fill: none;
    }
</style>
</head>
<body>

    <p>还可以发现，斜钉一根木条的四边形木架的形状不会改变，这是因为斜钉一根木条后，四边形变成两个三角形，由于三角形有稳定性，斜钉一根木条的窗框在未安装好之前也不会变形。</p>

    <p>三角形的稳定性有广泛的应用，图 11.1-8 表示其中一些例子，你能再举一些例子吗？</p>

    <div class="figure-container">
        <div class="figure-item">
            <div class="placeholder" style="width: 280px; height: 140px;">
                [图片：钢架桥]
            </div>
            <div class="caption">钢架桥</div>
        </div>
        <div class="figure-item">
            <div class="placeholder" style="width: 280px; height: 140px;">
                [图片：起重机]
            </div>
            <div class="caption">起重机</div>
        </div>
    </div>
    <div class="figure-label">图 11.1-8</div>

    <p>四边形的不稳定性也有广泛的应用，图 11.1-9 表示其中一些例子。</p>

    <div class="figure-container">
        <div class="figure-item">
            <div class="placeholder" style="width: 280px; height: 160px;">
                [图片：活动挂架]
            </div>
            <div class="caption">活动挂架</div>
        </div>
        <div class="figure-item">
            <div class="placeholder" style="width: 280px; height: 160px;">
                [图片：伸缩门]
            </div>
            <div class="caption">伸缩门</div>
        </div>
    </div>
    <div class="figure-label">图 11.1-9</div>

    <div class="practice-box">
        <div class="practice-header">练习</div>
        <p style="margin-top: 10px; font-weight: bold;">下列图形中哪些具有稳定性？</p>
        
        <div class="shapes-grid">
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <polygon points="10,60 90,20 90,60 10,80" />
                    <line x1="10" y1="60" x2="90" y2="20" />
                </svg>
                <div class="shape-label">(1)</div>
            </div>
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <rect x="10" y="20" width="80" height="40" />
                    <line x1="50" y1="20" x2="50" y2="60" />
                </svg>
                <div class="shape-label">(2)</div>
            </div>
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <polygon points="20,60 80,60 80,30 50,10 20,30" />
                </svg>
                <div class="shape-label">(3)</div>
            </div>
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <polygon points="50,10 90,40 75,75 25,75 10,40" />
                    <line x1="50" y1="10" x2="75" y2="75" />
                    <line x1="50" y1="10" x2="25" y2="75" />
                    <line x1="50" y1="10" x2="10" y2="40" />
                    <line x1="50" y1="10" x2="90" y2="40" />
                </svg>
                <div class="shape-label">(4)</div>
            </div>
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <polygon points="20,20 80,20 90,50 60,75 20,75 10,50" />
                    <line x1="20" y1="20" x2="60" y2="75" />
                </svg>
                <div class="shape-label">(5)</div>
            </div>
            <div class="shape-item">
                <svg width="100" height="80" viewBox="0 0 100 80">
                    <polygon points="50,10 85,30 85,65 50,80 15,65 15,30" />
                    <line x1="50" y1="10" x2="50" y2="80" />
                    <line x1="15" y1="30" x2="85" y2="65" />
                    <line x1="85" y1="30" x2="15" y2="65" />
                </svg>
                <div class="shape-label">(6)</div>
            </div>
        </div>
    </div>

    <div class="footer">
        第十一章 三角形 7
    </div>

</body>
</html>
