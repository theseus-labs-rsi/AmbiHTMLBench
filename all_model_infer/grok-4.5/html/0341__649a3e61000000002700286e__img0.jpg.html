<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
    body {
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: #e8e8e8;
        margin: 0;
        padding: 20px;
        color: #222;
        line-height: 1.6;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #f5f5f5;
        padding: 30px 20px;
        border-radius: 8px;
    }
    p {
        margin-bottom: 25px;
        font-size: 18px;
        text-align: justify;
    }
    .highlight {
        color: #5b9a9a;
        font-weight: bold;
    }
    .footer {
        text-align: center;
        margin-top: 40px;
        color: #5b9a9a;
        font-weight: bold;
        font-size: 16px;
        letter-spacing: 1px;
    }
    .num {
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="container">
        <p>
            <span class="num">1、</span><span class="highlight">你开始炫耀自己，往往都是灾难的开始。</span><br>
            就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
        </p>

        <p>
            <span class="num">2、</span>一个冷知识：<span class="highlight">屏蔽力是一个人最顶级的能力</span>，任何消耗你的人和事，多看一眼都是你的不对。
        </p>

        <p>
            <span class="num">3、</span>大学时辅导员说了一句受益一生的话：“<span class="highlight">你不用变得很外向，内向挺好的，</span>但需要你发言的时候，一定要勇敢。”正所谓：君子可内敛不可懦弱，面不公可起而论之。
        </p>

        <div class="footer">
            商业思维 | 底层逻辑 | 个人提升
        </div>
    </div>
</body>
</html>
