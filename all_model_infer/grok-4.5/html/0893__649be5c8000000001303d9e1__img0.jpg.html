<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<style>
    body {
        background-color: #1a365d;
        background-image: linear-gradient(135deg, #1e3a5f 0%, #0f2038 100%);
        color: #ffffff;
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        width: 100%;
        max-width: 800px;
    }
    h1 {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    th, td {
        border: 1px solid #ffffff;
        padding: 15px 10px;
        text-align: center;
        vertical-align: middle;
        font-size: 1.1rem;
        line-height: 1.5;
    }
    th {
        background-color: rgba(255, 255, 255, 0.1);
        font-weight: bold;
        font-size: 1.2rem;
    }
    .full-width {
        background-color: rgba(255, 255, 255, 0.08);
        font-weight: bold;
    }
    .question {
        text-align: left;
        padding-left: 20px;
    }
    .answer {
        font-weight: bold;
        color: #e0e0e0;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>富人眼中的富人是咋样？</h1>
        <table>
            <thead>
                <tr>
                    <th>问题</th>
                    <th>回答</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="question">1.您觉得高净值人群资产拥有多少钱才算是？</td>
                    <td class="answer">1亿7,388.4万元</td>
                </tr>
                <tr>
                    <td colspan="2" class="full-width">本次调研的平均家庭资产:2,265.8万元</td>
                </tr>
                <tr>
                    <td class="question">2.请问您每天工作小时数是？</td>
                    <td class="answer">8.2小时</td>
                </tr>
                <tr>
                    <td class="question">3.您预计退休年龄？</td>
                    <td class="answer">59岁</td>
                </tr>
                <tr>
                    <td class="question">4.您希望能活到多少岁？</td>
                    <td class="answer">88.2岁</td>
                </tr>
                <tr>
                    <td colspan="2" class="full-width">小知识:2021年中国平均寿命:77.3岁</td>
                </tr>
                <tr>
                    <td class="question">5.请问您曾去过国家数量（包括商务出差）</td>
                    <td class="answer">6.2个国家</td>
                </tr>
                <tr>
                    <td class="question">6.请问您平均每月阅读书籍数量</td>
                    <td class="answer">2.4本书</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
