<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<style>
    body {
        background-color: #f0f0f0;
        font-family: "Microsoft YaHei", "SimHei", sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
        margin: 0;
    }
    .page {
        background-color: #fff;
        width: 100%;
        max-width: 800px;
        min-height: 1000px;
        padding: 40px 50px;
        box-sizing: border-box;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: relative;
        /* Simulating ruled paper lines */
        background-image: repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 39px,
            #a0a0a0 39px,
            #a0a0a0 40px
        );
        background-position: 0 60px; /* Start lines below header */
    }
    .header {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #333;
        margin-bottom: 20px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 5px;
    }
    .title {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        margin: 20px 0 40px 0;
        line-height: 40px;
        color: #000;
    }
    .content {
        font-size: 22px;
        line-height: 40px; /* Matches the ruled lines */
        color: #000;
        text-align: center;
        font-family: "KaiTi", "STKaiti", serif; /* Try to mimic handwriting style */
    }
    .line {
        display: block;
        margin-bottom: 0;
    }
    .indent {
        text-indent: 2em;
    }
</style>
</head>
<body>
    <div class="page">
        <div class="header">
            <span>Tu We Th Fr Sa Su</span>
            <span>Date. &nbsp;&nbsp; / &nbsp;&nbsp; / &nbsp;&nbsp; /</span>
        </div>
        
        <div class="title">这是好的开始</div>
        
        <div class="content">
            <span class="line">从你看到这篇文章开始</span>
            <span class="line">你会越来越有钱</span>
            <span class="line">越来越好看</span>
            <span class="line">生活和心态也会越来越好</span>
            <span class="line">请相信大数据</span>
            <span class="line">是你自己把一切美好的东西</span>
            <span class="line">都吸引了过来</span>
            <span class="line">你已经调到了接收钱的频率</span>
            <span class="line">接收美的频率</span>
            <span class="line">你的能量频率对了才接收到这</span>
            <span class="line">条信息</span>
            <span class="line">留下一句“全收到”</span>
            <span class="line">愿所有的愿望全能实现！</span>
        </div>
    </div>
</body>
</html>
