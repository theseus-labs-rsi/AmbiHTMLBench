<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-controller vs. Micro-processor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    .header {
        background-color: #000080;
        color: white;
        padding: 10px 20px;
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
    }

    .header::before {
        content: "";
        display: inline-block;
        width: 20px;
        height: 20px;
        background-color: #000080;
        margin-right: 10px;
        border-radius: 2px;
    }

    .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background-color: #f0f0f0;
        border: 1px solid #cccccc;
        border-radius: 20px;
        padding: 30px;
        width: 90%;
        max-width: 1000px;
        display: flex;
        justify-content: space-between;
        gap: 40px;
    }

    .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .column-title {
        font-size: 20px;
        font-weight: bold;
        text-decoration: underline;
        margin-bottom: 20px;
        text-align: center;
    }

    /* Left Side: Microcontroller */
    .mc-box {
        background-color: #0099cc;
        border: 2px solid #000000;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .mc-header {
        background-color: #0099cc;
        color: black;
        font-weight: bold;
        text-align: center;
        font-size: 18px;
        margin-bottom: 5px;
    }

    .mc-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .mc-item {
        background-color: white;
        border: 1px solid black;
        padding: 10px;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
    }

    .mc-item.full-width {
        grid-column: span 2;
    }

    /* Right Side: Microprocessor */
    .mp-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr;
        gap: 15px;
        width: 100%;
    }

    .chip {
        border: 1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 18px;
        padding: 15px;
        text-align: center;
        height: 60px;
        box-sizing: border-box;
    }

    .chip.microprocessor {
        background-color: #33cc33;
        color: white;
        grid-column: span 1;
    }

    .chip.clock {
        background-color: #cc9966;
        color: black;
    }

    .chip.usart {
        background-color: #99ccff;
        color: black;
    }

    .chip.memory {
        background-color: #0099ff;
        color: white;
        grid-column: span 1;
    }

    .chip.io-interfaces {
        background-color: #f0e68c;
        color: black;
        grid-column: span 2;
    }

    .chip.timer {
        background-color: #cccccc;
        color: black;
        grid-column: span 1;
    }

    .chip.peripherals {
        grid-column: span 2;
        display: flex;
        flex-direction: row;
        padding: 0;
        overflow: hidden;
    }

    .peripheral-part {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
        border-right: 1px solid black;
    }
    .peripheral-part:last-child {
        border-right: none;
    }
    .p1 { background-color: #ccccff; }
    .p2 { background-color: #f0e68c; }
    .p3 { background-color: #99ff33; }
    .p4 { background-color: #ff99cc; }

    .footer {
        text-align: center;
        padding: 10px;
        font-size: 14px;
    }

    .page-number {
        position: absolute;
        bottom: 10px;
        right: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="header">
    Micro-controller vs. Micro-processor
</div>

<div class="main-content">
    <div class="container">
        <!-- Left Column -->
        <div class="column">
            <div class="column-title">One Chip</div>
            <div class="mc-box">
                <div class="mc-header">Microcontroller</div>
                <div class="mc-grid">
                    <div class="mc-item">CPU</div>
                    <div class="mc-item">Timer/Counter</div>
                    <div class="mc-item">Memory</div>
                    <div class="mc-item">Clock</div>
                    <div class="mc-item">I/O Interface</div>
                    <div class="mc-item">USART</div>
                    <div class="mc-item full-width">Other Peripherals</div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="column">
            <div class="column-title">Many Different Chips</div>
            <div class="mp-grid">
                <div class="chip microprocessor">Microprocessor</div>
                <div class="chip clock">Clock</div>
                <div class="chip usart">USART</div>
                
                <div class="chip memory">Memory</div>
                <div class="chip io-interfaces">I/O Interfaces</div>
                
                <div class="chip timer">Timer/Counter</div>
                <div class="chip peripherals">
                    <div class="peripheral-part p1">Other</div>
                    <div class="peripheral-part p2">Peripherals</div>
                    <div class="peripheral-part p3"></div>
                    <div class="peripheral-part p4"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    © 2015 by Eng. Mohamed Tarek.
</div>
<div class="page-number">7</div>

</body>
</html>
