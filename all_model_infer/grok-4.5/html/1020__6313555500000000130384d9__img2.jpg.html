<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            margin: 1in;
            line-height: 1.4;
            font-size: 12pt;
        }
        
        .header {
            text-align: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 0.5in;
        }
        
        .title {
            font-size: 16pt;
            font-weight: bold;
            text-align: center;
            margin: 0.3in 0;
        }
        
        .content {
            margin: 0.4in 0;
        }
        
        .center {
            text-align: center;
        }
        
        .right {
            text-align: right;
        }
        
        .placeholder {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            display: block;
            margin: 0.5in auto;
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }
        
        ul, ol {
            margin-left: 0.5in;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.3in 0;
        }
        
        td, th {
            border: 1px solid #000;
            padding: 4px;
        }
    </style>
</head>
<body>

<div class="header">
    [Header: left-aligned]
</div>

<div class="title">
    [Document Title: centered]
</div>

<div class="content">
    <p><span class="placeholder" style="width: 150px; height: 20px; display: inline-block;">[Illegible: top-left]</span></p>
    
    <p>Some text here.</p>
    
    <div style="display: flex; gap: 1in; margin: 0.5in 0;">
        <div style="flex: 1;">
            <span class="placeholder" style="width: 200px; height: 100px;">[Diagram: left column]</span>
        </div>
        <div style="flex: 1;">
            <span class="placeholder" style="width: 200px; height: 100px;">[Diagram: right column]</span>
        </div>
    </div>
    
    <p>More text below.</p>
    
    <div class="placeholder" style="width: 400px; height: 250px; margin: 1in auto;">[Chart: centered, spanning columns]</div>
    
    <p>Text continues.</p>
    
    <table>
        <tr><td>Cell 1</td><td>Cell 2</td></tr>
        <tr><td>Cell 3</td><td>Cell 4</td></tr>
    </table>
    
    <p><span class="placeholder" style="width: 300px; height: 30px;">[Signature: bottom-right]</span></p>
</div>

</body>
</html>
