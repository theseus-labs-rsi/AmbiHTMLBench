<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;700&amp;family=Times+New+Roman:wght@400;700&amp;display=swap');
        
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 900px;
            line-height: 1.4;
            background: #ffffff;
            color: #000000;
        }
        h1 {
            font-size: 24pt;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18pt;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 12px;
            text-align: justify;
        }
        ul, ol {
            margin-left: 30px;
            margin-bottom: 15px;
        }
        .placeholder {
            background: #f5f5f5;
            border: 1px dashed #888;
            height: 120px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14pt;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Document Title</h1>
    
    <p>This is the extracted text from the provided document image.</p>
    
    <div class="placeholder">
        [Image / Diagram / Chart: placed here exactly as in the source layout]
    </div>
    
    <p>Continued text follows the original spatial arrangement.</p>
    
    <!-- Additional sections can be added based on detected columns/headers -->
    
</body>
</html>
