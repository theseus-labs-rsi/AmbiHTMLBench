<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" integrity="sha384-2i5TjAV8zG4Y5v5g8wVTFf0zgsyM4m6r3KX6S" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            max-width: 100%;
            margin: 0;
            padding: 40px;
            background: #fff;
            line-height: 1.4;
            font-size: 12pt;
        }
        
        .document {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Placeholder for any non-text element */
        .placeholder {
            width: 100%;
            height: 80px;
            border: 1px solid #000;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-style: italic;
            color: #666;
        }
        
        .placeholder::after {
            content: "Diagram / Image placeholder";
            font-size: 10pt;
        }
    </style>
</head>
<body>
    <div class="document">
        <p>[illegible]</p>
        <p>[Diagram: centered]</p>
        <p>[Chart: bottom-left]</p>
        <p>[illegible]</p>
    </div>
</body>
</html>
