<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报金句合集</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f4e4c1; /* Beige paper texture color */
        font-family: "Songti SC", "SimSun", "STSong", serif;
        color: #1a1a1a;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 800px;
        padding: 20px 40px;
        box-sizing: border-box;
        background-color: #f4e4c1;
        position: relative;
    }

    /* Header Styles */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 40px;
        border-bottom: 2px solid #1a1a1a;
        padding-bottom: 20px;
    }

    .logo-area {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .logo-text {
        font-family: "KaiTi", "STKaiti", serif;
        font-size: 64px;
        color: #c8102e; /* Red color */
        font-weight: bold;
        line-height: 1;
        margin-bottom: 5px;
        letter-spacing: 2px;
    }

    .logo-en {
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #c8102e;
        letter-spacing: 1px;
        font-weight: bold;
    }

    .meta-area {
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .meta-top {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .meta-bottom {
        font-size: 24px;
        font-weight: bold;
        border-bottom: 2px solid #1a1a1a;
        padding-bottom: 5px;
        margin-bottom: 5px;
    }

    /* Content Styles */
    .item {
        margin-bottom: 40px;
    }

    .quote {
        font-size: 28px;
        font-weight: bold;
        line-height: 1.5;
        margin-bottom: 15px;
        text-align: justify;
    }

    .meaning-label {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
    }

    .meaning-text {
        font-size: 16px;
        line-height: 1.6;
        color: #333;
        text-align: justify;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
        .header {
            flex-direction: column;
            align-items: flex-start;
        }
        .meta-area {
            align-items: flex-start;
            margin-top: 20px;
            width: 100%;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        .logo-text {
            font-size: 48px;
        }
        .quote {
            font-size: 22px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-text">人民日报</div>
            <div class="logo-en">RENMIN RIBAO</div>
        </div>
        <div class="meta-area">
            <div class="meta-top">金句 | 素材 | 摘抄</div>
            <div class="meta-bottom">金句合集系列</div>
        </div>
    </div>

    <div class="content">
        <div class="item">
            <div class="quote">1、愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</div>
            <div class="meaning-label">释义：</div>
            <div class="meaning-text">希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝与琐事而烦恼忧愁。</div>
        </div>

        <div class="item">
            <div class="quote">2、总有人间一两风，<br>填我十万八千梦。</div>
            <div class="meaning-label">释义：</div>
            <div class="meaning-text">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。</div>
        </div>

        <div class="item">
            <div class="quote">3、日出有盼，日落有思，<br>平平安安，所遇皆甜。</div>
            <div class="meaning-label">释义：</div>
            <div class="meaning-text">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。</div>
        </div>
    </div>
</div>

</body>
</html>
