<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&amp;family=Helvetica:wght@400;700&amp;display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            margin: 1in auto;
            max-width: 8.5in;
            line-height: 1.2;
            background: #fff;
        }
        
        .page {
            page-break-after: always;
            position: relative;
        }
        
        .text-block {
            margin-bottom: 0.3in;
            position: relative;
        }
        
        .text-line {
            position: relative;
            display: inline-block;
            white-space: pre-wrap;
        }
        
        .italic {
            font-style: italic;
        }
        
        .bold {
            font-weight: bold;
        }
        
        .placeholder {
            background: #f0f0f0;
            border: 2px dashed #999;
            color: #666;
            font-size: 0.8em;
            padding: 0.2em 0.5em;
            display: inline-block;
        }
        
        .header {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 0.4in;
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <span class="bold">[Header: centered title]</span>
    </div>
    
    <div class="text-block">
        <span class="text-line">[Text: first paragraph, left-aligned]</span><br>
        <span class="text-line">[Text: continuation of first paragraph]</span><br>
        <span class="text-line">[Text: second paragraph, left-aligned with indentation]</span>
    </div>
    
    <div class="text-block">
        <span class="text-line">[Text: third paragraph]</span>
    </div>
    
    <div class="placeholder" style="width: 3.5in; height: 1.5in; margin: 0.4in auto;">
        [Chart: left-aligned, vertical space]
    </div>
    
    <div class="text-block">
        <span class="text-line">[Text: paragraph after chart]</span>
    </div>
</div>

</body>
</html>
