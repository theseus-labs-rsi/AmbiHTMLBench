<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .page {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28pt;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }
        h2 {
            font-size: 22pt;
            margin-top: 30px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            font-size: 14pt;
            margin-bottom: 12px;
        }
        .placeholder {
            width: 300px;
            height: 200px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12pt;
            color: #666;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Document Title</h1>
        <p>This is a sample HTML conversion of a document image.</p>
        <p>Text extracted verbatim from the image.</p>
        
        <div class="placeholder">
            [Placeholder: image or chart here]
        </div>
        
        <p>Next section with heading.</p>
        <h2>Subheading</h2>
        <p>More text continues here.</p>
        
        <div class="placeholder">
            [Placeholder: diagram]
        </div>
        
        <p>Final paragraph of the document.</p>
    </div>
</body>
</html>
