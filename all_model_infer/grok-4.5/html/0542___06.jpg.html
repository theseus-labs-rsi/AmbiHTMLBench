<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap');
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Arial', sans-serif;
            line-height: 1.4;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background: #ffffff;
        }
        h1, h2, h3 {
            font-family: 'Arial', sans-serif;
            margin-bottom: 0.5em;
        }
        h1 {
            font-size: 24pt;
            text-align: center;
        }
        h2 {
            font-size: 18pt;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }
        .section {
            margin-bottom: 20px;
        }
        ul, ol {
            margin-left: 20px;
            margin-bottom: 10px;
        }
        li {
            margin-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .placeholder {
            border: 2px dashed #000;
            background-color: #f9f9f9;
            margin: 15px 0;
            padding: 20px;
            text-align: center;
            font-style: italic;
            color: #555;
        }
        .signature {
            margin-top: 30px;
            text-align: right;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 10pt;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>MAIN TITLE</h1>
    <h2>Section 1: Introduction</h2>
    <p>This is the body text of the document.</p>
    
    <div class="placeholder">[Chart: centered]</div>
    
    <h2>Section 2: Methods</h2>
    <p>Additional text here.</p>
    
    <table>
        <tr><th>Header 1</th><th>Header 2</th></tr>
        <tr><td>Cell 1</td><td>Cell 2</td></tr>
    </table>
    
    <p><strong>Bold text</strong> and <em>italic text</em>.</p>
    
    <div class="signature">
        Signature line here.
    </div>
    
    <div class="footer">
        Page 1 of 1 • Document converted from image
    </div>
</body>
</html>
