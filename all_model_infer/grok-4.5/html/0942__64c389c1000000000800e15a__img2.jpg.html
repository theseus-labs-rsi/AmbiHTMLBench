<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.5;
            background: white;
            color: black;
        }
        .placeholder {
            border: 2px dashed #999;
            background: #f0f0f0;
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .placeholder::before {
            content: "No image data provided in the query";
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .placeholder::after {
            content: "[No visual elements detected]";
            display: block;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        [No document image provided]
    </div>
</body>
</html>
