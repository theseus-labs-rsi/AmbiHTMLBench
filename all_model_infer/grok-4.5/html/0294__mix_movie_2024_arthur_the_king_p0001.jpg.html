<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur the King - Movie Poster</title>
<style>
    body {
        margin: 0;
        background-color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .poster {
        position: relative;
        width: 600px;
        height: 900px;
        background-color: #2c3e50;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .background-placeholder {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #87CEEB 0%, #228B22 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: rgba(255,255,255,0.3);
        font-size: 24px;
        text-align: center;
        z-index: 1;
    }
    .top-name {
        position: absolute;
        top: 40px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 28px;
        letter-spacing: 8px;
        font-weight: bold;
        z-index: 10;
    }
    .tagline {
        position: absolute;
        top: 320px;
        left: 60px;
        color: white;
        font-size: 14px;
        line-height: 1.4;
        font-weight: bold;
        z-index: 10;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .title-block {
        position: absolute;
        top: 380px;
        width: 100%;
        z-index: 10;
        color: #f4c430;
        font-weight: 900;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.6);
    }
    .title-1 {
        font-size: 80px;
        text-align: center;
        letter-spacing: 4px;
        margin: 0;
    }
    .title-2 {
        font-size: 60px;
        text-align: left;
        margin-left: 60px;
        margin-top: 10px;
        letter-spacing: 2px;
    }
    .title-3 {
        font-size: 60px;
        text-align: left;
        margin-left: 60px;
        margin-top: 10px;
        letter-spacing: 2px;
    }
    .bottom-right {
        position: absolute;
        bottom: 60px;
        right: 40px;
        color: white;
        text-align: right;
        font-size: 14px;
        line-height: 1.3;
        font-weight: bold;
        z-index: 10;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .bottom-right .coming-soon {
        margin-top: 15px;
        font-size: 12px;
        letter-spacing: 1px;
    }
    .bottom-right .lionsgate {
        font-size: 10px;
        margin-top: 2px;
        letter-spacing: 2px;
    }
    .rating-box {
        position: absolute;
        bottom: 40px;
        left: 40px;
        border: 1px solid white;
        padding: 5px 10px;
        color: white;
        font-size: 12px;
        font-weight: bold;
        z-index: 10;
        background: rgba(0,0,0,0.3);
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="background-placeholder">
            [Poster Background: Mark Wahlberg and Dog]
        </div>
        
        <div class="top-name">MARK WAHLBERG</div>
        
        <div class="tagline">
            AN UNEXPECTED ENCOUNTER<br>
            AN UNLIKELY BOND<br>
            AN UNFORGETTABLE ADVENTURE
        </div>
        
        <div class="title-block">
            <div class="title-1">ARTHUR</div>
            <div class="title-2">THE</div>
            <div class="title-3">KING</div>
        </div>
        
        <div class="bottom-right">
            BASED ON THE<br>
            INCREDIBLE TRUE STORY<br>
            <div class="coming-soon">COMING SOON</div>
            <div class="lionsgate">LIONSGATE</div>
        </div>
        
        <div class="rating-box">PG-13</div>
    </div>
</body>
</html>
