<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMEP Partisi - Asgari Ücret Poster</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #e8e8e8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .poster {
    width: 600px;
    background-color: #ffffff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .yellow-section {
    background-color: #ffd700;
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  
  .bullet-list {
    flex: 1;
  }
  
  .bullet-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: bold;
    color: #000000;
    line-height: 1.3;
  }
  
  .bullet-item:last-child {
    margin-bottom: 0;
  }
  
  .pin-icon {
    width: 24px;
    height: 24px;
    margin-right: 12px;
    margin-top: 4px;
    flex-shrink: 0;
  }
  
  .chart-placeholder {
    width: 200px;
    height: 200px;
    background-color: #ff8c00;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    margin-left: 20px;
  }
  
  .chart-placeholder::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 30px;
    width: 140px;
    height: 140px;
    background: linear-gradient(45deg, transparent 40%, #ff4444 40%, #ff4444 60%, transparent 60%);
    transform: rotate(-30deg);
  }
  
  .chart-placeholder::after {
    content: "1";
    position: absolute;
    bottom: 20px;
    left: 30px;
    width: 50px;
    height: 50px;
    background-color: #ffd700;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
  }
  
  .white-section {
    background-color: #ffffff;
    padding: 30px 40px;
    text-align: center;
  }
  
  .white-section-text {
    font-size: 36px;
    font-weight: bold;
    color: #cc0000;
    line-height: 1.3;
  }
  
  .red-banner {
    background-color: #cc0000;
    padding: 25px 40px;
    text-align: center;
  }
  
  .red-banner-text {
    font-size: 48px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 2px;
  }
  
  .bottom-section {
    background-color: #ffffff;
    padding: 30px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .logo-area {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
  }
  
  .logo-placeholder {
    width: 100px;
    height: 100px;
    background-color: #cc0000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 20px;
    position: relative;
  }
  
  .logo-placeholder::before {
    content: "";
    position: absolute;
    width: 80px;
    height: 80px;
    border: 8px solid #cc0000;
    border-radius: 50%;
    background-color: #ffd700;
  }
  
  .logo-text {
    font-size: 24px;
    font-weight: bold;
    color: #cc0000;
    position: relative;
    z-index: 1;
  }
  
  .party-info {
    text-align: center;
    margin-bottom: 20px;
  }
  
  .party-name {
    font-size: 28px;
    font-weight: bold;
    color: #cc0000;
    line-height: 1.2;
  }
  
  .party-subtitle {
    font-size: 18px;
    color: #cc0000;
    margin-top: 5px;
  }
  
  .contact-info {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    font-size: 16px;
    color: #cc0000;
  }
  
  .contact-item {
    display: flex;
    align-items: center;
  }
  
  .contact-icon {
    width: 24px;
    height: 24px;
    margin-right: 8px;
    background-color: #cc0000;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="yellow-section">
    <div class="bullet-list">
      <div class="bullet-item">
        <div class="pin-icon" style="background-color: #cc0000; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);"></div>
        <span>Enflasyon yükseliyor</span>
      </div>
      <div class="bullet-item">
        <div class="pin-icon" style="background-color: #cc0000; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);"></div>
        <span>TL değer kaybediyor</span>
      </div>
      <div class="bullet-item">
        <div class="pin-icon" style="background-color: #cc0000; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);"></div>
        <span>Ücretler eriyor</span>
      </div>
    </div>
    <div class="chart-placeholder">
      <div style="position: absolute; top: 20px; right: 20px; width: 100px; height: 100px; background: linear-gradient(45deg, #ff4444 0%, #ff4444 100%); clip-path: polygon(0 100%, 50% 50%, 100% 0, 100% 100%);"></div>
      <div style="position: absolute; bottom: 30px; left: 40px; width: 60px; height: 60px; background-color: #ffd700; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; color: #ffffff;">1</div>
      <div style="position: absolute; bottom: 30px; right: 30px; width: 80px; height: 40px; background-color: #ffd700; border: 3px solid #cc0000;"></div>
    </div>
  </div>
  
  <div class="white-section">
    <div class="white-section-text">Vergiden muaf,<br>İnsanca yaşanacak</div>
  </div>
  
  <div class="red-banner">
    <div class="red-banner-text">ASGARİ ÜCRET!</div>
  </div>
  
  <div class="bottom-section">
    <div class="logo-area">
      <div class="logo-placeholder">
        <span class="logo-text">EMEP</span>
      </div>
      <div class="party-info">
        <div class="party-name">EME K<br>PARTİSİ</div>
        <div class="party-subtitle">Ankara İl Örgütü</div>
      </div>
    </div>
    
    <div class="contact-info">
      <div class="contact-item">
        <div class="contact-icon">f</div>
        <span>/ankaraemep</span>
      </div>
      <div class="contact-item">
        <div class="contact-icon">O</div>
        <span>@emepankara</span>
      </div>
      <div class="contact-item">
        <div class="contact-icon">☎</div>
        <span>0 (312) 232 41 97</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
