<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;600&amp;display=swap');
        body {
            font-family: 'Times New Roman', serif;
            margin: 1in 1in;
            line-height: 1.2;
            color: black;
            max-width: 100%;
        }
        .header {
            text-align: center;
            font-size: 16pt;
            font-weight: 600;
            margin-bottom: 12pt;
        }
        .subheader {
            text-align: center;
            font-size: 12pt;
            margin-bottom: 20pt;
        }
        .section {
            font-size: 14pt;
            font-weight: 600;
            margin-top: 18pt;
            margin-bottom: 8pt;
        }
        .body-text {
            text-align: justify;
            font-size: 12pt;
            margin-bottom: 10pt;
        }
        .placeholder {
            width: 100%;
            height: 120px;
            background-color: #f0f0f0;
            border: 1px solid #999;
            margin: 12pt 0;
            text-align: center;
            line-height: 120px;
            font-style: italic;
            color: #666;
        }
        .placeholder-caption {
            font-size: 11pt;
            margin-top: 4pt;
        }
    </style>
</head>
<body>

    <div class="header">
        [Header: centered, large text]
    </div>
    
    <div class="subheader">
        [Subheader: centered]
    </div>

    <div class="section">
        Section Title
    </div>
    
    <div class="body-text">
        [Paragraph 1: body text]
    </div>
    
    <div class="body-text">
        [Paragraph 2: body text]
    </div>

    <div class="placeholder">
        [Diagram: centered in page]
    </div>
    <div class="placeholder-caption">[Diagram: centered]</div>

    <div class="section">
        Subsection
    </div>
    
    <div class="body-text">
        [Paragraph 3: body text]
    </div>

</body>
</html>
