<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            color: #000;
            line-height: 1.4;
        }
        h1, h2, h3 {
            font-weight: bold;
        }
        .placeholder {
            background-color: #f0f0f0;
            border: 1px dashed #aaa;
            text-align: center;
            padding: 20px;
            margin: 15px 0;
        }
        .placeholder span {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Untitled Document</h1>
    <p>[Document image content not provided]</p>
    <div class="placeholder">[No image content detected - input appears empty]</div>
</body>
</html>
