<!DOCTYPE html>
<html lang="en">
<head>

    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        body {
            font-family: 'Times New Roman', serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #000;
        }
        h1, h2 {
            font-family: 'Times New Roman', serif;
            text-align: center;
        }
        .placeholder {
            width: 100%;
            height: 300px;
            background-color: #f0f0f0;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-style: italic;
            text-align: center;
        }
        .placeholder::before {
            content: "[Placeholder: centered diagram]";
        }
    </style>
</head>
<body>

<h1>[Title if present]</h1>

    [Chart: bottom-left]
</div>

<p>[illegible]</p>
