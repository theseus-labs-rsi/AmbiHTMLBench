<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
    <style>
        body {
            font-family: "Times New Roman", serif;
            margin: 40px auto;
            max-width: 800px;
            line-height: 1.6;
            font-size: 14px;
        }
        .header {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 20px 0;
            font-style: italic;
            color: #666;
        }
        .column {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .col {
            flex: 1;
        }
        .indent {
            margin-left: 40px;
        }
    </style>
</head>
<body>
    <div class="header">[Centered Logo or Header]</div>
    
    <div class="column">
        <div class="col">
            <p><strong>[Header/Title]</strong></p>
            <p>[Body paragraph 1] Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <p>[Body paragraph 2]</p>
        </div>
        <div class="col">
            <p>Right column text here.</p>
        </div>
    </div>

    <div class="placeholder">[Chart: top-right]</div>

    <p>Body text continuing...</p>

    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
    </ul>

    <div class="placeholder">[Diagram: center]</div>

    <p>Footer or closing text.</p>
</body>
</html>
