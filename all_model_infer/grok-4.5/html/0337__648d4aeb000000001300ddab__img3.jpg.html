<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. 忽视你的需求，内耗你的精力</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #f5f7f6;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #5a8f7b;
    line-height: 1.75;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 640px;
    width: 100%;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }
  .title-badge {
    background-color: #3d9b7a;
    color: #ffffff;
    font-size: 20px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 40px;
    letter-spacing: 1px;
    line-height: 1.4;
  }
  .icon-wrap {
    flex-shrink: 0;
    margin-left: 20px;
  }
  .icon-wrap svg {
    width: 64px;
    height: 64px;
    display: block;
  }
  .content p {
    font-size: 17px;
    color: #5a9a82;
    margin-bottom: 22px;
    text-align: left;
  }
  .highlight {
    font-weight: 600;
  }
  .tip {
    display: flex;
    align-items: flex-start;
    margin: 28px 0;
    font-size: 17px;
    color: #5a9a82;
  }
  .tip .check {
    color: #3d9b7a;
    font-weight: bold;
    margin-right: 8px;
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1.6;
  }
  .tip .tip-text {
    line-height: 1.75;
  }
  .closing {
    font-size: 17px;
    color: #5a9a82;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-badge">3. 忽视你的需求，内耗你的精力</div>
      <div class="icon-wrap">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- Battery body -->
          <rect x="10" y="18" width="38" height="28" rx="4" ry="4" fill="none" stroke="#4a90d9" stroke-width="3.5"/>
          <!-- Battery tip -->
          <rect x="48" y="26" width="6" height="12" rx="2" ry="2" fill="#4a90d9"/>
          <!-- Lightning bolt -->
          <polygon points="32,22 24,34 30,34 26,46 40,30 33,30 38,22" fill="#e74c5e"/>
          <!-- Diagonal slash -->
          <line x1="14" y1="50" x2="50" y2="14" stroke="#2c3e50" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <p>这一种人，不仅可能是身边的朋友，亲密关系中也会出现。爱我们的人，也可能会“害”我们。</p>

      <p>忽视需求，是关系中隐藏的一把刀，对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>

      <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>

      <p>经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</p>

      <div class="tip">
        <span class="check">✓</span>
        <span class="tip-text">面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。</span>
      </div>

      <p class="closing">与人交往需要衡量，更需要智慧，愿你在前行路上<br>看清他人、做好自己。</p>
    </div>
  </div>
</body>
</html>
