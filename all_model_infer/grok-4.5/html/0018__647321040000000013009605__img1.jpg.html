<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAY3 特色路线</title>
<style>
    body {
        font-family: "Microsoft YaHei", sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 600px;
        height: 850px;
        background-color: #fff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    
    /* Header */
    .header-day {
        position: absolute;
        top: 10px;
        left: 20px;
        font-size: 40px;
        font-weight: 900;
        color: #ffcc00;
        text-shadow: 2px 2px 0px #ff9900;
        font-style: italic;
        z-index: 10;
    }
    .header-title {
        position: absolute;
        top: 15px;
        right: 20px;
        background-color: #ccff00;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 28px;
        font-weight: bold;
        color: #000;
        z-index: 10;
    }

    /* Placeholders for Images */
    .img-placeholder {
        background-color: #e0e0e0;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #666;
        font-size: 12px;
        width: 200px;
        height: 140px;
        position: absolute;
        box-sizing: border-box;
    }

    /* Labels and Pins */
    .label-pin {
        position: absolute;
        display: flex;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
        color: #333;
        background: rgba(255, 230, 200, 0.8);
        padding: 2px 8px;
        border-radius: 10px;
    }
    .pin-icon {
        color: #ff4444;
        margin-right: 5px;
        font-size: 18px;
    }

    /* Text Blocks */
    .text-block {
        position: absolute;
        font-size: 14px;
        line-height: 1.5;
        color: #444;
        width: 160px;
    }
    .text-purple {
        color: #663399;
        font-weight: bold;
    }

    /* Arrows SVG */
    .arrow-svg {
        position: absolute;
        pointer-events: none;
        z-index: 1;
    }
    .arrow-text {
        position: absolute;
        font-size: 14px;
        font-weight: bold;
        color: #ff6600;
        background: rgba(255,255,255,0.8);
        padding: 2px 5px;
        border-radius: 4px;
        z-index: 2;
    }

    /* Specific Positioning */
    /* Top Left: Naxianghai */
    .img-umbrella { top: 180px; left: 30px; }
    .label-naxianghai { top: 330px; left: 60px; }
    .text-art { top: 130px; left: 40px; width: 180px; text-align: center; }

    /* Top Right: Sunset */
    .img-sunset { top: 180px; right: 30px; }
    .label-sunset { top: 330px; right: 40px; }

    /* Middle Left: Jiming Island */
    .img-jiming { top: 420px; left: 30px; }
    .label-jiming { top: 570px; left: 60px; }
    .text-jiming { top: 600px; left: 30px; width: 180px; }

    /* Middle Right: Cableway */
    .img-cable { top: 420px; right: 30px; }
    .label-cable { top: 570px; right: 40px; }
    .text-cliff { top: 430px; left: 220px; width: 140px; text-align: center; }

    /* Bottom Center: Xiaowudui */
    .img-xiaowudui { top: 650px; left: 200px; }
    .label-xiaowudui { top: 800px; left: 220px; }
    .text-xiaowudui { top: 660px; right: 30px; width: 160px; text-align: right; }

</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-day">DAY3</div>
    <div class="header-title">3.特色路线</div>

    <!-- Top Left Section -->
    <div class="text-block text-purple" style="top: 120px; left: 40px; width: 180px; text-align: center;">艺术感满满，适合出片</div>
    <div class="img-placeholder img-umbrella">[Image: Beach umbrellas]</div>
    <div class="label-pin label-naxianghai"><span class="pin-icon">📍</span>那香海</div>

    <!-- Top Right Section -->
    <div class="img-placeholder img-sunset">[Image: Sunset over water]</div>
    <div class="label-pin label-sunset"><span class="pin-icon">📍</span>那香海落日</div>

    <!-- Middle Left Section -->
    <div class="img-placeholder img-jiming">[Image: Wind turbines on island]</div>
    <div class="label-pin label-jiming"><span class="pin-icon">📍</span>鸡鸣岛</div>
    <div class="text-block text-purple" style="top: 610px; left: 30px; width: 180px;">威海绝美海岸线<br>私藏童话般露营地</div>

    <!-- Middle Right Section -->
    <div class="text-block text-purple" style="top: 430px; left: 230px; width: 130px; text-align: center;">悬崖书吧、<br>婚礼教堂、<br>悬崖咖啡厅</div>
    <div class="img-placeholder img-cable">[Image: Cable car over sea]</div>
    <div class="label-pin label-cable"><span class="pin-icon">📍</span>摩天岭索道</div>

    <!-- Bottom Center Section -->
    <div class="img-placeholder img-xiaowudui">[Image: Wind turbines and houses]</div>
    <div class="label-pin label-xiaowudui"><span class="pin-icon">📍</span>小五队抱海驿站</div>
    <div class="text-block text-purple" style="top: 660px; right: 30px; width: 150px; text-align: right;">荡漾在山海间<br>看风景、吹海风、<br>享受时光</div>

    <!-- Arrows and Connection Text -->
    
    <!-- Arrow 1: Naxianghai -> Cableway (11 min) -->
    <svg class="arrow-svg" style="top: 340px; left: 180px; width: 150px; height: 100px;" viewBox="0 0 150 100">
        <path d="M 10 10 Q 80 100 140 90" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600" />
            </marker>
        </defs>
    </svg>
    <div class="arrow-text" style="top: 380px; left: 200px;">打车11分钟</div>

    <!-- Arrow 2: Sunset -> Cableway (33 min) -->
    <svg class="arrow-svg" style="top: 340px; right: 180px; width: 150px; height: 100px;" viewBox="0 0 150 100">
        <path d="M 140 10 Q 70 100 10 90" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead2)"/>
        <defs>
            <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600" />
            </marker>
        </defs>
    </svg>
    <div class="arrow-text" style="top: 380px; right: 200px;">打车33分钟</div>

    <!-- Arrow 3: Jiming Island -> Xiaowudui (5 min) -->
    <svg class="arrow-svg" style="top: 580px; left: 180px; width: 150px; height: 80px;" viewBox="0 0 150 80">
        <path d="M 10 10 Q 80 80 140 70" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead3)"/>
        <defs>
            <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600" />
            </marker>
        </defs>
    </svg>
    <div class="arrow-text" style="top: 620px; left: 200px;">打车5分钟</div>

    <!-- Arrow 4: Xiaowudui -> Cableway (20 min) -->
    <svg class="arrow-svg" style="top: 580px; right: 180px; width: 150px; height: 100px;" viewBox="0 0 150 100">
        <path d="M 140 90 Q 70 0 10 10" fill="none" stroke="#ff6600" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead4)"/>
        <defs>
            <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ff6600" />
            </marker>
        </defs>
    </svg>
    <div class="arrow-text" style="top: 600px; right: 200px;">打车20分钟</div>

</div>

</body>
</html>
