<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            font-family: 'Times New Roman', serif;
            margin: 2cm auto;
            padding: 2cm 1cm;
            max-width: 800px;
            line-height: 1.4;
            font-size: 12pt;
            background: white;
            color: black;
        }
        
        h1, h2 {
            font-family: 'Times New Roman', serif;
            font-weight: 700;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
        }
        
        h1 {
            font-size: 18pt;
            text-align: center;
        }
        
        h2 {
            font-size: 14pt;
            text-align: left;
        }
        
        p, li, div {
            font-size: 12pt;
            margin-bottom: 0.6em;
        }
        
        ul, ol {
            margin-left: 1.5em;
            margin-bottom: 0.8em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 12pt;
        }
        
        th, td {
            border: 1px solid black;
            padding: 0.3em;
            text-align: left;
        }
        
        .placeholder {
            width: 100%;
            height: 100px;
            background-color: #f0f0f0;
            border: 1px dashed #999;
            margin: 0.5em 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
            text-align: center;
        }
        
        .placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>Untitled Document</h1>
    <p>[Image content cannot be analyzed or converted to HTML due to lack of provided image data.]</p>
    <p>Please upload or embed the document image for OCR processing.</p>
</body>
</html>
