<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Into The Darkness - Poster</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chai.js"></script>
<style>
    body {
        margin: 0;
        background-color: #000;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .poster {
        width: 600px;
        background-color: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        position: relative;
    }
    .top-text {
        font-size: 18px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 20px;
        text-align: center;
    }
    .title {
        font-family: 'Times New Roman', Times, serif;
        font-size: 64px;
        font-weight: bold;
        color: #c0392b;
        text-align: center;
        line-height: 1.1;
        margin: 0 0 30px 0;
        text-transform: uppercase;
    }
    .image-container {
        width: 100%;
        height: 550px;
        position: relative;
        background: #111; /* Simulating the dark garage photo */
        overflow: hidden;
        border: 1px solid #333;
    }
    .placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #000 0%, #1a1a1a 50%, #000 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #555;
        font-size: 14px;
        text-align: center;
    }
    .sign {
        position: absolute;
        top: 38%;
        left: 50%;
        transform: translateX(-50%);
        background-color: #fff;
        color: #000;
        padding: 6px 12px;
        font-weight: bold;
        font-size: 16px;
        letter-spacing: 1px;
        border: 1px solid #000;
    }
    .bottom-info {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        z-index: 10;
    }
    .director {
        color: #c0392b;
        font-size: 20px;
        margin-bottom: 15px;
        font-weight: 500;
    }
    .details {
        color: #fff;
        font-size: 18px;
        line-height: 1.4;
    }
    .details p {
        margin: 5px 0;
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="top-text">SOULFUL FILM PRESENTS</div>
        <h1 class="title">INTO THE<br>DARKNESS</h1>
        
        <div class="image-container">
            <div class="placeholder">[Photo: Black and white image of a parking garage with a car and overhead lights]</div>
            <div class="sign">SELF PARK 6'-0" CLEARANCE</div>
            
            <div class="bottom-info">
                <div class="director">Directed by Levi Stanford</div>
                <div class="details">
                    <p>May 23, 2019 | 2:00 pm</p>
                    <p>Michael Hopper Auditorium</p>
                    <p>Oreixs university, OH</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
