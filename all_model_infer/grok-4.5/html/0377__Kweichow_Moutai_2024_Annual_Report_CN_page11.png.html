<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            line-height: 1.4;
        }
        .placeholder {
            width: 300px;
            height: 200px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #888;
            margin: 20px 0;
            position: relative;
        }
        .placeholder::after {
            content: "[Chart: bottom-left]";
            position: absolute;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="placeholder"></div>
</body>
</html>
