<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .document-container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .page {
            width: 100%;
            min-height: 100%;
            position: relative;
        }
        .text-block {
            font-size: 16px;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .placeholder {
            width: 200px;
            height: 150px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="document-container">
        <div class="page">
            <!-- Content extracted verbatim from document image -->
            <div class="text-block">[All visible text would be placed here verbatim if OCR were performed on the actual image file provided. The current query contains only the role description and no accompanying image or document content.]</div>
            
            <!-- Non-text elements would be represented as placeholders with exact spatial positioning -->
            <div class="placeholder">[Chart: bottom-left]</div>
            <div class="placeholder">[Diagram: centered]</div>
        </div>
    </div>
</body>
</html>
