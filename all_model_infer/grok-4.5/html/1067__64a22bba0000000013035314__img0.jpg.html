<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&family=Times+New+Roman:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #f9f9f9;
            font-family: 'Times New Roman', serif;
            line-height: 1.5;
            color: #000;
        }
        .document-container {
            width: 100%;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: white;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-family: 'Georgia', serif;
            font-size: 28pt;
            margin: 0 0 10px 0;
        }
        .header p {
            font-size: 14pt;
            margin: 5px 0;
        }
        .content {
            font-size: 12pt;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-family: 'Georgia', serif;
            font-size: 16pt;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            background-color: #eee;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #999;
            font-style: italic;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="document-container">
        <div class="header">
            <h1>Sample Document</h1>
            <p>Date: August 3, 2026</p>
            <p>Page 1 of 1</p>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">Introduction</div>
                <p>This is the first paragraph of the document.</p>
                <p>This is the second paragraph.</p>
            </div>
            
            <div class="section">
                <div class="section-title">Body Content</div>
                <p>Additional text follows.</p>
                <p>[illegible] text in the middle of the page.</p>
            </div>
        </div>
        
        <div class="placeholder">
            [Chart: centered at bottom]
        </div>
        
        <div class="content">
            <p>End of document.</p>
        </div>
    </div>
</body>
</html>
