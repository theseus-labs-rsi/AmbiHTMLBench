<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    padding: 20px;
    font-family: "KaiTi", "STKaiti", "SimKai", "FangSong", serif;
  }
  .page {
    width: 480px;
    min-height: 640px;
    background: 
      repeating-linear-gradient(0deg, transparent, transparent 27px, #a8c5d4 27px, #a8c5d4 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, #a8c5d4 27px, #a8c5d4 28px);
    background-color: #f7f9f4;
    background-size: 28px 28px;
    border: 1px solid #ccc;
    padding: 36px 30px 40px 20px;
    position: relative;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.15);
  }
  .title {
    text-align: center;
    color: #c0392b;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 28px;
    margin-top: 8px;
  }
  .section {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    margin-bottom: 22px;
  }
  .side-label {
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: #c0392b;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-right: 14px;
    margin-left: 4px;
    flex-shrink: 0;
    line-height: 1.3;
  }
  .content {
    flex: 1;
    padding-top: 2px;
  }
  .q-list {
    list-style: none;
    color: #c0392b;
    font-size: 16px;
    line-height: 1.85;
  }
  .q-list li {
    margin-bottom: 4px;
  }
  .formula-block {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    position: relative;
    margin-bottom: 18px;
  }
  .formula-items {
    flex: 1;
    font-size: 16px;
    color: #1a1a1a;
    line-height: 1.9;
  }
  .formula-items .num {
    font-weight: bold;
  }
  .formula-items .indent {
    padding-left: 1.6em;
  }
  .stamp {
    width: 64px;
    height: 64px;
    border: 3px solid #c0392b;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #c0392b;
    font-size: 22px;
    font-weight: bold;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 4px;
    position: absolute;
    right: 18px;
    top: 8px;
    background: rgba(192, 57, 43, 0.08);
    box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    font-family: "SimHei", "Heiti SC", sans-serif;
  }
  .koujue {
    margin-top: 10px;
    margin-left: 8px;
    font-size: 17px;
    color: #1a3a6b;
    letter-spacing: 2px;
  }
  .koujue .label {
    font-weight: bold;
  }
  .blank {
    display: inline-block;
    min-width: 3em;
    border-bottom: 1px solid #333;
    height: 1em;
    vertical-align: baseline;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title">句段结构作用好处赏析</div>

  <div class="section">
    <div class="side-label">常见问法</div>
    <div class="content">
      <ol class="q-list">
        <li>1.请分析这句话的作用是什么?</li>
        <li>2.这句话这样描写有什么好处?</li>
        <li>3.请分析这句话这样描写的表达效果.</li>
      </ol>
    </div>
  </div>

  <div class="formula-block">
    <div class="side-label">满分公式</div>
    <div class="content formula-items">
      <div><span class="num">①</span> 这是(　　)描写</div>
      <div class="indent">生动形象地写出(　　).</div>
      <div><span class="num">②</span> 更突出了(　　).</div>
      <div><span class="num">③</span> 前后文呼应/为后文(　　)做了铺垫</div>
    </div>
    <div class="stamp">李真</div>
  </div>

  <div class="koujue">
    <span class="label">口诀：</span>生动秀　感心头　勾勾手
  </div>
</div>
</body>
</html>
