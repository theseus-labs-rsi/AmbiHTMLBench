<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一张图搞定HMO</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background-color: #7ec8e3;
    background-image: 
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .poster {
    position: relative;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .title-banner {
    background: #ffffff;
    border: 3px solid #5ba3d9;
    border-radius: 50px;
    padding: 14px 36px;
    text-align: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.06);
    z-index: 2;
  }
  .title-banner h1 {
    font-size: 28px;
    font-weight: 800;
    color: #2a6fad;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .cow-placeholder {
    position: absolute;
    top: 8px;
    right: -10px;
    width: 90px;
    height: 100px;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.15));
  }
  .section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .blue-box {
    background: linear-gradient(180deg, #3db5e8 0%, #2a9fd4 100%);
    border-radius: 18px;
    padding: 18px 20px;
    color: #ffffff;
    font-size: 15px;
    line-height: 1.75;
    text-align: justify;
    box-shadow: 0 4px 10px rgba(0,80,140,0.2);
    width: 100%;
  }
  .blue-box .sup {
    font-size: 11px;
    vertical-align: super;
  }
  .orange-header {
    background: linear-gradient(180deg, #f5a623 0%, #e8940a 100%);
    border-radius: 50px;
    padding: 10px 28px;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 3px 8px rgba(180,100,0,0.25);
    width: 92%;
    margin-bottom: -2px;
    z-index: 1;
    letter-spacing: 0.5px;
  }
  .content-box {
    background: #ffffff;
    border-radius: 16px;
    padding: 22px 20px 18px;
    width: 100%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    margin-top: -8px;
  }
  .content-box p {
    font-size: 15px;
    line-height: 1.8;
    color: #333333;
    text-align: justify;
  }
  .ref {
    font-size: 11px;
    vertical-align: super;
    color: inherit;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="title-banner">
      <h1>一张图搞定HMO</h1>
    </div>
    <div class="cow-placeholder" title="cartoon cow">
      🐄
    </div>

    <div class="section">
      <div class="blue-box">
        HMO-中文“母乳低聚糖”，是源乳中的第一大免疫活性营养<span class="sup">*</span>，而且含量还是乳铁蛋白的12倍<span class="sup">#</span>，在牛乳、羊乳中都没有这个成分，被誉为“乳黄金”。
      </div>
    </div>

    <div class="section">
      <div class="orange-header">HMO具有调节肠道菌群平衡作用<span class="ref">3-6</span></div>
      <div class="content-box">
        <p>肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自于肠道，因此呵护好宝宝肠道对提升保护力非常重要。而HMO可以促进有益菌生长，提高保护力。</p>
      </div>
    </div>

    <div class="section">
      <div class="orange-header">HMO为宝宝建立一道健康防护屏障<span class="ref">5-6</span></div>
      <div class="content-box">
        <p>HMO能够为宝宝建立一道健康防护屏障，防止有害菌侵扰。</p>
      </div>
    </div>

    <div class="section">
      <div class="orange-header">HMO激发免疫系统，提高宝宝保护力<span class="ref">6</span></div>
      <div class="content-box">
        <p>HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝保护力，增强宝宝体质。<span class="ref">7-8</span></p>
      </div>
    </div>
  </div>
</body>
</html>
