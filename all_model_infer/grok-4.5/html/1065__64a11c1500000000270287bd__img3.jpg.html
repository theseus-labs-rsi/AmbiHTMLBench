<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: sans-serif;
            line-height: 1.4;
            font-size: 16px;
        }
        .document {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
        }
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            margin: 12px 0;
            text-align: left;
        }
        ul, ol {
            margin: 12px 0 12px 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        .placeholder {
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            border: 2px dashed #666;
            margin: 16px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            color: #666;
        }
        .centered {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="document">
        <h1>Untitled Document</h1>
        <p>This is a placeholder HTML document for OCR conversion purposes.</p>
        <div class="placeholder">[Chart: top-left]</div>
        <p>Extracted text would appear here verbatim.</p>
        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <table>
            <thead>
                <tr>
                    <th>Header</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Data</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
