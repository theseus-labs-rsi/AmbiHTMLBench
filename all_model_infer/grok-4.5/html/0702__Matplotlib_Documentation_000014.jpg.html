<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12pt;
            margin: 40px auto;
            max-width: 800px;
            line-height: 1.4;
            color: #000;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            border-top: 2px solid #000;
            padding-top: 10px;
            font-size: 10pt;
        }
        p {
            text-indent: 0;
            margin: 12px 0;
        }
        .placeholder {
            border: 1px dashed #888;
            background-color: #f9f9f9;
            text-align: center;
            padding: 20px 10px;
            margin: 20px 0;
            font-size: 10pt;
            color: #666;
        }
        .placeholder-caption {
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Document Title</h1>
    <p><strong>Date:</strong> [illegible] <strong>Page:</strong> 1</p>
</div>

<p><strong>Document</strong></p>

<div class="placeholder" style="width: 400px; height: 300px; margin: 20px auto;">
    [Diagram: centered]
</div>

<p>1. [illegible]</p>

<div class="placeholder" style="width: 450px; height: 200px; margin: 20px auto;">
    [Chart: bottom-left]
</div>

<p>2. [illegible]</p>

<p>3. [illegible]</p>

<div class="footer">
    Page 1 of [illegible]
</div>

</body>
</html>
