<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高效背书</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #5d7a63;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
    }

    .container {
        background-color: #ffffff;
        width: 100%;
        max-width: 480px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
    }

    .header {
        background-color: #5d7a63;
        color: white;
        text-align: center;
        padding: 12px 0;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .content {
        padding: 20px 24px;
        flex-grow: 1;
    }

    .section-title {
        color: #4a6b52;
        font-weight: bold;
        font-size: 18px;
        margin-top: 16px;
        margin-bottom: 8px;
    }

    .section-text {
        color: #333;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 12px;
    }

    .example-box {
        background-color: #f9f9f9;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        line-height: 1.8;
        color: #333;
    }

    .highlight {
        background-color: #ffff00;
        padding: 2px 4px;
        border-radius: 2px;
        font-weight: bold;
    }

    .footer-area {
        background-color: #ffffff;
        padding: 10px 20px 20px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #eee;
    }

    .footer-left {
        display: flex;
        align-items: center;
    }

    .character-placeholder {
        width: 50px;
        height: 50px;
        background-color: #eee;
        border-radius: 50%;
        margin-right: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
        color: #888;
        text-align: center;
    }

    .speech-bubble {
        background-color: #f0f0f0;
        padding: 10px 15px;
        border-radius: 15px;
        font-size: 14px;
        color: #333;
        position: relative;
        margin-right: 10px;
    }

    .speech-bubble::before {
        content: '';
        position: absolute;
        left: -8px;
        top: 50%;
        transform: translateY(-50%);
        border-width: 6px 8px 6px 0;
        border-style: solid;
        border-color: transparent #f0f0f0 transparent transparent;
    }

    .play-btn {
        width: 0;
        height: 0;
        border-top: 15px solid transparent;
        border-bottom: 15px solid transparent;
        border-left: 20px solid #5d7a63;
    }

    .watermark {
        text-align: right;
        font-size: 12px;
        color: #666;
        margin-top: 10px;
        padding-right: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">高效背书</div>
    
    <div class="content">
        <div class="section-title">01.理解背诵</div>
        <div class="section-text">还有几天考试，很多东西还没背。不要慌张，先理解再背诵，考试运用得心应手</div>

        <div class="section-title">02.关键复述</div>
        <div class="section-text">边读边画关键词，再把关键词抄在草稿纸上。把内容都遮住，然后就看自己写在草稿纸上的关键词，进行复述</div>

        <div class="example-box">
            <span class="highlight">原文</span>：德思礼夫妇总是得意地说他们是非常规矩的人家<br>
            <span class="highlight">关键</span>：德思礼夫妇 + 得意 + 非常规矩<br>
            <span class="highlight">复述</span>：德思礼夫妇得意地说他们是非常规矩的一家
        </div>

        <div class="section-title">03.关键背诵</div>
        <div class="section-text">这样就背关键词，考试的时候也能顺利展开内容</div>

        <div class="section-title">04.睡觉记忆</div>
        <div class="section-text">睡前30分钟再复习背诵的内容。睡醒后10分钟，再看关键词进行复述，并默写出来</div>
    </div>

    <div class="footer-area">
        <div class="footer-left">
            <div class="character-placeholder">[Character]</div>
            <div class="speech-bubble">这样背书，就像用了魔法，过目不忘</div>
        </div>
        <div class="play-btn"></div>
    </div>
    
    <div class="watermark">小红书号: 4141895475</div>
</div>

</body>
</html>
