<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指读 (Pointing Reading)</title>
<style>
    body {
        font-family: "Songti SC", "SimSun", serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    .page-container {
        background-color: #fff;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 50px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: relative;
    }
    .top-header {
        font-size: 14px;
        color: #666;
        margin-bottom: 10px;
        font-family: sans-serif;
    }
    .title-section {
        margin-bottom: 30px;
    }
    .sub-title-box {
        background-color: #e0e0e0;
        display: inline-block;
        padding: 4px 10px;
        font-size: 14px;
        margin-bottom: 5px;
        font-family: sans-serif;
    }
    .main-title-bar {
        background-color: #2c3e50;
        color: #fff;
        padding: 10px 15px;
        font-size: 24px;
        font-weight: bold;
        font-family: sans-serif;
        display: flex;
        align-items: center;
    }
    .main-title-bar span {
        font-size: 16px;
        font-weight: normal;
        margin-left: 10px;
        opacity: 0.9;
    }
    .step-box {
        background-color: #fff3e0;
        border: 2px solid #ff9800;
        padding: 8px 12px;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        display: inline-block;
        font-family: sans-serif;
    }
    .content-text {
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 20px;
        text-align: justify;
    }
    .highlight {
        background-color: #ffcc80;
        padding: 2px 0;
    }
    .bottom-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-top: 20px;
    }
    .bottom-text {
        width: 45%;
        font-size: 16px;
        line-height: 1.8;
    }
    .cat-placeholder {
        width: 250px;
        height: 200px;
        border: 1px dashed #ccc;
        background-color: #fafafa;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 12px;
        text-align: center;
        margin-left: 20px;
    }
    .side-tab {
        position: absolute;
        right: -10px;
        top: 150px;
        background-color: #333;
        color: #fff;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 4px 0 0 4px;
        font-family: sans-serif;
    }
</style>
</head>
<body>

<div class="page-container">
    <div class="top-header">平读 Plain reading</div>
    
    <div class="title-section">
        <div class="sub-title-box">用手指来指引读书的方向</div>
        <div class="main-title-bar">
            方法 40 <span>| 指读 (Pointing Reading)</span>
        </div>
    </div>

    <div class="step-box">① 用手指或是笔尖指着当前读到的位置</div>
    <div class="content-text">视线聚焦在手指或笔尖。</div>

    <div class="step-box">② 沿着阅读的方向移动手指或笔尖</div>
    <div class="content-text">
        一边往下读，一边移动手指或笔尖。此时视线依然聚焦在手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相<span class="highlight">同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。</span>
    </div>

    <div class="bottom-section">
        <div class="bottom-text">
            大家也可以试着将<br>
            这种方式与朗读结合起<br>
            来，将指着的内容出声<br>
            <span class="highlight">读出来。</span>
        </div>
        <div class="cat-placeholder">
            [Illustration: Cartoon cat reading a book]
        </div>
    </div>

    <div class="side-tab">方法 4</div>
</div>

</body>
</html>
