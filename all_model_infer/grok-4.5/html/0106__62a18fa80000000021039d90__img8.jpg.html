<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款？</title>
<style>
    body {
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        background-color: #fdf6f0;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        background-color: #ffffff;
        border: 4px solid #a8d5d8;
        border-radius: 15px;
        padding: 20px;
        max-width: 800px;
        width: 100%;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .main-title {
        text-align: center;
        font-size: 32px;
        font-weight: 900;
        color: #333;
        margin-bottom: 20px;
        background-color: #eef7f8;
        border: 2px solid #a8d5d8;
        border-radius: 10px;
        padding: 10px;
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
    }
    .section-title {
        font-size: 20px;
        font-weight: bold;
        color: #333;
        margin: 20px 0 10px 0;
        display: flex;
        align-items: center;
    }
    .section-title .icon {
        margin-right: 8px;
        font-size: 24px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
        font-size: 16px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 12px 8px;
        text-align: center;
        vertical-align: middle;
    }
    .table-1 th {
        background-color: #6c757d;
        color: white;
        font-weight: bold;
    }
    .table-2 th {
        background-color: #2c5f63;
        color: white;
        font-weight: bold;
    }
    .highlight-row {
        position: relative;
    }
    .circle-annotation {
        position: absolute;
        border: 2px solid red;
        border-radius: 50%;
        pointer-events: none;
    }
    .text-annotation {
        position: absolute;
        font-size: 14px;
        color: #333;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.8);
        padding: 2px 5px;
        border-radius: 4px;
        pointer-events: none;
    }
    .summary-box {
        background-color: #d9534f;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 16px;
        margin-left: 15px;
        display: inline-block;
        vertical-align: middle;
    }
    .red-text {
        color: #d9534f;
        font-weight: bold;
    }
    .green-check {
        color: #28a745;
        font-weight: bold;
        margin-left: 5px;
    }
    .blue-icon {
        color: #007bff;
        margin-right: 5px;
    }
    .row-3mm-cell {
        font-size: 18px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <div class="main-title">猫砂都有哪些款？</div>

    <div class="section-title">
        <span class="icon">📍</span>三种猫砂尺寸哪个是你最爱
    </div>

    <table class="table-1">
        <thead>
            <tr>
                <th>尺寸</th>
                <th>重量</th>
                <th>结团效果</th>
                <th>其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.5mm</td>
                <td>轻</td>
                <td>上</td>
                <td>易带出，价格略高</td>
            </tr>
            <tr class="highlight-row">
                <td>2mm</td>
                <td>中</td>
                <td>中</td>
                <td>综合性价比高</td>
                <!-- Annotation for 2mm -->
                <div class="circle-annotation" style="left: 10px; top: 10px; width: 60px; height: 40px;"></div>
                <div class="text-annotation" style="left: 80px; top: 25px;">综合性价比推荐</div>
            </tr>
            <tr>
                <td>3mm</td>
                <td>重</td>
                <td class="row-3mm-cell">67</td>
                <td>推荐度低，但价格也低</td>
            </tr>
        </tbody>
    </table>

    <div class="section-title">
        <span class="icon">📍</span>猫砂都有哪些种类
        <span class="summary-box">总结：2mm混合砂yyds</span>
    </div>

    <table class="table-2">
        <thead>
            <tr>
                <th>种类</th>
                <th>优点</th>
                <th>其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>膨润土</td>
                <td>价格低廉</td>
                <td>粉尘大</td>
            </tr>
            <tr>
                <td>豆腐猫砂</td>
                <td>原料更安全，闻起来也比较好</td>
                <td>价格偏高，纯豆腐结团略差</td>
            </tr>
            <tr class="highlight-row">
                <td>混合猫砂</td>
                <td>结合上述优点，价格适中</td>
                <td>比例推荐 <span class="red-text">7:3或6:4</span>，结团快且用量省</td>
                <!-- Annotation for 混合猫砂 -->
                <div class="circle-annotation" style="left: 10px; top: 10px; width: 70px; height: 40px;"></div>
                <div class="text-annotation" style="left: 90px; top: 25px;"><span class="blue-icon">ℹ️</span>普通养宠家庭足以满足需求<span class="green-check">✅</span></div>
            </tr>
            <tr>
                <td>沸石</td>
                <td>可循环利用</td>
                <td>需要自己洗</td>
            </tr>
            <tr>
                <td>其他新型原料</td>
                <td>价格高，新颖</td>
                <td>效果待考核，贵</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
