<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<style>
    body {
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        color: #333;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
        background-color: #FF8C00;
        padding: 20px 30px;
        position: relative;
        height: 140px;
        box-sizing: border-box;
    }
    .header-left {
        position: absolute;
        top: 20px;
        left: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .copyright {
        font-size: 24px;
        color: #fff;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .diamonds {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .diamond {
        width: 6px;
        height: 6px;
        background-color: #fff;
        transform: rotate(45deg);
    }
    .header-title {
        font-size: 60px;
        font-weight: 900;
        color: #000;
        text-align: center;
        line-height: 1.2;
        margin-top: 10px;
        letter-spacing: 2px;
    }
    .header-year {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 24px;
        font-weight: bold;
        color: #000;
    }
    .header-sign {
        position: absolute;
        bottom: 15px;
        right: 30px;
        font-size: 20px;
        font-weight: bold;
        color: #000;
    }
    .intro {
        padding: 20px 40px;
        font-size: 14px;
        line-height: 1.6;
        color: #555;
        text-align: justify;
    }
    .card {
        margin: 20px 40px;
        border: 2px solid #FF8C00;
        border-radius: 20px;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .card-title {
        font-size: 20px;
        font-weight: bold;
        color: #000;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
    }
    .card-title .diamond {
        background-color: #FF8C00;
        margin-left: 8px;
        width: 8px;
        height: 8px;
    }
    .placeholder {
        width: 100%;
        height: 150px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        font-size: 14px;
        font-weight: bold;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        box-sizing: border-box;
        padding: 10px;
        text-align: center;
    }
    .placeholder-1 {
        background: linear-gradient(90deg, #2E8B57 0%, #2E8B57 30%, #FFD700 30%, #FFD700 60%, #0055A4 60%, #0055A4 100%);
    }
    .placeholder-2 {
        background: linear-gradient(90deg, #9ACD32 0%, #9ACD32 30%, #000000 30%, #000000 60%, #FF3366 60%, #FF3366 100%);
    }
    .card-caption {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
        text-align: justify;
    }
    .footer-strip {
        height: 20px;
        background-color: #FF8C00;
        margin-top: 20px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="copyright">C</div>
            <div class="diamonds">
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
            </div>
        </div>
        <div class="header-year">2023</div>
        <div class="header-title">对比色配色</div>
        <div class="header-sign">瑞</div>
    </div>

    <div class="intro">
        对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
    </div>

    <div class="card">
        <div class="card-title">富有朝气的配色 <span class="diamond"></span></div>
        <div class="placeholder placeholder-1">[Color Block: Green, Yellow, Blue]</div>
        <div class="card-caption">
            以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
        </div>
    </div>

    <div class="card">
        <div class="card-title">视觉冲击强烈的配色 <span class="diamond"></span></div>
        <div class="placeholder placeholder-2">[Color Block: Green, Black, Pink]</div>
        <div class="card-caption">
            黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
        </div>
    </div>

    <div class="footer-strip"></div>
</div>
</body>
</html>
