<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 - 调整所得税</title>
<style>
    body {
        font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
        background-color: #f4e4bc;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        background-color: #fffaf0;
        border: 2px solid #d4b895;
        border-radius: 20px;
        width: 100%;
        max-width: 600px;
        padding: 30px 20px;
        box-sizing: border-box;
        position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .header {
        text-align: center;
        color: #6b4c35;
        margin-bottom: 20px;
    }
    .header h1 {
        margin: 0;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
    }
    .header h2 {
        margin: 10px 0 0 0;
        font-size: 24px;
        font-weight: bold;
    }
    .header .paw {
        font-size: 20px;
        color: #d4a373;
    }
    .highlight-box {
        background-color: #f9e79f;
        color: #6b4c35;
        padding: 8px 20px;
        border-radius: 15px;
        font-weight: bold;
        font-size: 18px;
        display: inline-block;
        margin-bottom: 25px;
        box-shadow: 2px 2px 0px #e8d5a3;
    }
    .section-title {
        font-weight: bold;
        font-size: 16px;
        color: #4a3b32;
        margin-bottom: 10px;
        margin-top: 15px;
    }
    .calc-row {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        position: relative;
    }
    .values {
        font-size: 15px;
        color: #4a3b32;
        width: 120px;
        line-height: 1.6;
    }
    .brace-container {
        display: flex;
        align-items: center;
        width: 200px;
        margin-left: 10px;
    }
    .brace {
        border-left: 3px solid #85c1e9;
        border-radius: 10px;
        height: 40px;
        margin-right: 10px;
    }
    .calc-text {
        font-size: 14px;
        color: #4a3b32;
        line-height: 1.4;
    }
    .group-info {
        margin-left: auto;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        color: #4a3b32;
        width: 100px;
    }
    .arrow-container {
        position: absolute;
        right: 20px;
        top: 140px;
        width: 40px;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }
    .arrow {
        width: 6px;
        height: 100%;
        background-color: #5dade2;
        border-radius: 3px;
        position: relative;
    }
    .arrow::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: -7px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #5dade2 transparent transparent transparent;
    }
    .accounting-entry {
        margin-top: 30px;
        text-align: center;
        font-size: 16px;
        color: #6b4c35;
        line-height: 1.8;
    }
    .footer-cats {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
        padding: 0 10px;
    }
    .cat-placeholder {
        width: 100px;
        height: 100px;
        background-color: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        color: #aaa;
        border: 1px dashed #ccc;
        border-radius: 10px;
    }
    .cat-left {
        margin-left: 10px;
    }
    .cat-right {
        margin-right: 10px;
    }
    .step-num {
        display: inline-block;
        border: 2px solid #6b4c35;
        border-radius: 50%;
        padding: 0 6px;
        font-size: 20px;
        line-height: 1.2;
        margin: 0 4px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="paw">🐾</div>
        <h1>内部交易抵销</h1>
        <h2>第<span class="step-num">3</span>步：调整所得税</h2>
        <div class="paw">🐾</div>
    </div>

    <div style="text-align: center;">
        <div class="highlight-box">若实现60%对外销售</div>
    </div>

    <div class="section-title">个别报表层面因为存货跌价准备：</div>
    <div class="calc-row">
        <div class="values">
            账面价值 900<br>
            计税基础 1200
        </div>
        <div class="brace-container">
            <div class="brace"></div>
            <div class="calc-text">递延所得税资产300*25%=75</div>
        </div>
        <div class="group-info">
            【集团角度】<br>
            调增25
        </div>
    </div>

    <div class="arrow-container">
        <div class="arrow"></div>
    </div>

    <div class="section-title">合并报表层面因为存货跌价准备：</div>
    <div class="calc-row">
        <div class="values">
            账面价值800<br>
            计税基础1200
        </div>
        <div class="brace-container">
            <div class="brace"></div>
            <div class="calc-text">递延所得税资产400*25%=100</div>
        </div>
    </div>

    <div class="accounting-entry">
        会计处理：借：递延所得税资产25<br>
        贷：所得税费用25
    </div>

    <div class="footer-cats">
        <div class="cat-placeholder cat-left">[Image: Sleeping Cat]</div>
        <div class="cat-placeholder cat-right">[Image: Standing Cat with Hat]</div>
    </div>
</div>

</body>
</html>
