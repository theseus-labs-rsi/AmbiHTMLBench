<!DOCTYPE html>

<title>2017年 12月第一套 Text 1 板书</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: #4a4340;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .screen-frame {
    position: relative;
    width: 540px;
    height: 405px;
    margin: 0 auto;
    background: #1b1b1b;
    border: 6px solid #2b2724;
    box-sizing: border-box;
    padding: 8px;
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background: #f2f1ef;
    box-sizing: border-box;
    overflow: hidden;
  }
  .status-bar {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 8px;
    color: #333;
    letter-spacing: 0.5px;
  }
  .placeholder {
    background: #ded9d4;
    border: 1px solid #b5aca4;
    color: #4a4340;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
  }
  .cam {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 96px;
    height: 62px;
  }
  .ctrl {
    position: absolute;
    top: 8px;
    left: 156px;
    width: 40px;
    height: 26px;
    border-radius: 6px;
  }
  .red {
    color: #d02020;
  }
  .content {
    position: absolute;
    top: 72px;
    left: 0;
    width: 100%;
  }
  .line {
    font-size: 12px;
    margin: 0 0 14px 0;
  }
  .l-head { margin-left: 82px; }
  .l1 { margin-left: 82px; }
  .title {
    color: #1a1a1a;
    font-size: 21px;
    text-align: center;
    letter-spacing: 1px;
    margin: 6px 0 16px 0;
    padding-left: 30px;
  }
  .row2 {
    margin-left: 92px;
  }
  .row2 .note {
    margin-left: 22px;
    font-size: 11px;
  }
  .underline {
    border-bottom: 1.5px solid #d02020;
    padding-bottom: 1px;
  }
  .two-col {
    display: flex;
    margin-left: 92px;
  }
  .two-col .left { width: 190px; }
  .two-col .right { width: 200px; }
  .l3 { margin-left: 14px; }
  .l4 { margin-left: 6px; }
  .l5 { margin-left: 6px; }

<div class="screen-frame">
  <div class="board">
    <div class="status-bar">19:29　5月14日周五</div>

    <div class="placeholder cam">[视频画面: 人物, 右上角]</div>

    <div class="content">
      <p class="line red l-head">固化的做题思维：</p>
      <p class="line red l1">1. 喜欢忠于自己的内心和感觉。</p>

      <p class="title">2017年 12月第一套 Text 1</p>

      <div class="row2 line red">
        <span>2. 喜欢选符合<span class="underline">常识的选项。</span></span>
        <span class="note">20年左右的常识和经验的累积</span>
      </div>

      <div class="two-col">
        <div class="left">
          <p class="line red l3">3. 喜欢选自己认识的选项。</p>
          <p class="line red l4">4. 喜欢选自己不认识的选项。</p>
          <p class="line red l5">5. 火急火燎一把火</p>
        </div>
        <div class="right">
          <p class="line red r6">6. 囫囵吞枣选择法</p>
          <p class="line red r6b">（有逃避，有厌烦）</p>

      </div>
    </div>
