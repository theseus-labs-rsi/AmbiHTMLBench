<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房注意事项</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #cfd9c4;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #e8efe0;
    box-sizing: border-box;
    padding: 30px 22px 40px 22px;
    overflow: hidden;
  }
  h1 {
    text-align: center;
    font-size: 30px;
    color: #2f6b3d;
    margin: 8px 0 26px 0;
    letter-spacing: 2px;
    font-weight: bold;
  }
  .section-title {
    display: inline-block;
    font-size: 25px;
    font-weight: bold;
    color: #111;
    border-bottom: 3px solid #d94b3a;
    padding-bottom: 2px;
    margin: 6px 0 12px 0;
  }
  .bullet {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 5px solid #d94b3a;
    border-radius: 50%;
    box-sizing: border-box;
    margin-right: 6px;
    vertical-align: -2px;
  }
  .item {
    font-size: 19px;
    line-height: 1.95;
    color: #1a1a1a;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .row-two span:first-child { margin-right: 26px; }
  .watermark {
    position: absolute;
    top: 285px;
    left: 200px;
    color: rgba(255,255,255,0.75);
    font-size: 17px;
    line-height: 1.5;
    pointer-events: none;
  }
  .placeholder {
    position: absolute;
    border: 1px dashed #b9c4ae;
    color: #7f8a76;
    font-size: 11px;
    text-align: center;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(255,255,255,0.15);
  }
  .ph-cat { width: 130px; height: 175px; right: 10px; top: 365px; }
  .ph-leaves { width: 60px; height: 200px; right: 0; top: 150px; }
  .ph-bamboo { width: 200px; height: 40px; left: 150px; bottom: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>租房注意事项</h1>

  <div><span class="bullet"></span><span class="section-title">卧室</span></div>

  <p class="item">1.空调是否正常使用，空调排水位置，外机位置</p>
  <p class="item">2.所有电灯，插座是否ok</p>
  <p class="item">3.床都否OK，躺下翻身是否有响声</p>
  <p class="item">4.卧室地板情况</p>
  <p class="item">5.衣柜是否完好</p>
  <p class="item">6.各个房间是否能反锁</p>
  <p class="item">7.装修情况，不要太新，也不要太久</p>
  <p class="item">8.排查针孔摄像头</p>
  <p class="item">9.wifi信号情况</p>

  <div><span class="bullet"></span><span class="section-title">其他</span></div>

  <p class="item row-two"><span>1.各类遥控器清点</span><span>2.所有钥匙清点</span></p>
  <p class="item">3.所有墙面情况，有无裂痕掉漆，脱皮</p>
  <p class="item">4.所有水龙头一起打开，看水压是否足够</p>
  <p class="item">5.如果是燃气热水器，也留意下安全使用情况</p>

  <div class="watermark">@带毛的栗子<br>From 小红书</div>

  <figure class="placeholder ph-leaves">[Decoration: leaves, right edge]</figure>
  <figure class="placeholder ph-cat">[Illustration: cartoon cat, right side]</figure>
  <figure class="placeholder ph-bamboo">[Decoration: bamboo, bottom center]</figure>
</div>
</body>
</html>
