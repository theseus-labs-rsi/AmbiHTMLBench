<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我介绍 SELF INTRODUCTION</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #cfe9d8 0%, #eef7ec 25%, #fdf7d0 55%, #fbe38a 100%);
  }
  .slide {
    position: relative;
    width: 540px;
    height: 304px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ===== Title zone ===== */
  .title-zone {
    text-align: center;
    padding-top: 14px;
  }
  .ribbon {
    display: inline-block;
    background: #f0983c;
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 3px;
    padding: 4px 22px;
    border-radius: 3px;
  }
  .subtitle {
    margin-top: 6px;
    color: #ffffff;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: bold;
  }

  /* ===== White card ===== */
  .card {
    position: absolute;
    top: 86px;
    left: 18px;
    right: 18px;
    bottom: 6px;
    background: #ffffff;
    border-radius: 14px 14px 0 0;
    padding: 14px 18px;
  }

  /* ===== Upper row: info | bubble | photo ===== */
  .upper {
    display: flex;
    align-items: flex-start;
    height: 104px;
  }
  .info {
    width: 132px;
    padding-top: 8px;
    padding-left: 6px;
    font-size: 12px;
    line-height: 2.1;
  }
  .info .label {
    color: #f0983c;
    font-weight: bold;
  }
  .info .value {
    color: #555555;
  }

  .bubble-wrap {
    position: relative;
    flex: 1;
    padding-top: 2px;
  }
  .bubble {
    background: #f7c243;
    color: #ffffff;
    font-size: 9.5px;
    line-height: 1.7;
    border-radius: 42% 42% 45% 45% / 34%;
    padding: 8px 18px 10px 18px;
    text-align: left;
  }
  .bubble .bubble-title {
    display: block;
    text-align: center;
    font-weight: bold;
    font-size: 11px;
    margin-bottom: 2px;
  }
  .bubble-tail {
    position: absolute;
    left: 6px;
    bottom: -8px;
  }
  .bubble-tail i {
    display: block;
    background: #f7c243;
    border-radius: 50%;
  }
  .bubble-tail i.b1 { width: 12px; height: 12px; margin-left: 10px; }
  .bubble-tail i.b2 { width: 7px;  height: 7px;  margin-left: 2px; margin-top: 2px; }

  .placeholder {
    width: 92px;
    height: 100px;
    margin-left: 6px;
    background: #ef4136;
    color: #ffffff;
    font-size: 8px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    padding-bottom: 3px;
  }

  /* ===== Lower paragraph zone ===== */
  .body-text {
    margin-top: 12px;
    padding: 0 26px 0 34px;
    font-size: 11px;
    line-height: 1.85;
    color: #4a4a4a;
    text-align: justify;
  }
  .body-text p { margin: 0 0 4px 0; }
  .body-text p.indent { text-indent: 2em; }
</style>
</head>
<body>
<div class="slide">

  <div class="title-zone">
    <div class="ribbon">自我介绍</div>
    <div class="subtitle">SELF&nbsp;&nbsp;INTRODUCTION</div>
  </div>

  <div class="card">

    <div class="upper">

      <div class="info">
        <div><span class="label">姓名：</span><span class="value">咸鱼</span></div>
        <div><span class="label">年龄：</span><span class="value">20</span></div>
        <div><span class="label">爱好：</span><span class="value">看电影、打游戏</span></div>
      </div>

      <div class="bubble-wrap">
        <div class="bubble">
          <span class="bubble-title">工作目标：</span>
          1.学习好专业知识，同时广泛涉及其他专业知识。<br>
          2.尽量多争取一些等级证书，这不仅是能力的证明，也是就业的有力武器。
        </div>
        <div class="bubble-tail">
          <i class="b1"></i>
          <i class="b2"></i>
        </div>
      </div>

      <figure class="placeholder">[Photo: portrait of a person, right side]</figure>

    </div>

    <div class="body-text">
      <p class="indent">大家好，我叫咸鱼，来自山东青岛。</p>
      <p class="indent">本人性格沉稳、细致、观体，发挥所长。在工作上，细致入微，认真负责。具有很好的团队合作精神，注重团体的利益，集体意识很强。能够与人充分合作，充分听取他人的意见和建议，并不断进步。观察力强、上进心强而能与人融和，易于沟通，能够快速地融入工作团队及成员给出良好的意见。</p>
    </div>

  </div>

</div>
</body>
</html>
