<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当题自中出现"原则"时，可用以下模板</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #2b2b2b;
    background-image: radial-gradient(#3a3a3a 1px, transparent 1px);
    background-size: 4px 4px;
    color: #f2f2f2;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    position: relative;
    max-width: 540px;
    margin: 0 auto;
    padding: 40px 22px 40px 24px;
    box-sizing: border-box;
    overflow: hidden;
  }
  h1.title {
    color: #ffb100;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.75;
    margin: 0 0 22px 0;
    letter-spacing: 0.5px;
  }
  .body-text p {
    font-size: 22px;
    line-height: 1.85;
    margin: 0 0 14px 0;
    letter-spacing: 0.5px;
  }
  .watermark {
    position: absolute;
    color: rgba(120, 190, 120, 0.30);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 4px;
    transform: rotate(-18deg);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }
  .wm1 { top: 350px; left: 150px; }
  .wm2 { top: 530px; left: 130px; }
</style>
</head>
<body>
<div class="page">

  <h1 class="title">7.当题自中出现“原则”时，可用以下模板：</h1>

  <div class="body-text">
    <p>(一)教育性原则 。…体现教育目标，有利于幼儿身的全面发展</p>
    <p>(二)个别差异性原则 。每个幼儿不一样，教师要因材施教</p>
    <p>（三）科学性原则 。…能给幼儿正确的启蒙教育</p>
    <p>(四)发展适宜性原则 。考虑到不同年龄阶段孩子的特点</p>
    <p>（五）整体性原则 。考虑到多方面的要素，促进幼儿整体的发展</p>
    <p>（六）活动性原则 。注重幼儿亲身体验，直接参与，以各种游戏活动为主</p>
  </div>

  <div class="watermark wm1">琳子幼资</div>
  <div class="watermark wm2">琳子幼资</div>

</div>
</body>
</html>
