<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #333;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #ffffff;
  }
  .header {
    background: #5f7161;
    color: #ffffff;
    text-align: center;
    padding: 14px 0 16px;
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .header .sub {
    margin-top: 8px;
    font-size: 13px;
    color: #e8ece8;
  }
  table.guide {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.guide col.c1 { width: 17%; }
  table.guide col.c2 { width: 41%; }
  table.guide col.c3 { width: 25%; }
  table.guide col.c4 { width: 17%; }
  table.guide th {
    background: #edf1ec;
    color: #4a5c4d;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 4px;
    border: 1px solid #cdd6cd;
  }
  table.guide td {
    border: 1px solid #cdd6cd;
    padding: 14px 10px;
    font-size: 13.5px;
    line-height: 1.9;
    vertical-align: middle;
  }
  td.tool {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    color: #333;
  }
  td.tool .must {
    display: block;
    color: #d94a3d;
    font-size: 13px;
    font-weight: 700;
    margin-top: 2px;
  }
  td.use { text-align: left; }
  td.advice { text-align: center; }
  td.pic { text-align: center; padding: 6px; }
  .placeholder {
    display: inline-block;
    width: 76px;
    height: 60px;
    border: 1px dashed #b9c2b9;
    background: #fafbfa;
    color: #8a938a;
    font-size: 9px;
    line-height: 1.2;
    text-align: center;
    padding: 4px 2px;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>钩针工具选择指南</h1>
    <div class="sub">——only手作集——</div>
  </div>

  <table class="guide">
    <colgroup>
      <col class="c1"><col class="c2"><col class="c3"><col class="c4">
    </colgroup>
    <thead>
      <tr>
        <th>工具</th>
        <th>用途</th>
        <th>初学者建议</th>
        <th>实物图</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="tool">钩针<span class="must">（必备）</span></td>
        <td class="use">钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》</td>
        <td class="advice">3mm左右的钩针最实用</td>
        <td class="pic"><div class="placeholder">[Photo: 彩色钩针实物图]</div></td>
      </tr>
      <tr>
        <td class="tool">毛线<span class="must">（必备）</span></td>
        <td class="use">毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》</td>
        <td class="advice">中粗的宝宝棉/牛奶棉</td>
        <td class="pic"><div class="placeholder">[Photo: 篮子里的彩色毛线球]</div></td>
      </tr>
      <tr>
        <td class="tool">剪刀<span class="must">（必备）</span></td>
        <td class="use">剪断编织过程中的编织线</td>
        <td class="advice">必备</td>
        <td class="pic"><div class="placeholder">[Photo: 手工剪刀]</div></td>
      </tr>
      <tr>
        <td class="tool">缝合针</td>
        <td class="use">缝合、修补和连接编织面料</td>
        <td class="advice">非必须</td>
        <td class="pic"><div class="placeholder">[Photo: 彩色塑料缝合针]</div></td>
      </tr>
    </tbody>
  </table>

</div>
</body>
</html>
