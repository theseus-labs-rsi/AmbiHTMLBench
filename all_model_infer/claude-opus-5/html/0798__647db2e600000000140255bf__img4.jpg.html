<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新手佩戴水晶常见30个问题</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #d9dcdf;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
  }
  .card {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: linear-gradient(160deg, #fbfbfa 0%, #f4f2ef 60%, #eceae6 100%);
    border: 10px solid #e3e5e6;
    box-shadow: 0 0 0 2px #cfd2d4, 0 8px 24px rgba(0,0,0,0.35);
    box-sizing: border-box;
    padding: 22px 26px 30px 26px;
    overflow: hidden;
  }
  h1.title {
    text-align: center;
    margin: 6px 0 0 0;
    font-size: 40px;
    font-weight: bold;
    color: #2b2b2b;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #ffffff;
  }
  h1.title .line2 {
    display: block;
    margin-top: 8px;
  }
  .num30 {
    color: #c0392b;
    font-size: 46px;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 14px 0 18px 0;
  }
  .divider .bar {
    height: 3px;
    background: #b5651d;
    flex: 1;
  }
  .divider .knot {
    width: 40px;
    height: 18px;
    border: 3px solid #b5651d;
    margin: 0 6px;
    background: #f7f5f2;
  }
  .qa {
    margin-bottom: 18px;
  }
  .q {
    font-size: 25px;
    font-weight: bold;
    font-style: italic;
    color: #1f1f1f;
    margin: 0 0 8px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .q span.qtext { display: inline-block; }
  .a {
    font-size: 19px;
    color: #3a3a3a;
    line-height: 1.55;
    margin: 0;
  }
  .a .item {
    display: block;
  }
  .marker {
    display: inline-block;
    width: 17px;
    height: 17px;
    line-height: 17px;
    text-align: center;
    background: #4a7fc1;
    color: #fff;
    font-size: 12px;
    font-family: Arial, Helvetica, sans-serif;
    margin-right: 6px;
    vertical-align: 2px;
  }
  /* stone image placeholders */
  .placeholder {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #cfcfcf 45%, #9c9c9c 100%);
    font-size: 7px;
    color: #555;
    text-align: center;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .stone1 { width: 46px; height: 46px; margin-left: 10px; }
  .stone2 { width: 46px; height: 46px; margin-left: 10px; }
  .stone3 { width: 46px; height: 46px; margin-left: 10px; }
  .stone4 { width: 56px; height: 56px; margin-left: 10px; }
</style>
</head>
<body>
<div class="card">

  <h1 class="title">新手佩戴水晶<span class="line2">常见<span class="num30">30</span>个问题</span></h1>

  <div class="divider">
    <div class="bar"></div>
    <div class="knot"></div>
    <div class="bar"></div>
  </div>

  <div class="qa">
    <div class="q">
      <span class="qtext">Q:水晶戴左手还是右手?</span>
      <figure class="placeholder stone1" style="margin:0 0 0 10px;">[Photo: 圆形水晶珠]</figure>
    </div>
    <p class="a">
      <span class="item"><span class="marker">1</span>黄水晶、草莓晶、紫水晶、海蓝宝、粉晶、</span>
      <span class="item" style="padding-left:0;">月光石、萤石等常佩戴在左手;</span>
      <span class="item"><span class="marker">2</span>黑/银曜石、白水晶、虎眼石等常佩戴在右手。</span>
    </p>
  </div>

  <div class="qa">
    <div class="q">
      <span class="qtext">Q:哪些水晶不能碰水?</span>
      <figure class="placeholder stone2" style="margin:0 0 0 10px;">[Photo: 红色水晶珠]</figure>
    </div>
    <p class="a">
      太阳石、方解石、萤石、孔雀石、天青石<br>
      青金石、海纹石、月光石、天河石、绿松石<br>
      蓝铜矿、蓝晶石、堇青石、紫龙晶、紫锂辉石<br>
      透石膏、灰月光、赤铁矿、紫锂云母
    </p>
  </div>

  <div class="qa">
    <div class="q">
      <span class="qtext">Q:水晶怎么消磁?</span>
      <figure class="placeholder stone3" style="margin:0 0 0 10px;">[Photo: 粉色水晶珠]</figure>
    </div>
    <p class="a">
      碎石消磁、海盐消磁、鼠尾草消磁、月光消磁<br>
      流水消磁
    </p>
  </div>

  <div class="qa">
    <div class="q">
      <span class="qtext">Q:不佩戴水晶的时候放哪里?</span>
      <figure class="placeholder stone4" style="margin:0 0 0 10px;">[Photo: 花斑水晶球]</figure>
    </div>
    <p class="a">
      <span class="item"><span class="marker">1</span>可以放在装有消磁石的盒子里存放起来;</span>
      <span class="item"><span class="marker">2</span>可以放在水晶簇或水晶洞里面;</span>
      <span class="item"><span class="marker">3</span>可以放一个软布在木盒,然后将水晶放里面。</span>
    </p>
  </div>

</div>
</body>
</html>
