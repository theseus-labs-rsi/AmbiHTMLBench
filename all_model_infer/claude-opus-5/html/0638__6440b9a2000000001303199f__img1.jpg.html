<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f0e4;
    font-family: "Songti SC", "SimSun", "STSong", serif;
    color: #5c5240;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    position: relative;
    background: #f4f1e5;
    min-height: 760px;
  }
  /* top nav bar */
  .navbar {
    display: flex;
    align-items: stretch;
    height: 20px;
    font-size: 11px;
    background: #efeadb;
    color: #8a7f68;
    border-bottom: 1px solid #ddd6c2;
  }
  .navbar .item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .navbar .item.first { padding-left: 8px; }
  .navbar .active {
    background: #b8ab8e;
    color: #fdfcf6;
    padding: 0 22px;
  }
  .navbar .spacer { flex: 1; }

  h1.title {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 4px;
    color: #6b6250;
    margin: 12px 0 10px 12px;
  }
  h1.title .dot { font-size: 10px; }

  .grid-bg {
    background-color: #f7f4ea;
    background-image:
      linear-gradient(to right, rgba(214,206,184,0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(214,206,184,0.35) 1px, transparent 1px);
    background-size: 15px 15px;
  }

  table.sheet {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    letter-spacing: 2px;
  }
  table.sheet td {
    border: 1px solid #ddd7c4;
    color: #6b6250;
    vertical-align: top;
  }
  .label-cell {
    background: #eae5d5;
    padding: 6px 8px 6px 12px;
    height: 30px;
    white-space: nowrap;
    vertical-align: middle;
  }
  .label-vert {
    background: #eae5d5;
    width: 68px;
    text-align: left;
    padding-left: 12px;
    vertical-align: middle;
  }
  .radio {
    display: inline-block;
    width: 9px;
    height: 9px;
    border: 1px solid #b9b09a;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  .opt-list {
    background: #eae5d5;
    width: 68px;
    padding: 8px 0 8px 10px;
    vertical-align: top;
  }
  .opt-list div {
    margin: 7px 0;
    font-size: 11px;
    letter-spacing: 2px;
  }
  .head-cell {
    background: #f2eee0;
    text-align: center;
    height: 24px;
    vertical-align: middle;
    letter-spacing: 2px;
  }
  .big-write { height: 215px; }
  .mid-write { height: 68px; }
  .note-row { height: 30px; }

  .footer-note {
    text-align: center;
    font-size: 7px;
    color: #cfc7b1;
    letter-spacing: 3px;
    padding: 8px 0 4px;
  }
  .watermark {
    position: absolute;
    right: 6px;
    bottom: 4px;
    font-size: 12px;
    color: #b6ad97;
    letter-spacing: 1px;
  }
  .watermark .logo {
    display: inline-block;
    background: #b6ad97;
    color: #f4f1e5;
    border-radius: 3px;
    padding: 0 3px;
    font-size: 11px;
    margin-right: 2px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="navbar">
    <div class="item first">行测</div>
    <div class="item">&gt;</div>
    <div class="item">常识</div>
    <div class="item">言语</div>
    <div class="item">数量</div>
    <div class="item">判断</div>
    <div class="item">资料</div>
    <div class="spacer"></div>
    <div class="item active">申论</div>
    <div class="item">纸张</div>
    <div class="item">计划</div>
  </div>

  <h1 class="title"><span class="dot">·</span> 晨 读 笔 记</h1>

  <table class="sheet">
    <tr>
      <td class="label-cell" colspan="3">主 题</td>
    </tr>
    <tr>
      <td class="label-cell" colspan="3">应 用 领 域</td>
    </tr>
    <tr>
      <td class="label-cell" colspan="3">热 门 事 件</td>
    </tr>
    <tr>
      <td class="label-cell" colspan="3">宏 观 政 策</td>
    </tr>
    <tr>
      <td class="label-cell" colspan="3">媒 体 评 论</td>
    </tr>
    <tr>
      <td class="opt-list">
        <div><span class="radio"></span>意 义</div>
        <div><span class="radio"></span>原 因</div>
        <div><span class="radio"></span>问 题</div>
        <div><span class="radio"></span>危 害</div>
      </td>
      <td class="grid-bg" colspan="2" style="height:105px;"></td>
    </tr>
    <tr>
      <td class="head-cell"><span class="radio"></span>问 题 分 析</td>
      <td class="head-cell"><span class="radio"></span>原 因 分 析</td>
      <td class="head-cell">对 策 分 析</td>
    </tr>
    <tr>
      <td class="grid-bg big-write" colspan="2"></td>
      <td class="grid-bg big-write"></td>
    </tr>
    <tr>
      <td class="label-vert">句 子 迁 移</td>
      <td class="grid-bg mid-write" colspan="2"></td>
    </tr>
    <tr>
      <td class="label-vert">方 法 迁 移</td>
      <td class="grid-bg mid-write" colspan="2"></td>
    </tr>
    <tr>
      <td class="label-cell note-row" colspan="3">备 注</td>
    </tr>
  </table>

  <div class="footer-note">· FEE MEMORIES ·</div>

  <div class="watermark"><span class="logo">Fb</span>脸笔</div>
</div>
</body>
</html>
