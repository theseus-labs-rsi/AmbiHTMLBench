<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一月-任务</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body {
    font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
    color: #000;
  }
  .slide {
    width: 540px;
    height: 405px;
    margin: 0 auto;
    position: relative;
    background: #fff;
    box-sizing: border-box;
  }
  .title {
    position: absolute;
    top: 55px;
    left: 22px;
    font-size: 25px;
    font-weight: normal;
    color: #262626;
    letter-spacing: 1px;
  }
  table.tasks {
    position: absolute;
    top: 110px;
    left: 22px;
    width: 496px;
    border-collapse: collapse;
    font-size: 9.5px;
  }
  table.tasks td, table.tasks th {
    border: 1px solid #9fb8d4;
    text-align: center;
    vertical-align: middle;
    height: 29px;
    padding: 0 2px;
    font-weight: normal;
  }
  table.tasks thead td {
    font-weight: bold;
    font-size: 10px;
    background: #ffffff;
  }
  tr.shaded td {
    background: #dce6f1;
  }
  /* column widths */
  .c1 { width: 42px; }
  .c2 { width: 105px; }
  .c3 { width: 62px; }
  .c4 { width: 132px; }
  .c5 { width: 70px; }
  .c6 { width: 85px; }
</style>
</head>
<body>
<div class="slide">
  <div class="title">一月-任务</div>

  <table class="tasks">
    <thead>
      <tr>
        <td class="c1">序号</td>
        <td class="c2">任务描述</td>
        <td class="c3">岗位</td>
        <td class="c4">操作动作</td>
        <td class="c5">开始时间</td>
        <td class="c6">备注</td>
      </tr>
    </thead>
    <tbody>
      <tr class="shaded">
        <td>1</td>
        <td>租厂房</td>
        <td>总经理</td>
        <td>申请60w 租厂房</td>
        <td>1月1日</td>
        <td>花60w租A厂房</td>
      </tr>
      <tr>
        <td>2</td>
        <td>资质开发</td>
        <td>总经理</td>
        <td>P3资质开发</td>
        <td>1月1日</td>
        <td>申请20w 资质开发</td>
      </tr>
      <tr class="shaded">
        <td>3</td>
        <td>批拨款</td>
        <td>财务</td>
        <td>批准</td>
        <td>1月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>4</td>
        <td>支付管理费</td>
        <td>财务</td>
        <td>5w管理费</td>
        <td>1月1日</td>
        <td></td>
      </tr>
      <tr class="shaded">
        <td>5</td>
        <td>建设生产线</td>
        <td>生产</td>
        <td>4条自动线生产P3</td>
        <td>1月1日</td>
        <td>申请200w资金建线</td>
      </tr>
      <tr>
        <td>6</td>
        <td>iso开发</td>
        <td>总经理</td>
        <td>两个iso的开发</td>
        <td>1月1日</td>
        <td>申请资金开发</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
