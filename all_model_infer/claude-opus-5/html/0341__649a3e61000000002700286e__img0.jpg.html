<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生感悟三则</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #f2f1ec;
    }
    body {
        font-family: "Kaiti SC", "KaiTi", "STKaiti", "SimSun", serif;
        color: #1a1a1a;
    }
    .page {
        width: 540px;
        min-height: 720px;
        margin: 0 auto;
        background: #f2f1ec;
        box-sizing: border-box;
        padding: 26px 24px 18px 24px;
        position: relative;
        display: flex;
        flex-direction: column;
    }
    p.para {
        font-size: 25px;
        line-height: 1.62;
        margin: 0 0 30px 0;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
    .teal {
        color: #4f8a80;
    }
    .footer {
        margin-top: auto;
        text-align: center;
        font-size: 21px;
        color: #4f8a80;
        font-weight: 600;
        letter-spacing: 1px;
        padding-top: 20px;
    }
    .footer span.sep {
        color: #4f8a80;
        margin: 0 8px;
        font-weight: 400;
    }
</style>
</head>
<body>
<div class="page">

    <p class="para">
        1、<span class="teal">你开始炫耀自己，往往都是灾难的开始。</span>就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
    </p>

    <p class="para">
        2、一个冷知识：<span class="teal">屏蔽力是一个人最顶级的能力</span>，任何消耗你的人和事，多看一眼都是你的不对。
    </p>

    <p class="para">
        3、大学时辅导员说了一句受益一生的话：<span class="teal">“你不用变得很外向，内向挺好的，但需要你发言的时候，一定要勇敢。”</span>正所谓：君子可内敛不可懦弱，面不公可起而论之。
    </p>

    <div class="footer">
        商业思维<span class="sep">|</span>底层逻辑<span class="sep">|</span>个人提升
    </div>

</div>
</body>
</html>
