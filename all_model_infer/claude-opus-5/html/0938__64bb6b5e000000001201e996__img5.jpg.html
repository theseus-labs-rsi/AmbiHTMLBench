<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takumi Sen9 VS Streakfly 跑鞋对比</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    color: #000;
  }
  .page {
    position: relative;
    width: 540px;
    margin: 0 auto;
    background: #fff;
  }
  /* central vertical divider line */
  .page::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: #000;
    transform: translateX(-50%);
    z-index: 0;
  }

  /* ---------- Header row: logos + brand text ---------- */
  .header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 78px;
    padding: 8px 22px 0 22px;
    background: #fff;
  }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    line-height: 1.2;
    color: #666;
    border: 1px dashed #bbb;
    background: #fafafa;
  }
  .logo-adidas { width: 96px; height: 52px; }
  .logo-nike { width: 108px; height: 44px; }

  .brand {
    text-align: center;
    flex: 0 0 auto;
  }
  .brand .cn {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .brand .en {
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 4px;
    color: #222;
  }

  /* ---------- Shoes row with VS ---------- */
  .shoes {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 150px;
    padding: 0 6px;
    background: #fff;
  }
  .shoe-left { width: 248px; height: 132px; }
  .shoe-right { width: 248px; height: 132px; }
  .vs {
    position: absolute;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
    z-index: 3;
    font-size: 44px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -1px;
    color: #000;
    background: #fff;
    padding: 0 6px;
  }

  /* ---------- Spec comparison rows ---------- */
  .specs {
    position: relative;
    z-index: 2;
    padding: 30px 0 40px 0;
  }
  .row {
    display: flex;
    align-items: baseline;
    margin: 0 0 21px 0;
  }
  .row .left {
    width: 50%;
    text-align: right;
    padding-right: 12px;
  }
  .row .right {
    width: 50%;
    text-align: left;
    padding-left: 12px;
  }
  .row.single {
    justify-content: center;
  }
  .row.single .center {
    text-align: center;
  }
  .val {
    font-size: 22px;
    letter-spacing: 1.5px;
    font-family: "Courier New", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
  }
  .val.cn {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    letter-spacing: 1px;
  }
  .val.small {
    font-size: 20px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header: brand logos and account name -->
  <div class="header">
    <figure class="placeholder logo-adidas" style="margin:0;">[Logo: adidas three-stripes, top-left]</figure>
    <div class="brand">
      <div class="cn">奔跑的小小宇</div>
      <div class="en">RUNNING XIAOYU</div>
    </div>
    <figure class="placeholder logo-nike" style="margin:0;">[Logo: Nike Swoosh, top-right]</figure>
  </div>

  <!-- Product photos with VS badge -->
  <div class="shoes">
    <figure class="placeholder shoe-left" style="margin:0;">[Photo: adidas Takumi Sen9 running shoe, left side]</figure>
    <div class="vs">VS</div>
    <figure class="placeholder shoe-right" style="margin:0;">[Photo: Nike Streakfly running shoe, right side]</figure>
  </div>

  <!-- Spec comparison -->
  <div class="specs">

    <div class="row single">
      <div class="center val">5-10KM</div>
    </div>

    <div class="row">
      <div class="left val">Takumi Sen9</div>
      <div class="right val">Streakfly</div>
    </div>

    <div class="row">
      <div class="left val">181g</div>
      <div class="right val">165g</div>
    </div>

    <div class="row">
      <div class="left val">(27/33) 6mm</div>
      <div class="right val">8mm (26/32)</div>
    </div>

    <div class="row">
      <div class="left val small">LIGHTWEIGHT MESH</div>
      <div class="right val cn">织物鞋面</div>
    </div>

    <div class="row">
      <div class="left val">Lightstrike Pro</div>
      <div class="right val">ZoomX</div>
    </div>

    <div class="row">
      <div class="left val small">ENERGYROD玻纤柱</div>
      <div class="right val cn">半掌碳板</div>
    </div>

    <div class="row">
      <div class="left val">Continental™</div>
      <div class="right val cn">贴片橡胶</div>
    </div>

    <div class="row">
      <div class="left val">1499</div>
      <div class="right val">999</div>
    </div>

  </div>
</div>
</body>
</html>
