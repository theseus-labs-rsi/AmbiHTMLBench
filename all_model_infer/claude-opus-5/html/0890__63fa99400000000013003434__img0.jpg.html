<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句摘抄 — 坚持奋斗主题</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #cdc2b0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #241f1c;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #cdc2b0;
  }

  /* ---------- Header band ---------- */
  .header {
    background: #f3ece2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 16px 30px;
  }
  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .masthead .cn {
    font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
    font-size: 60px;
    font-weight: 700;
    color: #c0272d;
    letter-spacing: 2px;
    line-height: 1;
  }
  .masthead .pinyin {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #b8563f;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }
  .tagline {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #2b2523;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .tagline .divider {
    display: inline-block;
    width: 2px;
    height: 26px;
    background: #2b2523;
  }
  .theme {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #2b2523;
    border-top: 2px solid #2b2523;
    border-bottom: 2px solid #2b2523;
    padding: 6px 2px 8px 2px;
  }

  /* ---------- Body content ---------- */
  .content { padding: 26px 30px 34px 30px; }

  .quote {
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.35;
    letter-spacing: 1px;
    color: #241f1c;
  }
  .quote.second { font-size: 39px; }

  .label {
    margin-top: 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .example {
    margin-top: 14px;
    font-size: 15.5px;
    line-height: 1.85;
    letter-spacing: 0.5px;
  }

  .gap-large { height: 46px; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="masthead">
      <div class="cn">人民日报</div>
      <div class="pinyin">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="tagline"><span>金句</span><span class="divider"></span><span>摘抄</span></div>
      <div class="theme">坚持奋斗主题</div>
    </div>
  </div>

  <div class="content">

    <div class="quote">
      夜色难免黑凉<br>
      前行必有曙光
    </div>

    <div class="label">举例:</div>
    <div class="example">
      夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
    </div>

    <div class="gap-large"></div>

    <div class="quote second">
      道固远，&nbsp;笃行可至<br>
      事虽巨，&nbsp;坚为必成
    </div>

    <div class="label">举例:</div>
    <div class="example">
      道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
    </div>

  </div>
</div>
</body>
</html>
