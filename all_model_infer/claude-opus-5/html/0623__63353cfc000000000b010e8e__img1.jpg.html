<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 VS 快手 - 产品小课堂</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5d9a0;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    color: #3b2412;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #f5d9a0;
    padding: 40px 34px 30px 34px;
  }

  /* Title block */
  .title-wrap {
    position: relative;
    text-align: center;
    height: 72px;
    margin-bottom: 22px;
  }
  .title-bar {
    position: absolute;
    left: 88px;
    top: 8px;
    width: 366px;
    height: 46px;
    background: #f0b93f;
  }
  .title-text {
    position: relative;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #4a2a10;
    line-height: 72px;
  }

  /* Sub banner with brush */
  .banner-row {
    position: relative;
    height: 62px;
    margin: 0 0 40px 0;
  }
  .banner {
    position: absolute;
    left: 70px;
    top: 0;
    width: 372px;
    height: 56px;
    background: #ffe6b0;
    border: 2px solid #6b3f18;
    border-radius: 28px;
    box-shadow: 5px 5px 0 #c98a2e;
    text-align: center;
    line-height: 52px;
    font-size: 26px;
    font-weight: 800;
    color: #4a2a10;
    letter-spacing: 2px;
  }
  .placeholder {
    background: rgba(255,255,255,0.35);
    border: 1px dashed #a9762f;
    font-size: 9px;
    color: #7a5220;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    line-height: 1.1;
  }
  .brush {
    position: absolute;
    left: 6px;
    top: -34px;
    width: 66px;
    height: 96px;
    transform: rotate(-12deg);
  }

  /* Section headings */
  .section-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 0 0 16px 0;
  }
  .num-badge {
    width: 74px;
    height: 40px;
    background: #4a2410;
    color: #ffffff;
    border-radius: 20px;
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .head-text {
    position: relative;
    font-size: 24px;
    font-weight: 800;
    color: #2f1a0a;
    padding: 0 4px 4px 4px;
  }
  .head-text::after {
    content: "";
    position: absolute;
    left: 0;
    right: -34px;
    bottom: 0;
    height: 9px;
    background: #f0c15c;
    z-index: -1;
  }
  .head-text span { position: relative; z-index: 1; }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 46px;
  }
  th {
    background: #f0b93f;
    color: #4a2a10;
    font-weight: 700;
    padding: 6px 4px;
    text-align: center;
    border-bottom: 1px solid #d9a03a;
  }
  td {
    background: #fdeedb;
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid #ecd6bb;
    line-height: 1.45;
  }
  td.rowlabel {
    font-weight: 700;
    text-align: left;
    padding-left: 8px;
    width: 96px;
  }
  table.t3 col.c1 { width: 96px; }
  table.t4 td.rowlabel { width: 108px; }

  /* Bottom dashes */
  .dashes {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 54px;
    text-align: center;
    color: #f0b93f;
    font-size: 20px;
    letter-spacing: 4px;
    font-weight: 800;
  }
  .bottom-bar {
    position: absolute;
    left: 34px;
    right: 34px;
    bottom: 0;
    height: 28px;
    background: #f0c15c;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-wrap">
    <div class="title-bar"></div>
    <div class="title-text">抖音 VS 快手</div>
  </div>

  <div class="banner-row">
    <figure class="placeholder brush" style="margin:0;">[Image: paintbrush, top-left]</figure>
    <div class="banner">产品小课堂</div>
  </div>

  <div class="section-head">
    <div class="num-badge">03</div>
    <div class="head-text"><span>抖音与快手</span></div>
  </div>

  <table class="t3">
    <colgroup>
      <col class="c1"><col><col><col><col>
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th>slogan</th>
        <th>产品定位</th>
        <th>策略</th>
        <th>变现</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="rowlabel">抖音</td>
        <td>记录美好生活</td>
        <td>短视频媒体</td>
        <td>以优质内容为中心</td>
        <td>广告收入、电商</td>
      </tr>
      <tr>
        <td class="rowlabel">快手</td>
        <td>拥抱每一种生活</td>
        <td>短视频社区</td>
        <td>以社交中心，大部分流量</td>
        <td>直播收入、电商</td>
      </tr>
    </tbody>
  </table>

  <div class="section-head">
    <div class="num-badge">04</div>
    <div class="head-text"><span>抖音电商与快手电商</span></div>
  </div>

  <table class="t4">
    <thead>
      <tr>
        <th></th>
        <th>产品定位</th>
        <th>重点指标</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="rowlabel">抖音电商</td>
        <td>兴趣逻辑，内容场景刺激需求</td>
        <td>直播间GPM</td>
      </tr>
      <tr>
        <td class="rowlabel">快手电商</td>
        <td>信任逻辑，头部主播优势</td>
        <td>复购</td>
      </tr>
    </tbody>
  </table>

  <div class="dashes">— — — — — — —</div>
  <div class="bottom-bar"></div>

</div>
</body>
</html>
