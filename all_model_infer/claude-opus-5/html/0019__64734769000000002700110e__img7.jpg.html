<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 10px 14px 20px;
    background: #ffffff;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    color: #111;
    width: 550px;

  /* ---------- Header bar ---------- */
  .header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 14px;
  }
  .header-bar {
    background: #000;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 5px 14px 5px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .header-bar .diamond { font-size: 11px; }

  /* ---------- Section title ---------- */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: bold;
    margin: 0 0 14px 4px;
  }
  .section-title .arrow { font-size: 13px; }

  /* ---------- Card grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 16px;
  }
  .card {
    border: 1px dashed #444;
    padding: 10px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .brand-logo {
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 8px;
    color: #222;
  }
  .brand-logo .small {
    font-size: 8px;
    letter-spacing: 1px;
    line-height: 1.1;
    margin-right: 4px;
    text-align: center;
  }
  .brand-logo .sub {
    font-size: 7px;
    letter-spacing: 2px;
    color: #666;
  }
  .logo-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
  }

  /* ---------- Image placeholders ---------- */
  .placeholder {
    width: 100%;
    height: 200px;
    background: #f1efec;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: #888;
    padding: 4px;
    line-height: 1.4;
  }
  .card-4 .placeholder,
  .card-3 .placeholder { height: 205px; }

  .brand-name {
    color: #c00000;
    font-weight: bold;
    font-size: 13px;
    margin: 10px 0 6px;
    text-align: center;

    line-height: 1.7;
