<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗六首</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 14px;
    background: #f7c98a;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #f7c98a;
    gap: 6px;
    border: 6px solid #f7c98a;
  }
  .cell {
    background: #ffffff;
    padding: 14px 10px 18px;
    text-align: center;
    box-sizing: border-box;
  }
  .title {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 4px 0 2px;
  }
  .author {
    font-size: 16px;
    text-align: right;
    margin: 0 8px 10px 0;
  }
  .poem {
    font-size: 22px;
    line-height: 1.55;
    text-align: center;
  }
</style>
</head>
<body>

<div class="grid">

  <div class="cell">
    <div class="title">《登鹳雀楼》</div>
    <div class="author">(唐-王之涣)</div>
    <div class="poem">
      白日依山尽,<br>
      黄河入海流。<br>
      欲穷千里目,<br>
      更上一层楼。
    </div>
  </div>

  <div class="cell">
    <div class="title">《静夜思》</div>
    <div class="author">(唐-李白)</div>
    <div class="poem">
      床前明月光,<br>
      疑是地上霜。<br>
      举头望明月,<br>
      低头思故乡。
    </div>
  </div>

  <div class="cell">
    <div class="title">《古朗月行》</div>
    <div class="author">(唐-李白)</div>
    <div class="poem">
      小时不识月,<br>
      呼作白玉盘。<br>
      又疑瑶台镜,<br>
      飞在青云端。
    </div>
  </div>

  <div class="cell">
    <div class="title">《寻隐者不遇》</div>
    <div class="author">(唐-贾岛)</div>
    <div class="poem">
      松下问童子,<br>
      言师采药去。<br>
      只在此山中,<br>
      云深不知处。
    </div>
  </div>

  <div class="cell">
    <div class="title">《咏鹅》</div>
    <div class="author">(唐-骆宾王)</div>
    <div class="poem">
      鹅鹅鹅,<br>
      曲项向天歌。<br>
      白毛浮绿水,<br>
      红掌拨清波。
    </div>
  </div>

  <div class="cell">
    <div class="title">《草》</div>
    <div class="author">(唐-白居易)</div>
    <div class="poem">
      离离原上草,<br>
      一岁一枯荣。<br>
      野火烧不尽,<br>
      春风吹又生。
    </div>
  </div>

</div>

</body>
</html>
