<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After the Hunt — Movie Poster</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #d8d8d8;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .poster {
    position: relative;
    width: 510px;
    height: 756px;
    background: #efece5;
    overflow: hidden;
  }

  /* ---- Tagline (top-left) ---- */
  .tagline {
    position: absolute;
    top: 18px;
    left: 26px;
    width: 260px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.5;
    color: #2b2b2b;
    text-transform: uppercase;
  }

  /* ---- Photo collage zone ---- */
  .collage {
    position: absolute;
    top: 55px;
    left: 26px;
    width: 458px;
    height: 495px;
  }
  .placeholder {
    position: absolute;
    background: #cfcabf;
    border: 1px dashed #9a9384;
    color: #4a4438;
    font-size: 10px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    padding: 4px;
    line-height: 1.3;
  }
  /* Michael Stuhlbarg — top-left panel */
  .ph-man-left { top: 0; left: 0; width: 155px; height: 145px; }
  /* Julia Roberts — top-center panel */
  .ph-woman-center { top: 0; left: 155px; width: 175px; height: 300px; }
  /* Ayo Edebiri — top-right panel */
  .ph-woman-right { top: 40px; left: 330px; width: 128px; height: 290px; }
  /* Coat / lower-left panel */
  .ph-coat { top: 300px; left: 100px; width: 175px; height: 195px; }
  /* Andrew Garfield — lower-right panel */
  .ph-man-right { top: 330px; left: 275px; width: 183px; height: 165px; }

  /* ---- Title block (overlaid, left of center) ---- */
  .title-block {
    position: absolute;
    top: 200px;
    left: 55px;
    width: 200px;
    border: 1px solid #7a6a4f;
    background: #efece5;
    padding: 12px 10px 14px;
    text-align: center;
  }
  .director-top {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #7a5c33;
    margin-bottom: 14px;
  }
  .title-line {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.30em;
    color: #1f1f1f;
    line-height: 1.55;
    text-indent: 0.30em;
  }
  .credits {
    position: absolute;
    top: 338px;
    left: 58px;
    width: 210px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.6;
    color: #2b2b2b;
    text-transform: uppercase;
  }

  /* ---- Cast billing (bottom-center) ---- */
  .cast {
    position: absolute;
    top: 558px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #2b2b2b;
  }
  .cast .name {
    margin-bottom: 9px;
    line-height: 1.25;
  }
  .cast .first {
    display: block;
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: 0.14em;
  }
  .cast .last {
    display: block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.10em;
  }
  .release {
    margin-top: 14px;
    font-size: 11.5px;
    letter-spacing: 0.10em;
    color: #7a5c33;
    line-height: 1.5;
  }
  .release .month { font-weight: 700; }

  /* ---- Rating box (bottom-left) ---- */
  .rating {
    position: absolute;
    bottom: 46px;
    left: 34px;
    display: inline-block;
    border: 1px solid #6b6b6b;
    padding: 2px 4px;
  }
  .rating .r {
    display: inline-block;
    font-size: 15px;
    font-weight: 700;
    padding-right: 4px;
    border-right: 1px solid #6b6b6b;
    vertical-align: middle;
    color: #3a3a3a;
  }
  .rating .desc {
    display: inline-block;
    font-size: 3.6px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    text-align: left;
    padding-left: 3px;
    vertical-align: middle;
    color: #3a3a3a;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="tagline">
      NOT EVERYTHING IS SUPPOSED<br>
      TO MAKE YOU COMFORTABLE.
    </div>

    <div class="collage">
      <figure class="placeholder ph-man-left">[Photo: bearded man in suit, top-left panel]</figure>
      <figure class="placeholder ph-woman-center">[Photo: blonde woman, top-center panel]</figure>
      <figure class="placeholder ph-woman-right">[Photo: young woman, top-right panel]</figure>
      <figure class="placeholder ph-coat">[Photo: plaid coat detail, lower-left panel]</figure>
      <figure class="placeholder ph-man-right">[Photo: bearded man in green jacket, lower-right panel]</figure>
    </div>

    <div class="title-block">
      <div class="director-top">LUCA GUADAGNINO'S</div>
      <div class="title-line">AFTER</div>
      <div class="title-line">THE</div>
      <div class="title-line">HUNT</div>
    </div>

    <div class="credits">
      DIRECTED BY LUCA GUADAGNINO<br>
      WRITTEN BY NORA GARRETT
    </div>

    <div class="cast">
      <div class="name"><span class="first">JULIA</span><span class="last">ROBERTS</span></div>
      <div class="name"><span class="first">AYO</span><span class="last">EDEBIRI</span></div>
      <div class="name"><span class="first">ANDREW</span><span class="last">GARFIELD</span></div>
      <div class="name"><span class="first">MICHAEL</span><span class="last">STUHLBARG</span></div>
      <div class="name"><span class="first">CHLOË</span><span class="last">SEVIGNY</span></div>
      <div class="release">ONLY IN THEATERS<br><span class="month">OCTOBER</span></div>
    </div>

    <div class="rating">
      <span class="r">R</span><span class="desc">RESTRICTED<br>[illegible]<br>[illegible]</span>
    </div>

  </div>
</body>
</html>
