<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 2025年2月28日 第27992期 头版</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #f2efe9;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #111;
  }
  .page {
    width: 1000px;
    margin: 0 auto;
    background: #fdfcf8;
    padding: 10px 14px 6px 14px;
    border: 1px solid #ddd;
  }
  .illeg { color: #333; }
  .body-col p {
    margin: 0 0 4px 0;
    font-size: 6.5px;
    line-height: 1.55;
    text-align: justify;
    text-indent: 13px;
  }
  .body-col { padding: 0 5px; }
  .rule-r { border-right: 1px solid #bbb; }
  .rule-l { border-left: 1px solid #bbb; }

  /* ---------- TOP SECTION ---------- */
  .top-section { display: flex; align-items: stretch; }
  .top-left { width: 57%; padding-right: 6px; }
  .top-mid { width: 13%; display: flex; }
  .top-title { width: 11%; display: flex; justify-content: center; }
  .top-right { width: 19%; display: flex; }

  /* masthead */
  .masthead { display: flex; align-items: flex-start; }
  .logo-block { width: 58%; }
  .logo {
    font-family: "STKaiti", "KaiTi", serif;
    font-weight: 700;
    font-size: 62px;
    letter-spacing: 4px;
    color: #c02020;
    line-height: 1;
    text-shadow: 1px 1px 0 #a01010;
  }
  .logo-en {
    border-top: 2px solid #c02020;
    margin-top: 4px;
    padding-top: 2px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #c02020;
    font-family: Arial, Helvetica, sans-serif;
  }
  .site {
    margin-top: 6px;
    font-size: 8px;
    color: #222;
    border-top: 1px solid #444;
    border-bottom: 1px solid #444;
    padding: 1px 0;
  }
  .date-box {
    width: 20%;
    border-left: 1px solid #444;
    border-right: 1px solid #444;
    text-align: center;
    padding: 2px 4px;
    line-height: 1.3;
  }
  .date-box .ym { font-size: 11px; border-bottom: 1px solid #444; padding-bottom: 2px; }
  .date-box .day { font-size: 40px; font-weight: 700; line-height: 1; margin: 2px 0; }
  .date-box .wk { font-size: 9px; }
  .date-box .lunar { font-size: 8px; border-top: 1px solid #444; margin-top: 3px; padding-top: 2px; }
  .date-box .pub { font-size: 8px; margin-top: 4px; border-top: 1px solid #444; padding-top: 2px; }
  .issue-box {
    width: 22%;
    padding: 2px 5px;
    font-size: 7px;
    line-height: 1.7;
  }

  /* main headline */
  .main-head {
    border-top: 2px solid #c02020;
    border-bottom: 2px solid #c02020;
    margin: 8px 0 6px 0;
    padding: 8px 4px;
    text-align: center;
  }
  .main-head h1 {
    margin: 0;
    font-family: "STHeiti", "SimHei", "Noto Sans CJK SC", sans-serif;
    font-weight: 700;
    color: #c02020;
    font-size: 30px;
    line-height: 1.25;
    letter-spacing: 1px;
  }
  .cols-4 { display: flex; }
  .cols-4 > div { width: 25%; }
  .subhead {
    font-family: "STHeiti", "SimHei", sans-serif;
    font-weight: 700;
    font-size: 8px;
    text-align: center;
    margin: 5px 0;
  }
  .note { font-size: 6.5px; text-align: right; margin-top: 4px; }

  /* vertical text */
  .vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
  }
  .v-title-wrap {
    writing-mode: vertical-rl;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4px 0;
  }
  .v-main-title {
    font-family: "STHeiti", "SimHei", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 4px;
    line-height: 1.2;
  }
  .v-sub-title {
    font-size: 13px;
    letter-spacing: 2px;
    margin-right: 6px;
    align-self: flex-start;
  }
  .v-byline {
    font-size: 7px;
    letter-spacing: 1px;
    margin-right: 6px;
  }
  .v-col {
    writing-mode: vertical-rl;
    font-size: 6.5px;
    line-height: 1.7;
    text-align: justify;
    padding: 0 4px;
    height: 100%;
  }
  .v-subhead {
    writing-mode: vertical-rl;
    font-family: "STHeiti", "SimHei", sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 0 4px;
  }

  hr.thick { border: none; border-top: 2px solid #c02020; margin: 8px 0; }
  hr.thin { border: none; border-top: 1px solid #999; margin: 6px 0; }

  /* ---------- BOTTOM SECTION ---------- */
  .bottom-section { display: flex; margin-top: 6px; }
  .bl { width: 48%; padding-right: 8px; border-right: 1px solid #bbb; }
  .br { width: 52%; padding-left: 8px; }

  .head2 {
    font-family: "STHeiti", "SimHei", sans-serif;
    font-weight: 700;
    font-size: 21px;
    text-align: center;
    margin: 4px 0 6px 0;
    letter-spacing: 1px;
  }
  .head3 {
    font-family: "STHeiti", "SimHei", sans-serif;
    font-weight: 700;
    font-size: 17px;
    text-align: center;
    color: #c02020;
    margin: 4px 0;
    line-height: 1.3;
  }
  .kicker { font-size: 9px; text-align: center; margin: 4px 0; }
  .head4 {
    font-family: "STKaiti", "KaiTi", serif;
    font-weight: 700;
    font-size: 20px;
    text-align: center;
    margin: 8px 0;
  }
  .cols-3 { display: flex; }
  .cols-3 > div { width: 33.33%; }
  .cols-2 { display: flex; }
  .cols-2 > div { width: 50%; }

  .v-zone { display: flex; align-items: stretch; height: 430px; margin-top: 6px; }
  .v-zone > div { border-left: 1px solid #ccc; }
