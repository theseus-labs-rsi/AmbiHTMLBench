<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二、建议、提案</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fdfdfb;
  }
  body {
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "Songti SC", serif;
    font-size: 19px;
    line-height: 1.85;
    color: #1c2a3a;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(to bottom, transparent 0 33px, #dfe6ea 33px 34px);
    background-position: 0 40px;
    padding: 14px 34px 40px 18px;
    box-sizing: border-box;
  }
  /* right-edge color swatch strip */
  .swatches {
    position: absolute;
    top: 0;
    right: 0;
    width: 26px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .swatches div { flex: 1; }
  .s1{background:#e9e2d6}.s2{background:#d9cfc0}.s3{background:#cfc6b6}
  .s4{background:#e6e0d2}.s5{background:#dfe3dc}.s6{background:#cdd8d6}
  .s7{background:#c6d3d6}.s8{background:#dfe6e6}.s9{background:#eaeae4}
  .s10{background:#d5dcd8}.s11{background:#e2e6e0}.s12{background:#cdd6d2}

  h1.title {
    color: #b4442a;
    font-size: 21px;
    font-weight: bold;
    text-align: center;
    margin: 6px 0 12px 0;
    letter-spacing: 2px;
  }
  p { margin: 0; }
  .para { text-align: justify; }
  .label-red {
    color: #b4442a;
    font-weight: bold;
    margin-top: 34px;
  }
  .center { text-align: center; }
  .doc-title { margin-top: 8px; }
  .indent1 { text-indent: 2em; }
  .blue { color: #2f5fb0; }
  .bold { font-weight: bold; }
  .list-line { text-indent: 2em; }
  .right { text-align: right; }
  .sign { margin-top: 34px; }
  .gap { height: 20px; }
</style>
</head>
<body>
<div class="page">
  <div class="swatches">
    <div class="s1"></div><div class="s2"></div><div class="s3"></div>
    <div class="s4"></div><div class="s5"></div><div class="s6"></div>
    <div class="s7"></div><div class="s8"></div><div class="s9"></div>
    <div class="s10"></div><div class="s11"></div><div class="s12"></div>
  </div>

  <h1 class="title">二、建议、提案</h1>

  <p class="para">建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。</p>

  <p class="label-red">格式：</p>

  <p class="center doc-title bold">关于 xxxxx 的建议</p>

  <p class="center">（“发文机关+关于+内容+文种”）</p>

  <p class="bold">各级领导(称谓要根据具体题目要求分析得出)：</p>

  <p class="indent1">当前，...等问题比较突出(或做了什么工作)，为了做好.....工作，提出以下建议:<span class="blue">(开头为背景分析，指出存在的主要问题和目的意义)</span></p>

  <p class="list-line">一、.....</p>
  <p class="list-line">二、.....</p>
  <p class="list-line">三、.....<span class="blue">(主体内容还原为对策题,提出解决问题的措施)</span></p>

  <p class="right sign bold">发文机关</p>
  <p class="right bold">xx 年 xx 月 xx 日</p>
</div>
</body>
</html>
