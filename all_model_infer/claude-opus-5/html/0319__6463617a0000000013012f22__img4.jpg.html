<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 回避行为</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  .card {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 0 auto;
    background: #1330d6;
    box-sizing: border-box;
    overflow: hidden;
  }
  /* white inner page with clipped (notched) corners */
  .page {
    position: absolute;
    top: 8px;
    left: 20px;
    right: 20px;
    bottom: 8px;
    background: #ffffff;
    -webkit-clip-path: polygon(0 0, 100% 0, 100% 36%, 92% 44%, 100% 52%, 100% 100%, 0 100%, 0 82%, 8% 74%, 0 66%);
    clip-path: polygon(0 0, 100% 0, 100% 36%, 92% 44%, 100% 52%, 100% 100%, 0 100%, 0 82%, 8% 74%, 0 66%);
    box-sizing: border-box;
    padding: 40px 34px;
  }
  .num {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    font-weight: 900;
    font-size: 62px;
    line-height: 1.0;
    letter-spacing: -1px;
    color: #111111;
    margin: 10px 0 6px 0;
  }
  .title {
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    font-weight: 900;
    font-size: 52px;
    line-height: 1.1;
    letter-spacing: 2px;
    color: #111111;
    margin: 0;
  }
  .lead {
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.75;
    color: #111111;
    margin-top: 140px;
    margin-bottom: 22px;
  }
  .body-text {
    font-family: "Songti SC", "SimSun", "STSong", serif;
    font-size: 21px;
    line-height: 1.9;
    color: #222222;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="page">
      <div class="num">03</div>
      <div class="title">回避行为</div>

      <p class="lead">自觉或不自觉地回避曾经的某些人、<br>事、物。</p>

      <p class="body-text">比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……</p>
    </div>
  </div>
</body>
</html>
