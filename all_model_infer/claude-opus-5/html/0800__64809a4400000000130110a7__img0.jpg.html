<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2f2ef;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #111;
  }
  .page {
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #f2f2ef;
    padding: 24px 22px 14px 22px;
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid #111;
    padding-bottom: 6px;
  }
  .header-left .cn {
    font-size: 15px;
    letter-spacing: 2px;
  }
  .header-left .en {
    font-size: 8px;
    letter-spacing: 1.6px;
    margin-top: 3px;
  }
  .header-right {
    text-align: right;
  }
  .header-right .cn {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right .date {
    font-size: 8.5px;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }

  /* ---------- Generic blocks ---------- */
  .yellow { background: #f5e400; }
  .black { background: #0d0d0d; }
  .yellow-text { color: #f5e400; }

  .heavy {
    font-family: "Heiti SC", "SimHei", "Noto Sans CJK SC", sans-serif;
    font-weight: 900;
  }

  /* ---------- Row 1 ---------- */
  .row1 {
    display: flex;
    align-items: flex-start;
    margin-top: 14px;
  }
  .box-ku {
    width: 130px;
    height: 116px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box-ku span {
    font-size: 74px;
    line-height: 1;
    letter-spacing: 0;
  }
  .box-cools {
    margin-left: 20px;
    width: 300px;
    height: 130px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box-cools .line1 {
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: 6px;
    text-align: center;
  }
  .box-cools .line2 {
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: 10px;
    text-align: center;
  }

  /* ---------- Row 2 : small bar ---------- */
  .bar-small-1 {
    width: 46px;
    height: 18px;
    margin-left: 42px;
    margin-top: 16px;
  }

  /* ---------- Row 3 ---------- */

    display: flex;
    align-items: flex-start;
    margin-top: 12px;
  }
  .box-goutu {
    width: 148px;
    height: 148px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .box-goutu div {
    font-size: 34px;
    line-height: 1.25;
    letter-spacing: 2px;
  }
  .box-kushe {
    margin-left: auto;
    width: 168px;
    height: 168px;
    margin-top: -22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .box-kushe div {
    font-size: 46px;
    line-height: 1.35;
    letter-spacing: 10px;
    text-indent: 10px;
  }

  /* ---------- Row 4 : bar ---------- */
  .bar-small-2 {
    width: 76px;
    height: 20px;
    margin-left: 336px;
    margin-top: 14px;
  }

  /* ---------- Row 5 ---------- */
  .row5 {
    display: flex;
    align-items: flex-start;
    margin-top: 8px;
  }
  .box-importance {
    width: 148px;
    height: 108px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box-importance div {
    font-size: 9px;
    letter-spacing: 2.6px;
    line-height: 1.9;
  }
  .box-peak {
    margin-left: 20px;
    width: 300px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box-peak span {
    font-size: 62px;
    line-height: 1;
    letter-spacing: 6px;
    text-indent: 6px;
  }

  /* ---------- Image strip ---------- */
  .strip {
    margin-top: 14px;
    width: 100%;
    border-top: 2px solid #f5e400;
    border-bottom: 2px solid #f5e400;
    overflow: hidden;
  }
  .strip .srow {
    display: flex;
    height: 15px;
    align-items: center;
    background: #0d0d0d;
    border-bottom: 1px solid #f5e400;
    padding-left: 6px;
    overflow: hidden;
  }
  .strip .srow:last-child { border-bottom: none; }
  .strip .srow span {
    color: #f5e400;
    font-size: 8px;
    letter-spacing: 0.5px;
    margin-right: 26px;
    white-space: nowrap;
  }

  /* ---------- Bottom shapes ---------- */
  .bottom {
    position: relative;
    height: 108px;
    margin-top: 10px;
  }
  .sq-yellow {
    position: absolute;
    left: 22px;
    top: 0;
    width: 62px;
    height: 26px;
  }
  .circle-yellow {
    position: absolute;
    left: 22px;
    top: 32px;
    width: 74px;
    height: 74px;
    border-radius: 50%;
  }
  .sq-yellow-right {
    position: absolute;
    right: 0;
    top: 62px;
    width: 68px;
    height: 44px;
  }
  .banner {
    position: absolute;
    left: 132px;
    top: 62px;
    width: 240px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .banner span {
    color: #f5e400;
    font-size: 12.5px;
    letter-spacing: 0.6px;
  }

  /* ---------- Footer ---------- */
  .footer {
    border-top: 1px solid #111;
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .footer .sep { color: #111; }
</style>
