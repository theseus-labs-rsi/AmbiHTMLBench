<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    background-image:
      linear-gradient(to right, #d6ecf7 1px, transparent 1px),
      linear-gradient(to bottom, #d6ecf7 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: "Heiti SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    padding: 14px 12px 20px 12px;
    box-sizing: border-box;
  }
  h1.title {
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    margin: 8px 0 18px 0;
    letter-spacing: 2px;
  }
  h1.title .blue { color: #1a3fd8; }
  h1.title .black { color: #111111; }

  .main {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  /* ---------- Left column: route flow ---------- */
  .flow {
    width: 190px;
    flex: 0 0 190px;
    text-align: center;
  }
  .tag {
    display: inline-block;
    background: #b8f0d0;
    font-size: 24px;
    font-weight: 800;
    color: #111;
    padding: 3px 14px;
    margin-bottom: 4px;
  }
  .stop {
    font-size: 27px;
    font-weight: 900;
    color: #111;
    margin: 4px 0;
    letter-spacing: 1px;
  }
  .arrow-plain {
    color: #f5b731;
    font-size: 34px;
    line-height: 1.1;
    margin: 2px 0;
  }
  .leg {
    background: #fbdede;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 19px;
    font-weight: 700;
    color: #111;
    padding: 2px 6px;
    margin: 6px 0;
  }
  .leg .arrow {
    color: #f5b731;
    font-size: 30px;
    line-height: 1;
  }

  /* ---------- Right column: info boxes ---------- */
  .notes {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .note {
    border: 2px solid #c0201d;
    padding: 7px 9px;
    font-size: 18px;
    line-height: 1.55;
    color: #111;
    box-sizing: border-box;
  }
  .note b {
    color: #1a3fd8;
    font-weight: 700;
  }
  .n1 { margin-top: 6px; height: 96px; }
  .n2 { margin-top: 24px; height: 96px; }
  .n3 { margin-top: 24px; height: 96px; }
  .n4 { margin-top: 34px; height: 74px; }
  .n5 { margin-top: 40px; height: 96px; }
</style>
</head>
<body>
<div class="page">

  <h1 class="title"><span class="blue">第三天</span><span class="black">路线规划</span></h1>

  <div class="main">

    <!-- Left: vertical route flow -->
    <div class="flow">
      <div class="tag">第三天</div>
      <div class="arrow-plain">&#11015;</div>
      <div class="stop">磁器口</div>
      <div class="leg"><span>1号线</span><span class="arrow">&#11015;</span><span>30分钟</span></div>
      <div class="stop">罗中立美术馆</div>
      <div class="leg"><span>1号线</span><span class="arrow">&#11015;</span><span>80分钟</span></div>
      <div class="stop">山城步道</div>
      <div class="leg"><span>公交</span><span class="arrow">&#11015;</span><span>32分钟</span></div>
      <div class="stop">观音桥</div>
      <div class="leg"><span>步行</span><span class="arrow">&#11015;</span><span>15分钟</span></div>
      <div class="stop">九街</div>
    </div>

    <!-- Right: description boxes -->
    <div class="notes">
      <div class="note n1"><b>磁器口（免费）</b>：汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌</div>
      <div class="note n2"><b>罗中立美术馆（免费）</b>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服</div>
      <div class="note n3"><b>山城步道（免费）</b>：建在悬崖边的临江步道，汇聚老重庆特色步道</div>
      <div class="note n4"><b>观音桥（免费）</b>：超大商圈，还有很多地道重庆小吃</div>
      <div class="note n5"><b>九街（免费）</b>：酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有</div>
    </div>

  </div>
</div>
</body>
</html>
