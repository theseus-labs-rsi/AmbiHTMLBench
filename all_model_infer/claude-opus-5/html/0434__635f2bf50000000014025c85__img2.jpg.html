<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的 vs 人民日报写的</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
    position: relative;
    overflow: hidden;
  }
  /* ---------- 上半部分 ---------- */
  .top {
    background: #ded1ab;
    padding: 45px 40px 0 40px;
    position: relative;
    min-height: 245px;
    box-sizing: border-box;
  }
  .watermark {
    position: absolute;
    color: rgba(255,255,255,0.45);
    font-size: 30px;
    letter-spacing: 4px;
    transform: rotate(-12deg);
    pointer-events: none;
    white-space: nowrap;
  }
  .wm1 { top: 105px; left: 95px; }
  .wm2 { top: 200px; left: 105px; color: rgba(255,255,255,0.30); }
  .wm3 { top: 470px; left: 100px; color: rgba(255,255,255,0.16); }

  .head-line {
    display: flex;
    align-items: center;
  }
  .head-title {
    font-size: 30px;
    color: #3a3a3a;
    letter-spacing: 2px;
  }
  .circle-mark {
    width: 56px;
    height: 56px;
    border: 13px solid #d8232a;
    border-radius: 50%;
    margin-left: 16px;
    box-sizing: border-box;
  }
  .top-body {
    margin-top: 30px;
    font-size: 21px;
    line-height: 1.75;
    color: #2b2b2b;
    letter-spacing: 1px;
    max-width: 300px;
  }
  /* 照片占位 */
  .placeholder {
    background: #cfcfcf;
    border: 1px dashed #8a8a8a;
    color: #333;
    font-size: 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
  }
  .photo {
    position: absolute;
    right: 30px;
    top: 100px;
    width: 130px;
    height: 175px;
  }
  .caption-white {
    position: absolute;
    right: 22px;
    top: 258px;
    color: #ffffff;
    font-size: 25px;
    font-weight: bold;
    font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
    letter-spacing: 1px;
    z-index: 3;
  }
  /* ---------- 下半部分 ---------- */
  .bottom {
    background: #4b4a68;
    padding: 40px 40px 26px 40px;
    position: relative;
    box-sizing: border-box;
  }
  .bottom-head {
    display: flex;
    align-items: center;
    margin-bottom: 26px;
  }
  .bottom-title {
    font-size: 30px;
    color: #ffffff;
    letter-spacing: 2px;
  }
  .check {
    margin-left: 14px;
    color: #7ac943;
    font-size: 48px;
    line-height: 1;
    font-weight: bold;
    font-family: "Arial", sans-serif;
  }
  .bottom-body {
    font-size: 21px;
    line-height: 1.85;
    color: #ffffff;
    letter-spacing: 1px;
    text-align: justify;
  }
  .source {
    margin-top: 22px;
    text-align: right;
    color: #ffffff;
    font-size: 16px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <div class="watermark wm1">爱妈的美女纸</div>
    <div class="watermark wm2">爱妈的美女纸</div>

    <div class="head-line">
      <span class="head-title">我写的：</span>
      <span class="circle-mark"></span>
    </div>

    <div class="top-body">
      我们民族的追梦史充满<br>
      艰辛。
    </div>

    <figure class="placeholder photo" style="margin:0;">
      [Photo: 男孩头像，右上角]
    </figure>
    <div class="caption-white">学习使我妈快乐</div>
  </div>

  <div class="bottom">
    <div class="watermark wm3" style="position:absolute; top:130px; left:60px;">爱妈的美女纸</div>

    <div class="bottom-head">
      <span class="bottom-title">人民日报写的：</span>
      <span class="check">✔</span>
    </div>

    <div class="bottom-body">
      我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
    </div>

    <div class="source">——2013.4.1《筑就民族复兴的“中国梦”》</div>
  </div>

</div>
</body>
</html>
