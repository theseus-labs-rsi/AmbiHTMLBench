*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {

    font-size: 9pt;
    line-height: 1.72;
    color: #000;
    background: #fff;
    width: 920px;
    margin: 0 auto;
    padding: 14px 16px;
}

/* ───────── PAGE HEADER ───────── */
.page-header {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    border-top: 3.5px solid #000;
    border-bottom: 1.5px solid #000;
    padding: 2px 0;
    margin-bottom: 8px;
    gap: 0;
}
.hdr-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
}
.page-num {
    font-size: 26pt;
    font-weight: 900;
    line-height: 1;
    margin-right: 2px;
}
.section-name {
    font-size: 13pt;
    font-weight: bold;
    letter-spacing: 1px;
}
.hdr-center {
    font-size: 8pt;
    text-align: center;
    align-self: center;
    line-height: 1.7;
}
.hdr-right {
    text-align: right;
    align-self: center;
}
.newspaper-cn {
    font-size: 16pt;
    font-weight: 900;
    letter-spacing: 3px;
    display: block;
}
.newspaper-en {
    font-size: 7.5pt;
    letter-spacing: 1px;
    display: block;
}

/* ───────── OUTER WRAPPER ───────── */
.page-body {
    display: flex;
    flex-direction: row;
    gap: 0;
    width: 100%;
}

/* ───────── FAR-LEFT VERTICAL SIDEBAR ───────── */
.sidebar {
    width: 48px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4px;
    border-right: 1.5px solid #000;
    padding-right: 4px;
    gap: 8px;
}
.label-tag {
    background: #000;
    color: #fff;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 10pt;
    font-weight: bold;
    padding: 8px 4px;
    letter-spacing: 3px;
    text-align: center;
}
.sidebar-author {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 9pt;
    letter-spacing: 2px;
    margin-top: 4px;
}
.sidebar-title {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 16pt;
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: 8px;
}

/* ───────── COLUMN AREA ───────── */
.columns {
    flex: 1;
    display: grid;
    grid-template-columns: 195px 195px 1fr;
    grid-template-rows: auto auto;
    gap: 0;
}

/* individual article columns */
.col {
    padding: 0 8px;
    border-right: 1px solid #c0c0c0;
    overflow: hidden;
}
.col:last-child { border-right: none; }

.col-title {
    font-size: 12.5pt;
    font-weight: bold;
    text-align: center;
    margin: 4px 0 6px;
    line-height: 1.4;
}
.col-title-fancy {
    font-size: 13pt;
    font-weight: bold;
    text-align: center;
    line-height: 1.5;
    margin: 4px 0 6px;
    letter-spacing: 1px;
}
.section-inline {
    display: inline-block;
    background: #000;
    color: #fff;
    padding: 1px 5px;
    font-size: 9pt;
    font-weight: bold;
    vertical-align: middle;
    margin-right: 3px;
    letter-spacing: 1px;
}
.author-inline {
    font-size: 8.5pt;
    margin-bottom: 5px;
    display: block;
    text-align: right;
    color: #333;
}
p {
    font-size: 9pt;
    text-align: justify;
    text-indent: 2em;
    margin-bottom: 1.5px;
}
p.no-indent { text-indent: 0; }
p.quote {
    text-indent: 0;
    padding-left: 1em;
    font-size: 9pt;
    color: #111;
}

/* ───────── BIG HEADLINE SECTION (spans cols 2-3 in row 1 area) ───────── */
.col-wide {
    grid-column: 2 / 4;
    padding: 0 8px;
    border-right: none;
}
.col-wide-inner {
    border-left: 1px solid #c0c0c0;
    padding-left: 10px;
}
.big-headline {
    font-size: 32pt;
    font-weight: 900;
    text-align: center;
    letter-spacing: 8px;
    margin: 10px 0 10px;
    line-height: 1.1;
}

/* ───────── PLACEHOLDER ───────── */
.placeholder {
    background: #d8d8d8;
    border: 1px solid #999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #555;
    font-size: 8.5pt;
    line-height: 1.5;
}
.img-caption {
    font-size: 7.5pt;
    text-align: right;
    color: #555;
    margin-top: 3px;
    margin-bottom: 6px;
}

/* lower grid area inside wide col */
.lower-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 10px;
    margin-top: 6px;
}

/* ───────── RIGHT COLUMN (4th column, full height) ───────── */
.col-right {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
    border-left: 1px solid #c0c0c0;
    padding: 0 0 0 8px;
}

/* ───────── BOTTOM ROW LAYOUT ───────── */
.bottom-row {
    display: flex;
    flex-direction: row;
    gap: 0;
    width: 100%;
    border-top: 1px solid #c0c0c0;
    margin-top: 8px;
    padding-top: 6px;
}
.bottom-col {
    flex: 1;
    padding: 0 8px;
    border-right: 1px solid #c0c0c0;
}
.bottom-col:last-child { border-right: none; }

.sub-section-label {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 5px;
}
.sub-title {
    font-size: 13pt;
    font-weight: bold;
    margin: 3px 0 5px;
    text-align: center;
}

/* ───────── FOOTER ───────── */
.page-footer {
    border-top: 1.5px solid #000;
    margin-top: 12px;
    padding-top: 4px;
    font-size: 7.5pt;
    text-align: center;
    color: #222;
    line-height: 1.8;
}

hr.col-divider {
    border: none;
    border-top: 1px solid #bbb;
    margin: 5px 0;
}
</style>
