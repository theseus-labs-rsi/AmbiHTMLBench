<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRADA 鞋履系列</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 18px;
    background: #efefef;
    font-family: "Times New Roman", "Songti SC", serif;
  }
  .page {
    background: #ffffff;
    width: 504px;
    margin: 0 auto;
    padding: 14px 18px 24px 18px;
    box-sizing: border-box;
  }
  .brand {
    border: 1px dashed #999;
    text-align: center;
    padding: 6px 0 10px 0;
    margin: 6px 40px 18px 40px;
  }
  .brand h1 {
    margin: 0;
    font-size: 44px;
    letter-spacing: 6px;
    font-weight: bold;
    font-family: "Times New Roman", serif;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .item {
    text-align: center;
    font-size: 13px;
    line-height: 1.45;
  }
  .placeholder {
    background: #fafafa;
    border: 1px dotted #ccc;
    color: #999;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
    margin: 0 auto 4px auto;
  }
  .caption { display: block; }
</style>
</head>
<body>
<div class="page">

  <div class="brand">
    <h1>PRADA</h1>
  </div>

  <!-- Row 1: high-heel slingback centered top -->
  <div class="row" style="justify-content:center;">
    <div class="item" style="width:170px;">
      <div class="placeholder" style="width:150px;height:95px;">[Photo: 高跟鞋 (顶部居中)]</div>
      <span class="caption">亮面皮革后饰带<br>高跟鞋</span>
    </div>
  </div>

  <!-- Row 2: Mary Jane left, Chocolate loafer right -->
  <div class="row">
    <div class="item" style="width:180px;">
      <div class="placeholder" style="width:160px;height:80px;">[Photo: 玛丽珍鞋 (左)]</div>
      <span class="caption">玛丽珍鞋</span>
    </div>
    <div class="item" style="width:190px; margin-top:14px;">
      <div class="placeholder" style="width:160px;height:80px;">[Photo: 乐福鞋 (右)]</div>
      <span class="caption">CHOCOLATE 亮面<br>皮革乐福鞋</span>
    </div>
  </div>

  <!-- Row 3: Triangolo loafer centered -->
  <div class="row" style="justify-content:center;">
    <div class="item" style="width:190px;">
      <div class="placeholder" style="width:165px;height:80px;">[Photo: 乐福鞋 (居中)]</div>
      <span class="caption">TRIANGOLO 亮面<br>皮革乐福鞋</span>
    </div>
  </div>

  <!-- Row 4: Monolith lace-up left, Monolith sandal right -->
  <div class="row">
    <div class="item" style="width:180px;">
      <div class="placeholder" style="width:160px;height:80px;">[Photo: 系带鞋 (左)]</div>
      <span class="caption">MONOLITH 亮面<br>皮革系带鞋</span>
    </div>
    <div class="item" style="width:190px; margin-top:22px;">
      <div class="placeholder" style="width:165px;height:80px;">[Photo: 凉鞋 (右)]</div>
      <span class="caption">MONOLITH 亮面<br>皮革凉鞋</span>
    </div>
  </div>

  <!-- Row 5: Double Wheel centered -->
  <div class="row" style="justify-content:center;">
    <div class="item" style="width:200px;">
      <div class="placeholder" style="width:170px;height:75px;">[Photo: 运动鞋 (居中)]</div>
      <span class="caption">DOUBLE WHEEL</span>
    </div>
  </div>

  <!-- Row 6: gabardine sneaker left, Downtown right -->
  <div class="row">
    <div class="item" style="width:190px;">
      <div class="placeholder" style="width:165px;height:80px;">[Photo: 运动鞋 (左下)]</div>
      <span class="caption">华达呢织物运动鞋</span>
    </div>
    <div class="item" style="width:195px; margin-top:6px;">
      <div class="placeholder" style="width:170px;height:80px;">[Photo: 运动鞋 (右下)]</div>
      <span class="caption">DOWNTOWN 穿孔<br>皮革运动鞋</span>
    </div>
  </div>

</div>
</body>
</html>
