<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: #f6e2d8;
  }
  .page {
    position: relative;
    width: 540px;
    margin: 0 auto;
    background: linear-gradient(180deg, #f9e6dc 0%, #f7e3d8 100%);
    padding: 14px 12px 18px 12px;
    box-sizing: border-box;
  }
  .card {
    background: #fdfaf6;
    border: 3px solid #cfe3dc;
    border-radius: 22px;
    padding: 14px 14px 18px 14px;
  }
  .title-box {
    border: 3px solid #2b2b2b;
    border-radius: 10px;
    background: #ffffff;
    text-align: center;
    padding: 6px 10px;
    margin: 4px 16px 18px 16px;
  }
  .title-box .title-text {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1a1a1a;
    display: inline-block;
    vertical-align: middle;
  }
  .qmark {
    display: inline-block;
    vertical-align: middle;
    margin-left: 10px;
    background: #d9e6ef;
    border: 2px solid #2b2b2b;
    border-radius: 6px;
    width: 26px;
    height: 30px;
    line-height: 28px;
    font-size: 22px;
    font-weight: 800;
    color: #c0392b;
    text-align: center;
  }
  .section-head {
    display: flex;
    align-items: center;
    margin: 6px 0 10px 4px;
    font-size: 19px;
    font-weight: 800;
    color: #cf4a3c;
  }
  .pin {
    color: #e04a3c;
    margin-right: 4px;
    font-size: 17px;
  }
  .head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 0 10px 4px;
  }
  .badge {
    background: #e8552b;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    table-layout: fixed;
  }
  th {
    background: #6b7280;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 4px;
    border: 1px solid #d7d7d7;
  }
  table.t2 th {
    background: #4a6b8a;
  }
  td {
    border: 1px solid #d7d7d7;
    text-align: center;
    font-size: 15px;
    color: #1f1f1f;
    padding: 12px 6px;
    line-height: 1.5;
  }
  .t1 col.c1 { width: 26%; }
  .t1 col.c2 { width: 22%; }
  .t1 col.c3 { width: 22%; }
  .t1 col.c4 { width: 30%; }
  .t2 col.c1 { width: 24%; }
  .t2 col.c2 { width: 34%; }
  .t2 col.c3 { width: 42%; }

  /* handwritten-style annotations */
  .circle {
    display: inline-block;
    padding: 2px 10px;
    border: 2px solid #c0392b;
    border-radius: 50%;
    transform: rotate(-6deg);
  }
  .anno {
    color: #1f7a5c;
    font-style: italic;
    font-size: 14px;
    display: block;
    margin-top: 4px;
    transform: rotate(-3deg);
  }
  .hl-red {
    color: #d0021b;
    font-weight: 800;
  }
  .green-note {
    display: inline-block;
    background: #3aa76d;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .arrow-up {
    display: inline-block;
    background: #2f80ed;
    color: #ffffff;
    border-radius: 4px;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    font-size: 13px;
    margin-right: 2px;
    vertical-align: middle;
  }
  .overlay-note {
    text-align: left;
    margin-top: 6px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <div class="title-box">
      <span class="title-text">猫砂都有哪些款</span><span class="qmark">?</span>
    </div>

    <div class="section-head"><span class="pin">📍</span>三种猫砂尺寸哪个是你最爱</div>

    <table class="t1">
      <colgroup>
        <col class="c1"><col class="c2"><col class="c3"><col class="c4">
      </colgroup>
      <tr>
        <th>尺寸</th>
        <th>重量</th>
        <th>结团效果</th>
        <th>其他</th>
      </tr>
      <tr>
        <td>1.5mm</td>
        <td>轻</td>
        <td>上</td>
        <td>易带出，价格<br>略高</td>
      </tr>
      <tr>
        <td><span class="circle">2mm</span><span class="anno">综合性价比推荐</span></td>
        <td>中</td>
        <td>中</td>
        <td>综合性价比高</td>
      </tr>
      <tr>
        <td>3mm</td>
        <td>重</td>
        <td>67</td>
        <td>推荐度低，但<br>价格也低</td>
      </tr>
    </table>

    <div class="head-row">
      <div class="section-head" style="margin:0;"><span class="pin">📍</span>猫砂都有哪些种类</div>
      <div class="badge">总结:2mm混合砂yyds</div>
    </div>

    <table class="t2">
      <colgroup>
        <col class="c1"><col class="c2"><col class="c3">
      </colgroup>
      <tr>
        <th>种类</th>
        <th>优点</th>
        <th>其他</th>
      </tr>
      <tr>
        <td>膨润土</td>
        <td>价格低廉</td>
        <td>粉尘大</td>
      </tr>
      <tr>
        <td>豆腐猫砂</td>
        <td>原料更安全，闻起来<br>也比较好</td>
        <td>价格偏高，纯豆腐结团略差</td>
      </tr>
      <tr>
        <td>
          <span class="circle">混合猫砂</span>
          <div class="overlay-note"><span class="arrow-up">⬆</span><span class="green-note">普通养宠家庭足以满足需求</span> <span style="color:#3aa76d;font-weight:800;">✅</span></div>
        </td>
        <td>结合上述优点，价格<br>适中</td>
        <td>比例推荐 <span class="hl-red">7:3或6:4</span>，结团<br>快且用量省</td>
      </tr>
      <tr>
        <td>沸石</td>
        <td>可循环利用</td>
        <td>需要自己洗</td>
      </tr>
      <tr>
        <td>其他新型原料</td>
        <td>价格高，新颖</td>
        <td>效果待考核，贵</td>
      </tr>
    </table>

  </div>
</div>
</body>
</html>
