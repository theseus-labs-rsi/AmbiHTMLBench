<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anything's Possible — Prime Video Poster</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    background: #efd7e4;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .poster {
    position: relative;
    width: 510px;
    height: 755px;
    background: #ffffff;
    border: 14px solid #efd7e4;
    box-sizing: border-box;
    overflow: hidden;
    text-align: center;
  }

  /* Prime Video logo block */
  .prime-logo {
    margin-top: 24px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111;
  }
  .prime-logo .smile {
    display: block;
    margin: 2px auto 0;
    width: 150px;
    height: 22px;
  }

  /* Credits above title */
  .director-credit {
    margin-top: 22px;
    font-size: 10.5px;
    letter-spacing: 1.6px;
    font-weight: 600;
    color: #111;
    text-transform: uppercase;
  }
  .director-name {
    margin-top: 5px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #1a3fa8;
    text-transform: uppercase;
  }
  .tagline {
    margin-top: 14px;
    font-size: 11px;
    line-height: 1.55;
    letter-spacing: 2.2px;
    color: #6b4fa0;
    text-transform: uppercase;
  }

  /* Central artwork placeholder */
  .placeholder {
    box-sizing: border-box;
    border: 1px dashed #b9a6c4;
    background: #fbf4f8;
    color: #8a7794;
    font-size: 11px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .art {
    width: 430px;
    height: 400px;
    margin: 4px auto 0;
  }

  /* Title */
  .title {
    margin-top: 6px;
    font-size: 46px;
    line-height: 1;
    white-space: nowrap;
  }
  .title .script {
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-style: italic;
    color: #1f3fa0;
    font-weight: 400;
  }
  .title .bold {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    color: #b02b8f;
    letter-spacing: -1px;
  }

  /* Billing block */
  .billing {
    margin-top: 26px;
    font-size: 10px;
    letter-spacing: 1.1px;
    color: #1f3fa0;
    text-transform: uppercase;
  }
  .billing .small {
    font-size: 7px;
    letter-spacing: 0.8px;
    vertical-align: 1px;
  }
  .billing .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    box-sizing: border-box;
  }
  .logos-left, .logos-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-ph {
    border: 1px dashed #b9a6c4;
    background: #fbf4f8;
    color: #8a7794;
    font-size: 7px;
    letter-spacing: 0.4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2px;
    box-sizing: border-box;
  }
  .logo-orion { width: 46px; height: 20px; }
  .logo-ua    { width: 30px; height: 22px; }
  .logo-rating{ width: 52px; height: 18px; }
  .logo-amazon{ width: 44px; height: 20px; }

  .release {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #111;
    white-space: nowrap;
  }
  .release .divider {
    color: #111;
    margin: 0 8px;
    font-weight: 300;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="prime-logo">
      prime video
      <svg class="smile" viewBox="0 0 150 22" aria-label="[Logo: Amazon smile arrow]">
        <path d="M4 6 C40 22, 110 22, 144 4" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
        <path d="M132 2 L146 3 L140 14 Z" fill="#111"/>
      </svg>
    </div>

    <div class="director-credit">FROM THE HEART &amp; SOUL OF DIRECTOR</div>
    <div class="director-name">BILLY PORTER</div>

    <div class="tagline">
      WHEN IT<br>
      COMES<br>
      TO LOVE&hellip;
    </div>

    <figure class="placeholder art">
      [Photo: centered — two young actors standing back to back, full-length]
    </figure>

    <div class="title">
      <span class="script">anything&rsquo;s</span><span class="bold">possible</span>
    </div>

    <div class="billing">
      <span class="small">WRITTEN BY</span>
      <span class="name">XIMENA GARC&Iacute;A LECUONA</span>
      <span class="small">DIRECTED BY</span>
      <span class="name">BILLY PORTER</span>
    </div>

    <div class="bottom-bar">
      <div class="logos-left">
        <span class="logo-ph logo-orion">[Logo: ORION]</span>
        <span class="logo-ph logo-ua">[Logo: UA]</span>
      </div>
      <div class="release">JULY 22 <span class="divider">|</span> NEW MOVIE</div>
      <div class="logos-right">
        <span class="logo-ph logo-rating">[Rating block: illegible]</span>
        <span class="logo-ph logo-amazon">AMAZON<br>STUDIOS</span>
      </div>
    </div>

  </div>
</body>
</html>
