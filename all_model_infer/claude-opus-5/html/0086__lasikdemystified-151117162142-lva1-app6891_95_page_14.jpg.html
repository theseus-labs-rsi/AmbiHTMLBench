<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Should Be Less Than 40 %</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    width: 1024px;
    height: 576px;
    background: linear-gradient(160deg, #8a9a95 0%, #5f736c 40%, #4d635c 100%);
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .title-band {
    position: absolute;
    top: 28px;
    left: 62px;
    width: 900px;
    height: 62px;
    background: linear-gradient(to bottom, #7fb4c4 0%, #2f8fa8 55%, #7fb4c4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .title-band h1 {
    margin: 0;
    font-size: 42px;
    font-weight: bold;
    color: #ffff00;
    letter-spacing: 0.5px;
    text-shadow: 2px 2px 2px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .content-card {
    position: absolute;
    top: 162px;
    left: 120px;
    width: 740px;
    height: 382px;
    background: #ffffff;
    box-sizing: border-box;
    padding: 60px 0 0 0;
  }
  .formula-row {
    display: flex;
    align-items: center;
    padding-left: 110px;
    font-size: 30px;
    font-weight: bold;
    color: #1f2f9c;
  }
  .formula-row .lhs {
    margin-right: 34px;
  }
  .fraction {
    display: inline-block;
    text-align: center;
    line-height: 1.25;
  }
  .fraction .num {
    padding: 0 8px 2px 8px;
  }
  .fraction .bar {
    border-top: 3px solid #1f2f9c;
    height: 0;
  }
  .fraction .den {
    padding: 2px 8px 0 8px;
  }
  .limit {
    margin-left: 70px;
    color: #d81212;
    font-size: 24px;
    font-weight: bold;
    align-self: center;
  }
  .legend {
    margin-top: 46px;
    padding-left: 108px;
    font-size: 27px;
    font-weight: bold;
    color: #1f2f9c;
    line-height: 1.65;
  }
</style>
</head>
<body>

  <div class="title-band">
    <h1>PTA SHOULD BE LESS THAN 40 %</h1>
  </div>

  <div class="content-card">
    <div class="formula-row">
      <span class="lhs">PTA =</span>
      <span class="fraction">
        <span class="num">(FT + AD)</span>
        <span class="bar"></span>
        <span class="den">CCT</span>
      </span>
      <span class="limit">&lt; 40%</span>
    </div>

    <div class="legend">
      FT = flap thickness<br>
      AD = ablation depth<br>
      CCT = central corneal thickness
    </div>
  </div>

</body>
</html>
