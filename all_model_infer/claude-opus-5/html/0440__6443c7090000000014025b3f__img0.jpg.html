<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几点分享 Vol.07 — 国内知名设计工作室的官网</title>
<script>

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #000;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px 18px 0 18px;
  }
  .brand {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .brand .logo-mark {
    font-size: 34px;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -2px;
    line-height: 1;
  }
  .brand .reg { font-size: 9px; vertical-align: top; }
  .brand .share {
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
  }
  .brand .vol {
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
    padding-bottom: 2px;
  }
  .brand-underline {
    width: 215px;
    height: 4px;
    background: #000;
    margin: 6px 0 0 18px;
  }
  .tag {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 3px solid #2b2bee;
    padding: 2px 4px 5px 4px;
  }
  .tag .folder-icon {
    width: 20px;
    height: 15px;
    background: #111;
    border-radius: 2px;
    position: relative;
  }
  .tag .folder-icon::before {
    content: "";
    position: absolute;
    top: -4px; left: 0;
    width: 9px; height: 4px;
    background: #111;
    border-radius: 2px 2px 0 0;
  }
  .tag .txt { font-size: 15px; font-weight: 500; }

  /* ---------- Folder cards zone ---------- */
  .cards {
    position: relative;
    height: 250px;
    margin: 22px 0 0 0;
  }
  .card {
    position: absolute;
    background: linear-gradient(160deg, #f2f3f5 0%, #e3e5e8 60%, #d9dbdf 100%);
    border: 1px solid #cfd2d6;
    border-radius: 14px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  .card::before { /* folder tab */
    content: "";
    position: absolute;
    top: -9px;
    left: 10px;
    width: 46%;
    height: 12px;
    background: #eceef0;
    border: 1px solid #cfd2d6;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
  .num {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #b9bcc1;
    color: #f4f5f6;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* card 1 */
  .c1 {
    left: 22px; top: 22px;
    width: 148px; height: 128px;
    transform: rotate(-14deg);
  }
  .c1 .t-main {
    position: absolute;
    left: 14px; top: 24px;
    font-size: 30px; font-weight: 800; letter-spacing: -1px;
  }
  .c1 .t-sub {
    position: absolute;
    left: 62px; top: 46px;
    font-size: 15px; font-weight: 700;
    transform: rotate(-46deg);
    transform-origin: left top;
    white-space: nowrap;
  }
  .c1 .t-sub2 {
    position: absolute;
    left: 40px; top: 62px;
    font-size: 14px; font-weight: 700;
    transform: rotate(-46deg);
    transform-origin: left top;
    white-space: nowrap;
  }
  .c1 .num { left: 14px; bottom: 12px; }

  /* card 2 */
  .c2 {
    left: 190px; top: 18px;
    width: 160px; height: 120px;
    transform: rotate(-3deg);
  }
  .c2 .t-main {
    position: absolute;
    left: 14px; top: 16px;
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
  }
  .c2 .t-sub {
    position: absolute;
    left: 46px; top: 62px;
    font-size: 20px; font-weight: 700; line-height: 1.05;
  }
  .c2 .num { left: 14px; bottom: 18px; }

  /* card 3 */
  .c3 {
    left: 372px; top: 20px;
    width: 148px; height: 122px;
    transform: rotate(11deg);
  }
  .c3 .t-en {
    position: absolute;
    left: 14px; top: 14px;
    font-size: 14px; font-weight: 700; line-height: 1.15;
    letter-spacing: 0.5px;
  }
  .c3 .t-cn {
    position: absolute;
    right: 34px; top: 26px;
    font-size: 27px; font-weight: 800;
    writing-mode: vertical-rl;
    letter-spacing: 1px;
  }
  .c3 .num { right: 12px; bottom: 14px; }

  /* card 4 */
  .c4 {
    left: 106px; top: 140px;
    width: 172px; height: 96px;
    transform: rotate(-2deg);
  }
  .c4 .t-cn {
    position: absolute;
    left: 14px; top: 14px;
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
  }
  .c4 .t-en {
    position: absolute;
    left: 14px; bottom: 12px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
  }
  .c4 .num { right: 26px; top: 20px; }

  /* card 5 */
  .c5 {
    left: 288px; top: 138px;
    width: 158px; height: 102px;
    transform: rotate(-1deg);
  }
  .c5 .t-nice {
    position: absolute;
    left: 14px; top: 12px;
    font-size: 32px; font-weight: 800; letter-spacing: -0.5px;
  }
  .c5 .t-lab {
    position: absolute;
    right: 14px; bottom: 12px;
    font-size: 32px; font-weight: 800; letter-spacing: -0.5px;
  }
  .c5 .t-small {
    position: absolute;
    left: 14px; bottom: 16px;
    font-size: 11px; font-weight: 700; line-height: 1.15;
  }
  .c5 .num { right: 22px; top: 16px; }

  /* ---------- Blue band ---------- */
  .band-blue {
    height: 42px;
    background: #2b2bee;
  }

  /* ---------- Cyan main block ---------- */
  .band-cyan {
    background: #9df1f5;
    padding: 40px 20px 18px 20px;
  }
  .headline {
    font-size: 66px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.15;
    text-align: center;
  }
  .rule {
    border: none;
    border-top: 2px solid #000;
    margin: 18px 0 14px 0;
  }
  .rule.thin { margin: 16px 0 18px 0; }

  /* footer */
  .footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-top: 6px;
  }
  .copy {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
  }
  .footer-mid {
    text-align: center;
    padding: 0 4px 2px 4px;
  }
  .footer-mid .label {
    font-size: 13px;
    font-weight: 700;
    display: block;
    margin-bottom: 32px;
  }
  .logo-badge {
    width: 34px; height: 34px;
    border: 2px solid #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    margin: 0 auto;
  }
  .barcode-wrap { text-align: right; }
  .barcode {
    width: 155px; height: 42px;
    background: repeating-linear-gradient(
      to right,
      #000 0 2px, #9df1f5 2px 4px,
      #000 4px 5px, #9df1f5 5px 8px,
      #000 8px 11px, #9df1f5 11px 12px,
      #000 12px 13px, #9df1f5 13px 16px
    );
  }
  .barcode-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 3px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="brand">
        <span class="logo-mark">几点<span class="reg">®</span></span>
        <span class="share">(分享)</span>
        <span class="vol">Vol.07</span>
      </div>
    </div>
    <div class="tag">
      <span class="folder-icon" aria-hidden="true"></span>
      <span class="txt">Design studio web</span>
    </div>
  </div>
  <div class="brand-underline"></div>

  <!-- Folder cards -->
  <div class="cards">
    <div class="card c1">
      <span class="t-main">ABCD</span>
      <span class="t-sub">BLACK</span>
      <span class="t-sub2">A<br>COVER DESIGN</span>
      <span class="num">1</span>
    </div>

    <div class="card c2">
      <span class="t-main">条件反射</span>
      <span class="t-sub">REFLEX<br>DESIGN</span>
      <span class="num">2</span>
    </div>

    <div class="card c3">
      <span class="t-en">STUDIO<br>NA.&nbsp;&nbsp;EO</span>
      <span class="t-cn">立入禁止</span>
      <span class="num">3</span>
    </div>

    <div class="card c4">
      <span class="t-cn">王志弘</span>
      <span class="t-en">WANG ZHI HONG</span>
      <span class="num">4</span>
    </div>

    <div class="card c5">
      <span class="t-nice">NICE</span>
      <span class="t-small">NICE LAB<br>STUDIO</span>
      <span class="t-lab">LAB</span>
      <span class="num">5</span>
    </div>
  </div>

  <!-- Blue band -->
  <div class="band-blue"></div>

  <!-- Cyan main block -->
  <div class="band-cyan">
    <div class="headline">国内知名设计</div>
    <hr class="rule">
    <div class="headline">工作室的官网</div>
    <hr class="rule thin">

    <div class="footer">
      <div class="copy">
        Copyright&copy; 2023<br>
        Jidn share all rights reserved.
      </div>
      <div class="footer-mid">
        <span class="label">(官网)</span>
        <div class="logo-badge">&#9651;</div>
      </div>
      <div class="barcode-wrap">
        <div class="barcode" role="img" aria-label="[Barcode: bottom-right]"></div>
        <div class="barcode-text">&lt;&lt;&lt;&nbsp; JIDN SHARE &copy;2023&nbsp; &gt;&gt;&gt;</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
