<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方法40 指读（Pointing Reading）</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    background: #efe9e2;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #1a1a1a;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #f3ede6;
    padding: 18px 34px 20px 62px;
    box-sizing: border-box;
    overflow: hidden;
  }
  /* left gutter simulating the facing page edge */
  .gutter {
    position: absolute;
    top: 0;
    left: 0;
    width: 48px;
    height: 100%;
    background: #e4dbd1;
    border-right: 1px solid #cdc2b6;
  }
  .running-head {
    font-size: 11px;
    color: #4a4a4a;
    letter-spacing: 0.5px;
    margin: 0 0 6px 4px;
  }
  .running-head .en {
    font-family: Arial, Helvetica, sans-serif;
    margin-left: 3px;
  }
  /* title band */
  .title-block {
    background: #111;
    color: #fff;
    padding: 4px 10px 10px 10px;
    margin: 0 0 14px 0;
  }
  .title-tag {
    display: inline-block;
    border: 1px solid #fff;
    padding: 2px 12px;
    font-size: 13px;
    margin: 2px 0 8px 26px;
  }
  .title-main {
    display: flex;
    align-items: center;
    padding-left: 4px;
  }
  .method-no {
    font-size: 14px;
    letter-spacing: 1px;
    padding-right: 12px;
    border-right: 1px solid #fff;
  }
  .method-no b { font-family: Arial, Helvetica, sans-serif; }
  .title-text {
    font-size: 26px;
    padding-left: 14px;
    letter-spacing: 1px;
  }
  .title-text .en {
    font-family: "Times New Roman", Times, serif;
  }
  /* side tab on right margin */
  .side-tab {
    position: absolute;
    right: 0;
    top: 178px;
    width: 46px;
    padding: 5px 4px;
    border: 1px solid #333;
    border-right: none;
    background: #f3ede6;
    font-size: 11px;
    text-align: center;
    box-sizing: border-box;
    overflow: hidden;
    white-space: nowrap;
  }
  /* boxed sub-headings */
  .box-head {
    border: 2px solid #f08030;
    padding: 6px 10px;
    font-size: 15px;
    font-weight: bold;
    margin: 26px 0 14px 0;
    display: block;
  }
  p {
    font-size: 14px;
    line-height: 1.9;
    text-indent: 2em;
    margin: 0 0 12px 0;
    text-align: justify;
  }
  .hl {
    border-bottom: 3px solid #f5a35c;
    padding-bottom: 1px;
  }
  .flow { overflow: hidden; }
  .placeholder {
    float: right;
    width: 210px;
    height: 215px;
    border: 1px dashed #999;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 11px;
    color: #666;
    text-align: center;
    margin: 6px 0 6px 14px;
    box-sizing: border-box;
    padding-bottom: 6px;
  }
  .narrow p { text-indent: 2em; }
</style>
</head>
<body>
<div class="page">
  <div class="gutter"></div>

  <div class="running-head">平读<span class="en">Plain reading</span></div>

  <div class="title-block">
    <div class="title-tag">用手指来指引读书的方向</div>
    <div class="title-main">
      <div class="method-no">方法 <b>40</b></div>
      <div class="title-text">指读（<span class="en">Pointing&nbsp;Reading</span>）</div>
    </div>
  </div>

  <div class="side-tab">方法4[?]</div>

  <div class="box-head">①用手指或是笔尖指着当前读到的位置</div>

  <p><span class="hl">视线聚焦在手指或笔尖。</span></p>

  <div class="box-head">②沿着阅读的方向移动手指或笔尖</div>

  <p><span class="hl">一边往下读，一边移动手指或笔尖。此时视线依然聚焦在手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。</span></p>

  <div class="flow">
    <figure class="placeholder">[Illustration: hand-drawn cat reading an open book, right side]</figure>
    <div class="narrow">
      <p><span class="hl">大家也可以试着将这种方式与朗读结合起来，将指着的内容出声读出来。</span></p>
    </div>
  </div>

</div>
</body>
</html>
