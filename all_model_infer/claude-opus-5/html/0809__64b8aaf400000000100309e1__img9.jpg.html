<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖 昨表帖 楷書</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    background: #cfcabb;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "Songti SC", serif;
  }
  .page {
    position: relative;
    width: 540px;
    height: 1160px;
    margin: 0 auto;
    background: #cdc6b4;
    box-sizing: border-box;
    padding: 60px 30px 60px 30px;
  }
  .paper {
    position: relative;
    width: 100%;
    height: 100%;
    background: #d3ccba;
  }
  /* 竖排右起 */
  .columns {
    position: absolute;
    top: 20px;
    right: 10px;
    height: 1000px;
    display: flex;
    flex-direction: row;      /* 从右到左依靠 row-reverse 的排列 */
    flex-direction: row;
    align-items: flex-start;
  }
  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 27px;
    line-height: 1.45;
    letter-spacing: 4px;
    color: #16120e;
    margin-left: 4px;
    height: 1000px;
  }
  .title-col {
    font-size: 20px;
    letter-spacing: 3px;
    height: 200px;
    margin-left: 14px;
    padding-top: 60px;
  }
  .title-col .gap { letter-spacing: 3px; }
  .col-short { height: 780px; }
  .col-sig {
    font-size: 24px;
    height: 700px;
    padding-top: 180px;
  }
  .seals {
    position: absolute;
    left: 40px;
    top: 700px;
    width: 40px;
  }
  .seal {
    width: 26px;
    height: 26px;
    border: 2px solid #a83a2c;
    color: #a83a2c;
    font-size: 9px;
    line-height: 1;
    text-align: center;
    margin-bottom: 14px;
    box-sizing: border-box;
    padding: 3px 1px;
    writing-mode: vertical-rl;
  }
  .seal.big { height: 34px; }
  .placeholder {
    border: 1px dashed #8a7f6a;
    color: #5a5145;
    font-size: 10px;
    text-align: center;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="page">
 <div class="paper">

  <div class="columns">

    <!-- 第1行(最右) -->
    <div class="col">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時嚴寒奉被</div>

    <!-- 第2行 -->
    <div class="col">手詔伏承聖體御膳勝常以慰下情臣故患匈滿乞氣上頓之匆匆慈</div>

    <!-- 第3行 -->
    <div class="col">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>

    <!-- 第4行 -->
    <div class="col">頓首死罪死罪　臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>

    <!-- 第5行 -->
    <div class="col">慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀[?]</div>

    <!-- 第6行 -->
    <div class="col col-short">愍存益勞聖心謹附承動静臣廙言</div>

    <!-- 第7行 落款 -->
    <div class="col col-sig">歲在癸卯眷耀陽書於未央雲舍</div>

  </div>

  <!-- 標題(位於最右上方,獨立小字) -->
  <div class="title-col col" style="position:absolute; top:20px; right:-0px; display:none;"></div>

  <!-- 印章 -->
  <div class="seals">
    <div class="seal">[印]</div>
    <div class="seal big">[印]</div>
  </div>

 </div>
</div>

<!-- 標題以絕對定位置於畫面右側上方 -->
<div style="display:none"></div>

<script>
/* 將標題插入到 columns 最右側(圖中位於最右列左側偏上位置) */
(function(){
  var cols = document.querySelector('.columns');
  var t = document.createElement('div');
  t.className = 'col title-col';
  t.textContent = '祥除帖　昨表帖';
  cols.appendChild(t);
  /* 圖中標題在最右邊,故移到首位 */
  cols.insertBefore(t, cols.firstChild);
  /* 實際圖像:標題在最右列的右側,故置於 flex 起點 */
})();
</script>
</body>
</html>
