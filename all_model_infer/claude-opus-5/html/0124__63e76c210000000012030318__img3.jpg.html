<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词笔记 — 词汇对照</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e9e6dd;
    font-family: "Comic Sans MS", "Segoe Print", "KaiTi", cursive;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #f2efe6;
    border-right: 26px solid #d8d4c7;
    box-sizing: border-box;
    padding: 30px 20px 20px 40px;
  }
  .group {
    margin-bottom: 26px;
  }
  .row {
    display: flex;
    align-items: baseline;
    padding: 5px 0;
    border-bottom: 1px solid #cfcbbd;
  }
  .word {
    flex: 0 0 250px;
    font-size: 20px;
    letter-spacing: 1px;
  }
  .def {
    flex: 1 1 auto;
    font-size: 19px;
  }
  .indent1 { padding-left: 18px; }
  .indent2 { padding-left: 10px; }
  .blue { color: #2b3a9c; }
  .dark { color: #1b1b1b; }
  .purple { color: #4b3fa0; }
</style>
</head>
<body>
<div class="page">

  <div class="group">
    <div class="row">
      <div class="word dark">charity</div>
      <div class="def dark">n.慈善机构</div>
    </div>
    <div class="row">
      <div class="word dark indent2">clarity</div>
      <div class="def dark">n.(思路,图像)清晰</div>
    </div>
    <div class="row">
      <div class="word dark indent1">clarify</div>
      <div class="def dark">V. 阐明,阐释</div>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <div class="word blue">consistent</div>
      <div class="def purple">adj. 一贯的, 与…一致的</div>
    </div>
    <div class="row">
      <div class="word blue indent1">resist</div>
      <div class="def purple">V. 抵制</div>
    </div>
    <div class="row">
      <div class="word blue indent1">insist</div>
      <div class="def purple">V. 坚持</div>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <div class="word dark">insert</div>
      <div class="def dark">V. 插入, 嵌入</div>
    </div>
    <div class="row">
      <div class="word dark">assert</div>
      <div class="def dark">V. 断言; 坚持主张</div>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <div class="word blue">eminent</div>
      <div class="def purple">adj. 杰出的</div>
    </div>
    <div class="row">
      <div class="word blue">prominent</div>
      <div class="def purple">adj. 杰出的, 重要的</div>
    </div>
    <div class="row">
      <div class="word blue">eliminate</div>
      <div class="def purple">V. 消除; 淘汰</div>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <div class="word dark">integral</div>
      <div class="def dark">adj. 必不可少的</div>
    </div>
    <div class="row">
      <div class="word dark">integrity</div>
      <div class="def dark">n. 诚实, 正直</div>
    </div>
    <div class="row">
      <div class="word dark">integrate</div>
      <div class="def dark">V. (使)融入</div>
    </div>
  </div>

  <div class="group">
    <div class="row">
      <div class="word blue">fabricate</div>
      <div class="def purple">V. 捏造</div>
    </div>
    <div class="row">
      <div class="word blue">fluctuate</div>
      <div class="def purple">V. 波动, 上下浮动</div>
    </div>
  </div>

</div>
</body>
</html>
