<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #111;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    position: relative;
    padding-bottom: 40px;
  }

  /* ===== Header banner ===== */
  .header {
    background: #F26B0F;
    border-radius: 0 0 14px 14px;
    padding: 10px 18px 14px 18px;
    position: relative;
    height: 138px;
  }
  .header .copyright {
    position: absolute;
    left: 16px;
    top: 10px;
    width: 26px;
    height: 26px;
    border: 3px solid #fff;
    border-radius: 50%;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    line-height: 21px;
    text-align: center;
  }
  .header .year {
    position: absolute;
    right: 20px;
    top: 12px;
    color: #111;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .header .diamonds {
    position: absolute;
    left: 22px;
    top: 48px;
    color: #111;
    font-size: 9px;
    line-height: 12px;
    text-align: center;
  }
  .header .main-title {
    position: absolute;
    left: 62px;
    top: 30px;
    font-size: 62px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #111;
    white-space: nowrap;
  }
  .header .stamp {
    position: absolute;
    right: 22px;
    bottom: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #111;
  }

  /* ===== Intro paragraph ===== */
  .intro {
    padding: 18px 34px 0 34px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #222;
  }

  /* ===== Cards ===== */
  .card {
    margin: 30px 22px 0 22px;
    border: 2.5px solid #F26B0F;
    border-radius: 18px;
    padding: 16px 14px 12px 14px;
    background: #fff;
  }
  .card-title {
    font-size: 19px;
    font-weight: 800;
    color: #111;
    margin: 0 0 14px 6px;
  }
  .card-title .spark {
    color: #F26B0F;
    font-size: 15px;
    margin-left: 8px;
  }
  .card-caption {
    font-size: 11.5px;
    line-height: 1.8;
    color: #222;
    margin: 12px 2px 0 2px;
  }

  /* ===== Color blob placeholders ===== */
  .placeholder {
    width: 470px;
    height: 108px;
    display: block;
    overflow: hidden;
    position: relative;
    color: transparent;
    font-size: 0;
  }
  .swatch-1 {
    background: linear-gradient(90deg,
      #00913A 0%, #00913A 30%,
      #F5E400 30%, #F5E400 62%,
      #0B62A4 62%, #0B62A4 100%);
  }
  .swatch-2 {
    background: linear-gradient(90deg,
      #9DC93A 0%, #9DC93A 28%,
      #000000 28%, #000000 62%,
      #F5285C 62%, #F5285C 100%);
  }

  /* ===== Bottom bar ===== */
  .footer-bar {
    margin: 34px 0 0 0;
    height: 22px;
    background: #F26B0F;
    border-radius: 8px 8px 0 0;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="copyright">C</div>
    <div class="year">2023</div>
    <div class="diamonds">&#9670;<br>&#9670;<br>&#9670;<br>&#9670;</div>
    <div class="main-title">对比色配色</div>
    <div class="stamp">瑞</div>
  </div>

  <!-- Intro -->
  <p class="intro">
    对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都<br>
    使用对比强烈的色彩, 所以配色清晰而有力。
  </p>

  <!-- Card 1 -->
  <div class="card">
    <div class="card-title">富有朝气的配色 <span class="spark">&#10022;</span></div>
    <figure class="placeholder swatch-1" style="margin:0;">[Color blob graphic: green / yellow / blue, centered]</figure>
    <div class="card-caption">
      以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合, 给人未来充满希望的感觉。
    </div>
  </div>

  <!-- Card 2 -->
  <div class="card">
    <div class="card-title">视觉冲击强烈的配色 <span class="spark">&#10022;</span></div>
    <figure class="placeholder swatch-2" style="margin:0;">[Color blob graphic: yellow-green / black / crimson, centered]</figure>
    <div class="card-caption">
      黄绿色相中选择华丽鲜艳的色调, 同时在相反色中选择活泼的深红色调在与黑色进行组合,<br>
      视觉冲击强烈。
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="footer-bar"></div>

</div>
</body>
</html>
