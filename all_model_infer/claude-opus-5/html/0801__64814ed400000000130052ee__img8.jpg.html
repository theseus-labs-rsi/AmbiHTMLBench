<style>

    box-sizing: border-box;

    color: #b9a77e;
    font-size: 11px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .emblem {
    width: 170px;
    height: 165px;
    margin: 118px auto 0 auto;
  }

  /* English caption row with sparkle ornaments on both sides */
  .en-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 55px auto 0 auto;
    width: 470px;
  }
  .sparkle {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: #d8c58e;
    font-size: 20px;
    line-height: 26px;

  .en-text {
    flex: 0 1 auto;

    padding: 0 6px;
  }

    margin: 26px auto 0 auto;

    font-family: "Songti SC", "SimSun", "STSong", serif;

    letter-spacing: 2px;
    color: #d9c07f;

<body>
  <div class="page">

    <div class="top-mark">[illegible]</div>

    <figure class="placeholder emblem">
      [Diagram: centered gold line emblem — diamond outline containing a Venus (female) symbol, with a fan of radiating lines across the upper interior]
    </figure>

    <div class="en-row">
      <div class="sparkle">&#10022;</div>
      <div class="en-text">
        I think the so-called loneliness refers to the person you are facing,<br>
        whose emotions are not on the same frequency as your own.
      </div>
      <div class="sparkle">&#10022;</div>
    </div>

    <div class="cn-quote">
      “ 我想所谓孤独，<br>
      就是你面对的那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。 ”
    </div>

  </div>
