<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 破晓艺术跨界展览</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f5f7;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
  }
  .poster {
    position: relative;
    width: 1200px;
    height: 2133px;
    margin: 0 auto;
    background:
      repeating-linear-gradient(to right, #e6e8ec 0 1px, transparent 1px 152px),
      repeating-linear-gradient(to bottom, #e6e8ec 0 1px, transparent 1px 152px),
      #f7f8fa;
    overflow: hidden;
    color: #21239b;
  }

  /* 背景装饰大字 */
  .bg-new, .bg-year {
    position: absolute;
    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 30px;
    line-height: 1;
    z-index: 0;
    user-select: none;
  }
  .bg-new { top: 30px; left: 130px; font-size: 300px; }
  .bg-year { top: 1610px; left: 400px; font-size: 260px; }
  .bg-circle {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    background: #ffffff;
  }
  .bg-circle.c1 { width: 520px; height: 520px; top: 130px; left: 620px; }
  .bg-circle.c2 { width: 620px; height: 620px; top: 1160px; left: 520px; opacity: .8; }

  /* 前景内容 */
  .content { position: relative; z-index: 2; }

  .dash-blue {
    position: absolute;
    background: #21239b;
    height: 12px;
    width: 64px;
  }

  .year {
    position: absolute;
    top: 235px;
    left: 78px;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 150px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #21239b;
    line-height: 1;
  }

  .title-block {
    position: absolute;
    top: 430px;
    left: 78px;
    width: 670px;
  }
  .band {
    background: #21239b;
    color: #ffffff;
    font-size: 128px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.25;
    padding: 0 6px;
    position: relative;
  }
  .band .overlay {
    position: absolute;
    left: 6px;
    top: 44%;
    color: #f5245f;
    font-size: 128px;
    font-weight: 900;
    letter-spacing: 4px;
    white-space: nowrap;
  }

  .big-word {
    position: absolute;
    left: 78px;
    font-size: 320px;
    font-weight: 900;
    letter-spacing: 0;
    line-height: 1;
    color: #21239b;
    white-space: nowrap;
  }
  .big-word.w1 { top: 610px; }
  .big-word.w2 { top: 975px; }

  .pink-bar {
    position: absolute;
    left: 78px;
    top: 1258px;
    width: 668px;
    height: 82px;
    background: #f5245f;
    z-index: 1;
  }

  /* 右侧时间 */
  .time-block {
    position: absolute;
    right: 80px;
    top: 1045px;
    text-align: right;
  }
  .label {
    font-size: 38px;
    letter-spacing: 6px;
    color: #21239b;
    margin-bottom: 8px;
  }
  .date {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 78px;
    font-weight: 900;
    color: #f5245f;
    letter-spacing: 2px;
    line-height: 1.05;
  }
  .date-sep {
    display: inline-block;
    width: 44px;
    height: 9px;
    background: #f5245f;
    margin: 22px 0;
  }

  /* 票价 */
  .price-block {
    position: absolute;
    left: 82px;
    top: 1470px;
  }
  .price-line {
    color: #f5245f;
    font-weight: 900;
    line-height: 1;
  }
  .price-line .yen { font-size: 44px; }
  .price-line .num { font-size: 76px; font-family: Impact, "Arial Black", sans-serif; }
  .price-line .qi { font-size: 40px; }
  .price-sub {
    margin-top: 14px;
    font-size: 40px;
    color: #21239b;
    letter-spacing: 2px;
  }

  /* 地点 */
  .place-block {
    position: absolute;
    right: 80px;
    top: 1440px;
    text-align: right;
  }
  .place-block .dash {
    display: inline-block;
    width: 46px;
    height: 10px;
    background: #21239b;
    margin-bottom: 30px;
  }
  .place-name {
    font-size: 50px;
    letter-spacing: 2px;
    color: #21239b;
    margin-top: 10px;
  }

  /* 底部 */
  .footer-left {
    position: absolute;
    left: 82px;
    top: 1900px;
    font-size: 42px;
    letter-spacing: 3px;
    line-height: 1.9;
    color: #21239b;
  }
  .footer-right {
    position: absolute;
    right: 80px;
    top: 1900px;
    text-align: right;
    color: #21239b;
  }
  .footer-right .label2 {
    font-size: 40px;
    letter-spacing: 8px;
  }
  .footer-right .tel {
    margin-top: 12px;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 62px;
    letter-spacing: 2px;
    font-weight: 900;
  }
  .dash-bottom-right {
    position: absolute;
    right: 80px;
    top: 2035px;
    width: 60px;
    height: 11px;
    background: #21239b;
  }
  .dash-bottom-left {
    position: absolute;
    left: 82px;
    top: 2075px;
    width: 60px;
    height: 11px;
    background: #21239b;
  }
</style>
</head>
<body>
<div class="poster">
  <!-- 背景装饰 -->
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-new">NEW</div>
  <div class="bg-year">YEAR</div>

  <div class="content">
    <div class="dash-blue" style="top:190px; left:82px;"></div>
    <div class="year">2026</div>

    <div class="title-block">
      <div class="band">
        破晓艺术
        <span class="overlay">破晓艺术</span>
      </div>
    </div>

    <div class="big-word w1">跨界</div>
    <div class="pink-bar"></div>
    <div class="big-word w2" style="z-index:2;">展览</div>

    <div class="time-block">
      <div class="label">活动时间</div>
      <div class="date">01/01</div>
      <div class="date-sep"></div>
      <div class="date">01/03</div>
    </div>

    <div class="price-block">
      <div class="price-line">
        <span class="yen">￥</span><span class="num">60</span><span class="qi">起</span>
      </div>
      <div class="price-sub">单人票价</div>
    </div>

    <div class="place-block">
      <div class="dash"></div>
      <div class="label">活动地点</div>
      <div class="place-name">厦门湖里区稿定艺术馆</div>
    </div>

    <div class="footer-left">
      主办方：<br>
      稿定集团
    </div>

    <div class="footer-right">
      <div class="label2">联系电话</div>
      <div class="tel">0592-88888888</div>
    </div>

    <div class="dash-bottom-right"></div>
    <div class="dash-bottom-left"></div>
  </div>
</div>
</body>
</html>
