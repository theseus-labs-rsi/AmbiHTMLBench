<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script>
window.MathJax = {
  tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]}
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background: #16255c;
    background-image:
      radial-gradient(ellipse at 60% 18%, rgba(70,110,190,0.55) 0%, rgba(22,37,92,0) 55%),
      radial-gradient(ellipse at 15% 5%, rgba(60,95,175,0.35) 0%, rgba(22,37,92,0) 50%),
      linear-gradient(160deg, #1b2b66 0%, #16255c 40%, #101a44 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    color: #ffffff;
    width: 540px;
    min-height: 720px;
    position: relative;
    overflow: hidden;
  }
  .watermark {
    position: absolute;
    color: rgba(255,255,255,0.05);
    font-weight: bold;
    font-family: "SimSun", "Songti SC", serif;
    pointer-events: none;
    user-select: none;
  }
  .wm1 { font-size: 150px; top: 330px; left: 100px; }
  .wm2 { font-size: 150px; top: 330px; left: 240px; }
  .wm3 { font-size: 150px; top: 500px; left: 380px; }
  .wm4 { font-size: 110px; top: 20px; left: 10px; }

  .page {
    position: relative;
    z-index: 2;
    padding: 0 24px;
    box-sizing: border-box;
  }

  h1.title {
    font-family: "SimHei", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
    padding: 128px 0 12px 0;
    text-decoration: underline;
    text-underline-offset: 8px;
    text-decoration-thickness: 3px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 32px;
    font-size: 14.5px;
  }
  th, td {
    border: 1px solid rgba(255,255,255,0.55);
    padding: 15px 12px;
    font-weight: normal;
    line-height: 1.4;
  }
  th {
    text-align: center;
    font-weight: normal;
    padding: 12px;
  }
  td.q {
    text-align: left;
    letter-spacing: 0.5px;
  }
  td.a {
    text-align: center;
    width: 165px;
    letter-spacing: 0.5px;
  }
  td.note {
    text-align: right;
    letter-spacing: 0.5px;
    padding-right: 16px;
  }
</style>
</head>
<body>
  <div class="watermark wm4">言</div>
  <div class="watermark wm1">巨</div>
  <div class="watermark wm2">人</div>
  <div class="watermark wm3">人</div>

  <div class="page">
    <h1 class="title">富人眼中的富人是咋样？</h1>

    <table>
      <tr>
        <th>问题</th>
        <th style="width:165px;">回答</th>
      </tr>
      <tr>
        <td class="q">1.您觉得高净值人群资产拥有多少钱才算是？</td>
        <td class="a">1亿7,388,4万元</td>
      </tr>
      <tr>
        <td class="note" colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr>
        <td class="q">2.请问您每天工作小时数是？</td>
        <td class="a">8.2小时</td>
      </tr>
      <tr>
        <td class="q">3.您预计退休年龄？</td>
        <td class="a">59岁</td>
      </tr>
      <tr>
        <td class="q">4.您希望能活到多少岁？</td>
        <td class="a">88.2岁</td>
      </tr>
      <tr>
        <td class="note" colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr>
        <td class="q">5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="a">6.2个国家</td>
      </tr>
      <tr>
        <td class="q">6.请问您平均每月阅读书籍数量</td>
        <td class="a">2.4本书</td>
      </tr>
    </table>
  </div>
</body>
</html>
