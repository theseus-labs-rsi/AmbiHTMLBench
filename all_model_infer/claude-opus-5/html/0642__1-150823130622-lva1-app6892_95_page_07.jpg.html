<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-controller vs. Micro-processor</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
  }
  .slide {
    position: relative;
    width: 1024px;
    height: 768px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ---- Title bar ---- */
  .title-bar {
    position: absolute;
    top: 14px;
    left: 0;
    width: 100%;
    height: 32px;
    background: linear-gradient(to right, #46469b 0%, #46469b 45%, #b9b9c9 75%, #ffffff 100%);
  }
  .title-bar h1 {
    margin: 0;
    padding: 4px 0 0 88px;
    font-size: 23px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 0.2px;
  }
  .deco { position: absolute; }
  .deco.d1 { top: 14px; left: 14px; width: 12px; height: 12px; background: #46469b; }
  .deco.d2 { top: 14px; left: 42px; width: 22px; height: 22px; background: #c3c3dd; }
  .deco.d3 { top: 34px; left: 20px; width: 22px; height: 22px; background: #9a9ac6; }
  .deco.d4 { top: 40px; left: 46px; width: 12px; height: 12px; background: #46469b; }

  /* ---- Diagram panel ---- */
  .panel {
    position: absolute;
    top: 195px;
    left: 82px;
    width: 858px;
    height: 393px;
    background: #f2f2f2;
    border: 1px solid #d9d9d9;
    border-radius: 22px;
  }

  .heading {
    position: absolute;
    font-size: 21px;
    font-weight: bold;
    text-decoration: underline;
    color: #1a1a1a;
  }
  .h-onechip { top: 18px; left: 92px; }
  .h-many { top: 12px; left: 380px; }

  /* ---- Left: one chip ---- */
  .mcu-box {
    position: absolute;
    top: 70px;
    left: 12px;
    width: 275px;
    height: 275px;
    background: #29a3e0;
    border: 2px solid #1a1a1a;
  }
  .mcu-title {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    padding: 6px 0 8px 0;
  }
  .cell {
    background: #ffffff;
    border: 2px solid #1a1a1a;
    display: inline-block;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    padding: 7px 10px;
    vertical-align: middle;
  }
  .row {
    padding: 0 10px 11px 10px;
    white-space: nowrap;
  }
  .row .cell + .cell { margin-left: 8px; }
  .cell.wide { display: block; }

  /* ---- Right: many chips ---- */
  .chip {
    position: absolute;
    border: 1px solid #7a7a7a;
    font-size: 23px;
    font-weight: bold;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .c-micro   { top: 70px;  left: 350px; width: 218px; height: 78px; background: #33a852; color:#fff; }
  .c-clock   { top: 70px;  left: 586px; width: 88px;  height: 78px; background: #b98a72; color:#fff; }
  .c-usart   { top: 70px;  left: 690px; width: 122px; height: 78px; background: #9fd8ef; }
  .c-memory  { top: 172px; left: 350px; width: 218px; height: 78px; background: #1e9fe0; color:#fff; }
  .c-io      { top: 172px; left: 586px; width: 226px; height: 78px; background: #f2e6b8; }
  .c-timer   { top: 272px; left: 350px; width: 218px; height: 78px; background: #a6a6a6; }

  .c-other {
    top: 272px; left: 586px; width: 226px; height: 78px;
    background: #c9c2ea;
    border: 1px solid #7a7a7a;
    position: absolute;
  }
  .c-other .stripes {
    position: absolute; inset: 0; display: flex;
  }
  .c-other .stripes span { height: 100%; }
  .s1 { width: 25%; background: #c9c2ea; }
  .s2 { width: 25%; background: #f2e6b8; }
  .s3 { width: 25%; background: #a2d326; }
  .s4 { width: 25%; background: #f9c0d0; }
  .c-other .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; color: #1a1a1a;
  }

  /* ---- Footer ---- */
  .footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 15px;
  }
  .footer .page {
    position: absolute;
    right: 120px;
    top: 0;
    font-weight: bold;
    font-size: 17px;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="deco d2"></div>
  <div class="deco d3"></div>
  <div class="title-bar">
    <h1>Micro-controller vs. Micro-processor</h1>
  </div>
  <div class="deco d1"></div>
  <div class="deco d4"></div>

  <div class="panel">
    <div class="heading h-onechip">One Chip</div>
    <div class="heading h-many">Many Different Chips</div>

    <div class="mcu-box">
      <div class="mcu-title">Microcontroller</div>
      <div class="row">
        <span class="cell">CPU</span><span class="cell">Timer/Counter</span>
      </div>
      <div class="row">
        <span class="cell" style="padding-left:22px;padding-right:22px;">Memory</span><span class="cell">Clock</span>
      </div>
      <div class="row">
        <span class="cell">I/O Interface</span><span class="cell">USART</span>
      </div>
      <div class="row">
        <span class="cell wide">Other Peripherals</span>
      </div>
    </div>

    <div class="chip c-micro">Microprocessor</div>
    <div class="chip c-clock">Clock</div>
    <div class="chip c-usart">USART</div>
    <div class="chip c-memory">Memory</div>
    <div class="chip c-io">I/O Interfaces</div>
    <div class="chip c-timer">Timer/Counter</div>

    <div class="c-other">
      <div class="stripes">
        <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
      </div>
      <div class="label">Other Peripherals</div>
    </div>
  </div>

  <div class="footer">
    &copy; 2015 by Eng. Mohamed Tarek.
    <span class="page">7</span>
  </div>

</div>
</body>
</html>
