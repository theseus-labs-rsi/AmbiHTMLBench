<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江雪 - 柳宗元</title>
<script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "KaiTi", "STKaiti", "Songti SC", serif;
    background: #ffffff;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: linear-gradient(180deg, #fdf3f6 0%, #fbf6fa 30%, #f7f5fb 60%, #eae6f5 100%);
    overflow: hidden;
  }
  /* decorative watercolor placeholders */
  .placeholder {
    position: absolute;
    color: #9b8fae;
    font-size: 10px;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
  }
  .ph-top-flower {
    top: 0; right: 130px;
    width: 240px; height: 90px;
  }
  .ph-left-snow {
    top: 260px; left: 0;
    width: 150px; height: 120px;
  }
  .ph-right-snow {
    top: 330px; right: 0;
    width: 130px; height: 110px;
  }
  .ph-bottom-wash {
    bottom: 60px; left: 0;
    width: 540px; height: 160px;
  }
  .ph-boat {
    bottom: 90px; left: 170px;
    width: 200px; height: 110px;
  }

  .content {
    position: relative;
    z-index: 2;
    padding: 24px 40px 0 40px;
  }

  /* pinyin + hanzi vertical pairing */
  .line {
    text-align: center;
    margin: 0 0 6px 0;
  }
  .py {
    display: block;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    color: #4a4a5a;
    letter-spacing: 0.18em;
    margin-bottom: 2px;
  }
  .hz {
    display: block;
    font-size: 34px;
    color: #2f2f3a;
    letter-spacing: 0.22em;
  }

  .title .py { font-size: 14px; letter-spacing: 1.1em; }
  .title .hz { font-size: 42px; letter-spacing: 0.35em; font-weight: 500; }

  .author { margin-top: 14px; margin-bottom: 20px; }
  .author .py { font-size: 13px; letter-spacing: 0.20em; }
  .author .hz { font-size: 26px; letter-spacing: 0.16em; }

  .poem { margin-top: 22px; }
  .poem .line { margin-bottom: 14px; }
  .poem .py { letter-spacing: 0.55em; padding-left: 0.55em; }
  .poem .hz { font-size: 36px; letter-spacing: 0.30em; padding-left: 0.30em; }

  .trans-block {
    margin: 34px 0 0 8px;
    width: 330px;
  }
  .trans-label {
    display: inline-block;
    background: #b9425c;
    color: #ffffff;
    font-size: 15px;
    padding: 2px 10px;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .trans-text {
    font-size: 19px;
    line-height: 1.65;
    color: #2f2f3a;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="page">

  <figure class="placeholder ph-top-flower">[Illustration: pink watercolor blossoms, top-right]</figure>
  <figure class="placeholder ph-left-snow">[Illustration: snow-covered purple rocks, mid-left]</figure>
  <figure class="placeholder ph-right-snow">[Illustration: snow-covered purple rocks, mid-right]</figure>
  <figure class="placeholder ph-bottom-wash">[Illustration: purple watercolor river wash, bottom]</figure>
  <figure class="placeholder ph-boat">[Illustration: fisherman in straw hat angling from small boat, bottom-center]</figure>

  <div class="content">

    <div class="line title">
      <span class="py">jiāng&nbsp;&nbsp;&nbsp;xuě</span>
      <span class="hz">江 雪</span>
    </div>

    <div class="line author">
      <span class="py">táng&nbsp;&nbsp;&nbsp;liǔ&nbsp;&nbsp;zōng yuán</span>
      <span class="hz">[唐] 柳 宗 元</span>
    </div>

    <div class="poem">
      <div class="line">
        <span class="py">qiān shān niǎo fēi jué</span>
        <span class="hz">千山鸟飞绝，</span>
      </div>
      <div class="line">
        <span class="py">wàn jìng rén zōng miè</span>
        <span class="hz">万径人踪灭。</span>
      </div>
      <div class="line">
        <span class="py">gū zhōu suō lì wēng</span>
        <span class="hz">孤舟蓑笠翁，</span>
      </div>
      <div class="line">
        <span class="py">dú diào hán jiāng xuě</span>
        <span class="hz">独钓寒江雪 。</span>
      </div>
    </div>

    <div class="trans-block">
      <span class="trans-label">译文:</span>
      <div class="trans-text">
        群山之间，没有一只鸟儿飞过。纵横的小路上，见不到行人的踪迹。只有一位身披蓑衣、头戴笠帽的渔翁，架着小船，冒着风雪，在寒冷的江上独自垂钓。
      </div>
    </div>

  </div>
</div>
</body>
</html>
