  <div class="header-row">
    <div class="title-tag">3. 忽视你的需求，内耗你的精力</div>
    <div class="placeholder">[图标：闪电电池 右上]</div>
  </div>

  <p><span class="bold">这一种人，不仅可能是身边的朋友</span>，亲密关系中也会出现。爱我们的人，也可能会“害”我们。</p>

  <p><span class="bold">忽视需求，是关系中隐藏的一把刀</span>，对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>

  <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>

  <p class="bold">经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</p>

  <div class="check-block">
    <div class="check-mark">✔</div>
    <div class="check-text">面对关系亲近的人的控制，先做出必要的沟通，<span class="indent">坦诚表达自己的感受，必要时保持适当距离。</span></div>
  </div>

  <p class="bold">与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。</p>
