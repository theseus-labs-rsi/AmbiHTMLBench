<style>

  body {
    margin: 0;
    background: #ffffff;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    color: #1a1a1a;
  }
  .page {
    position: relative;
    width: 540px;
    padding: 6px 0 10px 0;
  }
  /* 右侧竖线分隔栏 */
  .right-rail {
    position: absolute;
    top: 0;
    right: 0;
    width: 42px;
    height: 100%;
    border-left: 1px solid #dcdcdc;
  }
  .arrow {
    position: absolute;
    right: 10px;
    width: 14px;
    text-align: center;
    color: #9b9b9b;
    font-size: 12px;
    line-height: 1;
  }
  .rowline {
    position: absolute;
    right: 0;
    width: 42px;
    border-top: 1px solid #ececec;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    position: relative;
    padding-left: 26px;
    margin: 0;
  }
  li::before {
    content: "•";
    position: absolute;
    left: 8px;
    top: 0;
    color: #b03a2e;
    font-size: 20px;
    line-height: inherit;
  }
  .lvl1 > li {
    margin-left: 30px;
  }
  .lvl1 > li::before {
    color: #555;
  }
  .lvl2 > li::before {
    color: #555;
  }
  .lvl2 {
    margin-left: 32px;
    border-left: 1px solid #d9d9d9;
    padding-left: 4px;
  }

  .title {
    color: #c0392b;
    font-size: 21px;
    line-height: 34px;
    font-weight: 700;
  }
  .title .strong { font-weight: 700; }

  .lvl1 > li {
    font-size: 20px;
    line-height: 40px;
    color: #1a1a1a;
  }
  .lvl2 > li {
    font-size: 18px;
    line-height: 40px;
    color: #1a1a1a;
  }
  .lvl2 > li.multiline {
    line-height: 34px;
    padding-top: 3px;
  }
</style>
</head>
<body>
