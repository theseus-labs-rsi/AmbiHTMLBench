<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步行游览区 北线</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #1a1a1a;
  }
  .page {
    position: relative;
    width: 542px;
    min-height: 730px;
    margin: 0 auto;
    padding: 10px 0 20px 0;
    background: #fdfdfd;
    display: flex;
  }
  /* ---------- Left sidebar column ---------- */
  .sidebar {
    position: relative;
    width: 140px;
    flex: 0 0 140px;
    padding: 8px 0 0 22px;
    border-right: 1px solid #cfcfcf;
  }
  .vtitle {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 10px;
    line-height: 1.15;
    color: #2f4a56;
    height: 320px;
  }
  .vtitle span {
    display: inline-block;
    border: 2px solid #7f9aa6;
    padding: 4px 2px;
    margin-bottom: 8px;
  }
  .subtitle {
    margin: 26px 0 0 6px;
    width: 46px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #2f4a56;
    line-height: 1.3;
  }
  .subtitle .boxed {
    display: block;
    border: 2px solid #7f9aa6;
    padding: 2px 0;
    margin-bottom: 6px;
  }
  .subtitle .arrow { font-size: 16px; display: block; margin: 2px 0; }
  .watermark {
    position: absolute;
    left: 46px;
    bottom: 90px;
    font-size: 72px;
    font-weight: 700;
    color: #cfe0e6;
    opacity: .8;
  }
  /* ---------- Right content column ---------- */
  .content {
    position: relative;
    flex: 1;
    padding: 4px 16px 0 22px;
    border-left: 2px solid #b9c9d0;
    margin-left: -1px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    height: 46px;
  }
  .topbar .ph-arrow {
    width: 62px;
    height: 30px;
  }
  .topbar .label {
    font-size: 22px;
    font-weight: 700;
    color: #2f7f9c;
  }
  .topbar .ph-mountain {
    width: 40px;
    height: 34px;
  }
  .section { position: relative; margin-bottom: 6px; }
  .tag {
    display: inline-block;
    border: 2px solid #3d7f96;
    border-radius: 12px;
    padding: 6px 16px;
    font-size: 22px;
    font-weight: 700;
    color: #2f7f9c;
    letter-spacing: 2px;
    margin: 6px 0 4px 8px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .para {
    font-size: 17px;
    line-height: 1.75;
    font-weight: 700;
    margin: 6px 0 10px 0;
    text-align: justify;
  }
  /* ---------- Placeholders ---------- */
  .placeholder {
    background: #eceff1;
    border: 1px dashed #9aa7ad;
    color: #5c6a70;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2px;
  }
  .photo1 { width: 160px; height: 122px; margin-top: 30px; }
  .photo2 { width: 160px; height: 108px; margin-top: 8px; }
  .photo3 { width: 200px; height: 92px; margin-top: 6px; }
  .curve { width: 30px; height: 26px; }
</style>
</head>
<body>
<div class="page">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="vtitle">
      <span>步</span><span>行</span><span>游</span><span>览</span><span>区</span>
    </div>
    <div class="subtitle">
      <span class="boxed">北</span>
      <span class="arrow">▶</span>
      <span class="boxed">线</span>
    </div>
    <div class="watermark">6</div>
  </aside>

  <!-- RIGHT CONTENT -->
  <main class="content">

    <div class="topbar">
      <figure class="placeholder ph-arrow" style="margin:0;">[Icon: hand-drawn arrow]</figure>
      <div class="label">◆ 接上篇</div>
      <figure class="placeholder ph-mountain" style="margin:0;">[Icon: mountain]</figure>
    </div>

    <!-- Section 1 -->
    <section class="section">
      <div class="row">
        <div>
          <div class="tag">马达加斯加<br>丛林</div>
        </div>
        <figure class="placeholder photo1" style="margin:30px 0 0 0;">[Photo: visitor feeding lemurs in jungle enclosure, top-right]</figure>
      </div>
      <p class="para">环尾狐猴的天堂，成群结队的环尾狐猴在这里攀爬跳跃，在零距离投喂专属食物的时候有可能会跳到你的肩膀上哦，这时候就是拍照留念的最佳时机啦！</p>
    </section>

    <!-- Section 2 -->
    <section class="section">
      <div class="row">
        <div>
          <div class="tag">小熊猫展区</div>
        </div>
        <figure class="placeholder photo2" style="margin:0 0 0 0;">[Photo: red panda display area with plush toys and signage, right]</figure>
      </div>
      <p class="para">北野里最受欢迎的网红打卡地之一，里面设有零食铺子可以购买竹叶和小熊猫互动，注：自带的食物不能给它吃哦！</p>
    </section>

    <!-- Section 3 -->
    <section class="section">
      <div class="row">
        <div>
          <div class="tag">爬行动物馆</div>
        </div>
        <figure class="placeholder photo3" style="margin:0;">[Photo: coiled yellow python, right]</figure>
      </div>
      <p class="para">喜欢蟒蛇、蜥蜴的小伙伴们千万不要错过这里，黄金蟒、网纹蟒、红鬣蜥、绿鬣蜥、黑白泰迦等等都有昂！PS:怕蛇的小伙伴就不要挑战自己啦！</p>
    </section>

  </main>
</div>
</body>
</html>
