<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用暗示的积极力量养出优秀孩子</title>
<script>
window.MathJax = {
  tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
  }
  .page {
    width: 550px;
    margin: 0 auto;
    padding: 20px 0 30px 0;
    box-sizing: border-box;
  }
  .title-box {
    margin: 12px 40px 0 40px;
    border: 1px solid #9aa4d8;
    border-radius: 6px;
    background: #eceefa;
    text-align: center;
    padding: 10px 0 12px 0;
  }
  .title-box .t {
    font-size: 23px;
    font-weight: bold;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .title-box .t .hl {
    color: #7a2fd0;
  }
  .subtitle {
    margin: 26px 0 0 40px;
    font-size: 17px;
    color: #222;
    letter-spacing: 1px;
  }
  .list-box {
    margin: 22px 30px 0 30px;
    background: #eceefa;
    border: 1px solid #c9cde8;
    padding: 16px 10px 16px 14px;
  }
  .item {
    display: flex;
    align-items: flex-start;
    padding: 6px 0;
    font-size: 16.5px;
    letter-spacing: 0.5px;
  }
  .mark {
    width: 26px;
    flex: 0 0 26px;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    line-height: 1.5;
  }
  .cross { color: #c00000; }
  .check { color: #4bb648; }
  .bad {
    color: #1a1a1a;
  }
  .good {
    color: #7a2fd0;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-box">
    <span class="t">用<span class="hl">暗示</span>的积极力量养出优秀孩子</span>
  </div>

  <div class="subtitle">学习上，让孩子体验一个个小成功</div>

  <div class="list-box">
    <div class="item"><span class="mark cross">✖</span><span class="bad">你磨蹭半天了，没写几个字，再磨下去就别睡了</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">越早完成作业，休息的时间就越多！</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">这么简单的题都不会做？</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">这道题你觉得难，不太会是吗？</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">赶紧写作业，一点都不自觉</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">你很少忘记写作业的，如果需要帮助就告诉我。</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">你这孩子怎么这么犟呢，你要听话</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">你可以说“不”，但我想听听你的理由理解你。</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">你怎么这么烦人呢，就不能安静一会儿吗？</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">你自己先去玩一会，妈妈忙完就马上找你。</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">勇敢点，这有什么的啊？</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">我相信你行的，再试试看，我陪着你</span></div>

    <div class="item"><span class="mark cross">✖</span><span class="bad">快点走，再拖拖拉拉你就别出去了。</span></div>
    <div class="item"><span class="mark check">✓</span><span class="good">我们来比一比，看谁更快出门。</span></div>
  </div>

</div>
</body>
</html>
