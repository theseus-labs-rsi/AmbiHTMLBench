    padding-top: 45px;

    color: #888;

    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%);

  .cards {
    display: flex;
    justify-content: space-between;
    margin: 30px 12px 20px 12px;
    gap: 6px;
  }
  .card {
    flex: 1;
    border: 1px solid #4aa08a;
    border-radius: 10px;
    padding: 12px 8px;
