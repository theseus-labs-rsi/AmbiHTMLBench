<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 第③步：调整所得税</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
<style>
  body{
    margin:0;
    padding:0;
    background:repeating-linear-gradient(90deg,#f6efe4,#f6efe4 6px,#f1e7d8 6px,#f1e7d8 12px);
    font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
    color:#3b3b3b;
  }
  .page{
    position:relative;
    width:540px;
    height:711px;
    margin:0 auto;
    background:#fbf8f2;
    border:2px solid #d8b98a;
    border-radius:14px;
    box-sizing:border-box;
    overflow:hidden;
  }
  .paw{
    color:#c69a5c;
    font-size:15px;
  }
  .title{
    text-align:center;
    margin-top:34px;
    font-size:31px;
    font-weight:bold;
    letter-spacing:2px;
    color:#2f2f2f;
  }
  .title .line2{
    display:block;
    margin-top:12px;
    font-size:33px;
  }
  .paw-left{position:absolute;left:145px;top:44px;}
  .paw-right{position:absolute;left:405px;top:38px;}

  .highlight{
    display:inline-block;
    margin:44px 0 0 62px;
    padding:3px 10px;
    background:#f4e3c7;
    font-weight:bold;
    font-size:17px;
    letter-spacing:1px;
    color:#3a3a3a;
  }
  .section{
    margin:22px 0 0 60px;
    font-size:15px;
  }
  .section b{font-size:15.5px;}
  .rows{
    margin:8px 0 0 40px;
    display:inline-block;
    text-align:right;
    line-height:26px;
    font-size:14px;
  }
  .brace-group{
    display:flex;
    align-items:center;
    margin-left:38px;
  }
  .brace{
    font-size:44px;
    color:#5a7fb0;
    margin:0 4px 0 6px;
    transform:scaleY(1.35);
    display:inline-block;
  }
  .brace-text{
    font-size:14px;
  }
  .group-angle{
    position:absolute;
    left:420px;
    top:318px;
    font-size:14px;
    text-align:center;
  }
  .group-angle .sub{
    display:block;
    margin-top:16px;
    margin-left:8px;
  }
  .arrow{
    position:absolute;
    left:410px;
    top:330px;
    width:0;
    height:0;
  }
  .arrow-line{
    position:absolute;
    left:407px;
    top:332px;
    width:7px;
    height:75px;
    background:#4a7fc1;
  }
  .arrow-head{
    position:absolute;
    left:399px;
    top:405px;
    width:0;
    height:0;
    border-left:11px solid transparent;
    border-right:11px solid transparent;
    border-top:17px solid #4a7fc1;
  }
  .accounting{
    margin:38px 0 0 78px;
    font-size:15px;
    line-height:34px;
  }
  .accounting .indent{
    display:inline-block;
    margin-left:74px;
  }
  .placeholder{
    position:absolute;
    border:1px dashed #d3c3a5;
    color:#a08e70;
    font-size:11px;
    text-align:center;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.35);
  }
  .cat-left{
    left:34px;
    bottom:8px;
    width:120px;
    height:70px;
  }
  .cat-right{
    right:24px;
    bottom:8px;
    width:120px;
    height:100px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="paw paw-left">🐾</div>
  <div class="paw paw-right">🐾</div>

  <div class="title">
    内部交易抵销
    <span class="line2">第③步：调整所得税</span>
  </div>

  <div class="highlight">若实现60%对外销售</div>

  <div class="section">
    <b>个别报表层面</b>因为存货跌价准备：
  </div>
  <div class="brace-group">
    <div class="rows">
      账面价值 900<br>
      计税基础 1200
    </div>
    <div class="brace">}</div>
    <div class="brace-text">递延所得税资产300*25%=75</div>
  </div>

  <div class="section" style="margin-top:26px;">
    <b>合并报表层面</b>因为存货跌价准备：
  </div>
  <div class="brace-group">
    <div class="rows">
      账面价值800<br>
      计税基础1200
    </div>
    <div class="brace">}</div>
    <div class="brace-text">递延所得税资产400*25%=100</div>
  </div>

  <div class="group-angle">
    【集团角度】
    <span class="sub">调增25</span>
  </div>
  <div class="arrow-line"></div>
  <div class="arrow-head"></div>

  <div class="accounting">
    会计处理：借：递延所得税资产25<br>
    <span class="indent">贷：所得税费用25</span>
  </div>

  <figure class="placeholder cat-left">[插图：趴着的猫咪，左下角]</figure>
  <figure class="placeholder cat-right">[插图：戴草帽的猫咪，右下角]</figure>

</div>
</body>
</html>
