<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节 海报</title>
<script>
window.MathJax = {

<style>
  html, body { margin:0; padding:0; background:#f2f2f2; }
  body { font-family: "Songti SC", "SimSun", "Noto Serif SC", serif; }

  .poster {
    position: relative;
    width: 1200px;
    height: 2133px;
    margin: 0 auto;
    background: #fdfdfd;
    overflow: hidden;
  }

  /* ---------- Top-left title zone ---------- */
  .title-zone {
    position: absolute;
    top: 100px;
    left: 80px;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
  }

  .main-title {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 150px;
    line-height: 1.05;
    letter-spacing: 6px;
    color: #111;
    font-weight: 400;
  }
  .main-title .red { color: #d31f26; }

  .circle-col {
    writing-mode: vertical-rl;
    margin-right: 18px;
    margin-top: 30px;
  }
  .circle-col span {
    display: inline-block;
    width: 76px;
    height: 76px;
    line-height: 74px;
    text-align: center;
    border: 2px solid #111;
    border-radius: 50%;
    font-size: 44px;
    margin-bottom: 22px;
    color: #111;
  }

  .subtitle {
    position: absolute;
    top: 880px;
    left: 105px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 40px;
    letter-spacing: 8px;
    color: #222;
  }

  /* ---------- Top-right pinyin zone ---------- */
  .pinyin-zone {
    position: absolute;
    top: 115px;
    right: 78px;
    text-align: center;
    z-index: 5;
  }
  .dot-grid {
    width: 62px;
    height: 62px;
    margin: 0 auto 22px auto;
    background:
      linear-gradient(#d31f26 0 0) 0 0/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 24px 0/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 48px 0/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 12px 16px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 36px 16px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 0 32px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 24px 32px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 48px 32px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 12px 48px/14px 14px no-repeat,
      linear-gradient(#d31f26 0 0) 36px 48px/14px 14px no-repeat;
  }
  .pinyin-zone p {
    margin: 0 0 10px 0;
    font-size: 34px;
    font-weight: bold;
    color: #111;
  }

  /* ---------- Central graphic placeholder ---------- */
  .placeholder {
    box-sizing: border-box;
    border: 1px dashed #bbb;
    color: #888;
    font-size: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    text-align: center;
  }

  .graphic-main {
    position: absolute;
    top: 300px;
    right: 0;
    width: 640px;
    height: 1370px;
  }

  .graphic-mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1200px;
    height: 430px;
  }

  .graphic-birds {
    position: absolute;
    top: 1490px;
    right: 40px;
    width: 190px;
    height: 170px;
  }

  /* ---------- Bottom info zone ---------- */
  .info {
    position: absolute;
    left: 80px;
    top: 1420px;
    width: 700px;
    z-index: 4;
  }
  .info .line {
    font-size: 46px;
    color: #111;
    margin-bottom: 34px;
    font-weight: bold;
  }
  .info .line .label { font-weight: normal; }

  .date-label {
    font-size: 22px;
    letter-spacing: 2px;
    color: #111;
    margin-bottom: 2px;
  }
  .date-row {
    display: flex;
    align-items: baseline;
    margin-bottom: 30px;
  }
  .date-row .big {
    font-size: 76px;
    color: #111;
    letter-spacing: 1px;
  }
  .date-row .small {
    font-size: 30px;
    color: #111;
    margin-left: 8px;
  }
  .date-row .slash {
    font-size: 62px;
    color: #111;
    margin: 0 24px;
  }
  .phone {
    font-size: 44px;
    color: #111;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Title block: vertical circled roles + vertical main title -->
  <div class="title-zone">
    <div class="main-title">
      <span class="red">京剧</span>艺术节
    </div>
    <div class="circle-col">
      <span>生</span><span>旦</span><span>净</span><span>末</span><span>丑</span>
    </div>
  </div>

  <div class="subtitle">稿定艺术展</div>

  <!-- Top-right pinyin -->
  <div class="pinyin-zone">
    <div class="dot-grid"></div>
    <p>Gao</p>
    <p>Ding</p>
    <p>Yi</p>
    <p>Shu</p>
  </div>

  <!-- Non-text graphics -->
  <figure class="placeholder graphic-main" style="margin:0;">
    [Illustration: abstract geometric Peking-opera figure — black triangle, pink/red circles, pink arrows, vertical red bar; right-center]
  </figure>

  <figure class="placeholder graphic-birds" style="margin:0;">
    [Illustration: flock of ink-wash birds; right side]
  </figure>

  <figure class="placeholder graphic-mountains" style="margin:0;">
    [Illustration: ink-wash mountains and bare trees; bottom full-width]
  </figure>

  <!-- Bottom information -->
  <div class="info">
    <div class="line"><span class="label">主办方：</span> 稿定集团</div>
    <div class="line"><span class="label">地点：</span> 厦门市稿定剧院</div>

    <div class="date-label">DATE.</div>
    <div class="date-row">
      <span class="big">12.20</span><span class="small">SUN</span>
      <span class="slash">/</span>
      <span class="big">12.30</span><span class="small">SAT</span>
    </div>

    <div class="phone">联系电话： 0592-8888888</div>
  </div>

</div>
</body>
</html>
