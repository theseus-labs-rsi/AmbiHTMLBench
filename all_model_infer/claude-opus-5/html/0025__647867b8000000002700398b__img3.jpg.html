<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信聊天记录截图</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background: #ededed;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    color: #000;
  }
  .chat {
    width: 540px;
    margin: 0 auto;
    padding: 10px 12px 0 12px;
    box-sizing: border-box;
  }
  .row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .row.right {
    justify-content: flex-end;
  }
  .avatar {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    border-radius: 4px;
    background: linear-gradient(180deg, #cfe0ea 0%, #cfe0ea 55%, #8fa7b3 56%, #6d8794 100%);
    font-size: 8px;
    color: #4a5c66;
    text-align: center;
    overflow: hidden;
  }
  .bubble {
    position: relative;
    max-width: 340px;
    background: #ffffff;
    border-radius: 6px;
    padding: 10px 12px;
    margin-left: 12px;
    word-wrap: break-word;
  }
  .bubble.green {
    background: #a0e75a;
    margin-left: 0;
    margin-right: 12px;
  }
  .num {
    display: inline-block;
    background: #4a9ad4;
    color: #fff;
    font-size: 13px;
    line-height: 18px;
    width: 18px;
    height: 18px;
    text-align: center;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: 2px;
  }
  .placeholder {
    display: block;
  }
</style>
</head>
<body>
<div class="chat">

  <div class="row">
    <figure class="avatar placeholder" style="margin:0;">[头像图片]</figure>
    <div class="bubble">
      <span class="num">6</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。
    </div>
  </div>

  <div class="row">
    <figure class="avatar placeholder" style="margin:0;">[头像图片]</figure>
    <div class="bubble">
      <span class="num">7</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰
    </div>
  </div>

  <div class="row">
    <figure class="avatar placeholder" style="margin:0;">[头像图片]</figure>
    <div class="bubble">
      <span class="num">8</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。
    </div>
  </div>

  <div class="row">
    <figure class="avatar placeholder" style="margin:0;">[头像图片]</figure>
    <div class="bubble" style="max-width:140px;">
      你重新写吧
    </div>
  </div>

  <div class="row right">
    <div class="bubble green" style="max-width:200px;">
      好的，谢谢老师
    </div>
    <figure class="avatar placeholder" style="margin:0;background:linear-gradient(180deg,#c9a06a,#7a4a2a);">[头像图片]</figure>
  </div>

</div>
</body>
</html>
