<title>缓解痛经</title>

<style>

    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    margin: 0 auto;

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 34px;
    font-size: 13px;
    color: #333;
    padding: 0 18px;
  }
  .status-bar .left {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
  }
  .status-bar .right {
    position: absolute;
    right: 18px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
  }
  .status-bar .icon {
    display: inline-block;
    border: 1px solid #333;
    border-radius: 2px;
    font-size: 8px;
    padding: 0 2px;
    line-height: 1.2;
  }
  .close {
    padding: 10px 0 0 32px;
    font-size: 21px;
    line-height: 1;
    color: #333;
  }
  .content {
    padding: 0 32px;
  }
  .num-heading {
    display: flex;
    align-items: center;
    margin: 16px 0 6px 0;
  }
  .num-badge {
    display: inline-block;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background: #f4a08a;

    margin-right: 8px;
    flex: none;

    color: #e0704a;

    border: 0;

  }

    font-size: 19px;

    letter-spacing: 0.5px;
    margin: 0 0 26px 0;
  }
  .section-block {
    text-align: center;
    margin: 78px 0 44px 0;
  }
  .section-box {
    display: inline-block;

<body>

<div class="status-bar">
  <span class="left"><span class="icon">HD</span><span>&#9776;</span><span>&#128246;</span></span>
  <span class="right"><span class="icon">&#9633;</span><span>19:43</span></span>
</div>

<div class="close">&#10005;</div>

<div class="content">

  <div class="num-heading">
    <span class="num-badge">5</span>
    <span class="num-title">月经来潮需停药</span>
  </div>
  <hr class="divider">

  <p>药物推迟月经可能会失败，服药过程中如月经来潮需停药。</p>

  <div class="section-block">
    <div class="section-box">
      <div class="section-num">2·</div>
      <div class="section-name">缓解痛经</div>
    </div>
  </div>

  <p>如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。</p>

  <div class="tag-arrow">
    <span class="tag-body">常用方案</span>
    <span class="tag-tip"></span>
  </div>

  <p>痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。</p>

  <p>以下三种方法，选其中一种方法即可：</p>

  <p>1.布洛芬 首剂 800 mg，之后根据需要 400～800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。</p>

  <p>2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。</p>

</div>
