<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营 48个必备工具</title>
<script>
window.MathJax = {
  tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]}
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #3a5245;
    font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #ffffff;
  }
  .page {
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    padding: 48px 32px 40px 32px;
    background: #3a5245;
  }
  h1.title {
    font-size: 40px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 10px 0 0 12px;
  }
  .tag {
    display: inline-block;
    background: #d3ae2a;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 8px 14px;
    margin: 28px 0 30px 12px;
  }

  .grid {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .col-a { width: 108px; }
  .col-b { width: 118px; }
  .col-c { width: 218px; }

  .card {
    padding: 14px 14px 16px 14px;
  }
  .card .part {
    font-size: 15px;
    font-weight: 700;
    color: #e8e8e8;
    margin-bottom: 14px;
  }
  .card .body {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.6;
    color: #ffffff;
  }
  .gray { background: #9aa79c; }
  .green { background: #4f9463; }

  .h-tall { height: 240px; }
  .h-mid { height: 200px; }
  .h-small { height: 130px; }
  .h-med { height: 130px; }
  .h-lower { height: 100px; }

  .row-bottom {
    margin-top: 8px;
  }
  .subcols {
    display: flex;
    gap: 8px;
  }
</style>
</head>
<body>
<div class="page">

  <h1 class="title">TikTok运营<br>48个必备工具</h1>

  <div class="tag">@ 徐徐教你做TikTok</div>

  <div class="grid">

    <!-- Column A -->
    <div class="col col-a">
      <div class="card gray h-tall">
        <div class="part">Part 01</div>
        <div class="body">7个TK<br>数据平台</div>
      </div>
    </div>

    <!-- Column B -->
    <div class="col col-b">
      <div class="card gray h-small">
        <div class="part">Part 02</div>
        <div class="body">3个好用<br>选品网站</div>
      </div>
      <div class="card gray" style="height:124px;">
        <div class="part">Part 03</div>
        <div class="body">5个视频<br>素材网站</div>
      </div>
    </div>

    <!-- Column C -->
    <div class="col col-c">
      <div class="card green" style="height:124px;">
        <div class="part">Part 05</div>
        <div class="body">4个剪辑<br>4个翻译软件</div>
      </div>
      <div class="subcols">
        <div class="card green" style="width:96px;height:236px;">
          <div class="part">Part 06</div>
          <div class="body">8个TK<br>传输管理<br>网站</div>
        </div>
        <div class="col" style="width:114px;">
          <div class="card green" style="height:126px;">
            <div class="part">Part 07</div>
            <div class="body">5个BGM<br>网站</div>
          </div>
          <div class="card green" style="height:102px;">
            <div class="part">Part 08</div>
            <div class="body">7个投放<br>联盟网站</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="row-bottom">
    <div class="card gray" style="width:234px;height:96px;">
      <div class="part">Part 04</div>
      <div class="body">6个TK数据分析网站</div>
    </div>
  </div>

</div>
