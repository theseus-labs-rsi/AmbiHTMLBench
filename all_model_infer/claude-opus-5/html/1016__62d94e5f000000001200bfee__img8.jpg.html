<body>

  <h1>住宿<span class="u-red">建议</span></h1>

  <h2>［选酒店关注点］</h2>

  <p class="item">
    <span class="tag">【<span class="name">沙滩</span>】</span>：亲子家庭出行游，<span class="u-red">对沙滩的质量和海水的选择上要干净、清澈</span>，<span class="u-red">沙子细软不扎脚的</span>。有私人海滩更佳
  </p>

  <p class="item">
    <span class="tag">【<span class="name">酒店设施</span>】</span>：针对酒店的洗护<span class="u-red">有没有提供宝宝专用</span>，以及宝宝专用的洗漱台和马桶等等，以及<span class="u-red">有没有婴儿床、床围</span>等床上用品提供
  </p>

  <p class="item">
    <span class="tag">【<span class="name">房间</span>】</span>：房间主题最好有小朋友喜欢的主题，比如<span class="u-red">太空主题</span>的房间或者星空主题的房间；以及房间有没有提供儿童帐篷、滑梯等玩乐设施。<span class="u-red">房型面积最好大一些</span>，<span class="u-red">有足够的空间给小朋友跑跳玩乐</span>
  </p>

  <p class="item">
    <span class="tag">【<span class="name">儿童玩乐设施</span>】</span>：看酒店儿童玩乐设施<span class="u-red">室内还是室外</span>.设施是不是<span class="u-red">每日一消毒</span>，看空间宽不宽敞。有没有家长休息区。有没有<span class="u-red">托管服务</span>，托管时间，托管玩的项目等具体小朋友玩乐细节
  </p>
