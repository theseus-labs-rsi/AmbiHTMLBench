<style>
  html, body { margin:0; padding:0; }
  body {
    font-family: "Songti SC", "SimSun", "Source Han Serif SC", serif;
    background: #cfc5b4;
    width: 540px;
    margin: 0 auto;
  }
  /* ===== Header band ===== */
  .header {
    background: #f7efe8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 14px 26px;
    box-sizing: border-box;
  }
  .logo { text-align: left; }
  .logo .title {
    font-family: "STKaiti", "KaiTi", "Songti SC", serif;
    font-weight: 700;
    font-size: 56px;
    color: #c0271d;
    letter-spacing: 2px;
    line-height: 1;
  }
  .logo .pinyin {
    margin-top: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #c0271d;
  }
  .header-right { text-align: right; }
  .header-right .line1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 3px;
  }
  .header-right .line1 .sep {
    color: #1a1a1a;
    margin: 0 8px;
    font-weight: 400;
  }
  .header-right .line2 {
    margin-top: 10px;
    border-top: 3px solid #1a1a1a;
    padding-top: 8px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #111;
  }

  /* ===== Body content ===== */
  .content {
    padding: 26px 24px 30px 24px;
    box-sizing: border-box;
  }
  .quote {
    text-align: center;
    font-weight: 700;
    color: #141414;
    line-height: 1.45;
  }
  .quote-1 { font-size: 33px; margin-bottom: 22px; }
  .quote-2 { font-size: 27px; margin: 26px 0 18px 0; }

  .label {
    font-size: 15px;
    color: #2b2b2b;
    margin: 0 0 14px 0;
  }
  .explain {
    font-size: 16px;
    line-height: 1.85;
    color: #1f1f1f;
    text-align: justify;
    margin: 0;
  }

<body>

  <div class="header">
    <div class="logo">
      <div class="title">人民日报</div>
      <div class="pinyin">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="line1">金句<span class="sep">│</span>摘抄</div>
      <div class="line2">心态主题</div>
    </div>
  </div>

  <div class="content">

    <div class="quote quote-1">
      且行且忘且随风，<br>
      且行且看且从容。
    </div>

    <p class="label">释义:</p>
    <p class="explain">
      意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们]遇到非常不平静的时候，只要能有-一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
    </p>

    <div class="quote quote-2">
      我将玫瑰藏于身后风起花落，<br>
      从此鲜花赠自己，<br>
      纵马踏花向自由。
    </div>

    <p class="label">释义:</p>
    <p class="explain">
      我把心中的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
    </p>

  </div>

</body>
