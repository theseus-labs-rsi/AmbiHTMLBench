<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    background: #f6f4ef;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", "Songti SC", serif;
    display: flex;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 41px,
        #9aa3ac 41px,
        #9aa3ac 42px
      );
    background-position: 0 26px;
    padding: 0;
    box-sizing: border-box;
    border: 1px solid #ddd8cc;
  }

  /* Top header row: weekday boxes at left, Date at right */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    height: 26px;
    padding: 2px 100px 0 4px;
    box-sizing: border-box;
  }
  .weekdays {
    display: inline-block;
    border: 1px solid #555;
    font-size: 8px;
    line-height: 12px;
  }
  .weekdays span {
    display: inline-block;
    width: 17px;
    text-align: center;
    border-right: 1px solid #555;
    font-family: Arial, Helvetica, sans-serif;
  }
  .weekdays span:last-child { border-right: none; }
  .date {
    font-size: 11px;
    font-family: Arial, Helvetica, sans-serif;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .content {
    padding: 0 30px 0 55px;
  }
  .line {
    height: 42px;
    line-height: 42px;
    font-size: 26px;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .blank { height: 42px; }
  .title {
    font-size: 28px;
    letter-spacing: 4px;
    padding-left: 15px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="weekdays">
      <span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
    </div>
    <div class="date">Date.&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;/</div>
  </div>

  <div class="content">
    <div class="line title">这是好的开始</div>
    <div class="blank"></div>
    <div class="blank"></div>
    <div class="line">从你看到这篇文章开始.</div>
    <div class="line">你会越来越有钱</div>
    <div class="line">越来越好看.</div>
    <div class="line">生活和心态也会越来越好.</div>
    <div class="line">请相信大数据.</div>
    <div class="line">是你自己把一切美好的东西.</div>
    <div class="line">都吸引了过来</div>
    <div class="line">你已经调到了接收钱的频率</div>
    <div class="line">接收美的频率.</div>
    <div class="line">你的能量频率对了才接收到这</div>
    <div class="line">条信息.</div>
    <div class="line">留下一句"全收到"</div>
    <div class="line">愿所有的愿望全能实现！</div>
  </div>

</div>
</body>
</html>
