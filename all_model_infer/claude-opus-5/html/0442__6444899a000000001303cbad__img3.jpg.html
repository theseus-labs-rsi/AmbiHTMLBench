<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #222;
    max-width: 540px;
  }

  /* ---- Top navigation bar ---- */
  .navbar {
    display: flex;
    align-items: center;
    padding: 18px 20px 10px 14px;
    gap: 12px;
  }
  .nav-back {
    font-size: 26px;
    line-height: 1;
    color: #333;
    font-weight: 300;
  }
  .nav-title {
    font-size: 21px;
    font-weight: 600;
    color: #E8C22B;
    letter-spacing: 1px;
    margin-left: 4px;
  }
  .nav-icons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 26px;
    padding-right: 8px;
  }
  .placeholder {
    display: inline-block;
    border: 1px dashed #ccc;
    color: #999;
    font-size: 9px;
    text-align: center;
    overflow: hidden;
    line-height: 1.1;
  }
  .icon-ph {
    width: 34px;
    height: 34px;
    border-radius: 50%;
  }
  .icon-ph.square {
    border-radius: 4px;
  }

  /* ---- Content ---- */
  .content {
    padding: 0 26px;
  }
  .section {
    margin-bottom: 58px;
  }
  .heading-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 34px 0 30px 0;
  }
  .check {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #F2C230;
    color: #fff;
    font-size: 15px;
    line-height: 26px;
    text-align: center;
    font-weight: 700;
  }
  .heading-text {
    font-size: 19px;
    font-weight: 600;
    color: #222;
    letter-spacing: 0.5px;
  }
  .quote {
    font-size: 19px;
    line-height: 2;
    letter-spacing: 0.5px;
    color: #333;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="navbar">
    <span class="nav-back">&#10094;</span>
    <span class="nav-title">金句合集</span>
    <span class="nav-icons">
      <span class="placeholder icon-ph">[图标:关注]</span>
      <span class="placeholder icon-ph square">[图标:分享]</span>
      <span class="placeholder icon-ph">[图标:更多]</span>
    </span>
  </div>

  <div class="content">

    <div class="section">
      <div class="heading-row">
        <span class="check">&#10003;</span>
        <span class="heading-text">他写「成长」，正是你所亲历</span>
      </div>
      <p class="quote">
        “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”<br>
        ——《病隙碎笔》
      </p>
    </div>

    <div class="section">
      <div class="heading-row">
        <span class="check">&#10003;</span>
        <span class="heading-text">他写「磨难」，报之以歌</span>
      </div>
      <p class="quote">
        “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》
      </p>
    </div>

  </div>

</body>
</html>
