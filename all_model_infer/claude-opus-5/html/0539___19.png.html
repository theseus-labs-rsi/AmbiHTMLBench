<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Into the Darkness — Film Poster</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }
  body {
    font-family: "Montserrat", "Century Gothic", "Trebuchet MS", sans-serif;
    color: #ffffff;
  }
  .poster {
    position: relative;
    width: 1587px;
    max-width: 100%;
    aspect-ratio: 1587 / 2245;
    margin: 0 auto;
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- TOP TEXT ZONE ---------- */
  .top-zone {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding-top: 6.2%;
    text-align: center;
    z-index: 3;
  }
  .presents {
    font-size: 2.35vw;
    letter-spacing: 0.42em;
    font-weight: 500;
    color: #ffffff;
    text-transform: uppercase;
    margin: 0 0 1.6% 0;
  }
  .title {
    font-family: "Playfair Display", "Times New Roman", Georgia, serif;
    color: #c0272d;
    font-size: 10.6vw;
    line-height: 0.98;
    letter-spacing: 0.02em;
    font-weight: 500;
    margin: 0;
    padding: 0 6%;
  }

  /* ---------- IMAGE PLACEHOLDER ZONE ---------- */
  .placeholder {
    position: absolute;
    top: 30.5%;
    left: 0;
    width: 100%;
    height: 52%;
    background: #0b0b0b;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .placeholder figcaption {
    color: #8a8a8a;
    font-size: 1.2vw;
    letter-spacing: 0.15em;
    text-align: center;
  }
  /* The sign visible inside the photograph */
  .park-sign {
    position: absolute;
    top: 45.5%;
    left: 50%;
    transform: translateX(-32%);
    background: #ffffff;
    color: #000000;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 2.1vw;
    letter-spacing: 0.02em;
    padding: 0.5% 1.1%;
    white-space: nowrap;
    z-index: 2;
  }

  /* ---------- BOTTOM TEXT ZONE ---------- */
  .bottom-zone {
    position: absolute;
    bottom: 4.2%;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
  }
  .director {
    color: #c0272d;
    font-size: 2.9vw;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 3.2% 0;
  }
  .details {
    color: #ffffff;
    font-size: 2.75vw;
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: 0.02em;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="top-zone">
      <div class="presents">Soulful Film Presents</div>
      <h1 class="title">INTO THE<br>DARKNESS</h1>
    </div>

    <figure class="placeholder">
      <figcaption>[Photo: black &amp; white underground parking garage with car, centered — full width]</figcaption>
    </figure>

    <div class="park-sign">SELF PARK 6'-0'' CLEARANCE</div>

    <div class="bottom-zone">
      <p class="director">Directed by Levi Stanford</p>
      <p class="details">
        May 23, 2019 | 2:00 pm<br>
        Michael Hopper Auditorium<br>
        Oreixs university, OH
      </p>
    </div>

  </div>
</body>
</html>
