<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Three Thousand - Poster</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    --orange: #E8641A;
    --orange-light: #F4A76A;
    --paper: #FDF7F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ddd;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .poster {
    position: relative;
    width: 540px;
    height: 720px;
    background: var(--paper);
    overflow: hidden;
  }
  /* Background marbled artwork placeholder */
  .placeholder.bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 540px;
    height: 720px;
    background:
      radial-gradient(ellipse 300px 200px at 70% 15%, rgba(244,167,106,0.55), rgba(244,167,106,0) 70%),
      radial-gradient(ellipse 260px 320px at 25% 45%, rgba(244,167,106,0.40), rgba(244,167,106,0) 70%),
      radial-gradient(ellipse 340px 260px at 60% 70%, rgba(244,167,106,0.35), rgba(244,167,106,0) 70%),
      radial-gradient(ellipse 200px 160px at 90% 55%, rgba(244,167,106,0.45), rgba(244,167,106,0) 70%),
      radial-gradient(ellipse 250px 180px at 15% 88%, rgba(244,167,106,0.40), rgba(244,167,106,0) 70%),
      var(--paper);
    color: rgba(180,120,70,0.35);
    font-size: 10px;
    text-align: center;
    letter-spacing: 1px;
    padding-top: 300px;
    z-index: 0;
  }
  .content { position: relative; z-index: 2; width: 100%; height: 100%; }

  /* ---------- Top row ---------- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 22px 0 24px;
  }
  .top-left {
    color: var(--orange);
    font-family: "Times New Roman", serif;
  }
  .top-left .date {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .top-left .credit {
    font-size: 9.5px;
    font-weight: bold;
    letter-spacing: 1.2px;
    line-height: 1.5;
  }
  .top-right { text-align: right; color: var(--orange); }
  .top-right .l1 {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .top-right .l2 {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }
  .top-right .cn {
    font-family: "SimHei", "Heiti SC", sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 9px;
    line-height: 1.8;
  }
  .top-right .cn .second { letter-spacing: 6px; }

  /* ---------- Vertical headline block ---------- */
  .vertical-wrap {
    position: absolute;
    top: 118px;
    left: 18px;
    display: flex;
    align-items: flex-start;
  }
  .vtext {
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: var(--orange);
    font-family: "Times New Roman", serif;
    font-weight: bold;
    text-transform: uppercase;
  }
  .vtext.three {
    font-size: 60px;
    letter-spacing: 4px;
    height: 570px;
    margin-left: 4px;
  }
  .vtext.love {
    font-size: 52px;
    letter-spacing: 3px;
    height: 350px;
    margin-left: 22px;
    margin-top: 0;
  }

  /* ---------- Right vertical small caps ---------- */
  .augenstern {
    position: absolute;
    top: 180px;
    right: 26px;
    writing-mode: vertical-rl;
    color: var(--orange);
    font-size: 10px;
    letter-spacing: 7px;
    font-family: "Times New Roman", serif;
  }
  .augenstern-rule {
    position: absolute;
    top: 425px;
    right: 30px;
    width: 1px;
    height: 165px;
    background: var(--orange-light);
  }

  /* ---------- Bottom right text ---------- */
  .bottom-right {
    position: absolute;
    left: 285px;
    bottom: 22px;
    width: 232px;
    color: var(--orange);
  }
  .quote {
    font-size: 11.5px;
    line-height: 1.9;
    margin-bottom: 12px;
  }
  .banner {
    background: var(--orange);
    color: var(--paper);
    font-weight: bold;
    font-size: 11.5px;
    letter-spacing: 0.6px;
    padding: 5px 7px 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="poster">

  <div class="placeholder bg">[Photo/Artwork: marbled orange fluid texture, full-page background]</div>

  <div class="content">

    <div class="top">
      <div class="top-left">
        <div class="date">1 1/07</div>
        <div class="credit">DESIGNED BY<br>KERRLEE</div>
      </div>
      <div class="top-right">
        <div class="l1">BRIFE IS LIFE</div>
        <div class="l2">BUT LOVE IS LONG</div>
        <div class="cn">
          你要知道生命很短，但爱却绵长<br>
          <span class="second">爱你三千遍</span>
        </div>
      </div>
    </div>

    <div class="vertical-wrap">
      <div class="vtext three">THREE THOUSAND</div>
      <div class="vtext love">I LOVE YOU</div>
    </div>

    <div class="augenstern">AUGENSTERN</div>
    <div class="augenstern-rule"></div>

    <div class="bottom-right">
      <div class="quote">
        Life was like a box of chocolates,<br>
        you never know what you are gonna get.
      </div>
      <div class="banner">YOU GOTTA HAVE LITTLE FAITH</div>
    </div>

  </div>
</div>
</body>
</html>
