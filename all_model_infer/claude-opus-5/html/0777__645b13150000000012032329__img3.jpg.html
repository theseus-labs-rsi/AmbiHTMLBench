<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写信件 第三页</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    background: #d8d5cf;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }
  .page {
    position: relative;
    width: 1080px;
    height: 760px;
    margin: 0 auto;
    background: #f2efe8;
    box-sizing: border-box;
    padding: 30px 40px 40px 40px;
    overflow: hidden;
  }
  /* 左上角黄色标签 */
  .page-label {
    position: absolute;
    top: 18px;
    left: 30px;
    background: #f5e33a;
    color: #000;
    font-size: 30px;
    font-weight: bold;
    padding: 4px 14px;
    letter-spacing: 2px;
    z-index: 5;
  }
  /* 竖排文字区：整体自右向左 */
  .columns {
    position: absolute;
    top: 40px;
    right: 40px;
    left: 40px;
    bottom: 60px;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    justify-content: flex-start;
  }
  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    height: 620px;
    font-size: 26px;
    line-height: 1.5;
    letter-spacing: 6px;
    margin-left: 6px;
    padding: 0 6px;
    color: #1a2b52;
  }
  /* 右半页（第一段落）稍紧凑 */
  .block-right .col { color: #16305e; }
  /* 中缝：书页装订线 */
  .gutter {
    width: 34px;
    height: 640px;
    background: linear-gradient(to right, #e6e1d6, #cfc9bc, #e6e1d6);
    margin: 0 10px;
    flex: 0 0 auto;
  }
  /* 落款区 */
  .signoff .col { color: #16305e; }
  .indent-1 { padding-top: 40px; }
  .indent-2 { padding-top: 80px; }
  .indent-3 { padding-top: 120px; }
  .indent-4 { padding-top: 170px; }
  /* 红色印章占位 */
  .placeholder {
    border: 1px dashed #b03030;
    color: #b03030;
    font-size: 11px;
    text-align: center;
    box-sizing: border-box;
    writing-mode: horizontal-tb;
    line-height: 1.2;
    padding: 2px;
  }
  .seal {
    position: absolute;
    left: 200px;
    top: 300px;
    width: 56px;
    height: 84px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="page-label">第三页</div>

  <div class="columns">

    <!-- 右半页 -->
    <div class="col">因为山的[?]道是[illegible]</div>
    <div class="col">清楚，一般情况下，[?]羊是不会</div>
    <div class="col">甲台泥是[?]的用完擦[illegible]</div>
    <div class="col">的多[?]（　），也们会积[?]贴到水滴</div>
    <div class="col">上经里吸收。</div>

    <div class="gutter"></div>

    <!-- 左半页 -->
    <div class="col">总之，必须注意、认真[?]细</div>
    <div class="col">说，也要注意训练[?]生考试的</div>
    <div class="col">基础，[?]程[?]细致的[?]力</div>
    <div class="col">扎稳[?]，都是[illegible]</div>

    <div class="col indent-1">请谅吧。</div>
    <div class="col indent-2">以颂</div>
    <div class="col indent-1">美意</div>
    <div class="col indent-3">笔健！</div>
    <div class="col indent-4">徐[?]三月七日晚</div>

  </div>

  <div class="placeholder seal">[印章：红色方形<br>落款处，[illegible]]</div>

</div>
</body>
</html>
