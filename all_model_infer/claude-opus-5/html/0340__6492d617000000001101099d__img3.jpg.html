<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维二：分解思维</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    color: #1a1a1a;
  }
  .page {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 30px 26px;
  }
  /* 四角装饰边框 */
  .corner {
    position: absolute;
    width: 44px;
    height: 44px;
    border: 2px solid #9dbf9d;
  }
  .corner.tl { top: 28px;  left: 24px;  border-right: none; border-bottom: none; }
  .corner.tr { top: 28px;  right: 24px; border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 28px; left: 24px;  border-right: none; border-top: none; }
  .corner.br { bottom: 28px; right: 24px; border-left: none;  border-top: none; }

  h1.title {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 22px 0 30px 0;
  }
  .content {
    padding: 0 38px;
  }
  p {
    font-size: 17px;
    line-height: 1.75;
    margin: 0 0 26px 0;
  }
  p.lead {
    font-weight: 600;
  }
  .red {
    color: #e8322a;
  }
  h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 20px 0;
  }
  .arrow-box {
    position: absolute;
    right: 44px;
    bottom: 56px;
    display: flex;
    align-items: center;
  }
  .arrow-label {
    background: #000;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 8px;
    line-height: 1;
  }
  .arrow-head {
    width: 0;
    height: 0;
    border-top: 20px solid transparent;
    border-bottom: 20px solid transparent;
    border-left: 26px solid #000;
  }
  .footer {
    position: absolute;
    bottom: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #333;
  }
</style>
</head>
<body>
<div class="page">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <h1 class="title">计算思维二：分解思维</h1>

  <div class="content">
    <p class="lead">分解思维是指<span class="red">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）。</span></p>

    <h2>1、问题梳理</h2>
    <p>先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</p>

    <h2>2、问题分解</h2>
    <p>将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</p>

    <h2>3、整合方案</h2>
    <p>制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</p>
  </div>

  <div class="arrow-box">
    <div class="arrow-label">翻 页</div>
    <div class="arrow-head"></div>
  </div>

  <div class="footer">原创：学习方法社</div>
</div>
</body>
