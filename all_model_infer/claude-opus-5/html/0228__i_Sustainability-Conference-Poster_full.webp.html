<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Sustainability Summit — Event Poster</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root{
    --cream:#f4efe1;
    --dark-green:#0f7a33;
    --mid-green:#1c7c36;
    --bright-green:#3ac449;
    --light-green:#5fd35c;
    --text-dark:#1a1a1a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#ffffff;
    font-family:"Poppins","Century Gothic","Trebuchet MS",Arial,sans-serif;
    color:var(--text-dark);
  }
  .poster{
    position:relative;
    width:1656px;
    height:2208px;
    margin:0 auto;
    background:var(--dark-green);
    overflow:hidden;
  }

  /* ---------- LEFT COLUMN ---------- */
  .left-col{
    position:absolute;
    top:0; left:0;
    width:845px;
    height:100%;
  }
  /* cream panel top with rounded bottom (half circle) */
  .cream-top{
    position:absolute;
    top:0; left:0;
    width:845px;
    height:1440px;
    background:var(--cream);
    border-bottom-left-radius:845px 620px;
    border-bottom-right-radius:845px 620px;
  }
  /* cream panel bottom with rounded bottom */
  .cream-bottom{
    position:absolute;
    left:0;
    top:1810px;
    width:845px;
    height:398px;
    background:var(--cream);
    border-bottom-left-radius:845px 500px;
    border-bottom-right-radius:845px 500px;
  }

  /* vertical rotated title */
  .title-block{
    position:absolute;
    top:150px;
    left:210px;
    width:420px;
    height:930px;
  }
  .vtitle{
    position:absolute;
    transform-origin:left top;
    transform:rotate(90deg);
    white-space:nowrap;
    font-size:118px;
    font-weight:800;
    line-height:1.05;
    color:var(--mid-green);
    letter-spacing:-1px;
  }
  .vtitle.l1{ left:390px; top:20px; }
  .vtitle.l2{ left:530px; top:20px; }
  .vtitle.l3{ left:670px; top:20px; }

  .divider{
    position:absolute;
    left:228px;
    top:1170px;
    width:390px;
    height:2px;
    background:#8a8a72;
  }

  .reg-block{
    position:absolute;
    left:228px;
    top:1240px;
    width:560px;
  }
  .label-green{
    color:var(--bright-green);
    font-weight:700;
    font-size:31px;
    letter-spacing:1.5px;
    margin:0 0 18px 0;
  }
  .reg-line{
    font-size:31px;
    font-weight:400;
    margin:0;
    color:var(--text-dark);
  }
  .price{
    font-size:46px;
    font-weight:800;
    color:var(--mid-green);
    margin:12px 0 46px 0;
  }
  .price.last{ margin-bottom:0; }

  .visit-block{
    position:absolute;
    left:228px;
    top:1985px;
    width:520px;
  }
  .visit-text{
    font-size:31px;
    line-height:1.45;
    margin:14px 0 0 0;
  }

  /* ---------- RIGHT COLUMN ---------- */
  .right-col{
    position:absolute;
    top:0;
    left:845px;
    width:811px;
    height:100%;
    background:var(--dark-green);
  }
  .light-band{
    position:absolute;
    left:0;
    top:1428px;
    width:811px;
    height:780px;
    background:var(--light-green);
  }
  .dark-circle{
    position:absolute;
    left:5px;
    top:1450px;
    width:790px;
    height:790px;
    background:var(--mid-green);
    border-radius:50%;
  }

  .logo{
    position:absolute;
    right:130px;
    top:135px;
    color:#ffffff;
    text-align:left;
    line-height:1;
  }
  .logo .l-your{
    font-size:34px;
    font-weight:600;
    font-family:Georgia,"Times New Roman",serif;
  }
  .logo .l-logo{
    font-size:44px;
    font-weight:800;
    letter-spacing:1px;
  }
  .logo .mark{
    display:inline-block;
    width:30px;height:30px;
    background:#fff;
    border-radius:8px;
    vertical-align:-4px;
    margin:0 4px;
  }
  .logo sup{ font-size:16px; }

  /* tree photo placeholder */
  .placeholder{
    background:transparent;
    border:1px dashed rgba(255,255,255,.45);
    color:rgba(255,255,255,.85);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-size:22px;
    text-align:center;
    padding-bottom:12px;
  }
  .tree-photo{
    position:absolute;
    left:5px;
    top:320px;
    width:806px;
    height:1110px;
  }

  .info-block{
    position:absolute;
    left:1070px;
    top:1600px;
    width:420px;
    color:#ffffff;
  }
  .info-label{
    color:var(--bright-green);
    font-weight:700;
    font-size:31px;
    letter-spacing:1.5px;
    margin:0 0 16px 0;
  }
  .info-text{
    font-size:31px;
    line-height:1.4;
    margin:0 0 60px 0;
    color:#ffffff;
  }
  .info-text.last{ margin-bottom:0; }
</style>
</head>
<body>
<div class="poster">

  <!-- LEFT COLUMN -->
  <div class="left-col">
    <div class="cream-top"></div>
    <div class="cream-bottom"></div>

    <div class="title-block">
      <div class="vtitle l1">Global</div>
      <div class="vtitle l2">Sustainability</div>
      <div class="vtitle l3">Summit</div>
    </div>

    <div class="divider"></div>

    <div class="reg-block">
      <p class="label-green">REGISTRATION</p>
      <p class="reg-line">General Admission</p>
      <p class="price">$350</p>
      <p class="reg-line">Students &amp; Nonprofits</p>
      <p class="price last">$200</p>
    </div>

    <div class="visit-block">
      <p class="label-green">VISIT</p>
      <p class="visit-text">www.yourwebsite.com for more details and to register today!</p>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div class="right-col">
    <div class="light-band"></div>
    <div class="dark-circle"></div>
  </div>

  <figure class="placeholder tree-photo" style="margin:0;">
    [Photo: large umbrella pine tree, centered in right column]
  </figure>

  <div class="logo">
    <div class="l-your">Your <sup>&reg;</sup></div>
    <div class="l-logo">LOGO<span class="mark"></span></div>
  </div>

  <div class="info-block">
    <p class="info-label">DATE</p>
    <p class="info-text">27 January 2026<br>10:00 PM</p>
    <p class="info-label">LOCATION</p>
    <p class="info-text last">Grand Hall, Convention<br>Center, Chicago, IL</p>
  </div>

</div>
</body>
</html>
