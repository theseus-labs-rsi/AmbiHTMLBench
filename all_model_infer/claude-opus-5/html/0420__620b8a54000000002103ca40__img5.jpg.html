<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习建议</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #222;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    padding: 0 0 20px 0;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Title banner area */
  .title-zone {
    position: relative;
    height: 110px;
  }
  .placeholder {
    box-sizing: border-box;
    border: 1px dashed #cccccc;
    color: #999999;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
  }
  .title-art {
    width: 330px;
    height: 100px;
    margin: 5px auto 0 auto;
  }

  .content {
    padding: 0 26px;
  }

  /* Section heading rows: number + bracketed title side by side */
  .sec-head {
    display: flex;
    align-items: baseline;
    margin: 26px 0 14px 0;
  }
  .sec-num {
    width: 78px;
    flex: 0 0 78px;
    color: #cf5bb4;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .sec-title {
    color: #cf5bb4;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  p {
    margin: 0 0 10px 0;
    font-size: 19px;
    line-height: 1.75;
  }

  .hl-yellow {
    background: #fdf0a8;
    padding: 1px 0;
  }
  .hl-red {
    color: #e8322a;
    font-weight: 700;
  }

  .attrib {
    text-align: right;
    font-size: 17px;
    margin: 16px 0 0 0;
  }
  .attrib .small {
    font-size: 14px;
  }

  /* Bottom-right illustration */
  .bottom-art-zone {
    position: relative;
    height: 110px;
  }
  .bottom-art {
    width: 130px;
    height: 105px;
    position: absolute;
    right: 6px;
    bottom: 0;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-zone">
    <figure class="placeholder title-art" style="margin:5px auto 0 auto;">[艺术字标题图: 学习建议 — 顶部居中，带黄色装饰线条与小图标]</figure>
  </div>

  <div class="content">

    <div class="sec-head">
      <div class="sec-num">09</div>
      <div class="sec-title">「 教材远比练习册重要 」</div>
    </div>

    <p>教材远比练习册重要。</p>
    <p>教材就是我们做题之前所要构建的一个框架，<span class="hl-yellow">先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。</span></p>

    <p class="attrib">——陈哲峰<span class="small">(被北京大学物理学院录取)</span></p>

    <div class="sec-head">
      <div class="sec-num">10</div>
      <div class="sec-title">「 有关数学与英语的学习方法 」</div>
    </div>

    <p>数学压轴大题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。</p>
    <p>我要保证的，<span class="hl-red">不是做出难题，而是做到容易题不丢分，难题多得分。</span>最后，我数学只有压轴题扣了分。</p>

  </div>

  <div class="bottom-art-zone">
    <figure class="placeholder bottom-art">[插图: 右下角 — 卡通女孩手持横幅“高考加油”]</figure>
  </div>

</div>
</body>
</html>
