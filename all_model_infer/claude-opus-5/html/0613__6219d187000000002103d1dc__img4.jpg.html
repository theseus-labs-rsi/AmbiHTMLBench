<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三、直播后 - 数据复盘</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #1a1a1a;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    position: relative;
  }

  /* ---- Top header band ---- */
  .header {
    height: 62px;
    position: relative;
  }
  .header .title {
    position: absolute;
    left: 205px;
    top: 12px;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #3a3a3a;
    font-family: "Kaiti SC", "STKaiti", serif;
  }
  .header .handle {
    position: absolute;
    right: 18px;
    top: 16px;
    text-align: center;
    color: #6b6b6b;
  }
  .header .handle .name {
    font-size: 12px;
    font-weight: 700;
  }
  .header .handle .sub {
    font-size: 9px;
    letter-spacing: 1px;
    color: #9a9a9a;
    font-family: "Kaiti SC", "STKaiti", serif;
  }

  /* ---- Yellow note block ---- */
  .note {
    background: #f6efc8;
    padding: 8px 14px 14px 14px;
  }
  .note h2 {
    margin: 0 0 6px 0;
    font-size: 15px;
    font-weight: 700;
    color: #2b2b2b;
  }
  .note p {
    margin: 0 0 4px 0;
    font-size: 13px;
    color: #2b2b2b;
  }
  .note ul {
    margin: 0;
    padding-left: 30px;
    font-size: 13px;
  }
  .note li { margin: 1px 0; }

  /* ---- Main diagram area ---- */
  .diagram {
    display: flex;
    align-items: center;
    padding: 18px 20px 60px 6px;
  }
  .left-label {
    width: 155px;
    flex: 0 0 155px;
    font-size: 19px;
    font-weight: 700;
    color: #1a1a1a;
    padding-bottom: 4px;
    text-align: left;
  }
  .left-label span {
    display: inline-block;
    border-bottom: 2px solid #3a3ab0;
    padding: 0 4px 4px 4px;
  }

  /* bracket connector column */
  .bracket {
    flex: 0 0 34px;
    align-self: stretch;
    position: relative;
  }
  .bracket .vline {
    position: absolute;
    left: 0;
    top: 40px;
    bottom: 40px;
    border-left: 1.5px solid #333;
  }
  .bracket .tick {
    position: absolute;
    left: 0;
    width: 34px;
    border-top: 1.5px solid #333;
  }

  .right-col {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group { position: relative; }
  .desc {
    background: #4a4ac8;
    color: #ffffff;
    font-size: 14px;
    line-height: 1.55;
    padding: 8px 12px;
    border-radius: 6px;
    position: relative;
    z-index: 2;
  }
  .item {
    background: #eeeef7;
    border: 1.5px dashed #4a4ac8;
    border-radius: 12px;
    font-size: 14px;
    color: #1a1a1a;
    padding: 9px 14px;
    margin-top: -6px;
    padding-top: 15px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="title">三、直播后</div>
    <div class="handle">
      <div class="name">（@自律的营销学姐Renita）</div>
      <div class="sub">From 小红书</div>
    </div>
  </div>

  <div class="note">
    <h2>2、数据复盘</h2>
    <p>进行直播数据复盘的时候，重点关注4个关键数据：</p>
    <ul>
      <li>人气峰值和平均在线</li>
      <li>观众平均停留时长</li>
      <li>带货转化率</li>
      <li>UV价值</li>
    </ul>
  </div>

  <div class="diagram">
    <div class="left-label"><span>2、数据复盘</span></div>

    <div class="bracket">
      <div class="vline"></div>
      <div class="tick" style="top:14%;"></div>
      <div class="tick" style="top:39%;"></div>
      <div class="tick" style="top:64%;"></div>
      <div class="tick" style="top:89%;"></div>
    </div>

    <div class="right-col">
      <div class="group">
        <div class="desc">一般平均在线能稳定在50人左右直播就有基本的带货能力，能够赚到钱</div>
        <div class="item">① 人气峰值和平均在线人数</div>
      </div>

      <div class="group">
        <div class="desc">通常停留时长超过2分钟算不错的数据，超过30s是一个及格线</div>
        <div class="item">② 观众平均停留时长</div>
      </div>

      <div class="group">
        <div class="desc">一般带货转化率达到1%以上算合格，优秀的3%以上</div>
        <div class="item">③ 带货转化率</div>
      </div>

      <div class="group">
        <div class="desc">单个用户给直播间贡献的价值，这个数值越高，说明用户在这个直播间的付费意愿更强</div>
        <div class="item">④ UV价值</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
