<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具 — 游戏截图</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
  }
  .screenshot {
    position: relative;
    width: 540px;
    height: 304px;
    margin: 0 auto;
    background: #7e9694;
    overflow: hidden;
  }
  /* Background scene placeholder */
  .scene {
    position: absolute;
    top: 0; left: 0;
    width: 540px;
    height: 304px;
    background: linear-gradient(180deg, #7f9793 0%, #8fa5a0 45%, #9db1ab 100%);
    color: rgba(255,255,255,0.35);
    font-size: 10px;
    text-align: center;
  }
  .scene .scene-label {
    position: absolute;
    top: 8px;
    left: 0;
    width: 100%;
  }
  /* Character + chest placeholder (bottom center) */
  .actor {
    position: absolute;
    left: 228px;
    top: 195px;
    width: 100px;
    height: 90px;
    color: rgba(255,255,255,0.4);
    font-size: 9px;
    text-align: center;
    line-height: 1.2;
  }
  /* Info dialog panel */
  .panel {
    position: absolute;
    left: 128px;
    top: 85px;
    width: 288px;
    height: 96px;
    background: rgba(228,232,222,0.72);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    display: flex;
    box-sizing: border-box;
    padding: 6px 8px;
  }
  .panel-icon {
    width: 60px;
    flex: 0 0 60px;
    text-align: center;
    color: #5a5a4a;
    font-size: 8px;
  }
  .icon-box {
    width: 46px;
    height: 40px;
    margin: 4px auto 2px auto;
    background: rgba(255,255,255,0.25);
    border: 1px dashed rgba(90,90,74,0.5);
    line-height: 1.1;
    font-size: 7px;
    color: #4b4b3c;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .count {
    font-size: 10px;
    color: #2f2f28;
    text-align: center;
  }
  .count .box {
    display: inline-block;
    border: 1px solid #4a4a3f;
    padding: 0 4px;
    background: rgba(255,255,255,0.4);
    margin-left: 2px;
  }
  .panel-text {
    flex: 1 1 auto;
    padding-left: 4px;
  }
  .panel-title {
    font-size: 12px;
    font-weight: bold;
    color: #2e2e26;
    margin: 2px 0 6px 0;
    letter-spacing: 1px;
  }
  .panel-desc {
    font-size: 8px;
    line-height: 1.55;
    color: #33332b;
  }
  /* Bottom-right prompt */
  .prompt {
    position: absolute;
    left: 348px;
    top: 168px;
    font-size: 8px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div class="screenshot">

  <div class="scene placeholder">
    <div class="scene-label">[Screenshot background: stone shrine interior, greenish stone floor and walls]</div>
  </div>

  <div class="actor placeholder">
    [Character &amp; treasure chest:<br>bottom center]
  </div>

  <div class="panel">
    <div class="panel-icon">
      <div class="icon-box placeholder">[Item icon:<br>mask]</div>
      <div class="count"><span class="box">1</span></div>
    </div>
    <div class="panel-text">
      <div class="panel-title">魔吉拉的面具</div>
      <div class="panel-desc">
        从人类时期留传下来的面具。<br>
        戴上它的话，имеет有些怪物就不容易发现自己。<br>
        这样的珍品并非轻易就能得到。
      </div>
    </div>
  </div>

  <div class="prompt">打开箱子</div>

</div>
</body>
</html>
