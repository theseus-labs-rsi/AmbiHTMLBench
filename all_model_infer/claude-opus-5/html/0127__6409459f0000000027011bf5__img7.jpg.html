<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句合集系列</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #cfcac0;
    font-family: "Songti SC", "SimSun", "STSong", serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #d8d0c0;
    position: relative;
  }
  /* ===== Header zone ===== */
  .header {
    background: #efe6d4;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 8px 14px 10px 18px;
    height: 148px;
  }
  .masthead {
    width: 270px;
  }
  .masthead .cn {
    color: #b32017;
    font-size: 54px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.15;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }
  .masthead .pinyin {
    color: #b32017;
    font-size: 13px;
    letter-spacing: 4px;
    text-align: center;
    margin-top: 6px;
  }
  .header-right {
    width: 210px;
    text-align: right;
    padding-top: 6px;
  }
  .tagline {
    font-size: 19px;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .tagline span { padding: 0 4px; }
  .series {
    margin-top: 34px;
    border-top: 2px solid #1a1a1a;
    border-bottom: 2px solid #1a1a1a;
    padding: 6px 4px;
    font-size: 20px;
    letter-spacing: 2px;
    text-align: center;
  }
  /* ===== Body zone ===== */
  .content {
    padding: 18px 22px 26px 22px;
  }
  .entry { margin-bottom: 14px; }
  .quote {
    font-size: 27px;
    line-height: 1.5;
    color: #14110f;
    letter-spacing: 1px;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }
  .quote .line2 {
    display: block;
    padding-left: 42px;
  }
  .note-label {
    font-size: 13px;
    margin-top: 10px;
    margin-bottom: 2px;
    color: #2a2622;
  }
  .note {
    font-size: 14.5px;
    line-height: 1.6;
    color: #2a2622;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="masthead">
      <div class="cn">人民日报</div>
      <div class="pinyin">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="tagline">金句<span>|</span>素材<span>|</span>摘抄</div>
      <div class="series">金句合集系列</div>
    </div>
  </div>

  <div class="content">

    <div class="entry">
      <div class="quote">
        1、愿你千山暮雪海棠依旧，
        <span class="line2">不为岁月惊扰平添忧愁。</span>
      </div>
      <div class="note-label">释义:</div>
      <div class="note">
        希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝与琐事而烦恼忧愁。
      </div>
    </div>

    <div class="entry">
      <div class="quote">
        2、总有人间一两风，
        <span class="line2">填我十万八千梦。</span>
      </div>
      <div class="note-label">释义:</div>
      <div class="note">
        人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。
      </div>
    </div>

    <div class="entry">
      <div class="quote">
        3、日出有盼， 日落有思，
        <span class="line2">平平安安， 所遇皆甜。</span>
      </div>
      <div class="note-label">释义:</div>
      <div class="note">
        只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。
      </div>
    </div>

  </div>
</div>
</body>
</html>
