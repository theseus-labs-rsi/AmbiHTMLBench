<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山里的约會 — TongCai 2021</title>
<script>

<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #3a4a3a;
  }
  .poster {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 0 auto;
    overflow: hidden;
  }
  /* Background illustration placeholder */
  .placeholder {
    box-sizing: border-box;
    border: 1px dashed #9bb08f;
    background: #eef3e7;
    color: #6f8163;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .bg-illustration {
    position: absolute;
    top: 0;
    left: 0;
    width: 540px;
    height: 720px;
    z-index: 0;
  }
  /* Top header lines, right of center */
  .top-lines {
    position: absolute;
    top: 4px;
    left: 150px;
    width: 380px;
    z-index: 3;
    font-size: 13px;
    line-height: 1.7;
    color: #4a5a48;
  }
  .top-lines .l1 { text-align: left; }
  .top-lines .l2 { text-align: center; }

  /* Left vertical label: 大班综合 */
  .v-label-top {
    position: absolute;
    top: 0;
    left: 8px;
    width: 44px;
    z-index: 3;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.15;
    color: #34492f;
    text-align: center;
  }
  /* Left vertical latin text: TongCai 2021 */
  .v-label-mid {
    position: absolute;
    top: 232px;
    left: 14px;
    z-index: 3;
    writing-mode: vertical-rl;
    text-orientation: sideways;
    transform: rotate(180deg);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #34492f;
  }
  /* Left vertical latin text: Autumn */
  .v-label-bottom {
    position: absolute;
    top: 604px;
    left: 14px;
    z-index: 3;
    writing-mode: vertical-rl;
    text-orientation: sideways;
    transform: rotate(180deg);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #34492f;
  }

  /* Main vertical title 山里的約會 */
  .title-block {
    position: absolute;
    top: 52px;
    left: 210px;
    width: 150px;
    height: 320px;
    z-index: 3;
  }
  .title-block .ch {
    position: absolute;
    font-family: "STKaiti", "KaiTi", "Songti SC", serif;
    font-weight: 700;
    color: #2f4a2c;
    line-height: 1;
  }
  .t1 { top: 0px;   left: 78px; font-size: 74px; }
  .t2 { top: 92px;  left: 88px; font-size: 74px; }
  .t3 { top: 118px; left: 12px; font-size: 72px; }
  .t4 { top: 210px; left: 78px; font-size: 74px; }
  .t5 { top: 250px; left: 8px;  font-size: 72px; }

  /* Watermark / handle block */
  .handle {
    position: absolute;
    top: 412px;
    left: 268px;
    z-index: 4;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .handle .badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    display: inline-block;
    flex: 0 0 auto;
    position: relative;
  }
  .handle .badge::after {
    content: "";
    position: absolute;
    top: 5px; left: 7px;
    width: 8px; height: 12px;
    background: #6fbf73;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .handle .name { font-weight: 600; font-size: 14px; }
  .handle .from { font-size: 11px; opacity: .95; }

  /* Bottom three-column poem area */
  .bottom-cols {
    position: absolute;
    bottom: 0;
    left: 96px;
    width: 444px;
    z-index: 3;
    display: flex;
    gap: 12px;
    font-size: 12.5px;
    line-height: 1.9;
    color: #46543f;
  }
  .bottom-cols .col { flex: 1 1 0; }
  .bottom-cols .col:nth-child(3) { text-align: left; }
</style>
</head>
<body>
  <div class="poster">

    <figure class="placeholder bg-illustration">[Illustration: full-page watercolor scene — sky and clouds, mountains, fields, trees, and many small figures working/gathering across the lower half]</figure>

    <div class="top-lines">
      <div class="l1">地上的路原来很平坦可是有太多人走过这些路过的人们太累了</div>
      <div class="l2">于是他们决定扔下一些东西</div>
    </div>

    <div class="v-label-top">大班<br>综合</div>

    <div class="v-label-mid">TongCai 2021</div>

    <div class="v-label-bottom">Autumn</div>

    <div class="title-block">
      <span class="ch t1">山</span>
      <span class="ch t2">里</span>
      <span class="ch t3">约</span>
      <span class="ch t4">的</span>
      <span class="ch t5">會</span>
    </div>

    <div class="handle">
      <span class="badge"></span>
      <span>
        <span class="name">@Hiro豆豆老师</span><br>
        <span class="from">From 小红书</span>
      </span>
    </div>

    <div class="bottom-cols">
      <div class="col">
        有的人扔下了悲伤<br>
        变成了路上的石头
      </div>
      <div class="col">
        有的人留下快乐<br>
        变成了山上的树苗
      </div>
      <div class="col">
        我把装在瓶子里的思念<br>
        放在高高的山顶上<br>
        交成了黑夜的眼睛
      </div>
    </div>

  </div>
</body>
</html>
