<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长需要关注什么</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 12px 0;
    background: #ffffff;
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #333;
  }
  .page {
    width: 540px;
    margin: 0 auto;
  }
  .slide {
    position: relative;
    width: 480px;
    margin: 0 auto 14px auto;
    border: 1px solid #d8d3c4;
    background: #ffffff;
    box-sizing: border-box;
  }

  /* ---------- Slide 1 : cover ---------- */
  .slide-cover {
    height: 220px;
    background: #d8cfb8;
    border: none;
    width: 480px;
    padding: 0;
  }
  .cover-band {
    position: absolute;
    left: 32px;
    top: 55px;
    width: 416px;
    height: 110px;
    background: #37605c;
  }
  .cover-title {
    position: absolute;
    left: 240px;
    top: 82px;
    font-size: 24px;
    letter-spacing: 3px;
    color: #f3efe3;
  }
  .cover-sub {
    position: absolute;
    left: 300px;
    top: 128px;
    font-size: 11px;
    letter-spacing: 4px;
    color: #cfd8cf;
  }
  .placeholder {
    box-sizing: border-box;
    border: 1px dashed #b8ae95;
    color: #8a8straight;
    color: #8a8271;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(255,255,255,0.25);
  }
  .cover-deer {
    position: absolute;
    left: 110px;
    top: 40px;
    width: 150px;
    height: 145px;
  }
  .seal {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px dashed #a8452f;
    color: #a8452f;
    font-size: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .seal-cover { left: 84px; top: 188px; }

  /* ---------- Content slides ---------- */
  .slide-content {
    height: 230px;
    padding: 14px 18px;
  }
  .cols {
    display: flex;
    height: 100%;
    align-items: stretch;
  }
  .col-left, .col-right {
    width: 165px;
  }
  .col-mid {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .num {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    color: #f2efe4;
    font-size: 11px;
    background: #4f7a6f;
    border-radius: 3px 8px 3px 8px;
    margin-bottom: 4px;
  }
  .item { margin-bottom: 8px; }
  .item p {
    margin: 0;
    font-size: 11px;
    line-height: 1.5;
  }
  .strategy { color: #b23a2c; }
  .medallion {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px double #b08d55;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .medallion-inner {
    width: 46px;
    height: 96px;
    border: 1px solid #b08d55;
    border-radius: 22px 22px 4px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #37605c;
    font-size: 13px;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    background: #fbf8ef;
  }
  .seal-slide { left: 20px; bottom: 8px; }

  /* slide 3 spacing */
  .slide3 .item { margin-bottom: 22px; }
  .slide3 .col-right { text-align: left; padding-top: 26px; }
  .slide3 .col-right .item { margin-bottom: 40px; }
</style>
</head>
<body>
<div class="page">

  <!-- ============ Slide 1 : Cover ============ -->
  <div class="slide slide-cover">
    <div class="cover-band"></div>
    <figure class="placeholder cover-deer" style="margin:0;">[Illustration: two deer on lotus pond, centered-left over green band]</figure>
    <div class="cover-title">家长需要关注什么</div>
    <div class="cover-sub">章 · 节 · 肆</div>
    <div class="seal seal-cover">[印章]</div>
  </div>

  <!-- ============ Slide 2 : 成绩怎么看 ============ -->
  <div class="slide slide-content">
    <div class="cols">
      <div class="col-left">
        <div class="item">
          <span class="num">壹</span>
          <p>看单科成绩<br>分析优势与劣势科目</p>
        </div>
        <div class="item">
          <span class="num">贰</span>
          <p>看进步<br>横向整体水平<br>纵向看进退情况</p>
        </div>
        <div class="item">
          <span class="num">叁</span>
          <p>分析错题</p>
        </div>
      </div>

      <div class="col-mid">
        <div class="medallion">
          <div class="medallion-inner">成绩怎么看</div>
        </div>
      </div>

      <div class="col-right">
        <div class="item">
          <span class="num">肆</span>
          <p>分析路错：<br>是遗憾丢分？ 是模糊丢分？<br>是不会做丢分？<br><span class="strategy">策略</span>：消除遗憾、纠正模糊、力争突破</p>
        </div>
        <div class="item">
          <span class="num">伍</span>
          <p>分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</p>
        </div>
      </div>
    </div>
    <div class="seal seal-slide">[印章]</div>
  </div>

  <!-- ============ Slide 3 : 家长五不要 ============ -->
  <div class="slide slide-content slide3">
    <div class="cols">
      <div class="col-left">
        <div class="item">
          <span class="num">壹</span>
          <p>不要过度焦虑</p>
        </div>
        <div class="item">
          <span class="num">贰</span>
          <p>不要过度关注孩子</p>
        </div>
        <div class="item">
          <span class="num">叁</span>
          <p>不要给孩子过高的期望</p>
        </div>
      </div>

      <div class="col-mid">
        <div class="medallion">
          <div class="medallion-inner">家长五不要</div>
        </div>
      </div>

      <div class="col-right">
        <div class="item">
          <span class="num">肆</span>
          <p>不要过度唠叨</p>
        </div>
        <div class="item">
          <span class="num">伍</span>
          <p>不要盲目攀比和迷信</p>
        </div>
      </div>
    </div>
    <div class="seal seal-slide">[印章]</div>
  </div>

</div>
</body>
</html>
