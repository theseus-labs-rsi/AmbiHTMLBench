<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #1a1a1a;
    width: 540px;
  }
  /* Top spiral binding holes */
  .binding {
    display: flex;
    gap: 22px;
    padding: 6px 18px 0 18px;
    height: 34px;
    align-items: flex-start;
    overflow: hidden;
  }
  .binding .hole {
    width: 26px;
    height: 26px;
    border: 2px solid #d8d8d8;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .header {
    display: flex;
    align-items: flex-start;
    padding: 20px 0 0 0;
  }
  .badge {
    width: 76px;
    height: 118px;
    margin-left: 8px;
    background: linear-gradient(160deg, #1b0f2a 0%, #6b1f3a 45%, #2a1030 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    flex: 0 0 auto;
  }
  .titles {
    flex: 1;
    text-align: center;
    padding-right: 30px;
  }
  h1 {
    font-size: 38px;
    font-weight: 400;
    margin: 18px 0 0 0;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 17px;
    color: #6f6f6f;
    margin-top: 18px;
  }

  .items {
    margin: 55px 0 0 0;
    padding: 0 30px 40px 40px;
  }
  .item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 62px;
  }
  .icon {
    width: 62px;
    height: 62px;
    flex: 0 0 62px;
    margin-right: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #111;
  }
  .icon.placeholder {
    border: 2px solid #111;
    border-radius: 6px;
    text-align: center;
    line-height: 1.1;
    font-size: 11px;
  }
  .icon.cpu {
    border-radius: 8px;
    font-size: 15px;
  }
  .icon.uhd {
    background: #111;
    color: #fff;
    border: none;
    flex-direction: column;
    font-size: 16px;
    border-radius: 4px;
  }
  .body h2 {
    font-size: 21px;
    font-weight: 700;
    margin: 4px 0 8px 0;
  }
  .body p {
    font-size: 17px;
    line-height: 1.6;
    margin: 0;
    max-width: 420px;
  }
</style>
</head>
<body>

<div class="binding">
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
</div>

<div class="header">
  <div class="badge">第二步</div>
  <div class="titles">
    <h1>三大核心参数解读</h1>
    <div class="subtitle">内存/芯片/分辨率参数解读</div>
  </div>
</div>

<div class="items">

  <div class="item">
    <div class="icon placeholder">[Icon:<br>SD卡]</div>
    <div class="body">
      <h2>1.看内存</h2>
      <p>内存越大速度越快，小于8GB不建议购买。(画圈：GB≠Gb,大GB是小Gb的8倍，尽量选择大GB)</p>
    </div>
  </div>

  <div class="item">
    <div class="icon placeholder cpu">CPU</div>
    <div class="body">
      <h2>2.看芯片</h2>
      <p>主流芯片A73和A53。追求性能玩游戏选A73，看看电视想省电选A53。</p>
    </div>
  </div>

  <div class="item">
    <div class="icon uhd">4K<br>UHD</div>
    <div class="body">
      <h2>3.看分辨率</h2>
      <p>分辨率越高越清晰。（目前电视基本都是超高清4K也就是3840×2160的分辨率）</p>
    </div>
  </div>

</div>

</body>
</html>
