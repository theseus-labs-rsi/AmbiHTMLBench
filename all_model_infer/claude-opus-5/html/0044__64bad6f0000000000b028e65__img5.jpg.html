<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语c术语释义</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #1a1a1a;
    font-size: 21px;
    line-height: 1.62;
  }
  .page {
    width: 553px;
    margin: 0 auto;
    padding: 10px 28px 14px 30px;
    box-sizing: border-box;
  }
  .term {
    font-weight: 700;
    margin: 0;
  }
  .def {
    font-weight: 400;
    margin: 0 0 2px 0;
  }
</style>
</head>
<body>
<div class="page">

  <p class="term">审核：</p>
  <p class="def">指进入语c群时，被群主审看人设、皮气等行为。</p>

  <p class="term">新人：</p>
  <p class="def">指初入某个圈子的人。</p>

  <p class="term">纯白：</p>
  <p class="def">完全不了解语c的人或刚接触语c。</p>

  <p class="term">小白：</p>
  <p class="def">指出入语c圈或对语c一无所知的人。</p>

  <p class="term">小窗：</p>
  <p class="def">指聊天会话的窗口（与 QQ 的私聊差不多）</p>

  <p class="term">隔壁：</p>
  <p class="def">指代另一个地方（隔壁群，隔壁平台）</p>

  <p class="term">首页：</p>
  <p class="def">在语c平台中，上皮发言互动的地方。</p>

  <p class="term">水区：</p>
  <p class="def">在语c平台中，皮下发言探讨问题或闲聊的地方。</p>

  <p class="term">扩列：</p>
  <p class="def">扩充列表，即加好友的意思。</p>

  <p class="term">掌控：</p>
  <p class="def">指开戏文字超过七百一段的人。</p>

  <p class="term">字控：</p>
  <p class="def">夸张手法，指一次开几个字为一段的人。</p>

  <p class="term">句控：</p>
  <p class="def">指开戏只开一行～三行为一段的人。</p>

</div>
</body>
</html>
