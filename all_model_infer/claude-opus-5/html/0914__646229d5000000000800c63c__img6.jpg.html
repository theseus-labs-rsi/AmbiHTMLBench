<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录 — Building Thinking Classrooms</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f2f1ef;
  }
  body {
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    color: #1c1c1c;
  }
  .page {
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    background: #f4f3f1;
    position: relative;
    padding: 40px 0 30px 0;
    box-sizing: border-box;
  }

  /* ---------- Header ---------- */
  .header {
    margin: 10px 0 0 60px;
    width: 260px;
  }
  .header-title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 12px;
    text-align: center;
    padding-left: 40px;
    border-bottom: 1.5px solid #4a4a4a;
    padding-bottom: 4px;
  }
  .header-sub {
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 1px;
    color: #3a3a3a;
    margin-top: 6px;
    padding-left: 30px;
  }
  .drop-b {
    position: absolute;
    left: 60px;
    top: 48px;
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-style: italic;
    font-size: 46px;
    color: #3a3a3a;
    line-height: 1;
  }

  /* ---------- TOC list ---------- */
  .toc {
    margin-top: 60px;
  }
  .toc-row {
    position: relative;
    height: 78px;
    display: flex;
    align-items: center;
  }
  /* grey band behind each entry */
  .band {
    position: absolute;
    left: 20px;
    right: 20px;
    top: 6px;
    height: 46px;
    background: linear-gradient(90deg, #d8d7d5 0%, #e6e5e3 60%, #efeeec 100%);
    border-left: 4px solid #9a9a9a;
  }
  .icon {
    position: relative;
    z-index: 2;
    width: 40px;
    height: 40px;
    margin-left: 30px;
    border-radius: 50%;
    border: 1.5px solid #4a4a4a;
    background: #f7f6f4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    line-height: 1.1;
    text-align: center;
    color: #555;
    box-sizing: border-box;
  }
  .entry {
    position: relative;
    z-index: 2;
    margin-left: 14px;
    font-size: 14.5px;
    line-height: 1.7;
    flex: 1;
  }
  .entry .sub {
    display: block;
    margin-left: 42px;
  }
  .page-no {
    position: relative;
    z-index: 2;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #222;
    width: 60px;
    text-align: left;
    align-self: flex-start;
    margin-top: 14px;
  }
  .page-no.lower {
    align-self: flex-end;
    margin-top: 0;
    margin-bottom: 10px;
  }

  .placeholder {
    border: 1px dashed #999;
    color: #777;
    font-size: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="page">

  <div class="drop-b">B</div>
  <div class="header">
    <div class="header-title">目&nbsp;&nbsp;录</div>
    <div class="header-sub">uilding Thinking Classrooms</div>
  </div>

  <div class="toc">

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>书本]</div>
      <div class="entry">
        第一章 | 激发学习兴趣
        <span class="sub">——布置思考题</span>
      </div>
      <div class="page-no">001</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>卡片]</div>
      <div class="entry">
        第二章 | 探索课堂合作
        <span class="sub">——频繁地进行透明化的随机分组</span>
      </div>
      <div class="page-no lower">019</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>马克笔]</div>
      <div class="entry">
        第三章 | 改变被动的行为习惯
        <span class="sub">——运用白板</span>
      </div>
      <div class="page-no lower">037</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>白板]</div>
      <div class="entry">
        第四章 | 打造自由思考的空间
        <span class="sub">——课桌椅随意摆放</span>
      </div>
      <div class="page-no lower">051</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>问号]</div>
      <div class="entry">
        第五章 | 应对学生的提问
        <span class="sub">——只回答持续思考的问题</span>
      </div>
      <div class="page-no lower">063</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>讲话]</div>
      <div class="entry">
        第六章 | 提高课堂参与度
        <span class="sub">——站着口述题目</span>
      </div>
      <div class="page-no lower">079</div>
    </div>

    <div class="toc-row">
      <div class="band"></div>
      <div class="icon placeholder">[图标:<br>记事板]</div>
      <div class="entry">
        第七章 | 布置有效果的作业
        <span class="sub">——布置自测题</span>
      </div>
      <div class="page-no lower">097</div>
    </div>

  </div>
</div>
</body>
</html>
