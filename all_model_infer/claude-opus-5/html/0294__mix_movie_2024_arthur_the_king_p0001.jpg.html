<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur the King — Movie Poster</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .poster {
    position: relative;
    width: 510px;
    height: 756px;
    background: #7d8a72;
    color: #fff;
    overflow: hidden;
  }

  /* Main image placeholder occupying the whole poster */
  .placeholder {
    border: 1px dashed rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .art {
    position: absolute;
    top: 0; left: 0;
    width: 510px;
    height: 756px;
    background: linear-gradient(180deg,#8d9a86 0%,#6f7d68 45%,#4a4a3f 100%);
  }

  /* Text layers */
  .layer { position: absolute; left: 0; width: 100%; }

  .billing {
    top: 26px;
    text-align: center;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #f2f2ee;
  }

  .taglines {
    top: 262px;
    left: 40px;
    width: auto;
    font-size: 12.5px;
    line-height: 1.35;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
    color: #f4f4f0;
  }

  .title {
    top: 320px;
    left: 40px;
    width: 440px;
    color: #f5c518;
    font-weight: 800;
    text-transform: uppercase;
    line-height: 1.05;
  }
  .title .line1 { font-size: 62px; letter-spacing: 0.14em; }
  .title .line2 { font-size: 62px; letter-spacing: 0.14em; margin-top: 62px; }
  .title .line3 { font-size: 62px; letter-spacing: 0.14em; margin-top: 62px; }

  .based {
    top: 686px;
    right: 30px;
    left: auto;
    width: auto;
    text-align: right;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    line-height: 1.3;
    text-transform: uppercase;
    color: #f4f4f0;
  }

  .coming {
    top: 726px;
    right: 30px;
    left: auto;
    width: auto;
    text-align: right;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #f5c518;
  }
  .coming .studio {
    display: block;
    margin-top: 3px;
    font-size: 8px;
    letter-spacing: 0.18em;
    color: #e8e8e2;
  }

  .ratings {
    position: absolute;
    left: 42px;
    bottom: 12px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }
  .rating-box {
    border: 1px solid #ddd;
    font-size: 8px;
    font-weight: 700;
    padding: 2px 4px;
    color: #f0f0ea;
    letter-spacing: 0.04em;
  }
  .rating-note {
    width: 46px;
    height: 18px;
    font-size: 6px;
  }
</style>
</head>
<body>
  <div class="poster">

    <figure class="art placeholder" style="margin:0;">
      [Photo: full-bleed poster image — man in profile (upper portion, centered) with scruffy dog in foreground (lower portion, center-right), outdoor green background]
    </figure>

    <div class="layer billing">MARK WAHLBERG</div>

    <div class="layer taglines">
      AN UNEXPECTED ENCOUNTER<br>
      AN UNLIKELY BOND<br>
      AN UNFORGETTABLE ADVENTURE
    </div>

    <div class="layer title">
      <div class="line1">ARTHUR</div>
      <div class="line2">THE</div>
      <div class="line3">KING</div>
    </div>

    <div class="layer based">
      BASED ON THE<br>
      INCREDIBLE TRUE STORY
    </div>

    <div class="layer coming">
      COMING SOON
      <span class="studio">LIONSGATE</span>
    </div>

    <div class="ratings">
      <div class="placeholder rating-note">[Logo]</div>
      <div class="rating-box">PG-13</div>
    </div>

  </div>
</body>
</html>
