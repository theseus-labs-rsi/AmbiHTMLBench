<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #2b2b2b;
  }
  .page {
    width: 540px;
    min-height: 720px;
    margin: 0 auto;
    position: relative;
    padding: 30px 40px 0 40px;
  }
  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .title-block h1 {
    font-size: 27px;
    font-weight: 800;
    line-height: 1.45;
    margin: 0;
    letter-spacing: 1px;
  }
  .hl {
    background: #fff33f;
    padding: 2px 4px 2px 2px;
    display: inline-block;
  }
  .num-circle {
    width: 72px;
    height: 72px;
    border: 1px solid #cfcfcf;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #111;
    margin-top: 8px;
    margin-right: 10px;
    flex: none;
  }
  .subtitle {
    font-size: 12.5px;
    color: #333;
    margin: 14px 0 0 2px;
    letter-spacing: 0.5px;
  }

  /* Cards */
  .card {
    position: relative;
    margin-top: 28px;
    padding: 26px 30px 34px 30px;
    overflow: visible;
  }
  .card-pink {
    background: linear-gradient(180deg, #fbeceb 0%, #fdf5f0 60%, #fdf8f2 100%);
    min-height: 250px;
  }
  .card-blue {
    background: linear-gradient(180deg, #eaf0fb 0%, #f5f8fd 60%, #fafbfe 100%);
    min-height: 235px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 17px;
    font-weight: 700;
    color: #222;
  }
  .icon-circle {
    width: 22px;
    height: 22px;
    border: 2px solid #f0a13c;
    border-radius: 50%;
    flex: none;
  }
  .icon-cross {
    width: 22px;
    height: 22px;
    flex: none;
    position: relative;
  }
  .icon-cross::before, .icon-cross::after {
    content: "";
    position: absolute;
    left: 0; top: 10px;
    width: 22px; height: 2px;
    background: #7ba7e8;
  }
  .icon-cross::before { transform: rotate(45deg); }
  .icon-cross::after { transform: rotate(-45deg); }

  .sample {
    margin-top: 30px;
    padding-left: 155px;
    font-size: 13.5px;
    line-height: 2.0;
  }
  .lbl-line {
    display: inline-block;
    border-right: 1px solid #333;
    padding-right: 8px;
    margin-right: 8px;
    font-weight: 700;
  }
  .lbl-box {
    display: inline-block;
    background: #ee5a52;
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    margin-right: 8px;
    letter-spacing: 1px;
    vertical-align: 2px;
  }
  .sample2 {
    margin-top: 22px;
    padding-left: 155px;
    font-size: 13.5px;
    line-height: 2.1;
  }
  .lbl-plain { font-weight: 700; }

  .sample3 {
    margin-top: 55px;
    padding-left: 155px;
    font-size: 13.5px;
    line-height: 2.1;
  }

  /* Placeholders (characters) */
  .placeholder {
    border: 1px dashed #d8d8d8;
    color: #b0b0b0;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: absolute;
  }
  .char1 {
    width: 90px; height: 100px;
    right: 8px; bottom: 10px;
  }
  .char2 {
    width: 90px; height: 95px;
    right: 20px; bottom: -6px;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    border-top: 1px solid #ddd;
    padding-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
  }
  .footer-left {
    font-size: 8px;
    color: #666;
    letter-spacing: 1px;
    line-height: 1.5;
  }
  .footer-right {
    border: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    font-size: 6px;
    color: #333;
    line-height: 1.3;
  }
  .logo-box {
    width: 14px; height: 14px;
    background: #333;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="title-block">
      <h1><span class="hl">使用合理的</span><br><span class="hl">标点符号</span></h1>
    </div>
    <div class="num-circle">01</div>
  </div>

  <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>

  <!-- Card 1 -->
  <div class="card card-pink">
    <div class="card-head">
      <span class="icon-circle"></span>
      <span>使用直线或外框</span>
    </div>

    <div class="sample2">
      <span class="lbl-line">地点</span>武汉国际会展中心<br>
      <span class="lbl-line">时间</span>2018 年 8 月 20 日
    </div>

    <div class="sample">
      <span class="lbl-box">地点</span>武汉国际会展中心<br>
      <span class="lbl-box">时间</span>2018 年 8 月 20 日
    </div>

    <div class="placeholder char1">[插图: 卡通形象, 右下角]</div>
  </div>

  <!-- Card 2 -->
  <div class="card card-blue">
    <div class="card-head">
      <span class="icon-cross"></span>
      <span>使用冒号</span>
    </div>

    <div class="sample3">
      <span class="lbl-plain">地点：</span>武汉国际会展中心<br>
      <span class="lbl-plain">时间：</span>2018 年 8 月 20 日
    </div>

    <div class="placeholder char2">[插图: 卡通形象, 右下角]</div>
  </div>

  <div class="footer">
    <div class="footer-left">
      ADVERTISING CREATIVITY<br>
      2023.05
    </div>
    <div class="footer-right">
      <div class="logo-box"></div>
      <div>CREATIVE DESIGN<br>创意设计</div>
      <div>大猫<br>设计圈</div>
    </div>
  </div>

</div>
</body>
</html>
