<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刚从长沙回来总结 - 3天2晚 1000元</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #fdfaf3;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    color: #1a1a1a;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #fdfaf3;
    padding-bottom: 10px;
  }
  /* Title */
  .title-bar {
    background: #ffffff;
    text-align: center;
    padding: 8px 0 12px 0;
    border-bottom: 3px solid #4a7fb5;
  }
  .title-bar h1 {
    margin: 0;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
    color: #111111;
    -webkit-text-stroke: 1px #111;
  }
  .title-bar h1 .blue {
    color: #5aa9e6;
  }
  /* Subtitle */
  .subtitle {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    color: #d94f3d;
    padding: 10px 0 6px 0;
    letter-spacing: 1px;
  }
  /* Main layout */
  .content {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
  }
  /* Left timeline column */
  .timeline {
    width: 116px;
    flex: 0 0 116px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
  }
  .tl-label {
    font-size: 30px;
    font-weight: 900;
    color: #111111;
    letter-spacing: 1px;
    text-align: center;
  }
  .arrow {
    width: 34px;
    height: 60px;
    margin: 14px 0;
    background: #a8d0ef;
    clip-path: polygon(30% 0%, 70% 0%, 70% 62%, 100% 62%, 50% 100%, 0% 62%, 30% 62%);
  }
  /* Right rows */
  .rows {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 8px;
  }
  .row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
  }
  .placeholder {
    width: 172px;
    height: 118px;
    flex: 0 0 172px;
    background: #e6e6e6;
    border: 1px solid #c9c9c9;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: #666;
    padding: 4px;
    line-height: 1.3;
  }
  .info {
    flex: 1 1 auto;
  }
  .spot {
    font-size: 20px;
    font-weight: 900;
    color: #2b6cb0;
    margin: 0 0 2px 0;
  }
  .time {
    font-size: 15px;
    margin: 0 0 2px 0;
  }
  .time .lab {
    color: #e0574a;
  }
  .desc {
    font-size: 15px;
    line-height: 1.35;
    margin: 0;
    color: #111;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-bar">
    <h1>刚从<span class="blue">长沙</span>回来总结</h1>
  </div>

  <div class="subtitle">3天2晚&nbsp;&nbsp;1000元</div>

  <div class="content">

    <div class="timeline">
      <div class="tl-label">第一天</div>
      <div class="arrow"></div>
      <div class="tl-label">上午</div>
      <div class="arrow"></div>
      <div class="tl-label">下午</div>
      <div class="arrow"></div>
      <div class="tl-label">晚上</div>
    </div>

    <div class="rows">

      <div class="row">
        <figure class="placeholder">[Photo: 五一广场夜景，红色气球，"LOVE CS"字样]</figure>
        <div class="info">
          <p class="spot">🌟五一广场（免费）</p>
          <p class="time"><span class="lab">游玩时间：</span>2h</p>
          <p class="desc">长沙商圈老大，就近可打卡IFS国金中心、黄兴路步行街、坡子街等</p>
        </div>
      </div>

      <div class="row">
        <figure class="placeholder">[Photo: 南门口街道建筑与招牌]</figure>
        <div class="info">
          <p class="spot">🌟南门口（免费）</p>
          <p class="time"><span class="lab">游玩时间：</span></p>
          <p class="desc">南门口是很多长沙人生活的地方，附近有很多地道的美食和小吃</p>
        </div>
      </div>

      <div class="row">
        <figure class="placeholder">[Photo: 橘子洲头青年毛泽东雕像]</figure>
        <div class="info">
          <p class="spot">🌟橘子洲（免费）</p>
          <p class="time"><span class="lab">游玩时间：</span>2h</p>
          <p class="desc">我个人是不推荐橘子洲和岳麓山放在同一天的，傍晚的橘子洲更有韵味</p>
        </div>
      </div>

      <div class="row">
        <figure class="placeholder">[Photo: 湘江夜游游轮]</figure>
        <div class="info">
          <p class="spot">🌟湘江游轮（180/人）</p>
          <p class="time"><span class="lab">游玩时间：</span>1h</p>
          <p class="desc">夜游湘江绝对是一种不容错过的体验，江风清爽，夜景特别美</p>
        </div>
      </div>

      <div class="row">
        <figure class="placeholder">[Photo: 杜甫江阁夜景灯光]</figure>
        <div class="info">
          <p class="spot">🌟杜甫江阁（10/人）</p>
          <p class="time"><span class="lab">游玩时间：</span>1h</p>
          <p class="desc">为纪念杜甫江阁而建，夜景美，是观看湘江夜景的最佳观景地点</p>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
