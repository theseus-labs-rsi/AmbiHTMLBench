<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fdfdf8;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  }

  .page {
    width: 540px;
    margin: 0 auto;
    padding: 20px 18px 60px 18px;
    box-sizing: border-box;
    background-image:
      linear-gradient(to right, #cfe0ea 1px, transparent 1px),
      linear-gradient(to bottom, #cfe0ea 1px, transparent 1px);
    background-size: 18px 18px;
    border-left: 3px double #9bb7c4;
    border-right: 3px double #9bb7c4;
    position: relative;
    min-height: 720px;
  }

  .title {
    text-align: center;
    color: #1a6b3c;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 20px 0 30px 0;
  }

  /* 两栏：左侧竖排标签 + 右侧内容 */
  .row {
    display: flex;
    align-items: flex-start;
  }

  .vlabel {
    width: 52px;
    flex: 0 0 52px;
    color: #c2202a;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.55;
    text-align: center;
    writing-mode: horizontal-tb;
  }

  .vlabel span {
    display: block;
  }

  .content {
    flex: 1 1 auto;
    padding-left: 8px;
  }

  .q {
    color: #c2202a;
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 26px 0;
  }

  .section2 {
    margin-top: 22px;
  }

  .f {
    color: #1a4fa0;
    font-size: 20px;
    line-height: 1.5;
    margin: 0 0 8px 0;
  }

  .f.sub {
    padding-left: 26px;
    margin-bottom: 20px;
  }

  .blank {
    color: #c2202a;
  }

  .mnemonic {
    color: #c2202a;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 34px 0 0 14px;
  }

  /* 印章 */
  .placeholder.seal {
    width: 78px;
    height: 100px;
    border: 4px solid #c2202a;
    color: #c2202a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.1;
    position: absolute;
    right: 40px;
    top: 320px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title">句段结构作用好处赏析</div>

  <!-- 第一部分：常见问法 -->
  <div class="row">
    <div class="vlabel">
      <span>常</span>
      <span>见</span>
      <span>问</span>
      <span>法</span>
    </div>
    <div class="content">
      <p class="q">1.请分析这句话的作用是什么?</p>
      <p class="q">2.这句话这样描写有什么好处?</p>
      <p class="q">3.请分析这句话这样描写的表达效果.</p>
    </div>
  </div>

  <!-- 第二部分：满分公式 -->
  <div class="row section2">
    <div class="vlabel">
      <span>满</span>
      <span>分</span>
      <span>公</span>
      <span>式</span>
    </div>
    <div class="content">
      <p class="f">① 这是(<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>)描写</p>
      <p class="f sub">生动形象地写出(<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>)</p>
      <p class="f" style="margin-bottom:22px;">② 更突出了(<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>)</p>
      <p class="f">③ 前后文呼应/为后文(<span class="blank">&nbsp;&nbsp;&nbsp;</span>)做了铺垫</p>
    </div>
  </div>

  <!-- 印章：右侧中部 -->
  <figure class="placeholder seal">
    <span>孝</span>
    <span>真</span>
  </figure>

  <div class="mnemonic">口诀：生动秀&nbsp;&nbsp;感心头&nbsp;&nbsp;勾勾手</div>

</div>
</body>
</html>
