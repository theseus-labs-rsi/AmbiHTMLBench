<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节 - 稿定艺术展</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: "SimSun", "STSong", "Songti SC", serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .poster {
    width: 600px;
    min-height: 1060px;
    position: relative;
    overflow: hidden;
    background: #fff;
  }

  /* Top-right logo */
  .logo-area {
    position: absolute;
    top: 40px;
    right: 40px;
    text-align: center;
  }
  .logo-diamonds {
    display: grid;
    grid-template-columns: repeat(3, 14px);
    grid-template-rows: repeat(3, 14px);
    gap: 3px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .logo-diamonds span {
    width: 14px;
    height: 14px;
    background: #c0392b;
    transform: rotate(45deg);
    display: inline-block;
  }
  .logo-text {
    font-family: "Georgia", serif;
    font-size: 14px;
    color: #222;
    line-height: 1.4;
    letter-spacing: 1px;
  }

  /* Role circles */
  .roles {
    position: absolute;
    top: 50px;
    left: 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .role-circle {
    width: 44px;
    height: 44px;
    border: 1.5px solid #333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #222;
  }

  /* Main title */
  .main-title {
    position: absolute;
    top: 45px;
    left: 100px;
    writing-mode: vertical-rl;
    font-size: 72px;
    font-weight: bold;
    letter-spacing: 8px;
    line-height: 1.1;
  }
  .main-title .red { color: #c0392b; }
  .main-title .black { color: #111; }

  /* Subtitle */
  .subtitle {
    position: absolute;
    top: 430px;
    left: 55px;
    writing-mode: vertical-rl;
    font-size: 18px;
    color: #222;
    letter-spacing: 6px;
  }

  /* Geometric art - Peking Opera face */
  .geo-art {
    position: absolute;
    top: 100px;
    right: 0;
    width: 320px;
    height: 700px;
  }

  /* Pink circle top */
  .pink-circle-top {
    position: absolute;
    top: 130px;
    left: 130px;
    width: 90px;
    height: 90px;
    background: #d4728c;
    border-radius: 50%;
  }

  /* Red circle middle */
  .red-circle-mid {
    position: absolute;
    top: 290px;
    left: 80px;
    width: 85px;
    height: 85px;
    background: #c0392b;
    border-radius: 50%;
  }

  /* Small red dot */
  .red-dot-small {
    position: absolute;
    top: 620px;
    left: 160px;
    width: 24px;
    height: 24px;
    background: #c0392b;
    border-radius: 50%;
    opacity: 0.85;
  }

  /* Black triangle large */
  .black-tri-large {
    position: absolute;
    top: 180px;
    right: 0;
    width: 0;
    height: 0;
    border-left: 200px solid #111;
    border-top: 120px solid transparent;
    border-bottom: 200px solid transparent;
  }

  /* Pink gradient shape */
  .pink-shape {
    position: absolute;
    top: 230px;
    right: 0;
    width: 200px;
    height: 220px;
    background: linear-gradient(135deg, #f0a0b8 0%, #f5c8d8 40%, #fff 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 60% 80%, 40% 100%, 20% 60%, 0 40%);
  }

  /* Pink small triangle */
  .pink-tri-small {
    position: absolute;
    top: 390px;
    right: 60px;
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-top: 20px solid #d4728c;
  }

  /* Black small triangle */
  .black-tri-small {
    position: absolute;
    top: 400px;
    right: 40px;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 18px solid #111;
  }

  /* Pink triangle right edge */
  .pink-tri-right {
    position: absolute;
    top: 490px;
    right: 0;
    width: 0;
    height: 0;
    border-left: 40px solid #d4728c;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
  }

  /* Red vertical bar */
  .red-bar {
    position: absolute;
    top: 470px;
    right: 130px;
    width: 32px;
    height: 280px;
    background: #c0392b;
  }

  /* Pink top-right corner */
  .pink-corner {
    position: absolute;
    top: 130px;
    right: 0;
    width: 60px;
    height: 60px;
    background: #e8308a;
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }

  /* Birds */
  .birds {
    position: absolute;
    top: 720px;
    right: 30px;
    font-size: 14px;
    color: #555;
    letter-spacing: 8px;
    line-height: 1.8;
  }

  /* Ink wash mountains */
  .mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 200px;
  }
  .mountain-layer {
    position: absolute;
    bottom: 0;
    width: 100%;
  }
  .mountain-far {
    height: 120px;
    background: linear-gradient(to top, rgba(180,180,180,0.3) 0%, transparent 100%);
    clip-path: polygon(0 100%, 0 60%, 5% 50%, 10% 55%, 15% 40%, 20% 45%, 25% 30%, 30% 35%, 35% 20%, 40% 25%, 45% 15%, 50% 20%, 55% 10%, 60% 18%, 65% 25%, 70% 15%, 75% 22%, 80% 30%, 85% 25%, 90% 35%, 95% 30%, 100% 40%, 100% 100%);
  }
  .mountain-mid {
    height: 100px;
    background: linear-gradient(to top, rgba(120,120,120,0.4) 0%, transparent 100%);
    clip-path: polygon(0 100%, 0 70%, 8% 55%, 15% 60%, 22% 45%, 30% 50%, 38% 35%, 45% 40%, 50% 25%, 55% 30%, 62% 20%, 68% 28%, 75% 35%, 82% 30%, 90% 40%, 95% 35%, 100% 45%, 100% 100%);
  }
  .mountain-near {
    height: 80px;
    background: linear-gradient(to top, rgba(30,30,30,0.85) 0%, rgba(60,60,60,0.5) 60%, transparent 100%);
    clip-path: polygon(0 100%, 0 80%, 3% 70%, 6% 75%, 10% 60%, 14% 65%, 18% 50%, 22% 55%, 28% 45%, 32% 50%, 38% 40%, 42% 45%, 48% 35%, 52% 40%, 58% 30%, 62% 38%, 68% 42%, 72% 38%, 78% 45%, 82% 40%, 88% 50%, 92% 45%, 96% 55%, 100% 50%, 100% 100%);
  }

  /* Trees */
  .trees {
    position: absolute;
    bottom: 30px;
    right: 180px;
    font-size: 28px;
    color: #555;
    opacity: 0.6;
  }

  /* Event info */
  .event-info {
    position: absolute;
    bottom: 180px;
    left: 40px;
    font-size: 18px;
    color: #222;
    line-height: 2;
  }
  .event-info .label {
    font-size: 18px;
  }
  .event-info .value {
    font-size: 20px;
  }

  .date-section {
    margin-top: 5px;
  }
  .date-label {
    font-family: "Georgia", serif;
    font-size: 11px;
    color: #555;
    letter-spacing: 1px;
  }
  .date-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 2px;
  }
  .date-main .big {
    font-size: 42px;
    font-weight: bold;
    color: #111;
    font-family: "Georgia", serif;
  }
  .date-main .day {
    font-size: 16px;
    color: #333;
    font-family: "Georgia", serif;
  }
  .date-main .slash {
    font-size: 30px;
    color: #999;
    margin: 0 8px;
    font-style: italic;
  }

  .phone {
    margin-top: 10px;
    font-size: 18px;
    color: #222;
  }
  .phone .num {
    font-family: "Georgia", serif;
    font-size: 22px;
    margin-left: 8px;
  }
</.style>
</head>
<body>
<div class="poster">

  <!-- Logo top-right -->
  <div class="logo-area">
    <div class="logo-diamonds">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="logo-text">Gao<br>Ding<br>Yi<br>Shu</div>
  </div>

  <!-- Role circles -->
  <div class="roles">
    <div class="role-circle">生</div>
    <div class="role-circle">旦</div>
    <div class="role-circle">净</div>
    <div class="role-circle">末</div>
    <div class="role-circle">丑</div>
  </div>

  <!-- Main title -->
  <div class="main-title">
    <span class="red">京剧</span><span class="black">艺术节</span>
  </div>

  <!-- Subtitle -->
  <div class="subtitle">稿定艺术展</div>

  <!-- Geometric Art -->
  <div class="geo-art">
    <div class="pink-corner"></div>
    <div class="pink-circle-top"></div>
    <div class="black-tri-large"></div>
    <div class="pink-shape"></div>
    <div class="red-circle-mid"></div>
    <div class="pink-tri-small"></div>
    <div class="black-tri-small"></div>
    <div class="pink-tri-right"></div>
    <div class="red-bar"></div>
    <div class="red-dot-small"></div>
  </div>

  <!-- Birds -->
  <div class="birds">
    〃 〃<br>
    〃 〃 〃<br>
    〃 〃
  </div>

  <!-- Event Info -->
  <div class="event-info">
    <div><span class="label">主办方：</span><span class="value">稿定集团</span></div>
    <div><span class="label">地点：</span><span class="value">厦门市稿定剧院</span></div>
    <div class="date-section">
      <div class="date-label">DATE.</div>
      <div class="date-main">
        <span class="big">12.20</span>
        <span class="day">SUN</span>
        <span class="slash">/</span>
        <span class="big">12.30</span>
        <span class="day">SAT</span>
      </div>
    </div>
    <div class="phone">
      <span class="label">联系电话：</span><span class="num">0592-8888888</span>
    </div>
  </div>

  <!-- Mountains -->
  <div class="mountains">
    <div class="mountain-layer mountain-far"></div>
    <div class="mountain-layer mountain-mid"></div>
    <div class="mountain-layer mountain-near"></div>
  </div>

  <!-- Trees -->
  <div class="trees">🌿🌿</div>

</div>
</body>
</html>
