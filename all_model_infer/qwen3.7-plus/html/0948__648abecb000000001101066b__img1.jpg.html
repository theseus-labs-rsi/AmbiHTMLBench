<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会被无缘无故讨厌的原因有哪些</title>
    <style>
        body {
            margin: 0;
            padding: 40px 50px;
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
            background-color: #e8e4df;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(200,195,188,0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(210,205,198,0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 80%, rgba(195,190,183,0.3) 0%, transparent 70%);
            min-height: 100vh;
            color: #2a2a2a;
            line-height: 1.9;
            font-size: 18px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: #2d7a2d;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .intro {
            margin-bottom: 10px;
            text-indent: 2em;
        }

        .item {
            margin-bottom: 8px;
            text-indent: 0;
            padding-left: 0;
        }

        .item-green {
            color: #2d7a2d;
            font-weight: bold;
        }

        .question {
            margin-top: 15px;
            text-indent: 2em;
        }

        .text-body {
            font-size: 18px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>1、会被无缘无故讨厌的原因有哪些?</h1>

        <div class="text-body">
            <p class="intro">"无缘无故的讨厌"有很多原因，比如:</p>

            <p class="item">①长相凶狠的人让我们害怕(承认吧，我们都是外貌协会);</p>

            <p class="item">②刻板印象让你对一个人产生先入为主的偏见:印象里重庆人火爆，上海人爱计较。于是你真去到重庆，并且正好遇到重庆人当街斗殴，你的大脑就会激活"重庆人火爆"的认知并加强;</p>

            <p class="item item-green">③心理学上认为:对一个人的好恶可能是"投射效应"在起作用。</p>

            <p class="question">那么，"投射效应"到底是如何会让别人无缘无故讨厌你的呢?</p>
        </div>
    </div>
</body>
</html>
