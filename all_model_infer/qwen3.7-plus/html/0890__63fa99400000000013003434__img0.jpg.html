<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 金句摘抄 - 坚持奋斗主题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SimSun", "STSong", "Songti SC", serif;
            background-color: #f5f0eb;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 10px 15px;
            background-color: #f5f0eb;
        }

        .logo {
            flex: 1;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", "楷体", cursive;
            font-size: 72px;
            color: #c0392b;
            line-height: 1;
            letter-spacing: 4px;
        }

        .logo-sub {
            font-family: "Times New Roman", serif;
            font-size: 14px;
            color: #c0392b;
            letter-spacing: 6px;
            margin-top: 2px;
        }

        .header-right {
            text-align: right;
            padding-top: 5px;
        }

        .header-right .top-line {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            border-bottom: 2px solid #222;
            padding-bottom: 4px;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .header-right .top-line .separator {
            margin: 0 8px;
            font-weight: normal;
        }

        .header-right .bottom-line {
            font-size: 30px;
            font-weight: bold;
            color: #222;
            border-bottom: 3px solid #222;
            padding-bottom: 4px;
            letter-spacing: 4px;
        }

        .content {
            background-color: #c8bfa8;
            padding: 30px 35px 40px;
            border-radius: 2px;
        }

        .section-title {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #222;
            line-height: 1.5;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .example-label {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            font-weight: normal;
        }

        .example-text {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            margin-bottom: 35px;
            text-indent: 0;
        }

        .section-title-2 {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            color: #222;
            line-height: 1.5;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .example-text-2 {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            text-indent: 0;
        }

        .divider {
            height: 1px;
            background-color: transparent;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div class="logo-text">人民日报</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="header-right">
            <div class="top-line">金句 <span class="separator">|</span> 摘抄</div>
            <div class="bottom-line">坚持奋斗主题</div>
        </div>
    </div>

    <div class="content">
        <div class="section-title">
            夜色难免黑凉<br>
            前行必有曙光
        </div>

        <div class="example-label">举例:</div>
        <div class="example-text">
            夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
        </div>

        <div class="section-title-2">
            道固远，笃行可至<br>
            事虽巨，坚为必成
        </div>

        <div class="example-label">举例:</div>
        <div class="example-text-2">
            道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
        </div>
    </div>

</body>
</html>
