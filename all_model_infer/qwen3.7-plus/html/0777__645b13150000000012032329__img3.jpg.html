<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三页 - 手写稿</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #e8e4df;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
  }

  .page-container {
    position: relative;
    width: 700px;
    min-height: 520px;
    background: #f5f2ed;
    border: 1px solid #ccc;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .page-label {
    position: absolute;
    top: 8px;
    left: 12px;
    font-size: 28px;
    font-weight: bold;
    color: #f0c020;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    z-index: 10;
    font-family: "SimHei", "STHeiti", sans-serif;
  }

  .grid-paper {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
      linear-gradient(rgba(180,180,180,0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,180,180,0.25) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: 0 0;
    z-index: 1;
  }

  .content-area {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-start;
    padding: 30px 20px 20px 40px;
    height: 100%;
    min-height: 480px;
  }

  .text-column {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 20px;
    line-height: 28px;
    letter-spacing: 2px;
    color: #2a2a2a;
    padding: 0 4px;
    height: 440px;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
  }

  .text-column.signature {
    font-size: 22px;
    height: 380px;
    margin-left: 10px;
  }

  .text-column.date-col {
    font-size: 20px;
    height: 360px;
  }

  .seal-placeholder {
    position: absolute;
    left: 130px;
    bottom: 100px;
    width: 40px;
    height: 40px;
    border: 2px solid #c0392b;
    background: rgba(192, 57, 43, 0.15);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    color: #c0392b;
    border-radius: 2px;
  }

  .spacer {
    width: 28px;
    flex-shrink: 0;
  }

  .greeting-col {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 20px;
    line-height: 28px;
    letter-spacing: 2px;
    color: #2a2a2a;
    padding: 0 4px;
    height: 200px;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    margin-left: 8px;
  }
</style>
</head>
<body>

<div class="page-container">
  <div class="page-label">第三页</div>
  <div class="grid-paper"></div>

  <div class="content-area">

    <div class="text-column">因我的猫是母猫，对比较</div>
    <div class="text-column">情况下，母猫是不会</div>
    <div class="text-column">用舌头舔的，用舌头舔的只</div>
    <div class="text-column">有公猫，她们会把嘴贴到水面</div>
    <div class="text-column">上往里吸水。</div>

    <div class="spacer"></div>

    <div class="text-column">总之，必须注意训练</div>
    <div class="text-column">段，也要注意训练者意识的</div>
    <div class="text-column">基础，就像细郎的能力</div>
    <div class="text-column">拉维罗某，都是我在应该</div>
    <div class="text-column">请谅吧。</div>

    <div class="spacer"></div>

    <div class="greeting-col">已顿</div>
    <div class="greeting-col" style="height:160px;">笔健！</div>

    <div class="spacer"></div>

    <div class="text-column signature">莫言</div>
    <div class="text-column date-col">癸卯年七月七日晚</div>

  </div>

  <div class="seal-placeholder">[印章]</div>
</div>

</body>
</html>
