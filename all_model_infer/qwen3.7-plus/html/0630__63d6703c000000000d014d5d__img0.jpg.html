<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Biology Notes</title>
<style>
  body {
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    font-size: 18px;
    line-height: 1.8;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 40px;
    background: #f5f0e8;
    color: #222;
  }
  .page {
    background: #faf8f0;
    padding: 30px 35px;
    border: 1px solid #ccc;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
  }
  .top-section {
    margin-bottom: 20px;
  }
  .branch-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 2px;
  }
  .branch-label {
    white-space: nowrap;
    min-width: 180px;
  }
  .arrow {
    margin: 0 5px;
  }
  .sub-items {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .sub-item {
    margin-left: 10px;
  }
  .indent {
    margin-left: 30px;
  }
  .indent2 {
    margin-left: 50px;
  }
  .numbered {
    margin: 8px 0;
  }
  .numbered .num {
    font-weight: bold;
    margin-right: 5px;
  }
  hr.divider {
    border: none;
    border-top: 2px solid #555;
    margin: 25px 0;
  }
  .tree-container {
    display: flex;
    align-items: flex-start;
    margin-top: 10px;
  }
  .tree-root {
    font-size: 22px;
    font-weight: bold;
    padding-top: 10px;
    min-width: 80px;
  }
  .tree-branches {
    display: flex;
    flex-direction: column;
    position: relative;
    padding-left: 20px;
  }
  .tree-branch {
    position: relative;
    padding: 8px 0 8px 20px;
    border-left: 2px solid #333;
    margin-left: 10px;
  }
  .tree-branch::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    width: 20px;
    height: 2px;
    background: #333;
  }
  .tree-branch:first-child {
    margin-top: 5px;
  }
  .tree-branch:last-child {
    border-left: none;
  }
  .tree-branch:last-child::before {
    width: 20px;
  }
  .tree-item {
    margin: 5px 0;
  }
  .tree-sub {
    margin-left: 30px;
    font-size: 16px;
  }
  .highlight {
    background: #d0e8f0;
    padding: 1px 4px;
    border-radius: 2px;
  }
  .note-title {
    font-size: 20px;
    margin-bottom: 10px;
  }
  .diagram-top {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 5px;
  }
  .diagram-top .main-label {
    white-space: nowrap;
  }
  .diagram-top .sub-list {
    display: flex;
    flex-direction: column;
    margin-left: 10px;
  }
  .action-label {
    margin: 10px 0 5px 0;
  }
  .action-arrow {
    font-size: 20px;
    margin: 0 5px;
  }
  .bottom-section {
    margin-top: 10px;
  }
  .nucleus-tree {
    display: flex;
    align-items: flex-start;
    margin-top: 15px;
  }
  .nucleus-root {
    font-size: 24px;
    font-weight: bold;
    padding-top: 20px;
    min-width: 90px;
  }
  .nucleus-branches {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .n-branch {
    display: flex;
    align-items: flex-start;
    padding: 6px 0;
    position: relative;
  }
  .n-branch-line {
    width: 30px;
    position: relative;
    flex-shrink: 0;
  }
  .n-branch-line::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 2px;
    background: #333;
  }
  .n-branch-content {
    flex: 1;
  }
  .connector-lines {
    position: relative;
    width: 40px;
    flex-shrink: 0;
  }
  .connector-lines .line {
    position: absolute;
    background: #333;
  }
  .tree-svg {
    flex-shrink: 0;
  }
  .flex-row {
    display: flex;
    align-items: flex-start;
  }
  .flex-col {
    display: flex;
    flex-direction: column;
  }
  .ml-20 { margin-left: 20px; }
  .ml-30 { margin-left: 30px; }
  .ml-40 { margin-left: 40px; }
  .mt-5 { margin-top: 5px; }
  .mt-10 { margin-top: 10px; }
  .mb-5 { margin-bottom: 5px; }
  .mb-10 { margin-bottom: 10px; }
  .fw-bold { font-weight: bold; }
  .fs-large { font-size: 22px; }
  .fs-xl { font-size: 26px; }
  .text-center { text-align: center; }
  .underline-text {
    text-decoration: underline;
  }
  .bg-highlight {
    background-color: #c8e6f0;
    padding: 2px 6px;
    display: inline;
  }
  .bg-highlight2 {
    background-color: #d4edda;
    padding: 2px 6px;
    display: inline;
  }
  .branch-diagram {
    display: flex;
    align-items: flex-start;
  }
  .branch-diagram .root-text {
    font-size: 20px;
    white-space: nowrap;
    padding-top: 5px;
  }
  .branch-diagram .branches {
    display: flex;
    flex-direction: column;
    margin-left: 15px;
  }
  .branch-diagram .branch-item {
    position: relative;
    padding-left: 15px;
    margin: 3px 0;
  }
  .branch-diagram .branch-item::before {
    content: '—';
    position: absolute;
    left: 0;
    top: 0;
  }
  .sub-arrow {
    margin-left: 10px;
  }
  .wrap-text {
    text-indent: 2em;
  }
  .note-block {
    margin: 12px 0;
  }
  .tree-visual {
    display: flex;
    align-items: stretch;
  }
  .tree-visual .root-col {
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    padding-right: 10px;
  }
  .tree-visual .lines-col {
    width: 40px;
    position: relative;
  }
  .tree-visual .content-col {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .tree-visual .content-col .item {
    padding: 8px 0;
  }
  .svg-tree {
    display: inline-block;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Top Section: Cell Membrane System -->
  <div class="top-section">
    <div class="branch-diagram mb-10">
      <div class="root-text" style="font-size:18px;">内质网</div>
      <span class="arrow">→</span>
      <div class="root-text" style="font-size:18px;">高尔基体</div>
    </div>

    <div class="branch-diagram mb-10">
      <div class="root-text">cell的生物膜系统</div>
      <div class="branches" style="margin-left:20px;">
        <div class="branch-item" style="padding-left:20px;">cell膜</div>
        <div class="branch-item" style="padding-left:20px;">cell器膜</div>
        <div class="branch-item" style="padding-left:20px;">核膜</div>
      </div>
    </div>

    <div class="mb-5">
      <span class="action-arrow">↓</span> 作用
    </div>

    <div class="note-block">
      <span class="num">①</span> 使cell具有相对稳定的内部环境<br>
      <span class="indent">同时，在cell与外部环境进行物质运输、能量转</span><br>
      <span class="indent">化、信息传递的过程中起决定性作用。</span>
    </div>

    <div class="note-block">
      <span class="num">②</span> 广阔的膜面积为许多酶提供了附着位点。
    </div>

    <div class="note-block">
      <span class="num">③</span> 外障 <span class="arrow">→</span> 保证了cell生命活动高效有序的<br>
      <span class="indent2">进行。</span>
    </div>
  </div>

  <hr class="divider">

  <!-- Bottom Section: Cell Nucleus -->
  <div class="bottom-section">
    <div class="note-title">
      <span class="bg-highlight">cell核控制着cell的代谢和遗传</span>
    </div>

    <div class="tree-visual" style="margin-top:15px;">
      <div class="root-col" style="font-size:26px; font-weight:bold; align-self:center;">
        cell核
      </div>
      <div class="lines-col" style="position:relative; min-height:220px;">
        <svg width="40" height="220" style="position:absolute; top:0; left:0;">
          <line x1="0" y1="30" x2="30" y2="30" stroke="#333" stroke-width="2"/>
          <line x1="0" y1="90" x2="30" y2="90" stroke="#333" stroke-width="2"/>
          <line x1="0" y1="150" x2="30" y2="150" stroke="#333" stroke-width="2"/>
          <line x1="0" y1="210" x2="30" y2="210" stroke="#333" stroke-width="2"/>
        </svg>
      </div>
      <div class="content-col" style="flex:1;">
        <div class="item">
          核膜：双层，外障
        </div>
        <div class="item">
          核仁：与某种RNA的合成以及核糖<br>
          <span class="ml-30">体的形成有关</span>
        </div>
        <div class="item">
          染色质 <span class="arrow">→</span> 由DNA和Pro组成<br>
          <span class="ml-30"><span class="action-arrow">↓</span> 遗传信息的载体</span>
        </div>
        <div class="item">
          核孔：实现核质之间频繁的物质交<br>
          <span class="ml-30"><span class="bg-highlight2">和信息交流</span></span>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
