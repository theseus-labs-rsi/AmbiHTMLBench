<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 金句摘抄 心态主题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SimSun", "STSong", "Songti SC", serif;
            background-color: #f5f0eb;
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 25px 15px;
            background-color: #f5f0eb;
        }

        .logo-section {
            flex: 1;
        }

        .logo {
            font-family: "KaiTi", "STKaiti", "楷体", cursive;
            font-size: 52px;
            color: #c0392b;
            font-weight: bold;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-family: "Times New Roman", serif;
            font-size: 13px;
            color: #c0392b;
            letter-spacing: 3px;
            margin-top: 2px;
        }

        .title-section {
            text-align: right;
            flex-shrink: 0;
        }

        .title-top {
            font-size: 22px;
            font-weight: bold;
            color: #222;
            border-bottom: 2px solid #222;
            padding-bottom: 4px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .title-top .separator {
            margin: 0 6px;
            font-weight: normal;
        }

        .title-bottom {
            font-size: 32px;
            font-weight: bold;
            color: #222;
            border-bottom: 3px solid #222;
            padding-bottom: 4px;
            letter-spacing: 3px;
        }

        .content {
            background-color: #d4c9b8;
            padding: 30px 25px 40px;
        }

        .quote-block {
            margin-bottom: 30px;
        }

        .quote-text {
            font-size: 30px;
            font-weight: bold;
            color: #222;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .label {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .explanation {
            font-size: 15px;
            color: #333;
            line-height: 1.8;
            text-align: justify;
            text-indent: 0;
        }

        .quote-block-2 .quote-text {
            font-size: 28px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-section">
            <div class="logo">人民日报</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="title-section">
            <div class="title-top">金句 <span class="separator">|</span> 摘抄</div>
            <div class="title-bottom">心态主题</div>
        </div>
    </div>

    <div class="content">
        <div class="quote-block">
            <div class="quote-text">
                且行且忘且随风，<br>
                且行且看且从容。
            </div>
            <div class="label">释义：</div>
            <div class="explanation">
                意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们]遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
            </div>
        </div>

        <div class="quote-block quote-block-2">
            <div class="quote-text">
                我将玫瑰藏于身后风起花落，<br>
                从此鲜花赠自己，<br>
                纵马踏花向自由。
            </div>
            <div class="label">释义：</div>
            <div class="explanation">
                我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
            </div>
        </div>
    </div>

</body>
</html>
