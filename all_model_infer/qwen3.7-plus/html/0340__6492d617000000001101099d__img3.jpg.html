<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算思维二：分解思维</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: #fff;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .page {
            position: relative;
            width: 600px;
            min-height: 820px;
            padding: 50px 40px 60px;
            background: #fff;
        }

        /* Corner brackets */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-top: 2px solid #8a9a8a;
            border-left: 2px solid #8a9a8a;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-top: 2px solid #8a9a8a;
            border-right: 2px solid #8a9a8a;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-bottom: 2px solid #8a9a8a;
            border-left: 2px solid #8a9a8a;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-bottom: 2px solid #8a9a8a;
            border-right: 2px solid #8a9a8a;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #111;
            letter-spacing: 2px;
        }

        .definition {
            font-size: 17px;
            line-height: 1.8;
            color: #c0392b;
            margin-bottom: 30px;
            padding: 0 5px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 14px;
            color: #111;
        }

        .section p {
            font-size: 17px;
            line-height: 1.8;
            color: #222;
            padding: 0 5px;
        }

        .footer {
            text-align: center;
            font-size: 15px;
            color: #333;
            margin-top: 40px;
            position: relative;
        }

        .turn-page {
            position: absolute;
            bottom: 50px;
            right: 30px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .turn-page .arrow-box {
            background: #111;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 4px 0 0 4px;
            letter-spacing: 2px;
        }

        .turn-page .arrow {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 30px solid #111;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <h1>计算思维二：分解思维</h1>

        <p class="definition">分解思维是指将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）。</p>

        <div class="section">
            <h2>1、问题梳理</h2>
            <p>先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</p>
        </div>

        <div class="section">
            <h2>2、问题分解</h2>
            <p>将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</p>
        </div>

        <div class="section">
            <h2>3、整合方案</h2>
            <p>制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</p>
        </div>

        <div class="turn-page">
            <div class="arrow-box">翻页</div>
            <div class="arrow"></div>
        </div>

        <div class="footer">
            原创：学习方法社
        </div>
    </div>
</body>
</html>
