<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用暗示的积极力量养出优秀孩子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: #fff;
            padding: 30px 40px;
            max-width: 700px;
            margin: 0 auto;
            color: #333;
        }

        .title-box {
            background: #e8eaf6;
            border: 1.5px solid #b0b8d8;
            border-radius: 10px;
            padding: 14px 30px;
            text-align: center;
            margin-bottom: 24px;
        }

        .title-box h1 {
            font-size: 26px;
            font-weight: bold;
            color: #222;
        }

        .title-box h1 .highlight {
            color: #7b2d8e;
        }

        .subtitle {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        .content-box {
            background: #eef0f8;
            border: 1.5px solid #c8cce0;
            border-radius: 6px;
            padding: 22px 28px;
        }

        .pair {
            margin-bottom: 14px;
        }

        .pair:last-child {
            margin-bottom: 0;
        }

        .negative {
            font-size: 17px;
            color: #333;
            margin-bottom: 6px;
            line-height: 1.6;
        }

        .negative .icon {
            color: #d32f2f;
            font-weight: bold;
            margin-right: 6px;
            font-size: 18px;
        }

        .positive {
            font-size: 17px;
            color: #7b2d8e;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .positive .icon {
            color: #4caf50;
            font-weight: bold;
            margin-right: 6px;
            font-size: 18px;
        }

        .pair:last-child .positive {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="title-box">
        <h1>用<span class="highlight">暗示</span>的积极力量养出优秀孩子</h1>
    </div>

    <div class="subtitle">学习上，让孩子体验一个个小成功</div>

    <div class="content-box">

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>你磨蹭半天了，没写几个字，再磨下去就别睡了</div>
            <div class="positive"><span class="icon">✓</span>越早完成作业，休息的时间就越多！</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>这么简单的题都不会做？</div>
            <div class="positive"><span class="icon">✓</span>这道题你觉得难，不太会是吗？</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>赶紧写作业，一点都不自觉</div>
            <div class="positive"><span class="icon">✓</span>你很少忘记写作业的，如果需要帮助就告诉我。</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>你这孩子怎么这么犟呢，你要听话</div>
            <div class="positive"><span class="icon">✓</span>你可以说"不"，但我想听听你的理由理解你。</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>你怎么这么烦人呢，就不能安静一会儿吗？</div>
            <div class="positive"><span class="icon">✓</span>你自己先去玩一会，妈妈忙完就马上找你。</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>勇敢点，这有什么的啊？</div>
            <div class="positive"><span class="icon">✓</span>我相信你行的，再试试看，我陪着你</div>
        </div>

        <div class="pair">
            <div class="negative"><span class="icon">✘</span>快点走，再拖拖拉拉你就别出去了。</div>
            <div class="positive"><span class="icon">✓</span>我们来比一比，看谁更快出门。</div>
        </div>

    </div>

</body>
</html>
