<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background-color: #f5f0e8;
    color: #5a5a5a;
    font-size: 14px;
  }

  .nav-bar {
    display: flex;
    background-color: #c8b89a;
    border-bottom: 1px solid #b8a88a;
    height: 36px;
    align-items: center;
  }

  .nav-bar span {
    padding: 0 18px;
    font-size: 13px;
    color: #6b6b6b;
    cursor: pointer;
    border-right: 1px solid #b8a88a;
    height: 100%;
    display: flex;
    align-items: center;
  }

  .nav-bar span:first-child {
    border-left: 1px solid #b8a88a;
  }

  .nav-bar span.active {
    background-color: #d4c4a6;
    color: #4a4a4a;
  }

  .nav-bar span:hover {
    background-color: #d4c4a6;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 30px 40px;
  }

  .page-title {
    font-size: 20px;
    font-weight: bold;
    color: #4a4a4a;
    margin-bottom: 16px;
    padding-left: 4px;
  }

  .page-title::before {
    content: "· ";
  }

  .notes-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #c8c0b0;
    background-color: #faf8f4;
  }

  .notes-table td, .notes-table th {
    border: 1px solid #d8d0c0;
    padding: 10px 14px;
    vertical-align: top;
  }

  .label-cell {
    background-color: #f0ece4;
    width: 100px;
    min-width: 100px;
    font-weight: bold;
    color: #6b6b6b;
    font-size: 13px;
    white-space: nowrap;
  }

  .content-cell {
    background-color: #faf8f4;
    min-height: 40px;
  }

  .full-row td {
    padding: 10px 14px;
  }

  .full-row .label-cell {
    width: 100px;
  }

  .media-section {
    display: flex;
    border: 1px solid #d8d0c0;
    margin-bottom: 0;
  }

  .media-label {
    background-color: #f0ece4;
    padding: 10px 14px;
    font-weight: bold;
    color: #6b6b6b;
    font-size: 13px;
    width: 100px;
    min-width: 100px;
    border-right: 1px solid #d8d0c0;
  }

  .media-content {
    flex: 1;
    padding: 10px 14px;
    min-height: 40px;
  }

  .radio-section {
    display: flex;
    border: 1px solid #d8d0c0;
    border-top: none;
  }

  .radio-labels {
    background-color: #f0ece4;
    padding: 10px 14px;
    width: 100px;
    min-width: 100px;
    border-right: 1px solid #d8d0c0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .radio-labels label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #6b6b6b;
    cursor: pointer;
  }

  .radio-labels input[type="radio"] {
    accent-color: #b8a88a;
  }

  .radio-content {
    flex: 1;
    padding: 10px 14px;
    min-height: 120px;
    background-color: #faf8f4;
  }

  .analysis-header-row {
    display: flex;
    border: 1px solid #d8d0c0;
    border-top: none;
  }

  .analysis-header {
    flex: 1;
    background-color: #f0ece4;
    padding: 10px 14px;
    text-align: center;
    font-size: 13px;
    color: #6b6b6b;
    border-right: 1px solid #d8d0c0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .analysis-header:last-child {
    border-right: none;
  }

  .analysis-header input[type="radio"] {
    accent-color: #b8a88a;
  }

  .analysis-content-row {
    display: flex;
    border: 1px solid #d8d0c0;
    border-top: none;
    min-height: 200px;
  }

  .analysis-content {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid #d8d0c0;
    background-color: #faf8f4;
    min-height: 200px;
  }

  .analysis-content:last-child {
    border-right: none;
  }

  .transfer-row {
    display: flex;
    border: 1px solid #d8d0c0;
    border-top: none;
    min-height: 120px;
  }

  .transfer-label {
    background-color: #f0ece4;
    padding: 10px 14px;
    font-weight: bold;
    color: #6b6b6b;
    font-size: 13px;
    width: 100px;
    min-width: 100px;
    border-right: 1px solid #d8d0c0;
    display: flex;
    align-items: center;
  }

  .transfer-content {
    flex: 1;
    padding: 10px 14px;
    background-color: #faf8f4;
    min-height: 120px;
  }

  .notes-row {
    display: flex;
    border: 1px solid #d8d0c0;
    border-top: none;
  }

  .notes-label {
    background-color: #f0ece4;
    padding: 10px 14px;
    font-weight: bold;
    color: #6b6b6b;
    font-size: 13px;
    width: 100px;
    min-width: 100px;
    border-right: 1px solid #d8d0c0;
    display: flex;
    align-items: center;
  }

  .notes-content {
    flex: 1;
    padding: 10px 14px;
    background-color: #faf8f4;
    min-height: 40px;
  }

  .grid-bg {
    background-image:
      linear-gradient(rgba(200, 192, 176, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 192, 176, 0.15) 1px, transparent 1px);
    background-size: 20px 20px;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: #b0a898;
  }

  .watermark {
    position: fixed;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #c8c0b0;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="nav-bar">
  <span>行测</span>
  <span>&gt;</span>
  <span class="active">常识</span>
  <span>言语</span>
  <span>数量</span>
  <span>判断</span>
  <span>资料</span>
  <span>申论</span>
  <span>纸笔</span>
  <span>计划</span>
</div>

<div class="container">
  <div class="page-title">晨读笔记</div>

  <div style="border: 1px solid #d8d0c0; border-bottom: none;">
    <div class="full-row" style="display:flex; border-bottom: 1px solid #d8d0c0;">
      <div class="label-cell">主题</div>
      <div class="content-cell grid-bg" style="flex:1; min-height: 40px;"></div>
    </div>
    <div class="full-row" style="display:flex; border-bottom: 1px solid #d8d0c0;">
      <div class="label-cell">应用领域</div>
      <div class="content-cell grid-bg" style="flex:1; min-height: 40px;"></div>
    </div>
    <div class="full-row" style="display:flex; border-bottom: 1px solid #d8d0c0;">
      <div class="label-cell">热门事件</div>
      <div class="content-cell grid-bg" style="flex:1; min-height: 40px;"></div>
    </div>
    <div class="full-row" style="display:flex; border-bottom: 1px solid #d8d0c0;">
      <div class="label-cell">宏观政策</div>
      <div class="content-cell grid-bg" style="flex:1; min-height: 40px;"></div>
    </div>
    <div class="full-row" style="display:flex; border-bottom: 1px solid #d8d0c0;">
      <div class="label-cell">媒体评论</div>
      <div class="content-cell grid-bg" style="flex:1; min-height: 40px;"></div>
    </div>
  </div>

  <div class="radio-section">
    <div class="radio-labels">
      <label><input type="radio" name="category"> 意义</label>
      <label><input type="radio" name="category"> 原因</label>
      <label><input type="radio" name="category"> 问题</label>
      <label><input type="radio" name="category"> 危害</label>
    </div>
    <div class="radio-content grid-bg"></div>
  </div>

  <div class="analysis-header-row">
    <div class="analysis-header"><input type="radio" name="analysis"> 问题分析</div>
    <div class="analysis-header"><input type="radio" name="analysis"> 原因分析</div>
    <div class="analysis-header">对策分析</div>
  </div>

  <div class="analysis-content-row">
    <div class="analysis-content grid-bg"></div>
    <div class="analysis-content grid-bg"></div>
    <div class="analysis-content grid-bg"></div>
  </div>

  <div class="transfer-row">
    <div class="transfer-label">句子迁移</div>
    <div class="transfer-content grid-bg"></div>
  </div>

  <div class="transfer-row">
    <div class="transfer-label">方法迁移</div>
    <div class="transfer-content grid-bg"></div>
  </div>

  <div class="notes-row">
    <div class="notes-label">备注</div>
    <div class="notes-content grid-bg"></div>
  </div>
</div>

<div class="footer">
  <span style="font-size:11px; color:#c8c0b0;">© 2024 粉笔</span>
</div>

<div class="watermark">粉笔</div>

</body>
</html>
