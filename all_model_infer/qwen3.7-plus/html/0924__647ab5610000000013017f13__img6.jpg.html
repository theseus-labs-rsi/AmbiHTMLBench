<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 做好竞品分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d4b896;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #f5f0eb;
            border-radius: 16px;
            max-width: 620px;
            width: 100%;
            padding: 40px 45px 30px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .banner {
            display: inline-block;
            background-color: #a07850;
            color: #fff;
            font-size: 15px;
            padding: 8px 24px 8px 20px;
            border-radius: 4px;
            position: relative;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .banner::after {
            content: '';
            position: absolute;
            right: -14px;
            top: 0;
            width: 0;
            height: 0;
            border-top: 17px solid transparent;
            border-bottom: 17px solid transparent;
            border-left: 14px solid #a07850;
        }

        .main-title {
            font-size: 42px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .main-title span {
            font-size: 42px;
            margin-right: 10px;
        }

        .section-text {
            font-size: 17px;
            color: #2a2a2a;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .section-text.bold {
            font-weight: 700;
        }

        .spacer {
            height: 20px;
        }

        .list-container {
            margin-top: 10px;
        }

        .list-item {
            font-size: 17px;
            color: #2a2a2a;
            line-height: 1.8;
            margin-bottom: 4px;
        }

        .list-item .label {
            font-weight: 700;
        }

        .sub-item {
            font-size: 17px;
            color: #2a2a2a;
            line-height: 1.8;
            padding-left: 28px;
            margin-bottom: 2px;
        }

        .footer {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 2px dashed #c9b8a0;
            text-align: center;
            font-size: 18px;
            color: #2a2a2a;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner">新媒体账号运营6种方法</div>

        <h1 class="main-title"><span>03</span> 做好竞品分析</h1>

        <p class="section-text bold">前期的竞品分析</p>
        <p class="section-text">一定要花大量的时间和精力去收集信息</p>

        <div class="spacer"></div>

        <p class="section-text bold">仔细分析</p>
        <p class="section-text">可以从以下几个方面来看</p>

        <div class="spacer"></div>

        <div class="list-container">
            <p class="list-item"><span class="label">1、账号人设标签</span></p>
            <p class="list-item"><span class="label">2、账号选题规划</span></p>
            <p class="list-item"><span class="label">3、内容脚本拆解：</span></p>
            <p class="sub-item">结构、矛盾点、金句、痒点</p>
            <p class="list-item"><span class="label">4、内容形式：</span></p>
            <p class="sub-item">场景道具服装，拍摄剪辑节奏</p>
            <p class="list-item"><span class="label">5、运营策略：</span></p>
            <p class="sub-item">发布时间和频率，封面，文案，线上互动</p>
            <p class="sub-item">用户运营，引流途径</p>
        </div>

        <div class="footer">
            @新媒体运营的十万个为什么
        </div>
    </div>
</body>
</html>
