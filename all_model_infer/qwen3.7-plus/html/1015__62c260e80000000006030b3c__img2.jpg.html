<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二、建议、提案</title>
    <style>
        body {
            font-family: "SimSun", "STSong", "Songti SC", serif;
            font-size: 16px;
            line-height: 1.8;
            color: #222;
            background-color: #f5f0e8;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .main-title {
            text-align: center;
            color: #c0392b;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .intro-text {
            text-indent: 2em;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .format-label {
            color: #c07830;
            font-weight: bold;
            font-size: 17px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .template-block {
            margin-left: 20px;
        }

        .template-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .template-subtitle {
            text-align: center;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .salutation {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .salutation u {
            text-decoration: underline;
        }

        .body-text {
            text-indent: 2em;
            margin-bottom: 10px;
        }

        .body-text .highlight {
            color: #2980b9;
            font-style: italic;
        }

        .body-text u {
            text-decoration: underline;
        }

        .numbered-list {
            margin-left: 2em;
            margin-top: 10px;
        }

        .numbered-list p {
            margin: 5px 0;
        }

        .numbered-list .highlight {
            color: #2980b9;
            font-style: italic;
        }

        .signature-block {
            text-align: right;
            margin-top: 30px;
            margin-right: 40px;
        }

        .signature-block p {
            margin: 3px 0;
        }

        .signature-block u {
            text-decoration: underline;
        }

        .underline-text {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="main-title">二、建议、提案</div>

    <p class="intro-text">
        建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。
    </p>

    <div class="format-label">格式：</div>

    <div class="template-block">
        <div class="template-title">关于 xxxxx 的建议</div>
        <div class="template-subtitle">（"发文机关+关于+内容+文种"）</div>

        <p class="salutation">
            <span class="underline-text">各级领导</span>(称谓要根据具体题目要求分析得出)：
        </p>

        <p class="body-text">
            当前，……等问题比较突出(或做了什么工作)，为了做好……工作，<span class="underline-text">提出以下建议：</span><span class="highlight">(开头为背景分析，指出存在的主要问题和目的意义)</span>
        </p>

        <div class="numbered-list">
            <p>一、……</p>
            <p>二、……</p>
            <p>三、……<span class="highlight">(主体内容还原为对策题,提出解决问题的措施)</span></p>
        </div>

        <div class="signature-block">
            <p><span class="underline-text">发文机关</span></p>
            <p><span class="underline-text">xx 年 xx 月 xx 日</span></p>
        </div>
    </div>

</body>
</html>
