<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞吉欧Reggio</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #1a1a1a;
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23222" width="100" height="100"/></svg>');
    color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }

  .container {
    max-width: 700px;
    width: 100%;
    padding: 30px 20px 40px;
  }

  .title {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    background-color: #111;
    display: inline-block;
    padding: 10px 40px;
    margin: 0 auto 30px;
    border-radius: 4px;
    letter-spacing: 2px;
  }

  .title-wrapper {
    text-align: center;
    margin-bottom: 30px;
  }

  .bullet-item {
    margin-bottom: 18px;
    line-height: 1.8;
    font-size: 17px;
  }

  .bullet-line {
    display: flex;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .bullet-dot {
    width: 14px;
    height: 14px;
    min-width: 14px;
    background-color: #fff;
    border-radius: 50%;
    margin-top: 7px;
    margin-right: 10px;
  }

  .bullet-text {
    flex: 1;
  }

  .highlight {
    text-decoration: underline;
    text-decoration-style: wavy;
    text-decoration-color: #f5c518;
    text-underline-offset: 4px;
    text-decoration-thickness: 2px;
  }

  .sub-line {
    text-align: center;
    margin-top: 4px;
    margin-bottom: 4px;
    font-size: 17px;
    line-height: 1.8;
  }

  .centered-text {
    text-align: center;
  }

  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #252525 100%);
    z-index: -1;
  }

  .clay-figures {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    opacity: 0.15;
    background: 
      radial-gradient(ellipse at 20% 80%, #8B7355 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #6B5B45 0%, transparent 50%),
      radial-gradient(ellipse at 50% 90%, #7B6B55 0%, transparent 40%);
  }
</style>
</head>
<body>

<div class="bg-overlay"></div>
<div class="clay-figures"></div>

<div class="container">
  <div class="title-wrapper">
    <div class="title">瑞吉欧Reggio</div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text">基于皮亚杰和维果斯基等心理学家的</div>
    </div>
    <div class="sub-line centered-text">
      <span class="highlight">建构主义心理学</span>。
    </div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text"><span class="highlight">走进儿童心灵的儿童观</span>，以孩子的思维、</div>
    </div>
    <div class="sub-line centered-text">
      孩子的立场來看待一场
    </div>
    <div class="sub-line centered-text">
      不压制孩子，让其充分表现潜能
    </div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text">弹性课程，<span class="highlight">从儿童的兴趣和需要出发</span></div>
    </div>
    <div class="sub-line centered-text">
      不让孩子生活在成人的包围之中。
    </div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text">教师必须尽可能地<span class="highlight">减少介入</span>，更不可过度介入。</div>
    </div>
    <div class="sub-line centered-text">
      与其牵着儿童的手，不如让他们用自己的双脚站立。
    </div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text"><span class="highlight">儿童的自我表达和相互交流特别重要</span>，是儿童探索、</div>
    </div>
    <div class="sub-line centered-text">
      研究、解决问题过程中的基本活动。
    </div>
  </div>

  <div class="bullet-item">
    <div class="bullet-line">
      <div class="bullet-dot"></div>
      <div class="bullet-text"><span class="highlight">在共同分享中</span>，每个人均可提出最好的想法，</div>
    </div>
    <div class="sub-line centered-text">
      提升和加强团队间意见交流、
    </div>
    <div class="sub-line centered-text">
      并刺激新奇或出乎意料的事情发生。
    </div>
  </div>
</div>

</body>
</html>
