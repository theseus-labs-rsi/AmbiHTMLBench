<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝体质特点&奶粉选购</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background-color: #4a90d9;
    padding: 10px;
    max-width: 600px;
    margin: 0 auto;
  }
  .main-title {
    background-color: #3a7bd5;
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    padding: 18px 10px;
    border-radius: 12px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .section {
    background-color: #fff;
    border-radius: 16px;
    padding: 16px 18px 20px;
    margin-bottom: 12px;
  }
  .section-header {
    background-color: #3a7bd5;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .section-header .star {
    font-size: 22px;
  }
  .illustrations {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .illustration-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  .illustration-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background-color: #f0f4f8;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .illustration-circle .placeholder-img {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #999;
  }
  .illustration-label {
    font-size: 15px;
    color: #333;
    text-align: center;
    font-weight: 500;
  }
  .tip-item {
    margin-bottom: 16px;
  }
  .tip-title {
    font-size: 18px;
    font-weight: bold;
    color: #3a7bd5;
    margin-bottom: 6px;
  }
  .tip-title .num {
    color: #3a7bd5;
  }
  .tip-text {
    font-size: 15px;
    color: #333;
    line-height: 1.7;
  }
  .tip-text .highlight {
    color: #3a7bd5;
    font-weight: 500;
  }
  .tip-text .highlight-orange {
    color: #e8913a;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="main-title">宝宝体质特点&amp;奶粉选购</div>

<div class="section">
  <div class="section-header">
    <span class="star">⭐</span>
    新生儿宝宝的体质有哪些特点？
  </div>
  <div class="illustrations">
    <div class="illustration-item">
      <div class="illustration-circle">
        <div class="placeholder-img">[图: 宝宝捂肚子]</div>
      </div>
      <div class="illustration-label">肚肚脆弱</div>
    </div>
    <div class="illustration-item">
      <div class="illustration-circle">
        <div class="placeholder-img">[图: 肠道示意]</div>
      </div>
      <div class="illustration-label">吸收差</div>
    </div>
    <div class="illustration-item">
      <div class="illustration-circle">
        <div class="placeholder-img">[图: 宝宝哭闹]</div>
      </div>
      <div class="illustration-label">体质差</div>
    </div>
    <div class="illustration-item">
      <div class="illustration-circle">
        <div class="placeholder-img">[图: 宝宝过敏]</div>
      </div>
      <div class="illustration-label">体质敏感</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span class="star">⭐</span>
    选择奶粉的时候要选哪种？
  </div>

  <div class="tip-item">
    <div class="tip-title"><span class="num">1.</span>奶源纯净安全的</div>
    <div class="tip-text">建议<span class="highlight-orange">优选有机的奶源</span>，从牧场到加工都满足有机生产的要求，从源头更安全。</div>
  </div>

  <div class="tip-item">
    <div class="tip-title"><span class="num">2.</span>低敏不刺激的</div>
    <div class="tip-text">新生宝宝的肚肚娇弱，选择<span class="highlight">A2蛋白</span>的A2奶源更亲和宝宝小肚肚，不会刺激小肚肚从而引起肚肚不适。</div>
  </div>

  <div class="tip-item">
    <div class="tip-title"><span class="num">3.</span>好消化吸收的</div>
    <div class="tip-text">看奶粉的成分中是否包含助力宝宝吸收的<span class="highlight">益生菌和益生元</span>成分，这些都是可以帮助宝宝更好吸收营养的。</div>
  </div>

  <div class="tip-item">
    <div class="tip-title"><span class="num">4.</span>味道清淡，口感蓬松细腻的</div>
    <div class="tip-text">新生宝宝更适合<span class="highlight-orange">口味清淡</span>的奶粉哦~</div>
  </div>
</div>

</body>
</html>
