<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人经验总结 - 学习四科备考攻略</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
        }

        .slide-container {
            background-color: #f5f5f0;
            width: 900px;
            min-height: 560px;
            padding: 40px 60px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .slide-title {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .slide-subtitle {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .slide-intro {
            font-size: 16px;
            color: #444;
            margin-bottom: 24px;
        }

        .content-list {
            list-style: none;
            padding: 0;
        }

        .content-list li {
            font-size: 15px;
            color: #222;
            line-height: 1.8;
            margin-bottom: 10px;
            padding-left: 10px;
        }

        .content-list li .num {
            font-weight: bold;
            margin-right: 4px;
        }

        .content-list li .label {
            font-weight: bold;
        }

        .content-list li .note {
            color: #555;
        }

        .content-list li .highlight {
            color: #333;
        }

        .content-list li .paren-note {
            color: #666;
            font-size: 14px;
        }

        .content-list li .long-note {
            display: block;
            padding-left: 28px;
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="slide-title">个人经验总结</div>
        <div class="slide-subtitle">学习四科——备考攻略</div>
        <div class="slide-intro">根据经验分享备考总结的：</div>

        <ol class="content-list">
            <li>
                <span class="num">1.</span>
                <span class="label">常识：</span>李梦娇讲的好，如果时间紧可以好好看看，王英杰，某笔
            </li>
            <li>
                <span class="num">2.</span>
                <span class="label">言语理解：</span>郭熙老师，小宝，欣说
            </li>
            <li>
                <span class="num">3.</span>
                <span class="label">判断：</span>花生十三，齐麟，聂佳
            </li>
            <li>
                <span class="num">4.</span>
                <span class="label">数量：</span>花生十三，听不了就放弃，随缘，蒙B，蒙C，蒙D，蒙B走
            </li>
            <li>
                <span class="num">5.</span>
                <span class="label">申论：</span>站长，李梦圆，小马哥，申论心选（建议好好听）
                <span class="paren-note">（申论答题规范而不是模板，复盘什么题我答得规范/不规范，在答题的时候不要太多，分点清晰，今天一句名言，明天一个事例，能坚持两个月已经很多了。）</span>
            </li>
            <li>
                <span class="num">6.</span>
                浙江省考面试经验就放这里
            </li>
        </ol>
    </div>
</body>
</html>
