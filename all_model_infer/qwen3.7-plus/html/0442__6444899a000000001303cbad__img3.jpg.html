<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            max-width: 480px;
            margin: 0 auto;
            padding: 0;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c8a84e;
            font-size: 18px;
            font-weight: 500;
        }

        .header-left .back-arrow {
            font-size: 20px;
            color: #c8a84e;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icons .icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8a84e;
            font-size: 22px;
        }

        .content {
            padding: 24px 20px 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .check-icon {
            width: 28px;
            height: 28px;
            background-color: #e8b84b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .check-icon svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #222222;
        }

        .quote-text {
            font-size: 17px;
            line-height: 1.8;
            color: #333333;
            text-indent: 0;
            padding-left: 4px;
        }

        .quote-source {
            font-size: 17px;
            line-height: 1.8;
            color: #333333;
            margin-top: 4px;
        }

        .quote-source .dash {
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span class="back-arrow">‹</span>
            <span>金句合集</span>
        </div>
        <div class="header-icons">
            <div class="icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#c8a84e" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                    <circle cx="18" cy="6" r="3" fill="#c8a84e" stroke="#c8a84e"/>
                    <path d="M18 4.5l1.5 1.5" stroke="#c8a84e" stroke-width="1.5"/>
                </svg>
            </div>
            <div class="icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#c8a84e" stroke-width="2">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                    <polyline points="16 6 12 2 8 6"/>
                    <line x1="12" y1="2" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#c8a84e" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="8" cy="12" r="1" fill="#c8a84e"/>
                    <circle cx="12" cy="12" r="1" fill="#c8a84e"/>
                    <circle cx="16" cy="12" r="1" fill="#c8a84e"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="content">

        <div class="section">
            <div class="section-header">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                    </svg>
                </div>
                <div class="section-title">他写「成长」，正是你所亲历</div>
            </div>
            <div class="quote-text">
                "我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。"
            </div>
            <div class="quote-source">
                <span class="dash">——</span>《病隙碎笔》
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                    </svg>
                </div>
                <div class="section-title">他写「磨难」，报之以歌</div>
            </div>
            <div class="quote-text">
                "大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。"
            </div>
            <div class="quote-source">
                ——《好运设计》
            </div>
        </div>

    </div>

</body>
</html>
