<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur the King - Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
        }

        .poster {
            position: relative;
            width: 500px;
            height: 750px;
            background: linear-gradient(180deg, 
                #4a6a3a 0%, 
                #5a7a4a 15%, 
                #6a8a5a 30%, 
                #7a9a6a 45%, 
                #6a8a5a 60%, 
                #5a7a4a 75%, 
                #4a6a3a 100%);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .poster-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 20%, rgba(180,200,160,0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(200,210,180,0.3) 0%, transparent 50%),
                linear-gradient(180deg, 
                    #3d5c2e 0%, 
                    #4d6c3e 20%, 
                    #5d7c4e 40%, 
                    #6d8c5e 55%, 
                    #5d7c4e 70%, 
                    #4d6c3e 85%, 
                    #3d5c2e 100%);
        }

        .placeholder-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.15);
            font-size: 14px;
            text-align: center;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        .actor-name {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 18px;
            text-transform: uppercase;
            padding-left: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .taglines {
            position: absolute;
            top: 260px;
            left: 40px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.8;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .taglines p {
            margin: 0;
        }

        .title {
            position: absolute;
            left: 0;
            right: 0;
            text-align: center;
            color: #f5c518;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .title-arthur {
            top: 310px;
            font-size: 72px;
            letter-spacing: 20px;
            padding-left: 20px;
        }

        .title-the {
            top: 430px;
            font-size: 72px;
            letter-spacing: 20px;
            padding-left: 20px;
        }

        .title-king {
            top: 560px;
            font-size: 72px;
            letter-spacing: 20px;
            padding-left: 20px;
        }

        .bottom-right {
            position: absolute;
            bottom: 60px;
            right: 30px;
            text-align: right;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .bottom-right .based-on {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        .bottom-right .coming-soon {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 12px;
        }

        .bottom-right .lionsgate {
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-top: 2px;
            opacity: 0.9;
        }

        .rating-box {
            position: absolute;
            bottom: 25px;
            left: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 3px 6px;
            color: #ffffff;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .rating-box span {
            font-size: 7px;
            font-weight: 400;
            display: block;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="poster-bg"></div>
        <div class="placeholder-image">
            [Image: Mark Wahlberg portrait above, large scruffy dog (Arthur) in foreground, outdoor green background]
        </div>
        <div class="content">
            <div class="actor-name">Mark Wahlberg</div>

            <div class="taglines">
                <p>AN UNEXPECTED ENCOUNTER</p>
                <p>AN UNLIKELY BOND</p>
                <p>AN UNFORGETTABLE ADVENTURE</p>
            </div>

            <div class="title title-arthur">Arthur</div>
            <div class="title title-the">The</div>
            <div class="title title-king">King</div>

            <div class="bottom-right">
                <div class="based-on">BASED ON THE<br>INCREDIBLE TRUE STORY</div>
                <div class="coming-soon">COMING SOON</div>
                <div class="lionsgate">LIONSGATE</div>
            </div>

            <div class="rating-box">
                PG-13
                <span>RATED</span>
            </div>
        </div>
    </div>
</body>
</html>
