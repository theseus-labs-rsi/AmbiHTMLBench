<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Up in the Biz - Showtime Original</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .poster {
    width: 540px;
    height: 810px;
    position: relative;
    overflow: hidden;
    background: #c8c0b0;
    font-family: 'Inter', sans-serif;
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 20px 0 20px;
    z-index: 10;
  }

  .laurel {
    width: 90px;
    height: 70px;
    position: relative;
  }

  .laurel svg {
    width: 100%;
    height: 100%;
  }

  .laurel-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 7px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    letter-spacing: 0.5px;
  }

  .laurel-text .festival {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .laurel-text .year {
    font-size: 14px;
    font-weight: 700;
  }

  .top-center {
    text-align: center;
    flex: 1;
    padding-top: 5px;
  }

  .showtime-original {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }

  .sacha-jenkins {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #111;
    text-transform: uppercase;
    margin-top: 10px;
  }

  .cap-image {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, #b8b0a0 0%, #a09888 30%, #888070 60%, #605848 100%);
    z-index: 1;
  }

  .cap-visual {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 520px;
    z-index: 2;
  }

  .cap-shape {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .cap-dome {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 320px;
    background: radial-gradient(ellipse at 50% 40%, #5a5550 0%, #3a3530 50%, #2a2520 100%);
    border-radius: 50% 50% 30% 30%;
    box-shadow: inset 0 -20px 40px rgba(0,0,0,0.3);
  }

  .cap-button {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 10px;
    background: #2a2520;
    border-radius: 50%;
  }

  .cap-brim {
    position: absolute;
    top: 290px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 80px;
    background: linear-gradient(180deg, #2a2520 0%, #1a1510 100%);
    border-radius: 0 0 50% 50%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  .face-area {
    position: absolute;
    top: 340px;
    left: 50%;
    transform: translateX(-50%);
    width: 440px;
    height: 300px;
    background: linear-gradient(180deg, #8a7a6a 0%, #7a6a5a 30%, #6a5a4a 60%, #5a4a3a 100%);
    border-radius: 0 0 40% 40%;
    overflow: hidden;
  }

  .eye-left, .eye-right {
    position: absolute;
    top: 100px;
    width: 70px;
    height: 40px;
    background: #fff;
    border-radius: 50%;
    overflow: hidden;
  }

  .eye-left {
    left: 80px;
  }

  .eye-right {
    right: 80px;
  }

  .pupil {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    background: radial-gradient(circle, #111 40%, #333 60%, #555 80%);
    border-radius: 50%;
  }

  .eyebrow-left, .eyebrow-right {
    position: absolute;
    top: 70px;
    width: 90px;
    height: 18px;
    background: #3a3028;
    border-radius: 50%;
  }

  .eyebrow-left {
    left: 70px;
    transform: rotate(-5deg);
  }

  .eyebrow-right {
    right: 70px;
    transform: rotate(5deg);
  }

  .title-overlay {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    width: 400px;
  }

  .all-up-in-the {
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #d4a820;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }

  .biz-text {
    font-family: 'Playfair Display', serif;
    font-size: 130px;
    font-weight: 900;
    color: #d4a820;
    line-height: 0.9;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    letter-spacing: 5px;
    margin-top: -5px;
  }

  .subtitle-on-brim {
    position: absolute;
    top: 395px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    width: 300px;
  }

  .subtitle-on-brim p {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #d4a820;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    line-height: 1.4;
  }

  .bottom-section {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0a0a0a;
    padding: 30px 20px 20px 20px;
    text-align: center;
    z-index: 10;
  }

  .documentary-film {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #fff;
    text-transform: uppercase;
  }

  .august-11 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #fff;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .logos-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 18px;
  }

  .showtime-logo {
    font-family: 'Inter', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
  }

  .showtime-logo span {
    display: inline-block;
    background: #fff;
    color: #000;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    line-height: 32px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    margin-right: 2px;
    vertical-align: middle;
  }

  .divider-line {
    width: 2px;
    height: 40px;
    background: #fff;
  }

  .paramount-logo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .streaming-on {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .paramount-text {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    font-style: italic;
  }

  .paramount-text .plus {
    font-style: normal;
    font-weight: 700;
  }

  .bottom-note {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #999;
    text-transform: uppercase;
    margin-top: 16px;
  }

  /* Face texture overlay */
  .face-texture {
    position: absolute;
    top: 340px;
    left: 50%;
    transform: translateX(-50%);
    width: 440px;
    height: 300px;
    z-index: 3;
    background: 
      radial-gradient(ellipse at 30% 50%, rgba(100,85,70,0.6) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 50%, rgba(100,85,70,0.6) 0%, transparent 60%);
  }

  .ear-left {
    position: absolute;
    top: 380px;
    left: 30px;
    width: 50px;
    height: 80px;
    background: linear-gradient(180deg, #7a6a5a, #6a5a4a);
    border-radius: 50% 0 0 50%;
    z-index: 2;
  }

  .ear-right {
    position: absolute;
    top: 380px;
    right: 30px;
    width: 50px;
    height: 80px;
    background: linear-gradient(180deg, #7a6a5a, #6a5a4a);
    border-radius: 0 50% 50% 0;
    z-index: 2;
  }

  .nose-area {
    position: absolute;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 50px;
    z-index: 3;
  }

  .nose-bridge {
    width: 20px;
    height: 30px;
    background: linear-gradient(90deg, #7a6a5a, #8a7a6a, #7a6a5a);
    margin: 0 auto;
    border-radius: 0 0 50% 50%;
  }

  .forehead-wrinkles {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 40px;
    z-index: 3;
  }

  .wrinkle-line {
    width: 100%;
    height: 2px;
    background: rgba(60,50,40,0.3);
    margin: 6px 0;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="laurel">
      <svg viewBox="0 0 90 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M45 5 C20 5, 5 20, 5 40 C5 55, 15 65, 30 68" stroke="#fff" stroke-width="1.5" fill="none"/>
        <path d="M45 5 C70 5, 85 20, 85 40 C85 55, 75 65, 60 68" stroke="#fff" stroke-width="1.5" fill="none"/>
        <path d="M10 25 C15 20, 20 18, 25 20" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M8 32 C14 26, 20 24, 26 26" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M8 40 C14 34, 20 32, 26 34" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M10 48 C15 42, 20 40, 26 42" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M14 55 C18 50, 22 48, 28 50" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M20 62 C24 57, 27 55, 32 57" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M80 25 C75 20, 70 18, 65 20" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M82 32 C76 26, 70 24, 64 26" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M82 40 C76 34, 70 32, 64 34" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M80 48 C75 42, 70 40, 64 42" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M76 55 C72 50, 68 48, 62 50" stroke="#fff" stroke-width="1" fill="none"/>
        <path d="M70 62 C66 57, 63 55, 58 57" stroke="#fff" stroke-width="1" fill="none"/>
      </svg>
      <div class="laurel-text">
        <div class="festival">TRIBECA<br>FESTIVAL</div>
        <div class="year">2023</div>
      </div>
    </div>
    <div class="top-center">
      <div class="showtime-original">SHOWTIME ORIGINAL</div>
      <div class="sacha-jenkins">A SACHA JENKINS JAMMIE</div>
    </div>
    <div style="width:90px;"></div>
  </div>

  <!-- Cap Visual -->
  <div class="cap-visual">
    <div class="cap-shape">
      <div class="cap-dome">
        <div class="cap-button"></div>
      </div>
      <div class="cap-brim"></div>
    </div>
  </div>

  <!-- Face Area -->
  <div class="face-area">
    <div class="forehead-wrinkles">
      <div class="wrinkle-line"></div>
      <div class="wrinkle-line"></div>
      <div class="wrinkle-line"></div>
    </div>
    <div class="eyebrow-left"></div>
    <div class="eyebrow-right"></div>
    <div class="eye-left">
      <div class="pupil"></div>
    </div>
    <div class="eye-right">
      <div class="pupil"></div>
    </div>
    <div class="nose-area">
      <div class="nose-bridge"></div>
    </div>
  </div>

  <div class="ear-left"></div>
  <div class="ear-right"></div>

  <!-- Title Overlay -->
  <div class="title-overlay">
    <div class="all-up-in-the">ALL UP IN THE</div>
    <div class="biz-text">BIZ</div>
  </div>

  <!-- Subtitle on Brim -->
  <div class="subtitle-on-brim">
    <p>THE LIFE AND RHYMES<br>OF BIZ MARKIE</p>
  </div>

  <!-- Bottom Section -->
  <div class="bottom-section">
    <div class="documentary-film">DOCUMENTARY FILM</div>
    <div class="august-11">AUGUST 11</div>
    <div class="logos-row">
      <div class="showtime-logo"><span>S</span>HOWTIME</div>
      <div class="divider-line"></div>
      <div class="paramount-logo">
        <div class="streaming-on">STREAMING ON</div>
        <div class="paramount-text">Paramount<span class="plus">+</span></div>
      </div>
    </div>
    <div class="bottom-note">PARAMOUNT+ WITH SHOWTIME PLAN ONLY.</div>
  </div>
</div>

</body>
</html>
