<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 回避行为</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
        }

        .card {
            position: relative;
            width: 520px;
            min-height: 680px;
            background: #fff;
            padding: 50px 45px 60px 45px;
            overflow: hidden;
        }

        /* Blue corner decorations */
        .corner-tl {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            background: #1a3fa0;
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        .corner-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 30px;
            background: #1a3fa0;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .corner-bl {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 60px;
            background: #1a3fa0;
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }

        .corner-br {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 80px;
            height: 40px;
            background: #1a3fa0;
            clip-path: polygon(0 100%, 100% 100%, 100% 0, 30% 0);
        }

        .corner-r-mid {
            position: absolute;
            top: 200px;
            right: 0;
            width: 25px;
            height: 80px;
            background: #1a3fa0;
            clip-path: polygon(0 0, 100% 15%, 100% 85%, 0 100%);
        }

        .corner-b-mid {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-20%);
            width: 120px;
            height: 20px;
            background: #1a3fa0;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .number {
            font-size: 52px;
            font-weight: 900;
            color: #111;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: #111;
            margin-bottom: 60px;
            letter-spacing: 4px;
        }

        .bold-text {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .regular-text {
            font-size: 20px;
            font-weight: 400;
            color: #222;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>
        <div class="corner-r-mid"></div>
        <div class="corner-b-mid"></div>

        <div class="number">03</div>
        <div class="title">回避行为</div>

        <div class="bold-text">自觉或不自觉地回避曾经的某些人、事、物。</div>

        <div class="regular-text">比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……</div>
    </div>
</body>
</html>
