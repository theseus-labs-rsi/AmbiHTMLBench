<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Sustainability Summit</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .poster {
    width: 800px;
    height: 1100px;
    display: flex;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .left-column {
    width: 50%;
    background: #f5f0e8;
    position: relative;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  .right-column {
    width: 50%;
    background: #006b3f;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .title-section {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .title-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 52px;
    font-weight: 900;
    color: #006b3f;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .title-text span {
    display: block;
    margin-bottom: 8px;
  }

  .divider {
    width: 280px;
    height: 2px;
    background: #006b3f;
    margin: 0 auto 30px;
  }

  .registration-section {
    padding: 0 40px 30px;
  }

  .registration-section h3 {
    font-size: 18px;
    font-weight: 700;
    color: #4CAF50;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .registration-section .label {
    font-size: 16px;
    color: #333;
    margin-bottom: 4px;
  }

  .registration-section .price {
    font-size: 36px;
    font-weight: 900;
    color: #006b3f;
    margin-bottom: 16px;
  }

  .bottom-left {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 280px;
    background: #f5f0e8;
    border-radius: 50% 50% 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    z-index: 3;
  }

  .bottom-left h3 {
    font-size: 18px;
    font-weight: 700;
    color: #4CAF50;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .bottom-left p {
    font-size: 15px;
    color: #333;
    text-align: center;
    line-height: 1.5;
  }

  .logo-section {
    position: absolute;
    top: 30px;
    right: 30px;
    z-index: 5;
    text-align: right;
  }

  .logo-section .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .logo-section .logo-text sup {
    font-size: 10px;
    vertical-align: super;
  }

  .tree-section {
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
  }

  .tree-placeholder {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tree-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
  }

  .bottom-right {
    position: relative;
    height: 380px;
    background: #4CAF50;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-info {
    width: 340px;
    height: 340px;
    background: #006b3f;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }

  .circle-info h3 {
    font-size: 18px;
    font-weight: 700;
    color: #4CAF50;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .circle-info p {
    font-size: 15px;
    color: #fff;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .circle-info p:last-child {
    margin-bottom: 0;
  }

  .tree-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 65%;
    overflow: hidden;
  }

  .tree-visual {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, transparent 0%, transparent 100%);
    position: relative;
  }

  .tree-visual::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 70%;
    background: radial-gradient(ellipse at 50% 30%, #2d5a1e 0%, #1a3d10 40%, #0d2608 70%, transparent 100%);
    border-radius: 50% 50% 30% 30%;
  }

  .tree-visual::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 40%;
    background: linear-gradient(180deg, #5a3a1a, #3d2510);
    border-radius: 3px;
  }

  .tree-svg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Left Column -->
  <div class="left-column">
    <div class="title-section">
      <div class="title-text">
        <span>Global</span>
        <span>Sustainability</span>
        <span>Summit</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="registration-section">
      <h3>REGISTRATION</h3>
      <p class="label">General Admission</p>
      <p class="price">$350</p>
      <p class="label">Students &amp; Nonprofits</p>
      <p class="price">$200</p>
    </div>

    <div class="bottom-left">
      <h3>VISIT</h3>
      <p>www.yourwebsite.com for more<br>details and to register today!</p>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-column">
    <div class="logo-section">
      <div class="logo-text">Your<sup>®</sup><br>LOGO</div>
    </div>

    <div class="tree-section">
      <div class="tree-container">
        <svg class="tree-svg-container" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet" style="width:100%;height:100%;">
          <!-- Tree canopy -->
          <ellipse cx="200" cy="130" rx="180" ry="120" fill="#1a4a10"/>
          <ellipse cx="160" cy="110" rx="140" ry="100" fill="#2d6b1e"/>
          <ellipse cx="240" cy="120" rx="150" ry="110" fill="#245a16"/>
          <ellipse cx="200" cy="100" rx="160" ry="90" fill="#3a7a28"/>
          <ellipse cx="180" cy="140" rx="130" ry="80" fill="#1e5212"/>
          <ellipse cx="220" cy="90" rx="120" ry="70" fill="#4a8a35"/>
          <ellipse cx="150" cy="130" rx="100" ry="70" fill="#2d6b1e"/>
          <ellipse cx="260" cy="140" rx="110" ry="75" fill="#1a4a10"/>
          <!-- Trunk -->
          <path d="M195 220 Q190 300 192 380 Q193 420 195 460 L205 460 Q207 420 208 380 Q210 300 205 220 Z" fill="#5a3a1a"/>
          <path d="M197 250 Q193 320 194 380 L200 380 Q202 320 203 250 Z" fill="#6b4520"/>
          <!-- Branches -->
          <path d="M200 280 Q170 260 140 240" stroke="#5a3a1a" stroke-width="6" fill="none"/>
          <path d="M200 260 Q230 240 260 220" stroke="#5a3a1a" stroke-width="5" fill="none"/>
          <path d="M200 300 Q175 290 155 275" stroke="#5a3a1a" stroke-width="4" fill="none"/>
          <path d="M200 290 Q225 275 250 260" stroke="#5a3a1a" stroke-width="4" fill="none"/>
        </svg>
      </div>
    </div>

    <div class="bottom-right">
      <div class="circle-info">
        <h3>DATE</h3>
        <p>27 January 2026<br>10:00 PM</p>
        <h3>LOCATION</h3>
        <p>Grand Hall, Convention<br>Center, Chicago, IL</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
