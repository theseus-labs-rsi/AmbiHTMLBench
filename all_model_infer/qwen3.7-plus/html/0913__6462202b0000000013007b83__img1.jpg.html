<!DOCTYPE html>

    <style>

            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-size: 18px;

        }

        .container {

        }

        .section-title {

            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            padding: 10px 30px;
            display: inline-block;
            margin-bottom: 18px;
            letter-spacing: 4px;
        }

        .section-title-wrapper {
            margin-bottom: 10px;
        }

        .text-block {
            margin-bottom: 30px;
        }

        .text-block p {
            font-size: 18px;
            line-height: 2;
            margin-bottom: 4px;
        }

        .section-title-2 {
            background-color: #1a6dd4;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            padding: 10px 30px;
            display: inline-block;

            font-size: 18px;
            line-height: 2;
            margin-bottom: 20px;

            font-weight: bold;
        }

            font-size: 18px;
            line-height: 2;
            margin-bottom: 16px;
        }

        }

        .extra-text {
            font-size: 18px;
            line-height: 2;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;

        <div class="text-block">
            <p>个人参赛，由所在中学进行统一报名；</p>
            <p>均为笔试考试，预赛为各省市自行组织、自主命题；</p>

        <div class="numbered-item">

        </div>

        <div class="numbered-item">
            <span class="num">2、</span>一些难的知识点和不知道如何规划学习进度的时候，最好选择报课，大部分学生在有人一起学的情况下会比较好。
        </div>

        <div class="extra-text">
            有时候你以为自己自学学的挺好，但是很多竞赛技巧、思维是需要老师来指导的。时间和钱，不能兼得。
        </div>
