<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into the Darkness - Movie Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .poster {
            width: 100%;
            max-width: 700px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .top-text {
            text-align: center;
            padding: 40px 20px 10px;
            letter-spacing: 0.35em;
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            color: #fff;
        }

        .title {
            text-align: center;
            padding: 10px 20px 30px;
        }

        .title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 90px;
            font-weight: 900;
            color: #c0392b;
            line-height: 1.05;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 520px;
            background: #000;
            overflow: hidden;
        }

        .image-container .placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #000 0%, #111 30%, #1a1a1a 50%, #222 70%, #111 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .parking-garage {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0a0a0a;
        }

        .ceiling-lights {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: #000;
        }

        .light-bar {
            position: absolute;
            background: #fff;
            border-radius: 2px;
        }

        .light-bar-1 {
            width: 60px;
            height: 12px;
            top: 15%;
            left: 18%;
            transform: rotate(-15deg);
            background: linear-gradient(90deg, #ddd, #fff, #ddd);
        }

        .light-bar-2 {
            width: 70px;
            height: 14px;
            top: 12%;
            right: 28%;
            transform: rotate(12deg);
            background: linear-gradient(90deg, #ddd, #fff, #ddd);
        }

        .light-bar-3 {
            width: 50px;
            height: 10px;
            top: 22%;
            left: 22%;
            transform: rotate(-10deg);
            background: linear-gradient(90deg, #ccc, #eee, #ccc);
        }

        .light-bar-4 {
            width: 40px;
            height: 8px;
            top: 20%;
            right: 5%;
            transform: rotate(8deg);
            background: linear-gradient(90deg, #ccc, #eee, #ccc);
        }

        .light-bar-5 {
            width: 30px;
            height: 6px;
            top: 25%;
            left: 2%;
            transform: rotate(-5deg);
            background: linear-gradient(90deg, #bbb, #ddd, #bbb);
        }

        .ceiling-strip {
            position: absolute;
            top: 38%;
            left: 0;
            right: 0;
            height: 8%;
            background: repeating-linear-gradient(
                90deg,
                #111 0px,
                #111 8px,
                #222 8px,
                #222 10px
            );
        }

        .ceiling-strip-lights {
            position: absolute;
            top: 39%;
            left: 0;
            right: 0;
            height: 6%;
        }

        .strip-light {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, #999, #fff, #999);
            border-radius: 1px;
        }

        .strip-light-1 { width: 40px; top: 0; left: 8%; transform: rotate(-8deg); }
        .strip-light-2 { width: 35px; top: 2px; left: 25%; transform: rotate(-5deg); }
        .strip-light-3 { width: 30px; top: 1px; left: 42%; transform: rotate(-3deg); }
        .strip-light-4 { width: 35px; top: 0; left: 58%; transform: rotate(3deg); }
        .strip-light-5 { width: 40px; top: 2px; left: 72%; transform: rotate(5deg); }
        .strip-light-6 { width: 35px; top: 1px; left: 85%; transform: rotate(8deg); }

        .clearance-sign {
            position: absolute;
            top: 42%;
            right: 12%;
            background: #fff;
            color: #000;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            z-index: 10;
        }

        .garage-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 20%, #333 40%, #2a2a2a 60%, #1a1a1a 100%);
        }

        .garage-walls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
        }

        .left-wall {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, #1a1a1a, #2a2a2a);
        }

        .right-wall {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 15%;
            height: 100%;
            background: linear-gradient(90deg, #2a2a2a, #1a1a1a);
        }

        .car {
            position: absolute;
            bottom: 42%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: #111;
            border-radius: 5px 5px 2px 2px;
        }

        .car::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 15px;
            width: 50px;
            height: 18px;
            background: #0a0a0a;
            border-radius: 3px 3px 0 0;
        }

        .road-arrow {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #555;
        }

        .road-line {
            position: absolute;
            bottom: 20%;
            left: 30%;
            right: 10%;
            height: 2px;
            background: #444;
            transform: rotate(-5deg);
        }

        .railing {
            position: absolute;
            bottom: 25%;
            left: 0;
            width: 25%;
            height: 30%;
            border-top: 3px solid #333;
        }

        .railing-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #333;
        }

        .bottom-text {
            text-align: center;
            padding: 30px 20px 50px;
        }

        .director {
            font-size: 18px;
            color: #c0392b;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .details {
            font-size: 16px;
            color: #fff;
            line-height: 1.8;
            letter-spacing: 0.05em;
            font-weight: 300;
        }

        .details p {
            margin: 2px 0;
        }

        @media (max-width: 600px) {
            .title h1 {
                font-size: 55px;
            }
            .image-container {
                height: 350px;
            }
            .top-text {
                font-size: 11px;
            }
            .clearance-sign {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="top-text">Soulful Film Presents</div>
        <div class="title">
            <h1>Into the<br>Darkness</h1>
        </div>
        <div class="image-container">
            <div class="parking-garage">
                <div class="ceiling-lights">
                    <div class="light-bar light-bar-1"></div>
                    <div class="light-bar light-bar-2"></div>
                    <div class="light-bar light-bar-3"></div>
                    <div class="light-bar light-bar-4"></div>
                    <div class="light-bar light-bar-5"></div>
                </div>
                <div class="ceiling-strip"></div>
                <div class="ceiling-strip-lights">
                    <div class="strip-light strip-light-1"></div>
                    <div class="strip-light strip-light-2"></div>
                    <div class="strip-light strip-light-3"></div>
                    <div class="strip-light strip-light-4"></div>
                    <div class="strip-light strip-light-5"></div>
                    <div class="strip-light strip-light-6"></div>
                </div>
                <div class="clearance-sign">SELF PARK 6'-0" CLEARANCE</div>
                <div class="garage-floor">
                    <div class="garage-walls">
                        <div class="left-wall"></div>
                        <div class="right-wall"></div>
                    </div>
                    <div class="car"></div>
                    <div class="road-arrow"></div>
                    <div class="road-line"></div>
                    <div class="railing">
                        <div class="railing-bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom-text">
            <p class="director">Directed by Levi Stanford</p>
            <div class="details">
                <p>May 23, 2019 | 2:00 pm</p>
                <p>Michael Hopper Auditorium</p>
                <p>Oreixs university, OH</p>
            </div>
        </div>
    </div>
</body>
</html>
