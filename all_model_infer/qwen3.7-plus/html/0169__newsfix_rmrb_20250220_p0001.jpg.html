    <h1>坚定信心，民营经济发展前景广阔、大有可为</h1>
    <div class="sub">——学习贯彻习近平总书记在民营企业座谈会上重要讲话</div>
    <div class="author">本报评论员</div>
  </div>

  <!-- Main Content: 3 columns -->
  <div class="main-content">

    <!-- Left Sidebar -->
    <div class="left-sidebar">
      <div style="display:flex; gap:5px;">
        <div class="vertical-title">大显身手正当其时</div>
        <div class="vertical-subtitle">——习近平总书记出席民营企业座谈会并发表重要讲话侧记</div>
      </div>
      <div class="sidebar-article">
        <p>又一场民营企业座谈会，引发了广泛关注。</p>
        <p>2月17日上午10时，人民大会堂东大厅，习近平总书记主持这场座谈会，同民营企业负责人代表等座谈并发表重要讲话。</p>
        <p>2018年11月，也是在东大厅，总书记主持召开民营企业座谈会，当时社会上"民营经济离场论""国进民退论"等杂音不时出现，总书记掷地有声地指出，"民营经济是我国经济制度的内在要素，民营企业和民营企业家是我们自己人"。</p>
        <p>时隔6年多，再次召开座谈会。</p>
        <p>如今，我国民营经济已经形成相当的规模、占有很重的分量，推动民营经济高质量发展具备坚实基础。我国民营企业数量从2012年的1085万户增加到2025年1月底的5670.7万户，10多年间增长超4倍。</p>
        <p>座谈会现场，洋溢着蓬勃而热烈的氛围。</p>
        <p>任正非、王传福、刘永好、雷军、王兴兴等6位民营企业负责人代表先后发言，就当前经济形势、民营经济发展面临困难挑战等谈认识、提建议、话期盼。</p>
        <p>他们中，有的数次参加重大座谈会，有的在一线创业数十年，也有在新时代成长起来的年轻一代民营企业家代表。在座的还有有关部门负责人，以及来自科技、制造、农业、新能源等领域的知名民营企业负责人。这场座谈会，折射出中国民营经济的蓬勃生机与活力。</p>
        <p>这次座谈会是党中央召开的一次重要会议，也是继2018年之后又一次专门研究民营经济发展的重要会议。</p>
        <p>民营经济发展是中国特色社会主义制度的必然要求。党的十八大以来，以习近平同志为核心的党中央始终坚持"两个毫不动摇"，为民营经济发展创造了良好环境。</p>
        <p>习近平总书记开门点题："几十年来，关于对民营经济在改革开放和社会主义现代化建设事业中地位和作用的认识、党和国家对民营经济发展的方针政策，我们党理论和实践是一脉相承的。"</p>
        <p>民营企业是伴随改革开放伟大历程蓬勃发展起来的。</p>
        <p>在改革开放之初，邓小平同志就指出，"允许一部分人先富起来"。随着改革开放的深入，民营企业如雨后春笋般涌现。</p>
        <p>座谈会上，习近平总书记回忆道："我当县委书记时，正定县有'万元户'，当时觉得了不得。现在看，这算不了什么。"</p>
        <p>从"万元户"到世界500强，中国民营企业的发展壮大，是改革开放伟大成就的生动写照。</p>
        <p>这次座谈会，是在我国经济发展面临新的形势和任务背景下召开的。当前，世界百年未有之大变局加速演进，我国发展进入战略机遇和风险挑战并存、不确定难预料因素增多的时期。</p>
        <p>习近平总书记强调，"当前民营经济发展面临的一些困难和挑战，总体上是在改革发展、产业转型升级过程中出现的，是局部的而不是整体的，是暂时的而不是长期的，是能够克服的而不是不能克服的。"总书记的话语，给广大民营企业家吃下了"定心丸"。</p>
        <p>座谈会上，习近平总书记指出，"新时代新征程，我国社会生产力将不断跃升，人民生活水平将稳步提高，改革开放将进一步全面深化，特别是教育科技事业快速发展，人才队伍和劳动力资源数量庞大、素质优良，产业体系和基础设施体系配套完善，14亿多人口的超大规模市场潜力巨大，给民营经济发展带来很多新的机遇、提供更大发展空间。"</p>
        <p>总书记对民营经济发展寄予厚望："广大民营企业和民营企业家要满怀创业和报国激情，不断提升理想境界，厚植家国情怀，富而思源、富而思进，弘扬企业家精神，专心致志做强做优做大企业，坚定做中国特色社会主义的建设者、中国式现代化的促进者。"</p>
        <p>政策方面，落实落细。习近平总书记强调："扎扎实实落实促进民营经济发展的政策措施，是当前促进民营经济发展的工作重点。凡是党中央定了的就要坚决执行，不能打折扣。"</p>
        <p>以信心促行动。</p>
        <p>座谈会上，总书记指出，"当前，民营经济发展面临的一些困难和挑战，总体上是在改革发展、产业转型升级过程中出现的，是局部的而不是整体的，是暂时的而不是长期的，是能够克服的而不是不能克服的。"</p>
        <p>民营企业是企业家，企业家的动力在于创新。习近平总书记对广大民营企业家寄予厚望，勉励大家勇做创新先锋，敢于创新、善于创新。</p>
        <p>从制造业到服务业，从传统产业到新兴产业，从国内到国际，中国民营企业正以更加开放的姿态，拥抱世界、拥抱未来。</p>
        <p class="small-text">（下转第二版）</p>

      </div>

      <h2>促进民营经济健康发展、高质量发展</h2>
      <div class="author-line">——习近平总书记在民营企业座谈会上重要讲话指明方向、凝聚力量</div>
      <div class="author-line">本报记者 林丽艳 罗珊珊 王云杉</div>

      <div class="col-text">
        <p>有党中央一以贯之支持民营经济发展的鲜明态度，有有力有效政策的务实举措，有广大民营企业家拼搏奋进的实干精神，民营经济一定能迎来更加广阔的发展前景。</p>
        <p>"促进民营经济健康发展、高质量发展"——这是习近平总书记在民营企业座谈会上的重要讲话中反复强调的关键词。</p>
        <p>广大民营企业和民营企业家要正确认识当前形势，坚定发展信心，把思想和行动统一到党中央决策部署上来，凝心聚力、攻坚克难，推动民营经济实现高质量发展。</p>
        <p>座谈会上，6位民营企业负责人代表先后发言，围绕当前民营经济发展面临的困难挑战、企业转型升级、科技创新、拓展国际市场等话题，谈认识、提建议、话期盼。</p>
        <p>"总书记的重要讲话，为广大民营企业和民营企业家指明了前进方向、提供了根本遵循。"与会企业家纷纷表示，要认真学习领会、坚决贯彻落实，把总书记的殷殷嘱托转化为推动企业高质量发展的实际行动。</p>
        <p>当前，我国民营经济已经形成相当的规模、占有很重的分量。截至2025年1月底，全国登记在册民营企业数量超过5500万户，民营企业在企业总量中的占比达到92%以上。</p>
        <p>从贡献税收、创造就业，到推动创新、促进开放，民营经济已经成为推动我国发展不可或缺的力量。</p>
        <p>然而，当前民营经济发展也面临一些困难和挑战。座谈会上，企业家们反映的问题主要集中在：市场需求不足、融资难融资贵、转型升级压力大、国际环境复杂多变等。</p>
        <p>对此，习近平总书记明确指出，"当前民营经济发展面临的一些困难和挑战，总体上是在改革发展、产业转型升级过程中出现的，是局部的而不是整体的，是暂时的而不是长期的，是能够克服的而不是不能克服的。"</p>
        <p>总书记的话语，给广大民营企业家吃下了"定心丸"。</p>
        <p>座谈会上，习近平总书记提出了一系列促进民营经济发展壮大的政策举措，包括：持续破除市场准入壁垒、全面落实公平竞争政策制度、完善社会信用激励约束机制、完善市场化重整机制、鼓励民营企业盘活存量资产资源等。</p>
        <p>这些政策举措，直击民营企业发展的痛点难点，为民营经济发展注入了强劲动力。</p>
        <p>"政策的生命力在于执行。"与会企业家表示，期待各项政策措施能够尽快落地见效，真正惠及广大民营企业。</p>
        <p>创新是引领发展的第一动力。座谈会上，多位企业家围绕科技创新话题发言，分享企业在技术研发、产品创新方面的经验做法。</p>
        <p>习近平总书记强调，"民营企业要践行新发展理念，深刻把握民营经济发展存在的不足和面临的挑战，转变发展方式、调整产业结构、转换增长动力，坚守主业、做强实业，自觉走高质量发展路子。"</p>
        <p>从传统制造到智能制造，从低端产品到高端品牌，中国民营企业正在加快转型升级步伐，不断提升核心竞争力。</p>
        <p>面向未来，广大民营企业和民营企业家要坚定信心、迎难而上，在推动高质量发展中展现更大作为，为实现中华民族伟大复兴的中国梦贡献更大力量。</p>
        <p class="small-text">（下转第三版）</p>
      </div>
    </div>

    <!-- Right Column -->
    <div class="right-col">
      <div class="col-text">
        <p>企业家的成长发展，既需要企业自身的努力，也离不开良好的社会环境。座谈会上，习近平总书记强调，"要营造有利于民营经济发展的良好社会氛围"。</p>
        <p>当前，全社会尊重企业家、尊重创业创新的良好氛围正在形成。越来越多的民营企业家的故事被广为传颂，越来越多的民营企业家获得社会荣誉和认可。</p>
        <p>"民营企业家是自己人"——这句话，温暖了无数民营企业家的心。</p>
        <p>座谈会上，习近平总书记指出，"党和国家对民营经济发展的基本方针政策，已经纳入中国特色社会主义制度体系，将一以贯之坚持和落实，不能变，也不应该变。"</p>
        <p>这一重要论述，给广大民营企业家吃下了"定心丸"，坚定了大家长期扎根中国、安心谋发展的信心决心。</p>
        <p>从"三个没有变"到"自己人"，从"56789"到"两个毫不动摇"，党中央支持民营经济发展的立场一以贯之、旗帜鲜明。</p>
        <p>座谈会上，习近平总书记对民营企业家提出殷切期望："广大民营企业和民营企业家要满怀创业和报国激情，不断提升理想境界，厚植家国情怀，富而思源、富而思进，弘扬企业家精神，专心致志做强做优做大企业，坚定做中国特色社会主义的建设者、中国式现代化的促进者。"</p>
        <p>这是嘱托，更是鞭策。</p>
        <p>当前，世界百年未有之大变局加速演进，我国发展进入战略机遇和风险挑战并存、不确定难预料因素增多的时期。在这样的背景下，民营经济发展既面临挑战，更迎来机遇。</p>
        <p>新一轮科技革命和产业变革深入发展，为我国民营企业转型升级、创新发展提供了广阔空间。人工智能、大数据、云计算、物联网等新技术的广泛应用，正在深刻改变着各行各业的生产方式和商业模式。</p>
        <p>广大民营企业要抓住机遇，加快数字化转型，提升创新能力，在新一轮科技革命和产业变革中赢得主动。</p>
        <p>同时，随着共建"一带一路"倡议深入推进，我国民营企业"走出去"的步伐不断加快，国际化经营水平持续提升。</p>
        <p>座谈会上，多位企业家围绕拓展国际市场、参与国际竞争合作等话题发言，分享企业"走出去"的经验做法。</p>
        <p>习近平总书记强调，"民营企业要积极参与共建'一带一路'，在推动构建人类命运共同体中发挥更大作用。"</p>
        <p>从产品出口到产能合作，从技术输出到标准引领，中国民营企业正在以更加开放的姿态，拥抱世界、拥抱未来。</p>
        <p>面向未来，广大民营企业和民营企业家要坚定发展信心，保持战略定力，在推动高质量发展中展现更大作为。</p>
        <p>让我们更加紧密地团结在党中央周围，坚定信心、迎难而上，共同谱写民营经济发展新篇章，为实现中华民族伟大复兴的中国梦作出新的更大贡献！</p>
      </div>
    </div>
  </div>

    <div class="article-heading">中国新发展理念为何成为国际公共产品？</div>
    <div class="author-line">本报记者 龚鸣</div>

    <div class="two-col-article">
      <div class="col-text">
        <p>有着五千年文明史、许多重大科学发现诞生于中国大地的中国，越来越成为"全球知识公共产品"的重要贡献者，成为"全球治理公共产品"的重要提供者。——据外交部发言人毛宁1月14日答记者问</p>
        <p>这次两会的记者招待会，现场来了很多国内外媒体记者，学习报道两会，感受中国发展脉动。</p>
        <p>有超过20位记者、来自全球10多个国家和地区的媒体记者，参加了本次两会。他们中，有来自"一带一路"沿线国家的记者，也有来自西方发达国家的记者。大家普遍关注中国经济发展、科技创新、绿色发展等话题。</p>
        <p>在记者招待会上，一位外国记者提问："中国新发展理念为何能够成为国际公共产品？"这个问题，引发了在场记者的广泛讨论。</p>
        <p>中国新发展理念，包括创新、协调、绿色、开放、共享五大发展理念，是习近平新时代中国特色社会主义思想的重要组成部分。</p>
        <p>这五大发展理念，不仅指导着中国自身的发展实践，也为世界其他国家提供了有益借鉴。</p>
        <p>创新发展理念，强调科技创新是引领发展的第一动力。中国近年来在人工智能、量子计算、5G通信等领域取得重大突破，这些成果不仅造福中国人民，也为世界科技进步作出了贡献。</p>
        <p>协调发展理念，注重解决发展不平衡问题。中国通过区域协调发展战略、乡村振兴战略等，努力缩小城乡差距、区域差距，这些经验对广大发展中国家具有重要参考价值。</p>
        <p>绿色发展理念，坚持绿水青山就是金山银山。中国大力推进生态文明建设，积极应对气候变化，承诺力争2030年前实现碳达峰、2060年前实现碳中和，展现了负责任大国的担当。</p>
        <p>开放发展理念，推动构建开放型世界经济。中国通过共建"一带一路"、举办进博会、放宽市场准入等举措，为世界经济增长注入新动力。</p>
        <p>共享发展理念，坚持以人民为中心的发展思想。中国历史性地解决了绝对贫困问题，全面建成小康社会，这些成就为全球减贫事业作出了重大贡献。</p>
        <p>中国新发展理念之所以能够成为国际公共产品，根本在于其蕴含的普遍价值和实践智慧。</p>
        <p>首先，新发展理念回应了人类面临的共同挑战。当前，世界面临经济增长乏力、气候变化、贫富分化等诸多全球性问题，需要各国携手应对。中国新发展理念提供的思路方案，具有广泛的适用性和借鉴意义。</p>
        <p>其次，新发展理念体现了以人民为中心的价值追求。无论是创新发展还是共享发展，最终目的都是增进人民福祉。这一价值追求，超越了意识形态和社会制度的差异，能够引起各国人民的共鸣。</p>
        <p>再次，新发展理念经过了中国的成功实践检验。中国用几十年时间走完了发达国家几百年走过的工业化历程，经济总量稳居世界第二，人民生活水平显著提高。这一发展成就，充分证明了新发展理念的科学性和有效性。</p>
        <p>最后，新发展理念秉持开放包容的态度。中国始终主张各国根据自身国情选择适合的发展道路，反对将某种发展模式强加于人。这种开放包容的态度，使得新发展理念更容易被国际社会接受和借鉴。</p>
        <p>当前，世界百年未有之大变局加速演进，人类面临前所未有的挑战。中国新发展理念作为国际公共产品，将为推动构建人类命运共同体、实现世界可持续发展贡献更多中国智慧和中国方案。</p>
      </div>

        <p>在两会期间，多位代表委员围绕新发展理念的国际影响发言，分享中国发展经验。</p>
        <p>全国人大代表、某高校教授表示："新发展理念不仅是中国的发展指南，也为世界提供了中国方案。许多发展中国家纷纷借鉴中国经验，取得了显著成效。"</p>
        <p>全国政协委员、某企业负责人表示："我们在'一带一路'沿线国家的投资实践中，深刻感受到新发展理念的普遍适用性。绿色发展、开放合作等理念，得到了当地政府和民众的广泛认同。"</p>
        <p>面向未来，中国将继续秉持新发展理念，推动高质量发展，同时加强国际交流合作，分享中国发展经验，为构建人类命运共同体作出更大贡献。</p>

      <h4>我们的铁路风景，今天的活力中国</h4>
      <p>从林海雪原到江南水乡，从大漠戈壁到东海之滨，中国铁路纵横交错，连接起神州大地的每一个角落。每一趟列车，都是一道流动的风景线，展现着今日中国的蓬勃生机与活力。</p>
      <p>春运期间，全国铁路发送旅客数再创新高。从"走得了"到"走得好"，从"绿皮车"到"复兴号"，中国铁路的发展变迁，折射出国家经济社会的巨大进步。</p>
      <p>铁路，不仅是交通基础设施，更是经济发展的动脉、文化交流的桥梁。它连接城市与乡村，连接东部与西部，连接中国与世界。</p>
