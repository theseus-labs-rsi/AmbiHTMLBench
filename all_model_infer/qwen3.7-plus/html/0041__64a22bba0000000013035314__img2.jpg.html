<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第十一章 三角形</title>
<style>
  body {
    font-family: "SimSun", "Songti SC", serif;
    font-size: 14px;
    line-height: 1.8;
    color: #333;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 40px;
    background: #fff;
  }
  p {
    text-indent: 2em;
    margin: 0.5em 0;
  }
  .figure-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    margin: 20px 0 5px 0;
  }
  .figure-item {
    text-align: center;
    flex: 1;
  }
  .figure-item .placeholder {
    width: 220px;
    height: 130px;
    margin: 0 auto;
    background: #f0f0f0;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 12px;
  }
  .figure-item .caption {
    margin-top: 6px;
    font-size: 13px;
    color: #555;
  }
  .figure-label {
    text-align: center;
    font-size: 13px;
    color: #555;
    margin: 5px 0 20px 0;
  }
  .exercise-box {
    border: 2px dashed #c8a96e;
    border-radius: 12px;
    padding: 20px 25px;
    margin: 25px 0;
    position: relative;
  }
  .exercise-title {
    display: inline-block;
    background: #d4a843;
    color: #fff;
    padding: 3px 18px;
    border-radius: 15px;
    font-size: 15px;
    font-weight: bold;

    margin-left: 10px;
  }
  .exercise-question {
    font-size: 14px;
    margin-bottom: 15px;
    text-indent: 0;
  }
  .shapes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 10px;
  }
  .shape-item {
    text-align: center;
  }
  .shape-item .shape-placeholder {
    width: 120px;
    height: 90px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;

  .shape-item .shape-label {
    font-size: 13px;
    color: #555;
    margin-top: 4px;

  .footer {
    text-align: right;
    font-size: 13px;
    color: #555;

  }

    max-width: 100%;

</head>
<body>

<p>还可以发现，斜钉一根木条的四边形木架的形状不会改变，这是因为斜钉一根木条后，四边形变成两个三角形，由于三角形有稳定性，斜钉一根木条的窗框在未安装好之前也不会变形。</p>

<p>三角形的稳定性有广泛的应用，图 11.1-8 表示其中一些例子，你能再举一些例子吗？</p>

<div class="figure-row">
  <div class="figure-item">
    <div class="placeholder">
      <svg width="200" height="120" viewBox="0 0 200 120">

        <polygon points="10,100 30,60 60,40 90,30 120,35 150,50 180,70 190,100" fill="none" stroke="#888" stroke-width="2"/>
        <line x1="10" y1="100" x2="190" y2="100" stroke="#888" stroke-width="2"/>
        <line x1="30" y1="60" x2="60" y2="100" stroke="#888" stroke-width="1.5"/>
        <line x1="60" y1="40" x2="90" y2="100" stroke="#888" stroke-width="1.5"/>
        <line x1="90" y1="30" x2="120" y2="100" stroke="#888" stroke-width="1.5"/>
        <line x1="120" y1="35" x2="150" y2="100" stroke="#888" stroke-width="1.5"/>
        <line x1="150" y1="50" x2="180" y2="100" stroke="#888" stroke-width="1.5"/>
        <line x1="30" y1="60" x2="90" y2="30" stroke="#888" stroke-width="1.5"/>
        <line x1="60" y1="40" x2="120" y2="35" stroke="#888" stroke-width="1.5"/>
        <line x1="90" y1="30" x2="150" y2="50" stroke="#888" stroke-width="1.5"/>
        <line x1="120" y1="35" x2="180" y2="70" stroke="#888" stroke-width="1.5"/>
        <rect x="0" y="100" width="200" height="20" fill="#c8c0a0"/>
      </svg>
    </div>
    <div class="caption">钢架桥</div>
  </div>
  <div class="figure-item">
    <div class="placeholder">
      <svg width="200" height="120" viewBox="0 0 200 120">
        <rect x="0" y="0" width="200" height="120" fill="#f5f0e8"/>
        <!-- crane body -->
        <rect x="20" y="85" width="80" height="20" rx="3" fill="#e8a020"/>
        <rect x="30" y="75" width="50" height="15" rx="2" fill="#d09018"/>
        <!-- wheels -->
        <circle cx="35" cy="108" r="6" fill="#555"/>
        <circle cx="55" cy="108" r="6" fill="#555"/>
        <circle cx="80" cy="108" r="6" fill="#555"/>
        <circle cx="95" cy="108" r="6" fill="#555"/>
        <!-- crane arm -->
        <line x1="70" y1="75" x2="170" y2="20" stroke="#e8a020" stroke-width="4"/>
        <line x1="70" y1="75" x2="170" y2="20" stroke="#d09018" stroke-width="2"/>
        <!-- cable -->
        <line x1="165" y1="22" x2="165" y2="55" stroke="#888" stroke-width="1.5"/>
        <!-- hook -->
        <rect x="160" y="55" width="10" height="8" fill="#888"/>
        <!-- support -->
        <line x1="70" y1="75" x2="100" y2="20" stroke="#e8a020" stroke-width="2"/>
      </svg>
    </div>
    <div class="caption">起重机</div>
  </div>
</div>
<div class="figure-label">图 11.1-8</div>

<p>四边形的不稳定性也有广泛的应用，图 11.1-9 表示其中一些例子。</p>
