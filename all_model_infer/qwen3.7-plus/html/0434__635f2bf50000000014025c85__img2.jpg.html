<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的 vs 人民日报写的</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    max-width: 600px;
    margin: 0 auto;
  }

  .top-section {
    background-color: #d4c9a8;
    padding: 30px 30px 20px 30px;
    position: relative;
    min-height: 260px;
  }

  .top-header {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
  }

  .top-header h2 {
    font-size: 28px;
    color: #3a3a5c;
    font-weight: bold;
    margin-right: 15px;
  }

  .red-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 12px solid #c0392b;
    background: transparent;
    display: inline-block;
  }

  .top-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .top-text {
    font-size: 20px;
    color: #3a3a5c;
    line-height: 1.8;
    max-width: 320px;
  }

  .child-image-container {
    position: relative;
    width: 200px;
    height: 220px;
    flex-shrink: 0;
  }

  .child-image {
    width: 100%;
    height: 100%;
    background: #8a7a6a;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .child-placeholder {
    width: 180px;
    height: 200px;
    background: linear-gradient(135deg, #6b5b4f, #8a7a6a);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .child-face {
    width: 120px;
    height: 130px;
    background: #d4a574;
    border-radius: 50% 50% 45% 45%;
    position: relative;
    margin-top: -20px;
  }

  .child-face::before {
    content: "😢";
    font-size: 80px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .child-shirt {
    width: 160px;
    height: 60px;
    background: #c0392b;
    border-radius: 10px 10px 0 0;
    margin-top: -10px;
  }

  .child-caption {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    white-space: nowrap;
    z-index: 2;
  }

  .watermark-top {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 24px;
    color: rgba(255,255,255,0.25);
    pointer-events: none;
    white-space: nowrap;
  }

  .bottom-section {
    background-color: #3d3d6b;
    padding: 35px 30px 30px 30px;
    position: relative;
  }

  .bottom-header {
    display: flex;
    align-items: center;
    margin-bottom: 25px;
  }

  .bottom-header h2 {
    font-size: 28px;
    color: #e8dcc8;
    font-weight: bold;
    margin-right: 15px;
  }

  .green-check {
    font-size: 50px;
    color: #4CAF50;
    line-height: 1;
  }

  .bottom-text {
    font-size: 18px;
    color: #e8dcc8;
    line-height: 2;
    text-indent: 0;
  }

  .bottom-text p {
    margin-bottom: 0;
  }

  .citation {
    text-align: right;
    color: #e8dcc8;
    font-size: 16px;
    margin-top: 25px;
    padding-right: 10px;
  }

  .watermark-bottom {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 24px;
    color: rgba(255,255,255,0.12);
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="top-section">
  <div class="watermark-top">看报的美女纸</div>
  <div class="top-header">
    <h2>我写的：</h2>
    <div class="red-circle"></div>
  </div>
  <div class="top-content">
    <div class="top-text">
      我们民族的追梦史充满<br>艰辛。
    </div>
    <div class="child-image-container">
      <div class="child-placeholder">
        <div style="text-align:center;">
          <div style="font-size:90px; line-height:1;">😭</div>
          <div style="width:140px; height:50px; background:#c0392b; border-radius:8px 8px 0 0; margin: 0 auto;"></div>
        </div>
      </div>
      <div class="child-caption">学习使我妈快乐</div>
    </div>
  </div>
</div>

<div class="bottom-section">
  <div class="watermark-bottom">看报的美女纸</div>
  <div class="bottom-header">
    <h2>人民日报写的：</h2>
    <span class="green-check">✓</span>
  </div>
  <div class="bottom-text">
    <p>我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下"有心杀贼，无力回天"的悲愤，付出"春云碧血，秋雨黄花"的牺牲，发出"拼将十万头颅血，须把乾坤力挽回"的呐喊。</p>
  </div>
  <div class="citation">
    ——2013.4.1《筑就民族复兴的"中国梦"》
  </div>
</div>

</body>
</html>
