<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Lion - Story Panels</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', serif;
    background: #f5f0e8;
    max-width: 600px;
    margin: 0 auto;
    padding: 10px;
  }

  .panel {
    position: relative;
    width: 100%;
    margin-bottom: 4px;
    overflow: hidden;
    border-radius: 2px;
  }

  .panel-bg {
    width: 100%;
    height: 200px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .panel-1 .panel-bg {
    height: 260px;
    background: linear-gradient(135deg, #f0e8d8 0%, #e8ddd0 30%, #d4c8b8 60%, #c8b8a8 100%);
  }

  .panel-2 .panel-bg {
    height: 160px;
    background: linear-gradient(135deg, #c8b8a0 0%, #b8a890 50%, #a89880 100%);
  }

  .panel-3 .panel-bg {
    height: 160px;
    background: linear-gradient(135deg, #d8c8a8 0%, #c8b898 40%, #b8a888 100%);
  }

  .panel-4 .panel-bg {
    height: 140px;
    background: linear-gradient(135deg, #e0d0b8 0%, #d0c0a8 50%, #c0b098 100%);
  }

  .panel-5 .panel-bg {
    height: 160px;
    background: linear-gradient(135deg, #c8b8a0 0%, #b8a890 50%, #a89880 100%);
  }

  .illustration-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .figure-mr-mcbee {
    position: absolute;
    top: 0;
    left: 10%;
    width: 55%;
    height: 100%;
    background: linear-gradient(180deg, #f5edd8 0%, #e8dcc8 30%, #d8c8a8 60%, #c8b898 100%);
    border-radius: 50% 50% 0 0;
  }

  .figure-mr-mcbee::before {
    content: '';
    position: absolute;
    top: 5%;
    left: 30%;
    width: 40%;
    height: 20%;
    background: #f0e0c8;
    border-radius: 50%;
  }

  .figure-mr-mcbee::after {
    content: '';
    position: absolute;
    top: 25%;
    left: 20%;
    width: 60%;
    height: 70%;
    background: linear-gradient(180deg, #d4a860 0%, #c89850 50%, #b88840 100%);
    border-radius: 10px 10px 0 0;
  }

  .bowtie {
    position: absolute;
    top: 22%;
    left: 38%;
    width: 24%;
    height: 8%;
    background: #c87830;
    border-radius: 3px;
    z-index: 2;
  }

  .wall {
    position: absolute;
    top: 0;
    right: 0;
    width: 35%;
    height: 100%;
    background: linear-gradient(135deg, #c8a8b8 0%, #b898a8 50%, #a88898 100%);
  }

  .book-placeholder {
    position: absolute;
    bottom: 10%;
    left: 15%;
    width: 50%;
    height: 50%;
    background: linear-gradient(135deg, #e8e0d0 0%, #d8d0c0 100%);
    border-radius: 3px;
    transform: rotate(-5deg);
    box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
  }

  .book-placeholder::after {
    content: 'Library Lion';
    position: absolute;
    top: 30%;
    left: 15%;
    font-size: 11px;
    color: #888;
    font-style: italic;
  }

  .lion-illustration {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #d8c090 0%, #c8b080 30%, #b8a070 60%, #a89060 100%);
  }

  .lion-illustration::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 10%;
    width: 40%;
    height: 60%;
    background: linear-gradient(180deg, #c89840 0%, #b88830 100%);
    border-radius: 50% 50% 30% 30%;
  }

  .catalog-illustration {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #e0d0b0 0%, #d0c0a0 50%, #c0b090 100%);
  }

  .catalog-illustration::before {
    content: '';
    position: absolute;
    top: 20%;
    left: 5%;
    width: 90%;
    height: 60%;
    background: linear-gradient(180deg, #c8a860 0%, #b89850 100%);
    border-radius: 5px;
  }

  .text-overlay {
    position: absolute;
    background: rgba(30, 30, 30, 0.85);
    color: #fff;
    padding: 8px 16px;
    font-size: 16px;
    line-height: 1.4;
    border-radius: 3px;
    white-space: nowrap;
    z-index: 10;
  }

  .text-overlay-wide {
    white-space: normal;
    width: 90%;
    left: 5%;
    text-align: center;
  }

  .chinese-box {
    position: absolute;
    top: 15%;
    right: 5%;
    background: rgba(180, 180, 180, 0.85);
    color: #fff;
    padding: 10px 20px;
    font-size: 22px;
    font-weight: bold;
    border: 2px solid #999;
    border-radius: 3px;
    z-index: 10;
    font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
  }

  .chinese-box::before {
    content: '';
    position: absolute;
    left: -30px;
    top: 50%;
    width: 25px;
    height: 2px;
    background: #999;
  }

  .chinese-box::after {
    content: '';
    position: absolute;
    left: -35px;
    top: calc(50% - 5px);
    width: 10px;
    height: 10px;
    border: 2px solid #999;
    border-radius: 2px;
    background: transparent;
  }

  .panel-1 .text-overlay {
    bottom: 15%;
    left: 10%;
    font-size: 18px;
  }

  .panel-2 .text-overlay {
    top: 30%;
    left: 5%;
    font-size: 16px;
    width: 90%;
    text-align: center;
    white-space: normal;
  }

  .panel-3 .text-overlay {
    top: 40%;
    left: 10%;
    font-size: 22px;
    font-weight: bold;
  }

  .panel-4 .text-overlay {
    top: 35%;
    left: 3%;
    font-size: 15px;
    width: 94%;
    text-align: center;
    white-space: normal;
  }

  .panel-5 .text-overlay {
    bottom: 10%;
    left: 3%;
    font-size: 15px;
    width: 94%;
    text-align: center;
    white-space: normal;
  }

  .person-holding-book {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
  }

  .person-holding-book .head {
    position: absolute;
    top: 0;
    left: 20%;
    width: 30%;
    height: 40%;
    background: linear-gradient(180deg, #d8c0a0 0%, #c8b090 100%);
    border-radius: 50% 50% 40% 40%;
  }

  .person-holding-book .body {
    position: absolute;
    bottom: 0;
    left: 10%;
    width: 50%;
    height: 60%;
    background: linear-gradient(180deg, #a09080 0%, #908070 100%);
    border-radius: 10px 10px 0 0;
  }

  .cabinet-bg {
    position: absolute;
    top: 0;
    right: 0;
    width: 40%;
    height: 100%;
    background: linear-gradient(135deg, #d0c8b8 0%, #c0b8a8 100%);
  }

  .cabinet-bg::before {
    content: '';
    position: absolute;
    top: 20%;
    right: 10%;
    width: 60%;
    height: 15%;
    background: #b8b0a0;
    border-radius: 3px;
    border: 1px solid #a8a090;
  }

  .cabinet-bg::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 10%;
    width: 60%;
    height: 15%;
    background: #b8b0a0;
    border-radius: 3px;
    border: 1px solid #a8a090;
  }

  .sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.6;
  }
</style>
</head>
<body>

<!-- Panel 1: Mr. McBee illustration -->
<div class="panel panel-1">
  <div class="panel-bg">
    <div class="illustration-placeholder">
      <div class="figure-mr-mcbee">
        <div class="bowtie"></div>
      </div>
      <div class="wall"></div>
    </div>
    <div class="chinese-box">故事都非常好</div>
    <div class="text-overlay">"Well, no," said Mr. McBee. "Not really."</div>
  </div>
</div>

<!-- Panel 2: Book being held -->
<div class="panel panel-2">
  <div class="panel-bg">
    <div class="illustration-placeholder">
      <div class="person-holding-book">
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="book-placeholder"></div>
      <div class="cabinet-bg"></div>
    </div>
    <div class="text-overlay">"But there's a lion!" said Mr. McBee. "In the library!"</div>
  </div>
</div>

<!-- Panel 3: Lion sniffing card catalog -->
<div class="panel panel-3">
  <div class="panel-bg">
    <div class="illustration-placeholder">
      <div class="lion-illustration"></div>
    </div>
    <div class="text-overlay">He sniffed the card catalog.</div>
  </div>
</div>

<!-- Panel 4: No rules about lions -->
<div class="panel panel-4">
  <div class="panel-bg">
    <div class="illustration-placeholder">
      <div class="catalog-illustration"></div>
    </div>
    <div class="text-overlay text-overlay-wide">There weren't any rules about lions at story hour, either.</div>
  </div>
</div>

<!-- Panel 5: Children walking away -->
<div class="panel panel-5">
  <div class="panel-bg">
    <div class="illustration-placeholder">
      <div class="person-holding-book">
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="book-placeholder"></div>
      <div class="cabinet-bg"></div>
    </div>
    <div class="text-overlay text-overlay-wide">He waited for another story, but the children began to walk away.</div>
  </div>
</div>

</body>
</html>
