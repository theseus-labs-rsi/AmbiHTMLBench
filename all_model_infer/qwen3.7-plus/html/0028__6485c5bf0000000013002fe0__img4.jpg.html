<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成都自由行美食推荐</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 30px 20px;
            background-color: #f5f0e8;
            font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
            color: #2a2a2a;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            background-color: #faf6ee;
            padding: 30px 25px 40px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            margin: 0 0 8px 0;
            letter-spacing: 4px;
            color: #1a1a1a;
            font-family: 'Noto Serif SC', 'STHeiti', sans-serif;
        }

        .subtitle {
            text-align: center;
            font-size: 20px;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
            color: #1a1a1a;
            font-family: 'Ma Shan Zheng', 'STKaiti', cursive;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin: 25px 0 12px 0;
            padding: 4px 12px;
            background-color: #f5e6a0;
            display: inline-block;
            border-radius: 3px;
            color: #1a1a1a;
            font-family: 'Ma Shan Zheng', 'STKaiti', cursive;
        }

        .section-title-wrapper {
            margin-bottom: 5px;
        }

        .item {
            font-size: 17px;
            margin: 10px 0;
            line-height: 1.8;
            padding-left: 5px;
        }

        .restaurant-name {
            color: #c0392b;
            font-weight: 700;
        }

        .address {
            color: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>成都自由行美食推荐</h1>
        <p class="subtitle">第一次来成都旅游必备手册！</p>

        <div class="section-title-wrapper">
            <div class="section-title">来成都必吃火锅：</div>
        </div>
        <div class="item"><span class="restaurant-name">【楠火锅】</span><span class="address">下东大街166号</span></div>
        <div class="item"><span class="restaurant-name">【天星正源火锅】</span><span class="address">成华区地勘路1号附48</span></div>
        <div class="item"><span class="restaurant-name">【罗二火锅】</span><span class="address">鳌华寺街34号</span></div>
        <div class="item"><span class="restaurant-name">【青年火锅】</span><span class="address">白云街2号附6</span></div>
        <div class="item"><span class="restaurant-name">【五里关老火锅】</span><span class="address">小关庙街45号附12号</span></div>
        <div class="item"><span class="restaurant-name">【巷巷火锅】</span><span class="address">北书院街72号</span></div>

        <div class="section-title-wrapper">
            <div class="section-title">来成都必吃川菜：</div>
        </div>
        <div class="item"><span class="restaurant-name">【明婷饭店】</span><span class="address">外曹家巷26号附15号</span></div>
        <div class="item"><span class="restaurant-name">【回水镇】</span><span class="address">建设路53号附13</span></div>
        <div class="item"><span class="restaurant-name">【陶德砂锅】</span><span class="address">二环路东二段7号附24号</span></div>
        <div class="item"><span class="restaurant-name">【鸡毛店】</span><span class="address">华油路6号</span></div>

        <div class="section-title-wrapper">
            <div class="section-title">来成都必吃小吃：</div>
        </div>
        <div class="item"><span class="restaurant-name">【龙抄手】</span><span class="address">春熙路中山广场东侧城守街63号</span></div>
        <div class="item"><span class="restaurant-name">【钟水饺】</span><span class="address">建设路53号胡同文化音体商场</span></div>
        <div class="item"><span class="restaurant-name">【洞子口陈氏凉粉】</span><span class="address">福德路42号</span></div>
    </div>
</body>
</html>
