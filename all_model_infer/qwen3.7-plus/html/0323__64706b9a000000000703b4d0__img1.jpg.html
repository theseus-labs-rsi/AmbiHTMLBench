<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何避免/减少巴纳姆效应？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fdf6e3;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            color: #222;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .slide-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px 40px 60px;
            position: relative;
            min-height: 100vh;
        }

        /* Badge */
        .badge {
            position: absolute;
            top: 0;
            right: 40px;
            width: 50px;
            height: 70px;
            background-color: #c8a832;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .badge span {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Rainbow arc */
        .rainbow-arc {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 30px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .rainbow-arc svg {
            width: 100%;
            height: 100%;
        }

        /* Title */
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 30px;
            position: relative;
            z-index: 5;
            margin-top: -20px;
        }

        /* Watermark */
        .watermark-center {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 170, 150, 0.3);
            font-size: 16px;
            z-index: 1;
        }

        .watermark-bottom {
            position: absolute;
            bottom: 40px;
            right: 60px;
            color: rgba(180, 170, 150, 0.3);
            font-size: 16px;
            transform: rotate(-15deg);
            z-index: 1;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 5;
        }

        .point {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 18px;
            color: #222;
        }

        .highlight {
            color: #c8a832;
            font-weight: bold;
        }

        .underline-highlight {
            color: #c8a832;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-color: #c8a832;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Badge -->
        <div class="badge">
            <span>心</span>
            <span>理</span>
        </div>

        <!-- Rainbow Arc -->
        <div class="rainbow-arc">
            <svg viewBox="0 0 700 130" preserveAspectRatio="xMidYMax meet">
                <path d="M 30 120 Q 350 -30 670 120" fill="none" stroke="#e8d5b7" stroke-width="14" opacity="0.7"/>
                <path d="M 40 120 Q 350 -20 660 120" fill="none" stroke="#f0c8a0" stroke-width="14" opacity="0.7"/>
                <path d="M 50 120 Q 350 -10 650 120" fill="none" stroke="#d4e8b8" stroke-width="14" opacity="0.7"/>
                <path d="M 60 120 Q 350 0 640 120" fill="none" stroke="#c8d8e8" stroke-width="14" opacity="0.7"/>
                <path d="M 70 120 Q 350 10 630 120" fill="none" stroke="#e0c8d8" stroke-width="14" opacity="0.7"/>
            </svg>
        </div>

        <!-- Title -->
        <h1 class="title">如何避免/减少巴纳姆效应？</h1>

        <!-- Center Watermark -->
        <div class="watermark-center">@L颖</div>

        <!-- Content -->
        <div class="content">
            <p class="point">1、要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。</p>

            <p class="point">2、我们的自我认知往往是主观的，我们需要保持<span class="highlight">谦虚和开放</span>的心态，不要<span class="highlight">过分自信或者自卑</span>。我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。</p>

            <p class="point">3、<span class="underline-highlight">听取他人的评价</span>。全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。</p>

            <p class="point">4、我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要<span class="highlight">学会辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。</p>
        </div>

        <!-- Bottom Watermark -->
        <div class="watermark-bottom">PPT by @</div>
    </div>
</body>
</html>
