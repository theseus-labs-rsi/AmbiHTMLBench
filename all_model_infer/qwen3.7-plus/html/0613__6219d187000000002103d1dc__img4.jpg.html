<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三、直播后 - 数据复盘</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #c8cdd4;
    color: #333;
    min-height: 100vh;
  }
  .slide {
    max-width: 900px;
    margin: 0 auto;
    background: #e8ecf0;
    min-height: 100vh;
    position: relative;
  }
  .header {
    background: #a8b4c4;
    padding: 18px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .header h1 {
    font-size: 32px;
    color: #4a5568;
    font-weight: bold;
    letter-spacing: 4px;
  }
  .header .author {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #6b7a8d;
  }
  .header .author .sub {
    font-size: 11px;
    color: #8a96a3;
    display: block;
    text-align: right;
  }
  .yellow-box {
    background: #f5e6a3;
    padding: 16px 24px;
    margin: 0;
  }
  .yellow-box h2 {
    font-size: 20px;
    color: #333;
    margin-bottom: 6px;
  }
  .yellow-box p {
    font-size: 15px;
    color: #444;
    margin-bottom: 8px;
  }
  .yellow-box ul {
    list-style: disc;
    padding-left: 24px;
    font-size: 15px;
    color: #444;
  }
  .yellow-box ul li {
    margin-bottom: 2px;
  }
  .content-area {
    padding: 30px 20px 40px;
    display: flex;
    align-items: flex-start;
    position: relative;
  }
  .left-label {
    flex-shrink: 0;
    width: 160px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    position: relative;
  }
  .left-label .label-box {
    background: #fff;
    border: 2px solid #333;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 20px;
    font-weight: bold;
    color: #333;
    white-space: nowrap;
  }
  .left-label .connector {
    position: absolute;
    right: -10px;
    top: 50%;
    width: 20px;
    height: 2px;
    background: #333;
  }
  .bracket-container {
    flex: 1;
    position: relative;
    padding-left: 10px;
  }
  .bracket-line {
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 2px;
    background: #333;
  }
  .bracket-line::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 12px;
    height: 2px;
    background: #333;
  }
  .bracket-line::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 12px;
    height: 2px;
    background: #333;
  }
  .items {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-left: 12px;
  }
  .item {
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
  }
  .item::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    width: 12px;
    height: 2px;
    background: #333;
  }
  .desc-box {
    background: #3b5998;
    color: #fff;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1.6;
    max-width: 520px;
  }
  .label-box-item {
    background: #e8ecf4;
    border: 2px dashed #3b5998;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    max-width: 520px;
  }
  .label-box-item span {
    font-size: 20px;
  }
  .footer-bar {
    background: #a8b4c4;
    height: 40px;
    margin-top: auto;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <h1>三、直播后</h1>
    <div class="author">
      @自律的营销学姐Renita
      <span class="sub">From 小红书</span>
    </div>
  </div>

  <div class="yellow-box">
    <h2>2、数据复盘</h2>
    <p>进行直播数据复盘的时候，重点关注4个关键数据：</p>
    <ul>
      <li>人气峰值和平均在线</li>
      <li>观众平均停留时长</li>
      <li>带货转化率</li>
      <li>UV价值</li>
    </ul>
  </div>

  <div class="content-area">
    <div class="left-label">
      <div class="label-box">2、数据复盘</div>
      <div class="connector"></div>
    </div>
    <div class="bracket-container">
      <div class="bracket-line"></div>
      <div class="items">
        <div class="item">
          <div class="desc-box">一般平均在线能稳定在50人左右直播就有基本的带货能力，能够赚到钱</div>
          <div class="label-box-item"><span></span> 人气峰值和平均在线人数</div>
        </div>
        <div class="item">
          <div class="desc-box">通常停留时长超过2分钟算不错的数据，超过30s是一个及格线</div>
          <div class="label-box-item"><span></span> 观众平均停留时长</div>
        </div>
        <div class="item">
          <div class="desc-box">一般带货转化率达到1%以上算合格，优秀的3%以上</div>
          <div class="label-box-item"><span>③</span> 带货转化率</div>
        </div>
        <div class="item">
          <div class="desc-box">单个用户给直播间贡献的价值，这个数值越高，说明用户在这个直播间的付费意愿更强</div>
          <div class="label-box-item"><span>④</span> UV价值</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-bar"></div>
</div>
</body>
</html>
