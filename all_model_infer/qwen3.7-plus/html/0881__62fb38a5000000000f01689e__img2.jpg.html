<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疑惑点三 赛场上如何发挥</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #c8e6a0;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .page {
    background: #fff;
    max-width: 680px;
    width: 100%;
    padding: 30px 35px 40px;
    border-radius: 8px;
    position: relative;
  }
  .header {
    display: flex;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .flower-icon {
    width: 100px;
    height: 110px;
    flex-shrink: 0;
    margin-right: 10px;
    position: relative;
  }
  .flower-icon svg {
    width: 100%;
    height: 100%;
  }
  .title-area {
    flex: 1;
    text-align: center;
    padding-top: 5px;
    position: relative;
  }
  .title-area h1 {
    font-size: 32px;
    font-weight: 900;
    color: #1a1a1a;
    line-height: 1.3;
    letter-spacing: 2px;
  }
  .title-area h1 .highlight {
    background: linear-gradient(180deg, #a8f0a8 0%, #7de87d 100%);
    padding: 2px 12px;
    border-radius: 6px;
    display: inline-block;
  }
  .reg-mark {
    position: absolute;
    top: 0;
    right: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    border: 2px solid #333;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .intro-text {
    font-size: 18px;
    font-weight: bold;
    color: #5a7a3a;
    margin-bottom: 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.05);
  }
  .intro-sub {
    font-size: 18px;
    font-weight: bold;
    color: #5a7a3a;
    margin-bottom: 12px;
  }
  .item {
    margin-bottom: 16px;
  }
  .item-header {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
  }
  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #4a90d9;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    width: 24px;
    height: 24px;
    border-radius: 4px;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .item-title {
    font-size: 18px;
    font-weight: bold;
    color: #5a7a3a;
  }
  .item-content {
    font-size: 17px;
    font-weight: bold;
    color: #6a8a4a;
    padding-left: 32px;
    line-height: 1.6;
  }
  .item-content .red-text {
    color: #d44;
  }
  .item-content .red-x {
    color: #d44;
    font-weight: 900;
    font-size: 20px;
  }
  .sub-item {
    padding-left: 32px;
    font-size: 17px;
    font-weight: bold;
    color: #6a8a4a;
    line-height: 1.7;
  }
  .sub-item .emoji-icon {
    margin-right: 4px;
  }
  .warning-line {
    padding-left: 32px;
    font-size: 17px;
    font-weight: bold;
    color: #6a8a4a;
    line-height: 1.8;
  }
  .emoji {
    font-size: 18px;
  }
  .lock-emoji {
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="flower-icon">
      <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <!-- Stem -->
        <rect x="42" y="60" width="16" height="40" rx="6" fill="#5cb85c"/>
        <!-- Left leg -->
        <rect x="22" y="85" width="22" height="18" rx="8" fill="#5cb85c" transform="rotate(-15 33 94)"/>
        <!-- Right leg -->
        <rect x="56" y="85" width="22" height="18" rx="8" fill="#5cb85c" transform="rotate(15 67 94)"/>
        <!-- Petals -->
        <ellipse cx="50" cy="22" rx="18" ry="20" fill="#e85d5d"/>
        <ellipse cx="28" cy="35" rx="18" ry="16" fill="#e85d5d" transform="rotate(-30 28 35)"/>
        <ellipse cx="72" cy="35" rx="18" ry="16" fill="#e85d5d" transform="rotate(30 72 35)"/>
        <ellipse cx="35" cy="18" rx="16" ry="14" fill="#f07070" transform="rotate(-20 35 18)"/>
        <ellipse cx="65" cy="18" rx="16" ry="14" fill="#f07070" transform="rotate(20 65 18)"/>
        <!-- Face -->
        <circle cx="42" cy="30" r="2.5" fill="#333"/>
        <circle cx="58" cy="30" r="2.5" fill="#333"/>
        <path d="M44 38 Q50 42 56 38" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- Cheeks -->
        <circle cx="36" cy="36" r="4" fill="#f9a0a0" opacity="0.6"/>
        <circle cx="64" cy="36" r="4" fill="#f9a0a0" opacity="0.6"/>
      </svg>
    </div>
    <div class="title-area">
      <div class="reg-mark">®</div>
      <h1>疑惑点三<br><span class="highlight">赛场上如何发挥</span></h1>
    </div>
  </div>

  <div class="intro-text">最快上手辩论方式：打一场堂堂正正的辩论赛</div>
  <div class="intro-sub">注意点：</div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">1</span>
      <span class="item-title">咬字清晰，表达流畅，保持头脑清醒😊</span>
    </div>
    <div class="item-content">
      输出观点注意<span class="red-text">‼️</span>重音/停顿/起伏/气势
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">2</span>
      <span class="item-title">笔不能停，记关键词📝</span>
    </div>
    <div class="item-content">
      用不同颜色的笔画框标注⭕
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">3</span>
      <span class="item-title">反驳思维（挖掘机）</span>
    </div>
    <div class="item-content">
      挖前提、拆前提；拆逻辑关系；拆数据、削弱效力；
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">4</span>
      <span class="item-title">推论思维（推土机）</span>
    </div>
    <div class="item-content">
      重申+延伸论点；举出不同论据；铺陈结辩价值；
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">5</span>
      <span class="item-title">战场意识</span>
    </div>
    <div class="sub-item">
      <span class="emoji-icon"></span>不恋战（不要为了反驳而反驳但是已经离题）
    </div>
    <div class="sub-item">
      <span class="emoji-icon">🙅</span>不作死（进攻有利战场和充分准备的战场）
    </div>
    <div class="sub-item">
      <span class="emoji-icon"></span>不侥幸（不要刻意回避不利战场，也要充足准备）
    </div>
    <div class="warning-line">
      漫无目的的反驳<span class="red-x"></span>毫无结局的追究<span class="red-x">✕</span>突如其来的攻击<span class="red-x">✕</span>
    </div>
  </div>

  <div class="item">
    <div class="item-header">
      <span class="num-badge">6</span>
      <span class="item-title">小结意识<span class="lock-emoji">🔒</span></span>
    </div>
    <div class="item-content">
      说给评委听，结束已经攻下的战场
    </div>
  </div>
</div>
</body>
</html>
