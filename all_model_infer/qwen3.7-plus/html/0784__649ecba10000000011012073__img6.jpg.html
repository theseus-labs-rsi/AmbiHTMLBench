<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城 - 李白</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #4a5a7a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "STSong", "SimSun", "Songti SC", serif;
  }

  .main-content {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 60px 80px 40px 40px;
    gap: 0;
    position: relative;
  }

  .poem-container {
    display: flex;
    flex-direction: row-reverse;
    gap: 30px;
    align-items: flex-start;
  }

  .poem-line {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 42px;
    color: #2a3a5a;
    letter-spacing: 12px;
    line-height: 1.6;
    font-weight: bold;
  }

  .poem-line.small {
    font-size: 32px;
    color: #e8e8e8;
    letter-spacing: 10px;
  }

  .author-info {
    position: absolute;
    left: 40px;
    top: 80px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    color: #c8c8c8;
    font-size: 16px;
    letter-spacing: 8px;
    line-height: 2;
  }

  .author-info .dynasty {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .author-info .name {
    font-size: 16px;
  }

  .author-info .title {
    font-size: 14px;
    margin-top: 10px;
  }

  .footer-bar {
    background-color: #f5f0e0;
    padding: 18px 40px;
    text-align: center;
    font-size: 15px;
    color: #333;
    letter-spacing: 2px;
    font-family: "STSong", "SimSun", "Songti SC", serif;
  }

  .poem-section {
    display: flex;
    flex-direction: row-reverse;
    gap: 20px;
  }

  .poem-section .line {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 38px;
    color: #e0e0e0;
    letter-spacing: 10px;
    line-height: 1.5;
  }

  .poem-large {
    display: flex;
    flex-direction: row-reverse;
    gap: 25px;
  }

  .poem-large .line {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 44px;
    color: #2e3e5e;
    letter-spacing: 14px;
    line-height: 1.5;
    font-weight: bold;
  }

  .poem-small {
    display: flex;
    flex-direction: row-reverse;
    gap: 20px;
    margin-right: 60px;
  }

  .poem-small .line {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 34px;
    color: #e8e8e8;
    letter-spacing: 10px;
    line-height: 1.5;
  }

  .left-info {
    position: absolute;
    left: 50px;
    top: 90px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    color: #b0b8c8;
    font-size: 15px;
    letter-spacing: 6px;
    line-height: 2.2;
  }
</style>
</head>
<body>

<div class="main-content">

  <div class="left-info">
    <span class="dynasty">唐</span>
    <span class="name">李白</span>
    <span class="title">早发白帝城</span>
  </div>

  <div class="poem-small">
    <div class="line">轻舟已过万重山。</div>
    <div class="line">两岸猿声啼不住，</div>
  </div>

  <div class="poem-large">
    <div class="line">千里江陵一日還</div>
    <div class="line">朝辭白帝彩雲間</div>
  </div>

</div>

<div class="footer-bar">
  两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。
</div>

</body>
</html>
