<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Screenshot</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 10px;
    max-width: 420px;
    margin: 0 auto;
  }

  .chat-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 10px 0;
  }

  .message-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .message-row.right {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 4px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #7ba7c4 0%, #a8c8d8 40%, #6b9ab5 60%, #4a7a95 100%);
    overflow: hidden;
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(to top, #3a6a85, transparent);
  }

  .avatar.right-avatar {
    background: linear-gradient(135deg, #c4a87b 0%, #d8c0a0 40%, #b59a6b 60%, #957a4a 100%);
  }

  .bubble {
    background: #fff;
    border-radius: 6px;
    padding: 12px 14px;
    max-width: 300px;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 12px;
    width: 0;
    height: 0;
    border-style: solid;
  }

  .message-row:not(.right) .bubble::before {
    left: -8px;
    border-width: 6px 8px 6px 0;
    border-color: transparent #fff transparent transparent;
  }

  .message-row.right .bubble::before {
    right: -8px;
    border-width: 6px 0 6px 8px;
    border-color: transparent transparent transparent #95ec69;
  }

  .bubble.green {
    background: #95ec69;
  }

  .bubble-text {
    color: #333;
    word-break: break-word;
  }

  .number-badge {
    display: inline-block;
    background: #7a9bb5;
    color: #fff;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 3px;
    font-size: 13px;
    font-weight: bold;
    margin-right: 4px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="chat-container">

  <div class="message-row">
    <div class="avatar"></div>
    <div class="bubble">
      <div class="bubble-text">
        <span class="number-badge">6</span> 这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。
      </div>
    </div>
  </div>

  <div class="message-row">
    <div class="avatar"></div>
    <div class="bubble">
      <div class="bubble-text">
        <span class="number-badge">7</span> 最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰
      </div>
    </div>
  </div>

  <div class="message-row">
    <div class="avatar"></div>
    <div class="bubble">
      <div class="bubble-text">
        <span class="number-badge">8</span> 尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。
      </div>
    </div>
  </div>

  <div class="message-row">
    <div class="avatar"></div>
    <div class="bubble">
      <div class="bubble-text">
        你重新写吧
      </div>
    </div>
  </div>

  <div class="message-row right">
    <div class="avatar right-avatar"></div>
    <div class="bubble green">
      <div class="bubble-text">
        好的，谢谢老师
      </div>
    </div>
  </div>

</div>

</body>
</html>
