<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fdf5f0;
            font-family: "SimSun", "STSong", "Songti SC", serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #e8873a;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .columns {
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .column span {
            font-size: 22px;
            color: #333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>国家名</h1>
        <div class="columns">
            <div class="column">
                <span>弘昼国</span>
                <span>安平国</span>
                <span>苍狼国</span>
                <span>黑鹰国</span>
                <span>古木国</span>
                <span>临越国</span>
                <span>临月国</span>
                <span>逸水国</span>
                <span>飞虎国</span>
                <span>静月国</span>
                <span>火凤国</span>
                <span>长风国</span>
                <span>凤临国</span>
            </div>
            <div class="column">
                <span>金鹏国</span>
                <span>玄龙国</span>
                <span>夜莲国</span>
                <span>北冥国</span>
                <span>绮霞国</span>
                <span>银霜国</span>
                <span>轩辕国</span>
                <span>真北国</span>
                <span>碧潭国</span>
                <span>青果国</span>
                <span>鸿熙国</span>
                <span>阳明国</span>
                <span>落霞国</span>
            </div>
        </div>
    </div>
</body>
</html>
