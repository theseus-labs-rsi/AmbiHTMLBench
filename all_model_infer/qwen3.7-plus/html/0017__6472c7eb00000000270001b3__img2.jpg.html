<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Product Review</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background-color: #f5f3f0;
    color: #333;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    line-height: 1.8;
  }

  .lamp-placeholder {
    width: 180px;
    height: 120px;
    background: linear-gradient(135deg, #d4c5a9 0%, #c9b896 50%, #bfae88 100%);
    border-radius: 50% 50% 10px 10px;
    margin-bottom: 30px;
    position: relative;
  }

  .lamp-placeholder::before {
    content: '';
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 50px;
    background: linear-gradient(to bottom, #fff 0%, #f0ece4 100%);
    border-radius: 5px 5px 0 0;
  }

  .lamp-placeholder::after {
    content: '[Lamp: top-left]';
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #888;
  }

  .section-timage {
    display: flex;
    align-items: flex-start;
    margin-bottom: 20px;
    gap: 20px;
  }

  .brand-block {
    flex-shrink: 0;
    min-width: 140px;
  }

  .brand-name {
    font-size: 22px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 2px;
    color: #222;
  }

  .brand-subtitle {
    font-size: 15px;
    color: #444;
    margin-top: 4px;
    padding-left: 10px;
    border-left: 2px solid #333;
  }

  .description-text {
    flex: 1;
    font-size: 14px;
    line-height: 2;
    color: #444;
  }

  .products-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 30px 0;
    flex-wrap: wrap;
  }

  .product-compact {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .product-tube {
    position: relative;
    width: 200px;
    height: 220px;
  }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8e4df;
    border-radius: 12px;
    color: #999;
    font-size: 12px;
  }

  .compact-img {
    width: 200px;
    height: 200px;
    background: linear-gradient(145deg, #c9a87c, #a07840, #8b6530);
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .compact-img::after {
    content: '[Compact Highlighter]';
    font-size: 11px;
    color: #fff;
  }

  .tube-img {
    width: 160px;
    height: 200px;
    background: linear-gradient(180deg, #f5f0e8, #e8ddd0);
    border-radius: 8px 8px 20px 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-15deg);
  }

  .tube-img::after {
    content: '[Tube Foundation]';
    font-size: 11px;
    color: #999;
  }

  .circle-inset {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #e0dcd6;
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #888;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .circle-inset-left {
    top: 10px;
    left: -30px;
  }

  .circle-inset-right {
    bottom: 10px;
    right: -30px;
  }

  .watermark {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    margin: 10px 0;
  }

  .section-foundation {
    margin-top: 30px;
  }

  .foundation-title {
    font-size: 20px;
    font-weight: 900;
    color: #222;
    margin-bottom: 15px;
  }

  .foundation-text {
    font-size: 14px;
    line-height: 2;
    color: #444;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: #ddd;
    margin: 20px 0;
  }
</style>
</head>
<body>

<div class="lamp-placeholder"></div>

<div class="section-timage">
  <div class="brand-block">
    <div class="brand-name">TIMAGE</div>
    <div class="brand-subtitle">｜双拼高光</div>
  </div>
  <div class="description-text">
    基本每天都在用，挺实用的粉＋膏的双拼组合<br>
    两个质地都轻薄又细腻，不用担心妆感重<br>
    高光膏是奶油质地，滋润服帖，提亮泪沟或者面中<br>
    高光粉可以提亮鼻梁 鼻头等，妈生立体感<br>
    清透粉感不重，一个神仙单品
  </div>
</div>

<div class="products-row">
  <div class="product-compact">
    <div class="circle-inset circle-inset-left">[Swatch close-up]</div>
    <div class="compact-img"></div>
  </div>
  <div class="product-tube">
    <div class="tube-img"></div>
    <div class="circle-inset circle-inset-right">[Texture close-up]</div>
  </div>
</div>

<div class="watermark">@秋小姐 ｜ 小红书</div>

<div class="divider"></div>

<div class="section-foundation">
  <div class="foundation-title">恋爱魔镜粉霜</div>
  <div class="foundation-text">
    坠白的00我都觉得不白，唯一的缺点了，希望出个白一点的色号呀！<br>
    可以用提亮粉饼来拯救，我用的e大饼~自然细腻的奶油肌妆感<br>
    给人天生好底子的感觉，妆效挺自然的，百元粉霜里的三好学生
  </div>
</div>

</body>
</html>
