<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loneliness Quote</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #2a2240;
    color: #c9b88a;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .container {
    max-width: 600px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    margin-bottom: 50px;
    position: relative;
    width: 180px;
    height: 180px;
  }

  .logo svg {
    width: 100%;
    height: 100%;
  }

  .english-quote {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
    font-size: 15px;
    line-height: 1.8;
    color: #c9b88a;
    max-width: 520px;
  }

  .star {
    font-size: 22px;
    color: #c9b88a;
    flex-shrink: 0;
  }

  .english-text {
    text-align: center;
  }

  .chinese-quote {
    font-size: 26px;
    line-height: 2;
    color: #c9b88a;
    letter-spacing: 2px;
    max-width: 480px;
  }

  .chinese-quote .open-quote,
  .chinese-quote .close-quote {
    font-size: 28px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="logo">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Semi-circular arc with tick marks -->
      <path d="M 40 110 A 80 80 0 0 1 160 110" fill="none" stroke="#c9b88a" stroke-width="1.5" opacity="0.6"/>
      <path d="M 45 108 A 75 75 0 0 1 155 108" fill="none" stroke="#c9b88a" stroke-width="1" opacity="0.4"/>

      <!-- Tick marks on arc -->
      <line x1="55" y1="95" x2="60" y2="88" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="70" y1="78" x2="73" y2="70" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="88" y1="65" x2="90" y2="57" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="100" y1="60" x2="100" y2="52" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="112" y1="65" x2="110" y2="57" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="130" y1="78" x2="127" y2="70" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>
      <line x1="145" y1="95" x2="140" y2="88" stroke="#c9b88a" stroke-width="1.2" opacity="0.7"/>

      <!-- Diamond shape -->
      <polygon points="100,35 165,100 100,165 35,100" fill="none" stroke="#c9b88a" stroke-width="1.5"/>
      <polygon points="100,42 158,100 100,158 42,100" fill="none" stroke="#c9b88a" stroke-width="0.8" opacity="0.5"/>

      <!-- Female symbol -->
      <circle cx="100" cy="92" r="16" fill="none" stroke="#c9b88a" stroke-width="1.5"/>
      <line x1="100" y1="108" x2="100" y2="128" stroke="#c9b88a" stroke-width="1.5"/>
      <line x1="92" y1="118" x2="108" y2="118" stroke="#c9b88a" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="english-quote">
    <span class="star">✦</span>
    <span class="english-text">I think the so-called loneliness refers to the person you are facing,<br>whose emotions are not on the same frequency as your own.</span>
    <span class="star">✦</span>
  </div>

  <div class="chinese-quote">
    <span class="open-quote">"</span> 我想所谓孤独，<br>
    就是你面对的那个人，<br>
    他的情绪和你自己的情绪，<br>
    不在同一个频率。<span class="close-quote">"</span>
  </div>

</div>
</body>
</html>
