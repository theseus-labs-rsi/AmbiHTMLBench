<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际博物馆日 - International Museum Day 2021</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #e8e4df;
    font-family: 'Noto Serif SC', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .poster {
    width: 700px;
    height: 980px;
    background: linear-gradient(135deg, #d4cfc7 0%, #e0dbd3 30%, #d8d3cb 60%, #ccc7bf 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  /* Decorative cloud patterns */
  .cloud-pattern {
    position: absolute;
    opacity: 0.15;
    font-size: 120px;
    color: #8a8070;
    pointer-events: none;
  }

  .cloud-tl {
    top: -20px;
    left: -30px;
    font-size: 180px;
  }

  .cloud-tr {
    top: -10px;
    right: -20px;
    font-size: 160px;
  }

  .cloud-bl {
    bottom: 100px;
    left: -40px;
    font-size: 140px;
  }

  .cloud-br {
    bottom: 80px;
    right: -30px;
    font-size: 150px;
  }

  /* Header area */
  .header {
    position: relative;
    z-index: 2;
    padding: 30px 30px 10px 30px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .title-group {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .main-title {
    font-size: 72px;
    font-weight: 900;
    color: #1a3a2a;
    line-height: 1.1;
    letter-spacing: 4px;
  }

  .main-title .line1 {
    display: block;
  }

  .main-title .line2 {
    display: block;
  }

  .english-title {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    color: #3a3a3a;
    margin-top: 8px;
    line-height: 1.4;
  }

  .seal {
    width: 44px;
    height: 44px;
    background: #c0392b;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    border-radius: 4px;
    margin-top: 10px;
    margin-left: 5px;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
  }

  .top-right-text {
    position: absolute;
    top: 20px;
    right: 30px;
    writing-mode: vertical-rl;
    font-size: 18px;
    color: #2a2a2a;
    letter-spacing: 6px;
    z-index: 2;
  }

  .top-right-text .sub {
    font-size: 14px;
    margin-right: 12px;
    color: #555;
  }

  /* Main content area */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    padding: 10px 20px;
    height: 700px;
  }

  .left-column {
    width: 140px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-top: 20px;
  }

  .date-block {
    margin-bottom: 30px;
  }

  .date-label {
    font-size: 22px;
    font-weight: 700;
    color: #1a3a2a;
    margin-bottom: 5px;
  }

  .date-label::before {
    content: '●';
    font-size: 10px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .date-year {
    font-size: 28px;
    font-weight: 700;
    color: #1a3a2a;
  }

  .date-month-day {
    font-size: 48px;
    font-weight: 900;
    color: #1a3a2a;
    line-height: 1;
  }

  .date-month-day .month {
    font-size: 36px;
  }

  .date-month-day .day {
    font-size: 48px;
  }

  .date-separator {
    font-size: 24px;
    color: #1a3a2a;
  }

  .slogan-vertical {
    writing-mode: vertical-rl;
    font-size: 16px;
    color: #3a3a3a;
    letter-spacing: 8px;
    line-height: 2;
    margin-top: 10px;
  }

  .small-vessel {
    width: 50px;
    height: 70px;
    background: #5a6a5a;
    border-radius: 4px;
    margin-top: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #aaa;
  }

  .center-column {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .vessel-image {
    width: 320px;
    height: 580px;
    background: linear-gradient(180deg, #4a5a4a 0%, #3a4a3a 20%, #2a3a2a 40%, #3a4a3a 60%, #4a5a4a 80%, #3a3a2a 100%);
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .vessel-image::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(ellipse at 50% 30%, rgba(100,120,100,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 60%, rgba(80,100,80,0.2) 0%, transparent 50%);
    border-radius: 8px;
  }

  .vessel-top {
    width: 180px;
    height: 40px;
    background: linear-gradient(180deg, #5a6a5a, #4a5a4a);
    border-radius: 4px 4px 0 0;
    position: relative;
    z-index: 1;
  }

  .vessel-neck {
    width: 200px;
    height: 120px;
    background: linear-gradient(180deg, #4a5a4a, #3a4a3a);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vessel-neck-pattern {
    width: 160px;
    height: 80px;
    border: 2px solid rgba(100,120,100,0.5);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(150,170,150,0.6);
  }

  .vessel-handles {
    width: 260px;
    height: 60px;
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .handle {
    width: 40px;
    height: 50px;
    background: #4a5a4a;
    border-radius: 50% 50% 0 0;
  }

  .vessel-body {
    width: 280px;
    height: 220px;
    background: linear-gradient(180deg, #3a4a3a, #2a3a2a, #3a4a3a);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0 0 20px 20px;
  }

  .vessel-body-pattern {
    width: 220px;
    height: 160px;
    border: 2px solid rgba(100,120,100,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: rgba(150,170,150,0.5);
  }

  .vessel-base {
    width: 200px;
    height: 30px;
    background: linear-gradient(180deg, #3a3a2a, #2a2a1a);
    border-radius: 0 0 8px 8px;
    position: relative;
    z-index: 1;
  }

  .vessel-caption {
    position: absolute;
    bottom: -25px;
    font-size: 11px;
    color: #888;
    text-align: center;
    width: 100%;
  }

  .right-column {
    width: 160px;
    flex-shrink: 0;
    padding-top: 20px;
  }

  .info-text {
    font-size: 11px;
    color: #4a4a4a;
    line-height: 1.8;
    text-align: justify;
    writing-mode: vertical-rl;
    height: 500px;
    letter-spacing: 1px;
  }

  /* Bottom area */
  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    padding: 20px 30px 30px 30px;
  }

  .bottom-left {
    text-align: left;
  }

  .bottom-left .text1 {
    font-size: 16px;
    color: #2a2a2a;
    margin-bottom: 4px;
  }

  .bottom-left .text2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 2px;
  }

  .bottom-left .text3 {
    font-size: 16px;
    color: #2a2a2a;
  }

  .bottom-right {
    text-align: right;
  }

  .bottom-right .text1 {
    font-size: 16px;
    color: #2a2a2a;
    margin-bottom: 4px;
  }

  .bottom-right .text2 {
    font-size: 22px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 2px;
  }

  .bottom-right .text3 {
    font-size: 16px;
    color: #2a2a2a;
  }

  /* Dot decorations */
  .dot {
    width: 8px;
    height: 8px;
    background: #1a3a2a;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-small {
    width: 5px;
    height: 5px;
    background: #1a3a2a;
    border-radius: 50%;
    display: inline-block;
  }

  /* SVG vessel placeholder */
  .vessel-svg-container {
    width: 340px;
    height: 600px;
    position: relative;
  }

  .vessel-svg-container svg {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Decorative cloud patterns -->
  <div class="cloud-pattern cloud-tl">☁</div>
  <div class="cloud-pattern cloud-tr">☁</div>
  <div class="cloud-pattern cloud-bl">☁</div>
  <div class="cloud-pattern cloud-br">☁</div>

  <!-- Top right vertical text -->
  <div class="top-right-text">
    <span class="sub">追梦今古</span>
    <span>穿越千古</span>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="title-group">
      <div class="main-title">
        <span class="line1">国际</span>
        <span class="line2">博物馆日</span>
      </div>
      <div>
        <div class="english-title">International<br>Museum<br>Day</div>
      </div>
      <div class="seal">重塑</div>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">
    <!-- Left column -->
    <div class="left-column">
      <div class="date-block">
        <div class="date-label">时间:</div>
        <div class="date-year">2021</div>
        <div class="date-month-day">
          <span class="month">5</span><span class="date-separator">/</span><span class="day">18</span>
        </div>
      </div>

      <div class="slogan-vertical">
        一两处文物<br>处处情怀
      </div>

      <div style="margin-top: 40px;">
        <div class="small-vessel placeholder">
          [小文物图]
        </div>
      </div>

      <div style="margin-top: 20px;">
        <span class="dot"></span>
      </div>
    </div>

    <!-- Center column - vessel image -->
    <div class="center-column">
      <div class="vessel-svg-container">
        <svg viewBox="0 0 340 600" xmlns="http://www.w3.org/2000/svg">
          <!-- Vessel body -->
          <defs>
            <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5a6e5a"/>
              <stop offset="30%" stop-color="#3d5240"/>
              <stop offset="60%" stop-color="#2d4030"/>
              <stop offset="100%" stop-color="#1a2e1e"/>
            </linearGradient>
            <linearGradient id="bronze2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4a5e4a"/>
              <stop offset="50%" stop-color="#2d4030"/>
              <stop offset="100%" stop-color="#1a2e1e"/>
            </linearGradient>
            <radialGradient id="patina" cx="50%" cy="40%">
              <stop offset="0%" stop-color="#6a8060" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#2d4030" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Rim/top -->
          <rect x="110" y="10" width="120" height="25" rx="3" fill="url(#bronze)" stroke="#1a2e1e" stroke-width="1"/>
          <rect x="105" y="30" width="130" height="15" rx="2" fill="url(#bronze2)" stroke="#1a2e1e" stroke-width="1"/>

          <!-- Neck -->
          <rect x="100" y="45" width="140" height="80" rx="4" fill="url(#bronze2)" stroke="#1a2e1e" stroke-width="1"/>
          <!-- Neck decoration band -->
          <rect x="105" y="55" width="130" height="12" rx="2" fill="#3a5040" stroke="#2a4030" stroke-width="0.5"/>
          <rect x="105" y="75" width="130" height="12" rx="2" fill="#3a5040" stroke="#2a4030" stroke-width="0.5"/>
          <rect x="105" y="95" width="130" height="12" rx="2" fill="#3a5040" stroke="#2a4030" stroke-width="0.5"/>
          <!-- Taotie pattern on neck -->
          <ellipse cx="170" cy="100" rx="30" ry="15" fill="none" stroke="#4a6050" stroke-width="1.5"/>
          <circle cx="155" cy="97" r="4" fill="#4a6050"/>
          <circle cx="185" cy="97" r="4" fill="#4a6050"/>

          <!-- Shoulder area with handles -->
          <path d="M 95 125 Q 90 140 95 160 L 245 160 Q 250 140 245 125 Z" fill="url(#bronze2)" stroke="#1a2e1e" stroke-width="1"/>

          <!-- Left handle/dragon -->
          <path d="M 95 130 Q 60 120 55 140 Q 50 160 70 170 Q 80 175 95 165" fill="url(#bronze)" stroke="#1a2e1e" stroke-width="1.5"/>
          <circle cx="62" cy="135" r="5" fill="#3a5040" stroke="#2a4030" stroke-width="1"/>
          <path d="M 55 130 Q 50 125 55 120" fill="none" stroke="#2a4030" stroke-width="1.5"/>

          <!-- Right handle/dragon -->
          <path d="M 245 130 Q 280 120 285 140 Q 290 160 270 170 Q 260 175 245 165" fill="url(#bronze)" stroke="#1a2e1e" stroke-width="1.5"/>
          <circle cx="278" cy="135" r="5" fill="#3a5040" stroke="#2a4030" stroke-width="1"/>
          <path d="M 285 130 Q 290 125 285 120" fill="none" stroke="#2a4030" stroke-width="1.5"/>

          <!-- Ring handles -->
          <ellipse cx="72" cy="175" rx="12" ry="18" fill="none" stroke="#3a5040" stroke-width="3"/>
          <ellipse cx="268" cy="175" rx="12" ry="18" fill="none" stroke="#3a5040" stroke-width="3"/>

          <!-- Main body -->
          <path d="M 95 160 Q 80 200 75 280 Q 70 360 80 420 Q 90 470 110 490 L 230 490 Q 250 470 260 420 Q 270 360 265 280 Q 260 200 245 160 Z" fill="url(#bronze2)" stroke="#1a2e1e" stroke-width="1.5"/>

          <!-- Body decoration - upper band -->
          <path d="M 100 170 Q 170 165 240 170" fill="none" stroke="#4a6050" stroke-width="2"/>
          <path d="M 98 185 Q 170 180 242 185" fill="none" stroke="#4a6050" stroke-width="2"/>

          <!-- Taotie face on body -->
          <ellipse cx="170" cy="230" rx="50" ry="35" fill="none" stroke="#4a6050" stroke-width="2"/>
          <circle cx="148" cy="222" r="8" fill="#3a5040" stroke="#2a4030" stroke-width="1.5"/>
          <circle cx="192" cy="222" r="8" fill="#3a5040" stroke="#2a4030" stroke-width="1.5"/>
          <circle cx="148" cy="222" r="3" fill="#1a2e1e"/>
          <circle cx="192" cy="222" r="3" fill="#1a2e1e"/>
          <path d="M 155 240 Q 170 250 185 240" fill="none" stroke="#4a6050" stroke-width="2"/>
          <path d="M 160 245 L 170 255 L 180 245" fill="none" stroke="#4a6050" stroke-width="1.5"/>

          <!-- Spiral/cloud patterns on body -->
          <path d="M 110 280 Q 120 260 140 270 Q 150 280 140 295 Q 130 305 115 295" fill="none" stroke="#4a6050" stroke-width="1.5"/>
          <path d="M 230 280 Q 220 260 200 270 Q 190 280 200 295 Q 210 305 225 295" fill="none" stroke="#4a6050" stroke-width="1.5"/>

          <!-- Lower body decoration -->
          <path d="M 100 320 Q 170 310 240 320" fill="none" stroke="#4a6050" stroke-width="2"/>

          <!-- Large spiral patterns -->
          <path d="M 120 350 C 100 330, 100 370, 130 370 C 150 370, 150 340, 130 340" fill="none" stroke="#4a6050" stroke-width="2"/>
          <path d="M 220 350 C 240 330, 240 370, 210 370 C 190 370, 190 340, 210 340" fill="none" stroke="#4a6050" stroke-width="2"/>

          <!-- Center face on lower body -->
          <ellipse cx="170" cy="380" rx="35" ry="25" fill="none" stroke="#4a6050" stroke-width="1.5"/>
          <circle cx="157" cy="375" r="5" fill="#3a5040"/>
          <circle cx="183" cy="375" r="5" fill="#3a5040"/>
          <path d="M 162 390 Q 170 395 178 390" fill="none" stroke="#4a6050" stroke-width="1.5"/>

          <!-- Bottom section -->
          <path d="M 110 490 L 100 520 Q 100 540 120 545 L 220 545 Q 240 540 240 520 L 230 490 Z" fill="url(#bronze)" stroke="#1a2e1e" stroke-width="1.5"/>

          <!-- Base -->
          <rect x="115" y="545" width="110" height="20" rx="3" fill="#1a2e1e" stroke="#0a1a0e" stroke-width="1"/>
          <rect x="120" y="565" width="100" height="15" rx="2" fill="#2a3a2a" stroke="#1a2e1e" stroke-width="1"/>

          <!-- Patina overlay -->
          <ellipse cx="170" cy="300" rx="100" ry="200" fill="url(#patina)"/>

          <!-- Highlight -->
          <path d="M 130 200 Q 140 300 135 400" fill="none" stroke="rgba(150,180,150,0.15)" stroke-width="8"/>
        </svg>
      </div>
    </div>

    <!-- Right column -->
    <div class="right-column">
      <div class="info-text">
        国际博物馆日由国际博物馆协会（ICOM）发起并创立的。1977年国际博物馆协会为促进全球博物馆事业的健康发展，吸引全社会公众对博物馆事业的了解、参与和关注，向全世界宣告：1977年5月18日为第一个国际博物馆日，并每年为国际博物馆日确定活动主题。
      </div>
    </div>
  </div>

  <!-- Bottom area -->
  <div class="bottom-area">
    <div class="bottom-left">
      <div class="text1">与历史相遇</div>
      <div class="text2">MING</div>
      <div class="text3">明兴亡</div>
    </div>
    <div class="bottom-right">
      <div class="text1">打开时代</div>
      <div class="text2">DE</div>
      <div class="text3">任意门</div>
    </div>
  </div>
</div>

</body>
</html>
