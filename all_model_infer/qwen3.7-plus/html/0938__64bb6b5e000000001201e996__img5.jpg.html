<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adidas Takumi Sen9 vs Nike Streakfly</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    background: #fff;
    max-width: 600px;
    margin: 0 auto;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px 10px;
    position: relative;
  }

  .header-left {
    flex: 1;
    display: flex;
    justify-content: center;
  }

  .header-center {
    flex: 1;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.3;
  }

  .header-center .cn {
    font-size: 16px;
    font-weight: bold;
  }

  .header-center .en {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .header-right {
    flex: 1;
    display: flex;
    justify-content: center;
  }

  .adidas-logo {
    width: 80px;
    height: 50px;
  }

  .nike-logo {
    width: 80px;
    height: 40px;
  }

  .vs-section {
    display: flex;
    position: relative;
    height: 200px;
  }

  .vs-left {
    flex: 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .vs-right {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .vs-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: 900;
    color: #000;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    z-index: 10;
    letter-spacing: 2px;
  }

  .shoe-placeholder {
    width: 220px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shoe-placeholder img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .comparison {
    display: flex;
    flex-direction: column;
  }

  .comp-header {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    padding: 15px 0 10px;
    background: linear-gradient(to right, #fff 50%, #000 50%);
    color: #000;
  }

  .comp-row {
    display: flex;
    background: linear-gradient(to right, #fff 50%, #000 50%);
    border-bottom: 1px solid #eee;
  }

  .comp-row:last-child {
    border-bottom: none;
  }

  .comp-left {
    flex: 1;
    text-align: right;
    padding: 10px 15px;
    font-size: 18px;
    font-weight: bold;
    color: #000;
  }

  .comp-right {
    flex: 1;
    text-align: left;
    padding: 10px 15px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
  }

  .comp-row.title-row .comp-left {
    font-size: 22px;
  }

  .comp-row.title-row .comp-right {
    font-size: 22px;
  }

  .comp-row.price-row .comp-left {
    font-size: 24px;
  }

  .comp-row.price-row .comp-right {
    font-size: 24px;
  }

  .adidas-shoe-img {
    width: 240px;
    height: 150px;
    background: #f5f5f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #999;
  }

  .nike-shoe-img {
    width: 240px;
    height: 150px;
    background: #111;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #666;
  }

  .logo-svg {
    display: inline-block;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header with logos -->
  <div class="header">
    <div class="header-left">
      <svg class="adidas-logo" viewBox="0 0 100 60" fill="#000">
        <polygon points="10,55 30,5 45,5 25,55"/>
        <polygon points="30,55 50,5 65,5 45,55"/>
        <polygon points="50,55 70,5 85,5 65,55"/>
      </svg>
    </div>
    <div class="header-center">
      <div class="cn">奔跑的小小宇</div>
      <div class="en">RUNNING XIAOYU</div>
    </div>
    <div class="header-right">
      <svg class="nike-logo" viewBox="0 0 100 40" fill="#fff">
        <path d="M5,30 Q20,5 50,15 Q70,22 95,5 Q75,25 50,28 Q25,30 5,30Z"/>
      </svg>
    </div>
  </div>

  <!-- VS Section with shoes -->
  <div class="vs-section">
    <div class="vs-left">
      <div class="shoe-placeholder">
        <div class="adidas-shoe-img">
          <svg viewBox="0 0 240 120" width="220" height="130">
            <!-- Adidas Takumi Sen 9 shoe illustration -->
            <ellipse cx="120" cy="100" rx="100" ry="12" fill="#e0e0e0"/>
            <path d="M20,85 Q30,50 60,40 Q90,30 120,35 Q150,38 180,45 Q210,52 220,70 Q225,80 220,85 Z" fill="#2a3a4a"/>
            <path d="M40,75 Q50,55 70,48 Q90,42 110,45" stroke="#a0e040" stroke-width="6" fill="none"/>
            <path d="M55,72 Q65,52 85,45 Q105,40 125,43" stroke="#a0e040" stroke-width="6" fill="none"/>
            <path d="M70,70 Q80,50 100,43 Q120,38 140,42" stroke="#a0e040" stroke-width="6" fill="none"/>
            <path d="M20,85 Q60,90 120,92 Q180,90 220,85 Q215,95 120,98 Q60,97 20,92 Z" fill="#f0f0f0"/>
            <path d="M30,88 Q80,92 130,93 Q180,91 210,87" stroke="#ccc" stroke-width="1" fill="none"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="vs-text">VS</div>
    <div class="vs-right">
      <div class="shoe-placeholder">
        <div class="nike-shoe-img">
          <svg viewBox="0 0 240 120" width="220" height="130">
            <!-- Nike Streakfly shoe illustration -->
            <ellipse cx="120" cy="100" rx="100" ry="12" fill="#222"/>
            <path d="M20,85 Q30,50 60,40 Q90,30 120,35 Q150,38 180,45 Q210,52 220,70 Q225,80 220,85 Z" fill="#f0f0f0"/>
            <path d="M60,65 Q100,45 140,50 Q170,55 190,60" stroke="#111" stroke-width="3" fill="none"/>
            <path d="M160,72 Q175,68 190,72 Q195,75 190,78 Q175,76 160,78 Z" fill="#e8872a"/>
            <path d="M20,85 Q60,90 120,92 Q180,90 220,85 Q215,95 120,98 Q60,97 20,92 Z" fill="#e8e8e8"/>
            <text x="155" y="96" font-size="7" fill="#666">ZOOMX</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Comparison Table -->
  <div class="comparison">
    <div class="comp-header">5-10KM</div>

    <div class="comp-row title-row">
      <div class="comp-left">Takumi Sen9</div>
      <div class="comp-right">Streakfly</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">181g</div>
      <div class="comp-right">165g</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">(27/33) 6mm</div>
      <div class="comp-right">8mm (26/32)</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">LIGHTWEIGHT MESH</div>
      <div class="comp-right">织物鞋面</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">Lightstrike Pro</div>
      <div class="comp-right">ZoomX</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">ENERGYROD玻纤柱</div>
      <div class="comp-right">半掌碳板</div>
    </div>

    <div class="comp-row">
      <div class="comp-left">Continental™</div>
      <div class="comp-right">贴片橡胶</div>
    </div>

    <div class="comp-row price-row">
      <div class="comp-left">1499</div>
      <div class="comp-right">999</div>
    </div>
  </div>
</div>
</body>
</html>
