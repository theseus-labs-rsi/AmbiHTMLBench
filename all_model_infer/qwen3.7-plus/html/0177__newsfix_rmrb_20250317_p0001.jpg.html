<body>
<div class="page">
  <!-- Masthead -->
  <div class="masthead">
    <div class="masthead-left">
      <div class="masthead-title">人民日报</div>
      <div class="masthead-sub">
        RENMIN RIBAO<br>
        人民日报社出版<br>
        国内统一刊号：CN 11-0065<br>
        代号 1-1<br>
        第 25397 期<br>
        今日 20 版<br>
        人民网网址：http://www.people.com.cn
      </div>
    </div>
    <div class="masthead-center">
      <div class="date">2025年3月</div>
      <div class="day">17</div>
      <div>星期一</div>
      <div>乙巳年二月十八</div>
      <div>人民日报社出版</div>
    </div>
    <div class="masthead-right">
      <div class="red-text">读者点题·共同关注</div>
    </div>
  </div>

  <!-- Top Banner -->
  <div class="top-banner">
    <div class="top-banner-left">
      新华社北京3月16日电 近日，中共中央办公厅、国务院办公厅印发《提振消费专项行动方案》（以下简称《方案》），围绕8方面30项重点任务，提出38条具体举措，以全方位扩大国内需求，让消费潜力充分释放。
    </div>
    <div class="top-banner-right">
      本版责编：张彦春 杨笑雨 白之羽
    </div>
  </div>

  <!-- Main Content Area -->
  <div style="display: grid; grid-template-columns: 220px 1fr 1fr 1fr 200px; gap: 12px;">

    <!-- Left Column: Consumption Policy -->
    <div style="grid-row: span 4;">
      <!-- Vertical Banner -->
      <div class="vertical-banner" style="writing-mode: vertical-rl; text-orientation: mixed; font-size: 26px; font-weight: bold; color: #c00; background: #fff8f0; border: 2px solid #c00; padding: 20px 12px; text-align: center; letter-spacing: 6px; line-height: 2; margin-bottom: 10px; height: 600px;">
        中办国办印发《提振消费专项行动方案》
      </div>

      <!-- Section 1 -->
      <div class="article-section">
        <h2>一、城乡居民增收促进行动</h2>
        <p class="sub-heading">（一）促进工资性收入合理增长。实施重点群体就业促进行动，加大青年特别是高校毕业生就业支持力度，拓展农民工就业渠道，拓宽灵活就业和新就业形态劳动者就业空间。健全工资合理增长机制，着力提高城乡居民工资性收入。完善最低工资标准调整机制，推动工资集体协商。健全技能人才薪酬分配制度，引导企业建立基于岗位价值、能力素质、业绩贡献的工资分配机制。深化国有企业工资分配制度改革。完善公务员工资正常调整机制。落实事业单位绩效工资政策。加大转移支付力度，提高基层公务员工资水平。完善艰苦边远地区津贴政策。落实乡镇工作补贴和艰苦边远地区津贴政策。完善艰苦边远地区机关事业单位工资政策。加大转移支付力度，提高基层公务员工资水平。</p>
        <p class="sub-heading">（二）拓宽财产性收入渠道。多渠道增加城乡居民财产性收入。完善上市公司分红制度，鼓励上市公司加大分红力度。拓宽居民投资渠道，规范发展私募基金。完善资本市场基础制度，提高上市公司质量。稳步推进不动产投资信托基金（REITs）市场发展。探索发展知识产权证券化。鼓励金融机构创新理财产品。支持居民通过出租住房、闲置资产等增加财产性收入。</p>
        <p class="sub-heading">（三）加大转移性收入调节力度。完善社会保障体系，提高养老金、医保报销比例。加大社会救助力度，提高低保标准。完善残疾人补贴制度。加大教育、医疗等民生领域投入。完善住房保障体系，加大保障性住房供给。完善农村低收入人口常态化帮扶机制。加大以工代赈实施力度，提高劳务报酬发放比例。</p>
      </div>

      <!-- Section 2 -->
      <div class="article-section">
        <h2>二、消费能力保障支持行动</h2>
        <p class="sub-heading">（四）加大生育养育保障力度。研究建立育儿补贴制度，指导有条件的地方加大育儿补贴发放力度。完善生育休假制度，落实产假、陪产假、育儿假等规定。加大托育服务供给，支持社会力量举办托育机构。完善生育支持政策体系，降低生育、养育、教育成本。落实个人所得税专项附加扣除中3岁以下婴幼儿照护、子女教育等扣除标准。完善生育保险制度，扩大生育保险覆盖面。</p>
        <p class="sub-heading">（五）完善社会保障体系。健全多层次社会保障体系，扩大社会保险覆盖面。完善基本养老保险全国统筹制度，发展多层次、多支柱养老保险体系。完善基本医疗保险制度，推进跨省异地就医直接结算。完善失业保险、工伤保险制度。发展商业养老保险、健康保险。完善社会救助体系，加强低收入人口动态监测和常态化救助帮扶。完善残疾人社会保障制度和关爱服务体系。</p>
        <p class="sub-heading">（六）优化消费环境。加强消费者权益保护，完善消费纠纷多元化解机制。加强商品和服务质量监管，严厉打击假冒伪劣。完善信用体系建设，推进信用消费。加强消费基础设施建设，完善城乡消费网络。优化消费支付环境，提升支付便利性。加强消费领域标准体系建设，推动标准国际化。完善消费统计监测体系，加强消费数据分析应用。</p>
      </div>
    </div>

    <!-- Center-Left Column -->
    <div style="grid-row: span 2;">
      <div class="article-section">
        <p>综合施策稳预期、利长远、增后劲。</p>
        <p class="sub-heading">（四）保障重点群体就业。扩大就业容量，提升就业质量。完善高校毕业生、农民工、退役军人、就业困难人员等重点群体就业支持体系。加强职业技能培训，提高劳动者就业能力。完善创业扶持政策，鼓励自主创业。加强公共就业服务，完善就业信息平台。落实就业优先政策，将就业优先政策置于宏观政策层面。完善就业援助制度，对就业困难人员实行托底帮扶。加强新就业形态劳动者权益保障。完善灵活就业人员社会保障政策。</p>
        <p class="sub-heading">（五）提升消费供给质量。深化供给侧结构性改革，提高供给体系对国内需求的适配性。推动传统产业转型升级，培育壮大新兴产业，布局建设未来产业。加强品牌建设，提升中国品牌影响力。推动内外贸一体化发展，扩大优质消费品进口。发展服务消费，扩大文化、旅游、体育、健康、养老、家政等服务供给。推动数字消费发展，培育新型消费业态。完善农村消费网络，推动工业品下乡和农产品进城双向流通。</p>
        <p class="sub-heading">（六）优化消费环境。加强消费者权益保护，完善消费纠纷多元化解机制。加强商品和服务质量监管，严厉打击假冒伪劣。完善信用体系建设，推进信用消费。加强消费基础设施建设，完善城乡消费网络。优化消费支付环境，提升支付便利性。加强消费领域标准体系建设，推动标准国际化。完善消费统计监测体系，加强消费数据分析应用。</p>
      </div>
    </div>

    <!-- Center Column -->
    <div style="grid-row: span 2;">
      <div class="article-section">
        <h3>三、服务消费质量提升行动</h3>
        <p class="sub-heading">（七）优化"一老一小"服务供给。推进社区养老服务设施建设，发展居家社区养老服务。完善长期护理保险制度，扩大试点范围。发展银发经济，开发适老化技术和产品。扩大普惠托育服务供给，支持社会力量举办托育机构。完善生育支持政策，降低生育、养育、教育成本。加强儿童友好城市建设，完善儿童公共服务设施。推动教育、医疗、文化等公共服务优质均衡发展。</p>
        <p class="sub-heading">（八）提升文旅服务品质。推动文化和旅游深度融合，发展全域旅游。加强文化遗产保护利用，推动非物质文化遗产传承发展。提升旅游景区服务质量，完善旅游基础设施。发展红色旅游、乡村旅游、研学旅游等新业态。加强旅游市场监管，规范旅游市场秩序。推动国际旅游发展，提升入境旅游便利化水平。完善旅游公共服务体系，提高旅游信息化水平。</p>
        <p class="sub-heading">（九）促进体育消费发展。完善全民健身公共服务体系，建设更多体育设施。发展体育产业，培育体育品牌赛事。推动体育与旅游、文化、教育等融合发展。支持体育社会组织发展，鼓励社会力量参与体育服务供给。加强体育市场监管，规范体育市场秩序。推动体育消费试点城市建设，总结推广体育消费经验做法。</p>
        <p class="sub-heading">（十）扩大数字消费规模。推动数字技术与实体经济深度融合，发展数字经济。完善数字基础设施，提升网络服务质量。发展电子商务，推动线上线下消费融合发展。培育数字内容、数字娱乐等新业态。加强数据安全和个人信息保护。推动数字消费普惠发展，缩小数字鸿沟。</p>

        <div class="header-row">

        <div class="ai-title">生成式人工智能爆发，未来"人工"会被取代吗？</div>
        <div class="ai-subtitle">本报记者 智春丽</div>
        <div class="ai-body">
          <p>有诗可作机器诗，画曲亦可从画来。自今年初以来，DeepSeek、Kimi等人工智能产品"出圈"，生成式人工智能再次成为公众关注的焦点。"人工智能会不会取代人类？"这一问题引发了广泛讨论。</p>
          <p>这一问题，引发了很多人的思考和担忧。到底人工智能会怎么影响我们，代表哪些行业会先变化？</p>
          <p>记者发现，当前，"人工智能"更多的关于人工智能的讨论层出不穷。"人工智能"正在改变我们的生活方式。</p>
          <p>其实，这不是新问题。人类对人工智能的讨论，由来已久。从图灵测试，到深度学习，再到生成式人工智能，每一次技术突破都伴随着类似的讨论。但有一点是明确的：人工智能不会完全取代人类，而是会改变我们的工作方式。</p>
          <p>人类需要拥抱AI，如同拥抱每一次技术革命。关键在于，我们如何在这场变革中找到自己的位置，如何让人工智能成为我们的助手，而非替代者。</p>
          <p>从技术角度看，当前呈现出的"智能"水平，距离真正的"通用人工智能"还有相当长的路要走。当前的大语言模型，本质上是基于统计规律的模式匹配，而非真正的理解和推理。</p>
          <p>上世纪90年代以来，科学家曾预言的"办公自动化"并未如预期般大规模出现。相反，许多新的职业和岗位应运而生。人工智能的发展，同样会创造新的就业机会。</p>
          <p>当然，这并不意味着我们可以掉以轻心。面对人工智能的快速发展，我们需要积极适应，主动学习新技能，提升自身竞争力。同时，政府和社会也应加强政策引导，完善社会保障体系，帮助受影响的劳动者顺利转型。</p>
          <p>记者注意到，近期，多地已出台人工智能相关政策，推动人工智能产业发展。例如，北京、上海、深圳等地纷纷发布人工智能发展规划，加大研发投入，培育人工智能企业。</p>
          <p>在行业应用方面，人工智能正在医疗、金融、教育、制造等领域发挥越来越重要的作用。在医疗领域，AI辅助诊断系统可以帮助医生更准确地识别疾病；在金融领域，智能风控系统可以有效降低风险；在教育领域，个性化学习系统可以根据学生的特点提供定制化教学方案。</p>
          <p>然而，人工智能的发展也带来了一些挑战。数据隐私、算法偏见、就业冲击等问题需要引起重视。我们需要在推动技术创新的同时，加强监管和治理，确保人工智能的发展符合人类价值观和伦理规范。</p>
          <p>总的来说，人工智能是一把双刃剑。它既带来了巨大的机遇，也伴随着一定的风险。关键在于我们如何把握机遇，应对挑战。未来，"人工"不会被完全取代，但会与人工智能深度融合，共同推动社会进步。</p>
          <p>（本报记者 智春丽）</p>
        </div>
      </div>
    </div>

      <div style="column-count: 3; column-gap: 15px; font-size: 12px; line-height: 1.7;">
        <p>"两重"建设扎实推进</p>
        <p>内蒙古自治區鄂尔多斯市乌审旗的毛乌素沙地上，一排排梭梭树迎风挺立，曾经的黄沙漫漫如今已披上绿装。这是"三北"工程建设的生动写照。</p>
        <p>2024年，"三北"工程六期建设扎实推进。全年完成各项建设任务5700万亩，其中营造林3100万亩，种草改良2600万亩。工程区森林覆盖率稳步提升，生态环境持续改善。</p>
        <p>在宁夏回族自治区，"三北"工程六期建设项目全面实施。通过乔灌草结合、封沙育林育草等多种措施，有效遏制了土地沙化趋势。当地群众积极参与植树造林，形成了全民参与的良好氛围。</p>
        <p>在甘肃省，"三北"工程六期建设聚焦重点区域，加强祁连山生态保护修复。通过实施天然林保护、退耕还林还草等工程，区域生态环境明显好转。</p>
        <p>在陕西省，"三北"工程六期建设注重科技创新，推广抗旱造林、节水灌溉等新技术，提高了造林成活率和保存率。同时，大力发展林下经济，带动群众增收致富。</p>

        <p>在陕西省，"三北"工程六期建设注重科技创新，推广抗旱造林、节水灌溉等新技术，提高了造林成活率和保存率。同时，大力发展林下经济，带动群众增收致富。</p>

        <p>下一步，"三北"工程将继续坚持科学规划、因地制宜、分类施策的原则，加快推进工程建设，为筑牢祖国北疆生态安全屏障作出更大贡献。</p>

      <div style="font-size: 12px; line-height: 1.7; margin-right: 40px;">
        <p style="text-indent: 2em; margin-bottom: 4px;">推出政策包，推三百万英才计划</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">本报记者 李刚 贺林平</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">"东西南北中，发展到广东。"广东省委书记黄坤明在"广东高质量发展大会"上发出"英雄帖"。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">3月16日，2025年广东省高质量发展大会在广州召开。大会以"建设现代化产业体系"为主题，聚焦科技创新、产业升级、人才发展等关键领域。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">大会发布了《广东省"百万英才汇南粤"行动计划》，提出三年内引进100万名高层次人才，为广东高质量发展提供强有力的人才支撑。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">"三北"工程六期建设"保障民生生活"，人人关心祖国南疆交通建设。在粤港澳大湾区，交通基础设施不断完善，港珠澳大桥、广深港高铁等重大工程相继建成通车，区域一体化发展加速推进。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">"三北"工程六期建设"保障民生生活"，人人关心祖国南疆交通建设。在粤港澳大湾区，交通基础设施不断完善，港珠澳大桥、广深港高铁等重大工程相继建成通车，区域一体化发展加速推进。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">中山大学等高校纷纷出台人才引进政策，提供优厚的薪酬待遇和科研条件，吸引海内外优秀人才。深圳、广州等地也推出了一系列人才安居、子女教育等配套政策，解决人才后顾之忧。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">在创新创业方面，广东设立了多项创业扶持基金，为创业者提供资金支持、场地优惠、导师指导等全方位服务。同时，简化行政审批流程，优化营商环境，激发市场活力。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">据统计，2024年广东全省新增就业150万人，其中高校毕业生就业80万人。人才净流入量连续多年居全国首位，成为吸引人才就业创业的热土。</p>

      <div class="ht-title" style="font-size: 26px; font-weight: bold; color: #222; margin-bottom: 8px;">如何进一步做好<br>稳外资工作</div>
      <div class="byline">本报记者 罗珊珊</div>
      <div style="font-size: 12px; line-height: 1.7;">
        <p style="text-indent: 2em; margin-bottom: 4px;">外资是构建新发展格局的重要组成部分。中央经济工作会议提出，"稳外资是稳住宏观经济基本盘"。如何进一步做好稳外资工作？本报记者采访了相关专家和企业负责人。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">"稳外资"首先要"稳预期"。国家发展改革委利用外资和境外投资司负责人表示，2025年将出台《鼓励外商投资产业目录》修订版，进一步扩大鼓励外商投资范围，引导外资更多投向先进制造、现代服务、高新技术和节能环保等领域。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">优化营商环境是稳外资的关键。商务部副部长表示，将继续推进外商投资法实施条例的修订完善，加强知识产权保护，落实外资企业国民待遇，确保外资企业在政府采购、标准制定等方面享有平等待遇。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">扩大开放是稳外资的根本途径。2025年，中国将进一步缩减外资准入负面清单，全面取消制造业领域外资准入限制措施，扩大电信、医疗、教育等服务业开放试点。同时，加快推进自由贸易试验区建设，打造高水平开放平台。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">加强服务保障是稳外资的重要支撑。各地纷纷出台稳外资政策措施，建立外资项目专班服务机制，为外资企业提供"一站式"服务。同时，完善外资企业投诉工作机制，及时协调解决外资企业反映的问题和诉求。</p>
        <p style="text-indent: 2em; margin-bottom: 4px;">据统计，2024年全国实际使用外资金额1.2万亿元，同比增长5.2%。2025年，中国将继续加大稳外资力度，推动利用外资高质量发展，为构建新发展格局、推动经济高质量发展作出更大贡献。</p>
      </div>
    </div>
