<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.语法</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #7fb8a0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 20px;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
  }

  .notebook {
    background-color: #f5f5f0;
    width: 100%;
    max-width: 620px;
    padding: 0;
    position: relative;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
  }

  .binding {
    display: flex;
    justify-content: space-around;
    padding: 10px 30px 0;
    background-color: #f5f5f0;
  }

  .binding .hole {
    width: 22px;
    height: 22px;
    background-color: #7fb8a0;
    border-radius: 50%;
  }

  .page-content {
    padding: 20px 40px 40px;
    background-image:
      linear-gradient(rgba(200,210,200,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,210,200,0.3) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: 0 0;
    min-height: 700px;
    position: relative;
  }

  h1 {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    margin: 20px 0 25px;
    color: #222;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
  }

  p {
    font-size: 18px;
    line-height: 2;
    color: #222;
    margin-bottom: 22px;
    text-indent: 0;
    text-align: justify;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
  }

  .center-text {
    text-align: center;
  }

  .star-decoration {
    position: absolute;
    font-size: 24px;
    color: #f0c040;
    opacity: 0.7;
  }

  .star1 {
    top: 230px;
    left: 60px;
  }

  .star2 {
    top: 310px;
    left: 100px;
  }

  .star3 {
    top: 560px;
    left: 80px;
  }

  .flower-decoration {
    position: absolute;
    bottom: 30px;
    right: 40px;
    font-size: 40px;
    opacity: 0.6;
  }

  .flower-decoration .flower {
    color: #e88;
    font-size: 44px;
  }

  .flower-decoration .leaf {
    color: #7fb8a0;
    font-size: 28px;
    margin-left: -10px;
  }

  .highlight-star {
    display: inline;
    position: relative;
  }

  .highlight-star::after {
    content: "✦";
    position: absolute;
    color: #f0c040;
    font-size: 14px;
    top: -5px;
    right: -12px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="notebook">
  <div class="binding">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <div class="page-content">
    <span class="star-decoration star1">✦</span>
    <span class="star-decoration star2">✦</span>
    <span class="star-decoration star3">✦</span>

    <h1>4.语法</h1>

    <p>语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。</p>

    <p>虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。</p>

    <p>学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。</p>

    <p>零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。</p>

    <div class="flower-decoration">
      <span class="flower">✿</span>
      <span class="leaf">❀</span>
    </div>
  </div>
</div>

</body>
</html>
