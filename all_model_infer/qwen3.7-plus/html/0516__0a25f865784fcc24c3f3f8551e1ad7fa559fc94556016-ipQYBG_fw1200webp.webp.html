    z-index: 10;
    width: 100%;

    color: #1a1a1a;
    font-family: 'Noto Sans SC', sans-serif;

    align-items: flex-start;
    gap: 8px;
  }

  .title-cn {
    font-size: 28px;
    font-weight: 900;
    color: #1a1a1a;
    writing-mode: vertical-rl;
    letter-spacing: 6px;
    font-family: 'Noto Serif SC', serif;

    font-size: 28px;
    font-weight: 900;
    color: #1a2a6c;

    color: #1a2a6c;

    text-orientation: mixed;

    font-weight: 700;
    color: #1a2a6c;

    color: #1a1a1a;
    letter-spacing: 3px;
    margin-top: 8px;
    font-family: 'Noto Sans SC', sans-serif;

    font-size: 26px;
  }

    font-size: 13px;
    letter-spacing: 2px;
  }

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    text-align: center;
  }

  .center-title .char {
    font-size: 120px;
    font-weight: 900;
    color: #1a1a1a;
    font-family: 'Noto Serif SC', serif;
    line-height: 1.1;
    display: block;
    position: relative;
  }

  .center-title .char::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 5px;
    right: -5px;
    bottom: -5px;
    border: 1px solid rgba(0,0,0,0.08);
    z-index: -1;
  }

  .center-title .dot {
    font-size: 40px;
    color: #1a1a1a;
    display: block;
    line-height: 0.5;
  }

    position: absolute;
    top: 340px;
    right: 50px;
    z-index: 10;
    text-align: right;

    font-size: 52px;
    font-weight: 300;
    color: #1a2a6c;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 4px;

    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 3px;
    margin-top: 4px;

    color: #1a1a1a;
    font-family: 'Noto Sans SC', sans-serif;
    margin-top: 6px;
    letter-spacing: 1px;

    right: 50px;
    z-index: 10;
    text-align: right;

    font-weight: 900;

    padding-bottom: 8px;

    font-weight: 700;
    color: #1a1a1a;
    font-family: 'Georgia', serif;
    line-height: 1.3;
    margin-bottom: 12px;

    border: 2px solid #1a2a6c;
    padding: 6px 14px;
    font-size: 16px;
    color: #1a2a6c;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 2px;
    margin-bottom: 8px;

    color: #1a2a6c;
    font-family: 'Georgia', serif;
    line-height: 1.5;
    font-style: italic;
  }

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    opacity: 0.06;
    font-size: 200px;
    font-weight: 900;
    color: #1a1a1a;
    font-family: 'Noto Serif SC', serif;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
