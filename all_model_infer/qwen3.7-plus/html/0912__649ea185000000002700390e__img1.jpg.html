<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备忘录 - 应届生补贴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .memo-container {
            background-color: #ffffff;
            max-width: 480px;
            width: 100%;
            padding: 20px 24px 40px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c8a84e;
            font-size: 16px;
            cursor: pointer;
        }

        .header-left .back-arrow {
            font-size: 20px;
            color: #c8a84e;
        }

        .header-right {
            width: 32px;
            height: 32px;
            border: 2px solid #c8a84e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-right .dots {
            display: flex;
            gap: 3px;
        }

        .header-right .dot {
            width: 4px;
            height: 4px;
            background-color: #c8a84e;
            border-radius: 50%;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            color: #333333;
            line-height: 1.4;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .divider {
            border: none;
            border-top: 2px dashed #333333;
            margin-bottom: 28px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .check-icon {
            width: 28px;
            height: 28px;
            background-color: #7ec850;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .check-icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .section-title-text {
            font-size: 20px;
            font-weight: 700;
            color: #333333;
            background-color: #fff9c4;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .section-title-text .amount {
            font-weight: 700;
        }

        .bullet-list {
            list-style: none;
            padding-left: 38px;
        }

        .bullet-list li {
            position: relative;
            font-size: 15px;
            color: #333333;
            line-height: 1.7;
            margin-bottom: 6px;
        }

        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: -18px;
            font-size: 18px;
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="memo-container">
        <div class="header">
            <div class="header-left">
                <span class="back-arrow">‹</span>
                <span>备忘录</span>
            </div>
            <div class="header-right">
                <div class="dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <h1 class="title">应届生这些补贴不领就亏大了！！！</h1>

        <hr class="divider">

        <div class="section">
            <div class="section-title">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                <span class="section-title-text">租房补贴（6000~12000）</span>
            </div>
            <ul class="bullet-list">
                <li>全日制毕业生，在毕业2年内申请（部分城市是5年内）</li>
                <li>拥有当地户口，带上身份证、毕业证书、劳动合同、房屋租凭合同、租金发票和租房补贴申请表到当地的人社部门办理领取</li>
            </ul>
        </div>

        <div class="section">
            <div class="section-title">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                <span class="section-title-text">基层就业补贴（3000~5000）</span>
            </div>
            <ul class="bullet-list">
                <li>全日制大专以上，毕业2年内</li>
                <li>连续缴纳6个月社保，准备好身份证、毕业证、中小型企业声明函直接在线上申请就好</li>
            </ul>
        </div>

        <div class="section">
            <div class="section-title">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                </div>
                <span class="section-title-text">高校灵活就业补贴（800/月）</span>
            </div>
            <ul class="bullet-list">
                <li>离校2年内未就业的大专/本科高校毕业生</li>
                <li>已经做了灵活就业类型登记就业、以个人身份依法缴纳社保的，可以直接在当地的政务服务网官网申请</li>
            </ul>
        </div>
    </div>
</body>
</html>
