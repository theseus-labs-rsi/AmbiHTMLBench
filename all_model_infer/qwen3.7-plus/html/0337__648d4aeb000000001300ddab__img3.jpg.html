<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忽视你的需求，内耗你的精力</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #f5f5f5;
            max-width: 680px;
            width: 100%;
            padding: 30px 35px 40px;
            position: relative;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .header-bar {
            background-color: #4a7c6f;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .battery-icon {
            width: 55px;
            height: 65px;
            position: relative;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .battery-icon svg {
            width: 100%;
            height: 100%;
        }

        .content {
            color: #3a6b5e;
            font-size: 18px;
            line-height: 1.8;
        }

        .content p {
            margin-bottom: 22px;
            font-weight: 600;
        }

        .content .check-item {
            margin-bottom: 22px;
            font-weight: 600;
            display: flex;
            align-items: flex-start;
        }

        .check-item .checkmark {
            color: #4a7c6f;
            font-size: 20px;
            margin-right: 8px;
            flex-shrink: 0;
            line-height: 1.8;
        }

        .content .final {
            margin-bottom: 0;
            font-weight: 700;
        }

        .bold-text {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div class="header-bar">3. 忽视你的需求，内耗你的精力</div>
            <div class="battery-icon">
                <svg viewBox="0 0 60 75" xmlns="http://www.w3.org/2000/svg">
                    <!-- Battery body -->
                    <rect x="8" y="12" width="44" height="58" rx="4" fill="none" stroke="#4a7c6f" stroke-width="3"/>
                    <!-- Battery top cap -->
                    <rect x="20" y="4" width="20" height="10" rx="2" fill="none" stroke="#4a7c6f" stroke-width="3"/>
                    <!-- Lightning bolt -->
                    <polygon points="32,18 22,40 30,40 26,62 40,34 32,34 36,18" fill="#e74c3c" stroke="#e74c3c" stroke-width="1"/>
                </svg>
            </div>
        </div>

        <div class="content">
            <p>这一种人，不仅可能是身边的朋友，亲密关系中也会出现。爱我们的人，也可能会"害"我们。</p>

            <p>忽视需求，是关系中隐藏的一把刀，对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>

            <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>

            <p>经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</p>

            <div class="check-item">
                <span class="checkmark">✓</span>
                <span>面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。</span>
            </div>

            <p class="final">与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。</p>
        </div>
    </div>
</body>
</html>
