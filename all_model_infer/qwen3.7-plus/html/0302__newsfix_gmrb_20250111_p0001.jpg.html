      <div class="main-headline">习近平回信勉励国家京剧院青年艺术工作者</div>

    </div>
  </div>

    <span>第27374号</span>
  </div>

  <!-- Main content -->
  <div class="main-content">

    <!-- Left sidebar -->
    <div class="left-sidebar">
      <div class="side-headline" style="font-size:20px; font-weight:bold; line-height:1.6; margin-bottom:10px;">
        习近平致信中国法学会第九次全国会员代表大会强调
      </div>
      <div style="font-size:24px; font-weight:bold; line-height:1.5; margin-bottom:15px;">
        进一步加强自身建设更好发挥桥梁纽带作用<br>
        努力开创法学会事业发展新局面
      </div>

      <div class="article-body" style="font-size:12px;">
        <p style="text-indent:2em;">值此中国法学会第九次全国会员代表大会召开之际，我向全国广大法学法律工作者致以问候！</p>
        <p style="text-indent:2em;">党的十八大以来，各级法学会团结带领广大法学法律工作者做了大量工作，为推进全面依法治国作出了积极贡献。</p>
        <p style="text-indent:2em;">新时代新征程，各级法学会要坚持以新时代中国特色社会主义思想为指导，全面贯彻新时代中国法学会工作总要求，坚持走中国特色社会主义法治道路，坚持服务党和国家工作大局，进一步加强自身建设，更好发挥桥梁纽带作用，扎实做好繁荣法学研究、服务法治实践、加强法治宣传、培养法治人才等工作，努力开创法学会事业发展新局面。广大法学法律工作者要坚定法治自信，强化使命担当，积极投身全面依法治国伟大实践，为建设更高水平的社会主义法治国家、推进中国式现代化作出新的贡献。各级党委要加强对法学会的领导，为法学会依法依规开展工作提供有力支持。（信全文见另条）</p>
        <p style="text-indent:2em;">中国法学会第九次全国会员代表大会10日上午在京开幕，会上传达习近平致信。</p>
        <p style="text-indent:2em;">中共中央政治局委员、中央政法委书记陈文清在开幕式上代表党中央致词。他说，各级法学会要深入学习贯彻习近平总书记重要指示精神，坚持党的全面领导，强化政治引领，依法履职尽责，严明纪律作风，锐意改革创新，为推进全面依法治国、建设更高水平的社会主义法治国家贡献智慧和力量。希望广大法学法律工作者全面学习贯彻习近平法治思想，把牢政治方向，坚定法治自信，主动服务大局，服务人民，深入开展法学研究，围绕科学立法、严格执法、公正司法、全民守法扎实工作，在推进中国式现代化中建功立业。</p>
        <p style="text-indent:2em;">王小洪、张庆伟、张军、应勇、何报翔出席开幕式。</p>
        <p style="text-indent:2em;">第八届中国法学会会长王晨主持会议，并代表第八届理事会作工作报告。会议表彰了全国法学会系统先进集体和先进个人。中央政法委委员、中国法学会第九次全国会员代表大会全体代表参加了开幕式。</p>
      </div>

      <div class="article-source" style="margin-top:10px;">
        新华社北京1月10日电
      </div>
    </div>

    <!-- Right content -->
    <div class="right-content">

      <!-- 回信 article -->
      <div class="article-block">
        <div class="article-title large" style="text-align:center;">回 信</div>
        <div class="letter-box">
          <div class="letter-body">
            <p class="no-indent"><strong>国家京剧院青年艺术工作者：</strong></p>
            <p>来信收悉。值此国家京剧院建院70周年之际，向你们以及全体演职人员表示祝贺和问候。</p>
            <p>国家京剧院成立以来，贯彻党的文艺方针政策，创排了许多经典剧目，涌现出不少优秀艺术人才，为中华戏曲百花园增添了绚丽色彩。新起点上，希望你们传承前辈名家优良传统，践行艺术为民，坚持崇德尚艺、守正创新，让京剧艺术持续焕发时代光彩，为繁荣文艺事业、建设文化强国贡献力量。</p>
            <div class="letter-sign">
              习近平<br>
              2025年1月9日<br>
              （新华社北京1月10日电）
            </div>
          </div>
        </div>
        <div class="article-body" style="font-size:12px; margin-top:10px;">
          <p style="text-indent:2em;">新华社北京1月10日电 近日，中共中央总书记、国家主席、中央军委主席习近平给国家京剧院青年艺术工作者回信，在国家京剧院成立70周年之际，向全体演职人员表示祝贺和问候。</p>
          <p style="text-indent:2em;">习近平在回信中说，国家京剧院成立以来，贯彻党的文艺方针政策，创排了许多经典剧目，涌现出不少优秀艺术人才，为中华戏曲百花园增添了绚丽色彩。新起点上，希望你们传承前辈名家优良传统，践行艺术为民，坚持崇德尚艺、守正创新，让京剧艺术持续焕发时代光彩，为繁荣文艺事业、建设文化强国贡献力量。（回信全文见另条）</p>
          <p style="text-indent:2em;">国家京剧院是文化和旅游部直属国家级艺术院团，前身为1955年1月成立的中国京剧院，梅兰芳担任首任院长，2007年更名为国家京剧院。近日，国家京剧院全体青年艺术工作者给习近平总书记写信，汇报传承京剧艺术相关情况，表达为繁荣发展京剧事业、弘扬中华优秀传统文化而奋斗的决心。</p>
        </div>
      </div>

      <!-- Police article -->
      <div class="article-block police-section">
        <div class="police-title">矢志不渝做党和人民的忠诚卫士</div>
        <div class="police-subtitle">——写在第五个中国人民警察节到来之际</div>

        <div class="article-body" style="font-size:12px; margin-bottom:10px;">
          <p style="text-indent:2em;">2025年1月10日，第五个中国人民警察节。</p>
          <p style="text-indent:2em;">这是一支有着光荣传统和英雄辈出的队伍，也是和平时期牺牲最多、奉献最大的一支队伍。</p>
          <p style="text-indent:2em;">作为国家重要的治安行政和刑事司法力量，人民警察全力以赴防风险、保安全、护稳定、促发展，在挑战中坚定信仰使命，在斗争中彰显担当作为，不忘初心，矢志不渝，做党和人民的忠诚卫士。</p>
        </div>

        <div class="police-body">
          <div class="col">
            <p class="sub-head font-bold">砺剑——提升公安机关新质战斗力</p>
            <p>2024年5月28日，北京人民大会堂。习近平总书记亲切会见全国公安工作会议代表，勉励全国公安机关紧紧围绕推进公安工作现代化，为推进强国建设、民族复兴伟业作出新的更大贡献。</p>
            <p>锚定公安工作现代化目标，全国公安机关落实主动、规范、协同、精细、务实的新警务理念，完善"专业+机制+大数据"新型警务运行模式，不断提升公安机关新质战斗力，全面推动公安工作质量变革、效率变革、动力变革。</p>
            <p>2024年，内蒙古兴安盟某地发生一起特大入室盗窃案。刑侦部门现场勘验</p>
          </div>
          <div class="col">
            <p>寻找"蛛丝马迹"，一支特殊的侦查团队也同步上案，他们在海量数据中"大海捞针"，仅用8小时就锁定嫌疑人。案发22小时后，嫌疑人落网，案件告破。</p>
            <p>"智能交通管理模型"数字化防控模型……近年来，兴安盟乌兰浩特市自主研发100个实战模型，以新平台、新模型为引擎，构建系统治理体系，以科技赋能新型警务运行模式。</p>
            <p>"全警深耕技战法创新，通过梳理底层逻辑、加强顶层设计持续优化工作模式，让法治思维在大数据面前无处遁形。"乌兰浩特市公安局局长刘斌说。</p>
            <p>新时代新征程，要适应新形势、应对新挑战、解决新问题，必须加快构建符合新时代要求、体现实战化特点、具有中国特色的现代警务体系。</p>
            <p>2024年10月7日凌晨，浙江省绍兴市辖区高速公路上，一辆小客车因抛锚停在快车道。绍兴高速交警收到平台推送信息后，第一时间启动就近无人机前往现场。无人机引导司乘人员撤离到护栏外，在故障车辆后方做好预警提示，待施救人员到达，有效避免了次生事故的发生。</p>
          </div>
          <div class="col">
            <p>在"公安大脑"架构下，浙江交管部门2024年10月起推广应用"浙里安行"护航平台，开展研判、预警、查缉、治理和服务工作，累计发布各类风险预警16.4万余次。</p>
            <p>"实时推送预警，路面即时管控、同步查控，形成'预警查控'的新警务运行模式，多措并举，全力维护道路交通安全。"浙江省公安厅交通管理局主要负责人王绍说。</p>
            <p>着力提高专业能力，完善"情指行"一体化运行机制，推进公安大数据智能化建设应用，"专业+机制+大数据"新型警务运行模式，日益成为推动公安工作创新发展的强大引擎、培育战斗力生成新的增长点。</p>
          </div>
          <div class="col">
            <p class="sub-head font-bold">为民——服务人民保障经济社会高质量发展</p>
            <p>"网上申请、邮寄到家。"北京市海淀区的李先生因居民身份证丢失，在网上申请身份补领业务，不到一周便收到了新身份证。</p>
            <p>"把群众的需求当成'任务书'，把群众的满意度当成'验收单'，尽量让群众办事'一次都不跑'，是我们努力的方向。"北京市公安局深化公安行政管理服务改革领导小组办公室负责人刘海说。</p>
            <p class="tiny-text" style="text-indent:0; margin-top:10px;">（下转3版）</p>
          </div>
        </div>
      </div>

    <!-- 宝庆瓷刻 -->
    <div>
      <div class="craft-title">宝庆瓷刻</div>
      <div class="text-center small-text mb-10">讲述人：湖南省非物质文化遗产"宝庆瓷刻"省级代表性传承人 刘金铎</div>

      <div class="craft-section" style="grid-template-columns: 1fr;">
        <div class="col" style="font-size:13px; line-height:1.8;">
          <p>"号哦喂——"父亲那洪亮的吆喝声，至今仍在耳畔回响。过去，他是走街串巷的号碗匠，所到之处，小孩子们总喜欢围拢来。他乐呵呵地从兜里摸出纸包糖，每人发上一小块，挥手说："快去哦，快去喊……""小喇叭"们便满院奔跑，高喊："号碗来啰！"</p>
          <p>那时，家家户户里在碗底刻字。红白喜事摆宴席，自家碗筷不够，都需向借借。为免混淆，大伙儿新买碗要请师傅"号碗"。</p>
          <p>这"号碗"，便是瓷刻的一种。家乡湖南邵阳古称"宝庆"，因而叫宝庆瓷刻。如今，我接过父亲的衣钵，在烧制好的瓷器上，以刻刀代笔，雕琢出精美图画。</p>
          <p>瓷刻步骤不繁，却讲究精细：先用毛笔勾勒线条草稿，接着沿轮廓"下锤"凿刻，此为关键。最后是填墨着色，赋予作品生机。</p>
          <p>雕刻环节的门道多！选工具，依图案疏密而定，锡钢刀粗犷，大写意恰到好处，金刚刀细腻，刻画肖像惟妙惟肖；握刀时，微侧倾斜，刀刃与瓷面呈50度左右，再配合速度推进；下刀需稳，锤子反复敲击上千次，画的疏密需精准，刻的深浅需明确，一点点练就真意。</p>
          <p>经多年钻研，我掌握了独特刀法：乱刀法，点线交织，看似乱，实却能呈现火焰跳跃、波涛汹涌、树枝摇曳；滚刀法，刀刃与瓷器保持角度滚动雕琢，展现卷曲藤蔓、毛发、波浪等；游丝点刀法，手腕轻抖，小眼如春蚕吐丝，铺展组合后，让人物的皮肤、睫毛逼真起来……</p>
          <p>瞧，这幅《齐白石肖像》，正是巧用刀法，再与素描融合。前些年，作品展出，齐白石的孙子凝视良久，感慨了一句："我感觉爷爷就在眼前！"</p>
          <p class="editor-note" style="text-indent:0;">（本报记者赵嘉伟采访整理）</p>
        </div>

      <div class="tent-section" style="grid-template-columns: 1fr 1fr 1fr;">

          <p>"这边还能再搭两顶！"</p>
          <p>"地钉固定好了，再把防风绳系上！"</p>
          <p>深夜，西藏定日县曲洛乡左措村临时安置点，气温已降到零下20摄氏度。肆虐的寒风中，记者看到一群青年干警正加紧搭建帐篷。</p>
          <p>"这个村有700多人，首批发放55顶帐篷。我们从下午5点就开始帮</p>
        </div>
        <div class="col" style="font-size:13px; line-height:1.8;">
          <p>村民搭帐篷，现在搭好了近40顶，还得再加油些！"谢通门县公安局支队长旦增说。地震灾区临时安置点支起帐篷，让乡亲们少挨冻！"我们得尽快搭好，让乡亲们少挨冻！"</p>
          <p>凌晨2点，帐篷终于全部搭好。见全村人都住进了帐篷，小伙子们终于松了口气。此时，他们个个脸颊淌着热</p>
        </div>
        <div class="col" style="font-size:13px; line-height:1.8;">
          <p>汗，头顶冒着白雾！</p>
          <p>"笑言其（藏语，意为感谢）！忙到这么晚，赶紧休息吧！"一位老奶奶心疼地说。</p>
          <p>"您先睡，我们还要给自己搭帐篷呢！"说着，小伙子们又在寒夜中忙碌起来……</p>
          <p class="tiny-text" style="text-indent:0; margin-top:10px;">（前方报道组成员：刘宇帆、尕玛多吉、傅煜）</p>

    <div class="report-title" style="font-size:26px; font-weight:bold; text-align:center; margin:10px 0;">我为奔赴西部的"队友"骄傲！</div>

    <div class="article-source text-center mb-10">光明日报编辑部：</div>

    <div class="report-body">
      <div class="col" style="font-size:13px; line-height:1.8;">
        <p>读罢《扎根西部，新时代学子这样选择》一文，我立刻分享到朋友圈，还点对点发给了几位留在西部工作的同龄人。</p>
        <p>很快，回复接二连三飞来："这些青年点赞，也为我们的青春点赞！"真好，想起了咱的西部岁月！"那段记忆，永不淡去！这份情怀，依旧鲜活！"……</p>
        <p>看着这些字句，我的思绪不禁飘回了一个叫古浪的地方。</p>
        <p>2013年8月，作为福建师范大学第十五届扶贫接力计划研究生支教团的一员，我从福州跨越2500公里，来到甘肃武威古浪县。近目的地时，对昔日书中读到的"苦瘠甲天下"体会愈深。</p>
        <p>我们当地一所乡镇中学开始了支教工作。尽管早有心理准备，但第一次去学生刘欣（化名）家里家访时，我还是吃了一惊：她的父母因残疾丧失劳动能力，年迈的爷爷带了一家七口的经济支柱。那间破旧不堪的土坯房里，几乎没有一件像样的家当！</p>
        <p>看着女孩悲伤无助的眼神，我对她</p>
      </div>
      <div class="col" style="font-size:13px; line-height:1.8;">
        <p>说："什么都别怕，只管努力读书！好学上进的孩子，一定不会被生活困住！"</p>
        <p>我们为刘欣联系了一对一资助人，在学习上不断鼓励她，生活上持续帮助她。刘欣也非常用功，成绩一路上扬。最终考上新疆和田师专数学专业。毕业前夕，她给我打来电话："杨老师，我想留在新疆工作，像您帮助我一样，尽力去帮助更多的人。"现在，她已经是新疆喀什泽普县的一名小学教师。</p>
        <p>就像贵报评论所说，"西部是净化心灵、激励心灵的课堂"。我越来越感到，我带给那里的太少太少，西部给予我的却太多太多：家访时乡亲们那杯热情的眼神，课堂上孩子们专注听讲的神情，支教队共同拼搏的默契……这些经历让我感受到了责任的重量，点燃了我对教育事业的无限热忱，让我获得了精神的洗礼、心灵的成长。</p>
        <p>支教时光在不舍中结束了。回程路上，队友郝帅红着眼眶问我："哥，这趟来收获实在太大了！我总觉得还没待够……你说，咱还能来这里的孩子做些啥？"</p>
      </div>
      <div class="col" style="font-size:13px; line-height:1.8;">
        <p>现在想来，许是那时他心里便已有了打算。2018年，郝帅奔去了家乡高校的工作，拉上我为支教队友的爱人雪梅，又无反顾奔向了新疆喀什。4年多过去，他们分别是喀什地区疏附县什乡中心小学校长、喀什开放大学社区教育服务指导中心教师。</p>
        <p>我打心底里替他们高兴，向他们致敬！</p>
        <p>我也一直和古浪娃娃们保持着联络。他们一个个都从腼腆不敢与陌生人对视的孩子，成长为在各自岗位上独当一面的青年俊才，而其中的大部分，都选择留在西部，去影响更多人……</p>
        <p>就在即将写完这封信的时候，我又收到了刘欣发来的信息："杨老师，光明日报文章里的董宏华老师在新疆！作为同行，他太值得我学习了。新的一年，我要在业务上狠下功夫，把我们泽普的娃娃们教得更好！"</p>
      </div>
    </div>
