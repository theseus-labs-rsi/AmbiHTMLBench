<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习建议</title>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 30px 40px;
    background: #fff;
    color: #333;
    line-height: 1.8;
    font-size: 16px;
  }

  .title-area {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
  }

  .title-area h1 {
    font-size: 42px;
    color: #5ba3d9;
    font-weight: bold;
    letter-spacing: 6px;
    margin: 0;
    text-shadow: 2px 2px 0 #c8dff0;
    position: relative;
    display: inline-block;
  }

  .title-decoration {
    position: relative;
    display: inline-block;
  }

  .title-decoration::before {
    content: "🐱";
    position: absolute;
    top: -10px;
    left: -30px;
    font-size: 20px;
  }

  .title-decoration::after {
    content: "✨";
    position: absolute;
    top: -5px;
    right: -25px;
    font-size: 16px;
  }

  .title-underline {
    width: 280px;
    height: 8px;
    background: linear-gradient(to right, #f0c040, #f5d060, #f0c040);
    margin: 5px auto 0;
    border-radius: 4px;
    position: relative;
  }

  .title-underline::before {
    content: "⭐";
    position: absolute;
    left: -15px;
    top: -5px;
    font-size: 14px;
  }

  .section {
    margin-bottom: 35px;
  }

  .section-header {
    display: flex;
    align-items: baseline;
    margin-bottom: 15px;
  }

  .section-number {
    font-size: 22px;
    color: #c47ab5;
    font-weight: bold;
    margin-right: 20px;
    min-width: 35px;
  }

  .section-title {
    font-size: 20px;
    color: #c47ab5;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .section-body {
    font-size: 17px;
    line-height: 2;
    padding-left: 0;
  }

  .section-body p {
    margin: 8px 0;
  }

  .highlight-yellow {
    background-color: #f5e6a0;
    padding: 2px 4px;
    border-radius: 3px;
  }

  .highlight-red {
    color: #d43030;
    font-weight: bold;
  }

  .attribution {
    text-align: right;
    margin-top: 15px;
    font-size: 16px;
    color: #333;
  }

  .attribution .name {
    font-size: 18px;
  }

  .attribution .note {
    font-size: 14px;
    color: #555;
  }

  .illustration {
    float: right;
    width: 100px;
    height: 120px;
    margin: 10px 0 10px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .illustration .placeholder {
    width: 100px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #999;
  }

  .girl-illustration {
    position: relative;
    width: 100px;
    height: 130px;
  }

  .girl-illustration .banner {
    position: absolute;
    top: 10px;
    left: 5px;
    background: #e83030;
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
    transform: rotate(-5deg);
    white-space: nowrap;
  }

  .girl-illustration .girl-body {
    position: absolute;
    bottom: 0;
    left: 30px;
    width: 40px;
    height: 80px;
    background: #f0c8a0;
    border-radius: 5px 5px 0 0;
  }

  .clearfix::after {
    content: "";
    display: table;
    clear: both;
  }
</style>
</head>
<body>

<div class="title-area">
  <div class="title-decoration">
    <h1>学习建议</h1>
  </div>
  <div class="title-underline"></div>
</div>

<div class="section">
  <div class="section-header">
    <span class="section-number">09</span>
    <span class="section-title">「教材远比练习册重要」</span>
  </div>
  <div class="section-body">
    <p>教材远比练习册重要。</p>
    <p>教材就是我们做题之前所要构建的一个框架，<span class="highlight-yellow">先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。</span></p>
  </div>
  <div class="attribution">
    ——<span class="name">陈哲峰</span><span class="note">(被北京大学物理学院录取)</span>
  </div>
</div>

<div class="section clearfix">
  <div class="section-header">
    <span class="section-number">10</span>
    <span class="section-title">「有关数学与英语的学习方法」</span>
  </div>
  <div class="section-body">
    <p>数学压轴大题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。</p>
    <p>我要保证的，<span class="highlight-red">不是做出难题，而是做到容易题不丢分，难题多得分</span>。最后，我数学只有压轴题扣了分。</p>
  </div>
  <div class="illustration">
    <div class="girl-illustration">
      <div class="banner">高考加油！</div>
      <div style="position:absolute;bottom:0;left:25px;width:50px;height:90px;">
        <div style="width:30px;height:30px;background:#f5c8a0;border-radius:50%;margin:0 auto;"></div>
        <div style="width:35px;height:35px;background:#5ba3d9;border-radius:5px;margin:2px auto;"></div>
        <div style="width:20px;height:25px;background:#f5c8a0;margin:0 auto;"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
