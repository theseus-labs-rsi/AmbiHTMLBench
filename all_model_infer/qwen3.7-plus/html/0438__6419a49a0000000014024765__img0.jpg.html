<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: "SimSun", "STSong", serif;
            background-color: #f5f0e8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .page {
            background-color: #fff;
            max-width: 620px;
            width: 100%;
            padding: 30px 35px 40px 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: relative;
        }
        .question-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .question-number {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            margin-right: 12px;
            line-height: 1.4;
            color: #222;
        }
        .question-text {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }
        .question-sub {
            font-size: 15px;
            color: #333;
            margin-left: 42px;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .handwritten-area {
            margin-top: 10px;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #b0c4de 31px,
                #b0c4de 32px
            );
            background-position: 0 2px;
            padding: 4px 0 0 0;
            line-height: 32px;
        }
        .handwritten-text {
            font-family: "KaiTi", "STKaiti", "楷体", cursive;
            font-size: 22px;
            color: #1a1a2e;
            line-height: 32px;
            letter-spacing: 1px;
        }
        .handwritten-text p {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="question-header">
            <span class="question-number">26</span>
            <span class="question-text">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</span>
        </div>
        <div class="question-sub">她看到了什么呢？</div>
        <div class="handwritten-area">
            <div class="handwritten-text">
                <p>我蹲下来，"这根肋骨让你感</p>
                <p>到不舒服吗？"</p>
                <p>展览台上是一尊白玉莹莹的肋</p>
                <p>骨，下面的文字介绍引用了夏娃</p>
                <p>的来历，说女人都是由肋骨所化。</p>
            </div>
        </div>
    </div>
</body>
</html>
