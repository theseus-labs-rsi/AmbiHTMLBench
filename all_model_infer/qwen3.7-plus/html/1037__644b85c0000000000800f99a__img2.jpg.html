<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑素材</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fdf8e8;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px 24px 36px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .resource {
            text-align: center;
            margin-bottom: 22px;
        }

        .resource:last-child {
            margin-bottom: 0;
        }

        .resource-name {
            font-size: 18px;
            font-weight: 500;
            color: #222;
            margin-bottom: 6px;
        }

        .resource-desc {
            font-size: 15px;
            color: #444;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>视频剪辑素材</h1>
        <div class="card">
            <div class="resource">
                <div class="resource-name">Videezy</div>
                <div class="resource-desc">提供免F高清视频素材、音频素材和音效素材</div>
            </div>
            <div class="resource">
                <div class="resource-name">Coverr</div>
                <div class="resource-desc">每周更新免F高清视频素材库，可以下zai和使用</div>
            </div>
            <div class="resource">
                <div class="resource-name">Pixabay</div>
                <div class="resource-desc">提供免F高清视频素材、照片素材和插图素材，可下zai和使用</div>
            </div>
            <div class="resource">
                <div class="resource-name">Life of Vids</div>
                <div class="resource-desc">提供免F高清视频素材，可以使用</div>
            </div>
            <div class="resource">
                <div class="resource-name">视频中国</div>
                <div class="resource-desc">提供各种类型的免F视频素材，可以按照分类进行检索</div>
            </div>
            <div class="resource">
                <div class="resource-name">无版权素材库</div>
                <div class="resource-desc">提供各种类型的免F剪辑素材，包括视频、音乐、插件等，所有素材均为无版权素材，可自由使用</div>
            </div>
            <div class="resource">
                <div class="resource-name">Pexels Videos</div>
                <div class="resource-desc">提供免F高清视频素材和动画素材，可下zai和使用</div>
            </div>
            <div class="resource">
                <div class="resource-name">找台词</div>
                <div class="resource-desc">可以根据想要的台词找到影视片段</div>
            </div>
        </div>
    </div>
</body>
</html>
