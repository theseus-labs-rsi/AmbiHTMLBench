<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好书推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0eef5;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            color: #333;
            padding: 30px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .section-title {
            background-color: #e8c4c4;
            text-align: center;
            padding: 14px 20px;
            font-size: 26px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .book-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 30px;
        }

        .book-cover {
            flex-shrink: 0;
            width: 200px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #666;
            text-align: center;
            padding: 10px;
        }

        .cover-dharma {
            background-color: #c0392b;
            color: #f5e6c8;
            position: relative;
        }

        .cover-dharma .cover-title-cn {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .cover-dharma .cover-title-en {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .cover-dharma .cover-author {
            font-size: 11px;
            margin-top: 8px;
        }

        .cover-dharma .cover-illustration {
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, #c0392b 0%, #c0392b 60%, #2c2c2c 60%, #2c2c2c 100%);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .cover-underland {
            background: linear-gradient(135deg, #2d5016 0%, #8b6914 30%, #c47a2a 50%, #d4943a 60%, #8b4513 80%, #3d2b1f 100%);
            color: #fff;
            position: relative;
        }

        .cover-underland .cover-title-en {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .cover-underland .cover-subtitle {
            font-size: 13px;
            margin-top: 2px;
        }

        .cover-underland .cover-title-cn-large {
            font-size: 36px;
            font-weight: bold;
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            letter-spacing: 8px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .book-info {
            flex: 1;
            padding-top: 5px;
        }

        .book-info .rating {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
        }

        .book-info .tagline {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .book-info .description {
            font-size: 17px;
            line-height: 1.9;
            color: #444;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            font-size: 18px;
            color: #555;
            letter-spacing: 6px;
            font-style: italic;
        }

        .footer .grit {
            font-family: Georgia, serif;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- First Book Section -->
    <div class="section-title">《达摩流浪者》</div>

    <div class="book-row">
        <div class="book-cover">
            <div class="book-cover-placeholder cover-dharma">
                <div class="cover-title-cn">达摩流浪者</div>
                <div class="cover-title-en">THE<br>DHARMA<br>BUMS</div>
                <div class="cover-author">by JACK KEROUAC</div>
                <div class="cover-illustration"></div>
            </div>
        </div>
        <div class="book-info">
            <div class="rating">评分：8.5</div>
            <div class="tagline">永远年轻，永远热泪盈眶</div>
            <div class="description">
                相信每个理想主义的nfper，每个在庸碌生活中迷茫的人，每个还没被社会总开关控制的人，都会被书中纯净又赤诚的灵魂打动。
            </div>
        </div>
    </div>

    <!-- Second Book Section -->
    <div class="section-title">《深时之旅》</div>

    <div class="book-row">
        <div class="book-cover">
            <div class="book-cover-placeholder cover-underland">
                <div class="cover-title-en">UNDERLAND</div>
                <div class="cover-subtitle">A Deep Time Journey</div>
                <div class="cover-title-cn-large">深时之旅</div>
            </div>
        </div>
        <div class="book-info">
            <div class="rating">评分：8.7</div>
            <div class="tagline">地下，有另外一个世界！</div>
            <div class="description">
                作者以充满灵性的语言，描绘了地下世界一个又一个奇妙的科学现象，神秘的传说和感人的故事。天呐！惊叹，将是你的主旋律
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        分享好书的 <span class="grit">Grit</span>
    </div>

</body>
</html>
