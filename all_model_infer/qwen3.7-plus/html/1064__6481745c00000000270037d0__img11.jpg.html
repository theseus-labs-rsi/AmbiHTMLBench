<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话题、主题意义、主题的联系与区别</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    background: #f0f0f0;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .title-box {
    border: 2px solid #333;
    padding: 15px 20px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
    background: #fff;
  }
  .title-box .sub {
    font-size: 18px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    background: #fff;
  }
  table th, table td {
    border: 1px solid #ccc;
    padding: 10px 12px;
    text-align: center;
    font-size: 15px;
  }
  table thead th {
    background: #b8b830;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
  }
  table thead th:first-child {
    background: #b8b830;
  }
  .corner-header {
    position: relative;
  }
  .corner-header .dim {
    position: absolute;
    bottom: 2px;
    left: 5px;
    font-size: 13px;
  }
  .corner-header .concept {
    position: absolute;
    top: 2px;
    right: 5px;
    font-size: 13px;
  }
  table tbody td:first-child {
    background: #b8b830;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
  }
  table tbody tr:nth-child(even) td:not(:first-child) {
    background: #f5f5e8;
  }
  .middle-text {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #333;
    margin: 30px 0;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    line-height: 1.5;
  }
  .middle-text .highlight {
    color: #222;
  }
  .title-box2 {
    border: 2px solid #333;
    padding: 12px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 20px auto 30px;
    background: #fff;
    max-width: 500px;
  }
  .diagram-container {
    position: relative;
    width: 100%;
    height: 280px;
    margin: 20px 0;
  }
  .step {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .step-box {
    padding: 12px 16px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: #333;
    position: relative;
  }
  .step-box .label {
    font-size: 18px;
    font-weight: bold;
    margin-top: 4px;
  }
  .step-box .sub-label {
    font-size: 13px;
    color: #fff;
    margin-top: 2px;
  }
  .step1 {
    left: 0;
    bottom: 0;
    width: 220px;
  }
  .step1 .step-box {
    background: #4a7fb5;
    color: #fff;
    width: 100%;
  }
  .step1 .step-box .label { color: #fff; }
  .step1 .desc-box {
    background: #c8c840;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
    width: 200px;
    text-align: center;
  }
  .step2 {
    left: 200px;
    bottom: 40px;
    width: 240px;
  }
  .step2 .step-box {
    background: #e8a820;
    color: #fff;
    width: 100%;
  }
  .step2 .step-box .label { color: #fff; }
  .step2 .desc-box {
    background: #c8c840;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
    width: 220px;
    text-align: center;
  }
  .step3 {
    left: 420px;
    bottom: 80px;
    width: 260px;
  }
  .step3 .step-box {
    background: #8ab840;
    color: #fff;
    width: 100%;
  }
  .step3 .step-box .label { color: #fff; }
  .step3 .desc-box {
    background: #c8c840;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
    width: 240px;
    text-align: center;
  }
  .arrow-container {
    position: relative;
    width: 100%;
    height: 200px;
    margin: 10px 0 20px;
  }
  .arrow-bar {
    position: absolute;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
  }
  .arrow-bar.blue {
    background: #4a7fb5;
    bottom: 0;
    left: 0;
    width: 300px;
  }
  .arrow-bar.orange {
    background: #e8a820;
    bottom: 50px;
    left: 150px;
    width: 350px;
  }
  .arrow-bar.green {
    background: #8ab840;
    bottom: 100px;
    left: 300px;
    width: 380px;
  }
  .arrow-bar .arrow-head {
    position: absolute;
    right: -30px;
    width: 0;
    height: 0;
    border-top: 25px solid transparent;
    border-bottom: 25px solid transparent;
  }
  .arrow-bar.blue .arrow-head { border-left: 30px solid #4a7fb5; }
  .arrow-bar.orange .arrow-head { border-left: 30px solid #e8a820; }
  .arrow-bar.green .arrow-head { border-left: 30px solid #8ab840; }
  .arrow-bar .bar-label {
    font-size: 13px;
    margin-top: 2px;
  }
  .citation {
    text-align: right;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
  }
  .diagram-wrapper {
    position: relative;
    margin: 20px 0;
  }
  .stepped-diagram {
    display: flex;
    align-items: flex-end;
    gap: 0;
    position: relative;
    height: 220px;
    padding: 10px 0;
  }
  .step-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .step-block .top-label {
    font-size: 15px;
    font-weight: bold;
    color: #333;
    text-align: center;
    margin-bottom: 5px;
    line-height: 1.4;
  }
  .step-block .color-bar {
    width: 100%;
    padding: 10px 15px;
    text-align: center;
    color: #fff;
    font-weight: bold;
    font-size: 17px;
    position: relative;
  }
  .step-block .color-bar .sub {
    font-size: 13px;
    font-weight: normal;
    display: block;
    margin-top: 3px;
  }
  .step-block .color-bar::after {
    content: '';
    position: absolute;
    right: -20px;
    top: 0;
    width: 0;
    height: 0;
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
  }
  .sb1 { width: 250px; }
  .sb1 .color-bar { background: #4a7fb5; height: 50px; display: flex; flex-direction: column; justify-content: center; }
  .sb1 .color-bar::after { border-left: 20px solid #4a7fb5; }
  .sb1 .top-label-box { background: #c8c840; padding: 8px 12px; margin-bottom: 5px; font-size: 15px; font-weight: bold; }
  .sb2 { width: 260px; margin-left: -20px; }
  .sb2 .color-bar { background: #e8a820; height: 50px; display: flex; flex-direction: column; justify-content: center; }
  .sb2 .color-bar::after { border-left: 20px solid #e8a820; }
  .sb2 .top-label-box { background: #c8c840; padding: 8px 12px; margin-bottom: 5px; font-size: 15px; font-weight: bold; }
  .sb3 { width: 280px; margin-left: -20px; }
  .sb3 .color-bar { background: #8ab840; height: 50px; display: flex; flex-direction: column; justify-content: center; }
  .sb3 .color-bar::after { border-left: 20px solid #8ab840; }
  .sb3 .top-label-box { background: #c8c840; padding: 8px 12px; margin-bottom: 5px; font-size: 15px; font-weight: bold; }
  .big-arrow {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 40px solid transparent;
    border-bottom: 40px solid transparent;
    border-left: 50px solid #4a7fb5;
    opacity: 0.3;
  }
  .diagram-flex {
    display: flex;
    align-items: flex-end;
    position: relative;
    padding: 10px 0 20px;
  }
  .diagram-flex .col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .diagram-flex .col .desc {
    background: #c8c840;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .diagram-flex .col .bar {
    padding: 12px 20px;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-align: center;
    position: relative;
    min-width: 180px;
  }
  .diagram-flex .col .bar .sub {
    font-size: 13px;
    font-weight: normal;
    display: block;
    margin-top: 3px;
  }
  .diagram-flex .col .bar::after {
    content: '';
    position: absolute;
    right: -18px;
    top: 0;
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
  }
  .col1 .bar { background: #4a7fb5; }
  .col1 .bar::after { border-left: 18px solid #4a7fb5; }
  .col2 { margin-left: -18px; }
  .col2 .bar { background: #e8a820; }
  .col2 .bar::after { border-left: 18px solid #e8a820; }
  .col3 { margin-left: -18px; }
  .col3 .bar { background: #8ab840; }
  .col3 .bar::after { border-left: 18px solid #8ab840; }
  .col1 { margin-bottom: 0; }
  .col2 { margin-bottom: 40px; }
  .col3 { margin-bottom: 80px; }
  .right-arrow-group {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-30%);
  }
  .right-arrow-group .ra {
    width: 0;
    height: 0;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
    border-left: 40px solid;
    margin-bottom: -10px;
    opacity: 0.5;
  }
  .ra1 { border-left-color: #8ab840 !important; }
  .ra2 { border-left-color: #e8a820 !important; }
  .ra3 { border-left-color: #4a7fb5 !important; }
</style>
</head>
<body>
