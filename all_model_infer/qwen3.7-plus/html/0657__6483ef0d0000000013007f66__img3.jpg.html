<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专四写作规律</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  .main-title {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    color: #f5d800;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    margin: 20px 0 30px;
    letter-spacing: 2px;
  }
  .section-title {
    text-align: center;
    background: #b8d4a0;
    display: inline-block;
    padding: 4px 20px;
    font-size: 16px;
    font-weight: bold;
    margin: 0 auto 10px;
    border-radius: 2px;
  }
  .section-title-wrapper {
    text-align: center;
    margin-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  table th, table td {
    border: 1px solid #333;
    padding: 8px 12px;
    text-align: center;
    font-size: 15px;
  }
  table th {
    font-weight: bold;
    background: #fff;
  }
  .table-wrapper {
    position: relative;
  }
  .brace-group {
    position: absolute;
    right: -30px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .brace {
    font-size: 60px;
    color: #e88;
    line-height: 1;
    font-family: serif;
  }
  .brace-small {
    font-size: 40px;
    color: #e88;
    line-height: 1;
    font-family: serif;
  }
  .red-circle {
    display: inline-block;
    border: 2px dashed #e88;
    border-radius: 50%;
    padding: 2px 8px;
    color: #333;
  }
  .red-circle-solid {
    display: inline-block;
    border: 2px solid #e88;
    border-radius: 50%;
    padding: 1px 6px;
    color: #333;
  }
  .highlight-red {
    color: #c0392b;
  }
  .table-row-wrapper {
    position: relative;
    display: flex;
    align-items: stretch;
  }
  .table-container {
    flex: 1;
  }
  .brace-column {
    width: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .brace-svg {
    width: 30px;
    height: 100%;
  }
  .second-title {
    text-align: center;
    font-size: 36px;
    font-weight: bold;
    color: #f5d800;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    margin: 30px 0 20px;
    letter-spacing: 2px;
  }
  .hr-line {
    border: none;
    border-top: 2px solid #333;
    margin: 10px 0;
  }
  .note-text {
    font-size: 14px;
    color: #333;
    text-align: left;
    padding-left: 10px;
  }
  .table2 td:first-child {
    font-weight: bold;
    text-align: left;
    width: 120px;
  }
  .table2 td:nth-child(2) {
    text-align: left;
    width: 200px;
  }
  .table2 td:nth-child(3) {
    text-align: left;
  }
  .pink-text {
    color: #c0392b;
  }
  .row-group-1 {
    position: relative;
  }
  .row-group-2 {
    position: relative;
  }
  .brace-overlay {
    position: absolute;
    right: -25px;
    top: 0;
    bottom: 0;
    width: 25px;
  }
  .outer-wrapper {
    position: relative;
    padding-right: 35px;
  }
  .brace-mark {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 30px;
  }
  .brace-mark svg {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="main-title">-专四写作规律-</div>

<div class="section-title-wrapper">
  <span class="section-title">专四写作历年真题</span>
</div>

<div class="outer-wrapper" style="position:relative;">
  <table>
    <thead>
      <tr>
        <th>年份</th>
        <th>题目</th>
        <th>类别</th>
        <th>题型</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>2016</td>
        <td>上学期间外出旅游是否该禁止</td>
        <td>教育类</td>
        <td>立场类（二选一）</td>
      </tr>
      <tr>
        <td>2017</td>
        <td>人工智能是否会取代人脑</td>
        <td>科技类</td>
        <td>立场类（二选一）</td>
      </tr>
      <tr>
        <td>2018</td>
        <td>土著权益和环境保护负面作用</td>
        <td>人文+环保类</td>
        <td>论述类（给定观点）</td>
      </tr>
      <tr>
        <td>2019</td>
        <td>儿童屏幕使用时间</td>
        <td>科技+教育类</td>
        <td>论述类（给定观点）</td>
      </tr>
      <tr>
        <td>2020(未考)</td>
        <td>/</td>
        <td>/</td>
        <td>/</td>
      </tr>
      <tr>
        <td>2021</td>
        <td>孤独与智慧的关系</td>
        <td>心理类</td>
        <td>论述类（两者关系）</td>
      </tr>
      <tr>
        <td>2022</td>
        <td>如何提高环保意识</td>
        <td>环保类</td>
        <td><span class="red-circle">提议类</span></td>
      </tr>
    </tbody>
  </table>

  <!-- Brace for 2016-2017 -->
  <svg style="position:absolute; right:-5px; top:38px; width:25px; height:72px;" viewBox="0 0 25 72">
    <path d="M20,2 Q5,2 5,10 L5,26 Q5,34 12,36 Q5,38 5,46 L5,62 Q5,70 20,70" fill="none" stroke="#e88" stroke-width="2.5"/>
  </svg>

  <!-- Brace for 2019-2022 -->
  <svg style="position:absolute; right:-5px; top:152px; width:25px; height:148px;" viewBox="0 0 25 148">
    <path d="M20,2 Q5,2 5,10 L5,68 Q5,74 12,74 Q5,74 5,80 L5,138 Q5,146 20,146" fill="none" stroke="#e88" stroke-width="2.5"/>
  </svg>
</div>

<div class="second-title">-2023专四写作-</div>

<hr class="hr-line">

<div class="section-title-wrapper">
  <span class="section-title">2023 年专四写作</span>
</div>

<table class="table2">
  <tbody>
    <tr>
      <td><strong>热门类别</strong></td>
      <td class="pink-text">科技类、教育类、人文类</td>
      <td>连续年份<span class="red-circle-solid">不会</span>考同类话题</td>
    </tr>
    <tr>
      <td><strong>热门题型</strong></td>
      <td class="pink-text">提议类</td>
      <td>连续年份<span class="red-circle-solid">具有</span>延续性</td>
    </tr>
  </tbody>
</table>

</body>
</html>
