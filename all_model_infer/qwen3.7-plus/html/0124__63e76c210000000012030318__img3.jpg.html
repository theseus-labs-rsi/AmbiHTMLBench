<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Notebook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Ma+Shan+Zheng&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #3a3a3a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Caveat', cursive;
  }

  .notebook-page {
    background-color: #f5f0e8;
    width: 620px;
    min-height: 820px;
    padding: 30px 40px 40px 50px;
    position: relative;
    box-shadow: 2px 4px 15px rgba(0,0,0,0.4);
    border-radius: 2px;
  }

  .notebook-page::before {
    content: '';
    position: absolute;
    left: 42px;
    top: 0;
    bottom: 0;
    width: 2px;
    background-color: #e8a0a0;
    opacity: 0.5;
  }

  .line {
    border-bottom: 1px solid #b8c8d8;
    padding: 10px 0 8px 0;
    display: flex;
    align-items: baseline;
    min-height: 42px;
  }

  .word-col {
    flex: 1;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: #2a3a8a;
    padding-left: 10px;
    font-weight: 600;
  }

  .def-col {
    flex: 1.2;
    font-family: 'Ma Shan Zheng', 'Caveat', cursive;
    font-size: 22px;
    color: #1a1a2e;
    padding-right: 10px;
  }

  .group-separator {
    border-bottom: 1.5px solid #8a9ab0;
    margin: 2px 0;
  }

  .group {
    margin-bottom: 4px;
  }

  .group:last-child {
    margin-bottom: 0;
  }

  .word-col .pos {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: #1a1a2e;
    font-weight: 400;
  }
</style>
</head>
<body>

<div class="notebook-page">

  <!-- Group 1 -->
  <div class="group">
    <div class="line">
      <div class="word-col">charity</div>
      <div class="def-col"><span class="pos">n.</span> 慈善机构</div>
    </div>
    <div class="line">
      <div class="word-col">clarity</div>
      <div class="def-col"><span class="pos">n.</span> (思路,图像)清晰</div>
    </div>
    <div class="line group-separator">
      <div class="word-col">clarify</div>
      <div class="def-col"><span class="pos">v.</span> 阐明,解释</div>
    </div>
  </div>

  <!-- Group 2 -->
  <div class="group">
    <div class="line">
      <div class="word-col">consistent</div>
      <div class="def-col"><span class="pos">adj.</span> 一贯的,与…一致的</div>
    </div>
    <div class="line">
      <div class="word-col">resist</div>
      <div class="def-col"><span class="pos">v.</span> 抵制</div>
    </div>
    <div class="line group-separator">
      <div class="word-col">insist</div>
      <div class="def-col"><span class="pos">v.</span> 坚持</div>
    </div>
  </div>

  <!-- Group 3 -->
  <div class="group">
    <div class="line">
      <div class="word-col">insert</div>
      <div class="def-col"><span class="pos">v.</span> 插入,嵌入</div>
    </div>
    <div class="line group-separator">
      <div class="word-col">assert</div>
      <div class="def-col"><span class="pos">v.</span> 断言;坚持主张</div>
    </div>
  </div>

  <!-- Group 4 -->
  <div class="group">
    <div class="line">
      <div class="word-col">eminent</div>
      <div class="def-col"><span class="pos">adj.</span> 杰出的</div>
    </div>
    <div class="line">
      <div class="word-col">prominent</div>
      <div class="def-col"><span class="pos">adj.</span> 杰出的,重要的</div>
    </div>
    <div class="line group-separator">
      <div class="word-col">eliminate</div>
      <div class="def-col"><span class="pos">v.</span> 消除;淘汰</div>
    </div>
  </div>

  <!-- Group 5 -->
  <div class="group">
    <div class="line">
      <div class="word-col">integral</div>
      <div class="def-col"><span class="pos">adj.</span> 必不可少的</div>
    </div>
    <div class="line">
      <div class="word-col">integrity</div>
      <div class="def-col"><span class="pos">n.</span> 诚实,正直</div>
    </div>
    <div class="line group-separator">
      <div class="word-col">integrate</div>
      <div class="def-col"><span class="pos">v.</span> (使)融入</div>
    </div>
  </div>

  <!-- Group 6 -->
  <div class="group">
    <div class="line">
      <div class="word-col">fabricate</div>
      <div class="def-col"><span class="pos">v.</span> 捏造</div>
    </div>
    <div class="line">
      <div class="word-col">fluctuate</div>
      <div class="def-col"><span class="pos">v.</span> 波动,上下浮动</div>
    </div>
  </div>

</div>

</body>
</html>
