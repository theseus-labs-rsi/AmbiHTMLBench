<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高效背书</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #4a7c59;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    max-width: 560px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .title-bar {
    background-color: #5a8a6a;
    color: #fff;
    text-align: center;
    padding: 14px 20px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    margin: 16px 20px 0;
    border-radius: 8px;
  }

  .divider {
    border: none;
    border-top: 1.5px solid #ccc;
    margin: 12px 20px;
  }

  .content {
    padding: 10px 24px 20px;
  }

  .section-title {
    font-size: 18px;
    font-weight: bold;
    color: #4a7c59;
    margin-top: 18px;
    margin-bottom: 6px;
  }

  .section-text {
    font-size: 15px;
    color: #333;
    line-height: 1.7;
    margin-bottom: 4px;
  }

  .example-box {
    background: #fffde7;
    border-left: 4px solid #f9a825;
    padding: 12px 14px;
    margin: 10px 0 14px;
    border-radius: 4px;
  }

  .example-line {
    font-size: 14px;
    line-height: 1.8;
    color: #333;
  }

  .example-line .label {
    font-weight: bold;
    color: #333;
  }

  .highlight-yellow {
    background-color: #fff176;
    padding: 1px 3px;
    border-radius: 2px;
  }

  .bottom-bar {
    border-top: 1.5px solid #ccc;
    margin: 10px 20px 0;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 2px solid #ddd;
    font-size: 28px;
  }

  .speech-bubble {
    flex: 1;
    background: #fff;
    border: 1.5px solid #ccc;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 15px;
    color: #333;
    position: relative;
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    border: 8px solid transparent;
    border-right-color: #ccc;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    left: -7px;
    top: 50%;
    transform: translateY(-50%);
    border: 7px solid transparent;
    border-right-color: #fff;
  }

  .play-btn {
    width: 44px;
    height: 44px;
    background: #4a7c59;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .play-btn::after {
    content: '';
    display: block;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }

  .footer {
    text-align: right;
    padding: 6px 24px 14px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title-bar">高效背书</div>
  <hr class="divider">

  <div class="content">
    <div class="section-title">01.理解背诵</div>
    <div class="section-text">还有几天考试，很多东西还没背。不要慌张，先理解再背诵，考试运用得心应手</div>

    <div class="section-title">02.关键复述</div>
    <div class="section-text">边读边画关键词，再把关键词抄在草稿纸上。把内容都遮住，然后就看自己写在草稿纸上的关键词，进行复述</div>

    <div class="example-box">
      <div class="example-line"><span class="label">原文：</span>德思礼夫妇总是得意地说他们是非常规矩的人家</div>
      <div class="example-line"><span class="label">关键：</span><span class="highlight-yellow">德思礼夫妇</span> + <span class="highlight-yellow">得意</span> + <span class="highlight-yellow">非常规矩</span></div>
      <div class="example-line"><span class="label">复述：</span>德思礼夫妇得意地说他们是非常规矩的一家</div>
    </div>

    <div class="section-title">03.关键背诵</div>
    <div class="section-text">这样就背关键词，考试的时候也能顺利展开内容</div>

    <div class="section-title">04.睡觉记忆</div>
    <div class="section-text">睡前30分钟再复习背诵的内容。睡醒后10分钟，再看关键词进行复述，并默写出来</div>
  </div>

  <div class="bottom-bar">
    <div class="avatar">🧑‍🎓</div>
    <div class="speech-bubble">这样背书，就像用了魔法，过目不忘</div>
    <div class="play-btn"></div>
  </div>

  <div class="footer">小红书号: 4141895475</div>
</div>

</body>
</html>
