<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals & Objectives</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: right;
            color: #4a2c2a;
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-weight: normal;
        }

        h2 {
            text-align: center;
            color: #4a2c2a;
            font-size: 1.8rem;
            margin-bottom: 60px;
            font-weight: normal;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            grid-template-rows: auto auto;
            gap: 20px 10px;
            align-items: center;
        }

        /* Left Column: Goals */
        .goals-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .goal-item {
            font-size: 2rem;
            color: #137c7c; /* Teal color */
            margin: 15px 0;
            font-weight: 500;
        }

        .group-1 {
            margin-bottom: 40px; /* Space between groups */
        }

        /* Middle Column: Graphics */
        .graphics-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bracket-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }

        .bracket {
            border: 5px solid #4a2c2a;
            border-left: none;
            border-radius: 0 8px 8px 0;
            position: absolute;
            left: 0;
        }

        .bracket-large {
            height: 220px;
            width: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .bracket-small {
            height: 130px;
            width: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .arrow-wrapper {
            position: absolute;
            right: -60px; /* Push arrow to the right of the bracket */
            display: flex;
            align-items: center;
        }

        /* Right Column: Labels */
        .labels-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .label-text {
            color: #4a2c2a;
            font-size: 1.8rem;
            line-height: 1.3;
        }

        /* Specific Grid Placements */
        .row-1-goals { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: center; }
        .row-1-graphics { grid-column: 2; grid-row: 1; height: 250px; position: relative; }
        .row-1-labels { grid-column: 3; grid-row: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 20px;}

        .row-2-goals { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; justify-content: center; margin-top: 20px;}
        .row-2-graphics { grid-column: 2; grid-row: 2; height: 150px; position: relative; margin-top: 20px;}
        .row-2-labels { grid-column: 3; grid-row: 2; display: flex; align-items: center; justify-content: flex-start; padding-left: 20px; margin-top: 20px;}

        /* SVG Arrow Styling */
        .arrow-svg {
            width: 80px;
            height: 50px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Goals & Objectives</h1>
        <h2>From January 1, 2016 – December 31, 2018, we will:</h2>

        <div class="layout-grid">
            
            <!-- Row 1: Goals 1-3 -->
            <div class="row-1-goals">
                <div class="goal-item">Goal 1: XX</div>
                <div class="goal-item">Goal 2: XX</div>
                <div class="goal-item">Goal 3: XX</div>
            </div>

            <div class="row-1-graphics">
                <div class="bracket bracket-large"></div>
                <div class="arrow-wrapper" style="right: -70px; top: 50%; transform: translateY(-50%);">
                    <svg class="arrow-svg" viewBox="0 0 80 50" xmlns="http://www.w3.org/2000/svg">
                        <!-- Arrow pointing left -->
                        <polygon points="80,15 25,15 25,0 0,25 25,50 25,35 80,35" fill="#137c7c" />
                    </svg>
                </div>
            </div>

            <div class="row-1-labels">
                <div class="label-text">
                    Theory<br>of<br>Change<br>Goals
                </div>
            </div>

            <!-- Row 2: Goals 4-5 -->
            <div class="row-2-goals">
                <div class="goal-item">Goal 4: Money</div>
                <div class="goal-item">Goal 5: People & Infrastructure</div>
            </div>

            <div class="row-2-graphics">
                <div class="bracket bracket-small"></div>
                <div class="arrow-wrapper" style="right: -70px; top: 50%; transform: translateY(-50%);">
                    <svg class="arrow-svg" viewBox="0 0 80 50" xmlns="http://www.w3.org/2000/svg">
                        <!-- Arrow pointing left -->
                        <polygon points="80,15 25,15 25,0 0,25 25,50 25,35 80,35" fill="#137c7c" />
                    </svg>
                </div>
            </div>

            <div class="row-2-labels">
                <div class="label-text">
                    Organization<br>Goals
                </div>
            </div>

        </div>
    </div>

</body>
</html>
