<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMEP Asgari Ücret Poster</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #c8c4be;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
  }

  .poster {
    width: 600px;
    max-width: 100%;
    background: #fff;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
  }

  .top-section {
    background-color: #f5d920;
    padding: 30px 30px 35px 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .bullet-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .bullet-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .pin {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    margin-top: 2px;
    position: relative;
  }

  .pin::before {
    content: '';
    display: block;
    width: 14px;
    height: 14px;
    background: #d42b2b;
    border-radius: 50%;
    position: absolute;
    top: 0;
    left: 4px;
  }

  .pin::after {
    content: '';
    display: block;
    width: 4px;
    height: 10px;
    background: #888;
    position: absolute;
    bottom: 0;
    left: 9px;
    border-radius: 0 0 2px 2px;
  }

  .bullet-text {
    font-size: 32px;
    font-weight: 900;
    color: #1a1a1a;
    line-height: 1.2;
  }

  .graphic-area {
    width: 220px;
    height: 200px;
    flex-shrink: 0;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .graphic-placeholder {
    width: 200px;
    height: 190px;
    background: #e8772e;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .graphic-placeholder .chart-arrow {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 120px;
    height: 100px;
  }

  .graphic-placeholder .coin {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 55px;
    height: 55px;
    background: #f5d920;
    border-radius: 50%;
    border: 3px solid #c9a800;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: 900;
    color: #fff;
  }

  .graphic-placeholder .stacked-coins {
    position: absolute;
    bottom: 15px;
    right: 20px;
    width: 70px;
    height: 50px;
    background: #f5d920;
    border-radius: 4px;
    border: 2px solid #c9a800;
  }

  .graphic-placeholder .pencil {
    position: absolute;
    top: 5px;
    left: 15px;
    width: 80px;
    height: 12px;
    background: #d42b2b;
    transform: rotate(-30deg);
    border-radius: 2px;
  }

  .middle-section {
    background-color: #fff;
    padding: 30px 30px 25px 30px;
  }

  .middle-text {
    font-size: 42px;
    font-weight: 900;
    color: #c41e2a;
    line-height: 1.25;
  }

  .red-banner {
    background-color: #c41e2a;
    padding: 22px 30px;
  }

  .red-banner-text {
    font-size: 52px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
  }

  .bottom-section {
    background-color: #fff;
    padding: 25px 30px 30px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .org-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logo-placeholder {
    width: 90px;
    height: 90px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .gear {
    width: 85px;
    height: 85px;
    background: #c41e2a;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .gear::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #c41e2a;
    border-radius: 50%;
    clip-path: polygon(
      50% 0%, 55% 0%, 58% 5%, 62% 2%, 68% 8%, 65% 12%, 72% 15%, 70% 20%,
      78% 22%, 75% 28%, 82% 32%, 78% 37%, 85% 42%, 80% 47%, 87% 52%, 82% 57%,
      87% 62%, 82% 67%, 85% 72%, 78% 77%, 80% 82%, 72% 85%, 70% 90%, 65% 92%,
      62% 98%, 55% 100%, 50% 100%, 45% 100%, 38% 98%, 35% 92%, 30% 90%, 25% 85%,
      22% 82%, 15% 85%, 18% 77%, 12% 72%, 18% 67%, 13% 62%, 18% 57%, 13% 52%,
      18% 47%, 12% 42%, 18% 37%, 15% 32%, 22% 28%, 20% 22%, 28% 20%, 30% 15%,
      35% 12%, 32% 8%, 38% 2%, 42% 5%, 45% 0%
    );
  }

  .globe-inner {
    width: 50px;
    height: 50px;
    background: #f5d920;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
    font-size: 16px;
    font-weight: 900;
    color: #c41e2a;
    border: 2px solid #c41e2a;
  }

  .org-text {
    display: flex;
    flex-direction: column;
  }

  .org-name {
    font-size: 30px;
    font-weight: 900;
    color: #c41e2a;
    line-height: 1.15;
  }

  .org-sub {
    font-size: 18px;
    font-weight: 700;
    color: #c41e2a;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 5px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    color: #c41e2a;
    font-weight: 600;
  }

  .icon-box {
    width: 32px;
    height: 32px;
    border: 2.5px solid #c41e2a;
    border-radius: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    font-weight: 900;
    color: #c41e2a;
  }

  .icon-circle {
    width: 32px;
    height: 32px;
    border: 2.5px solid #c41e2a;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    color: #c41e2a;
  }

  .icon-circle svg {
    width: 16px;
    height: 16px;
    fill: #c41e2a;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Top Yellow Section -->
  <div class="top-section">
    <div class="bullet-list">
      <div class="bullet-item">
        <div class="pin"></div>
        <div class="bullet-text">Enflasyon<br>yükseliyor</div>
      </div>
      <div class="bullet-item">
        <div class="pin"></div>
        <div class="bullet-text">TL değer<br>kaybediyor</div>
      </div>
      <div class="bullet-item">
        <div class="pin"></div>
        <div class="bullet-text">Ücretler eriyor</div>
      </div>
    </div>
    <div class="graphic-area">
      <div class="graphic-placeholder">
        <div class="pencil"></div>
        <svg class="chart-arrow" viewBox="0 0 120 100" style="position:absolute;top:5px;right:5px;">
          <polyline points="10,80 40,60 60,70 90,20 110,10" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <polygon points="100,5 115,10 105,20" fill="#c41e2a"/>
          <line x1="100" y1="5" x2="110" y2="10" stroke="#c41e2a" stroke-width="4"/>
        </svg>
        <div class="coin">1</div>
        <div class="stacked-coins"></div>
      </div>
    </div>
  </div>

  <!-- Middle White Section -->
  <div class="middle-section">
    <div class="middle-text">Vergiden muaf,<br>insanca yaşanacak</div>
  </div>

  <!-- Red Banner -->
  <div class="red-banner">
    <div class="red-banner-text">ASGARİ ÜCRET!</div>
  </div>

  <!-- Bottom Section -->
  <div class="bottom-section">
    <div class="org-info">
      <div class="logo-placeholder">
        <div class="gear">
          <div class="globe-inner">EMEP</div>
        </div>
      </div>
      <div class="org-text">
        <div class="org-name">EMEK<br>PARTİSİ</div>
        <div class="org-sub">Ankara İl Örgütü</div>
      </div>
    </div>

    <div class="contact-row">
      <div class="contact-item">
        <div class="icon-box">f</div>
        <span>/ankaraemep</span>
      </div>
      <div class="contact-item">
        <div class="icon-box" style="border-radius:8px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#c41e2a" stroke-width="2.5">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="17.5" cy="6.5" r="1.5" fill="#c41e2a" stroke="none"/>
          </svg>
        </div>
        <span>@emepankara</span>
      </div>
      <div class="contact-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
        </div>
        <span>0 (312) 232 41 97</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
