<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fff;
    color: #222;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px 30px 40px;
  }

  .notebook-holes {
    display: flex;
    justify-content: space-around;
    padding: 10px 0 15px;
    border-bottom: none;
  }

  .hole {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #ccc;
    background: #f5f5f5;
  }

  .content-wrapper {
    display: flex;
    margin-top: 10px;
  }

  .sidebar {
    flex-shrink: 0;
    width: 60px;
    margin-right: 20px;
  }

  .step-badge {
    width: 56px;
    height: 90px;
    background: linear-gradient(135deg, #1a1a2e, #e94560, #0f3460);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    line-height: 1.3;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .main-content {
    flex: 1;
  }

  h1 {
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .subtitle {
    text-align: center;
    font-size: 15px;
    color: #555;
    margin-bottom: 30px;
  }

  .section {
    display: flex;
    align-items: flex-start;
    margin-bottom: 35px;
  }

  .icon-placeholder {
    flex-shrink: 0;
    width: 70px;
    height: 70px;
    margin-right: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-memory {
    border: 3px solid #333;
    border-radius: 6px;
    width: 60px;
    height: 65px;
    position: relative;
    background: #fff;
  }

  .icon-memory::before {
    content: '';
    position: absolute;
    top: 0;
    left: 8px;
    right: 8px;
    height: 12px;
    border-bottom: 2px solid #333;
  }

  .icon-memory::after {
    content: '';
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 20px;
    height: 16px;
    border: 2px solid #333;
    border-radius: 2px;
  }

  .icon-cpu {
    width: 65px;
    height: 65px;
    border: 3px solid #333;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    position: relative;
    background: #fff;
  }

  .icon-cpu::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 10px;
    right: 10px;
    height: 4px;
    background: #333;
    border-radius: 1px;
  }

  .icon-cpu::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 10px;
    right: 10px;
    height: 4px;
    background: #333;
    border-radius: 1px;
  }

  .cpu-pins-left, .cpu-pins-right {
    position: absolute;
    top: 10px;
    bottom: 10px;
    width: 4px;
    background: #333;
  }

  .cpu-pins-left { left: -6px; }
  .cpu-pins-right { right: -6px; }

  .icon-4k {
    width: 60px;
    height: 65px;
    background: #333;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
  }

  .icon-4k .label-4k {
    font-size: 22px;
    line-height: 1.1;
  }

  .icon-4k .label-uhd {
    font-size: 14px;
    line-height: 1.1;
    margin-top: 2px;
  }

  .section-text {
    flex: 1;
  }

  .section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .section-desc {
    font-size: 15px;
    line-height: 1.7;
    color: #333;
  }

  .section-desc .note {
    color: #555;
  }
</style>
</head>
<body>

<div class="notebook-holes">
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>
</div>

<div class="content-wrapper">
  <div class="sidebar">
    <div class="step-badge">
      第<br>二<br>步
    </div>
  </div>

  <div class="main-content">
    <h1>三大核心参数解读</h1>
    <p class="subtitle">内存/芯片/分辨率参数解读</p>

    <div class="section">
      <div class="icon-placeholder">
        <div class="icon-memory"></div>
      </div>
      <div class="section-text">
        <div class="section-title">1.看内存</div>
        <div class="section-desc">
          内存越大速度越快，小于8GB不建议购买。<span class="note">（画圈：GB≠Gb，大GB是小Gb的8倍，尽量选择大GB）</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="icon-placeholder">
        <div class="icon-cpu">
          <span class="cpu-pins-left"></span>
          <span class="cpu-pins-right"></span>
          CPU
        </div>
      </div>
      <div class="section-text">
        <div class="section-title">2.看芯片</div>
        <div class="section-desc">
          主流芯片A73和A53。追求性能玩游戏选A73，看看电视想省电选A53。
        </div>
      </div>
    </div>

    <div class="section">
      <div class="icon-placeholder">
        <div class="icon-4k">
          <span class="label-4k">4K</span>
          <span class="label-uhd">UHD</span>
        </div>
      </div>
      <div class="section-text">
        <div class="section-title">3.看分辨率</div>
        <div class="section-desc">
          分辨率越高越清晰。<span class="note">（目前电视基本都是超高清4K也就是3840×2160的分辨率）</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
