<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 破晓艺术跨界展览</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .poster {
    width: 600px;
    min-height: 1060px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    padding: 40px 40px 50px 40px;
  }

  /* Grid lines background */
  .poster::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(to right, rgba(200,200,210,0.15) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(200,200,210,0.15) 1px, transparent 1px);
    background-size: 100px 100px;
    pointer-events: none;
    z-index: 0;
  }

  /* Large faint NEW text */
  .bg-new {
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 160px;
    font-weight: 900;
    color: rgba(220, 220, 230, 0.5);
    letter-spacing: 10px;
    z-index: 0;
    line-height: 1;
  }

  /* Large faint YEAR text */
  .bg-year {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 140px;
    font-weight: 900;
    color: rgba(220, 220, 230, 0.45);
    letter-spacing: 15px;
    z-index: 0;
    line-height: 1;
  }

  /* Circular shapes */
  .circle-1 {
    position: absolute;
    top: 150px;
    right: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(230, 230, 240, 0.3);
    z-index: 0;
  }

  .circle-2 {
    position: absolute;
    top: 180px;
    right: -30px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 1px solid rgba(200, 200, 215, 0.3);
    z-index: 0;
  }

  .circle-3 {
    position: absolute;
    bottom: 200px;
    left: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(230, 230, 240, 0.25);
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .dash-top {
    width: 30px;
    height: 5px;
    background: #1a237e;
    margin-bottom: 10px;
  }

  .year-2026 {
    font-size: 72px;
    font-weight: 900;
    color: #1a237e;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .title-block {
    background: #1a237e;
    display: inline-block;
    padding: 8px 16px;
    position: relative;
    margin-bottom: 5px;
  }

  .title-block::after {
    content: '破晓艺术';
    position: absolute;
    top: 4px;
    left: 16px;
    font-size: 48px;
    font-weight: 900;
    color: #e91e63;
    z-index: -1;
  }

  .title-block span {
    font-size: 48px;
    font-weight: 900;
    color: #ffffff;
    position: relative;
    z-index: 1;
  }

  .main-title {
    font-size: 130px;
    font-weight: 900;
    color: #1a237e;
    line-height: 1.05;
    letter-spacing: 5px;
  }

  .main-title-bottom {
    position: relative;
    display: inline-block;
  }

  .main-title-bottom::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: -5px;
    right: -5px;
    height: 30px;
    background: #e91e63;
    z-index: -1;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 30px;
    margin-bottom: 20px;
  }

  .price-block {
    text-align: left;
  }

  .price {
    font-size: 42px;
    font-weight: 900;
    color: #e91e63;
    line-height: 1.2;
  }

  .price .yen {
    font-size: 24px;
    vertical-align: super;
  }

  .price .qi {
    font-size: 22px;
    font-weight: 700;
  }

  .price-label {
    font-size: 18px;
    color: #333;
    margin-top: 2px;
  }

  .time-block {
    text-align: right;
  }

  .time-label {
    font-size: 20px;
    color: #333;
    margin-bottom: 5px;
  }

  .time-dates {
    font-size: 42px;
    font-weight: 900;
    color: #e91e63;
    line-height: 1.2;
  }

  .time-dash {
    width: 20px;
    height: 4px;
    background: #e91e63;
    margin: 2px auto;
    display: block;
  }

  .location-block {
    text-align: right;
    margin-top: 10px;
  }

  .location-label {
    font-size: 20px;
    color: #333;
    margin-bottom: 5px;
  }

  .location-dash {
    width: 20px;
    height: 4px;
    background: #1a237e;
    margin: 5px auto 5px auto;
    display: block;
  }

  .location-name {
    font-size: 24px;
    font-weight: 700;
    color: #1a237e;
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 60px;
  }

  .organizer-block {
    text-align: left;
  }

  .organizer-label {
    font-size: 18px;
    color: #333;
  }

  .organizer-name {
    font-size: 26px;
    font-weight: 700;
    color: #1a237e;
    margin-top: 3px;
  }

  .contact-block {
    text-align: right;
  }

  .contact-label {
    font-size: 18px;
    color: #333;
  }

  .contact-phone {
    font-size: 28px;
    font-weight: 900;
    color: #1a237e;
    margin-top: 3px;
    letter-spacing: 2px;
  }

  .bottom-dash-left {
    width: 25px;
    height: 5px;
    background: #1a237e;
    margin-top: 20px;
  }

  .bottom-dash-right {
    width: 25px;
    height: 5px;
    background: #1a237e;
    margin-top: 10px;
    margin-left: auto;
  }

  .middle-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .left-col {
    flex: 1;
  }

  .right-col {
    flex: 1;
    text-align: right;
    padding-top: 20px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="bg-new">NEW</div>
  <div class="bg-year">YEAR</div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>

  <div class="content">
    <div class="dash-top"></div>

    <div class="year-2026">2026</div>

    <div class="title-block">
      <span>破晓艺术</span>
    </div>

    <div class="main-title">跨界</div>
    <div class="main-title main-title-bottom">展览</div>

    <div class="middle-section">
      <div class="left-col">
        <div class="price-block" style="margin-top: 40px;">
          <div class="price"><span class="yen">¥</span> 60<span class="qi">起</span></div>
          <div class="price-label">单人票价</div>
        </div>
      </div>
      <div class="right-col">
        <div class="time-block">
          <div class="time-label">活动时间</div>
          <div class="time-dates">01/01</div>
          <span class="time-dash"></span>
          <div class="time-dates">01/03</div>
        </div>
        <div class="location-block" style="margin-top: 30px;">
          <span class="location-dash"></span>
          <div class="location-label">活动地点</div>
          <div class="location-name">厦门湖里区稿定艺术馆</div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="organizer-block">
        <div class="organizer-label">主办方：</div>
        <div class="organizer-name">稿定集团</div>
        <div class="bottom-dash-left"></div>
      </div>
      <div class="contact-block">
        <div class="contact-label">联系电话</div>
        <div class="contact-phone">0592-88888888</div>
        <div class="bottom-dash-right"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
