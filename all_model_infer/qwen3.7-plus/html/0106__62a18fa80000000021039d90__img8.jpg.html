<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #f5e6e0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background-color: #f0f0f0;
    border-radius: 16px;
    padding: 20px 24px 28px;
    max-width: 560px;
    width: 100%;
    border: 2px solid #c8d8e0;
  }
  .main-title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #2c2c2c;
    border: 3px solid #a8c8d8;
    border-radius: 12px;
    padding: 10px 20px;
    margin-bottom: 18px;
    background: #fff;
    display: inline-block;
    width: 100%;
  }
  .main-title .qmark {
    display: inline-block;
    background: #f5c842;
    color: #333;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 28px;
    margin-left: 4px;
    vertical-align: middle;
  }
  .section-title {
    font-size: 20px;
    font-weight: bold;
    color: #2c2c2c;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title .icon {
    font-size: 18px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 18px;
    font-size: 15px;
  }
  table th {
    background-color: #5a6a7a;
    color: #fff;
    padding: 10px 8px;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
  }
  table td {
    padding: 10px 8px;
    text-align: center;
    border: 1px solid #ccc;
    background: #fff;
    vertical-align: middle;
  }
  .table2 th {
    background-color: #3a7a8a;
  }
  .summary-box {
    background-color: #c0392b;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 10px;
    float: right;
  }
  .annotation {
    font-size: 13px;
    color: #555;
    font-style: italic;
    margin-top: 2px;
  }
  .highlight-text {
    background: #e8f5e9;
    border: 1px solid #4caf50;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 14px;
    color: #2e7d32;
    display: inline-block;
    margin-top: 4px;
  }
  .circle-annotation {
    position: relative;
    display: inline-block;
  }
  .circle-annotation::before {
    content: '';
    position: absolute;
    top: -4px;
    left: -6px;
    right: -6px;
    bottom: -4px;
    border: 2px solid #e88;
    border-radius: 50%;
    pointer-events: none;
  }
  .row-highlight {
    position: relative;
  }
  .section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .red-text {
    color: #c0392b;
    font-weight: bold;
  }
  .green-check {
    color: #4caf50;
  }
  .clearfix::after {
    content: '';
    display: table;
    clear: both;
  }
  .bottom-note {
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="main-title">
    猫砂都有哪些款<span class="qmark">❓</span>
  </div>

  <div class="section-title">
    <span class="icon">📍</span> 三种猫砂尺寸哪个是你最爱
  </div>

  <table>
    <thead>
      <tr>
        <th>尺寸</th>
        <th>重量</th>
        <th>结团效果</th>
        <th>其他</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1.5mm</td>
        <td>轻</td>
        <td>上</td>
        <td>易带出，价格略高</td>
      </tr>
      <tr>
        <td>
          <span class="circle-annotation">2mm</span>
          <div class="annotation">综合性价比推荐</div>
        </td>
        <td>中</td>
        <td>中</td>
        <td>综合性价比高</td>
      </tr>
      <tr>
        <td>3mm</td>
        <td>重</td>
        <td>67</td>
        <td>推荐度低，但价格也低</td>
      </tr>
    </tbody>
  </table>

  <div class="section-header-row clearfix">
    <div class="section-title" style="margin-bottom:0;">
      <span class="icon">📍</span> 猫砂都有哪些种类
    </div>
    <div class="summary-box">总结：2mm混合砂yyds</div>
  </div>

  <table class="table2">
    <thead>
      <tr>
        <th>种类</th>
        <th>优点</th>
        <th>其他</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>膨润土</td>
        <td>价格低廉</td>
        <td>粉尘大</td>
      </tr>
      <tr>
        <td>豆腐猫砂</td>
        <td>原料更安全，闻起来也比较好</td>
        <td>价格偏高，纯豆腐结团略差</td>
      </tr>
      <tr>
        <td>
          <span class="circle-annotation">混合猫砂</span>
        </td>
        <td>结合上述优点，价格适中</td>
        <td>比例推荐<span class="red-text">7:3</span>或<span class="red-text">6:4</span>，结团快且用量省</td>
      </tr>
      <tr>
        <td>沸石</td>
        <td>可循环利用</td>
        <td>需要自己洗</td>
      </tr>
      <tr>
        <td>其他新型原料</td>
        <td>价格高，新颖</td>
        <td>效果待考核，贵</td>
      </tr>
    </tbody>
  </table>

  <div class="bottom-note">
    <span class="highlight-text">⬆️普通养宠家庭足以满足需求<span class="green-check">✅</span></span>
  </div>
</div>
</body>
</html>
