<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月经来潮需停药 - 缓解痛经</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #fff;
    color: #333;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px;
    line-height: 1.8;
    font-size: 15px;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 12px;
    color: #666;
  }
  .status-bar .icons {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .status-bar .time {
    font-size: 13px;
  }
  .close-btn {
    font-size: 24px;
    color: #333;
    margin: 10px 0 15px 0;
    cursor: pointer;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .section-badge {
    background: #c9a0dc;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
  }
  .section-title {
    font-size: 18px;
    font-weight: bold;
    color: #6b3fa0;
  }
  .section-text {
    font-size: 15px;
    line-height: 1.9;
    color: #333;
    margin-bottom: 30px;
  }
  .section2-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 30px 0 25px 0;
    gap: 0;
  }
  .section2-number {
    font-size: 48px;
    font-weight: bold;
    color: #7b5ea7;
    line-height: 1;
    position: relative;
  }
  .section2-number::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    height: 3px;
    background: #7b5ea7;
  }
  .section2-label {
    border: 2px solid #7b5ea7;
    padding: 4px 14px;
    font-size: 16px;
    color: #7b5ea7;
    font-weight: bold;
    margin-left: -5px;
    background: #fff;
  }
  .body-text {
    font-size: 15px;
    line-height: 1.9;
    color: #333;
    margin-bottom: 20px;
  }
  .common-plan-btn {
    display: inline-flex;
    align-items: center;
    background: #7b5ea7;
    color: #fff;
    padding: 6px 18px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    margin-bottom: 15px;
    position: relative;
  }
  .common-plan-btn::after {
    content: '›';
    font-size: 22px;
    margin-left: 4px;
    font-weight: bold;
  }
  .method-list {
    margin-top: 15px;
  }
  .method-item {
    font-size: 15px;
    line-height: 1.9;
    color: #333;
    margin-bottom: 18px;
  }
  .method-item strong {
    font-weight: normal;
  }
</style>
</head>
<body>

<div class="status-bar">
  <div class="icons">
    <span>📶</span>
    <span>📡</span>
    <span>🔔</span>
  </div>
  <div class="time">🔋 19:43</div>
</div>

<div class="close-btn"></div>

<div class="section-header">
  <div class="section-badge">5</div>
  <div class="section-title">月经来潮需停药</div>
</div>

<div class="section-text">
  药物推迟月经可能会失败，服药过程中如月经来潮需停药。
</div>

<div class="section2-header">
  <div class="section2-number">2</div>
  <div class="section2-label">缓解痛经</div>
</div>

<div class="body-text">
  如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。
</div>

<div class="common-plan-btn">常用方案</div>

<div class="body-text">
  痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。
</div>

<div class="body-text">
  以下三种方法，选其中一种方法即可：
</div>

<div class="method-list">
  <div class="method-item">
    1.布洛芬 首剂 800 mg，之后根据需要 400～800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。
  </div>
  <div class="method-item">
    2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。
  </div>
</div>

</body>
</html>
