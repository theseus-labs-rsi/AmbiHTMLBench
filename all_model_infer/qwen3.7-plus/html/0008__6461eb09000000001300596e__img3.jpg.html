<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具 - 游戏界面</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .game-scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #0d1117 0%, #1a2332 40%, #2a3a4a 70%, #3a4a5a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .game-scene::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(ellipse at 50% 80%, rgba(60, 80, 90, 0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 50%, rgba(30, 40, 50, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(30, 40, 50, 0.5) 0%, transparent 50%);
  }

  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: linear-gradient(180deg, #2a3a4a 0%, #3a4a5a 30%, #4a5a6a 100%);
    clip-path: polygon(0% 100%, 100% 100%, 95% 0%, 5% 0%);
  }

  .chest-area {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .chest-placeholder {
    width: 120px;
    height: 80px;
    background: linear-gradient(180deg, #3a6a5a 0%, #2a5a4a 50%, #1a4a3a 100%);
    border: 2px solid #4a7a6a;
    border-radius: 4px;
    position: relative;
  }

  .chest-placeholder::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background: #8a7a3a;
    border-radius: 2px;
  }

  .character-placeholder {
    width: 40px;
    height: 70px;
    position: absolute;
    bottom: 0;
    left: -30px;
  }

  .dialog-overlay {
    position: relative;
    z-index: 10;
    width: 520px;
    background: rgba(40, 50, 60, 0.92);
    border: 1px solid rgba(120, 140, 160, 0.4);
    border-radius: 6px;
    padding: 24px 28px 20px;
    box-shadow: 0 0 40px rgba(100, 130, 160, 0.15), 0 0 80px rgba(80, 110, 140, 0.1);
    backdrop-filter: blur(4px);
  }

  .dialog-content {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .item-icon {
    flex-shrink: 0;
    width: 80px;
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .mask-icon {
    width: 60px;
    height: 60px;
    position: relative;
  }

  .mask-icon .mask-face {
    width: 50px;
    height: 45px;
    background: linear-gradient(135deg, #c0392b 0%, #e74c3c 30%, #f39c12 60%, #e67e22 100%);
    border-radius: 50% 50% 45% 45%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
  }

  .mask-icon .mask-face::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 10px;
    width: 10px;
    height: 10px;
    background: #2c3e50;
    border-radius: 50%;
    box-shadow: 20px 0 0 #2c3e50;
  }

  .mask-icon .mask-face::after {
    content: '';
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 6px;
    background: #2c3e50;
    border-radius: 0 0 50% 50%;
  }

  .mask-rays {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
  }

  .mask-rays::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 12px;
    background: #f1c40f;
    box-shadow: 
      0 58px 0 #f1c40f,
      -25px 10px 0 #e67e22,
      25px 10px 0 #e67e22,
      -25px 48px 0 #e67e22,
      25px 48px 0 #e67e22,
      -15px -5px 0 #f39c12,
      15px -5px 0 #f39c12,
      -15px 63px 0 #f39c12,
      15px 63px 0 #f39c12;
  }

  .item-info {
    flex: 1;
  }

  .item-title {
    font-size: 20px;
    font-weight: bold;
    color: #e8e8e8;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .item-quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .quantity-icon {
    width: 22px;
    height: 22px;
    background: rgba(100, 120, 140, 0.5);
    border: 1px solid rgba(140, 160, 180, 0.4);
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .quantity-icon svg {
    width: 14px;
    height: 14px;
    fill: #aabbcc;
  }

  .quantity-number {
    font-size: 16px;
    color: #c0c8d0;
    background: rgba(60, 70, 80, 0.6);
    padding: 2px 10px;
    border-radius: 3px;
    border: 1px solid rgba(100, 120, 140, 0.3);
  }

  .item-description {
    font-size: 14px;
    color: #a0aab4;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  .dialog-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
    padding-top: 10px;
  }

  .open-button {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #b0b8c0;
    cursor: pointer;
  }

  .button-icon {
    width: 20px;
    height: 20px;
    border: 1.5px solid #8899aa;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
    color: #8899aa;
  }

  .particles {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(200, 210, 220, 0.3);
    border-radius: 50%;
  }

  .particle:nth-child(1) { top: 10%; left: 15%; }
  .particle:nth-child(2) { top: 20%; left: 75%; }
  .particle:nth-child(3) { top: 35%; left: 45%; }
  .particle:nth-child(4) { top: 50%; left: 85%; }
  .particle:nth-child(5) { top: 65%; left: 25%; }
  .particle:nth-child(6) { top: 75%; left: 60%; }
  .particle:nth-child(7) { top: 15%; left: 50%; }
  .particle:nth-child(8) { top: 40%; left: 10%; }
  .particle:nth-child(9) { top: 55%; left: 90%; }
  .particle:nth-child(10) { top: 80%; left: 40%; }
</style>
</head>
<body>
<div class="game-scene">
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="floor"></div>

  <div class="chest-area">
    <div class="chest-placeholder"></div>
    <div class="character-placeholder"></div>
  </div>

  <div class="dialog-overlay">
    <div class="dialog-content">
      <div class="item-icon">
        <div class="mask-icon">
          <div class="mask-rays"></div>
          <div class="mask-face"></div>
        </div>
      </div>
      <div class="item-info">
        <div class="item-title">魔吉拉的面具</div>
        <div class="item-quantity">
          <div class="quantity-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <span class="quantity-number">1</span>
        </div>
        <div class="item-description">
          从太古时期流传下来的面具。<br>
          戴上它的话，有时就能改变面具发现自己。<br>
          这样的饰品并非轻易就能得到。
        </div>
      </div>
    </div>
    <div class="dialog-footer">
      <div class="open-button">
        打开箱子
        <span class="button-icon">A</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
