<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 金句合集系列</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SimSun", "STSong", "Songti SC", serif;
            background-color: #f5f0e8;
            color: #2c2c2c;
            max-width: 700px;
            margin: 0 auto;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 20px 10px 20px;
            background-color: #f5f0e8;
            border-bottom: 2px solid #333;
        }

        .header-left {
            flex: 1;
        }

        .logo {
            font-family: "KaiTi", "STKaiti", "楷体", cursive;
            font-size: 72px;
            color: #c0392b;
            line-height: 1;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .logo-sub {
            font-family: "Times New Roman", serif;
            font-size: 14px;
            color: #c0392b;
            letter-spacing: 3px;
            margin-top: 2px;
        }

        .header-right {
            text-align: right;
            padding-top: 5px;
        }

        .header-right-top {
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .header-right-top span {
            margin: 0 2px;
        }

        .header-right-bottom {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            border-top: 2px solid #333;
            padding-top: 8px;
            margin-top: 5px;
        }

        .content {
            background-color: #d4c9a8;
            padding: 30px 25px 40px 25px;
            min-height: 600px;
        }

        .quote-block {
            margin-bottom: 30px;
        }

        .quote-number {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
        }

        .quote-text {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1.6;
            margin-left: 10px;
        }

        .quote-line {
            display: flex;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .quote-line .quote-number {
            white-space: nowrap;
            margin-right: 5px;
        }

        .quote-line .quote-text {
            flex: 1;
        }

        .quote-second-line {
            font-size: 28px;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1.6;
            margin-left: 40px;
            margin-bottom: 15px;
        }

        .explanation-label {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .explanation-text {
            font-size: 15px;
            color: #444;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .divider {
            border: none;
            border-top: 1px solid #b8a88a;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="logo">人民日报</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="header-right">
            <div class="header-right-top">金句<span>|</span>素材<span>|</span>摘抄</div>
            <div class="header-right-bottom">金句合集系列</div>
        </div>
    </div>

    <div class="content">

        <div class="quote-block">
            <div class="quote-line">
                <span class="quote-number">1、</span>
                <span class="quote-text">愿你千山暮雪海棠依旧，</span>
            </div>
            <div class="quote-second-line">不为岁月惊扰平添忧愁。</div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝与琐事而烦恼忧愁。</div>
        </div>

        <div class="quote-block">
            <div class="quote-line">
                <span class="quote-number">2、</span>
                <span class="quote-text">总有人间一两风，</span>
            </div>
            <div class="quote-second-line">填我十万八千梦。</div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。</div>
        </div>

        <div class="quote-block">
            <div class="quote-line">
                <span class="quote-number">3、</span>
                <span class="quote-text">日出有盼，日落有思，</span>
            </div>
            <div class="quote-second-line">平平安安，所遇皆甜。</div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。</div>
        </div>

    </div>

</body>
</html>
