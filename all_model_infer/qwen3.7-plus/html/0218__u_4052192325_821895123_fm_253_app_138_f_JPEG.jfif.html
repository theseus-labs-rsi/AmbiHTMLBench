    <div class="article-text">
      <p>A Tory MP and former health minister has staged a dramatic defection to Labour, saying the Conservatives have become a "nationalist party of the right" that has abandoned compassion and no longer prioritises the NHS.</p>
      <p>Dr Dan Poulter, the MP for Central Suffolk and North Ipswich, who works part-time as a mental health doctor in an NHS hospital, announced in an exclusive interview with the Observer that he was resigning as a Tory MP and would be taking the Labour whip until the next election.</p>
      <p>He said he would not seek re-election to the House of Commons at the next general election. But, writing in today's Observer, he says he envisages a role advising the Labour party on its policies on mental health while focusing more on his NHS work.</p>
      <p>Poulter said his experiences on more than 20 night shifts over the last year in a severely overstretched accident and emergency department had been "truly life-changing" and persuaded him to defect to the only party he believed was now really committed to investing in improving the NHS.</p>
      <p>He said: "I could not go on as part of that. I have to be able to look my NHS colleagues in the eye, my patients in the eye and my constituents in the eye. And I know that the Conservative government has been failing on the thing I care about most, which is the NHS and its patients."</p>
      <p>The Observer understands that discussions between Poulter and senior Labour figures have been going on for many months at the highest levels about the timing and organisation of his likely defection, as well as advisory roles he could play in future in developing the party's health policies, with the benefit of his firsthand inside knowledge.</p>
    </div>

    <div class="byline">Jon Ungoed-Thomas<br>&amp; Robin McKie</div>
    <div class="article-body">
      <p>A commercial blood product at the centre of the biggest treatment scandal in the history of the NHS was approved for use after government officials were told convicts were among the paid donors and virus contamination "should be assumed", corporate filings reveal.</p>
      <p>The product, given to haemophiliacs in the 1970s and '80s to enable their blood to clot, was injected into thousands of UK patients, including young children, who were then infected with HIV and hepatitis C.</p>
      <p>A single batch could contain plasma from 20,000 donors harvested in US prisons and some of the poorest neighbourhoods of the US, where drug use and sexual infections were rife. One infected donation would contaminate the entire batch.</p>
