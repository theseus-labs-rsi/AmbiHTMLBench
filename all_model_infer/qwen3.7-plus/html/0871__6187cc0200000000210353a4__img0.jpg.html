<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRIFE IS LIFE - I LOVE YOU THREE THOUSAND</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Georgia&family=Noto+Serif+SC:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 600px;
    height: 800px;
    margin: 0 auto;
    background: #fdf6f0;
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
  }

  .poster {
    width: 100%;
    height: 100%;
    position: relative;
    background: #fdf6f0;
  }

  /* Abstract watercolor background shapes */
  .bg-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    pointer-events: none;
  }

  .bg-shape-1 {
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 40%, transparent 70%);
    top: -50px;
    right: -100px;
  }

  .bg-shape-2 {
    width: 400px;
    height: 600px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 30%, transparent 65%);
    top: 100px;
    right: -50px;
  }

  .bg-shape-3 {
    width: 350px;
    height: 400px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 35%, transparent 60%);
    bottom: -50px;
    left: -50px;
  }

  .bg-shape-4 {
    width: 300px;
    height: 350px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 30%, transparent 60%);
    bottom: 50px;
    left: 50px;
  }

  .bg-shape-5 {
    width: 250px;
    height: 300px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 35%, transparent 65%);
    top: 200px;
    left: 100px;
  }

  .bg-shape-6 {
    width: 200px;
    height: 250px;
    background: radial-gradient(ellipse, #f0c9a0 0%, #f5d9b8 30%, transparent 60%);
    top: 50px;
    left: 200px;
  }

  /* Top left info */
  .top-left {
    position: absolute;
    top: 20px;
    left: 30px;
    z-index: 10;
  }

  .top-left .date {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: #e8772e;
    letter-spacing: 2px;
  }

  .top-left .designer {
    font-family: 'Georgia', serif;
    font-size: 11px;
    color: #e8772e;
    letter-spacing: 1.5px;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Top right title */
  .top-right {
    position: absolute;
    top: 15px;
    right: 25px;
    text-align: right;
    z-index: 10;
  }

  .top-right .title-main {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    color: #e8772e;
    letter-spacing: 3px;
    line-height: 1.2;
  }

  .top-right .title-sub {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: #e8772e;
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .top-right .chinese-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: #e8772e;
    letter-spacing: 4px;
    margin-top: 10px;
    line-height: 1.8;
  }

  /* Large vertical text - left side */
  .vertical-text-left {
    position: absolute;
    left: 20px;
    top: 130px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .vertical-text-left .love-you {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: #e8772e;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 8px;
    line-height: 1;
    transform: rotate(180deg);
  }

  .vertical-text-left .three-thousand {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: #e8772e;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 8px;
    line-height: 1;
    transform: rotate(180deg);
    margin-left: 15px;
  }

  /* Vertical text - right side */
  .vertical-text-right {
    position: absolute;
    right: 25px;
    top: 200px;
    z-index: 10;
  }

  .vertical-text-right .augenstern {
    font-family: 'Georgia', serif;
    font-size: 14px;
    color: #e8772e;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 12px;
    line-height: 1;
  }

  .vertical-text-right .line {
    width: 1px;
    height: 120px;
    background: #e8772e;
    margin: 10px auto 0;
    opacity: 0.5;
  }

  /* Bottom quote */
  .bottom-quote {
    position: absolute;
    bottom: 70px;
    right: 30px;
    text-align: right;
    z-index: 10;
  }

  .bottom-quote p {
    font-family: 'Georgia', serif;
    font-size: 13px;
    color: #e8772e;
    line-height: 1.6;
    font-style: italic;
  }

  /* Bottom banner */
  .bottom-banner {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 10;
  }

  .bottom-banner span {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    background: #e8772e;
    padding: 6px 16px;
    letter-spacing: 2px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="poster">
  <!-- Background shapes -->
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>
  <div class="bg-shape bg-shape-4"></div>
  <div class="bg-shape bg-shape-5"></div>
  <div class="bg-shape bg-shape-6"></div>

  <!-- Top left -->
  <div class="top-left">
    <div class="date">11/07</div>
    <div class="designer">DESIGNED BY<br>KERRILEE</div>
  </div>

  <!-- Top right -->
  <div class="top-right">
    <div class="title-main">BRIFE IS LIFE</div>
    <div class="title-sub">BUT LOVE IS LONG</div>
    <div class="chinese-text">
      你要知道生命虽短，但爱却绵长<br>
      爱你三千遍
    </div>
  </div>

  <!-- Large vertical text left -->
  <div class="vertical-text-left">
    <div class="love-you">I LOVE YOU</div>
    <div class="three-thousand">THREE THOUSAND</div>
  </div>

  <!-- Vertical text right -->
  <div class="vertical-text-right">
    <div class="augenstern">AUGENSTERN</div>
    <div class="line"></div>
  </div>

  <!-- Bottom quote -->
  <div class="bottom-quote">
    <p>Life was like a box of chocolates,<br>you never know what you are gonna get.</p>
  </div>

  <!-- Bottom banner -->
  <div class="bottom-banner">
    <span>YOU GOTTA HAVE LITTLE FAITH</span>
  </div>
</div>
</body>
</html>
