<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一招，请不断尝试独立赚钱这件事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            padding: 20px;
        }

        .page {
            background-color: #ffffff;
            max-width: 680px;
            width: 100%;
            padding: 30px 35px 40px 35px;
            position: relative;
        }

        .header-bar {
            background-color: #1a1a1a;
            padding: 14px 20px;
            margin-bottom: 25px;
        }

        .header-bar h1 {
            color: #00d4aa;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .content {
            font-size: 16px;
            line-height: 1.8;
            color: #222;
        }

        .bullet-item {
            margin-bottom: 18px;
            padding-left: 10px;
            position: relative;
        }

        .bullet-item::before {
            content: "•";
            position: absolute;
            left: -10px;
            font-size: 18px;
            color: #222;
        }

        .highlight {
            background-color: #f5e642;
            padding: 1px 3px;
            display: inline;
        }

        .highlight-block {
            background-color: #f5e642;
            padding: 2px 4px;
            display: inline;
        }

        .info-box {
            background-color: #d4f0f0;
            padding: 16px 18px;
            margin-top: 20px;
            font-size: 15px;
            line-height: 1.8;
            color: #222;
        }

        .nav-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .nav-text {
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .nav-arrow {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 36px solid #00c9a7;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header-bar">
            <h1>第一招，请不断尝试独立赚钱这件事</h1>
        </div>

        <div class="content">
            <div class="bullet-item">
                这是一个最差的时代，同时也是最好的时代。<span class="highlight">这是你唯一存在的一个时代，你没得选</span>
            </div>

            <div class="bullet-item">
                我至今都记得我在其他平台D视频带货的一单团购2.6元的佣金，比在公司直播GMV破千万都开心，目前收入还不行，坚持中，有结果了就分享
            </div>

            <div class="bullet-item">
                但是这个过程，经历过可能更重要
            </div>

            <div class="bullet-item">
                独立赚钱，是建立个人和市场自由交换的能力，在这个时代，有太多选择
            </div>

            <div class="bullet-item">
                不过在<span class="highlight">没有经过独立项目赚到钱之前，你以为的都是错的。</span>
            </div>

            <div class="bullet-item">
                <span class="highlight-block">看的再多，不如实干一个。</span>
            </div>

            <div class="info-box">
                并不是说带货就好，最合适的项目只有自己知道，但是不管怎么找项目，下场弄脏双手最重要<br>
                （来自于筛选了30个项目，还是尝试了第一个项目的乱水）
            </div>
        </div>

        <div class="nav-bottom">
            <span class="nav-text">下一页</span>
            <div class="nav-arrow"></div>
        </div>
    </div>
</body>
</html>
