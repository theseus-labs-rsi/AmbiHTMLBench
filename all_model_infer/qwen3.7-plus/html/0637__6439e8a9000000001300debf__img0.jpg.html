<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30天学会自然拼读 - 数音节与划分音节</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .poster {
    width: 700px;
    background: #fff;
    border: 4px solid #e74c3c;
    border-radius: 12px;
    padding: 20px 25px 30px;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .poster::before {
    content: '';
    position: absolute;
    top: -8px; left: -8px; right: -8px; bottom: -8px;
    border: 6px solid #f39c12;
    border-radius: 16px;
    z-index: -1;
  }
  .poster::after {
    content: '';
    position: absolute;
    top: -16px; left: -16px; right: -16px; bottom: -16px;
    border: 4px solid #3498db;
    border-radius: 20px;
    z-index: -2;
  }

  /* Decorative flowers top-right */
  .flowers {
    position: absolute;
    top: -10px;
    right: 10px;
    font-size: 40px;
    z-index: 5;
  }

  /* Title banner */
  .title-banner {
    background: linear-gradient(135deg, #f8a4b8, #f48fb1);
    text-align: center;
    padding: 12px 30px;
    border-radius: 8px;
    margin: 10px auto 20px;
    max-width: 420px;
    position: relative;
  }
  .title-banner h1 {
    font-size: 28px;
    color: #333;
    font-weight: bold;
    letter-spacing: 2px;
  }

  /* Section 1: Syllable Counting */
  .section1 {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
    align-items: flex-start;
  }
  .section1-left {
    flex: 1;
    min-width: 260px;
  }
  .section1-right {
    flex: 1;
    min-width: 260px;
  }

  .label-blue {
    display: inline-block;
    background: #a8d8ea;
    color: #2c3e50;
    font-size: 26px;
    font-weight: bold;
    padding: 6px 22px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .label-green {
    display: inline-block;
    background: #c8e6a0;
    color: #2c3e50;
    font-size: 26px;
    font-weight: bold;
    padding: 6px 22px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .cartoon-people {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 36px;
  }
  .person {
    width: 50px;
    height: 55px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .person-icon {
    font-size: 40px;
  }

  .definition-box {
    background: #fde8e8;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.7;
    color: #333;
  }

  .syllable-title {
    font-family: 'Comic Sans MS', cursive;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
  }

  .word-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 30px;
  }
  .word-item {
    font-size: 22px;
    font-weight: bold;
    padding: 4px 0;
  }
  .word-item .red { color: #e74c3c; }
  .word-item .black { color: #333; }

  /* Section 2: Syllable Division */
  .section2 {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    align-items: flex-start;
  }
  .section2-left {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  .section2-right {
    flex: 1;
    min-width: 260px;
  }

  .poem-box {
    background: #fde8e8;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    margin-top: 10px;
  }

  .cartoon-boy {
    position: absolute;
    right: -10px;
    bottom: -10px;
    font-size: 80px;
  }

  .hearts {
    position: absolute;
    right: -30px;
    top: 50%;
    font-size: 24px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* Bottom section */
  .bottom-section {
    text-align: center;
    margin-top: 10px;
    position: relative;
  }
  .good-text {
    font-family: 'Comic Sans MS', cursive;
    font-size: 28px;
    font-weight: bold;
    color: #f39c12;
    letter-spacing: 3px;
  }
  .bear-area {
    font-size: 50px;
    margin-top: 5px;
  }

  .watermark {
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-top: 8px;
  }

  .green-bar {
    height: 12px;
    background: #d4ed9a;
    border-radius: 6px;
    margin: 15px 0 10px;
  }

  .section-divider {
    margin: 10px 0;
  }

  /* Syllable highlighting */
  .syl-red { color: #e74c3c; }
  .syl-black { color: #333; }

  .word-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .word-col {
    font-size: 22px;
    font-weight: bold;
    flex: 1;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Decorative flowers -->
  <div class="flowers">🌸🌼🌸</div>

  <!-- Title -->
  <div class="title-banner">
    <h1>30天学会自然拼读</h1>
  </div>

  <!-- Section 1: Syllable Counting -->
  <div class="section1">
    <div class="section1-left">
      <div class="label-blue">数音节</div>
      <div class="cartoon-people">
        <div class="person">👩🏿</div>
        <div class="person">👩🏻</div>
        <div class="person">👩🏽</div>
        <div class="person">👩🏼</div>
      </div>
      <div class="definition-box">
        有几个发音的元音（或元音组合）就有几个音节。
      </div>
    </div>
    <div class="section1-right">
      <div class="syllable-title">Syllable Counting</div>
      <div class="word-grid">
        <div class="word-item"><span class="black">cat</span></div>
        <div class="word-item"><span class="red">cake</span></div>
        <div class="word-item"><span class="red">rain</span></div>
        <div class="word-item"><span class="red">row</span></div>
        <div class="word-item"><span class="red">robot</span></div>
        <div class="word-item"><span class="red">teacher</span></div>
        <div class="word-item"><span class="red">table</span></div>
        <div class="word-item"><span class="red">apple</span></div>
      </div>
    </div>
  </div>

  <!-- Section 2: Syllable Division -->
  <div class="section2">
    <div class="section2-left">
      <div class="label-green">划分音节</div>
      <div class="poem-box">
        有时一靠后，<br>
        常常二分手。<br>
        组合共发音，<br>
        一起被分走。<br>
        词根词缀分离，<br>
        多音节词不易，<br>
        还请多练多听。
      </div>
      <div class="cartoon-boy">🧑</div>
    </div>
    <div class="section2-right" style="position:relative;">
      <div class="syllable-title">Syllable Division</div>
      <div class="word-grid">
        <div class="word-item"><span class="red">rabbit</span></div>
        <div class="word-item"><span class="red">basket</span></div>
        <div class="word-item"><span class="red">baby</span></div>
        <div class="word-item"><span class="red">robot</span></div>
        <div class="word-item"><span class="red">closet</span></div>
        <div class="word-item"><span class="red">planet</span></div>
        <div class="word-item"><span class="red">destroy</span></div>
        <div class="word-item"><span class="red">complex</span></div>
        <div class="word-item"><span class="red">unhappy</span></div>
        <div class="word-item"><span class="red">hopefully</span></div>
      </div>
      <div class="hearts">
        <span>🩷</span>
        <span>🩵</span>
        <span>🩷</span>
      </div>
    </div>
  </div>

  <!-- Green bar -->
  <div class="green-bar"></div>

  <!-- Bottom -->
  <div class="bottom-section">
    <div class="good-text">GOOD!</div>
    <div class="bear-area">🐻🍦🍦</div>
  </div>

  <!-- Watermark -->
  <div class="watermark">
    哆来咪爱学习<br>
    From 小红书
  </div>
</div>

</body>
</html>
