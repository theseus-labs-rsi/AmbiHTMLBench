<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香水浓度</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #8B7355;
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="%238B7355" width="200" height="200"/><path d="M0 50 Q50 30 100 50 T200 50" stroke="%237A6548" fill="none" stroke-width="2"/><path d="M0 100 Q60 80 120 100 T200 100" stroke="%237A6548" fill="none" stroke-width="2"/><path d="M0 150 Q40 130 80 150 T200 150" stroke="%237A6548" fill="none" stroke-width="2"/></svg>');
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    padding: 20px;
  }

  .card {
    background: #fff;
    max-width: 700px;
    width: 100%;
    padding: 40px 30px 30px;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .title {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #6B4226;
    margin-bottom: 30px;
    letter-spacing: 8px;
  }

  .bottles {
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    margin-bottom: 30px;
    padding: 0 10px;
  }

  .bottle {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80px;
  }

  .bottle-cap {
    width: 22px;
    height: 22px;
    background: #D44;
    border-radius: 50%;
    margin-bottom: -2px;
    position: relative;
    z-index: 2;
  }

  .bottle-neck {
    width: 14px;
    height: 8px;
    background: #ccc;
    border: 1px solid #aaa;
  }

  .bottle-body {
    width: 60px;
    height: 70px;
    border: 2px solid #999;
    border-radius: 4px 4px 8px 8px;
    position: relative;
    overflow: hidden;
    background: #fff;
  }

  .bottle-body .fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #ccc;
  }

  .bottle-body .fill-1 { height: 75%; }
  .bottle-body .fill-2 { height: 60%; }
  .bottle-body .fill-3 { height: 45%; }
  .bottle-body .fill-4 { height: 30%; }
  .bottle-body .fill-5 { height: 15%; }

  .bottle-spray {
    position: absolute;
    top: 2px;
    right: -12px;
    font-size: 10px;
    color: #aaa;
  }

  .table-container {
    display: grid;
    grid-template-columns: 60px repeat(5, 1fr);
    gap: 0;
    margin-bottom: 20px;
  }

  .table-cell {
    padding: 10px 6px;
    text-align: center;
    font-size: 16px;
    color: #5C3A1E;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .table-cell.label {
    text-align: right;
    justify-content: flex-end;
    font-weight: bold;
    color: #6B4226;
    font-size: 15px;
    padding-right: 12px;
  }

  .table-cell.header {
    font-weight: bold;
    font-size: 18px;
    color: #5C3A1E;
  }

  .table-cell.name-cell {
    font-size: 14px;
    line-height: 1.3;
    color: #5C3A1E;
  }

  .table-cell.abbr {
    font-size: 16px;
    color: #5C3A1E;
  }

  .table-cell.conc {
    font-size: 18px;
    font-weight: bold;
    color: #5C3A1E;
  }

  .table-cell.longevity {
    font-size: 18px;
    font-weight: bold;
    color: #5C3A1E;
  }

  .row {
    display: contents;
  }

  .tips {
    margin-top: 20px;
    padding: 0 10px;
    font-size: 13px;
    color: #666;
    line-height: 1.8;
  }

  .tips-title {
    font-size: 14px;
    color: #555;
    margin-bottom: 4px;
  }

  .tips p {
    margin: 2px 0;
  }

  .bottle-wrapper {
    position: relative;
    display: inline-block;
  }

  .spray-lines {
    position: absolute;
    top: 5px;
    right: -18px;
    width: 20px;
    height: 15px;
  }

  .spray-lines::before,
  .spray-lines::after {
    content: '';
    position: absolute;
    background: #bbb;
    height: 1px;
  }

  .spray-lines::before {
    width: 15px;
    top: 3px;
    right: 0;
    transform: rotate(-20deg);
  }

  .spray-lines::after {
    width: 12px;
    top: 7px;
    right: 2px;
    transform: rotate(-10deg);
  }
</style>
</head>
<body>
<div class="card">
  <div class="title">香水浓度</div>

  <div class="bottles">
    <div class="bottle">
      <div class="bottle-wrapper">
        <div class="bottle-cap"></div>
        <div class="bottle-neck"></div>
        <div class="bottle-body">
          <div class="fill fill-1"></div>
          <div class="spray-lines"></div>
        </div>
      </div>
    </div>
    <div class="bottle">
      <div class="bottle-wrapper">
        <div class="bottle-cap"></div>
        <div class="bottle-neck"></div>
        <div class="bottle-body">
          <div class="fill fill-2"></div>
          <div class="spray-lines"></div>
        </div>
      </div>
    </div>
    <div class="bottle">
      <div class="bottle-wrapper">
        <div class="bottle-cap"></div>
        <div class="bottle-neck"></div>
        <div class="bottle-body">
          <div class="fill fill-3"></div>
          <div class="spray-lines"></div>
        </div>
      </div>
    </div>
    <div class="bottle">
      <div class="bottle-wrapper">
        <div class="bottle-cap"></div>
        <div class="bottle-neck"></div>
        <div class="bottle-body">
          <div class="fill fill-4"></div>
          <div class="spray-lines"></div>
        </div>
      </div>
    </div>
    <div class="bottle">
      <div class="bottle-wrapper">
        <div class="bottle-cap"></div>
        <div class="bottle-neck"></div>
        <div class="bottle-body">
          <div class="fill fill-5"></div>
          <div class="spray-lines"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="table-container">
    <!-- Row 1: 分类 -->
    <div class="table-cell label">分类</div>
    <div class="table-cell header">浓香精</div>
    <div class="table-cell header">淡香精</div>
    <div class="table-cell header">淡香水</div>
    <div class="table-cell header">古龙水</div>
    <div class="table-cell header">清香水</div>

    <!-- Row 2: 名称 -->
    <div class="table-cell label">名称</div>
    <div class="table-cell name-cell">Parfum</div>
    <div class="table-cell name-cell">Eau De<br>Parfum</div>
    <div class="table-cell name-cell">Eau De<br>Toilette</div>
    <div class="table-cell name-cell">Eau De<br>Cologne</div>
    <div class="table-cell name-cell">Eau<br>Fraiche</div>

    <!-- Row 3: 缩写 -->
    <div class="table-cell label">缩写</div>
    <div class="table-cell abbr">(P)</div>
    <div class="table-cell abbr">(EDP)</div>
    <div class="table-cell abbr">(EDT)</div>
    <div class="table-cell abbr">(EDC)</div>
    <div class="table-cell abbr">(EF)</div>

    <!-- Row 4: 浓度 -->
    <div class="table-cell label">浓度</div>
    <div class="table-cell conc">15-20%</div>
    <div class="table-cell conc">10-15%</div>
    <div class="table-cell conc">5-10%</div>
    <div class="table-cell conc">3-5%</div>
    <div class="table-cell conc">&lt;3%</div>

    <!-- Row 5: 留香 -->
    <div class="table-cell label">留香</div>
    <div class="table-cell longevity">5-8H</div>
    <div class="table-cell longevity">3-5H</div>
    <div class="table-cell longevity">3-4H</div>
    <div class="table-cell longevity">2-3H</div>
    <div class="table-cell longevity">&lt;1h</div>
  </div>

  <div class="tips">
    <div class="tips-title">tips:</div>
    <p>浓度高的香水不代表留香时间长，主要取决于香料种类</p>
    <p>在相同的浓度比较下，木质香的留香时间是碾压花果香的</p>
  </div>
</div>
</body>
</html>
