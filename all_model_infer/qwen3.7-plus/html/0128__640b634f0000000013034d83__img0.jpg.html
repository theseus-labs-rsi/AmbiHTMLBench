<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育原则模板</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            margin: 0;
            padding: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            color: #f1c40f; /* Yellow/Orange color from image */
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .content {
            font-size: 18px;
            color: #e0e0e0;
        }
        .item {
            margin-bottom: 15px;
        }
        /* Simulating the line breaks seen in the image for spatial fidelity */
        br {
            display: block;
            content: "";
            margin-top: 0px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>7.当题目中出现“原则”时，可用以下模板：</h2>
        
        <div class="content">
            <div class="item">
                (一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展
            </div>
            
            <div class="item">
                (二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教
            </div>
            
            <div class="item">
                （三）科学性原则。...能给幼儿正确的启蒙教<br>育
            </div>
            
            <div class="item">
                (四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点
            </div>
            
            <div class="item">
                （五）整体性原则 。考虑到多方面的要素，促<br>进幼儿整体的发展
            </div>
            
            <div class="item">
                （六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主
            </div>
        </div>
    </div>
</body>
</html>
