        新华社北京2月12日电 中央军委日前印发通报，对10个全军备战标兵单位、22名全军备战标兵个人予以表彰。

  <!-- Top article text -->
  <div class="top-article-text" style="margin-bottom:10px;">
    <p>通报指出，受表彰的单位和个人，是强军兴军伟大征程中涌现出来的先进典型，是推进练兵备战、聚力攻坚突破的杰出代表。希望受表彰的单位和个人珍惜荣誉、再接再厉，在强军兴军伟大征程中再立新功。全军部队和广大官兵要以受表彰的标兵单位和标兵个人为榜样，深入贯彻习近平强军思想，贯彻新时代军事战略方针，坚持党对人民军队的绝对领导，坚持战斗力这个唯一的根本的标准，坚持推进政治建军、改革强军、科技强军、人才强军、依法治军，加快把人民军队建成世界一流军队，为以中国式现代化全面推进强国建设、民族复兴伟业提供战略支撑。</p>
  </div>

  <!-- Main content area -->

    <div class="main-left">
      <!-- Beijing Digital Economy -->
      <div class="headline-main">北京数字经济发展动能澎湃</div>
      <div class="headline-author">本报记者 余建斌</div>

      <div class="red-banner">坚定信心，打开改革发展新天地</div>

      <div class="article-text">
        <p>抓起点、赶进度、抢第一——首都新春的开工现场，处处涌动着干事创业的澎湃动能。人工智能技术赋能千行百业，企业纷纷亮出"看家本领"，预计今年北京数字经济核心产业增加值将突破1万亿元，"智算"占全市算力比重超过70%，数字经济正成为北京高质量发展的新引擎。</p>
        <p>2024年，北京数字经济实现增加值1.9万亿元，占地区生产总值比重达44.4%。人工智能、大数据、云计算等新一代信息技术产业蓬勃发展，数字技术与实体经济深度融合，为北京高质量发展注入强劲动力。</p>
        <p>新春伊始，北京各大科技企业纷纷开工，人工智能大模型、自动驾驶、智能制造等领域迎来新一轮发展热潮。百度、字节跳动、小米等头部企业纷纷发布新年发展计划，加大研发投入，推动技术创新。</p>
        <p>北京市经信局数据显示，2024年北京数字经济核心产业增加值同比增长12.3%，软件和信息服务业收入突破2.5万亿元。人工智能产业规模达到3000亿元，位居全国前列。</p>
        <p>在政策支持下，北京加快建设全球数字经济标杆城市，推动数字技术与实体经济深度融合。2025年，北京将继续深化数字经济改革，优化营商环境，吸引更多国内外企业来京投资发展。</p>
        <p>数字化、智能化、绿色化，人工智能企业超过2400家，智算算力规模突破2万EFLOPS（每秒2000亿亿次浮点运算），数据交易额突破100亿元……北京以数字经济为引擎，推动高质量发展迈上新台阶。目前，北京在人工智能、量子信息、区块链等前沿领域持续发力，打造具有全球影响力的数字经济标杆城市。</p>
        <p>作为全球数字经济标杆城市，北京正加快推动数字技术与实体经济深度融合。2024年，北京数字经济核心产业增加值占GDP比重达44.4%，数字经济成为北京高质量发展的主引擎。</p>
        <p>产业数字化、数字产业化，数字经济正成为北京高质量发展的新引擎。在智能制造、智慧城市、数字金融等领域，北京持续发力，推动数字经济与实体经济深度融合。</p>
        <p>以中关村为例，这里聚集了众多科技创新企业，人工智能、大数据、云计算等技术在这里得到广泛应用。2024年，中关村示范区数字经济核心产业增加值同比增长15%，成为北京数字经济发展的重要支撑。</p>
        <p>2024年，北京数字经济规模达2万亿元，同比增长12%。数字经济已成为北京经济增长的重要引擎，为高质量发展提供强劲动力。</p>
      </div>

      <!-- Zhejiang Section -->
      <div class="section-divider"></div>
      <div class="headline-large">绘就诗画浙江和美乡村新画卷</div>
      <div class="headline-author">本报记者 余建斌 顾 春 许 宁</div>

      <div class="section-label">高质量发展调研行</div>

      <div class="zhejiang-text">
        <p>浙江杭州市临平区塘栖镇塘栖村，一座古桥、一条老街、两岸青瓦白墙，构成一幅典型的江南水乡画卷。近年来，塘栖村以"千万工程"为引领，持续推进美丽乡村建设，村容村貌焕然一新，村民收入稳步增长。</p>
        <p>塘栖村党总支书记沈国良说："我们村通过发展乡村旅游、特色农产品加工等产业，村民人均年收入从2012年的1.8万元增长到2024年的4.5万元，村集体经济收入从2012年的200万元增长到2024年的800万元。"</p>
        <p>"千万工程"持续深化，加快建设宜居宜业和美乡村。浙江以"千万工程"为牵引，持续推进美丽乡村建设，打造了一批具有浙江特色的美丽乡村示范村。</p>
        <p>在杭州市临平区塘栖镇，古桥流水、青瓦白墙的江南水乡风貌得到精心保护。村里发展了民宿、农家乐、特色农产品等产业，吸引了大量游客前来观光旅游。</p>
        <p>浙江省农业农村厅数据显示，2024年全省农村居民人均可支配收入达到4.2万元，同比增长8.5%。美丽乡村建设成效显著，全省已建成美丽乡村示范村500个，美丽庭院10万户。</p>
        <p>在湖州市安吉县余村，"绿水青山就是金山银山"的理念深入人心。村里通过发展生态旅游、白茶产业等，实现了从"石头经济"到"美丽经济"的转变。2024年，余村集体经济收入突破1000万元，村民人均年收入超过6万元。</p>
        <p>浙江省持续推进"千万工程"，以美丽乡村建设为抓手，推动乡村振兴。2024年，全省农业总产值达到3500亿元，农村居民人均可支配收入连续多年位居全国各省区第一。</p>
      </div>

      <div class="growth-section">
        <div class="growth-text">
          <p>国内生产总值同比增长5%——2024年中国经济交出一份亮眼答卷。面对复杂严峻的国内外形势，中国经济顶住压力，实现了5%左右的增长目标，展现出强大的韧性和活力。</p>
          <p>这个5%，是在多重挑战下取得的。外部环境复杂严峻，国内有效需求不足，部分行业产能过剩，社会预期偏弱，风险隐患仍然较多。在这样的背景下，中国经济能够实现5%的增长，殊为不易。</p>
          <p>这个5%，是含金量十足的增长。从产业结构看，高技术制造业增加值增长8.9%，装备制造业增加值增长7.7%。从需求结构看，最终消费支出对经济增长贡献率为44.5%，资本形成总额贡献率为25.2%，货物和服务净出口贡献率为30.3%。</p>
          <p>这个5%，为世界经济注入了强劲动力。中国对世界经济增长的贡献率保持在30%左右，仍然是世界经济增长的最大引擎。</p>
          <p>2025年，中国经济将继续保持稳中向好的发展态势。随着各项宏观政策效应持续释放，内需潜力不断释放，新质生产力加快培育，中国经济有望实现质的有效提升和量的合理增长。</p>
          <p>从百分之五的增长中，我们看到了中国经济的定力和信心。这份定力和信心，来自于中国共产党的坚强领导，来自于中国特色社会主义制度的显著优势，来自于亿万中国人民的团结奋斗。</p>
          <p>新的一年，我们要继续坚定信心、保持定力，推动中国经济高质量发展，为全面建设社会主义现代化国家贡献力量。</p>
        </div>
      </div>
    </div>
  </div>

      <div class="chongqing-title-v">重庆高新区积极推进科技成果转化</div>
      <div class="sub-headline" style="margin-left:30px;">科创经纪人，为技术和市场牵线搭桥</div>
      <div class="chongqing-text">
        <p>在重庆高新区，一批"科创经纪人"正活跃在科技创新一线，他们穿梭于高校实验室和企业车间之间，为科技成果找到合适的"婆家"。</p>
        <p>重庆高新区科技创新局负责人介绍，2024年全区共促成科技成果转化项目156个，合同金额超过50亿元。科创经纪人在其中发挥了重要作用，他们帮助科研人员了解市场需求，帮助企业找到合适的技术解决方案。</p>
        <p>"我们团队有8名科创经纪人，每个人都有自己的专业领域。"重庆某科技服务公司负责人王明说，"我们不仅要懂技术，还要懂市场，更要懂法律。只有把这三者结合起来，才能真正推动科技成果转化。"</p>
        <p>2024年，重庆高新区新增高新技术企业200家，科技型中小企业突破1000家。科技创新对经济增长的贡献率达到65%，成为区域高质量发展的重要支撑。</p>
        <p>重庆高新区将继续完善科技成果转化服务体系，培育更多专业科创经纪人，推动更多科技成果从实验室走向生产线，为经济高质量发展注入新动能。</p>
      </div>
    </div>

    <!-- Center: Grain article -->

      <div class="food-section-label">回家餐桌·共同关注</div>
      <div class="food-headline">主食吃得少了，我们还需要这么多粮食吗？</div>
      <div class="headline-author">本报记者 王 浩</div>

      <div class="grain-text">
        <p>随着生活水平提高，我国居民主食消费量呈下降趋势。据统计，2024年我国居民人均粮食消费量比2010年下降了约15%。那么，我们还需要生产这么多粮食吗？</p>
        <p>答案是肯定的。虽然直接食用的粮食减少了，但粮食的用途更加多元化。饲料用粮、工业用粮、种子用粮等需求持续增长。2024年，我国饲料用粮占总消费量的40%以上，工业用粮占15%左右。</p>
        <p>从全球视野看，粮食安全仍然是人类面临的重大挑战。联合国粮农组织数据显示，全球仍有约7.3亿人面临饥饿问题。中国作为人口大国，必须牢牢守住粮食安全底线。</p>
        <p>2024年，我国粮食总产量达到1.4万亿斤，连续10年保持在1.3万亿斤以上。这得益于高标准农田建设、种业振兴、农业科技创新等一系列举措。</p>
        <p>未来，我国将继续实施藏粮于地、藏粮于技战略，加强耕地保护，推进种业创新，提高农业综合生产能力，确保国家粮食安全。</p>
        <p>主食吃得少了，但粮食的需求结构发生了变化。我们需要从"吃得饱"向"吃得好"转变，从"数量安全"向"质量安全"转变，推动粮食产业高质量发展。</p>
      </div>
