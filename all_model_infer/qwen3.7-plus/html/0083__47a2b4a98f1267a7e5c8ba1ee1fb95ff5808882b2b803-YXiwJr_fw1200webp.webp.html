<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬息之間 - Artist Photo Exhibition</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #c8c8c8;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .poster {
    width: 100%;
    max-width: 800px;
    background-color: #c8c8c8;
    padding: 30px 35px 25px;
    position: relative;
  }

  .top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
  }

  .top-left {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .chinese-title {
    font-size: 36px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: 2px;
  }

  .english-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 1px;
  }

  .vertical-text {
    writing-mode: vertical-rl;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
  }

  .divider {
    border: none;
    border-top: 2.5px solid #1a1a1a;
    margin: 10px 0 30px;
  }

  .main-content {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 30px;
  }

  .main-row-1 {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .huge-chinese-left {
    font-size: 140px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 5px;
  }

  .english-subtitle {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 2px;
    text-align: left;
    padding-top: 10px;
  }

  .main-row-2 {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .artist-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .artist-label {
    font-size: 28px;
    font-weight: 700;
  }

  .artist-names {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .date-text {
    font-size: 64px;
    font-weight: 900;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  .huge-chinese-right {
    font-size: 160px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 5px;
  }

  .bottom-quote {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: 0.5px;
    margin-top: 20px;
    margin-bottom: 30px;
    max-width: 500px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 2.5px solid #1a1a1a;
    padding-top: 15px;
    margin-top: 10px;
  }

  .footer-left {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .footer-organizer {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .one-coffee {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .watermark {
    position: absolute;
    bottom: 55px;
    right: 35px;
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.7;
  }

  .watermark-icon {
    background: #fff;
    border-radius: 15px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 700;
    color: #333;
  }

  .watermark-text {
    font-size: 13px;
    color: #555;
  }

  @media (max-width: 600px) {
    .huge-chinese-left {
      font-size: 80px;
    }
    .huge-chinese-right {
      font-size: 90px;
    }
    .english-subtitle {
      font-size: 30px;
    }
    .date-text {
      font-size: 40px;
    }
    .chinese-title {
      font-size: 24px;
    }
    .english-title {
      font-size: 18px;
    }
    .main-row-1, .main-row-2 {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-section">
      <div class="top-left">
        <div class="chinese-title">藝術<br>攝影展</div>
        <div class="english-title">ARTIST<br>PHOTO<br>EXHIBITION</div>
      </div>
      <div class="vertical-text">定格光影</div>
    </div>

    <hr class="divider">

    <div class="main-content">
      <div class="main-row-1">
        <div class="huge-chinese-left">瞬息</div>
        <div class="english-subtitle">IN THE<br>BLINK OF<br>AN EYE</div>
      </div>

      <div class="main-row-2">
        <div>
          <div class="artist-info">
            <div class="artist-label">藝術家</div>
            <div class="artist-names">森蘭 王沐春</div>
          </div>
          <div class="date-text">08/14</div>
        </div>
        <div class="huge-chinese-right">之間</div>
      </div>
    </div>

    <hr class="divider">

    <div class="bottom-quote">
      IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
      YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
      EVERYTHING IN MY MIND AS AN EXERCISE.
    </div>

    <div class="watermark">
      <span class="watermark-icon">小红书</span>
      <span class="watermark-text">小红书号：heyu11221</span>
    </div>

    <div class="footer">
      <div class="footer-left">活動地址：濱江路西溪街二十七號</div>
      <div class="footer-right">
        <span class="footer-organizer">主辦單位：壹畫咖啡館</span>
        <span class="one-coffee">ONE COFFEE</span>
      </div>
    </div>
  </div>
</body>
</html>
