<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江雪 - 柳宗元</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #f5f0f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .page {
    width: 600px;
    min-height: 800px;
    background: linear-gradient(180deg, #fdf5f5 0%, #f8f0f0 30%, #f0eef5 70%, #e8e5f0 100%);
    position: relative;
    overflow: hidden;
    padding: 40px 30px 30px;
  }

  /* Mountain decorations */
  .mountain-left {
    position: absolute;
    left: -20px;
    top: 150px;
    width: 180px;
    height: 300px;
    background: linear-gradient(135deg, #d8d0e0 0%, #c0b8d0 40%, #a8a0c0 70%, #9088b0 100%);
    clip-path: polygon(0% 100%, 30% 20%, 60% 50%, 80% 10%, 100% 60%, 100% 100%);
    opacity: 0.6;
    z-index: 0;
  }

  .mountain-right {
    position: absolute;
    right: -10px;
    top: 200px;
    width: 160px;
    height: 280px;
    background: linear-gradient(225deg, #d0c8e0 0%, #b8b0d0 40%, #a098c0 70%, #8880b0 100%);
    clip-path: polygon(0% 50%, 40% 0%, 70% 30%, 100% 10%, 100% 100%, 0% 100%);
    opacity: 0.5;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .title-pinyin {
    font-size: 16px;
    color: #555;
    letter-spacing: 12px;
    margin-bottom: 2px;
    font-family: "Arial", sans-serif;
  }

  .title {
    font-size: 48px;
    font-weight: bold;
    color: #222;
    letter-spacing: 20px;
    margin-bottom: 10px;
  }

  .author-pinyin {
    font-size: 14px;
    color: #666;
    letter-spacing: 6px;
    margin-bottom: 2px;
    font-family: "Arial", sans-serif;
  }

  .author {
    font-size: 20px;
    color: #444;
    letter-spacing: 4px;
    margin-bottom: 30px;
  }

  .poem-line {
    margin-bottom: 18px;
  }

  .line-pinyin {
    font-size: 14px;
    color: #666;
    letter-spacing: 8px;
    margin-bottom: 2px;
    font-family: "Arial", sans-serif;
  }

  .line-text {
    font-size: 32px;
    color: #222;
    letter-spacing: 10px;
    font-weight: bold;
  }

  .translation-section {
    text-align: left;
    margin-top: 30px;
    padding: 0 10px;
  }

  .translation-label {
    display: inline-block;
    background: #c0392b;
    color: white;
    padding: 3px 12px;
    border-radius: 4px;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .translation-text {
    font-size: 17px;
    color: #333;
    line-height: 1.8;
    text-indent: 2em;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
  }

  .fisherman-placeholder {
    position: absolute;
    bottom: 20px;
    right: 30px;
    width: 200px;
    height: 120px;
    z-index: 1;
  }

  .fisherman-placeholder svg {
    width: 100%;
    height: 100%;
  }

  .water-decoration {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent 0%, rgba(180, 175, 210, 0.3) 50%, rgba(160, 155, 200, 0.4) 100%);
    z-index: 0;
  }

  .snow-dots {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
  }

  .snow-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="page">
  <div class="mountain-left"></div>
  <div class="mountain-right"></div>
  <div class="water-decoration"></div>

  <div class="snow-dots">
    <div class="snow-dot" style="top:10%;left:15%"></div>
    <div class="snow-dot" style="top:20%;left:80%"></div>
    <div class="snow-dot" style="top:35%;left:10%"></div>
    <div class="snow-dot" style="top:50%;left:90%"></div>
    <div class="snow-dot" style="top:65%;left:20%"></div>
    <div class="snow-dot" style="top:75%;left:70%"></div>
    <div class="snow-dot" style="top:85%;left:40%"></div>
    <div class="snow-dot" style="top:90%;left:85%"></div>
  </div>

  <div class="content">
    <div class="title-pinyin">jiāng xuě</div>
    <div class="title">江 雪</div>
    <div class="author-pinyin">táng liǔ zōng yuán</div>
    <div class="author">[唐] 柳宗元</div>

    <div class="poem-line">
      <div class="line-pinyin">qiān shān niǎo fēi jué</div>
      <div class="line-text">千山鸟飞绝，</div>
    </div>

    <div class="poem-line">
      <div class="line-pinyin">wàn jìng rén zōng miè</div>
      <div class="line-text">万径人踪灭。</div>
    </div>

    <div class="poem-line">
      <div class="line-pinyin">gū zhōu suō lì wēng</div>
      <div class="line-text">孤舟蓑笠翁，</div>
    </div>

    <div class="poem-line">
      <div class="line-pinyin">dú diào hán jiāng xuě</div>
      <div class="line-text">独钓寒江雪。</div>
    </div>

    <div class="translation-section">
      <div class="translation-label">译文：</div>
      <p class="translation-text">
        群山之间，没有一只鸟儿飞过。纵横的小路上，见不到行人的踪迹。只有一位身披蓑衣、头戴笠帽的渔翁，架着小船，冒着风雪，在寒冷的江上独自垂钓。
      </p>
    </div>
  </div>

  <div class="fisherman-placeholder">
    <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <!-- Water -->
      <ellipse cx="100" cy="105" rx="90" ry="12" fill="#b8b0d8" opacity="0.5"/>
      <ellipse cx="100" cy="100" rx="80" ry="8" fill="#c8c0e0" opacity="0.4"/>
      <!-- Boat -->
      <path d="M40 90 Q50 100 100 100 Q150 100 160 90 Q150 95 100 95 Q50 95 40 90Z" fill="#6b5b4f"/>
      <path d="M45 88 Q55 96 100 96 Q145 96 155 88 Q145 92 100 92 Q55 92 45 88Z" fill="#7d6b5e"/>
      <!-- Fisherman body -->
      <ellipse cx="110" cy="78" rx="14" ry="16" fill="#8b6b5b"/>
      <!-- Head -->
      <circle cx="110" cy="62" r="10" fill="#d4a574"/>
      <!-- Hat (笠) -->
      <ellipse cx="110" cy="56" rx="18" ry="6" fill="#c0392b"/>
      <path d="M92 56 Q110 42 128 56" fill="#c0392b"/>
      <!-- Fishing rod -->
      <line x1="110" y1="70" x2="30" y2="40" stroke="#555" stroke-width="2"/>
      <!-- Fishing line -->
      <line x1="30" y1="40" x2="30" y2="95" stroke="#888" stroke-width="1"/>
      <!-- Snow dots -->
      <circle cx="50" cy="70" r="2" fill="white" opacity="0.8"/>
      <circle cx="80" cy="55" r="1.5" fill="white" opacity="0.7"/>
      <circle cx="130" cy="65" r="2" fill="white" opacity="0.8"/>
      <circle cx="150" cy="80" r="1.5" fill="white" opacity="0.6"/>
      <circle cx="70" cy="85" r="2" fill="white" opacity="0.7"/>
    </svg>
  </div>
</div>
</body>
</html>
