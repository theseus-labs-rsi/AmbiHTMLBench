<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

  body {
    margin: 0;
    padding: 20px;
    background-color: #f5f0e8;
    font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .notebook-page {
    width: 600px;
    min-height: 780px;
    background-color: #fff;
    background-image:
      linear-gradient(#c8d8e8 1px, transparent 1px),
      linear-gradient(90deg, #c8d8e8 1px, transparent 1px);
    background-size: 28px 28px;
    padding: 30px 35px 40px 35px;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
    position: relative;
    box-sizing: border-box;
  }

  .title {
    text-align: center;
    font-size: 32px;
    color: #8b1a1a;
    margin-bottom: 30px;
    font-weight: bold;
    letter-spacing: 4px;
  }

  .section {
    display: flex;
    margin-bottom: 20px;
    align-items: flex-start;
  }

  .section-label {
    writing-mode: vertical-rl;
    font-size: 28px;
    color: #8b1a1a;
    font-weight: bold;
    letter-spacing: 6px;
    margin-right: 12px;
    flex-shrink: 0;
    line-height: 1.6;
  }

  .section-content {
    flex: 1;
    font-size: 22px;
    color: #c0392b;
    line-height: 2;
  }

  .section-content .item {
    margin-bottom: 4px;
  }

  .section-content .sub-item {
    margin-left: 20px;
    font-size: 21px;
  }

  .formula-section {
    display: flex;
    margin-bottom: 10px;
    align-items: flex-start;
    position: relative;
  }

  .formula-content {
    flex: 1;
    font-size: 22px;
    color: #2c2c2c;
    line-height: 2;
  }

  .formula-content .item {
    margin-bottom: 2px;
  }

  .formula-content .sub-item {
    margin-left: 20px;
    font-size: 21px;
  }

  .seal {
    position: absolute;
    right: 30px;
    top: 200px;
    width: 70px;
    height: 90px;
    background: #c0392b;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.2);
    transform: rotate(-2deg);
  }

  .koujue {
    margin-top: 20px;
    font-size: 26px;
    color: #2c2c2c;
    line-height: 1.8;
  }

  .koujue .label {
    color: #2c2c2c;
    font-weight: bold;
  }

  .koujue .text {
    color: #8b1a1a;
    font-size: 28px;
    letter-spacing: 6px;
  }

  .paren {
    color: #c0392b;
  }

  .black-text {
    color: #2c2c2c;
  }
</style>
</head>
<body>
<div class="notebook-page">
  <div class="title">句段结构作用好处赏析</div>

  <div class="section">
    <div class="section-label">常见问法</div>
    <div class="section-content">
      <div class="item">1. 请分析这句话的作用是什么？</div>
      <div class="item">2. 这句话这样描写有什么好处？</div>
      <div class="item">3. 请分析这句话这样描写的表达效果.</div>
    </div>
  </div>

  <div class="formula-section">
    <div class="section-label">满分公式</div>
    <div class="formula-content">
      <div class="item">① 这是（<span class="paren">&nbsp;&nbsp;&nbsp;&nbsp;</span>）描写</div>
      <div class="sub-item">生动形象地写出（<span class="paren">&nbsp;&nbsp;&nbsp;&nbsp;</span>）.</div>
      <div class="item">② 更突出了（<span class="paren">&nbsp;&nbsp;&nbsp;&nbsp;</span>）.</div>
      <div class="item">③ 前后文呼应/为后文（<span class="paren">&nbsp;&nbsp;&nbsp;&nbsp;</span>）做了铺垫.</div>
    </div>
    <div class="seal">李真</div>
  </div>

  <div class="koujue">
    <span class="label">口诀：</span><span class="text">生动秀 感心头 句勾手</span>
  </div>
</div>
</body>
</html>
