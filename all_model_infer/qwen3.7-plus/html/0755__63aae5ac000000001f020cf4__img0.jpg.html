<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗六首</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #e8c9a0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
  }

  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 6px;
    background-color: #d4a574;
    padding: 6px;
    max-width: 700px;
    width: 100%;
    border-radius: 4px;
  }

  .poem-card {
    background-color: #fff;
    background-image:
      linear-gradient(rgba(200, 200, 200, 0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200, 200, 200, 0.3) 1px, transparent 1px);
    background-size: 20px 20px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: 2px;
  }

  .poem-title {
    font-size: 28px;
    font-weight: bold;
    color: #1a1a1a;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  .poem-author {
    font-size: 16px;
    color: #333;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .poem-text {
    font-size: 20px;
    color: #1a1a1a;
    line-height: 1.8;
    text-align: center;
    letter-spacing: 2px;
  }

  .poem-text p {
    margin: 0;
  }
</style>
</head>
<body>

<div class="grid-container">

  <div class="poem-card">
    <div class="poem-title">《登鹳雀楼》</div>
    <div class="poem-author">（唐-王之涣）</div>
    <div class="poem-text">
      <p>白日依山尽，</p>
      <p>黄河入海流。</p>
      <p>欲穷千里目，</p>
      <p>更上一层楼。</p>
    </div>
  </div>

  <div class="poem-card">
    <div class="poem-title">《静夜思》</div>
    <div class="poem-author">（唐-李白）</div>
    <div class="poem-text">
      <p>床前明月光，</p>
      <p>疑是地上霜。</p>
      <p>举头望明月，</p>
      <p>低头思故乡。</p>
    </div>
  </div>

  <div class="poem-card">
    <div class="poem-title">《古朗月行》</div>
    <div class="poem-author">（唐-李白）</div>
    <div class="poem-text">
      <p>小时不识月，</p>
      <p>呼作白玉盘。</p>
      <p>又疑瑶台镜，</p>
      <p>飞在青云端。</p>
    </div>
  </div>

  <div class="poem-card">
    <div class="poem-title">《寻隐者不遇》</div>
    <div class="poem-author">（唐-贾岛）</div>
    <div class="poem-text">
      <p>松下问童子，</p>
      <p>言师采药去。</p>
      <p>只在此山中，</p>
      <p>云深不知处。</p>
    </div>
  </div>

  <div class="poem-card">
    <div class="poem-title">《咏鹅》</div>
    <div class="poem-author">（唐-骆宾王）</div>
    <div class="poem-text">
      <p>鹅鹅鹅，</p>
      <p>曲项向天歌。</p>
      <p>白毛浮绿水，</p>
      <p>红掌拨清波。</p>
    </div>
  </div>

  <div class="poem-card">
    <div class="poem-title">《草》</div>
    <div class="poem-author">（唐-白居易）</div>
    <div class="poem-text">
      <p>离离原上草，</p>
      <p>一岁一枯荣。</p>
      <p>野火烧不尽，</p>
      <p>春风吹又生。</p>
    </div>
  </div>

</div>

</body>
</html>
