<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertension – Therapy goal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a2e;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            padding: 40px 50px;
            position: relative;
            overflow: hidden;
        }

        /* Horizontal line background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 38px,
                rgba(100, 130, 200, 0.15) 38px,
                rgba(100, 130, 200, 0.15) 39px
            );
            pointer-events: none;
            z-index: 0;
        }

        .slide-content {
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #ffff00;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
            padding-bottom: 10px;
            border-bottom: 3px solid #cc0000;
        }

        .section {
            margin-top: 30px;
        }

        .main-bullet {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .main-bullet::before {
            content: '• ';
        }

        .sub-bullet {
            font-size: 26px;
            color: #7ab0e8;
            margin-left: 40px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .sub-bullet::before {
            content: '– ';
        }

        .bottom-line {
            position: absolute;
            bottom: 30px;
            left: 50px;
            right: 50px;
            height: 3px;
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <h1>Hypertension – Therapy goal</h1>

        <div class="section">
            <div class="main-bullet">Goal BP</div>
            <div class="sub-bullet">To Keep B.P. &lt; 140/90 mm Hg in each patient</div>
            <div class="sub-bullet">This may be revised to 120/80 may be ? 110/70</div>
            <div class="sub-bullet">MRFIT's cut off values are 115/75 mm Hg</div>
        </div>

        <div class="section">
            <div class="main-bullet">The Truth is</div>
            <div class="sub-bullet">It is essential to keep the B.P at or below the goal</div>
            <div class="sub-bullet">But, It also matters how the goal B.P. is achieved !</div>
        </div>
    </div>

    <div class="bottom-line"></div>
</body>
</html>
