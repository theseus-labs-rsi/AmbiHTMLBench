<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #e8e4df;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', cursive;
  }

  .notebook-page {
    width: 520px;
    min-height: 720px;
    background: #f5f0e8;
    position: relative;
    padding: 0;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 10px;
    font-size: 11px;
    font-family: Arial, sans-serif;
    color: #333;
    border-bottom: 1px solid #ccc;
    background: #f0ece4;
  }

  .header-bar .days {
    display: flex;
    gap: 2px;
  }

  .header-bar .days span {
    background: #ddd;
    padding: 1px 5px;
    border: 1px solid #bbb;
    font-size: 10px;
  }

  .header-bar .date-field {
    font-size: 12px;
  }

  .lined-content {
    padding: 10px 30px 30px 30px;
    position: relative;
  }

  .lined-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      transparent,
      transparent 37px,
      #b8c6d4 37px,
      #b8c6d4 38px
    );
    background-position-y: 8px;
    pointer-events: none;
    z-index: 0;
  }

  .title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    padding: 15px 0 10px 0;
    position: relative;
    z-index: 1;
    line-height: 38px;
    color: #1a1a1a;
  }

  .body-text {
    font-size: 24px;
    line-height: 38px;
    color: #1a1a1a;
    position: relative;
    z-index: 1;
    padding-top: 5px;
  }

  .body-text p {
    margin: 0;
    padding: 0;
  }

  .body-text .line {
    display: block;
    min-height: 38px;
    line-height: 38px;
  }
</style>
</head>
<body>
  <div class="notebook-page">
    <div class="header-bar">
      <div class="days">
        <span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
      <div class="date-field">Date. &nbsp; / &nbsp; / &nbsp; /</div>
    </div>
    <div class="lined-content">
      <div class="title">这是好的开始</div>
      <div class="body-text">
        <span class="line">从你看到这篇文章开始，</span>
        <span class="line">你会越来越有钱</span>
        <span class="line">越来越好看，</span>
        <span class="line">生活和心态也会越来越好，</span>
        <span class="line">请相信大数据，</span>
        <span class="line">是你自己把一切美好的东西，</span>
        <span class="line">都吸引了过来</span>
        <span class="line">你已经调到了接收钱的频率</span>
        <span class="line">接收美的频率，</span>
        <span class="line">你的能量频率对了才接收到这</span>
        <span class="line">条信息，</span>
        <span class="line">留下一句"全收到"，</span>
        <span class="line">愿所有的愿望全能实现！</span>
      </div>
    </div>
  </div>
</body>
</html>
