<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头孢菌素分类</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #2d8a4e;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    color: #fff;
    padding: 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .title .star {
    color: #ffeb3b;
    font-size: 28px;
  }
  .main-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    background-color: #2d8a4e;
  }
  .main-table td, .main-table th {
    border: 2px solid #fff;
    padding: 6px 10px;
    font-size: 16px;
    vertical-align: middle;
  }
  .main-table .category-cell {
    writing-mode: horizontal-tb;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    width: 80px;
    row-span: 4;
  }
  .main-table .gen-label {
    font-weight: bold;
    text-align: center;
    width: 80px;
    font-size: 16px;
  }
  .main-table .gen-label .circle {
    display: inline-block;
    border: 2px solid #ffeb3b;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    line-height: 24px;
    text-align: center;
    font-size: 14px;
    color: #ffeb3b;
  }
  .highlight-yellow {
    color: #ffeb3b;
    text-decoration: underline;
    text-decoration-color: #ffeb3b;
  }
  .highlight-green {
    color: #7fff7f;
  }
  .bottom-section {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .memory-table {
    flex: 1;
    border-collapse: collapse;
    background-color: #2d8a4e;
  }
  .memory-table td, .memory-table th {
    border: 2px solid #fff;
    padding: 6px 10px;
    font-size: 15px;
  }
  .memory-table .memory-header {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    background-color: #2d8a4e;
  }
  .memory-table .gen-cell {
    font-weight: bold;
    text-align: center;
    width: 80px;
    font-size: 15px;
  }
  .images-section {
    width: 280px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 4px;
    flex-shrink: 0;
  }
  .placeholder {
    background-color: #3a9e5e;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #ccc;
    min-height: 80px;
    overflow: hidden;
  }
  .placeholder img {
    max-width: 100%;
    max-height: 100%;
  }
  .gen-label-third {
    position: relative;
  }
  .gen-label-third .circle-overlay {
    position: absolute;
    border: 2px solid #ffeb3b;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .underline-yellow {
    text-decoration: underline;
    text-decoration-color: #ffeb3b;
    text-underline-offset: 3px;
  }
</style>
</head>
<body>

<div class="title">
  1.头孢菌素分类 <span class="star">☆</span>
</div>

<table class="main-table">
  <tr>
    <td rowspan="4" class="category-cell">头孢<br>菌素类</td>
    <td class="gen-label">第一代</td>
    <td>头孢<span class="highlight-yellow">唑</span>林、氨<span class="highlight-yellow">苄</span>、羟氨<span class="highlight-yellow">苄</span>、<span class="highlight-yellow">拉定</span>、<span class="highlight-yellow">硫脒</span>、<span class="highlight-yellow">噻吩</span></td>
  </tr>
  <tr>
    <td class="gen-label">第二代</td>
    <td>头孢<span class="highlight-yellow">呋</span>辛、<span class="highlight-yellow">孟多</span>、<span class="highlight-yellow">替安</span>、<span class="highlight-yellow">克洛</span>、<span class="highlight-yellow">丙烯</span></td>
  </tr>
  <tr>
    <td class="gen-label gen-label-third">第<span style="position:relative;display:inline-block;"><span style="border:2px solid #ffeb3b;border-radius:50%;width:28px;height:28px;display:inline-block;position:absolute;top:-2px;left:-2px;"></span>三</span>代</td>
    <td>头孢<span class="highlight-yellow">他</span>啶、<span class="highlight-yellow">他美</span>、<span class="highlight-yellow">匹胺</span>、<span class="highlight-yellow">哌酮</span>、<span class="highlight-yellow">曲松</span>、<span class="highlight-yellow">噻肟</span>、<br>克肟、唑肟、甲肟、泊肟、<span class="highlight-yellow">地尼</span></td>
  </tr>
  <tr>
    <td class="gen-label">第四代</td>
    <td>头孢<span class="highlight-yellow">匹罗</span>、<span class="highlight-yellow">吡肟</span></td>
  </tr>
</table>

<div class="bottom-section">
  <table class="memory-table" style="flex:1;">
    <tr>
      <td colspan="2" class="memory-header">记忆一下</td>
    </tr>
    <tr>
      <td class="gen-cell">第一代</td>
      <td>一头<span class="underline-yellow">坐</span>便拉定，<span class="underline-yellow">米</span>粉吃多了</td>
    </tr>
    <tr>
      <td class="gen-cell">第二代</td>
      <td>二<span class="underline-yellow">呋孟多</span>，替俺克<span class="underline-yellow">丙</span></td>
    </tr>
    <tr>
      <td class="gen-cell">第三代</td>
      <td>他胺哌曲肟三妹<span class="underline-yellow">地</span></td>
    </tr>
    <tr>
      <td class="gen-cell">第四代</td>
      <td>四<span class="underline-yellow">匹罗</span>子吡<span class="underline-yellow">肟</span>牛</td>
    </tr>
  </table>

  <div class="images-section">
    <div class="placeholder" style="min-height:100px;">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="25" r="15" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="40" y="30" text-anchor="middle" fill="#fff" font-size="10">[?]</text>
        <rect x="25" y="45" width="30" height="25" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="40" y="75" text-anchor="middle" fill="#ccc" font-size="8">[Cartoon: person]</text>
      </svg>
    </div>
    <div class="placeholder" style="min-height:100px;">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <rect x="10" y="10" width="60" height="60" fill="#5a5" rx="5"/>
        <text x="40" y="45" text-anchor="middle" fill="#fff" font-size="10">[Photo]</text>
      </svg>
    </div>
    <div class="placeholder" style="min-height:100px;">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle cx="40" cy="35" r="20" fill="#e88" opacity="0.5"/>
        <text x="40" y="40" text-anchor="middle" fill="#fff" font-size="10">[Cartoon: couple]</text>
      </svg>
    </div>
    <div class="placeholder" style="min-height:100px;">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <text x="40" y="45" text-anchor="middle" fill="#fff" font-size="10">[Cartoon: animal]</text>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
