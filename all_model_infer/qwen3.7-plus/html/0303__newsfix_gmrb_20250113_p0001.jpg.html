<body>
<div class="newspaper">

  <!-- Masthead -->
  <div class="masthead">
    <div class="masthead-title">光明日报</div>
    <div class="masthead-sub">GUANGMING RIBAO</div>
  </div>

  <!-- Date bar -->
  <div class="date-bar">
    <span class="left">2025年1月13日 星期一 农历甲辰年十二月十四 今日16版</span>
  </div>
  <div class="pub-info">
    光明网网址：http://www.gmw.cn 国内统一连续出版物号 CN 11-0026 代号 1-16 第27376号
  </div>

  <!-- Main headline -->
  <div class="top-headline">
    <h1>立足经济监督，打造"特种部队"</h1>
    <div class="subtitle">——习近平总书记重要指示为审计监督<br>护航经济社会高质量发展注入强大动力</div>
  </div>

  <!-- Main content area -->
  <div class="main-grid">

    <!-- Left column: 开栏的话 + 十八洞村 article -->
    <div>
      <div class="section-header">开栏的话</div>

      <div class="highlight-box">
        <strong>昔日贫困村现今的模样</strong>
      </div>

      <div class="article-text" style="font-size:12px; margin-bottom:15px;">
        <p>这确实是彪炳史册的人间奇迹！</p>
        <p>2021年2月25日，习近平总书记在全国脱贫攻坚总结表彰大会上庄严宣告：我国脱贫攻坚战取得了全面胜利，现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽。</p>
        <p>不为饥馑所困，黄发垂怡然自乐，这是多少代人的梦想！这个梦想，只有在中国共产党领导的今天，才终于成了现实！</p>
        <p>青石板路通到了屋舍俨然的苗寨，篝火摇曳、歌舞翩跹跳了八方游客。你能想象，这是那个被行路难困了四百多年的山尖尖上的十八洞村吗？</p>
        <p>一家家比肩而立的农家乐，笑语喧喧；一棵棵劲挺的修阻遏了西风，摇来了祥云。这就是那个藏在井冈山褶皱里的神山竹村？红蕖漫卷，山河妖娆；休谓无名，昆裔竞朝！</p>
        <p>川塬上谷犹飘雪，山坳里牛羊成群，那个曾饿得比城里人还时髦的放牛娃李骏儿一甩，信天游一唱，前前寒寒都落着笑影！你知道吗？这里就是左宗棠栽树的"苦甲天下"的西海固。</p>
        <p>那些昔日贫困时如今的模样，感动你和我们一样地生去触摸。新岁伊始，光明日报派出多路记者，循着大江南北各个角落，去体察山乡的巨变，倾听时代的足音。</p>
        <p>编辑部提出这样一个要求：一头扎下去，脚下有泥土，笔尖有温度，力求每一句一语均是"原生态"。</p>
        <p>我们做到了吗？读者是"阅卷人"。</p>
      </div>

      <div class="vertical-title-area">
        <div class="vertical-title">
          瞧，十八洞村<span class="accent">"长大了"</span>！
        </div>
        <div class="article-text" style="flex:1;">
          <p>暮色四合时，记者来到湖南省花垣县双龙镇毛坪村。党服务中心前的广场上，一群苗家阿妈正跳着苗家日鼓舞，脚下踩的，满满的都是山货：土蜂蜜、萝卜、红薯……</p>
          <p>"家人们，鸡蛋好不好，抓抓就知道。看，这蛋清黏糊的，是真正的笨鸡蛋……"手机镜头前，十八洞村的团支部书记施康熟练地展开一个鸡蛋，给网友演示着。</p>
          <p>十八洞村和毛坪村是山靠山的邻居。</p>
          <p>只一眨眼工夫，毛坪村村民施志保家的小羊羔土鸡蛋就都卖光了。刚刷完志保不安的施志保，眉眼眯成了一条线，搓着骨节粗大的手连声说："要得，要得，这个要得！"</p>
          <p>"我们十八洞村的直播团队，每晚都会来附近村子里帮带子多嘞！"接着露出他的肩膀，施康开心地对记者说。</p>
          <p>其实，除了直播带货，富起来的十八洞村帮扶周边村子的法子多嘞！</p>
          <p>2013年11月，习近平总书记来到十八洞村，与乡亲们围膝谈心，首次提出"精准扶贫"。</p>
          <p>"我们按照总书记指示，精准施策，2016年底在全省率先实现了整村脱贫。这几年，发展的步子越来越快。以前村集体经济一年一分钱也没有，2024年，增长到了620多万元！"广场的灯光，将十八洞村党支部书记、村委会主任施金通那张黧黑的脸映得很有神采。</p>
          <p>"不过，一家好还不算，大家好才更好！"施金通并不满足，理了理粗蓝靛布的头巾对记者说，"这几年，我们一直盘算着，怎么把我们村的发展经验与十里八乡共享，把周边村子的经济也带动起来。"</p>
          <p>十八洞村的想法，得到了湘西州委、州政府的大力支持。在州里统筹指导下，十八洞村与周边的董刀、双龙、排碧、板果、马岩、红岩、共7个行政村，制定了"1+7"片区发展计划，共同打造"十八洞片区"乡村振兴示范区。</p>
          <p>"片区均衡发展，最重要的是资源共享。就拿旅游来讲，十八洞村'火'了，但只能接待那么多，把客人分流到周边村子，大家不就都挣到钱了嘛！在不远处张罗摆擂的十八洞村驻村第一书记杨志远说。</p>
          <p>真没想到，到十八洞村采访还能遇上一场大雪，让十八洞村竹子寨银装素裹，可通往张刀村的马路，却显得发亮。</p>
          <p>"啊——啊——"，循着这声音，在马路的拐弯处，记者见到了正在挥舞扫帚的张刀村村民龙金海。</p>
          <p>"这新修的路，正派得很嘞！有了这条路，这一片村子就连了起来。"龙金海憨厚一笑，"不把雪扫干净会冻成冰坨，我可舍不得！"</p>
          <p>张刀村的村民都知道，为了这条路，十八洞村的乡亲们付出了多大。张刀村，是隐没在十八洞村"背后"的小村子，进出都要穿过十八洞村。以前，只有一条窄窄的土道，稍大一点的货车都过不去。村里一直琢磨着修一条新路。不过，修新路，就得占用十八洞村的地。</p>
          <p>张刀村驻村书记蒋对对记者坦言："刚开始，心里打鼓啊！又有何补偿，人家愿意吗？"</p>
          <p>十八洞村竹子寨施艳琴家的山地正好处在新修的路上。麻富辉和十八洞村的村干部都着头皮上了门做工作。没想到，施艳琴答应得倒干脆："我们村富了，不能对周边村不管不顾！"</p>
          <p>和施艳琴家一样，为了修通这条路，十八洞村其他19户村民也都让出了自家的地！</p>
          <p>"人家帮着把路都修好了，我也得下狠劲。买辆车，也搞个事情做！"扫完路上的积雪，龙金海打了扫帚，"眼看着十八洞村把周边的产业都带起来了，哪个弟兄心里不痒痒咧？！"</p>
          <p>夜色渐浓，循着这条"宝兴路"，记者又来到了十八洞村梨子寨广场。此时的游客，较白天稀疏了不少。一个摊前，围着几位游客，村民正邀请他们品尝"十八洞猕猴桃"呢。</p>
          <p>施金通递给记者一颗。剥开，浓郁的果香扑鼻而来，咬上一口，软糯香甜。</p>
          <p>"这猕猴桃，来自30公里外的套棚村。只要有了十八洞猕猴桃'认证'，品质肯定差不了！"施金通用毛边一挑，"跳出十八洞，发展十八洞，这叫'飞地经济'。"</p>
          <p>"我们的品牌共享计划，不限于猕猴桃。未来，周边村寨可以一起制腊肉、种油茶、养黄牛……统一标准、统一质量……"施金通话匣子一打开就收不住。</p>
          <p>老施意犹未尽，"愿不愿意去看看我们的苗绣基地？这时候，绣娘们该正忙着呢！"</p>
          <p>记者随施金通来到十八洞村"苗绣乡村振兴示范基地"。一间古色古香的木头房子里，十几位绣娘围坐一圈，或穿针引线，或低头刺绣。电取暖器让房间温暖如春，绣娘们边干活边互相打趣，笑声使静谧的山村冬夜充满了生趣。</p>
          <p>"你看这，漏了片叶子，得补上这，针脚还要密着一点……"坐在毛坪村"实习绣娘"龙海萍身边，十八洞村苗绣特产农民专业合作社理事长石丽辉耐心指导着。</p>
          <p>苗绣，被誉为"穿在身上的苗族史诗"，对十八洞村的妇女来说，是平日里干的"拿手活"。借助精准扶贫，十八洞村把苗绣做成了产业，变成了创汇。</p>
          <p>但十八洞村的绣娘也没忘了其他村的姐妹。"平绣、挑花绣、贴花绣……我们手把手地教，学成后，她们就能靠苗绣赚钱啦！"石丽辉拈起一枚蓝色蝴蝶胸花，向记者展示道。</p>
          <p class="author-line">本报记者 谢文 禹爱华 赵嘉伟</p>
        </div>
      </div>
    </div>

    <!-- Right column: Audit article -->
    <div>
      <div class="article-col" style="column-count:2; font-size:12.5px; line-height:1.85;">
        <p>"聚焦主责主业，深化改革创新，加强自身建设""以高质量审计监督护航经济社会高质量发展"。近日，习近平总书记审计工作作出重要指示，充分肯定审计机关在促进经济健康发展、维护国家经济安全、揭示风险隐患、推动反腐倡廉等方面发挥的积极作用，对审计工作提出明确要求。</p>
        <p>大家表示，习近平总书记的重要指示为做好新时代审计工作指明了前进方向，提供了根本遵循。新征程上，要坚持党中央对审计工作的集中统一领导，立足经济监督定位，打造"特种部队"，奋力开创审计事业新局面，不断取得新成就。</p>
        <p>全国审计工作会议暨全国审计机关先进集体和先进工作者表彰大会1月10日至11日在北京召开。作为接受表彰的全国审计机关先进集体代表，重庆市审计局财政审计一处处长万芳芳深受鼓舞："总书记对审计工作的高度信任和殷殷期盼句句在耳、字字于心，进一步增强了我们做好工作的信心和力量。"</p>
        <p>中央审计委员会成立以来，在党中央集中统一领导下，我国审计体制实现系统性、整体性重构，走出了一条契合中国国情的审计新路子，审计工作取得历史性成就、发生历史性变革。</p>
        <p>审计署政策研究室副主任林永表示，这些成绩得益于以习近平同志为核心的党中央思想在审计领域的生动实践，是以习近平同志为核心的党中央治国理政在审计领域取得的重要成果，充分彰显和印证了党的创新理论的真理力量和实践力量。</p>
        <p>2024年前11个月，全国共审计5万多个单位，1.9万多名领导干部，促进增收节支和挽回损失3100多亿元；健全完善规章制度2万多项，各项审计发现并移送重大问题线索1万多起……审计在推动国家治理体系和治理能力现代化中发挥着越来越重要的作用。</p>
        <p>"我们要牢记习近平总书记嘱托，以保障党中央宏观调控决策部署落实见效为工作主线，围绕推动宏观政策更加积极有为和提高政府投资效益、推动发展新质生产力和增强区域发展活力、有效防范化解重点领域风险等方面持续深耕审计，更好服务经济社会大局。"林永说。</p>
        <p>聚焦财政财务收支真实合法效益这一审计工作的主责主业，近期审计发现的农村学生营养餐问题备受关注。审计整改报告显示，截至2024年9月底，农村义务教育学生营养改善计划专项资金审计问题已整改问题涉及资金40.39亿元，完善制度248项，处理处分1200人。</p>
        <p>湖南省隆回县教育局局长向拥军表示，审计机关揭示的问题，深刻暴露出资金使用方面的短板。"对习近平总书记的重要指示，我们将继续以自觉接受审计监督、坚持以审促改、以教有系统的'钱袋子''账本子'管好用好。"</p>
        <p>学习习近平总书记重要指示，审计署金融二司一处副处长杨畅对"深化改革创新"有着真切的感受："针对金融领域复杂、多变、风险性高等特点，我们创新审计思路，选择有代表性的金融企业开展试点，组织实施多轮次中小金融机构专项审计。今后，我们还将进一步推高审计信息化水平，深化部门间贯通协同，高效锁定问题线索，牢牢守住不发生系统性风险的底线。"</p>
        <p>习近平总书记在重要指示中再次明确要求"着力构建集中统一、全面覆盖、权威高效的审计监督体系"。中国社会科学院财经战略研究院研究员汪德华表示，落实这一要求，要从强化制度基础、紧盯党中央重大决策部署、加强统筹协调和整体推进等多方面持续发力，及时反映影响经济安全的苗头性、倾向性、普遍性问题，以高质量审计监督护航经济社会高质量发展。</p>
        <p>习近平总书记强调的"不断提高审计监督质效"，是进一步做好审计工作的重要着力点。</p>
        <p>天津市南开区委书记、区委审计委员会主任马珊珊说："我们将坚定不移推动全方面制度更加健全完善，衔接配套，让问题发现在早、处置在小，以强有力的审计监督确保各项决策部署不折不扣落实见效。"</p>
        <p>审计机关成立40多年来，自身建设不断加强。此次接受表彰的全国审计机关先进工作者、审计署驻兰州特派员办事处资源环境审计处处长袁文平深以"打铁必须自身硬"的重要性。</p>
        <p>"我们要把习近平总书记提出的'加强自身建设'贯穿始终，筑牢理想信念根基，厚植家国情怀，以审计为民的境界情怀，通过强化专业学习和审计实践锻炼提升发现问题的能力，更好锻造'国家审计'金字招牌。"</p>
        <p>正在审计项目现场开展工作的审计署工作人员常子豪表示，要不断增强自身本领，在实际工作中做到真查真审、实查实报，为以中国式现代化全面推进强国建设、民族复兴伟业作出审计人新的贡献。</p>
        <p class="author-line">（新华社北京1月12日电 新华社记者）</p>

  <!-- Middle section: 好文章要"三平" -->
  <div style="text-align:center; margin: 15px 0;">
    <h2 style="font-size:28px; font-weight:bold; letter-spacing:5px;">好文章要"三平"</h2>
    <div class="author-name">许宝健</div>
  </div>

  <div class="improvement-box">
    <div class="icon">改进文风</div>
    <div class="text">大家谈</div>
  </div>

  <div class="two-col-article" style="margin: 10px 0;">
    <p>以，作者和读者被爱坐得一边高，这不仅是姿态问题，也是立场问题。</p>
    <p>好文章一定要有好文风。什么是好的文风？我认为好的文风就是要有亲近感。文章当然可以有不同的风格，但无论是"文似看山不喜平"，还是"画如交友须求淡"，都会让人产生亲近感，有了亲近感，才会与读者共情，才会有感染力。毛泽东同志认为，讲话、作文不仅要"短些短些再短些"，而且要"软些软些再软些"。我们今天还要"平些平些再平些"，这里强调的"平"，是以"实"为基础的"平"，是平而不平，不是平而空，实也不是平说，而是平实有味儿，平实可感。</p>
    <p>什么是好文章？好文章的标准是什么？在我眼里，好文章一定要体现了"三平"原则：一是平等，二是平实，三是平常，即平等的姿态、平实的风格、平常的表达。</p>
    <p>作者与读者的关系是一个很重要的问题。虽然不好一概而论，但总体上讲，应该是一种平等的关系。我们写政论文，首先要把这个前提搞清楚。每一篇文章就高高在上，自觉不自觉地把自己摆在教训人的位置，而把读者置于受教育的位置，这样的文章谁肯定不愿意看，自然也就谈不上好的传播效果。现在很多文章从头到尾充满"天上""新快句"，满篇都是"必须""一定""要"等开头的句子。文章一有了"官气"，"口气"自然会变大，姿态也有了高低之别，距离也就拉开了。所以，</p>
    <p>我常说，"平"来读读才是真。写文章从本质上讲是与人交流，最可贵的就是一个"真"字。讲一些无可厚非，但不能太讲究，不能过分追求，不能过去了，就失去了"真"的境界和状态，这和一个人化装过度是一个道理。如果要讲，恰恰要讲究一点平常心。作者为什么要写文章？就是因为有了想法需要和读者交流，有了平实心才会有平等的交流，才能在平常的交流中表达真情、体现诚意。</p>
    <p class="author-line">（作者系中央党校[国家行政学院]研究员、学习时报社原社长）</p>
  </div>

  <!-- 拉面摊 article -->
  <div class="noodle-title">拉 面 摊</div>
  <div style="text-align:center; font-size:13px; color:#666; margin-bottom:10px;">本报前方报道组</div>
  <div class="onsite-badge">我在现场</div>
  <div style="clear:both;"></div>

  <div class="two-col-article" style="margin: 10px 0;">
    <p>1月12日，天蒙蒙亮，记者来到西藏日喀则市桑珠孜区的临时安置点，这里的拉面摊已经忙活起来了。</p>
    <p>只见几个小伙各司其职：有的分面团，有的拉面，有的炒牛肉……</p>
    <p>头白帽白衬衫，每碗面浇上一勺色泽清亮的牛肉汤，递给排队等候的乡亲，并问过来的孩子："够不够？"添饭了没？要再加点牛肉吗？"</p>
    <p>"我们几个是在拉萨开民族特色餐厅的，有回族、东乡族……地震发生后，我们第一时间组织了20多人过来，就想着能做些实的藏族同胞和前来抗震救灾的人做点事！"抹去额头渗出的汗珠，日扎黑林神坚定，"这个时候，各民族更要像石榴籽一样紧紧抱在一起！"</p>
    <p class="author-line">（前方报道组成员：尕玛多吉、刘宇航、傅熠）</p>
  </div>

      <h2>共同富才算富</h2>
      <div class="byline">陈海波</div>
      <div class="rich-text">
        <p>自然禀赋不同，这导致发展不平衡问题短期内很难从根本上消除，农村地区尤甚。怎么办？</p>
        <p>改革开放以来，东西部扶贫协作和对口支援，已经让我们看到先富帮后富带来的山河巨变。在乡村全面振兴的路上，"先富"怎样更好带"后富"？十八洞村为我们提供了一个好的范例。</p>
        <p>共同富裕，是社会主义的本质要求，也是中国式现代化的重要特征。实现共同富裕，离不开先富带后富。先富起来的村子，有责任也有义务伸出援手。</p>
        <p>从"一家好"到"大家好"，从"自己富"到"共同富"，我们为这样的十八洞村叫好！</p>

    <!-- 做西部教育的"接棒人" -->
    <div class="article-block">
      <div class="continuous-badge">连续报道</div>
      <h2>做西部教育的"接棒人"，攒劲得很！</h2>
      <div class="byline">光明日报编辑部的忠实读者。最近，读到贵报刊登的报道《扎根西部，新时代学子这样选择》，真是感慨万千！这样的好报道，翻来覆去看了三四遍都舍不得放下。为啥？因为说出了我们想说的话！</div>
      <div class="rich-text">
        <p>我是河北人，本科就读于长安大学。读书期间，身边就有很多来自西部的同学。我和他们一起学习、生活、聊天交流，也结伴去了西部的很多地旅游、调研、社会实践。所见所闻，让我渐渐对这片美丽壮美的土地充满了感情。</p>
        <p>2023年，从天津大学化工学院博士毕业后，在很多人惊异的目光中，我选择回到西部，在新疆石河子大学当了一名老师。</p>
        <p>之所以下定决心把青春安放在新疆，一方面是源于多年前南疆陶然形成的"西部情"，另一方面，也是受到了一位良师益友——天津大学张金利教授的影响。</p>
        <p>张老师是国家第八批援疆干部，2014年担任石河子大学化学化工学院院长。但他的援疆生涯，实际上从2008年就开始了。16年来，他把自己的智慧和心血都献给了边疆的科研教育事业。毕业季，在我面对几个职业选择犹豫不决的时候，他找到了我，诚挚地说："小伙子，我代表石河子大学邀请你！那里需要你们，也一定会全心全意培养你！那里或许没有大城市的繁华，却有良好的科研环境，有很多发展机会。"</p>
        <p>我不再彷徨，踏上了西行之路。</p>
        <p>来到石河子大学，我发现，自己并不孤单。我的校友，天大化工学院2015届毕业生张海洋和李雪琴，凭借不懈努力和优异的科研成绩，毕业后几年双双破评为教授，每个新年，我都能从新入职教师中看到来自天南海北的身影……</p>
        <p>来到石河子大学的这一年，我不仅实现了从学生到教师的身份转变，也在科研路上不断前行。为了更好服务新疆的产业发展，我选定了印染行业及煤化工行业有机废水处理和回收的科研选题。依托石河子大学的科研平台，我顺利拿到了人生中第一个国家自然科学基金项目以及自治区相关项目。这样的科研支持，太给力了！</p>
        <p>谈起新疆，以前人们总会和"贫瘠""荒凉"等字眼挂上钩。其实，这早就是"老皇历"啦！这些年来，新疆无论在哪个领域还是工业领域，都有了长足进步。作为亲历者，我告诉天大，新疆不仅有"大西部的最后一滴眼泪"赛里木湖，有"中国最美公路"独库公路等数不胜数的美景，更有新疆大学、石河子大学等众多实力若渴的高等院校，她们会给你足够的平台支持，让你充分施展抱负，写就最壮美的青春篇章！</p>
        <p>来吧！我想把一位当地老师送给我的鼓励送给大家：做西部教育的"接棒人"，攒劲得很！</p>
        <p class="author-line">天津大学化工学院2023届毕业生、石河子大学青年教师 徐永胜<br>读者来信邮箱：gmbzgxb@163.com</p>
      </div>
