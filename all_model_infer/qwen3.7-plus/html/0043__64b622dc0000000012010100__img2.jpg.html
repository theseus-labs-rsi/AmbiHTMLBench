<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色 2023</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fff;
    max-width: 700px;
    margin: 0 auto;
    padding: 0;
  }

  .header {
    background: #E87722;
    padding: 20px 30px 25px 30px;
    position: relative;
    border-radius: 0 0 12px 12px;
    margin: 0 10px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .copyright {
    font-size: 28px;
    color: #fff;
    font-weight: bold;
  }

  .year {
    font-size: 28px;
    color: #000;
    font-weight: bold;
  }

  .header-title {
    text-align: center;
    font-size: 64px;
    font-weight: 900;
    color: #000;
    margin: 10px 0 5px 0;
    letter-spacing: 8px;
  }

  .header-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .dots {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-left: 10px;
  }

  .dot {
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
  }

  .dot.diamond {
    border-radius: 2px;
    transform: rotate(45deg);
    width: 8px;
    height: 8px;
  }

  .rui {
    font-size: 22px;
    color: #000;
    font-weight: bold;
    margin-right: 10px;
  }

  .description {
    padding: 25px 30px 10px 30px;
    font-size: 15px;
    line-height: 1.8;
    color: #333;
  }

  .card {
    margin: 20px 15px;
    border: 2.5px solid #E87722;
    border-radius: 16px;
    padding: 20px 22px 18px 22px;
  }

  .card-title {
    font-size: 22px;
    font-weight: bold;
    color: #000;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title .diamond-icon {
    color: #E87722;
    font-size: 16px;
  }

  .swatch {
    width: 100%;
    height: 130px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .swatch svg {
    width: 100%;
    height: 100%;
  }

  .card-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #555;
  }

  .bottom-bar {
    height: 30px;
    background: #E87722;
    margin: 20px 10px 0 10px;
    border-radius: 4px 4px 0 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="copyright">©</div>
    <div class="year">2023</div>
  </div>
  <div class="header-title">对比色配色</div>
  <div class="header-bottom">
    <div class="dots">
      <div class="dot diamond"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="rui">瑞</div>
  </div>
</div>

<div class="description">
  对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
</div>

<div class="card">
  <div class="card-title">
    富有朝气的配色 <span class="diamond-icon">✦</span>
  </div>
  <div class="swatch">
    <svg viewBox="0 0 600 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Green background -->
      <rect x="0" y="0" width="600" height="130" fill="#1B9E5A"/>
      <!-- Blue right portion -->
      <path d="M 300 0 L 600 0 L 600 130 L 300 130 C 320 110, 340 90, 310 70 C 280 50, 310 30, 300 0 Z" fill="#005BAA"/>
      <!-- Yellow middle wavy shape -->
      <path d="M 150 0 C 180 0, 200 10, 220 20 C 250 35, 280 25, 310 30 C 340 35, 370 40, 390 50 C 410 60, 420 70, 410 80 C 400 90, 380 95, 360 100 C 340 105, 310 110, 280 115 C 250 120, 220 125, 190 120 C 160 115, 140 105, 130 90 C 120 75, 125 60, 135 45 C 140 35, 145 20, 150 0 Z" fill="#F5D800"/>
    </svg>
  </div>
  <div class="card-desc">
    以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
  </div>
</div>

<div class="card">
  <div class="card-title">
    视觉冲击强烈的配色 <span class="diamond-icon">✦</span>
  </div>
  <div class="swatch">
    <svg viewBox="0 0 600 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Green left portion -->
      <rect x="0" y="0" width="200" height="130" fill="#8BC34A"/>
      <path d="M 0 0 L 200 0 C 210 15, 220 25, 210 40 C 200 55, 190 60, 200 75 C 210 90, 220 100, 210 115 C 200 125, 190 130, 180 130 L 0 130 Z" fill="#8BC34A"/>
      <!-- Pink right portion -->
      <rect x="320" y="0" width="280" height="130" fill="#FF1A6C"/>
      <path d="M 320 0 C 330 10, 340 20, 330 35 C 320 50, 310 55, 320 70 C 330 85, 340 95, 330 110 C 320 120, 310 130, 300 130 L 320 130 L 600 130 L 600 0 L 320 0 Z" fill="#FF1A6C"/>
      <!-- Black middle wavy shape -->
      <path d="M 170 0 C 200 0, 230 10, 260 20 C 290 30, 320 25, 350 30 C 380 35, 410 40, 430 50 C 450 60, 460 70, 450 80 C 440 90, 420 95, 400 100 C 380 105, 350 110, 320 115 C 290 120, 260 125, 230 120 C 200 115, 180 105, 170 90 C 160 75, 165 60, 175 45 C 180 35, 175 20, 170 0 Z" fill="#000"/>
    </svg>
  </div>
  <div class="card-desc">
    黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
  </div>
</div>

<div class="bottom-bar"></div>

</body>
</html>
