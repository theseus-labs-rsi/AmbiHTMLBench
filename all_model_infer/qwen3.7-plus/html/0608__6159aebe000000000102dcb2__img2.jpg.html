<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山里的約會 - TongCai 2021</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100%;
    min-height: 100vh;
    background: #e8f0e8;
    font-family: 'Noto Serif SC', serif;
    overflow-x: hidden;
  }

  .cover {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: linear-gradient(180deg, 
      #c8ddd4 0%, 
      #b8d4c8 15%, 
      #a8ccb8 25%, 
      #9cc4a8 35%, 
      #8db898 45%, 
      #7daa88 55%, 
      #6d9c78 65%, 
      #5d8e68 75%, 
      #4d8058 85%, 
      #3d7248 100%
    );
    overflow: hidden;
  }

  /* Sky area */
  .sky {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 55%;
    background: linear-gradient(180deg, 
      #d4e8e0 0%, 
      #c8e0d4 20%, 
      #b8d8c8 40%, 
      #a8d0b8 60%, 
      #98c8a8 80%, 
      #88c098 100%
    );
    z-index: 0;
  }

  .sky::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 20%, rgba(255,255,255,0.25) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 40%, rgba(255,255,255,0.2) 0%, transparent 45%),
      radial-gradient(ellipse at 40% 50%, rgba(255,255,255,0.15) 0%, transparent 50%);
  }

  /* Mountains */
  .mountains {
    position: absolute;
    top: 38%;
    left: 0;
    right: 0;
    height: 20%;
    z-index: 1;
  }

  .mountain {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 0 0;
  }

  .mountain-1 {
    left: 10%;
    width: 40%;
    height: 80%;
    background: #6a9e7a;
    opacity: 0.7;
  }

  .mountain-2 {
    left: 30%;
    width: 50%;
    height: 100%;
    background: #5a8e6a;
    opacity: 0.8;
  }

  .mountain-3 {
    right: 5%;
    width: 35%;
    height: 70%;
    background: #7aae8a;
    opacity: 0.6;
  }

  /* Trees line */
  .tree-line {
    position: absolute;
    top: 52%;
    left: 0;
    right: 0;
    height: 12%;
    z-index: 2;
    background: linear-gradient(180deg, 
      transparent 0%,
      #4a7a5a 30%,
      #3a6a4a 60%,
      #2a5a3a 100%
    );
    border-radius: 30% 40% 20% 30% / 60% 50% 40% 50%;
  }

  /* Field area */
  .field {
    position: absolute;
    top: 58%;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, 
      #8aaa7a 0%, 
      #7a9a6a 10%, 
      #6a8a5a 20%, 
      #5a7a4a 40%, 
      #4a6a3a 60%, 
      #3a5a2a 80%, 
      #2a4a1a 100%
    );
    z-index: 1;
  }

  .field::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 8px,
      rgba(100,140,80,0.3) 8px,
      rgba(100,140,80,0.3) 10px
    );
  }

  /* Content layer */
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    padding: 20px;
  }

  /* Top text */
  .top-text {
    text-align: right;
    padding: 15px 20px 10px;
    font-size: 13px;
    color: #2a3a2a;
    line-height: 1.8;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
  }

  /* Left vertical label */
  .left-label {
    position: absolute;
    left: 15px;
    top: 10px;
    writing-mode: vertical-rl;
    font-size: 22px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 8px;
    z-index: 20;
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* TongCai text */
  .tongcai {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: left center;
    font-size: 20px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 3px;
    z-index: 20;
    font-family: 'Noto Sans SC', sans-serif;
    white-space: nowrap;
  }

  /* Autumn text */
  .autumn {
    position: absolute;
    left: 15px;
    bottom: 80px;
    writing-mode: vertical-rl;
    font-size: 28px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 5px;
    z-index: 20;
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* Main title */
  .main-title {
    position: absolute;
    top: 8%;
    right: 15%;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title-right {
    writing-mode: vertical-rl;
    font-size: 72px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 10px;
    line-height: 1.2;
    font-family: 'Noto Serif SC', serif;
  }

  .title-left {
    writing-mode: vertical-rl;
    font-size: 64px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 10px;
    line-height: 1.2;
    font-family: 'Noto Serif SC', serif;
    position: absolute;
    right: 100px;
    top: 60px;
  }

  .title-de {
    font-size: 36px;
    font-weight: 700;
    color: #1a3a2a;
    position: absolute;
    right: 85px;
    top: 100px;
    font-family: 'Noto Serif SC', serif;
  }

  /* Watermark */
  .watermark {
    position: absolute;
    top: 52%;
    right: 20%;
    z-index: 20;
    text-align: center;
    font-size: 12px;
    color: #fff;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .watermark .heart {
    font-size: 16px;
    color: #fff;
  }

  .watermark .from {
    font-size: 10px;
    opacity: 0.8;
  }

  /* Bottom text columns */
  .bottom-text {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 30px;
    z-index: 20;
  }

  .bottom-col {
    text-align: center;
    font-size: 13px;
    color: #1a2a1a;
    line-height: 2;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 400;
  }

  /* Illustration placeholder */
  .illustration {
    position: absolute;
    top: 55%;
    left: 0;
    right: 0;
    bottom: 15%;
    z-index: 5;
  }

  /* People figures - simplified representations */
  .scene-people {
    position: absolute;
    top: 60%;
    left: 0;
    right: 0;
    height: 30%;
    z-index: 6;
  }

  .person {
    position: absolute;
    width: 12px;
    height: 24px;
    border-radius: 50% 50% 30% 30%;
  }

  /* Stone wall */
  .stone-wall {
    position: absolute;
    top: 62%;
    left: 5%;
    right: 5%;
    height: 8%;
    background: repeating-linear-gradient(
      90deg,
      #8a7a6a 0px,
      #8a7a6a 15px,
      #7a6a5a 15px,
      #7a6a5a 17px
    );
    z-index: 4;
    opacity: 0.6;
    border-radius: 2px;
  }

  /* House */
  .house {
    position: absolute;
    top: 56%;
    left: 15%;
    width: 40px;
    height: 25px;
    z-index: 5;
  }

  .house-roof {
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 12px solid #8a4a3a;
  }

  .house-body {
    width: 36px;
    height: 14px;
    background: #c8a888;
    margin: 0 auto;
  }

  /* Tree on right */
  .tree-right {
    position: absolute;
    top: 48%;
    right: 5%;
    width: 60px;
    height: 120px;
    z-index: 5;
  }

  .tree-canopy {
    width: 60px;
    height: 70px;
    background: #5a8a4a;
    border-radius: 50%;
    position: relative;
  }

  .tree-canopy::after {
    content: '';
    position: absolute;
    top: 10px;
    left: 10px;
    width: 40px;
    height: 50px;
    background: #6a9a5a;
    border-radius: 50%;
  }

  .tree-trunk {
    width: 8px;
    height: 50px;
    background: #6a5a4a;
    margin: 0 auto;
  }

  /* Oven/structure on right */
  .oven {
    position: absolute;
    top: 72%;
    right: 12%;
    width: 50px;
    height: 35px;
    background: #c8b8a8;
    border-radius: 50% 50% 10% 10%;
    z-index: 6;
  }

  .oven::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 15px;
    width: 20px;
    height: 20px;
    background: #3a2a1a;
    border-radius: 50% 50% 10% 10%;
  }

  /* Smoke */
  .smoke {
    position: absolute;
    top: 68%;
    right: 13%;
    width: 20px;
    height: 30px;
    background: rgba(200,200,200,0.4);
    border-radius: 50%;
    z-index: 5;
    filter: blur(5px);
  }

  /* Table */
  .table {
    position: absolute;
    top: 70%;
    right: 22%;
    width: 40px;
    height: 20px;
    background: #8a7a6a;
    z-index: 6;
  }

  .table::before, .table::after {
    content: '';
    position: absolute;
    bottom: -15px;
    width: 4px;
    height: 15px;
    background: #6a5a4a;
  }

  .table::before { left: 5px; }
  .table::after { right: 5px; }

  /* Crop rows */
  .crop-rows {
    position: absolute;
    top: 64%;
    left: 0;
    right: 0;
    height: 20%;
    z-index: 3;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 12px,
      rgba(80,120,60,0.3) 12px,
      rgba(80,120,60,0.3) 14px
    );
  }

  /* Adjusted layout */
  .cover-wrapper {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: #c8ddd4;
  }

  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .bg-sky {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, #d8ece4 0%, #c4e0d4 30%, #b0d4c4 60%, #9cc8b4 100%);
  }

  .bg-sky::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 30%, rgba(255,255,255,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.2) 0%, transparent 40%);
  }

  .bg-mountains {
    position: absolute;
    top: 35%;
    left: 0;
    right: 0;
    height: 20%;
  }

  .bg-mountains svg {
    width: 100%;
    height: 100%;
  }

  .bg-trees {
    position: absolute;
    top: 48%;
    left: 0;
    right: 0;
    height: 12%;
    background: linear-gradient(180deg, 
      transparent 0%,
      #5a8a5a 20%,
      #4a7a4a 50%,
      #3a6a3a 80%,
      #2a5a2a 100%
    );
    clip-path: polygon(
      0% 100%, 0% 60%, 3% 40%, 6% 50%, 10% 30%, 14% 45%, 18% 25%, 
      22% 40%, 26% 20%, 30% 35%, 34% 15%, 38% 30%, 42% 20%, 46% 35%, 
      50% 10%, 54% 25%, 58% 15%, 62% 30%, 66% 20%, 70% 35%, 74% 25%, 
      78% 40%, 82% 30%, 86% 45%, 90% 35%, 94% 50%, 97% 40%, 100% 55%, 100% 100%
    );
  }

  .bg-field {
    position: absolute;
    top: 55%;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, #7aaa6a 0%, #6a9a5a 20%, #5a8a4a 50%, #4a7a3a 80%, #3a6a2a 100%);
  }

  .bg-field::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40%;
    background: 
      repeating-linear-gradient(90deg, transparent 0px, transparent 20px, rgba(100,130,80,0.2) 20px, rgba(100,130,80,0.2) 22px),
      repeating-linear-gradient(0deg, transparent 0px, transparent 15px, rgba(90,120,70,0.15) 15px, rgba(90,120,70,0.15) 17px);
  }

  .text-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
  }

  .top-intro {
    position: absolute;
    top: 8px;
    right: 20px;
    text-align: right;
    font-size: 12px;
    color: #2a3a2a;
    line-height: 1.9;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    max-width: 420px;
  }

  .side-label {
    position: absolute;
    left: 12px;
    top: 10px;
    writing-mode: vertical-rl;
    font-size: 20px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 6px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .side-tongcai {
    position: absolute;
    left: 12px;
    top: 45%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-size: 18px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 2px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .side-autumn {
    position: absolute;
    left: 12px;
    bottom: 60px;
    writing-mode: vertical-rl;
    font-size: 24px;
    font-weight: 700;
    color: #1a3a2a;
    letter-spacing: 4px;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .title-container {
    position: absolute;
    top: 5%;
    right: 12%;
    z-index: 15;
  }

  .title-col-right {
    writing-mode: vertical-rl;
    font-size: 68px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 8px;
    font-family: 'Noto Serif SC', serif;
    position: absolute;
    right: 0;
    top: 0;
  }

  .title-col-left {
    writing-mode: vertical-rl;
    font-size: 60px;
    font-weight: 900;
    color: #1a3a2a;
    letter-spacing: 8px;
    font-family: 'Noto Serif SC', serif;
    position: absolute;
    right: 80px;
    top: 50px;
  }

  .title-de-char {
    position: absolute;
    right: 72px;
    top: 90px;
    font-size: 32px;
    font-weight: 700;
    color: #1a3a2a;
    font-family: 'Noto Serif SC', serif;
  }

  .watermark-area {
    position: absolute;
    top: 50%;
    right: 18%;
    text-align: center;
    z-index: 15;
    color: #fff;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .watermark-area .wm-name {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
  }

  .watermark-area .wm-from {
    font-size: 10px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .bottom-poems {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 40px;
    z-index: 15;
  }

  .poem-col {
    text-align: center;
    font-size: 12px;
    color: #1a2a1a;
    line-height: 2.2;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 400;
  }

  /* Scene elements */
  .scene-layer {
    position: absolute;
    top: 55%;
    left: 0;
    right: 0;
    bottom: 12%;
    z-index: 5;
  }

  .stone-wall-line {
    position: absolute;
    top: 15%;
    left: 8%;
    right: 8%;
    height: 6%;
    background: linear-gradient(90deg, 
      #9a8a7a, #8a7a6a, #9a8a7a, #7a6a5a, #8a7a6a, #9a8a7a, #8a7a6a
    );
    opacity: 0.5;
    border-radius: 1px;
  }

  .house-small {
    position: absolute;
    top: 8%;
    left: 18%;
    z-index: 6;
  }

  .house-small .roof {
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-bottom: 10px solid #a05040;
  }

  .house-small .body {
    width: 30px;
    height: 12px;
    background: #d4b898;
    margin-left: 3px;
  }

  .tree-big {
    position: absolute;
    top: 0;
    right: 3%;
    z-index: 6;
  }

  .tree-big .canopy {
    width: 70px;
    height: 80px;
    background: radial-gradient(ellipse, #6a9a5a 0%, #5a8a4a 60%, #4a7a3a 100%);
    border-radius: 50%;
    position: relative;
  }

  .tree-big .canopy::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 10px;
    width: 50px;
    height: 60px;
    background: radial-gradient(ellipse, #7aaa6a 0%, #6a9a5a 100%);
    border-radius: 50%;
  }

  .tree-big .trunk {
    width: 10px;
    height: 40px;
    background: #7a6a5a;
    margin: 0 auto;
  }

  .oven-structure {
    position: absolute;
    top: 55%;
    right: 10%;
    width: 55px;
    height: 40px;
    background: radial-gradient(ellipse at 50% 80%, #d4c4b4 0%, #c4b4a4 100%);
    border-radius: 50% 50% 10% 10%;
    z-index: 6;
  }

  .oven-structure::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 18px;
    width: 20px;
    height: 22px;
    background: #3a2a1a;
    border-radius: 50% 50% 5% 5%;
  }

  .smoke-puff {
    position: absolute;
    top: 42%;
    right: 11%;
    width: 25px;
    height: 20px;
    background: rgba(220,220,220,0.5);
    border-radius: 50%;
    filter: blur(4px);
    z-index: 5;
  }

  .table-structure {
    position: absolute;
    top: 50%;
    right: 20%;
    width: 45px;
    height: 8px;
    background: #8a7a6a;
    z-index: 6;
  }

  .table-structure::before,
  .table-structure::after {
    content: '';
    position: absolute;
    top: 8px;
    width: 4px;
    height: 18px;
    background: #6a5a4a;
  }

  .table-structure::before { left: 5px; }
  .table-structure::after { right: 5px; }

  /* People dots */
  .people-dots {
    position: absolute;
    top: 20%;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7;
  }

  .person-dot {
    position: absolute;
    border-radius: 50% 50% 40% 40%;
  }

  .pd1 { top: 10%; left: 15%; width: 8px; height: 16px; background: #5a7aaa; }
  .pd2 { top: 5%; left: 22%; width: 10px; height: 18px; background: #aa6a5a; }
  .pd3 { top: 15%; left: 30%; width: 9px; height: 17px; background: #6a8a5a; }
  .pd4 { top: 8%; left: 38%; width: 8px; height: 16px; background: #aa8a5a; }
  .pd5 { top: 20%; left: 45%; width: 10px; height: 18px; background: #8a6a8a; }
  .pd6 { top: 12%; left: 52%; width: 9px; height: 17px; background: #5a8a7a; }
  .pd7 { top: 18%; left: 58%; width: 8px; height: 16px; background: #aa7a6a; }
  .pd8 { top: 5%; left: 65%; width: 10px; height: 18px; background: #6a7a9a; }
  .pd9 { top: 15%; left: 72%; width: 9px; height: 17px; background: #8a9a6a; }
  .pd10 { top: 10%; left: 80%; width: 8px; height: 16px; background: #aa6a7a; }
  .pd11 { top: 25%; left: 20%; width: 10px; height: 18px; background: #7a6a9a; }
  .pd12 { top: 30%; left: 35%; width: 9px; height: 17px; background: #9a7a5a; }
  .pd13 { top: 28%; left: 50%; width: 8px; height: 16px; background: #5a9a7a; }
  .pd14 { top: 35%; left: 60%; width: 10px; height: 18px; background: #8a6a5a; }
  .pd15 { top: 32%; left: 75%; width: 9px; height: 17px; background: #6a8a9a; }
  .pd16 { top: 40%; left: 25%; width: 8px; height: 16px; background: #aa8a7a; }
  .pd17 { top: 38%; left: 42%; width: 10px; height: 18px; background: #7a9a6a; }
  .pd18 { top: 45%; left: 55%; width: 9px; height: 17px; background: #9a6a8a; }
  .pd19 { top: 42%; left: 68%; width: 8px; height: 16px; background: #6a7a8a; }
  .pd20 { top: 50%; left: 30%; width: 10px; height: 18px; background: #8a7a6a; }
