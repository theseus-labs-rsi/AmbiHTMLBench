<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营 48个必备工具</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #2d5a3d;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 620px;
    width: 100%;
    padding: 40px 30px 50px;
  }

  .title {
    color: #ffffff;
    font-size: 52px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .title .line1 {
    display: block;
  }

  .title .line2 {
    display: block;
  }

  .banner {
    background-color: #e8c840;
    color: #2d5a3d;
    display: inline-block;
    padding: 8px 20px;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 35px;
    border-radius: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: auto auto auto auto;
    gap: 12px;
  }

  .card {
    padding: 18px 16px;
    border-radius: 4px;
    color: #ffffff;
  }

  .card .part-label {
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 8px;
    opacity: 0.95;
  }

  .card .part-content {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.5;
  }

  .card-01 {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
    background-color: #7a9e7e;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 200px;
  }

  .card-02 {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
    background-color: #7a9e7e;
  }

  .card-03 {
    grid-column: 2 / 3;
    grid-row: 2 / 3;
    background-color: #7a9e7e;
  }

  .card-04 {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
    background-color: #7a9e7e;
  }

  .card-05 {
    grid-column: 3 / 5;
    grid-row: 1 / 2;
    background-color: #5a9e6a;
  }

  .card-06 {
    grid-column: 3 / 4;
    grid-row: 2 / 4;
    background-color: #5a9e6a;
    min-height: 200px;
  }

  .card-07 {
    grid-column: 4 / 5;
    grid-row: 2 / 3;
    background-color: #5a9e6a;
  }

  .card-08 {
    grid-column: 4 / 5;
    grid-row: 3 / 4;
    background-color: #5a9e6a;
  }

  @media (max-width: 500px) {
    .title {
      font-size: 36px;
    }
    .grid {
      grid-template-columns: 1fr 1fr;
    }
    .card-01 { grid-column: 1 / 2; grid-row: 1 / 2; min-height: auto; }
    .card-02 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .card-03 { grid-column: 1 / 2; grid-row: 2 / 3; }
    .card-04 { grid-column: 2 / 3; grid-row: 2 / 3; }
    .card-05 { grid-column: 1 / 3; grid-row: 3 / 4; }
    .card-06 { grid-column: 1 / 2; grid-row: 4 / 5; min-height: auto; }
    .card-07 { grid-column: 2 / 3; grid-row: 4 / 5; }
    .card-08 { grid-column: 1 / 3; grid-row: 5 / 6; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title">
      <span class="line1">TikTok运营</span>
      <span class="line2">48个必备工具</span>
    </div>
    <div class="banner">@ 徐徐教你做TikTok</div>
    <div class="grid">
      <div class="card card-01">
        <div class="part-label">Part 01</div>
        <div class="part-content">7个TK<br>数据平台</div>
      </div>
      <div class="card card-02">
        <div class="part-label">Part 02</div>
        <div class="part-content">3个好用<br>选品网站</div>
      </div>
      <div class="card card-03">
        <div class="part-label">Part 03</div>
        <div class="part-content">5个视频<br>素材网站</div>
      </div>
      <div class="card card-04">
        <div class="part-label">Part 04</div>
        <div class="part-content">6个TK数据分析网站</div>
      </div>
      <div class="card card-05">
        <div class="part-label">Part 05</div>
        <div class="part-content">4个剪辑<br>4个翻译软件</div>
      </div>
      <div class="card card-06">
        <div class="part-label">Part 06</div>
        <div class="part-content">8个TK<br>传输管理<br>网站</div>
      </div>
      <div class="card card-07">
        <div class="part-label">Part 07</div>
        <div class="part-content">5个BGM<br>网站</div>
      </div>
      <div class="card card-08">
        <div class="part-label">Part 08</div>
        <div class="part-content">7个投放<br>联盟网站</div>
      </div>
    </div>
  </div>
</body>
</html>
