<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国朝妻管严疑有私生子</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #d4c4b8;
    font-family: "SimSun", "STSong", "Songti SC", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    display: flex;
    align-items: flex-start;
    max-width: 900px;
    width: 100%;
    background-color: #d4c4b8;
    padding: 20px 10px;
  }

  .banners {
    display: flex;
    flex-shrink: 0;
    margin-right: 30px;
    gap: 8px;
  }

  .banner {
    writing-mode: vertical-rl;
    text-orientation: upright;
    background-color: #2a2a2a;
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
    padding: 12px 10px;
    letter-spacing: 6px;
    line-height: 1.6;
    white-space: nowrap;
  }

  .banner:first-child {
    font-size: 20px;
  }

  .content {
    flex: 1;
    padding-top: 10px;
  }

  .content p {
    font-size: 17px;
    line-height: 2;
    color: #1a1a1a;
    margin-bottom: 18px;
    text-align: justify;
  }

  .content .source {
    text-align: center;
    margin-bottom: 22px;
    font-size: 17px;
  }

  .content .prescription {
    font-size: 17px;
    line-height: 2;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="container">
  <div class="banners">
    <div class="banner">福国王夫人震怒欲逐之</div>
    <div class="banner">国朝妻管严疑有私生子</div>
  </div>
  <div class="content">
    <p>瞳孔地震！将王安石抬进孔庙的好女婿蔡卞近日疑似陷入私生子风波。蔡卞妻福国夫人王氏闻之震怒，欲除妾生子，因故生病。</p>
    <p class="source">本消息来自翰林医官院药方笔录：</p>
    <p class="prescription">《香术散》：治妊娠五个月已后。常胸腹间气刺满痛，或肠鸣，以至呕逆减食。此由喜怒忧虑过度、饮食失节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病。医官王师复处此方三服而愈，后用果验。</p>
  </div>
</div>
</body>
</html>
