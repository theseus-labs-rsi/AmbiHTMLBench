<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    color: #333;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 40px;
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .title-block {
    flex: 1;
  }

  .title-line {
    display: inline-block;
    background: #f5e642;
    padding: 4px 12px;
    font-size: 36px;
    font-weight: 900;
    color: #222;
    line-height: 1.4;
    margin-bottom: 2px;
  }

  .title-line2 {
    display: inline-block;
    background: #f5e642;
    padding: 4px 12px;
    font-size: 36px;
    font-weight: 900;
    color: #222;
    line-height: 1.4;
  }

  .circle-number {
    width: 80px;
    height: 80px;
    border: 2px solid #ddd;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    color: #333;
    margin-left: 20px;
    flex-shrink: 0;
  }

  .subtitle {
    font-size: 15px;
    color: #555;
    margin-top: 12px;
    margin-bottom: 25px;
  }

  .section-box {
    border-radius: 12px;
    padding: 25px 30px;
    margin-bottom: 20px;
    position: relative;
    min-height: 220px;
  }

  .section-box.pink {
    background: #fdf0f0;
  }

  .section-box.blue {
    background: #f0f4ff;
  }

  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
  }

  .icon-circle {
    width: 28px;
    height: 28px;
    border: 2.5px solid #d4a574;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .icon-x {
    width: 28px;
    height: 28px;
    margin-right: 12px;
    flex-shrink: 0;
    position: relative;
  }

  .icon-x::before,
  .icon-x::after {
    content: '';
    position: absolute;
    width: 28px;
    height: 3px;
    background: #7ba3d4;
    top: 50%;
    left: 0;
  }

  .icon-x::before {
    transform: rotate(45deg);
  }

  .icon-x::after {
    transform: rotate(-45deg);
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: #333;
  }

  .example-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .example-text {
    flex: 1;
  }

  .example-line {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
    line-height: 1.8;
  }

  .example-line strong {
    font-weight: 700;
  }

  .badge-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    margin-right: 12px;
    min-width: 50px;
    text-align: center;
  }

  .badge.red {
    background: #e87070;
  }

  .badge.pink-badge {
    background: #f08080;
  }

  .badge-text {
    font-size: 16px;
    color: #333;
  }

  .character-placeholder {
    width: 100px;
    height: 110px;
    flex-shrink: 0;
    margin-left: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .character-img {
    width: 90px;
    height: 100px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #999;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 30px;
    padding-top: 10px;
  }

  .footer-left {
    font-size: 11px;
    color: #888;
    line-height: 1.5;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .footer-logo {
    width: 50px;
    height: 35px;
    border: 1px solid #ccc;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #666;
    background: #f9f9f9;
  }

  .footer-logo-text {
    font-size: 10px;
    color: #666;
    text-align: center;
    line-height: 1.3;
  }

  .example-group {
    margin-bottom: 15px;
  }

  .example-group:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="title-block">
    <div class="title-line">使用合理的</div><br>
    <div class="title-line2">标点符号</div>
  </div>
  <div class="circle-number">01</div>
</div>

<div class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</div>

<div class="section-box pink">
  <div class="section-header">
    <div class="icon-circle"></div>
    <div class="section-title">使用直线或外框</div>
  </div>
  <div class="example-content">
    <div class="example-text">
      <div class="example-group">
        <div class="example-line"><strong>地点</strong> ｜ 武汉国际会展中心</div>
        <div class="example-line"><strong>时间</strong> ｜ 2018 年 8 月 20 日</div>
      </div>
      <div class="example-group" style="margin-top: 18px;">
        <div class="badge-row">
          <span class="badge red">地点</span>
          <span class="badge-text">武汉国际会展中心</span>
        </div>
        <div class="badge-row">
          <span class="badge pink-badge">时间</span>
          <span class="badge-text">2018 年 8 月 20 日</span>
        </div>
      </div>
    </div>
    <div class="character-placeholder">
      <div class="character-img">[卡通形象：戴墨镜的黄色小鸡]</div>
    </div>
  </div>
</div>

<div class="section-box blue">
  <div class="section-header">
    <div class="icon-x"></div>
    <div class="section-title">使用冒号</div>
  </div>
  <div class="example-content">
    <div class="example-text">
      <div class="example-group" style="margin-top: 30px;">
        <div class="example-line"><strong>地点：</strong>武汉国际会展中心</div>
        <div class="example-line"><strong>时间：</strong>2018 年 8 月 20 日</div>
      </div>
    </div>
    <div class="character-placeholder">
      <div class="character-img">[卡通形象：生气的黄色小鸡]</div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-left">
    ADVERTISING CREATIVITY<br>
    2021.01
  </div>
  <div class="footer-right">
    <div class="footer-logo">
      <div class="footer-logo-text">
        GRAPHIC DESIGN<br>
        大猫<br>
        设计部
      </div>
    </div>
  </div>
</div>

</body>
</html>
