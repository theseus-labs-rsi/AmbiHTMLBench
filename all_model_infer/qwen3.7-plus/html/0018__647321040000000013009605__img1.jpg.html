<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAY3 特色路线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    max-width: 700px;
    margin: 0 auto;
    padding: 10px;
    position: relative;
  }

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 15px;
  }
  .day3 {
    font-size: 42px;
    font-weight: 900;
    color: #f5a623;
    text-shadow: 2px 2px 0 #f5c87a;
    font-style: italic;
    position: relative;
  }
  .day3::before {
    content: "〰";
    position: absolute;
    top: -15px;
    left: -5px;
    font-size: 20px;
    color: #f5a623;
  }
  .route-title {
    background: #b8e94a;
    color: #1a1a1a;
    font-size: 36px;
    font-weight: 900;
    padding: 6px 20px;
    border-radius: 8px;
  }

  .content {
    position: relative;
    min-height: 700px;
  }

  .location {
    position: absolute;
  }

  .loc-img {
    width: 220px;
    height: 140px;
    object-fit: cover;
    border-radius: 6px;
    background: #ddd;
    display: block;
  }

  .loc-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: #fde8e0;
    padding: 3px 12px;
    border-radius: 15px;
    margin-top: 4px;
  }
  .loc-label .pin {
    color: #e74c3c;
    font-size: 16px;
  }

  .desc-text {
    font-size: 15px;
    color: #5b4a8a;
    line-height: 1.6;
    font-weight: bold;
  }

  .arrow-text {
    font-size: 16px;
    font-weight: bold;
    color: #e74c3c;
    line-height: 1.4;
  }

  /* Positioning */
  .naxianghai {
    top: 10px;
    left: 10px;
  }
  .naxianghai .loc-img {
    width: 230px;
    height: 130px;
  }

  .art-text {
    top: 5px;
    left: 260px;
    width: 120px;
  }

  .sunset {
    top: 10px;
    right: 10px;
  }
  .sunset .loc-img {
    width: 240px;
    height: 140px;
  }
  .sunset-label {
    top: 155px;
    right: 30px;
  }

  .taxi-11 {
    top: 170px;
    left: 270px;
    text-align: center;
  }

  .jimindao {
    top: 200px;
    left: 10px;
  }
  .jimindao .loc-img {
    width: 240px;
    height: 150px;
  }

  .cliff-text {
    top: 230px;
    left: 260px;
    width: 140px;
  }

  .cableway {
    top: 210px;
    right: 10px;
  }
  .cableway .loc-img {
    width: 230px;
    height: 150px;
  }

  .taxi-33 {
    top: 175px;
    right: 10px;
    text-align: right;
  }

  .taxi-5 {
    top: 420px;
    left: 10px;
  }

  .coastline-text {
    top: 490px;
    left: 10px;
    width: 180px;
  }

  .xiaowudui {
    top: 430px;
    left: 200px;
  }
  .xiaowudui .loc-img {
    width: 260px;
    height: 160px;
  }

  .taxi-20 {
    top: 430px;
    right: 10px;
    text-align: right;
  }

  .enjoy-text {
    top: 500px;
    right: 10px;
    width: 170px;
  }

  /* SVG arrows overlay */
  .arrows-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .section-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-bottom: 10px;
    position: relative;
  }

  .col-left { width: 260px; }
  .col-center { width: 160px; }
  .col-right { width: 240px; }

  .img-placeholder {
    background: linear-gradient(135deg, #87CEEB 0%, #4a90d9 50%, #2c5f8a 100%);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    text-align: center;
    overflow: hidden;
  }

  .img-sunset {
    background: linear-gradient(180deg, #ff9a76 0%, #ff6b6b 30%, #c0392b 60%, #2c3e50 100%);
  }

  .img-cableway {
    background: linear-gradient(135deg, #74b9ff 0%, #0984e3 50%, #2d3436 100%);
  }

  .img-windmill {
    background: linear-gradient(180deg, #dfe6e9 0%, #b2bec3 40%, #636e72 100%);
  }

  .img-beach {
    background: linear-gradient(180deg, #74b9ff 0%, #0984e3 30%, #ffeaa7 70%, #fdcb6e 100%);
  }

  .route-container {
    position: relative;
    padding: 10px;
  }

  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 5px;
  }

  .row-middle {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 10px;
  }

  .row-bottom {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-top: 10px;
    position: relative;
  }

  .block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .block-left { align-items: flex-start; }
  .block-right { align-items: flex-end; }

  .center-desc {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px;
  }

  .arrow-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: #e74c3c;
    padding: 5px;
  }

  .arrow-down {
    font-size: 30px;
    color: #e74c3c;
  }

  .arrow-curve-right {
    font-size: 30px;
    color: #e74c3c;
  }

  .arrow-curve-left {
    font-size: 30px;
    color: #e74c3c;
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 10px;
  }

  .bottom-center {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flex-container {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .mid-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-top: 15px;
  }

  .bot-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-top: 15px;
  }

  .img-box {
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .label-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #fde8e0;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 17px;
    font-weight: bold;
    color: #333;
    margin-top: 6px;
  }

  .label-tag .dot {
    width: 12px;
    height: 12px;
    background: #e74c3c;
    border-radius: 50%;
    display: inline-block;
  }

  .purple-text {
    color: #6c5ce7;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.7;
  }

  .red-text {
    color: #e74c3c;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.5;
  }

  .center-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 140px;
  }

  .spacer { height: 20px; }

  .img-beach-umbrella {
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 40%, #f0e68c 40%, #f0e68c 60%, #deb887 60%, #deb887 100%);
    position: relative;
  }

  .img-beach-umbrella::after {
    content: "🏖️ 那香海海滩";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .img-sunset-scene {
    background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 30%, #ff9a76 50%, #2c3e50 85%, #1a252f 100%);
    position: relative;
  }

  .img-sunset-scene::after {
    content: "🌅 那香海落日";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .img-island {
    background: linear-gradient(180deg, #74b9ff 0%, #0984e3 40%, #2d3436 70%, #636e72 100%);
    position: relative;
  }

  .img-island::after {
    content: "🏝️ 鸡鸣岛";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .img-cable {
    background: linear-gradient(180deg, #74b9ff 0%, #0984e3 30%, #2d3436 60%, #00b894 100%);
    position: relative;
  }

  .img-cable::after {
    content: "🚡 摩天岭索道";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .img-station {
    background: linear-gradient(180deg, #dfe6e9 0%, #b2bec3 30%, #636e72 60%, #2d3436 100%);
    position: relative;
  }

  .img-station::after {
    content: "🏠 小五队抱海驿站";
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }

  .svg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .main-wrapper {
    position: relative;
  }

  .grid-layout {
    display: grid;
    grid-template-columns: 260px 1fr 240px;
    grid-template-rows: auto auto auto;
    gap: 10px;
    position: relative;
  }

  .cell {
    display: flex;
    flex-direction: column;
  }

  .cell-center-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 10px;
  }

  .cell-center-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .cell-bottom-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .cell-bottom-center {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cell-bottom-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .img-container {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  .img-container img, .img-container .img-placeholder {
    width: 100%;
    display: block;
  }

  .img-placeholder {
    height: 130px;
  }

  .img-placeholder.tall {
    height: 150px;
  }

  .img-placeholder.wide {
    height: 160px;
  }

  .arrow-label {
    color: #e74c3c;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    line-height: 1.4;
    margin: 5px 0;
  }

  .desc-purple {
    color: #6c5ce7;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.7;
  }

  .desc-purple-right {
    color: #6c5ce7;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.7;
    text-align: right;
  }

  .label-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .pin-dot {
    width: 14px;
    height: 14px;
    background: #e74c3c;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .label-text {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: #fde8e0;
    padding: 3px 14px;
    border-radius: 18px;
  }

  .label-text-center {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: #fde8e0;
    padding: 3px 14px;
    border-radius: 18px;
  }

  .bottom-layout {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 10px;
    gap: 10px;
  }

  .bottom-left-col {
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .bottom-center-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .bottom-right-col {
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .arrow-svg-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="day3">DAY3</div>
  <div class="route-title">3.特色路线</div>
</div>

<div class="main-wrapper" style="position:relative; min-height: 680px;">

  <!-- SVG Arrows -->
  <svg class="arrow-svg-container" viewBox="0 0 700 680" xmlns="http://www.w3.org/2000/svg">
    <!-- Arrow: 那香海 → 悬崖书吧 (打车11分钟) -->
    <path d="M 240 170 Q 260 220 270 260" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <!-- Arrow: 摩天岭索道 → 那香海落日 (打车33分钟) -->
    <path d="M 530 370 Q 620 300 640 200" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <!-- Arrow: 鸡鸣岛 → 小五队抱海驿站 (打车5分钟) -->
    <path d="M 130 380 Q 160 440 220 470" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <!-- Arrow: 小五队抱海驿站 → 摩天岭索道 (打车20分钟) -->
    <path d="M 460 530 Q 560 490 580 420" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>

    <defs>
      <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
        <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
      </marker>
    </defs>
  </svg>

  <!-- Top Row -->
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:5px;">
    <!-- 那香海 -->
    <div style="width:240px; display:flex; flex-direction:column; align-items:flex-start;">
      <div class="img-container">
        <div class="img-placeholder img-beach-umbrella" style="height:130px; background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 35%, #f5deb3 35%, #f5deb3 55%, #deb887 55%, #deb887 100%);">
          <div style="position:absolute; top:30%; left:20%; width:60px; height:50px; background:#c4a35a; border-radius:50% 50% 0 0; transform:rotate(-10deg);"></div>
          <div style="position:absolute; top:30%; left:50%; width:60px; height:50px; background:#c4a35a; border-radius:50% 50% 0 0; transform:rotate(10deg);"></div>
          <div style="position:absolute; bottom:0; left:35%; width:4px; height:45%; background:#8B7355;"></div>
          <div style="position:absolute; bottom:0; left:55%; width:4px; height:45%; background:#8B7355;"></div>
        </div>
      </div>
      <div class="label-row">
        <span class="pin-dot"></span>
        <span class="label-text">那香海</span>
      </div>
    </div>

    <!-- Center top: art text + taxi 11 -->
    <div style="width:140px; display:flex; flex-direction:column; align-items:center; padding-top:5px;">
      <div class="desc-purple" style="text-align:center; font-size:16px;">艺术感满<br>满，适合<br>出片</div>
      <div class="arrow-label" style="margin-top:30px;">打车11<br>分钟</div>
    </div>

    <!-- 那香海落日 -->
    <div style="width:240px; display:flex; flex-direction:column; align-items:flex-end;">
      <div class="img-container">
        <div class="img-placeholder img-sunset-scene" style="height:140px; background: linear-gradient(180deg, #ff9a76 0%, #ff7e5f 20%, #feb47b 40%, #c0392b 70%, #2c3e50 90%, #1a252f 100%); position:relative;">
          <div style="position:absolute; top:25%; left:40%; width:20px; height:20px; background:#ff4500; border-radius:50%; box-shadow: 0 0 15px #ff4500;"></div>
          <div style="position:absolute; bottom:30%; left:30%; width:60px; height:8px; background:#2c3e50; border-radius:2px;"></div>
          <div style="position:absolute; bottom:28%; left:35%; width:3px; height:15px; background:#2c3e50;"></div>
        </div>
      </div>
      <div class="label-row" style="margin-top:6px;">
        <span class="pin-dot"></span>
        <span class="label-text">那香海落日</span>
      </div>
      <div class="arrow-label" style="text-align:right; margin-top:2px;">打车33分钟</div>
    </div>
  </div>

  <!-- Middle Row -->
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-top:15px;">
    <!-- 鸡鸣岛 -->
    <div style="width:240px; display:flex; flex-direction:column; align-items:flex-start;">
      <div class="img-container">
        <div class="img-placeholder img-island" style="height:150px; background: linear-gradient(180deg, #74b9ff 0%, #0984e3 35%, #2d3436 65%, #636e72 100%); position:relative;">
          <div style="position:absolute; bottom:20%; left:20%; width:40px; height:60px; background:#2d3436; border-radius:3px;"></div>
          <div style="position:absolute; bottom:35%; left:25%; width:30px; height:3px; background:#636e72; transform:rotate(-30deg);"></div>
          <div style="position:absolute; bottom:20%; left:55%; width:35px; height:50px; background:#2d3436; border-radius:3px;"></div>
          <div style="position:absolute; bottom:30%; left:58%; width:25px; height:3px; background:#636e72; transform:rotate(20deg);"></div>
        </div>
      </div>
      <div class="label-row">
        <span class="pin-dot"></span>
        <span class="label-text">鸡鸣岛</span>
      </div>
    </div>

    <!-- Center: cliff text -->
    <div style="width:140px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:20px;">
      <div class="desc-purple" style="text-align:center; font-size:16px;">悬崖书吧<br>、婚礼教<br>堂、悬崖<br>咖啡厅</div>
    </div>

    <!-- 摩天岭索道 -->
    <div style="width:240px; display:flex; flex-direction:column; align-items:flex-end;">
      <div class="img-container">
        <div class="img-placeholder img-cable" style="height:150px; background: linear-gradient(180deg, #74b9ff 0%, #0984e3 25%, #00b894 50%, #2d3436 75%, #636e72 100%); position:relative;">
          <div style="position:absolute; top:20%; right:20%; width:30px; height:20px; background:#dfe6e9; border-radius:4px; border:2px solid #636e72;"></div>
          <div style="position:absolute; top:15%; left:10%; right:10%; height:2px; background:#636e72;"></div>
          <div style="position:absolute; top:10%; right:30%; width:2px; height:25%; background:#636e72;"></div>
        </div>
      </div>
      <div class="label-row">
        <span class="pin-dot"></span>
        <span class="label-text">摩天岭索道</span>
      </div>
    </div>
  </div>

  <!-- Bottom Row -->
  <div class="bottom-layout">
    <!-- Bottom left: taxi 5 + coastline text -->
    <div class="bottom-left-col">
      <div class="arrow-label" style="text-align:left; font-size:18px;">打车5<br>分钟</div>
      <div class="desc-purple" style="margin-top:10px; font-size:16px;">威海绝美海岸线<br>私藏童话般露营地</div>
    </div>

    <!-- Bottom center: 小五队抱海驿站 -->
    <div class="bottom-center-col">
      <div class="img-container" style="width:260px;">
        <div class="img-placeholder img-station wide" style="height:160px; background: linear-gradient(180deg, #dfe6e9 0%, #b2bec3 25%, #636e72 50%, #2d3436 75%, #00b894 100%); position:relative;">
          <div style="position:absolute; bottom:15%; left:20%; width:50px; height:40px; background:#dfe6e9; border-radius:3px;"></div>
          <div style="position:absolute; bottom:15%; left:20%; width:50px; height:15px; background:#e17055; clip-path: polygon(0 100%, 50% 0, 100% 100%);"></div>
