<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富人眼中的富人是咋样？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #1a2a5e 0%, #0d1b3e 40%, #0a1530 70%, #060e22 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        h1 {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #ffffff;
            padding-bottom: 12px;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #ffffff;
        }

        th, td {
            border: 1.5px solid #ffffff;
            padding: 14px 16px;
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
        }

        th {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 16px;
        }

        td:first-child {
            text-align: left;
        }

        td:last-child {
            text-align: center;
        }

        .merged-row td {
            text-align: center;
            font-size: 15px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
        }

        .question-cell {
            text-align: left !important;
        }

        .answer-cell {
            text-align: center !important;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
                letter-spacing: 2px;
            }

            th, td {
                font-size: 13px;
                padding: 10px 8px;
            }

            th {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>富人眼中的富人是咋样？</h1>
        <table>
            <thead>
                <tr>
                    <th style="width: 65%;">问题</th>
                    <th style="width: 35%;">回答</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="question-cell">1.您觉得高净值人群资产拥有多少钱才算是？</td>
                    <td class="answer-cell">1亿7,388.4万元</td>
                </tr>
                <tr class="merged-row">
                    <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
                </tr>
                <tr>
                    <td class="question-cell">2.请问您每天工作小时数是？</td>
                    <td class="answer-cell">8.2小时</td>
                </tr>
                <tr>
                    <td class="question-cell">3.您预计退休年龄？</td>
                    <td class="answer-cell">59岁</td>
                </tr>
                <tr>
                    <td class="question-cell">4.您希望能活到多少岁？</td>
                    <td class="answer-cell">88.2岁</td>
                </tr>
                <tr class="merged-row">
                    <td colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
                </tr>
                <tr>
                    <td class="question-cell">5.请问您曾去过国家数量（包括商务出差）</td>
                    <td class="answer-cell">6.2个国家</td>
                </tr>
                <tr>
                    <td class="question-cell">6.请问您平均每月阅读书籍数量</td>
                    <td class="answer-cell">2.4本书</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
