<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea Cliff L.I. - WPA Federal Art Project Poster</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e8e4d8;
    font-family: 'Georgia', serif;
  }

  .poster {
    position: relative;
    width: 600px;
    height: 960px;
    background: #1a3a8a;
    overflow: hidden;
    border: 4px solid #c8c0a8;
  }

  .foliage {
    position: absolute;
    top: 0;
    left: 0;
    width: 260px;
    height: 500px;
    background: #2d6b1e;
    clip-path: polygon(0 0, 100% 0, 80% 15%, 90% 25%, 70% 35%, 85% 45%, 60% 55%, 75% 65%, 50% 75%, 65% 85%, 40% 95%, 55% 100%, 0 100%);
    z-index: 1;
  }

  .foliage-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 380px;
    background: #2d6b1e;
    clip-path: polygon(0 30%, 15% 20%, 30% 25%, 45% 15%, 60% 20%, 75% 10%, 90% 15%, 100% 5%, 100% 100%, 0 100%);
    z-index: 1;
  }

  .water {
    position: absolute;
    top: 230px;
    left: 200px;
    right: 0;
    height: 200px;
    z-index: 0;
  }

  .water-line {
    position: absolute;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
  }

  .fair-skyline {
    position: absolute;
    top: 130px;
    left: 180px;
    right: 20px;
    height: 120px;
    z-index: 2;
  }

  .fair-building {
    position: absolute;
    background: #f0ece0;
  }

  .boat-area {
    position: absolute;
    bottom: 280px;
    right: 20px;
    width: 280px;
    height: 200px;
    z-index: 3;
  }

  .boat-placeholder {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .boat-hull {
    position: absolute;
    bottom: 40px;
    left: 20px;
    width: 220px;
    height: 60px;
    background: #1a3a8a;
    border: 4px solid #f0ece0;
    border-radius: 0 0 30px 30px;
    transform: rotate(-15deg);
  }

  .boat-deck {
    position: absolute;
    bottom: 90px;
    left: 40px;
    width: 160px;
    height: 30px;
    background: #e8c820;
    transform: rotate(-15deg);
  }

  .boat-smokestack {
    position: absolute;
    bottom: 110px;
    left: 100px;
    width: 20px;
    height: 50px;
    background: #e8c820;
    transform: rotate(-15deg);
  }

  .boat-smoke {
    position: absolute;
    bottom: 155px;
    left: 110px;
    width: 80px;
    height: 40px;
    background: rgba(240,236,224,0.6);
    border-radius: 50%;
    transform: rotate(-10deg);
  }

  .text-top {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .text-top .while-visiting {
    font-family: 'Georgia', cursive;
    font-size: 42px;
    color: #e8c820;
    font-style: italic;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }

  .text-top .the-fair {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 48px;
    color: #e8c820;
    font-weight: 900;
    letter-spacing: 6px;
    margin-top: -5px;
  }

  .text-commute {
    position: absolute;
    top: 290px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .text-commute .commute {
    font-family: 'Georgia', cursive;
    font-size: 44px;
    color: #e8c820;
    font-style: italic;
    font-weight: bold;
  }

  .text-commute .by-land {
    font-family: 'Georgia', cursive;
    font-size: 48px;
    color: #e8c820;
    font-style: italic;
    font-weight: bold;
    margin-top: -5px;
  }

  .text-to-beautiful {
    position: absolute;
    top: 590px;
    left: 50px;
    z-index: 10;
  }

  .text-to-beautiful .to {
    font-family: 'Georgia', serif;
    font-size: 42px;
    color: #f0ece0;
    font-style: italic;
  }

  .text-to-beautiful .beautiful {
    font-family: 'Georgia', serif;
    font-size: 52px;
    color: #f0ece0;
    font-style: italic;
    margin-top: -10px;
  }

  .text-seacliff {
    position: absolute;
    top: 690px;
    left: 10px;
    right: 10px;
    z-index: 10;
    display: flex;
    align-items: baseline;
    justify-content: center;
  }

  .text-seacliff .sea-cliff {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 110px;
    color: #f0ece0;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 6px 6px 0px #1a3a8a, 8px 8px 0px #1a3a8a;
    line-height: 1;
  }

  .text-seacliff .li {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-size: 50px;
    color: #f0ece0;
    font-weight: 900;
    margin-left: 10px;
    text-shadow: 3px 3px 0px #1a3a8a;
  }

  .text-details {
    position: absolute;
    bottom: 100px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .text-details .feet {
    font-family: 'Arial', sans-serif;
    font-size: 26px;
    color: #f0ece0;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .text-details .golf {
    font-family: 'Georgia', serif;
    font-size: 36px;
    color: #f0ece0;
    font-style: italic;
    margin-top: 5px;
  }

  .text-sponsored {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .text-sponsored .sponsored {
    font-family: 'Arial', sans-serif;
    font-size: 16px;
    color: #f0ece0;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .text-wpa {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }

  .text-wpa .wpa {
    font-family: 'Arial', sans-serif;
    font-size: 13px;
    color: #f0ece0;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .lighthouse {
    position: absolute;
    top: 340px;
    left: 30px;
    width: 80px;
    height: 180px;
    z-index: 5;
  }

  .lighthouse-body {
    position: absolute;
    bottom: 0;
    left: 20px;
    width: 40px;
    height: 120px;
    background: #f0ece0;
    border-radius: 5px 5px 0 0;
  }

  .lighthouse-top {
    position: absolute;
    bottom: 115px;
    left: 15px;
    width: 50px;
    height: 20px;
    background: #f0ece0;
    border-radius: 3px;
  }

  .lighthouse-light {
    position: absolute;
    bottom: 130px;
    left: 25px;
    width: 30px;
    height: 15px;
    background: #e8c820;
    border-radius: 3px 3px 0 0;
  }

  .fence {
    position: absolute;
    top: 460px;
    left: 130px;
    width: 120px;
    height: 60px;
    z-index: 4;
  }

  .fence-post {
    position: absolute;
    bottom: 0;
    width: 8px;
    height: 40px;
    background: #f0ece0;
  }

  .fence-rail {
    position: absolute;
    width: 100%;
    height: 6px;
    background: #f0ece0;
  }

  .yellow-path {
    position: absolute;
    top: 430px;
    left: 100px;
    width: 200px;
    height: 120px;
    background: #e8c820;
    clip-path: polygon(0 0, 100% 30%, 80% 100%, 0 80%);
    z-index: 3;
  }

  .sailboat {
    position: absolute;
    top: 100px;
    right: 30px;
    width: 120px;
    height: 160px;
    z-index: 2;
  }

  .sail {
    position: absolute;
    top: 0;
    left: 40px;
    width: 0;
    height: 0;
    border-left: 40px solid transparent;
    border-right: 0 solid transparent;
    border-bottom: 120px solid #f0ece0;
  }

  .sail-mast {
    position: absolute;
    top: 0;
    left: 40px;
    width: 4px;
    height: 140px;
    background: #f0ece0;
  }

  .sail-hull {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 80px;
    height: 20px;
    background: #1a3a8a;
    border: 3px solid #f0ece0;
    border-radius: 0 0 20px 20px;
  }

  .reflection {
    position: absolute;
    top: 250px;
    right: 20px;
    width: 100px;
    height: 150px;
    z-index: 1;
  }

  .reflection-line {
    position: absolute;
    height: 4px;
    background: rgba(240,236,224,0.4);
    border-radius: 2px;
  }

  .flag {
    position: absolute;
    bottom: 170px;
    right: 80px;
    width: 30px;
    height: 15px;
    background: #f0ece0;
    z-index: 4;
  }

  .flag-pole {
    position: absolute;
    bottom: 140px;
    right: 82px;
    width: 3px;
    height: 45px;
    background: #f0ece0;
    z-index: 4;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Background foliage -->
  <div class="foliage"></div>
  <div class="foliage-bottom"></div>

  <!-- Yellow path/road -->
  <div class="yellow-path"></div>

  <!-- Lighthouse -->
  <div class="lighthouse">
    <div class="lighthouse-light"></div>
    <div class="lighthouse-top"></div>
    <div class="lighthouse-body"></div>
  </div>

  <!-- Fence -->
  <div class="fence">
    <div class="fence-rail" style="top: 10px;"></div>
    <div class="fence-rail" style="top: 25px;"></div>
    <div class="fence-post" style="left: 5px;"></div>
    <div class="fence-post" style="left: 30px;"></div>
    <div class="fence-post" style="left: 55px;"></div>
    <div class="fence-post" style="left: 80px;"></div>
    <div class="fence-post" style="left: 105px;"></div>
  </div>

  <!-- Fair skyline illustration -->
  <div class="fair-skyline">
    <div class="fair-building" style="left: 0; bottom: 0; width: 60px; height: 80px;"></div>
    <div class="fair-building" style="left: 50px; bottom: 0; width: 40px; height: 60px;"></div>
    <div class="fair-building" style="left: 80px; bottom: 0; width: 80px; height: 90px; border-radius: 40px 40px 0 0;"></div>
    <div class="fair-building" style="left: 150px; bottom: 0; width: 50px; height: 70px;"></div>
    <div class="fair-building" style="left: 190px; bottom: 0; width: 70px; height: 50px;"></div>
    <div class="fair-building" style="left: 250px; bottom: 0; width: 40px; height: 85px;"></div>
    <div class="fair-building" style="left: 280px; bottom: 0; width: 60px; height: 40px;"></div>
  </div>

  <!-- Sailboat -->
  <div class="sailboat">
    <div class="sail-mast"></div>
    <div class="sail"></div>
    <div class="sail-hull"></div>
  </div>

  <!-- Water reflections -->
  <div class="reflection">
    <div class="reflection-line" style="top: 10px; left: 10px; width: 60px;"></div>
    <div class="reflection-line" style="top: 30px; left: 20px; width: 50px;"></div>
    <div class="reflection-line" style="top: 50px; left: 5px; width: 70px;"></div>
    <div class="reflection-line" style="top: 70px; left: 15px; width: 55px;"></div>
    <div class="reflection-line" style="top: 90px; left: 25px; width: 45px;"></div>
    <div class="reflection-line" style="top: 110px; left: 10px; width: 65px;"></div>
    <div class="reflection-line" style="top: 130px; left: 20px; width: 50px;"></div>
  </div>

  <!-- Water lines -->
  <div class="water">
    <div class="water-line" style="top: 20px; left: 0; width: 200px;"></div>
    <div class="water-line" style="top: 40px; left: 30px; width: 180px;"></div>
    <div class="water-line" style="top: 60px; left: 10px; width: 220px;"></div>
    <div class="water-line" style="top: 80px; left: 40px; width: 160px;"></div>
  </div>

  <!-- Boat -->
  <div class="boat-area">
    <div class="boat-placeholder">
      <div class="boat-smoke"></div>
      <div class="boat-smokestack"></div>
      <div class="boat-deck"></div>
      <div class="boat-hull"></div>
    </div>
  </div>

  <!-- Flag -->
  <div class="flag-pole"></div>
  <div class="flag"></div>

  <!-- Text: While visiting THE FAIR -->
  <div class="text-top">
    <div class="while-visiting">While visiting</div>
    <div class="the-fair">THE FAIR</div>
  </div>

  <!-- Text: commute by land or water -->
  <div class="text-commute">
    <div class="commute">commute</div>
    <div class="by-land">by land or water</div>
  </div>

  <!-- Text: to beautiful -->
  <div class="text-to-beautiful">
    <div class="to">to</div>
    <div class="beautiful">beautiful</div>
  </div>

  <!-- Text: SEA CLIFF L.I. -->
  <div class="text-seacliff">
    <div class="sea-cliff">SEA CLIFF</div>
    <div class="li">L.I.</div>
  </div>

  <!-- Text: 250 feet above sea level. NO MOSQUITOS -->
  <div class="text-details">
    <div class="feet">250 feet above sea level. NO MOSQUITOS</div>
    <div class="golf">golf and bathing</div>
  </div>

  <!-- Text: SPONSORED BY THE VILLAGE OF SEA CLIFF -->
  <div class="text-sponsored">
    <div class="sponsored">SPONSORED BY THE VILLAGE OF SEA CLIFF</div>
  </div>

  <!-- Text: WPA FEDERAL ART PROJECT 0124 -->
  <div class="text-wpa">
    <div class="wpa">WPA FEDERAL ART PROJECT 0124</div>
  </div>
</div>

</body>
</html>
