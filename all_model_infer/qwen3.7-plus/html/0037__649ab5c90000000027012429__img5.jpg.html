<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022-2023学年第二学期 小学语文期末质量分析会</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 30%, #e0f2f1 60%, #e8f5e9 100%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .slide-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 30px 40px;
    position: relative;
  }

  /* Decorative leaves top-right */
  .deco-top-right {
    position: absolute;
    top: -10px;
    right: -20px;
    width: 200px;
    height: 180px;
    z-index: 1;
  }

  .deco-top-right svg {
    width: 100%;
    height: 100%;
  }

  /* Decorative artichoke and bird middle-left */
  .deco-middle-left {
    position: absolute;
    top: 280px;
    left: -10px;
    width: 220px;
    height: 200px;
    z-index: 1;
  }

  .deco-middle-left svg {
    width: 100%;
    height: 100%;
  }

  /* Watermark */
  .watermark {
    position: absolute;
    color: rgba(100, 100, 100, 0.3);
    font-size: 14px;
    transform: rotate(-15deg);
    z-index: 0;
    pointer-events: none;
  }

  .watermark-1 {
    top: 60px;
    right: 120px;
    font-size: 16px;
    color: rgba(80, 80, 80, 0.35);
  }

  .watermark-2 {
    top: 175px;
    left: 100px;
    font-size: 16px;
    color: rgba(80, 80, 80, 0.35);
  }

  .watermark-3 {
    top: 340px;
    right: 200px;
    font-size: 16px;
    color: rgba(80, 80, 80, 0.35);
  }

  /* Header section */
  .header-section {
    text-align: center;
    position: relative;
    z-index: 2;
    padding-top: 20px;
  }

  .semester {
    font-size: 22px;
    color: #1a3a5c;
    margin-bottom: 15px;
    font-weight: normal;
    letter-spacing: 2px;
  }

  .main-title {
    font-size: 32px;
    color: #1a3a5c;
    font-weight: bold;
    margin-bottom: 15px;
    letter-spacing: 4px;
  }

  .sub-title {
    font-size: 28px;
    color: #c0392b;
    font-weight: bold;
    margin-bottom: 15px;
    letter-spacing: 2px;
  }

  .school-name {
    font-size: 18px;
    color: #1a3a5c;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .author {
    font-size: 18px;
    color: #1a3a5c;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  /* Section title */
  .section-title {
    text-align: center;
    font-size: 24px;
    color: #333;
    font-weight: bold;
    margin: 30px 0 25px;
    position: relative;
    z-index: 2;
    letter-spacing: 2px;
  }

  /* Flowchart */
  .flowchart {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }

  .flow-box {
    background: #2a8a7a;
    color: white;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    white-space: nowrap;
    position: relative;
    z-index: 2;
  }

  .flow-arrow {
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-left: 20px solid #2a8a7a;
    position: relative;
    z-index: 2;
  }

  /* Speech bubbles row */
  .bubbles-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }

  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 200px;
  }

  .bubble-pointer {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 16px solid #2a8a7a;
    margin-bottom: -1px;
  }

  .bubble-content {
    border: 2px solid #2a8a7a;
    border-radius: 12px;
    padding: 15px 12px;
    font-size: 14px;
    color: #333;
    line-height: 1.7;
    text-align: left;
    background: white;
    min-height: 130px;
    width: 100%;
  }

  /* Decorative SVG elements */
  .leaf-decoration {
    position: absolute;
    top: 0;
    right: 0;
    width: 220px;
    height: 160px;
    z-index: 1;
  }

  .artichoke-decoration {
    position: absolute;
    top: 290px;
    left: 0;
    width: 200px;
    height: 180px;
    z-index: 1;
  }

  /* Background watercolor effect */
  .bg-wash {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(180, 220, 200, 0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(200, 230, 210, 0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(190, 225, 205, 0.2) 0%, transparent 40%);
    z-index: 0;
    pointer-events: none;
  }

  .divider-line {
    width: 80%;
    margin: 10px auto 20px;
    border: none;
    border-top: 1px dashed #aaa;
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="slide-container">
  <div class="bg-wash"></div>

  <!-- Watermarks -->
  <div class="watermark watermark-1">@海淀小萌</div>
  <div class="watermark watermark-2">@海淀小萌</div>
  <div class="watermark watermark-3">@海淀小萌</div>

  <!-- Top-right leaf decoration -->
  <div class="leaf-decoration">
    <svg viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#4a8c6f" stroke-width="2">
        <path d="M180,10 Q160,40 140,60 Q120,80 100,90" stroke="#5a9c7f" stroke-width="2.5"/>
        <path d="M160,10 Q150,30 130,50 Q110,70 90,85" stroke="#6aac8f" stroke-width="2"/>
        <path d="M200,20 Q180,50 160,70 Q140,90 120,100" stroke="#4a8c6f" stroke-width="2"/>
        <path d="M190,5 Q170,25 150,45" stroke="#5a9c7f" stroke-width="1.5"/>
        <path d="M210,15 Q190,35 170,55" stroke="#6aac8f" stroke-width="1.5"/>
      </g>
      <g fill="#6aac8f" opacity="0.6">
        <ellipse cx="170" cy="20" rx="25" ry="12" transform="rotate(-30 170 20)"/>
        <ellipse cx="190" cy="35" rx="22" ry="10" transform="rotate(-20 190 35)"/>
        <ellipse cx="150" cy="40" rx="20" ry="10" transform="rotate(-40 150 40)"/>
        <ellipse cx="175" cy="55" rx="18" ry="9" transform="rotate(-25 175 55)"/>
        <ellipse cx="130" cy="60" rx="18" ry="8" transform="rotate(-35 130 60)"/>
        <ellipse cx="155" cy="75" rx="16" ry="8" transform="rotate(-30 155 75)"/>
        <ellipse cx="115" cy="80" rx="15" ry="7" transform="rotate(-40 115 80)"/>
      </g>
      <g fill="#4a8c6f" opacity="0.5">
        <ellipse cx="185" cy="15" rx="20" ry="10" transform="rotate(-25 185 15)"/>
        <ellipse cx="165" cy="30" rx="18" ry="9" transform="rotate(-35 165 30)"/>
        <ellipse cx="145" cy="50" rx="16" ry="8" transform="rotate(-30 145 50)"/>
      </g>
    </svg>
  </div>

  <!-- Middle-left artichoke and bird decoration -->
  <div class="artichoke-decoration">
    <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <!-- Artichoke -->
      <g>
        <ellipse cx="50" cy="130" rx="35" ry="40" fill="#8fbc8f" opacity="0.7"/>
        <ellipse cx="50" cy="120" rx="30" ry="35" fill="#9acd9a" opacity="0.7"/>
        <ellipse cx="50" cy="110" rx="25" ry="30" fill="#a8d8a8" opacity="0.7"/>
        <ellipse cx="50" cy="100" rx="20" ry="25" fill="#b8e8b8" opacity="0.7"/>
        <ellipse cx="50" cy="95" rx="15" ry="18" fill="#c8f0c8" opacity="0.7"/>
        <!-- Leaves around artichoke -->
        <path d="M20,140 Q5,120 10,100 Q15,110 25,130" fill="#6a9c6a" opacity="0.6"/>
        <path d="M80,140 Q95,120 90,100 Q85,110 75,130" fill="#6a9c6a" opacity="0.6"/>
        <path d="M30,150 Q10,145 5,130 Q15,135 30,145" fill="#7aac7a" opacity="0.5"/>
        <path d="M70,150 Q90,145 95,130 Q85,135 70,145" fill="#7aac7a" opacity="0.5"/>
      </g>
      <!-- Bird -->
      <g>
        <ellipse cx="130" cy="120" rx="18" ry="12" fill="#5b8fb9" opacity="0.8"/>
        <circle cx="140" cy="115" r="8" fill="#6ba0c9" opacity="0.8"/>
        <polygon points="148,114 155,112 148,116" fill="#e8a040" opacity="0.8"/>
        <circle cx="142" cy="113" r="2" fill="#333"/>
        <path d="M115,120 Q110,115 108,110 Q112,112 118,118" fill="#4a7fa5" opacity="0.7"/>
        <path d="M125,130 Q128,140 125,145" stroke="#5b8fb9" stroke-width="1.5" fill="none" opacity="0.7"/>
        <path d="M132,130 Q134,140 132,145" stroke="#5b8fb9" stroke-width="1.5" fill="none" opacity="0.7"/>
      </g>
      <!-- Leaves -->
      <g fill="none" stroke="#5a9c7f" stroke-width="1.5">
        <path d="M60,155 Q80,140 100,135 Q90,145 70,155"/>
        <path d="M70,160 Q90,150 110,148 Q95,155 75,162"/>
        <path d="M40,155 Q20,145 10,140 Q20,148 38,157"/>
      </g>
      <g fill="#6aac8f" opacity="0.5">
        <ellipse cx="85" cy="142" rx="15" ry="6" transform="rotate(-15 85 142)"/>
        <ellipse cx="95" cy="150" rx="12" ry="5" transform="rotate(-10 95 150)"/>
        <ellipse cx="25" cy="145" rx="12" ry="5" transform="rotate(15 25 145)"/>
      </g>
    </svg>
  </div>

  <!-- Header -->
  <div class="header-section">
    <div class="semester">2022——2023学年第二学期</div>
    <div class="main-title">追光而遇有思 &nbsp;&nbsp; 沐光而行致远</div>
    <div class="sub-title">小学语文期末质量分析会</div>
    <div class="school-name">红薯街道实验XXXX</div>
    <div class="author">海淀小萌</div>
  </div>

  <hr class="divider-line">

  <!-- Section title -->
  <div class="section-title">期末考试成绩@海淀小萌</div>

  <!-- Flowchart -->
  <div class="flowchart">
    <div class="flow-box">注重基础和积累</div>
    <div class="flow-arrow"></div>
    <div class="flow-box">重视运用</div>
    <div class="flow-arrow"></div>
    <div class="flow-box">联系生活原则</div>
    <div class="flow-arrow"></div>
    <div class="flow-box">难易程度适中</div>
  </div>

  <!-- Speech bubbles -->
  <div class="bubbles-row">
    <div class="bubble-wrapper">
      <div class="bubble-pointer"></div>
      <div class="bubble-content">
        尤其是古诗文和名言警句积累占的比例很大，反映了对传统文化的重视。
      </div>
    </div>
    <div class="bubble-wrapper">
      <div class="bubble-pointer"></div>
      <div class="bubble-content">
        突出能力，重视运用。阅读题体现了核心素养中重视思维发展与提升的要求。
      </div>
    </div>
    <div class="bubble-wrapper">
      <div class="bubble-pointer"></div>
      <div class="bubble-content">
        写作的安排正是学生生活中外出的经历，易于选材，适合个性发展。
      </div>
    </div>
    <div class="bubble-wrapper">
      <div class="bubble-pointer"></div>
      <div class="bubble-content">
        只要认真积累和复习的孩子基本上可以取得不错的成绩。
      </div>
    </div>
  </div>

</div>

</body>
</html>
