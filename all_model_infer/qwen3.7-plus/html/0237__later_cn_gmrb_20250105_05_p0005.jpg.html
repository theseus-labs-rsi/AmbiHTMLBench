<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公益广告 - 绿色出行</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: 'Noto Serif SC', 'SimSun', serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 3px solid #2b579a;
            background: #fff;
        }

        .header-logo {
            font-family: 'KaiTi', 'STKaiti', serif;
            font-size: 28px;
            color: #a81c1c; /* Reddish color for logo */
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-meta {
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        .date {
            font-size: 12px;
            color: #333;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .ad-label {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #2b579a;
            letter-spacing: 1px;
        }

        .ad-number {
            font-size: 28px;
            font-weight: normal;
            color: #000;
            margin-left: 5px;
        }

        /* Main Content Area */
        .main-content {
            background-color: #eef5e6;
            /* Simulating the subtle line pattern background */
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(0,0,0,0.03) 15px, rgba(0,0,0,0.03) 16px),
                repeating-linear-gradient(-45deg, transparent, transparent 15px, rgba(0,0,0,0.03) 15px, rgba(0,0,0,0.03) 16px),
                repeating-linear-gradient(15deg, transparent, transparent 25px, rgba(0,0,0,0.02) 25px, rgba(0,0,0,0.02) 26px);
            min-height: 1000px;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .top-bar-text {
            color: #009639;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .title-block {
            position: absolute;
            top: 120px;
            right: 60px;
            text-align: right;
        }

        .title-block h1 {
            margin: 0;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 56px;
            color: #009639;
            line-height: 1.1;
            font-weight: 900;
        }

        /* Graphic Placeholder */
        .graphic-center {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .placeholder {
            background-color: rgba(255,255,255,0.1);
            border: 1px dashed rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .graphic-main {
            width: 100%;
            height: 100%;
            /* Visual approximation of the cyclist on leaf */
            background: transparent;
            border: none;
            position: relative;
        }
        
        /* CSS Art approximation for the graphic to make it look better than a box */
        .art-cyclist {
            position: absolute;
            top: 20%;
            left: 30%;
            width: 300px;
            height: 200px;
        }
        
        .art-leaf {
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 80%;
            height: 200px;
            background: #4da64d;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            clip-path: polygon(0% 20%, 100% 20%, 80% 100%, 20% 100%);
            opacity: 0.9;
        }

        .text-block {
            margin-top: 720px; /* Push text down below graphic */
            width: 80%;
            margin-left: 10%;
            font-size: 16px;
            line-height: 2;
            color: #333;
            text-align: justify;
        }

        .footer-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to right, #2e8b2e, #8cc63f);
            /* Curve shape approximation */
            clip-path: ellipse(120% 100% at 50% 100%);
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding-right: 60px;
            padding-bottom: 20px;
        }

        .footer-logo {
            font-family: 'KaiTi', 'STKaiti', serif;
            color: #fff;
            font-size: 32px;
            letter-spacing: 5px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <header>
            <div class="header-logo">光明日报</div>
            <div class="header-meta">
                <span class="date">2025年1月5日 星期日</span>
                <div>
                    <span class="ad-label">公益广告</span>
                    <span class="ad-number">05</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="top-bar-text">绿色生活系列公益广告</div>

            <div class="title-block">
                <h1>绿色出行</h1>
                <h1>低碳环保</h1>
            </div>

            <!-- Central Graphic Representation -->
            <div class="graphic-center">
                <div class="placeholder graphic-main">
                    [Graphic: Stylized black figure riding a bicycle with green wheels, resting on a large green leaf]
                </div>
            </div>

            <div class="text-block">
                <p>选择绿色出行方式,既节约能源、减少污染,又益于健康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具,或者选择步行、骑自行车等出行方式,降低出行中产生的能耗和污染,绿色出行、低碳出行、文明出行。</p>
            </div>

            <div class="footer-area">
                <div class="footer-logo">光明日报社</div>
            </div>
        </div>
    </div>

</body>
</html>
