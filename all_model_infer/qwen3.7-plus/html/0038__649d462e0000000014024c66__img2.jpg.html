<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 20px;
            background: #fff;
            color: #000;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #fff;
            font-weight: bold;
        }
        tr.blue-row td {
            background-color: #dce8f0;
        }
        tr.blue-row td:first-child {
            background-color: #dce8f0;
        }
    </style>
</head>
<body>
    <h1>十一月-任务(必做:支付管理费+拨款)</h1>
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>任务描述</th>
                <th>岗位</th>
                <th>操作动作</th>
                <th>开始时间</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody>
            <tr class="blue-row">
                <td>1</td>
                <td>柔性线推进</td>
                <td>生产</td>
                <td>申请200w推进</td>
                <td>11月1日</td>
                <td>柔性线推进</td>
            </tr>
            <tr>
                <td>2</td>
                <td>订购原材料</td>
                <td>采购</td>
                <td>4份P3+4份P5</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr class="blue-row">
                <td>3</td>
                <td>九月订购的原料入库</td>
                <td>采购</td>
                <td>申请资金入库</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>申请贷款</td>
                <td>财务</td>
                <td>没钱就申请,有钱就不申请</td>
                <td>11月1日</td>
                <td>申请四季短贷</td>
            </tr>
            <tr class="blue-row">
                <td>5</td>
                <td>生产线预配</td>
                <td>生产</td>
                <td>全线开产</td>
                <td>11月1日</td>
                <td>收下9月的产品</td>
            </tr>
            <tr>
                <td>6</td>
                <td>交货</td>
                <td>销售</td>
                <td>交第三个订单</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr class="blue-row">
                <td>7</td>
                <td>应收账款</td>
                <td>财务</td>
                <td>收钱</td>
                <td>11月</td>
                <td>尽量不贴现</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
