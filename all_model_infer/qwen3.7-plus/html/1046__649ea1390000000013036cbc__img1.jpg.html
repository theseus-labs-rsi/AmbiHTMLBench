<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何挑选性格好的猫咪</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fff;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    color: #222;
  }
  .main-title {
    font-size: 42px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .main-title .highlight {
    color: #e53935;
  }
  .checklist-section {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 10px;
  }
  .checklist-items {
    flex: 1;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    font-size: 17px;
    font-weight: 600;
    background: #fff8f0;
    padding: 8px 12px;
    border-radius: 6px;
  }
  .checklist-item .checkbox {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: #e53935;
    color: #fff;
    border-radius: 4px;
    margin-right: 10px;
    font-size: 14px;
    flex-shrink: 0;
  }
  .cat-illustration {
    width: 160px;
    height: 160px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat-illustration .placeholder {
    width: 150px;
    height: 150px;
    background: #f5f5f5;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #999;
    text-align: center;
  }
  .section-header {
    display: inline-block;
    background: #f5a623;
    color: #fff;
    font-size: 26px;
    font-weight: 900;
    padding: 6px 18px;
    border-radius: 6px;
    margin-bottom: 20px;
  }
  .breeds-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 15px;
  }
  .breed-card {
    text-align: center;
    padding: 10px 5px;
  }
  .breed-image {
    width: 140px;
    height: 140px;
    margin: 0 auto 10px;
    background: #fdf5e6;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #aaa;
  }
  .breed-name {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .breed-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #333;
  }
</style>
</head>
<body>

<div class="main-title">如何挑选<span class="highlight">性格好</span>的猫咪</div>

<div class="checklist-section">
  <div class="checklist-items">
    <div class="checklist-item">
      <span class="checkbox">✓</span>
      <span>伸手摸它，看会不会主动过来蹭</span>
    </div>
    <div class="checklist-item">
      <span class="checkbox">✓</span>
      <span>抱一下猫咪，看会不会抗拒</span>
    </div>
    <div class="checklist-item">
      <span class="checkbox">✓</span>
      <span>喂食物，会不会主动积极吃</span>
    </div>
    <div class="checklist-item">
      <span class="checkbox">✓</span>
      <span>对猫咪喵喵叫，看会不会积极回应</span>
    </div>
  </div>
  <div class="cat-illustration">
    <div class="placeholder">[卡通猫咪插图：开心举手的猫咪]</div>
  </div>
</div>

<div class="section-header">猫咪品种看性格</div>

<div class="breeds-grid">
  <div class="breed-card">
    <div class="breed-image">[布偶猫图片]</div>
    <div class="breed-name">布偶</div>
    <div class="breed-desc">性格温和，外表美丽<br>肠胃不太好</div>
  </div>
  <div class="breed-card">
    <div class="breed-image">[英短猫图片]</div>
    <div class="breed-name">英短</div>
    <div class="breed-desc">体型圆胖、毛短而密<br>温柔平静、对人友善</div>
  </div>
  <div class="breed-card">
    <div class="breed-image">[美短猫图片]</div>
    <div class="breed-name">美短</div>
    <div class="breed-desc">性格活泼好动<br>适应能力也比较强</div>
  </div>
  <div class="breed-card">
    <div class="breed-image">[狸花猫图片]</div>
    <div class="breed-name">狸花</div>
    <div class="breed-desc">身体素质好，聪明<br>好养活，寿命长</div>
  </div>
  <div class="breed-card">
    <div class="breed-image">[暹罗猫图片]</div>
    <div class="breed-name">暹罗</div>
    <div class="breed-desc">活泼好动，智商高<br>胆子比较大</div>
  </div>
  <div class="breed-card">
    <div class="breed-image">[曼基康猫图片]</div>
    <div class="breed-name">曼基康</div>
    <div class="breed-desc">活泼友善，性格好<br>小短腿底盘容易弄脏</div>
  </div>
</div>

</body>
</html>
