<body>
<div class="newspaper">
  <!-- Masthead -->
  <div class="masthead">
    <div class="masthead-title">光明日报</div>
    <div class="masthead-en">GUANGMING RIBAO</div>
  </div>
  <div class="date-bar">
    <span>2025年1月30日</span>
    <span>星期四</span>
    <span>农历乙巳年正月初二</span>
    <span>今日4版</span>
  </div>
  <div class="pub-info">
    光明网网址：http://www.gmw.cn &nbsp; 国内统一连续出版物号 CN 11-0026 &nbsp; 代号 1-16 &nbsp; 第27393号
  </div>

  <!-- Main Headline -->
  <div class="main-headline">
    <h1>共同续写中美两国人民友好故事</h1>
    <h2>——习近平主席回赠美国友人</h2>
    <h2>新春贺卡汇聚浓浓暖意</h2>
  </div>

  <!-- Main article text (top right area) -->
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:10px; font-size:12px; line-height:1.7;">
    <div>
      <p style="text-indent:2em; margin-bottom:5px;">艾奥瓦州马斯卡廷是一座见证了习近平主席同美国人民多年情谊的"友谊之城"。</p>
      <p style="text-indent:2em; margin-bottom:5px;">1月27日，习近平主席向美国艾奥瓦州友人回赠新春贺卡，致以节日祝福，寄语中美人民"共同续写两国人民友好故事"。</p>
      <p style="text-indent:2em; margin-bottom:5px;">笔暖情长。美国友人兰蒂告诉记者，收到主席40张老友的新春祝福"实在太棒了"，"这段友谊对我们意义重大，从1985年延续至今，真是了不起"。</p>
    </div>
    <div>
      <p style="text-indent:2em; margin-bottom:5px;"><strong>从"邦尼街2911号"到"中美友谊屋"</strong></p>
      <p style="text-indent:2em; margin-bottom:5px;">"马斯卡廷位于密西西比河畔，有'珍珠城'之称。入夜后，沿河灯光如珠链般闪烁，小城道路起伏伏伏。有的沿街人家门前两棵挂起彩灯，窗里透出温暖灯光……"</p>
      <p style="text-indent:2em; margin-bottom:5px;">在这里，一群老友刚刚收获了一份来自习近平主席的温暖祝福。"大家都很高兴！"艾奥瓦州友好委员会董事会成员卢卡·贝隆说，"这份跨越40年的友谊是如此美妙。"</p>
    </div>
    <div>
      <p style="text-indent:2em; margin-bottom:5px;">师生和家长代表等58人，联名向习近平主席致新春贺卡。他们在贺卡中忆及习近平主席1985年首次访问艾奥瓦州的情景，对习近平主席致以蛇年新春祝福。</p>
      <p style="text-indent:2em; margin-bottom:5px;">"我40年前到美丽的艾奥瓦州，受到你们的热情接待，至今记忆犹新。"习近平主席在回赠的贺卡中写道。</p>
      <p style="text-indent:2em; margin-bottom:5px;">"对我来说，他们就是美国。"习近平主席曾如此形容自己首次同美国人民交流交往的难忘经历。1985年，时任河北省正定县委书记的习近平率团访问马斯卡廷，兰蒂、贝隆等人参与了接待工作，双方结下深厚友谊。2012年，时任国家副主席的习近平再次访问马斯卡廷，同当地友人欢聚叙旧。用兰蒂的话说："他依然记得当年发生的每一件事，与老朋友们有聊不完的话。"2023年11月，习近平主席在旧金山出席亚太经合组织第三十次领导人非正式会议期间，再次深情回忆在艾奥瓦州的经历。宴会开始前，习近平主席会见美国友好人士代表，与兰蒂等人亲切地拉家常、叙友情。</p>
    </div>
  </div>

  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:10px; font-size:12px; line-height:1.7;">
    <div>
      <p style="text-indent:2em; margin-bottom:5px;">此前，贝隆同其他艾奥瓦州友人德沃克夫妇、前美国驻华大使布兰斯塔德夫妇、世界粮食奖基金会前主席奎因，以及艾奥瓦州参与"未来5年邀请5万名美国青少年来华交流学习"倡议访华的</p>
    </div>
    <div>
      <p style="text-indent:2em; margin-bottom:5px;">住在德沃切克夫妇家中，"我还记得门牌号是邦尼街2911号"，"邦尼街2911号"如今已成为一家小型纪念馆。有个更令人熟悉的名字——"中美友谊屋"。德沃切克夫妇的儿子盖瑞也参与了此次致信行动："习近平主席一直珍藏着对40年前访问艾奥瓦州的回忆，这让我们倍感温暖，我们也格外珍视同中国的友谊。"</p>
      <p style="text-indent:2em; margin-bottom:5px;">"习近平主席第一次来亲切回忆40年前在艾奥瓦州受到的热情接待，并将延续40年的互动往来视为人民友好交往的典范，这让我们倍感荣幸、激动和欣慰。"贝隆对记者说，"历久弥新的友谊最有意义，最为珍贵。"</p>
    </div>
    <div>
      <p style="text-indent:2em; margin-bottom:5px;">"祝愿习近平主席和全体中国人民蛇年快乐，愿我们共同收获幸福、健康与繁荣。"贝隆说。</p>
      <p style="text-indent:2em; margin-bottom:5px;"><strong>从"做伙伴、做朋友"到"相互成就、共同繁荣"</strong></p>
      <p style="text-indent:2em; margin-bottom:5px;">习近平主席在贺卡中表示，中美两国拥有广泛共同利益和广阔合作空间，可以成为伙伴和朋友，相互成就、共同繁荣，造福两国、惠及世界。</p>
      <p style="text-indent:2em; margin-bottom:5px;">兰蒂对此深感认同，期待美中双方能够"共同努力、相互学习，面对面交流、加强合作并求同存异"，期待美中关系"为我们共同生活的地球家园增添正能量"。</p>
      <p style="text-indent:2em; margin-bottom:5px; font-size:11px; color:#666;">（下转2版）</p>

          <span class="region-label" style="writing-mode:horizontal-tb; display:block; margin-bottom:5px;">山西</span>
          钟鼓声声文韵醇
        </div>
        <div class="article-text-flow">
          <p style="font-size:11px; color:#666; margin-bottom:5px;">本报记者 李建斌 本报通讯员 卫世新</p>
          <p>正月初一，位于国家历史文化名城山西省新绛县的绛州署景区年味十足，内容丰富的传统文化表演引得游客纷纷拍照留念。</p>
          <p>随着鼓手手中的鼓槌上下翻飞，激昂的鼓点瞬间点燃了现场气氛，国家级非物质文化遗产绛州鼓乐团的演出引得观众掌声、叫好声连连不断。安徽游客王丽兴奋不已："绛州鼓乐也太震撼了！这些沉浸式节目把这座原本静态的古城变得生动鲜活起来，让我们这些外地游客真切感受到了山西传统文化的魅力。"</p>
          <p>当日，景区内好戏连台。情景剧《州衙闹春——知府迎宾》精彩上演，演员凭借精湛的演技，将古代州衙场景原汁原味地呈现在游客眼前。蒲剧展演、皮影表演、晋南唢呐等各类精彩节目轮番上演，为观众带来一场场精彩的视听盛宴。</p>
          <p>香气四溢的各类小吃摊位前围满了游客。绛州扣碗、炒面、鸡蛋篮子、炒糊、醪糟、油糕子……诱人的美食让人食指大动，浓浓的年味在这烟火气浓郁的老街巷中弥漫。"太好吃啦！"四川游客程明一边品尝美食，一边赞不绝口。</p>
          <p>"这个春节与古城新绛的约会浪漫又独特，惊喜、感动、温暖！"在绛州大堂新年愿望祈福签名处，游客写下着自己的感受与心愿。不远处，绛州钟楼和鼓楼传来的声声钟鼓之音，承载着大家撞钟祈福、击鼓祈福的人们对新年幸福、健康、平安的美好祈愿，回荡在古城的每一个角落。</p>
        </div>
      </div>
    </div>
    <div class="col-article">
      <div style="display:flex; gap:10px;">
        <div class="vertical-title" style="color:#2980b9; border-color:#2980b9;">
          <span class="region-label" style="writing-mode:horizontal-tb; display:block; margin-bottom:5px; background:#2980b9;">湖北</span>
          非遗翻新年味浓
        </div>
        <div class="article-text-flow">
          <p style="font-size:11px; color:#666; margin-bottom:5px;">本报记者 张锐 王建宏</p>
          <p>手执书简、头戴峨冠的屈原，怀抱琵琶、挽袖驻足的昭君，战甲鲜亮、英气飘飘的关公，骏马雕鞍、美人遥入的花木兰……一尊尊栩栩如生、形神兼备的塑像，让人目不暇接。</p>
          <p>连日来，在湖北省武汉市江岸区武汉民俗馆举行的2025"年味武汉·非遗贺新春"活动中，武汉面塑的展位前总是人挤着人，惊叹声连着惊叹声。</p>
          <p>不少孩子围坐一起，拿起小塑刀、平板、尖拨，用彩色面团制作小龙、元宝和福袋。"武汉面塑艺术传承历史悠人，被誉为民俗文化的'活化石'。"湖北省非物质文化遗产代表性项目面人（武汉面塑）武汉市非物质文化遗产代表性传承人刘洁说，武汉面塑大体分为可食用的面花类和以工艺摆件为主的面人类，其中面人题材更多侧重于地方文化特色。</p>
          <p>"你看，这是我和弟弟俩在跨年之际耗时两周创作的武汉面塑《春晚团圆》，定格一家七口吃团年饭、共赏春晚的场景。"伴随着刘洁的讲解，记者看到，客厅中，大姐姐细心地为弟弟递上热水，爸爸与爷爷谈笑风生，妈妈端着一盘青菜，呼唤沙发区的弟弟妹妹吃饭，小妹妹一手提着小灯笼，一手拽着哥哥，笑着奔向餐桌。饭桌上，排骨藕汤、清蒸武昌鱼、四季美汤包、黄陂三鲜、洪山红菜薹……一道道武汉家常菜让人垂涎欲滴。</p>
          <p>"这个春节非遗成功了嘛，又逢武汉首次成为春晚的分会场，这个春节不一般，我就想着用武汉面塑来记录这个时刻。"刘洁笑着说。</p>
        </div>

        <p>"这是排队等着参观？"大年初一一早，苏州博物馆门前就排起长龙。</p>
        <p>"都是来'打卡'苏博的！现在过节，群众选择来博物馆越来越有趣。"一旁的苏州博物馆馆长谢晓婷告诉记者。</p>
        <p>广东游客陈金站在队伍中，插话说："没想到这么多人跟我想法一样！这两年，我更喜欢趁着春节假期带家人四处逛逛。以前肯定是先去热门景点，现在博物馆是我们的首选！本以为春节期间，本地人都在家过年，外地人逛博物馆肯定清净些，结果……"</p>
        <p>队伍中，一位戴着毛线帽的年轻人正低头翻看手机，嘴里念叨着："11点跟新吉——李根跟与苏州'特展'，还有'迎新新——齐云气生活美学特展'……今天一定要都看完！"记者上前一问，小伙子叫吴啸，来自浙江，提前一周就做好了攻略，甚至还列了一张"苏博打卡清单"。</p>
      </div>
      <div>
        <p>"贝聿铭的建筑、原创展览、文创爆款……这些都是我来苏博、来苏州的理由！"他兴奋地对身旁的朋友说，仿佛已经看到了展览中的每一件珍宝。</p>
        <p>展厅的一角，苏州市民刘小燕正带着女儿参观春节特别活动——"门神填色"体验。女儿握着一支彩笔，认真地给门神涂色，时不时抬头问："妈妈，这个颜色好看吗？"刘小燕笑着点点头，赶忙帮女儿调颜料。</p>
      </div>

      <div class="cb-title">我们这些年俗</div>
      
      <h4>踏舞贺春</h4>
      <div class="al">本报记者 徐鑫雨</div>
      <p>夜幕降临，篝火点燃、芦笙与笛子的悠扬乐声交织在一起，宛如吹响的号角，召唤人们前来欢歌。</p>
      <p>"呜——哟哟！"云南省大理白族自治州漾濞彝族自治县人和广场上，身穿各式少数民族服装的男女老少，围绕篝火，踏歌而舞。只见人们一边跳边脚步，一边根据步伐节奏唱着彝家特色调子，跳至高潮时，音乐节奏随之加快，人们欢快地转身拍手，跳跃欢腾。</p>
      
      <div class="qb">"愿你在新的一年平安顺遂，愿你在新的一年吉祥如意……"踏入黑龙县大兴安岭地区塔河县十八站民族乡，鄂伦春族群众身着盛装，载歌载舞。高亢悠扬、清亮空灵的"赞达仁"歌声中，蕴含着人们对风调雨顺、安居乐业、幸福安康的祈福。</div>
      
      <h4 style="margin-top:15px;">放歌祈福</h4>
      <div class="al">本报记者 张士英 本报通讯员 邹然</div>
      <p>鄂伦春族民歌由调风格多样，往往即兴填词，随编随唱。这些民歌以"赞达仁"调山歌的曲调为主，高亢圆润，略带"芦笙一响脚杆痒，笛子一吹山歌飞。"作为国家级非物质文化遗产，彝族打歌跳出了各族人民对生活和自然的热爱。在云南，每逢春节、小火把节或婚嫁、聚会，各族人民群众都会围成圆圈，彻夜踏歌。"我们不分男女老少，开心快乐地跳在一起庆祝春节，感受着民族团结的欢乐气氛。"现场参与打歌的漾濞县市民赵常明说。</p>
      <p>丰富，曲调以五声音阶的羽、宫、徵调式为主，字少腔长，节奏自由，显示出浓郁的鄂鄂民族传统文化特色。</p>
      <p>每到春节，鄂伦春族人会着传统民族服饰，用"赞达仁"的歌声和鄂伦春民族舞蹈表达对大自然的热爱，对美好生活的期待憧憬，并祈愿新年平安顺遂。</p>
      <p>颤音，"赞达仁"的演唱方式有对唱、重唱、独唱、合唱等，听来悠扬婉转，动人心弦。</p>
      <p>"赞达仁"结构简单、内容</p>
    </div>

    <!-- Middle: Dance article continuation -->
    <div style="padding:10px;">
      <div class="full-width-article" style="border:none;">
        <p style="text-indent:2em; font-size:13px; line-height:1.8; margin-bottom:5px;">"咚咚咚，锵锵锵，咚锵咚锵……"锣鼓声中，唢呐吹响，农历腊月二十八的陕西榆林米脂南门城头，几十名秧歌演员挥舞着彩扇翩翩起舞。那位打着花伞、扭着十字步的主角，还调皮地送上祝福："蛇年快乐，好运连连！"</p>
        <p style="text-indent:2em; font-size:13px; line-height:1.8; margin-bottom:5px;">此刻，老城的各个角落，龙舞耍了起来，腰鼓打了起来，陕北说书演了起来，"翻转腾挪"的武术杂技也施展起来……</p>
        <p style="text-indent:2em; font-size:13px; line-height:1.8; margin-bottom:5px;">"还是老家过年红火！透着喜气喜庆，真是走到哪儿也忘不了。"中国人民公安大学2023级硕士生常李刚和家人挤在人群里，连连鼓掌喝彩。</p>
        <p style="text-indent:2em; font-size:13px; line-height:1.8; margin-bottom:5px;">榆林地处黄土高原腹地，在这里土生土长的小伙子常李刚有着陕北人的坚忍与执着，也深爱着民风淳朴、豪放旷达的西部大地。</p>
        <p style="text-indent:2em; font-size:13px; line-height:1.8; margin-bottom:5px;">"这次回乡，我想和家人、同学们聊聊，交流一下自己毕业后的去向。翻着高中同学通讯录一数，60多个人里除了少数几个去了北京等大城市，其他的都留在榆林，有的进了事业单位，有的在创业工作，还有的自己开店。"家乡的魅力究竟在哪儿？同学聚会上，大家伙儿七嘴八舌地为他"科普"起来——"高质量发展，煤化工产业带动效应大着呢！""环境可是好多了，以前处处黑黢黢，现在小区像花园。"……</p>
      </div>
    </div>

    <!-- Right: Continuous Report -->
    <div class="continuous-report">
      <div class="cr-header">
        <span class="cr-tag">连续报道</span>
      </div>
      <h3>"家乡，走到哪儿也忘不了！"</h3>
      <div class="author-line">本报记者 周世祥</div>
      <p>对此，常李刚也有亲身感受。"这次回来，看到家门口建起了图书馆，外观像放大版的陕北窑洞，里面分区合理，还有24小时城市书房、24小时热水供应、免费WiFi，阅读体验好极了！"</p>
      <p>在常李刚眼中，曾经偏居一隅的榆林，"朋友圈"也越来越大。"回家从北京飞榆林榆阳机场，看到新扩建投用的航站楼，航班能直飞国内30多个城市，来来往往的客流随着各地口音，还有不少洋面孔呢！你说city不city？"</p>
      <p>常李刚越说越兴奋。他告诉记者，新春新气象，他也确定了自己的新目标："把专业学扎实，将来出了校门就回来，在咱西部干一番事业！"</p>
