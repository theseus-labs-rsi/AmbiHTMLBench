<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桂花露与荷花露</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "SimSun", "STSong", "Songti SC", serif;
        }

        .page {
            width: 600px;
            min-height: 780px;
            background-color: #d9b8c4;
            border: 1.5px solid #8a7a82;
            padding: 50px 45px 30px 45px;
            position: relative;
            color: #3a3a3a;
            font-size: 17px;
            line-height: 1.8;
        }

        .section-title {
            font-size: 19px;
            margin-bottom: 12px;
            margin-top: 10px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .item {
            margin-bottom: 10px;
            text-indent: 0;
            padding-left: 10px;
        }

        .item-label {
            font-weight: normal;
        }

        .spacer {
            height: 30px;
        }

        .footer {
            position: absolute;
            bottom: 15px;
            left: 45px;
            right: 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #6a6a6a;
        }

        .footer-left {
            font-size: 12px;
            color: #6a6a6a;
        }

        .footer-right {
            font-size: 12px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-right .icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            background-color: #bbb;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="section-title">△桂花露</div>

        <div class="item">〔功用〕开胃消食，宽胸化痰</div>

        <div class="item">〔药物〕桂花500克</div>

        <div class="item">〔制法〕于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</div>

        <div class="spacer"></div>

        <div class="section-title">△荷花露</div>

        <div class="item">〔功用〕清暑凉营</div>

        <div class="item">〔药物〕白荷花500克</div>

        <div class="item">〔制法〕取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</div>

        <div class="footer">
            <div class="footer-left">[ 中国色 · 藕荷 ]</div>
            <div class="footer-right">
                <span class="icon"></span>
                <span>扫描APP</span>
            </div>
        </div>
    </div>
</body>
</html>
