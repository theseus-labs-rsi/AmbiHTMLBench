<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middlesex Music Hall - S. Emanuel's Benefit - Kostroma People</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Old+Standard+TT:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #f5f0e1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Old Standard TT', 'Georgia', serif;
  }

  .poster {
    width: 700px;
    max-width: 100%;
    background-color: #f5f0e1;
    padding: 30px 40px 40px 40px;
    text-align: center;
    border: 1px solid #d4c9a8;
    position: relative;
  }

  .poster::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(ellipse at top left, rgba(180,170,140,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(160,150,120,0.1) 0%, transparent 50%);
    pointer-events: none;
  }

  .venue-name {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #1a1a1a;
    line-height: 1.1;
    margin-bottom: 2px;
  }

  .venue-location {
    font-family: 'Old Standard TT', 'Georgia', serif;
    font-size: 18px;
    letter-spacing: 4px;
    color: #1a1a1a;
    margin-bottom: 10px;
  }

  .divider {
    width: 80%;
    margin: 8px auto 15px auto;
    border: none;
    border-top: 2px solid #1a1a1a;
  }

  .benefit-title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #1a1a1a;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .date {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .notice {
    font-family: 'Old Standard TT', 'Georgia', serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: #1a1a1a;
    margin-bottom: 15px;
  }

  .hirsute-label {
    font-family: 'Old Standard TT', 'Georgia', serif;
    font-size: 16px;
    letter-spacing: 5px;
    color: #1a1a1a;
    margin-bottom: 2px;
  }

  .kostroma-title {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 68px;
    font-weight: 900;
    color: #c44a2a;
    letter-spacing: 4px;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .origin-text {
    font-family: 'Old Standard TT', 'Georgia', serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: #1a1a1a;
    margin-bottom: 20px;
  }

  .illustration-container {
    width: 100%;
    background-color: #d4b84a;
    padding: 15px;
    margin-bottom: 20px;
    border: 3px solid #c4a83a;
    position: relative;
  }

  .illustration-inner-border {
    border: 2px solid #e8d878;
    padding: 10px;
  }

  .illustration-placeholder {
    width: 100%;
    height: 520px;
    background-color: #d4b84a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .illustration-placeholder .figure-group {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
    position: relative;
  }

  .figure-man {
    width: 280px;
    height: 420px;
    position: relative;
  }

  .figure-child {
    width: 180px;
    height: 280px;
    position: relative;
  }

  .illustration-caption {
    font-size: 12px;
    color: #8a7a30;
    margin-top: 10px;
    font-style: italic;
  }

  .bottom-text {
    font-family: 'Old Standard TT', 'Georgia', serif;
    font-size: 18px;
    letter-spacing: 3px;
    color: #1a1a1a;
    padding-top: 10px;
    border-top: 2px solid #1a1a1a;
  }

  /* SVG illustration styling */
  .svg-illustration {
    width: 100%;
    height: 520px;
  }
</style>
</head>
<body>

<div class="poster">

          <path d="M290,280 Q310,320 300,370 Q295,390 280,400 L260,395 Q270,380 275,360 Q280,330 270,300" fill="#3a5a8a" stroke="#2a4a7a" stroke-width="1"/>

          <!-- Man's hands -->

          <path d="M340,245 Q330,230 340,215 Q350,205 360,215" fill="#c8c8c0"/>

</div>
