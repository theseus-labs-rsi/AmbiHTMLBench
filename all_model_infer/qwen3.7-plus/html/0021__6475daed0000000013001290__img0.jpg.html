<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOW TO MAKE PROGRESS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 50px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 60px;
        }

        .list-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-left: 10px;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .list-number {
            font-size: 26px;
            font-weight: 700;
            min-width: 50px;
            text-align: left;
        }

        .list-text {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: auto;
            padding-top: 60px;
            font-size: 14px;
            color: #999999;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="title">HOW TO MAKE PROGRESS</div>

    <div class="list-container">
        <div class="list-item">
            <span class="list-number">01</span>
            <span class="list-text">设定明确的目标</span>
        </div>
        <div class="list-item">
            <span class="list-number">02</span>
            <span class="list-text">学习新知识</span>
        </div>
        <div class="list-item">
            <span class="list-number">03</span>
            <span class="list-text">发展技能</span>
        </div>
        <div class="list-item">
            <span class="list-number">04</span>
            <span class="list-text">持续反思和改进</span>
        </div>
        <div class="list-item">
            <span class="list-number">05</span>
            <span class="list-text">与优秀的人合作</span>
        </div>
        <div class="list-item">
            <span class="list-number">06</span>
            <span class="list-text">克服困难</span>
        </div>
        <div class="list-item">
            <span class="list-number">07</span>
            <span class="list-text">坚持努力</span>
        </div>
        <div class="list-item">
            <span class="list-number">08</span>
            <span class="list-text">接受反馈</span>
        </div>
        <div class="list-item">
            <span class="list-number">09</span>
            <span class="list-text">健康生活方式</span>
        </div>
        <div class="list-item">
            <span class="list-number">10</span>
            <span class="list-text">保持积极心态</span>
        </div>
    </div>

    <div class="footer">@ THE LAB C</div>
</body>
</html>
