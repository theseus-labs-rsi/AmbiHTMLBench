<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侦探能量站</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

  body {
    margin: 0;
    padding: 20px;
    background: #f5f0e8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Ma Shan Zheng', 'KaiTi', 'STKaiti', serif;
  }

  .page {
    width: 620px;
    min-height: 820px;
    background: #fffef8;
    padding: 30px 40px 40px 60px;
    box-shadow: 2px 4px 12px rgba(0,0,0,0.15);
    position: relative;
    background-image: repeating-linear-gradient(
      transparent,
      transparent 31px,
      #c8d8e8 31px,
      #c8d8e8 32px
    );
    background-position: 0 28px;
    line-height: 32px;
  }

  .page::before {
    content: '';
    position: absolute;
    left: 48px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #e8a0a0;
  }

  .title {
    font-size: 26px;
    font-weight: bold;
    color: #2a6a8a;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .body-text {
    font-size: 18px;
    color: #222;
    line-height: 2.1;
    text-indent: 2em;
    margin-bottom: 4px;
  }

  .body-text.no-indent {
    text-indent: 0;
  }

  .red-text {
    font-size: 20px;
    color: #c0392b;
    text-align: center;
    margin-top: 20px;
    line-height: 2.2;
    font-style: italic;
  }

  .margin-note {
    position: absolute;
    left: 8px;
    top: 520px;
    font-size: 14px;
    color: #555;
    writing-mode: vertical-rl;
    line-height: 1.8;
  }

  .corner-icon {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: 2px solid #888;
    border-radius: 4px;
    background: #ddd;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="margin-note">右移<br>识别<br>[?]</div>

    <div class="title">侦探能量站</div>

    <p class="body-text">当偏见裹挟认知，无视事实，操纵舆论的事发生，我们该如何对待？</p>

    <p class="body-text">如果我不害怕人微言轻，也许你就不会经历人言可畏，用心辨别真相，用爱和真诚可以消融流言。正如各位侦探所言，"千军万马踩过的時候，小小的一脚都有可能是致命伤，我们谁都不想成为这样的人，我们也不要成为加害的人"，遭遇不合时，隐忍不是唯一道路，我们可以向不公平呐喊，只有大家都勇敢起来，加害者才会觉得我们没有那么好欺负。</p>

    <div class="red-text">
      愿你笔尖下皆自由之风，一笔一画，<br>
      一字一句，黑白分明。
    </div>

    <div class="corner-icon"></div>
  </div>
</body>
</html>
