<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江戸時代のやきもの - 湯木美術館 平成29年春季展</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Noto Serif JP', serif;
  }

  .poster {
    width: 700px;
    background: #f0ede8;
    display: flex;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .main-content {
    flex: 1;
    padding: 30px 25px 30px 30px;
    position: relative;
  }

  .sidebar {
    width: 200px;
    background: #2a5a6a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    position: relative;
  }

  .top-label {
    font-size: 13px;
    color: #333;
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .season-label {
    font-size: 14px;
    color: #333;
    letter-spacing: 3px;
    margin-bottom: 20px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .main-title {
    font-size: 72px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.1;
    margin-bottom: 5px;
    letter-spacing: 2px;
  }

  .main-title .edo {
    display: block;
    font-size: 78px;
  }

  .main-title .jidai {
    display: block;
    font-size: 72px;
  }

  .main-title .no {
    display: inline;
    font-size: 48px;
    vertical-align: middle;
  }

  .main-title .yakimono {
    display: block;
    font-size: 68px;
    font-style: italic;
  }

  .english-subtitle {
    font-family: 'Georgia', serif;
    font-size: 14px;
    color: #555;
    letter-spacing: 3px;
    margin-bottom: 20px;
    font-style: italic;
  }

  .subtitle {
    font-size: 22px;
    color: #222;
    line-height: 1.6;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .date-info {
    font-size: 15px;
    color: #333;
    margin-bottom: 25px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .museum-section {
    margin-top: 10px;
  }

  .museum-label {
    font-size: 10px;
    color: #666;
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 2px;
  }

  .museum-name {
    font-size: 28px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 2px;
  }

  .museum-name-en {
    font-family: 'Georgia', serif;
    font-size: 11px;
    color: #555;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .museum-contact {
    font-size: 10px;
    color: #666;
    line-height: 1.8;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .sidebar-item {
    margin-bottom: 15px;
    text-align: center;
  }

  .sidebar-item .placeholder-img {
    width: 160px;
    height: auto;
    margin: 0 auto;
    display: block;
  }

  .sidebar-caption {
    font-size: 9px;
    color: #c8d8e0;
    margin-top: 4px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .ceramic-img-1 {
    width: 150px;
    height: 80px;
    background: #3a7a8a;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }

  .ceramic-img-1::after {
    content: '';
    width: 100px;
    height: 50px;
    background: radial-gradient(ellipse, #d4c8a0 0%, #b8a878 40%, #8a7a50 100%);
    border-radius: 50% 50% 40% 40%;
    position: relative;
  }

  .ceramic-img-2 {
    width: 140px;
    height: 120px;
    background: #3a7a8a;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }

  .ceramic-img-2::after {
    content: '';
    width: 90px;
    height: 100px;
    background: linear-gradient(180deg, #e8e0d0 0%, #d0c8b0 30%, #a09878 60%, #706848 100%);
    border-radius: 10px 10px 30px 30px;
    clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
  }

  .ceramic-img-3 {
    width: 130px;
    height: 80px;
    background: #3a7a8a;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }

  .ceramic-img-3::after {
    content: '';
    width: 100px;
    height: 50px;
    background: radial-gradient(ellipse, #4a5a4a 0%, #3a4a3a 50%, #2a3a2a 100%);
    border-radius: 50%;
  }

  .bottom-ceramics {
    position: absolute;
    bottom: 20px;
    left: 30px;
    right: 210px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 10px;
  }

  .large-bowl {
    width: 220px;
    height: 160px;
    position: relative;
  }

  .large-bowl-shape {
    width: 220px;
    height: 140px;
    background: radial-gradient(ellipse at 50% 30%, #d4b896 0%, #c4a880 30%, #b09070 60%, #9a7a5a 100%);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .large-bowl-shape::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 40px;
    background: radial-gradient(ellipse, #c8a880 0%, #b09068 100%);
    border-radius: 50%;
  }

  .large-bowl-shape::after {
    content: '';
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 25px;
    background: #a08060;
    border-radius: 50%;
  }

  .small-dish {
    width: 100px;
    height: 80px;
    position: relative;
    margin-bottom: 10px;
  }

  .small-dish-plate {
    width: 90px;
    height: 30px;
    background: #1a1a1a;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    left: 5px;
  }

  .small-dish-food {
    width: 60px;
    height: 40px;
    background: radial-gradient(ellipse, #e04030 0%, #c03020 50%, #a02010 100%);
    border-radius: 50% 50% 40% 40%;
    position: absolute;
    bottom: 15px;
    left: 20px;
  }

  .sidebar-bottom-caption {
    font-size: 8px;
    color: #a0b8c0;
    text-align: center;
    margin-top: 5px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .title-wrapper {
    position: relative;
  }

  .title-jp {
    font-size: 80px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.05;
    margin-bottom: 8px;
  }

  .title-jp .line1 {
    display: block;
    font-size: 82px;
  }

  .title-jp .line2 {
    display: block;
    font-size: 76px;
  }

  .title-jp .line2 .no-char {
    font-size: 50px;
    vertical-align: middle;
  }

  .title-jp .line3 {
    display: block;
    font-size: 70px;
    font-style: italic;
  }

  .ceramic-placeholder {
    background: #3a7a8a;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8ab8c8;
    font-size: 10px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .cp-1 {
    width: 155px;
    height: 75px;
  }

  .cp-2 {
    width: 145px;
    height: 115px;
  }

  .cp-3 {
    width: 135px;
    height: 75px;
  }

  .cp-4 {
    width: 175px;
    height: 130px;
  }

  .cp-5 {
    width: 95px;
    height: 70px;
  }

  .bottom-area {
    position: absolute;
    bottom: 15px;
    left: 25px;
    right: 205px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 5px;
  }

  .bottom-bowl-container {
    position: relative;
  }

  .bottom-bowl {
    width: 200px;
    height: 150px;
    background: radial-gradient(ellipse at 50% 20%, #d8c0a0 0%, #c8a880 25%, #b89870 50%, #a08060 75%, #907050 100%);
    border-radius: 50% 50% 42% 42%;
    position: relative;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }

  .bottom-bowl::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 60px;
    background: radial-gradient(ellipse, #c8b090 0%, #b8a080 100%);
    border-radius: 50%;
  }

  .bottom-bowl::after {
    content: '';
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 35px;
    background: radial-gradient(ellipse, #b09878 0%, #a08868 100%);
    border-radius: 50%;
  }

  .bottom-dish-container {
    position: relative;
    margin-bottom: 5px;
  }

  .bottom-dish-plate {
    width: 85px;
    height: 28px;
    background: #1a1a1a;
    border-radius: 50%;
    position: absolute;
    bottom: 0;
    left: 0;
  }

  .bottom-dish-food {
    width: 55px;
    height: 35px;
    background: radial-gradient(ellipse at 50% 40%, #e84838 0%, #d03828 40%, #b82818 80%, #a02010 100%);
    border-radius: 50% 50% 35% 35%;
    position: absolute;
    bottom: 12px;
    left: 15px;
  }

  .bottom-dish-food::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 10px;
    background: #2a1a0a;
    border-radius: 50% 50% 30% 30%;
  }

  .sidebar-bottom-text {
    font-size: 8px;
    color: #90a8b0;
    text-align: center;
    margin-top: 3px;
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.4;
  }

  .museum-contact-line {
    font-size: 9.5px;
    color: #555;
    line-height: 1.7;
    font-family: 'Noto Sans JP', sans-serif;
  }
</style>
</head>
<body>

<div class="poster">
  <div class="main-content">
    <div class="top-label">ひと目でわかる京焼300年の歴史</div>
    <div class="season-label">平成29年春季展</div>

    <div class="title-wrapper">
      <div class="title-jp">
        <span class="line1">江戸</span>
        <span class="line2">時代の<span class="no-char">の</span></span>
        <span class="line3">やきもの</span>
      </div>
    </div>

    <div class="english-subtitle">Ceramics of the Edo Period</div>

    <div class="subtitle">
      仁清・乾山窯と<br>
      後期京焼の<br>
      食器を中心に
    </div>

    <div class="date-info">平成29年4月8日(土)～7月30日(日)</div>

    <div class="museum-section">
      <div class="museum-label">公益財団法人</div>
      <div class="museum-name">湯木美術館</div>
      <div class="museum-name-en">YUKI MUSEUM OF ART</div>
      <div class="museum-contact-line">
        〒542-0086 大阪市中央区西心斎橋2-3-9<br>
        TEL.06-6211-0306 FAX.06-6211-3090<br>
        http://www.yuki-museum.or.jp/
      </div>
    </div>

    <div class="bottom-area">
      <div class="bottom-dish-container">
        <div class="bottom-dish-food"></div>
        <div class="bottom-dish-plate"></div>
      </div>
      <div class="bottom-bowl-container">
        <div class="bottom-bowl"></div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-item">
      <div class="ceramic-placeholder cp-1">
        <svg width="140" height="65" viewBox="0 0 140 65">
          <ellipse cx="70" cy="40" rx="55" ry="22" fill="#c8b890" stroke="#8a7a50" stroke-width="1.5"/>
          <ellipse cx="70" cy="35" rx="45" ry="15" fill="#d8c8a0"/>
          <path d="M20 38 Q30 15 70 12 Q110 15 120 38" fill="none" stroke="#8a7a50" stroke-width="1.5"/>
          <circle cx="55" cy="28" r="8" fill="#4a6a4a" opacity="0.6"/>
          <circle cx="80" cy="25" r="6" fill="#3a5a3a" opacity="0.5"/>
          <path d="M40 30 Q50 20 60 28" fill="none" stroke="#5a7a5a" stroke-width="1"/>
        </svg>
      </div>
      <div class="sidebar-caption">乾山窯 色絵松竹梅文蓋茶碗</div>
    </div>

    <div class="sidebar-item">
      <div class="ceramic-placeholder cp-2">
        <svg width="130" height="105" viewBox="0 0 130 105">
          <path d="M25 10 L30 95 Q65 105 100 95 L105 10 Z" fill="#e0d8c8" stroke="#a09878" stroke-width="1.5"/>
          <path d="M30 15 L35 90 Q65 98 95 90 L100 15 Z" fill="#d8d0c0"/>
          <circle cx="50" cy="40" r="4" fill="#4a6a4a" opacity="0.7"/>
          <circle cx="70" cy="35" r="5" fill="#3a5a3a" opacity="0.6"/>
          <circle cx="60" cy="55" r="3" fill="#5a7a5a" opacity="0.5"/>
          <circle cx="80" cy="50" r="4" fill="#4a6a4a" opacity="0.6"/>
          <circle cx="45" cy="65" r="3" fill="#3a5a3a" opacity="0.5"/>
          <circle cx="75" cy="70" r="4" fill="#4a6a4a" opacity="0.6"/>
          <path d="M40 20 Q50 15 60 22" fill="none" stroke="#6a8a6a" stroke-width="1"/>
          <path d="M65 25 Q75 18 85 25" fill="none" stroke="#5a7a5a" stroke-width="1"/>
        </svg>
      </div>
      <div class="sidebar-caption">仁清色絵 色絵桜文茶碗</div>
    </div>

    <div class="sidebar-item">
      <div class="ceramic-placeholder cp-3">
        <svg width="120" height="65" viewBox="0 0 120 65">
          <ellipse cx="60" cy="40" rx="45" ry="20" fill="#3a4a3a" stroke="#2a3a2a" stroke-width="1.5"/>
          <ellipse cx="60" cy="35" rx="38" ry="14" fill="#4a5a4a"/>
          <path d="M18 38 Q30 18 60 15 Q90 18 102 38" fill="none" stroke="#2a3a2a" stroke-width="1.5"/>
          <circle cx="50" cy="30" r="5" fill="#5a6a5a" opacity="0.5"/>
          <circle cx="70" cy="28" r="4" fill="#4a5a4a" opacity="0.6"/>
        </svg>
      </div>
      <div class="sidebar-caption">乾山入 色絵(三つ葉)形向付</div>
    </div>

    <div class="sidebar-item" style="margin-top: auto;">
      <div class="ceramic-placeholder cp-4" style="background: transparent;">
      </div>
      <div class="sidebar-bottom-text">
        乾窑乾山 青瓷 手描竹図茶碗 明治期作
      </div>
    </div>
  </div>
</div>

</body>
</html>
