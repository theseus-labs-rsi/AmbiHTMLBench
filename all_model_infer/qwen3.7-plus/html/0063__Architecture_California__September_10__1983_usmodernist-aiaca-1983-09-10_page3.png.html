<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heath Ceramics Ad - Architecture California</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f4; /* Simulating page background */
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            background-color: white;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            position: relative;
        }

        .ad-box {
            border: 2px solid black;
            display: flex;
            flex-direction: column;
        }

        .image-placeholder {
            width: 100%;
            height: 850px; /* Approximate aspect ratio */
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 1.2rem;
            border-bottom: 2px solid black; /* Separator if needed, though border is continuous */
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the image content roughly with CSS for better layout fidelity if image fails, 
           but per instructions, use placeholder class. */
        .image-placeholder::after {
            content: "[Image: Interior atrium of Transpacific Building with hexagonal tile floor]";
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.7);
            padding: 2px 5px;
        }

        .content-area {
            padding: 30px 40px 40px 40px;
            background-color: white;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: #000;
        }

        .headline {
            text-align: center;
            font-size: 3.5rem;
            font-weight: 300;
            margin: 20px 0 60px 0;
            letter-spacing: -1px;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: auto;
        }

        .left-col {
            text-align: left;
        }

        .right-col {
            text-align: right;
        }

        .company-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .contact-info {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .page-footer {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 0.8rem;
            color: #333;
            display: flex;
            gap: 15px;
        }
        
        .page-footer span {
            margin-left: 10px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="ad-box">
            <div class="image-placeholder">
                <!-- Visual representation of the atrium photo -->
            </div>
            
            <div class="content-area">
                <div class="top-row">
                    <div>Transpacific Building — Oakland, CA</div>
                    <div>Wong & Tung International Architects</div>
                </div>

                <div class="headline">
                    “tile that humanizes”
                </div>

                <div class="bottom-row">
                    <div class="left-col">
                        <div class="company-name">Heath Ceramics, Sausalito, CA 94965</div>
                        <div class="tagline">(Custom-made by people—not automated)</div>
                    </div>
                    <div class="right-col contact-info">
                        <div>Phone (415) 332-3732</div>
                        <div>Edith Heath</div>
                        <div>Jon Brooder</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-footer">
            September/October 1983 &nbsp; Architecture California &nbsp; 3
        </div>
    </div>

</body>
</html>
