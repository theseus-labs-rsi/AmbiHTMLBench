<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: #fff;
    background-image:
      linear-gradient(rgba(200,200,200,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,200,200,0.3) 1px, transparent 1px);
    background-size: 20px 20px;
    max-width: 780px;
    width: 100%;
    padding: 30px 30px 40px;
    border-radius: 4px;
  }

  .title {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }

  .title .blue {
    color: #1a3a8a;
  }

  .title .black {
    color: #1a1a1a;
  }

  .route-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .left-column {
    flex: 0 0 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 5px;
  }

  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-top: 5px;
  }

  .day-label {
    background-color: #a8e6cf;
    padding: 6px 20px;
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    border-radius: 2px;
    margin-bottom: 2px;
  }

  .arrow-down {
    font-size: 36px;
    color: #f0a500;
    line-height: 1;
    margin: 2px 0;
  }

  .location-name {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 4px 0;
    text-align: center;
  }

  .transport-info {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 16px;
    color: #333;
    margin: 2px 0;
    background: rgba(255,200,200,0.3);
    padding: 2px 8px;
    border-radius: 3px;
  }

  .transport-info .arrow-small {
    font-size: 28px;
    color: #f0a500;
    line-height: 1;
  }

  .desc-box {
    border: 2.5px solid #c0392b;
    padding: 12px 16px;
    font-size: 16px;
    line-height: 1.7;
    color: #1a1a1a;
    background: #fff;
    min-height: 70px;
  }

  .desc-box .highlight {
    color: #1a3a8a;
    font-weight: 700;
  }

  .desc-box .free {
    color: #1a3a8a;
    font-weight: 700;
  }

  .spacer {
    height: 10px;
  }

  .route-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0;
  }

  .flow-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .flow-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }

  .transport-label {
    font-size: 15px;
    color: #333;
    background: rgba(255,220,220,0.4);
    padding: 2px 6px;
    border-radius: 3px;
  }

  .time-label {
    font-size: 15px;
    color: #333;
  }

  .arrow-big {
    font-size: 40px;
    color: #f0a500;
    line-height: 0.8;
  }

  .arrow-med {
    font-size: 32px;
    color: #f0a500;
    line-height: 0.8;
  }
</style>
</head>
<body>
<div class="container">
  <div class="title">
    <span class="blue">第三天</span><span class="black">路线规划</span>
  </div>

  <div class="route-layout">
    <div class="left-column">
      <div class="flow-group">
        <div class="day-label">第三天</div>
        <div class="arrow-big">↓</div>
        <div class="location-name">磁器口</div>
        <div class="flow-row">
          <span class="transport-label">1号线</span>
          <span class="arrow-med">↓</span>
          <span class="time-label">30分钟</span>
        </div>
        <div class="location-name">罗中立美术馆</div>
        <div class="flow-row">
          <span class="transport-label">1号线</span>
          <span class="arrow-med">↓</span>
          <span class="time-label">80分钟</span>
        </div>
        <div class="location-name">山城步道</div>
        <div class="flow-row">
          <span class="transport-label">公交</span>
          <span class="arrow-med">↓</span>
          <span class="time-label">32分钟</span>
        </div>
        <div class="location-name">观音桥</div>
        <div class="flow-row">
          <span class="transport-label">步行</span>
          <span class="arrow-med">↓</span>
          <span class="time-label">15分钟</span>
        </div>
        <div class="location-name">九街</div>
      </div>
    </div>

    <div class="right-column">
      <div class="desc-box">
        <span class="highlight">磁器口</span><span class="free">（免费）</span>：汇聚美食、重庆特色伴手礼，始建于宋代"一江两洗三山四巷"独特地貌
      </div>
      <div class="desc-box">
        <span class="highlight">罗中立美术馆</span><span class="free">（免费）</span>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
      </div>
      <div class="desc-box">
        <span class="highlight">山城步道</span><span class="free">（免费）</span>：建在悬崖边的临江步道，汇聚老重庆特色步道
      </div>
      <div class="desc-box">
        <span class="highlight">观音桥</span><span class="free">（免费）</span>：超大商圈，还有很多地道重庆小吃
      </div>
      <div class="desc-box">
        <span class="highlight">九街</span><span class="free">（免费）</span>：酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
      </div>
    </div>
  </div>
</div>
</body>
</html>
