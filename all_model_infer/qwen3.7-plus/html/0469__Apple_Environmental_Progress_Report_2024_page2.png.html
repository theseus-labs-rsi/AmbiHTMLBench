<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2024 Environmental Progress Report - Contents</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1d1d1f;
    background: #fff;
    overflow-x: hidden;
  }

  .page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    padding: 0;
  }

  /* Navigation */
  .nav {
    display: flex;
    align-items: center;
    padding: 18px 40px;
    font-size: 13px;
    color: #6e6e73;
    gap: 24px;
    position: relative;
    z-index: 10;
  }

  .nav a {
    text-decoration: none;
    color: #6e6e73;
    font-size: 13px;
  }

  .nav a.active {
    color: #1d1d1f;
    font-weight: 600;
    border-bottom: 1.5px solid #1d1d1f;
    padding-bottom: 2px;
  }

  .nav-right {
    margin-left: auto;
    font-size: 13px;
    color: #6e6e73;
  }

  /* Main content area */
  .main-content {
    display: flex;
    position: relative;
    padding: 40px 40px 60px;
  }

  .toc-section {
    flex: 0 0 55%;
    max-width: 55%;
    position: relative;
    z-index: 5;
  }

  .toc-heading {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 40px;
    color: #1d1d1f;
  }

  .toc-columns {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 30px 24px;
  }

  .toc-col h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    color: #1d1d1f;
    line-height: 1.3;
  }

  .toc-col h3 {
    font-size: 14px;
    font-weight: 700;
    margin-top: 18px;
    margin-bottom: 8px;
    color: #1d1d1f;
  }

  .toc-col h3:first-of-type {
    margin-top: 0;
  }

  .toc-item {
    display: flex;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 13px;
    line-height: 1.5;
    color: #424245;
  }

  .toc-item .page-num {
    flex-shrink: 0;
    width: 28px;
    font-size: 12px;
    color: #6e6e73;
    font-weight: 400;
  }

  .toc-item .item-text {
    flex: 1;
  }

  /* Images section */
  .images-section {
    flex: 1;
    position: relative;
    min-height: 700px;
  }

  .phone-image {
    position: absolute;
    background: #f5f5f7;
    border-radius: 20px;
    overflow: hidden;
  }

  .phone-top {
    top: -20px;
    right: -40px;
    width: 420px;
    height: 380px;
    background: linear-gradient(135deg, #e8f0e8 0%, #d4e4d4 50%, #c8d8c8 100%);
    border-radius: 30px;
    transform: rotate(-15deg);
  }

  .phone-top .camera-module {
    position: absolute;
    top: 60px;
    left: 80px;
    width: 160px;
    height: 160px;
    background: #c8d8c8;
    border-radius: 30px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 10px;
  }

  .camera-lens {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #2a2a2a 0%, #111 40%, #000 70%);
    border: 3px solid #888;
    position: relative;
  }

  .camera-lens::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a3a5a 0%, #0a1a2a 100%);
  }

  .camera-flash {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #eee 50%, #ddd 100%);
    border: 2px solid #ccc;
  }

  .camera-mic {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #555;
  }

  .phone-bottom {
    bottom: 20px;
    right: 60px;
    width: 460px;
    height: 500px;
    background: linear-gradient(135deg, #d8d4cc 0%, #c8c4bc 50%, #b8b4ac 100%);
    border-radius: 35px;
    transform: rotate(10deg);
  }

  .phone-bottom .camera-module {
    position: absolute;
    top: 80px;
    left: 60px;
    width: 200px;
    height: 200px;
    background: #c0bcb4;
    border-radius: 35px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    padding: 25px;
    gap: 12px;
  }

  .phone-bottom .camera-lens {
    width: 65px;
    height: 65px;
  }

  .phone-bottom .camera-lens::after {
    width: 24px;
    height: 24px;
  }

  .phone-bottom .camera-flash {
    width: 26px;
    height: 26px;
  }

  .phone-bottom .camera-mic {
    width: 14px;
    height: 14px;
  }

  .phone-screen {
    position: absolute;
    bottom: 100px;
    right: -60px;
    width: 300px;
    height: 500px;
    background: linear-gradient(135deg, #b8d4e8 0%, #a0c4dc 30%, #88b4d0 60%, #70a4c4 100%);
    border-radius: 30px;
    border: 8px solid #2a2a2a;
    transform: rotate(5deg);
    overflow: hidden;
  }

  .phone-screen .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 24px;
    background: #1a1a1a;
    border-radius: 12px;
  }

  .phone-screen .screen-content {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #c8e0f0 0%, #a8c8e0 40%, #88b0d0 70%, #6898c0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-bubble {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d0e8f8 0%, #90b8d8 50%, #70a0c8 100%);
    position: absolute;
    bottom: 60px;
    right: -30px;
  }

  .placeholder-img {
    position: absolute;
    background: #f0f0f0;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 12px;
  }

  .img-top-right {
    top: 0;
    right: 0;
    width: 450px;
    height: 400px;
    background: linear-gradient(145deg, #e4f0e4 0%, #d0e0d0 40%, #c0d4c0 100%);
    border-radius: 0 0 0 60px;
    transform-origin: top right;
  }

  .img-bottom-center {
    bottom: 0;
    right: 100px;
    width: 480px;
    height: 520px;
    background: linear-gradient(145deg, #d4d0c8 0%, #c4c0b8 40%, #b4b0a8 100%);
    border-radius: 40px 40px 0 0;
    transform: rotate(8deg);
    transform-origin: bottom center;
  }

  .img-right-edge {
    top: 200px;
    right: -30px;
    width: 280px;
    height: 500px;
    background: linear-gradient(145deg, #c0d8e8 0%, #a8c8dc 40%, #90b8d0 100%);
    border-radius: 30px;
    border: 6px solid #333;
    transform: rotate(3deg);
  }

  /* Camera module details for top phone */
  .cam-module-green {
    position: absolute;
    top: 80px;
    left: 100px;
    width: 170px;
    height: 170px;
    background: #b8d0b8;
    border-radius: 32px;
    padding: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    align-items: center;
    justify-items: center;
  }

  .lens-large {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #3a3a3a 0%, #1a1a1a 30%, #0a0a0a 60%, #000 100%);
    border: 4px solid #999;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
  }

  .lens-large::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #2a4a6a 0%, #1a2a3a 100%);
  }

  .lens-large {
    position: relative;
  }

  .flash-small {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #f0f0f0 60%, #e0e0e0 100%);
    border: 2px solid #ccc;
  }

  .mic-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #666;
  }

  /* Camera module for bottom phone */
  .cam-module-silver {
    position: absolute;
    top: 100px;
    left: 80px;
    width: 210px;
    height: 210px;
    background: #b8b4ac;
    border-radius: 38px;
    padding: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    align-items: center;
    justify-items: center;
  }

  .lens-xl {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #3a3a3a 0%, #1a1a1a 30%, #0a0a0a 60%, #000 100%);
    border: 5px solid #aaa;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    position: relative;
  }

  .lens-xl::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #2a4a6a 0%, #1a2a3a 100%);
  }

  .flash-med {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #f0f0f0 60%, #e0e0e0 100%);
    border: 2px solid #ccc;
  }

  .lidar-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #222;
  }

  /* Screen phone */
  .screen-phone {
    position: absolute;
    top: 180px;
    right: -20px;
    width: 260px;
    height: 480px;
    background: #2a2a2a;
    border-radius: 32px;
    padding: 8px;
    transform: rotate(4deg);
  }

  .screen-inner {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #c8e4f4 0%, #a8cce4 30%, #88b4d4 60%, #689cc4 100%);
    border-radius: 26px;
    position: relative;
    overflow: hidden;
  }

  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 22px;
    background: #1a1a1a;
    border-radius: 11px;
  }

  .screen-bubble-large {
    position: absolute;
    bottom: 40px;
    right: -40px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d8ecf8 0%, #98c0e0 50%, #78a8d0 100%);
  }

  .screen-bubble-small {
    position: absolute;
    top: 60px;
    left: 20px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e0f0f8 0%, #b0d4e8 50%, #90c0d8 100%);
    opacity: 0.7;
  }

  @media (max-width: 1200px) {
    .toc-columns {
      grid-template-columns: 1fr 1fr;
    }
    .toc-section {
      flex: 0 0 100%;
      max-width: 100%;
    }
    .images-section {
      display: none;
    }
  }
</.style>
</head>
