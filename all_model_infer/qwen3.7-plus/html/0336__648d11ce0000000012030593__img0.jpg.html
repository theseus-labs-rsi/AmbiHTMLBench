<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三阶段 认识自我，找到自我</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #fff;
            color: #333;
            padding: 20px 30px;
            font-size: 16px;
            line-height: 1.8;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .main-heading {
            color: #c0392b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .main-heading .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #c0392b;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .main-heading .arrow {
            color: #999;
            font-size: 14px;
            cursor: pointer;
        }

        .level-1 {
            margin-left: 20px;
            position: relative;
        }

        .level-1-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 16px;
            color: #333;
        }

        .level-1-item .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #888;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .level-1-item .label {
            flex: 1;
        }

        .level-1-item .arrow {
            color: #999;
            font-size: 12px;
            cursor: pointer;
        }

        .level-2 {
            margin-left: 40px;
            padding-left: 15px;
            border-left: 2px solid #e0e0e0;
        }

        .level-2-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-size: 15px;
            color: #333;
        }

        .level-2-item .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .level-3 {
            margin-left: 60px;
            padding-left: 15px;
            border-left: 2px solid #e0e0e0;
        }

        .level-3-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-size: 15px;
            color: #333;
        }

        .level-3-item .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .sub-text {
            margin-left: 60px;
            padding-left: 15px;
            border-left: 2px solid #e0e0e0;
            font-size: 15px;
            color: #333;
            line-height: 1.8;
        }

        .sub-text .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            margin-right: 10px;
            flex-shrink: 0;
            vertical-align: middle;
        }

        .sub-text-content {
            display: inline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-heading">
            <div style="display:flex; align-items:center;">
                <span class="dot"></span>
                <span>第三阶段 认识自我，找到自我</span>
            </div>
            <span class="arrow">▼</span>
        </div>

        <div class="level-1">
            <div class="level-1-item">
                <div style="display:flex; align-items:center;">
                    <span class="dot"></span>
                    <span class="label">不同国家的妆容模仿</span>
                </div>
                <span class="arrow">▼</span>
            </div>

            <div class="level-3">
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>不同国家妆容特点分析</span>
                </div>
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>逐个部位模仿</span>
                </div>
            </div>

            <div class="level-1-item" style="margin-top: 10px;">
                <div style="display:flex; align-items:center;">
                    <span class="dot"></span>
                    <span class="label">明星出圈妆容模仿</span>
                </div>
                <span class="arrow">▼</span>
            </div>

            <div class="level-3">
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>鞠婧祎妆容</span>
                </div>
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>虞书欣妆容</span>
                </div>
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>宋慧乔妆容</span>
                </div>
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>女团妆容</span>
                </div>
                <div class="level-3-item">
                    <span class="dot"></span>
                    <span>日本杂志妆容</span>
                </div>
            </div>

            <div class="level-1-item" style="margin-top: 10px;">
                <div style="display:flex; align-items:center;">
                    <span class="dot"></span>
                    <span class="label">找到适合自己的风格和妆容</span>
                </div>
                <span class="arrow">▼</span>
            </div>

            <div class="sub-text">
                <span class="dot"></span>
                <span class="sub-text-content">根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</span>
            </div>
        </div>
    </div>
</body>
</html>
