<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线式构图 - Curvilinear Composition</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .poster {
    width: 700px;
    max-width: 100%;
    position: relative;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .header-left h1 {
    font-size: 22px;
    font-weight: bold;
    color: #000;
    letter-spacing: 2px;
  }

  .header-left .subtitle {
    font-size: 11px;
    color: #333;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .header-right {
    text-align: right;
  }

  .header-right h2 {
    font-size: 18px;
    font-weight: bold;
    color: #000;
    letter-spacing: 4px;
  }

  .header-right .date {
    font-size: 13px;
    color: #333;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* Row 1 */
  .row1 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .box-yellow-ku {
    width: 160px;
    height: 160px;
    background: #f5d800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .box-yellow-ku .ku-char {
    font-size: 110px;
    font-weight: 900;
    color: #000;
    line-height: 1;
  }

  .box-black-cools {
    flex: 1;
    background: #000;
    padding: 20px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 160px;
  }

  .box-black-cools .cn-text {
    font-size: 48px;
    font-weight: 900;
    color: #f5d800;
    letter-spacing: 12px;
    line-height: 1.2;
  }

  .box-black-cools .en-text {
    font-size: 42px;
    font-weight: 900;
    color: #f5d800;
    letter-spacing: 18px;
    margin-top: 5px;
  }

  /* Row 2 */
  .row2 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .black-bar-small {
    width: 80px;
    height: 22px;
    background: #000;
    flex-shrink: 0;
    margin-top: 10px;
  }

  .box-yellow-importance {
    width: 160px;
    height: 160px;
    background: #f5d800;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px;
    flex-shrink: 0;
  }

  .box-yellow-importance .line1 {
    font-size: 36px;
    font-weight: 900;
    color: #000;
    line-height: 1.3;
  }

  .box-yellow-importance .line2 {
    font-size: 36px;
    font-weight: 900;
    color: #000;
    line-height: 1.3;
  }

  .box-black-forever {
    width: 220px;
    height: 200px;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 30px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .box-black-forever .line1 {
    font-size: 48px;
    font-weight: 900;
    color: #f5d800;
    letter-spacing: 8px;
    line-height: 1.3;
  }

  .box-black-forever .line2 {
    font-size: 48px;
    font-weight: 900;
    color: #f5d800;
    letter-spacing: 8px;
    line-height: 1.3;
  }

  /* Row 3 */
  .row3 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .box-black-imp-en {
    width: 160px;
    height: 160px;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px;
    flex-shrink: 0;
  }

  .box-black-imp-en .en-line1 {
    font-size: 13px;
    color: #f5d800;
    letter-spacing: 3px;
    line-height: 1.6;
  }

  .box-black-imp-en .en-line2 {
    font-size: 13px;
    color: #f5d800;
    letter-spacing: 3px;
    line-height: 1.6;
  }

  .box-black-vertex {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
    padding: 20px;
  }

  .box-black-vertex .vertex-text {
    font-size: 72px;
    font-weight: 900;
    color: #f5d800;
    letter-spacing: 16px;
  }

  /* Row 4 */
  .row4 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: flex-start;
  }

  .yellow-bar-small {
    width: 80px;
    height: 22px;
    background: #f5d800;
    flex-shrink: 0;
    margin-top: 10px;
  }

  .text-strips {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .strip {
    background: #f5d800;
    padding: 4px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .strip span {
    font-size: 11px;
    color: #000;
    white-space: nowrap;
    letter-spacing: 1px;
  }

  /* Row 5 */
  .row5 {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: center;
  }

  .yellow-circle {
    width: 100px;
    height: 100px;
    background: #f5d800;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .black-bar-cool {
    background: #000;
    padding: 10px 20px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .black-bar-cool .cool-text {
    font-size: 16px;
    color: #f5d800;
    letter-spacing: 3px;
    font-weight: bold;
  }

  .yellow-square-small {
    width: 80px;
    height: 60px;
    background: #f5d800;
    flex-shrink: 0;
  }

  /* Bottom */
  .bottom-text {
    text-align: center;
    font-size: 18px;
    color: #000;
    letter-spacing: 6px;
    margin-top: 10px;
    font-weight: bold;
  }

  .bottom-text span {
    margin: 0 4px;
  }

  .black-bar-mid {
    width: 120px;
    height: 22px;
    background: #000;
    margin: 0 auto 12px;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>曲线式构图</h1>
      <div class="subtitle">CURVILINEAR COMPOSITION</div>
    </div>
    <div class="header-right">
      <h2>版式设计</h2>
      <div class="date">2023 / 6 / 07</div>
    </div>
  </div>

  <!-- Row 1 -->
  <div class="row1">
    <div class="box-yellow-ku">
      <span class="ku-char">酷</span>
    </div>
    <div class="box-black-cools">
      <div class="cn-text">酷设而遇</div>
      <div class="en-text">COOLS</div>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="row2">
    <div class="black-bar-small"></div>
    <div class="box-yellow-importance">
      <div class="line1">构图的</div>
      <div class="line2">重要性</div>
    </div>
    <div class="box-black-forever">
      <div class="line1">酷设</div>
      <div class="line2">永远</div>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="row3">
    <div class="box-black-imp-en">
      <div class="en-line1">THE IMPORTANCE</div>
      <div class="en-line2">OF COMPOSITION</div>
    </div>
    <div class="box-black-vertex">
      <div class="vertex-text">在顶点</div>
    </div>
  </div>

  <!-- Black bar -->
  <div class="black-bar-mid" style="margin-left: auto; width: 120px;"></div>

  <!-- Row 4 -->
  <div class="row4">
    <div class="yellow-bar-small"></div>
    <div class="text-strips">
      <div class="strip">
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以</span>
      </div>
      <div class="strip">
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以</span>
      </div>
      <div class="strip">
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以是图片</span>
        <span>都可以</span>
      </div>
    </div>
  </div>

  <!-- Row 5 -->
  <div class="row5">
    <div class="yellow-circle"></div>
    <div class="black-bar-cool">
      <span class="cool-text">COOL SET IS ALWAYS AT THE TOP</span>
    </div>
    <div class="yellow-square-small"></div>
  </div>

  <!-- Bottom -->
  <div class="bottom-text">
    <span>我</span> / <span>看</span> / <span>不</span> / <span>懂</span> / <span>但</span> / <span>大</span> / <span>受</span> / <span>震</span> / <span>撼</span>
  </div>

</div>
</body>
</html>
