<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老吴の创业随笔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #d4c5a9;
            font-family: "STKaiti", "KaiTi", "SimSun", "Microsoft YaHei", serif;
        }

        .page {
            width: 520px;
            min-height: 680px;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(180, 160, 120, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(160, 140, 100, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 80%, rgba(170, 150, 110, 0.25) 0%, transparent 60%),
                linear-gradient(180deg, #c9b896 0%, #d4c5a9 15%, #cbb89a 50%, #d0c0a0 85%, #c5b490 100%);
            background-color: #c9b896;
            padding: 40px 35px 30px 35px;
            position: relative;
            box-shadow: 
                inset 0 0 60px rgba(120, 100, 60, 0.15),
                inset 0 0 120px rgba(100, 80, 40, 0.1),
                0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 119, 80, 0.02) 2px,
                    rgba(139, 119, 80, 0.02) 4px
                );
            pointer-events: none;
        }

        .header {
            font-size: 22px;
            color: #2a2a2a;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .body-text {
            font-size: 32px;
            color: #1a1a1a;
            line-height: 1.9;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .body-text p {
            text-align: center;
        }

        .footer {
            font-size: 16px;
            color: #2a2a2a;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 20px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">老吴の创业随笔</div>
        <div class="body-text">
            <p>《易经》中说："小财靠勤，大财靠德，德不厚，无以载物。"靠出卖时间和劳动力 赚钱的人，只能发点小财。一个人每天，时间有限，精力有限，分身乏术。</p>
        </div>
        <div class="footer">商业思维|个人提升|创业心得|认知觉醒</div>
    </div>
</body>
</html>
