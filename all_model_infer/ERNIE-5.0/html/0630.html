<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology Notes - Cell Membranes and Nucleus</title>
    <style>
        body {
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header-note {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .membrane-list {
            list-style: none;
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .membrane-list li {
            position: relative;
        }
        
        .membrane-list li::before {
            content: "└";
            position: absolute;
            left: -15px;
            color: #888;
        }

        .section-label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }

        ol.function-list {
            padding-left: 20px;
        }

        ol.function-list li {
            margin-bottom: 10px;
        }

        .divider {
            border-top: 2px solid #333;
            margin: 30px 0;
            opacity: 0.5;
        }

        .nucleus-header {
            background-color: #eef;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .nucleus-structure {
            display: flex;
            align-items: flex-start;
        }

        .nucleus-main {
            font-weight: bold;
            font-size: 1.2em;
            margin-right: 20px;
            min-width: 60px;
            padding-top: 10px;
        }

        .nucleus-details {
            flex: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nucleus-details > li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 15px;
            border-left: 2px solid #ddd;
        }

        .nucleus-details > li::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 8px;
            width: 10px;
            height: 2px;
            background-color: #ddd;
        }

        .sub-point {
            margin-top: 5px;
            margin-left: 10px;
            font-size: 0.95em;
            color: #444;
            position: relative;
            padding-left: 15px;
        }
        
        .sub-point::before {
            content: "↘";
            position: absolute;
            left: 0;
            top: 0;
            color: #888;
        }

        .arrow-text {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Top Section: Biological Membrane System -->
    <div class="header-note">内质网 -> 高尔基体</div>

    <h2>细胞的生物膜系统</h2>
    <ul class="membrane-list">
        <li>细胞膜</li>
        <li>细胞器膜</li>
        <li>核膜</li>
    </ul>

    <span class="section-label">↓ 作用</span>
    <ol class="function-list">
        <li>
            使细胞具有相对稳定的内部环境<br>
            同时，在细胞与外部环境进行物质运输、能量转化、信息传递的过程中起决定性作用。
        </li>
        <li>广阔的膜面积为许多酶提供了附着位点。</li>
        <li>
            分隔 <span class="arrow-text">-></span> 保证了细胞生命活动高效、有序的进行。
        </li>
    </ol>

    <div class="divider"></div>

    <!-- Bottom Section: Cell Nucleus -->
    <div class="nucleus-header">细胞核控制着细胞的代谢和遗传</div>

    <div class="nucleus-structure">
        <div class="nucleus-main">细胞核</div>
        <ul class="nucleus-details">
            <li>
                核膜：双层，外膜
            </li>
            <li>
                核仁：与某种RNA的合成以及核糖体的形成有关
            </li>
            <li>
                染色质 <span class="arrow-text">-></span> 由DNA和蛋白质组成
                <div class="sub-point">遗传信息的载体</div>
            </li>
            <li>
                核孔：实现核质之间频繁的物质交换和信息交流
            </li>
        </ul>
    </div>

</body>
</html>
