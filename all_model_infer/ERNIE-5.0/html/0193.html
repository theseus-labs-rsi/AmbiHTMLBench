<!DOCTYPE html>
<html lang="tr">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEP Poster</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .poster-container {
            width: 500px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Top Yellow Section */
        .section-top {
            background-color: #fce300;
            padding: 25px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .text-list {
            flex: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .text-list li {
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            display: flex;
            align-items: center;
        }

        .bullet-pin {
            color: #d32f2f;
            margin-right: 10px;
            font-size: 18px;
        }

        .graphic-placeholder {
            width: 160px;
            height: 160px;
            background-color: #ffcc80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        
        /* Simulating the graph content roughly */
        .graphic-placeholder::after {
            content: "[Graphic: Upward trend line, coin '1', money stacks]";
            font-size: 10px;
            text-align: center;
            color: #555;
            font-weight: bold;
        }

        /* Middle White Section */
        .section-middle {
            padding: 30px 25px;
            background-color: white;
        }

        .main-slogan {
            color: #b71c1c;
            font-size: 28px;
            font-weight: 900;
            line-height: 1.3;
            margin: 0;
        }

        /* Red Banner Section */
        .section-red-banner {
            background-color: #d32f2f;
            padding: 20px;
            text-align: center;
        }

        .banner-text {
            color: white;
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Bottom White Section */
        .section-bottom {
            padding: 30px 25px;
            background-color: white;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 70px;
            height: 70px;
            background-color: #d32f2f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fce300;
            font-weight: bold;
            font-size: 20px;
            border: 4px solid #d32f2f; /* Simulating the gear teeth roughly */
            position: relative;
        }
        
        /* Simulating gear teeth with box-shadow trick or just keeping it simple as per instructions */
        .logo-placeholder {
             background: radial-gradient(circle, #fce300 40%, #d32f2f 41%, #d32f2f 60%, #fce300 61%);
             /* Actually, let's just use a div with text as requested for placeholders */
             background: #d32f2f;
             color: white;
             font-family: serif;
        }

        .party-name {
            color: #d32f2f;
            font-weight: 900;
            font-size: 22px;
            line-height: 1.2;
        }
        
        .party-sub {
            color: #d32f2f;
            font-size: 14px;
            font-weight: normal;
        }

        .contact-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d32f2f;
            font-size: 14px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .icon-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #d32f2f;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            border-radius: 3px;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Top Yellow Section -->
        <div class="section-top">
            <ul class="text-list">
                <li><span class="bullet-pin">📌</span> Enflasyon yükseliyor</li>
                <li><span class="bullet-pin">📌</span> TL değer kaybediyor</li>
                <li><span class="bullet-pin">📌</span> Ücretler eriyor</li>
            </ul>
            <div class="graphic-placeholder">
                <!-- Placeholder for the graph/money image -->
            </div>
        </div>

        <!-- Middle White Section -->
        <div class="section-middle">
            <h2 class="main-slogan">Vergiden muaf, insanca yaşanacak</h2>
        </div>

        <!-- Red Banner Section -->
        <div class="section-red-banner">
            <h1 class="banner-text">ASGARİ ÜCRET!</h1>
        </div>

        <!-- Bottom White Section -->
        <div class="section-bottom">
            <div class="logo-area">
                <div class="logo-placeholder">
                    EMEP
                </div>
                <div>
                    <div class="party-name">EMEK PARTİSİ</div>
                    <div class="party-sub">Ankara İl Örgütü</div>
                </div>
            </div>

            <div class="contact-info">
                <div class="contact-item">
                    <span class="icon-box">f</span> /ankaraemep
                </div>
                <div class="contact-item">
                    <span class="icon-box">📷</span> @emepankara
                </div>
                <div class="contact-item">
                    <span class="icon-box">📞</span> 0 (312) 232 41 97
                </div>
            </div>
        </div>
    </div>

</body>
</html>
