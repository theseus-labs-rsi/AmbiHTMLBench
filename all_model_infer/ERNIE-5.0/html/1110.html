<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok运营48个必备工具</title>
    <style>
        body {
            background-color: #2e5c4e;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 40px 20px;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            margin-bottom: 40px;
            text-align: left;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 48px;
            margin: 0 0 20px 0;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .author-tag {
            background-color: #f0b946;
            color: #333;
            padding: 8px 15px;
            display: inline-block;
            font-weight: bold;
            font-size: 16px;
            border-radius: 2px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: auto auto auto auto;
            gap: 15px;
        }

        .card {
            background-color: #749f85;
            padding: 20px 15px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 120px;
            transition: opacity 0.3s;
        }

        .card:hover {
            opacity: 0.9;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .card-content {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
        }

        /* Grid Placement */
        
        /* Part 01: Spans 2 rows height-wise roughly */
        .part-01 {
            grid-column: 1;
            grid-row: 1 / span 2;
            min-height: 260px;
        }

        /* Part 02 */
        .part-02 {
            grid-column: 2;
            grid-row: 1;
            min-height: 120px;
        }

        /* Part 03 */
        .part-03 {
            grid-column: 2;
            grid-row: 2;
            min-height: 140px;
        }

        /* Part 05: Spans 2 columns */
        .part-05 {
            grid-column: 3 / span 2;
            grid-row: 1;
            min-height: 120px;
        }

        /* Part 06: Tall block */
        .part-06 {
            grid-column: 3;
            grid-row: 2 / span 2;
            min-height: 260px;
        }

        /* Part 07 */
        .part-07 {
            grid-column: 4;
            grid-row: 2;
            min-height: 120px;
        }

        /* Part 04 */
        .part-04 {
            grid-column: 1;
            grid-row: 3;
            min-height: 120px;
        }

        /* Part 08 */
        .part-08 {
            grid-column: 3;
            grid-row: 4;
            min-height: 120px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr 1fr;
            }
            .part-01 { grid-column: 1; grid-row: 1 / span 2; }
            .part-02 { grid-column: 2; grid-row: 1; }
            .part-03 { grid-column: 2; grid-row: 2; }
            .part-05 { grid-column: 1 / span 2; grid-row: 3; }
            .part-06 { grid-column: 1; grid-row: 4 / span 2; }
            .part-07 { grid-column: 2; grid-row: 4; }
            .part-04 { grid-column: 1; grid-row: 6; }
            .part-08 { grid-column: 2; grid-row: 6; }
            
            h1, h2 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TikTok运营</h1>
            <h2>48个必备工具</h2>
            <div class="author-tag">@ 徐徐教你做TikTok</div>
        </header>

        <div class="grid-layout">
            <!-- Part 01 -->
            <div class="card part-01">
                <div class="card-title">Part 01</div>
                <div class="card-content">7个TK<br>数据平台</div>
            </div>

            <!-- Part 02 -->
            <div class="card part-02">
                <div class="card-title">Part 02</div>
                <div class="card-content">3个好用<br>选品网站</div>
            </div>

            <!-- Part 03 -->
            <div class="card part-03">
                <div class="card-title">Part 03</div>
                <div class="card-content">5个视频<br>素材网站</div>
            </div>

            <!-- Part 05 -->
            <div class="card part-05">
                <div class="card-title">Part 05</div>
                <div class="card-content">4个剪辑<br>4个翻译软件</div>
            </div>

            <!-- Part 06 -->
            <div class="card part-06">
                <div class="card-title">Part 06</div>
                <div class="card-content">8个TK<br>传输管理<br>网站</div>
            </div>

            <!-- Part 07 -->
            <div class="card part-07">
                <div class="card-title">Part 07</div>
                <div class="card-content">5个BGM<br>网站</div>
            </div>

            <!-- Part 04 -->
            <div class="card part-04">
                <div class="card-title">Part 04</div>
                <div class="card-content">6个TK数据分析网站</div>
            </div>

            <!-- Part 08 -->
            <div class="card part-08">
                <div class="card-title">Part 08</div>
                <div class="card-content">7个投放<br>联盟网站</div>
            </div>
        </div>
    </div>

</body>
</html>
