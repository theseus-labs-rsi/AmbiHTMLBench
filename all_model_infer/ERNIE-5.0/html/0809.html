<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祥除帖 昨表帖</title>
    <style>
        body {
            background-color: #f4f1ea; /* Paper-like background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", serif;
        }

        .scroll-container {
            background-color: #f9f6ef;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: row; /* Columns go left to right visually, but text flows top to bottom */
            align-items: flex-start;
            max-width: 900px;
            position: relative;
        }

        .column {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 24px;
            line-height: 1.8;
            letter-spacing: 2px;
            color: #2c2c2c;
            margin-right: 15px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .column:last-child {
            margin-right: 0;
        }

        /* Specific column adjustments based on visual density */
        .col-main-1 { font-size: 26px; }
        .col-main-2 { font-size: 26px; }
        .col-main-3 { font-size: 26px; }
        .col-main-4 { font-size: 26px; }
        .col-main-5 { font-size: 26px; }
        .col-main-6 { font-size: 26px; }
        
        .col-signature {
            font-size: 20px;
            margin-top: 20px; /* Push down slightly */
            writing-mode: vertical-rl;
        }

        .header-labels {
            position: absolute;
            top: 20px;
            right: 20px;
            writing-mode: vertical-rl;
            font-size: 16px;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .seal-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .seal {
            width: 40px;
            height: 40px;
            background-color: #d93025;
            border: 2px solid #b02015;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            writing-mode: horizontal-tb; /* Seals are usually read horizontally or vertically depending on style, here simulating the block */
            transform: rotate(0deg);
        }
        
        /* Simulating the seal script characters roughly */
        .seal::after {
            content: "印"; 
            font-family: serif;
        }

        /* Responsive adjustment */
        @media (max-width: 768px) {
            .scroll-container {
                flex-direction: column;
                align-items: center;
            }
            .column {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
                margin-right: 0;
                margin-bottom: 20px;
                width: 100%;
                text-align: center;
            }
            .header-labels {
                position: static;
                flex-direction: row;
                margin-bottom: 20px;
                justify-content: center;
            }
            .seal-container {
                position: static;
                flex-direction: row;
                margin-top: 20px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <!-- Header Labels (Top Right in original) -->
        <div class="header-labels">
            <span>祥除帖</span>
            <span>昨表帖</span>
        </div>

        <!-- Main Text Columns (Right to Left) -->
        <div class="column col-main-1">
            臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時歲寒奉被
        </div>

        <div class="column col-main-2">
            手詔伏承聖體御膳勝常以慰下情臣故患匈滿氣上頓之勿勿慈
        </div>

        <div class="column col-main-3">
            恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首
        </div>

        <div class="column col-main-4">
            頓首死罪死罪 臣廙言昨表不宣奉賜手詔伏承聖體勝常以
        </div>

        <div class="column col-main-5">
            慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟衰亡
        </div>

        <div class="column col-main-6">
            愍存益勞聖心謹附承動靜臣廙言
        </div>

        <!-- Signature Column (Far Left) -->
        <div class="column col-signature">
            歲在癸卯春耀陽書於未央雲舍
        </div>

        <!-- Seals (Bottom Left) -->
        <div class="seal-container">
            <div class="seal"></div>
            <div class="seal"></div>
        </div>
    </div>

</body>
</html>
