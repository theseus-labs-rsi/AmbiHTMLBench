<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写笔记</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: 'Ma Shan Zheng', cursive, sans-serif;
        }

        .notebook-page {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            min-height: 1000px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            padding: 40px 60px;
            box-sizing: border-box;
            /* Creating the lined paper effect */
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 36px; /* Approximate line height */
            line-height: 36px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #555;
        }

        .days {
            display: flex;
            gap: 5px;
        }

        .day-box {
            border: 1px solid #ccc;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 2px;
        }

        .date-section {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .content {
            font-size: 24px;
            color: #222;
            text-align: left;
        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            margin: 0;
            margin-bottom: 5px; /* Slight spacing between lines of text */
        }
        
        /* Adjusting specific spacing to match the handwritten flow */
        .spacer-lg {
            height: 10px;
        }
        
        .spacer-md {
            height: 5px;
        }

        .quote {
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="notebook-page">
        <!-- Header -->
        <div class="header">
            <div class="days">
                <div class="day-box">Tu</div>
                <div class="day-box">We</div>
                <div class="day-box">Th</div>
                <div class="day-box">Fr</div>
                <div class="day-box">Sa</div>
                <div class="day-box">Su</div>
            </div>
            <div class="date-section">
                <span>Date.</span>
                <span>/</span>
                <span>/</span>
                <span>/</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="title">这是好的开始</div>
            
            <div class="spacer-lg"></div>

            <p>从你看到这篇文章开始</p>
            <p>你会越来越有钱</p>
            <p>越来越好看</p>
            <p>生活和心态也会越来越好</p>
            
            <div class="spacer-md"></div>

            <p>请相信大数据</p>
            <p>是你自己把一切美好的东西</p>
            <p>都吸引了过来</p>
            <p>你已经调到了接收钱的频率</p>
            <p>接收美的频率</p>
            <p>你的能量频率对了才接收到这</p>
            <p>条信息</p>

            <div class="spacer-md"></div>

            <p>留下一句“全收到”</p>
            <p>愿所有的愿望全能实现！</p>
        </div>
    </div>

</body>
</html>
