<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Text Extraction</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            color: #333333;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            font-size: 17px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        p {
            margin-bottom: 30px;
            text-align: left;
        }

        .highlight {
            color: #6a9c9c;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #6a9c9c;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .separator {
            margin: 0 8px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>
            1、你开始炫耀自己，往往都是灾难的开始。就像老子在《道德经》里写到：“<span class="highlight">光而不耀，静水流深</span>。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
        </p>

        <p>
            2、一个冷知识：<span class="highlight">屏蔽力是一个人最顶级的能力</span>，任何消耗你的人和事，多看一眼都是你的不对。
        </p>

        <p>
            3、大学时辅导员说了一句受益一生的话：“<span class="highlight">你不用变得很外向，内向挺好的，但需要你发言的时候，一定要勇敢。</span>”正所谓：君子可内敛不可懦弱，面不公可起而论之。
        </p>

        <div class="footer">
            商业思维 <span class="separator">|</span> 底层逻辑 <span class="separator">|</span> 个人提升
        </div>
    </div>

</body>
