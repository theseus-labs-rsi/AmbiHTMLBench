<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Layout</title>
    <style>
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            display: flex;
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        /* Left Sidebar / Vertical Title Area */
        .sidebar {
            width: 140px;
            flex-shrink: 0;
            margin-right: 20px;
            border: 3px solid #000;
            padding: 10px 5px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: fit-content;
            min-height: 400px;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.8;
            text-align: justify;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            font-size: 16px;
            text-align: justify;
        }

        .intro-text {
            margin-bottom: 20px;
            text-indent: 2em;
        }

        .source-text {
            font-weight: bold;
            margin-bottom: 15px;
            text-indent: 0;
        }

        .prescription-block {
            background-color: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #ccc;
            margin-top: 20px;
        }

        .prescription-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        p {
            margin-bottom: 15px;
            text-indent: 2em;
        }
        
        /* Utility to remove indent for specific lines if needed, though standard paragraph indent is used above */
        .no-indent {
            text-indent: 0;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Left Vertical Sidebar -->
    <div class="sidebar">
        <div class="vertical-text">国朝妻管严疑有私生子</div>
        <div class="vertical-text">福国王夫人震怒欲逐之</div>
    </div>

    <!-- Right Main Content -->
    <div class="main-content">
        <p class="intro-text">
            瞳孔地震！将王安石抬进孔庙的好女婿蔡卞近日疑似陷入私生子风波。蔡卞妻福国夫人王氏闻之震怒，欲除妾生子，因故生病。
        </p>

        <p class="source-text no-indent">
            本消息来自翰林医官院药方笔录：
        </p>

        <div class="prescription-block">
            <span class="prescription-title">《香术散》：</span>
            治妊娠五个月已后。常胸腹间气刺满痛，或肠鸣，以至呕逆减食。此由喜怒忧虑过度、饮食失节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病。医官王师复处此方三服而愈，后用果验。
        </div>
    </div>
</div>

</body>
</html>
