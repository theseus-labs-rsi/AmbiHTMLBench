<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句摘抄</title>
    <style>
        body {
            background-color: #f4f1ea;
            font-family: "Songti SC", "SimSun", serif;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f4f1ea; /* Matches body to simulate paper */
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 60px;
            border-bottom: 1px solid transparent; /* Placeholder for spacing */
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-main {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 3.5rem;
            color: #c92a2a;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-family: "Arial", sans-serif;
            font-size: 0.75rem;
            color: #c92a2a;
            letter-spacing: 4px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .header-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .meta-item {
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 3px solid #333;
            padding-bottom: 2px;
            display: inline-block;
            min-width: 200px;
        }
        
        .meta-item.small {
            font-size: 1.2rem;
        }

        /* Content Sections */
        .content-section {
            margin-bottom: 60px;
        }

        .main-quote {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #222;
        }

        .example-label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
            font-family: "Heiti SC", sans-serif;
        }

        .example-text {
            font-size: 1rem;
            color: #444;
            text-align: justify;
            line-height: 1.8;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .logo-area {
                align-items: center;
                margin-bottom: 30px;
            }
            .header-meta {
                align-items: center;
            }
            .meta-item {
                border-bottom: 2px solid #333;
            }
            .main-quote {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <div class="logo-main">人民日报</div>
                <div class="logo-sub">RENMIN RIBAO</div>
            </div>
            <div class="header-meta">
                <div class="meta-item">金句 | 摘抄</div>
                <div class="meta-item small">坚持奋斗主题</div>
            </div>
        </header>

        <main>
            <!-- Section 1 -->
            <section class="content-section">
                <div class="main-quote">
                    夜色难免黑凉<br>
                    前行必有曙光
                </div>
                <div class="example-label">举例:</div>
                <div class="example-text">
                    夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功！
                </div>
            </section>

            <!-- Section 2 -->
            <section class="content-section">
                <div class="main-quote">
                    道固远，笃行可至<br>
                    事虽巨，坚为必成
                </div>
                <div class="example-label">举例:</div>
                <div class="example-text">
                    道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
                </div>
            </section>
        </main>
    </div>

</body>
</html>
