<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语C术语解释</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #fff;
        }

        .term-block {
            margin-bottom: 20px;
        }

        .term {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            display: block;
        }

        .definition {
            margin-left: 0;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="term-block">
        <span class="term">审核：</span>
        <div class="definition">指进入语c群时，被群主审看人设、皮气等行为。</div>
    </div>

    <div class="term-block">
        <span class="term">新人：</span>
        <div class="definition">指初入某个圈子的人。</div>
    </div>

    <div class="term-block">
        <span class="term">纯白：</span>
        <div class="definition">完全不了解语c的人或刚接触语c。</div>
    </div>

    <div class="term-block">
        <span class="term">小白：</span>
        <div class="definition">指出入语c圈或对语c一无所知的人。</div>
    </div>

    <div class="term-block">
        <span class="term">小窗：</span>
        <div class="definition">指聊天会话的窗口（与QQ的私聊差不多）</div>
    </div>

    <div class="term-block">
        <span class="term">隔壁：</span>
        <div class="definition">指代另一个地方（隔壁群，隔壁平台）</div>
    </div>

    <div class="term-block">
        <span class="term">首页：</span>
        <div class="definition">在语c平台中，上皮发言互动的地方。</div>
    </div>

    <div class="term-block">
        <span class="term">水区：</span>
        <div class="definition">在语c平台中，皮下发言探讨问题或闲聊的地方。</div>
    </div>

    <div class="term-block">
        <span class="term">扩列：</span>
        <div class="definition">扩充列表，即加好友的意思。</div>
    </div>

    <div class="term-block">
        <span class="term">掌控：</span>
        <div class="definition">指开戏文字超过七百一段的人。</div>
    </div>

    <div class="term-block">
        <span class="term">字控：</span>
        <div class="definition">夸张手法，指一次开几个字为一段的人。</div>
    </div>

    <div class="term-block">
        <span class="term">句控：</span>
        <div class="definition">指开戏只开一行～三行为一段的人。</div>
    </div>

</body>
</html>
