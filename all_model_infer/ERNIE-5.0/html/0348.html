<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部交易抵销 第3步：调整所得税</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f9f7f1; /* Light beige background */
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        .slide-container {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            min-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .paw-print {
            position: absolute;
            top: -20px;
            font-size: 24px;
            color: #d4a373;
        }
        .paw-left { left: 20%; }
        .paw-right { right: 20%; }

        h1 {
            color: #8b5a2b;
            font-size: 32px;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }

        h2 {
            color: #8b5a2b;
            font-size: 28px;
            margin: 5px 0 30px 0;
            font-weight: bold;
        }

        /* Condition Pill */
        .condition-pill {
            background-color: #fae5d3;
            color: #8b5a2b;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 30px;
            align-self: flex-start;
            margin-left: 20px;
        }

        /* Main Content Layout */
        .content-wrapper {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: flex-start;
            flex-grow: 1;
        }

        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .right-column {
            width: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 300px; /* Approximate height to span the gap */
        }

        /* Data Blocks */
        .data-block {
            margin-bottom: 20px;
        }

        .block-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #555;
        }

        .value-group {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .value-text {
            width: 100px;
            font-size: 15px;
        }

        .bracket-container {
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .curly-brace {
            border-left: 2px solid #333;
            height: 40px;
            margin-right: 10px;
            position: relative;
        }
        
        /* Simulating the brace shape with CSS borders is complex, using a simple line for fidelity to the visual block */
        .curly-brace::before, .curly-brace::after {
            content: '';
            position: absolute;
            left: -2px;
            width: 6px;
            height: 2px;
            background: #333;
        }
        .curly-brace::before { top: 0; }
        .curly-brace::after { bottom: 0; }

        .calculation {
            font-size: 15px;
            color: #333;
        }

        /* Arrow and Adjustment */
        .blue-arrow {
            width: 4px;
            height: 150px;
            background-color: #3498db;
            position: relative;
            margin-bottom: 10px;
        }
        .blue-arrow::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -6px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #3498db;
        }

        .adjustment-text {
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            color: #333;
        }

        /* Footer Accounting Entry */
        .footer-entry {
            margin-top: 40px;
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
            width: 100%;
            padding-left: 20px;
        }

        .footer-entry span {
            display: block;
        }
        
        .indent {
            margin-left: 40px;
        }

        /* Decorations */
        .cat-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 100px;
            background-color: #eee; /* Placeholder for cat image */
            border-radius: 50% 50% 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            overflow: hidden;
        }
        
        .cat-right {
            position: absolute;
            bottom: 10px;
            right: 30px;
            width: 120px;
            height: 140px;
            background-color: #eee; /* Placeholder for cat image */
            border-radius: 50% 50% 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            overflow: hidden;
        }

        /* SVG Icons for paw prints to avoid external dependencies */
        .paw-svg {
            width: 30px;
            height: 30px;
            fill: #d4a373;
        }

    </style>
</head>

            <h1>内部交易抵销</h1>
            <h2>第③步：调整所得税</h2>
        </div>

        <!-- Condition -->
        <div class="condition-pill">
            若实现 60% 对外销售
        </div>

        <!-- Main Content -->
        <div class="content-wrapper">
            <div class="left-column">
                <!-- Individual Report Block -->
                <div class="data-block">
                    <div class="block-title">个别报表层面因为存货跌价准备：</div>
                    <div class="value-group">
                        <span class="value-text">账面价值 900</span>
                        <div class="bracket-container">
                            <div class="curly-brace"></div>
                            <span class="calculation">递延所得税资产300*25%=75</span>
                        </div>
                    </div>
                    <div class="value-group">
                        <span class="value-text">计税基础 1200</span>
                    </div>
                </div>

                <!-- Consolidated Report Block -->
                <div class="data-block">
                    <div class="block-title">合并报表层面因为存货跌价准备：</div>
                    <div class="value-group">
                        <span class="value-text">账面价值800</span>
                        <div class="bracket-container">
                            <div class="curly-brace"></div>
                            <span class="calculation">递延所得税资产400*25%=100</span>
                        </div>
                    </div>
                    <div class="value-group">
                        <span class="value-text">计税基础 1200</span>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="blue-arrow"></div>
                <div class="adjustment-text">
                    【集团角度】<br>调增25
                </div>
            </div>
        </div>

        <!-- Footer Entry -->
        <div class="footer-entry">
            <span>会计处理：借：递延所得税资产25</span>
            <span class="indent">贷：所得税费用25</span>
        </div>

        <!-- Decorations -->
        <div class="cat-left">
            [Image: Sleeping Cat]
        </div>
        <div class="cat-right">
            [Image: Cat with Hat]
        </div>

    </div>
