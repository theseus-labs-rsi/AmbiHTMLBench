<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班队会记录</title>
    <style>
        body {
            font-family: "KaiTi", "楷体", serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        td, th {
            border: 1px solid black;
            padding: 8px;
            vertical-align: top;
        }
        .label {
            width: 15%;
            font-weight: bold;
        }
        .content {
            width: 35%;
        }
        .process {
            width: 50%;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
        }
        .signature {
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>班队会记录</h1>
        <table>
            <tr>
                <td class="label">时间</td>
                <td class="content">2023.5.22</td>
                <td class="label">班级（中队）</td>
                <td class="content" colspan="3">五(3)中队</td>
            </tr>
            <tr>
                <td class="label">主题</td>
                <td class="content" colspan="5">争做良好习惯的小标兵</td>
            </tr>
            <tr>
                <td class="label">目的要求</td>
                <td class="content" colspan="5">教育归根结底是培养习惯，养成习惯，习惯是行为的自动化，习惯一旦养成，就会成为支配人生的一种力量。通过本次班队会，就是要培养同学们的良好习惯。</td>
            </tr>
            <tr>
                <td class="label">过程</td>
                <td class="process" colspan="5">
                    一、观看事例<br>
                    故事告诉我们的道理：世界上最可怕的力量是习惯，世界上最宝贵的财富也是习惯。<br>
                    二、小品《发生在我们身边的事》<br>
                    三、怎样告别坏习惯<br>
                    四、分享好习惯<br>
                    五、养成好习惯
                </td>
            </tr>
            <tr>
                <td class="label">效果</td>
                <td class="content" colspan="5">今天的班队会开得很成功，相信大家也受到了很大的教育和促动，我相信我们的后校会更加美好。</td>
            </tr>
            <tr>
                <td class="label">备注</td>
                <td class="content" colspan="5">争做良好习惯</td>
            </tr>
        </table>
        <div class="footer">
            - 46 -
        </div>
    </div>
