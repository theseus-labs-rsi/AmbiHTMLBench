<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业长图设计分享</title>
    <style>
        :root {
            --bg-color: #d4fc38;
            --text-color: #000;
            --header-bg: #000;
            --accent-purple: #6a4c9c;
            --accent-red: #e63946;
            --accent-blue: #457b9d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .arrow {
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Main Layout */
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Left Column Specifics */
        .left-top-text {
            font-size: 0.9rem;
            text-align: center;
            border: 2px solid #000;
            padding: 10px;
            background: rgba(255,255,255,0.3);
        }

        .pk-graphic-area {
            position: relative;
            height: 400px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Simulating the graphic elements with CSS */
        .fist-left {
            position: absolute;
            top: 50px;
            left: 20px;
            width: 80px;
            height: 80px;
            background-color: var(--accent-purple);
            border-radius: 50%;
            border: 4px solid #000;
        }
        
        .fist-right {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 80px;
            height: 80px;
            background-color: var(--accent-red);
            border-radius: 50%;
            border: 4px solid #000;
        }

        .pk-text-main {
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent-blue);
            text-shadow: 4px 4px 0px #000;
            z-index: 2;
            margin: 40px 0;
            letter-spacing: 5px;
        }

        .pk-sub-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            z-index: 2;
            background: #fff;
            padding: 5px 15px;
            border: 2px solid #000;
        }

        .tian-du-lei-tai {
            position: absolute;
            bottom: 20px;
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            z-index: 2;
        }

        .rules-box {
            background: #fff;
            border: 3px solid #000;
            padding: 15px;
            font-size: 0.9rem;
        }

        .rules-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 2px dashed #000;
            padding-bottom: 5px;
        }

        .rules-content p {
            margin-bottom: 5px;
        }

        .highlight-box {
            background: #ffeb3b;
            border: 2px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Right Column Specifics */
        .rings-graphic {
            height: 250px;
            background: linear-gradient(to bottom, #a8c0ff, #3f2b96);
            border: 2px solid #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .ring-shape {
            width: 150px;
            height: 150px;
            border: 15px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: absolute;
        }
        
        .ring-1 { transform: rotate(-45deg); }
        .ring-2 { transform: rotate(45deg); }

        .ring-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px #000;
        }

        .big-competition-text {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.2;
            padding: 20px 0;
            border-bottom: 4px dashed #000;
        }

        .bottom-text-block {
            font-size: 1rem;
            line-height: 1.6;
        }

        .highlight-tag {
            background: #fff;
            border: 2px solid #000;
            padding: 2px 8px;
            font-weight: bold;
            display: inline-block;
            margin: 5px 0;
        }

        /* Utility */
        .bold { font-weight: bold; }
        .center { text-align: center; }
        .mt-2 { margin-top: 10px; }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>商业长图</div>
        <div class="header-center">
            <span class="arrow">←</span>
            <span>DESIGN</span>
            <span class="arrow">→</span>
        </div>
        <div>设计分享</div>
    </header>

    <div class="container">
        <!-- Left Column -->
        <div class="column">
            <div class="left-top-text">
                <div class="bold">两大征稿专栏</div>
                <div>将在本期</div>
                <div>与大家做个正式的告别</div>
            </div>

            <div class="pk-graphic-area">
                <div class="fist-left"></div>
                <div class="fist-right"></div>
                
                <div style="text-align: center; z-index: 2; margin-bottom: 20px;">
                    <div style="font-size: 1.2rem; font-weight: bold; background: #fff; display: inline-block; padding: 5px 10px; border: 2px solid #000;">江湖从不缺传奇</div>
                    <div style="font-size: 1.5rem; font-weight: bold; margin: 10px 0; background: #fff; display: inline-block; padding: 5px 15px; border: 2px solid #000;">这一次</div>
                    <div style="font-size: 1.2rem; font-weight: bold;">TA燃情出炉，战力拉满</div>
                </div>

                <div class="pk-text-main">PK</div>

                <div class="tian-du-lei-tai">
                    天都擂台 <span style="font-size: 1.5rem; color: #ffeb3b;">专栏今日上线</span>
                </div>
            </div>

            <div class="rules-box">
                <div class="rules-header">正反两派 互相PK</div>
                <div class="rules-content">
                    <p>征稿玩法大升级，狂掀对垒浪潮</p>
                    <p class="bold">注意！注意！注意！</p>
                    <p>入选参赛的投稿者都将收获礼品一份</p>
                    
                    <div class="highlight-box">
                        <div>胜者一方</div>
                        <div>但！</div>
                        <div>将抢走更加超值的奖励</div>
                        <div>!!!!!</div>
                        <div style="margin-top: 10px; font-style: italic;">具体怎么参与？</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="column">
            <div class="rings-graphic">
                <div class="ring-shape ring-1"></div>
                <div class="ring-shape ring-2"></div>
                <div class="ring-text" style="top: 20px; left: 20px; transform: rotate(-10deg);">重磅升级</div>
                <div class="ring-text" style="top: 20px; right: 20px; transform: rotate(10deg);">开启新赛事</div>
                <div class="ring-text" style="bottom: 40px; left: 50%; transform: translateX(-50%);">重磅升级02</div>
                <div class="ring-text" style="top: 50%; left: 10px; transform: translateY(-50%) rotate(-90deg);">SO</div>
                <div class="ring-text" style="top: 50%; right: 10px; transform: translateY(-50%) rotate(90deg);">SO</div>
            </div>

            <div class="big-competition-text">
                擂台大比拼<br>
                一切“我”掌控
            </div>

            <div class="bottom-text-block">
                <p>公众号每期的<span class="highlight-tag">【次条福利文】</span></p>
                <p>都向家人们抛出了各种</p>
                <p class="bold" style="font-size: 1.2rem;">热议的话题</p>
                <p>送出了一轮又一轮的奖励</p>
                <p>而“侃侃而谈”和“开店风云”</p>
                <p class="mt-2">将在本期</p>
                <div style="border: 2px solid #000; padding: 10px; background: rgba(255,255,255,0.5); margin-top: 10px;">
                    <div class="bold">两大征稿专栏</div>
                    <div>与大家做个正式的告别</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
