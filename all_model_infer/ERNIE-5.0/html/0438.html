<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Transcription</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "SimSun", "Songti SC", serif;
        }

        .paper {
            background-color: #fff;
            width: 800px;
            min-height: 600px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            transform: rotate(-2deg);
        }

        .printed-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 24px;
            font-weight: bold;
            margin-right: 10px;
            display: inline-block;
        }

        .handwritten-text {
            font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", "Microsoft YaHei", serif;
            font-size: 22px;
            line-height: 1.8;
            color: #222;
            margin-top: 30px;
            text-align: justify;
        }

        .handwritten-line {
            display: block;
            margin-bottom: 5px;
        }
        
        /* Simulating the specific layout of the handwriting */
        .hw-block {
            margin-left: 20px;
        }

    </style>
</head>
<body>

    <div class="paper">
        <div class="printed-text">
            <span class="question-number">26</span>你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>
            <span style="margin-left: 40px; display:block; margin-top: 5px;">她看到了什么呢？</span>
        </div>

        <div class="handwritten-text">
            <span class="hw-block">我蹲下来，“这根肋骨让你感到不舒服吗？”</span>
            <span class="hw-block">展览台上是一尊白玉莹莹的肋骨，下面的文字介绍引用了夏娃的来历，说女人都是由肋骨所化。</span>
        </div>
    </div>

</body>
</html>
