<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早发白帝城 - 李白</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "KaiTi", "STKaiti", "Serif", serif;
            background-color: #4a628a; /* Approximate blue background */
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .poem-container {
            display: flex;
            gap: 60px; /* Space between columns */
            align-items: flex-start;
        }

        .column {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Space between lines within a column */
        }

        .author-col {
            font-size: 14px;
            letter-spacing: 4px;
            margin-right: 20px;
            opacity: 0.8;
        }

        .poem-text {
            font-size: 32px;
            line-height: 1.8;
            letter-spacing: 2px;
            text-align: justify;
        }

        .footer {
            background-color: #f2e8d5; /* Beige footer background */
            color: #333;
            padding: 15px 20px;
            text-align: center;
            font-size: 14px;
            writing-mode: horizontal-tb;
            font-family: "Heiti SC", "Microsoft YaHei", sans-serif;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }

        /* Specific adjustments for punctuation in vertical text */
        .punctuation {
            writing-mode: horizontal-tb;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="poem-container">
            <!-- Leftmost column: Author and Title -->
            <div class="column author-col">
                <span>唐</span>
                <span>李白</span>
                <span>早发白帝城</span>
            </div>

            <!-- Middle column: Last two lines -->
            <div class="column poem-text">
                <div>兩岸猿聲啼不住，</div>
                <div>輕舟已過萬重山。</div>
            </div>

            <!-- Rightmost column: First two lines -->
            <div class="column poem-text">
                <div>朝辭白帝彩雲間</div>
                <div>千里江陵一日還</div>
            </div>
        </div>
    </div>

    <div class="footer">
        两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。
    </div>

</body>
</html>
