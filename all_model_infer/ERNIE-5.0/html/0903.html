<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍 - Self Introduction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #f1f8e9 50%, #fff3e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            backdrop-filter: blur(5px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-title {
            font-size: 36px;
            color: #ff9800;
            font-weight: bold;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .content-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .left-info {
            width: 20%;
            font-size: 14px;
            color: #333;
            line-height: 1.8;
        }

        .label {
            color: #ff5722;
            font-weight: bold;
            margin-right: 5px;
        }

        .center-goals {
            width: 45%;
            background-color: #fff9c4;
            border-radius: 50% 20% 50% 20%;
            padding: 20px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .goals-title {
            color: #f57c00;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
        }

        .goals-list {
            text-align: left;
            font-size: 13px;
            color: #444;
            line-height: 1.6;
            margin: 0;
            padding-left: 10px;
        }

        .right-photo {
            width: 15%;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            position: relative;
            top: -10px;
        }

        .right-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-section {
            font-size: 14px;
            color: #333;
            line-height: 1.8;
            text-align: justify;
            border-top: 1px dashed #ccc;
            padding-top: 20px;
        }

        /* Decorative bubbles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            z-index: -1;
        }
        .b1 { width: 60px; height: 60px; top: 100px; left: 100px; }
        .b2 { width: 40px; height: 40px; top: 200px; right: 150px; }
        .b3 { width: 80px; height: 80px; bottom: 50px; left: 50px; }

    </style>
</head>
<body>

    <div class="container">
        <!-- Decorative Background Elements -->
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>

        <div class="header">
            <h1 class="main-title">自我介绍</h1>
            <div class="sub-title">SELF INTRODUCTION</div>
        </div>

        <div class="content-wrapper">
            <!-- Left Column: Personal Info -->
            <div class="left-info">
                <div><span class="label">姓名：</span>咸鱼</div>
                <div><span class="label">年龄：</span>20</div>
                <div><span class="label">爱好：</span>看电影、打游戏</div>
            </div>

            <!-- Center Column: Work Goals (Cloud Shape) -->
            <div class="center-goals">
                <span class="goals-title">工作目标：</span>
                <ol class="goals-list">
                    <li>学习好专业知识，同时广泛涉及其他专业知识。</li>
                    <li>尽量多争取一些等级证书，这不仅是能力的证明，也是就业的有力武器。</li>
                </ol>
            </div>

            <!-- Right Column: Photo -->
            <div class="right-photo">
                <!-- Using a placeholder image that resembles the description -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Profile Picture">
            </div>
        </div>

        <!-- Bottom Section: Bio Text -->
        <div class="bio-section">
            大家好，我叫咸鱼，来自山东青岛。<br>
            本人性格沉稳、细致、观体、发挥所长。在工作上，细致入微，认真负责，具有很好的团队合作精神，注重团体的利益，集体意识强。能够与人充分合作，充分听取他人的意见和建议，并不断进步。观察力强、上进心强而且为人随和，易于沟通，能够快速地融入工作群团队及成员给出良好的意见。
        </div>
    </div>

</body>
</html>
