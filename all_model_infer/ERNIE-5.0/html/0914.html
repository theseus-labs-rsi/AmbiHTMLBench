        .toc-list {
            list-style: none;
            padding: 0;

            padding: 15px 0;

            background-color: #fafafa;

        }

            font-weight: bold;
            color: #333;

            margin-bottom: 4px;
        }

        .chapter-subtitle {

            color: #666;
            display: block;
            padding-left: 10px; /* Indentation relative to title roughly */
        }
        
        /* Adjusting subtitle alignment to match image exactly */
        .chapter-subtitle-wrapper {
             display: flex;
        }
        .chapter-subtitle {
            padding-left: 0;
            margin-left: 10px; /* Offset for the dash visually */
        }

        .page-number {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            min-width: 40px;
            text-align: right;
        }
