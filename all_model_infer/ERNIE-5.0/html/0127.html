<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句合集</title>
    <style>
        body {
            background-color: #f4ebd9; /* Approximate paper texture color */
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjRlYmQ5Ii8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNlNmQ1YjgiLz4KPC9zdmc+'); /* Subtle noise texture */
            font-family: "Songti SC", "SimSun", "STSong", serif;
            margin: 0;
            padding: 40px 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.3); /* Slight overlay to make text pop */
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #333;
            padding-bottom: 20px;
            margin-bottom: 40px;
            position: relative;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 64px;
            color: #c91818; /* People's Daily Red */
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .logo-english {
            font-family: "Times New Roman", serif;
            font-size: 14px;
            letter-spacing: 4px;
            color: #333;
            text-transform: uppercase;
        }

        .header-title {
            text-align: right;
            font-family: "Heiti SC", "Microsoft YaHei", sans-serif;
        }

        .header-top {
            font-size: 18px;
            margin-bottom: 10px;
            color: #555;
        }

        .header-main {
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            display: inline-block;
        }

        /* Content Section */
        .content-item {
            margin-bottom: 40px;
        }

        .quote-number {
            font-size: 24px;
            font-weight: bold;
            margin-right: 10px;
        }

        .quote-text {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 15px;
            display: block;
        }

        .explanation-label {
            font-family: "Heiti SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            color: #666;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .explanation-text {
            font-family: "Heiti SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            color: #444;
            line-height: 1.6;
            text-align: justify;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .header-title {
                text-align: center;
                margin-top: 20px;
            }
            .logo-text {
                font-size: 48px;
            }
            .quote-text {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-section">
                <div class="logo-text">人民日报</div>
                <div class="logo-english">RENMIN RIBAO</div>
            </div>
            <div class="header-title">
                <div class="header-top">金句 | 素材 | 摘抄</div>
                <div class="header-main">金句合集系列</div>
            </div>
        </header>

        <main>
            <!-- Item 1 -->
            <article class="content-item">
                <div>
                    <span class="quote-number">1、</span>
                    <span class="quote-text">愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</span>
                </div>
                <span class="explanation-label">释义：</span>
                <p class="explanation-text">希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝与琐事而烦恼忧愁。</p>
            </article>

            <!-- Item 2 -->
            <article class="content-item">
                <div>
                    <span class="quote-number">2、</span>
                    <span class="quote-text">总有人间一两风，<br>填我十万八千梦。</span>
                </div>
                <span class="explanation-label">释义：</span>
                <p class="explanation-text">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。</p>
            </article>

            <!-- Item 3 -->
            <article class="content-item">
                <div>
                    <span class="quote-number">3、</span>
                    <span class="quote-text">日出有盼，日落有思，<br>平平安安，所遇皆甜。</span>
                </div>
                <span class="explanation-label">释义：</span>
                <p class="explanation-text">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。</p>
            </article>
        </main>
    </div>

</body>
</html>
