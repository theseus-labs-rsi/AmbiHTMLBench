<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何挑选性格好的猫咪</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Styles */
        h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .highlight-red {
            color: #d93025;
        }

        /* Checklist Section */
        .checklist-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .checklist-content {
            flex: 1;
            padding-right: 20px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .check-icon {
            color: #f39c12;
            font-size: 20px;
            margin-right: 10px;
            font-weight: bold;
        }

        .cartoon-cat {
            width: 150px;
            height: 150px;
            background-color: #fff0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px dashed #ffcccc;
        }
        
        .cartoon-cat img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sub-header */
        .sub-header {
            background-color: #fdd835;
            display: inline-block;
            padding: 5px 15px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        /* Grid Layout */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .cat-card {
            text-align: center;
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            transition: box-shadow 0.3s ease;
        }

        .cat-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .cat-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cat-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .cat-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .checklist-section {
                flex-direction: column;
            }
            .cartoon-cat {
                margin-top: 20px;
                align-self: center;
            }
            .cat-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .cat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>如何挑选<span class="highlight-red">性格好</span>的猫咪</h1>

    <div class="checklist-section">
        <div class="checklist-content">
            <div class="checklist-item">
                <span class="check-icon">☑</span> 伸手摸它，看会不会主动过来蹭
            </div>
            <div class="checklist-item">
                <span class="check-icon">☑</span> 抱一下猫咪，看会不会抗拒
            </div>
            <div class="checklist-item">
                <span class="check-icon">☑</span> 喂食物，会不会主动积极吃
            </div>
            <div class="checklist-item">
                <span class="check-icon">☑</span> 对猫咪喵喵叫，看会不会积极回应
            </div>
        </div>
        <div class="cartoon-cat">
            <!-- Placeholder for the cartoon cat image -->
            <img src="https://placehold.co/150x150/fff/333?text=Cartoon+Cat" alt="Cartoon Cat Illustration">
        </div>
    </div>

    <div class="sub-header">猫咪品种看性格</div>

    <div class="cat-grid">
        <!-- Card 1 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=Ragdoll" alt="布偶猫">
            </div>
            <div class="cat-name">布偶</div>
            <div class="cat-desc">性格温和，外表美丽<br>肠胃不太好</div>
        </div>

        <!-- Card 2 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=British+Shorthair" alt="英短猫">
            </div>
            <div class="cat-name">英短</div>
            <div class="cat-desc">体型圆胖、毛短而密<br>温柔平静、对人友善</div>
        </div>

        <!-- Card 3 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=American+Shorthair" alt="美短猫">
            </div>
            <div class="cat-name">美短</div>
            <div class="cat-desc">性格活泼好动<br>适应能力也比较强</div>
        </div>

        <!-- Card 4 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=Li+Hua" alt="狸花猫">
            </div>
            <div class="cat-name">狸花</div>
            <div class="cat-desc">身体素质好，聪明<br>好养活，寿命长</div>
        </div>

        <!-- Card 5 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=Siamese" alt="暹罗猫">
            </div>
            <div class="cat-name">暹罗</div>
            <div class="cat-desc">活泼好动，智商高<br>胆子比较大</div>
        </div>

        <!-- Card 6 -->
        <div class="cat-card">
            <div class="cat-image">
                <img src="https://placehold.co/150x150/eee/999?text=Munchkin" alt="曼基康猫">
            </div>
            <div class="cat-name">曼基康</div>
            <div class="cat-desc">活泼友善，性格好<br>小短腿底盘容易弄脏</div>
        </div>
    </div>
</div>

</body>
</html>
