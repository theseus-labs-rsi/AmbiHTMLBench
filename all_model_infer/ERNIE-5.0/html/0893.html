<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富人眼中的富人是咋样？</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Songti SC", "SimSun", "STSong", "AR PL New Sung", serif;
            background-color: #0b1a4a;
            /* Simulating the background image texture/gradient */
            background-image: linear-gradient(rgba(11, 26, 74, 0.9), rgba(11, 26, 74, 0.95)), url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.1"/></svg>');
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: normal;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 15px 20px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            text-align: center;
            font-weight: normal;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* Column widths approximation */
        th:nth-child(1), td:nth-child(1) {
            width: 55%;
        }
        th:nth-child(2), td:nth-child(2) {
            width: 45%;
            text-align: center;
        }

        .merged-row {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.03);
            font-size: 1rem;
            color: #e0e0e0;
        }

        .question-text {
            line-height: 1.6;
        }

        .answer-text {
            font-family: "Arial", sans-serif; /* Numbers often look better in sans-serif */
            font-weight: bold;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            th, td {
                padding: 10px;
                font-size: 0.9rem;
            }
            th:nth-child(1), td:nth-child(1) {
                width: 60%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>富人眼中的富人是咋样？</h1>
        
        <table>
            <thead>
                <tr>
                    <th>问题</th>
                    <th>回答</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="question-text">1.您觉得高净值人群资产拥有多少钱才算是？</td>
                    <td class="answer-text">1亿7,388.4万元</td>
                </tr>
                <tr>
                    <td colspan="2" class="merged-row">本次调研的平均家庭资产:2,265.8万元</td>
                </tr>
                <tr>
                    <td class="question-text">2.请问您每天工作小时数是？</td>
                    <td class="answer-text">8.2小时</td>
                </tr>
                <tr>
                    <td class="question-text">3.您预计退休年龄？</td>
                    <td class="answer-text">59岁</td>
                </tr>
                <tr>
                    <td class="question-text">4.您希望能活到多少岁？</td>
                    <td class="answer-text">88.2岁</td>
                </tr>
                <tr>
                    <td colspan="2" class="merged-row">小知识:2021年中国平均寿命:77.3岁</td>
                </tr>
                <tr>
                    <td class="question-text">5.请问您曾去过国家数量（包括商务出差）</td>
                    <td class="answer-text">6.2个国家</td>
                </tr>
                <tr>
                    <td class="question-text">6.请问您平均每月阅读书籍数量</td>
                    <td class="answer-text">2.4本书</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
