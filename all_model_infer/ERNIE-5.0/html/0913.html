<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞赛报名与考试说明</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background: linear-gradient(to bottom, #e6f7ff 0%, #ffffff 100%);
            margin: 0;
            padding: 40px 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            background-color: #1e88e5;
            color: white;
            display: inline-block;
            padding: 10px 25px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            border-radius: 2px;
        }

        .section {
            margin-bottom: 40px;
        }

        p {
            margin-bottom: 10px;
            font-size: 16px;
            text-align: justify;
        }

        .numbered-list {
            margin-top: 15px;
        }

        .numbered-item {
            margin-bottom: 15px;
        }

        .bottom-graphics {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 50px;
            padding: 0 20px;
        }

        .graphic-placeholder {
            border: 2px solid #b0bec5;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #78909c;
            font-weight: bold;
            position: relative;
        }

        /* Simulating the target graphic */
        .target-graphic {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid #546e7a;
            position: relative;
            background: radial-gradient(circle, transparent 40%, #cfd8dc 41%, #cfd8dc 45%, transparent 46%);
        }
        .target-graphic::before, .target-graphic::after {
            content: '';
            position: absolute;
            background: #546e7a;
        }
        .target-graphic::before {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        .target-graphic::after {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        .target-center {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ffcc80;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #ffa726;
        }

        /* Simulating the bar chart graphic */
        .chart-graphic {
            width: 250px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding-bottom: 10px;
            border: none;
            background: none;
        }
        .bar {
            width: 30px;
            background-color: #cfd8dc;
            border: 1px solid #546e7a;
            border-bottom: none;
        }
        .bar:nth-child(1) { height: 60%; }
        .bar:nth-child(2) { height: 80%; }
        .bar:nth-child(3) { height: 100%; }
        .bar:nth-child(4) { height: 70%; }
        .bar:nth-child(5) { height: 90%; }

    </style>
</head>
<body>

    <div class="container">
        <!-- Section 1 -->
        <div class="section">
            <h2>报名和考试</h2>
            <p>个人参赛，由所在中学进行统一报名；</p>
            <p>均为笔试考试，预赛为各省市自行组织、自主命题；</p>
            <p>剩余考试环节均为全国统一命题。</p>
        </div>

        <!-- Section 2 -->
        <div class="section">
            <h2>可以自学吗？</h2>
            <div class="numbered-list">
                <div class="numbered-item">
                    <p>1、高中课本内容可以自学，当然我们也有初高中基础知识课程，让你快速掌握竞赛考点。</p>
                </div>
                <div class="numbered-item">
                    <p>2、一些难的知识点和不知道如何规划学习进度的时候，最好选择报课，大部分学生在有人一起学的情况下会比较好。</p>
                    <p>有时候你以为自己自学学的挺好，但是很多竞赛技巧、思维是需要老师来指导的。时间和钱，不能兼得。</p>
                </div>
            </div>
        </div>

        <!-- Bottom Graphics -->
        <div class="bottom-graphics">
            <div class="graphic-placeholder target-graphic">
                <div class="target-center"></div>
                <!-- Caption simulation -->
                <div style="position:absolute; bottom: -30px; width: 100%; text-align: center; font-size: 12px; color: #999;">[Diagram: Target/Scope]</div>
            </div>
            
            <div class="graphic-placeholder chart-graphic">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <!-- Caption simulation -->
                <div style="position:absolute; bottom: -30px; width: 100%; text-align: center; font-size: 12px; color: #999;">[Chart: Bar Graph]</div>
            </div>
        </div>
    </div>

</body>
</html>
