<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用合理的标点符号</title>
    <style>
        :root {
            --bg-beige: #FFF9F5;
            --bg-blue: #F0F6FF;
            --highlight-yellow: #FFE600;
            --tag-pink: #FF9E9E;
            --text-dark: #333333;
            --text-gray: #666666;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #fff;
            color: var(--text-dark);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            position: relative;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
        }

        .highlight-box {
            background-color: var(--highlight-yellow);
            display: inline-block;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 5px;
            align-self: flex-start;
        }

        h1 {
            font-size: 42px;
            margin: 0;
            line-height: 1.2;
            font-weight: 900;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-dark);
            margin-top: 10px;
            font-weight: 500;
        }

        .number-badge {
            width: 60px;
            height: 60px;
            border: 2px solid #eee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            background: #fff;
        }

        /* Content Sections */
        .content-section {
            padding: 40px;
            border-radius: 8px;
            margin-bottom: 30px;
            position: relative;
            min-height: 250px;
        }

        .section-beige {
            background-color: var(--bg-beige);
        }

        .section-blue {
            background-color: var(--bg-blue);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }

        .icon-circle {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 10px;
            position: relative;
        }
        
        .icon-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
        }

        .icon-x {
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 10px;
            position: relative;
        }
        .icon-x::before, .icon-x::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 2px;
            background: #999;
        }
        .icon-x::before { transform: translate(-50%, -50%) rotate(45deg); }
        .icon-x::after { transform: translate(-50%, -50%) rotate(-45deg); }

        /* Text Content Styling */
        .info-row {
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.6;
        }

        .separator-pipe {
            margin: 0 10px;
            color: #999;
        }

        .styled-tag-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tag-row {
            display: flex;
            align-items: center;
        }

        .pink-tag {
            background-color: var(--tag-pink);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 10px;
            font-weight: bold;
        }

        .colon-row {
            margin-bottom: 10px;
            font-size: 16px;
        }

        /* Image Placeholders */
        .cat-placeholder {
            position: absolute;
            bottom: 20px;
            right: 40px;
            width: 100px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            text-align: center;
            border: 1px dashed #ccc;
        }
        
        .cat-placeholder-bottom {
             bottom: 10px;
             right: 60px;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .footer-logo {
            width: 40px;
            height: 40px;
            background-color: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 10px;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-title-group">
            <span class="highlight-box">使用合理的</span>
            <h1>标点符号</h1>
            <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>
        </div>
        <div class="number-badge">01</div>
    </header>

    <main>
        <!-- Section 1: Beige Background -->
        <section class="content-section section-beige">
            <div class="section-title">
                <span class="icon-circle"></span>
                使用直线或外框
            </div>

            <div class="info-row">
                地点 <span class="separator-pipe">|</span> 武汉国际会展中心
            </div>
            <div class="info-row">
                时间 <span class="separator-pipe">|</span> 2018 年 8 月 20 日
            </div>

            <div class="styled-tag-group">
                <div class="tag-row">
                    <span class="pink-tag">地点</span>
                    <span>武汉国际会展中心</span>
                </div>
                <div class="tag-row">
                    <span class="pink-tag">时间</span>
                    <span>2018 年 8 月 20 日</span>
                </div>
            </div>

            <div class="cat-placeholder">
                [Cartoon Cat Image]
            </div>
        </section>

        <!-- Section 2: Blue Background -->
        <section class="content-section section-blue">
            <div class="section-title">
                <span class="icon-x"></span>
                使用冒号
            </div>

            <div class="colon-row">
                地点：武汉国际会展中心
            </div>
            <div class="colon-row">
                时间：2018 年 8 月 20 日
            </div>

            <div class="cat-placeholder cat-placeholder-bottom">
                [Cartoon Cat Image]
            </div>
        </section>
    </main>

    <footer>
        <div>
            ADVERTISING CREATIVITY<br>
            2023.05
        </div>
        <div class="footer-logo">
            LOGO
        </div>
    </footer>

</body>
</html>
