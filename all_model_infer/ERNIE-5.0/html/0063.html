<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heath Ceramics Advertisement</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            background-color: white;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .image-wrapper {
            width: 100%;
            border: 2px solid black;
            margin-bottom: 15px;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .caption-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 30px;
            color: #333;
        }

        .main-headline {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin: 40px 0 60px 0;
            line-height: 1.2;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-top: 1px solid #ccc; /* Optional separator if needed, though not strictly in image */
            padding-top: 20px;
        }

        .info-left {
            width: 48%;
        }

        .info-right {
            width: 48%;
            text-align: right;
        }

        .company-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .address {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }

        .tagline {
            font-size: 16px;
            display: block;
        }

        .contact-info {
            font-size: 18px;
            line-height: 1.5;
        }

        .footer {
            text-align: right;
            font-family: "Times New Roman", Times, serif;
            font-size: 12px;
            margin-top: 20px;
            color: #555;
        }

        /* Utility for placeholder image since I cannot generate the actual image file */
        .placeholder-image {
            width: 100%;
            height: 600px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 20px;
            background-image: url('https://placehold.co/900x600/e0e0e0/555555?text=Transpacific+Building+Interior');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Image Section -->
        <div class="image-wrapper">
            <!-- Using a placeholder that mimics the visual content -->
            <div class="placeholder-image" title="Interior view of Transpacific Building atrium with hexagonal tile flooring"></div>
        </div>

        <!-- Top Caption Row -->
        <div class="caption-row">
            <span>Transpacific Building — Oakland, CA</span>
            <span>Wong & Tung International Architects</span>
        </div>

        <!-- Main Headline -->
        <div class="main-headline">
            "tile that humanizes"
        </div>

        <!-- Bottom Info Section -->
        <div class="info-section">
            <div class="info-left">
                <span class="company-name">Heath Ceramics</span>, <span class="address">Sausalito, CA 94965</span>
                <span class="tagline">(Custom-made by people—not automated)</span>
            </div>
            <div class="info-right">
                <div class="contact-info">
                    Phone (415) 332-3732<br>
                    Edith Heath<br>
                    Jon Brooder
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            September/October 1983 &nbsp; Architecture California &nbsp; 3
        </div>
    </div>

</body>
</html>
