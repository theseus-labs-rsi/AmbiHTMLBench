<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句合集</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --text-dark: #333333;
            --text-grey: #666666;
            --bg-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 30px 0;
            color: var(--primary-gold);
        }

        .header-left {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 500;
        }

        .back-icon {
            margin-right: 10px;
            font-size: 24px;
            cursor: pointer;
        }

        .header-icons {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: none;
            stroke: var(--primary-gold);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Content Section Styles */
        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .check-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
            line-height: 1.4;
        }

        .quote-text {
            font-size: 16px;
            color: var(--text-dark);
            text-align: justify;
            margin: 0;
            padding-left: 36px; /* Indent to align with text start after icon */
        }

        .attribution {
            display: block;
            margin-top: 10px;
            text-align: right;
            font-style: normal;
            color: var(--text-dark);
        }

        /* SVG Specifics */
        svg {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-left">
            <span class="back-icon">&lt;</span>
            <span>金句合集</span>
        </div>
        <div class="header-icons">
            <!-- User Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <!-- Share/Upload Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <!-- Chat Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>
    </header>

    <main>
        <!-- Section 1 -->
        <article class="section">
            <div class="section-header">
                <svg class="check-icon" viewBox="0 0 24 24" fill="#d4af37">
                    <circle cx="12" cy="12" r="12"></circle>
                    <path d="M9 12l2 2 4-4" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <h2 class="section-title">他写「成长」，正是你所亲历</h2>
            </div>
            <p class="quote-text">
                “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”
                <span class="attribution">——《病隙碎笔》</span>
            </p>
        </article>

        <!-- Section 2 -->
        <article class="section">
            <div class="section-header">
                <svg class="check-icon" viewBox="0 0 24 24" fill="#d4af37">
                    <circle cx="12" cy="12" r="12"></circle>
                    <path d="M9 12l2 2 4-4" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <h2 class="section-title">他写「磨难」，报之以歌</h2>
            </div>
            <p class="quote-text">
                “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”
                <span class="attribution">——《好运设计》</span>
            </p>
        </article>
    </main>
</div>

</body>
</html>
