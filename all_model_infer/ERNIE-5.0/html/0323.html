<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何避免/减少巴纳姆效应？</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #fcf6e6; /* Light cream background */
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            background-color: #fcf6e6;
            min-height: 100vh;
        }

        /* Top Right Tag */
        .tag {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #fdd835;
            color: #fff;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 18px;
            writing-mode: vertical-rl;
            border-bottom-left-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* Rainbow Graphic */
        .rainbow-container {
            width: 100%;
            height: 150px;
            position: relative;
            margin-top: 40px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .rainbow-arc {
            position: absolute;
            border-radius: 50%;
            border: 12px solid transparent;
            box-sizing: border-box;
        }

        .arc-1 { width: 600px; height: 300px; border-top-color: #ffccbc; border-right-color: #ffccbc; transform: rotate(-45deg); bottom: -50px; }
        .arc-2 { width: 550px; height: 275px; border-top-color: #ffe0b2; border-right-color: #ffe0b2; transform: rotate(-45deg); bottom: -35px; }
        .arc-3 { width: 500px; height: 250px; border-top-color: #fff9c4; border-right-color: #fff9c4; transform: rotate(-45deg); bottom: -20px; }
        .arc-4 { width: 450px; height: 225px; border-top-color: #c8e6c9; border-right-color: #c8e6c9; transform: rotate(-45deg); bottom: -5px; }
        .arc-5 { width: 400px; height: 200px; border-top-color: #b3e5fc; border-right-color: #b3e5fc; transform: rotate(-45deg); bottom: 10px; }
        .arc-6 { width: 350px; height: 175px; border-top-color: #e1bee7; border-right-color: #e1bee7; transform: rotate(-45deg); bottom: 25px; }

        /* Main Title */
        h1 {
            text-align: center;
            font-size: 28px;
            margin: 20px 0 40px 0;
            color: #2c3e50;
            position: relative;
            z-index: 10;
        }

        /* Content List */
        ol {
            padding-left: 20px;
        }

        li {
            margin-bottom: 25px;
            font-size: 16px;
            text-align: justify;
        }

        /* Highlighted Text */
        .highlight {
            background-color: #fff59d; /* Light yellow highlight */
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: 500;
        }

        /* Watermarks */
        .watermark {
            position: absolute;
            color: rgba(0,0,0,0.1);
            font-size: 14px;
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 1;
        }
        .w1 { top: 35%; left: 45%; }
        .w2 { bottom: 10%; right: 10%; }

    </style>
</head>
<body>

<div class="container">
    <!-- Top Right Tag -->
    <div class="tag">心理</div>

    <!-- Rainbow Graphic -->
    <div class="rainbow-container">
        <div class="rainbow-arc arc-1"></div>
        <div class="rainbow-arc arc-2"></div>
        <div class="rainbow-arc arc-3"></div>
        <div class="rainbow-arc arc-4"></div>
        <div class="rainbow-arc arc-5"></div>
        <div class="rainbow-arc arc-6"></div>
    </div>

    <!-- Main Title -->
    <h1>如何避免/减少巴纳姆效应？</h1>

    <!-- Watermarks -->
    <div class="watermark w1">@小颖</div>
    <div class="watermark w2">PPT by @小颖</div>

    <!-- Content -->
    <ol>
        <li>
            要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。
        </li>
        <li>
            我们的自我认知往往是主观的，我们需要保持<span class="highlight">谦虚和开放的心态</span>，不要过分自信或者自卑。我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。
        </li>
        <li>
            <span class="highlight">听取他人的评价</span>。全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。
        </li>
        <li>
            我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要学会<span class="highlight">辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。
        </li>
    </ol>
</div>

</body>
</html>
