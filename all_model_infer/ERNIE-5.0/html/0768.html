        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Section */
        header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            width: 100%;
            padding: 10px 0;
            box-sizing: border-box;
        }

        .top-bar {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background-color: #d4a056;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
        }

        .main-title-area {
            text-align: center;
            flex-grow: 1;
        }

        .main-title-area h1 {
            font-size: 48px;
            margin: 10px 0 5px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .quote {
            font-style: italic;
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.9;
        }

        .difficulty-area {
            text-align: right;
            font-size: 11px;
            line-height: 1.6;
        }

        .stars {
            color: #f1c40f;
            letter-spacing: 2px;
        }

        /* Model Label */
        .model-label {
            background-color: #555;
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin: 20px auto 10px auto;
            display: inline-block;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #fff;
            padding: 15px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .grid-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .icon-placeholder {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .grid-item span {
            font-size: 14px;
            font-weight: 500;
            color: #444;
            line-height: 1.4;
        }

        /* SVG Icon Styles (Approximations) */
        svg {
            width: 100%;
            height: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .top-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            .difficulty-area {
                text-align: center;
            }
        }
    </style>
</head>
