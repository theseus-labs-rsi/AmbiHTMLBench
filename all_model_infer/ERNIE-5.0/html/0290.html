<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anything's Possible Movie Poster</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: #f4f4f4;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .poster-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            min-height: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo-area {
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .prime-video-logo {
            font-family: 'Amazon Ember', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: #000;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .prime-video-logo span {
            display: block;
        }

        .arrow-smile {
            font-size: 24px;
            margin-left: 5px;
            position: relative;
            top: -5px;
        }

        .top-text {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .tagline {
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .main-image-placeholder {
            width: 100%;
            height: 450px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        
        /* Simulating the image content with CSS gradients/shapes roughly */
        .actor-left {
            position: absolute;
            left: 10%;
            bottom: 0;
            width: 40%;
            height: 80%;
            background: linear-gradient(to top, #ffdbac 0%, #ffdbac 40%, #333 40%, #333 100%); /* Skin tone approx */
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }
        .actor-left-hair {
            position: absolute;
            left: 5%;
            top: 10%;
            width: 50%;
            height: 40%;
            background-color: #1a1a1a;
            border-radius: 50%;
            z-index: 1;
        }
        .actor-right {
            position: absolute;
            right: 10%;
            bottom: 0;
            width: 40%;
            height: 85%;
            background: linear-gradient(to top, #ffdbac 0%, #ffdbac 30%, #fff 30%, #fff 100%); /* White shirt */
            border-radius: 50% 50% 0 0;
            z-index: 1;
            transform: rotate(-5deg);
        }
        .actor-right-hair {
            position: absolute;
            right: 15%;
            top: 15%;
            width: 35%;
            height: 25%;
            background-color: #1a1a1a;
            border-radius: 40%;
            z-index: 0;
        }

        .image-caption {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: #666;
            background: rgba(255,255,255,0.7);
            padding: 2px 5px;
        }

        .movie-title {
            font-size: 48px;
            margin-bottom: 10px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            font-weight: bold;
        }

        .title-script {
            font-family: 'Brush Script MT', 'Comic Sans MS', cursive;
            color: #5e6ebf; /* Approximate blue/purple */
            font-size: 55px;
            margin-right: 2px;
            line-height: 1;
        }

        .title-sans {
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            color: #d63384; /* Approximate pink */
            font-size: 48px;
            line-height: 1;
        }

        .credits {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer-logos {
            font-size: 10px;
            font-weight: bold;
            color: #888;
            display: flex;
            gap: 10px;
        }

        .release-date {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
        }

        .amazon-studios {
            font-size: 10px;
            font-weight: bold;
            color: #888;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Header Logo -->
        <div class="logo-area">
            <div class="prime-video-logo">
                prime video
                <span class="arrow-smile">#>
            </div>
        </div>

        <!-- Top Text -->
        <div class="top-text">
            From the heart & soul of director<br>
            Billy Porter
        </div>

        <div class="tagline">
            When it comes<br>
            to love...
        </div>

        <!-- Main Image Placeholder -->
        <div class="main-image-placeholder">
            <div class="actor-left-hair"></div>
            <div class="actor-left"></div>
            <div class="actor-right-hair"></div>
            <div class="actor-right"></div>
            <div class="image-caption">[Image: Kyla and Cole Sprouse]</div>
        </div>

        <!-- Title -->
        <div class="movie-title">
            <span class="title-script">anything's</span>
            <span class="title-sans">possible</span>
        </div>

        <!-- Credits -->
        <div class="credits">
            Written by Ximena García Lecuona &nbsp;&nbsp; Directed by Billy Porter
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-logos">
                <span>ORION</span>
                <span>UA</span>
            </div>
            <div class="release-date">
                July 22 | New Movie
            </div>
            <div class="amazon-studios">
                AMAZON<br>STUDIOS
            </div>
        </div>
    </div>

</body>
</html>
