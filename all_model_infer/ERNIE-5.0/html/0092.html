<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S. Emanuel's Benefit - Kostroma People</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .poster-container {
            background-color: #fdf6e3; /* Aged paper color */
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #dcdcdc;
        }

        .header-top {
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .location {
            font-family: "Georgia", serif;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            display: inline-block;
            padding: 2px 10px;
        }

        .main-event {
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 42px;
            margin: 10px 0;
            line-height: 1;
            text-transform: uppercase;
        }

        .date {
            font-family: "Georgia", serif;
            font-size: 24px;
            margin: 10px 0 5px 0;
        }

        .night-only {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hirsute-label {
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .main-title {
            font-family: "Impact", "Arial Black", sans-serif;
            font-size: 48px;
            color: #d35400; /* Burnt orange/red */
            margin: 5px 0;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .subtitle {
            font-family: "Georgia", serif;
            font-size: 16px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .image-placeholder {
            width: 100%;
            height: 450px;
            background-color: #f1c40f; /* Yellow background */
            border: 4px double #bfa055;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the illustration content with CSS shapes/text for fidelity without external images */
        .illustration-content {
            text-align: center;
            color: #5d4037;
            font-family: serif;
        }
        
        .figure-adult {
            font-size: 80px;
            line-height: 1;
            display: block;
            margin-bottom: -20px;
        }
        
        .figure-child {
            font-size: 50px;
            line-height: 1;
            display: block;
            margin-left: 40px;
        }

        .footer-text {
            font-family: "Georgia", serif;
            font-size: 14px;
            text-transform: uppercase;
            border-top: 1px solid #000;
            padding-top: 10px;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* Decorative lines */
        .divider {
            height: 1px;
            background-color: #000;
            width: 50%;
            margin: 10px auto;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Header Section -->
        <div class="header-top">Middlesex Music Hall,</div>
        <div class="location">Drury Lane,</div>
        
        <div class="divider"></div>

        <div class="main-event">S. Emanuel's Benefit</div>
        
        <div class="date">Wednesday, Feb. 25th.</div>
        <div class="night-only">Positively for this night only.</div>

        <!-- Title Section -->
        <div class="hirsute-label">The Hirsute</div>
        <div class="main-title">Kostroma People</div>
        <div class="subtitle">From the Primeval Forests of Central Russia.</div>

        <!-- Image Section -->
        <div class="image-placeholder">
            <div class="illustration-content">
                <span class="figure-adult">👤</span>
                <span class="figure-child">👶</span>
                <div style="margin-top: 20px; font-style: italic; font-size: 12px;">[Illustration of two hairy figures sitting on a rock]</div>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="footer-text">The first of their kind ever seen in England.</div>
    </div>

</body>
</html>
