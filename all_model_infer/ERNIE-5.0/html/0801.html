<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Card</title>
    <style>
        body {
            background-color: #282040; /* Deep purple background */
            color: #d4c596; /* Muted gold text */
            font-family: "Georgia", "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* Logo Styling */
        .logo-container {
            margin-bottom: 40px;
            display: inline-block;
        }

        .logo-svg {
            width: 150px;
            height: 150px;
            fill: none;
            stroke: #d4c596;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* English Text Styling */
        .english-quote {
            font-size: 15px;
            line-height: 1.6;
            margin: 30px 0 50px 0;
            position: relative;
            font-style: italic;
        }

        .diamond-deco {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            opacity: 0.8;
        }

        .deco-left {
            left: -25px;
        }

        .deco-right {
            right: -25px;
        }

        /* Chinese Text Styling */
        .chinese-quote {
            font-size: 24px;
            line-height: 1.8;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .quote-mark {
            font-size: 30px;
            vertical-align: top;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <!-- Outer Diamond -->
                <polygon points="50 5, 95 50, 50 95, 5 50" />
                
                <!-- Top Fan/Rays -->
                <path d="M 25 25 Q 50 15 75 25" />
                <path d="M 30 30 Q 50 22 70 30" />
                <path d="M 35 35 Q 50 28 65 35" />
                
                <!-- Venus Symbol (Circle + Cross) -->
                <circle cx="50" cy="50" r="12" />
                <line x1="50" y1="62" x2="50" y2="75" />
                <line x1="44" y1="68" x2="56" y2="68" />
            </svg>
        </div>

        <!-- English Text -->
        <div class="english-quote">
            <span class="diamond-deco deco-left">&#9830;</span>
            I think the so-called loneliness refers to the person you are facing,<br>
            whose emotions are not on the same frequency as your own.
            <span class="diamond-deco deco-right">&#9830;</span>
        </div>

        <!-- Chinese Text -->
        <div class="chinese-quote">
            <span class="quote-mark">“</span>
            我想所谓孤独，<br>
            就是你面对的那个人，<br>
            他的情绪和你自己的情绪，<br>
            不在同一个频率。<span class="quote-mark">”</span>
        </div>
    </div>

</body>
</html>
