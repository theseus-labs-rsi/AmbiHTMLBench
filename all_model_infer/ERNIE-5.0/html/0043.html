<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对比色配色 2023</title>
    <style>
        :root {
            --primary-orange: #f37021;
            --text-dark: #333;
            --text-gray: #666;
            --bg-light: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f9f9f9;
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header Section */
        header {
            background-color: var(--primary-orange);
            color: white;
            padding: 20px 40px;
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .copyright {
            font-size: 24px;
            border: 2px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .year {
            font-size: 24px;
            font-weight: bold;
        }

        .main-title {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .header-decorations {
            position: absolute;
            left: 20px;
            top: 60px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: white;
            font-size: 10px;
        }

        .vertical-text {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* Intro Section */
        .intro-section {
            background: white;
            padding: 30px 40px;
            margin: 0 20px;
            border-bottom: 1px solid #eee;
        }

        .intro-text {
            font-size: 16px;
            color: var(--text-dark);
            text-align: justify;
        }

        /* Content Container */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Card Style */
        .color-card {
            background: white;
            border: 3px solid var(--primary-orange);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .diamond-icon {
            color: var(--primary-orange);
            font-size: 14px;
        }

        /* Abstract Art Placeholders */
        .art-container {
            width: 100%;
            height: 200px;
            position: relative;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Art 1: Vibrant */
        .art-1-green {
            position: absolute;
            left: 0;
            top: 20%;
            width: 35%;
            height: 60%;
            background-color: #8bc34a;
            border-radius: 50% 0 0 50%;
            z-index: 1;
        }
        .art-1-yellow {
            position: absolute;
            left: 25%;
            top: 10%;
            width: 60%;
            height: 80%;
            background-color: #ffeb3b;
            border-radius: 40% 60% 60% 40%;
            z-index: 2;
        }
        .art-1-blue {
            position: absolute;
            right: 0;
            top: 20%;
            width: 35%;
            height: 60%;
            background-color: #2962ff;
            border-radius: 0 50% 50% 0;
            z-index: 1;
        }

        /* Art 2: Strong Impact */
        .art-2-lightgreen {
            position: absolute;
            left: 0;
            top: 20%;
            width: 30%;
            height: 60%;
            background-color: #cddc39;
            border-radius: 50% 0 0 50%;
            z-index: 1;
        }
        .art-2-black {
            position: absolute;
            left: 20%;
            top: 30%;
            width: 65%;
            height: 50%;
            background-color: #000;
            border-radius: 45% 55% 50% 50%;
            z-index: 2;
        }
        .art-2-pink {
            position: absolute;
            right: 0;
            bottom: 10%;
            width: 35%;
            height: 40%;
            background-color: #e91e63;
            border-radius: 0 50% 50% 0;
            z-index: 1;
        }

        .card-caption {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.8;
            text-align: justify;
        }

        /* Footer */
        footer {
            background-color: var(--primary-orange);
            height: 40px;
            width: 100%;
        }

    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="copyright">©</div>
            <div class="year">2023</div>
        </div>
        
        <div class="header-decorations">
            <span>◆</span>
            <span>◆</span>
            <span>◆</span>
            <span>◆</span>
            <span>◆</span>
        </div>

        <h1 class="main-title">对比色配色</h1>

        <div class="vertical-text">瑞</div>
    </header>

    <section class="intro-section">
        <p class="intro-text">
            对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
        </p>
    </section>

    <div class="container">
        <!-- Card 1 -->
        <div class="color-card">
            <h2 class="card-title">
                富有朝气的配色 <span class="diamond-icon">◆</span>
            </h2>
            <div class="art-container">
                <div class="art-1-green"></div>
                <div class="art-1-yellow"></div>
                <div class="art-1-blue"></div>
            </div>
            <p class="card-caption">
                以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
            </p>
        </div>

        <!-- Card 2 -->
        <div class="color-card">
            <h2 class="card-title">
                视觉冲击强烈的配色 <span class="diamond-icon">◆</span>
            </h2>
            <div class="art-container">
                <div class="art-2-lightgreen"></div>
                <div class="art-2-black"></div>
                <div class="art-2-pink"></div>
            </div>
            <p class="card-caption">
                黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
            </p>
        </div>
    </div>

    <footer></footer>

</body>
</html>
