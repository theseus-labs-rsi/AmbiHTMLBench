<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 回避行为</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 60px 40px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px;
        }

        /* Decorative Blue Elements */
        .deco-left-top {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 40px;
            height: 40px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
        }
        
        .deco-left-mid {
            position: absolute;
            top: 50%;
            left: -15px;
            width: 30px;
            height: 60px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 20%, 100% 80%, 0 100%);
        }

        .deco-left-bot {
            position: absolute;
            bottom: -15px;
            left: -15px;
            width: 50px;
            height: 30px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }

        .deco-right-top {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            transform: scaleX(-1);
        }

        .deco-right-mid {
            position: absolute;
            top: 50%;
            right: -15px;
            width: 30px;
            height: 60px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 20%, 100% 80%, 0 100%);
            transform: scaleX(-1);
        }

        .deco-right-bot {
            position: absolute;
            bottom: -15px;
            right: -15px;
            width: 50px;
            height: 30px;
            background-color: #1e40af;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
            transform: scaleX(-1);
        }

        /* Top Center Decoration */
        .deco-top-center {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 15px;
            background-color: #1e40af;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #000;
            line-height: 1;
        }

        h2 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0 0 40px 0;
            color: #000;
            line-height: 1.2;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #000;
            margin-bottom: 25px;
            text-align: justify;
        }

        .highlight {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 20px;
                margin: 10px;
            }
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2rem; }
            p { font-size: 1rem; }
            .deco-left-top, .deco-left-mid, .deco-left-bot, .deco-right-top, .deco-right-mid, .deco-right-bot, .deco-top-center {
                display: none; /* Hide complex decorations on small screens for cleaner look */
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Decorative Blue Shapes -->
        <div class="deco-top-center"></div>
        <div class="deco-left-top"></div>
        <div class="deco-left-mid"></div>
        <div class="deco-left-bot"></div>
        <div class="deco-right-top"></div>
        <div class="deco-right-mid"></div>
        <div class="deco-right-bot"></div>

        <h1>03</h1>
        <h2>回避行为</h2>

        <p>
            自觉或不自觉地回避曾经的某些人、事、物。
        </p>

        <p>
            比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……
        </p>
    </div>

</body>
</html>
