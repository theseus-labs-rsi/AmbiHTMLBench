<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光明日报 - 公益广告</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: "SimHei", "Heiti SC", sans-serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            background-color: #eef6e6; /* Light green background */
            width: 100%;
            max-width: 800px;
            min-height: 1000px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
            /* Simulating the faint background pattern */
            background-image: 
                linear-gradient(rgba(0, 100, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 30px;
            border-bottom: 2px solid #00563c;
            margin-bottom: 20px;
        }

        .logo {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 32px;
            color: #b71c1c; /* Reddish color for logo */
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header-meta {
            text-align: right;
            color: #00563c;
        }

        .ad-label {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }

        .page-number {
            font-size: 24px;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }

        .date {
            font-size: 12px;
            margin-top: 5px;
            color: #333;
        }

        /* Main Content */
        .content-wrapper {
            padding: 20px 40px;
            position: relative;
        }

        .series-title {
            font-size: 18px;
            color: #006633;
            font-weight: bold;
            margin-bottom: 40px;
            display: block;
        }

        .main-headline {
            position: absolute;
            top: 60px;
            right: 40px;
            text-align: right;
            color: #009944;
        }

        .main-headline h1 {
            font-size: 48px;
            margin: 0;
            line-height: 1.2;
            font-weight: 900;
        }

        .main-headline h2 {
            font-size: 48px;
            margin: 0;
            line-height: 1.2;
            font-weight: 900;
        }

        /* Graphic Area */
        .graphic-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 60px 0 40px 0;
            position: relative;
        }

        .bike-graphic {
            width: 400px;
            height: 300px;
            position: relative;
        }
        
        /* Simulating the bike on leaf graphic with CSS shapes/placeholders */
        .bike-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cyclist-icon {
            width: 150px;
            height: 100px;
            background-color: #000;
            mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 C 60 10, 65 20, 60 30 L 70 40 L 80 40 L 85 50 L 75 55 L 65 45 L 55 55 L 45 55 L 40 45 L 30 45 L 25 35 L 35 30 L 45 40 L 50 30 Z" /></svg>') no-repeat center;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="70" r="20" fill="black"/><circle cx="70" cy="70" r="20" fill="black"/><path d="M30 70 L50 50 L70 70" stroke="black" stroke-width="5" fill="none"/><path d="M50 50 L50 30 L60 20" stroke="black" stroke-width="5" fill="none"/><circle cx="50" cy="20" r="8" fill="black"/></svg>') no-repeat center;
            mask-size: contain;
            -webkit-mask-size: contain;
            position: absolute;
            top: 20px;
            z-index: 2;
        }

        .leaf-base {
            width: 100%;
            height: 120px;
            background-color: #4CAF50;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            bottom: 0;
            transform: scaleX(1.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 1;
        }
        
        .leaf-veins {
            position: absolute;
            bottom: 10px;
            width: 80%;
            left: 10%;
            height: 60px;
            border-left: 4px solid rgba(255,255,255,0.4);
            border-right: 4px solid rgba(255,255,255,0.4);
            border-bottom: 4px solid rgba(255,255,255,0.4);
            border-radius: 0 0 50% 50%;
        }

        .wheel-ring {
            position: absolute;
            bottom: 40px;
            width: 90px;
            height: 90px;
            border: 8px solid #8BC34A;
            border-radius: 50%;
            z-index: 3;
        }
        .wheel-left { left: 100px; }
        .wheel-right { right: 100px; }

        /* Text Block */
        .text-block {
            max-width: 600px;
            margin: 0 auto;
            text-align: justify;
            color: #333;
            font-size: 16px;
            line-height: 1.8;
            padding: 0 20px;
        }

        /* Footer */
        .footer {
            margin-top: 60px;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            position: relative;
        }

        .footer-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 24px;
            color: #fff;
            z-index: 2;
            margin-right: 20px;
        }

        .footer-curve {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, #2E7D32 0%, #4CAF50 100%);
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            transform: scaleY(1.5);
            transform-origin: bottom;
        }
        
        .footer-curve::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 20px;
            background-color: #eef6e6; /* Match page bg to cut out the curve */
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">光明日报</div>
            <div class="header-meta">
                <span class="ad-label">公益广告</span>
                <span class="page-number">05</span>
                <div class="date">2025年1月5日 星期日</div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-wrapper">
            <span class="series-title">绿色生活系列公益广告</span>

            <div class="main-headline">
                <h1>绿色出行</h1>
                <h2>低碳环保</h2>
            </div>

            <div class="graphic-container">
                <div class="bike-graphic">
                    <div class="leaf-base">
                        <div class="leaf-veins"></div>
                    </div>
                    <div class="wheel-ring wheel-left"></div>
                    <div class="wheel-ring wheel-right"></div>
                    <div class="cyclist-icon"></div>
                </div>
            </div>

            <div class="text-block">
                选择绿色出行方式，既节约能源、减少污染，又益于健康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具，或者选择步行、骑自行车等出行方式，降低出行中产生的能耗和污染，绿色出行、低碳出行、文明出行。
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-curve"></div>
            <div class="footer-text">光明日报社</div>
        </footer>
    </div>

</body>
</html>
