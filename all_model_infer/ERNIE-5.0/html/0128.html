<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育原则模板</title>
    <style>
        body {
            background-color: #1f1f1f;
            color: #e0e0e0;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            margin: 0;
            padding: 40px;
            line-height: 1.6;
            position: relative;
            overflow: hidden;
        }

        /* Watermark simulation */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 80px;
            color: rgba(255, 255, 255, 0.05);
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #d4af37; /* Gold color */
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.4;
        }

        .item {
            margin-bottom: 20px;
            font-size: 18px;
            text-align: left;
        }

        .item-label {
            font-weight: bold;
            margin-right: 5px;
        }
        
        /* Specific styling to match the visual flow */
        .text-content {
            display: inline;
        }

    </style>
</head>
<body>

    <div class="watermark">琳子幼资</div>

    <div class="container">
        <h1>7.当题目中出现“原则”时，可用以下模板：</h1>

        <div class="item">
            <span class="item-label">(一)教育性原则。</span>
            <span class="text-content">...体现教育目标，有利于幼儿身的全面发展</span>
        </div>

        <div class="item">
            <span class="item-label">(二)个别差异性原则。</span>
            <span class="text-content">每个幼儿不一样，教师要因材施教</span>
        </div>

        <div class="item">
            <span class="item-label">(三)科学性原则。</span>
            <span class="text-content">...能给幼儿正确的启蒙教育</span>
        </div>

        <div class="item">
            <span class="item-label">(四)发展适宜性原则。</span>
            <span class="text-content">考虑到不同年龄阶段孩子的特点</span>
        </div>

        <div class="item">
            <span class="item-label">(五)整体性原则。</span>
            <span class="text-content">考虑到多方面的要素，促进幼儿整体的发展</span>
        </div>

        <div class="item">
            <span class="item-label">(六)活动性原则。</span>
            <span class="text-content">注重幼儿亲身体验，直接参与，以各种游戏活动为主</span>
        </div>
    </div>

</body>
</html>
