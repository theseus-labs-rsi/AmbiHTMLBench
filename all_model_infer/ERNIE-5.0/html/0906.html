<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句段结构作用好处赏析</title>
    <style>
        :root {
            --ink-color: #8b3a3a;
            --grid-color: #e0e0e0;
            --stamp-color: #c92a2a;
        }

        body {
            font-family: "KaiTi", "STKaiti", "Serif", sans-serif;
            background-color: #fff;
            color: var(--ink-color);
            margin: 0;
            padding: 40px;
            /* Simulating graph paper background */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .section-row {
            display: flex;
            margin-bottom: 30px;
            align-items: flex-start;
        }

        .sidebar-label {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 22px;
            font-weight: bold;
            margin-right: 20px;
            padding-right: 10px;
            border-right: 2px solid transparent; /* Placeholder for alignment */
            height: 100%;
            min-height: 150px;
            display: flex;
            align-items: center;
        }

        .content-area {
            flex: 1;
            font-size: 18px;
            line-height: 1.8;
        }

        ol.question-list {
            list-style-type: decimal;
            padding-left: 20px;
            margin: 0;
        }

        ol.question-list li {
            margin-bottom: 10px;
        }

        .formula-block {
            margin-bottom: 20px;
        }

        .formula-step {
            margin-bottom: 10px;
        }

        .mnemonic {
            margin-top: 40px;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            padding-left: 10px;
        }

        /* The Red Stamp */
        .stamp {
            position: absolute;
            right: 20px;
            top: 350px; /* Approximate position relative to content */
            width: 60px;
            height: 60px;
            background-color: var(--stamp-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transform: rotate(-5deg);
            font-family: "Seal Script", "STZhongsong", serif;
            border: 2px solid #a01010;
        }

        /* Utility for brackets in text */
        .bracket {
            display: inline-block;
            width: 60px;
            border-bottom: 1px solid var(--ink-color);
            text-align: center;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>句段结构作用好处赏析</h1>

    <!-- Section 1: Common Questions -->
    <div class="section-row">
        <div class="sidebar-label">常见问法</div>
        <div class="content-area">
            <ol class="question-list">
                <li>请分析这句话的作用是什么？</li>
                <li>这句话这样描写有什么好处？</li>
                <li>请分析这句话这样描写的表达效果。</li>
            </ol>
        </div>
    </div>

    <!-- Section 2: Full Score Formula -->
    <div class="section-row">
        <div class="sidebar-label">满分公式</div>
        <div class="content-area">
            <div class="formula-block">
                <div class="formula-step">① 这是（ <span class="bracket"></span> ）描写</div>
                <div class="formula-step" style="margin-left: 20px;">生动形象地写出（ <span class="bracket"></span> ）。</div>
            </div>
            
            <div class="formula-block">
                <div class="formula-step">② 更突出了（ <span class="bracket"></span> ）。</div>
            </div>

            <div class="formula-block">
                <div class="formula-step">③ 前后文呼应 / 为后文（ <span class="bracket"></span> ）做了铺垫。</div>
            </div>
        </div>
    </div>

    <!-- Mnemonic -->
    <div class="mnemonic">
        口诀：生动秀 感心头 勾勾手
    </div>

    <!-- Stamp -->
    <div class="stamp">
        李真
    </div>
</div>

</body>
</html>
