<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendations</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .book-section {
            margin-bottom: 40px;
        }

        .book-title-header {
            background-color: #f5e6e6;
            text-align: center;
            padding: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }

        .book-content {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .book-cover {
            width: 120px;
            height: 180px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid #eee;
            background-color: #f9f9f9;
            font-size: 0.8rem;
            color: #666;
            padding: 5px;
            box-sizing: border-box;
        }
        
        /* Simulating the specific cover styles */
        .cover-1 {
            background-color: #d9534f; /* Reddish bg */
            color: white;
            font-weight: bold;
        }
        .cover-1 span {
            display: block;
            margin: 5px 0;
        }
        .cover-1 .small {
            font-size: 0.6rem;
            font-weight: normal;
        }

        .cover-2 {
            background: linear-gradient(to bottom, #ffcc00, #ff6600); /* Orange/Yellow gradient */
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .cover-2 .eng-title {
            font-size: 0.7rem;
            margin: 10px 0;
            text-align: center;
        }
        .cover-2 .chinese-large {
            font-size: 1.5rem;
            writing-mode: vertical-rl;
            letter-spacing: 5px;
            margin: 0 10px;
        }

        .book-text {
            flex: 1;
            font-size: 0.95rem;
        }

        .rating {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .description {
            margin: 0;
            text-align: justify;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .book-content {
                flex-direction: column;
                align-items: center;
            }
            .book-cover {
                margin-bottom: 15px;
            }
            .book-text {
                text-align: left;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Book 1 Section -->
    <div class="book-section">
        <div class="book-title-header">《达摩流浪者》</div>
        <div class="book-content">
            <div class="book-cover cover-1">
                <span>达摩流浪者</span>
                <span style="font-size: 1.2rem; margin: 10px 0;">DHARMA BUMS</span>
                <span class="small">JACK KEROUAC</span>
                <div style="margin-top: 20px; font-size: 2rem;">🚂</div>
            </div>
            <div class="book-text">
                <div class="rating">评分：8.5</div>
                <p class="description">
                    永远年轻，永远热泪盈眶<br>
                    相信每个理想主义的nfper，每个在庸碌生活中迷茫的人，每个还没被社会总开关控制的人，都会被书中纯净又赤诚的灵魂打动。
                </p>
            </div>
        </div>
    </div>

    <!-- Book 2 Section -->
    <div class="book-section">
        <div class="book-title-header">《深时之旅》</div>
        <div class="book-content">
            <div class="book-cover cover-2">
                <div class="chinese-large">之旅</div>
                <div class="eng-title">UNDERLAND<br>A Deep Time Journey</div>
                <div class="chinese-large">深时</div>
            </div>
            <div class="book-text">
                <div class="rating">评分：8.7</div>
                <p class="description">
                    地下，有另外一个世界！<br>
                    作者以充满灵性的语言，描绘了地下世界一个又一个奇妙的科学现象，神秘的传说和感人的故事。<br>
                    天呐！惊叹，将是你的主旋律
                </p>
            </div>
        </div>
    </div>

    <div class="footer">
        分享好书的 Grit
    </div>

</div>

</body>
</html>
