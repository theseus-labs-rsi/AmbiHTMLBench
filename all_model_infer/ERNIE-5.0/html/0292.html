<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Up in the Biz: The Life and Rhymes of Biz Markie</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            aspect-ratio: 2/3;
        }

        /* Top Header Section */
        .header {
            padding: 20px 30px 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, #f4f1ea, #e0dcd5);
        }

        .tribeca-logo {
            width: 80px;
            height: auto;
        }
        
        .tribeca-text {
            font-size: 10px;
            color: #555;
            text-align: center;
            line-height: 1.2;
            font-weight: bold;
        }

        .showtime-original {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #333;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
            flex-grow: 1;
        }

        .director-credit {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #333;
            text-transform: uppercase;
            text-align: center;
            margin-top: 5px;
        }

        /* Main Image Area */
        .main-visual {
            position: relative;
            width: 100%;
            height: 65%; /* Approximate height of the face/cap */
            background-color: #ccc;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 40%; /* Focus on eyes/cap */
            display: block;
        }

        /* Text Overlays on Image */
        .cap-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Rye', serif;
            color: #f0c420;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 2;
            width: 90%;
        }

        .cap-text h1 {
            font-size: 65px;
            margin: 0;
            line-height: 0.9;
            letter-spacing: -2px;
        }
        
        .cap-text h2 {
            font-size: 24px;
            margin: 10px 0 0 0;
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Bottom Footer Section */
        .footer {
            background-color: #000;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 35%;
        }

        .doc-type {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .release-date {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .streaming-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            border-left: 1px solid #555;
            border-right: 1px solid #555;
            padding: 0 20px;
        }

        .showtime-logo {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: -1px;
            font-style: italic;
        }

        .paramount-logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 32px;
            color: #fff;
        }
        
        .streaming-text {
            font-size: 10px;
            text-transform: uppercase;
            position: absolute;
            top: -15px;
            right: 0;
            width: 100%;
            text-align: right;
            padding-right: 20px;
            box-sizing: border-box;
        }

        .fine-print {
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Placeholder styling for the image since I cannot embed the actual copyrighted image */
        .image-placeholder {
            width: 100%;
            height: 100%;
            background: #555 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23ddd" width="100" height="100"/><text x="50" y="50" font-family="sans-serif" font-size="10" fill="%23999" text-anchor="middle" dy=".3em">Image: Biz Markie Close-up</text></svg>') no-repeat center center;
            background-size: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Top Header -->
        <div class="header">
            <div class="tribeca-logo">
                <!-- Simulating the laurel wreath logo with text/css for fidelity without external image -->
                <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5C30 5 15 20 15 40C15 60 30 80 50 95C70 80 85 60 85 40C85 20 70 5 50 5Z" stroke="#555" stroke-width="3" fill="none"/>
                    <path d="M50 10C35 10 25 25 25 40C25 55 35 70 50 85C65 70 75 55 75 40C75 25 65 10 50 10Z" stroke="#555" stroke-width="2" fill="none"/>
                    <text x="50" y="45" font-family="serif" font-size="10" fill="#555" text-anchor="middle" font-weight="bold">TRIBECA</text>
                    <text x="50" y="58" font-family="serif" font-size="8" fill="#555" text-anchor="middle">FESTIVAL</text>
                    <text x="50" y="72" font-family="serif" font-size="10" fill="#555" text-anchor="middle">2023</text>
                </svg>
            </div>
            <div style="flex-grow: 1; text-align: center;">
                <div class="showtime-original">Showtime Original</div>
                <div class="director-credit">A Sacha Jenkins Jammie</div>
            </div>
            <div style="width: 80px;"></div> <!-- Spacer for balance -->
        </div>

        <!-- Main Visual -->
        <div class="main-visual">
            <!-- Using a placeholder div to represent the photo -->
            <div class="image-placeholder"></div>
            
            <div class="cap-text">
                <h1>ALL UP IN THE<br>BIZ</h1>
                <h2>The Life and Rhymes<br>of Biz Markie</h2>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="doc-type">Documentary Film</div>
            <div class="release-date">August 11</div>
            
            <div class="streaming-logos">
                <div class="showtime-logo">SHOWTIME</div>
                <div style="position: relative;">
                    <div class="streaming-text">Streaming on</div>
                    <div class="paramount-logo">Paramount+</div>
                </div>
            </div>

            <div class="fine-print">Paramount+ with Showtime plan only.</div>
        </div>
    </div>

</body>
</html>
