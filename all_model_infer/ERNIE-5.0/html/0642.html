<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-controller vs. Micro-processor</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .header-graphic {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4a90e2 25%, transparent 25%) -10px 0,
                        linear-gradient(225deg, #4a90e2 25%, transparent 25%) -10px 0,
                        linear-gradient(315deg, #4a90e2 25%, transparent 25%),
                        linear-gradient(45deg, #4a90e2 25%, transparent 25%);
            background-size: 20px 20px;
            background-color: #f0f0f0;
            margin-right: 15px;
            border: 1px solid #ccc;
        }

        h1 {
            font-size: 24px;
            color: #555;
            margin: 0;
            font-weight: normal;
        }

        .main-container {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            background-color: #fff;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            min-height: 500px;
        }

        .column {
            flex: 1;
            padding: 0 20px;
        }

        .column-title {
            text-align: center;
            text-decoration: underline;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Left Side: One Chip */
        .microcontroller-wrapper {
            background-color: #0099ff;
            padding: 10px;
            border-radius: 5px;
            color: white;
        }

        .microcontroller-label {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .chip-item {
            background-color: white;
            color: black;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            border: 1px solid #ccc;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chip-item.full-width {
            grid-column: span 2;
        }

        /* Right Side: Many Different Chips */
        .chips-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chip-row {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }

        .chip-row.center {
            justify-content: center;
        }

        .separate-chip {
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            color: #333;
            border: 1px solid #999;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chip-mp { background-color: #4caf50; color: white; width: 150px; }
        .chip-clock { background-color: #a1887f; color: white; width: 80px; }
        .chip-usart { background-color: #b3e5fc; width: 80px; }
        
        .chip-mem { background-color: #2196f3; color: white; flex-grow: 1; }
        .chip-io { background-color: #fff9c4; flex-grow: 1; }

        .chip-timer { background-color: #bdbdbd; width: 180px; }
        
        .peripherals-group {
            display: flex;
            gap: 2px;
            flex-grow: 1;
        }
        
        .peri-block {
            flex: 1;
            height: 40px;
            border: 1px solid #999;
        }
        .pb-1 { background-color: #d1c4e9; }
        .pb-2 { background-color: #fff59d; }
        .pb-3 { background-color: #aed581; }
        .pb-4 { background-color: #f8bbd0; }

        .footer {
            margin-top: 40px;
            text-align: right;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        
        .page-number {
            font-weight: bold;
            font-size: 16px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-graphic"></div>
        <h1>Micro-controller vs. Micro-processor</h1>
    </div>

    <div class="main-container">
        <!-- Left Column: One Chip -->
        <div class="column">
            <div class="column-title">One Chip</div>
            <div class="microcontroller-wrapper">
                <div class="microcontroller-label">Microcontroller</div>
                <div class="chip-grid">
                    <div class="chip-item">CPU</div>
                    <div class="chip-item">Timer/Counter</div>
                    <div class="chip-item">Memory</div>
                    <div class="chip-item">Clock</div>
                    <div class="chip-item">I/O Interface</div>
                    <div class="chip-item">USART</div>
                    <div class="chip-item full-width">Other Peripherals</div>
                </div>
            </div>
        </div>

        <!-- Right Column: Many Different Chips -->
        <div class="column">
            <div class="column-title">Many Different Chips</div>
            <div class="chips-container">
                <div class="chip-row">
                    <div class="separate-chip chip-mp">Microprocessor</div>
                    <div class="separate-chip chip-clock">Clock</div>
                    <div class="separate-chip chip-usart">USART</div>
                </div>
                <div class="chip-row">
                    <div class="separate-chip chip-mem">Memory</div>
                    <div class="separate-chip chip-io">I/O Interfaces</div>
                </div>
                <div class="chip-row">
                    <div class="separate-chip chip-timer">Timer/Counter</div>
                    <div class="peripherals-group">
                        <div class="peri-block pb-1"></div>
                        <div class="peri-block pb-2"></div>
                        <div class="peri-block pb-3"></div>
                        <div class="peri-block pb-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>© 2015 by Eng. Mohamed Tarek.</div>
        <div class="page-number">7</div>
    </div>

</body>
</html>
