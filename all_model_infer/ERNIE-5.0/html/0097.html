<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Slide</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .slide-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 1024px;
            aspect-ratio: 16 / 9;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar Area */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #eee;
        }

        .top-icon {
            width: 40px;
            height: 40px;
            background-color: #e0e0e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 20px;
        }

        .video-feed {
            width: 120px;
            height: 70px;
            background-color: #333;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .video-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        /* Main Content Area */
        .content {
            padding: 40px 60px;
            flex-grow: 1;
            position: relative;
            color: #333;
            line-height: 1.6;
        }

        .section-title {
            color: #a85656;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .list-item {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        .center-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0;
            color: #000;
        }

        .underline {
            text-decoration: underline;
            text-decoration-color: #a85656;
            text-underline-offset: 4px;
        }

        /* Layout Grid for bottom section */
        .bottom-grid {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 20px;
        }

        .left-column {
            width: 60%;
        }

        .right-column {
            width: 35%;
            text-align: left;
            padding-left: 20px;
        }

        .side-note {
            color: #a85656;
            font-size: 14px;
            margin-top: 10px;
            text-align: right;
        }

        /* Specific spacing adjustments */
        .spacer {
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Top Header -->
        <div class="top-bar">
            <span>2023年 5月14日 周五</span>
            <div class="top-icon">
                <!-- Simulating the camera/mute icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </div>
            <div class="video-feed">
                <!-- Placeholder for the video feed image -->
                <img src="https://placehold.co/120x70/333/999?text=Video+Feed" alt="Speaker Video">
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="section-title">固化的做题思维：</div>
            
            <div class="list-item">1. 喜欢忠于自己的内心和感觉。</div>

            <div class="center-title">2017年 12月第一套 Text 1</div>

            <div class="bottom-grid">
                <div class="left-column">
                    <div class="list-item">
                        2. 喜欢选<span class="underline">符合常识</span>的选项。 <span style="color:#a85656; font-size: 14px;">20年左右的常识和经验的累积</span>
                    </div>
                    <div class="list-item">3. 喜欢选自己认识的选项。</div>
                    <div class="list-item">4. 喜欢选自己不认识的选项。</div>
                    <div class="list-item">5. 火急火燎一把火</div>
                </div>

                <div class="right-column">
                    <div class="list-item" style="color: #a85656;">6. 囫囵吞枣选择法</div>
                    <div class="side-note">(有逃避，有厌烦)</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
