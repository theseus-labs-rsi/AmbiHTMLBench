<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京剧艺术节海报</title>
    <style>
        :root {
            --bg-color: #f2f2f2;
            --text-black: #1a1a1a;
            --text-red: #c92a2a;
            --text-pink: #d67a96;
            --font-serif: "Songti SC", "SimSun", "STSong", serif;
            --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: var(--font-serif);
        }

        .poster-container {
            width: 800px;
            height: 1200px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Top Left Section */
        .top-left-section {
            position: absolute;
            top: 60px;
            left: 60px;
            display: flex;
            align-items: flex-start;
            z-index: 10;
        }

        .roles-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-right: 20px;
        }

        .role-circle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--text-black);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .main-title-column {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 64px;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: 5px;
        }

        .title-red {
            color: var(--text-red);
        }

        .sub-title {
            font-size: 24px;
            margin-top: 10px;
            writing-mode: vertical-rl;
            letter-spacing: 8px;
            font-family: var(--font-sans);
            font-weight: 300;
        }

        /* Top Right Logo */
        .top-right-logo {
            position: absolute;
            top: 40px;
            right: 60px;
            text-align: right;
            z-index: 10;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background-color: var(--text-red);
            /* Creating a diamond grid pattern with CSS gradients is complex, using a simplified block for now or just text */
            display: inline-block;
            margin-bottom: 10px;
            position: relative;
        }
        
        /* Simulating the diamond grid logo */
        .logo-icon::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(45deg, transparent 48%, #fff 49%, #fff 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #fff 49%, #fff 51%, transparent 52%);
            background-size: 10px 10px;
            opacity: 0.5;
        }

        .logo-text {
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-black);
            letter-spacing: 1px;
        }

        /* Abstract Geometric Shapes */
        .graphic-area {
            position: absolute;
            top: 200px;
            right: 0;
            width: 60%;
            height: 600px;
            z-index: 5;
        }

        .shape {
            position: absolute;
        }

        .circle-pink {
            width: 100px;
            height: 100px;
            background-color: var(--text-pink);
            border-radius: 50%;
            top: 50px;
            left: 100px;
            opacity: 0.8;
        }

        .circle-red {
            width: 80px;
            height: 80px;
            background-color: var(--text-red);
            border-radius: 50%;
            top: 200px;
            left: 50px;
        }

        .triangle-black {
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 350px solid var(--text-black);
            top: 100px;
            right: 50px;
            transform: rotate(-15deg);
        }

        .triangle-pink {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 180px solid var(--text-pink);
            top: 180px;
            right: 120px;
            transform: rotate(10deg);
            opacity: 0.6;
        }
        
        .triangle-small-pink {
             width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid var(--text-pink);
            top: 280px;
            right: 180px;
            transform: rotate(45deg);
        }

        .bar-red {
            width: 40px;
            height: 400px;
            background-color: var(--text-red);
            bottom: 100px;
            right: 250px;
        }
        
        .triangle-tiny-pink {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid var(--text-pink);
            top: 450px;
            right: 50px;
        }

        /* Bottom Info Section */
        .info-section {
            position: absolute;
            bottom: 250px;
            left: 60px;
            z-index: 10;
            font-family: var(--font-sans);
            color: var(--text-black);
        }

        .info-row {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .date-row {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .date-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .date-main {
            font-size: 42px;
            font-weight: bold;
            font-family: var(--font-serif);
        }

        .date-sub {
            font-size: 14px;
            vertical-align: super;
            margin-left: 5px;
            font-family: var(--font-sans);
        }

        .separator {
            margin: 0 15px;
            font-size: 24px;
            color: #999;
        }

        .phone-row {
            font-size: 20px;
            letter-spacing: 1px;
        }

        /* Landscape Placeholder */
        .landscape-placeholder {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background: linear-gradient(to top, #333 0%, #555 40%, transparent 100%);
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Simulating mountains with CSS shapes */
        .mountain-1 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-bottom: 150px solid #222;
            opacity: 0.8;
        }
        
        .mountain-2 {
            position: absolute;
            bottom: 0;
            left: 30%;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 200px solid #444;
            opacity: 0.6;
        }

        .mountain-3 {
            position: absolute;
            bottom: 0;
            right: 10%;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 180px solid #333;
            opacity: 0.7;
        }
        
        .tree-silhouette {
            position: absolute;
            bottom: 20px;
            right: 40%;
            width: 40px;
            height: 60px;
            background: #111;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        
        .birds {
            position: absolute;
            bottom: 100px;
            right: 15%;
            font-size: 20px;
            color: #111;
            letter-spacing: 10px;
        }

        .caption {
            position: absolute;
            bottom: 10px;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        
        <!-- Top Left Text -->
        <div class="top-left-section">
            <div class="roles-column">
                <div class="role-circle">生</div>
                <div class="role-circle">旦</div>
                <div class="role-circle">净</div>
                <div class="role-circle">末</div>
                <div class="role-circle">丑</div>
            </div>
            <div class="main-title-column">
                <div class="main-title">
                    <span class="title-red">京剧</span><span style="color:var(--text-black)">艺术节</span>
                </div>
                <div class="sub-title">稿定艺术展</div>
            </div>
        </div>

        <!-- Top Right Logo -->
        <div class="top-right-logo">
            <div class="logo-icon"></div>
            <div class="logo-text">
                Gao<br>
                Ding<br>
                Yi<br>
                Shu
            </div>
        </div>

        <!-- Abstract Graphics -->
        <div class="graphic-area">
            <div class="shape circle-pink"></div>
            <div class="shape circle-red"></div>
            <div class="shape triangle-black"></div>
            <div class="shape triangle-pink"></div>
            <div class="shape triangle-small-pink"></div>
            <div class="shape bar-red"></div>
            <div class="shape triangle-tiny-pink"></div>
        </div>

        <!-- Bottom Info -->
        <div class="info-section">
            <div class="info-row">主办方：稿定集团</div>
            <div class="info-row">地点：厦门市稿定剧院</div>
            
            <div class="date-row">
                <span class="date-label">DATE.</span>
                <span class="date-main">12.20<span class="date-sub">SUN</span></span>
                <span class="separator">/</span>
                <span class="date-main">12.30<span class="date-sub">SAT</span></span>
            </div>

            <div class="info-row phone-row">联系电话：0592-8888888</div>
        </div>

        <!-- Landscape Placeholder -->
        <div class="landscape-placeholder">
            <div class="mountain-1"></div>
            <div class="mountain-2"></div>
            <div class="mountain-3"></div>
            <div class="tree-silhouette"></div>
            <div class="birds">✈ ✈ ✈</div>
            <div class="caption">[Ink Wash Landscape Illustration]</div>
        </div>

    </div>

</body>
</html>
