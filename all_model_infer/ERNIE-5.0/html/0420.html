<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习建议</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #fff;
            color: #333;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 48px;
            color: #5b9bd5; /* Approximate blue */
            text-shadow: 2px 2px 0px #f4b183; /* Approximate shadow/outline effect */
            margin: 0;
            display: inline-block;
            position: relative;
            z-index: 2;
        }

        .header-decoration {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Simulating the cloud/star decorations with CSS shapes/emojis for layout fidelity */
        .cloud-left {
            position: absolute;
            top: -20px;
            left: 20%;
            font-size: 30px;
            color: #f4b183;
        }
        .star-top {
            position: absolute;
            top: -30px;
            left: 45%;
            font-size: 20px;
            color: #ffeb3b;
        }
        .wave-bottom {
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #f4b183,
                #f4b183 10px,
                #fff 10px,
                #fff 20px
            );
            opacity: 0.5;
        }

        .section {
            margin-bottom: 50px;
            position: relative;
        }

        .section-number {
            font-size: 24px;
            color: #8e44ad; /* Purple */
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 20px;
            color: #8e44ad;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }

        .content-text {
            font-size: 18px;
            margin-bottom: 10px;
            text-align: justify;
        }

        .highlight-yellow {
            background-color: #fff59d;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        .highlight-red {
            color: #d32f2f;
            font-weight: bold;
        }

        .attribution {
            text-align: right;
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }

        .cartoon-container {
            position: absolute;
            bottom: -60px;
            right: 0;
            width: 100px;
            height: 120px;
        }
        
        .cartoon-placeholder {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-decoration">
            <span class="cloud-left">☁️</span>
            <span class="star-top">✨</span>
        </div>
        <h1>学习建议</h1>
        <div class="wave-bottom"></div>
    </div>

    <div class="section">
        <span class="section-number">09</span>
        <span class="section-title">「教材远比练习册重要」</span>
        
        <p class="content-text">教材远比练习册重要。</p>
        
        <p class="content-text highlight-yellow">
            教材就是我们做题之前所要构建的一个框架，先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。
        </p>

        <div class="attribution">
            ——陈哲峰(被北京大学物理学院录取)
        </div>
    </div>

    <div class="section" style="position: relative; min-height: 200px;">
        <span class="section-number">10</span>
        <span class="section-title">「有关数学与英语的学习方法」</span>
        
        <p class="content-text">
            数学压轴大题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。
        </p>
        
        <p class="content-text">
            我要保证的，<span class="highlight-red">不是做出难题，而是做到容易题不丢分，难题多得分</span>。最后，我数学只有压轴题扣了分。
        </p>

        <div class="cartoon-container">
            <div class="cartoon-placeholder">
                [Cartoon Character Holding Banner]
            </div>
        </div>
    </div>

</body>
</html>
