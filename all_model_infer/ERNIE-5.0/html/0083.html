<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Photo Exhibition - In The Blink Of An Eye</title>
    <style>
        :root {
            --bg-color: #d1d1d1;
            --text-color: #000000;
            --font-main: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-serif: "Songti SC", "SimSun", "STSong", serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-main);
        }

        .poster {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 800px;
            aspect-ratio: 3/4;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Top Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header-left h1 {
            font-size: 32px;
            margin: 0;
            line-height: 1;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .header-center {
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            line-height: 1.2;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .header-right {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 4px;
            height: 100px;
        }

        /* Divider Line */
        .divider-top {
            border-top: 2px solid #000;
            margin: 20px 0 40px 0;
            width: 100%;
        }

        /* Main Content Grid */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
            align-content: start;
        }

        .title-block-left {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .big-char-left {
            font-family: var(--font-serif);
            font-size: 140px;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -5px;
            margin-bottom: 20px;
        }

        .artist-info {
            margin-top: 20px;
        }

        .artist-label {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .artist-names {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .date {
            font-size: 60px;
            font-weight: 700;
            font-family: var(--font-main);
        }

        .title-block-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .english-title {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: right;
        }

        .big-char-right {
            font-family: var(--font-serif);
            font-size: 140px;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -5px;
            text-align: right;
            margin-top: auto; /* Push to bottom */
        }

        /* Divider Line Bottom */
        .divider-bottom {
            border-top: 2px solid #000;
            margin: 40px 0;
            width: 100%;
        }

        /* Quote Section */
        .quote-section {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: left;
        }

        /* Footer Section */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 16px;
            font-weight: 500;
            border-top: 1px solid rgba(0,0,0,0.1); /* Very faint line if any, actually looks like just text */
            padding-top: 10px;
        }
        
        .footer-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .footer-logo {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .xiaohongshu-logo {
            position: absolute;
            bottom: 60px;
            right: 40px;
            background: white;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #ff2442;
            border: 1px solid #ddd;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .poster {
                padding: 20px;
                aspect-ratio: auto;
                height: auto;
            }
            .header {
                flex-direction: column;
                gap: 20px;
            }
            .header-right {
                writing-mode: horizontal-tb;
                height: auto;
            }
            .main-content {
                grid-template-columns: 1fr;
            }
            .big-char-left, .big-char-right {
                font-size: 80px;
                text-align: center;
            }
            .english-title {
                text-align: center;
                font-size: 28px;
            }
            .title-block-right {
                flex-direction: column-reverse;
            }
            .footer {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="poster">
        <!-- Top Header -->
        <header class="header">
            <div class="header-left">
                <h1>藝術</h1>
                <h1>攝影展</h1>
            </div>
            <div class="header-center">
                ARTIST<br>
                PHOTO<br>
                EXHIBITION
            </div>
            <div class="header-right">
                定格光影
            </div>
        </header>

        <div class="divider-top"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="title-block-left">
                <div class="big-char-left">瞬息</div>
                
                <div class="artist-info">
                    <div class="artist-label">藝術家</div>
                    <div class="artist-names">森蘭 王沐春</div>
                </div>

                <div class="date">08/14</div>
            </div>

            <div class="title-block-right">
                <div class="english-title">
                    IN THE<br>
                    BLINK OF<br>
                    AN EYE
                </div>
                <div class="big-char-right">之間</div>
            </div>
        </main>

        <div class="divider-bottom"></div>

        <!-- Quote -->
        <section class="quote-section">
            IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
            YOU'RE NOT CLOSE ENOUGH. I ALWAYS SHOOT<br>
            EVERYTHING IN MY MIND AS AN EXERCISE.
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-info">
                <span>活動地址：濱江路西溪街二十七號</span>
                <span>|</span>
                <span>主辦單位：壹晝咖啡館</span>
            </div>
            <div class="footer-logo">
                ONE COFFEE
            </div>
        </footer>

        <div class="xiaohongshu-logo">小红书</div>
    </div>

</body>
</html>
