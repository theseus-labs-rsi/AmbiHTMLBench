<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After the Hunt Movie Poster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f1ea; /* Off-white background */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster-container {
            width: 600px;
            height: 900px;
            background-color: #f4f1ea;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Tagline */
        .tagline {
            position: absolute;
            top: 30px;
            left: 40px;
            width: 400px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            z-index: 10;
        }

        /* Main Visual Area Placeholder */
        .visual-area {
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            height: 650px;
            /* Simulating the collage of faces with a placeholder */
            background: linear-gradient(135deg, #dcdcdc 0%, #b0b0b0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            z-index: 1;
        }
        
        /* Simulating the specific layout of faces with CSS shapes/positions roughly */
        .face-placeholder-1 { position: absolute; top: 20px; left: 40px; width: 150px; height: 180px; background: #aaa; border-radius: 50% 50% 0 0; }
        .face-placeholder-2 { position: absolute; top: 40px; right: 60px; width: 180px; height: 200px; background: #bbb; border-radius: 50%; }
        .face-placeholder-3 { position: absolute; top: 180px; right: 40px; width: 160px; height: 190px; background: #999; border-radius: 40% 60% 50% 50%; }
        .face-placeholder-4 { position: absolute; bottom: 100px; right: 60px; width: 170px; height: 180px; background: #aaa; border-radius: 40% 40% 50% 50%; }
        .torso-placeholder { position: absolute; bottom: 50px; left: 100px; width: 200px; height: 250px; background: #c2b280; opacity: 0.6; }


        /* Title Box */
        .title-box {
            position: absolute;
            top: 280px;
            left: 50px;
            width: 320px;
            background-color: #f4f1ea; /* Matches poster bg to look like a cutout or overlay */
            border: 1px solid #c5a065; /* Gold-ish border */
            padding: 20px;
            z-index: 20;
            text-align: center;
        }

        .director-top {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #333;
        }

        .main-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 36px;
            line-height: 1.2;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #1a1a1a;
            margin: 0;
            font-weight: 400;
        }

        .credits {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            color: #333;
            line-height: 1.4;
        }

        /* Cast List */
        .cast-list {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        .cast-name {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a1a1a;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .release-date {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b5a2b; /* Brownish color */
            font-weight: 700;
        }

        .rating-box {
            border: 2px solid #333;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            width: 20px;
            text-align: center;
        }
        
        .rating-label {
            font-size: 8px;
            display: block;
            line-height: 1;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Top Tagline -->
        <div class="tagline">
            Not everything is supposed to make you comfortable.
        </div>

        <!-- Visual Area (Placeholders for the collage images) -->
        <div class="visual-area">
            <div class="face-placeholder-1"></div>
            <div class="face-placeholder-2"></div>
            <div class="face-placeholder-3"></div>
            <div class="face-placeholder-4"></div>
            <div class="torso-placeholder"></div>
            <!-- Text inside placeholder to describe what would be there -->
            <span style="position:absolute; bottom: 10px; right: 10px; font-size: 10px; opacity: 0.5;">[Collage of Characters]</span>
        </div>

        <!-- Title Box -->
        <div class="title-box">
            <div class="director-top">Luca Guadagnino's</div>
            <h1 class="main-title">
                After<br>The<br>Hunt
            </h1>
            <div class="credits">
                Directed by Luca Guadagnino<br>
                Written by Nora Garrett
            </div>
        </div>

        <!-- Cast List -->
        <div class="cast-list">
            <div class="cast-name">Julia Roberts</div>
            <div class="cast-name">Ayo Edebiri</div>
            <div class="cast-name">Andrew Garfield</div>
            <div class="cast-name">Michael Stuhlbarg</div>
            <div class="cast-name">Chloe Sevigny</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="rating-box">
                <span class="rating-label">RESTRICTED</span>
                R
            </div>
            <div class="release-date">
                Only in theaters<br>October
            </div>
        </div>
    </div>

</body>
</html>
