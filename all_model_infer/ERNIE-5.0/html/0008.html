<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔吉拉的面具 - 物品描述</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simulating the game background scene */
        .game-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2b2b2b, #111);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 100px;
        }

        /* Placeholder for the character and chest in the background */
        .scene-content {
            width: 600px;
            height: 400px;
            position: relative;
            opacity: 0.6;
        }
        
        .chest-placeholder {
            position: absolute;
            bottom: 20px;
            right: 100px;
            width: 120px;
            height: 80px;
            background-color: #4a6b5d;
            border: 2px solid #2f4a3f;
            border-radius: 4px;
        }

        .character-placeholder {
            position: absolute;
            bottom: 20px;
            left: 200px;
            width: 60px;
            height: 100px;
            background-color: #d4af37; /* Gold-ish for Link */
            border-radius: 10px 10px 0 0;
        }

        /* The main UI Box */
        .ui-container {
            position: relative;
            z-index: 10;
            width: 640px;
            height: 220px;
            /* border: 2px solid white; Debug border */
        }

        .item-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 560px;
            height: 180px;
            background-color: rgba(20, 20, 20, 0.85);
            border: 2px solid #888;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            display: flex;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Decorative border effect */
        .item-box::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #555;
            pointer-events: none;
        }

        .item-icon {
            width: 100px;
            height: 100px;
            background-color: #333;
            margin-right: 20px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
            position: relative;
        }
        
        /* Simulating the mask image */
        .mask-graphic {
            width: 60px;
            height: 70px;
            background: radial-gradient(circle, #ffcc00 20%, #cc0000 80%);
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: 0 0 10px #ff0000;
        }
        .mask-graphic::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10px;
            width: 40px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            box-shadow: inset 0 0 5px #fff;
        }

        .item-details {
            flex-grow: 1;
            color: #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
            text-shadow: 1px 1px 2px #000;
        }

        .item-count {
            font-size: 18px;
            color: #ffd700;
            display: flex;
            align-items: center;
        }
        
        .count-icon {
            width: 20px;
            height: 20px;
            background-color: #ffd700;
            border-radius: 50%;
            margin-right: 5px;
            display: inline-block;
        }

        .item-description {
            font-size: 16px;
            line-height: 1.6;
            color: #ddd;
            text-shadow: 1px 1px 1px #000;
        }

        .item-prompt {
            text-align: right;
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .button-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #555;
            border-radius: 4px;
            margin-left: 8px;
            border: 1px solid #777;
            position: relative;
        }
        
        .button-icon::after {
            content: 'A';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="game-scene">
        <div class="scene-content">
            <div class="character-placeholder"></div>
            <div class="chest-placeholder"></div>
        </div>
    </div>

    <div class="ui-container">
        <div class="item-box">
            <div class="item-icon">
                <div class="mask-graphic"></div>
            </div>
            <div class="item-details">
                <div>
                    <div class="item-header">
                        <span class="item-title">魔吉拉的面具</span>
                        <span class="item-count">
                            <span class="count-icon"></span> 1
                        </span>
                    </div>
                    <div class="item-description">
                        从太古时期流传下来的面具。<br>
                        戴上它的话，有些怪物就不容易发现自己。<br>
                        这样的珍品并非轻易就能得到。
                    </div>
                </div>
                <div class="item-prompt">
                    打开箱子 <span class="button-icon"></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
