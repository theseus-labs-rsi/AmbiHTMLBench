<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .mobile-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            color: #333;
            cursor: pointer;
        }

        .section {
            margin-bottom: 30px;
        }

        .badge-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge-num {
            background-color: #ffccbc;
            color: #d84315;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #5e35b1; /* Approximate purple color */
        }

        .section-text {
            font-size: 15px;
            color: #444;
            text-align: justify;
        }

        .large-graphic-section {
            text-align: center;
            margin: 40px 0;
        }

        .big-number {
            font-size: 48px;
            font-weight: bold;
            color: #5e35b1;
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        .superscript-box {
            position: absolute;
            top: -5px;
            right: -15px;
            background-color: #5e35b1;
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 2px;
            font-weight: normal;
        }

        .graphic-title-box {
            display: inline-block;
            border: 2px solid #5e35b1;
            color: #5e35b1;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .purple-badge {
            background-color: #5e35b1;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .instruction-text {
            font-size: 15px;
            margin-bottom: 15px;
        }

        ol {
            padding-left: 20px;
        }

        li {
            margin-bottom: 15px;
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }

        .dosage {
            font-family: monospace; /* Slightly distinct for numbers if needed, but standard is fine */
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Status Bar Simulation -->
        <div class="status-bar">
            <span>5G</span>
            <span>19:43</span>
        </div>

        <div class="close-btn">×</div>

        <!-- Section 1 -->
        <div class="section">
            <div class="badge-container">
                <div class="badge-num">5</div>
                <div class="section-title">月经来潮需停药</div>
            </div>
            <div class="section-text">
                药物推迟月经可能会失败，服药过程中如月经来潮需停药。
            </div>
        </div>

        <!-- Section 2 -->
        <div class="large-graphic-section">
            <div class="big-number">
                2
                <span class="superscript-box">期</span>
            </div>
            <div class="graphic-title-box">缓解痛经</div>
        </div>

        <div class="section">
            <div class="section-text">
                如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。
            </div>
        </div>

        <!-- Common Schemes -->
        <div class="section">
            <div class="purple-badge">常用方案</div>
            <div class="section-text">
                痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。
            </div>
            <div class="instruction-text">
                以下三种方法，选其中一种方法即可：
            </div>

            <ol>
                <li>
                    布洛芬 首剂 800 mg，之后根据需要 400 ~ 800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。
                </li>
                <li>
                    甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。
                </li>
            </ol>
        </div>
    </div>

</body>
</html>
