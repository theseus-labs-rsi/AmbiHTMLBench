<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 20px;
            line-height: 1.5;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 20px;
            color: #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px 5px;
            text-align: center;
            word-break: break-all;
        }

        th {
            background-color: #f2f4f7;
            font-weight: normal;
            color: #333;
        }

        /* Column Widths approximation */
        th:nth-child(1), td:nth-child(1) { width: 5%; }
        th:nth-child(2), td:nth-child(2) { width: 15%; }
        th:nth-child(3), td:nth-child(3) { width: 10%; }
        th:nth-child(4), td:nth-child(4) { width: 25%; }
        th:nth-child(5), td:nth-child(5) { width: 15%; }
        th:nth-child(6), td:nth-child(6) { width: 30%; }

        /* Specific row background colors based on image */
        tr:nth-child(3) td {
            background-color: #eef6fc;
        }
        
        tr:nth-child(5) td {
            background-color: #eef6fc;
        }

        tr:nth-child(1) th {
            background-color: #f0f4f8;
        }

    </style>
</head>
<body>

    <h1>一月-任务</h1>

    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>任务描述</th>
                <th>岗位</th>
                <th>操作动作</th>
                <th>开始时间</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>租厂房</td>
                <td>总经理</td>
                <td>申请60w 租厂房</td>
                <td>1月1日</td>
                <td>花60w租A厂房</td>
            </tr>
            <tr>
                <td>2</td>
                <td>资质开发</td>
                <td>总经理</td>
                <td>P3资质开发</td>
                <td>1月1日</td>
                <td>申请20w 资质开发</td>
            </tr>
            <tr>
                <td>3</td>
                <td>批拨款</td>
                <td>财务</td>
                <td>批准</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>支付管理费</td>
                <td>财务</td>
                <td>5w管理费</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>5</td>
                <td>建设生产线</td>
                <td>生产</td>
                <td>4条自动线生产P3</td>
                <td>1月1日</td>
                <td>申请200w资金建线</td>
            </tr>
            <tr>
                <td>6</td>
                <td>iso开发</td>
                <td>总经理</td>
                <td>两个iso的开发</td>
                <td>1月1日</td>
                <td>申请资金开发</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
