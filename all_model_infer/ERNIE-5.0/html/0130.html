        <!-- First Paragraph -->
        <div class="content-block">
            <p>采用这种坐姿的人大多比较内敛，性格上不太主动，随波逐流，没有太多的规划。他们的心理年龄比较小，会给人一种幼稚单纯的感觉，不过也很善良。这种人往往有着非常生动的想象力，内心世界很丰富，有着有趣的灵魂。深入接触以后会给人一种自在舒适的体验。</p>
        </div>

        <!-- Second Paragraph -->
        <div class="content-block">
            <p>这类人在爱情中往往处于被动的一方，不太会表达自己的感受，需要别人照顾，喜欢成熟一点的异性。他们一旦付出真情实感，就很容易全身心投入，也经常受伤。但是他们有时候又很自我对自己没有兴趣的异性完全不会给他们面子。如果遇到了合适的人，他们会很幸福，在婚姻中也属于被照顾的一方，完全不用操心。</p>
