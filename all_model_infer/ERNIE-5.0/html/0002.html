<!DOCTYPE html>
<html lang="ja">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江戸時代のやきもの - 湯木美術館</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Yu Mincho", "Hiragino Mincho ProN", "MS PMincho", serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .poster-container {
            background-color: #fff;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: row;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Left Column: Text Content */
        .left-column {
            flex: 1.2;
            padding: 40px 30px 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .main-title {
            font-size: 72px;
            line-height: 1.1;
            margin: 20px 0;
            font-weight: normal;
            letter-spacing: 0.05em;
        }

        .english-subtitle {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        .body-text {
            font-size: 24px;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .date-text {
            font-size: 16px;
            margin-bottom: 40px;
        }

        .footer-info {
            font-size: 12px;
            line-height: 1.6;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer-info strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        /* Right Column: Images */
        .right-column {
            flex: 1;
            background-color: #2b5d6e; /* Dark teal background for top section */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .image-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
        }

        .ceramic-item {
            width: 80%;
            height: 120px;
            background-color: #fff;
            border-radius: 50%; /* Most are bowls */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        /* Specific shapes for placeholders */
        .ceramic-item.bowl-1 { border-radius: 40% 60% 50% 50% / 60% 60% 40% 40%; }
        .ceramic-item.bowl-2 { border-radius: 50%; }
        .ceramic-item.bowl-3 { width: 60%; height: 80px; border-radius: 50%; background-color: #a8d5ba; } /* Greenish */
        
        .caption {
            position: absolute;
            bottom: -25px;
            font-size: 10px;
            color: #fff;
            white-space: nowrap;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
        }

        .bottom-section {
            background-color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-grow: 1;
        }

        .persimmon-dishes {
            display: flex;
            gap: 10px;
        }

        .small-dish {
            width: 60px;
            height: 60px;
            background-color: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6b6b;
            font-size: 10px;
        }

        .large-bowl-container {
            width: 140px;
            height: 140px;
            background-color: #e8dccf;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4c4b0;
        }
        
        .large-bowl-inner {
            width: 80%;
            height: 60%;
            background-color: #f4eadd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #888;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .poster-container {
                flex-direction: column;
            }
            .right-column {
                background-color: #fff;
                order: -1; /* Images on top for mobile? Or keep text first. Let's keep text first. */
            }
            .image-strip {
                flex-direction: row;
                flex-wrap: wrap;
                background-color: #2b5d6e;
                padding: 10px;
            }
            .ceramic-item {
                width: 45%;
                height: 100px;
            }
            .bottom-section {
                background-color: #fff;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Left Column: Text -->
        <div class="left-column">
            <div>
                <div class="header-text">
                    ひと目でわかる京焼300年の歴史<br>
                    平成29年春季展
                </div>
                
                <h1 class="main-title">江戸<br>時代の<br>やきもの</h1>
                
                <div class="english-subtitle">Ceramics of the Edo Period</div>
                
                <div class="body-text">
                    仁清・乾山窯と<br>
                    後期京焼の<br>
                    食器を中心に
                </div>
                
                <div class="date-text">
                    平成29年4月8日(土)～7月30日(日)
                </div>
            </div>

            <div class="footer-info">
                公益財団法人<br>
                <strong>湯木美術館</strong>
                YUKI MUSEUM OF ART<br>
                〒541-0044 大阪市中央区平野町3-5-9<br>
                TEL.06-6241-0148 FAX.06-6241-3596<br>
                http://www.yuki-museum.or.jp
            </div>
        </div>

        <!-- Right Column: Images -->
        <div class="right-column">
            <div class="image-strip">
                <!-- Image 1 -->
                <div class="ceramic-item bowl-1">
                    <div style="width: 80%; height: 60%; background: #eee; border-radius: 50%;"></div>
                    <div class="caption">乾山写 色絵四季草花文鉢</div>
                </div>
                
                <!-- Image 2 -->
                <div class="ceramic-item bowl-2">
                    <div style="width: 70%; height: 70%; background: #fff; border: 1px solid #ccc; border-radius: 50%; position: relative;">
                        <div style="position: absolute; top: 20%; left: 20%; width: 20px; height: 20px; background: green; border-radius: 50%;"></div>
                        <div style="position: absolute; top: 40%; right: 20%; width: 20px; height: 20px; background: green; border-radius: 50%;"></div>
                    </div>
                    <div class="caption">仁清写 色絵藤葉文鉢</div>
                </div>

                <!-- Image 3 -->
                <div class="ceramic-item bowl-3">
                    <div style="width: 60%; height: 60%; background: #8fbc8f; border-radius: 50%;"></div>
                    <div class="caption">乾山 青磁小鉢</div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="persimmon-dishes">
                    <div class="small-dish">柿</div>
                    <div class="small-dish">柿</div>
                </div>
                <div class="large-bowl-container">
                    <div class="large-bowl-inner">
                        [Large Bowl Image]
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
