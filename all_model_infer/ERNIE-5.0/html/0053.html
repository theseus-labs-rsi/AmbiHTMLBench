<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为什么选择新概念动画版?</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        h1 {
            text-align: center;
            color: #f39c12;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 25px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 15px;
        }

        .section:last-of-type {
            border-bottom: none;
        }

        .section-title {
            color: #c0392b;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .section-title span {
            margin-right: 10px;
        }

        .section-content {
            font-size: 1.1rem;
            color: #444;
            padding-left: 10px;
        }

        .icon {
            font-size: 1.2rem;
            margin-right: 5px;
            vertical-align: middle;
        }

        .book-image-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 250px;
            background-color: #ddd;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #666;
            font-weight: bold;
            z-index: 10;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            transform: rotate(-5deg);
        }
        
        /* Simulating the book covers visually with CSS gradients/borders since I can't use external images */
        .book-mockup {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2ecc71 0%, #27ae60 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            color: white;
        }
        .book-spine {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 20px;
            background: #1abc9c;
            border-right: 1px solid #16a085;
        }
        .book-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            text-shadow: 1px 1px 2px black;
        }
        .book-circles {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
        }

        @media (max-width: 600px) {
            .book-image-container {
                position: static;
                margin: 20px auto;
                transform: none;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>为什么选择新概念动画版?</h1>

    <div class="section">
        <div class="section-title">
            <span>一、无需死记硬背</span>
        </div>
        <div class="section-content">
            打破枯燥学习方式 <span class="icon">😅</span>，用动画通俗易懂掌握听说读写能力
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>二、融入生活场景</span>
        </div>
        <div class="section-content">
            <span class="icon">👉</span> 加入幽默段子、人文历史，生动形象又很好理解
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>三、螺旋式教学</span>
        </div>
        <div class="section-content">
            从基础层层提高，不怕孩子基础差跟不上 <span class="icon">👍</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>四、闭环学习</span>
        </div>
        <div class="section-content">
            <span class="icon">👉</span> 预热→精讲→巩固→个性报告<br>
            “听说读写练”覆盖式讲解，看完有题干巩固基础
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>五、内容优质放心</span>
        </div>
        <div class="section-content">
            有多年经验，《新概念英语》原创班底深度参与，原汁原味诠释精髓 <span class="icon">👌</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">
            <span>六、时间恰当</span>
        </div>
        <div class="section-content">
            每天只需花20min <span class="icon">🕒</span> 左右防止时间过长产生厌恶感
        </div>
    </div>

    <!-- Placeholder for the book image at bottom right -->
    <div class="book-image-container">
        <div class="book-mockup">
            <div class="book-spine"></div>
            <div class="book-title">新概念英语<br>NEW CONCEPT ENGLISH</div>
            <div class="book-circles">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            <div style="font-size: 3rem; font-weight: bold; text-align: center;">1</div>
        </div>
    </div>
</div>

</body>
</html>
