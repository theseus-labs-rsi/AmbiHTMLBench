<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Layout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff;
            color: #333;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        li {
            margin-bottom: 8px;
            position: relative;
        }

        /* Top level item styling */
        .level-1 {
            color: #b56565; /* Reddish brown color from image */
            font-weight: 500;
            font-size: 1.1em;
            list-style: none; /* Remove bullet for the main header if desired, but image has a bullet */
            padding-left: 0;
        }
        
        /* Re-adding bullet for the top item to match image exactly */
        .level-1::before {
            content: "•";
            color: #b56565;
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: -1em;
        }

        .level-1 > span {
            margin-left: 1em;
        }

        /* Dropdown arrow simulation */
        .arrow {
            position: absolute;
            right: 0;
            top: 2px;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
        }

        /* Indentation adjustments */
        .indent-1 {
            padding-left: 25px;
        }
        
        .indent-2 {
            padding-left: 45px;
        }

        /* Specific text styling */
        .text-content {
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <ul>
        <!-- Top Level Item -->
        <li class="level-1">
            <span class="text-content">第三阶段 认识自我，找到自我</span>
            <span class="arrow">▼</span>
            
            <!-- Second Level -->
            <ul class="indent-1">
                <li>
                    <span class="text-content">不同国家的妆容模仿</span>
                    <span class="arrow">▼</span>
                    
                    <!-- Third Level -->
                    <ul class="indent-2">
                        <li><span class="text-content">不同国家妆容特点分析</span></li>
                        <li><span class="text-content">逐个部位模仿</span></li>
                    </ul>
                </li>
                
                <li>
                    <span class="text-content">明星出圈妆容模仿</span>
                    <span class="arrow">▼</span>
                    
                    <!-- Third Level -->
                    <ul class="indent-2">
                        <li><span class="text-content">鞠婧祎妆容</span></li>
                        <li><span class="text-content">虞书欣妆容</span></li>
                        <li><span class="text-content">宋慧乔妆容</span></li>
                        <li><span class="text-content">女团妆容</span></li>
                        <li><span class="text-content">日本杂志妆容</span></li>
                    </ul>
                </li>

                <li>
                    <span class="text-content">找到适合自己的风格和妆容</span>
                    <span class="arrow">▼</span>
                    
                    <!-- Third Level -->
                    <ul class="indent-2">
                        <li><span class="text-content">根据自己的穿衣风格，职业，谈吐等确定自己适合的风格</span></li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</div>

</body>
</html>
