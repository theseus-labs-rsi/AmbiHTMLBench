<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022--2023学年第二学期 小学语文期末质量分析会</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f0f8ff; /* Light blue background */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slide-container {
            width: 900px;
            height: 700px;
            background-color: #fff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Decorative Leaves */
        .leaf-top-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,90 Q30,10 90,10 L90,30 Q40,30 30,90 Z" fill="%234CAF50" opacity="0.6"/></svg>'); 
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 1;
        }

        .leaf-bottom-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 250px;
            height: 250px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10,10 Q90,10 90,90 L70,90 Q70,30 10,30 Z" fill="%238BC34A" opacity="0.6"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding-top: 40px;
            position: relative;
            z-index: 2;
        }

        .date {
            font-size: 20px;
            color: #006064;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .main-title {
            font-size: 36px;
            color: #006064;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 2px;
            font-family: "KaiTi", "STKaiti", serif;
        }

        .sub-title {
            font-size: 28px;
            color: #d32f2f;
            font-weight: bold;
            margin: 20px 0;
            font-family: "KaiTi", "STKaiti", serif;
        }

        .info-text {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
        }

        .watermark {
            position: absolute;
            color: rgba(0,0,0,0.1);
            font-size: 24px;
            font-weight: bold;
            transform: rotate(-45deg);
            z-index: 0;
        }
        .wm-1 { top: 60px; right: 100px; }
        .wm-2 { top: 200px; left: 50px; }
        .wm-3 { bottom: 250px; left: 200px; }

        /* Middle Section */
        .middle-section {
            text-align: center;
            margin-top: 40px;
            position: relative;
            z-index: 2;
        }

        .middle-title {
            font-size: 24px;
            color: #006064;
            font-weight: bold;
            border-bottom: 2px solid #b2dfdb;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Bottom Grid Section */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px 40px 40px 40px;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }

        .card {
            border: 1px solid #009688;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .card-header {
            background-color: #009688;
            color: white;
            text-align: center;
            padding: 10px 5px;
            font-size: 16px;
            font-weight: bold;
        }

        .card-body {
            padding: 15px 10px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            text-align: justify;
            flex-grow: 1;
        }

    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Decorative Elements -->
        <div class="leaf-top-right"></div>
        <div class="leaf-bottom-left"></div>

        <!-- Watermarks -->
        <div class="watermark wm-1">@海淀小萌</div>
        <div class="watermark wm-2">@海淀小萌</div>
        <div class="watermark wm-3">@海淀小萌</div>

        <!-- Header -->
        <div class="header">
            <div class="date">2022--2023学年第二学期</div>
            <div class="main-title">追光而遇有思 沐光而行致远</div>
            <div class="sub-title">小学语文期末质量分析会</div>
            <div class="info-text">
                红薯街道实验XXXX<br>
                海淀小萌
            </div>
        </div>

        <!-- Middle -->
        <div class="middle-section">
            <div class="middle-title">期末考试成绩</div>
        </div>

        <!-- Bottom Grid -->
        <div class="bottom-grid">
            <!-- Card 1 -->
            <div class="card">
                <div class="card-header">注重基础和积累</div>
                <div class="card-body">
                    尤其是古诗文和名言警句积累占的比例很大，反映了对传统文化的重视。
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <div class="card-header">重视运用</div>
                <div class="card-body">
                    突出能力，重视运用。阅读题体现了核心素养中重视思维发展与提升的要求。
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <div class="card-header">联系生活原则</div>
                <div class="card-body">
                    写作的安排正是学生生活中外出的经历，易于选材，适合个性发展。
                </div>
            </div>

            <!-- Card 4 -->
            <div class="card">
                <div class="card-header">难易程度适中</div>
                <div class="card-body">
                    只要认真积累和复习的孩子基本上可以取得不错的成绩。
                </div>
            </div>
        </div>
    </div>

</body>
</html>
