<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长需要关注什么</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --header-bg: #e8e4d9;
            --accent-green: #6b8e86;
            --text-dark: #333333;
            --text-light: #666666;
            --badge-bg: #e0d8c8;
            --border-color: #dcdcdc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Songti SC", "SimSun", "STSong", serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header {
            background-color: var(--header-bg);
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #dcdcdc;
        }

        .header-graphic {
            width: 200px;
            height: 200px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }
        
        /* Simulating the deer image space */
        .deer-placeholder {
            width: 180px;
            height: 180px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="50" font-size="10" text-anchor="middle" fill="%23999">Deer Illustration</text></svg>') no-repeat center;
            background-size: contain;
            position: absolute;
            left: 20px;
            top: 20px;
        }

        .header-title-block {
            flex: 1;
            padding-left: 20px;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e35;
            margin: 0;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 10px;
            letter-spacing: 5px;
        }

        .seal {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            background-color: #c0392b;
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-5deg);
            opacity: 0.8;
        }

        /* Content Sections */
        .content-section {
            padding: 40px 20px;
            border-bottom: 1px solid #eee;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: start;
        }

        .text-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .text-item {
            display: flex;
            align-items: flex-start;
        }

        .badge {
            background-color: var(--badge-bg);
            color: #555;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            margin-right: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .text-content {
            font-size: 15px;
            color: #444;
            line-height: 1.8;
        }

        .text-content strong {
            font-weight: bold;
        }

        /* Central Circle */
        .center-circle {
            width: 140px;
            height: 140px;
            border: 3px solid #8b5a2b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #fdfbf7;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        /* Simulating the meander pattern border roughly */
        .center-circle::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px dashed #cfaa7e;
            border-radius: 50%;
        }

        .circle-text {
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            z-index: 2;
        }

        /* Specific adjustments for the right column text alignment */
        .text-column.right {
            align-items: flex-end; /* Align items to the right side of the column */
            text-align: right;
        }
        
        .text-column.right .text-item {
            flex-direction: row-reverse; /* Put badge on the right */
        }
        
        .text-column.right .badge {
            margin-right: 0;
            margin-left: 15px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .grid-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .text-column.right {
                align-items: flex-start;
                text-align: left;
            }
            .text-column.right .text-item {
                flex-direction: row;
            }
            .text-column.right .badge {
                margin-left: 0;
                margin-right: 15px;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-title-block {
                padding-left: 0;
                margin-top: 20px;
            }
            .deer-placeholder {
                position: relative;
                left: auto;
                top: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="header">
        <div class="header-graphic">
            <div class="deer-placeholder"></div>
        </div>
        <div class="header-title-block">
            <h1 class="main-title">家长需要关注什么</h1>
            <div class="sub-title">章 · 节 · 肆</div>
        </div>
        <div class="seal">印</div>
    </header>

    <!-- Middle Section: How to view grades -->
    <section class="content-section">
        <div class="grid-layout">
            <!-- Left Column -->
            <div class="text-column">
                <div class="text-item">
                    <span class="badge">壹</span>
                    <div class="text-content">
                        看单科成绩<br>
                        分析优势与劣势科目
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">贰</span>
                    <div class="text-content">
                        看进步<br>
                        横向整体水平<br>
                        纵向看进退情况
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">叁</span>
                    <div class="text-content">
                        分析错题
                    </div>
                </div>
            </div>

            <!-- Center Circle -->
            <div class="center-circle">
                <div class="circle-text">成绩怎么看</div>
            </div>

            <!-- Right Column -->
            <div class="text-column right">
                <div class="text-item">
                    <span class="badge">肆</span>
                    <div class="text-content">
                        分析题错：<br>
                        是遗憾丢分？是模糊丢分？<br>
                        是不会做丢分？<br>
                        策略：消除遗憾、纠正模糊、力争突破
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">伍</span>
                    <div class="text-content">
                        分析考试技巧<br>
                        策略是否得当？<br>
                        是否按标准答题？<br>
                        是否摆正心态？
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bottom Section: Parents' 5 Don'ts -->
    <section class="content-section" style="border-bottom: none;">
        <div class="grid-layout">
            <!-- Left Column -->
            <div class="text-column">
                <div class="text-item">
                    <span class="badge">壹</span>
                    <div class="text-content">
                        不要过度焦虑
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">贰</span>
                    <div class="text-content">
                        不要过度关注孩子
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">叁</span>
                    <div class="text-content">
                        不要给孩子过高的期望
                    </div>
                </div>
            </div>

            <!-- Center Circle -->
            <div class="center-circle">
                <div class="circle-text">家长五不要</div>
            </div>

            <!-- Right Column -->
            <div class="text-column right">
                <div class="text-item">
                    <span class="badge">肆</span>
                    <div class="text-content">
                        不要过度唠叨
                    </div>
                </div>
                <div class="text-item">
                    <span class="badge">伍</span>
                    <div class="text-content">
                        不要盲目攀比和迷信
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
