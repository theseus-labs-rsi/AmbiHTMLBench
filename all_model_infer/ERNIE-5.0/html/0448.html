<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际博物馆日 International Museum Day</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f4f1ea;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            position: relative;
        }
        .header {
            grid-column: 1 / -1;
            text-align: center;
            border-bottom: 2px solid #8b4513;
            padding-bottom: 20px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #8b4513;
            letter-spacing: 5px;
            font-weight: bold;
        }
        .header h2 {
            font-size: 1.5rem;
            margin: 5px 0 0 0;
            color: #d2691e;
            font-weight: normal;
            letter-spacing: 2px;
        }
        .header .seal {
            display: inline-block;
            border: 3px solid #8b0000;
            color: #8b0000;
            padding: 5px 10px;
            font-size: 1.2rem;
            transform: rotate(-5deg);
            margin-top: 10px;
            font-family: "KaiTi", "楷体", serif;
        }
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 1.2rem;
        }
        .date-block {
            margin-bottom: 30px;
        }
        .date-block .label {
            font-size: 1rem;
            color: #666;
        }
        .date-block .value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            height: 150px;
            letter-spacing: 5px;
        }
        .small-vase {
            width: 60px;
            height: 60px;
            background-color: #e0e0e0;
            margin: 0 auto 30px auto;
            border-radius: 5px;
        }
        .bottom-text {
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }
        .center-col {
            position: relative;
        }
        .main-image-placeholder {
            width: 100%;
            height: 500px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #777;
            border: 1px solid #ccc;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23f0f0f0" width="100" height="100"/><path d="M50 10 L90 90 L10 90 Z" fill="%23e0e0e0" stroke="%23ccc" stroke-width="2"/></svg>');
            background-size: cover;
        }
        .right-col {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #444;
            text-align: justify;
            border-left: 1px solid #eee;
            padding-left: 20px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .vertical-text-container {
            height: 500px;
            display: flex;
            justify-content: center;
        }
        .vertical-text {
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #555;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        .footer {
            grid-column: 1 / -1;
            text-align: right;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #333;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .footer span {
            display: block;
            margin-bottom: 5px;
        }
        .footer .highlight {
            font-weight: bold;
            color: #8b4513;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>国际博物馆日</h1>
        <h2>International Museum Day</h2>
        <div class="seal">重读华夏</div>
    </div>

    <div class="left-col">
        <div class="date-block">
            <div class="label">时间：</div>
            <div class="value">2021<br>5/18</div>
        </div>
        <div class="small-vase"></div>
        <div class="bottom-text">
            与历史相遇<br>
            明兴亡
        </div>
    </div>

    <div class="center-col">
        <div class="main-image-placeholder">
            [图片：大型青铜文物]
        </div>
    </div>

    <div class="right-col">
        <div class="vertical-text-container">
            <div class="vertical-text">
                穿越千古<br>
                追梦今古
            </div>
        </div>
    </div>

    <div class="footer">
        <span>国际博物馆日（International Museum Day），是由国际博物馆协会（ICOM）于1977年5月18日创立的。1977年5月18日是第一个国际博物馆日。每年的5月18日是国际博物馆日。2021年国际博物馆日的主题是‘博物馆的未来：恢复与重塑’（The Future of Museums: Recover and Reimagine）。
        </span>
        <span class="highlight">打开时代的任意门 DE</span>
    </div>
</div>

</body>
</html>
