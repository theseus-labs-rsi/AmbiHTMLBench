<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>话题、主题意义、主题的联系与区别</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Top Title Box */
        .top-title-box {
            border: 2px solid #333;
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #b5bd68; /* Olive green header */
            color: #333;
            font-weight: bold;
        }

        /* Specific column widths to match visual weight */
        th:nth-child(1), td:nth-child(1) {
            width: 15%;
            background-color: #f0f0f0;
            text-align: left;
            padding-left: 15px;
        }
        
        /* Alternating row colors for readability if needed, though image is mostly white/beige */
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        
        tr:nth-child(odd) {
            background-color: #fff;
        }

        /* Middle Large Text */
        .middle-text {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 30px 0;
            line-height: 1.4;
            color: #000;
        }

        /* Subtitle Box */
        .subtitle-box {
            border: 1px solid #333;
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        /* Diagram Section */
        .diagram-container {
            position: relative;
            height: 300px;
            margin-top: 40px;
            padding-left: 20px;
        }

        .step {
            position: absolute;
            padding: 15px;
            color: white;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            min-width: 200px;
        }

        .step-blue {
            background-color: #4a90e2;
            bottom: 0;
            left: 0;
            width: 300px;
        }

        .step-yellow {
            background-color: #f4d03f;
            bottom: 60px;
            left: 150px;
            width: 350px;
            z-index: 2;
        }

        .step-green {
            background-color: #82e0aa;
            bottom: 120px;
            left: 300px;
            width: 300px;
            z-index: 3;
        }

        .step-label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }
        
        .step-content {
            font-size: 16px;
        }

        .step-sub {
            font-size: 12px;
            font-weight: normal;
            margin-top: 5px;
            display: block;
            opacity: 0.9;
        }

        /* Arrow indicator */
        .arrow-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            border-top: 5px solid #82e0aa;
            border-right: 5px solid #82e0aa;
            transform: rotate(45deg);
            transform-origin: bottom right;
        }

        .citation {
            text-align: right;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            padding-right: 20px;
        }

        /* Utility for table header split cell */
        .split-header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .split-header span:first-child {
            font-size: 12px;
            margin-bottom: 2px;
        }
        .split-header span:last-child {
            font-size: 14px;
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="container">

    <!-- Top Title -->

            </tr>
            <tr>
                <td>表达方式</td>
                <td>直接</td>
                <td>蕴含</td>
                <td>拓展</td>
            </tr>

                <td>语篇的寓意</td>
                <td>语篇寓意所属的范畴</td>
            </tr>
            <tr>

                <td>由语篇内容延伸的普适性（去细节的）</td>
                <td>普遍性</td>
            </tr>
        </tbody>
    </table>

    <!-- Middle Large Text -->
    <div class="middle-text">
        话题，主题意义，主题<br>

    </div>

    <!-- Subtitle Box -->
    <div class="subtitle-box">
        话题、主题意义、主题的联系与区别<br>
        <span style="font-size: 14px;">(学习视角)</span>
    </div>

    <!-- Diagram Section -->
    <div class="diagram-container">
        <!-- Step 1: Blue (Bottom Left) -->
        <div class="step step-blue">
            <span class="step-label">基于语篇的学习为主</span>
            <span class="step-content">话题</span>

        </div>

        <!-- Step 2: Yellow (Middle) -->
        <div class="step step-yellow">
