<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40个「新中式」女装品牌盘点 - 东方优雅熟女篇</title>
    <style>
        :root {
            --primary-text: #333;
            --accent-color: #b55e5e; /* Approximate reddish-brown color */
            --border-color: #ccc;
            --bg-color: #fff;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: var(--primary-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-color);
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* Header Section */
        header {
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }

        .top-tag {
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #555;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            display: flex;
            align-items: center;
        }

        h1::before {
            content: "▶";
            margin-right: 10px;
            font-size: 16px;
        }

        /* Grid Layout */
        .brand-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Card Styles */
        .brand-card {
            border: 1px dashed var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-logo {
            font-family: "Times New Roman", serif;
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #333;
            text-transform: uppercase;
        }
        
        .brand-logo.cn {
             font-family: "KaiTi", "STKaiti", serif;
             letter-spacing: 5px;
        }

        .image-placeholder {
            width: 100%;
            height: 280px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
        }
        
        /* Simulating the image content with CSS shapes/text for fidelity without external images */
        .img-content {
            display: flex;
            justify-content: space-around;
            width: 90%;
            height: 80%;
            align-items: flex-end;
        }
        .model {
            width: 20%;
            height: 90%;
            background: #ddd;
            border-radius: 4px 4px 0 0;
        }
        .model:nth-child(1) { background: #e8dcc8; }
        .model:nth-child(2) { background: #dce8dc; }
        .model:nth-child(3) { background: #dcdce8; }

        .brand-info {
            width: 100%;
            text-align: left;
        }

        .brand-name-location {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
        }

        .brand-description {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="top-tag">◆ 40个「新中式」女装品牌盘点</div>
        <h1>「新中式」：东方优雅熟女篇——中高端</h1>
    </header>

    <main class="brand-grid">
        <!-- Brand 1: 轮廓 -->
        <article class="brand-card">
            <div class="brand-logo cn">轮廓</div>
            <div class="image-placeholder">
                <div class="img-content">
                    <div class="model"></div>
                    <div class="model"></div>
                    <div class="model"></div>
                </div>
            </div>
            <div class="brand-info">
                <span class="brand-name-location">轮廓（南京）</span>
                <div class="brand-description">
                    打造中国最美民族品牌<br>
                    将传统民族文化注入现代设计中<br>
                    创造立于世界之林的中华服饰
                </div>
            </div>
        </article>

        <!-- Brand 2: 厅唐TINGTANG -->
        <article class="brand-card">
            <div class="brand-logo">TING TANG</div>
            <div class="image-placeholder">
                <div class="img-content">
                    <div class="model"></div>
                    <div class="model"></div>
                    <div class="model"></div>
                </div>
            </div>
            <div class="brand-info">
                <span class="brand-name-location">厅唐TINGTANG（台州）</span>
                <div class="brand-description">
                    以家居服拓展到日常服饰<br>
                    融合中式元素与现代审美<br>
                    演绎东方美学松弛度
                </div>
            </div>
        </article>

        <!-- Brand 3: 拾白SHIBAI -->
        <article class="brand-card">
            <div class="brand-logo">SHI BAI <span style="font-family: 'KaiTi', serif;">拾白</span></div>
            <div class="image-placeholder">
                <div class="img-content">
                    <div class="model"></div>
                    <div class="model"></div>
                    <div class="model"></div>
                </div>
            </div>
            <div class="brand-info">
                <span class="brand-name-location">拾白SHIBAI（广州）</span>
                <div class="brand-description">
                    原创新中式女装品牌<br>
                    传承东方古典美的气质<br>
                    把女性的温婉柔美刻画的淋漓尽致
                </div>
            </div>
        </article>

        <!-- Brand 4: HECO -->
        <article class="brand-card">
            <div class="brand-logo">HECO</div>
            <div class="image-placeholder">
                <div class="img-content">
                    <div class="model"></div>
                    <div class="model"></div>
                    <div class="model"></div>
                </div>
            </div>
            <div class="brand-info">
                <span class="brand-name-location">HECO（佛山）</span>
                <div class="brand-description">
                    中式艺术家品牌<br>
                    融合中国古典文化与当代时装<br>
                    呈现出时髦、日常的新中式服装
                </div>
            </div>
        </article>
    </main>
</div>

</body>
</html>
