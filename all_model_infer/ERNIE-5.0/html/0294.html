<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur the King Poster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 2/3;
            /* Using a placeholder that resembles the poster content since I cannot host the exact image file */
            background-image: url('https://image.tmdb.org/t/p/original/u3bZgnGQ9TWAZQv9263e6Y5663.jpg'); 
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Overlay to darken image slightly for text readability if needed, though the original poster has good contrast */
        .poster-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        .top-name {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .tagline {
            position: absolute;
            top: 38%;
            left: 10%;
            width: 30%;
            color: #ffffff;
            font-size: 13px;
            line-height: 1.6;
            font-weight: 400;
            text-transform: uppercase;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .main-title {
            position: absolute;
            left: 5%;
            width: 90%;
            color: #f4c542; /* Gold/Yellow color from poster */
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            line-height: 1.1;
        }

        .title-arthur {
            top: 46%;
            font-size: 52px;
            letter-spacing: 2px;
        }

        .title-the {
            top: 59%;
            font-size: 52px;
            letter-spacing: 2px;
        }

        .title-king {
            top: 72%;
            font-size: 52px;
            letter-spacing: 2px;
        }

        .bottom-info {
            position: absolute;
            bottom: 60px;
            right: 30px;
            text-align: right;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .bottom-info strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .coming-soon {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 10px;
            display: block;
        }

        .logos {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .logo-placeholder {
            background-color: rgba(255,255,255,0.2);
            color: white;
            padding: 2px 5px;
            font-size: 10px;
            border-radius: 3px;
            backdrop-filter: blur(2px);
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <div class="poster-overlay"></div>

        <div class="top-name">Mark Wahlberg</div>

        <div class="tagline">
            An unexpected encounter<br>
            An unlikely bond<br>
            An unforgettable adventure
        </div>

        <div class="main-title title-arthur">Arthur</div>
        <div class="main-title title-the">The</div>
        <div class="main-title title-king">King</div>

        <div class="bottom-info">
            Based on the incredible true story
            <span class="coming-soon">Coming Soon</span>
            <span style="font-size: 10px; opacity: 0.8;">LIONSGATE</span>
        </div>

        <div class="logos">
            <div class="logo-placeholder">PG-13</div>
            <div class="logo-placeholder">CREDITS</div>
        </div>
    </div>

</body>
</html>
