<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗词集锦</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0e6d2; /* Outer background color */
            font-family: "KaiTi", "STKaiti", "Serif", sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto;
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            border: 4px solid #d4a373;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .poem-box {
            padding: 20px 10px;
            border: 1px solid #d4a373;
            box-sizing: border-box;
            text-align: center;
            /* Simulating the graph paper background */
            background-color: #fff;
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
        }

        /* Remove borders for inner cells to create the grid look cleanly if needed, 
           but the image has distinct borders around every cell */
        .poem-box:nth-child(odd) {
            border-right: 1px solid #d4a373;
        }
        
        .poem-box:nth-child(even) {
            border-left: 1px solid #d4a373;
        }

        /* Top and Bottom borders handled by container or specific cells */
        .poem-box {
            border-top: 1px solid #d4a373;
            border-bottom: 1px solid #d4a373;
        }
        
        /* Specific border adjustments to match the image exactly */
        .poem-box:nth-child(1), .poem-box:nth-child(2) {
            border-top: none; /* Top border is the container border */
        }
        .poem-box:nth-child(5), .poem-box:nth-child(6) {
            border-bottom: none; /* Bottom border is the container border */
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #333;
            font-weight: normal;
        }

        .author {
            display: block;
            margin-bottom: 15px;
            font-size: 1rem;
            color: #555;
            font-style: italic;
        }

        .content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #000;
            white-space: pre-line; /* Preserves line breaks in HTML text */
        }

        /* Responsive adjustment */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
            .poem-box:nth-child(odd) {
                border-right: none;
            }
            .poem-box:nth-child(even) {
                border-left: none;
            }
            .poem-box {
                border-left: none;
                border-right: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Row 1, Col 1 -->
        <div class="poem-box">
            <h2>《登鹳雀楼》</h2>
            <span class="author">（唐 - 王之涣）</span>
            <div class="content">白日依山尽，
黄河入海流。
欲穷千里目，
更上一层楼。</div>
        </div>

        <!-- Row 1, Col 2 -->
        <div class="poem-box">
            <h2>《静夜思》</h2>
            <span class="author">（唐 - 李白）</span>
            <div class="content">床前明月光，
疑是地上霜。
举头望明月，
低头思故乡。</div>
        </div>

        <!-- Row 2, Col 1 -->
        <div class="poem-box">
            <h2>《古朗月行》</h2>
            <span class="author">（唐 - 李白）</span>
            <div class="content">小时不识月，
呼作白玉盘。
又疑瑶台镜，
飞在青云端。</div>
        </div>

        <!-- Row 2, Col 2 -->
        <div class="poem-box">
            <h2>《寻隐者不遇》</h2>
            <span class="author">（唐 - 贾岛）</span>
            <div class="content">松下问童子，
言师采药去。
只在此山中，
云深不知处。</div>
        </div>

        <!-- Row 3, Col 1 -->
        <div class="poem-box">
            <h2>《咏鹅》</h2>
            <span class="author">（唐 - 骆宾王）</span>
            <div class="content">鹅鹅鹅，
曲项向天歌。
白毛浮绿水，
红掌拨清波。</div>
        </div>

        <!-- Row 3, Col 2 -->
        <div class="poem-box">
            <h2>《草》</h2>
            <span class="author">（唐 - 白居易）</span>
            <div class="content">离离原上草，
一岁一枯荣。
野火烧不尽，
春风吹又生。</div>
        </div>
    </div>

</body>
</html>
