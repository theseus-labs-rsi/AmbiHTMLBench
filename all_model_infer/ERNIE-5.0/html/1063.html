    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;

        }

        .container {
            max-width: 800px;

        }

        .car-image {

            height: auto;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 24px;
            font-weight: 400;
            margin: 10px 0 30px 0;
            color: #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 16px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
            color: #333;
        }

        tr:nth-child(even) {
            background-color: #fafafa;

        th:nth-child(1), td:nth-child(1) { width: 25%; }

            color: #999;
            text-align: right;
            margin-top: 10px;
            padding-right: 10px;
        }

        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            opacity: 0.1;
