<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sustainability Summit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-color: #389e56; /* Main Green Background */
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }

        /* Left Side Cream Shape */
        .left-bg-shape {
            position: absolute;
            left: -10%;
            top: -10%;
            width: 60%;
            height: 110%;
            background-color: #f0eadd;
            border-radius: 50%;
            z-index: 1;
        }

        .left-content {
            position: relative;
            z-index: 2;
            width: 50%;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        /* Right Side Content */
        .right-content {
            position: relative;
            z-index: 2;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Typography & Elements */
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #4a8f52;
            line-height: 1.1;
            margin-bottom: 40px;
        }

        .vertical-text {
            display: inline-block;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            margin-right: 15px;
            height: 300px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: #4a8f52;
            margin: 20px 0 40px 0;
        }

        .section-label {
            color: #8bc34a;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        .price-item {
            margin-bottom: 25px;
        }

        .price-type {
            color: #333;
            font-size: 1rem;
            display: block;
            margin-bottom: 5px;
        }

        .price-amount {
            color: #4a8f52;
            font-size: 2.2rem;
            font-weight: 700;
            display: block;
        }

        .visit-section {
            margin-top: auto;
            padding-top: 20px;
        }

        .visit-text {
            color: #333;
            font-size: 1rem;
            line-height: 1.5;
            max-width: 300px;
        }

        /* Right Side Specifics */
        .logo-area {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            z-index: 3;
        }
        
        .logo-icon {
            font-size: 1.5rem;
            display: block;
            line-height: 1;
        }

        .tree-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            /* Placeholder for the tree image */
            background-image: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center 20%;
            /* Masking to blend with green bg if needed, but here it sits on top */
        }
        
        /* Simulating the tree cutout look */
        .tree-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, #389e56, transparent);
        }

        .info-circle {
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 450px;
            height: 450px;
            background-color: #2e7d32;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 80px; /* Offset text to center visually in the circle quadrant */
            color: white;
            z-index: 3;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .info-group {
            margin-bottom: 30px;
        }

        .info-label {
            color: #8bc34a;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .left-content {
                width: 100%;
                padding: 40px 20px;
            }
            .right-content {
                display: none; /* Hide complex right side on mobile for simplicity */
            }
            .left-bg-shape {
                width: 100%;
                left: 0;
                border-radius: 0;
                height: 100%;
                top: 0;
            }
            .vertical-text {
                height: 200px;
                font-size: 2.5rem;
            }
            .info-circle {
                width: 300px;
                height: 300px;
                bottom: 20px;
                right: 20px;
                padding-left: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Column Background Shape -->
        <div class="left-bg-shape"></div>

        <!-- Left Column Content -->
        <div class="left-content">
            <div>
                <h1>
                    <span class="vertical-text">Global</span>
                    <span class="vertical-text">Sustainability</span>
                    <span class="vertical-text">Summit</span>
                </h1>
                
                <div class="divider"></div>

                <div class="registration">
                    <span class="section-label">Registration</span>
                    
                    <div class="price-item">
                        <span class="price-type">General Admission</span>
                        <span class="price-amount">$350</span>
                    </div>

                    <div class="price-item">
                        <span class="price-type">Students & Nonprofits</span>
                        <span class="price-amount">$200</span>
                    </div>
                </div>
            </div>

            <div class="visit-section">
                <span class="section-label">Visit</span>
                <p class="visit-text">www.yourwebsite.com for more details and to register today!</p>
            </div>
        </div>

        <!-- Right Column Content -->
        <div class="right-content">
            <div class="logo-area">
                Your <span class="logo-icon">✿</span> LOGO
            </div>

            <div class="tree-container">
                <!-- Tree Image handled via CSS background -->
            </div>

            <div class="info-circle">
                <div class="info-group">
                    <span class="info-label">Date</span>
                    <span class="info-value">27 January 2026<br>10:00 PM</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Location</span>
                    <span class="info-value">Grand Hall, Convention Center, Chicago, IL</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
