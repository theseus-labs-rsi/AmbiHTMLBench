<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞吉欧Reggio 教育理念</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #333;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            /* Using a placeholder image that resembles the background: children working at tables */
            background-image: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            /* Dark overlay to ensure text readability */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin: 0;
        }

        li {
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Simulating the yellow wavy underline */
        .highlight {
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #f1c40f; /* Yellow color */
            text-decoration-thickness: 3px;
            text-underline-offset: 4px;
        }

        /* Specific adjustments for layout fidelity */
        .indent-block {
            display: block;
            margin-top: 5px;
            margin-left: 0; /* Align with text start roughly */
        }
        
        /* Adjusting list item padding to match visual indentation */
        li {
            padding-left: 10px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>瑞吉欧Reggio</h1>
        
        <ul>
            <li>
                基于皮亚杰和维果斯基等心理学家的<span class="highlight">建构主义心理学</span>。
            </li>
            <li>
                <span class="highlight">走进儿童心灵的儿童观</span>，以孩子的思维、孩子的立场来看待一场<br>
                不压制孩子，让其充分表现潜能
            </li>
            <li>
                弹性课程，<span class="highlight">从儿童的兴趣和需要出发</span><br>
                不让孩子生活在成人的包围之中。
            </li>
            <li>
                <span class="highlight">教师必须尽可能地减少介入</span>，更不可过度介入。<br>
                与其牵着儿童的手，不如让他们用自己的双脚站立。
            </li>
            <li>
                <span class="highlight">儿童的自我表达和相互交流特别重要</span>，是儿童探索、研究、解决问题过程中的基本活动。
            </li>
            <li>
                <span class="highlight">在共同分享中</span>，每个人均可提出最好的想法，提升和加强团队间意见交流、并刺激新奇或出乎意料的事情发生。
            </li>
        </ul>
    </div>

</body>
</html>
