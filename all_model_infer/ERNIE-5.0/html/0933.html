<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五大学科竞赛国家集训队名单</title>
    <style>
        body {
            font-family: "KaiTi", "STKaiti", "Serif", cursive;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            position: relative;
        }

        /* Background grid pattern simulation */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(#e1e1e1 1px, transparent 1px),
                linear-gradient(90deg, #e1e1e1 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        h1 {
            text-align: center;
            color: #2c5aa0;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        .content-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .text-section {
            flex: 2;
            min-width: 300px;
        }

        .sticky-note {
            flex: 1;
            min-width: 200px;
            background-color: #fff9c4;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            transform: rotate(2deg);
            height: fit-content;
            border: 1px solid #f0e68c;
        }

        ul.custom-list {
            list-style: none;
            padding-left: 0;
        }

        ul.custom-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 10px;
            color: #d9534f;
            font-size: 20px;
            line-height: 1.6;
        }

        ul.custom-list li::before {
            content: "•";
            color: #4a90e2;
            font-weight: bold;
            font-size: 24px;
            position: absolute;
            left: 0;
            top: -2px;
        }

        .sticky-note p {
            margin: 10px 0;
            font-size: 18px;
            color: #555;
            text-align: left;
        }

        /* Table Styles */
        .table-section {
            position: relative;
            z-index: 1;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
            border: 2px solid #8bc34a;
        }

        th, td {
            border: 1px solid #8bc34a;
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: #a5d6a7;
            color: #2e7d32;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f1f8e9;
        }

        tr:nth-child(odd) {
            background-color: #ffffff;
        }
        
        /* Specific row highlighting based on image */
        tr.highlight-row {
            background-color: #dcedc8;
        }

        .empty-cell {
            background-color: transparent;
            border: none;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>五大学科竞赛国家集训队名单</h1>

    <div class="content-wrapper">
        <div class="text-section">
            <ul class="custom-list">
                <li>2023年进入国际五项学科奥赛国家集训队</li>
                <li>符合保送生资格的总人数为274人。其中生物学科人数最多为67人；其次是数学学科，为64人信息学学科有53人；化学学科有47人；物理学科人数最少，为43人！</li>
            </ul>
        </div>

        <div class="sticky-note">
            <p>生竞67人</p>
            <p>数竞64人</p>
            <p>化竞47人</p>
            <p>物竞43人</p>
        </div>
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th>学科</th>
                    <th>2023年</th>
                    <th>2022年</th>
                    <th>2021年</th>
                    <th>小计</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>数学</td>
                    <td>19</td>
                    <td>32</td>
                    <td>13</td>
                    <td>64</td>
                </tr>
                <tr>
                    <td>化学</td>
                    <td>47</td>
                    <td class="empty-cell"></td>
                    <td class="empty-cell"></td>
                    <td>47</td>
                </tr>
                <tr>
                    <td>物理</td>
                    <td>37</td>
                    <td>6</td>
                    <td class="empty-cell"></td>
                    <td>43</td>
                </tr>
                <tr>
                    <td>生物</td>
                    <td>58</td>
                    <td>9</td>
                    <td class="empty-cell"></td>
                    <td>67</td>
                </tr>
                <tr>
                    <td>信息学</td>
                    <td>34</td>
                    <td>13</td>
                    <td class="empty-cell"></td>
                    <td>53</td>
                </tr>
                <tr>
                    <td>合计</td>
                    <td class="empty-cell"></td>
                    <td class="empty-cell"></td>
                    <td class="empty-cell"></td>
                    <td>274</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
