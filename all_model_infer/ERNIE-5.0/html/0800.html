<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版式设计 - 酷设而遇</title>
    <style>
        :root {
            --bg-yellow: #FCEE21;
            --bg-black: #111111;
            --text-black: #111111;
            --text-yellow: #FCEE21;
            --font-main: "Times New Roman", Times, serif;
            --font-cn: "Songti SC", "SimSun", serif;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: #f9f9f9;
            font-family: var(--font-main);
            color: var(--text-black);
            display: flex;
            justify-content: center;
        }

        .poster {
            background-color: white;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .header-left h3, .header-right h3 {
            margin: 0;
            font-weight: normal;
            font-size: 16px;
        }

        .header-left span, .header-right span {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            align-items: start;
        }

        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .bg-yellow {
            background-color: var(--bg-yellow);
            color: var(--text-black);
        }

        .bg-black {
            background-color: var(--bg-black);
            color: var(--text-yellow);
        }

        /* Specific Block Styles */
        .block-cool {
            font-size: 80px;
            font-weight: 900;
            height: 150px;
            font-family: var(--font-cn);
        }

        .block-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            height: 120px;
            font-family: var(--font-cn);
        }

        .block-subtitle {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            height: 120px;
            font-family: var(--font-cn);
            line-height: 1.4;
        }

        .block-small-black {
            height: 20px;
            background-color: var(--bg-black);
            width: 100%;
            margin-bottom: 10px;
        }
        
        .block-tiny-black {
            height: 15px;
            background-color: var(--bg-black);
            width: 60%;
            margin: 10px 0;
        }

        .block-english-small {
            font-size: 12px;
            letter-spacing: 2px;
            height: 100px;
            font-weight: bold;
        }

        .block-big-text {
            font-size: 60px;
            font-weight: 900;
            height: 150px;
            font-family: var(--font-cn);
            letter-spacing: 5px;
        }

        .block-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--bg-yellow);
            margin-top: 20px;
        }

        .block-text-grid {
            font-size: 10px;
            line-height: 1.6;
            color: var(--text-black);
            text-align: left;
            padding: 10px;
            font-family: var(--font-cn);
        }
        
        .block-text-grid span {
            display: inline-block;
            margin-right: 5px;
        }

        .block-rect-yellow {
            height: 60px;
            background-color: var(--bg-yellow);
            width: 100%;
            align-self: end;
        }

        /* Footer Section */
        .footer-english {
            text-align: center;
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .footer-chinese {
            text-align: center;
            font-size: 16px;
            letter-spacing: 10px;
            margin-top: 30px;
            font-family: var(--font-cn);
            font-weight: bold;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .block-cool, .block-title, .block-subtitle, .block-big-text {
                height: auto;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="poster">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h3>曲线式构图</h3>
                <span>CURVILINEAR COMPOSITION</span>
            </div>
            <div class="header-right" style="text-align: right;">
                <h3>版式设计</h3>
                <span>2023 / 6 / 07</span>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid-container">
            <!-- Column 1 -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="box bg-yellow block-cool">酷</div>
                <div class="block-tiny-black"></div>
                <div class="box bg-yellow block-subtitle">构图的<br>重要性</div>
                <div class="block-tiny-black"></div>
                <div class="box bg-black block-english-small">
                    THE IMPORTANCE<br>OF COMPOSITION
                </div>
                <div class="box bg-yellow block-circle"></div>
            </div>

            <!-- Column 2 -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="box bg-black block-title">
                    酷设而遇<br>
                    <span style="font-size: 32px; letter-spacing: 10px; margin-top: 10px; display: block;">COOLS</span>
                </div>
                <!-- Spacer to align with row 3 roughly -->
                <div style="height: 40px;"></div> 
                <div class="box bg-black block-subtitle">酷设<br>永远</div>
                <div class="block-tiny-black" style="width: 40%; margin-left: auto;"></div>
                <div class="box bg-black block-big-text">在顶点</div>
                
                <div class="box block-text-grid">
                    <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span><br>
                    <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span><br>
                    <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span>
                </div>
                <div class="box bg-yellow block-rect-yellow"></div>
            </div>
        </div>

        <!-- Footer Text -->
        <div class="footer-english">
            COOL SET IS ALWAYS AT THE TOP
        </div>

        <div class="footer-chinese">
            我 / 看 / 不 / 懂 / 但 / 大 / 受 / 震 / 撼
        </div>
    </div>

</body>
</html>
