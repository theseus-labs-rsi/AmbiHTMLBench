<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桂花露与荷花露制作方法</title>
    <style>
        body {
            font-family: "Songti SC", "SimSun", serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        .card {
            background-color: #E8D8DC; /* Approximate pinkish background */
            border: 1px solid #999;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            line-height: 1.8;
            font-size: 16px;
        }

        h2 {
            font-size: 18px;
            font-weight: normal;
            margin-top: 30px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h2:first-child {
            margin-top: 0;
        }

        .section-label {
            font-weight: bold;
            display: inline-block;
            min-width: 60px;
        }

        p {
            margin: 10px 0;
            text-align: justify;
        }

        .footer {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 10px;
        }
        
        .app-logo {
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Section 1: Osmanthus Dew -->
        <h2>△桂花露</h2>
        <p><span class="section-label">〔功用〕</span>开胃消食，宽胸化痰</p>
        <p><span class="section-label">〔药物〕</span>桂花500克</p>
        <p><span class="section-label">〔制法〕</span>于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</p>

        <!-- Section 2: Lotus Dew -->
        <h2>△荷花露</h2>
        <p><span class="section-label">〔功用〕</span>清暑凉营</p>
        <p><span class="section-label">〔药物〕</span>白荷花500克</p>
        <p><span class="section-label">〔制法〕</span>取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</p>

        <!-- Footer -->
        <div class="footer">
            <span>[中国色·藕荷]</span>
            <span class="app-logo">图文APP</span>
        </div>
    </div>

</body>
</html>
