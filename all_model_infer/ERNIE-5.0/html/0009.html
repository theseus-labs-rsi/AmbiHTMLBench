<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Page</title>
    <style>
        body {
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
        }

        .text-content {
            font-size: 22px;
            line-height: 1.6;
            color: #333;
            text-align: justify;
            margin-bottom: 20px;
            text-indent: 2em;
        }

        .illustration-area {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            position: relative;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Simulating the window frame structure with CSS to match layout fidelity */
        .window-frame {
            width: 95%;
            height: 90%;
            border: 8px solid #8FBC8F; /* Dark Sea Green */
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            background-color: #fff;
        }

        .window-pane {
            border: 1px solid #8FBC8F;
            position: relative;
            background-color: #fff;
            overflow: hidden;
        }

        .pane-left {
            /* Ducks outside */
            background-color: #e8f5e9;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
        }

        .pane-middle {
            /* Lattice grid */
            background-color: #fff;
            background-image: 
                linear-gradient(#8FBC8F 1px, transparent 1px),
                linear-gradient(90deg, #8FBC8F 1px, transparent 1px);
            background-size: 30px 30px;
            border: 2px solid #8FBC8F;
        }

        .pane-right {
            /* Pigs inside */
            background-color: #fff3e0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            border-left: 2px solid #8FBC8F;
        }

        .vine-decoration {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 200px;
            height: 100px;
            background-image: radial-gradient(circle, #8FBC8F 2px, transparent 2.5px);
            background-size: 10px 10px;
            opacity: 0.6;
            transform: rotate(-10deg);
            z-index: 10;
        }

        .placeholder-text {
            position: absolute;
            color: #999;
            font-size: 14px;
            text-align: center;
            z-index: 5;
            background: rgba(255,255,255,0.8);
            padding: 5px;
        }
        
        /* Simple CSS shapes to represent characters roughly */
        .duck {
            width: 40px;
            height: 30px;
            background: #fff;
            border: 1px solid #333;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin-bottom: 5px;
            position: relative;
        }
        .duck::after {
            content: '';
            position: absolute;
            top: -5px;
            left: 10px;
            width: 20px;
            height: 10px;
            background: #333;
            border-radius: 50%;
        }
        
        .pig {
            width: 50px;
            height: 40px;
            background: #ffcccb;
            border: 1px solid #333;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin-bottom: 5px;
            position: relative;
        }
        .pig::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 5px;
            width: 40px;
            height: 15px;
            background: #fff;
            border: 1px solid #333;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="text-content">
            “胖胖，中午好！”丫丫一进屋就看见了胖胖，胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微笑来和我打招呼的！”听到丫丫的话，大家都笑了起来。
        </div>

        <div class="illustration-area">
            <div class="vine-decoration"></div>
            <div class="window-frame">
                <div class="window-pane pane-left">
                    <div class="duck" style="transform: scale(1.5);"></div>
                    <div class="duck"></div>
                </div>
                <div class="window-pane pane-middle">
                    <!-- Lattice pattern handled by CSS background -->
                </div>
                <div class="window-pane pane-right">
                    <div class="pig" style="transform: scale(1.2);"></div>
                    <div class="pig" style="transform: scale(0.8); margin-top: -15px;"></div>
                </div>
            </div>
            <div class="placeholder-text">
                [Illustration: Window scene with ducks outside and pigs inside]
            </div>
        </div>
    </div>

</body>
</html>
