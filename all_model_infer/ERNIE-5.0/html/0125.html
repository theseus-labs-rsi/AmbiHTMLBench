<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句摘抄 - 心态主题</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-color: #333333;
            --accent-red: #c92a2a;
            --font-serif: "Songti SC", "SimSun", "STSong", serif;
            --font-sans: "Heiti SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-serif);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-color);
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 60px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 20px;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", serif; /* Approximating the calligraphy style */
            font-size: 3.5rem;
            color: var(--accent-red);
            font-weight: bold;
            line-height: 1;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #555;
            text-transform: uppercase;
        }

        .title-section {
            text-align: right;
        }

        .meta-tag {
            font-family: var(--font-sans);
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
        }

        .main-theme {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: bold;
            border-bottom: 3px solid #333;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Content Sections */
        .quote-block {
            margin-bottom: 50px;
            text-align: center;
        }

        .quote-text {
            font-size: 2.2rem;
            line-height: 1.4;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .explanation-label {
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: bold;
            text-align: left;
            margin-bottom: 10px;
            display: block;
        }

        .explanation-text {
            font-family: var(--font-sans);
            font-size: 1rem;
            text-align: left;
            color: #444;
            line-height: 1.8;
            text-indent: 0; /* The image text doesn't seem heavily indented, just block text */
        }
        
        /* Specific adjustment for the second quote block spacing */
        .quote-block:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            
            .logo-section {
                align-items: center;
                margin-bottom: 20px;
            }

            .title-section {
                text-align: center;
            }

            .quote-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-section">
                <div class="logo-text">人民日报</div>
                <div class="logo-sub">RENMIN RIBAO</div>
            </div>
            <div class="title-section">
                <div class="meta-tag">金句 | 摘抄</div>
                <div class="main-theme">心态主题</div>
            </div>
        </header>

        <main>
            <!-- First Quote Section -->
            <section class="quote-block">
                <div class="quote-text">
                    且行且忘且随风，<br>
                    且行且看且从容。
                </div>
                <span class="explanation-label">释义：</span>
                <p class="explanation-text">
                    意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
                </p>
            </section>

            <!-- Second Quote Section -->
            <section class="quote-block">
                <div class="quote-text">
                    我将玫瑰藏于身后风起花落，<br>
                    从此鲜花赠自己，<br>
                    纵马踏花向自由。
                </div>
                <span class="explanation-label">释义：</span>
                <p class="explanation-text">
                    我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
                </p>
            </section>
        </main>
    </div>

</body>
</html>
