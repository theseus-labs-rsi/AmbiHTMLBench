<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水浓度图表</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #8B5A2B; /* Wooden background approximation */
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0 0h100v100H0z" fill="%238B5A2B"/><path d="M0 50h100M50 0v100" stroke="%236F4E22" stroke-width="2"/></svg>'); 
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .paper {
            background-color: #fff;
            width: 800px;
            max-width: 95%;
            padding: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        h1 {
            text-align: center;
            color: #5D4037;
            font-size: 48px;
            margin-bottom: 30px;
            font-weight: normal;
            letter-spacing: 5px;
        }

        .bottles-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .bottle {
            position: relative;
            width: 60px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cap {
            width: 24px;
            height: 24px;
            background-color: #D32F2F;
            border-radius: 50%;
            position: absolute;
            top: -15px;
            z-index: 2;
        }

        .cap::after {
            content: '';
            position: absolute;
            top: 5px;
            left: -5px;
            width: 34px;
            height: 4px;
            background-color: #ccc;
            border-radius: 2px;
            transform: rotate(-10deg);
        }

        .bottle-body {
            width: 50px;
            height: 60px;
            border: 2px solid #333;
            border-top: none;
            position: relative;
            background: #fff;
            overflow: hidden;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ddd;
            transition: height 0.5s ease;
        }

        /* Liquid Levels */
        .bottle-1 .liquid { height: 85%; }
        .bottle-2 .liquid { height: 65%; }
        .bottle-3 .liquid { height: 45%; }
        .bottle-4 .liquid { height: 25%; }
        .bottle-5 .liquid { height: 5%; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }

        td {
            padding: 12px 5px;
            text-align: center;
            vertical-align: middle;
        }

        .label-col {
            font-weight: bold;
            color: #5D4037;
            text-align: left;
            padding-left: 10px;
            width: 60px;
        }
        
        /* Simulating the cut-off text on the left edge */
        .label-col span {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            width: 40px; 
        }

        .data-cell {
            font-weight: 500;
        }

        .tips-section {
            margin-top: 30px;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .tips-title {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        @media (max-width: 600px) {
            .bottles-container {
                transform: scale(0.7);
                margin-bottom: 0;
            }
            table {
                font-size: 12px;
            }
            .paper {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="paper">
        <h1>香水浓度</h1>

        <div class="bottles-container">
            <!-- Bottle 1: Parfum -->
            <div class="bottle bottle-1">
                <div class="cap"></div>
                <div class="bottle-body">
                    <div class="liquid"></div>
                </div>
            </div>
            <!-- Bottle 2: EDP -->
            <div class="bottle bottle-2">
                <div class="cap"></div>
                <div class="bottle-body">
                    <div class="liquid"></div>
                </div>
            </div>
            <!-- Bottle 3: EDT -->
            <div class="bottle bottle-3">
                <div class="cap"></div>
                <div class="bottle-body">
                    <div class="liquid"></div>
                </div>
            </div>
            <!-- Bottle 4: EDC -->
            <div class="bottle bottle-4">
                <div class="cap"></div>
                <div class="bottle-body">
                    <div class="liquid"></div>
                </div>
            </div>
            <!-- Bottle 5: Eau Fraiche -->
            <div class="bottle bottle-5">
                <div class="cap"></div>
                <div class="bottle-body">
                    <div class="liquid"></div>
                </div>
            </div>
        </div>

        <table>
            <tr>
                <td class="label-col"><span>分类</span></td>
                <td class="data-cell">浓香精</td>
                <td class="data-cell">淡香精</td>
                <td class="data-cell">淡香水</td>
                <td class="data-cell">古龙水</td>
                <td class="data-cell">清香水</td>
            </tr>
            <tr>
                <td class="label-col"><span>名称</span></td>
                <td class="data-cell">Parfum</td>
                <td class="data-cell">Eau<br>De<br>Parfum</td>
                <td class="data-cell">Eau<br>De<br>Toilette</td>
                <td class="data-cell">Eau<br>De<br>Cologne</td>
                <td class="data-cell">Eau<br>Fraiche</td>
            </tr>
            <tr>
                <td class="label-col"><span>缩写</span></td>
                <td class="data-cell">(P)</td>
                <td class="data-cell">(EDP)</td>
                <td class="data-cell">(EDT)</td>
                <td class="data-cell">(EDC)</td>
                <td class="data-cell">(EF)</td>
            </tr>
            <tr>
                <td class="label-col"><span>浓度</span></td>
                <td class="data-cell">15-20%</td>
                <td class="data-cell">10-15%</td>
                <td class="data-cell">5-10%</td>
                <td class="data-cell">3-5%</td>
                <td class="data-cell">&lt;3%</td>
            </tr>
            <tr>
                <td class="label-col"><span>留香</span></td>
                <td class="data-cell">5-8H</td>
                <td class="data-cell">3-5H</td>
                <td class="data-cell">3-4H</td>
                <td class="data-cell">2-3H</td>
                <td class="data-cell">&lt;1h</td>
            </tr>
        </table>

        <div class="tips-section">
            <span class="tips-title">tips:</span>
            浓度高的香水不代表留香时间长,主要取决于香料种类<br>
            在相同的浓度比较下，木质香的留香时间是碾压花果香的
        </div>
    </div>

</body>
</html>
