<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Brand Profiles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            /* Simulating the background image of the room */
            background-image: url('https://images.unsplash.com/photo-1616486338812-3dadae4b4f9d?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 450px;
            justify-content: flex-start;
        }

        .logo-area {
            margin-bottom: 30px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-block {
            text-align: left;
            width: 100%;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }

        .info-line {
            margin-bottom: 5px;
        }

        .label {
            font-weight: normal;
            color: #000;
        }

        /* Specific Brand Styles */
        
        /* Omega */
        .omega-logo {
            color: #b30000;
            font-size: 60px;
            font-weight: bold;
            font-family: serif;
            letter-spacing: -2px;
        }
        .omega-text {
            color: #b30000;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: -10px;
            text-transform: uppercase;
        }

        /* Chaumet */
        .chaumet-logo-top {
            font-size: 24px;
            color: #002855;
            letter-spacing: 5px;
            margin-bottom: 5px;
            position: relative;
        }
        .chaumet-logo-top::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: #002855;
            margin: 5px auto 0;
            border-radius: 50%;
        }
        .chaumet-text {
            color: #002855;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .chaumet-sub {
            font-size: 12px;
            letter-spacing: 3px;
            color: #002855;
            margin-top: -5px;
        }

        /* Van Cleef & Arpels */
        .vca-logo {
            font-family: serif;
            font-size: 24px;
            color: #000;
            letter-spacing: 1px;
        }
        .vca-monogram {
            display: inline-block;
            border: 1px solid #000;
            padding: 2px 8px;
            font-size: 14px;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Cartier */
        .cartier-logo-symbol {
            font-size: 50px;
            color: #000;
            line-height: 1;
            margin-bottom: 10px;
            font-family: serif;
        }
        .cartier-text {
            font-family: "Brush Script MT", cursive;
            font-size: 42px;
            color: #000;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Left: OMEGA -->
        <div class="card">
            <div class="logo-area">
                <div style="text-align: center;">
                    <div class="omega-logo">Ω</div>
                    <div class="omega-text">OMEGA</div>
                </div>
            </div>
            <div class="info-block">
                <div class="info-line"><span class="label">品牌创始人：</span>Louis Brandt</div>
                <div class="info-line"><span class="label">成立年份：</span>1848</div>
                <div class="info-line"><span class="label">发源地：</span>瑞士</div>
                <div class="info-line"><span class="label">隶属集团：</span>斯沃琪集团</div>
            </div>
        </div>

        <!-- Top Right: CHAUMET -->
        <div class="card">
            <div class="logo-area">
                <div style="text-align: center;">
                    <div class="chaumet-logo-top">C</div>
                    <div class="chaumet-text">CHAUMET</div>
                    <div class="chaumet-sub">PARIS</div>
                </div>
            </div>
            <div class="info-block">
                <div class="info-line"><span class="label">品牌创始人：</span>Marie-Etienne Nitot</div>
                <div class="info-line"><span class="label">成立年份：</span>1780年</div>
                <div class="info-line"><span class="label">发源地：</span>法国</div>
                <div class="info-line"><span class="label">隶属集团：</span>LVMH</div>
            </div>
        </div>

        <!-- Bottom Left: Van Cleef & Arpels -->
        <div class="card">
            <div class="logo-area">
                <div class="vca-logo">
                    <span class="vca-monogram">VC A</span>Van Cleef & Arpels
                </div>
            </div>
            <div class="info-block">
                <div class="info-line"><span class="label">品牌创始人：</span>Alfred Van Cleef 和 Charles Arpels</div>
                <div class="info-line"><span class="label">成立年份：</span>1906年</div>
                <div class="info-line"><span class="label">发源地：</span>法国</div>
                <div class="info-line"><span class="label">隶属集团：</span>Richemont</div>
            </div>
        </div>

        <!-- Bottom Right: Cartier -->
        <div class="card">
            <div class="logo-area">
                <div style="text-align: center;">
                    <div class="cartier-logo-symbol">&> <!-- Approximating the double C logo -->
                    <div style="font-size: 40px; font-family: serif; letter-spacing: -2px;">C</div>
                    <div class="cartier-text">Cartier</div>
                </div>
            </div>
            <div class="info-block">
                <div class="info-line"><span class="label">品牌创始人：</span>Louis-François Cartier</div>
                <div class="info-line"><span class="label">成立年份：</span>1847年</div>
                <div class="info-line"><span class="label">发源地：</span>法国</div>
                <div class="info-line"><span class="label">隶属集团：</span>Richemont</div>
            </div>
        </div>
    </div>

</body>
</html>
