<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adidas Takumi Sen9 vs Nike Streakfly Comparison</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: -1px;
        }
        
        .logo-sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            display: block;
            text-align: center;
        }

        .brand-name {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Shoe Display Section */
        .shoe-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            position: relative;
            background-color: #fff;
        }

        .shoe-img-placeholder {
            width: 45%;
            height: 250px;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .shoe-img-placeholder img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .vs-badge {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4rem;
            font-weight: 900;
            color: #ddd;
            font-style: italic;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff;
            z-index: 10;
        }

        /* Specs Section */
        .specs-section {
            display: flex;
            flex-direction: column;
        }

        .category-label {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 0 5px 0;
            background-color: #fff;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .col-left {
            background-color: #fff;
            color: #000;
            padding: 20px;
            text-align: center;
            border-right: 1px solid #eee;
        }

        .col-right {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .spec-row {
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .col-right .spec-row {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .spec-row:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }

        .shoe-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }

        /* SVG Icons */
        svg {
            width: 40px;
            height: 40px;
            fill: #000;
        }
        .nike-logo svg {
            fill: #000;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }
            .shoe-display {
                flex-direction: column;
                gap: 20px;
            }
            .vs-badge {
                position: static;
                transform: none;
                margin: 10px 0;
            }
            .shoe-img-placeholder {
                width: 100%;
            }
            .specs-grid {
                grid-template-columns: 1fr;
            }
            .col-left {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <!-- Adidas Logo -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2L5.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2zm0 3.5l6.16 17.28-5.45-2.42L12 17.5l-1.71 1.76-5.45 2.42L12 5.5z"/>
                <path d="M12 2L5.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z" fill="none"/> 
                <!-- Simplified Adidas 3 stripes representation -->
                <path d="M12 2L2 22h20L12 2zm0 3.5L19.5 20h-15L12 5.5z" fill="black"/>
                <path d="M12 2L2 22h20L12 2z" fill="none"/>
                <path d="M7 12l5-10 5 10" fill="none" stroke="black" stroke-width="2"/>
                <path d="M12 2v20" fill="none" stroke="black" stroke-width="2"/>
                <path d="M2 22h20" fill="none" stroke="black" stroke-width="2"/>
            </svg>
            <div>
                <span class="brand-name">奔跑的小小宇</span>
                <span class="logo-sub">RUNNING XIAOYU</span>
            </div>
        </div>
        
        <div class="logo-area">
            <div style="text-align: right;">
                <span class="brand-name">NIKE</span>
            </div>
            <!-- Nike Logo -->
            <svg viewBox="0 0 24 24" class="nike-logo">
                <path d="M21.5 12.5c0-1.5-.5-3-1.5-4.5-1.5-2-4-3.5-7-3.5-3.5 0-6.5 2-8 5-1.5 3-1 6.5 1 9 1.5 2 4 3.5 7 3.5 3.5 0 6.5-2 8-5 1.5-3 1-6.5-1-9zm-9.5 7.5c-2.5 0-4.5-1.5-5.5-3.5-.5-1-.5-2.5 0-3.5.5-1 1.5-1.5 2.5-1.5 1.5 0 2.5 1 3 2.5.5 1.5 0 3-1 4-.5.5-1.5.5-2 .5zm6.5-2.5c-.5 1-1.5 1.5-2.5 1.5-1.5 0-2.5-1-3-2.5-.5-1.5 0-3 1-4 .5-.5 1.5-.5 2-.5 2.5 0 4.5 1.5 5.5 3.5.5 1 .5 2.5 0 3.5z"/>
            </svg>
        </div>
    </div>

    <!-- Shoe Images -->
    <div class="shoe-display">
        <div class="shoe-img-placeholder">
            <!-- Using a placeholder image that resembles the Adidas Takumi Sen 9 -->
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Adidas Takumi Sen 9" style="filter: hue-rotate(200deg) saturate(0.5);">
        </div>
        
        <div class="vs-badge">VS</div>
        
        <div class="shoe-img-placeholder">
            <!-- Using a placeholder image that resembles the Nike Streakfly -->
            <img src="https://images.unsplash.com/photo-1600185365926-3a2ce3cdb9eb?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Nike Streakfly">
        </div>
    </div>

    <!-- Specs Comparison -->
    <div class="specs-section">
        <div class="category-label">5-10KM</div>
        
        <div class="specs-grid">
            <!-- Left Column (Adidas) -->
            <div class="col-left">
                <span class="shoe-name">Takumi Sen9</span>
                <div class="spec-row">181g</div>
                <div class="spec-row">(27/33) 6mm</div>
                <div class="spec-row">LIGHTWEIGHT MESH</div>
                <div class="spec-row">Lightstrike Pro</div>
                <div class="spec-row">ENERGYROD玻纤柱</div>
                <div class="spec-row">Continental™</div>
                <div class="spec-row">1499</div>
            </div>

            <!-- Right Column (Nike) -->
            <div class="col-right">
                <span class="shoe-name">Streakfly</span>
                <div class="spec-row">165g</div>
                <div class="spec-row">8mm (26/32)</div>
                <div class="spec-row">织物鞋面</div>
                <div class="spec-row">ZoomX</div>
                <div class="spec-row">半掌碳板</div>
                <div class="spec-row">贴片橡胶</div>
                <div class="spec-row">999</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
