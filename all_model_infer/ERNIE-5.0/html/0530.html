<!DOCTYPE html>
<html lang="ja">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女學雜誌 第五百二十二號</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            font-family: 'Noto Serif JP', serif;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .page-container {
            background-color: #fff;
            width: 800px;
            min-height: 1000px;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: row;
            position: relative;
        }

        /* Layout Columns */
        .margin-left {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 12px;
            color: #557c55;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #eee;
            padding-right: 10px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .margin-right {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 14px;
            color: #557c55;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid #eee;
            padding-left: 10px;
        }

        /* Typography Utilities */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .furigana {
            font-size: 0.4em;
            vertical-align: top;
            margin-left: 2px;
        }

        /* Title Section */
        .title-section {
            margin-bottom: 30px;
            text-align: center;
            color: #4a8c5e;
        }

        .title-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: flex-start;
        }

        .title-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
        }

        .title-char {
            font-size: 60px;
            font-weight: 900;
            line-height: 1;
        }

        .wavy-divider {
            width: 100%;
            height: 10px;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 10 Q 25 0 50 10 T 100 10' stroke='%234a8c5e' fill='none' stroke-width='2'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
            margin: 20px 0 40px 0;
            opacity: 0.6;
        }

        /* Body Content Section */
        .body-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            color: #d9534f;
            font-size: 24px;
            line-height: 1.8;
            font-weight: 700;
        }

        .ad-column {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 32px;
            font-weight: 900;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #d9534f;
            border-right: 1px solid #d9534f;
            padding: 0 10px;
            margin: 0 20px;
        }
        
        .ad-column.left {
             border-left: none;
             border-right: 1px solid #d9534f;
        }
        
        .ad-column.right {
             border-left: 1px solid #d9534f;
             border-right: none;
        }

        .poem-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 26px;
            line-height: 2;
            text-align: justify;
            max-width: 300px;
        }

        .poem-line {
            display: block;
        }

        /* Specific adjustments for poem layout to match image flow */
        .poem-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .poem-stanza {
            display: flex;
            flex-direction: column;
        }

        /* Footer info in margins */
        .margin-info {
            font-size: 12px;
            margin-top: auto;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .page-number {
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <!-- Left Margin -->
        <div class="margin-left">
            <div>
                (明治三十六年六月十七日第三種郵便物認可)
            </div>
            <div class="page-number">
                (五二二)
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <!-- Title -->
            <div class="title-section">
                <div class="title-grid">
                    <div class="title-col">
                        <span class="title-char">市川團</span>
                    </div>
                    <div class="title-col">
                        <span class="title-char">十郎の</span>
                    </div>
                    <div class="title-col">
                        <span class="title-char">
                            石<span class="furigana">しゃく</span><br>
                            橋<span class="furigana">けう</span>
                        </span>
                    </div>
                    <div class="title-col">
                        <span class="title-char">
                            獅<span class="furigana">ライ</span>子<span class="furigana">オン</span>
                        </span>
                    </div>
                </div>
                <div class="wavy-divider"></div>
            </div>

            <!-- Body: Ads and Poem -->
            <div class="body-section">
                <div class="ad-column left">
                    ライオン歯磨
                </div>

                <div class="poem-text">
                    <div class="poem-container">
                        <div class="poem-stanza">
                            <span class="poem-line">花にたればぶれ杖に伏しまろび、</span>
                            <span class="poem-line">けにも上なき獅子王のいきほひ、</span>
                            <span class="poem-line">ひなびかぬ草木もなき時なれ</span>
                            <span class="poem-line">や。萬歳千秋と舞ひをさめ、</span>
                        </div>
                        <div class="poem-stanza">
                            <span class="poem-line">萬歳千秋と舞ひをさめ、</span>
                            <span class="poem-line">獅子の座にこそなほりけれ。</span>
                        </div>
                    </div>
                </div>

                <div class="ad-column right">
                    ライオン歯磨
                </div>
            </div>

        </div>

        <!-- Right Margin -->
        <div class="margin-right">
            <div>
                女學雜誌第五百二十二號
            </div>
            <div class="margin-info">
                (明治三十六年十月十日發行)<br>
                (每月一回十五日)
            </div>
        </div>
    </div>

</body>
</html>
