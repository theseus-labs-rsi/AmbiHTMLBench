<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三天路线规划</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --grid-line: #e0e0e0;
            --text-color: #333;
            --highlight-green: #d4edda;
            --highlight-green-text: #155724;
            --transport-bg: #fff0f0;
            --box-border: #d9534f;
            --arrow-color: #f1c40f;
        }

        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: var(--bg-color);
            /* Mimic the grid paper background */
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .itinerary-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 15px;
            align-items: start;
        }

        /* Left Column: Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .day-label {
            background-color: var(--highlight-green);
            color: var(--highlight-green-text);
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
            align-self: flex-start;
            margin-left: 10px;
        }

        .arrow-down {
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid var(--arrow-color);
            margin: 5px 0;
        }

        .location {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }

        .transport {
            display: flex;
            align-items: center;
            background-color: var(--transport-bg);
            padding: 5px 10px;
            border-radius: 4px;
            margin: 5px 0;
            font-size: 14px;
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
        }

        .transport svg {
            margin: 0 5px;
            width: 20px;
            height: 20px;
        }

        /* Right Column: Descriptions */
        .descriptions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .desc-box {
            border: 2px solid var(--box-border);
            padding: 15px;
            background: #fff;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
        }
        
        /* Aligning specific boxes with timeline items roughly */
        .desc-box:nth-child(1) { margin-top: 45px; } /* Align with Ciqikou */
        .desc-box:nth-child(2) { margin-top: 10px; } /* Align with Luo Zhongli */
        .desc-box:nth-child(3) { margin-top: 10px; } /* Align with Mountain City Walkway */
        .desc-box:nth-child(4) { margin-top: 10px; } /* Align with Guanyinqiao */
        .desc-box:nth-child(5) { margin-top: 10px; } /* Align with Nine Streets */

        .desc-title {
            font-weight: bold;
            color: #333;
        }

        /* Icons */
        .icon-train { fill: #3498db; }
        .icon-bus { fill: #2ecc71; }
        .icon-walk { fill: #e67e22; }
        .icon-arrow { fill: var(--arrow-color); }

        @media (max-width: 768px) {
            .itinerary-grid {
                grid-template-columns: 1fr;
            }
            .desc-box {
                margin-top: 0 !important;
                margin-bottom: 20px;
            }
            .timeline {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>第三天路线规划</h1>

    <div class="itinerary-grid">
        <!-- Left Column: Timeline Flow -->
        <div class="timeline">
            <div class="day-label">第三天</div>
            <div class="arrow-down"></div>
            
            <div class="location">磁器口</div>
            
            <div class="transport">
                <span>1号线</span>
                <!-- Train Icon -->
                <svg class="icon-train" viewBox="0 0 24 24">
                    <path d="M12 2C8 2 4 3.5 4 6v12c0 2.5 4 4 8 4s8-1.5 8-4V6c0-2.5-4-4-8-4zm0 2c3 0 6 1.5 6 4s-3 4-6 4-6-1.5-6-4 3-4 6-4zm0 14c-2.5 0-4.5-1-6-2.5V18c0 1.5 2.5 3 6 3s6-1.5 6-3v-2.5c-1.5 1.5-3.5 2.5-6 2.5z"/>
                    <circle cx="7" cy="10" r="2" fill="white"/>
                    <circle cx="17" cy="10" r="2" fill="white"/>
                </svg>
                <span>30分钟</span>
            </div>

            <div class="location">罗中立美术馆</div>

            <div class="transport">
                <span>1号线</span>
                <!-- Train Icon -->
                <svg class="icon-train" viewBox="0 0 24 24">
                    <path d="M12 2C8 2 4 3.5 4 6v12c0 2.5 4 4 8 4s8-1.5 8-4V6c0-2.5-4-4-8-4zm0 2c3 0 6 1.5 6 4s-3 4-6 4-6-1.5-6-4 3-4 6-4zm0 14c-2.5 0-4.5-1-6-2.5V18c0 1.5 2.5 3 6 3s6-1.5 6-3v-2.5c-1.5 1.5-3.5 2.5-6 2.5z"/>
                    <circle cx="7" cy="10" r="2" fill="white"/>
                    <circle cx="17" cy="10" r="2" fill="white"/>
                </svg>
                <span>80分钟</span>
            </div>

            <div class="location">山城步道</div>

            <div class="transport">
                <span>公交</span>
                <!-- Bus Icon -->
                <svg class="icon-bus" viewBox="0 0 24 24">
                    <path d="M4 16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-2H4v2zm14-10H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-1 9c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm-10 0c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1z"/>
                    <rect x="7" y="7" width="10" height="6" fill="white"/>
                </svg>
                <span>32分钟</span>
            </div>

            <div class="location">观音桥</div>

            <div class="transport">
                <span>步行</span>
                <!-- Walk Icon -->
                <svg class="icon-walk" viewBox="0 0 24 24">
                    <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>
                </svg>
                <span>15分钟</span>
            </div>

            <div class="location">九街</div>
        </div>

        <!-- Right Column: Descriptions -->
        <div class="descriptions">
            <div class="desc-box">
                <span class="desc-title">磁器口 (免费)：</span>汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌
            </div>
            <div class="desc-box">
                <span class="desc-title">罗中立美术馆 (免费)：</span>拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
            </div>
            <div class="desc-box">
                <span class="desc-title">山城步道 (免费)：</span>建在悬崖边的临江步道，汇聚老重庆特色步道
            </div>
            <div class="desc-box">
                <span class="desc-title">观音桥 (免费)：</span>超大商圈，还有很多地道重庆小吃
            </div>
            <div class="desc-box">
                <span class="desc-title">九街 (免费)：</span>酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
            </div>
        </div>
    </div>
</div>

</body>
</html>
