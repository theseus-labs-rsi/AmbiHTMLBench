<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老吴の创业随笔</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: "SimSun", "Songti SC", "STSong", "AR PL New Sung", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .paper-container {
            width: 100%;
            max-width: 600px;
            background-color: #e8dcc3; /* Approximate beige paper color */
            background-image: radial-gradient(circle at center, #f0e6d2 0%, #dcc8a8 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
            color: #1a1a1a;
            position: relative;
        }

        /* Simulating the texture slightly with a border or overlay if needed, but solid color is cleaner */
        .paper-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            pointer-events: none;
            opacity: 0.5;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 40px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .content {
            font-size: 28px;
            line-height: 1.8;
            margin-bottom: 50px;
            text-align: justify; /* Justify text to fill the width like the image */
            text-align-last: center; /* Center the last line */
            position: relative;
            z-index: 1;
        }
        
        /* Specific adjustment to match the centered look of the image more closely */
        .content-centered {
            text-align: center;
        }

        .footer {
            font-size: 16px;
            color: #333;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 20px;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .footer span {
            margin: 0 5px;
            color: #999;
        }

        @media (max-width: 480px) {
            .content {
                font-size: 22px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="paper-container">
        <h1>老吴の创业随笔</h1>
        
        <div class="content content-centered">
            《易经》中说：“小财<br>
            靠勤，大财靠德，德不厚<br>
            ，无以载物。”靠出卖时<br>
            间和劳动力 赚钱的人，<br>
            只能发点小财。一个人每<br>
            天，时间有限，精力有限<br>
            ，分身乏术。
        </div>

        <div class="footer">
            商业思维 <span>|</span> 个人提升 <span>|</span> 创业心得 <span>|</span> 认知觉醒
        </div>
    </div>

</body>
</html>
