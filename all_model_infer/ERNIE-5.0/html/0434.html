<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Layout Replication</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Top Section Styles */
        .top-section {
            background-color: #E6D5B8; /* Beige background */
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #ccc;
        }

        .top-left {
            flex: 1;
            padding-right: 20px;
        }

        .top-right {
            flex: 0 0 300px;
            position: relative;
        }

        .header-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .red-circle {
            width: 40px;
            height: 40px;
            background-color: #D93025;
            border-radius: 50%;
            margin-left: 15px;
            display: inline-block;
        }

        .content-text {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        /* Meme Image Placeholder */
        .meme-container {
            width: 100%;
            height: 250px;
            background-color: #ddd;
            position: relative;
            overflow: hidden;
            border: 1px solid #999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        
        /* Simulating the crying kid image with a placeholder div */
        .meme-image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #fff 0%, #e0e0e0 100%);
            position: relative;
        }
        
        .meme-text-overlay {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 1px 1px 2px black;
            background-color: rgba(0,0,0,0.5);
            padding: 5px 0;
        }

        /* Bottom Section Styles */
        .bottom-section {
            background-color: #2E3A59; /* Dark Blue background */
            color: #E0E0E0;
            padding: 40px;
        }

        .bottom-header {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .green-check {
            width: 40px;
            height: 25px;
            border: 5px solid #4CAF50;
            border-top: 0;
            border-left: 0;
            transform: rotate(45deg);
            margin-left: 15px;
            display: inline-block;
        }

        .article-body {
            font-family: "SimSun", "Songti SC", serif;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 30px;
        }

        .citation {
            text-align: right;
            font-size: 14px;
            font-style: italic;
            color: #ccc;
            margin-top: 20px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .top-section {
                flex-direction: column;
            }
            .top-right {
                margin-top: 20px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Section -->
    <div class="top-section">
        <div class="top-left">
            <div class="header-text">
                我写的：
                <span class="red-circle"></span>
            </div>
            <div class="content-text">
                我们民族的追梦史充满艰辛。
            </div>
        </div>
        <div class="top-right">
            <div class="meme-container">
                <div class="meme-image-placeholder">
                    <!-- Simulating the visual of the crying child -->
                    <div style="position:absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 150px; height: 150px; background-color: #ffccaa; border-radius: 50%; opacity: 0.8;"></div>
                    <div class="meme-text-overlay">学习使我妈快乐</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
        <div class="bottom-header">
            人民日报写的：
            <span class="green-check"></span>
        </div>
        <div class="article-body">
            我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
        </div>
        <div class="citation">
            ——2013.4.1《筑就民族复兴的“中国梦”》
        </div>
    </div>
</div>

</body>
</html>
