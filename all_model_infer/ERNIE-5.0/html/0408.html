<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals & Objectives</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #4a3b32;
            margin: 40px;
            background-color: #fff;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            text-align: right;
            font-size: 42px;
            font-weight: normal;
            margin: 0 0 20px 0;
            color: #4a3b32;
        }

        .date-range {
            font-size: 24px;
            font-weight: normal;
            color: #4a3b32;
        }

        .main-content {
            display: flex;
            align-items: flex-start;
        }

        .goals-list {
            flex: 1;
            padding-right: 20px;
        }

        .goal-item {
            font-size: 22px;
            color: #2f8f8f;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .diagram-section {
            display: flex;
            flex-direction: column;
            margin-top: 10px; /* Slight adjustment to align visually */
        }

        .diagram-row {
            display: flex;
            align-items: center;
            height: 60px; /* Approximate height per goal line */
        }

        .bracket {
            font-family: "Times New Roman", Times, serif;
            font-size: 140px;
            line-height: 0.6;
            color: #4a3b32;
            margin-right: 10px;
            font-weight: bold;
        }

        .arrow {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 25px solid #2f8f8f; /* Points Left */
            margin: 0 20px;
        }

        .label {
            font-size: 22px;
            color: #4a3b32;
            line-height: 1.3;
            width: 160px;
        }

        /* Specific adjustments for the grouping logic */
        .top-group {
            height: 180px; /* Spans 3 goals */
            align-items: center;
        }
        
        .bottom-group {
            height: 120px; /* Spans 2 goals */
            align-items: center;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Goals & Objectives</h1>
        <div class="date-range">From January 1, 2016 – December 31, 2018, we will:</div>
    </div>

    <div class="main-content">
        <div class="goals-list">
            <div class="goal-item">Goal 1: XX</div>
            <div class="goal-item">Goal 2: XX</div>
            <div class="goal-item">Goal 3: XX</div>
            <div class="goal-item">Goal 4: Money</div>
            <div class="goal-item">Goal 5: People & Infrastructure</div>
        </div>

        <div class="diagram-section">
            <!-- Top Group: Goals 1, 2, 3 -->
            <div class="diagram-row top-group">
                <div class="bracket">{</div>
                <div class="arrow"></div>
                <div class="label">Theory of Change Goals</div>
            </div>

            <!-- Bottom Group: Goals 4, 5 -->
            <div class="diagram-row bottom-group">
                <div class="bracket">{</div>
                <div class="arrow"></div>
                <div class="label">Organization Goals</div>
            </div>
        </div>
    </div>

</body>
</html>
