<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侦探能量站 - 手写笔记</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: "KaiTi", "STKaiti", "Serif", sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        .notebook-page {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            padding: 60px 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            line-height: 1.8;
            font-size: 18px;
            position: relative;
        }

        /* Simulating the paper texture slightly */
        .notebook-page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 30px; /* Approximate line height visual */
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            color: #444;
            font-weight: normal;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 20px;
            text-align: justify;
            text-indent: 2em;
        }

        .signature {
            text-align: center;
            margin-top: 40px;
            color: #a0522d; /* Sienna/Brownish red */
            font-size: 20px;
            line-height: 2;
        }

        /* Specific styling to mimic the handwritten flow */
        .handwritten-text {
            white-space: pre-wrap; /* Preserves line breaks roughly */
        }
        
        /* Adjusting specific lines to match the visual break in the image */
        .break-line {
            display: block;
        }

    </style>
</head>
<body>

    <div class="notebook-page">
        <div class="content">
            <h1>侦探能量站</h1>
            
            <div class="handwritten-text">
                <p style="text-indent: 0; margin-bottom: 10px;">
                    当偏见裹挟认知，无视事实，操纵舆论的事发生，我们该如何对待？
                </p>
                
                <p>
                    如果我不害怕人微言轻，也许你就不会经历人言可畏，用心辨别真相，用爱和真诚可以消融流言。正如各位侦探所言，“千军万马踩过的时候，小小的一脚都有可能是致命伤，我们谁都不想成为这样的人，我们也不要成为加害的人”，遭遇不合时，隐忍不是唯一道路，我们可以向不公平呐喊，只有大家都勇敢起来，加害者才会觉得我们没有那么好欺负。
                </p>

                <div class="signature">
                    愿你笔尖下皆自由之风，一笔一画，<br>
                    一字一句，黑白分明。
                </div>
            </div>
        </div>
    </div>

</body>
</html>
