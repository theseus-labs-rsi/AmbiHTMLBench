<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家名列表</title>
    <style>
        body {
            background-color: #fdf6f0;
            font-family: "Songti SC", "SimSun", "STSong", serif;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #d98e56;
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px 60px; /* Row gap, Column gap */
            font-size: 18px;
            line-height: 2.2;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .item {
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>国家名</h1>
        
        <div class="content-grid">
            <!-- Left Column -->
            <div class="column">
                <div class="item">弘昼国</div>
                <div class="item">安平国</div>
                <div class="item">苍狼国</div>
                <div class="item">黑鹰国</div>
                <div class="item">古木国</div>
                <div class="item">临越国</div>
                <div class="item">临月国</div>
                <div class="item">逸水国</div>
                <div class="item">飞虎国</div>
                <div class="item">静月国</div>
                <div class="item">火凤国</div>
                <div class="item">长风国</div>
                <div class="item">凤临国</div>
            </div>

            <!-- Right Column -->
            <div class="column">
                <div class="item">金鹏国</div>
                <div class="item">玄龙国</div>
                <div class="item">夜莲国</div>
                <div class="item">北冥国</div>
                <div class="item">绮霞国</div>
                <div class="item">银霜国</div>
                <div class="item">轩辕国</div>
                <div class="item">真北国</div>
                <div class="item">碧潭国</div>
                <div class="item">青果国</div>
                <div class="item">鸿熙国</div>
                <div class="item">阳明国</div>
                <div class="item">落霞国</div>
            </div>
        </div>
    </div>

</body>
</html>
