<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Document</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
            display: flex;
            justify-content: center;
        }

        .paper {
            background-color: #fff;
            width: 800px;
            height: 1100px;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            /* Grid pattern simulation */
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
            overflow: hidden;
        }

        .page-number {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff6600;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 24px;
            z-index: 10;
        }

        .content {
            writing-mode: vertical-rl;
            direction: rtl;
            height: 100%;
            padding: 40px 40px 40px 60px; /* Top, Right, Bottom, Left */
            box-sizing: border-box;
            font-size: 20px;
            line-height: 1.8;
            color: #000;
        }

        .column {
            display: inline-block;
            vertical-align: top;
            margin-left: 30px; /* Space between columns */
            height: 100%;
        }

        .seal {
            position: absolute;
            bottom: 150px;
            left: 40px;
            width: 50px;
            height: 50px;
            background-color: #d93025;
            color: #d93025; /* Simulating the carved look */
            border: 2px solid #d93025;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            transform: rotate(-5deg);
        }
        
        /* Simulating the white characters inside the red seal */
        .seal::after {
            content: "莫玄印";
            color: #fff; 
            /* In a real seal, the text is carved out, so it shows the background color, 
               but here we simulate the red ink block */
            text-shadow: 1px 1px 0px #d93025; 
        }

        .signature-block {
            position: absolute;
            bottom: 100px;
            left: 40px;
            writing-mode: vertical-rl;
            direction: rtl;
            font-size: 22px;
        }

        .date-block {
            position: absolute;
            bottom: 40px;
            left: 40px;
            writing-mode: vertical-rl;
            direction: rtl;
            font-size: 18px;
        }

        br {
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="paper">
        <div class="page-number">第三页</div>

        <div class="content">
            <!-- Column 1 -->
            <div class="column">
                因前时的通字，讨论很清楚了，一般情况下，生字是不会用古文字的（用古文字的只有“错”），他们会把嘴贴到水面上往里吸水。
            </div>

            <!-- Column 2 -->
            <div class="column">
                总之，必须注意观察细
            </div>

            <!-- Column 3 -->
            <div class="column">
                致，也要注意训练在为浅的
            </div>

            <!-- Column 4 -->
            <div class="column">
                基础，想像理的能力，
            </div>

            <!-- Column 5 -->
            <div class="column">
                推而广之，都是我之所误。
            </div>

            <!-- Column 6 -->
            <div class="column">
                请谅吧。
            </div>

            <!-- Column 7 -->
            <div class="column">
                占顿 笔健！
            </div>

            <!-- Column 8 (Signature) -->
            <div class="column" style="margin-top: 50px;">
                莫玄
            </div>
        </div>

        <div class="seal"></div>

        <div class="signature-block">
            莫玄
        </div>

        <div class="date-block">
            癸卯年七月七日晚
        </div>
    </div>

</body>
</html>
