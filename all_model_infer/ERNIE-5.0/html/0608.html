<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山里的约会</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --text-color: #3a4a3a;
            --accent-green: #5d7a5d;
            --sidebar-width: 60px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: "KaiTi", "STKaiti", "Serif", sans-serif;
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Layout */
        .sidebar {
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .sidebar-item {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--accent-green);
            margin-bottom: 20px;
        }

        .sidebar-item.english {
            font-family: "Times New Roman", serif;
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        /* Top Header Text */
        .top-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        /* Main Title */
        .title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0 40px 0;
            position: relative;
        }

        .main-title {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 80px;
            line-height: 1.2;
            color: #2f3e2f;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 10px;
            font-weight: normal;
        }
        
        .title-col-right {
            margin-right: 20px;
        }
        
        .title-col-left {
            margin-left: 20px;
        }

        /* Illustration Placeholder */
        .illustration-area {
            flex: 1;
            background: linear-gradient(to bottom, #dcead8 0%, #b8d4a3 60%, #8fb36e 100%);
            border-radius: 4px;
            position: relative;
            margin: 0 20px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Simulating the scene with CSS shapes/text for fidelity without external images */
        .scene-element {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="%23dcead8"/><circle cx="100" cy="100" r="50" fill="%23a8c686" opacity="0.6"/><circle cx="700" cy="150" r="80" fill="%238fb36e" opacity="0.7"/><rect x="0" y="400" width="800" height="200" fill="%238fb36e"/><text x="400" y="300" font-size="20" fill="%235d7a5d" text-anchor="middle" opacity="0.5">[Illustration: People farming and gathering in a field]</text></svg>');
            background-size: cover;
            background-position: center bottom;
        }

        .watermark {
            position: absolute;
            top: 50%;
            right: 20%;
            font-size: 14px;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            font-family: sans-serif;
            pointer-events: none;
        }

        /* Bottom Text */
        .bottom-text {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            font-size: 16px;
            line-height: 1.8;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            padding: 0 20px;
        }

        .text-col {
            flex: 1;
            padding: 0 15px;
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                padding: 10px;
                border-right: none;
                border-bottom: 1px solid rgba(0,0,0,0.05);
            }
            .sidebar-item {
                writing-mode: horizontal-tb;
                margin-bottom: 0;
                font-size: 14px;
            }
            .main-title {
                font-size: 50px;
            }
            .bottom-text {
                flex-direction: column;
                gap: 20px;
            }
            .illustration-area {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-item">大班综合</div>
        <div class="sidebar-item english">TongCai 2021</div>
        <div class="sidebar-item english">Autumn</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Top Header -->
        <div class="top-header">
            <div>地上的路原来很平坦可是有太多人走过这些路过的人们太累了</div>
            <div>于是他们决定扔下一些东西</div>
        </div>

        <!-- Title -->
        <div class="title-container">
            <div class="main-title title-col-right">
                山里的
            </div>
            <div class="main-title title-col-left">
                约会
            </div>
        </div>

        <!-- Illustration Area -->
        <div class="illustration-area">
            <div class="scene-element"></div>
            <div class="watermark">
                @Hiro豆豆老师<br>
                From 小红书
            </div>
        </div>

        <!-- Bottom Text -->
        <div class="bottom-text">
            <div class="text-col">
                有的人扔下了悲伤<br>
                变成了路上的石头
            </div>
            <div class="text-col">
                有的人留下快乐<br>
                变成了山上的树苗
            </div>
            <div class="text-col">
                我把装在瓶子里的思念<br>
                放在高高的山顶上<br>
                交成了黑夜的眼睛
            </div>
        </div>

    </div>

</body>
</html>
