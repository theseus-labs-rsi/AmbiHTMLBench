<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一张图搞定HMO</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #e3f2fd;
            /* Simulating the grid background */
            background-image: 
                linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #8d6e63;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .cow-icon {
            position: absolute;
            top: -10px;
            right: 0;
            font-size: 3rem;
            transform: rotate(-10deg);
        }

        .content-card {
            background-color: #ffffff;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #ffffff;
        }

        .intro-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
            text-align: justify;
        }

        .highlight {
            color: #d84315;
            font-weight: bold;
        }

        .section-block {
            margin-bottom: 25px;
        }

        .section-header {
            background-color: #ffb74d;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section-content {
            background-color: #fff8e1;
            border: 2px solid #ffe0b2;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
        }

        .citation {
            font-size: 0.8rem;
            color: #888;
            vertical-align: super;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .content-card { padding: 20px; }
            .section-header { font-size: 1rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>一张图搞定HMO</h1>
        <div class="cow-icon">🐄</div>

        <div class="content-card">
            <!-- Intro Section -->
            <div class="intro-text">
                HMO=中文“母乳低聚糖”，是源乳中的<span class="highlight">第一大免疫活性营养</span>，而且含量还是乳铁蛋白的<span class="highlight">12倍</span><span class="citation">1</span>，在牛乳、羊乳中都没有这个成分，被誉为“<span class="highlight">乳黄金</span>”。
            </div>

            <!-- Section 1 -->
            <div class="section-block">
                <div class="section-header">
                    HMO具有调节肠道菌群平衡作用<span class="citation">3-6</span>
                </div>
                <div class="section-content">
                    肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自于肠道，因此呵护好宝宝肠道对提升保护力非常重要。而HMO可以促进有益菌生长，提高保护力。
                </div>
            </div>

            <!-- Section 2 -->
            <div class="section-block">
                <div class="section-header">
                    HMO为宝宝建立一道健康防护屏障<span class="citation">5-6</span>
                </div>
                <div class="section-content">
                    HMO能够为宝宝建立一道健康防护屏障，防止有害菌侵扰。
                </div>
            </div>

            <!-- Section 3 -->
            <div class="section-block">
                <div class="section-header">
                    HMO激发免疫系统，提高宝宝保护力<span class="citation">6</span>
                </div>
                <div class="section-content">
                    HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝保护力，增强宝宝体质。<span class="citation">7-8</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
