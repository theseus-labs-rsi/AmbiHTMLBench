<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钩针工具选择指南</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            background-color: #5a6e68;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 15px;
            vertical-align: middle;
        }

        thead th {
            background-color: #5a6e68;
            color: #fff;
            font-weight: normal;
            font-size: 18px;
        }

        /* Column Widths approximation */
        th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; }
        th:nth-child(2), td:nth-child(2) { width: 40%; text-align: left; line-height: 1.6; }
        th:nth-child(3), td:nth-child(3) { width: 25%; text-align: center; }
        th:nth-child(4), td:nth-child(4) { width: 25%; text-align: center; }

        .tool-name {
            font-weight: bold;
            font-size: 16px;
        }

        .essential {
            color: #d9534f;
            font-size: 14px;
            display: block;
            margin-top: 5px;
        }

        .placeholder-img {
            width: 100%;
            height: 60px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            border: 1px dashed #ccc;
            box-sizing: border-box;
        }
        
        /* Specific placeholder styles to mimic images roughly */
        .img-hooks { background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); height: 40px; }
        .img-yarn { background: linear-gradient(to bottom, #a8edea 0%, #fed6e3 100%); height: 40px; }
        .img-scissors { background: #fff; border: 1px solid #333; height: 40px; position: relative; }
        .img-scissors::after { content: "'"; font-size: 24px; }
        .img-needles { background: linear-gradient(to right, #ff512f, #dd2476, #f09819, #4facfe, #00f2fe); height: 40px; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>钩针工具选择指南</h1>
        <p>--only手作集--</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>工具</th>
                <th>用途</th>
                <th>初学者建议</th>
                <th>实物图</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <span class="tool-name">钩针</span>
                    <span class="essential">(必备)</span>
                </td>
                <td>
                    钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》
                </td>
                <td>
                    3mm左右的钩针最实用
                </td>
                <td>
                    <div class="placeholder-img img-hooks">[Image: Colorful Crochet Hooks]</div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">毛线</span>
                    <span class="essential">(必备)</span>
                </td>
                <td>
                    毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》
                </td>
                <td>
                    中粗的宝宝棉/牛奶棉
                </td>
                <td>
                    <div class="placeholder-img img-yarn">[Image: Yarn Balls]</div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">剪刀</span>
                    <span class="essential">(必备)</span>
                </td>
                <td>
                    剪断编织过程中的编织线
                </td>
                <td>
                    必备
                </td>
                <td>
                    <div class="placeholder-img img-scissors"></div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">缝合针</span>
                </td>
                <td>
                    缝合、修补和连接编织面料
                </td>
                <td>
                    非必须
                </td>
                <td>
                    <div class="placeholder-img img-needles">[Image: Colorful Needles]</div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
