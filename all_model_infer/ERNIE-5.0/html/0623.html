<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音 VS 快手 - 产品小课堂</title>
    <style>
        :root {
            --bg-color: #f4e4bc;
            --container-bg: #ffffff;
            --text-main: #5d4037;
            --text-dark: #3e2723;
            --accent-yellow: #ffca28;
            --accent-orange: #ffb300;
            --table-header-bg: #ffe082;
            --table-row-alt: #fff8e1;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: var(--text-main);
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header Section */
        .main-title {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .sub-header {
            background-color: #fff3e0;
            border: 2px solid #ffcc80;
            border-radius: 15px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .paintbrush-icon {
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%) rotate(-15deg);
            font-size: 40px;
            color: #d7ccc8;
        }

        .sub-header h2 {
            margin: 0;
            font-size: 32px;
            color: var(--text-dark);
            font-weight: bold;
        }

        /* Section Styling */
        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-number {
            background-color: var(--text-dark);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
        }

        .section-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
            border-bottom: 3px solid var(--accent-orange);
            padding-bottom: 5px;
            display: inline-block;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: var(--table-header-bg);
            color: var(--text-dark);
            font-weight: bold;
        }

        td {
            color: #666;
        }

        tr:nth-child(even) {
            background-color: var(--table-row-alt);
        }
        
        /* Specific column widths approximations */
        .col-name { width: 10%; }
        .col-slogan { width: 20%; }
        .col-pos { width: 20%; }
        .col-strat { width: 25%; }
        .col-mon { width: 25%; }

        .footer-line {
            border-top: 2px dashed #ccc;
            margin-top: 40px;
            width: 50%;
            margin-left: auto;
            margin-right: auto;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .main-title { font-size: 32px; }
            .sub-header h2 { font-size: 24px; }
            table { font-size: 12px; }
            th, td { padding: 8px 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Header -->
        <h1 class="main-title">抖音 VS 快手</h1>

        <!-- Sub Header -->
        <div class="sub-header">
            <span class="paintbrush-icon">🖌️</span>
            <h2>产品小课堂</h2>
        </div>

        <!-- Section 03 -->
        <div class="section-title">
            <span class="section-number">03</span>
            <span class="section-name">抖音与快手</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col-name"></th>
                    <th class="col-slogan">slogan</th>
                    <th class="col-pos">产品定位</th>
                    <th class="col-strat">策略</th>
                    <th class="col-mon">变现</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>抖音</strong></td>
                    <td>记录美好生活</td>
                    <td>短视频媒体</td>
                    <td>以优质内容为中心</td>
                    <td>广告收入、电商</td>
                </tr>
                <tr>
                    <td><strong>快手</strong></td>
                    <td>拥抱每一种生活</td>
                    <td>短视频社区</td>
                    <td>以社交中心，大部分流量</td>
                    <td>直播收入、电商</td>
                </tr>
            </tbody>
        </table>

        <!-- Section 04 -->
        <div class="section-title">
            <span class="section-number">04</span>
            <span class="section-name">抖音电商与快手电商</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col-name"></th>
                    <th class="col-pos">产品定位</th>
                    <th class="col-strat">重点指标</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>抖音电商</strong></td>
                    <td>兴趣逻辑，内容场景刺激需求</td>
                    <td>直播间GPM</td>
                </tr>
                <tr>
                    <td><strong>快手电商</strong></td>
                    <td>信任逻辑，头部主播优势</td>
                    <td>复购</td>
                </tr>
            </tbody>
        </table>

        <div class="footer-line"></div>
    </div>

</body>
</html>
