<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王源 机场私服Look</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr 1.2fr;
            gap: 20px;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Left Column: Portrait */
        .col-left {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-portrait {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Middle Column: Details */
        .col-middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 10px;
        }

        .main-title {
            font-size: 48px;
            font-weight: 900;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .item-section {
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }

        .brand-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #000;
        }

        .item-desc {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .item-price {
            font-size: 13px;
            color: #888;
        }

        .glasses-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .glasses-thumb {
            width: 150px;
            height: 100px;
            object-fit: cover;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        /* Right Column: Full Body */
        .col-right {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .img-fullbody {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .col-right {
                order: -1; /* Move full body to top on mobile if desired, or keep bottom */
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column: Portrait -->
    <div class="col-left">
        <!-- Placeholder for the main portrait image -->
        <img src="https://placehold.co/400x600/eeeeee/333333?text=Portrait+View" alt="王源 Portrait" class="img-portrait">
    </div>

    <!-- Middle Column: Text Details -->
    <div class="col-middle">
        <h1 class="main-title">王源</h1>
        <p class="subtitle">最新机场私服Look</p>

        <!-- Glasses Item -->
        <div class="glasses-section">
            <img src="https://placehold.co/150x100/eeeeee/333333?text=Glasses+Close-up" alt="Glasses" class="glasses-thumb">
            <div class="brand-name">PRSR帕莎</div>
            <div class="item-desc">品牌定制款</div>
        </div>

        <!-- Shirt Item -->
        <div class="item-section">
            <img src="https://placehold.co/200x200/ffffff/333333?text=White+T-Shirt" alt="T-Shirt" class="item-img">
            <div class="brand-name">Etudes</div>
            <div class="item-desc">LOGO印花圆领短袖T恤</div>
            <div class="item-price">参考价 ¥ 1,080</div>
        </div>

        <!-- Jeans Item -->
        <div class="item-section">
            <img src="https://placehold.co/150x250/224488/ffffff?text=Blue+Jeans" alt="Jeans" class="item-img">
            <div class="brand-name">LOEWE</div>
            <div class="item-desc">单宁布渔夫翻边牛仔裤</div>
            <div class="item-price">参考价 ¥ 7,700</div>
        </div>

        <!-- Shoes Item -->
        <div class="item-section">
            <img src="https://placehold.co/200x100/ffffff/333333?text=White+Sneakers" alt="Sneakers" class="item-img">
            <div class="brand-name">GUCCI</div>
            <div class="item-desc">MAC80系列男士运动鞋</div>
            <div class="item-price">参考价 ¥ 7,600</div>
        </div>
    </div>

    <!-- Right Column: Full Body Back View -->
    <div class="col-right">
        <!-- Placeholder for the full body back view image -->
        <img src="https://placehold.co/400x800/eeeeee/333333?text=Full+Body+Back+View" alt="Full Body Back View" class="img-fullbody">
    </div>
</div>

</body>
</html>
