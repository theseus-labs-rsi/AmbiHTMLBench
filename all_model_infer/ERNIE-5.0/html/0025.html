<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Conversation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .message-row.left {
            flex-direction: row;
        }

        .message-row.right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            flex-shrink: 0;
            background-color: #ddd;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bubble {
            max-width: 70%;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .bubble.left {
            background-color: #ffffff;
            color: #000000;
            border-top-left-radius: 0;
        }

        .bubble.right {
            background-color: #95ec69;
            color: #000000;
            border-top-right-radius: 0;
        }

        .numbered-tag {
            display: inline-block;
            background-color: #6fa3d6;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
            line-height: 1.2;
        }

        /* Specific styling for the landscape avatars */
        .avatar-placeholder-landscape {
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 40%, #2E8B57 40%, #2E8B57 100%);
        }
        
        /* Specific styling for the right avatar */
        .avatar-placeholder-person {
            background-color: #dcb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="chat-container">
        
        <!-- Message 1 -->
        <div class="message-row left">
            <div class="avatar avatar-placeholder-landscape">
                <img src="https://via.placeholder.com/40/87CEEB/ffffff?text=Img" alt="Avatar">
            </div>
            <div class="bubble left">
                <span class="numbered-tag">6</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。
            </div>
        </div>

        <!-- Message 2 -->
        <div class="message-row left">
            <div class="avatar avatar-placeholder-landscape">
                <img src="https://via.placeholder.com/40/87CEEB/ffffff?text=Img" alt="Avatar">
            </div>
            <div class="bubble left">
                <span class="numbered-tag">7</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰
            </div>
        </div>

        <!-- Message 3 -->
        <div class="message-row left">
            <div class="avatar avatar-placeholder-landscape">
                <img src="https://via.placeholder.com/40/87CEEB/ffffff?text=Img" alt="Avatar">
            </div>
            <div class="bubble left">
                <span class="numbered-tag">8</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。
            </div>
        </div>

        <!-- Message 4 -->
        <div class="message-row left">
            <div class="avatar avatar-placeholder-landscape">
                <img src="https://via.placeholder.com/40/87CEEB/ffffff?text=Img" alt="Avatar">
            </div>
            <div class="bubble left">
                你重新写吧
            </div>
        </div>

        <!-- Message 5 (Right) -->
        <div class="message-row right">
            <div class="bubble right">
                好的，谢谢老师
            </div>
            <div class="avatar avatar-placeholder-person">
                <img src="https://via.placeholder.com/40/dcb/555?text=Person" alt="Avatar">
            </div>
        </div>

    </div>

</body>
</html>
