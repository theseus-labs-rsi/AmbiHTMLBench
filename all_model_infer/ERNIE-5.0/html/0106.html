<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫砂选购指南</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f9f7f2;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            color: #4a4a4a;
            margin-bottom: 30px;
            border: 2px solid #e0c090;
            padding: 15px;
            border-radius: 10px;
            background-color: #fffbf0;
        }

        h2 {
            font-size: 20px;
            color: #d9534f;
            border-left: 5px solid #d9534f;
            padding-left: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px 8px;
            text-align: center;
        }

        th {
            background-color: #5d5d5d;
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .highlight-circle {
            border: 2px solid #d9534f;
            border-radius: 50%;
            padding: 2px 8px;
            display: inline-block;
            font-weight: bold;
        }

        .text-red {
            color: #d9534f;
            font-weight: bold;
        }

        .text-green-bg {
            background-color: #dff0d8;
            color: #3c763d;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .summary-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            border-radius: 5px;
        }

        .check-icon {
            color: #5cb85c;
            font-weight: bold;
            margin-right: 5px;
        }

        .sub-text {
            font-size: 12px;
            color: #666;
            display: block;
            margin-top: 5px;
        }
        
        .center-text {
            text-align: center;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>猫砂都有哪些款？</h1>

    <h2>三种猫砂尺寸哪个是你最爱</h2>
    <table>
        <thead>
            <tr>
                <th>尺寸</th>
                <th>重量</th>
                <th>结团效果</th>
                <th>其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.5mm</td>
                <td>轻</td>
                <td>上</td>
                <td>易带出，价格略高</td>
            </tr>
            <tr>
                <td>
                    <span class="highlight-circle">2mm</span>
                    <span class="sub-text">综合性价比推荐</span>
                </td>
                <td>中</td>
                <td>中</td>
                <td>综合性价比高</td>
            </tr>
            <tr>
                <td>3mm</td>
                <td>重</td>
                <td>差</td>
                <td>推荐度低，但价格也低</td>
            </tr>
        </tbody>
    </table>

    <h2>猫砂都有哪些种类</h2>
    
    <div class="summary-box">
        总结：2mm混合砂yyds
    </div>

    <table>
        <thead>
            <tr>
                <th>种类</th>
                <th>优点</th>
                <th>其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>膨润土</td>
                <td>价格低廉</td>
                <td>粉尘大</td>
            </tr>
            <tr>
                <td>豆腐猫砂</td>
                <td>原料更安全，闻起来也比较好</td>
                <td>价格偏高，纯豆腐结团略差</td>
            </tr>
            <tr>
                <td>
                    <span class="highlight-circle">混合猫砂</span>
                </td>
                <td>
                    结合上述优点，价格适中
                    <br>
                    <span class="text-green-bg">
                        <span class="check-icon">✔</span>普通养宠家庭足以满足需求
                    </span>
                </td>
                <td>
                    比例推荐 <span class="text-red">7:3或6:4</span>，结团快且用量省
                </td>
            </tr>
            <tr>
                <td>沸石</td>
                <td>可循环利用</td>
                <td>需要自己洗</td>
            </tr>
            <tr>
                <td>其他新型原料</td>
                <td>价格高，新颖</td>
                <td>效果待考核，贵</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
