<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指读 (Pointing Reading)</title>
    <style>
        body {
            font-family: "Songti SC", "SimSun", "Times New Roman", serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .page-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header Section */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: #666;
        }

        .header-banner {
            background-color: #e0e0e0;
            text-align: center;
            padding: 5px 0;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }

        .method-label {
            font-size: 14px;
            margin-right: 15px;
            font-weight: normal;
            color: #555;
        }

        /* Content Sections */
        .step-block {
            margin-bottom: 25px;
        }

        .highlight-box {
            background-color: #ffe0b2; /* Light orange */
            padding: 5px 10px;
            display: inline-block;
            border-radius: 3px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #ffcc80;
        }

        p {
            margin-top: 5px;
            margin-bottom: 15px;
            text-align: justify;
        }

        .long-text {
            background-color: #fff3e0; /* Slightly darker orange for the block */
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #ffb74d;
        }

        .note-text {
            margin-top: 20px;
            font-style: italic;
            color: #444;
        }

        /* Illustration Placeholder */
        .illustration-container {
            margin-top: 40px;
            text-align: right;
        }

        .cat-drawing {
            width: 200px;
            height: 250px;
            background-color: #f9f9f9;
            border: 1px dashed #ccc;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            position: relative;
        }
        
        /* Simulating the drawing roughly with CSS shapes for fidelity */
        .cat-head {
            width: 100px;
            height: 80px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            margin-bottom: 10px;
        }
        .cat-ear {
            width: 20px;
            height: 30px;
            background: #fff;
            border: 2px solid #333;
            position: absolute;
            top: -15px;
        }
        .cat-ear.left { left: 10px; transform: rotate(-10deg); }
        .cat-ear.right { right: 10px; transform: rotate(10deg); }
        .cat-eye {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 30px;
        }
        .cat-eye.left { left: 25px; }
        .cat-eye.right { right: 25px; }
        .cat-body {
            width: 120px;
            height: 100px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 20px 20px 0 0;
            position: relative;
        }
        .cat-arms {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .arm {
            width: 40px;
            height: 10px;
            background: #333;
            margin: 0 10px;
            border-radius: 5px;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Top Header Info -->
    <div class="header-top">
        <span>字读 Plain reading</span>
    </div>
    
    <div class="header-banner">
        用手指来指引读书的方向
    </div>

    <h1>
        <span class="method-label">方法 40</span>
        指读 (Pointing Reading)
    </h1>

    <!-- Step 1 -->
    <div class="step-block">
        <div class="highlight-box">
            ① 用手指或是笔尖指着当前读到的位置
        </div>
        <p>视线聚焦在手指或笔尖。</p>
    </div>

    <!-- Step 2 -->
    <div class="step-block">
        <div class="highlight-box">
            ② 沿着阅读的方向移动手指或笔尖
        </div>
        <div class="long-text">
            <p style="margin-bottom: 0;">
                一边往下读，一边移动手指或笔尖。此时视线依然聚焦在手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。
            </p>
        </div>
    </div>

    <!-- Additional Note -->
    <div class="note-text">
        <p>
            大家也可以试着将这种方式与朗读结合起来，将指着的内容出声读出来。
        </p>
    </div>

    <!-- Illustration -->
    <div class="illustration-container">
        <div class="cat-drawing">
            <div style="text-align: center;">
                <div class="cat-head">
                    <div class="cat-ear left"></div>
                    <div class="cat-ear right"></div>
                    <div class="cat-eye left"></div>
                    <div class="cat-eye right"></div>
                </div>
                <div class="cat-body">
                    <div class="cat-arms">
                        <div class="arm"></div>
                        <div class="arm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
