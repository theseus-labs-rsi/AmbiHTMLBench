<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Health Poster</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .poster-container {
            background-color: white;
            width: 100%;
            max-width: 800px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .poster-frame {
            border: 3px solid black;
            padding: 5px;
        }

        .thai-text-top {
            text-align: center;
            font-family: "Sarabun", "Leelawadee", sans-serif; /* Fallback to generic sans-serif */
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1.2;
        }

        .image-section {
            border-top: 2px solid black;
            border-bottom: 2px solid black;
            margin: 5px 0;
            position: relative;
        }

        .image-placeholder {
            width: 100%;
            height: 350px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-style: italic;
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the images with CSS shapes/text for fidelity without external assets */
        .tiger-sim {
            font-size: 8rem;
            color: #333;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .mosquito-sim {
            font-size: 10rem;
            color: #444;
            position: absolute;
            left: 10%;
            top: 20%;
            transform: rotate(-10deg);
        }
        
        .tiny-tiger-sim {
            font-size: 2rem;
            color: #333;
            position: absolute;
            right: 20%;
            bottom: 20%;
        }

        .thai-text-bottom {
            text-align: center;
            font-family: "Sarabun", "Leelawadee", sans-serif;
            font-size: 2rem;
            font-weight: bold;
            margin: 15px 0;
            line-height: 1.4;
        }

        .english-section {
            margin-top: 30px;
            text-align: center;
        }

        .english-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .english-content {
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .english-content p {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="poster-frame">
            <!-- Top Thai Text -->
            <div class="thai-text-top">
                ยุงร้ายกว่าเสือตัวพันเท่า
            </div>

            <!-- Tiger Image Area -->
            <div class="image-section">
                <div class="image-placeholder">
                    <span class="tiger-sim">🐅</span>
                </div>
            </div>

            <!-- Mosquito Image Area -->
            <div class="image-section" style="border-bottom: none;">
                <div class="image-placeholder">
                    <span class="mosquito-sim">🦟</span>
                    <span class="tiny-tiger-sim">🐅</span>
                </div>
            </div>

            <!-- Bottom Thai Text -->
            <div class="thai-text-bottom">
                ในกรุงสยาม เสือกัดคนตายปีละ ๕๐ คน<br>
                ยุงกัดคนเป็นไข้ตายปีละ ๕๐,๐๐๐ คน
            </div>
        </div>

        <!-- English Translation Section -->
        <div class="english-section">
            <div class="english-title">A Public Health Poster.</div>
            
            <div class="english-content">
                <p><span class="label">Top</span> — The Mosquito is a Thousand Times more deadly than the Tiger !</p>
                <p><span class="label">Bottom</span>— In Siam, Tigers kill fifty persons a year, and Mosquitoes cause fifty thousand deaths annually.</p>
            </div>
        </div>
    </div>

</body>
</html>
