<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT快捷键列表</title>
    <style>
        body {
            background-color: #f8cddc; /* Pinkish background matching the border */
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .paper {
            background-color: white;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header Styling */
        .header-container {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header-box {
            display: inline-block;
            border: 2px solid #333;
            padding: 10px 30px;
            background: white;
            position: relative;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .check-icon {
            display: inline-block;
            width: 30px;
            height: 30px;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            line-height: 30px;
            border-radius: 4px;
            margin-right: 10px;
            vertical-align: middle;
            font-weight: bold;
            font-size: 20px;
        }

        /* Decorative lines on the header */
        .header-box::before, .header-box::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: #333;
            transform: translateY(-50%);
        }
        .header-box::before { left: -45px; }
        .header-box::after { right: -45px; }
        
        /* Little vertical ticks on the decorative lines */
        .header-box::before {
             background: linear-gradient(to bottom, #333 50%, transparent 50%);
             background-size: 2px 10px;
             height: 20px;
             top: -9px;
        }
        .header-box::after {
             background: linear-gradient(to bottom, #333 50%, transparent 50%);
             background-size: 2px 10px;
             height: 20px;
             top: -9px;
        }

        /* List Styling */
        .shortcut-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .shortcut-item {
            display: flex;
            margin-bottom: 15px;
            align-items: baseline;
        }

        .key {
            font-weight: bold;
            font-size: 18px;
            width: 180px;
            flex-shrink: 0;
            color: #333;
        }

        .description {
            font-size: 18px;
            color: #333;
            line-height: 1.4;
        }

        /* Responsive adjustment */
        @media (max-width: 600px) {
            .shortcut-item {
                flex-direction: column;
            }
            .key {
                width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="paper">
        <div class="header-container">
            <div class="header-box">
                <span class="check-icon">✓</span>PPT快捷键
            </div>
        </div>

        <div class="shortcut-list">
            <div class="shortcut-item">
                <div class="key">B</div>
                <div class="description">黑屏(在演示时)</div>
            </div>
            <div class="shortcut-item">
                <div class="key">W</div>
                <div class="description">切换至白屏/从黑白屏恢复放映</div>
            </div>
            <div class="shortcut-item">
                <div class="key">F4</div>
                <div class="description">重复上一步操作</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+D</div>
                <div class="description">快速复制选中对象</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+G</div>
                <div class="description">组合对象</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+ Shift+ G</div>
                <div class="description">取消组合</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+Alt+V</div>
                <div class="description">打开选择性粘贴窗口</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+单击</div>
                <div class="description">选择多个对象</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Shift+鼠标</div>
                <div class="description">拖动等比例缩放图片</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Shift+ F5</div>
                <div class="description">从当前页开始放映</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+ Shift+C</div>
                <div class="description">复制格式</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+ Shift+V</div>
                <div class="description">粘贴格式</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+ Shift+ &lt;</div>
                <div class="description">快速缩小字号</div>
            </div>
            <div class="shortcut-item">
                <div class="key">Ctrl+ Shift+&gt;</div>
                <div class="description">快速增大字号</div>
            </div>
        </div>
    </div>

</body>
</html>
