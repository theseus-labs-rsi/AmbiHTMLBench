<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Three Thousand Poster</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
            background-color: #fff;
            color: #d68a45;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poster-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 1100px;
            background-color: #fffbf5;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Background Art Simulation */
        .background-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            background: radial-gradient(circle at 50% 50%, #fcebd5 0%, #fcebd5 40%, transparent 70%);
            /* Simulating the dragon shape with a complex gradient/mask approximation */
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg"><path d="M100,200 Q300,100 500,300 T800,200 V800 Q600,900 400,800 T100,900 V200 Z" fill="black"/></svg>'); 
            /* Fallback if mask doesn't render perfectly, using a solid shape for layout fidelity */
            background-color: #f9e3d0; 
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
        }
        
        /* Specific shape simulation for the dragon/smoke */
        .dragon-shape {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(ellipse at 30% 30%, #f5d0b0 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 70%, #f5d0b0 0%, transparent 50%);
            z-index: 0;
            opacity: 0.5;
            filter: blur(40px);
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Section */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .top-left {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .top-right {
            text-align: right;
        }

        .top-right h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .top-right h2 {
            font-size: 24px;
            margin: 0 0 15px 0;
            font-weight: normal;
            text-transform: uppercase;
        }

        .chinese-text {
            font-size: 14px;
            line-height: 1.6;
            color: #d68a45;
        }

        /* Middle Section - Vertical Text */
        .middle-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
            padding: 20px 0;
        }

        .main-vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 64px;
            font-weight: bold;
            line-height: 1.2;
            letter-spacing: 5px;
            height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .main-vertical-text span {
            display: block;
            margin-bottom: 20px;
        }

        .side-vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 14px;
            letter-spacing: 8px;
            color: #d68a45;
            height: 400px;
            margin-top: 100px;
        }

        /* Bottom Section */
        .bottom-section {
            text-align: right;
            padding-bottom: 20px;
        }

        .quote {
            font-size: 16px;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.5;
            max-width: 400px;
            margin-left: auto;
        }

        .faith-strip {
            background-color: #d68a45;
            color: white;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .main-vertical-text {
                font-size: 40px;
                height: auto;
                transform: none;
                writing-mode: horizontal-tb;
                text-align: center;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-vertical-text span {
                margin: 0 10px;
                margin-bottom: 0;
            }
            .side-vertical-text {
                display: none;
            }
            .top-section {
                flex-direction: column;
                gap: 20px;
            }
            .top-right {
                text-align: left;
            }
            .bottom-section {
                text-align: center;
            }
            .quote {
                margin: 0 auto 20px auto;
            }
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Art Placeholder -->
        <div class="dragon-shape"></div>

        <div class="content-wrapper">
            <!-- Top Left -->
            <div class="top-left">
                11/07<br>
                DESIGNED BY<br>
                KERRILEE
            </div>

            <!-- Top Right -->
            <div class="top-right">
                <h1>BRIFE IS LIFE</h1>
                <h2>BUT LOVE IS LONG</h2>
                <div class="chinese-text">
                    你要知道生命短暂，但爱却绵长<br>
                    爱你三千遍
                </div>
            </div>

            <!-- Middle Vertical Text -->
            <div class="middle-section">
                <div class="main-vertical-text">
                    <span>I LOVE YOU</span>
                    <span>THREE THOUSAND</span>
                </div>
                
                <div class="side-vertical-text">
                    A U G E N S T E R N
                </div>
            </div>

            <!-- Bottom Right -->
            <div class="bottom-section">
                <div class="quote">
                    Life was like a box of chocolates,<br>
                    you never know what you are gonna get.
                </div>
                <div class="faith-strip">
                    YOU GOTTA HAVE LITTLE FAITH
                </div>
            </div>
        </div>
    </div>

</body>
</html>
