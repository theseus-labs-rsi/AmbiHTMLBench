<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新媒体账号运营方法 - 03 做好竞品分析</title>
    <style>
        body {
            background-color: #f0e6d2;
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px 30px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }

        .tag {
            position: absolute;
            top: -12px;
            left: 30px;
            background-color: #8d6e63;
            color: #ffffff;
            padding: 6px 15px 6px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px 0 0 4px;
            /* Creating the ribbon notch effect */
            clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
            z-index: 10;
        }

        h1 {
            color: #333333;
            font-size: 32px;
            font-weight: 800;
            margin-top: 20px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .section-text {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        ol {
            padding-left: 0;
            list-style: none;
            counter-reset: item;
        }

        li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 20px;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
        }

        li::before {
            counter-increment: item;
            content: counter(item) "、";
            position: absolute;
            left: 0;
            top: 0;
            font-weight: bold;
            color: #333;
        }

        .sub-text {
            display: block;
            margin-top: 5px;
            color: #555;
            font-size: 15px;
            padding-left: 0; /* Align with text start roughly */
        }
        
        /* Specific indentation adjustments for sub-text to match visual flow */
        li:has(.sub-text) {
             padding-left: 0;
        }
        
        li:has(.sub-text)::before {
            /* Keep the number but adjust layout */
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #cccccc;
            text-align: center;
            color: #666;
            font-size: 16px;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">新媒体账号运营6种方法</div>

        <h1>03 做好竞品分析</h1>

        <div class="section-text">
            <span class="section-title">前期的竞品分析</span>
            一定要花大量的时间和精力去收集信息
        </div>

        <div class="section-text">
            <span class="section-title">仔细分析</span>
            可以从以下几个方面来看
        </div>

        <ol>
            <li>
                账号人设标签
            </li>
            <li>
                账号选题规划
            </li>
            <li>
                内容脚本拆解：
                <span class="sub-text">结构、矛盾点、金句、痒点</span>
            </li>
            <li>
                内容形式：
                <span class="sub-text">场景道具服装，拍摄剪辑节奏</span>
            </li>
            <li>
                运营策略：
                <span class="sub-text">发布时间和频率，封面，文案，线上互动</span>
                <span class="sub-text">用户运营，引流途径</span>
            </li>
        </ol>

        <div class="footer">
            @新媒体运营的十万个为什么
        </div>
    </div>

</body>
</html>
