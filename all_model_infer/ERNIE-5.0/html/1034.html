<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三大核心参数解读</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            border-top: 1px solid #eee;
        }

        /* Top Binding Circles */
        .binding {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .circle {
            width: 24px;
            height: 24px;
            border: 1px solid #ddd;
            border-radius: 50%;
            background-color: #fff;
        }

        /* Step Badge */
        .step-badge {
            position: absolute;
            left: -10px;
            top: 60px;
            background-color: #333;
            color: #fff;
            padding: 15px 8px;
            writing-mode: vertical-rl;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        
        .step-badge::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(to right, #ff4d4f, #ff7875); /* Simulating the red graphic part */
            z-index: -1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 20px;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 15px 0;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin: 0;
        }

        /* Content Sections */
        .section {
            display: flex;
            align-items: flex-start;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .section:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            margin-right: 25px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
        }

        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #333;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .icon-text {
            font-weight: 900;
            font-size: 14px;
            text-align: center;
            line-height: 1.2;
            color: #333;
        }

        .content {
            flex-grow: 1;
        }

        .content h2 {
            font-size: 20px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .content p {
            font-size: 15px;
            color: #444;
            margin: 0;
            text-align: justify;
        }

        /* Specific Icon Styles */
        .ram-icon rect { fill: #fff; }
        .ram-lines line { stroke: #333; stroke-width: 2; }
        
        .cpu-icon rect { fill: #fff; }
        .cpu-pins line { stroke: #333; stroke-width: 1.5; }
        .cpu-text { font-family: monospace; font-weight: bold; font-size: 12px; fill: #333; }

        .res-icon rect { fill: #fff; rx: 4; }
        .res-text { font-family: sans-serif; font-weight: 900; font-size: 10px; fill: #333; }
        .res-sub { font-family: sans-serif; font-weight: 700; font-size: 8px; fill: #333; }

    </style>
</head>
<body>

<div class="container">
    <!-- Top Binding -->
    <div class="binding">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Step Badge -->
    <div class="step-badge">第二步</div>

    <!-- Header -->
    <header>
        <h1>三大核心参数解读</h1>
        <p class="subtitle">内存/芯片/分辨率参数解读</p>
    </header>

    <!-- Section 1: Memory -->
    <div class="section">
        <div class="icon-box">
            <svg class="ram-icon" viewBox="0 0 24 24">
                <rect x="4" y="2" width="16" height="20" rx="2" />
                <line x1="8" y1="6" x2="16" y2="6" />
                <line x1="8" y1="10" x2="16" y2="10" />
                <line x1="8" y1="14" x2="16" y2="14" />
                <line x1="8" y1="18" x2="16" y2="18" />
                <line x1="12" y1="2" x2="12" y2="4" />
            </svg>
        </div>
        <div class="content">
            <h2>1.看内存</h2>
            <p>内存越大速度越快，小于8GB不建议购买。（画圈：GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）</p>
        </div>
    </div>

    <!-- Section 2: Chip -->
    <div class="section">
        <div class="icon-box">
            <svg class="cpu-icon" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <text x="12" y="14" class="cpu-text" text-anchor="middle">CPU</text>
                <line x1="4" y1="6" x2="2" y2="6" class="cpu-pins" />
                <line x1="4" y1="10" x2="2" y2="10" class="cpu-pins" />
                <line x1="4" y1="14" x2="2" y2="14" class="cpu-pins" />
                <line x1="4" y1="18" x2="2" y2="18" class="cpu-pins" />
                <line x1="20" y1="6" x2="22" y2="6" class="cpu-pins" />
                <line x1="20" y1="10" x2="22" y2="10" class="cpu-pins" />
                <line x1="20" y1="14" x2="22" y2="14" class="cpu-pins" />
                <line x1="20" y1="18" x2="22" y2="18" class="cpu-pins" />
                <line x1="12" y1="4" x2="12" y2="2" class="cpu-pins" />
                <line x1="12" y1="20" x2="12" y2="22" class="cpu-pins" />
            </svg>
        </div>
        <div class="content">
            <h2>2.看芯片</h2>
            <p>主流芯片A73和A53。追求性能玩游戏选A73，看看电视想省电选A53。</p>
        </div>
    </div>

    <!-- Section 3: Resolution -->
    <div class="section">
        <div class="icon-box">
            <svg class="res-icon" viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="4" />
                <text x="12" y="11" class="res-text" text-anchor="middle">4K</text>
                <text x="12" y="17" class="res-sub" text-anchor="middle">UHD</text>
            </svg>
        </div>
        <div class="content">
            <h2>3.看分辨率</h2>
            <p>分辨率越高越清晰。（目前电视基本都是超高清4K也就是3840×2160的分辨率）</p>
        </div>
    </div>

</div>

</body>
</html>
