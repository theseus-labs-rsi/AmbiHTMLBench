<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建议、提案格式示例</title>
    <style>
        body {
            font-family: "SimSun", "Songti SC", serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .document-page {
            background-color: #fff;
            width: 210mm;
            min-height: 297mm;
            padding: 25mm 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            position: relative;
        }

        h1.main-title {
            text-align: center;
            color: #a52a2a;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        p.intro-text {
            font-size: 16px;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 20px;
            text-indent: 2em;
        }

        .section-label {
            color: #4682b4;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .doc-title {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin: 20px 0 5px 0;
        }

        .doc-subtitle {
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .salutation {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .body-paragraph {
            text-indent: 2em;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .instruction-text {
            color: #5f9ea0;
        }

        .list-item {
            margin-left: 2em;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .footer-section {
            margin-top: 60px;
            text-align: right;
            line-height: 2;
        }

        .signature-line {
            margin-bottom: 5px;
        }

        .date-line {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="document-page">
        <h1 class="main-title">二、建议、提案</h1>
        
        <p class="intro-text">
            建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。
        </p>

        <div class="section-label">格式：</div>

        <div class="doc-title">关于 xxxxx 的建议</div>
        <div class="doc-subtitle">（“发文机关+关于+内容+文种”）</div>

        <div class="salutation">各级领导(称谓要根据具体题目要求分析得出)：</div>

        <div class="body-paragraph">
            当前，...等问题比较突出(或做了什么工作)，为了做好...工作，提出以下建议:<span class="instruction-text">(开头为背景分析，指出存在的主要问题和目的意义)</span>
        </div>

        <div class="list-item">一、......</div>
        <div class="list-item">二、......</div>
        <div class="list-item">三、......<span class="instruction-text">(主体内容还原为对策题,提出解决问题的措施)</span></div>

        <div class="footer-section">
            <div class="signature-line">发文机关</div>
            <div class="date-line">xx 年 xx 月 xx 日</div>
        </div>
    </div>

</body>
</html>
