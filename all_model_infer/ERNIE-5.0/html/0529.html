<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 破晓艺术跨界展览</title>
    <style>
        :root {
            --primary-blue: #2b3a9e;
            --accent-pink: #ff2e63;
            --bg-gray: #f4f4f4;
            --text-dark: #333;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ddd;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        .poster-container {
            position: relative;
            width: 600px;
            height: 900px;
            background-color: var(--bg-gray);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            /* Creating the grid background pattern */
            background-image: 
                linear-gradient(rgba(200, 200, 200, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 200, 200, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Background Text Elements */
        .bg-text {
            position: absolute;
            color: rgba(0, 0, 0, 0.05);
            font-weight: 900;
            font-size: 150px;
            z-index: 0;
            user-select: none;
            pointer-events: none;
        }

        .bg-new {
            top: -20px;
            left: -10px;
            width: 100%;
            text-align: center;
            letter-spacing: 10px;
        }

        .bg-year {
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            letter-spacing: 10px;
        }

        /* Main Content Wrapper */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Section */
        .header-section {
            margin-bottom: 20px;
        }

        .year-label {
            font-size: 48px;
            font-weight: 900;
            color: var(--primary-blue);
            margin: 0;
            line-height: 1;
        }

        .art-name {
            font-size: 42px;
            font-weight: 900;
            color: var(--accent-pink);
            position: relative;
            display: inline-block;
            margin-top: 10px;
            /* Creating the blue block shadow effect */
            text-shadow: 4px 4px 0px var(--primary-blue); 
            z-index: 2;
        }

        /* Main Title Section */
        .main-title {
            font-size: 140px;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 0.9;
            margin: 10px 0;
            letter-spacing: -5px;
            position: relative;
            z-index: 2;
        }

        .main-title .underline-effect {
            display: block;
            position: relative;
        }
        
        /* Pink underline for 'Exhibition' */
        .main-title .underline-effect::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 25px;
            background-color: var(--accent-pink);
            z-index: -1;
            transform: skewX(-20deg);
        }

        /* Middle Info Section */
        .info-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 20px;
            flex-grow: 1;
        }

        .price-box {
            text-align: left;
        }

        .price-value {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-pink);
            display: block;
        }

        .price-label {
            font-size: 16px;
            color: #555;
            margin-top: 5px;
        }

        .details-box {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .detail-item label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
            text-align: right;
        }

        .detail-item .value {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-pink);
            display: block;
        }
        
        .detail-item .value.location {
            color: var(--primary-blue);
            font-size: 20px;
            font-weight: 700;
        }

        .separator {
            width: 20px;
            height: 4px;
            background-color: var(--accent-pink);
            margin: 0 auto;
        }
        
        .separator.blue {
            background-color: var(--primary-blue);
        }

        /* Footer Section */
        .footer-section {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .footer-item label {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        .footer-item .value {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-blue);
        }
        
        .footer-item.phone .value {
             font-family: monospace; /* Mimic the digital look of the phone number */
             letter-spacing: 2px;
        }

        /* Decorative lines */
        .deco-line {
            position: absolute;
            background-color: var(--primary-blue);
            height: 4px;
            width: 20px;
        }
        .line-top { top: 60px; left: 40px; }
        .line-mid-right { top: 450px; right: 40px; }
        .line-bot-left { bottom: 60px; left: 40px; }
        .line-bot-right { bottom: 60px; right: 40px; }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Text -->
        <div class="bg-text bg-new">NEW</div>
        <div class="bg-text bg-year">YEAR</div>

        <!-- Decorative Lines -->
        <div class="deco-line line-top"></div>
        <div class="deco-line line-mid-right"></div>
        <div class="deco-line line-bot-left"></div>
        <div class="deco-line line-bot-right"></div>

        <div class="content">
            <!-- Header -->
            <div class="header-section">
                <h1 class="year-label">2026</h1>
                <div class="art-name">破晓艺术</div>
            </div>

            <!-- Main Title -->
            <div class="main-title">
                跨界
                <span class="underline-effect">展览</span>
            </div>

            <!-- Middle Info -->
            <div class="info-section">
                <div class="price-box">
                    <span class="price-value">¥ 60起</span>
                    <span class="price-label">单人票价</span>
                </div>

                <div class="details-box">
                    <div class="detail-item">
                        <label>活动时间</label>
                        <span class="value">01/01</span>
                        <div class="separator"></div>
                        <span class="value">01/03</span>
                    </div>

                    <div class="detail-item">
                        <label>活动地点</label>
                        <span class="value location">厦门湖里区稿定艺术馆</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer-section">
                <div class="footer-item">
                    <label>主办方：</label>
                    <span class="value">稿定集团</span>
                </div>
                <div class="footer-item phone">
                    <label>联系电话</label>
                    <span class="value">0592-88888888</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
