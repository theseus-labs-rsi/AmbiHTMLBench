<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.语法 - 学习笔记</title>
    <style>
        :root {
            --bg-color: #dcedc8; /* Light green background */
            --grid-color: rgba(0, 0, 0, 0.1);
            --text-color: #333;
            --accent-green: #81c784;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: "KaiTi", "STKaiti", "Serif", sans-serif; /* Using KaiTi for a handwritten feel */
            background-color: #f1f8e9;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .notebook-page {
            background-color: #fff;
            width: 100%;
            max-width: 800px;
            min-height: 1000px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* Creating the grid paper effect */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 40px 60px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Top decorative border */
        .top-decoration {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            position: relative;
            top: -10px;
        }

        .deco-shape {
            width: 20px;
            height: 25px;
            background-color: var(--accent-green);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: rotate(45deg);
            opacity: 0.8;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #2e2e2e;
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 25px;
            color: var(--text-color);
            text-indent: 0; /* The image text doesn't seem heavily indented, or maybe slightly */
        }
        
        /* Slight indentation for paragraphs to match typical Chinese typesetting if needed, 
           but looking at the image, it's block style. Let's keep it clean. */

        /* Decorative Stars */
        .star {
            position: absolute;
            color: #fff176; /* Light yellow */
            font-size: 1.5rem;
            z-index: 1;
            text-shadow: 0 0 2px rgba(0,0,0,0.1);
        }

        .star-1 { top: 280px; left: 100px; transform: rotate(-15deg); }
        .star-2 { top: 450px; right: 120px; transform: rotate(10deg); font-size: 2rem; }
        .star-3 { bottom: 200px; left: 150px; transform: rotate(20deg); }

        /* Flower Decoration */
        .flower-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            z-index: 2;
        }
        
        .flower-placeholder {
            width: 100%;
            height: 100%;
            background-color: #f8bbd0; /* Pinkish */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.8rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            /* Simulating a flower shape roughly */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            background: radial-gradient(circle, #f48fb1 0%, #ec407a 100%);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .notebook-page {
                padding: 20px;
            }
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="notebook-page">
        <!-- Top Decorative Elements -->
        <div class="top-decoration">
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
            <div class="deco-shape"></div>
        </div>

        <!-- Decorative Stars -->
        <div class="star star-1">★</div>
        <div class="star star-2">★</div>
        <div class="star star-3">★</div>

        <h1>4.语法</h1>

        <p>语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。</p>

        <p>虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。</p>

        <p>学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。</p>

        <p>零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。</p>

        <!-- Flower Decoration -->
        <div class="flower-container">
            <div class="flower-placeholder">
                [Flower Illustration]
            </div>
        </div>
    </div>

</body>
</html>
