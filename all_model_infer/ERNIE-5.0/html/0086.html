<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA Calculation</title>
    <style>
        body {
            background-color: #5a8a6e; /* Approximate green background */
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-banner {
            background-color: #5bbdd9; /* Approximate blue banner */
            color: #f0f040; /* Approximate yellow text */
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 10px 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .main-content {
            background-color: white;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .formula-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            font-size: 28px;
            color: #2a4d9e; /* Dark blue text */
        }

        .formula-part {
            display: flex;
            align-items: center;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 15px;
        }

        .numerator {
            border-bottom: 2px solid #2a4d9e;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .denominator {
            padding-top: 5px;
        }

        .condition {
            color: #d93025; /* Red text */
            font-weight: bold;
            margin-left: 20px;
            font-size: 24px;
        }

        .definitions {
            font-size: 22px;
            color: #2a4d9e;
            line-height: 2;
        }

        .definition-item {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="top-banner">
        PTA SHOULD BE LESS THAN 40 %
    </div>

    <div class="main-content">
        <div class="formula-section">
            <div class="formula-part">
                <span>PTA =</span>
                <div class="fraction">
                    <div class="numerator">(FT + AD)</div>
                    <div class="denominator">CCT</div>
                </div>
            </div>
            <div class="condition">&lt; 40%</div>
        </div>

        <div class="definitions">
            <div class="definition-item">FT = flap thickness</div>
            <div class="definition-item">AD = ablation depth</div>
            <div class="definition-item">CCT = central corneal thickness</div>
        </div>
    </div>

</body>
</html>
