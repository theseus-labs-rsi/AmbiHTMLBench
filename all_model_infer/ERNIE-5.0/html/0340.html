<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算思维二：分解思维</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page-container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            min-height: 800px;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Corner Decorations */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #8da88d; /* Muted green */
            border-style: solid;
            border-width: 2px;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .content {
            flex-grow: 1;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 30px;
            color: #333;
        }

        .intro-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
            text-align: justify;
        }

        .highlight-red {
            color: #d9534f;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .section-content {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            text-align: justify;
        }

        .footer-area {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 20px;
            border-top: 1px solid #eee; /* Optional separator if needed, though image doesn't strictly have one */
        }

        .copyright {
            font-size: 14px;
            color: #666;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .next-page-btn {
            background-color: #333;
            color: white;
            padding: 8px 15px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            position: absolute;
            bottom: 40px;
            right: 40px;
        }
        
        .next-page-btn span {
            margin-left: 5px;
            font-weight: bold;
        }

        /* Utility to push footer elements */
        .spacer {
            height: 60px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <!-- Decorative Corners -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="content">
            <h1>计算思维二：分解思维</h1>

            <p class="intro-text">
                分解思维是指将复杂的问题（或任务）<span class="highlight-red">拆解成一个个更易于解决的小问题（或任务）</span>。
            </p>

            <div class="section">
                <div class="section-title">1、问题梳理</div>
                <div class="section-content">
                    先明确这个复杂问题到底是什么，最终要达到什么目的或效果。
                </div>
            </div>

            <div class="section">
                <div class="section-title">2、问题分解</div>
                <div class="section-content">
                    将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。
                </div>
            </div>

            <div class="section">
                <div class="section-title">3、整合方案</div>
                <div class="section-content">
                    制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。
                </div>
            </div>
            
            <div class="spacer"></div>
        </div>

        <div class="copyright">
            原创：学习方法社
        </div>

        <div class="next-page-btn">
            翻页 <span>&rarr;</span>
        </div>
    </div>

</body>
</html>
