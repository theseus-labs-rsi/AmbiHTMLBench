<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 第③步：调整所得税</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fdf6ec;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 550px;
    min-height: 750px;
    background: repeating-linear-gradient(
      to right,
      #fdf3e5 0px,
      #fdf3e5 10px,
      #fbeedc 10px,
      #fbeedc 20px
    );
    border: 1px solid #e0c9a6;
    position: relative;
    box-sizing: border-box;
    padding: 20px 25px 30px 25px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #5a4634;
  }
  .border-frame {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    border: 2px solid #e8d4ad;
    border-radius: 6px;
    pointer-events: none;
  }
  .paw {
    position: absolute;
    font-size: 20px;
    color: #c9a876;
  }
  .paw.left {
    top: 38px;
    left: 160px;
  }
  .paw.right {
    top: 38px;
    right: 160px;
  }
  .title {
    text-align: center;
    margin-top: 45px;
    margin-bottom: 25px;
  }
  .title h1 {
    font-size: 26px;
    color: #8a6d3b;
    margin: 4px 0;
    font-weight: bold;
  }
  .highlight-box {
    background: linear-gradient(90deg, #f5d98b, #f0c766);
    display: inline-block;
    padding: 6px 18px;
    border-radius: 4px;
    font-weight: bold;
    color: #6b4a1b;
    font-size: 15px;
    margin: 10px 0 20px 0;
  }
  .section-title {
    font-weight: bold;
    font-size: 14px;
    margin: 18px 0 6px 0;
    color: #5a4634;
  }
  .indent {
    margin-left: 25px;
    font-size: 14px;
    line-height: 1.9;
  }
  .row {
    display: flex;
    align-items: center;
    margin-left: 25px;
    margin-bottom: 4px;
  }
  .brace {
    font-size: 40px;
    margin: 0 8px;
    color: #5a4634;
    font-weight: 100;
    line-height: 1;
  }
  .value-block {
    line-height: 1.8;
  }
  .result-text {
    font-size: 14px;
  }
  .group-view {
    position: absolute;
    right: 40px;
    top: 320px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    background: #f5d98b;
    padding: 4px 10px;
    border-radius: 3px;
  }
  .increase-text {
    position: absolute;
    right: 65px;
    top: 365px;
    font-size: 14px;
  }
  .down-arrow {
    position: absolute;
    right: 90px;
    top: 345px;
    width: 4px;
    height: 70px;
    background: #6fa3c7;
  }
  .down-arrow::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: -6px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #6fa3c7;
  }
  .accounting {
    margin-top: 30px;
    margin-left: 25px;
    font-size: 14px;
    line-height: 2;
  }
  .accounting .second-line {
    margin-left: 40px;
  }
  .placeholder {
    position: absolute;
    bottom: 10px;
    border: 1px dashed #c9a876;
    background: #fbeedc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #a68a5b;
    text-align: center;
  }
  .placeholder.left-cat {
    left: 15px;
    width: 130px;
    height: 100px;
  }
  .placeholder.right-cat {
    right: 15px;
    width: 130px;
    height: 110px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="border-frame"></div>
  <div class="paw left">🐾</div>
  <div class="paw right">🐾</div>

  <div class="title">
    <h1>内部交易抵销</h1>
    <h1>第③步：调整所得税</h1>
  </div>

  <div style="text-align:left;">
    <span class="highlight-box">若实现60%对外销售</span>
  </div>

  <div class="section-title">个别报表层面因为存货跌价准备：</div>
  <div class="row">
    <div class="value-block">
      账面价值 900<br>
      计税基础 1200
    </div>
    <div class="brace">}</div>
    <div class="result-text">递延所得税资产300*25%=75</div>
  </div>

  <div class="group-view">【集团角度】</div>
  <div class="increase-text">调增25</div>
  <div class="down-arrow"></div>

  <div class="section-title" style="margin-top:50px;">合并报表层面因为存货跌价准备：</div>
  <div class="row">
    <div class="value-block">
      账面价值 800<br>
      计税基础 1200
    </div>
    <div class="brace">}</div>
    <div class="result-text">递延所得税资产400*25%=100</div>
  </div>

  <div class="accounting">
    <div>会计处理：借：递延所得税资产25</div>
    <div class="second-line">贷：所得税费用25</div>
  </div>

  <div class="placeholder left-cat">[Illustration: sleeping gray &amp; white cat]</div>
  <div class="placeholder right-cat">[Illustration: cat with straw hat fishing]</div>
</div>
</body>
</html>
