<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤独语录</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #2d2240;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .page {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 0 auto;
    background-color: #2d2240;
    overflow: hidden;
    box-sizing: border-box;
    padding-top: 10px;
  }

  .top-corner-text {
    position: absolute;
    top: 8px;
    left: 20px;
    font-size: 9px;
    color: #5a4f6e;
    letter-spacing: 1px;
  }

  .symbol-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 110px;
  }

  .diamond-outer {
    position: relative;
    width: 150px;
    height: 150px;
  }

  .diamond-arc {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 166px;
    height: 166px;
  }

  .diamond {
    width: 150px;
    height: 150px;
    border: 1.5px solid #c9a86a;
    transform: rotate(45deg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .female-symbol {
    transform: rotate(-45deg);
    font-size: 60px;
    color: #c9a86a;
    line-height: 1;
    font-weight: 300;
  }

  .quote-section {
    margin-top: 90px;
    padding: 0 40px;
    text-align: center;
  }

  .star-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .star {
    color: #c9a86a;
    font-size: 16px;
    position: absolute;
  }

  .star.left {
    left: 20px;
    top: 4px;
  }

  .star.right {
    right: 20px;
    top: 4px;
  }

  .english-text {
    color: #b3a9c2;
    font-size: 13px;
    line-height: 1.6;
    padding: 0 35px;
  }

  .chinese-quote {
    margin-top: 45px;
    color: #c9a86a;
    font-size: 23px;
    line-height: 2.1;
    letter-spacing: 3px;
    font-weight: 500;
    position: relative;
  }

  .quote-mark-open {
    font-size: 28px;
    vertical-align: top;
  }

  .quote-mark-close {
    font-size: 28px;
    vertical-align: bottom;
  }

</style>
</head>
<body>

<div class="page">
  <div class="top-corner-text">[?] 无 [?] [?] [?] [?] [?]</div>

  <div class="symbol-wrapper">
    <div class="diamond-outer">
      <div class="placeholder diamond-arc" style="width:166px;height:166px;border:none;background:none;display:flex;align-items:center;justify-content:center;font-size:0;">
        <!-- decorative arc feather pattern around diamond top -->
      </div>
      <div class="diamond">
        <span class="female-symbol">&#9792;</span>
      </div>
    </div>
  </div>

  <div class="quote-section">
    <div class="star-row">
      <span class="star left">&#10022;</span>
      <div class="english-text">
        I think the so-called loneliness refers to the person you are facing,
        whose emotions are not on the same frequency as your own.
      </div>
      <span class="star right">&#10022;</span>
    </div>

    <div class="chinese-quote">
      <span class="quote-mark-open">&ldquo;</span> 我想所谓孤独，<br>
      就是你面对的那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。<span class="quote-mark-close">&rdquo;</span>
    </div>
  </div>
</div>

</body>
</html>
