<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
  }
  .page {
    max-width: 550px;
    margin: 0 auto;
    padding: 0 0 40px 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 14px 16px;
    border-bottom: 1px solid #f0f0f0;
  }
  .header-left {
    display: flex;
    align-items: center;
    color: #333;
    font-size: 17px;
  }
  .back-arrow {
    font-size: 20px;
    margin-right: 6px;
    color: #333;
    font-weight: 400;
  }
  .title-text {
    font-weight: 500;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #f0b23c;
    font-size: 18px;
  }
  .section {
    padding: 22px 16px 10px 16px;
  }
  .section-title {
    display: flex;
    align-items: center;
    font-size: 16px;
    font-weight: 600;
    color: #222;
    margin-bottom: 16px;
  }
  .check-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #f0b23c;
    color: #f0b23c;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .quote-block {
    font-size: 15.5px;
    line-height: 1.9;
    color: #333;
    text-align: justify;
    margin: 0 0 18px 0;
  }
  .divider {
    border: none;
    border-top: 1px solid #f0f0f0;
    margin: 0;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-left">
      <span class="back-arrow">&#8249;</span>
      <span class="title-text">金句合集</span>
    </div>
    <div class="header-right">
      <span class="icon">&#128100;</span>
      <span class="icon">&#8679;</span>
      <span class="icon">&#8943;</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <span class="check-circle">&#10003;</span>
      <span>他写「成长」，正是你所亲历</span>
    </div>
    <div class="quote-block">
      “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”——《病隙碎笔》
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="section-title">
      <span class="check-circle">&#10003;</span>
      <span>他写「磨难」，报之以歌</span>
    </div>
    <div class="quote-block">
      “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》
    </div>
  </div>

</div>
</body>
</html>
