<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 - 心态主题 金句摘抄</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    background: #ddd;
    font-family: "SimSun", "STSong", serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 20px 12px 20px;
    background: #ffffff;
    border-bottom: 3px solid #000;
  }
  .header-left {
    display: flex;
    flex-direction: column;
  }
  .logo {
    font-size: 42px;
    font-weight: bold;
    color: #c0392b;
    letter-spacing: 2px;
    font-family: "KaiTi", "STKaiti", serif;
    line-height: 1;
  }
  .logo-sub {
    font-size: 11px;
    color: #333;
    letter-spacing: 4px;
    margin-top: 4px;
    font-family: Arial, sans-serif;
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-top: 6px;
  }
  .tag-line {
    font-size: 15px;
    font-weight: bold;
    border: 1.5px solid #000;
    padding: 2px 10px;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .topic-line {
    font-size: 24px;
    font-weight: bold;
    color: #000;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* Content body */
  .content {
    background: #d8cdbd;
    padding: 30px 28px 40px 28px;
  }

  .quote-block {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #111;
    line-height: 1.55;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .label {
    font-size: 15px;
    font-weight: bold;
    color: #222;
    margin: 10px 0 6px 0;
  }

  .explanation {
    font-size: 15.5px;
    color: #222;
    line-height: 1.9;
    text-align: justify;
    margin-bottom: 26px;
  }

  .quote-block2 {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #111;
    line-height: 1.6;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .explanation2 {
    font-size: 15.5px;
    color: #222;
    line-height: 1.9;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-left">
      <div class="logo">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="tag-line">金句丨摘抄</div>
      <div class="topic-line">心态主题</div>
    </div>
  </div>

  <div class="content">

    <div class="quote-block">
      且行且忘且随风，<br>
      且行且看且从容。
    </div>

    <div class="label">释义：</div>
    <div class="explanation">
      意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
    </div>

    <div class="quote-block2">
      我将玫瑰藏于身后风起花落，<br>
      从此鲜花赠自己，<br>
      纵马踏花向自由。
    </div>

    <div class="label">释义：</div>
    <div class="explanation2">
      我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
    </div>

  </div>

</div>
</body>
</html>
