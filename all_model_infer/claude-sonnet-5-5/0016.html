<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缓解痛经 - 月经来潮需停药</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 550px;
    min-height: 720px;
    background: #ffffff;
    position: relative;
    padding-bottom: 20px;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px 0 20px;
    font-size: 13px;
    color: #333;
  }
  .statusbar .icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .closebtn {
    padding: 15px 20px 10px 20px;
    font-size: 22px;
    color: #333;
    font-weight: 300;
  }
  .content {
    padding: 0 24px;
  }
  .section-title {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }
  .num-badge {
    background: #f6b8a9;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .section-title .title-text {
    color: #e8847a;
    font-size: 17px;
    font-weight: bold;
  }
  .paragraph {
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    margin-bottom: 20px;
    text-align: justify;
  }
  .big-step {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px 0 30px 0;
  }
  .big-step-box {
    border: 2px solid #7b6fd4;
    border-radius: 30px;
    padding: 8px 30px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .big-step-num {
    font-size: 32px;
    color: #7b6fd4;
    font-weight: bold;
  }
  .big-step-dot {
    color: #7b6fd4;
    font-size: 20px;
  }
  .big-step-text {
    font-size: 18px;
    color: #7b6fd4;
    font-weight: bold;
  }
  .common-plan {
    display: inline-flex;
    align-items: center;
    background: #7b6fd4;
    color: #fff;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 4px;
    margin-bottom: 16px;
    position: relative;
  }
  .common-plan::after {
    content: "";
    position: absolute;
    right: -14px;
    top: 0;
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-left: 14px solid #7b6fd4;
  }
  .method-list {
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    margin-bottom: 18px;
  }
  .method-list p {
    margin: 0 0 14px 0;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span></span>
    <div class="icons">
      <span>&#128274;</span>
      <span>&#128246;</span>
      <span>&#128225;</span>
      <span>&#128267; 19:43</span>
    </div>
  </div>
  <div class="closebtn">&times;</div>

  <div class="content">

    <div class="section-title">
      <div class="num-badge">5</div>
      <div class="title-text">月经来潮需停药</div>
    </div>

    <div class="paragraph">
      药物推迟月经可能会失败，服药过程中如月经来潮需停药。
    </div>

    <div class="big-step">
      <div class="big-step-box">
        <span class="big-step-num">2</span>
        <span class="big-step-dot">·</span>
        <span class="big-step-text">缓解痛经</span>
      </div>
    </div>

    <div class="paragraph">
      如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。
    </div>

    <div class="common-plan">常用方案</div>

    <div class="paragraph">
      痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。
    </div>

    <div class="paragraph">
      以下三种方法，选其中一种方法即可：
    </div>

    <div class="method-list">
      <p>1.布洛芬 首剂 800 mg，之后根据需要 400~800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。</p>
      <p>2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。</p>
    </div>

  </div>
</div>
</body>
</html>
