<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f3eee9;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 540px;
    background: #f3eee9;
    padding-bottom: 10px;
  }
  .header {
    background: #e9e4dc;
    text-align: center;
    padding: 18px 0 14px 0;
  }
  .header h1 {
    color: #4b7a5a;
    font-size: 24px;
    margin: 0;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header .sub {
    color: #4b7a5a;
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 1px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fdf7f0;
  }
  thead tr {
    background: #8fae9a;
  }
  thead th {
    color: #fff;
    font-size: 15px;
    padding: 10px 4px;
    font-weight: normal;
    border: none;
  }
  tbody td {
    border: 1px solid #e3dccf;
    padding: 10px 6px;
    font-size: 12.5px;
    color: #333;
    vertical-align: middle;
    text-align: center;
    line-height: 1.6;
  }
  .tool-col {
    width: 16%;
    font-weight: bold;
    color: #333;
  }
  .tool-col .must {
    color: #c0392b;
    font-size: 11px;
    font-weight: bold;
    display: block;
    margin-top: 2px;
  }
  .use-col {
    width: 42%;
    text-align: left;
    padding-left: 12px;
    padding-right: 10px;
  }
  .suggest-col {
    width: 22%;
  }
  .img-col {
    width: 20%;
  }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    background: #faf6f0;
    color: #888;
    font-size: 10px;
    text-align: center;
    overflow: hidden;
  }
  .ph-crochet { width: 70px; height: 60px; }
  .ph-yarn { width: 70px; height: 60px; }
  .ph-scissor { width: 50px; height: 40px; }
  .ph-needle { width: 70px; height: 50px; }

  .crochet-img {
    display: flex;
    gap: 3px;
    justify-content: center;
    align-items: center;
  }
  .crochet-stick {
    width: 5px;
    height: 55px;
    border-radius: 3px;
  }
  .yarn-ball {
    width: 60px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #e8c39e, #c99a6a 70%);
    position: relative;
  }
  .scissor-shape {
    width: 45px;
    height: 35px;
    background: linear-gradient(135deg, #999 40%, silver 60%);
    clip-path: polygon(20% 0%, 100% 50%, 20% 100%, 0% 70%, 60% 50%, 0% 30%);
  }
  .needle-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: center;
  }
  .needle-bar {
    width: 55px;
    height: 4px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>钩针工具选择指南</h1>
    <div class="sub">——only手作集——</div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:16%;">工具</th>
        <th style="width:42%;">用途</th>
        <th style="width:22%;">初学者建议</th>
        <th style="width:20%;">实物图</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="tool-col">钩针<span class="must">（必备）</span></td>
        <td class="use-col">钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》</td>
        <td class="suggest-col">3mm左右的钩针最实用</td>
        <td class="img-col">
          <div class="placeholder ph-crochet">
            <div class="crochet-img">
              <div class="crochet-stick" style="background:#4472c4;"></div>
              <div class="crochet-stick" style="background:#f4b183;"></div>
              <div class="crochet-stick" style="background:#9dc3e6;"></div>
              <div class="crochet-stick" style="background:#f8cbad;"></div>
              <div class="crochet-stick" style="background:#a9d18e;"></div>
              <div class="crochet-stick" style="background:#8faadc;"></div>
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="tool-col">毛线<span class="must">（必备）</span></td>
        <td class="use-col">毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》</td>
        <td class="suggest-col">中粗的宝宝棉/牛奶棉</td>
        <td class="img-col">
          <div class="placeholder ph-yarn">
            <div class="yarn-ball"></div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="tool-col">剪刀<span class="must">（必备）</span></td>
        <td class="use-col">剪断编织过程中的编织线</td>
        <td class="suggest-col">必备</td>
        <td class="img-col">
          <div class="placeholder ph-scissor">
            <div class="scissor-shape"></div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="tool-col">缝合针</td>
        <td class="use-col">缝合、修补和连接编织面料</td>
        <td class="suggest-col">非必须</td>
        <td class="img-col">
          <div class="placeholder ph-needle">
            <div class="needle-row">
              <div class="needle-bar" style="background:#c62d42;"></div>
              <div class="needle-bar" style="background:#4472c4;"></div>
              <div class="needle-bar" style="background:#70ad47;"></div>
              <div class="needle-bar" style="background:#ed7d31;"></div>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
