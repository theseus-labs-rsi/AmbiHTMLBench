<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #fff;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
  }
  .page {
    width: 560px;
    min-height: 720px;
    margin: 0 auto;
    background-image:
      linear-gradient(to right, #e8eaf0 1px, transparent 1px),
      linear-gradient(to bottom, #e8eaf0 1px, transparent 1px);
    background-size: 20px 20px;
    position: relative;
    padding: 10px 15px 30px 15px;
    box-sizing: border-box;
  }
  .title {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    margin-top: 10px;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }
  .title-blue {
    color: #1a3fcc;
  }
  .title-black {
    color: #111;
  }
  .content-wrap {
    display: flex;
    flex-direction: column;
  }
  .row {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
  }
  .left-col {
    width: 210px;
    flex-shrink: 0;
  }
  .right-col {
    flex: 1;
    padding-left: 10px;
  }

  .day-label {
    display: inline-block;
    background-color: #c9eccb;
    border: 2px solid #1a1a1a;
    font-size: 22px;
    font-weight: bold;
    padding: 4px 18px;
    border-radius: 4px;
    margin-bottom: 6px;
  }

  .stop-label {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    margin: 4px 0 4px 0;
  }

  .transport-row {
    display: flex;
    align-items: center;
    margin: 2px 0 2px 0;
  }
  .transport-text {
    background-color: #fcd9d9;
    font-size: 15px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .arrow-img {
    width: 18px;
    margin: 0 2px;
    color: #f5c242;
    font-size: 22px;
    font-weight: bold;
  }
  .time-text {
    font-size: 15px;
    white-space: nowrap;
    margin-left: 2px;
  }

  .big-arrow {
    width: 100%;
    text-align: center;
    color: #f5c242;
    font-size: 40px;
    font-weight: bold;
    line-height: 1;
    margin: 2px 0;
  }

  .info-box {
    border: 2px solid #7a1212;
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1.6;
    color: #111;
    box-sizing: border-box;
    margin-bottom: 6px;
  }
  .info-title {
    color: #1a3fcc;
    font-weight: bold;
  }

  .spacer {
    height: 18px;
  }

  .center-stop {
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title">
    <span class="title-blue">第三天</span><span class="title-black">路线规划</span>
  </div>

  <div class="content-wrap">

    <!-- Row 1: 第三天 label + info box 1 -->
    <div class="row" style="align-items:flex-start;">
      <div class="left-col">
        <div class="day-label">第三天</div>
      </div>
      <div class="right-col">
        <div class="info-box">
          <span class="info-title">磁器口（免费）：</span>汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌
        </div>
      </div>
    </div>

    <!-- big arrow down -->
    <div class="row">
      <div class="left-col center-stop">
        <div class="big-arrow">&#8659;</div>
      </div>
      <div class="right-col"></div>
    </div>

    <!-- 磁器口 stop -->
    <div class="row">
      <div class="left-col">
        <div class="stop-label">磁器口</div>
      </div>
      <div class="right-col"></div>
    </div>

    <!-- transport 1号线 30分钟 + info box 2 -->
    <div class="row" style="align-items:flex-start;">
      <div class="left-col">
        <div class="transport-row">
          <span class="transport-text">1号线</span>
          <span class="arrow-img">&#8659;</span>
          <span class="time-text">30分钟</span>
        </div>
      </div>
      <div class="right-col">
        <div class="info-box">
          <span class="info-title">罗中立美术馆（免费）：</span>拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
        </div>
      </div>
    </div>

    <!-- 罗中立美术馆 stop -->
    <div class="row">
      <div class="left-col">
        <div class="stop-label">罗中立美术馆</div>
      </div>
      <div class="right-col"></div>
    </div>

    <!-- transport 1号线 80分钟 + info box 3 -->
    <div class="row" style="align-items:flex-start;">
      <div class="left-col">
        <div class="transport-row">
          <span class="transport-text">1号线</span>
          <span class="arrow-img">&#8659;</span>
          <span class="time-text">80分钟</span>
        </div>
      </div>
      <div class="right-col">
        <div class="info-box">
          <span class="info-title">山城步道（免费）：</span>建在悬崖边的临江步道，汇聚老重庆特色步道
        </div>
      </div>
    </div>

    <!-- 山城步道 stop -->
    <div class="row">
      <div class="left-col">
        <div class="stop-label">山城步道</div>
      </div>
      <div class="right-col"></div>
    </div>

    <!-- transport 公交 32分钟 + info box 4 -->
    <div class="row" style="align-items:flex-start;">
      <div class="left-col">
        <div class="transport-row">
          <span class="transport-text">公交</span>
          <span class="arrow-img">&#8659;</span>
          <span class="time-text">32分钟</span>
        </div>
      </div>
      <div class="right-col">
        <div class="info-box">
          <span class="info-title">观音桥（免费）：</span>超大商圈，还有很多地道重庆小吃
        </div>
      </div>
    </div>

    <!-- 观音桥 stop -->
    <div class="row">
      <div class="left-col">
        <div class="stop-label">观音桥</div>
      </div>
      <div class="right-col"></div>
    </div>

    <!-- transport 步行 15分钟 + info box 5 -->
    <div class="row" style="align-items:flex-start;">
      <div class="left-col">
        <div class="transport-row">
          <span class="transport-text">步行</span>
          <span class="arrow-img">&#8659;</span>
          <span class="time-text">15分钟</span>
        </div>
      </div>
      <div class="right-col">
        <div class="info-box">
          <span class="info-title">九街（免费）：</span>酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
        </div>
      </div>
    </div>

    <!-- 九街 stop -->
    <div class="row">
      <div class="left-col">
        <div class="stop-label">九街</div>
      </div>
      <div class="right-col"></div>
    </div>

  </div>
</div>
</body>
</html>
