<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高频考点汇总</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e9e4d8;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .page {
    width: 540px;
    min-height: 735px;
    background: #f4f1e6;
    border: 3px solid #b7c9ae;
    border-radius: 10px;
    box-sizing: border-box;
    padding: 16px 22px 30px 22px;
    position: relative;
  }

  .title-bar {
    background: #c7d8bb;
    border-radius: 25px;
    text-align: center;
    padding: 10px 0;
    margin: 6px 40px 20px 40px;
    position: relative;
  }

  .title-bar h1 {
    margin: 0;
    font-size: 22px;
    color: #5a4a3a;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .mascot-top {
    position: absolute;
    top: -18px;
    right: 15px;
    width: 70px;
    height: 70px;
  }

  .section-title {
    color: #e0825a;
    font-weight: bold;
    font-size: 17px;
    margin-top: 18px;
    margin-bottom: 8px;
  }

  .content-line {
    font-size: 15.5px;
    color: #4a4a4a;
    line-height: 1.9;
    margin: 2px 0;
  }

  .stars {
    display: inline-block;
    margin-left: 10px;
    color: #f0a93e;
    font-size: 17px;
    letter-spacing: 2px;
  }

  .placeholder {
    border: 1px dashed #c9bfae;
    background: #fbf9f2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9a8c;
    font-size: 12px;
    text-align: center;
    border-radius: 8px;
  }

  .mascot-mid {
    width: 90px;
    height: 90px;
    float: right;
    margin: -10px 0 10px 15px;
  }

  .mascot-bottom {
    width: 90px;
    height: 90px;
    float: right;
    margin: 0 0 10px 15px;
  }

  .clearfix::after {
    content: "";
    display: block;
    clear: both;
  }

  .watermark {
    position: absolute;
    bottom: 10px;
    right: 20px;
    font-size: 11px;
    color: #a9a9a9;
    text-align: right;
    line-height: 1.3;
  }

  .indent-gap {
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-bar">
    <h1>高频考点汇总</h1>
    <div class="placeholder mascot-top" style="position:absolute; top:-30px; right:5px; width:75px; height:75px;">
      [插画: 戴耳机猫咪+铅笔]
    </div>
  </div>

  <div class="section-title">(五)设计选项卡考点</div>
  <div class="content-line">1.设计一设置背景格式</div>
  <div class="content-line">2.设计幻灯片主题，调整主题字体</div>
  <div class="content-line">和主题颜色</div>

  <div class="section-title">(六)切换考点</div>

  <div class="placeholder mascot-mid" style="width:90px;height:90px;">
    [插画: 猫咪抱花]
  </div>

  <div class="content-line">1.基础考点</div>
  <div class="content-line">2.设置幻灯片自动放映：切换一</div>
  <div class="content-line">勾选【设置自动换片时间】</div>
  <div class="content-line">一设置时间一点击应用到全部</div>

  <div class="clearfix"></div>

  <div class="section-title">
    (七)动画考点
    <span class="stars">★★★★★</span>
  </div>
  <div class="content-line">1.常规考点，动画效果，设置多个动画，</div>
  <div class="content-line">利用【动画窗格】选择调整动画顺序</div>
  <div class="content-line">2.设置动画计时</div>

  <div class="section-title">(八)视图选项卡考点</div>
  <div class="content-line">1.颜色，灰度，黑白模式的调整</div>

  <div class="section-title">(九)幻灯片放映</div>

  <div class="placeholder mascot-bottom" style="width:90px;height:90px;">
    [插画: 猫咪哭泣]
  </div>

  <div class="content-line">设置幻灯片放映等</div>

  <div class="watermark">
    [小红书图标] 多多鸭师姐<br>
    From 小红书
  </div>

</div>
</body>
</html>
