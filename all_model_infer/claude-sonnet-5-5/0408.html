<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals & Objectives</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 0;
  }
  .slide {
    width: 1024px;
    height: 768px;
    position: relative;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
  }
  .title {
    position: absolute;
    top: 15px;
    right: 40px;
    font-size: 48px;
    color: #4a2c2a;
    font-weight: 400;
  }
  .subtitle {
    position: absolute;
    top: 145px;
    left: 55px;
    font-size: 28px;
    color: #4a2c2a;
  }
  .goal {
    position: absolute;
    left: 40px;
    font-size: 28px;
    color: #1a7a7a;
  }
  .goal1 { top: 260px; }
  .goal2 { top: 335px; }
  .goal3 { top: 410px; }
  .goal4 { top: 540px; }
  .goal5 { top: 615px; }

  /* Bracket 1 (top) */
  .bracket1 {
    position: absolute;
    left: 558px;
    top: 248px;
    width: 95px;
    height: 255px;
    border-top: 5px solid #4a2c2a;
    border-right: 5px solid #4a2c2a;
    border-bottom: 5px solid #4a2c2a;
    border-radius: 0 40px 40px 0;
  }

  /* Bracket 2 (bottom) */
  .bracket2 {
    position: absolute;
    left: 568px;
    top: 530px;
    width: 95px;
    height: 180px;
    border-top: 5px solid #4a2c2a;
    border-right: 5px solid #4a2c2a;
    border-bottom: 5px solid #4a2c2a;
    border-radius: 0 40px 40px 0;
  }

  .arrow {
    position: absolute;
    width: 115px;
    height: 55px;
    background: #1a7a7a;
  }
  .arrow::after {
    content: "";
    position: absolute;
    left: -40px;
    top: -17px;
    border-top: 45px solid transparent;
    border-bottom: 45px solid transparent;
    border-right: 60px solid #1a7a7a;
  }

  .arrow1 {
    top: 335px;
    left: 665px;
  }
  .arrow2 {
    top: 580px;
    left: 675px;
  }

  .label {
    position: absolute;
    font-size: 26px;
    color: #4a2c2a;
    text-align: center;
    line-height: 1.2;
  }
  .label1 {
    top: 285px;
    left: 850px;
    width: 140px;
  }
  .label2 {
    top: 555px;
    left: 800px;
    width: 200px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="title">Goals &amp; Objectives</div>
  <div class="subtitle">From January 1, 2016 &ndash; December 31, 2018, we will:</div>

  <div class="goal goal1">Goal 1: XX</div>
  <div class="goal goal2">Goal 2: XX</div>
  <div class="goal goal3">Goal 3: XX</div>

  <div class="goal goal4">Goal 4: Money</div>
  <div class="goal goal5">Goal 5: People &amp; Infrastructure</div>

  <div class="bracket1"></div>
  <div class="bracket2"></div>

  <div class="arrow arrow1"></div>
  <div class="arrow arrow2"></div>

  <div class="label label1">Theory<br>of<br>Change<br>Goals</div>
  <div class="label label2">Organization<br>Goals</div>
</div>
</body>
</html>
