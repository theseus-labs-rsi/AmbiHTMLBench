<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅拍婚纱照大PK</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    background: #eee;
  }
  .page {
    width: 540px;
    min-height: 720px;
    position: relative;
    display: flex;
    background: linear-gradient(to right, #fdf4ee 0%, #fdf4ee 50%, #dceef4 50%, #dceef4 100%);
  }
  .title {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #1a1a1a;
    font-family: "KaiTi", "STKaiti", serif;
    z-index: 10;
  }
  .vs-badge {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    background: #5a9ab5;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    width: 40px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 3px;
    z-index: 10;
  }
  .col {
    width: 50%;
    padding-top: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .col-header {
    font-size: 15px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }
  .grid {
    display: grid;
    gap: 3px;
    width: 92%;
  }
  .left-grid {
    grid-template-columns: 1fr 1.3fr;
    grid-template-rows: 90px 90px 90px;
  }
  .right-grid {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 90px 90px 90px;
  }
  .placeholder {
    background: #ccc;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #555;
    text-align: center;
    overflow: hidden;
  }
  .span2 {
    grid-column: span 2;
  }
  .text-block {
    margin-top: 12px;
    width: 90%;
    font-size: 11px;
    line-height: 1.7;
    color: #333;
    text-indent: 1.5em;
    text-align: justify;
  }

  /* color approximations for placeholders */
  .p1 { background: linear-gradient(135deg,#8a8a6a,#c9b98a); }
  .p2 { background: linear-gradient(135deg,#b7c99a,#8a9a6a); }
  .p3 { background: linear-gradient(135deg,#d9c9a9,#fff); }
  .p4 { background: linear-gradient(135deg,#9a8a5a,#eee); }
  .p5 { background: linear-gradient(135deg,#6a7a4a,#bcd0a0); }
  .p6 { background: linear-gradient(135deg,#3a4a2a,#889a6a); }

  .q1 { background: linear-gradient(135deg,#4a5a3a,#9ab07a); }
  .q2 { background: linear-gradient(135deg,#eee,#333); }
  .q3 { background: linear-gradient(135deg,#eee,#9ab07a); }
  .q4 { background: linear-gradient(135deg,#ccc,#889a6a); }
  .q5 { background: linear-gradient(135deg,#1a2a1a,#2a3a2a); }

</style>
</head>
<body>
<div class="page">
  <div class="title">"旅拍婚纱照大PK"</div>
  <div class="vs-badge">VS</div>

  <!-- Left Column -->
  <div class="col">
    <div class="col-header">新疆 · 喀什旅拍</div>
    <div class="grid left-grid">
      <div class="placeholder p1">[新郎新娘合照<br>戴头饰]</div>
      <div class="placeholder p2">[一家四人<br>草地奔跑]</div>
      <div class="placeholder p3">[新娘特写<br>头饰花冠]</div>
      <div class="placeholder p4 span2">[一家四人<br>雪山前奔跑]</div>
      <div class="placeholder p5 span2">[新郎新娘<br>牵手雪山草地]</div>
    </div>
    <div class="text-block">
      在这片色彩浓郁的土地，增添了文化和艺术的极致体现满满的西部风格出片效果太绝了！如果你想要不一样的婚纱旅拍，这里一定是首要之选！
    </div>
  </div>

  <!-- Right Column -->
  <div class="col">
    <div class="col-header">新疆 · 伊犁旅拍</div>
    <div class="grid right-grid">
      <div class="placeholder q1">[草原山坡<br>白纱新娘背影]</div>
      <div class="placeholder q2">[新郎新娘<br>深色大头特写]</div>
      <div class="placeholder q3">[新娘坐姿<br>草地白纱]</div>
      <div class="placeholder q4">[新郎新娘<br>山坡远景]</div>
      <div class="placeholder q5 span2">[夜晚草原<br>两人剪影]</div>
    </div>
    <div class="text-block">
      阳光和草原的风景像儿时梦里的画面一般梦幻，阳光下吹过的风，晚间夕阳落在芳草地上，都不及情到浓时两人相视一笑的那一抹温柔
    </div>
  </div>
</div>
</body>
</html>
