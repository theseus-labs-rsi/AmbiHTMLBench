<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #fdfdfb;
    display: flex;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    background-image:
      linear-gradient(to right, #d9e6ef 1px, transparent 1px),
      linear-gradient(to bottom, #d9e6ef 1px, transparent 1px);
    background-size: 27px 27px;
    background-color: #fcfcf9;
    font-family: "Kaiti", "KaiTi", "STKaiti", "Microsoft Yahei", sans-serif;
    padding: 20px 10px;
    box-sizing: border-box;
  }

  .title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #111;
    margin-top: 10px;
    margin-bottom: 25px;
    letter-spacing: 4px;
  }

  .content-row {
    display: flex;
    align-items: flex-start;
  }

  .label-col {
    width: 55px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #c0392b;
    border: 2px solid #c0392b;
    border-radius: 4px;
    padding: 6px 4px;
    line-height: 1.4;
    margin-right: 15px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    height: 160px;
  }

  .text-col {
    flex: 1;
    font-size: 17px;
    color: #c0392b;
    line-height: 2.2;
  }

  .block1 { margin-top: 15px; }
  .block2 { margin-top: 20px; position: relative; }

  .black-text {
    color: #111;
  }

  .indent {
    display: block;
    margin-left: 30px;
  }

  .seal {
    position: absolute;
    right: 40px;
    top: 330px;
    width: 70px;
    height: 100px;
    border: 3px solid #b5171f;
    border-radius: 6px;
    color: #b5171f;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    line-height: 1.2;
    opacity: 0.85;
    background: rgba(255,0,0,0.03);
    letter-spacing: 6px;
    padding-top: 5px;
  }

  .motto {
    margin-top: 40px;
    margin-left: 55px;
    font-size: 20px;
    font-weight: bold;
  }
  .motto .blue { color: #1f3a93; }
  .motto .red { color: #b5171f; }

  .fuhao {
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title">句段结构作用好处赏析</div>

  <div class="content-row">
    <div class="label-col">常&nbsp;&nbsp;见&nbsp;&nbsp;问&nbsp;&nbsp;法</div>
    <div class="text-col block1">
      1.请分析这句话的作用是什么？<br>
      2.这句话这样描写有什么好处？<br>
      3.请分析这句话这样描写的表达效果.
    </div>
  </div>

  <div class="content-row" style="margin-top: 40px; position: relative;">
    <div class="label-col">满&nbsp;&nbsp;分&nbsp;&nbsp;公&nbsp;&nbsp;式</div>
    <div class="text-col block2">
      <span class="black-text">① 这是（&nbsp;&nbsp;&nbsp;&nbsp;）描写</span><br>
      <span class="indent black-text">生动形象地写出（&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;）.</span><br><br>
      <span class="black-text">② 更突出了（&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;）</span><br><br>
      <span class="black-text">③ 前后文呼应/为后文（&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;）做了铺垫.</span>
    </div>

    <div class="seal">李真</div>
  </div>

  <div class="motto">
    <span class="blue">口诀：</span><span class="red">生动秀 &nbsp;感心头 &nbsp;勾勾手</span>
  </div>

</div>
</body>
</html>
