<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypertension – Therapy goal</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #050512;
    font-family: Arial, Helvetica, sans-serif;
  }
  .slide {
    width: 1024px;
    height: 768px;
    background: repeating-linear-gradient(
      to bottom,
      #05061a 0px,
      #05061a 7px,
      #0a0c2a 8px
    ), linear-gradient(to bottom, #000000 0%, #0a0c2e 60%, #0a0c30 100%);
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    padding: 40px 45px;
  }
  h1 {
    color: #ffff33;
    font-size: 46px;
    font-weight: bold;
    margin: 0 0 10px 0;
  }
  .rule {
    border: none;
    border-top: 3px solid #cc2222;
    margin: 0 0 40px 0;
  }
  .content {
    margin-top: 20px;
  }
  .bullet1 {
    color: #ffffff;
    font-size: 32px;
    font-weight: bold;
    margin: 0 0 8px 0;
  }
  .bullet1::before {
    content: "• ";
    color: #ffffff;
  }
  .sub {
    color: #6fa8dc;
    font-size: 27px;
    margin: 0 0 8px 55px;
  }
  .sub::before {
    content: "– ";
  }
  .spacer {
    height: 40px;
  }
  .bottom-rule {
    position: absolute;
    bottom: 40px;
    left: 30px;
    right: 60px;
    border: none;
    border-top: 2px solid #cc2222;
  }
</style>
</head>
<body>
<div class="slide">
  <h1>Hypertension – Therapy goal</h1>
  <hr class="rule">

  <div class="content">
    <p class="bullet1">Goal BP</p>
    <p class="sub">To Keep B.P. &lt; 140/90 mm Hg in each patient</p>
    <p class="sub">This may be revised to 120/80&nbsp; may be ? 110/70</p>
    <p class="sub">MRFIT's&nbsp; cut off values are 115/75 mm Hg</p>

    <div class="spacer"></div>

    <p class="bullet1">The Truth is</p>
    <p class="sub">It is essential to keep the B.P at or below the goal</p>
    <p class="sub">But, It also matters how the goal B.P. is achieved !</p>
  </div>

  <hr class="bottom-rule">
</div>
</body>
</html>
