<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 - 坚持奋斗主题金句摘抄</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    background: #fff;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #fff;
  }
  .header {
    background: #f7ece4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px 18px 20px;
  }
  .header-left {
    display: flex;
    flex-direction: column;
  }
  .logo {
    font-size: 40px;
    font-weight: 900;
    color: #c8281f;
    font-family: "STKaiti", "KaiTi", serif;
    letter-spacing: 2px;
    line-height: 1;
  }
  .logo-sub {
    margin-top: 6px;
    font-size: 11px;
    color: #c8281f;
    letter-spacing: 4px;
    font-weight: 600;
  }
  .header-right {
    display: flex;
    align-items: center;
    border-left: 2px solid #1a1a1a;
    padding-left: 16px;
    height: 62px;
  }
  .header-right-text {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }
  .tag-line {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .theme-line {
    font-size: 20px;
    font-weight: 900;
    color: #1a1a1a;
    white-space: nowrap;
  }
  .content {
    background: #cfc3ac;
    padding: 30px 26px 40px 26px;
  }
  .quote-block {
    margin-bottom: 26px;
  }
  .quote-title {
    font-size: 26px;
    font-weight: 900;
    color: #1a1a1a;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 18px;
  }
  .example-label {
    font-size: 14px;
    font-weight: 700;
    color: #333;
    margin: 10px 0 8px 0;
  }
  .example-text {
    font-size: 14.5px;
    color: #2b2b2b;
    line-height: 1.9;
    text-align: justify;
  }
  .divider-space {
    height: 20px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="logo">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="header-right-text">
        <div class="tag-line">金句 | 摘抄</div>
        <div class="theme-line">坚持奋斗主题</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="quote-block">
      <div class="quote-title">夜色难免黑凉<br>前行必有曙光</div>
      <div class="example-label">举例：</div>
      <div class="example-text">
        夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
      </div>
    </div>

    <div class="divider-space"></div>

    <div class="quote-block">
      <div class="quote-title">道固远，笃行可至<br>事虽巨，坚为必成</div>
      <div class="example-label">举例：</div>
      <div class="example-text">
        道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
      </div>
    </div>
  </div>
</div>
</body>
</html>
