<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几点(分享) Vol.07 - Design studio web</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 540px;
    height: 720px;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px 0 20px;
  }
  .logo-block .logo-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    font-style: italic;
  }
  .logo-block .vol {
    font-size: 11px;
    font-weight: bold;
    vertical-align: super;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f2f2f2;
    padding: 6px 10px;
    border-radius: 3px;
  }
  .folder-icon {
    width: 14px;
    height: 12px;
    background: #444;
    clip-path: polygon(0 20%, 40% 20%, 50% 0, 100% 0, 100% 100%, 0 100%);
  }
  .header-right span {
    font-size: 13px;
    font-weight: 600;
    color: #222;
  }
  .header-line {
    border-bottom: 3px solid #111;
    margin: 8px 20px 0 20px;
  }

  /* Card zone */
  .card-zone {
    position: relative;
    height: 330px;
    width: 100%;
  }

  .tag {
    position: absolute;
    background: #eaeaea;
    box-shadow: 2px 3px 6px rgba(0,0,0,0.25);
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 12px;
  }
  .tag .num-circle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #bbb;
    color: #444;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    top: 50%;
    transform: translateY(-50%);
  }

  .tag1 {
    top: 30px;
    left: 25px;
    width: 190px;
    height: 90px;
    transform: rotate(-8deg);
    background: #1a1a1a;
    color: #fff;
    padding-left: 40px;
  }
  .tag1 .num-circle { left: 10px; background: #444; color: #fff; }
  .tag1 .big { font-size: 26px; font-weight: 900; }
  .tag1 .small { font-size: 12px; font-weight: bold; margin-top: 4px; }

  .tag2 {
    top: 55px;
    left: 195px;
    width: 190px;
    height: 105px;
    transform: rotate(-3deg);
    background: #1a1a1a;
    color: #fff;
    padding-left: 20px;
    z-index: 3;
  }
  .tag2 .num-circle { left: 100px; bottom: 5px; top: auto; background: #444; color: #fff; }
  .tag2 .big { font-size: 26px; font-weight: 900; }
  .tag2 .small { font-size: 13px; font-weight: bold; margin-top: 6px; line-height: 1.3; }

  .tag3 {
    top: 20px;
    right: 20px;
    width: 155px;
    height: 100px;
    transform: rotate(10deg);
    background: #1a1a1a;
    color: #fff;
    padding: 8px 14px;
    text-align: right;
  }
  .tag3 .small-line { font-size: 12px; font-weight: bold; }
  .tag3 .big { font-size: 22px; font-weight: 900; margin-top: 4px; }
  .tag3 .num-circle { left: 6px; background: #444; color: #fff; }

  .tag4 {
    top: 195px;
    left: 60px;
    width: 190px;
    height: 90px;
    transform: rotate(-2deg);
    background: #1a1a1a;
    color: #fff;
    padding-left: 40px;
  }
  .tag4 .num-circle { left: 10px; background: #444; color: #fff; }
  .tag4 .big { font-size: 26px; font-weight: 900; }
  .tag4 .small { font-size: 13px; font-weight: bold; margin-top: 6px; }

  .tag5 {
    top: 205px;
    right: 45px;
    width: 175px;
    height: 90px;
    transform: rotate(4deg);
    background: #1a1a1a;
    color: #fff;
    padding-left: 15px;
  }
  .tag5 .num-circle { right: 10px; left: auto; background: #444; color: #fff; }
  .tag5 .big { font-size: 26px; font-weight: 900; }
  .tag5 .small { font-size: 11px; font-weight: bold; margin-top: 4px; line-height: 1.3; }

  /* Blue bar */
  .blue-bar {
    width: 100%;
    height: 22px;
    background: #2a2adf;
  }

  /* Cyan section */
  .cyan-section {
    width: 100%;
    height: 250px;
    background: #b0f0ea;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 25px;
  }
  .cyan-line {
    border-bottom: 4px solid #111;
    margin: 6px 0;
  }
  .cyan-text {
    font-size: 52px;
    font-weight: 900;
    color: #111;
    line-height: 1.25;
    letter-spacing: 1px;
    padding: 4px 0;
  }

  /* Footer */
  .footer {
    background: #000;
    color: #fff;
    height: 88px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
  }
  .footer-left {
    font-size: 13px;
    line-height: 1.6;
  }
  .footer-mid {
    font-size: 12px;
    color: #ccc;
  }
  .footer-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .triangle-logo {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #fff;
    position: relative;
  }
  .barcode-block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .barcode {
    width: 90px;
    height: 26px;
    background: repeating-linear-gradient(
      90deg, #fff 0px, #fff 2px, #000 2px, #000 4px
    );
  }
  .barcode-caption {
    font-size: 9px;
    color: #ccc;
    margin-top: 2px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo-block">
      <span class="logo-title">几点<span style="font-size:16px; font-weight:700;">(分享)</span></span>
      <span class="vol">Vol.07</span>
    </div>
    <div class="header-right">
      <div class="folder-icon"></div>
      <span>Design studio web</span>
    </div>
  </div>
  <div class="header-line"></div>

  <div class="card-zone">
    <div class="tag tag1">
      <div class="num-circle">1</div>
      <div class="big">ABCD</div>
      <div class="small">A BLACK<br>COVER DESIGN</div>
    </div>

    <div class="tag tag2">
      <div class="big">条件反射</div>
      <div class="small">REFLEX<br>DESIGN</div>
      <div class="num-circle">2</div>
    </div>

    <div class="tag tag3">
      <div class="num-circle">3</div>
      <div class="small-line">STUDIO</div>
      <div class="small-line">NA. EO</div>
      <div class="big">立入禁止</div>
    </div>

    <div class="tag tag4">
      <div class="num-circle">4</div>
      <div class="big">王志弘</div>
      <div class="small">WANG ZHI HONG</div>
    </div>

    <div class="tag tag5">
      <div class="num-circle">5</div>
      <div class="big">NICE<br>LAB</div>
      <div class="small">NICE LAB<br>STUDIO</div>
    </div>
  </div>

  <div class="blue-bar"></div>

  <div class="cyan-section">
    <div class="cyan-line"></div>
    <div class="cyan-text">国内知名设计</div>
    <div class="cyan-line"></div>
    <div class="cyan-text">工作室的官网</div>
    <div class="cyan-line"></div>
  </div>

  <div class="footer">
    <div class="footer-left">
      Copyright© 2023<br>
      Jidn share all rights reserved.
    </div>
    <div class="footer-mid">(官网)</div>
    <div class="footer-right">
      <div class="triangle-logo"></div>
      <div class="barcode-block">
        <div class="barcode"></div>
        <div class="barcode-caption">JIDN SHARE ©2023</div>
      </div>
    </div>
  </div>

</body>
</html>
