<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7.当题目中出现"原则"时模板</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #2b2b2b;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 540px;
    min-height: 700px;
    position: relative;
    padding: 40px 35px 40px 35px;
    box-sizing: border-box;
    color: #f2f2f2;
  }

  .title {
    color: #f5a623;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.6;
    margin-bottom: 25px;
  }

  .content p {
    font-size: 19px;
    line-height: 1.9;
    margin: 0 0 12px 0;
    color: #f0f0f0;
  }

  .watermark {
    position: absolute;
    color: rgba(90, 200, 90, 0.35);
    font-size: 34px;
    font-weight: bold;
    transform: rotate(-20deg);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .wm1 {
    top: 260px;
    left: 220px;
  }

  .wm2 {
    top: 540px;
    left: 300px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="watermark wm1">琳子幼资</div>
  <div class="watermark wm2">琳子幼资</div>

  <div class="title">
    7.当题目中出现"原则"时，可用<br>
    以下模板：
  </div>

  <div class="content">
    <p>(一)教育性原则。…体现教育目标，有利于幼儿身的全面发展</p>
    <p>(二)个别差异性原则。每个幼儿不一样，教师要因材施教</p>
    <p>（三）科学性原则 。…能给幼儿正确的启蒙教育</p>
    <p>(四)发展适宜性原则。考虑到不同年龄阶段孩子的特点</p>
    <p>（五）整体性原则 。考虑到多方面的要素，促进幼儿整体的发展</p>
    <p>（六）活动性原则。注重幼儿亲身体验，直接参与，以各种游戏活动为主</p>
  </div>

</div>
</body>
