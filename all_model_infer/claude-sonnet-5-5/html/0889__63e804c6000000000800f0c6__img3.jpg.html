<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香水浓度分类表</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: repeating-linear-gradient(
        90deg,
        #a9814f 0px, #a9814f 6px,
        #9c7645 6px, #9c7645 12px,
        #b28a56 12px, #b28a56 18px
      ),
      linear-gradient(180deg, #8a6a3f, #7a5c37);
    font-family: "Songti SC", "SimSun", "STSong", serif;
  }

  .card {
    position: relative;
    width: 480px;
    background: #fbf9f5;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    padding: 26px 30px 24px 44px;
  }

  h1 {
    text-align: center;
    font-size: 40px;
    letter-spacing: 6px;
    color: #6b5330;
    font-weight: 900;
    margin: 6px 0 22px 0;
  }

  .bottles {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 4px 18px 4px;
    margin-bottom: 6px;
  }

  .bottle-wrap {
    width: 78px;
    height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }

  .spray-lines {
    position: absolute;
    top: -6px;
    left: 50%;
    width: 44px;
    height: 14px;
    transform: translateX(-50%);
  }
  .spray-lines::before, .spray-lines::after {
    content: "";
    position: absolute;
    top: 6px;
    width: 20px;
    height: 1px;
    border-top: 1px dashed #888;
  }
  .spray-lines::before { left: -6px; transform: rotate(-8deg); }
  .spray-lines::after { right: -6px; transform: rotate(8deg); }

  .ball {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8b7a, #d92f1f);
    margin-bottom: 2px;
    z-index: 2;
  }
  .neck {
    width: 6px;
    height: 8px;
    background: #444;
  }
  .cup {
    width: 46px;
    height: 60px;
    border: 1.5px solid #888;
    border-top: none;
    border-radius: 0 0 6px 6px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0% 100%);
  }
  .fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #d9d9d9;
  }
  .label-name {
    font-size: 12px;
    color: #333;
    margin-top: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  td, th {
    text-align: center;
    padding: 14px 2px;
    font-size: 15px;
    color: #333;
    vertical-align: middle;
    white-space: pre-line;
  }
  tr {
    border-bottom: 1px solid #e6e2da;
  }
  tr:last-child { border-bottom: none; }

  .rowlabel {
    position: relative;
    left: -44px;
    width: 34px;
    background: #f3ede0;
    color: #6b5330;
    font-weight: bold;
    font-size: 14px;
    border-radius: 6px 0 0 6px;
    padding: 10px 4px;
    box-shadow: -2px 2px 4px rgba(0,0,0,0.08);
  }

  .header-cell {
    font-weight: bold;
    font-size: 16px;
    color: #4a3a20;
  }

  .tips {
    margin-top: 18px;
    padding-left: 4px;
    font-size: 13px;
    color: #444;
    line-height: 1.7;
  }
  .tips .tips-title {
    font-weight: bold;
    color: #4a3a20;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>香水浓度</h1>

    <div class="bottles">
      <div class="bottle-wrap">
        <div class="spray-lines"></div>
        <div class="ball"></div>
        <div class="neck"></div>
        <div class="cup"><div class="fill" style="height:82%;"></div></div>
      </div>
      <div class="bottle-wrap">
        <div class="spray-lines"></div>
        <div class="ball"></div>
        <div class="neck"></div>
        <div class="cup"><div class="fill" style="height:65%;"></div></div>
      </div>
      <div class="bottle-wrap">
        <div class="spray-lines"></div>
        <div class="ball"></div>
        <div class="neck"></div>
        <div class="cup"><div class="fill" style="height:48%;"></div></div>
      </div>
      <div class="bottle-wrap">
        <div class="spray-lines"></div>
        <div class="ball"></div>
        <div class="neck"></div>
        <div class="cup"><div class="fill" style="height:32%;"></div></div>
      </div>
      <div class="bottle-wrap">
        <div class="spray-lines"></div>
        <div class="ball"></div>
        <div class="neck"></div>
        <div class="cup"><div class="fill" style="height:14%;"></div></div>
      </div>
    </div>

    <table>
      <colgroup>
        <col style="width:20%;">
        <col style="width:20%;">
        <col style="width:20%;">
        <col style="width:20%;">
        <col style="width:20%;">
      </colgroup>
      <tbody>
        <tr>
          <td class="header-cell">
            <span class="rowlabel">分类</span>
          </td>
          <td class="header-cell">浓香精</td>
          <td class="header-cell">淡香精</td>
          <td class="header-cell">淡香水</td>
          <td class="header-cell">古龙水</td>
        </tr>
        <tr>
          <td><span class="rowlabel">名称</span></td>
          <td>Parfum</td>
          <td>Eau&#10;De&#10;Parfum</td>
          <td>Eau&#10;De&#10;Toilette</td>
          <td>Eau&#10;De&#10;Cologne</td>
        </tr>
        <tr>
          <td><span class="rowlabel">缩写</span></td>
          <td>(P)</td>
          <td>(EDP)</td>
          <td>(EDT)</td>
          <td>(EDC)</td>
        </tr>
        <tr>
          <td><span class="rowlabel">浓度</span></td>
          <td>15-20%</td>
          <td>10-15%</td>
          <td>5-10%</td>
          <td>3-5%</td>
        </tr>
        <tr>
          <td><span class="rowlabel">留香</span></td>
          <td>5-8H</td>
          <td>3-5H</td>
          <td>3-4H</td>
          <td>2-3H</td>
        </tr>
      </tbody>
    </table>

    <div style="display:flex; margin-top:-2px;">
      <div style="width:20%;"></div>
      <div style="width:80%; text-align:center; font-size:15px; color:#333; padding:14px 2px; border-top:none; margin-top:-58px;">
        清香水
      </div>
    </div>

    <div style="position:relative; margin-top:-360px; margin-left:80%; width:20%; text-align:center;">
      <div style="padding:0 2px 0 2px; font-size:15px; color:#333; line-height: 2.2; margin-top: 0;">
        Eau<br>Fraiche
      </div>
    </div>

    <div class="tips">
      <div class="tips-title">tips:</div>
      <div>浓度高的香水不代表留香时长,主要取决于香料种类</div>
      <div>在相同的浓度比较下, 木质香的留香时间是麝压花果香的</div>
    </div>
  </div>
</body>
</html>
