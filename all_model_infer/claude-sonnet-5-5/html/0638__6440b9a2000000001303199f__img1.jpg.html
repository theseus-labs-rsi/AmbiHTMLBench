<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨读笔记</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #c8c0a8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      font-family: "SimSun", "宋体", serif;
    }

    /* Top navigation bar */
    .top-nav {
      width: 100%;
      max-width: 540px;
      background-color: #b0a888;
      display: flex;
      align-items: center;
      height: 28px;
      font-size: 12px;
      color: #4a3f2f;
      border-bottom: 1px solid #9a9078;
    }

    .top-nav span {
      padding: 0 10px;
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid #9a9078;
      white-space: nowrap;
    }

    .top-nav span.active {
      background-color: #6b5c40;
      color: #f0e8d8;
    }

    /* Main page */
    .page {
      width: 100%;
      max-width: 540px;
      background-color: #f5f0e8;
      border: 1px solid #c8bfa8;
      min-height: 740px;
      display: flex;
      flex-direction: column;
    }

    /* Title row */
    .title-row {
      padding: 8px 14px 6px 14px;
      border-bottom: 1px solid #d8d0c0;
      background-color: #f5f0e8;
    }

    .title-row h1 {
      font-size: 18px;
      font-weight: bold;
      color: #3a3020;
      letter-spacing: 2px;
    }

    .title-row h1::before {
      content: "· ";
      color: #8a7a5a;
    }

    /* Info rows (主题, 应用领域, etc.) */
    .info-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #d0c8b0;
    }

    .info-row {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #ddd8cc;
      min-height: 30px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      width: 72px;
      min-width: 72px;
      background-color: #ece6d8;
      font-size: 12px;
      color: #5a4e38;
      display: flex;
      align-items: center;
      padding-left: 10px;
      border-right: 1px solid #d0c8b0;
      letter-spacing: 1px;
    }

    .info-value {
      flex: 1;
      background-color: #faf8f2;
      min-height: 28px;
      /* grid background lines */
      background-image: repeating-linear-gradient(
        transparent,
        transparent 19px,
        #e8e0d0 19px,
        #e8e0d0 20px
      );
      background-size: 100% 20px;
    }

    /* Checkbox rows section */
    .checkbox-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #d0c8b0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      padding: 4px 10px;
      min-height: 26px;
      border-bottom: 1px solid #e0d8c8;
    }

    .checkbox-row:last-child {
      border-bottom: none;
    }

    .checkbox-circle {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid #8a7a5a;
      display: inline-block;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .checkbox-row-label {
      font-size: 12px;
      color: #4a3f2f;
      letter-spacing: 1px;
    }

    .checkbox-row .line-area {
      flex: 1;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 19px,
        #e0d8c8 19px,
        #e0d8c8 20px
      );
      background-size: 100% 20px;
      min-height: 22px;
      margin-left: 6px;
    }

    /* Three-column analysis section */
    .analysis-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #d0c8b0;
    }

    .analysis-header {
      display: flex;
      border-bottom: 1px solid #d0c8b0;
      background-color: #ece6d8;
    }

    .analysis-header-cell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 4px;
      font-size: 12px;
      color: #5a4e38;
      border-right: 1px solid #d0c8b0;
      letter-spacing: 1px;
    }

    .analysis-header-cell:last-child {
      border-right: none;
    }

    .analysis-header-cell .checkbox-circle {
      margin-right: 4px;
    }

    .analysis-header-cell.wide {
      flex: 1.5;
    }

    .analysis-body {
      display: flex;
      min-height: 210px;
    }

    .analysis-col {
      flex: 1;
      border-right: 1px solid #d0c8b0;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 19px,
        #e8e0d0 19px,
        #e8e0d0 20px
      );
      background-size: 100% 20px;
      background-color: #faf8f2;
    }

    .analysis-col:last-child {
      border-right: none;
      flex: 1.5;
    }

    /* 句子迁移 / 方法迁移 sections */
    .migration-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #d0c8b0;
    }

    .migration-row {
      display: flex;
      min-height: 70px;
      border-bottom: 1px solid #d8d0c0;
    }

    .migration-row:last-child {
      border-bottom: none;
    }

    .migration-label-col {
      width: 50px;
      min-width: 50px;
      background-color: #ece6d8;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #d0c8b0;
      writing-mode: vertical-rl;
      font-size: 12px;
      color: #5a4e38;
      letter-spacing: 2px;
      padding: 6px 0;
    }

    .migration-content {
      flex: 1;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 19px,
        #e8e0d0 19px,
        #e8e0d0 20px
      );
      background-size: 100% 20px;
      background-color: #faf8f2;
    }

    /* 备注 row */
    .notes-row {
      display: flex;
      min-height: 40px;
    }

    .notes-label {
      width: 50px;
      min-width: 50px;
      background-color: #ece6d8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #5a4e38;
      border-right: 1px solid #d0c8b0;
      letter-spacing: 1px;
    }

    .notes-content {
      flex: 1;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 19px,
        #e8e0d0 19px,
        #e8e0d0 20px
      );
      background-size: 100% 20px;
      background-color: #faf8f2;
    }

    /* Watermark area at bottom */
    .watermark {
      text-align: center;
      font-size: 10px;
      color: #b0a888;
      padding: 4px 0 6px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Top navigation bar -->
  <div class="top-nav">
    <span>行测</span>
    <span style="padding: 0 6px; border-right: none;">›</span>
    <span>常识</span>
    <span>言语</span>
    <span>数量</span>
    <span>判断</span>
    <span>资料</span>
    <span class="active">申论</span>
    <span>纸笔</span>
    <span>计划</span>
  </div>

  <!-- Main page -->
  <div class="page">

    <!-- Title -->
    <div class="title-row">
      <h1>晨读笔记</h1>
    </div>

    <!-- Info rows: 主题, 应用领域, 热门事件, 宏观政策, 媒体评论 -->
    <div class="info-section">
      <div class="info-row">
        <div class="info-label">主题</div>
        <div class="info-value"></div>
      </div>
      <div class="info-row">
        <div class="info-label">应用领域</div>
        <div class="info-value"></div>
      </div>
      <div class="info-row">
        <div class="info-label">热门事件</div>
        <div class="info-value"></div>
      </div>
      <div class="info-row">
        <div class="info-label">宏观政策</div>
        <div class="info-value"></div>
      </div>
      <div class="info-row">
        <div class="info-label">媒体评论</div>
        <div class="info-value"></div>
      </div>
    </div>

    <!-- Checkbox rows: 意义, 原因, 问题, 危害 -->
    <div class="checkbox-section">
      <div class="checkbox-row">
        <span class="checkbox-circle"></span>
        <span class="checkbox-row-label">意义</span>
        <div class="line-area"></div>
      </div>
      <div class="checkbox-row">
        <span class="checkbox-circle"></span>
        <span class="checkbox-row-label">原因</span>
        <div class="line-area"></div>
      </div>
      <div class="checkbox-row">
        <span class="checkbox-circle"></span>
        <span class="checkbox-row-label">问题</span>
        <div class="line-area"></div>
      </div>
      <div class="checkbox-row">
        <span class="checkbox-circle"></span>
        <span class="checkbox-row-label">危害</span>
        <div class="line-area"></div>
      </div>
    </div>

    <!-- Three-column analysis section -->
    <div class="analysis-section">
      <div class="analysis-header">
        <div class="analysis-header-cell">
          <span class="checkbox-circle"></span>问题分析
        </div>
        <div class="analysis-header-cell">
          <span class="checkbox-circle"></span>原因分析
        </div>
        <div class="analysis-header-cell wide">对策分析</div>
      </div>
      <div class="analysis-body">
        <div class="analysis-col"></div>
        <div class="analysis-col"></div>
        <div class="analysis-col"></div>
      </div>
    </div>

    <!-- 句子迁移 / 方法迁移 -->
    <div class="migration-section">
      <div class="migration-row">
        <div class="migration-label-col">句子迁移</div>
        <div class="migration-content"></div>
      </div>
      <div class="migration-row">
        <div class="migration-label-col">方法迁移</div>
        <div class="migration-content"></div>
      </div>
    </div>

    <!-- 备注 -->
    <div class="notes-row">
      <div class="notes-label">备注</div>
      <div class="notes-content"></div>
    </div>

    <!-- Watermark -->
    <div class="watermark">风观笔</div>

  </div>

</body>
</html>
