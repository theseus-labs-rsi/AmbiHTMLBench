<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色出行 低碳环保 - 公益广告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background: white;
            width: 210mm;
            margin: 0 auto;
        }
        
        .header {
            background: #3a5a8c;
            height: 8px;
            width: 100%;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .logo {
            color: #c42f37;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
        }
        
        .page-info {
            text-align: right;
            font-size: 12px;
            color: #333;
        }
        
        .page-info .section-title {
            font-size: 28px;
            font-weight: bold;
            color: #3a5a8c;
        }
        
        .page-info .page-number {
            font-size: 32px;
            font-weight: bold;
            color: #3a5a8c;
        }
        
        .main-content {
            background: linear-gradient(135deg, #d4e7c5 0%, #e8f5d8 100%);
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.15) 20px, rgba(255,255,255,0.15) 40px),
                repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(255,255,255,0.15) 20px, rgba(255,255,255,0.15) 40px);
            padding: 30px 20px 40px 20px;
            position: relative;
            min-height: 1100px;
        }
        
        .series-label {
            color: #2d8f4d;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-left: 5px;
        }
        
        .main-title {
            position: absolute;
            right: 80px;
            top: 180px;
            text-align: right;
            line-height: 1.3;
        }
        
        .main-title .title-line1 {
            color: #2d8f4d;
            font-size: 72px;
            font-weight: bold;
        }
        
        .main-title .title-line2 {
            color: #2d8f4d;
            font-size: 72px;
            font-weight: bold;
        }
        
        .illustration {
            position: absolute;
            left: 50%;
            top: 280px;
            transform: translateX(-50%);
            width: 600px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .bicycle-graphic {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .description-text {
            position: absolute;
            bottom: 280px;
            left: 60px;
            right: 60px;
            color: #333;
            font-size: 16px;
            line-height: 2;
            text-align: justify;
        }
        
        .footer-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
        }
        
        .wave-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #4a9d5f;
            clip-path: polygon(0 60%, 100% 40%, 100% 100%, 0 100%);
        }
        
        .wave-layer-2 {
            position: absolute;
            bottom: 30px;
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            clip-path: polygon(0 50%, 100% 30%, 100% 100%, 0 100%);
        }
        
        .footer-logo {
            position: absolute;
            bottom: 25px;
            right: 40px;
            color: white;
            font-size: 32px;
            font-weight: bold;
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header"></div>
    
    <div class="top-bar">
        <div class="logo">光明日报</div>
        <div class="page-info">
            <span style="font-size: 11px;">2025年1月5日 星期日</span>
            <span class="section-title">公益广告</span>
            <span class="page-number">05</span>
        </div>
    </div>
    
    <div class="main-content">
        <div class="series-label">绿色生活系列公益广告</div>
        
        <div class="main-title">
            <div class="title-line1">绿色出行</div>
            <div class="title-line2">低碳环保</div>
        </div>
        
        <div class="illustration">
            <svg viewBox="0 0 600 500" style="width: 100%; height: 100%;">
                <!-- Green leaf base -->
                <ellipse cx="300" cy="400" rx="280" ry="140" fill="#4a9d5f" opacity="0.9"/>
                <ellipse cx="300" cy="395" rx="270" ry="130" fill="#5db870"/>
                
                <!-- Leaf veins -->
                <path d="M 180 400 Q 240 380 300 370" stroke="rgba(255,255,255,0.6)" stroke-width="8" fill="none"/>
                <path d="M 300 370 Q 360 380 420 400" stroke="rgba(255,255,255,0.6)" stroke-width="8" fill="none"/>
                <path d="M 220 390 Q 260 375 300 370" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none"/>
                <path d="M 300 370 Q 340 375 380 390" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none"/>
                
                <!-- Shadow under bicycle -->
                <ellipse cx="300" cy="365" rx="140" ry="25" fill="rgba(0,0,0,0.15)"/>
                
                <!-- Bicycle wheels (green) -->
                <circle cx="220" cy="320" r="70" fill="none" stroke="#7bc043" stroke-width="14"/>
                <circle cx="220" cy="320" r="60" fill="none" stroke="#7bc043" stroke-width="3"/>
                <circle cx="380" cy="320" r="70" fill="none" stroke="#7bc043" stroke-width="14"/>
                <circle cx="380" cy="320" r="60" fill="none" stroke="#7bc043" stroke-width="3"/>
                
                <!-- Bicycle frame (black) -->
                <path d="M 220 320 L 300 220 L 380 320" fill="none" stroke="#000" stroke-width="8"/>
                <path d="M 260 270 L 340 270" fill="none" stroke="#000" stroke-width="6"/>
                
                <!-- Person riding (black silhouette) -->
                <circle cx="320" cy="180" r="22" fill="#000"/>
                <path d="M 320 202 Q 310 240 300 270" fill="none" stroke="#000" stroke-width="12"/>
                <path d="M 300 220 Q 280 240 260 270" fill="none" stroke="#000" stroke-width="10"/>
                <path d="M 300 220 Q 320 240 340 270" fill="none" stroke="#000" stroke-width="10"/>
                <path d="M 300 270 Q 290 300 280 320" fill="none" stroke="#000" stroke-width="10"/>
                <path d="M 300 270 Q 310 300 340 310" fill="none" stroke="#000" stroke-width="10"/>
            </svg>
        </div>
        
        <div class="description-text">
            选择绿色出行方式,既节约能源、减少污染,又益于健<br>
            康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具,或<br>
            者选择步行、骑自行车等出行方式,降低出行中产生的能<br>
            耗和污染。绿色出行,低碳出行,文明出行。
        </div>
        
        <div class="footer-wave">
            <div class="wave-layer-2"></div>
            <div class="wave-layer"></div>
        </div>
        
        <div class="footer-logo">光明日报社</div>
    </div>
</body>
</html>
