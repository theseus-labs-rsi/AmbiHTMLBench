<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: #ffffff;
    position: relative;
    padding-bottom: 40px;
  }
  .holes {
    display: flex;
    justify-content: space-between;
    padding: 12px 20px 4px 20px;
  }
  .hole {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #cfcfcf;
    background: #fff;
  }
  .header-title {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: #222;
    margin: 18px 0 8px 0;
    letter-spacing: 1px;
  }
  .header-sub {
    text-align: center;
    font-size: 13px;
    color: #777;
    margin-bottom: 25px;
  }
  .ribbon {
    position: absolute;
    top: 55px;
    left: 0;
    width: 42px;
    height: 105px;
    background: linear-gradient(160deg, #ff5b6e 0%, #b13ea3 45%, #2b2b40 100%);
    border-radius: 0 4px 4px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8px;
  }
  .ribbon-text {
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
  }
  .section {
    display: flex;
    align-items: flex-start;
    padding: 15px 35px 15px 40px;
    margin-top: 25px;
  }
  .icon-box {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 20px;
  }
  .placeholder {
    width: 55px;
    height: 55px;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 9px;
    color: #333;
    border-radius: 6px;
    background: #fafafa;
  }
  .sd-icon svg, .cpu-icon svg {
    width: 45px;
    height: 45px;
  }
  .content-block {
    flex: 1;
  }
  .content-title {
    font-size: 18px;
    font-weight: 700;
    color: #222;
    margin-bottom: 8px;
  }
  .content-text {
    font-size: 13.5px;
    color: #333;
    line-height: 1.7;
  }
  .uhd-box {
    width: 55px;
    height: 55px;
    border: 2px solid #333;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #222;
    line-height: 1.1;
  }
  .uhd-box .big {
    font-size: 15px;
  }
  .uhd-box .small {
    font-size: 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="ribbon">
    <span class="ribbon-text">第一步</span>
  </div>

  <div class="holes">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <div class="header-title">三大核心参数解读</div>
  <div class="header-sub">内存/芯片/分辨率参数解读</div>

  <!-- Section 1: 内存 -->
  <div class="section">
    <div class="icon-box">
      <div class="placeholder sd-icon">[Icon: SD卡]</div>
    </div>
    <div class="content-block">
      <div class="content-title">1.看内存</div>
      <div class="content-text">
        内存越大速度越快，小于8GB不建议购买。（画圈：<br>
        GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）
      </div>
    </div>
  </div>

  <!-- Section 2: 芯片 -->
  <div class="section">
    <div class="icon-box">
      <div class="placeholder cpu-icon">[Icon: CPU芯片]</div>
    </div>
    <div class="content-block">
      <div class="content-title">2.看芯片</div>
      <div class="content-text">
        主流芯片A73和A53。追求性能玩游戏选A73，看<br>
        看电视想省电选A53。
      </div>
    </div>
  </div>

  <!-- Section 3: 分辨率 -->
  <div class="section">
    <div class="icon-box">
      <div class="uhd-box">
        <span class="big">4K</span>
        <span class="small">UHD</span>
      </div>
    </div>
    <div class="content-block">
      <div class="content-title">3.看分辨率</div>
      <div class="content-text">
        分辨率越高越清晰。（目前电视基本都是超高清4K<br>
        也就是3840×2160的分辨率）
      </div>
    </div>
  </div>

</div>
</body>
</html>
