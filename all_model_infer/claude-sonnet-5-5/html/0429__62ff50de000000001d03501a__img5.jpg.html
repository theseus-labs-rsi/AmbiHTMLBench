<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂花露 · 荷花露 制作方法</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e9dfe0;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
  }
  .card {
    width: 540px;
    min-height: 720px;
    background: #e8c9cf;
    border: 1px solid #b98a94;
    box-sizing: border-box;
    padding: 40px 45px 20px 45px;
    position: relative;
    color: #4a4a4a;
  }
  .entry {
    margin-bottom: 8px;
  }
  .title {
    font-size: 17px;
    letter-spacing: 2px;
    margin: 10px 0 22px 0;
    color: #3f3f3f;
  }
  .label-line {
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 1px;
    margin-bottom: 22px;
  }
  .label-line .tag {
    white-space: nowrap;
  }
  .spacer {
    height: 30px;
  }
  .footer {
    position: absolute;
    bottom: 15px;
    left: 45px;
    right: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #7a5a60;
    letter-spacing: 1px;
  }
  .footer .placeholder {
    width: 60px;
    height: 20px;
    border: none;
    color: #7a5a60;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
</style>
</head>
<body>
<div class="card">

  <div class="title">△桂花露</div>

  <div class="label-line"><span class="tag">〔功用〕</span>开胃消食，宽胸化痰</div>

  <div class="label-line"><span class="tag">〔药物〕</span>桂花500克</div>

  <div class="label-line">
    <span class="tag">〔制法〕</span>于9月底开花时采收，阴干，拣去
    杂质。先加水浸泡2小时，放入蒸馏器蒸2
    次，收集蒸馏液
  </div>

  <div class="spacer"></div>

  <div class="title">△荷花露</div>

  <div class="label-line"><span class="tag">〔功用〕</span>清暑凉营</div>

  <div class="label-line"><span class="tag">〔药物〕</span>白荷花500克</div>

  <div class="label-line">
    <span class="tag">〔制法〕</span>取含花未放的大花蕾或开放的
    花，阴干切碎，加水浸泡2小时。放入蒸馏
    器蒸2小时，收集蒸馏液
  </div>

  <div class="footer">
    <span>〔中国色 · 鹡荷〕</span>
    <span class="placeholder">[图丘APP 图标]</span>
  </div>

</div>
</body>
</html>
