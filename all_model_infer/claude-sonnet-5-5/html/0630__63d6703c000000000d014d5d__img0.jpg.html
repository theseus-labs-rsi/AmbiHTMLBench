<!DOCTYPE html>

<style>
  body {
    background: #f5f3ee;

    padding: 0;
    display: flex;
    justify-content: center;

  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    background: #f7f5f0;
    padding: 20px 25px 40px 45px;

    line-height: 1.9;

    position: absolute;
    left: 30px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #c9b98a;
  }
  .highlight {
    background: #f5e98a;
    padding: 0 2px;
  }
  .divider {
    border: none;
    border-top: 1.5px solid #333;
    margin: 25px 0 25px -20px;
    width: 105%;
  }
  .brace-block {
    display: flex;
    align-items: center;
    margin: 4px 0 4px 10px;
  }
  .brace-symbol {
    font-size: 34px;
    margin-right: 6px;
    color: #2b2b3a;
    font-family: serif;
  }
  .brace-items {
    display: flex;
    flex-direction: column;
    line-height: 1.5;
  }
  .arrow-down {
    margin: 2px 0 2px 20px;
  }
  .numbered {
    margin: 6px 0 6px 15px;
  }
  .bullet-line {
    margin: 2px 0 2px 15px;
  }
  .section-title {
    margin: 4px 0;
  }
  .nucleus-block {
    position: relative;
    margin-left: 15px;
  }
  .nucleus-brace {
    display: flex;
    align-items: flex-start;
  }
  .nucleus-label {
    width: 70px;
    margin-top: 55px;
    font-weight: bold;
  }
  .nucleus-lines-svg {
    width: 40px;
    flex-shrink: 0;
  }
  .nucleus-items {
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-top: 10px;
  }
  .nucleus-items div {
    line-height: 1.4;
  }
  .sub-indent {
    margin-left: 25px;
  }
  .small-box {
    display: inline-block;

<body>
<div class="page">
  <div class="binding-line"></div>

  <div class="section-title"><span class="highlight">内质网</span> 到→ 高尔基体，</div>

  <div class="brace-block">
    <span>cell的生物膜系统</span>
    <span class="brace-symbol">←&#123;</span>
    <div class="brace-items">
      <span>cell膜</span>
      <span>cell器膜</span>
      <span>核膜</span>
    </div>
  </div>

  <div class="arrow-down">↓作用</div>

  <div class="numbered">① 使cell具有相对稳定的内部环境。</div>
  <div class="bullet-line">· 同时，在cell与外部环境进行物质迁移、能量转化、</div>
  <div class="bullet-line">化、信息传递时过程中起决定性作用。</div>
  <div class="numbered">② 内部膜面积增为为多酶提供依附着位点。</div>
  <div class="numbered">③ 外泌→保证了cell生命活动高效、有序的</div>
  <div class="numbered" style="margin-left:35px;">进行。</div>

  <hr class="divider">

  <div class="section-title"><span class="small-box"></span><span class="highlight">cell核</span>控制着cell的代谢和遗传</div>

  <div class="nucleus-block">
    <div class="nucleus-brace">
      <div class="nucleus-label">cell核</div>
      <svg class="nucleus-lines-svg" height="330" width="40">
        <line x1="30" y1="20" x2="0" y2="55" stroke="#2b2b3a" stroke-width="1.5"/>
        <line x1="30" y1="20" x2="0" y2="95" stroke="#2b2b3a" stroke-width="1.5"/>
        <line x1="30" y1="20" x2="0" y2="150" stroke="#2b2b3a" stroke-width="1.5"/>
        <line x1="30" y1="20" x2="0" y2="260" stroke="#2b2b3a" stroke-width="1.5"/>
      </svg>
      <div class="nucleus-items">
        <div>核膜：双层、外泌</div>
        <div>核仁：与某种RNA的合成以及核糖<br>体的形成有关</div>
        <div>染色质→由DNA和PRO组成<br><span class="sub-indent">↓遗传信息的载体</span></div>
      </div>
    </div>
  </div>

  <div style="margin-top:30px; margin-left:15px;">
    核孔：实现核质间频繁的物质交<br>
    <span class="small-box"></span>和信息交流
  </div>

</div>
