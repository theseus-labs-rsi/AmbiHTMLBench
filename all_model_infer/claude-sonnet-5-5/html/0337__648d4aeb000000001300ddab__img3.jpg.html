<body>
  <div class="page">
    <div class="header-row">
      <div class="title-box">3. 忽视你的需求，内耗你的精力</div>
      <div class="placeholder" title="[Icon: battery with lightning bolt, top-right]">
        <svg viewBox="0 0 48 60" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="8" width="36" height="44" rx="6" fill="none" stroke="#4c6b5a" stroke-width="3"/>
          <rect x="17" y="2" width="14" height="8" rx="2" fill="#4c6b5a"/>
          <polygon points="27,16 15,36 24,36 20,48 34,26 25,26" fill="#4c6b5a"/>
        </svg>
      </div>
    </div>

    <div class="content">
      <p><b>这一种人，不仅可能是身边的朋友，</b>亲密关系中也会出现。爱我们的人，也可能会“害”我们。</p>

      <p><b>忽视需求，是关系中隐藏的一把刀，</b>对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>

      <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>

      <p><b>经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</b></p>

      <div class="check-item">
        <span class="check-mark">✔</span>
        <span class="check-text">面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。</span>
      </div>

      <p>与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。</p>
    </div>
  </div>
