<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新媒体账号运营6种方法 - 做好竞品分析</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #e8d5bd;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 540px;
    min-height: 720px;
    background: #e8d5bd;
    position: relative;
    padding: 30px 30px 0 30px;
    display: flex;
    flex-direction: column;
  }

  .inner {
    background: #fbf6ee;
    border-radius: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 30px 34px 0 34px;
    position: relative;
    overflow: hidden;
  }

  .tag {
    display: inline-block;
    background: #2b2b2b;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 4px;
    position: absolute;
    top: 22px;
    left: 34px;
  }

  .title-block {
    margin-top: 70px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .title-num {
    font-size: 34px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 1px;
  }

  .title-text {
    font-size: 28px;
    font-weight: 800;
    color: #1a1a1a;
  }

  .divider {
    height: 1px;
    background: transparent;
  }

  .intro {
    margin-top: 34px;
    font-size: 15px;
    color: #333;
    line-height: 1.9;
  }

  .intro2 {
    margin-top: 26px;
    font-size: 15px;
    color: #333;
    line-height: 1.9;
  }

  .list {
    margin-top: 22px;
    font-size: 15px;
    color: #222;
    line-height: 1.9;
  }

  .list-item {
    margin-bottom: 4px;
  }

  .sub-item {
    padding-left: 22px;
    display: block;
  }

  .footer {
    margin-top: auto;
    background: #d9bfa2;
    text-align: center;
    padding: 16px 0;
    font-size: 14px;
    color: #4a3a2c;
    font-weight: 600;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    position: relative;
  }

  /* perforated / scalloped edge effect above footer */
  .scallop {
    position: relative;
    height: 20px;
    background: repeating-radial-gradient(circle at 10px 0px, transparent 0 8px, #fbf6ee 8px 20px);
    margin-top: 20px;
  }

  .footer-wrap {
    background: #d9bfa2;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="tag">新媒体账号运营6种方法</div>

      <div class="title-block">
        <span class="title-num">03</span>
        <span class="title-text">做好竞品分析</span>
      </div>

      <div class="intro">
        前期的竞品分析<br>
        一定要花大量的时间和精力去收集信息
      </div>

      <div class="intro2">
        仔细分析<br>
        可以从以下几个方面来看
      </div>

      <div class="list">
        <div class="list-item">1、账号人设标 签</div>
        <div class="list-item">2、账号选题规划</div>
        <div class="list-item">3、内容脚本拆解：</div>
        <div class="list-item sub-item">结构、矛盾点、金句、痒点</div>
        <div class="list-item">4、内容形式：</div>
        <div class="list-item sub-item">场景道具服装，拍摄剪辑节奏</div>
        <div class="list-item">5、运营策略：</div>
        <div class="list-item sub-item">发布时间和频率，封面，文案，线上互动</div>
        <div class="list-item sub-item">用户运营，引流途径</div>
      </div>

      <div class="scallop"></div>
    </div>
    <div class="footer-wrap">
      <div class="footer">@新媒体运营的十万个为什么</div>
    </div>
  </div>
</body>
</html>
