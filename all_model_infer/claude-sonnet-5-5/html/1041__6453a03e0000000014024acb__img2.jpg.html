<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用暗示的积极力量养出优秀孩子</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding: 20px 30px;
    color: #333;
  }

  .title-box {
    background-color: #cfe3f5;
    border-radius: 8px;
    padding: 14px 20px;
    margin-bottom: 22px;
    max-width: 700px;
  }

  .title-box h1 {
    font-size: 20px;
    font-weight: bold;
    margin: 0;
    color: #333;
  }

  .title-box .highlight {
    color: #2255aa;
    font-weight: bold;
  }

  .subheading {
    font-size: 15px;
    margin-bottom: 18px;
    color: #333;
  }

  .list-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .line {
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
  }

  .mark {
    display: inline-block;
    width: 20px;
    flex-shrink: 0;
    font-weight: bold;
  }

  .bad .mark {
    color: #e04b4b;
  }

  .good .mark {
    color: #4caf50;
  }

  .bad .text {
    color: #333;
  }

  .good .text {
    color: #2255aa;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="title-box">
    <h1>用<span class="highlight">暗示</span>的积极力量养出优秀孩子</h1>
  </div>

  <div class="subheading">
    学习上，让孩子体验一个个小成功
  </div>

  <div class="list-container">
    <div class="line bad"><span class="mark">✘</span><span class="text">你磨磴半天了，没写几个字，再磨下去就别睡了</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">越早完成作业，休息的时间就越多！</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">这么简单的题都不会做？</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">这道题你觉得难，不太会是吗？</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">赶紧写作业，一点都不自觉</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">你很少忘记写作业的，如果需要帮助就告诉我。</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">你这孩子怎么这么犟呢，你要听话</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">你可以说"不"，但我想听听你的理由理解你。</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">你怎么这么烦人呢，就不能安静一会儿吗？</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">你自己先去玩一会，妈妈忙完就马上找你。</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">勇敢点，这有什么的啊？</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">我相信你行的，再试试看，我陪着你</span></div>

    <div class="line bad"><span class="mark">✘</span><span class="text">快点走，再拖拖拉拉你就别出去了。</span></div>
    <div class="line good"><span class="mark">✓</span><span class="text">我们来比一比，看谁更快出门。</span></div>
  </div>

</body>
</html>
