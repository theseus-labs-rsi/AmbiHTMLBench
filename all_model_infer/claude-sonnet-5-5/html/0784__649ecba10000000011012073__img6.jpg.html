<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城 - 李白</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 540px;
    height: 719px;
    background-color: #4b4f7a;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    position: relative;
    overflow: hidden;
  }

  .page {
    width: 540px;
    height: 719px;
    position: relative;
  }

  .poem-area {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 30px;
    padding-top: 95px;
    padding-left: 20px;
    box-sizing: border-box;
    height: 570px;
  }

  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: #cfd3e8;
    letter-spacing: 8px;
    line-height: 1.15;
  }

  .title-col {
    font-size: 15px;
    color: #b9bdd8;
    margin-top: 5px;
    letter-spacing: 10px;
  }

  .mid-col {
    font-size: 26px;
    color: #d8dbee;
    font-weight: 500;
  }

  .big-col {
    font-size: 34px;
    color: #cfd3ea;
    font-weight: 600;
  }

  .footer-band {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background-color: #e7dcc0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0 30px;
  }

  .footer-text {
    color: #6b6650;
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="poem-area">
      <div class="col title-col">唐<br>李白<br>早发白帝城</div>
      <div class="col mid-col">轻舟已过万重山。</div>
      <div class="col mid-col">两岸猿声啼不住，</div>
      <div class="col big-col">千里江陵一日還</div>
      <div class="col big-col">朝辞白帝彩云間</div>
    </div>

    <div class="footer-band">
      <div class="footer-text">两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。</div>
    </div>
  </div>
</body>
</html>
