<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background-color: #fff;
  }
  .page {
    max-width: 560px;
    margin: 0 auto;
    background-image:
      linear-gradient(#e8eef5 1px, transparent 1px),
      linear-gradient(90deg, #e8eef5 1px, transparent 1px);
    background-size: 20px 20px;
    padding: 15px 15px 30px 15px;
    box-sizing: border-box;
  }
  .title {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    margin: 5px 0 20px 0;
    letter-spacing: 1px;
  }
  .title .blue {
    color: #1a3fd6;
  }
  .title .black {
    color: #111;
  }
  .content {
    display: flex;
    gap: 12px;
  }
  .left-col {
    flex: 0 0 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .right-col {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .node-box {
    background: #d6f0e0;
    border-radius: 6px;
    padding: 8px 24px;
    font-size: 22px;
    font-weight: bold;
    color: #111;
    text-align: center;
    margin-bottom: 4px;
  }
  .station {
    font-size: 20px;
    font-weight: bold;
    color: #111;
    text-align: center;
    margin: 4px 0;
  }
  .arrow-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px 0;
    position: relative;
  }
  .arrow-label {
    background: #f9d6de;
    color: #111;
    font-size: 15px;
    font-weight: bold;
    padding: 4px 6px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .arrow-only {
    display: flex;
    justify-content: center;
    margin: 2px 0;
  }
  .yellow-arrow {
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 16px solid #f5c518;
    position: relative;
  }
  .yellow-arrow::before {
    content: "";
    position: absolute;
    top: -22px;
    left: -6px;
    width: 12px;
    height: 20px;
    background: #f5c518;
  }
  .small-yellow-arrow {
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 11px solid #f5c518;
    position: relative;
  }
  .small-yellow-arrow::before {
    content: "";
    position: absolute;
    top: -16px;
    left: -4px;
    width: 8px;
    height: 14px;
    background: #f5c518;
  }
  .info-box {
    border: 2px solid #7a1f2b;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14.5px;
    line-height: 1.6;
    color: #111;
    box-sizing: border-box;
  }
  .info-box .label {
    color: #1a3fd6;
    font-weight: bold;
    text-decoration: underline;
  }
  .spacer-small {
    height: 8px;
  }
  .spacer-mid {
    height: 30px;
  }
  .spacer-big {
    height: 48px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title">
    <span class="blue">第三天</span><span class="black">路线规划</span>
  </div>

  <div class="content">
    <!-- LEFT COLUMN: flow chart -->
    <div class="left-col">
      <div class="node-box">第三天</div>
      <div class="arrow-only"><div class="yellow-arrow"></div></div>
      <div class="station">磁器口</div>

      <div class="arrow-row">
        <span class="arrow-label">1号线<span class="small-yellow-arrow"></span>30分钟</span>
      </div>
      <div class="station">罗中立美术馆</div>

      <div class="arrow-row">
        <span class="arrow-label">1号线<span class="small-yellow-arrow"></span>80分钟</span>
      </div>
      <div class="station">山城步道</div>

      <div class="arrow-row">
        <span class="arrow-label">公交<span class="small-yellow-arrow"></span>32分钟</span>
      </div>
      <div class="station">观音桥</div>

      <div class="arrow-row">
        <span class="arrow-label">步行<span class="small-yellow-arrow"></span>15分钟</span>
      </div>
      <div class="station">九街</div>
    </div>

    <!-- RIGHT COLUMN: info boxes -->
    <div class="right-col">
      <div class="spacer-mid"></div>
      <div class="info-box">
        <span class="label">磁器口（免费）：</span>汇聚美食、重庆特色伴手礼，始建于宋代"一江两洗三山四巷"独特地貌
      </div>

      <div class="spacer-small"></div>
      <div class="info-box">
        <span class="label">罗中立美术馆（免费）：</span>拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
      </div>

      <div class="spacer-mid"></div>
      <div class="info-box">
        <span class="label">山城步道（免费）：</span>建在悬崖边的临江步道，汇聚老重庆特色步道
      </div>

      <div class="spacer-mid"></div>
      <div class="info-box">
        <span class="label">观音桥（免费）：</span>超大商圈，还有很多地道重庆小吃
      </div>

      <div class="spacer-mid"></div>
      <div class="info-box">
        <span class="label">九街（免费）：</span>酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
      </div>
    </div>
  </div>
</div>
</body>
</html>
