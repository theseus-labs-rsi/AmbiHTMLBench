  <h1 class="title">易被忽视的养生小动作</h1>

  <p class="para">
    <span class="indent-start">&nbsp;&nbsp;</span><span class="bold-label">梳头</span>&nbsp;&nbsp;梳头是脑部运
    动最理想的项目，它可以刺
    激穴位，&nbsp;增强分泌活动,改
    善血液循环，&nbsp;促进新陈代
    谢。此外，梳头还是治疗失
    眠、眩晕、心悸、中风后遗症
    和青少年白发的辅助手段。
    平时每天可梳头3至5次，每
    次不少于3至5分钟，其中晚
    上睡前必须要梳一次。
  </p>

  <p class="para">
    <span class="indent-start">&nbsp;&nbsp;</span><span class="bold-label">伸懒腰</span>&nbsp;&nbsp;伸懒腰会使
    人体的脏器对心、肺产生
    挤压。持续几秒钟的伸懒
    腰，&nbsp;使很多淤积的血液被
    赶回心脏,改善血液循环，
    使更多的含氧量的血液供
    给大脑，还可带走肌肉的
    一些废物，从而消除人体
    的疲劳。
  </p>
