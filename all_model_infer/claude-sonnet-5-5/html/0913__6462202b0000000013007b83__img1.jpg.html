<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    background: #eee;
  }
  .page {
    width: 550px;
    min-height: 733px;
    background: linear-gradient(180deg, #dceefb 0%, #4a9fe8 20%, #2f7fd6 60%, #1f5fb0 100%);
    box-sizing: border-box;
    padding: 30px 26px 40px 26px;
    position: relative;
    overflow: hidden;
  }

  .title-box {
    display: inline-block;
    background: #ffffff;
    border-radius: 22px;
    padding: 10px 22px;
    margin-bottom: 22px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }
  .title-box h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 1px;
  }

  .title-box2 {
    display: inline-block;
    background: #ffffff;
    border-radius: 22px;
    padding: 10px 22px;
    margin: 18px 0 20px 0;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }
  .title-box2 h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 1px;
  }

  .intro-text {
    color: #ffffff;
    font-size: 15px;
    line-height: 1.9;

    color: #ffffff;
    font-size: 14.5px;
    line-height: 1.85;

  .highlight {
    color: #f2c94c;
    font-weight: bold;
  }

  .illustrations {
    position: relative;
    margin-top: 20px;
    height: 150px;
  }

  .placeholder {
    position: absolute;
    box-sizing: border-box;
  }

  .radial-diagram {
    left: 0;
    bottom: 0;
    width: 190px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    text-align: center;
    border: 1px dashed rgba(255,255,255,0.3);
  }

  .bar-chart {
    right: 10px;
    bottom: 0;
    width: 220px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.6);

<div class="page">

  <div class="title-box">
    <h1>报名和考试</h1>
  </div>

  <p class="intro-text">
    个人参赛，由所在中学进行统一报名；<br>
    均为笔试考试，预赛为各省市自行组织、自主命题；<br>
    剩余考试环节均为全国统一命题。
  </p>

  <div class="title-box2">
    <h2>可以自学吗？</h2>
  </div>

  <p class="body-text">
    1、<span class="highlight">高中课本内容可以自学</span>，当然我们也有初高中基础知识课程，让你快速掌握竞赛考点。
  </p>

  <p class="body-text">
    2、一些难的知识点和不知道如何规划学习进度的时候，最好选择报课，大部分学生在有人一起学的情况下会比较好。<br>
    有时候你以为自己自学的挺好，但是很多竞赛技巧、思维是需要老师来指导的。时间和钱，不能兼得。
  </p>

  <div class="illustrations">

    <div class="placeholder bar-chart">[Chart: 手绘柱状图, 右下]</div>
  </div>
