<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰州旅行文案</title>
<script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px 30px;
    color: #222;
  }
  .page {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 30px;
    row-gap: 25px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pin-title {
    color: #d9302f;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-bottom: 4px;
  }
  .pin {
    font-size: 12px;
  }
  .quote {
    font-size: 11px;
    color: #333;
    margin-bottom: 8px;
    text-align: center;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    width: 100%;
  }
  .photo {
    width: 100%;
    padding-top: 100%;
    position: relative;
    background-size: cover;
    background-position: center;
    font-size: 8px;
    color: rgba(255,255,255,0.85);
  }
  .photo span {
    position: absolute;
    bottom: 2px;
    left: 2px;
    right: 2px;
    text-align: center;
    line-height: 1.1;
  }
  .center-cell {
    justify-content: center;
    align-items: center;
    text-align: center;
    border-top: 1px solid #ddd;
    border-bottom: 1px solid #7bc47f;
    padding: 40px 10px;
  }
  .center-text {
    color: #d9302f;
    font-size: 26px;
    font-weight: bold;
    line-height: 1.5;
    letter-spacing: 2px;
  }

  /* color placeholders for photos to mimic photo tones */
  .c1 { background-color: #1b2a4a; }
  .c2 { background-color: #2b3a5a; }
  .c3 { background-color: #3d5a80; }
  .c4 { background-color: #98c1d9; }
  .c5 { background-color: #293241; }
  .c6 { background-color: #ee6c4d; }
  .c7 { background-color: #e0a458; }
  .c8 { background-color: #8d99ae; }
  .c9 { background-color: #2f3e46; }
  .c10 { background-color: #52796f; }
  .c11 { background-color: #84a98c; }
  .c12 { background-color: #354f52; }
  .c13 { background-color: #6b4226; }
  .c14 { background-color: #a44a3f; }
  .c15 { background-color: #d68c45; }
  .c16 { background-color: #c96f3f; }
  .c17 { background-color: #8a5a44; }
  .c18 { background-color: #4a2c2a; }
</style>
</head>
<body>
<div class="page">

  <!-- Row 1 -->
  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>金城兰州</div>
    <div class="quote">"消不完的黄河水向东流"</div>
    <div class="photo-grid">
      <div class="photo c1"></div><div class="photo c2"></div><div class="photo c3"></div>
      <div class="photo c1"></div><div class="photo c4"></div><div class="photo c2"></div>
      <div class="photo c5"></div><div class="photo c1"></div><div class="photo c6"></div>
      <div class="photo c2"></div><div class="photo c1"></div><div class="photo c3"></div>
    </div>
  </div>

  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>中山桥</div>
    <div class="quote">"陌生的人 请给我一支兰州"</div>
    <div class="photo-grid">
      <div class="photo c4" style="grid-column: span 2;"><span>[Photo: 桥梁远景]</span></div><div class="photo c8"></div>
      <div class="photo c9"></div><div class="photo c4"></div><div class="photo c8"></div>
      <div class="photo c4"></div><div class="photo c3"></div><div class="photo c4"></div>
    </div>
  </div>

  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>兰州美食</div>
    <div class="quote">"四方食事 不过一碗人间烟火"</div>
    <div class="photo-grid" style="grid-template-columns: repeat(2, 1fr);">
      <div class="photo c14"><span>[面食照]</span></div><div class="photo c8"></div>
      <div class="photo c17"></div><div class="photo c7"></div>
      <div class="photo c9"></div><div class="photo c16"></div>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>骆驼巷</div>
    <div class="quote">"繁华城市背后的另一面"</div>
    <div class="photo-grid">
      <div class="photo c13"></div><div class="photo c11"></div><div class="photo c8"></div>
      <div class="photo c6" style="grid-row: span 2;"><span>[人像照]</span></div><div class="photo c11"></div><div class="photo c8"></div>
      <div class="photo c17"></div><div class="photo c11"></div>
    </div>
  </div>

  <div class="cell center-cell">
    <div class="center-text">兰州<br>旅行<br>文案</div>
  </div>

  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>甘肃省博物馆</div>
    <div class="quote">"守河西通瞧 传丝路文明"</div>
    <div class="photo-grid">
      <div class="photo c8"></div><div class="photo c9"></div><div class="photo c9"></div>
      <div class="photo c7"></div><div class="photo c9"></div><div class="photo c9"></div>
      <div class="photo c13"></div><div class="photo c8"></div><div class="photo c9"></div>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>白塔山公园</div>
    <div class="quote">"行走在西北 看尽黄河水"</div>
    <div class="photo-grid">
      <div class="photo c10"></div><div class="photo c9"></div><div class="photo c9"></div>
      <div class="photo c6" style="grid-row: span 2;"><span>[塔景照]</span></div><div class="photo c9"></div><div class="photo c9"></div>
      <div class="photo c9"></div><div class="photo c8"></div>
    </div>
  </div>

  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>兰山公园</div>
    <div class="quote">"白天阿富汗 晚上曼哈顿"</div>
    <div class="photo-grid" style="grid-template-columns: repeat(2, 1fr);">
      <div class="photo c1"></div><div class="photo c2"></div>
      <div class="photo c1"></div><div class="photo c2"></div>
      <div class="photo c1"><span>[夜景照]</span></div><div class="photo c2"></div>
    </div>
  </div>

  <div class="cell">
    <div class="pin-title"><span class="pin">📍</span>正宁路小吃街</div>
    <div class="quote">"人间烟火气 最抚凡人心"</div>
    <div class="photo-grid">
      <div class="photo c6"></div><div class="photo c14"></div><div class="photo c9"></div>
      <div class="photo c16"></div><div class="photo c14"></div><div class="photo c9"></div>
      <div class="photo c16"></div><div class="photo c17" style="grid-column: span 2;"><span>[摊贩照]</span></div>
    </div>
  </div>

</div>
</body>
</html>
