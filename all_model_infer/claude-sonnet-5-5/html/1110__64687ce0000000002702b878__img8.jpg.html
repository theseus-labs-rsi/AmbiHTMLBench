<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营48个必备工具</title>
<script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #eee;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 540px;
    height: 720px;
    background: #2f4f43;
    position: relative;
    padding: 40px 38px 30px 38px;
    color: #ffffff;
  }
  .title {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 34px;
    font-weight: bold;
    line-height: 1.35;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }
  .subtitle-bar {
    display: inline-block;
    background: #d9a020;
    color: #ffffff;
    font-size: 14px;
    font-family: "Consolas", monospace;
    padding: 6px 14px;
    margin-bottom: 22px;
    font-weight: bold;
  }
  .grid {
    display: grid;
    grid-template-columns: 113px 113px 133px 113px;
    gap: 8px;
    height: 400px;
  }
  .cell {
    background: #6f8f74;
    border-radius: 2px;
    padding: 12px 10px;
  }
  .cell .part-label {
    font-family: "Consolas", monospace;
    font-size: 13px;
    color: #dfe8df;
    margin-bottom: 10px;
  }
  .cell .part-text {
    font-size: 15px;
    line-height: 1.4;
    font-weight: 500;
  }

  /* Column 1 */
  .col1-part01 {
    grid-column: 1;
    grid-row: 1 / 4;
  }
  .col1-part04 {
    grid-column: 1;
    grid-row: 4 / 6;
  }

  /* Column 2 */
  .col2-part02 {
    grid-column: 2;
    grid-row: 1 / 3;
  }
  .col2-part03 {
    grid-column: 2;
    grid-row: 3 / 6;
  }

  /* Column 3 (wide) */
  .col3-part05 {
    grid-column: 3;
    grid-row: 1 / 3;
  }
  .col3-part06 {
    grid-column: 3;
    grid-row: 3 / 6;
  }

  /* Column 4 */
  .col4-part07 {
    grid-column: 4;
    grid-row: 1 / 3;
  }
  .col4-part08 {
    grid-column: 4;
    grid-row: 3 / 6;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title">TikTok运营<br>48个必备工具</div>
  <div class="subtitle-bar">@ 徐徐教你做TikTok</div>

  <div class="grid">
    <div class="cell col1-part01">
      <div class="part-label">Part 01</div>
      <div class="part-text">7个TK<br>数据平台</div>
    </div>
    <div class="cell col1-part04">
      <div class="part-label">Part 04</div>
      <div class="part-text">6个TK数据分析网站</div>
    </div>

    <div class="cell col2-part02">
      <div class="part-label">Part 02</div>
      <div class="part-text">3个好用<br>选品网站</div>
    </div>
    <div class="cell col2-part03">
      <div class="part-label">Part 03</div>
      <div class="part-text">5个视频<br>素材网站</div>
    </div>

    <div class="cell col3-part05">
      <div class="part-label">Part 05</div>
      <div class="part-text">4个剪辑<br>4个翻译软件</div>
    </div>
    <div class="cell col3-part06">
      <div class="part-label">Part 06</div>
      <div class="part-text">8个TK<br>传输管理<br>网站</div>
    </div>

    <div class="cell col4-part07">
      <div class="part-label">Part 07</div>
      <div class="part-text">5个BGM<br>网站</div>
    </div>
    <div class="cell col4-part08">
      <div class="part-label">Part 08</div>
      <div class="part-text">7个投放<br>联盟网站</div>
    </div>
  </div>
</div>
</body>
</html>
