<!DOCTYPE html>
<html lang="zh-CN">

<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #eaf3fb;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;

  .page {
    position: relative;
    width: 560px;
    min-height: 720px;
    margin: 0 auto;
    background-image:

    background-size: 20px 20px;
    background-color: #eaf3fb;
    padding: 15px 15px 30px 45px;
    box-sizing: border-box;
  }
  .dots {
    position: absolute;
    left: 12px;
    top: 15px;
    display: flex;
    flex-direction: column;
    gap: 39px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #9fc3e6;
  }
  .title {
    color: #2e75b6;
    font-size: 22px;
    font-weight: bold;
    margin: 5px 0 15px 0;
  }
  .content-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .text-block {
    color: #e03c31;
    font-size: 19px;
    line-height: 1.55;
    font-weight: 500;
    flex: 1;
    padding-right: 10px;
  }
  .note {
    background-color: #fdf3b2;
    box-shadow: 2px 3px 6px rgba(0,0,0,0.25);
    width: 150px;
    min-height: 130px;
    padding: 12px 10px;
    margin-top: 45px;
    margin-right: 5px;
    color: #1a1a1a;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.8;
    flex-shrink: 0;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 25px;
    font-size: 16px;
    color: #333;
  }
  thead th {
    background-color: #93b183;
    color: #fff;
    font-weight: bold;
    padding: 8px 5px;
    text-align: center;
    border: 1px solid #ffffff;
  }
  tbody td {
    padding: 8px 5px;
    text-align: center;
    border: 1px solid #ffffff;
  }
  tbody tr:nth-child(odd) {
    background-color: #dbe6cf;
  }
  tbody tr:nth-child(even) {
    background-color: #eef3e8;
  }
  .row-label {
    color: #4a6b3d;
    font-weight: bold;
  }
  .data-num {
    color: #2e75b6;
    font-weight: bold;
  }
