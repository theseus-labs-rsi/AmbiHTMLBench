<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十一月-任务(必做:支付管理费+拨款)</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
    color: #000;
  }
  h1 {
    font-size: 22px;
    font-weight: bold;
    margin: 0 0 15px 5px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #999;
    padding: 8px 6px;
    text-align: center;
    font-size: 13px;
    word-wrap: break-word;
  }
  th {
    background-color: #f2f2f2;
    font-weight: bold;
  }
  col.col-no { width: 6%; }
  col.col-desc { width: 22%; }
  col.col-pos { width: 12%; }
  col.col-action { width: 26%; }
  col.col-time { width: 14%; }
  col.col-note { width: 20%; }
</style>
</head>
<body>
  <h1>十一月-任务(必做:支付管理费+拨款)</h1>
  <table>
    <colgroup>
      <col class="col-no">
      <col class="col-desc">
      <col class="col-pos">
      <col class="col-action">
      <col class="col-time">
      <col class="col-note">
    </colgroup>
    <thead>
      <tr>
        <th>序号</th>
        <th>任务描述</th>
        <th>岗位</th>
        <th>操作动作</th>

    <tbody>
      <tr>
        <td>1</td>
        <td>柔性线推进</td>
        <td>生产</td>
        <td>申请200w推进</td>
        <td>11月1日</td>
        <td>柔性线推进</td>
      </tr>
      <tr>
        <td>2</td>
        <td>订购原材料</td>
        <td>采购</td>
        <td>4份P3+4份P5</td>
        <td>11月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>3</td>
        <td>九月订购的原料入库</td>
        <td>采购</td>
        <td>申请资金入库</td>
        <td>11月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>4</td>
        <td>申请贷款</td>
        <td>财务</td>
        <td>没钱就申请,有钱就不申请</td>
        <td>11月1日</td>
        <td>申请四季短贷</td>
      </tr>
      <tr>
        <td>5</td>
        <td>生产线预配</td>
        <td>生产</td>
        <td>全线开产</td>
        <td>11月1日</td>
        <td>收下9月的产品</td>
      </tr>
      <tr>
        <td>6</td>
        <td>交货</td>
        <td>销售</td>
        <td>交第三个订单</td>
        <td>11月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>7</td>
        <td>应收账款</td>
        <td>财务</td>
        <td>收钱</td>
        <td>11月</td>
        <td>尽量不贴现</td>
      </tr>
    </tbody>
  </table>
