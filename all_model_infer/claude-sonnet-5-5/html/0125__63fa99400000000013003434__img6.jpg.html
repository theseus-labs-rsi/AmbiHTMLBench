<head>

<title>人民日报 - 心态主题金句摘抄</title>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #ffffff;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 20px 18px 20px;
    background: #ffffff;
    border-bottom: 3px solid #b7301f;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
  }
  .logo-main {
    font-size: 40px;
    font-weight: 900;
    color: #b7301f;
    letter-spacing: 2px;
    font-family: "STXingkai", "KaiTi", "SimHei", sans-serif;
    line-height: 1;
  }
  .logo-sub {
    font-size: 12px;
    color: #b7301f;
    letter-spacing: 4px;
    margin-top: 6px;
  }
  .header-right {
    text-align: right;
  }
  .tag-line {
    display: inline-block;
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
    background: #1a1a1a;
    padding: 4px 10px;
    letter-spacing: 2px;
  }
  .topic-line {
    font-size: 23px;
    font-weight: 900;
    color: #1a1a1a;
    margin-top: 10px;
    letter-spacing: 1px;
  }
  .content {
    background: #cdc0a9;
    padding: 30px 22px 40px 22px;
  }
  .quote {
    font-size: 25px;
    font-weight: 900;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.5;
    margin: 0 0 18px 0;
  }
  .label {
    font-size: 14px;
    color: #1a1a1a;
    margin: 4px 0 10px 0;
    font-weight: normal;
  }
  .body-text {
    font-size: 14.5px;
    color: #1a1a1a;
    line-height: 2;
    text-align: justify;
    margin: 0 0 26px 0;
  }
  .quote2 {
    margin-top: 4px;
  }

<body>
<div class="page">

  <div class="header">
    <div class="logo-block">
      <div class="logo-main">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="tag-line">金句｜摘抄</div>
      <div class="topic-line">心态主题</div>
    </div>
  </div>

  <div class="content">

    <div class="quote">
      且行且忘且随风，<br>
      且行且看且从容。
    </div>
    <div class="label">释义：</div>
    <div class="body-text">
      意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有-一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
    </div>

    <div class="quote quote2">
      我将玫瑰藏于身后风起花落，<br>
      从此鲜花赠自己，<br>
      纵马踏花向自由。
    </div>
    <div class="label">释义：</div>
    <div class="body-text">
      我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
    </div>

  </div>

</div>
