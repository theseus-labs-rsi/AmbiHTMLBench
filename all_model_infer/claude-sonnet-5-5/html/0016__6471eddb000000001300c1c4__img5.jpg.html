<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缓解痛经 - 医疗科普</title>
<script>
window.MathJax = {tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: #f5f5f7;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 550px;
    min-height: 720px;
    background: #ffffff;
    position: relative;
    padding-bottom: 30px;
  }
  /* status bar */
  .status-bar {
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 15px;
    font-size: 13px;
    color: #000;
  }
  .status-bar .icons {
    margin-left: 8px;
  }
  .close-btn {
    padding: 10px 20px 20px 20px;
    font-size: 22px;
    color: #333;
  }
  .content {
    padding: 0 22px;
  }

  /* Section 5 heading */
  .section-heading {
    display: flex;
    align-items: center;
    margin-top: 10px;
    margin-bottom: 14px;
  }
  .num-badge {
    background: #f3a6a6;
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    margin-right: 10px;
    flex-shrink: 0;
  }
  .section-heading .title {
    color: #e07a7a;
    font-size: 17px;
    font-weight: bold;
  }

  .para {
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    margin: 0 0 26px 0;
    text-align: justify;
  }

  /* Section 2 centered heading with big number */
  .big-heading {
    display: flex;
    justify-content: center;
    align-items: baseline;
    margin: 20px 0 30px 0;
    position: relative;
  }
  .big-heading .big-num {
    font-size: 46px;
    font-weight: bold;
    color: #7b6fd1;
    line-height: 1;
    position: relative;
  }
  .big-heading .dot {
    position: absolute;
    right: -4px;
    bottom: 8px;
    width: 6px;
    height: 6px;
    background: #7b6fd1;
    border-radius: 50%;
  }
  .big-heading .big-title {
    font-size: 20px;
    font-weight: bold;
    color: #7b6fd1;
    margin-left: 6px;
  }
  .big-heading::before,
  .big-heading::after {
    content: "";
    display: none;
  }

  /* common plan banner */
  .plan-banner {
    display: inline-flex;
    align-items: center;
    background: #7b6fd1;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 14px 6px 16px;
    border-radius: 4px 14px 14px 4px;
    margin-bottom: 18px;
  }
  .plan-banner .arrow {
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
  }

  .list-item {
    font-size: 15px;
    line-height: 1.8;
    color: #333;
    margin-bottom: 22px;
    text-align: justify;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span>19:43</span>
  </div>

  <div class="close-btn">&#10005;</div>

  <div class="content">

    <div class="section-heading">
      <div class="num-badge">5</div>
      <div class="title">月经来潮需停药</div>
    </div>

    <p class="para">药物推迟月经可能会失败，服药过程中如月经来潮需停药。</p>

    <div class="big-heading">
      <span class="big-num">2<span class="dot"></span></span>
      <span class="big-title">缓解痛经</span>
    </div>

    <p class="para">如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。</p>

    <div class="plan-banner">
      常用方案
      <span class="arrow">&#9656;</span>
    </div>

    <p class="para">痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。</p>

    <p class="para">以下三种方法，选其中一种方法即可：</p>

    <p class="list-item">1.布洛芬 首剂 800 mg，之后根据需要 400～800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。</p>

    <p class="list-item">2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。</p>

  </div>

</div>
</body>
</html>
