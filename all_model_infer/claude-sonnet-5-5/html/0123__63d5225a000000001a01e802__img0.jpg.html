<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    background-color: #f2ecd8;
    margin: 0;
    padding: 0;
    font-family: "Kaiti", "STKaiti", "KaiTi", cursive, sans-serif;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 700px;
    margin: 0 auto;
    background-color: #f2ecd8;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 34px,
      #d8cdb0 35px
    );
    padding-top: 10px;
    box-sizing: border-box;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 8px 15px 0 15px;
  }
  .day-tabs {
    display: flex;
    border: 1px solid #333;
    font-size: 11px;
    color: #333;
  }
  .day-tabs span {
    padding: 2px 5px;
    border-right: 1px solid #333;
  }
  .day-tabs span:last-child {
    border-right: none;
  }
  .date-label {
    font-size: 13px;
    color: #333;
    letter-spacing: 2px;
    font-family: sans-serif;
  }
  .content {
    margin-top: 40px;
    padding: 0 25px;
  }
  .title {
    font-size: 26px;
    color: #2b2b2b;
    margin-top: 10px;
    margin-bottom: 45px;
    font-weight: bold;
  }
  .line {
    font-size: 22px;
    color: #1f1f1f;
    line-height: 35px;
    margin: 0;
    white-space: nowrap;
  }
  .gap {
    height: 35px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div class="day-tabs">
      <span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
    </div>
    <div class="date-label">Date.&nbsp;&nbsp;/&nbsp;&nbsp;/</div>
  </div>
  <div class="content">
    <div class="title">这是好的开始</div>
    <div class="gap"></div>
    <p class="line">从你看到这篇文章开始，</p>
    <p class="line">你会越来越有钱</p>
    <p class="line">越来越好看。</p>
    <p class="line">生活和心态，也会越来越好。</p>
    <p class="line">请相信大数据。</p>
    <p class="line">是你自己把一切美好的东西。</p>
    <p class="line">都吸引了过来</p>
    <p class="line">你已经调到了接收钱的频率</p>
    <p class="line">接收美的频率。</p>
    <p class="line">你的能量频率对了才接收到这</p>
    <p class="line">条信息。</p>
    <p class="line">留下一句"全收到"，</p>
    <p class="line">愿所有的愿望全能实现！</p>
  </div>
</div>
</body>
</html>
