<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天记录</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e8e8e8;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .chat-container {
    max-width: 540px;
    margin: 0 auto;
    background-color: #e8e8e8;
    padding: 15px 12px;
    box-sizing: border-box;
  }
  .msg-row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .msg-row.right {
    justify-content: flex-end;
  }
  .avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 4px;
    background-color: #6b8caf;
    background-image: linear-gradient(135deg, #7a9bc4 0%, #3f5f80 100%);
    margin-right: 10px;
  }
  .avatar.right-avatar {
    margin-right: 0;
    margin-left: 10px;
    background-image: none;
    background-color: #d9b48f;
  }
  .bubble {
    background-color: #ffffff;
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.6;
    color: #333;
    max-width: 420px;
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.03);
  }
  .bubble.green {
    background-color: #a5e55a;
    color: #222;
  }
  .num-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    background-color: #6ec6f0;
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    margin-right: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .bubble-text {
    display: inline;
  }
  .bubble-with-num {
    display: flex;
    align-items: flex-start;
  }
  .placeholder {
    width: 40px;
    height: 40px;
    background-color: #ccc;
    border: 1px dashed #999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    color: #666;
    text-align: center;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="chat-container">

  <!-- Message 6 -->
  <div class="msg-row">
    <div class="avatar" title="[Photo: avatar, scenery]"></div>
    <div class="bubble">
      <div class="bubble-with-num">
        <span class="num-circle">6</span>
        <span class="bubble-text">这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。</span>
      </div>
    </div>
  </div>

  <!-- Message 7 -->
  <div class="msg-row">
    <div class="avatar" title="[Photo: avatar, scenery]"></div>
    <div class="bubble">
      <div class="bubble-with-num">
        <span class="num-circle">7</span>
        <span class="bubble-text">最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰</span>
      </div>
    </div>
  </div>

  <!-- Message 8 -->
  <div class="msg-row">
    <div class="avatar" title="[Photo: avatar, scenery]"></div>
    <div class="bubble">
      <div class="bubble-with-num">
        <span class="num-circle">8</span>
        <span class="bubble-text">尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,onthecontrary,in contrast这类连接词。</span>
      </div>
    </div>
  </div>

  <!-- Message: 你重新写吧 -->
  <div class="msg-row">
    <div class="avatar" title="[Photo: avatar, scenery]"></div>
    <div class="bubble">
      <span class="bubble-text">你重新写吧</span>
    </div>
  </div>

  <!-- Message: 好的，谢谢老师 (sent) -->
  <div class="msg-row right">
    <div class="bubble green">
      <span class="bubble-text">好的，谢谢老师</span>
    </div>
    <div class="avatar right-avatar placeholder" title="[Photo: avatar, person]">[Avatar]</div>
  </div>

</div>
</body>
</html>
