<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我介绍 - SELF INTRODUCTION</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #eee;
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .slide {
    position: relative;
    width: 960px;
    height: 540px;
    background: linear-gradient(135deg, #cdeee0 0%, #cfe9f0 30%, #f5eec9 70%, #cdeee0 100%);
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  /* decorative watercolor blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    filter: blur(2px);
  }
  .blob1 { width: 260px; height: 260px; top: -80px; left: -60px; background: #a8d8c9; }
  .blob2 { width: 220px; height: 220px; top: -60px; right: -40px; background: #f6e29a; }
  .blob3 { width: 200px; height: 200px; bottom: -70px; left: -50px; background: #f6d9c9; }
  .blob4 { width: 240px; height: 240px; bottom: -90px; right: -60px; background: #a9d3e6; }

  /* Title bubble */
  .title-wrap {
    position: relative;
    text-align: center;
    padding-top: 28px;
    z-index: 5;
  }
  .title-bubble {
    position: relative;
    display: inline-block;
    background: #f2c744;
    color: #fff;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 8px;
    padding: 10px 40px;
    border-radius: 30px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
  }
  .title-dots {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 60px;
    border: 2px dashed #f2c744;
    border-radius: 50%;
    z-index: -1;
  }
  .subtitle {
    margin-top: 10px;
    color: #4a4a4a;
    font-size: 16px;
    letter-spacing: 6px;
    font-style: italic;
  }

  /* Content rounded box */
  .content-box {
    position: absolute;
    top: 118px;
    left: 60px;
    width: 840px;
    height: 210px;
    background: rgba(255,255,255,0.55);
    border-radius: 30px;
    display: flex;
    padding: 20px 30px;
  }

  .left-info {
    width: 30%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    color: #333;
    font-size: 15px;
  }
  .left-info .label {
    display: inline-block;
  }
  .left-info .dot {
    color: #f2c744;
    font-weight: bold;
    margin-right: 4px;
  }

  /* Speech bubble (yellow blob) with goals text */
  .goal-bubble {
    position: relative;
    width: 46%;
    margin-left: 2%;
    background: #f2c744;
    color: #fff;
    border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
    padding: 18px 22px;
    font-size: 12.5px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .goal-bubble .goal-title {
    font-weight: bold;
    margin-bottom: 6px;
  }
  .goal-bubble::after {
    content: "";
    position: absolute;
    right: -8px;
    bottom: 30px;
    width: 0;
    height: 0;
    border-left: 14px solid #f2c744;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
  }

  /* Photo placeholder */
  .photo-placeholder {
    width: 20%;
    margin-left: 2%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .placeholder {
    width: 120px;
    height: 150px;
    border-radius: 12px;
    background: repeating-linear-gradient(45deg, #ddd, #ddd 10px, #eee 10px, #eee 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #888;
    font-size: 11px;
    padding: 6px;
    border: 1px solid #ccc;
  }

  /* Paragraph text below */
  .paragraph {
    position: absolute;
    top: 345px;
    left: 60px;
    width: 840px;
    height: 165px;
    color: #333;
    font-size: 13.5px;
    line-height: 1.9;
    text-indent: 2em;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>

  <div class="title-wrap">
    <div class="title-bubble">
      <div class="title-dots"></div>
      自我介绍
    </div>
    <div class="subtitle">SELF INTRODUCTION</div>
  </div>

  <div class="content-box">
    <div class="left-info">
      <div><span class="dot">■</span><span class="label">姓名：咸鱼</span></div>
      <div><span class="dot">■</span><span class="label">年龄：20</span></div>
      <div><span class="dot">■</span><span class="label">爱好：看电影、打游戏</span></div>
    </div>

    <div class="goal-bubble">
      <div class="goal-title">工作目标：</div>
      <div>1.学习好专业知识，同时广泛涉及其他专业知识。</div>
      <div>2.尽量多争取一些等级证书，这不仅是能力的证明，也是就业的有力武器。</div>
    </div>

    <div class="photo-placeholder">
      <div class="placeholder">[Photo: 人物照片，戴眼镜女性]</div>
    </div>
  </div>

  <div class="paragraph">
    大家好，我叫咸鱼，来自山东青岛。<br>
    本人性格沉稳、细致、观带，发挥所长。在工作上，细致入微，认真负责，具有很好的团队合作精神，注重团体的利益、集体意识强，能够与人充分合作，充分听取他人的意见和建议，并不断进步。观察力强、上进心强而且为人踏和、易于沟通、能够快速地融入工作群团队及成员给出良好的意见。
  </div>
</div>
</body>
</html>
