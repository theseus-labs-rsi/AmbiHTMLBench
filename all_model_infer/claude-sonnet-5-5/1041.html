<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用暗示的积极力量养出优秀孩子</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 560px;
    margin: 0 auto;
    padding: 20px 25px;
    box-sizing: border-box;
  }
  .title-box {
    background-color: #dbe4f3;
    border: 1.5px solid #4a6fb5;
    border-radius: 6px;
    padding: 10px 15px;
    margin-bottom: 20px;
  }
  .title-box h1 {
    font-size: 19px;
    color: #333333;
    margin: 0;
    font-weight: bold;
  }
  .title-box .highlight {
    color: #e06000;
    font-weight: bold;
  }
  .subtitle {
    font-size: 15px;
    color: #333333;
    margin-bottom: 15px;
    margin-left: 5px;
  }
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .item {
    display: flex;
    align-items: baseline;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .icon {
    display: inline-block;
    width: 20px;
    flex-shrink: 0;
    font-weight: bold;
  }
  .bad .icon {
    color: #e03c3c;
  }
  .bad .text {
    color: #333333;
  }
  .good .icon {
    color: #2e8b57;
  }
  .good .text {
    color: #4169b5;
    font-weight: bold;
  }
  .text {
    flex: 1;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-box">
    <h1>用<span class="highlight">暗示</span>的积极力量养出优秀孩子</h1>
  </div>

  <div class="subtitle">学习上，让孩子体验一个个小成功</div>

  <div class="item-list">

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">你磨蹭半天了，没写几个字，再磨下去就别睡了</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">越早完成作业，休息的时间就越多！</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">这么简单的题都不会做？</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">这道题你觉得难，不太会是吗？</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">赶紧写作业，一点都不自觉</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">你很少忘记写作业的，如果需要帮助就告诉我。</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">你这孩子怎么这么犟呢，你要听话</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">你可以说"不"，但我想听听你的理由理解你。</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">你怎么这么烦人呢，就不能安静一会儿吗？</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">你自己先去玩一会，妈妈忙完就马上找你。</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">勇敢点，这有什么的啊？</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">我相信你行的，再试试看，我陪着你</span>
    </div>

    <div class="item bad">
      <span class="icon">✘</span>
      <span class="text">快点走，再拖拖拉拉你就别出去了。</span>
    </div>
    <div class="item good">
      <span class="icon">✓</span>
      <span class="text">我们来比一比，看谁更快出门。</span>
    </div>

  </div>

</div>
</body>
</html>
