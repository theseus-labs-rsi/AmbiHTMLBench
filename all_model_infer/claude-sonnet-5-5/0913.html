<style>

    display: flex;
    justify-content: space-between;

    margin-top: 30px;
    padding: 0 10px;

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c89a5b;
    font-size: 11px;
    text-align: center;
    border: none;
  }

  .circuit-placeholder {
    width: 160px;
    height: 150px;
    position: relative;

  .bars-placeholder {
    width: 180px;

<div class="page">

  <div class="title-box">
    <h2>报名和考试</h2>
  </div>

  <div class="section-text">
    <p>个人参赛，由所在中学进行统一报名；</p>
    <p>均为笔试考试，预赛为各省市自行组织、自主命题；</p>
    <p>剩余考试环节均为全国统一命题。</p>
  </div>

  <div class="qa-title">
    <h2>可以自学吗?</h2>
  </div>

  <div class="numbered-block">
    <div class="numbered-text">
      1、<span class="highlight">高中课本内容可以自学</span>，当然我们也有初高中基础
      知识课程，让你快速掌握竞赛考点。
    </div>
  </div>

  <div class="numbered-block">
    <div class="numbered-text">
      2、一些难的知识点和不知道如何规划学习进度的时候
      ，最好选择报课，大部分学生在有人一起学的情况下
      会比较好。
    </div>
  </div>

  <div class="numbered-block">
    <div class="numbered-text">
      有时候你以为自己自学学的挺好，但是很多竞赛技巧
      、思维是需要老师来指导的。时间和钱，不能兼得。
    </div>
  </div>
