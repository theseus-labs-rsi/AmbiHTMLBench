<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维二：分解思维</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 560px;
    min-height: 700px;
    position: relative;
    padding: 40px 45px 30px 45px;
    box-sizing: border-box;
  }

  /* corner decorations */
  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 3px solid #9bbdae;
  }
  .corner.top-left {
    top: 15px;
    left: 15px;
    border-right: none;
    border-bottom: none;
  }
  .corner.top-right {
    top: 15px;
    right: 15px;
    border-left: none;
    border-bottom: none;
  }
  .corner.bottom-left {
    bottom: 15px;
    left: 15px;
    border-right: none;
    border-top: none;
  }
  .corner.bottom-right {
    bottom: 15px;
    right: 15px;
    border-left: none;
    border-top: none;
  }

  h1.title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-top: 10px;
    margin-bottom: 30px;
  }

  p.intro {
    font-size: 15px;
    line-height: 2;
    text-align: justify;
    margin: 0 0 25px 0;
  }

  .highlight {
    color: #e05a3a;
    font-weight: bold;
  }

  h2.sub {
    font-size: 16px;
    font-weight: bold;
    margin: 20px 0 12px 0;
  }

  p.body-text {
    font-size: 15px;
    line-height: 2;
    text-align: justify;
    margin: 0 0 20px 0;
  }

  .next-page-btn {
    position: absolute;
    right: 45px;
    bottom: 60px;
    background-color: #1a1a1a;
    color: #ffffff;
    padding: 6px 18px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 2px;
  }

  .next-page-btn .arrow {
    font-size: 14px;
  }

  .footer {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #333;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <h1 class="title">计算思维二：分解思维</h1>

    <p class="intro">分解思维是指<span class="highlight">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）</span>。</p>

    <h2 class="sub">1、问题梳理</h2>
    <p class="body-text">先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</p>

    <h2 class="sub">2、问题分解</h2>
    <p class="body-text">将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</p>

    <h2 class="sub">3、整合方案</h2>
    <p class="body-text">制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</p>

    <div class="next-page-btn">
      <span>翻页</span>
      <span class="arrow">➤</span>
    </div>

    <div class="footer">原创：学习方法社</div>
  </div>
</body>
</html>
