<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background: #f5d9c8;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .card {
    width: 520px;
    background: #fdf6ee;
    border: 2px solid #2a8f8f;
    border-radius: 18px;
    padding: 18px 20px 25px 20px;
    box-sizing: border-box;
  }
  .title-bar {
    background: #cfe9e5;
    border-radius: 12px;
    text-align: center;
    padding: 10px 0;
    margin-bottom: 18px;
    position: relative;
  }
  .title-bar h1 {
    font-size: 26px;
    font-weight: 900;
    margin: 0;
    display: inline-block;
    color: #111;
  }
  .q-icon {
    display: inline-block;
    background: #f4a51f;
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 15px;
    line-height: 22px;
    text-align: center;
    margin-left: 6px;
    font-weight: bold;
  }

  .section-header {
    display: flex;
    align-items: center;
    margin: 14px 0 8px 0;
  }
  .pin {
    color: #d9452e;
    font-size: 18px;
    margin-right: 6px;
  }
  .section-header h2 {
    font-size: 17px;
    font-weight: bold;
    margin: 0;
    color: #111;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 4px;
    font-size: 13.5px;
  }
  th {
    background: #2a9188;
    color: #fff;
    padding: 8px 4px;
    font-weight: bold;
    text-align: center;
    border: 1px solid #2a9188;
  }
  td {
    border: 1px solid #c9c2b8;
    padding: 10px 6px;
    text-align: center;
    color: #222;
    background: #fdf6ee;
  }

  .relative-cell {
    position: relative;
  }
  .circle {
    display: inline-block;
    border: 2px solid #e08a9a;
    border-radius: 50%;
    width: 46px;
    height: 24px;
    line-height: 24px;
  }

  .note-under {
    font-size: 11px;
    color: #c0392b;
    text-align: center;
    margin-top: -14px;
    margin-bottom: 10px;
    font-weight: bold;
  }

  .summary-banner {
    background: #e2512a;
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    padding: 6px 0;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  .highlight-red {
    color: #d9342b;
    font-weight: bold;
  }

  .mixed-note {
    font-size: 11px;
    background: #fff;
    border: 1px solid #2a9188;
    border-radius: 10px;
    padding: 2px 6px;
    display: inline-block;
    margin-top: 4px;
    color: #222;
  }

  .check {
    color: #2a9188;
    font-weight: bold;
  }

  .placeholder {
    display: none;
  }
</style>
</head>
<body>
<div class="card">

  <div class="title-bar">
    <h1>猫砂都有哪些款</h1><span class="q-icon">?</span>
  </div>

  <div class="section-header">
    <span class="pin">📍</span>
    <h2>三种猫砂尺寸哪个是你最爱</h2>
  </div>

  <table>
    <tr>
      <th>尺寸</th>
      <th>重量</th>
      <th>结团效果</th>
      <th>其他</th>
    </tr>
    <tr>
      <td>1.5mm</td>
      <td>轻</td>
      <td>上</td>
      <td>易带出，价格<br>略高</td>
    </tr>
    <tr>
      <td class="relative-cell"><span class="circle">2mm</span></td>
      <td>中</td>
      <td>中</td>
      <td>综合性价比高</td>
    </tr>
    <tr>
      <td>3mm</td>
      <td>重</td>
      <td>67</td>
      <td>推荐度低，但<br>价格也低</td>
    </tr>
  </table>
  <div class="note-under">综合性价比推荐</div>

  <div class="section-header">
    <span class="pin">📍</span>
    <h2>猫砂都有哪些种类</h2>
  </div>

  <div class="summary-banner">总结: 2mm混合砂yyds</div>

  <table>
    <tr>
      <th>种类</th>
      <th>优点</th>
      <th>其他</th>
    </tr>
    <tr>
      <td>膨润土</td>
      <td>价格低廉</td>
      <td>粉尘大</td>
    </tr>
    <tr>
      <td>豆腐猫砂</td>
      <td>原料更安全，闻起来<br>也比较好</td>
      <td>价格偏高，纯豆腐结团略差</td>
    </tr>
    <tr>
      <td class="relative-cell">
        <span class="circle" style="width:60px;">混合猫砂</span>
      </td>
      <td>结合上述优点，价格<br>适中</td>
      <td>比例推荐 <span class="highlight-red">7:3或6:4</span>，结团<br>快且用量省</td>
    </tr>
    <tr>
      <td>沸石</td>
      <td>可循环利用</td>
      <td>需要自己洗</td>
    </tr>
    <tr>
      <td>其他新型原料</td>
      <td>价格高，新颖</td>
      <td>效果待考核，贵</td>
    </tr>
  </table>
  <div style="text-align:center; font-size:12px; margin-top:-8px; margin-bottom:6px;">
    <span style="color:#2a9188;">⬆</span> 普通养宠家庭足以满足需求 <span class="check">✅</span>
  </div>

</div>
</body>
</html>
