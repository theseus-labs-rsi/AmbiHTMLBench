<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled Document</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background-color: #ededed;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }
  .chat-container {
    width: 540px;
    background-color: #ededed;
    padding: 15px 10px;
    box-sizing: border-box;
  }
  .message-row {
    display: flex;
    margin-bottom: 18px;
    align-items: flex-start;
  }
  .message-row.right {
    justify-content: flex-end;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 4px;
    background: linear-gradient(135deg, #a8c8e0 0%, #5a8ab0 60%, #3a6a90 100%);
    flex-shrink: 0;
  }
  .avatar.right-avatar {
    background: #d9c9a0;
    background-image: linear-gradient(135deg, #e8d9b8 0%, #c9a870 100%);
  }
  .bubble-wrapper {
    margin: 0 10px;
    max-width: 420px;
    display: flex;
    align-items: flex-start;
  }
  .bubble {
    background-color: #ffffff;
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 16px;
    line-height: 1.7;
    color: #1a1a1a;
    position: relative;
  }
  .bubble.green {
    background-color: #95ec69;
  }
  .num-circle {
    display: inline-block;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    background-color: #b0b0b0;
    color: #fff;
    border-radius: 50%;
    font-size: 12px;
    margin-right: 6px;
    flex-shrink: 0;
  }
  .text-block {
    display: inline;
  }
  .num-wrap {
    display: flex;
    align-items: flex-start;
  }
</style>
</head>
<body>
<div class="chat-container">

  <!-- Message 6 -->
  <div class="message-row left">
    <div class="avatar"></div>
    <div class="bubble-wrapper">
      <div class="bubble">
        <div class="num-wrap">
          <span class="num-circle">6</span>
          <span class="text-block">这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message 7 -->
  <div class="message-row left">
    <div class="avatar"></div>
    <div class="bubble-wrapper">
      <div class="bubble">
        <div class="num-wrap">
          <span class="num-circle">7</span>
          <span class="text-block">最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message 8 -->
  <div class="message-row left">
    <div class="avatar"></div>
    <div class="bubble-wrapper">
      <div class="bubble">
        <div class="num-wrap">
          <span class="num-circle">8</span>
          <span class="text-block">尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message: 你重新写吧 -->
  <div class="message-row left">
    <div class="avatar"></div>
    <div class="bubble-wrapper">
      <div class="bubble">
        你重新写吧
      </div>
    </div>
  </div>

  <!-- Message: 好的，谢谢老师 (right, green) -->
  <div class="message-row right">
    <div class="bubble-wrapper">
      <div class="bubble green">
        好的，谢谢老师
      </div>
    </div>
    <div class="avatar right-avatar"></div>
  </div>

</div>
</body>
</html>
