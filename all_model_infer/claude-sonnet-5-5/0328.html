<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
  }
  .page {
    width: 550px;
    min-height: 710px;
    margin: 0 auto;
    position: relative;
    background: #fff;
    padding: 20px 30px 15px 30px;
    box-sizing: border-box;
  }

  /* Title area */
  .title-wrap {
    position: relative;
    margin-top: 10px;
  }
  .title-highlight {
    position: absolute;
    left: -5px;
    top: 5px;
    width: 220px;
    height: 85px;
    background: #ffe600;
    z-index: 0;
  }
  .title-text {
    position: relative;
    z-index: 1;
    font-size: 26px;
    font-weight: 900;
    line-height: 1.5;
    color: #1a1a1a;
    padding-top: 5px;
  }

  .circle-num {
    position: absolute;
    top: 15px;
    right: 30px;
    width: 70px;
    height: 70px;
    border: 2px solid #1a1a1a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #1a1a1a;
  }

  .subtitle {
    margin-top: 25px;
    font-size: 13px;
    color: #333;
  }

  /* Boxes */
  .box {
    margin-top: 25px;
    border-radius: 6px;
    position: relative;
    padding: 20px 20px 25px 20px;
    box-sizing: border-box;
    min-height: 220px;
  }
  .box-pink {
    background: #fdeeec;
  }
  .box-blue {
    background: #eef2f7;
  }

  .box-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #222;
    margin-bottom: 25px;
  }
  .mark-circle {
    width: 18px;
    height: 18px;
    border: 2px solid #e8956f;
    border-radius: 50%;
    display: inline-block;
  }
  .mark-x {
    width: 18px;
    height: 18px;
    display: inline-block;
    position: relative;
  }
  .mark-x::before, .mark-x::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 2px;
    background: #333;
    top: 8px;
    left: 0;
  }
  .mark-x::before { transform: rotate(45deg); }
  .mark-x::after { transform: rotate(-45deg); }

  .info-block {
    margin-left: 10px;
  }
  .info-line {
    font-size: 13px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .info-line .label {
    min-width: 40px;
  }
  .info-line.spaced .label {
    font-weight: bold;
  }

  .tag {
    display: inline-block;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 2px;
    min-width: 32px;
    text-align: center;
  }
  .tag-pink { background: #e8604c; }
  .tag-blue2 { background: #e8604c; }

  .plain-text {
    font-size: 13px;
    color: #333;
    font-weight: bold;
  }

  .placeholder {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #999;
    border: 1px dashed #ccc;
    background: rgba(255,255,255,0.4);
    text-align: center;
  }
  .chicken1 {
    bottom: 10px;
    right: 15px;
    width: 70px;
    height: 70px;
  }
  .chicken2 {
    bottom: 10px;
    right: 20px;
    width: 65px;
    height: 65px;
  }

  .footer {
    position: absolute;
    bottom: 10px;
    left: 30px;
    font-size: 9px;
    color: #999;
    letter-spacing: 1px;
  }
  .footer .date {
    margin-top: 3px;
  }
  .footer-right {
    position: absolute;
    bottom: 5px;
    right: 20px;
    width: 55px;
    height: 35px;
    font-size: 8px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-wrap">
    <div class="title-highlight"></div>
    <div class="title-text">
      使用合理的<br>标点符号
    </div>
  </div>

  <div class="circle-num">01</div>

  <div class="subtitle">
    利用斜线、外框或直线会让整体更具视觉风格。
  </div>

  <!-- Box 1 : correct example -->
  <div class="box box-pink">
    <div class="box-header">
      <span class="mark-circle"></span>
      <span>使用直线或外框</span>
    </div>
    <div class="info-block">
      <div class="info-line">
        <span class="plain-text">地点</span>
        <span class="plain-text">|</span>
        <span class="plain-text">武汉国际会展中心</span>
      </div>
      <div class="info-line" style="margin-bottom:20px;">
        <span class="plain-text">时间</span>
        <span class="plain-text">|</span>
        <span class="plain-text">2018 年 8 月 20 日</span>
      </div>

      <div class="info-line">
        <span class="tag tag-pink">地点</span>
        <span class="plain-text">武汉国际会展中心</span>
      </div>
      <div class="info-line">
        <span class="tag tag-blue2">时间</span>
        <span class="plain-text">2018 年 8 月 20 日</span>
      </div>
    </div>

    <div class="placeholder chicken1">[Illustration:<br>chicken character]</div>
  </div>

  <!-- Box 2 : incorrect example -->
  <div class="box box-blue">
    <div class="box-header">
      <span class="mark-x"></span>
      <span>使用冒号</span>
    </div>
    <div class="info-block" style="margin-top:50px;">
      <div class="info-line">
        <span class="plain-text">地点：</span>
        <span class="plain-text">武汉国际会展中心</span>
      </div>
      <div class="info-line">
        <span class="plain-text">时间：</span>
        <span class="plain-text">2018 年 8 月 20 日</span>
      </div>
    </div>

    <div class="placeholder chicken2">[Illustration:<br>angry chicken<br>character]</div>
  </div>

  <div class="footer">
    ADVERTISING CREATIVITY
    <div class="date">2023.05</div>
  </div>

  <div class="footer-right">
    [Logo:<br>大猫<br>武计馆]
  </div>

</div>
</body>
</html>
