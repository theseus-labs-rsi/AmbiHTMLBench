<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新媒体账号运营6种方法 - 做好竞品分析</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e8d2bb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  .card {
    position: relative;
    width: 540px;
    min-height: 720px;
    background: #f5efe6;
    border-radius: 18px;
    box-sizing: border-box;
    padding: 40px 36px 0 36px;
    overflow: hidden;
  }

  .tag {
    display: inline-block;
    background: #2b2b2b;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 30px;
  }

  .main-title {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 28px;
  }

  .main-title .number {
    font-size: 34px;
    font-weight: 800;
    color: #1f1f1f;
    letter-spacing: 1px;
  }

  .main-title .title-text {
    font-size: 30px;
    font-weight: 800;
    color: #1f1f1f;
  }

  .paragraph {
    font-size: 15.5px;
    color: #333;
    line-height: 1.9;
    margin-bottom: 22px;
  }

  .list-item {
    font-size: 15.5px;
    color: #222;
    line-height: 1.8;
    margin-bottom: 4px;
  }

  .list-item.strong {
    font-weight: 600;
    margin-top: 10px;
  }

  .list-sub {
    font-size: 15px;
    color: #333;
    padding-left: 1.6em;
    margin-bottom: 10px;
    line-height: 1.7;
  }

  .list-block {
    margin-bottom: 20px;
  }

  .footer {
    position: relative;
    margin-top: 30px;
    background: #e8d2bb;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #4a4a4a;
    font-weight: 500;
    border-radius: 0 0 18px 18px;
  }

  /* 装饰性虚线齿孔效果，模拟图片底部波浪边缘 */
  .footer::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 0;
    right: 0;
    height: 16px;
    background-image: radial-gradient(circle, #f5efe6 6px, transparent 7px);
    background-size: 20px 20px;
    background-position: 0 0;
  }
</style>
</head>
<body>

<div class="card">
  <div class="tag">新媒体账号运营6种方法</div>

  <div class="main-title">
    <span class="number">03</span>
    <span class="title-text">做好竞品分析</span>
  </div>

  <div class="paragraph">
    前期的竞品分析<br>
    一定要花大量的时间和精力去收集信息
  </div>

  <div class="paragraph">
    仔细分析<br>
    可以从以下几个方面来看
  </div>

  <div class="list-block">
    <div class="list-item">1、账号人设标 签</div>
    <div class="list-item">2、账号选题规划</div>

    <div class="list-item">3、内容脚本拆解：</div>
    <div class="list-sub">结构、矛盾点、金句、痒点</div>

    <div class="list-item">4、内容形式：</div>
    <div class="list-sub">场景道具服装，拍摄剪辑节奏</div>

    <div class="list-item">5、运营策略：</div>
    <div class="list-sub">
      发布时间和频率，封面，文案，线上互动<br>
      用户运营，引流途径
    </div>
  </div>

  <div class="footer">
    @新媒体运营的十万个为什么
  </div>
</div>

</body>
</html>
