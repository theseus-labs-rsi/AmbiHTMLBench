<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房注意事项</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #f0ede6;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 480px;
    min-height: 700px;
    background: linear-gradient(180deg, #6b8e7d 0%, #e8e3d6 60%, #e8e3d6 100%);
    border: 10px solid #8fae9d;
    border-radius: 6px;
    box-sizing: border-box;
    padding: 30px 28px 40px 28px;
    position: relative;
    color: #333;
  }

  .title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #4a6b5a;
    margin-bottom: 22px;
    letter-spacing: 2px;
  }

  .section-header {
    display: flex;
    align-items: center;
    margin-top: 18px;
    margin-bottom: 10px;
  }

  .circle {
    color: #d94f4f;
    font-size: 22px;
    font-weight: bold;
    margin-right: 2px;
  }

  .section-title {
    font-size: 19px;
    font-weight: bold;
    color: #222;
  }

  .underline {
    border-bottom: 2px solid #d94f4f;
    width: 100%;
    margin-bottom: 14px;
  }

  .item {
    font-size: 15px;
    line-height: 1.9;
    color: #333;
    margin-bottom: 2px;
  }

  .two-col {
    display: flex;
    flex-wrap: wrap;
    gap: 0 10px;
  }

  .two-col span {
    white-space: nowrap;
  }

  .watermark {
    position: absolute;
    top: 300px;
    right: 110px;
    font-size: 12px;
    color: #c9a98f;
    text-align: center;
    opacity: 0.8;
    line-height: 1.4;
  }

  .placeholder {
    position: absolute;
    top: 320px;
    right: 15px;
    width: 140px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    font-size: 12px;
    border: 1px dashed transparent;
  }

  .content-wrap {
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title">租房注意事项</div>

  <div class="content-wrap">
    <div class="section-header">
      <span class="circle">◯</span>
      <span class="section-title">卧室</span>
    </div>
    <div class="underline"></div>

    <div class="item">1.空调是否正常使用，空调排水位置，外机位置</div>
    <div class="item">2.所有电灯，插座是否ok</div>
    <div class="item">3.床都否OK，躺下翻身是否有响声</div>
    <div class="item">4.卧室地板情况</div>
    <div class="item">5.衣柜是否完好</div>
    <div class="item">6.各个房间是否能反锁</div>
    <div class="item">7.装修情况，不要太新，也不要太久</div>
    <div class="item">8.排查针孔摄像头</div>
    <div class="item">9.wifi信号情况</div>

    <div class="section-header">
      <span class="circle">◯</span>
      <span class="section-title">其他</span>
    </div>
    <div class="underline"></div>

    <div class="item two-col">
      <span>1.各类遥控器清点</span>
      <span>2.所有钥匙清点</span>
    </div>
    <div class="item">3.所有墙面情况，有无裂痕掉漆，脱皮</div>
    <div class="item">4.所有水龙头一起打开，看水压是否足够</div>
    <div class="item">5.如果是燃气热水器，也留意下安全使用情况</div>
  </div>

  <div class="watermark">
    @带毛的栗子<br>
    From 小红书
  </div>

  <div class="placeholder">[Illustration: cartoon cat, bottom-right area]</div>
</div>

</body>
</html>
