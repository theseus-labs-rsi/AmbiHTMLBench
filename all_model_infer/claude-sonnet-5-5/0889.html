<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香水浓度</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(90deg, #8a6a4a, #6b4a30, #8a6a4a);
    background-image: repeating-linear-gradient(90deg, #7a5a3a 0px, #8a6a4a 15px, #6b4a30 30px);
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }

  .card {
    background: #fdfbf7;
    width: 500px;
    border-radius: 6px;
    padding: 25px 20px 30px 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }

  h1 {
    text-align: center;
    color: #5a3a24;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 6px;
    margin: 5px 0 25px 0;
    font-family: "SimSun", serif;
  }

  .bottles-row {
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    margin-bottom: 15px;
  }

  .bottle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;
  }

  .bottle-cap {
    position: relative;
    width: 20px;
    height: 20px;
    margin-bottom: -4px;
  }
  .bottle-ball {
    width: 16px;
    height: 16px;
    background: radial-gradient(circle at 30% 30%, #ff6b5a, #c0392b);
    border-radius: 50%;
    margin: 0 auto;
  }
  .bottle-spray {
    position: absolute;
    top: -2px;
    right: -18px;
    width: 20px;
    border-top: 1px solid #999;
    transform: rotate(-20deg);
  }

  .bottle-body {
    width: 50px;
    height: 55px;
    border: 1.5px solid #888;
    border-top: none;
    position: relative;
    background: #fff;
    overflow: hidden;
  }

  .fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #d9d9d9;
  }

  table.chart {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  table.chart td {
    text-align: center;
    padding: 10px 2px;
    color: #4a3322;
    font-size: 15px;
    vertical-align: middle;
  }

  .row-label {
    text-align: left;
    color: #8a6a4a;
    font-size: 13px;
    width: 30px;
    writing-mode: vertical-rl;
    padding-left: 0;
  }

  .classify-row td {
    font-size: 17px;
    font-weight: bold;
    color: #3a2a18;
  }

  .divider {
    border-top: 1px solid #e0d8cc;
  }

  .tips {
    margin-top: 20px;
    padding: 10px 10px 0 10px;
    font-size: 13px;
    color: #5a4a3a;
    line-height: 1.8;
  }

  .tips .tips-title {
    color: #8a6a4a;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .placeholder {
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1>香水浓度</h1>

  <div class="bottles-row">
    <div class="bottle-wrap">
      <div class="bottle-cap">
        <div class="bottle-ball"></div>
        <div class="bottle-spray"></div>
      </div>
      <div class="bottle-body"><div class="fill" style="height:75%;"></div></div>
    </div>
    <div class="bottle-wrap">
      <div class="bottle-cap">
        <div class="bottle-ball"></div>
        <div class="bottle-spray"></div>
      </div>
      <div class="bottle-body"><div class="fill" style="height:55%;"></div></div>
    </div>
    <div class="bottle-wrap">
      <div class="bottle-cap">
        <div class="bottle-ball"></div>
        <div class="bottle-spray"></div>
      </div>
      <div class="bottle-body"><div class="fill" style="height:35%;"></div></div>
    </div>
    <div class="bottle-wrap">
      <div class="bottle-cap">
        <div class="bottle-ball"></div>
        <div class="bottle-spray"></div>
      </div>
      <div class="bottle-body"><div class="fill" style="height:20%;"></div></div>
    </div>
    <div class="bottle-wrap">
      <div class="bottle-cap">
        <div class="bottle-ball"></div>
        <div class="bottle-spray"></div>
      </div>
      <div class="bottle-body"><div class="fill" style="height:8%;"></div></div>
    </div>
  </div>

  <table class="chart">
    <tr class="classify-row divider">
      <td class="row-label">分类</td>
      <td>浓香精</td>
      <td>淡香精</td>
      <td>淡香水</td>
      <td>古龙水</td>
      <td>清香水</td>
    </tr>
    <tr class="divider">
      <td class="row-label">名称</td>
      <td>Parfum</td>
      <td>Eau<br>De<br>Parfum</td>
      <td>Eau<br>De<br>Toilette</td>
      <td>Eau<br>De<br>Cologne</td>
      <td>Eau<br>Fraiche</td>
    </tr>
    <tr class="divider">
      <td class="row-label">缩写</td>
      <td>(P)</td>
      <td>(EDP)</td>
      <td>(EDT)</td>
      <td>(EDC)</td>
      <td>(EF)</td>
    </tr>
    <tr class="divider">
      <td class="row-label">浓度</td>
      <td>15-20%</td>
      <td>10-15%</td>
      <td>5-10%</td>
      <td>3-5%</td>
      <td>&lt;3%</td>
    </tr>
    <tr class="divider">
      <td class="row-label">留香</td>
      <td>5-8H</td>
      <td>3-5H</td>
      <td>3-4H</td>
      <td>2-3H</td>
      <td>&lt;1h</td>
    </tr>
  </table>

  <div class="tips">
    <div class="tips-title">tips:</div>
    <div>浓度高的香水不代表留香时间长,主要取决于香料种类</div>
    <div>在相同的浓度比较下，木质香的留香时间是麝压花果香的</div>
  </div>
</div>

</body>
</html>
