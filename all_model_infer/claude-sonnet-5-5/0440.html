<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Studio Web - Vol.07</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    width: 540px;
    margin: 0 auto;
    background: #fff;
    position: relative;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 20px 10px 20px;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
  }
  .logo-cn {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1;
  }
  .logo-sub {
    font-size: 13px;
    color: #333;
    margin-top: 2px;
    font-weight: bold;
  }
  .vol {
    font-size: 11px;
    font-weight: bold;
    margin-left: 6px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .folder-icon {
    width: 16px;
    height: 14px;
    background: #222;
    position: relative;
    clip-path: polygon(0 20%, 40% 20%, 50% 0, 100% 0, 100% 100%, 0 100%);
  }
  .header-right span {
    font-size: 15px;
    font-weight: bold;
    color: #111;
  }
  .top-rule {
    border-bottom: 3px solid #000;
    margin: 0 15px;
  }

  .cards-area {
    position: relative;
    height: 330px;
    width: 100%;
    margin-top: 10px;
  }

  .card {
    position: absolute;
    width: 180px;
    height: 110px;
    background: #efefef;
    border: 2px solid #111;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
    padding: 8px 10px;
    font-weight: 900;
  }
  .card .num {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #cfcfcf;
    border: 1px solid #333;
    text-align: center;
    line-height: 20px;
    font-size: 12px;
    font-weight: bold;
  }

  .card1 {
    top: 10px;
    left: 20px;
    transform: rotate(-14deg);
  }
  .card1 .big { font-size: 26px; letter-spacing: 1px; }
  .card1 .small { font-size: 11px; margin-top: 6px; line-height: 1.3; }
  .card1 .num { top: 32px; left: -5px; }

  .card2 {
    top: 25px;
    left: 190px;
    transform: rotate(-4deg);
    width: 190px;
  }
  .card2 .big { font-size: 22px; letter-spacing: 1px; }
  .card2 .small { font-size: 14px; margin-top: 6px; letter-spacing: 1px; }
  .card2 .num { top: 38px; left: -8px; }

  .card3 {
    top: 15px;
    left: 365px;
    transform: rotate(10deg);
    width: 170px;
    height: 110px;
  }
  .card3 .big { font-size: 18px; line-height: 1.1; letter-spacing: 1px; }
  .card3 .small { font-size: 24px; margin-top: 8px; letter-spacing: 1px; }
  .card3 .num { top: 38px; left: 148px; }

  .card4 {
    top: 190px;
    left: 95px;
    transform: rotate(-6deg);
    width: 190px;
  }
  .card4 .big { font-size: 26px; letter-spacing: 1px; }
  .card4 .small { font-size: 14px; margin-top: 8px; letter-spacing: 1px; }
  .card4 .num { top: 10px; left: 158px; }

  .card5 {
    top: 190px;
    left: 300px;
    transform: rotate(5deg);
    width: 180px;
  }
  .card5 .big { font-size: 28px; letter-spacing: 1px; }
  .card5 .mid { font-size: 11px; margin-top: 6px; line-height: 1.3; }
  .card5 .small { font-size: 26px; margin-top: 4px; letter-spacing: 1px; }
  .card5 .num { top: 6px; left: 150px; }

  .blue-bar {
    width: 100%;
    height: 22px;
    background: #2b2bd4;
  }

  .cyan-section {
    background: #b6f5ee;
    padding: 40px 20px 50px 20px;
    position: relative;
  }
  .cyan-title {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.25;
    color: #111;
  }
  .cyan-line {
    border-bottom: 3px solid #111;
    margin: 8px 0 8px 0;
  }

  .footer {
    background: #b6f5ee;
    padding: 15px 20px 25px 20px;
  }
  .footer-rule {
    border-top: 3px solid #111;
    margin-bottom: 12px;
  }
  .footer-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .copyright {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.5;
  }
  .copyright .label {
    font-size: 11px;
    font-weight: normal;
    margin-left: 4px;
  }
  .footer-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .triangle-icon {
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #111;
    position: relative;
  }
  .barcode {
    display: flex;
    align-items: flex-end;
    height: 24px;
    gap: 2px;
  }
  .barcode div {
    width: 2px;
    background: #111;
  }
  .barcode-label {
    font-size: 9px;
    font-weight: bold;
    margin-top: 2px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo-block">
      <div style="display:flex; align-items:baseline;">
        <span class="logo-cn">人点</span>
        <span class="logo-sub">(分享)</span>
        <span class="vol">Vol.07</span>
      </div>
    </div>
    <div class="header-right">
      <div class="folder-icon"></div>
      <span>Design studio web</span>
    </div>
  </div>
  <div class="top-rule"></div>

  <div class="cards-area">
    <div class="card card1">
      <div class="num">1</div>
      <div class="big">ABCD</div>
      <div class="small">A<br>BLACK<br>COVER DESIGN</div>
    </div>

    <div class="card card2">
      <div class="num">2</div>
      <div class="big">条件反射</div>
      <div class="small">REFLEX<br>DESIGN</div>
    </div>

    <div class="card card3">
      <div class="num">3</div>
      <div class="big">STUDIO<br>NA. EO</div>
      <div class="small">立入禁止</div>
    </div>

    <div class="card card4">
      <div class="num">4</div>
      <div class="big">王志弘</div>
      <div class="small">WANG ZHI HONG</div>
    </div>

    <div class="card card5">
      <div class="num">5</div>
      <div class="big">NICE</div>
      <div class="mid">NICE LAB<br>STUDIO</div>
      <div class="small">LAB</div>
    </div>
  </div>

  <div class="blue-bar"></div>

  <div class="cyan-section">
    <div class="cyan-title">国内知名设计</div>
    <div class="cyan-line"></div>
    <div class="cyan-title">工作室的官网</div>
    <div class="cyan-line"></div>
  </div>

  <div class="footer">
    <div class="footer-rule"></div>
    <div class="footer-content">
      <div class="copyright">
        Copyright© 2023<span class="label">(官网)</span><br>
        Jidn share all rights reserved.
      </div>
      <div class="footer-right">
        <div class="triangle-icon"></div>
        <div class="barcode">
          <div style="height:20px;"></div><div style="height:24px;"></div><div style="height:16px;"></div>
          <div style="height:24px;"></div><div style="height:12px;"></div><div style="height:24px;"></div>
          <div style="height:20px;"></div><div style="height:24px;"></div><div style="height:14px;"></div>
          <div style="height:24px;"></div><div style="height:18px;"></div><div style="height:24px;"></div>
          <div style="height:10px;"></div><div style="height:24px;"></div><div style="height:16px;"></div>
          <div style="height:24px;"></div><div style="height:20px;"></div><div style="height:24px;"></div>
          <div style="height:12px;"></div><div style="height:24px;"></div>
        </div>
        <div class="barcode-label">JIDN SHARE ©2023</div>
      </div>
    </div>
  </div>

</body>
</html>
