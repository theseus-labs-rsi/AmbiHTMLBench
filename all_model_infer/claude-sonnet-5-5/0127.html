<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句合集系列</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #d9cdb3;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background-color: #d9cdb3;
    padding: 20px 25px 40px 25px;
    box-sizing: border-box;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid #333;
    padding-bottom: 8px;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
  }
  .logo-chinese {
    font-size: 52px;
    font-weight: bold;
    color: #8a1f1f;
    letter-spacing: 2px;
    line-height: 1;
    font-family: "KaiTi", "STKaiti", serif;
  }
  .logo-sub {
    font-size: 13px;
    letter-spacing: 6px;
    color: #8a1f1f;
    margin-top: 4px;
    font-weight: bold;
  }
  .header-right {
    text-align: right;
    font-size: 15px;
    font-weight: bold;
    color: #222;
    padding-top: 15px;
    white-space: nowrap;
  }
  .subheader {
    text-align: right;
    font-size: 17px;
    font-weight: bold;
    color: #222;
    border-bottom: 2px solid #333;
    padding: 10px 0 8px 0;
    margin-bottom: 25px;
  }

  .item {
    margin-bottom: 30px;
  }
  .item-title {
    font-size: 22px;
    font-weight: bold;
    color: #111;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .explain-label {
    font-size: 13px;
    color: #333;
    margin-bottom: 4px;
  }
  .explain-text {
    font-size: 13px;
    color: #333;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="logo-block">
      <div class="logo-chinese">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="header-right">金句 | 素材 | 摘抄</div>
  </div>

  <div class="subheader">金句合集系列</div>

  <div class="item">
    <div class="item-title">1、愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</div>
    <div class="explain-label">释义:</div>
    <div class="explain-text">
      希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝<br>
      与琐事而烦恼忧愁。
    </div>
  </div>

  <div class="item">
    <div class="item-title">2、总有人间一两风，<br>填我十万八千梦。</div>
    <div class="explain-label">释义:</div>
    <div class="explain-text">
      人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成<br>
      全你的理想。
    </div>
  </div>

  <div class="item">
    <div class="item-title">3、日出有盼，日落有思，<br>平平安安，所遇皆甜。</div>
    <div class="explain-label">释义:</div>
    <div class="explain-text">
      只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，<br>
      遇到的都是美好。
    </div>
  </div>

</div>
</body>
</html>
