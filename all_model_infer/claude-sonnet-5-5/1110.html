<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营48个必备工具</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background-color: #2f5244;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    width: 540px;
    height: 720px;
  }
  .page {
    width: 540px;
    height: 720px;
    padding: 30px 38px;
    color: #ffffff;
    position: relative;
  }
  .title {
    font-family: "Courier New", monospace, "Microsoft YaHei";
    font-size: 36px;
    font-weight: bold;
    line-height: 1.3;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .badge {
    display: inline-block;
    background-color: #e6b800;
    color: #2f5244;
    font-family: "Courier New", monospace;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: 0.85fr 1.1fr 0.95fr 1.3fr;
    grid-template-rows: 95px 115px 95px 95px;
    gap: 8px;
    width: 100%;
    height: 365px;
  }
  .box {
    border-radius: 3px;
    padding: 12px 14px;
    color: #ffffff;
  }
  .part-label {
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: #e8f0e5;
    margin-bottom: 8px;
    opacity: 0.9;
  }
  .part-content {
    font-size: 14px;
    line-height: 1.45;
    font-weight: 500;
  }

  .c-gray  { background-color: #7f9a79; }
  .c-green { background-color: #74966e; }
  .c-light { background-color: #86a881; }

  .p01 { grid-column: 1 / 2; grid-row: 1 / 4; }
  .p02 { grid-column: 2 / 3; grid-row: 1 / 2; }
  .p03 { grid-column: 2 / 3; grid-row: 2 / 3; }
  .p04 { grid-column: 1 / 3; grid-row: 4 / 5; }

  .p05 { grid-column: 3 / 5; grid-row: 1 / 2; }
  .p06 { grid-column: 3 / 4; grid-row: 2 / 5; }
  .p07 { grid-column: 4 / 5; grid-row: 2 / 3; }
  .p08 { grid-column: 4 / 5; grid-row: 3 / 5; }

</style>
</head>
<body>
<div class="page">

  <div class="title">TikTok运营<br>48个必备工具</div>

  <div class="badge">@ 徐徐教你做TikTok</div>

  <div class="grid">

    <div class="box c-gray p01">
      <div class="part-label">Part 01</div>
      <div class="part-content">7个TK<br>数据平台</div>
    </div>

    <div class="box c-gray p02">
      <div class="part-label">Part 02</div>
      <div class="part-content">3个好用<br>选品网站</div>
    </div>

    <div class="box c-gray p03">
      <div class="part-label">Part 03</div>
      <div class="part-content">5个视频<br>素材网站</div>
    </div>

    <div class="box c-gray p04">
      <div class="part-label">Part 04</div>
      <div class="part-content">6个TK数据分析网站</div>
    </div>

    <div class="box c-light p05">
      <div class="part-label">Part 05</div>
      <div class="part-content">4个剪辑<br>4个翻译软件</div>
    </div>

    <div class="box c-green p06">
      <div class="part-label">Part 06</div>
      <div class="part-content">8个TK<br>传输管理<br>网站</div>
    </div>

    <div class="box c-light p07">
      <div class="part-label">Part 07</div>
      <div class="part-content">5个BGM<br>网站</div>
    </div>

    <div class="box c-green p08">
      <div class="part-label">Part 08</div>
      <div class="part-content">7个投放<br>联盟网站</div>
    </div>

  </div>

</div>
</body>
</html>
