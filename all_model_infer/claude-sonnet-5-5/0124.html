<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Notebook Page</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    background: #faf6ec;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    padding: 30px 30px 30px 55px;
    font-family: 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;
    box-sizing: border-box;
  }
  .binding {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 28px;
    background: #1a1a1a;
    box-shadow: 2px 0 6px rgba(0,0,0,0.4) inset;
  }
  .row {
    display: flex;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .row.spacer {
    height: 22px;
  }
  .eng {
    width: 230px;
    font-size: 20px;
    font-style: italic;
    color: #1a1a1a;
    white-space: nowrap;
  }
  .eng.indent {
    padding-left: 25px;
  }
  .eng.blue {
    color: #2222aa;
  }
  .def {
    font-size: 18px;
    font-style: italic;
    color: #2222aa;
  }
  .underline-word {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="page">
  <div class="binding"></div>

  <div class="row">
    <div class="eng">charity</div>
    <div class="def">n.慈善机构</div>
  </div>
  <div class="row">
    <div class="eng">clarity</div>
    <div class="def">n.(思路,图像)清晰</div>
  </div>
  <div class="row">
    <div class="eng">clarify</div>
    <div class="def">v.阐明,阐释</div>
  </div>

  <div class="row spacer"></div>

  <div class="row">
    <div class="eng">consistent</div>
    <div class="def">adj.一贯的,与...一致的</div>
  </div>
  <div class="row">
    <div class="eng indent">resist</div>
    <div class="def">v.抵制</div>
  </div>
  <div class="row">
    <div class="eng indent">insist</div>
    <div class="def">v.坚持</div>
  </div>

  <div class="row spacer"></div>

  <div class="row">
    <div class="eng">insert</div>
    <div class="def">v.插入,嵌入</div>
  </div>
  <div class="row">
    <div class="eng">assert</div>
    <div class="def">v.断言;坚持主张</div>
  </div>

  <div class="row spacer"></div>

  <div class="row">
    <div class="eng blue">eminent</div>
    <div class="def">adj.杰出的</div>
  </div>
  <div class="row">
    <div class="eng blue">Prominent</div>
    <div class="def">adj.杰出的,重要的</div>
  </div>
  <div class="row">
    <div class="eng blue">eliminate</div>
    <div class="def">v.消除;淘汰</div>
  </div>

  <div class="row spacer"></div>

  <div class="row">
    <div class="eng">integral</div>
    <div class="def">adj.必不可少的</div>
  </div>
  <div class="row">
    <div class="eng">integrity</div>
    <div class="def">n.诚实,正直</div>
  </div>
  <div class="row">
    <div class="eng">integrate</div>
    <div class="def">v.(使)融入</div>
  </div>

  <div class="row spacer"></div>

  <div class="row">
    <div class="eng blue">fabricate</div>
    <div class="def">v.捏造</div>
  </div>
  <div class="row">
    <div class="eng blue">fluctuate</div>
    <div class="def">v.波动,上浮动</div>
  </div>

</div>
</body>
</html>
