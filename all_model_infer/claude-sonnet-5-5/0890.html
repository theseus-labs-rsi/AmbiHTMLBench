<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句摘抄 - 坚持奋斗主题</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "SimSun", "Microsoft YaHei", serif;
    background: #cbb89b;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #cbb89b;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  .header {
    background: #f5ece3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 22px 20px;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
  }
  .logo-text {
    font-size: 46px;
    font-weight: 900;
    color: #c0392b;
    letter-spacing: 2px;
    font-family: "KaiTi", "STKaiti", serif;
    line-height: 1;
  }
  .logo-sub {
    font-size: 13px;
    color: #c0392b;
    letter-spacing: 4px;
    margin-top: 6px;
    font-family: Arial, sans-serif;
  }
  .right-block {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .jinju {
    font-size: 22px;
    font-weight: bold;
    color: #222;
    letter-spacing: 2px;
  }
  .jinju .sep {
    display: inline-block;
    width: 1px;
    height: 16px;
    background: #222;
    margin: 0 8px;
    vertical-align: middle;
  }
  .theme {
    font-size: 20px;
    font-weight: bold;
    color: #222;
    letter-spacing: 1px;
    border-top: 2px solid #222;
    padding-top: 6px;
    margin-top: 2px;
    width: 100%;
    text-align: right;
  }
  .content {
    padding: 28px 24px 40px 24px;
  }
  .section {
    margin-bottom: 36px;
  }
  .title-large {
    font-size: 28px;
    font-weight: bold;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .example-label {
    font-size: 15px;
    color: #333;
    margin-bottom: 10px;
  }
  .example-text {
    font-size: 15px;
    color: #222;
    line-height: 1.9;
    text-align: justify;
  }
  .divider-space {
    height: 20px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="logo-block">
      <div class="logo-text">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="right-block">
      <div class="jinju">金句<span class="sep"></span>摘抄</div>
      <div class="theme">坚持奋斗主题</div>
    </div>
  </div>

  <div class="content">
    <div class="section">
      <div class="title-large">夜色难免黑凉<br>前行必有曙光</div>
      <div class="example-label">举例:</div>
      <div class="example-text">
        夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
      </div>
    </div>

    <div class="divider-space"></div>

    <div class="section">
      <div class="title-large">道固远，笃行可至<br>事虽巨，坚为必成</div>
      <div class="example-label">举例:</div>
      <div class="example-text">
        道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
      </div>
    </div>
  </div>
</div>
</body>
</html>
