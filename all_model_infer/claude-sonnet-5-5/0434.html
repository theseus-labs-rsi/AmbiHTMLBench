<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的 vs 人民日报写的</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    width: 540px;
  }
  .page {
    width: 540px;
    display: flex;
    flex-direction: column;
  }
  .top-section {
    background-color: #e3d1a1;
    position: relative;
    height: 300px;
    padding: 30px 30px 0 30px;
    overflow: hidden;
  }
  .wo-xie {
    font-size: 26px;
    font-weight: bold;
    color: #2b2b2b;
    display: inline-block;
    vertical-align: middle;
  }
  .wrong-circle {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 9px solid #c0272d;
    border-radius: 50%;
    margin-left: 15px;
    vertical-align: middle;
  }
  .top-text {
    font-size: 19px;
    color: #2b2b2b;
    line-height: 1.8;
    margin-top: 25px;
    font-weight: bold;
  }
  .watermark {
    position: absolute;
    top: 150px;
    left: 100px;
    font-size: 22px;
    color: rgba(255,255,255,0.35);
    transform: rotate(-20deg);
    white-space: nowrap;
  }
  .child-photo {
    position: absolute;
    top: 55px;
    right: 15px;
    width: 160px;
    height: 200px;
    background-color: #555;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ddd;
    font-size: 13px;
    text-align: center;
    clip-path: polygon(10% 0%, 90% 2%, 100% 40%, 95% 100%, 5% 95%, 0% 50%);
  }
  .caption-banner {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #3b3650;
    color: #e9c84a;
    font-size: 20px;
    font-weight: bold;
    padding: 8px 0 8px 30px;
    letter-spacing: 1px;
  }

  .bottom-section {
    background-color: #40385a;
    color: #eee;
    padding: 30px 30px 40px 30px;
    position: relative;
  }
  .renmin-title {
    font-size: 24px;
    font-weight: bold;
    color: #f0f0f0;
    display: flex;
    align-items: center;
    margin-bottom: 25px;
  }
  .checkmark {
    width: 40px;
    height: 40px;
    margin-left: 15px;
    position: relative;
  }
  .checkmark::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 28px;
    border-right: 7px solid #6fcf3f;
    border-top: 7px solid #6fcf3f;
    transform: rotate(135deg);
    left: 2px;
    top: -2px;
  }
  .body-text {
    font-size: 17px;
    line-height: 2.05;
    color: #f2f2f2;
  }
  .quote-source {
    text-align: right;
    margin-top: 25px;
    font-size: 15px;
    color: #cfcfcf;
  }
</style>
</head>
<body>
<div class="page">
  <div class="top-section">
    <div>
      <span class="wo-xie">我写的：</span>
      <span class="wrong-circle"></span>
    </div>
    <div class="top-text">
      我们民族的追梦史充满<br>
      艰辛。
    </div>
    <div class="watermark">看淤的美女纸</div>
    <div class="child-photo">[Photo: child's face, slightly distressed expression, wearing red shirt]</div>
    <div class="caption-banner">学习使我妈快乐</div>
  </div>

  <div class="bottom-section">
    <div class="renmin-title">
      人民日报写的：
      <span class="checkmark"></span>
    </div>
    <div class="body-text">
      我们这个民族，有数千年辉煌文明、有数百年
      深重苦难，也有百余年不息奋斗，追寻梦想的
      道路尤其艰难曲折。百余年来的救亡图存、道
      路探索，多少仁人志士留下“有心杀贼，无力
      回天”的悲愤，付出“春云碧血，秋雨黄花”
      的牺牲，发出“拼将十万头颅血，须把乾坤力
      挽回”的呐喊。
    </div>
    <div class="quote-source">——2013.4.1《筑就民族复兴的“中国梦”》</div>
  </div>
</div>
</body>
</html>
