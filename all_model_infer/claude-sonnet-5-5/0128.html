<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #2b2b2b;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 20px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 20px);
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 540px;
    min-height: 700px;
    position: relative;
    padding: 30px 25px 40px 25px;
    box-sizing: border-box;
    overflow: hidden;
  }

  .title-line1 {
    color: #ffcc33;
    font-size: 23px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 4px;
  }

  .title-line1 .quote {
    color: #ff5533;
  }

  .title-line2 {
    color: #ffcc33;
    font-size: 23px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 25px;
  }

  .content {
    color: #ffffff;
    font-size: 18px;
    line-height: 1.9;
  }

  .content p {
    margin: 0 0 14px 0;
  }

  .watermark {
    position: absolute;
    color: rgba(255,255,255,0.15);
    font-size: 20px;
    font-weight: bold;
    transform: rotate(-20deg);
    pointer-events: none;
    user-select: none;
    letter-spacing: 2px;
  }

  .wm1 {
    top: 300px;
    left: 230px;
  }

  .wm2 {
    top: 560px;
    left: 350px;

<body>
<div class="page">

  <div class="title-line1">7.当题目中出现<span class="quote">"</span><span class="quote" style="color:#ff5533;">原则</span><span class="quote">"</span>时，可用</div>
  <div class="title-line2">以下模板：</div>

  <div class="content">
    <p>(一)教育性原则。…体现教育目标，有利于幼儿身的全面发展</p>
    <p>(二)个别差异性原则。每个幼儿不一样，教师要因材施教</p>
    <p>（三）科学性原则 。…能给幼儿正确的启蒙教育</p>
    <p>(四)发展适宜性原则。考虑到不同年龄阶段孩子的特点</p>
    <p>（五）整体性原则 。考虑到多方面的要素，促进幼儿整体的发展</p>
    <p>（六）活动性原则。注重幼儿亲身体验，直接参与，以各种游戏活动为主</p>
  </div>

  <div class="watermark wm1">琳子幼资</div>
  <div class="watermark wm2">好子幼资</div>

</div>
