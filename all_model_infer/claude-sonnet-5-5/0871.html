<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Three Thousand - Poster</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f0ead6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .poster {
    position: relative;
    width: 540px;
    height: 720px;
    background: linear-gradient(135deg, #fdf6ec 0%, #fbeedd 40%, #fdf6ec 100%);
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  /* Background watercolor placeholder */
  .bg-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: radial-gradient(ellipse at 40% 35%,
                rgba(230,140,60,0.35) 0%,
                rgba(230,140,60,0.15) 25%,
                rgba(255,255,255,0) 55%),
                radial-gradient(ellipse at 60% 60%,
                rgba(230,140,60,0.25) 0%,
                rgba(255,255,255,0) 50%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    color: rgba(150,100,60,0.3);
    font-size: 11px;
    font-family: sans-serif;
    padding-bottom: 10px;
  }

  .top-left {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 2;
    color: #d4762a;
  }
  .top-left .date {
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .top-left .designer {
    font-weight: bold;
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 4px;
    line-height: 1.3;
  }

  .top-right {
    position: absolute;
    top: 18px;
    right: 20px;
    z-index: 2;
    text-align: right;
    color: #d4762a;
  }
  .top-right .en1 {
    font-weight: bold;
    font-size: 19px;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .top-right .en2 {
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .top-right .cn {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 1.6;
    color: #d4762a;
  }

  .vertical-left-text {
    position: absolute;
    top: 150px;
    left: 30px;
    z-index: 3;
    display: flex;
    gap: 10px;
  }

  .v-col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-weight: 900;
    color: #e2772c;
    font-family: 'Arial Black', Arial, sans-serif;
    letter-spacing: 2px;
    line-height: 0.95;
  }

  .v-col.line1 {
    font-size: 36px;
    height: 330px;
  }
  .v-col.line2 {
    font-size: 36px;
    height: 460px;
  }

  .vertical-right-text {
    position: absolute;
    top: 190px;
    right: 18px;
    z-index: 3;
    writing-mode: vertical-rl;
    text-orientation: upright;
    color: #e2772c;
    font-size: 11px;
    letter-spacing: 10px;
    font-weight: 600;
    font-family: 'Arial', sans-serif;
  }

  .bottom-text {
    position: absolute;
    bottom: 70px;
    right: 20px;
    z-index: 3;
    text-align: right;
    color: #3a2a1a;
    font-size: 11px;
    line-height: 1.5;
    font-style: italic;
    max-width: 230px;
  }

  .faith-banner {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 3;
    background: #e2772c;
    color: #fdf6ec;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 7px 12px;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="poster">

    <!-- Background watercolor art -->
    <div class="bg-placeholder">[Watercolor splotch illustration: center, abstract brown/orange shapes]</div>

    <!-- Top left info -->
    <div class="top-left">
      <div class="date">11/07</div>
      <div class="designer">DESIGNED BY<br>KERRLEE</div>
    </div>

    <!-- Top right title -->
    <div class="top-right">
      <div class="en1">BRIFE IS LIFE</div>
      <div class="en2">BUT LOVE IS LONG</div>
      <div class="cn">
        你要知道生命虽短，但爱却很长<br>
        爱你三千遍
      </div>
    </div>

    <!-- Vertical left large text -->
    <div class="vertical-left-text">
      <div class="v-col line1">I LOVE YOU</div>
      <div class="v-col line2">THREE THOUSAND</div>
    </div>

    <!-- Vertical right small text -->
    <div class="vertical-right-text">AUGENSTERN</div>

    <!-- Bottom quote -->
    <div class="bottom-text">
      Life was like a box of chocolates,<br>
      you never know what you are gonna get.
    </div>

    <!-- Bottom banner -->
    <div class="faith-banner">
      YOU GOTTA HAVE LITTLE FAITH
    </div>

  </div>
</body>
</html>
