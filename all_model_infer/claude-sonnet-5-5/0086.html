<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Should Be Less Than 40%</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #3e5c54, #6b8f87);
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }

  .title-bar {
    background: linear-gradient(to bottom, #a9d6e5, #4a8fa8);
    padding: 20px 40px;
    margin: 20px 60px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
  }

  .title-bar h1 {
    color: #ffff00;
    font-size: 42px;
    font-weight: bold;
    margin: 0;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    letter-spacing: 1px;
  }

  .content-box {
    background-color: #ffffff;
    width: 730px;
    height: 390px;
    margin: 60px auto;
    padding: 30px 60px;
    box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
    position: relative;
  }

  .formula-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-top: 40px;
    margin-bottom: 60px;
  }

  .pta-label {
    color: #1a1aff;
    font-size: 28px;
    font-weight: bold;
    margin-right: 20px;
  }

  .fraction {
    display: inline-block;
    text-align: center;
    margin-right: 40px;
  }

  .fraction .numerator {
    color: #1a1aff;
    font-size: 26px;
    font-weight: bold;
    padding-bottom: 4px;
  }

  .fraction .bar {
    border-top: 3px solid #1a1aff;
    width: 180px;
    margin: 0 auto;
  }

  .fraction .denominator {
    color: #1a1aff;
    font-size: 26px;
    font-weight: bold;
    padding-top: 4px;
  }

  .less-than {
    color: #cc0000;
    font-size: 26px;
    font-weight: bold;
  }

  .definitions {
    margin-top: 10px;
  }

  .definitions p {
    color: #1a1aff;
    font-size: 24px;
    font-weight: bold;
    margin: 18px 0;
  }
</style>
</head>
<body>

  <div class="title-bar">
    <h1>PTA SHOULD BE LESS THAN 40 %</h1>
  </div>

  <div class="content-box">
    <div class="formula-row">
      <span class="pta-label">PTA =</span>
      <span class="fraction">
        <span class="numerator">(FT + AD)</span>
        <span class="bar"></span>
        <span class="denominator">CCT</span>
      </span>
      <span class="less-than">&lt; 40%</span>
    </div>

    <div class="definitions">
      <p>FT = flap thickness</p>
      <p>AD = ablation depth</p>
      <p>CCT = central corneal thickness</p>
    </div>
  </div>

</body>
</html>
