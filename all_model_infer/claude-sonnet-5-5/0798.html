<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新手佩戴水晶常见30个问题</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #000;
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .poster {
    width: 540px;
    min-height: 740px;
    background: #fdf9f0;
    border: 4px solid #000;
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px #888, 0 0 20px rgba(255,255,255,0.1);
    padding: 25px 28px 35px 28px;
    position: relative;
  }
  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    background: repeating-linear-gradient(45deg, #333, #333 2px, #888 2px, #888 4px);
  }
  .title-block {
    text-align: center;
    margin-bottom: 8px;
  }
  .title-block h1 {
    font-size: 30px;
    color: #a0210f;
    margin: 0;
    letter-spacing: 2px;
    font-weight: 900;
    text-shadow: 1px 1px 0 #000;
  }
  .title-block h2 {
    font-size: 30px;
    margin: 2px 0 0 0;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #000;
  }
  .title-block h2 .black { color: #111; }
  .title-block h2 .orange { color: #c0400a; }

  .divider {
    text-align: center;
    margin: 10px 0 18px 0;
    color: #c0400a;
    font-size: 20px;
  }
  .divider .line {
    display: inline-block;
    width: 60px;
    height: 1px;
    background: #c0400a;
    vertical-align: middle;
    margin: 0 8px;
  }

  .qa-section {
    margin-bottom: 18px;
  }
  .question {
    font-size: 18px;
    font-weight: bold;
    color: #111;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-style: italic;
  }
  .icon-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #555;
    text-align: center;
    border: 1px solid #ccc;
    flex-shrink: 0;
  }
  .icon-yellow {
    background: radial-gradient(circle at 35% 35%, #fff5c0, #e8b93a 70%, #c99a1f);
  }
  .icon-red {
    background: radial-gradient(circle at 35% 35%, #ffb3b3, #c23b2a 70%, #8c1f12);
  }
  .icon-pink {
    background: radial-gradient(circle at 35% 35%, #ffffff, #f2c9c0 70%, #d89a8a);
  }
  .icon-redmix {
    background: radial-gradient(circle at 35% 35%, #ffffff, #c23b2a 50%, #7a1a10 80%);
  }

  .answer-line {
    font-size: 15px;
    color: #222;
    line-height: 1.9;
    margin-left: 2px;
  }
  .answer-line .num {
    display: inline-block;
    width: 16px;
    height: 16px;
    background: #c0400a;
    color: #fff;
    text-align: center;
    line-height: 16px;
    border-radius: 50%;
    font-size: 11px;
    margin-right: 4px;
  }
  .plain-text {
    font-size: 15px;
    color: #222;
    line-height: 1.9;
  }
</style>
</head>
<body>
<div class="poster">

  <div class="title-block">
    <h1>新手佩戴水晶</h1>
    <h2><span class="black">常见</span><span class="orange">30</span><span class="black">个问题</span></h2>
  </div>

  <div class="divider">
    <span class="line"></span>&#10022;&#9670;&#10022;<span class="line"></span>
  </div>

  <!-- Q1 -->
  <div class="qa-section">
    <div class="question">
      Q:水晶戴左手还是右手？
      <span class="icon-circle icon-yellow"></span>
    </div>
    <div class="answer-line"><span class="num">1</span>黄水晶、草莓晶、紫水晶、海蓝宝、粉晶、<br>月光石、萤石等常佩戴在左手；</div>
    <div class="answer-line"><span class="num">2</span>黑/银曜石、白水晶、虎眼石等常佩戴在右手。</div>
  </div>

  <!-- Q2 -->
  <div class="qa-section">
    <div class="question">
      Q:哪些水晶不能碰水？
    </div>
    <div class="plain-text">
      太阳石、方解石、萤石、孔雀石、天青石<br>
      青金石、海纹石、月光石、天河石、绿松石<br>
      蓝铜矿、蓝晶石、堇青石、紫龙晶、紫锂辉石<br>
      透石膏、灰月光、赤铁矿、紫锂云母
    </div>
  </div>

  <!-- Q3 -->
  <div class="qa-section">
    <div class="question">
      Q:水晶怎么消磁？
      <span class="icon-circle icon-pink"></span>
    </div>
    <div class="plain-text">
      碎石消磁、海盐消磁、鼠尾草消磁、月光消磁<br>
      流水消磁
    </div>
  </div>

  <!-- Q4 -->
  <div class="qa-section">
    <div class="question">
      Q:不佩戴水晶的时候放哪里？
      <span class="icon-circle icon-redmix"></span>
    </div>
    <div class="answer-line"><span class="num">1</span>可以放在装有消磁石的盒子里存放起来；</div>
    <div class="answer-line"><span class="num">2</span>可以放在水晶簇或水晶洞里面；</div>
    <div class="answer-line"><span class="num">3</span>可以放一个软布在木盒，然后将水晶放里面。</div>
  </div>

</div>
</body>
</html>
