<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖 昨表帖 - 書法手卷</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #cbbfa9;
    display: flex;
    justify-content: center;
  }
  .page {
    background: #d9cdb8;
    background-image: linear-gradient(rgba(255,255,255,0.05), rgba(0,0,0,0.03));
    width: 560px;
    min-height: 1100px;
    padding: 40px 20px 60px 20px;
    box-sizing: border-box;
    position: relative;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
  .columns {
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-start;
    align-items: flex-start;
    gap: 6px;
  }
  .col {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: 2px;
    color: #1a1a1a;
    white-space: pre-line;
  }
  .col.title {
    font-size: 15px;
    color: #333;
    margin-top: 10px;
  }
  .col.small {
    font-size: 15px;
    color: #222;
    margin-top: 40px;
  }
  .seals {
    writing-mode: vertical-rl;
    margin-top: 10px;
  }
  .seal {
    width: 22px;
    height: 22px;
    border: 1.5px solid #c0392b;
    color: #c0392b;
    font-size: 10px;
    text-align: center;
    line-height: 22px;
    margin: 6px 0;
    background: rgba(255,0,0,0.05);
  }
  .placeholder {
    border: 1px dashed #999;
    background: #eee;
    color: #777;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
</style>
</head>
<body>
<div class="page">
  <div class="columns">

    <!-- Rightmost small title column -->
    <div class="col title">祥除帖　昨表帖</div>

    <!-- Main body columns, right to left order -->
    <div class="col">臣廣言臣祥除以復五日窮思永遠肝心寸截甘雪應時嚴寒奉被</div>
    <div class="col">手詔伏承聖體御膳勝常以慰下情臣故患匆涕氣上頓之匆慈</div>
    <div class="col">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廣誠惶頓首</div>
    <div class="col">頓首死罪死罪　臣廣言昨表不宣奉賜手詔伏承聖體勝常以</div>
    <div class="col">慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀</div>
    <div class="col">悁存益勞聖心謹附承動靜臣廣言</div>

    <!-- Leftmost small signature column -->
    <div class="col small">歲在癸卯耆耀陽書於未央雲舍</div>

    <!-- Seals under the signature column -->
    <div class="seals">
      <div class="seal">甘</div>
      <div class="seal">[?]</div>
    </div>

  </div>
</div>
</body>
</html>
