<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语C术语解释</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    background-color: #ffffff;
    color: #222;
    margin: 0;
    padding: 20px 30px;
    font-size: 17px;
    line-height: 1.7;
    max-width: 600px;
  }
  .term {
    font-weight: bold;
    margin-top: 14px;
    margin-bottom: 2px;
  }
  .definition {
    margin: 0 0 4px 0;
  }
</style>
</head>
<body>

  <div class="term">审核：</div>
  <div class="definition">指进入语c群时，被群主审看人设、皮气等行为。</div>

  <div class="term">新人：</div>
  <div class="definition">指初入某个圈子的人。</div>

  <div class="term">纯白：</div>
  <div class="definition">完全不了解语c的人或刚接触语c。</div>

  <div class="term">小白：</div>
  <div class="definition">指出入语c圈或对语c一无所知的人。</div>

  <div class="term">小窗：</div>
  <div class="definition">指聊天会话的窗口（与QQ的私聊差不多）</div>

  <div class="term">隔壁：</div>
  <div class="definition">指代另一个地方（隔壁群，隔壁平台）</div>

  <div class="term">首页：</div>
  <div class="definition">在语c平台中，上皮发言互动的地方。</div>

  <div class="term">水区：</div>
  <div class="definition">在语c平台中，皮下发言探讨问题或闲聊的地方。</div>

  <div class="term">扩列：</div>
  <div class="definition">扩充列表，即加好友的意思。</div>

  <div class="term">掌控：</div>
  <div class="definition">指开戏文字超过七百一段的人。</div>

  <div class="term">字控：</div>
  <div class="definition">夸张手法，指一次开几个字为一段的人。</div>

  <div class="term">句控：</div>
  <div class="definition">指开戏只开一行～三行为一段的人。</div>

</body>
</html>
