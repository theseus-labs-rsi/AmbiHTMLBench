<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一月-任务</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding: 20px 30px;
  }
  h1 {
    font-size: 26px;
    font-weight: bold;
    margin: 0 0 20px 0;
    color: #111;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #333;
    padding: 6px 8px;
    text-align: center;
  }
  thead th {
    background-color: #d9ead3;
    font-weight: bold;
  }
  td.task-desc {
    color: #1f6fb2;
    font-weight: bold;
  }
  td.left-align {
    text-align: center;
  }
  colgroup col:nth-child(1) { width: 6%; }
  colgroup col:nth-child(2) { width: 14%; }
  colgroup col:nth-child(3) { width: 10%; }
  colgroup col:nth-child(4) { width: 28%; }
  colgroup col:nth-child(5) { width: 12%; }
  colgroup col:nth-child(6) { width: 30%; }
</style>
</head>
<body>

<h1>一月-任务</h1>

<table>
  <colgroup>
    <col><col><col><col><col><col>
  </colgroup>
  <thead>
    <tr>
      <th>序号</th>
      <th>任务描述</th>
      <th>岗位</th>
      <th>操作动作</th>
      <th>开始时间</th>
      <th>备注</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>1</td>
      <td class="task-desc">租厂房</td>
      <td>总经理</td>
      <td>申请60w 租厂房</td>
      <td>1月1日</td>
      <td>花60w租A厂房</td>
    </tr>
    <tr>
      <td>2</td>
      <td class="task-desc">资质开发</td>
      <td>总经理</td>
      <td>P3资质开发</td>
      <td>1月1日</td>
      <td>申请20w 资质开发</td>
    </tr>
    <tr>
      <td>3</td>
      <td class="task-desc">批拨款</td>
      <td>财务</td>
      <td>批准</td>
      <td>1月1日</td>
      <td></td>
    </tr>
    <tr>
      <td>4</td>
      <td class="task-desc">支付管理费</td>
      <td>财务</td>
      <td>5w管理费</td>
      <td>1月1日</td>
      <td></td>
    </tr>
    <tr>
      <td>5</td>
      <td class="task-desc">建设生产线</td>
      <td>生产</td>
      <td>4条自动线生产P3</td>
      <td>1月1日</td>
      <td>申请200w资金建线</td>
    </tr>
    <tr>
      <td>6</td>
      <td class="task-desc">iso开发</td>
      <td>总经理</td>
      <td>两个iso的开发</td>
      <td>1月1日</td>
      <td>申请资金开发</td>
    </tr>
  </tbody>
</table>

</body>
</html>
