<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回避行为</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #eeeeee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
  }

  .card-container {
    position: relative;
    width: 554px;
    height: 719px;
    background: #ffffff;
  }

  /* Right side notched blue border effect */
  .card-border {
    position: absolute;
    top: 0;
    right: 0;
    width: 18px;
    height: 100%;
    background: #2a3f8f;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 10%, 60% 14%, 100% 18%,
      100% 48%, 60% 52%, 100% 56%,
      100% 86%, 60% 90%, 100% 94%,
      100% 100%, 0% 100%
    );
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 10px;
    background: #2a3f8f;
  }

  .content {
    padding: 60px 40px 40px 40px;
    box-sizing: border-box;
  }

  .number {
    font-size: 56px;
    font-weight: 900;
    color: #111111;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
  }

  .title {
    font-size: 48px;
    font-weight: 900;
    color: #111111;
    margin: 0 0 70px 0;
    letter-spacing: 2px;
  }

  .bold-text {
    font-size: 23px;
    font-weight: 700;
    color: #111111;
    line-height: 1.6;
    margin: 0 0 30px 0;
  }

  .body-text {
    font-size: 21px;
    font-weight: 400;
    color: #111111;
    line-height: 1.7;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="card-container">
    <div class="top-bar"></div>
    <div class="card-border"></div>

    <div class="content">
      <div class="number">03</div>
      <div class="title">回避行为</div>

      <div class="bold-text">
        自觉或不自觉地回避曾经的某些人、<br>
        事、物。
      </div>

      <div class="body-text">
        比如，学生时代受过伤，可能回避同<br>
        学聚会，不再听某些歌、看某些电影、<br>
        去某家餐厅……
      </div>
    </div>
  </div>

</body>
</html>
