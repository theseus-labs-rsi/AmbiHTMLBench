<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一张图搞定HMO</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: repeating-linear-gradient(0deg, #eaf6fb, #eaf6fb 28px, #e3f2f8 28px, #e3f2f8 30px);
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 540px;
    min-height: 720px;
    background: repeating-linear-gradient(0deg, #eaf6fb, #eaf6fb 28px, #e0f1f7 28px, #e0f1f7 30px);
    border: 2px solid #4fc3e8;
    border-radius: 18px;
    box-sizing: border-box;
    padding: 18px 22px 30px 22px;
    position: relative;
    overflow: hidden;
  }

  .title-wrapper {
    position: relative;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 18px;
  }

  .title {
    display: inline-block;
    background: #ff4b4b;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    padding: 10px 30px;
    border-radius: 25px;
    letter-spacing: 1px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
  }

  .clip {
    position: absolute;
    left: 50%;
    top: -14px;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 3px solid #999;
    background: #fff;
  }

  .cow {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 70px;
    height: 70px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
    color: #999;
    border: 1px solid #ddd;
  }

  .intro-box {
    background: #cfeef5;
    border: 2px solid #4fc3e8;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.9;
    color: #333;
    margin-bottom: 22px;
    text-align: justify;
  }

  .highlight {
    color: #ff6a3d;
    font-weight: bold;
  }

  .section {
    margin-bottom: 22px;
  }

  .section-title {
    background: #ff9f3e;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 18px;
    display: inline-block;
    margin-bottom: 10px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
  }

  .superscript {
    font-size: 11px;
    vertical-align: super;
  }

  .section-body {
    background: #fdf1e6;
    border: 2px dashed #ff9f3e;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #444;
    text-align: center;
  }

  .section-body.left-align {
    text-align: left;
  }

  .footer-space {
    height: 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-wrapper">
    <div class="clip"></div>
    <div class="title">一张图搞定HMO</div>
  </div>

  <div class="cow placeholder">[图:牛的卡通头像]</div>

  <div class="intro-box">
    HMO-中文“母乳低聚糖”，是源乳中的第一大免疫
    活性营养，而且含量还是乳铁蛋白的<span class="highlight">10倍<span class="superscript">7</span></span>，在牛乳、
    羊乳中都没有这个成分，被誉为“乳黄金”。
  </div>

  <div class="section">
    <div class="section-title">HMO具有调节肠道菌群平衡作用<span class="superscript">3-6</span></div>
    <div class="section-body left-align">
      肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自
      于肠道，因此呵护好宝宝肠道对提升保护力非常重要。
      而HMO可以促进有益菌生长，提高保护力。
    </div>
  </div>

  <div class="section">
    <div class="section-title">HMO为宝宝建立一道健康防护屏障<span class="superscript">5-6</span></div>
    <div class="section-body">
      HMO能够为宝宝建立一道健康防护屏障，
      防止有害菌侵扰。
    </div>
  </div>

  <div class="section">
    <div class="section-title">HMO激发免疫系统，提高宝宝保护力<span class="superscript">6</span></div>
    <div class="section-body">
      HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝
      保护力，增强宝宝体质。<span class="superscript">7-8</span>
    </div>
  </div>

  <div class="footer-space"></div>

</div>
</body>
</html>
