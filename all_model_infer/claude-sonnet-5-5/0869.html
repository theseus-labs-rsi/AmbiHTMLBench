<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.语法 - 笔记</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #8fb79f;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .page {
    width: 540px;
    min-height: 760px;
    background-color: #8fb79f;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
  }

  .notebook {
    position: relative;
    background-color: #fdfdf6;
    background-image:
      linear-gradient(to right, rgba(200,200,180,0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(200,200,180,0.35) 1px, transparent 1px);
    background-size: 22px 22px;
    border-radius: 6px;
    padding: 50px 30px 40px 30px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .holes {
    position: absolute;
    top: -14px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 0 18px;
  }

  .hole {
    width: 20px;
    height: 20px;
    background-color: #8fb79f;
    border-radius: 50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.2) inset;
  }

  h1.title {
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    color: #333;
    margin: 10px 0 30px 0;
    letter-spacing: 2px;
    font-family: "Comic Sans MS", "Microsoft YaHei", sans-serif;
  }

  .para {
    font-size: 15px;
    line-height: 2.0;
    color: #333;
    text-align: justify;
    text-indent: 2em;
    margin: 0 0 26px 0;
    position: relative;
  }

  .star {
    position: absolute;
    font-size: 18px;
    color: #f5c518;
  }

  .star1 { top: 55px; left: -5px; transform: rotate(-10deg); }
  .star2 { top: 10px; right: 90px; color: #f5c518; }
  .star3 { bottom: -10px; left: 20px; }

  .flower-placeholder {
    position: absolute;
    bottom: 10px;
    right: 15px;
    width: 55px;
    height: 55px;
  }

  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #c97b8a;
    text-align: center;
    border: none;
  }

</style>
</head>
<body>
  <div class="page">
    <div class="notebook">
      <div class="holes">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
      </div>

      <h1 class="title">4.语法</h1>

      <div class="para" style="position:relative;">
        <span class="star" style="position:absolute; left:-20px; top:60px; font-size:16px; color:#f5c518;">☆</span>
        语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。
      </div>

      <div class="para" style="position:relative;">
        <span style="position:absolute; right:-10px; top:35px; font-size:20px; color:#f5c518;">☆</span>
        虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。
      </div>

      <div class="para">
        学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。
      </div>

      <div class="para" style="position:relative; margin-bottom:60px;">
        <span style="position:absolute; left:-5px; bottom:-15px; font-size:18px; color:#f5c518;">☆</span>
        零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。
      </div>

      <div class="flower-placeholder">
        <div class="placeholder">[Illustration: flower, bottom-right]</div>
      </div>
    </div>
  </div>
</body>
</html>
