<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 546px;
    min-height: 720px;
    background: #ffffff;
    position: relative;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    padding-bottom: 30px;
  }
  .rings {
    display: flex;
    justify-content: center;
    gap: 22px;
    padding-top: 10px;
    padding-bottom: 6px;
  }
  .ring {
    width: 18px;
    height: 18px;
    border: 3px solid #cfcfcf;
    border-radius: 50%;
    box-sizing: border-box;
  }
  .tab {
    position: absolute;
    top: 55px;
    left: 0;
    width: 48px;
    height: 100px;
    background: linear-gradient(135deg, #e8438a 0%, #8a2a4a 60%, #2a2a2a 100%);
    color: #fff;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 4px;
    border-radius: 2px;
  }
  .title-block {
    text-align: center;
    margin-top: 10px;
  }
  .title-block h1 {
    font-size: 28px;
    margin: 10px 0 6px 0;
    letter-spacing: 2px;
    color: #111;
  }
  .title-block .sub {
    font-size: 13px;
    color: #555;
    margin-bottom: 10px;
  }
  .section {
    display: flex;
    align-items: flex-start;
    margin: 40px 45px 0 45px;
    gap: 20px;
  }
  .icon-box {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #111;
    border-radius: 8px;
    font-weight: bold;
    font-size: 13px;
    position: relative;
  }
  .sd-icon {
    width: 40px;
    height: 54px;
    border: 3px solid #111;
    border-radius: 4px 10px 4px 4px;
    position: relative;
  }
  .sd-icon::before {
    content: "";
    position: absolute;
    top: -3px;
    left: -3px;
    width: 14px;
    height: 10px;
    background: #fff;
    border-right: 3px solid #111;
    border-bottom: 3px solid #111;
  }
  .sd-icon::after {
    content: "";
    position: absolute;
    bottom: 6px;
    left: 6px;
    width: 24px;
    height: 3px;
    background: #111;
    box-shadow: 0 6px 0 #111, 0 12px 0 #111;
  }
  .cpu-icon {
    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .cpu-icon .legs {
    position: absolute;
    width: 100%;
    height: 100%;
  }
  .text-col {
    flex: 1;
  }
  .text-col h2 {
    font-size: 18px;
    margin: 0 0 10px 0;
    color: #111;
  }
  .text-col p {
    font-size: 14px;
    color: #333;
    line-height: 1.7;
    margin: 0;
  }
  .fourk-icon {
    width: 56px;
    height: 56px;
    border: 3px solid #111;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="page">
  <div class="rings">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="ring"></div>
  </div>

  <div class="tab">第一步</div>

  <div class="title-block">
    <h1>三大核心参数解读</h1>
    <div class="sub">内存/芯片/分辨率参数解读</div>
  </div>

  <div class="section">
    <div class="sd-icon"></div>
    <div class="text-col">
      <h2>1.看内存</h2>
      <p>内存越大速度越快，小于8GB不建议购买。（画圈：<br>
      GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）</p>
    </div>
  </div>

  <div class="section">
    <div class="icon-box cpu-icon">CPU</div>
    <div class="text-col">
      <h2>2.看芯片</h2>
      <p>主流芯片A73和A53。追求性能玩游戏选A73，看<br>
      看电视想省电选A53。</p>
    </div>
  </div>

  <div class="section">
    <div class="fourk-icon">4K<br>UHD</div>
    <div class="text-col">
      <h2>3.看分辨率</h2>
      <p>分辨率越高越清晰。（目前电视基本都是超高清4K<br>
      也就是3840×2160的分辨率）</p>
    </div>
  </div>

</div>
</body>
</html>
