<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固化的做题思维 - 2017年12月第一套 Text 1</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #ccc;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .device-frame {
    width: 540px;
    height: 400px;
    background: #000;
    border-radius: 18px;
    padding: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    position: relative;
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  .status-bar {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 11px;
    color: #444;
  }

  .webcam {
    position: absolute;
    top: 0;
    right: 0;
    width: 100px;
    height: 80px;
    background: linear-gradient(135deg, #3a2f2a, #5a4a40);
    border: 1px solid #999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #eee;
    text-align: center;
    overflow: hidden;
  }

  .content {
    position: absolute;
    top: 30px;
    left: 30px;
    right: 30px;
    bottom: 10px;
    font-size: 13px;
    color: #000;
    line-height: 1.8;
  }

  .line1 {
    margin-bottom: 4px;
  }

  .item1 {
    margin-bottom: 10px;
  }

  .title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 18px 0 14px 0;
    color: #000;
  }

  .row2 {
    display: flex;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .red-text {
    color: #cc0000;
  }

  .underline-red {
    text-decoration: underline;
    text-decoration-color: #cc0000;
    color: #cc0000;
  }

  .note {
    color: #000;
    margin-left: 10px;
    font-size: 13px;
  }

  .row34 {
    display: flex;
    justify-content: space-between;
    margin-right: 10px;
  }

  .left-col {
    width: 55%;
  }

  .right-col {
    width: 40%;
    color: #cc0000;
  }

  .sub-note {
    margin-left: 20px;
    color: #cc0000;
    font-size: 12px;
    margin-top: 2px;
  }

  .item5 {
    margin-top: 6px;
  }

  .placeholder {
    width: 100px;
    height: 80px;
    background: #444;
    color: #ccc;
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
</style>
</head>
<body>

<div class="device-frame">
  <div class="screen">
    <div class="status-bar">19:29&nbsp;&nbsp;5月14日周五</div>

    <div class="webcam">
      [Photo: person on video call,<br>bookshelf background]
    </div>

    <div class="content">
      <div class="line1">固化的做题思维：</div>

      <div class="item1">1. 喜欢忠于自己的内心和感觉。</div>

      <div class="title">2017年 12月第一套 Text 1</div>

      <div class="row2">
        <span class="underline-red">2. 喜欢选符合常识的选项。</span>
        <span class="note">&nbsp;&nbsp;20年左右的常识和经验的累积</span>
      </div>

      <div class="row34">
        <div class="left-col">3.&nbsp;&nbsp;喜欢选自己认识的选项。</div>
        <div class="right-col">6. 囫囵吞枣选择法</div>
      </div>

      <div class="row34">
        <div class="left-col">4. 喜欢选自己不认识的选项。</div>
        <div class="right-col" style="margin-left:10px;">（有逃避，有厌烦）</div>
      </div>

      <div class="item5">5. 火急火燎一把火</div>
    </div>
  </div>
</div>

</body>
</html>
