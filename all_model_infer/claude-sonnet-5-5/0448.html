<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际博物馆日 International Museum Day</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e8e2d4;
    display: flex;
    justify-content: center;
  }
  .poster {
    position: relative;
    width: 440px;
    height: 620px;
    background: #e9e3d6;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(180,170,140,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(180,170,140,0.15) 0%, transparent 40%);
    overflow: hidden;
    font-family: "Noto Serif SC", "SimSun", serif;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  /* Top right vertical text */
  .top-right-vertical {
    position: absolute;
    top: 10px;
    right: 18px;
    writing-mode: vertical-rl;
    font-size: 15px;
    color: #4a4030;
    letter-spacing: 4px;
    font-weight: bold;
  }

  .stamp {
    position: absolute;
    top: 22px;
    right: 65px;
    width: 42px;
    height: 42px;
    background: #8a2e2e;
    color: #f0e6d8;
    writing-mode: vertical-rl;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 1px solid #5c1c1c;
    letter-spacing: 2px;
  }

  /* Title block */
  .title-block {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 230px;
  }
  .title-cn-small {
    font-size: 15px;
    color: #4a4030;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .title-en {
    font-size: 15px;
    color: #4a4030;
    font-weight: bold;
    line-height: 1.1;
    margin-top: 2px;
  }
  .title-cn-big {
    font-size: 36px;
    color: #4a4030;
    font-weight: bold;
    line-height: 1.15;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Left vertical date block */
  .date-block {
    position: absolute;
    top: 215px;
    left: 20px;
    font-size: 13px;
    color: #3a3225;
    line-height: 1.6;
  }
  .date-block .dot {
    color: #3a3225;
    font-size: 16px;
  }
  .date-num {
    font-size: 26px;
    font-weight: bold;
    margin: 2px 0;
  }
  .date-sub {
    writing-mode: vertical-rl;
    font-size: 14px;
    margin-top: 10px;
    letter-spacing: 6px;
    color: #3a3225;
  }

  /* Right vertical description paragraph */
  .desc-block {
    position: absolute;
    top: 55px;
    right: 15px;
    width: 160px;
    height: 350px;
    writing-mode: vertical-rl;
    font-size: 9px;
    color: #4a4030;
    line-height: 1.6;
    letter-spacing: 1px;
    text-align: left;
  }

  /* Main vessel placeholder */
  .vessel-main {
    position: absolute;
    top: 150px;
    left: 110px;
    width: 230px;
    height: 330px;
    background: repeating-linear-gradient(135deg, #6f8a7a, #6f8a7a 10px, #5d7568 10px, #5d7568 20px);
    border: 1px solid #3f5347;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #eef3ef;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  /* Small vessel icon */
  .vessel-small {
    position: absolute;
    top: 420px;
    left: 20px;
    width: 55px;
    height: 70px;
    background: repeating-linear-gradient(135deg, #6f8a7a, #6f8a7a 6px, #5d7568 6px, #5d7568 12px);
    border: 1px solid #3f5347;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eef3ef;
    font-size: 8px;
    text-align: center;
  }

  /* Bottom text left */
  .bottom-left {
    position: absolute;
    bottom: 25px;
    left: 20px;
    color: #4a4030;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.5;
  }
  .bottom-left .en {
    font-size: 15px;
    letter-spacing: 1px;
  }

  /* Bottom text right */
  .bottom-right {
    position: absolute;
    bottom: 25px;
    right: 20px;
    color: #4a4030;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.5;
    text-align: left;
  }
  .bottom-right .en {
    font-size: 15px;
    letter-spacing: 1px;
  }

  .placeholder-caption {
    padding: 4px;
  }
</style>
</head>
<body>
  <div class="poster">

    <!-- Top right vertical decorative text -->
    <div class="top-right-vertical">穿越千古<br>追梦今古</div>
    <div class="stamp">重现<br>塑复</div>

    <!-- Title Block -->
    <div class="title-block">
      <div class="title-en">International<br>Museum<br>Day</div>
      <div class="title-cn-big">国际<br>博物馆日</div>
    </div>

    <!-- Date Block -->
    <div class="date-block">
      <div><span class="dot">●</span> 时间:</div>
      <div class="date-num">2021</div>
      <div class="date-num" style="font-size:22px;">5<span style="font-size:14px;">/18</span></div>
      <div class="date-sub">一处处文情物怀</div>
    </div>

    <!-- Description vertical text block (right side) -->
    <div class="desc-block">
      国际博物馆日定于每年的5月18日，是国际博物馆协会于1977年建立的，其宗旨是促进世界博物馆事业的发展，推动社会大众对博物馆的认识，参观各类博物馆，让博物馆走进大众生活，并每年为国际博物馆日拟订一个年度活动主题。今年是第19个国际博物馆日。
    </div>

    <!-- Main Vessel Placeholder -->
    <div class="vessel-main">
      <span class="placeholder-caption">[Photo: Ancient Bronze Vessel, centered]</span>
    </div>

    <!-- Small vessel icon placeholder -->
    <div class="vessel-small">
      <span class="placeholder-caption">[Icon: small vessel]</span>
    </div>

    <!-- Bottom Left Text -->
    <div class="bottom-left">
      与历史相遇<br>
      <span class="en">MING</span><br>
      明兴亡
    </div>

    <!-- Bottom Right Text -->
    <div class="bottom-right">
      打开时代<br>
      <span class="en">DE</span><br>
      任意门
    </div>

  </div>
</body>
</html>
