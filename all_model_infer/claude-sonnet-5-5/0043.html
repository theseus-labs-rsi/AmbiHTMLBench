<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .header {
    background: #f05a28;
    position: relative;
    padding: 18px 25px 30px 25px;
    height: 150px;
  }
  .copyright {
    color: #fff;
    font-size: 18px;
    border: 2px solid #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 18px;
    left: 25px;
  }
  .year {
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    position: absolute;
    top: 20px;
    right: 25px;
  }
  .dots {
    position: absolute;
    top: 50px;
    left: 25px;
    color: #fff;
    font-size: 10px;
    line-height: 11px;
    letter-spacing: 2px;
  }
  .title {
    color: #111;
    font-size: 48px;
    font-weight: 900;
    position: absolute;
    top: 48px;
    left: 70px;
    letter-spacing: 2px;
  }
  .stamp {
    position: absolute;
    bottom: 10px;
    right: 25px;
    color: #f05a28;
    background: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
  }

  .intro {
    padding: 18px 25px 10px 25px;
    font-size: 11px;
    color: #333;
    line-height: 1.8;
  }

  .card {
    margin: 15px 25px;
    border: 1.5px solid #f05a28;
    border-radius: 12px;
    padding: 15px 18px 18px 18px;
    position: relative;
  }

  .card-title {
    font-size: 17px;
    font-weight: bold;
    color: #111;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
  }

  .spark {
    color: #f05a28;
    font-size: 15px;
    margin-left: 6px;
  }

  .placeholder {
    width: 100%;
    height: 140px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0,0,0,0.3);
    font-size: 11px;
    font-style: italic;
  }

  .card-desc {
    font-size: 10.5px;
    color: #333;
    line-height: 1.8;
    margin-top: 10px;
  }

  /* Card 1 colors: green left, yellow middle blob, blue right */
  .blob1 {
    background: linear-gradient(to right,
      #1f9d55 0%, #1f9d55 22%,
      #f5e000 22%, #f5e000 70%,
      #1565c0 70%, #1565c0 100%);
  }
  .blob1::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 15%;
    width: 60%;
    height: 140%;
    background: #f5e000;
    border-radius: 50% 40% 60% 50% / 60% 50% 50% 40%;
  }

  /* Card 2 colors: green-yellow left, black blob middle, pink/red right */
  .blob2 {
    background: linear-gradient(to right,
      #8bc63e 0%, #8bc63e 25%,
      #111111 25%, #111111 70%,
      #f4134f 70%, #f4134f 100%);
  }
  .blob2::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 18%;
    width: 55%;
    height: 140%;
    background: #111111;
    border-radius: 55% 45% 50% 60% / 50% 60% 45% 55%;
  }

</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="copyright">&copy;</div>
    <div class="year">2023</div>
    <div class="dots">
      ◆<br>◆<br>◆<br>◆<br>◆<br>◆
    </div>
    <div class="title">对比色配色</div>
    <div class="stamp">瑞</div>
  </div>

  <div class="intro">
    对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都
    使用对比强烈的色彩，所以配色清晰而有力。
  </div>

  <div class="card">
    <div class="card-title">富有朝气的配色 <span class="spark">✦</span></div>
    <div class="placeholder blob1"></div>
    <div class="card-desc">
      以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
    </div>
  </div>

  <div class="card">
    <div class="card-title">视觉冲击强烈的配色 <span class="spark">✦</span></div>
    <div class="placeholder blob2"></div>
    <div class="card-desc">
      黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，
      视觉冲击强烈。
    </div>
  </div>

</div>
</body>
</html>
