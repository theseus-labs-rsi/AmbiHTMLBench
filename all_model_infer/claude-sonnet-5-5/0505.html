<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧生旦净末丑艺术节</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #f3f3f3;
    display: flex;
    justify-content: center;
    font-family: "SimSun","STSong","Microsoft YaHei",serif;
  }
  .poster {
    position: relative;
    width: 1200px;
    height: 1920px;
    background: #ffffff;
    overflow: hidden;
  }

  /* Circled characters column */
  .circle-chars {
    position: absolute;
    top: 130px;
    left: 85px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 5;
  }
  .circle-chars span {
    width: 58px;
    height: 58px;
    border: 2px solid #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
    color: #111;
  }

  /* Big title 京剧 */
  .title-main {
    position: absolute;
    top: 95px;
    left: 215px;
    font-size: 130px;
    font-weight: bold;
    color: #d81e2b;
    line-height: 1.05;
    letter-spacing: 4px;
    writing-mode: vertical-rl;
    z-index: 4;
  }

  /* 艺术节 vertical black text */
  .title-sub {
    position: absolute;
    top: 395px;
    left: 215px;
    font-size: 105px;
    font-weight: bold;
    color: #111;
    writing-mode: vertical-rl;
    letter-spacing: 6px;
    z-index: 4;
  }

  /* 稿定艺术展 small vertical text */
  .subtitle-small {
    position: absolute;
    top: 890px;
    left: 100px;
    font-size: 30px;
    color: #111;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
    z-index: 4;
  }

  /* Top right decoration */
  .topright {
    position: absolute;
    top: 115px;
    right: 65px;
    text-align: center;
    z-index: 5;
  }
  .dot-grid {
    display: grid;
    grid-template-columns: repeat(3, 14px);
    grid-template-rows: repeat(3, 14px);
    gap: 4px;
    justify-content: center;
    margin: 0 auto 15px auto;
  }
  .dot-grid div {
    width: 14px;
    height: 14px;
    background: #d81e2b;
    transform: rotate(45deg);
  }
  .topright .roman {
    font-family: "Times New Roman", serif;
    font-weight: bold;
    font-size: 22px;
    color: #111;
    line-height: 1.5;
  }

  /* Geometric shapes */
  .pink-circle-big {
    position: absolute;
    top: 540px;
    left: 745px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #d9679a;
    z-index: 3;
  }
  .red-circle-big {
    position: absolute;
    top: 835px;
    left: 625px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: #d81e2b;
    z-index: 3;
  }
  .red-circle-small {
    position: absolute;
    top: 1480px;
    left: 710px;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #c21f2e;
    z-index: 3;
  }

  .black-triangle {
    position: absolute;
    top: 430px;
    left: 790px;
    width: 0;
    height: 0;
    border-left: 280px solid transparent;
    border-right: 280px solid transparent;
    border-bottom: 650px solid #111;
    z-index: 2;
  }

  .pink-mountain {
    position: absolute;
    top: 430px;
    right: -20px;
    width: 420px;
    height: 650px;
    background: linear-gradient(to bottom, #e37ca6, rgba(227,124,166,0));
    clip-path: polygon(0% 100%, 0% 40%, 15% 15%, 30% 35%, 45% 5%, 60% 30%, 75% 10%, 90% 32%, 100% 20%, 100% 100%);
    z-index: 1;
  }

  .small-pink-triangle {
    position: absolute;
    top: 875px;
    left: 980px;
    width: 0;
    height: 0;
    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-top: 35px solid #e37ca6;
    z-index: 3;
  }
  .small-black-triangle {
    position: absolute;
    top: 895px;
    left: 1020px;
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 30px solid #111;
    z-index: 4;
  }
  .small-pink-triangle2 {
    position: absolute;
    top: 1105px;
    right: 15px;
    width: 0;
    height: 0;
    border-left: 35px solid transparent;
    border-right: 35px solid transparent;
    border-top: 28px solid #e37ca6;
    z-index: 3;
  }

  .red-bar {
    position: absolute;
    top: 1080px;
    left: 865px;
    width: 70px;
    height: 690px;
    background: #d81e2b;
    z-index: 2;
  }

  .birds {
    position: absolute;
    top: 1490px;
    right: 55px;
    font-size: 26px;
    color: #111;
    z-index: 4;
    letter-spacing: 4px;
    line-height: 1.3;
    text-align: right;
  }

  /* Mountain scenery bottom */
  .mountain-scene {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 420px;
    z-index: 1;
  }
  .placeholder {
    border: 1px dashed #999;
    color: #777;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Text info block */
  .info-block {
    position: absolute;
    left: 85px;
    bottom: 300px;
    width: 700px;
    z-index: 6;
  }
  .info-line {
    font-size: 32px;
    color: #111;
    margin-bottom: 18px;
  }
  .info-line .label {
    letter-spacing: 2px;
  }
  .date-label {
    font-size: 18px;
    letter-spacing: 2px;
    color: #333;
    margin-bottom: 4px;
    font-family: "Times New Roman", serif;
  }
  .date-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
  }
  .date-row .big {
    font-size: 58px;
    font-weight: bold;
    font-family: "Times New Roman", serif;
    color: #111;
  }
  .date-row .small {
    font-size: 22px;
    font-family: "Times New Roman", serif;
    color: #111;
  }
  .date-row .slash {
    font-size: 40px;
    color: #111;
    margin: 0 6px;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Circled chars -->
  <div class="circle-chars">
    <span>生</span>
    <span>旦</span>
    <span>净</span>
    <span>末</span>
    <span>丑</span>
  </div>

  <!-- Titles -->
  <div class="title-main">京剧</div>
  <div class="title-sub">艺术节</div>
  <div class="subtitle-small">稿定艺术展</div>

  <!-- top right decoration -->
  <div class="topright">
    <div class="dot-grid">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>
    <div class="roman">Gao<br>Ding<br>Yi<br>Shu</div>
  </div>

  <!-- Geometric shapes -->
  <div class="pink-mountain"></div>
  <div class="black-triangle"></div>
  <div class="pink-circle-big"></div>
  <div class="red-circle-big"></div>
  <div class="small-pink-triangle"></div>
  <div class="small-black-triangle"></div>
  <div class="small-pink-triangle2"></div>
  <div class="red-bar"></div>
  <div class="red-circle-small"></div>

  <div class="birds">&#128033; &#128034; &#128034; &#128034;<br>&#128034; &#128034; &#128034; &#128034;</div>

  <!-- Mountain scenery placeholder -->
  <div class="mountain-scene placeholder">[Illustration: ink-wash mountains, bare trees, bottom of poster]</div>

  <!-- Info block -->
  <div class="info-block">
    <div class="info-line"><span class="label">主办方：</span>稿定集团</div>
    <div class="info-line"><span class="label">地点：</span>&nbsp;厦门市稿定剧院</div>
    <div class="date-label">DATE.</div>
    <div class="date-row">
      <span class="big">12.20</span><span class="small">SUN</span>
      <span class="slash">/</span>
      <span class="big">12.30</span><span class="small">SAT</span>
    </div>
    <div class="info-line"><span class="label">联系电话：</span>&nbsp;0592-8888888</div>
  </div>

</div>
</body>
</html>
