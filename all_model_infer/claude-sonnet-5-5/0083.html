<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬息之間 - Artist Photo Exhibition</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background-color: #c9c9c9;
    font-family: "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #111;
  }
  .poster {
    width: 1080px;
    min-height: 1443px;
    margin: 0 auto;
    background-color: #c9c9c9;
    position: relative;
    padding: 40px 36px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-left {
    display: flex;
    align-items: flex-start;
    gap: 30px;
  }
  .cn-title {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .en-title {
    font-size: 34px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 1px;
    padding-top: 2px;
  }
  .header-right {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.3;
    writing-mode: vertical-rl;
    text-orientation: upright;
  }

  .divider {
    border: none;
    border-top: 3px solid #111;
    margin: 30px 0 20px 0;
  }

  /* Main content */
  .main-block {
    position: relative;
    min-height: 920px;
  }

  .cn-big {
    font-size: 220px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -5px;
    position: absolute;
    top: 0;
    left: 0;
  }

  .en-big {
    font-size: 65px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 0px;
    position: absolute;
    top: 30px;
    right: 20px;
    text-align: left;
  }

  .artist-block {
    position: absolute;
    top: 350px;
    left: 0;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.5;
  }

  .date-block {
    position: absolute;
    top: 500px;
    left: 0;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .cn-big-2 {
    font-size: 260px;
    font-weight: 900;
    line-height: 0.9;
    position: absolute;
    top: 350px;
    right: 0;
    letter-spacing: -8px;
  }

  .divider2 {
    border: none;
    border-top: 3px solid #111;
    position: absolute;
    top: 900px;
    left: 0;
    width: 100%;
  }

  /* Quote */
  .quote {
    position: absolute;
    top: 970px;
    left: 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.7;
    letter-spacing: 1px;
    width: 600px;
  }

  /* Footer */
  .footer {
    position: absolute;
    top: 1120px;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    font-size: 17px;
    font-weight: 700;
    gap: 20px;
  }
  .footer .sep {
    color: #111;
  }

  .one-coffee {
    position: absolute;
    top: 1120px;
    right: 0;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  .placeholder {
    position: absolute;
    top: 1075px;
    right: 40px;
    width: 110px;
    height: 46px;
    background-color: #ffffff;
    border-radius: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #333;
    opacity: 0.9;
  }

  .redbook-id {
    position: absolute;
    top: 1095px;
    right: 150px;
    font-size: 20px;
    color: rgba(255,255,255,0.75);
    font-weight: 700;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="poster">

  <div class="header">
    <div class="header-left">
      <div class="cn-title">藝術<br>攝影展</div>
      <div class="en-title">ARTIST<br>PHOTO<br>EXHIBITION</div>
    </div>
    <div class="header-right">定格光影</div>
  </div>

  <hr class="divider">

  <div class="main-block">
    <div class="cn-big">瞬息</div>
    <div class="en-big">IN THE<br>BLINK OF<br>AN EYE</div>

    <div class="artist-block">
      藝術家<br>森蘭 王沐春
    </div>

    <div class="date-block">08/14</div>

    <div class="cn-big-2">之間</div>

    <hr class="divider2">

    <div class="quote">
      IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
      YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
      EVERYTHING IN MY MIND AS AN EXERCISE.
    </div>

    <div class="footer">
      <span>活動地址：濱江路西溪街二十七號</span>
      <span class="sep">|</span>
      <span>主辦單位：壹畫咖啡館</span>
    </div>

    <div class="one-coffee">ONE COFFEE</div>

    <div class="redbook-id">小红书号： heyu11221</div>

    <div class="placeholder">[Logo: 小红书]</div>

  </div>

</div>
</body>
</html>
