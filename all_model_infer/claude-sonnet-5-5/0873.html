<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精酿、原浆、鲜啤、生啤、扎啤、干啤、冰啤的区别</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #e9eefc 0%, #f3e9f8 100%);
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .page {
    width: 540px;
    min-height: 720px;
    position: relative;
    overflow: hidden;
  }
  .decor-circle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #cfe0ff, #b9c8f5 70%);
    opacity: 0.9;
  }
  .c1 { width: 90px; height: 90px; top: -30px; left: 10px; }
  .c2 { width: 60px; height: 60px; top: 10px; left: 110px; background: radial-gradient(circle at 30% 30%, #ffffff, #d7c9f0 70%);}
  .c3 { width: 120px; height: 120px; top: -50px; right: -40px; background: radial-gradient(circle at 30% 30%, #f3e7ff, #c9d4f7 70%);}
  .c4 { width: 40px; height: 40px; top: 70px; right: 60px; background: radial-gradient(circle at 30% 30%, #ffffff, #c9d9f7 70%);}

  .title {
    position: relative;
    z-index: 2;
    font-size: 26px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.4;
    padding: 70px 24px 20px 24px;
  }

  .card {
    position: relative;
    z-index: 2;
    margin: 0 18px 30px 18px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    padding: 26px 20px 30px 20px;
  }

  .section {
    display: flex;
    align-items: center;
    margin-bottom: 22px;
  }
  .section:last-child { margin-bottom: 0; }

  .label {
    flex: 0 0 90px;
    position: relative;
    margin-right: 14px;
  }
  .label-shape {
    background: #1c2340;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
    padding: 10px 6px;
    border-radius: 50% 40% 55% 45% / 55% 45% 55% 45%;
    line-height: 1.3;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
  }

  .rows {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pill {
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11.5px;
    font-weight: bold;
    white-space: nowrap;
    background: #fff;
    border: 1.6px solid currentColor;
  }

  .line {
    flex: 0 0 22px;
    height: 2px;
    background: currentColor;
  }

  .pill-right {
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    background: #fff;
    border: 1.6px solid currentColor;
  }

  .textbox {
    border: 1.6px solid currentColor;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 11px;
    font-weight: bold;
    line-height: 1.6;
    background: #fff;
    flex: 1;
  }

  .red    { color: #e23b3b; }
  .orange { color: #f0922a; }
  .blue   { color: #3a6fdc; }
  .green  { color: #4aa96c; }
  .purple { color: #9b59b6; }
  .darkblue { color: #2f55c4; }

</style>
</head>
<body>
<div class="page">

  <div class="decor-circle c1"></div>
  <div class="decor-circle c2"></div>
  <div class="decor-circle c3"></div>
  <div class="decor-circle c4"></div>

  <div class="title">
    精酿、原浆、鲜啤、生啤、<br>
    扎啤、干啤、冰啤的区别
  </div>

  <div class="card">

    <!-- Section 1: 啤酒原浆 -->
    <div class="section">
      <div class="label">
        <div class="label-shape">啤酒原浆</div>
      </div>
      <div class="rows">

        <div class="row red">
          <div class="pill">不杀菌+不滤清</div>
          <div class="line"></div>
          <div class="pill-right">原浆啤酒</div>
        </div>

        <div class="row orange">
          <div class="pill">不杀菌+滤清</div>
          <div class="line"></div>
          <div class="pill-right">鲜啤</div>
        </div>

        <div class="row blue">
          <div class="pill">不杀菌+滤清+膜过滤除菌(非高温)</div>
          <div class="line"></div>
          <div class="pill-right">生啤</div>
        </div>

        <div class="row green">
          <div class="pill">桶装鲜啤+二氧化碳+冰镇</div>
          <div class="line"></div>
          <div class="pill-right">扎啤</div>
        </div>

        <div class="row purple">
          <div class="pill">滤清+巴氏杀菌或瞬时高温杀菌</div>
          <div class="line"></div>
          <div class="pill-right">熟啤</div>
        </div>

      </div>
    </div>

    <!-- Section 2: 啤酒 -->
    <div class="section">
      <div class="label">
        <div class="label-shape">啤酒</div>
      </div>
      <div class="rows">

        <div class="row orange">
          <div class="pill">精酿啤酒</div>
          <div class="line"></div>
          <div class="pill-right">追求独特的口味</div>
        </div>

        <div class="row blue">
          <div class="pill">工业啤酒</div>
          <div class="line"></div>
          <div class="pill-right">追求工业标准化</div>
        </div>

      </div>
    </div>

    <!-- Section 3: 按工艺区分 -->
    <div class="section">
      <div class="label">
        <div class="label-shape">按工艺区分</div>
      </div>
      <div class="rows">

        <div class="row orange" style="align-items:flex-start;">
          <div class="pill" style="flex:0 0 auto;">冰啤</div>
          <div class="line" style="margin-top:14px;"></div>
          <div class="textbox">
            先把啤酒的温度降到冰点，使啤酒因低温而产生浑浊，然后再进行过滤使啤酒变清，和普通啤酒最大的不同之处在于降温的冰晶处理，使酒色更亮丽，口感更清爽醇厚，酒精度数也有一定提高。
          </div>
        </div>

        <div class="row blue" style="align-items:flex-start;">
          <div class="pill" style="flex:0 0 auto;">干啤</div>
          <div class="line" style="margin-top:14px;"></div>
          <div class="textbox">
            干啤采用了特殊的酵母进行发酵酿制，使啤酒中所含的糖分完全转化为酒精，比普通啤酒要低，让干啤喝起来的口感干爽而不甜，清爽而无余味。
          </div>
        </div>

      </div>
    </div>

  </div>

</div>
</body>
</html>
