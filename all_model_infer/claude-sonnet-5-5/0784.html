<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城 - 李白</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #4d5479;
    font-family: "Songti SC", "SimSun", "STSong", serif;
  }

  .card {
    width: 540px;
    height: 719px;
    background-color: #4d5479;
    position: relative;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  .content {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 70px 40px 0 0;
    box-sizing: border-box;
  }

  .info {
    position: absolute;
    left: 40px;
    top: 150px;
    writing-mode: vertical-rl;
    color: #c9cce0;
    font-size: 15px;
    line-height: 1.9;
    letter-spacing: 4px;
  }

  .info .dynasty {
    margin-bottom: 20px;
  }

  .poem-columns {
    display: flex;
    gap: 55px;
    margin-left: 150px;
  }

  .poem-line {
    writing-mode: vertical-rl;
    color: #c6cae3;
    letter-spacing: 14px;
    line-height: 1.5;
  }

  .line1, .line2 {
    font-size: 24px;
    color: #c2c6e0;
  }

  .line3, .line4 {
    font-size: 30px;
    font-weight: 500;
    color: #c6cae3;
  }

  .footer {
    background-color: #e4ddc8;
    width: 100%;
    padding: 18px 30px;
    box-sizing: border-box;
    color: #6b6a55;
    font-size: 12.5px;
    line-height: 1.8;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div class="info">
      <div class="dynasty">唐</div>
      <div class="author">李白</div>
      <div class="title">早发白帝城</div>
    </div>

    <div class="poem-columns">
      <div class="poem-line line1">两岸猿声啼不住，</div>
      <div class="poem-line line2">轻舟已过万重山。</div>
      <div class="poem-line line3">千里江陵一日还</div>
      <div class="poem-line line4">朝辞白帝彩云間</div>
    </div>
  </div>

  <div class="footer">
    两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。
  </div>
</div>
</body>
</html>
