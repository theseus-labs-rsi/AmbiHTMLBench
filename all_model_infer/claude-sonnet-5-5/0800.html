<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线式构图 - 版式设计</title>
<script>
window.MathJax = {tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background:#f4f4f2;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  .page {
    position: relative;
    width: 550px;
    height: 720px;
    background: #faf9f6;
    margin: 20px auto;
    overflow: hidden;
    border: 1px solid #ddd;
  }

  /* Header */
  .header-left {
    position:absolute; top:28px; left:30px;
  }
  .header-left .title {
    font-size:22px; font-weight:700; color:#111;
  }
  .header-left .sub {
    font-size:10px; letter-spacing:2px; color:#333; margin-top:4px;
  }
  .header-right {
    position:absolute; top:30px; right:30px; text-align:right;
  }
  .header-right .title {
    font-size:16px; font-weight:700; color:#111;
  }
  .header-right .sub {
    font-size:10px; letter-spacing:1px; color:#333; margin-top:6px;
  }

  /* blocks */
  .block {
    position:absolute;
  }
  .yellow { background:#f6d511; }
  .black { background:#0c0c0c; color:#f6d511; }

  .ku-box {
    top:76px; left:30px; width:150px; height:148px;
    display:flex; align-items:center; justify-content:center;
    font-size:95px; font-weight:800; color:#111;
  }

  .cools-box {
    top:76px; left:196px; width:324px; height:148px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .cools-box .cn {
    font-size:52px; font-weight:800; line-height:1; letter-spacing:4px;
  }
  .cools-box .en {
    font-size:40px; font-weight:800; letter-spacing:8px; margin-top:4px;
  }

  .divider1 {
    top:234px; left:60px; width:70px; height:10px;
    background:#0c0c0c;
  }

  .gouyin-box {
    top:272px; left:30px; width:170px; height:115px;
    display:flex; flex-direction:column; justify-content:center;
    padding-left:14px;
    font-size:30px; font-weight:800; color:#111; line-height:1.3;
  }

  .coolsy-box {
    top:220px; left:328px; width:192px; height:166px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:2px;
  }
  .coolsy-box .ch {
    font-size:46px; font-weight:800; line-height:1.1; letter-spacing:4px;
  }

  .importance-box {
    top:412px; left:30px; width:170px; height:112px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center;
    font-size:11px; letter-spacing:3px; line-height:1.9;
  }

  .divider2 {
    top:400px; left:375px; width:95px; height:10px;
    background:#0c0c0c;
  }

  .zhiding-box {
    top:424px; left:196px; width:324px; height:110px;
    display:flex; align-items:center; justify-content:center;
    font-size:60px; font-weight:800; letter-spacing:10px;
  }

  /* repeated bar rows */
  .bars {
    position:absolute;
    top:550px; left:140px; width:380px;
  }
  .bar-row {
    display:flex;
    background:#0c0c0c;
    margin-bottom:5px;
    height:15px;
    align-items:center;
    padding:0 4px;
  }
  .bar-row span {
    color:#f6d511;
    font-size:9px;
    letter-spacing:1px;
    margin-right:14px;
    white-space:nowrap;
  }

  .circle {
    position:absolute;
    top:600px; left:30px; width:98px; height:98px;
    background:#f6d511; border-radius:50%;
  }

  .cool-set-bar {
    position:absolute;
    top:636px; left:135px; width:300px; height:24px;
    background:#0c0c0c; color:#f6d511;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; letter-spacing:2px; font-weight:600;
  }

  .yellow-rect-bottom {
    position:absolute;
    top:614px; left:445px; width:75px; height:62px;
    background:#f6d511;
  }

  .bottom-text {
    position:absolute;
    top:685px; left:30px; width:490px;
    text-align:center;
    font-size:14px; letter-spacing:6px; color:#111; font-weight:500;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header-left">
    <div class="title">曲线式构图</div>
    <div class="sub">CURVILINEAR COMPOSITION</div>
  </div>

  <div class="header-right">
    <div class="title">版式设计</div>
    <div class="sub">2023 / 6 / 07</div>
  </div>

  <!-- 酷 yellow box -->
  <div class="block yellow ku-box">酷</div>

  <!-- COOLS black box -->
  <div class="block black cools-box">
    <div class="cn">酷设而遇</div>
    <div class="en">COOLS</div>
  </div>

  <!-- divider -->
  <div class="divider1"></div>

  <!-- 构图的重要性 yellow box -->
  <div class="block yellow gouyin-box">
    构图的<br>重要性
  </div>

  <!-- 酷设永远 black vertical box -->
  <div class="block black coolsy-box">
    <div class="ch">酷设</div>
    <div class="ch">永远</div>
  </div>

  <!-- THE IMPORTANCE OF COMPOSITION black box -->
  <div class="block black importance-box">
    THE IMPORTANCE<br>OF COMPOSITION
  </div>

  <!-- divider 2 -->
  <div class="divider2"></div>

  <!-- 在顶点 black box -->
  <div class="block black zhiding-box">在顶点</div>

  <!-- repeated bar rows -->
  <div class="bars">
    <div class="bar-row">
      <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span>
    </div>
    <div class="bar-row">
      <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span>
    </div>
    <div class="bar-row">
      <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以</span>
    </div>
  </div>

  <!-- yellow circle -->
  <div class="circle"></div>

  <!-- cool set bar -->
  <div class="cool-set-bar">COOL SET IS ALWAYS AT THE TOP</div>

  <!-- bottom right yellow rect -->
  <div class="yellow-rect-bottom"></div>

  <!-- bottom text -->
  <div class="bottom-text">我 / 看 / 不 / 懂 / 但 / 大 / 受 / 震 / 撼</div>

</div>
</body>
</html>
