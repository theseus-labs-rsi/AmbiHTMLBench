<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗六首</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    background: #e8b98a;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .page {
    background: #fff;
    width: 560px;
    background-image:
      linear-gradient(to right, #d9e8f0 1px, transparent 1px),
      linear-gradient(to bottom, #d9e8f0 1px, transparent 1px);
    background-size: 20px 20px;
    border: 2px solid #e8b98a;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .cell {
    border: 1.5px solid #e8b98a;
    padding: 18px 22px 22px 22px;
    box-sizing: border-box;
  }
  .title {
    text-align: center;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  .author {
    text-align: center;
    font-size: 13px;
    color: #333;
    margin-bottom: 14px;
  }
  .poem {
    font-size: 17px;
    line-height: 2.1;
    color: #222;
    padding-left: 6px;
  }
  .poem p {
    margin: 0;
  }
</style>
</head>
<body>
<div class="page">
  <div class="grid">

    <div class="cell">
      <div class="title">《登鹳雀楼》</div>
      <div class="author">（唐－王之涣）</div>
      <div class="poem">
        <p>白日依山尽，</p>
        <p>黄河入海流。</p>
        <p>欲穷千里目，</p>
        <p>更上一层楼。</p>
      </div>
    </div>

    <div class="cell">
      <div class="title">《静夜思》</div>
      <div class="author">（唐－李白）</div>
      <div class="poem">
        <p>床前明月光，</p>
        <p>疑是地上霜。</p>
        <p>举头望明月，</p>
        <p>低头思故乡。</p>
      </div>
    </div>

    <div class="cell">
      <div class="title">《古朗月行》</div>
      <div class="author">（唐－李白）</div>
      <div class="poem">
        <p>小时不识月，</p>
        <p>呼作白玉盘。</p>
        <p>又疑瑶台镜，</p>
        <p>飞在青云端。</p>
      </div>
    </div>

    <div class="cell">
      <div class="title">《寻隐者不遇》</div>
      <div class="author">（唐－贾岛）</div>
      <div class="poem">
        <p>松下问童子，</p>
        <p>言师采药去。</p>
        <p>只在此山中，</p>
        <p>云深不知处。</p>
      </div>
    </div>

    <div class="cell">
      <div class="title">《咏鹅》</div>
      <div class="author">（唐－骆宾王）</div>
      <div class="poem">
        <p>鹅鹅鹅，</p>
        <p>曲项向天歌。</p>
        <p>白毛浮绿水，</p>
        <p>红掌拨清波。</p>
      </div>
    </div>

    <div class="cell">
      <div class="title">《草》</div>
      <div class="author">（唐－白居易）</div>
      <div class="poem">
        <p>离离原上草，</p>
        <p>一岁一枯荣。</p>
        <p>野火烧不尽，</p>
        <p>春风吹又生。</p>
      </div>
    </div>

  </div>
</div>
</body>
</html>
