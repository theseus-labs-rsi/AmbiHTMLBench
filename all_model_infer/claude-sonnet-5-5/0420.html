<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习建议</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0;
    padding: 0;
    color: #333;
  }
  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 30px 60px 30px;
    position: relative;
  }
  .title-wrap {
    text-align: center;
    position: relative;
    margin-bottom: 30px;
  }
  .title-wrap img.decor-top {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
  }
  .main-title {
    font-size: 42px;
    font-weight: 900;
    color: #f5a623;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 #333;
    margin-top: 20px;
    position: relative;
  }
  .title-deco {
    font-size: 20px;
    position: absolute;
    top: -15px;
    left: 20%;
  }
  .title-stars {
    font-size: 20px;
    color: #4aa3df;
    position: absolute;
    top: -5px;
    right: 10%;
  }
  .title-underline {
    width: 220px;
    height: 10px;
    margin: 5px auto 0;
    border-bottom: 3px dashed #4aa3df;
    position: relative;
  }
  .section {
    margin-top: 35px;
  }
  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }
  .section-num {
    font-size: 26px;
    font-weight: bold;
    color: #f5a623;
    margin-right: 15px;
    min-width: 30px;
  }
  .section-tag {
    background: #f5a623;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    padding: 6px 14px;
    border-radius: 4px;
    position: relative;
  }
  .section-tag::before {
    content: "「";
    margin-right: 2px;
  }
  .section-tag::after {
    content: "」";
    margin-left: 2px;
  }
  p {
    font-size: 15.5px;
    line-height: 1.9;
    margin: 10px 0;
    text-align: justify;
  }
  .highlight {
    background: #ffe28a;
    padding: 1px 2px;
  }
  .bold-text {
    font-weight: bold;
  }
  .signature {
    text-align: right;
    font-size: 14px;
    color: #555;
    margin-top: 10px;
    margin-right: 10px;
  }
  .placeholder {
    width: 90px;
    height: 150px;
    position: absolute;
    right: 20px;
    bottom: 10px;
    background: #fdf0e8;
    border: 1px dashed #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #999;
    text-align: center;
    border-radius: 6px;
  }
  .flag-ribbon {
    position: absolute;
    right: 70px;
    bottom: 130px;
    width: 80px;
    height: 20px;
    background: #e8544a;
    color: #fff;
    font-size: 10px;
    text-align: center;
    line-height: 20px;
    transform: rotate(-10deg);
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-wrap">
    <div class="title-deco">✦ ✧</div>
    <div class="title-stars">✦ ✧</div>
    <div class="main-title">学习建议</div>
    <div class="title-underline"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-num">09</div>
      <div class="section-tag">教材远比练习册重要</div>
    </div>

    <p>教材远比练习册重要。</p>
    <p>
      教材就是我们做题之前所要构建的一个框架，
      <span class="highlight">先熟
      悉框架，然后不断地练题，才能将自己学习的这座
      大厦构建得更加完整。</span>
    </p>

    <div class="signature">——陈哲峰(被北京大学物理学院录取)</div>
  </div>

  <div class="section" style="position:relative;">
    <div class="section-header">
      <div class="section-num">10</div>
      <div class="section-tag">有关数学与英语的学习方法</div>
    </div>

    <p>数学压轴大题的第二问我没有做出来，但这并没有
    影响接下来的考试中我的发挥。</p>
    <p>
      我要保证的，<span class="bold-text">不是做出难题，而是做到容易题不丢
      分，难题多得分。</span>最后，我数学只有压轴题扣了
      分。
    </p>

    <div class="placeholder">[Illustration: girl figure, bottom-right]</div>
    <div class="flag-ribbon">高考加油</div>
  </div>

</div>
</body>
</html>
