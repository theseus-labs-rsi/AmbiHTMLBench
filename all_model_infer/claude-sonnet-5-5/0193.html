<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asgari Ücret Afişi - EMEP Ankara</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background: #b9b8b0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .wall-background {
    width: 100%;
    max-width: 900px;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }

  .poster {
    width: 650px;
    background: #fff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    position: relative;
    display: flex;
    flex-direction: column;
    transform: rotate(-0.5deg);
  }

  /* Top yellow section */
  .top-section {
    background: #ffe600;
    padding: 30px 30px 30px 30px;
    position: relative;
    display: flex;
    justify-content: space-between;
  }

  .text-list {
    width: 60%;
  }

  .bullet-item {
    position: relative;
    margin-bottom: 25px;
    padding-left: 35px;
  }

  .pin {
    position: absolute;
    left: 0;
    top: 2px;
    width: 22px;
    height: 22px;
    color: #cc2222;
    font-size: 24px;
    transform: rotate(-20deg);
  }

  .bullet-text {
    font-weight: 800;
    font-size: 28px;
    color: #1a1a1a;
    line-height: 1.15;
  }

  .chart-placeholder {
    width: 38%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .placeholder {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background-color: #d9731e;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    padding: 10px;
    box-sizing: border-box;
  }

  /* White middle section */
  .middle-white {
    background: #fff;
    padding: 30px 30px 10px 30px;
  }

  .slogan-red {
    color: #cc2222;
    font-weight: 900;
    font-size: 32px;
    line-height: 1.2;
    font-style: italic;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* Red banner */
  .red-banner {
    background: #cc2222;
    color: #fff;
    text-align: center;
    padding: 25px 10px;
    font-size: 44px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 1px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  /* Bottom white section with logo and contact */
  .bottom-section {
    background: #fff;
    padding: 20px 30px 30px 30px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
  }

  .emep-logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe600 55%, #cc2222 55%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #cc2222;
    font-size: 16px;
    text-align: center;
    position: relative;
  }

  .emep-logo::before,
  .emep-logo::after {
    content: "";
  }

  .party-name {
    color: #cc2222;
    font-weight: 900;
    font-size: 26px;
    line-height: 1.1;
    font-style: italic;
  }

  .party-subtitle {
    color: #cc2222;
    font-weight: 700;
    font-size: 15px;
    margin-top: 2px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #cc2222;
    font-weight: 600;
    font-size: 15px;
  }

  .icon-box {
    width: 22px;
    height: 22px;
    border: 2px solid #cc2222;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
  }

  .icon-circle {
    width: 22px;
    height: 22px;
    border: 2px solid #cc2222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }

</style>
</head>
<body>

<div class="wall-background">
  <div class="poster">

    <!-- Top Yellow Section -->
    <div class="top-section">
      <div class="text-list">
        <div class="bullet-item">
          <span class="pin">📌</span>
          <div class="bullet-text">Enflasyon<br>yükseliyor</div>
        </div>
        <div class="bullet-item">
          <span class="pin">📌</span>
          <div class="bullet-text">TL değer<br>kaybediyor</div>
        </div>
        <div class="bullet-item">
          <span class="pin">📌</span>
          <div class="bullet-text">Ücretler eriyor</div>
        </div>
      </div>

      <div class="chart-placeholder">
        <div class="placeholder">
          [Icon: Pencil drawing rising arrow chart over coin stack, orange circle background]
        </div>
      </div>
    </div>

    <!-- White Middle Section -->
    <div class="middle-white">
      <div class="slogan-red">
        Vergiden muaf,<br>
        İnsanca yaşanacak
      </div>
    </div>

    <!-- Red Banner -->
    <div class="red-banner">
      ASGARİ ÜCRET!
    </div>

    <!-- Bottom White Section -->
    <div class="bottom-section">
      <div class="logo-row">
        <div class="placeholder emep-logo" style="width:90px; height:90px;">
          EMEP<br>[Logo: gear wheel]
        </div>
        <div>
          <div class="party-name">EMEK<br>PARTİSİ</div>
          <div class="party-subtitle">Ankara İl Örgütü</div>
        </div>
      </div>

      <div class="contact-row">
        <div class="contact-item">
          <span class="icon-box">f</span>
          <span>/ankaraemep</span>
        </div>
        <div class="contact-item">
          <span class="icon-circle">◎</span>
          <span>@emepankara</span>
        </div>
        <div class="contact-item">
          <span class="icon-circle">📞</span>
          <span>0 (312) 232 41 97</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
