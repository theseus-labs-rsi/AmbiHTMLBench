<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忽视你的需求，内耗你的精力</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background-color: #f2f1ec;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }

  .card {
    width: 555px;
    min-height: 700px;
    background-color: #f2f1ec;
    padding: 40px 36px;
    box-sizing: border-box;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .title-box {
    background-color: #4a6a5e;
    color: #f2f1ec;
    font-size: 18px;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 2px;
  }

  .icon-placeholder {
    width: 50px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-placeholder svg {
    width: 44px;
    height: 56px;
  }

  p {
    font-size: 16px;
    line-height: 1.9;
    color: #333;
    margin: 0 0 22px 0;
  }

  b {
    color: #000;
    font-weight: bold;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 22px;
  }

  .check-mark {
    color: #4a6a5e;
    font-size: 16px;
    font-weight: bold;
    margin-right: 6px;
    line-height: 1.9;
    flex-shrink: 0;
  }

  .check-text {
    font-size: 16px;
    line-height: 1.9;
    color: #333;
  }

  .indent {
    display: inline-block;
    text-indent: 0;
    padding-left: 22px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <div class="title-box">3. 忽视你的需求，内耗你的精力</div>
      <div class="icon-placeholder">
        <svg viewBox="0 0 24 36" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="0" width="8" height="4" fill="#3b3b3b"/>
          <rect x="1" y="4" width="22" height="30" rx="4" ry="4" fill="none" stroke="#3b3b3b" stroke-width="2.5"/>
          <polygon points="14,8 6,20 12,20 9,30 20,16 13,16" fill="#e8b84b"/>
        </svg>
      </div>
    </div>

    <p><b>这一种人，不仅可能是身边的朋友，</b>亲密关系中也会出现。爱我们的人，也可能会“害”我们。</p>

    <p><b>忽视需求，是关系中隐藏的一把刀，</b>对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。</p>

    <p>而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。</p>

    <p><b>经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</b></p>

    <div class="check-item">
      <span class="check-mark">✔</span>
      <span class="check-text">面对关系亲近的人的控制，先做出必要的沟通，<br><span class="indent">坦诚表达自己的感受，必要时保持适当距离。</span></span>
    </div>

    <p><b>与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。</b></p>
  </div>
</body>
</html>
