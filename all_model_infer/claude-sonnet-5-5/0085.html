<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypertension – Therapy goal</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000814;
    font-family: Arial, Helvetica, sans-serif;
  }

  .slide {
    width: 1024px;
    height: 768px;
    background: repeating-linear-gradient(
      to bottom,
      #000814 0px,
      #000814 6px,
      #040a28 7px
    ), linear-gradient(to bottom, #00040f, #050b30);
    position: relative;
    box-sizing: border-box;
    padding: 40px 50px;
    color: white;
  }

  h1 {
    color: #ffff00;
    font-size: 46px;
    margin: 0;
    font-weight: normal;
    font-family: Arial, Helvetica, sans-serif;
  }

  .underline {
    border-top: 3px solid #c00000;
    width: 940px;
    margin-top: 10px;
    margin-bottom: 40px;
  }

  .bottom-line {
    border-top: 3px solid #c00000;
    width: 940px;
    position: absolute;
    bottom: 50px;
    left: 50px;
  }

  .bullet-main {
    font-size: 34px;
    color: #ffffff;
    margin: 20px 0 10px 0;
  }

  .bullet-main::before {
    content: "• ";
  }

  .sub-bullet {
    font-size: 28px;
    color: #4e7fc9;
    margin: 8px 0 8px 40px;
  }

  .sub-bullet::before {
    content: "– ";
  }

  .truth-bullet {
    font-size: 34px;
    color: #ffffff;
    margin: 40px 0 10px 0;
  }

  .truth-bullet::before {
    content: "• ";
  }

  .truth-sub {
    font-size: 28px;
    color: #4e7fc9;
    margin: 8px 0 8px 30px;
  }

  .truth-sub::before {
    content: "– ";
  }

</style>
</head>
<body>
<div class="slide">
  <h1>Hypertension – Therapy goal</h1>
  <div class="underline"></div>

  <div class="bullet-main">Goal BP</div>
  <div class="sub-bullet">To Keep B.P. &lt; 140/90 mm Hg in each patient</div>
  <div class="sub-bullet">This may be revised to 120/80&nbsp; may be ? 110/70</div>
  <div class="sub-bullet">MRFIT’s&nbsp; cut off values are 115/75 mm Hg</div>

  <div class="truth-bullet">The Truth is</div>
  <div class="truth-sub">It is essential to keep the B.P at or below the goal</div>
  <div class="truth-sub">But, It also matters how the goal B.P. is achieved !</div>

  <div class="bottom-line"></div>
</div>
