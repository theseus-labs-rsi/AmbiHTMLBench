<!DOCTYPE html>
<html lang="zh">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">

<style>
  body {
    background: #e8e2d6;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .page {
    background: #f1ece0;
    width: 540px;
    min-height: 720px;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 37px,
      #c9c2b2 38px
    );
    padding-top: 10px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    padding: 10px 15px 0 10px;
    justify-content: space-between;
  }

  .day-tabs {
    display: flex;
  }

  .day-tab {
    border: 1px solid #555;
    font-size: 11px;
    padding: 2px 5px;
    margin-right: 2px;
    color: #333;
    font-family: Georgia, serif;
    background: #f1ece0;
  }

  .date-field {
    font-family: Georgia, serif;
    font-size: 14px;
    color: #333;
  }

  .date-field .line {
    display: inline-block;
    width: 20px;
    border-bottom: 1px solid #333;
    margin: 0 3px;
  }

  .divider {
    border-top: 1.5px solid #444;
    margin: 8px 15px 15px 15px;
  }

  .title {
    font-family: "KaiTi", "STKaiti", cursive, serif;
    font-size: 28px;
    color: #2a2a2a;
    margin: 10px 20px 25px 25px;
    font-weight: bold;
    transform: rotate(-0.5deg);
  }

  .content {
    font-family: "KaiTi", "STKaiti", cursive, serif;
    font-size: 22px;
    color: #2a2a2a;
    margin: 0 20px 0 25px;
    line-height: 38px;
  }

  .content p {
    margin: 0;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="page">

  <div class="top-bar">
    <div class="day-tabs">
      <div class="day-tab">Tu</div>
      <div class="day-tab">We</div>
      <div class="day-tab">Th</div>
      <div class="day-tab">Fr</div>
      <div class="day-tab">Sa</div>
      <div class="day-tab">Su</div>
    </div>
    <div class="date-field">
      Date. <span class="line"></span> / <span class="line"></span> / <span class="line"></span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="title">这是好的开始</div>

  <div class="content">
    <p>从你看到这篇文章开始.</p>
    <p>你会越来越有钱</p>
    <p>越来越好看.</p>
    <p>生活和心态.也会越来越好.</p>
    <p>请相信大数据.</p>
    <p>是你自己把一切美好的东西.</p>
    <p>都吸引了过来</p>
    <p>你已经调到了接收钱的频率</p>

    <p>条信息.</p>
    <p>留下一句"全收到".</p>
    <p>愿.所有的愿.望全能实现！</p>

</div>
