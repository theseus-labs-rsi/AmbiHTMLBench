<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山里的约會 - TongCai 2021</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    background: #ddd;
  }
  .poster {
    position: relative;
    width: 540px;
    height: 716px;
    background: linear-gradient(to bottom, #d8ead6 0%, #cfe4cf 30%, #e3dcb0 70%, #d9c98a 100%);
    overflow: hidden;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    color: #2f3a2f;
  }

  /* illustration placeholder covering whole poster background */
  .illustration {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: repeating-linear-gradient(
      45deg,
      rgba(200,220,190,0.3),
      rgba(200,220,190,0.3) 10px,
      rgba(180,210,170,0.3) 10px,
      rgba(180,210,170,0.3) 20px
    );
  }

  .placeholder {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #555;
    font-size: 12px;
    border: 1px dashed rgba(100,100,100,0.4);
    background: rgba(255,255,255,0.15);
    z-index: 1;
  }

  /* top-right paragraph */
  .top-text {
    position: absolute;
    top: 15px;
    right: 20px;
    width: 300px;
    font-size: 13px;
    line-height: 1.8;
    color: #2f3a2f;
    text-align: left;
    z-index: 3;
  }

  /* left vertical column texts */
  .vertical-text {
    position: absolute;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 6px;
    color: #2f3a2f;
    z-index: 3;
  }

  .vt-top {
    top: 8px;
    left: 10px;
    font-size: 22px;
  }

  .vt-mid {
    top: 180px;
    left: 10px;
    font-size: 18px;
    letter-spacing: 8px;
    color: #3a4a3a;
  }

  .vt-bottom {
    top: 600px;
    left: 10px;
    font-size: 18px;
    color: #4a3a2a;
  }

  /* center title */
  .title {
    position: absolute;
    top: 70px;
    left: 230px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 48px;
    font-weight: 900;
    color: #1f3a1f;
    letter-spacing: 10px;
    z-index: 3;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
  }

  /* social tag */
  .social {
    position: absolute;
    top: 420px;
    left: 300px;
    font-size: 13px;
    color: #222;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .social .handle {
    font-weight: bold;
  }
  .social .from {
    font-size: 10px;
    color: #555;
    margin-left: 4px;
  }

  /* bottom quote text left/right columns */
  .bottom-quote {
    position: absolute;
    bottom: 10px;
    left: 70px;
    width: 420px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.8;
    color: #2a2a2a;
    z-index: 3;
  }
  .bottom-quote .col {
    width: 48%;
  }

  .main-illustration-ph {
    position: absolute;
    top: 350px;
    left: 20px;
    width: 500px;
    height: 330px;
    z-index: 2;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(60,60,60,0.5);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="poster">

  <div class="illustration"></div>

  <!-- Large scene illustration placeholder (fields, people, trees, mountains) -->
  <div class="main-illustration-ph placeholder" style="top:0; left:0; width:100%; height:100%; border:none; background:transparent;">
    [Illustration: full-page watercolor scene of mountains, farmland, trees, people working/cooking, autumn harvest fields]
  </div>

  <!-- Top right paragraph -->
  <div class="top-text">
    地上的路原来很平坦可是有太多人走过这些路过的人们太累了<br>
    于是他们决定扔下一些东西
  </div>

  <!-- Left vertical texts -->
  <div class="vertical-text vt-top">大班综合</div>

  <div class="vertical-text vt-mid">TongCai 2021</div>

  <div class="vertical-text vt-bottom">Autumn</div>

  <!-- Center big title -->
  <div class="title">山里的约會</div>

  <!-- Social media tag -->
  <div class="social">
    <span>&#128159;</span>
    <span class="handle">@Hiro豆豆老师</span>
    <br>
    <span class="from">From 小红书</span>
  </div>

  <!-- Bottom quote text, two columns -->
  <div class="bottom-quote">
    <div class="col">
      有的人扔下了悲伤<br>
      变成了路上的石头
    </div>
    <div class="col">
      有的人留下快乐<br>
      变成了山上的树苗
    </div>
    <div class="col" style="text-align:right;">
      我把装在瓶子里的思念<br>
      放在高高的山顶上<br>
      交成了黑夜的眼睛
    </div>
  </div>

</div>
</body>
</html>
