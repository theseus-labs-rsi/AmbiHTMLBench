<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e9e3d6;
    font-family: "Microsoft YaHei", "SimSun", serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #f1ece0;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
  }
  .topbar {
    background: #e4dcc8;
    color: #8a7a52;
    font-size: 11px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #cfc3a0;
  }
  .topbar span {
    margin-right: 14px;
  }
  .topbar .right-group {
    color: #a8926a;
  }
  .topbar .right-group span.active {
    color: #8a6d3b;
    font-weight: bold;
  }
  .title {
    font-size: 15px;
    color: #4a4030;
    padding: 10px 10px 6px 10px;
    font-weight: bold;
  }
  .grid-box {
    background-image:
      linear-gradient(to right, rgba(180,160,120,0.15) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(180,160,120,0.15) 1px, transparent 1px);
    background-size: 12px 12px;
    background-color: #f3eee2;
  }
  .row-item {
    display: flex;
    align-items: center;
    border-top: 1px solid #d8cfb8;
    border-bottom: 1px solid #d8cfb8;
    padding: 7px 10px;
    font-size: 11px;
    color: #6b5d3f;
    background: #f3eee2;
  }
  .row-item + .row-item {
    border-top: none;
  }
  .label-col {
    width: 70px;
    flex-shrink: 0;
    color: #6b5d3f;
    font-size: 11px;
  }
  .section-main {
    display: flex;
    border-top: 1px solid #d8cfb8;
  }
  .left-labels {
    width: 62px;
    flex-shrink: 0;
    border-right: 1px solid #d8cfb8;
    background: #f3eee2;
  }
  .left-labels .item {
    display: flex;
    align-items: center;
    padding: 9px 4px;
    font-size: 11px;
    color: #6b5d3f;
    border-bottom: 1px dashed #ddd3b8;
  }
  .radio {
    width: 8px;
    height: 8px;
    border: 1px solid #a8926a;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .right-grid {
    flex: 1;
    height: 160px;
  }
  .analysis-header {
    display: flex;
    border-top: 1px solid #d8cfb8;
    background: #f3eee2;
    font-size: 11px;
    color: #6b5d3f;
  }
  .analysis-header .col {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-right: 1px solid #d8cfb8;
  }
  .analysis-header .col:last-child {
    border-right: none;
    justify-content: center;
  }
  .analysis-body {
    display: flex;
  }
  .analysis-body .left-two {
    flex: 2;
    display: flex;
    height: 220px;
  }
  .analysis-body .left-two > div {
    flex: 1;
    border-right: 1px solid #d8cfb8;
  }
  .analysis-body .right-one {
    flex: 1;
    height: 220px;
  }
  .block-row {
    border-top: 1px solid #d8cfb8;
  }
  .block-label {
    font-size: 11px;
    color: #6b5d3f;
    padding: 8px 10px;
    background: #f3eee2;
    border-bottom: 1px solid #e3dcc6;
  }
  .block-grid {
    height: 90px;
  }
  .remark {
    border-top: 1px solid #d8cfb8;
    font-size: 11px;
    color: #6b5d3f;
    padding: 8px 10px;
    background: #f3eee2;
    height: 30px;
  }
  .footer {
    text-align: center;
    font-size: 10px;
    color: #c9bfa5;
    padding: 14px 0 10px 0;
    letter-spacing: 2px;
  }
  .footer .brand {
    font-size: 14px;
    font-weight: bold;
    color: #d8d0ba;
  }
  .footer .brand .fun {
    color: #a8926a;
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div>
      <span>行测</span><span>&gt;</span><span>常识</span><span>言语</span><span>数量</span><span>判断</span><span>资料</span>
    </div>
    <div class="right-group">
      <span class="active">申论</span><span>纸张</span><span>计划</span>
    </div>
  </div>

  <div class="title">· 晨读笔记</div>

  <div class="row-item"><div class="label-col">主题</div></div>
  <div class="row-item"><div class="label-col">应用领域</div></div>
  <div class="row-item"><div class="label-col">热门事件</div></div>
  <div class="row-item"><div class="label-col">宏观政策</div></div>
  <div class="row-item"><div class="label-col">媒体评论</div></div>

  <div class="section-main">
    <div class="left-labels">
      <div class="item"><span class="radio"></span>意义</div>
      <div class="item"><span class="radio"></span>原因</div>
      <div class="item"><span class="radio"></span>问题</div>
      <div class="item"><span class="radio"></span>危害</div>
    </div>
    <div class="right-grid grid-box"></div>
  </div>

  <div class="analysis-header">
    <div class="col"><span class="radio"></span>问题分析</div>
    <div class="col"><span class="radio"></span>原因分析</div>
    <div class="col">对策分析</div>
  </div>

  <div class="analysis-body">
    <div class="left-two">
      <div class="grid-box"></div>
      <div class="grid-box"></div>
    </div>
    <div class="right-one grid-box"></div>
  </div>

  <div class="block-row">
    <div class="block-label">句子迁移</div>
    <div class="block-grid grid-box"></div>
  </div>

  <div class="block-row">
    <div class="block-label">方法迁移</div>
    <div class="block-grid grid-box"></div>
  </div>

  <div class="remark">备注</div>

  <div class="footer">
    <span>— 粉笔研发出品 —</span><br>
    <span class="brand"><span class="fun">FUN</span>粉笔</span>
  </div>

</div>
</body>
</html>
