<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2022--2023学年第二学期 期末质量分析会</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    background: #f3f1e9;
  }
  .page {
    position: relative;
    width: 550px;
    margin: 0 auto;
    background: linear-gradient(to bottom, #eef4ec 0%, #f6f4ec 40%, #ffffff 100%);
    padding-bottom: 20px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  .header-decor {
    position: relative;
    height: 90px;
    width: 100%;
  }
  .watermark {
    position: absolute;
    color: rgba(0,150,80,0.35);
    font-size: 13px;
    font-weight: bold;
    transform: rotate(-12deg);
    white-space: nowrap;
  }
  .wm1 { top: 10px; right: 60px; }
  .wm2 { top: 115px; left: 60px; }
  .wm3 { top: 270px; left: 50px; }

  .top-right-leaf {
    position: absolute;
    top: 0;
    right: 0;
    width: 180px;
    height: 110px;
    background: repeating-linear-gradient(135deg, #9fc98a 0 6px, #c7dfae 6px 12px);
    clip-path: polygon(100% 0, 40% 0, 70% 30%, 50% 50%, 80% 70%, 60% 100%, 100% 100%);
    opacity: 0.85;
  }

  .title-block {
    text-align: center;
    margin-top: 10px;
  }
  .date-line {
    color: #2e2e2e;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .main-title {
    color: #1a3a1a;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 6px 0 14px 0;
  }
  .sub-title {
    color: #1a7a1a;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  .org-line {
    color: #3a6fae;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .person-line {
    color: #3a6fae;
    font-size: 11px;
    margin-bottom: 10px;
  }

  .decor-bottom-left {
    position: relative;
    width: 180px;
    height: 150px;
    margin-top: -10px;
  }
  .leaf-cluster {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 160px;
    height: 150px;
    background: radial-gradient(circle at 30% 70%, #e8d7c3 0%, #d9b98f 20%, transparent 21%),
                repeating-linear-gradient(60deg, #7fae6a 0 8px, #a3c98a 8px 16px);
    opacity: 0.9;
    clip-path: polygon(0 100%, 0 40%, 30% 20%, 60% 40%, 50% 60%, 70% 70%, 60% 100%);
  }
  .bird {
    position: absolute;
    bottom: 55px;
    left: 70px;
    width: 30px;
    height: 20px;
    background: #4a5a7a;
    border-radius: 50% 50% 50% 0;
  }

  .section-title {
    font-size: 15px;
    font-weight: bold;
    color: #2e2e2e;
    margin: -20px 0 20px 25px;
  }
  .teacher-wm {
    color: rgba(0,150,80,0.35);
    font-size: 12px;
    font-weight: bold;
    margin-left: 6px;
    transform: rotate(-8deg);
    display: inline-block;
  }

  .flow-container {
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    margin-bottom: 10px;
  }
  .flow-step {
    flex: 1;
    margin: 0 4px;
    text-align: center;
  }
  .flow-box {
    background: #eaf6f0;
    border: 1px solid #3fae6a;
    border-radius: 14px;
    color: #1a7a1a;
    font-size: 11px;
    font-weight: bold;
    padding: 6px 4px;
    position: relative;
  }
  .arrow {
    position: relative;
    display: inline-block;
    width: 20px;
    color: #3fae6a;
    font-weight: bold;
  }

  .flow-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .content-row {
    display: flex;
    padding: 0 15px;
    gap: 8px;
  }
  .content-box {
    flex: 1;
    background: #fbfdf9;
    border: 1px solid #cfe6d6;
    border-radius: 10px;
    font-size: 10px;
    color: #333;
    line-height: 1.5;
    padding: 8px 6px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="page">

  <!-- Header decorative area -->
  <div class="header-decor">
    <div class="top-right-leaf"></div>
    <div class="watermark wm1">@海淀小萌</div>
  </div>

  <!-- Title block -->
  <div class="title-block">
    <div class="date-line">2022--2023学年第<span style="position:relative;">二<span class="watermark" style="position:absolute;top:-10px;left:-5px;font-size:10px;">@海淀小萌期</span></span>学期</div>
    <div class="main-title">追光而遇有思&nbsp;&nbsp;沐光而行致远</div>
    <div class="sub-title" style="position:relative;">
      期末质量分析会
      <span class="watermark" style="position:absolute;top:-5px;left:10px;font-size:11px;">心@海淀小萌期</span>
    </div>
    <div class="org-line">红薇街道实验XXXX</div>
    <div class="person-line">海淀小萌</div>
  </div>

  <!-- Section title with decor -->
  <div class="decor-bottom-left">
    <div class="leaf-cluster"></div>
    <div class="bird"></div>
    <div class="watermark wm3" style="position:absolute; bottom:70px; left:10px;">@海淀小萌</div>
  </div>

  <div class="section-title">期末考试成绩</div>

  <!-- Flow chart row -->
  <div class="flow-row">
    <div class="flow-step">
      <div class="flow-box">注重基础和积累</div>
    </div>
    <div class="arrow">→</div>
    <div class="flow-step">
      <div class="flow-box">重视运用</div>
    </div>
    <div class="arrow">→</div>
    <div class="flow-step">
      <div class="flow-box">联系生活原则</div>
    </div>
    <div class="arrow">→</div>
    <div class="flow-step">
      <div class="flow-box">难易程度适中</div>
    </div>
  </div>

  <!-- Content boxes under flow chart -->
  <div class="content-row">
    <div class="content-box">
      尤其是古诗文和名言警句积累占的比例很大，反映了对传统文化的重视。
    </div>
    <div class="content-box">
      突出能力，重视运用。阅读题体现了核心素养中重视思维发展与提升的要求。
    </div>
    <div class="content-box">
      写作的安排正是学生生活中外出的经历，易于选材，适合个性发展。
    </div>
    <div class="content-box">
      只要认真积累和复习的孩子基本上可以取得不错的成绩。
    </div>
  </div>

</div>

</body>
</html>
