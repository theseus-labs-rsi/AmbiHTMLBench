<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂花露与荷花露制法</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #e8d8dd;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "SimSun", "Microsoft YaHei", "PingFang SC", serif;
  }
  .page {
    width: 540px;
    min-height: 710px;
    background-color: #e3cbd3;
    border: 1px solid #a98a96;
    box-sizing: border-box;
    padding: 40px 45px 20px 45px;
    position: relative;
    color: #4a4a4a;
  }
  .section {
    margin-bottom: 18px;
  }
  .title {
    font-size: 17px;
    color: #333;
    margin-bottom: 20px;
  }
  .label {
    font-size: 15px;
    color: #333;
    line-height: 1.9;
    margin-bottom: 20px;
  }
  .label-tag {
    letter-spacing: 1px;
  }
  .footer {
    position: absolute;
    bottom: 12px;
    left: 45px;
    right: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #8a7a80;
  }
  .footer .app-logo {
    display: inline-flex;
    align-items: center;
  }
  .app-icon {
    width: 14px;
    height: 14px;
    background-color: #333;
    display: inline-block;
    margin-right: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="section">
      <div class="title">△桂花露</div>
      <div class="label"><span class="label-tag">〔功用〕</span>开胃消食，宽胸化痰</div>
      <div class="label"><span class="label-tag">〔药物〕</span>桂花500克</div>
      <div class="label">
        <span class="label-tag">〔制法〕</span>于9月底开花时采收，阴于，拣去<br>
        杂质。先加水浸泡2小时，放入蒸馏器蒸2<br>
        次，收集蒸馏液
      </div>
    </div>

    <div class="section">
      <div class="title">△荷花露</div>
      <div class="label"><span class="label-tag">〔功用〕</span>清暑凉营</div>
      <div class="label"><span class="label-tag">〔药物〕</span>白荷花500克</div>
      <div class="label">
        <span class="label-tag">〔制法〕</span>取含花未放的大花蕾或开放的<br>
        花，阴干切碎，加水浸泡2小时。放入蒸馏<br>
        器蒸2小时，收集蒸馏液
      </div>
    </div>

    <div class="footer">
      <span>〔中国色 · 鹤荷〕</span>
      <span class="app-logo"><span class="app-icon"></span>图片社APP</span>
    </div>
  </div>
</body>
</html>
