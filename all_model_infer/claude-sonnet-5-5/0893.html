<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0b1a4a 0%, #16255e 50%, #0b1a4a 100%);
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
    color: #fff;
    width: 540px;
    min-height: 700px;
    position: relative;
    overflow: hidden;
  }

  .bg-watermark {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.08;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 300px;
    color: #fff;
    z-index: 0;
    pointer-events: none;
  }

  .title-block {
    position: relative;
    z-index: 1;
    padding: 55px 24px 25px 24px;
  }

  .title-block h1 {
    font-size: 32px;
    font-weight: bold;
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
  }

  .content-wrap {
    position: relative;
    z-index: 1;
    padding: 0 20px 30px 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    background: rgba(10, 20, 60, 0.3);
  }

  th {
    background-color: #c9960c;
    color: #16255e;
    font-weight: bold;
    padding: 10px 8px;
    text-align: center;
    border: 1px solid #2a3a7a;
    font-size: 14px;
  }

  td {
    padding: 11px 10px;
    border: 1px solid #2a3a7a;
    text-align: center;
    vertical-align: middle;
  }

  td.question {
    text-align: left;
    width: 62%;
  }

  td.answer {
    width: 38%;
  }

  tr.note td {
    text-align: center;
    color: #e0e0e0;
    font-size: 13px;
    background: rgba(255,255,255,0.03);
  }

  tr:nth-child(even):not(.note) {
    background: rgba(255,255,255,0.02);
  }
</style>
</head>
<body>

  <div class="bg-watermark">富</div>

  <div class="title-block">
    <h1>富人眼中的富人是咋样？</h1>
  </div>

  <div class="content-wrap">
    <table>
      <tr>
        <th>问题</th>
        <th>回答</th>
      </tr>
      <tr>
        <td class="question">1.您觉得高净值人群资产拥有多少钱才算是?</td>
        <td class="answer">1亿7,388,4万元</td>
      </tr>
      <tr class="note">
        <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr>
        <td class="question">2.请问您每天工作小时数是?</td>
        <td class="answer">8.2小时</td>
      </tr>
      <tr>
        <td class="question">3.您预计退休年龄?</td>
        <td class="answer">59岁</td>
      </tr>
      <tr>
        <td class="question">4.您希望能活到多少岁?</td>
        <td class="answer">88.2岁</td>
      </tr>
      <tr class="note">
        <td colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr>
        <td class="question">5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="answer">6.2个国家</td>
      </tr>
      <tr>
        <td class="question">6.请问您平均每月阅读书籍数量</td>
        <td class="answer">2.4本书</td>
      </tr>
    </table>
  </div>

</body>
</html>
