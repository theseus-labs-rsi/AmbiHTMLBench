<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三、直播后 - 数据复盘</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #8a99b3;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #8a99b3;
    position: relative;
    padding-bottom: 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 20px 10px 20px;
  }
  .title {
    font-size: 26px;
    font-weight: bold;
    color: #1a1a2e;
    margin: 0 auto;
    text-align: center;
    flex: 1;
  }
  .tag {
    font-size: 10px;
    color: #333;
    background: #fff;
    border-radius: 12px;
    padding: 3px 10px;
    white-space: nowrap;
    text-align: center;
    line-height: 1.3;
  }
  .tag .from {
    font-size: 8px;
    color: #888;
  }

  .yellow-box {
    background: #f7e8a4;
    margin: 0 15px 15px 15px;
    padding: 12px 20px 16px 20px;
    border-radius: 2px;
  }
  .yellow-box h2 {
    font-size: 15px;
    margin: 0 0 8px 0;
    color: #1a1a2e;
  }
  .yellow-box p {
    font-size: 12px;
    margin: 4px 0 8px 0;
    color: #222;
  }
  .yellow-box ul {
    margin: 0;
    padding-left: 18px;
    font-size: 12px;
    color: #222;
    line-height: 1.7;
  }

  .diagram-area {
    position: relative;
    margin: 10px 20px 10px 55px;
  }

  .side-label {
    position: absolute;
    left: -60px;
    top: 50%;
    transform: translateY(-50%);
    background: #1a1a2e;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    padding: 10px 8px;
    border-radius: 4px;
    width: 55px;
    box-sizing: border-box;
    text-align: center;
  }

  .item-block {
    margin-bottom: 22px;
    position: relative;
  }

  .dark-box {
    background: #3a4a9f;
    color: #fff;
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 3px;
    line-height: 1.6;
    position: relative;
    z-index: 2;
  }

  .light-box {
    background: #cdd6ef;
    border: 2px dashed #3a4a9f;
    color: #1a1a2e;
    font-size: 13px;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 3px;
    margin-top: -8px;
    margin-left: 25px;
    position: relative;
    z-index: 1;
  }

  .connector-vline {
    position: absolute;
    left: -15px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #1a1a2e;
  }

  .connector-dot-top {
    position: absolute;
    left: -18px;
    top: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a2e;
  }
  .connector-dot-bottom {
    position: absolute;
    left: -18px;
    bottom: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a2e;
  }

  .main-vline {
    position: absolute;
    left: -15px;
    top: 15px;
    bottom: 15px;
    width: 2px;
    background: #1a1a2e;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="title">三、直播后</div>
    <div class="tag">@自律的营销学姐Renita<br><span class="from">From 小红书</span></div>
  </div>

  <div class="yellow-box">
    <h2>2、数据复盘</h2>
    <p>进行直播数据复盘的时候，重点关注4个关键数据：</p>
    <ul>
      <li>人气峰值和平均在线</li>
      <li>观众平均停留时长</li>
      <li>带货转化率</li>
      <li>UV价值</li>
    </ul>
  </div>

  <div class="diagram-area">
    <div class="main-vline"></div>
    <div class="side-label">2、数据复盘</div>

    <div class="item-block">
      <div class="dark-box">
        一般平均在线能稳定在50人左右直播就有基本的带货能力，能够赚到钱
      </div>
      <div class="light-box">
        ① 人气峰值和平均在线人数
      </div>
    </div>

    <div class="item-block">
      <div class="dark-box">
        通常停留时长超过2分钟算不错的数据，超过30s是一个及格线
      </div>
      <div class="light-box">
        ② 观众平均停留时长
      </div>
    </div>

    <div class="item-block">
      <div class="dark-box">
        一般带货转化率达到1%以上算合格，优秀的3%以上
      </div>
      <div class="light-box">
        ③ 带货转化率
      </div>
    </div>

    <div class="item-block">
      <div class="dark-box">
        单个用户给直播间贡献的价值，这个数值越高，说明用户在这个直播间的付费意愿更强
      </div>
      <div class="light-box">
        ④ UV价值
      </div>
    </div>

  </div>

</div>
</body>
</html>
