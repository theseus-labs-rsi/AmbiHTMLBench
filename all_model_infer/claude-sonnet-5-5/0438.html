<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled Document</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #c9a876;
    background-image: repeating-linear-gradient(100deg, #c9a876 0px, #b89060 40px, #c9a876 80px);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", sans-serif;
  }

  .photo-frame {
    width: 540px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #d8b98a 0%, #c9a876 40%, #e0c49a 70%, #b89060 100%);
  }

  .shadow-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 220px;
    background: linear-gradient(160deg, rgba(90,70,40,0.35) 0%, rgba(90,70,40,0.05) 60%);
    z-index: 2;
  }

  .paper {
    position: absolute;
    top: 230px;
    left: -40px;
    width: 620px;
    height: 560px;
    background: #f5eec0;
    transform: rotate(5deg);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    padding: 40px 30px 30px 50px;
    box-sizing: border-box;
  }

  .right-edge-text {
    position: absolute;
    right: 10px;
    top: 90px;
    font-size: 10px;
    color: #999;
    writing-mode: vertical-rl;
  }

  .number {
    font-size: 26px;
    font-weight: bold;
    position: absolute;
    top: 55px;
    left: 20px;
    font-family: 'Times New Roman', serif;
  }

  .printed-text {
    font-size: 15px;
    color: #222;
    line-height: 1.8;
    margin-left: 55px;
    margin-top: 10px;
  }

  .printed-text .q2 {
    margin-top: 20px;
  }

  .handwriting {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 26px;
    color: #1a1a1a;
    line-height: 1.5;
    margin-top: 30px;
    margin-left: 10px;
    font-style: normal;
    letter-spacing: 1px;
    transform: skewX(-1deg);
  }

  .placeholder {
    display: none;
  }
</style>
</head>
<body>
<div class="photo-frame">
  <div class="shadow-overlay"></div>
  <div class="paper">
    <div class="number">26</div>
    <div class="printed-text">
      你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。
      <div class="q2">她看到了什么呢?</div>
    </div>
    <div class="right-edge-text">今一个<br>名叫</div>

    <div class="handwriting">
      我蹲下来,"这根肋骨让你感<br>
      到不舒服吗?"<br>
      展览台上是一尊白玉莹莹的肋<br>
      骨，下面的文学介绍引用了夏娃<br>
      的来历，说女人都是由肋骨所化。
    </div>
  </div>
</div>
</body>
</html>
