<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 VS 快手 产品小课堂</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #f0c178;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: #f0c178;
    padding: 20px 25px 40px 25px;
    position: relative;
  }
  .title {
    text-align: center;
    color: #5a3a1a;
    font-size: 44px;
    font-weight: 900;
    margin: 10px 0 25px 0;
    letter-spacing: 2px;
  }
  .brush-row {
    display: flex;
    align-items: center;
    margin-bottom: 25px;
    position: relative;
  }
  .brush {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #555;
    text-align: center;
    margin-right: -20px;
    z-index: 2;
  }
  .brush-shape {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #e8c9a0 40%, #7fcfc8 40%);
    border-radius: 8px;
    transform: rotate(-25deg);
  }
  .banner {
    flex: 1;
    background: linear-gradient(90deg, #f6a93c, #f8bb5e);
    border-radius: 40px;
    padding: 16px 20px 16px 40px;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 2px 3px 0px rgba(90,58,26,0.3);
  }
  .content-box {
    background: #fdf6ea;
    border-radius: 10px;
    padding: 20px 20px 30px 20px;
  }
  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    margin-top: 10px;
  }
  .num-circle {
    width: 55px;
    height: 55px;
    background: #4a2e1a;
    color: #f0c178;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    margin-right: 15px;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 22px;
    font-weight: bold;
    color: #3a2a1a;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 25px;
    font-size: 13px;
  }
  th {
    background: #f6a93c;
    color: #fff;
    padding: 8px 6px;
    text-align: center;
    font-weight: normal;
    border: 1px solid #f0c178;
  }
  td {
    border: 1px solid #e8d9b5;
    padding: 8px 8px;
    color: #4a3a2a;
    vertical-align: top;
  }
  td.label {
    font-weight: bold;
    white-space: nowrap;
    width: 60px;
  }
  .dashed-divider {
    text-align: center;
    color: #f0c178;
    letter-spacing: 6px;
    font-size: 18px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title">抖音 VS 快手</div>

  <div class="brush-row">
    <div class="brush">
      <div class="brush-shape"></div>
    </div>
    <div class="banner">产品小课堂</div>
  </div>

  <div class="content-box">

    <!-- Section 03 -->
    <div class="section-header">
      <div class="num-circle">03</div>
      <div class="section-title">抖音与快手</div>
    </div>

    <table>
      <tr>
        <th style="width:14%;"></th>
        <th style="width:22%;">slogan</th>
        <th style="width:22%;">产品定位</th>
        <th style="width:22%;">策略</th>
        <th style="width:20%;">变现</th>
      </tr>
      <tr>
        <td class="label">抖音</td>
        <td>记录美好生活</td>
        <td>短视频媒体</td>
        <td>以优质内容为中心</td>
        <td>广告收入、电商</td>
      </tr>
      <tr>
        <td class="label">快手</td>
        <td>拥抱每一种生活</td>
        <td>短视频社区</td>
        <td>以社交中心，大部分流量</td>
        <td>直播收入、电商</td>
      </tr>
    </table>

    <!-- Section 04 -->
    <div class="section-header">
      <div class="num-circle">04</div>
      <div class="section-title">抖音电商与快手电商</div>
    </div>

    <table>
      <tr>
        <th style="width:18%;"></th>
        <th style="width:50%;">产品定位</th>
        <th style="width:32%;">重点指标</th>
      </tr>
      <tr>
        <td class="label">抖音电商</td>
        <td>兴趣逻辑，内容场景刺激需求</td>
        <td>直播间GPM</td>
      </tr>
      <tr>
        <td class="label">快手电商</td>
        <td>信任逻辑，头部主播优势</td>
        <td>复购</td>
      </tr>
    </table>

    <div class="dashed-divider">- - - - - - - - - -</div>

  </div>

</div>
</body>
</html>
