<!DOCTYPE html>
<html lang="zh">
<head>

<style>
  body {
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .page {
    max-width: 560px;
    margin: 0 auto;
  }
  .title-box {
    border: 2px solid #999;
    border-radius: 4px;
    text-align: center;
    padding: 10px 5px;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .title-box .sub {
    font-size: 15px;
    font-weight: normal;
    margin-top: 2px;
  }

  table.concept-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 15px;
    font-size: 13px;
  }
  table.concept-table th, table.concept-table td {
    border: 1px solid #333;
    padding: 6px 8px;
    text-align: left;
  }
  table.concept-table th {
    background: #e2cfa3;
    font-weight: bold;
  }
  table.concept-table .header-row th {
    background: #e2cfa3;
  }
  table.concept-table .label-col {
    background: #d8a36a;
    font-weight: bold;
    color: #000;
    width: 15%;
  }
  table.concept-table td.data {
    background: #f6f2e9;
  }

  .highlight-banner {
    background: #000;
    color: #ffd400;
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    font-style: italic;
    padding: 12px 10px;
    margin: 10px 0 20px 0;
    line-height: 1.6;
  }

  .arrow-container {
    position: relative;
    margin-top: 20px;
  }

  .arrow-row {
    position: relative;
    height: 44px;
    margin-bottom: 4px;
  }

  .chevron {
    position: relative;
    height: 44px;
    display: flex;
    align-items: center;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    padding-left: 15px;
    box-sizing: border-box;
  }

  .chevron.teal {
    background: #1d6f78;
    width: 100%;
    clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
  }
  .chevron.yellow {
    background: #d8a63a;
    width: 75%;
    margin-left: 25%;
    clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
  }
  .chevron.gray {
    background: #8a8a8a;
    width: 50%;
    margin-left: 50%;
    clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
  }

  .label-text {
    display: block;
  }

  .top-labels {
    position: relative;
    height: 60px;
  }

  .label-box {
    position: absolute;
    font-size: 13px;
    font-weight: bold;
    color: #222;
    text-align: left;
    line-height: 1.3;
  }

  .label-box.l1 {
    left: 2%;
    top: 30px;
    width: 30%;
  }
  .label-box.l2 {
    left: 35%;
    top: 10px;
    width: 32%;
  }
  .label-box.l3 {
    left: 68%;
    top: -8px;
    width: 32%;
  }

  .citation {
    text-align: right;
    font-size: 11px;
    color: #333;
    margin-top: 10px;
  }

  .corner-mark {
    position: fixed;
    bottom: 5px;
    right: 5px;
    font-size: 9px;
    color: #ccc;
  }
</style>
</head>

<div class="page">

      <td class="data">特定性</td>

  </table>

  <div class="highlight-banner">

  <div class="title-box">
    话题、主题意义、主题的联系与区别

    </div>

    <div class="arrow-row">
      <div class="chevron gray">
        <span class="label-text">主题<br>What+Why+How+So what (else)</span>
      </div>
    </div>
    <div class="arrow-row">
      <div class="chevron yellow">
        <span class="label-text">主题意义<br>Why+How</span>
      </div>
    </div>
    <div class="arrow-row">

        <span class="label-text">话题<br>What+How</span>
