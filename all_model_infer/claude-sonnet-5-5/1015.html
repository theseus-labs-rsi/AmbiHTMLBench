<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二、建议、提案</title>
<script type="text/javascript" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #e8e4dc;
    display: flex;
    justify-content: center;
    font-family: "SimSun", "Microsoft YaHei", serif;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 720px;
    background: #f0ede6;
    padding: 30px 35px 30px 35px;
    box-sizing: border-box;
  }
  .tabs {
    position: absolute;
    top: 0;
    right: 0;
    width: 22px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .tabs div {
    flex: 1;
  }
  .tabs div:nth-child(1) { background: #cfe0e8; }
  .tabs div:nth-child(2) { background: #d8d2c4; }
  .tabs div:nth-child(3) { background: #e0dcc8; }
  .tabs div:nth-child(4) { background: #c9b9a8; }
  .tabs div:nth-child(5) { background: #d8d2c4; }
  .tabs div:nth-child(6) { background: #cfe0e8; }
  .tabs div:nth-child(7) { background: #e0dcc8; }

  h1 {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 10px 0 25px 0;
  }

  .para {
    font-size: 14px;
    line-height: 2;
    text-align: justify;
    margin: 0 0 20px 0;
    text-indent: 2em;
  }

  .format-label {
    color: #2255aa;
    font-size: 15px;
    font-weight: bold;
    margin: 20px 0 15px 0;
  }

  .format-title {
    text-align: center;
    font-size: 14.5px;
    font-weight: bold;
    margin: 0 0 8px 0;
  }

  .format-sub {
    text-align: center;
    font-size: 14px;
    margin: 0 0 15px 0;
  }

  .black-line {
    color: #111;
    font-size: 14px;
    line-height: 1.9;
    font-weight: bold;
  }

  .blue-line {
    color: #2255aa;
    font-size: 14px;
    line-height: 1.9;
  }

  .indent2 {
    text-indent: 2em;
  }

  .indent4 {
    text-indent: 4em;
    display: block;
  }

  .sig-block {
    margin-top: 20px;
    text-align: right;
    padding-right: 40px;
  }

  .sig-block .org {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
    border-bottom: 1px solid #000;
    display: inline-block;
    padding-bottom: 2px;
  }

  .sig-block .date {
    font-weight: bold;
    font-size: 14px;
    border-bottom: 1px solid #000;
    display: inline-block;
    padding-bottom: 2px;
    letter-spacing: 1px;
  }

  .right-align-wrap {
    text-align: right;
    padding-right: 30px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="tabs">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>

  <h1>二、建议、提案</h1>

  <p class="para">建议是指下级部门因某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。</p>

  <div class="format-label">格式：</div>

  <div class="format-title">关于 xxxxx 的建议</div>
  <div class="format-sub">（"发文机关+关于+内容+文种"）</div>

  <div class="black-line">各级领导（称谓要根据具体题目要求分析得出）：</div>

  <div class="black-line indent2">当前，…等问题比较突出（或做了什么工作），为了</div>
  <div class="black-line">做好……工作，提出以下建议：<span class="blue-line">（开头为背景分析，指出存</span></div>
  <div class="blue-line">在的主要问题和目的意义）</div>

  <br>
  <div class="black-line indent2">一、……</div>
  <div class="black-line indent2">二、……</div>
  <div class="black-line indent2">三、……<span class="blue-line">（主体内容还厚为对策题，提出解决问题的措</span></div>
  <div class="blue-line">施）</div>

  <div class="sig-block">
    <div><span class="org">发文机关</span></div><br>
    <div><span class="date">xx 年 xx 月 xX 日</span></div>
  </div>

</div>
</body>
</html>
