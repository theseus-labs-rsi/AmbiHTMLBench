<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT快捷键</title>
<script>
MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f5a8c4;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: #f5a8c4;
    width: 540px;
    padding: 20px 0 30px 0;
    position: relative;
    box-sizing: border-box;
  }

  .title-wrapper {
    display: flex;
    justify-content: center;
    position: relative;
    margin-bottom: -20px;
    z-index: 2;
  }

  .ear {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-bottom: 25px solid white;
    position: absolute;
    top: -15px;
  }

  .ear.left {
    left: 95px;
    transform: rotate(-10deg);
  }

  .ear.right {
    right: 95px;
    transform: rotate(10deg);
  }

  .title-box {
    background: #ffffff;
    border: 3px solid #e85d9a;
    border-radius: 10px;
    padding: 12px 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .hatch {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .hatch span {
    display: block;
    width: 22px;
    height: 2px;
    background: #333;
  }

  .checkmark {
    width: 26px;
    height: 26px;
    background: #6fcf6f;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .title-text {
    font-size: 22px;
    font-weight: bold;
    color: #333;
    letter-spacing: 1px;
  }

  .content-box {
    background: #ffffff;
    margin: 0 20px;
    padding: 40px 30px 30px 30px;
    border-radius: 2px;
    box-sizing: border-box;
  }

  .row {
    display: flex;
    margin-bottom: 20px;
    font-size: 16px;
    color: #222;
  }

  .row .key {
    width: 150px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .row .desc {
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title-wrapper">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="title-box">
      <div class="hatch">
        <span></span><span></span><span></span>
      </div>
      <div class="checkmark">✓</div>
      <div class="title-text">PPT快捷键</div>
    </div>
  </div>

  <div class="content-box">
    <div class="row">
      <div class="key">B</div>
      <div class="desc">黑屏(在演示时)</div>
    </div>
    <div class="row">
      <div class="key">W</div>
      <div class="desc">切换至白屏/从黑白屏恢复放映</div>
    </div>
    <div class="row">
      <div class="key">F4</div>
      <div class="desc">重复上一步操作</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+D</div>
      <div class="desc">快速复制选中对象</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+G</div>
      <div class="desc">组合对象</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+ Shift+ G</div>
      <div class="desc">取消组合</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+Alt+V</div>
      <div class="desc">打开选择性粘贴窗口</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+单击</div>
      <div class="desc">选择多个对象</div>
    </div>
    <div class="row">
      <div class="key">Shift+鼠标</div>
      <div class="desc">拖动等比例缩放图片</div>
    </div>
    <div class="row">
      <div class="key">Shift+ F5</div>
      <div class="desc">从当前页开始放映</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+ Shift+C</div>
      <div class="desc">复制格式</div>
    </div>
    <div class="row">
      <div class="key">Ctrl|+ Shift+V</div>
      <div class="desc">粘贴格式</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+ Shift+ &lt;</div>
      <div class="desc">快速缩小字号</div>
    </div>
    <div class="row">
      <div class="key">Ctrl+ Shift+&gt;</div>
      <div class="desc">快速增大字号</div>
    </div>
  </div>
</div>

</body>
</html>
