<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招商手册写作全流程SOP</title>
<script>
MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background: #0a0a14;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: radial-gradient(circle at 50% 50%, #15151f 0%, #0a0a14 100%);
    position: relative;
    padding: 14px;
    border: 1px solid #333;
  }
  /* decorative border pattern */
  .border-pattern-top, .border-pattern-bottom {
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 26px;
    color: #556;
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.6;
  }
  .side-text-left, .side-text-right {
    position: absolute;
    top: 40px;
    bottom: 40px;
    width: 14px;
    writing-mode: vertical-rl;
    color: #778;
    font-size: 9px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    opacity: 0.6;
  }
  .side-text-left { left: 2px; }
  .side-text-right { right: 2px; }

  .content-wrapper {
    margin: 26px 20px;
    position: relative;
  }

  .header-tag {
    background: #1b1b2a;
    border: 1px solid #4a4a6a;
    color: #cfd0ff;
    font-size: 12px;
    display: inline-block;
    padding: 4px 10px;
    border-radius: 2px;
    margin-bottom: 14px;
  }

  .dots-decor {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    gap: 4px;
  }
  .dots-decor span {
    width: 7px; height: 7px; display: inline-block;
  }
  .dots-decor .sq { border: 1px solid #556; }
  .dots-decor .filled { background: #556; }

  .main-title {
    color: #4de3d1;
    font-size: 23px;
    font-weight: bold;
    margin-top: 6px;
    line-height: 1.5;
  }
  .sub-title {
    color: #f2f2f2;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
  }

  .card {
    position: relative;
    margin-top: 16px;
    width: 460px;
    height: 560px;
    background: #ffffff;
    border-radius: 6px;
    overflow: hidden;
  }

  /* Upper half decorative shapes */
  .shape-purple-top {
    position: absolute;
    top: -40px; left: -60px;
    width: 300px; height: 260px;
    background: #6a5ff0;
    transform: rotate(25deg);
  }
  .shape-teal-diag {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 230px;
    background: linear-gradient(135deg, transparent 45%, #2dd4bf 45%, #2dd4bf 55%, transparent 55%);
  }
  .shape-purple-right-tri {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 170px 230px 0;
    border-color: transparent #6a5ff0 transparent transparent;
  }
  .shape-green-tri {
    position: absolute;
    top: 150px; right: 40px;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 0 90px 90px;
    border-color: transparent transparent #8fd14f transparent;
  }

  .top-text-block {
    position: absolute;
    top: 55px;
    left: 40px;
    z-index: 5;
    color: #fff;
  }
  .year-2023 {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .top-sub1 {
    font-size: 19px;
    font-weight: bold;
    margin-top: 6px;
  }
  .top-sub2 {
    font-size: 12px;
    margin-top: 10px;
    color: #e0e0ff;
  }
  .brand-tag {
    margin-top: 14px;
    background: rgba(255,255,255,0.15);
    display: inline-block;
    padding: 4px 10px;
    font-size: 10px;
    border-radius: 2px;
    color: #fff;
  }

  /* Lower half decorative shapes */
  .shape-purple-mid-tri {
    position: absolute;
    top: 230px; left: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 0 160px 160px;
    border-color: transparent transparent #6a5ff0 transparent;
  }
  .shape-green-bottom-left {
    position: absolute;
    bottom: 60px; left: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 0 110px 110px;
    border-color: transparent transparent #8fd14f transparent;
  }
  .shape-blue-triangle-small {
    position: absolute;
    bottom: 55px; left: 95px;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 30px 50px 30px;
    border-color: transparent transparent #4a6fd4 transparent;
  }
  .shape-purple-bottom-right {
    position: absolute;
    bottom: 0; right: 0;
    width: 230px; height: 260px;
    background: #6a5ff0;
    clip-path: polygon(100% 0, 100% 100%, 20% 100%, 0 40%);
  }

  .catalog-block {
    position: absolute;
    top: 275px;
    left: 40px;
    z-index: 5;
  }
  .catalog-title {
    font-size: 42px;
    font-weight: bold;
    color: #1a1a1a;
    letter-spacing: 4px;
  }
  .catalog-sub {
    font-size: 12px;
    color: #888;
    letter-spacing: 3px;
    margin-top: 4px;
  }

  .toc-list {
    position: absolute;
    top: 325px;
    left: 240px;
    z-index: 5;
  }
  .toc-item {
    display: flex;
    align-items: baseline;
    margin-bottom: 28px;
  }
  .toc-num {
    font-size: 30px;
    font-weight: bold;
    color: #1a1a1a;
    margin-right: 14px;
    min-width: 45px;
  }
  .toc-label {
    font-size: 16px;
    font-weight: bold;
    color: #1a1a1a;
  }
</style>
</head>
<body>
<div class="page">

  <div class="border-pattern-top">
    <span>策划界的搬事佬</span>
    <span>◆</span>
    <span>策划界的搬事佬</span>
    <span>◆</span>
    <span>策划界的搬事佬</span>
  </div>

  <div class="side-text-left">
    <span>策划界的搬事佬</span>
    <span>策划界的搬事佬</span>
    <span>策划界的搬事佬</span>
  </div>
  <div class="side-text-right">
    <span>策划界的搬事佬</span>
    <span>策划界的搬事佬</span>
    <span>策划界的搬事佬</span>
  </div>

  <div class="content-wrapper">
    <span class="header-tag">【Vol 106：招商手册写作/创作全流程SOP】</span>
    <div class="dots-decor">
      <span class="sq"></span><span class="sq"></span><span class="sq"></span>
      <span class="filled"></span><span class="filled"></span><span class="filled"></span>
    </div>

    <div class="main-title">招商手册写作一全流程SOP</div>
    <div class="sub-title">招商手册写作框架，万能模板get!!!</div>

    <div class="card">
      <div class="shape-purple-top"></div>
      <div class="shape-teal-diag"></div>
      <div class="shape-purple-right-tri"></div>
      <div class="shape-green-tri"></div>

      <div class="top-text-block">
        <div class="year-2023">2023</div>
        <div class="top-sub1">招商手册写作全流程SOP</div>
        <div class="top-sub2">(招商手册写作教程)</div>
        <div class="brand-tag">小红书：策划界的搬事佬</div>
      </div>

      <div class="shape-purple-mid-tri"></div>
      <div class="shape-green-bottom-left"></div>
      <div class="shape-blue-triangle-small"></div>
      <div class="shape-purple-bottom-right"></div>

      <div class="catalog-block">
        <div class="catalog-title">目录</div>
        <div class="catalog-sub">CONTENTS</div>
      </div>

      <div class="toc-list">
        <div class="toc-item"><span class="toc-num">01</span><span class="toc-label">品牌概况</span></div>
        <div class="toc-item"><span class="toc-num">02</span><span class="toc-label">品牌优势</span></div>
        <div class="toc-item"><span class="toc-num">03</span><span class="toc-label">品牌形象</span></div>
        <div class="toc-item"><span class="toc-num">04</span><span class="toc-label">产品/服务介绍</span></div>
        <div class="toc-item"><span class="toc-num">05</span><span class="toc-label">合作形式</span></div>
      </div>
    </div>
  </div>

  <div class="border-pattern-bottom">
    <span>策划界的搬事佬</span>
    <span>◆</span>
    <span>策划界的搬事佬</span>
    <span>◆</span>
    <span>策划界的搬事佬</span>
  </div>

</div>
