<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老吴の创业随笔</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #d9c7a8;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .page {
    width: 540px;
    min-height: 700px;
    background: radial-gradient(ellipse at center, #e8dcc0 0%, #d8c6a2 60%, #c9b58a 100%);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 2px),
      radial-gradient(ellipse at center, #e8dcc0 0%, #d8c6a2 60%, #c9b58a 100%);
    box-shadow: inset 0 0 40px rgba(80,60,30,0.3);
    padding: 30px 25px;
    box-sizing: border-box;
    position: relative;
    color: #3a2f1e;
  }

  .title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-top: 20px;
    margin-bottom: 50px;
    color: #2b2113;
  }

  .content {
    font-size: 28px;
    line-height: 1.9;
    text-align: justify;
    text-indent: 2em;
    letter-spacing: 4px;
    color: #2b2113;
    padding: 0 5px;
  }

  .footer {
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #4a3a22;
    position: absolute;
    bottom: 35px;
    left: 0;
    right: 0;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="title">老吴の创业随笔</div>
    <div class="content">
      《易经》中说：“小财靠勤，大财靠德，德不厚，无以载物。”靠出卖时间和劳动力&nbsp;赚钱的人，只能发点小财。一个人每天，时间有限，精力有限，分身乏术。
    </div>
    <div class="footer">
      商业思维|个人提升|创业心得|认知觉醒
    </div>
  </div>
</body>
</html>
