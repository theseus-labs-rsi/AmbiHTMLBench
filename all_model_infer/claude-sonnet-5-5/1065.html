    <p class="para">
      以上是我最近在读的一本书，作家<a href="#" class="author-link">刘继荣<sup>Ø</sup></a>
      《坐在路边鼓掌的人》里面讲的小故事。
    </p>

    <p class="para highlight">
      天下有多少雄心勃勃的父母，奢望自己的孩子既能做顶天立地的栋梁，又能开繁花结硕果。我们的欲望有多深，孩子就有多累。
    </p>

    <p class="para">
      如果孩子能自己找到出路，快乐与成就兼得，如果能平庸而幸福地过一生，父母又何必强求。
    </p>

    <p class="para">
      如果他们健康、快乐，如果那是他们想要的生活，我们的孩子，又何妨做一个普通人。
    </p>
