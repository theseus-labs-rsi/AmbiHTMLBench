  <p class="paragraph"><span class="bold-label">梳头</span>　　梳头是脑部运动最理想的项目，它可以刺激穴位，　增强分泌活动,改善血液循环，　促进新陈代谢。此外，梳头还是治疗失眠、眩晕、心悸、中风后遗症和青少年白发的辅助手段。平时每天可梳头3至5次，每次不少于3至5分钟，其中晚上睡前必须要梳一次。</p>

  <p class="paragraph"><span class="bold-label">伸懒腰</span>　　伸懒腰会使人体的脏器对心、肺产生挤压。持续几秒钟的伸懒腰，使很多淤积的血液被赶回心脏,改善血液循环，使更多的含氧量的血液供给大脑，还可带走肌肉的一些废物，从而消除人体的疲劳。</p>
