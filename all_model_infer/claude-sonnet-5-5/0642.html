<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-controller vs. Micro-processor</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
    }
    .header {
        background: linear-gradient(to right, #1b2a6b, #4a5fab, #c9ccda);
        padding: 15px 20px;
        position: relative;
        display: flex;
        align-items: center;
    }
    .header .square {
        width: 18px;
        height: 18px;
        background: #1b2a6b;
        display: inline-block;
        margin-right: 10px;
        position: relative;
        top: -2px;
    }
    .header h1 {
        color: #fff;
        font-size: 26px;
        margin: 0;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    .diagram-container {
        margin: 40px auto 0 auto;
        width: 850px;
        background: #e8e8e8;
        border-radius: 25px;
        padding: 20px 40px 30px 40px;
        position: relative;
    }

    .titles-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
    }
    .titles-row .left-title {
        margin-left: 60px;
        font-size: 20px;
        font-weight: bold;
        text-decoration: underline;
    }
    .titles-row .right-title {
        margin-right: 60px;
        font-size: 20px;
        font-weight: bold;
        text-decoration: underline;
    }

    .main-row {
        display: flex;
        justify-content: space-between;
    }

    /* Left side - One Chip */
    .one-chip-box {
        background: #1ca9e0;
        border: 3px solid #000;
        width: 280px;
        padding: 10px;
    }
    .one-chip-box .mc-title {
        text-align: center;
        font-weight: bold;
        font-size: 17px;
        margin-bottom: 8px;
    }
    .mc-row {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
    }
    .mc-row > div {
        background: #fff;
        border: 2px solid #000;
        text-align: center;
        font-weight: bold;
        font-size: 14px;
        padding: 6px 4px;
    }
    .mc-row.full > div {
        width: 100%;
    }
    .cpu-box { width: 35%; }
    .timer-box { width: 63%; }
    .memory-box { width: 48%; }
    .clock-box { width: 48%; }
    .io-box { width: 48%; }
    .usart-box { width: 48%; }

    /* Right side - Many Different Chips */
    .many-chips {
        width: 480px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .chip-row {
        display: flex;
        gap: 10px;
        height: 60px;
    }
    .chip {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #000;
        font-weight: bold;
        font-size: 16px;
        color: #000;
    }
    .microprocessor { background: #2e9e4a; color: #000; flex: 1.8; }
    .clock-chip { background: #a0603a; flex: 0.7; }
    .usart-chip { background: #7fd6e8; flex: 1; }

    .memory-chip { background: #1ca9e0; flex: 1; }
    .io-chip { background: #e9dfa0; flex: 1; }

    .timer-chip { background: #a9a9a9; flex: 1; }
    .other-peripherals-row {
        flex: 1;
        display: flex;
        border: 2px solid #000;
        overflow: hidden;
    }
    .other-peripherals-row .label {
        background: #e9dfa0;
        display: flex;
        align-items: center;
        padding-left: 10px;
        font-weight: bold;
        font-size: 16px;
        flex: 1;
    }
    .other-peripherals-row .color-block {
        width: 25px;
    }
    .op-yellow { background: #e9dfa0; }
    .op-green { background: #9fd430; }
    .op-pink { background: #f0a9c0; }

    .footer {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 14px;
        color: #000;
    }
    .page-num {
        position: absolute;
        right: 40px;
        bottom: 20px;
        font-weight: bold;
        font-size: 16px;
    }
</style>
</head>
<body>

<div class="header">
    <div class="square"></div>
    <h1>Micro-controller vs. Micro-processor</h1>
</div>

<div class="diagram-container">

    <div class="titles-row">
        <div class="left-title">One Chip</div>
        <div class="right-title">Many Different Chips</div>
    </div>

    <div class="main-row">
        <!-- Left Side -->
        <div class="one-chip-box">
            <div class="mc-title">Microcontroller</div>
            <div class="mc-row">
                <div class="cpu-box">CPU</div>
                <div class="timer-box">Timer/Counter</div>
            </div>
            <div class="mc-row">
                <div class="memory-box">Memory</div>
                <div class="clock-box">Clock</div>
            </div>
            <div class="mc-row">
                <div class="io-box">I/O Interface</div>
                <div class="usart-box">USART</div>
            </div>
            <div class="mc-row full">
                <div style="width:100%;">Other Peripherals</div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="many-chips">
            <div class="chip-row">
                <div class="chip microprocessor">Microprocessor</div>
                <div class="chip clock-chip">Clock</div>
                <div class="chip usart-chip">USART</div>
            </div>
            <div class="chip-row">
                <div class="chip memory-chip">Memory</div>
                <div class="chip io-chip">I/O Interfaces</div>
            </div>
            <div class="chip-row">
                <div class="chip timer-chip">Timer/Counter</div>
                <div class="other-peripherals-row">
                    <div class="label">Other Peripherals</div>
                    <div class="color-block op-yellow"></div>
                    <div class="color-block op-green"></div>
                    <div class="color-block op-pink"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer">© 2015 by Eng. Mohamed Tarek.</div>
<div class="page-num">7</div>

</body>
</html>
