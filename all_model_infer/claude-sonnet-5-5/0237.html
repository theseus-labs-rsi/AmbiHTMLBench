<style>
  body {

    font-family: "SimSun", "STSong", serif;

  }
  .page {
    width: 1260px;

  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px 10px 40px;
    border-bottom: 4px solid #1a3e7a;
  }
  .header-left {
    font-family: "KaiTi", "STKaiti", cursive;
    font-size: 28px;
    color: #1a3e7a;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .date-text {
    font-size: 16px;
    color: #333;
  }
  .section-title {
    font-size: 26px;
    font-weight: bold;
    color: #000;
  }
  .page-number {
    font-size: 26px;
    color: #000;
  }
  .content-area {
    margin: 25px 30px 25px 30px;

    background-image:

      repeating-linear-gradient(-45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 1px, transparent 1px, transparent 25px);

    min-height: 1550px;

  .slogan-block {

    margin-top: 100px;
    margin-right: 60px;
    position: relative;
    z-index: 2;
  }
  .slogan-line1 {
    font-size: 64px;
    font-weight: bold;
    color: #1a8a3a;
    line-height: 1.1;
    letter-spacing: 4px;
  }
  .slogan-line2 {
    font-size: 48px;
    font-weight: normal;
    color: #3cb043;
    letter-spacing: 4px;
  }
  .placeholder {
    width: 820px;
    height: 820px;
    margin: 20px auto 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .placeholder-caption {
    display: none;
  }
  .body-text {
    margin-top: 40px;
    margin-left: 70px;
    width: 780px;
    font-size: 20px;
    color: #1a1a1a;
    line-height: 2.3;
    text-indent: 2em;
    position: relative;
    z-index: 2;
  }
  .footer-wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 180px;
    overflow: hidden;
    z-index: 1;
  }
  .wave1, .wave2 {
    position: absolute;
    bottom: 0;
    left: -5%;
    width: 110%;
    height: 100px;
  }
  .footer-logo {
    position: absolute;
    bottom: 15px;
    right: 50px;
    font-family: "KaiTi", "STKaiti", cursive;
    font-size: 30px;

    color: #ffffff;
    z-index: 3;
