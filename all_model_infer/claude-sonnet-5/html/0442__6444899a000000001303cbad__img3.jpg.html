<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #333;
    max-width: 550px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 10px 16px;
  }

  .header-left {
    display: flex;
    align-items: center;
    font-size: 17px;
    color: #333;
    font-weight: 500;
  }

  .header-left .arrow {
    font-size: 18px;
    margin-right: 6px;
    color: #555;
  }

  .header-icons {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .icon-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid #f0a500;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f0a500;
    font-size: 13px;
  }

  .section {
    padding: 6px 20px 24px 20px;
  }

  .section-title {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
  }

  .check-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #f0a500;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .section-title span {
    font-size: 17px;
    font-weight: 600;
    color: #222;
  }

  .quote-block {
    font-size: 15.5px;
    line-height: 1.9;
    color: #444;
    text-align: justify;
    padding-left: 30px;
  }

  .source {
    color: #888;
  }

  .spacer {
    height: 28px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="arrow">&#8249;</span>
      <span>金句合集</span>
    </div>
    <div class="header-icons">
      <div class="icon-circle">&#128100;</div>
      <div class="icon-circle">&#8593;</div>
      <div class="icon-circle">&#8230;</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      <div class="check-icon">&#10003;</div>
      <span>他写「成长」，正是你所亲历</span>
    </div>
    <div class="quote-block">
      "我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。"<br>
      <span class="source">——《病隙碎笔》</span>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="section">
    <div class="section-title">
      <div class="check-icon">&#10003;</div>
      <span>他写「磨难」，报之以歌</span>
    </div>
    <div class="quote-block">
      "大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。"<span class="source">——《好运设计》</span>
    </div>
  </div>

</body>
</html>
