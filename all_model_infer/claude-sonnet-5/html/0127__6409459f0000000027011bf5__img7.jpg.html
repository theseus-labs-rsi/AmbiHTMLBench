<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句合集系列</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #e8dcc0;
    font-family: "SimSun", "Songti SC", serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #e5d9ba;
    background-image: linear-gradient(rgba(230,220,190,0.0), rgba(230,220,190,0.0));
    padding: 15px 20px 30px 20px;
    position: relative;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: none;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
  }
  .logo-title {
    font-size: 46px;
    font-weight: bold;
    color: #a83232;
    font-family: "KaiTi", "STKaiti", serif;
    line-height: 1;
    letter-spacing: 2px;
  }
  .logo-sub {
    font-size: 11px;
    color: #a83232;
    letter-spacing: 3px;
    margin-top: 2px;
    font-family: sans-serif;
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-top: 8px;
  }
  .tags {
    font-size: 15px;
    color: #222;
    border-bottom: 2px solid #333;
    padding-bottom: 6px;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .series-title {
    font-size: 18px;
    color: #222;
    border-bottom: 2px solid #333;
    padding-bottom: 6px;
    white-space: nowrap;
  }
  .content {
    margin-top: 20px;
  }
  .entry {
    margin-bottom: 22px;
  }
  .main-line {
    font-size: 24px;
    font-weight: bold;
    color: #1a1a1a;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .annotation {
    font-size: 12px;
    color: #333;
    line-height: 1.7;
  }
  .annotation .label {
    font-weight: bold;
  }
  .annotation p {
    margin: 2px 0;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="logo-block">
      <div class="logo-title">人民日报</div>
      <div class="logo-sub">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="tags">金句 | 素材 | 摘抄</div>
      <div class="series-title">金句合集系列</div>
    </div>
  </div>

  <div class="content">

    <div class="entry">
      <div class="main-line">
        1、愿你千山暮雪海棠依旧,<br>
        不为岁月惊扰平添忧愁。
      </div>
      <div class="annotation">
        <p class="label">释义:</p>
        <p>希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝</p>
        <p>与琐事而烦恼忧愁。</p>
      </div>
    </div>

    <div class="entry">
      <div class="main-line">
        2、总有人间一两风,<br>
        填我十万八千梦。
      </div>
      <div class="annotation">
        <p class="label">释义:</p>
        <p>人间总有那么几处善良和美好的事情,满足你对世界的所有遐想,成</p>
        <p>全你的理想。</p>
      </div>
    </div>

    <div class="entry">
      <div class="main-line">
        3、日出有盼,日落有思,<br>
        平平安安,所遇皆甜。
      </div>
      <div class="annotation">
        <p class="label">释义:</p>
        <p>只要日出就会有盼头,只要有日落就会有思念,祈祷大家平平安安,</p>
        <p>遇到的都是美好。</p>
      </div>
    </div>

  </div>

</div>
</body>
</html>
