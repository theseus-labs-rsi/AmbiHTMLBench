<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二、建议、提案</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #d9d9d9;
    font-family: "Microsoft YaHei", "SimHei", "PingFang SC", sans-serif;
  }
  .page {
    position: relative;
    width: 700px;
    min-height: 900px;
    margin: 20px auto;
    background: #f0eee6;
    padding: 40px 50px 40px 40px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .side-strip {
    position: absolute;
    top: 0;
    right: 0;
    width: 22px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .side-strip div {
    flex: 1;
  }
  h1.title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    margin: 10px 0 25px 0;
    color: #111;
  }
  p.intro {
    font-size: 15px;
    line-height: 1.9;
    color: #111;
    margin: 0 0 25px 0;
    text-align: justify;
  }
  .format-label {
    color: #d4622a;
    font-size: 16px;
    font-weight: bold;
    margin: 20px 0 15px 0;
  }
  .doc-title {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    color: #111;
    margin: 0 0 8px 0;
  }
  .doc-subtitle {
    text-align: center;
    font-size: 15px;
    color: #111;
    margin: 0 0 15px 0;
  }
  .leader-line {
    font-size: 15px;
    color: #111;
    font-weight: bold;
    margin: 15px 0 10px 0;
  }
  .body-text {
    font-size: 15px;
    line-height: 1.9;
    margin: 0;
  }
  .indent {
    text-indent: 2em;
  }
  .blue {
    color: #3b6fc4;
  }
  .black {
    color: #111;
  }
  .list-line {
    font-size: 15px;
    line-height: 2.2;
    color: #111;
    margin-left: 2.5em;
  }
  .signature-block {
    margin-top: 40px;
    text-align: right;
    padding-right: 40px;
  }
  .signature-block .org {
    font-size: 15px;
    font-weight: bold;
    color: #111;
    margin-bottom: 15px;
  }
  .signature-block .date {
    font-size: 15px;
    font-weight: bold;
    color: #111;
  }
</style>
</head>
<body>
<div class="page">

  <h1 class="title">二、建议、提案</h1>

  <p class="intro">
    建议是指下级部门因某个重要事项的解决，需要向上
    级提出解决问题想法的文体。具体写作技巧包括以下几
    个方面。提案一般为政协提案，具体格式见示例。
  </p>

  <div class="format-label">格式：</div>

  <div class="doc-title">关于 xxxxx 的建议</div>
  <div class="doc-subtitle">（"发文机关+关于+内容+文种"）</div>

  <div class="leader-line">各级领导（称谓要根据具体题目要求分析得出）：</div>

  <p class="body-text indent">
    <span class="black">当前，…等问题比较突出（或做了什么工作），为了</span><br>
    <span class="black">做好……工作，提出以下建议：</span><span class="blue">（开头为背景分析，指出存</span><br>
    <span class="blue">在的主要问题和目的意义）</span>
  </p>

  <div class="list-line black">一、…..</div>
  <div class="list-line black">二、…..</div>
  <div class="list-line">
    <span class="black">三、……</span><span class="blue">（主体内容还厚为对策题，提出解决问题的措</span>
  </div>
  <div class="list-line blue" style="margin-left:0;">施）</div>

  <div class="signature-block">
    <div class="org">发文机关</div>
    <div class="date">xx 年 xx 月 xX 日</div>
  </div>

  <div class="side-strip">
    <div style="background:#e6c84f;"></div>
    <div style="background:#e07b39;"></div>
    <div style="background:#6fae7c;"></div>
    <div style="background:#4f9ab8;"></div>
    <div style="background:#e6c84f;"></div>
    <div style="background:#a0c15a;"></div>
    <div style="background:#e07b39;"></div>
  </div>

</div>
</body>
</html>
