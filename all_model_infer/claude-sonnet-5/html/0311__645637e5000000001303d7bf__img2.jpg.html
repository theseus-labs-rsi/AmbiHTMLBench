<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高效背书</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #3f5645;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    background-color: #ffffff;
    border-radius: 16px;
    width: 520px;
    box-sizing: border-box;
    padding: 20px 22px 16px 22px;
    position: relative;
  }
  .title-box {
    background-color: #3f5645;
    color: #ffffff;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    border-radius: 20px;
    padding: 10px 0;
    margin-bottom: 20px;
  }
  .section {
    margin-bottom: 18px;
  }
  .section-title {
    font-weight: bold;
    font-size: 16px;
    color: #111111;
    margin-bottom: 4px;
  }
  .section-body {
    font-size: 15px;
    color: #222222;
    line-height: 1.6;
  }
  .example-block {
    margin-top: 6px;
    font-size: 15px;
    line-height: 1.7;
  }
  .example-row {
    display: flex;
    margin-bottom: 2px;
  }
  .example-label {
    background-color: #f5e93a;
    font-weight: bold;
    padding: 0 2px;
    margin-right: 6px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .example-text {
    flex: 1;
  }
  .bottom-bar {
    display: flex;
    align-items: center;
    background-color: #eef1ec;
    border-radius: 30px;
    padding: 6px 10px;
    margin-top: 10px;
  }
  .avatar-placeholder {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background-color: #f2c9a0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    text-align: center;
    color: #555;
    flex-shrink: 0;
    overflow: hidden;
    line-height: 1.1;
  }
  .bottom-text {
    flex: 1;
    margin-left: 10px;
    font-size: 15px;
    color: #333333;
    font-weight: bold;
  }
  .play-btn {
    width: 26px;
    height: 26px;
    background-color: #3f5645;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .play-btn::after {
    content: "";
    border-left: 9px solid #ffffff;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    margin-left: 2px;
  }
  .footer-id {
    text-align: right;
    font-size: 11px;
    color: #999999;
    margin-top: 8px;
  }
  .highlight-yellow {
    background-color: #f5e93a;
  }
</style>
</head>
<body>
<div class="card">

  <div class="title-box">高效背书</div>

  <div class="section">
    <div class="section-title">01.理解背诵</div>
    <div class="section-body">
      还有几天考试，很多东西还没背。不要慌张，先理解再背诵，考试运用得心应手
    </div>
  </div>

  <div class="section">
    <div class="section-title">02.关键复述</div>
    <div class="section-body">
      边读边画关键词，再把关键词抄在草稿纸上。把内容都遮住，然后就看自己写在草稿纸上的关键词，进行复述
    </div>

    <div class="example-block">
      <div class="example-row">
        <span class="example-label highlight-yellow">原文：</span>
        <span class="example-text">德思礼夫妇总是得意地说他们是非常规矩的人家</span>
      </div>
      <div class="example-row">
        <span class="example-label highlight-yellow">关键：</span>
        <span class="example-text">德思礼夫妇 + 得意 + 非常规矩</span>
      </div>
      <div class="example-row">
        <span class="example-label highlight-yellow">复述：</span>
        <span class="example-text">德思礼夫妇得意地说他们是非常规矩的一家</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">03.关键背诵</div>
    <div class="section-body">
      这样就背关键词，考试的时候也能顺利展开内容
    </div>
  </div>

  <div class="section">
    <div class="section-title">04.睡觉记忆</div>
    <div class="section-body">
      睡前30分钟再复习背诵的内容。睡醒后10分钟，再看关键词进行复述，并默写出来
    </div>
  </div>

  <div class="bottom-bar">
    <div class="avatar-placeholder">[头像:<br>卡通人物]</div>
    <div class="bottom-text">这样背书，就像用了魔法，过目不忘</div>
    <div class="play-btn"></div>
  </div>

  <div class="footer-id">小红书号：4141895475</div>

</div>
</body>
</html>
