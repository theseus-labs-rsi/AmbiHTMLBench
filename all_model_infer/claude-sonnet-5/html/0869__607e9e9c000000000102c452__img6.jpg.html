<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.语法</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #eef2f0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .card {
    width: 540px;
    min-height: 760px;
    background: #8fbfa5;
    padding: 26px 20px 30px 20px;
    position: relative;
  }

  .holes {
    display: flex;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 18px;
  }

  .hole {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #eef2f0;
  }

  .paper {
    background-color: #eef4ee;
    background-image:
      linear-gradient(to right, rgba(150,180,160,0.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(150,180,160,0.35) 1px, transparent 1px);
    background-size: 22px 22px;
    border-radius: 4px;
    padding: 20px 26px 40px 26px;
    position: relative;
    min-height: 680px;
  }

  h1 {
    text-align: center;
    font-size: 34px;
    letter-spacing: 2px;
    color: #333;
    margin: 10px 0 30px 0;
    font-weight: 700;
  }

  p.paragraph {
    font-size: 15px;
    line-height: 2.15;
    color: #333;
    text-align: justify;
    text-indent: 2em;
    margin: 0 0 26px 0;
    letter-spacing: 0.5px;
  }

  .decor {
    position: absolute;
    font-size: 22px;
    color: #f2c94c;
    user-select: none;
  }

  .star1 { top: 205px; left: 40px; font-size: 20px; }
  .star2 { top: 345px; right: 40px; font-size: 18px; transform: rotate(15deg); }
  .star3 { top: 545px; left: 45px; font-size: 20px; }

  .lightning {
    position: absolute;
    top: 335px;
    right: 55px;
    font-size: 26px;
    color: #f2c94c;
  }

  .flower {
    position: absolute;
    bottom: 8px;
    right: 20px;
    width: 60px;
    height: 60px;
  }

  .flower .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: #d9838f;
    text-align: center;
    border: 1px dashed #d9838f;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="holes">
      <div class="hole"></div><div class="hole"></div><div class="hole"></div>
      <div class="hole"></div><div class="hole"></div><div class="hole"></div>
      <div class="hole"></div><div class="hole"></div><div class="hole"></div>
      <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    </div>

    <div class="paper">
      <h1>4.语法</h1>

      <span class="decor star1">☆</span>
      <span class="decor star2">☆</span>
      <span class="decor star3">☆</span>
      <span class="lightning">⚡</span>

      <p class="paragraph">
        语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。
      </p>

      <p class="paragraph">
        虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。
      </p>

      <p class="paragraph">
        学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。
      </p>

      <p class="paragraph">
        零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。
      </p>

      <div class="flower">
        <div class="placeholder">[Flower<br>illustration]</div>
      </div>
    </div>
  </div>
</body>
</html>
