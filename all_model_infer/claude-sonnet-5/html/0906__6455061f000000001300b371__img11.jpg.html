<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background-color: #fff;
    background-image:
      linear-gradient(to right, #dce6f0 1px, transparent 1px),
      linear-gradient(to bottom, #dce6f0 1px, transparent 1px);
    background-size: 24px 24px;
    position: relative;
    font-family: "Kaiti", "STKaiti", "SimSun", cursive, serif;
    padding: 20px 15px;
    box-sizing: border-box;
  }
  .title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #111;
    border: 2px solid #111;
    display: inline-block;
    padding: 4px 18px;
    margin: 10px auto 30px auto;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
  }
  .row {
    display: flex;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .label {
    writing-mode: vertical-rl;
    font-size: 22px;
    font-weight: bold;
    color: #111;
    width: 40px;
    text-align: center;
    letter-spacing: 6px;
    flex-shrink: 0;
    padding-top: 10px;
  }
  .content {
    flex-grow: 1;
    padding-left: 20px;
  }
  .content p {
    margin: 12px 0;
    font-size: 17px;
    color: #c00000;
    line-height: 1.5;
  }
  .content p.black {
    color: #111;
  }
  .indent {
    margin-left: 30px;
  }
  .stamp {
    position: absolute;
    right: 40px;
    top: 355px;
    width: 60px;
    height: 100px;
    border: 2.5px solid #b30000;
    border-radius: 4px;
    color: #b30000;
    writing-mode: vertical-rl;
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    line-height: 1.1;
    padding: 4px 2px;
    box-sizing: border-box;
    opacity: 0.85;
    background: rgba(179,0,0,0.05);
  }
  .divider {
    height: 30px;
  }
  .motto {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
  }
  .motto .black {
    color: #111;
  }
  .motto .red {
    color: #c00000;
  }
  .motto .blue {
    color: #1a3a8f;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title">句段结构作用好处赏析</div>

  <div class="row">
    <div class="label">常见问法</div>
    <div class="content">
      <p>1.请分析这句话的作用是什么?</p>
      <p>2.这句话这样描写有什么好处?</p>
      <p>3.请分析这句话这样描写的表达效果.</p>
    </div>
  </div>

  <div class="divider"></div>

  <div class="row">
    <div class="label">满分公式</div>
    <div class="content">
      <p class="black">① 这是(&nbsp;&nbsp;&nbsp;&nbsp;)描写</p>
      <p class="black indent">生动形象地写出(&nbsp;&nbsp;&nbsp;&nbsp;).</p>
      <p class="black">② 更突出了(&nbsp;&nbsp;&nbsp;&nbsp;)</p>
      <p class="black">③ 前后文呼应/为后文(&nbsp;&nbsp;&nbsp;&nbsp;)做了铺垫.</p>
    </div>
  </div>

  <div class="stamp">李真</div>

  <div class="motto">
    <span class="red">口诀:</span>
    <span class="blue">生动秀&nbsp;&nbsp;感心头&nbsp;&nbsp;勾勾手</span>
  </div>

</div>
</body>
</html>
