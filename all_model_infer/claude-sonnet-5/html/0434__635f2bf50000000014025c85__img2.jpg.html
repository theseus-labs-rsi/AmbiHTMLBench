<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我写的 vs 人民日报写的</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SimSun", "宋体", serif;
      width: 420px;
      margin: 0 auto;
    }

    /* ── Top Section (tan/khaki background) ── */
    .top-section {
      background-color: #c8b888;
      padding: 20px 20px 10px 20px;
      position: relative;
      min-height: 200px;
    }

    .top-label-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .top-label {
      font-size: 26px;
      font-weight: bold;
      color: #1a1a1a;
      white-space: nowrap;
    }

    .red-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 6px solid #cc2222;
      background: transparent;
      display: inline-block;
      flex-shrink: 0;
    }

    .top-content-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .top-text {
      font-size: 17px;
      color: #1a1a1a;
      line-height: 1.8;
      max-width: 200px;
    }

    .child-photo-wrapper {
      position: relative;
      width: 160px;
      flex-shrink: 0;
    }

    .child-photo {
      width: 160px;
      height: 145px;
      background-color: #b0a070;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #555;
      overflow: hidden;
    }

    .child-photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #c8a800;
      color: #1a1a1a;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      padding: 3px 4px;
    }

    /* watermark text on top section */
    .watermark-top {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 22px;
      color: rgba(180, 140, 80, 0.35);
      white-space: nowrap;
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* ── Bottom Section (dark navy/slate background) ── */
    .bottom-section {
      background-color: #3a3f5c;
      padding: 22px 22px 20px 22px;
      position: relative;
    }

    .bottom-label-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .bottom-label {
      font-size: 26px;
      font-weight: bold;
      color: #f0e8d0;
      white-space: nowrap;
    }

    .green-check {
      font-size: 38px;
      color: #44bb44;
      font-weight: bold;
      line-height: 1;
    }

    .bottom-text {
      font-size: 15.5px;
      color: #e8dfc8;
      line-height: 1.95;
      text-align: justify;
    }

    .bottom-citation {
      text-align: right;
      font-size: 13px;
      color: #c8c0a8;
      margin-top: 12px;
    }

    /* watermark text on bottom section */
    .watermark-bottom {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 22px;
      color: rgba(200, 180, 120, 0.18);
      white-space: nowrap;
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- TOP SECTION -->
  <div class="top-section">
    <div class="watermark-top">管中窥豹美女纸</div>

    <div class="top-label-row">
      <span class="top-label">我写的：</span>
      <span class="red-circle"></span>
    </div>

    <div class="top-content-row">
      <div class="top-text">
        我们民族的追梦史充满<br>艰辛。
      </div>
      <div class="child-photo-wrapper">
        <div class="child-photo">
          [Photo: crying child in red shirt]
        </div>
        <div class="child-photo-caption">学习使我妈快乐</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM SECTION -->
  <div class="bottom-section">
    <div class="watermark-bottom">管中窥豹美女纸</div>

    <div class="bottom-label-row">
      <span class="bottom-label">人民日报写的：</span>
      <span class="green-check">✔</span>
    </div>

    <div class="bottom-text">
      我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下"有心杀贼，无力回天"的悲愤，付出"春云碧血，秋雨黄花"的牺牲，发出"拼将十万头颅血，须把乾坤力挽回"的呐喊。
    </div>

    <div class="bottom-citation">
      ——2013.4.1《筑就民族复兴的"中国梦"》
    </div>
  </div>

</body>
</html>
