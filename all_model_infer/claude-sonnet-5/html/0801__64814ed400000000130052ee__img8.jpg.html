<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我想所谓孤独 - Quote Card</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #2e2140;
    width: 540px;
    height: 720px;
    margin: 0 auto;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    position: relative;
    overflow: hidden;
  }
  .corner-text {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 9px;
    color: #4a3d5c;
    letter-spacing: 1px;
  }
  .emblem-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 110px;
  }
  .emblem {
    position: relative;
    width: 150px;
    height: 150px;
  }
  .diamond {
    width: 106px;
    height: 106px;
    border: 2px solid #c9a25f;
    transform: rotate(45deg);
    position: absolute;
    top: 22px;
    left: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .female-symbol {
    transform: rotate(-45deg);
    font-size: 46px;
    color: #c9a25f;
    line-height: 1;
    font-weight: 300;
  }
  .arc-decor {
    position: absolute;
    top: 0;
    left: 0;
    width: 150px;
    height: 150px;
  }
  .quote-en {
    text-align: center;
    color: #c9c0d3;
    font-size: 13px;
    line-height: 1.9;
    margin: 55px auto 0;
    width: 400px;
    position: relative;
  }
  .sparkle {
    position: absolute;
    color: #c9a25f;
    font-size: 16px;
  }
  .sparkle.left {
    left: -30px;
    top: 2px;
  }
  .sparkle.right {
    right: -30px;
    top: 2px;
  }
  .quote-cn {
    text-align: center;
    color: #d4b26a;
    font-size: 24px;
    line-height: 2.3;
    margin-top: 60px;
    font-weight: 500;
    letter-spacing: 2px;
  }
  .quote-mark {
    font-size: 28px;
    vertical-align: -4px;
  }
</style>
</head>
<body>
  <div class="corner-text">[?]</div>

  <div class="emblem-wrap">
    <div class="emblem">
      <svg class="arc-decor" viewBox="0 0 150 150">
        <path d="M 20 75 A 55 55 0 0 1 130 75" fill="none" stroke="#c9a25f" stroke-width="10" stroke-dasharray="6,4" opacity="0.85"/>
      </svg>
      <div class="diamond">
        <div class="female-symbol">&#9792;</div>
      </div>
    </div>
  </div>

  <div class="quote-en">
    <span class="sparkle left">&#10022;</span>
    I think the so-called loneliness refers to the person you are facing,
    whose emotions are not on the same frequency as your own.
    <span class="sparkle right">&#10022;</span>
  </div>

  <div class="quote-cn">
    <span class="quote-mark">&ldquo;</span> 我想所谓孤独，<br>
    就是你面对的那个人，<br>
    他的情绪和你自己的情绪，<br>
    不在同一个频率。<span class="quote-mark">&rdquo;</span>
  </div>
</body>
</html>
