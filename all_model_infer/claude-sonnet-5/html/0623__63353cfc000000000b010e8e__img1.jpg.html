<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 VS 快手 - 产品小课堂</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #f2c98a 0%, #f0c780 100%);
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    min-height: 720px;
    position: relative;
    padding: 22px 20px 30px 20px;
  }
  .main-title {
    text-align: center;
    font-size: 40px;
    font-weight: 900;
    color: #4a2a1a;
    letter-spacing: 2px;
    margin: 10px 0 22px 0;
  }
  .banner-wrap {
    position: relative;
    margin: 0 0 18px 0;
    height: 60px;
  }
  .brush {
    position: absolute;
    left: -6px;
    top: -30px;
    width: 90px;
    height: 110px;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .brush-icon {
    font-size: 60px;
    transform: rotate(-35deg);
  }
  .banner {
    background: #f6b93b;
    border-radius: 30px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 60px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .banner span {
    color: #4a2a1a;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
  }
  .content-card {
    background: #fdf7ec;
    border-radius: 26px;
    padding: 26px 20px 30px 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .section {
    margin-bottom: 26px;
  }
  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .num-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #4a2a1a;
    color: #f6b93b;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 19px;
    font-weight: bold;
    color: #3a2416;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    color: #3a2416;
  }
  thead th {
    background: #f6b93b;
    color: #3a2416;
    font-weight: bold;
    padding: 8px 6px;
    text-align: center;
    border: 1px solid #f0dcb5;
  }
  tbody td {
    padding: 10px 8px;
    border: 1px solid #f0dcb5;
    text-align: center;
    vertical-align: middle;
    line-height: 1.4;
  }
  tbody td.label {
    font-weight: bold;
    background: #fdf7ec;
  }
  .dashed-divider {
    text-align: center;
    color: #f6b93b;
    font-size: 20px;
    letter-spacing: 4px;
    margin-top: 20px;
  }
  .col-slogan { width: 22%; }
  .col-pos { width: 22%; }
  .col-strategy { width: 30%; }
  .col-monetize { width: 26%; }
  .col-pos2 { width: 40%; }
  .col-metric { width: 60%; }
</style>
</head>
<body>
<div class="page">

  <div class="main-title">抖音 VS 快手</div>

  <div class="banner-wrap">
    <div class="brush">
      <div class="brush-icon">🖌️</div>
    </div>
    <div class="banner">
      <span>产品小课堂</span>
    </div>
  </div>

  <div class="content-card">

    <div class="section">
      <div class="section-header">
        <div class="num-circle">03</div>
        <div class="section-title">抖音与快手</div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="col-slogan"></th>
            <th class="col-pos">slogan</th>
            <th class="col-strategy">产品定位</th>
            <th class="col-monetize">策略</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="label">抖音</td>
            <td>记录美好生活</td>
            <td>短视频媒体</td>
            <td>以优质内容为中心</td>
          </tr>
          <tr>
            <td class="label">快手</td>
            <td>拥抱每一种生活</td>
            <td>短视频社区</td>
            <td>以社交中心，大部分流量</td>
          </tr>
        </tbody>
      </table>
      <table style="margin-top:0;">
        <thead>
          <tr>
            <th style="width:22%;"></th>
            <th style="width:78%;">变现</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="label">抖音</td>
            <td>广告收入、电商</td>
          </tr>
          <tr>
            <td class="label">快手</td>
            <td>直播收入、电商</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="num-circle">04</div>
        <div class="section-title">抖音电商与快手电商</div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:22%;"></th>
            <th class="col-pos2">产品定位</th>
            <th class="col-metric">重点指标</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="label">抖音电商</td>
            <td>兴趣逻辑，内容场景刺激需求</td>
            <td>直播间GPM</td>
          </tr>
          <tr>
            <td class="label">快手电商</td>
            <td>信任逻辑，头部主播优势</td>
            <td>复购</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="dashed-divider">- - - - - - - -</div>

  </div>

</div>
</body>
</html>
