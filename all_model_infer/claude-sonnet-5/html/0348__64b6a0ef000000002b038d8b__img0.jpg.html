<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 第三步：调整所得税</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: repeating-linear-gradient(
      90deg,
      #f2e6d3 0px,
      #f2e6d3 6px,
      #eaddc4 6px,
      #eaddc4 12px
    );
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #5a4632;
  }
  .page {
    width: 540px;
    min-height: 720px;
    margin: 14px;
    background: #fdf9f0;
    border: 3px solid #e0a840;
    border-radius: 6px;
    padding: 22px 26px 30px 26px;
    position: relative;
    box-shadow: 0 0 0 6px #fdf9f0 inset;
  }
  .paw {
    font-size: 20px;
    text-align: center;
    color: #d99a3f;
    margin-bottom: -4px;
    letter-spacing: 60px;
  }
  h1 {
    text-align: center;
    color: #b6742a;
    font-size: 24px;
    margin: 6px 0 2px 0;
    letter-spacing: 1px;
  }
  h1.sub {
    margin-top: 0;
    font-size: 24px;
  }
  .highlight-box {
    background: #f6d9a0;
    border-radius: 4px;
    display: inline-block;
    padding: 8px 16px;
    margin: 18px 0 20px 0;
    font-weight: bold;
    color: #6b4a1f;
    font-size: 15px;
  }
  .section-title {
    font-weight: bold;
    color: #4a3a2a;
    font-size: 15px;
    margin: 18px 0 10px 0;
  }
  .row {
    display: flex;
    align-items: center;
    position: relative;
    margin-left: 30px;
  }
  .col-values {
    line-height: 1.9;
    font-size: 14.5px;
    color: #4a3a2a;
    white-space: nowrap;
  }
  .brace {
    font-size: 46px;
    color: #b6742a;
    margin: 0 8px;
    font-weight: 300;
    transform: scaleX(0.6);
  }
  .deferred {
    font-size: 14.5px;
    color: #4a3a2a;
    white-space: nowrap;
  }
  .arrow-wrap {
    position: absolute;
    right: 90px;
    top: 100px;
    width: 24px;
    height: 140px;
  }
  .arrow-line {
    position: absolute;
    left: 8px;
    top: 0;
    width: 8px;
    height: 110px;
    background: #4472c4;
  }
  .arrow-head {
    position: absolute;
    left: 0px;
    top: 108px;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 16px solid #4472c4;
  }
  .group-view {
    position: absolute;
    right: 5px;
    top: 40px;
    text-align: center;
    font-size: 14px;
    color: #4a3a2a;
    line-height: 1.8;
  }
  .group-view .tag {
    background: #6b4a1f;
    color: #fff;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 13px;
    white-space: nowrap;
  }
  .accounting {
    margin-top: 34px;
    margin-left: 30px;
    font-size: 14.5px;
    color: #4a3a2a;
    line-height: 2;
  }
  .cat-corner {
    position: absolute;
    width: 90px;
    height: 90px;
  }
  .cat-corner.left {
    left: -8px;
    bottom: -8px;
  }
  .cat-corner.right {
    right: -8px;
    bottom: -8px;
  }
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: #b08a55;
    border: 1px dashed #d9b97a;
    border-radius: 50%;
    background: #fbeed9;
  }
  .middle-content {
    position: relative;
    min-height: 300px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="paw">🐾&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;🐾</div>
  <h1>内部交易抵销</h1>
  <h1 class="sub">第③步：调整所得税</h1>

  <div class="highlight-box">若实现60%对外销售</div>

  <div class="middle-content">
    <div class="section-title">个别报表层面因为存货跌价准备：</div>
    <div class="row">
      <div class="col-values">
        账面价值 900<br>
        计税基础 1200
      </div>
      <div class="brace">}</div>
      <div class="deferred">递延所得税资产 300*25%=75</div>
    </div>

    <div class="arrow-wrap">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <div class="group-view">
      <span class="tag">【集团角度】</span><br>
      调增25
    </div>

    <div class="section-title" style="margin-top:40px;">合并报表层面因为存货跌价准备：</div>
    <div class="row">
      <div class="col-values">
        账面价值 800<br>
        计税基础 1200
      </div>
      <div class="brace">}</div>
      <div class="deferred">递延所得税资产 400*25%=100</div>
    </div>
  </div>

  <div class="accounting">
    会计处理：借：递延所得税资产25<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;贷：所得税费用25
  </div>

  <div class="cat-corner left">
    <div class="placeholder">[插画：<br>睡觉的猫]</div>
  </div>
  <div class="cat-corner right">
    <div class="placeholder">[插画：<br>戴帽子钓鱼的猫]</div>
  </div>
</div>
</body>
</html>
