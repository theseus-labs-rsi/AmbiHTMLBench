<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写问答 - 展览馆的肋骨</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .photo-frame {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 20px auto;
    background: linear-gradient(120deg, #cba36a 0%, #b8935c 30%, #d8b988 60%, #c7a066 100%);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  /* subtle wood grain lines */
  .wood-texture {
    position: absolute;
    top: 0; left: 0; right: 0; height: 210px;
    background: repeating-linear-gradient(
      100deg,
      rgba(255,255,255,0.05) 0px,
      rgba(120,80,40,0.08) 4px,
      rgba(255,255,255,0.03) 8px
    );
  }
  /* soft shadow band across upper part of photo, mimicking lighting in source */
  .light-shadow {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 260px;
    background: linear-gradient(200deg, rgba(60,40,20,0.15) 0%, rgba(0,0,0,0) 60%);
  }
  /* yellow paper strip peeking from right edge underneath */
  .yellow-strip {
    position: absolute;
    top: 230px;
    right: 0;
    width: 60px;
    height: 470px;
    background: #f2e07a;
    transform: rotate(6deg);
    box-shadow: -2px 0 6px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .yellow-strip .faint-text {
    position: absolute;
    top: 40px;
    left: 8px;
    font-size: 10px;
    color: rgba(60,60,30,0.35);
    line-height: 1.8;
    white-space: nowrap;
  }
  /* main white note paper, slightly rotated like in photo */
  .note-paper {
    position: absolute;
    top: 235px;
    left: 0px;
    width: 500px;
    height: 470px;
    background: #fbfbf8;
    transform: rotate(6deg);
    transform-origin: top left;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    padding: 18px 20px;
    box-sizing: border-box;
  }
  .printed-block {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }
  .question-number {
    font-size: 26px;
    font-weight: bold;
    color: #222;
    line-height: 1.3;
    min-width: 30px;
  }
  .printed-text {
    font-size: 14px;
    color: #222;
    line-height: 1.9;
  }
  .handwritten-block {
    font-family: "STXingkai", "Comic Sans MS", cursive, sans-serif;
    font-size: 26px;
    color: #1a1a2e;
    line-height: 1.55;
    margin-top: 6px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  /* faint printed column visible on far right edge of the underlying page */
  .right-edge-hint {
    position: absolute;
    top: 250px;
    right: 4px;
    font-size: 9px;
    color: rgba(60,60,30,0.4);
    line-height: 2;
    writing-mode: vertical-rl;
  }
  .placeholder {
    border: 1px dashed rgba(0,0,0,0.2);
    color: rgba(0,0,0,0.4);
    font-size: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="photo-frame">
  <div class="wood-texture"></div>
  <div class="light-shadow"></div>

  <!-- yellow paper glimpsed underneath, mostly obscured -->
  <div class="yellow-strip">
    <div class="faint-text">[illegible]</div>
  </div>

  <!-- faint vertical hint of text from the page beneath, barely visible at right edge -->
  <div class="right-edge-hint">[illegible]</div>

  <!-- main handwritten note -->
  <div class="note-paper">
    <div class="printed-block">
      <div class="question-number">26</div>
      <div class="printed-text">
        你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>
        她看到了什么呢？
      </div>
    </div>

    <div class="handwritten-block">我蹲下来，"这根肋骨让你感<br>到不舒服吗？"<br>展览台上是一尊白玉莹莹的肋<br>骨，下面的文学介绍引用了夏娃<br>的来历，说女人都是由肋骨所化。</div>
  </div>
</div>

</body>
</html>
