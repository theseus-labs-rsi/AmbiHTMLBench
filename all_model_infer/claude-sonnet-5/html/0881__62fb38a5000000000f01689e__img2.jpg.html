<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疑惑点三 - 赛场上如何发挥</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #eaf4d3;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: #eaf4d3;
    border: 10px solid #a8d15a;
    border-radius: 30px;
    box-sizing: border-box;
    padding: 20px 22px;
    position: relative;
  }
  .reg-mark {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 22px;
    height: 22px;
    border: 2px solid #333;
    border-radius: 50%;
    text-align: center;
    font-size: 13px;
    line-height: 20px;
    color: #333;
    background: #fff;
  }
  .header {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
  }
  .placeholder.icon {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #555;
    text-align: center;
  }
  .icon-img {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #f45a4a, #d8362a);
    position: relative;
  }
  .icon-img .legs {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    display: flex;
    justify-content: space-between;
  }
  .icon-img .legs div {
    width: 8px;
    height: 18px;
    background: #4a8c3a;
    border-radius: 4px;
  }
  .title-box {
    flex: 1;
    margin-left: 10px;
    background: linear-gradient(135deg, #111 0%, #2a2a2a 40%, #6fbf3a 100%);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .title-box .t1 {
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .title-box .t2 {
    color: #d8f27a;
    font-size: 19px;
    font-weight: bold;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .content {
    font-size: 14.5px;
    color: #222;
    line-height: 1.6;
  }
  .intro {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .section {
    margin-top: 14px;
  }
  .num-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: #7bc142;
    color: #fff;
    border-radius: 50%;
    font-size: 13px;
    font-weight: bold;
    margin-right: 4px;
  }
  .sec-title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .sec-body {
    margin: 2px 0 0 2px;
  }
  .cross {
    color: #e0342a;
    font-weight: bold;
  }
  .circle-mark {
    color: #e0342a;
  }
  .emoji {
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="reg-mark">®</div>

  <div class="header">
    <div class="placeholder icon">
      <div class="icon-img"><div class="legs"><div></div><div></div></div></div>
    </div>
    <div class="title-box">
      <div class="t1">疑惑点三</div>
      <div class="t2">赛场上如何发挥</div>
    </div>
  </div>

  <div class="content">
    <div class="intro">最快上手辩论方式：打一场堂堂正正的辩论赛</div>
    <div class="intro">注意点：</div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">1</span>咬字清晰，表达流畲，保持头脑清醒<span class="emoji">🤔</span></div>
      <div class="sec-body">输出观点注意‼️重音/停顿/起伏/气势</div>
    </div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">2</span>笔不能停，记关键词<span class="emoji">📝</span></div>
      <div class="sec-body">用不同颜色的笔画框标注<span class="circle-mark">〇</span></div>
    </div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">3</span>反驳思维（挖掘机）</div>
      <div class="sec-body">接前提，拆前提；拆逻辑关系；拆数据、削弱效力；</div>
    </div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">4</span>推论思维（推土机）</div>
      <div class="sec-body">重申+延伸论点；举出不同论据；铺陈结辩价值；</div>
    </div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">5</span>战场意识</div>
      <div class="sec-body">
        <span class="emoji">🤺</span>不恋战（不要为了反驳而反驳但是已经离题）<br>
        <span class="emoji">🈲</span>不作死（进攻有利战场和充分准备的战场）<br>
        <span class="emoji">🈲</span>不侵幸（不要刻意回避不利战场，也要充分准备）
      </div>
      <div class="sec-body" style="margin-top:6px;">
        漫无目的的反驳<span class="cross">✕</span>毫无结局的追究<span class="cross">✕</span>突如其来的攻击<span class="cross">✕</span>
      </div>
    </div>

    <div class="section">
      <div class="sec-title"><span class="num-circle">6</span>小结意识<span class="emoji">🔒</span></div>
      <div class="sec-body">说给评委听，结束已经女下的战场</div>
    </div>
  </div>
</div>
</body>
</html>
