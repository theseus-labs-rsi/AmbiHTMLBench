<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维二：分解思维</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background-color: #f2f2f2;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    margin: 0;
    padding: 20px 0;
  }

  .page {
    position: relative;
    width: 560px;
    min-height: 700px;
    background-color: #ffffff;
    box-sizing: border-box;
    padding: 40px 45px;
  }

  /* corner brackets */
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid #a9c1af;
  }
  .corner.top-left {
    top: 12px;
    left: 12px;
    border-right: none;
    border-bottom: none;
  }
  .corner.top-right {
    top: 12px;
    right: 12px;
    border-left: none;
    border-bottom: none;
  }
  .corner.bottom-left {
    bottom: 12px;
    left: 12px;
    border-right: none;
    border-top: none;
  }
  .corner.bottom-right {
    bottom: 12px;
    right: 12px;
    border-left: none;
    border-top: none;
  }

  h1.title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 15px 0 30px 0;
    color: #1a1a1a;
  }

  p.intro {
    font-size: 15px;
    line-height: 2;
    color: #1a1a1a;
    margin: 0 0 30px 0;
    text-align: justify;
  }

  .highlight {
    color: #e04b3f;
    font-weight: bold;
  }

  h2.section {
    font-size: 16px;
    font-weight: bold;
    margin: 25px 0 12px 0;
    color: #1a1a1a;
  }

  p.section-text {
    font-size: 15px;
    line-height: 2;
    color: #1a1a1a;
    margin: 0 0 10px 0;
    text-align: justify;
  }

  .flip-btn {
    position: absolute;
    right: 45px;
    bottom: 90px;
    background-color: #1a1a1a;
    color: #ffffff;
    font-size: 13px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .footer {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: #333333;
  }
</style>
</head>
<body>

<div class="page">
  <div class="corner top-left"></div>
  <div class="corner top-right"></div>
  <div class="corner bottom-left"></div>
  <div class="corner bottom-right"></div>

  <h1 class="title">计算思维二：分解思维</h1>

  <p class="intro">
    分解思维是指<span class="highlight">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）</span>。
  </p>

  <h2 class="section">1、问题梳理</h2>
  <p class="section-text">
    先明确这个复杂问题到底是什么，最终要达到什么目的或效果。
  </p>

  <h2 class="section">2、问题分解</h2>
  <p class="section-text">
    将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。
  </p>

  <h2 class="section">3、整合方案</h2>
  <p class="section-text">
    制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。
  </p>

  <div class="flip-btn">翻页 ▶</div>

  <div class="footer">原创：学习方法社</div>
</div>

</body>
</html>
