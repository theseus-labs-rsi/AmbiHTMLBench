<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b1a;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px;
  }
  .page {
    width: 540px;
    min-height: 720px;
    background: #0b0b1a;
    position: relative;
    padding: 30px 42px;
    border: 1px solid #2a2a44;
  }
  /* side decorative vertical text strips */
  .side-strip {
    position: absolute;
    top: 40px;
    bottom: 40px;
    width: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
  }
  .side-strip.left { left: 6px; }
  .side-strip.right { right: 6px; }
  .side-text {
    writing-mode: vertical-rl;
    color: #6a6a8a;
    font-size: 8px;
    letter-spacing: 2px;
  }
  .side-dot {
    width: 3px;
    height: 3px;
    background: #4a4a6a;
    border-radius: 50%;
  }
  /* top row icons */
  .top-icons {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    margin-bottom: 10px;
    padding-right: 10px;
  }
  .top-icons span {
    width: 8px;
    height: 8px;
    border: 1px solid #7a7aa0;
  }
  .top-icons span.filled {
    background: #7a7aa0;
    border-radius: 1px;
  }
  .tag-line {
    color: #eaeaea;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  .title-block {
    text-align: center;
    margin-bottom: 18px;
  }
  .title-block .line1 {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(90deg,#8b7cf6,#5b8dee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }
  .title-block .line2 {
    font-size: 15px;
    font-weight: bold;
    color: #d8d8e8;
  }
  .title-block .line2 b {
    color: #8b7cf6;
  }

  .card {
    position: relative;
    background: #14142b;
    border-radius: 14px;
    overflow: hidden;
    height: 610px;
  }

  /* ===== upper cover half ===== */
  .cover {
    position: relative;
    height: 330px;
    background: #14142b;
    overflow: hidden;
  }
  .shape-purple-big {
    position: absolute;
    top: -60px;
    left: -40px;
    width: 260px;
    height: 260px;
    background: #6b5cf0;
    transform: rotate(45deg);
  }
  .shape-purple-right {
    position: absolute;
    top: 0;
    right: -60px;
    width: 220px;
    height: 220px;
    background: #6b5cf0;
    transform: rotate(45deg);
  }
  .tri-green {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 0; height: 0;
    border-left: 60px solid transparent;
    border-right: 60px solid transparent;
    border-bottom: 90px solid #8fd35a;
  }
  .wave-teal {
    position: absolute;
    left: -20px;
    top: 140px;
    width: 340px;
    height: 90px;
    background: #2fc7c0;
    clip-path: polygon(0% 40%, 15% 0%, 35% 60%, 55% 10%, 75% 60%, 100% 20%, 100% 100%, 0% 100%);
    opacity: 0.9;
  }
  .cover-text {
    position: relative;
    z-index: 2;
    padding: 55px 34px 0 34px;
    color: #fff;
  }
  .cover-text .year {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .cover-text .sub {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .cover-text .paren {
    font-size: 12px;
    color: #d6d6ee;
    margin-bottom: 16px;
  }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: #eaeaf6;
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 3px;
  }

  /* ===== lower contents half ===== */
  .contents {
    position: relative;
    height: 280px;
    background: #f2f1fa;
    overflow: hidden;
    padding: 26px 34px;
  }
  .tri-blue-small {
    position: absolute;
    top: 0;
    left: 130px;
    width: 0; height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-top: 40px solid #4d6bef;
  }
  .shape-purple-mid {
    position: absolute;
    bottom: -70px;
    left: -60px;
    width: 220px;
    height: 220px;
    background: #6b5cf0;
    transform: rotate(45deg);
    opacity: 0.95;
  }
  .contents-title {
    position: relative;
    z-index: 2;
  }
  .contents-title .cn {
    font-size: 32px;
    font-weight: 900;
    color: #16162e;
    letter-spacing: 4px;
  }
  .contents-title .en {
    font-size: 10px;
    color: #7a7a92;
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .toc-list {
    position: absolute;
    right: 34px;
    top: 40px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .toc-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .toc-item .num {
    font-size: 26px;
    font-weight: 900;
    color: #6b5cf0;
    min-width: 40px;
  }
  .toc-item .label {
    font-size: 15px;
    font-weight: bold;
    color: #16162e;
  }
</style>
</head>
