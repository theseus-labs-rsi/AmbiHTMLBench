<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三、直播后 - 数据复盘</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background: #aeb9c8;
  }
  .page {
    max-width: 700px;
    margin: 0 auto;
    background: #aeb9c8;
    padding-bottom: 40px;
    min-height: 900px;
  }
  .header {
    position: relative;
    background: #8a97ab;
    padding: 30px 20px 25px 20px;
    text-align: center;
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
    color: #ffffff;
    letter-spacing: 4px;
    font-weight: bold;
  }
  .badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 16px;
    padding: 4px 10px;
    text-align: center;
    color: #fff;
    font-size: 10px;
    line-height: 1.4;
  }
  .badge .name {
    font-size: 10px;
  }
  .badge .from {
    font-size: 8px;
    opacity: 0.85;
  }

  .yellow-box {
    background: #f2e3a1;
    padding: 16px 22px 20px 22px;
  }
  .yellow-box .title {
    color: #2b3a6b;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .yellow-box p {
    margin: 4px 0 8px 0;
    font-size: 13px;
    color: #333;
  }
  .yellow-box ul {
    margin: 0;
    padding-left: 20px;
    font-size: 13px;
    color: #333;
    line-height: 1.7;
  }

  .content {
    display: flex;
    padding: 30px 20px 10px 20px;
    align-items: stretch;
  }

  .left-label {
    flex: 0 0 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2e3a1;
    border: 2px solid #2b3a6b;
    border-radius: 8px;
    color: #2b3a6b;
    font-weight: bold;
    font-size: 16px;
    text-align: center;
    align-self: center;
    height: 60px;
    margin-right: 25px;
    position: relative;
  }

  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
  }

  .right-column::before {
    content: "";
    position: absolute;
    left: -25px;
    top: 30px;
    bottom: 30px;
    width: 1px;
    background: #2b3a6b;
  }

  .item-group {
    position: relative;
  }

  .item-group::before {
    content: "";
    position: absolute;
    left: -25px;
    top: 50%;
    width: 25px;
    height: 1px;
    background: #2b3a6b;
  }

  .solid-box {
    background: #2b3a6b;
    color: #fff;
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 6px 6px 0 0;
    line-height: 1.6;
  }

  .dashed-box {
    background: #3d4f8a;
    color: #fff;
    border: 2px dashed #1a2550;
    border-top: none;
    border-radius: 0 0 6px 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>三、直播后</h1>
    <div class="badge">
      <div class="name">@自律的宝妈学姐Renita</div>
      <div class="from">from 小红书</div>
    </div>
  </div>

  <div class="yellow-box">
    <div class="title">2、数据复盘</div>
    <p>进行直播数据复盘的时候，重点关注4个关键数据：</p>
    <ul>
      <li>人气峰值和平均在线</li>
      <li>观众平均停留时长</li>
      <li>带货转化率</li>
      <li>UV价值</li>
    </ul>
  </div>

  <div class="content">
    <div class="left-label">2、数据复盘</div>

    <div class="right-column">

      <div class="item-group">
        <div class="solid-box">
          一般平均在线能稳定在50人左右直播就有基本的带货能力，能够赚到钱
        </div>
        <div class="dashed-box">
          ① 人气峰值和平均在线人数
        </div>
      </div>

      <div class="item-group">
        <div class="solid-box">
          通常停留时长超过2分钟算不错的数据，超过30s是一个及格线
        </div>
        <div class="dashed-box">
          ② 观众平均停留时长
        </div>
      </div>

      <div class="item-group">
        <div class="solid-box">
          一般带货转化率达到1%以上算合格，优秀的3%以上
        </div>
        <div class="dashed-box">
          ③ 带货转化率
        </div>
      </div>

      <div class="item-group">
        <div class="solid-box">
          单个用户给直播间贡献的价值，这个数值越高，说明用户在这个直播间的付费意愿更强
        </div>
        <div class="dashed-box">
          ④ UV价值
        </div>
      </div>

    </div>
  </div>

</div>
</body>
</html>
