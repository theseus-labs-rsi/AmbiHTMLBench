<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Three Thousand - Poster</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fdf6ee;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  .poster {
    position: relative;
    width: 540px;
    height: 720px;
    margin: 20px auto;
    background: #fdf6ee;
    overflow: hidden;
    border: 1px solid #eee;
  }

  /* watercolor splash placeholder */
  .placeholder {
    position: absolute;
    background: repeating-linear-gradient(135deg, #f2d9c0 0px, #f2d9c0 10px, #eecfae 10px, #eecfae 20px);
    opacity: 0.55;
    border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a5a35;
    font-size: 11px;
    font-family: Arial, sans-serif;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .splash-main {
    top: 20px;
    left: 60px;
    width: 400px;
    height: 560px;
  }

  /* Top left block */
  .top-left {
    position: absolute;
    top: 22px;
    left: 22px;
    color: #e8772c;
  }
  .top-left .date {
    font-family: 'Georgia', serif;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 1px;
  }
  .top-left .designed {
    margin-top: 6px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 10px;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  /* Top right block */
  .top-right {
    position: absolute;
    top: 20px;
    right: 22px;
    text-align: right;
    color: #e8772c;
  }
  .top-right .brife {
    font-family: Arial, sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .top-right .butlove {
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: 12px;
    margin-top: 2px;
  }
  .top-right .chinese1 {
    margin-top: 14px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
  }
  .top-right .chinese2 {
    margin-top: 4px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 6px;
  }

  /* Big vertical title left */
  .vertical-title {
    position: absolute;
    top: 130px;
    left: 15px;
    display: flex;
    align-items: flex-start;
  }
  .vertical-col {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'Georgia', serif;
    font-weight: 900;
    color: #e8772c;
    letter-spacing: 2px;
  }
  .col-1 {
    font-size: 42px;
    margin-right: 4px;
  }
  .col-2 {
    font-size: 42px;
  }

  /* Right vertical brand text */
  .brand-vertical {
    position: absolute;
    top: 170px;
    right: 30px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 10px;
    color: #e8b98f;
  }

  /* Bottom right quote */
  .quote-block {
    position: absolute;
    bottom: 90px;
    right: 22px;
    width: 230px;
    text-align: right;
    color: #333;
    font-family: 'Georgia', serif;
    font-size: 12px;
    line-height: 1.5;
  }

  .faith-bar {
    position: absolute;
    bottom: 40px;
    right: 22px;
    background: #e8772c;
    color: #fdf6ee;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px 14px;
  }
</style>
</head>
<body>

<div class="poster">

  <!-- Watercolor splash placeholder -->
  <div class="placeholder splash-main">[Illustration: abstract watercolor splash, orange/tan, center of poster]</div>

  <!-- Top left -->
  <div class="top-left">
    <div class="date">11/07</div>
    <div class="designed">DESIGNED BY<br>KERRLEE</div>
  </div>

  <!-- Top right -->
  <div class="top-right">
    <div class="brife">BRIFE IS LIFE</div>
    <div class="butlove">BUT LOVE IS LONG</div>
    <div class="chinese1">你要知道生命虽短，但爱却很长</div>
    <div class="chinese2">爱你三千遍</div>
  </div>

  <!-- Vertical big title -->
  <div class="vertical-title">
    <div class="vertical-col col-1">I LOVE YOU</div>
    <div class="vertical-col col-2">THREE THOUSAND</div>
  </div>

  <!-- Right vertical brand -->
  <div class="brand-vertical">AUGENSTERN</div>

  <!-- Bottom quote -->
  <div class="quote-block">
    Life was like a box of chocolates,<br>
    you never know what you are gonna get.
  </div>

  <!-- Faith bar -->
  <div class="faith-bar">YOU GOTTA HAVE LITTLE FAITH</div>

</div>

</body>
</html>
