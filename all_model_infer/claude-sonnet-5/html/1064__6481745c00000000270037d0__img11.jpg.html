<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话题、主题意义、主题的联系与区别</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .slide {
    max-width: 560px;
    margin: 0 auto;
  }
  .title-box {
    border: 2px solid #333;
    border-radius: 4px;
    text-align: center;
    padding: 10px 5px;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .title-box .sub {
    font-size: 15px;
    font-weight: normal;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-size: 13px;
  }
  table, th, td {
    border: 1px solid #999;
  }
  th, td {
    padding: 8px 6px;
    text-align: left;
    vertical-align: middle;
  }
  thead th, td.rowhead {
    background: #8b8c5e;
    color: #fff;
    font-weight: bold;
    text-align: center;
  }
  td.rowlabel {
    background: #ded9ad;
    font-weight: bold;
    white-space: nowrap;
  }
  tbody tr:nth-child(odd) td:not(.rowlabel) {
    background: #f2f0df;
  }
  tbody tr:nth-child(even) td:not(.rowlabel) {
    background: #ffffff;
  }

  .banner {
    text-align: center;
    margin: 15px 0 20px 0;
  }
  .banner p {
    font-family: "SimSun", serif;
    font-weight: bold;
    font-style: italic;
    color: #c0392b;
    font-size: 19px;
    margin: 2px 0;
    display: inline-block;
    background: linear-gradient(to top, #f7e017 45%, transparent 45%);
    padding: 0 4px;
  }
  .banner-line { display: block; }

  .diagram-title { margin-bottom: 25px; }

  .diagram-box {
    position: relative;
    width: 100%;
    height: 250px;
    margin-bottom: 10px;
  }

  .label-box {
    position: absolute;
    border: 2px solid #6aa84f;
    background: #fff;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    padding: 6px 4px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .label1 { left: 0px; top: 55px; width: 130px; border-color: #4b7a3d; }
  .label2 { left: 150px; top: 30px; width: 150px; border-color: #8a8a3d; }
  .label3 { left: 335px; top: 0px; width: 165px; border-color: #4b7a3d; }

  .arrow {
    position: absolute;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 14px;
    clip-path: polygon(0 0, 88% 0, 100% 50%, 88% 100%, 0 100%);
  }
  .arrow .small {
    font-size: 10px;
    font-weight: normal;
  }
  .top-arrow {
    top: 95px;
    left: 300px;
    width: 200px;
    height: 42px;
    background: #4a4a4a;
    text-align: right;
    align-items: flex-end;
    padding-right: 20px;
  }
  .mid-arrow {
    top: 140px;
    left: 150px;
    width: 350px;
    height: 42px;
    background: #a3973b;
    align-items: flex-start;
  }
  .bottom-arrow {
    top: 185px;
    left: 0px;
    width: 500px;
    height: 42px;
    background: #2c6e8e;
    align-items: flex-start;
  }

  .citation {
    text-align: right;
    font-size: 11px;
    font-style: italic;
    color: #555;
    margin-top: 5px;
  }

  .placeholder {
    border: 1px dashed #aaa;
    color: #888;
    font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="slide">

  <!-- Top title box -->
  <div class="title-box">
    话题、主题意义、主题的联系与区别<br>
    <span class="sub">（读者视角）</span>
  </div>

  <!-- Comparison table -->
  <table>
    <thead>
      <tr>
        <th style="text-align:center;">概念<br>维度</th>
        <th>话题</th>
        <th>主题意义</th>
        <th>主题</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="rowlabel">意义特征</td>
        <td>具体</td>
        <td>界于二者之间</td>
        <td>抽象</td>
      </tr>
      <tr>
        <td class="rowlabel">表达方式</td>
        <td>直接</td>
        <td>蕴含</td>
        <td>拓展</td>
      </tr>
      <tr>
        <td class="rowlabel">核心意义</td>
        <td>语篇讨论的中心</td>
        <td>语篇的寓意</td>
        <td>语篇寓意所属的范畴</td>
      </tr>
      <tr>
        <td class="rowlabel">本质特征</td>
        <td>特定性</td>
        <td>由语篇内容延伸的普适性（去细节的）</td>
        <td>普遍性</td>
      </tr>
    </tbody>
  </table>

  <!-- Highlighted banner -->
  <div class="banner">
    <span class="banner-line"><p>话题，主题意义，主题</p></span><br>
    <span class="banner-line"><p>与学习活动的层次息息相关</p></span>
  </div>

  <!-- Bottom title box -->
  <div class="title-box diagram-title">
    话题、主题意义、主题的联系与区别<br>
    <span class="sub">（学习视角）</span>
  </div>

  <!-- Staircase diagram -->
  <div class="diagram-box">
    <div class="label-box label1">基于语篇的学习<br>为主</div>
    <div class="label-box label2">深入语篇的学习<br>为主</div>
    <div class="label-box label3">超越语篇的学习<br>为主</div>

    <div class="arrow top-arrow">主题<br><span class="small">What+Why+How+So what(else)</span></div>
    <div class="arrow mid-arrow">主题意义<br><span class="small">Why+How</span></div>
    <div class="arrow bottom-arrow">话题<br><span class="small">What+How</span></div>
  </div>

  <div class="citation">（葛炳芳，2022: 出版中）</div>

</div>
</body>
</html>
