<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侦探能量站 - 手写笔记</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #eae7e2;
    display: flex;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 540px;
    min-height: 700px;
    background-color: #f2efe9;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 31px,
      #c9d6e0 32px
    );
    background-position: 0 60px;
    font-family: "Segoe Script", "Comic Sans MS", "STXihei", "KaiTi", cursive, sans-serif;
    color: #2b2f4a;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    padding: 20px 25px 40px 55px;
    overflow: hidden;
  }

  .margin-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 45px;
    width: 1px;
    background: rgba(200,120,120,0.4);
  }

  .title {
    font-size: 24px;
    color: #4a3f9e;
    margin: 10px 0 22px 0;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .body-text {
    font-size: 17px;
    line-height: 32px;
    color: #2b3a6b;
    white-space: pre-wrap;
  }

  .red-text {
    font-size: 17px;
    line-height: 32px;
    color: #b23b2e;
    margin-top: 25px;
    white-space: pre-wrap;
  }

  .left-margin-notes {
    position: absolute;
    left: -8px;
    bottom: 60px;
    width: 60px;
    font-size: 13px;
    line-height: 30px;
    color: rgba(90,90,90,0.35);
    text-align: left;
    transform: translateX(0);
  }

  .placeholder {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: repeating-linear-gradient(45deg, #7fae6e, #7fae6e 4px, #6a9a5b 4px, #6a9a5b 8px);
    border: 1px solid #4f7a42;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: #fff;
    text-align: center;
    box-shadow: 0 0 3px rgba(0,0,0,0.3);
  }

  .faint-bg-text {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.05;
    font-size: 12px;
    line-height: 20px;
    pointer-events: none;
    white-space: pre-wrap;
    padding: 20px;
    color: #333;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="margin-line"></div>

    <div class="left-margin-notes">
      右移<br>
      [?]刻<br>
      问题
    </div>

    <div class="title">侦探能量站</div>

    <div class="body-text">当偏见裹挟认知，无视事实，操纵舆论的事发
生，我们该如何对待？
如果我不害怕人微言轻，也许你就不会移刀
人言可畏，用心辨别真相，用爱和真诚可以消
融流言，正如各位侦探所言，"千军万马跞过的
时候，小小的一脚都有可能是致命伤，我们
谁都不想成为这样的人，我们也不要成为加
害的人"，遭遇不公时，隐忍不是唯一道路，
我们可以向不公平呐喊，只有大家都勇敢
起来，加害者才会觉得我们没有那么好
欺负。</div>

    <div class="red-text">愿你笔尖下皆自由之风，一笔一画，
一字一句，黑白分明。</div>

    <div class="placeholder">[夹]</div>
  </div>
</body>
</html>
