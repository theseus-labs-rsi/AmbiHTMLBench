<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Notes</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background-color: #3a2c28;
    margin: 0;
    padding: 40px 0;
    display: flex;
    justify-content: center;
    font-family: 'Comic Sans MS', 'Segoe Print', cursive, sans-serif;
  }
  .page {
    background-color: #f5f0e6;
    width: 540px;
    min-height: 700px;
    position: relative;
    padding: 30px 20px 30px 40px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 34px,
      #d8d2c4 35px
    );
  }
  .spine {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    background: linear-gradient(to right, #cfc7b5, #8a8270);
  }
  .row {
    display: flex;
    align-items: baseline;
    margin: 0;
    min-height: 35px;
  }
  .word-col {
    width: 42%;
    font-size: 20px;
    font-style: italic;
    color: #1a1a1a;
    white-space: nowrap;
  }
  .def-col {
    width: 58%;
    font-size: 18px;
    font-style: italic;
    color: #1a1a1a;
  }
  .blue .word-col, .blue .def-col {
    color: #2233aa;
  }
  .indent {
    padding-left: 30px;
  }
  .gap {
    height: 35px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="spine"></div>

  <div class="row">
    <div class="word-col">charity</div>
    <div class="def-col">n.慈善机构</div>
  </div>
  <div class="row">
    <div class="word-col">clarity</div>
    <div class="def-col">n.(思路,图像)清晰</div>
  </div>
  <div class="row">
    <div class="word-col">clarify</div>
    <div class="def-col">v.阐明,阐释</div>
  </div>

  <div class="gap"></div>

  <div class="row">
    <div class="word-col">consistent</div>
    <div class="def-col">adj.一贯的,与...一致的</div>
  </div>
  <div class="row">
    <div class="word-col indent">resist</div>
    <div class="def-col">v.抵制</div>
  </div>
  <div class="row">
    <div class="word-col indent">insist</div>
    <div class="def-col">v.坚持</div>
  </div>

  <div class="gap"></div>

  <div class="row">
    <div class="word-col">insert</div>
    <div class="def-col">v.插入,嵌入</div>
  </div>
  <div class="row">
    <div class="word-col">assert</div>
    <div class="def-col">v.断言;坚持主张</div>
  </div>

  <div class="gap"></div>

  <div class="row blue">
    <div class="word-col">eminent</div>
    <div class="def-col">adj.杰出的</div>
  </div>
  <div class="row blue">
    <div class="word-col">Prominent</div>
    <div class="def-col">adj.杰出的,重要的</div>
  </div>
  <div class="row blue">
    <div class="word-col">eliminate</div>
    <div class="def-col">v.消除;淘汰</div>
  </div>

  <div class="gap"></div>

  <div class="row">
    <div class="word-col">integral</div>
    <div class="def-col">adj.必不可少的</div>
  </div>
  <div class="row">
    <div class="word-col">integrity</div>
    <div class="def-col">n.诚实,正直</div>
  </div>
  <div class="row">
    <div class="word-col">integrate</div>
    <div class="def-col">v.(使)融入</div>
  </div>

  <div class="gap"></div>

  <div class="row blue">
    <div class="word-col">fabricate</div>
    <div class="def-col">v.捏造</div>
  </div>
  <div class="row blue">
    <div class="word-col">fluctuate</div>
    <div class="def-col">v.波动,上浮动</div>
  </div>

</div>
</body>
</html>
