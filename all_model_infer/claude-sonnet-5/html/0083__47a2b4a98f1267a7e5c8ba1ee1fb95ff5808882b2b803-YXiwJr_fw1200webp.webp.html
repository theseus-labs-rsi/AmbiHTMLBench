<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藝術攝影展 - IN THE BLINK OF AN EYE</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #e2e2e0;
    font-family: "Arial", "Helvetica Neue", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1a1a1a;
  }
  .poster {
    width: 1080px;
    min-height: 1440px;
    margin: 0 auto;
    background: #d8d8d6;
    position: relative;
    padding: 40px 50px 60px 40px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header-left {
    display: flex;
    gap: 30px;
    align-items: flex-start;
  }
  .cn-title {
    font-size: 40px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 1px;
    writing-mode: horizontal-tb;
  }
  .en-title {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: 0.5px;
    padding-top: 4px;
  }
  .header-right {
    writing-mode: vertical-rl;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
  }

  .divider {
    border: none;
    border-top: 3px solid #1a1a1a;
    margin: 30px 0 20px 0;
  }

  /* Main title block */
  .main-block {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 10px;
  }
  .cn-big {
    font-size: 170px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -2px;
  }
  .en-big {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.15;
    text-align: left;
    padding-top: 40px;
    white-space: nowrap;
  }

  /* Artist / date row + 之間 */
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 10px;
  }
  .info-left {
    display: flex;
    flex-direction: column;
  }
  .artist-label {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .artist-names {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 60px;
  }
  .date-big {
    font-size: 68px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .cn-vertical-big {
    font-size: 170px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -4px;
    margin-top: -60px;
  }

  .divider2 {
    border: none;
    border-top: 3px solid #1a1a1a;
    margin: 40px 0 0 0;
  }

  /* quote block */
  .quote-block {
    margin-top: 220px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.8;
    letter-spacing: 0.5px;
    max-width: 700px;
  }

  /* footer */
  .footer {
    display: flex;
    align-items: center;
    margin-top: 40px;
    font-size: 16px;
    font-weight: 700;
    flex-wrap: wrap;
    gap: 15px;
  }
  .footer .sep {
    font-weight: 400;
    color: #444;
  }
  .footer .one-coffee {
    margin-left: auto;
    font-size: 18px;
    font-weight: 800;
  }

  .placeholder {
    position: absolute;
    bottom: 130px;
    right: 40px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #f2f2f0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: #555;
    padding: 5px;
  }

  .watermark {
    position: absolute;
    bottom: 90px;
    right: 60px;
    font-size: 18px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    transform: rotate(0deg);
  }
</style>
</head>
<body>
<div class="poster">

  <div class="header">
    <div class="header-left">
      <div class="cn-title">藝術<br>攝影展</div>
      <div class="en-title">ARTIST<br>PHOTO<br>EXHIBITION</div>
    </div>
    <div class="header-right">定格光影</div>
  </div>

  <hr class="divider">

  <div class="main-block">
    <div class="cn-big">瞬息</div>
    <div class="en-big">IN THE<br>BLINK OF<br>AN EYE</div>
  </div>

  <div class="info-row">
    <div class="info-left">
      <div class="artist-label">藝術家</div>
      <div class="artist-names">森蘭 王沐春</div>
      <div class="date-big">08/14</div>
    </div>
    <div class="cn-vertical-big">之間</div>
  </div>

  <hr class="divider2">

  <div class="quote-block">
    IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
    YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
    EVERYTHING IN MY MIND AS AN EXERCISE.
  </div>

  <div class="placeholder">[Logo: 小红书]</div>
  <div class="watermark">小红书号：heyu11221</div>

  <div class="footer">
    <span>活動地址：濱江路西溪街二十七號</span>
    <span class="sep">|</span>
    <span>主辦單位：壹畫咖啡館</span>
    <span class="one-coffee">ONE COFFEE</span>
  </div>

</div>
</body>
</html>
