<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线式构图 - 版式设计</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ececec;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  .poster {
    position: relative;
    width: 550px;
    height: 730px;
    background: #ffffff;
    overflow: hidden;
  }
  .yellow { background: #f2e400; color: #111; }
  .black { background: #111111; color: #f2e400; }

  .block {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Header */
  .title-cn {
    position: absolute;
    top: 22px; left: 40px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #111;
  }
  .title-en {
    position: absolute;
    top: 46px; left: 40px;
    font-size: 10px;
    letter-spacing: 1px;
    color: #444;
  }
  .header-right-cn {
    position: absolute;
    top: 22px; right: 40px;
    font-size: 15px;
    font-weight: 700;
    color: #111;
    text-align: right;
  }
  .header-right-en {
    position: absolute;
    top: 46px; right: 40px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #444;
    text-align: right;
  }

  /* Big chinese single char box */
  .box-ku {
    top: 90px; left: 40px;
    width: 145px; height: 108px;
    font-size: 68px;
    font-weight: 900;
    text-align: center;
    align-items: center;
  }

  .box-cools {
    top: 78px; left: 200px;
    width: 320px; height: 122px;
    padding-left: 20px;
    font-size: 40px;
    font-weight: 900;
    line-height: 1.15;
  }
  .box-cools .en {
    font-size: 34px;
    letter-spacing: 6px;
  }

  .dash1 {
    top: 228px; left: 40px;
    width: 70px; height: 10px;
    background: #111;
  }

  .box-goutu {
    top: 258px; left: 40px;
    width: 145px; height: 128px;
    font-size: 27px;
    font-weight: 900;
    line-height: 1.35;
    padding: 10px 12px;
  }

  .box-yongyuan {
    top: 226px; left: 330px;
    width: 160px; height: 168px;
    font-size: 40px;
    font-weight: 900;
    text-align: right;
    line-height: 1.25;
    padding: 12px 16px;
  }

  .dash2 {
    top: 400px; left: 375px;
    width: 85px; height: 10px;
    background: #111;
  }

  .box-importance {
    top: 410px; left: 40px;
    width: 145px; height: 112px;
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 1.6;
    padding: 12px;
    font-weight: 400;
  }

  .box-topcenter {
    top: 420px; left: 200px;
    width: 320px; height: 128px;
    font-size: 56px;
    font-weight: 900;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* strip of small bars */
  .strip-wrap {
    position: absolute;
    top: 558px; left: 40px;
    width: 480px;
    height: 55px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .strip-row {
    display: flex;
    gap: 5px;
    height: 22px;
  }
  .strip-item {
    background: #111;
    color: #f2e400;
    font-size: 9px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    white-space: nowrap;
  }

  .yellow-circle {
    position: absolute;
    top: 618px; left: 40px;
    width: 92px; height: 92px;
    background: #f2e400;
    border-radius: 50%;
  }

  .coolset-bar {
    position: absolute;
    top: 658px; left: 150px;
    width: 372px; height: 26px;
    background: #111;
    color: #f2e400;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 700;
  }

  .small-yellow {
    position: absolute;
    top: 686px; left: 462px;
    width: 60px; height: 24px;
    background: #f2e400;
  }

  .bottom-text {
    position: absolute;
    top: 700px; left: 40px;
    width: 480px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #111;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="title-cn">曲线式构图</div>
    <div class="title-en">CURVILINEAR COMPOSITION</div>
    <div class="header-right-cn">版式设计</div>
    <div class="header-right-en">2023 / 6 / 07</div>

    <div class="block yellow box-ku">酷</div>

    <div class="block black box-cools">
      <div>酷设而遇</div>
      <div class="en">COOLS</div>
    </div>

    <div class="dash1"></div>

    <div class="block yellow box-goutu">
      <div>构图的</div>
      <div>重要性</div>
    </div>

    <div class="block black box-yongyuan">
      <div>酷设</div>
      <div>永远</div>
    </div>

    <div class="dash2"></div>

    <div class="block black box-importance">
      <div>THE IMPORTANCE</div>
      <div>OF COMPOSITION</div>
    </div>

    <div class="block black box-topcenter">在顶点</div>

    <div class="strip-wrap">
      <div class="strip-row">
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以</div>
      </div>
      <div class="strip-row">
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
        <div class="strip-item">都可以是图片</div>
      </div>
    </div>

    <div class="yellow-circle"></div>

    <div class="coolset-bar">COOL SET IS ALWAYS AT THE TOP</div>

    <div class="small-yellow"></div>

    <div class="bottom-text">我 / 看 / 不 / 懂 / 但 / 大 / 受 / 震 撼</div>

  </div>
</body>
</html>
