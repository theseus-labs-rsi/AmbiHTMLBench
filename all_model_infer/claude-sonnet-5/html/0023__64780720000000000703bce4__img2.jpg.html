<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>达摩流浪者 & 深时之旅 书籍推荐</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #f2eeee;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background-color: #f2eeee;
    padding: 20px 25px;
    box-sizing: border-box;
  }
  .title-banner {
    background-color: #f0d0cf;
    border-radius: 6px;
    text-align: center;
    padding: 14px 0;
    margin-bottom: 18px;
  }
  .title-banner span {
    font-size: 20px;
    font-weight: bold;
    color: #222;
  }
  .book-section {
    display: flex;
    align-items: flex-start;
    margin-bottom: 30px;
  }
  .book-cover {
    width: 165px;
    height: 165px;
    flex-shrink: 0;
    margin-right: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .placeholder {
    width: 165px;
    height: 195px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #555;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  .placeholder1 {
    background: linear-gradient(#c65a3a, #c65a3a);
    color: #f2e5c9;
  }
  .placeholder2 {
    background: linear-gradient(180deg, #1a1108 0%, #4a3a1e 40%, #b06a2c 70%, #d99a3f 100%);
    color: #f5e6c8;
  }
  .book-info {
    flex: 1;
    font-size: 14.5px;
    line-height: 1.9;
    color: #222;
  }
  .score {
    font-weight: bold;
    margin-bottom: 6px;
  }
  .cover-inner1 {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 8px;
    box-sizing: border-box;
  }
  .cover-title1 {
    font-size: 13px;
    color: #f2e5c9;
    margin-bottom: 4px;
  }
  .cover-eng1 {
    font-size: 22px;
    font-weight: bold;
    color: #f5e5c0;
    line-height: 1.1;
    margin-bottom: 30px;
  }
  .cover-inner2 {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    box-sizing: border-box;
    position: relative;
  }
  .cover-eng2-top {
    font-size: 11px;
    color: #e8d9b0;
  }
  .cover-eng2-title {
    font-size: 20px;
    font-weight: bold;
    color: #f8ecc9;
    line-height: 1.1;
  }
  .cover-cn-vertical {
    position: absolute;
    top: 60px;
    left: 8px;
    font-size: 20px;
    font-weight: bold;
    color: #f7ecd0;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
  }
  .cover-cn-vertical2 {
    position: absolute;
    top: 60px;
    left: 90px;
    font-size: 20px;
    font-weight: bold;
    color: #f7ecd0;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
  }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #333;
    letter-spacing: 6px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title-banner"><span>《达摩流浪者》</span></div>

  <div class="book-section">
    <div class="book-cover">
      <div class="placeholder placeholder1">
        <div class="cover-inner1">
          <div class="cover-title1">达摩流浪者</div>
          <div class="cover-eng1">THE<br>DHARMA<br>BUMS</div>
          <div style="font-size:10px;">by<br>JACK KEROUAC</div>
        </div>
      </div>
    </div>
    <div class="book-info">
      <div class="score">评分：8.5</div>
      <div>永远年轻，永远热泪盈眶</div>
      <div>相信每个理想主义的nfper，每个</div>
      <div>在庸碌生活中迷茫的人，每个还</div>
      <div>没被社会总开关控制的人，都会</div>
      <div>被书中纯净又赤诚的灵魂打动。</div>
    </div>
  </div>

  <div class="title-banner"><span>《深时之旅》</span></div>

  <div class="book-section">
    <div class="book-cover">
      <div class="placeholder placeholder2">
        <div class="cover-inner2">
          <div>
            <div class="cover-eng2-top">UNDERLAND</div>
            <div class="cover-eng2-title">A Deep Time<br>Journey</div>
          </div>
          <div class="cover-cn-vertical">之旅</div>
          <div class="cover-cn-vertical2">深时</div>
          <div style="font-size:9px; margin-top:auto;">Robert Macfarlane<br>[著] 王如菲 [译]</div>
        </div>
      </div>
    </div>
    <div class="book-info">
      <div class="score">评分：8.7</div>
      <div>地下，有另外一个世界！</div>
      <div>作者以充满灵性的语言，描绘了地</div>
      <div>下世界一个又一个奇妙的科学现</div>
      <div>象，神秘的传说和感人的故事。</div>
      <div>天呐！惊叹，将是你的主旋律</div>
    </div>
  </div>

  <div class="footer">分 享 好 书 的 Grit</div>

</div>
</body>
</html>
