<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习建议</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #fff;
    margin: 0;
    padding: 30px 40px 60px 40px;
    color: #333;
    max-width: 600px;
  }

  .header {
    position: relative;
    text-align: center;
    margin-bottom: 30px;
  }

  .header .stars {
    font-size: 14px;
    color: #f5a623;
  }

  .header h1 {
    font-size: 34px;
    color: #f4a13a;
    font-weight: 900;
    letter-spacing: 4px;
    margin: 0;
    text-shadow: 1px 1px 0 #ffd9a0;
  }

  .doodle-left, .doodle-right {
    font-size: 20px;
    color: #ccc;
  }

  hr.wavy {
    border: none;
    border-top: 2px dashed #6ec6d8;
    width: 70%;
    margin: 5px auto 0 auto;
  }

  .section {
    margin-top: 35px;
  }

  .section-title {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
  }

  .number {
    color: #f06292;
    font-size: 22px;
    font-weight: bold;
    margin-right: 12px;
    min-width: 30px;
  }

  .title-text {
    color: #f06292;
    font-size: 19px;
    font-weight: bold;
  }

  .body-text {
    font-size: 16px;
    line-height: 2.1;
    margin: 0 0 18px 0;
    text-align: justify;
  }

  .highlight {
    background-color: #ffe58a;
  }

  .bold-red {
    color: #e2413a;
    font-weight: bold;
  }

  .attribution {
    text-align: right;
    font-size: 15px;
    color: #333;
    margin: 5px 0 0 0;
  }

  .figure-wrap {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
  }

  .placeholder {
    width: 90px;
    height: 130px;
    background: #fdf2f2;
    border: 1px dashed #e2a0a0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: #b06;
    border-radius: 6px;
    padding: 4px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="doodle-left">✦﹏✦</div>
    <h1>学习建议</h1>
    <hr class="wavy">
  </div>

  <div class="section">
    <div class="section-title">
      <span class="number">09</span>
      <span class="title-text">「 教材远比练习册重要 」</span>
    </div>

    <p class="body-text">教材远比练习册重要。</p>
    <p class="body-text">
      教材就是我们做题之前所要构建的一个框架，<span class="highlight">先熟悉框架，然后不断地练题，才能将自己学习的这座大厦构建得更加完整。</span>
    </p>
    <p class="attribution">——陈哲峰(被北京大学物理学院录取)</p>
  </div>

  <div class="section">
    <div class="section-title">
      <span class="number">10</span>
      <span class="title-text">「 有关数学与英语的学习方法 」</span>
    </div>

    <p class="body-text">
      数学压轴大题的第二问我没有做出来，但这并没有影响接下来的考试中我的发挥。
    </p>
    <p class="body-text">
      我要保证的，<span class="bold-red">不是做出难题，而是做到容易题不丢分，难题多得分。</span>最后，我数学只有压轴题扣了分。
    </p>

    <div class="figure-wrap">
      <div class="placeholder">[Illustration: girl figure with banner, bottom-right]</div>
    </div>
  </div>

</body>
</html>
