<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT快捷键</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f4a6c1;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .page {
    width: 540px;
    min-height: 720px;
    background: #f4a6c1;
    position: relative;
    padding: 20px 24px 40px 24px;
    box-sizing: border-box;
  }

  /* Top decorative spikes */
  .spikes {
    display: flex;
    justify-content: space-between;
    width: 260px;
    margin: 0 auto -8px auto;
    position: relative;
    z-index: 1;
  }
  .spike {
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 22px solid #ffffff;
    border-top: none;
  }

  .title-box {
    position: relative;
    background: #ffffff;
    border: 3px solid #d64f88;
    border-radius: 6px;
    width: 300px;
    margin: 0 auto 20px auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.05);
  }

  .hatch {
    position: absolute;
    top: 8px;
    bottom: 8px;
    width: 18px;
  }
  .hatch.left { left: -10px; }
  .hatch.right { right: -10px; }
  .hatch-line {
    height: 2px;
    background: #333;
    margin: 3px 0;
  }

  .check {
    background: #6cc24a;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    margin-right: 8px;
    flex-shrink: 0;
  }

  .title-text {
    font-size: 22px;
    font-weight: bold;
    color: #222;
    letter-spacing: 1px;
  }

  .content-panel {
    background: #ffffff;
    border-radius: 4px;
    padding: 30px 26px;
    box-sizing: border-box;
  }

  .row {
    display: flex;
    align-items: baseline;
    margin-bottom: 22px;
  }
  .row:last-child {
    margin-bottom: 0;
  }

  .key {
    width: 150px;
    flex-shrink: 0;
    font-weight: bold;
    font-size: 15px;
    color: #111;
  }

  .desc {
    font-size: 14.5px;
    color: #222;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="spikes">
      <div class="spike"></div>
      <div class="spike"></div>
    </div>

    <div class="title-box">
      <div class="hatch left">
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
      </div>
      <span class="check">&#10003;</span>
      <span class="title-text">PPT快捷键</span>
      <div class="hatch right">
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
        <div class="hatch-line"></div>
      </div>
    </div>

    <div class="content-panel">
      <div class="row"><div class="key">B</div><div class="desc">黑屏(在演示时)</div></div>
      <div class="row"><div class="key">W</div><div class="desc">切换至白屏/从黑白屏恢复放映</div></div>
      <div class="row"><div class="key">F4</div><div class="desc">重复上一步操作</div></div>
      <div class="row"><div class="key">Ctrl+D</div><div class="desc">快速复制选中对象</div></div>
      <div class="row"><div class="key">Ctrl+G</div><div class="desc">组合对象</div></div>
      <div class="row"><div class="key">Ctrl+ Shift+ G</div><div class="desc">取消组合</div></div>
      <div class="row"><div class="key">Ctrl+Alt+V</div><div class="desc">打开选择性粘贴窗口</div></div>
      <div class="row"><div class="key">Ctrl+单击</div><div class="desc">选择多个对象</div></div>
      <div class="row"><div class="key">Shift+鼠标</div><div class="desc">拖动等比例缩放图片</div></div>
      <div class="row"><div class="key">Shift+ F5</div><div class="desc">从当前页开始放映</div></div>
      <div class="row"><div class="key">Ctrl+ Shift+C</div><div class="desc">复制格式</div></div>
      <div class="row"><div class="key">Ctrl|+ Shift+V</div><div class="desc">粘贴格式</div></div>
      <div class="row"><div class="key">Ctrl+ Shift+ &lt;</div><div class="desc">快速缩小字号</div></div>
      <div class="row"><div class="key">Ctrl+ Shift+&gt;</div><div class="desc">快速增大字号</div></div>
    </div>
  </div>
</body>
</html>
