<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals & Objectives</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .slide {
    position: relative;
    width: 1024px;
    height: 768px;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
  }
  .title {
    position: absolute;
    top: 15px;
    right: 45px;
    font-size: 54px;
    color: #3a2626;
    font-weight: 400;
  }
  .subtitle {
    position: absolute;
    top: 148px;
    left: 55px;
    font-size: 32px;
    color: #3a2626;
  }
  .goal {
    position: absolute;
    left: 40px;
    font-size: 33px;
    color: #1a7a7a;
  }
  .goal1 { top: 258px; }
  .goal2 { top: 335px; }
  .goal3 { top: 412px; }
  .goal4 { top: 543px; }
  .goal5 { top: 620px; }

  .brace {
    position: absolute;
    font-size: 230px;
    line-height: 1;
    color: #3a2626;
    font-family: "Times New Roman", serif;
    font-weight: 300;
  }
  .brace-top {
    left: 555px;
    top: 235px;
    height: 270px;
    transform: scaleX(0.6);
  }
  .brace-bottom {
    left: 565px;
    top: 528px;
    height: 175px;
    font-size: 150px;
    transform: scaleX(0.6);
  }

  .arrow-wrap {
    position: absolute;
    display: flex;
    align-items: center;
  }
  .arrow-top { left: 660px; top: 330px; }
  .arrow-bottom { left: 665px; top: 570px; }

  .tri-left {
    width: 0;
    height: 0;
    border-top: 27px solid transparent;
    border-bottom: 27px solid transparent;
    border-right: 42px solid #1a7a7a;
  }
  .rect-tail {
    width: 65px;
    height: 54px;
    background: #1a7a7a;
  }

  .label {
    position: absolute;
    color: #3a2626;
    font-size: 30px;
    text-align: center;
    line-height: 1.15;
  }
  .label-top {
    left: 835px;
    top: 290px;
    width: 160px;
  }
  .label-bottom {
    left: 795px;
    top: 545px;
    width: 200px;
  }
</style>
</head>
<body>
  <div class="slide">

    <div class="title">Goals &amp; Objectives</div>
    <div class="subtitle">From January 1, 2016 &ndash; December 31, 2018, we will:</div>

    <div class="goal goal1">Goal 1: XX</div>
    <div class="goal goal2">Goal 2: XX</div>
    <div class="goal goal3">Goal 3: XX</div>

    <div class="goal goal4">Goal 4: Money</div>
    <div class="goal goal5">Goal 5: People &amp; Infrastructure</div>

    <div class="brace brace-top">}</div>
    <div class="brace brace-bottom">}</div>

    <div class="arrow-wrap arrow-top">
      <div class="tri-left"></div>
      <div class="rect-tail"></div>
    </div>

    <div class="arrow-wrap arrow-bottom">
      <div class="tri-left"></div>
      <div class="rect-tail"></div>
    </div>

    <div class="label label-top">Theory<br>of<br>Change<br>Goals</div>
    <div class="label label-bottom">Organization<br>Goals</div>

  </div>
</body>
</html>
