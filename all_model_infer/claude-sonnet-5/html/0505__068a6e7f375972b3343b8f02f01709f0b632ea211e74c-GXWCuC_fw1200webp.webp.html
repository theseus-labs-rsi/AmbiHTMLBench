<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节 - 稿定艺术展</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "SimSun", "STSong", serif;
    background: #fff;
  }
  .poster {
    position: relative;
    width: 1200px;
    height: 1876px;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
  }

  /* Top-left circled characters */
  .circle-col {
    position: absolute;
    top: 130px;
    left: 78px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .circle {
    width: 52px;
    height: 52px;
    border: 2px solid #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #111;
  }

  /* Main Title 京剧 */
  .title-main {
    position: absolute;
    top: 95px;
    left: 190px;
    font-size: 108px;
    font-weight: bold;
    color: #c8102e;
    line-height: 1.0;
    letter-spacing: 4px;
    writing-mode: vertical-rl;
    z-index: 6;
  }

  /* 艺术节 title */
  .title-sub {
    position: absolute;
    top: 350px;
    left: 195px;
    font-size: 82px;
    font-weight: bold;
    color: #111;
    writing-mode: vertical-rl;
    letter-spacing: 6px;
    z-index: 6;
  }

  /* 稿定艺术展 vertical small text */
  .subtitle-small {
    position: absolute;
    top: 895px;
    left: 92px;
    font-size: 28px;
    color: #222;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
    z-index: 6;
  }

  /* Top right diamond pattern (checkerboard) */
  .diamond-pattern {
    position: absolute;
    top: 118px;
    right: 148px;
    width: 70px;
    height: 70px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    transform: rotate(45deg);
    gap: 1px;
  }
  .diamond-pattern div {
    background: #c8102e;
  }
  .diamond-pattern div:nth-child(even) { background: transparent; }

  /* Gao Ding Yi Shu vertical english text */
  .brand-en {
    position: absolute;
    top: 210px;
    right: 90px;
    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 24px;
    color: #111;
    line-height: 1.6;
    text-align: center;
  }
  .brand-en div { margin-bottom: 4px; }

  /* Big geometric shapes area */
  .shape-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 1200px;
    height: 1876px;
    z-index: 1;
  }

  .pink-circle-top {
    position: absolute;
    top: 543px;
    left: 733px;
    width: 148px;
    height: 148px;
    background: #d9558f;
    border-radius: 50%;
  }

  .red-circle-mid {
    position: absolute;
    top: 803px;
    left: 622px;
    width: 172px;
    height: 172px;
    background: #d81f2a;
    border-radius: 50%;
  }

  .small-red-dot {
    position: absolute;
    top: 1477px;
    left: 706px;
    width: 42px;
    height: 42px;
    background: #d81f2a;
    border-radius: 50%;
  }

  /* Black triangle/mountain shape (large) */
  .black-mountain {
    position: absolute;
    top: 415px;
    left: 792px;
    width: 0;
    height: 0;
    border-left: 300px solid transparent;
    border-right: 300px solid transparent;
    border-bottom: 640px solid #111;
  }
  /* Clip to triangle look using polygon via clip-path instead */
  .black-mountain2 {
    position: absolute;
    top: 415px;
    left: 792px;
    width: 380px;
    height: 640px;
    background: #111;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }

  /* Pink mountain jagged shape behind/right of black triangle */
  .pink-mountain {
    position: absolute;
    top: 690px;
    left: 930px;
    width: 270px;
    height: 250px;
    background: linear-gradient(to bottom, #d9558f, #f7cfe0);
    clip-path: polygon(0% 100%, 15% 40%, 30% 70%, 45% 20%, 60% 60%, 75% 10%, 90% 55%, 100% 30%, 100% 100%);
  }

  .pink-triangle-small {
    position: absolute;
    top: 895px;
    left: 985px;
    width: 0;
    height: 0;
    border-left: 40px solid transparent;
    border-right: 40px solid transparent;
    border-top: 45px solid #d9558f;
  }

  .black-arrow-small {
    position: absolute;
    top: 918px;
    left: 1035px;
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-top: 30px solid #111;
  }

  .pink-triangle-lower {
    position: absolute;
    top: 1108px;
    left: 1145px;
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-top: 35px solid #d9558f;
  }

  /* Vertical red bar */
  .red-bar {
    position: absolute;
    top: 1050px;
    left: 855px;
    width: 66px;
    height: 630px;
    background: #d81f2a;
  }

  /* Birds placeholder */
  .birds {
    position: absolute;
    top: 1595px;
    left: 985px;
    width: 165px;
    height: 90px;
    font-size: 26px;
    color: #333;
    letter-spacing: -2px;
    line-height: 1.1;
  }

  /* Ink mountain landscape at bottom */
  .landscape {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1200px;
    height: 380px;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(80,80,80,0.15) 40%, rgba(20,20,20,0.55) 100%);
    z-index: 2;
  }
  .landscape .caption {
    position: absolute;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #888;
    font-family: sans-serif;
  }

  /* Small trees near bottom */
  .trees {
    position: absolute;
    bottom: 195px;
    left: 795px;
    font-size: 40px;
    color: #333;
    z-index: 3;
  }

  /* Info block */
  .info-block {
    position: absolute;
    top: 1560px;
    left: 78px;
    z-index: 6;
    width: 700px;
  }
  .info-line {
    font-size: 32px;
    color: #111;
    margin-bottom: 14px;
  }
  .info-line .label {
    font-weight: normal;
  }
  .info-line .value {
    font-weight: bold;
  }
  .date-label {
    font-size: 16px;
    letter-spacing: 2px;
    color: #333;
    font-family: Georgia, serif;
    margin-top: 8px;
  }
  .date-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-top: 4px;
    margin-bottom: 14px;
  }
  .date-num {
    font-size: 56px;
    font-weight: bold;
    font-family: Georgia, serif;
    color: #111;
  }
  .date-day {
    font-size: 20px;
    font-family: Georgia, serif;
    color: #111;
    margin-right: 4px;
  }
  .slash {
    font-size: 40px;
    color: #111;
    font-weight: 300;
  }
  .phone-line {
    font-size: 32px;
    color: #111;
    font-weight: bold;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Shapes layer -->
  <div class="shape-container">
    <div class="pink-circle-top"></div>
    <div class="red-circle-mid"></div>
    <div class="black-mountain2"></div>
    <div class="pink-mountain"></div>
    <div class="pink-triangle-small"></div>
    <div class="black-arrow-small"></div>
    <div class="pink-triangle-lower"></div>
    <div class="red-bar"></div>
    <div class="small-red-dot"></div>
  </div>

  <!-- Circled characters top-left: 生旦净末丑 -->
  <div class="circle-col">
    <div class="circle">生</div>
    <div class="circle">旦</div>
    <div class="circle">净</div>
    <div class="circle">末</div>
    <div class="circle">丑</div>
  </div>

  <!-- Main titles -->
  <div class="title-main">京剧</div>
  <div class="title-sub">艺术节</div>
  <div class="subtitle-small">稿定艺术展</div>

  <!-- Top right branding -->
  <div class="diamond-pattern">
    <div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div>
  </div>
  <div class="brand-en">
    <div>Gao</div>
    <div>Ding</div>
    <div>Yi</div>
    <div>Shu</div>
  </div>

  <!-- Birds placeholder -->
  <div class="placeholder birds">[Illustration: flying birds, small flock]</div>

  <!-- Bottom ink landscape placeholder -->
  <div class="placeholder landscape">
    <span class="caption">[Ink-wash mountain landscape, bottom of poster]</span>
  </div>
  <div class="placeholder trees">[Trees: bare, small, bottom right area]</div>

  <!-- Info block -->
  <div class="info-block">
    <div class="info-line"><span class="label">主办方：</span><span class="value">稿定集团</span></div>
    <div class="info-line"><span class="label">地点：</span><span class="value">厦门市稿定剧院</span></div>
    <div class="date-label">DATE.</div>
    <div class="date-row">
      <span class="date-num">12.20</span><span class="date-day">SUN</span>
      <span class="slash">/</span>
      <span class="date-num">12.30</span><span class="date-day">SAT</span>
    </div>
    <div class="phone-line">联系电话： 0592-8888888</div>
  </div>

</div>
</body>
</html>
