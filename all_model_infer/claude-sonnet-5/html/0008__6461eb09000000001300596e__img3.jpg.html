<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具 - 游戏截图</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #333;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
  }
  .screenshot {
    position: relative;
    width: 540px;
    height: 292px;
    margin: 20px auto;
    background: linear-gradient(180deg, #8fa3a8 0%, #7d9296 30%, #b9c6c9 60%, #cdd7d8 100%);
    overflow: hidden;
    border: 1px solid #000;
  }
  .bg-placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    text-align: center;
  }
  .character-placeholder {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-30%);
    width: 60px;
    height: 70px;
    background: rgba(120,120,110,0.4);
    border: 1px dashed rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: rgba(255,255,255,0.7);
    text-align: center;
  }
  .chest-placeholder {
    position: absolute;
    bottom: 15px;
    left: 58%;
    width: 70px;
    height: 55px;
    background: rgba(90,80,60,0.5);
    border: 1px dashed rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: rgba(255,255,255,0.8);
    text-align: center;
  }
  .dialog-box {
    position: absolute;
    top: 68px;
    left: 148px;
    width: 340px;
    height: 122px;
    background: rgba(20, 30, 30, 0.72);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 2px;
    padding: 10px 14px;
    color: #eaf2f2;
  }
  .item-title {
    font-size: 13px;
    font-weight: bold;
    color: #f5f0d8;
    margin-bottom: 4px;
  }
  .item-qty {
    font-size: 11px;
    color: #dfe8e8;
    margin-bottom: 6px;
  }
  .item-body {
    display: flex;
    align-items: flex-start;
  }
  .mask-icon-placeholder {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    margin-right: 10px;
    background: rgba(200,60,60,0.25);
    border: 1px dashed rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: rgba(255,255,255,0.8);
    text-align: center;
  }
  .item-desc {
    font-size: 10.5px;
    line-height: 1.6;
    color: #dfe8e8;
  }
  .open-chest-hint {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 10px;
    color: #eaf2f2;
    display: flex;
    align-items: center;
  }
  .btn-icon-placeholder {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-left: 4px;
    background: rgba(255,255,255,0.3);
    border: 1px dashed rgba(255,255,255,0.6);
    border-radius: 50%;
    font-size: 6px;
    text-align: center;
    line-height: 12px;
  }
</style>
</head>
<body>

<div class="screenshot">
  <!-- Background scene placeholder -->
  <div class="bg-placeholder">[Background: icy stone chamber, snowflakes falling, distant statue on right]</div>

  <!-- Character kneeling placeholder -->
  <div class="character-placeholder">[Character: kneeling figure, bottom-center-left]</div>

  <!-- Chest placeholder -->
  <div class="chest-placeholder">[Chest: stone chest, bottom-center-right]</div>

  <!-- Item info dialog box -->
  <div class="dialog-box">
    <div class="item-title">魔吉拉的面具</div>
    <div class="item-qty">🔲 1</div>
    <div class="item-body">
      <div class="mask-icon-placeholder">[Icon: mask]</div>
      <div class="item-desc">
        从太古时期留传下来的魔具。<br>
        戴上它的话，有些怪物就不容易发现自己。<br>
        这样的珍品并非轻易就能得到。
      </div>
    </div>
    <div class="open-chest-hint">打开箱子<span class="btn-icon-placeholder">A</span></div>
  </div>
</div>

</body>
</html>
