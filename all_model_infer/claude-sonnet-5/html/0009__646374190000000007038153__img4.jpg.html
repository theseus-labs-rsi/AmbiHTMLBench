<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胖胖，中午好</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
  }
  .page {
    position: relative;
    width: 550px;
    margin: 20px auto;
  }
  .text-block {
    font-size: 16px;
    line-height: 1.9;
    color: #111;
    padding: 10px 8px 6px 8px;
    letter-spacing: 0.5px;
  }
  .illustration {
    position: relative;
    width: 100%;
    height: 400px;
    background: linear-gradient(180deg, #eaf3e0 0%, #cfe3c4 100%);
    overflow: hidden;
    border-radius: 2px;
  }
  .placeholder {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #555;
    font-size: 12px;
    background: rgba(255,255,255,0.35);
    border: 1px dashed #999;
  }
  /* Branch with blossoms, upper right */
  .branch {
    top: 0;
    right: 10px;
    width: 220px;
    height: 130px;
  }
  /* Main window scene */
  .window-scene {
    top: 90px;
    left: 10px;
    width: 530px;
    height: 300px;
    background: #f3e8b0;
    border: 6px solid #6f8f4e;
  }
  /* Left window shutter */
  .shutter-left {
    top: 90px;
    left: 10px;
    width: 90px;
    height: 300px;
    background: #eef0d8;
    border: 4px solid #6f8f4e;
  }
  /* Right window shutter */
  .shutter-right {
    top: 90px;
    right: 10px;
    width: 90px;
    height: 300px;
    background: #eef0d8;
    border: 4px solid #6f8f4e;
  }
  /* Center lattice divider */
  .lattice {
    top: 90px;
    left: 200px;
    width: 150px;
    height: 300px;
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, #9fae7a 8px 9px),
      repeating-linear-gradient(-45deg, transparent 0 8px, #9fae7a 8px 9px);
    background-color: #b9c98f;
  }
  /* Duck family bottom left */
  .ducks {
    bottom: 15px;
    left: 40px;
    width: 160px;
    height: 110px;
  }
  /* Pig family bottom right */
  .pigs {
    bottom: 15px;
    right: 40px;
    width: 170px;
    height: 150px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="text-block">
      "胖胖，中午好！"丫丫一进屋就看见了胖胖，
      胖胖害羞地冲丫丫笑。"阿姨，胖胖是用微
      笑来和我打招呼的！"听到丫丫的话，
      大家都笑了起来。
    </div>

    <div class="illustration">
      <div class="placeholder branch">[Illustration: 花枝，右上角，粉色花朵]</div>
      <div class="placeholder shutter-left">[Illustration: 左侧绿色木窗，带窗帘]</div>
      <div class="placeholder shutter-right">[Illustration: 右侧绿色木窗，带窗帘]</div>
      <div class="placeholder window-scene">[Illustration: 窗内黄色房间背景]</div>
      <div class="placeholder lattice">[Illustration: 中间绿色格子窗]</div>
      <div class="placeholder ducks">[Illustration: 鸭子妈妈和小鸭子，窗内左下方]</div>
      <div class="placeholder pigs">[Illustration: 胖胖猪妈妈抱着小猪，窗内右下方]</div>
    </div>
  </div>
</body>
</html>
