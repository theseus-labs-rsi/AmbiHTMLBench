<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: #f2ede6;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    background: #f2ede6;
    padding: 15px 12px 20px 12px;
  }
  .header {
    background: #6f8a76;
    color: #fff;
    text-align: center;
    padding: 14px 10px 10px 10px;
    border-radius: 4px 4px 0 0;
  }
  .header h1 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header .subtitle {
    margin: 0;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.95;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fdfaf6;
    table-layout: fixed;
  }
  thead th {
    background: #7f9c86;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 10px 4px;
    text-align: center;
    border: 1px solid #e8e2d8;
  }
  col.col-tool { width: 15%; }
  col.col-use { width: 42%; }
  col.col-tip { width: 25%; }
  col.col-img { width: 18%; }

  tbody td {
    border: 1px solid #e2ddd2;
    padding: 14px 8px;
    font-size: 12.5px;
    color: #333;
    vertical-align: middle;
    text-align: center;
  }
  tbody tr:nth-child(odd) {
    background: #fdfaf6;
  }
  tbody tr:nth-child(even) {
    background: #f5f1ea;
  }
  .tool-name {
    font-size: 14px;
    font-weight: bold;
    color: #333;
  }
  .tool-required {
    color: #c0504d;
    font-size: 12px;
    font-weight: bold;
    margin-top: 2px;
  }
  .use-text {
    text-align: left;
    line-height: 1.7;
    padding: 0 6px;
  }
  .placeholder {
    width: 70px;
    height: 55px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: #888;
    background: repeating-linear-gradient(
      45deg,
      #eee,
      #eee 6px,
      #f7f7f7 6px,
      #f7f7f7 12px
    );
    border: 1px dashed #ccc;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>钩针工具选择指南</h1>
    <p class="subtitle">——only手作集——</p>
  </div>

  <table>
    <colgroup>
      <col class="col-tool">
      <col class="col-use">
      <col class="col-tip">
      <col class="col-img">
    </colgroup>
    <thead>
      <tr>
        <th>工具</th>
        <th>用途</th>
        <th>初学者建议</th>
        <th>实物图</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>
          <div class="tool-name">钩针</div>
          <div class="tool-required">(必备)</div>
        </td>
        <td class="use-text">
          钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》
        </td>
        <td>3mm左右的钩针最实用</td>
        <td>
          <div class="placeholder">[Photo: 彩色钩针]</div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="tool-name">毛线</div>
          <div class="tool-required">(必备)</div>
        </td>
        <td class="use-text">
          毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》
        </td>
        <td>中粗的宝宝棉/牛奶棉</td>
        <td>
          <div class="placeholder">[Photo: 毛线团]</div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="tool-name">剪刀</div>
          <div class="tool-required">(必备)</div>
        </td>
        <td class="use-text">剪断编织过程中的编织线</td>
        <td>必备</td>
        <td>
          <div class="placeholder">[Photo: 剪刀]</div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="tool-name">缝合针</div>
        </td>
        <td class="use-text">缝合、修补和连接编织面料</td>
        <td>非必须</td>
        <td>
          <div class="placeholder">[Photo: 彩色缝合针]</div>
        </td>
      </tr>
    </tbody>
  </table>

</div>
</body>
</html>
