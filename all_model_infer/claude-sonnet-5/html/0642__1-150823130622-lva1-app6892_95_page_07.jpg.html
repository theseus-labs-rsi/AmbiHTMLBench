<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-controller vs. Micro-processor</title>
<script>
window.MathJax = {tex: {inlineMath: [['$','$']], displayMath: [['$$','$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    width: 1024px;
    height: 768px;
    position: relative;
    background: #fff;
  }
  .header {
    background: linear-gradient(to right, #1a2a5e, #6a7fbf, #ffffff);
    height: 42px;
    display: flex;
    align-items: center;
    position: relative;
    padding-left: 45px;
  }
  .header-square {
    position: absolute;
    left: 8px;
    top: 6px;
    width: 16px;
    height: 16px;
    background: #1a2a6c;
  }
  .header h1 {
    color: #ffffff;
    font-size: 24px;
    font-weight: bold;
    margin: 0;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
  .diagram-container {
    width: 840px;
    height: 380px;
    margin: 60px auto 0 auto;
    background: #e6e6e6;
    border-radius: 20px;
    position: relative;
    padding: 20px 30px;
    box-sizing: border-box;
  }
  .col-title {
    text-decoration: underline;
    font-weight: bold;
    font-size: 20px;
    text-align: center;
    margin-bottom: 10px;
  }
  .left-col {
    position: absolute;
    left: 20px;
    top: 15px;
    width: 270px;
  }
  .left-col .col-title {
    position: relative;
    left: 15px;
    text-align: left;
  }
  .mc-box {
    background: #1ba7e0;
    border: 2px solid #000;
    padding: 8px;
    width: 260px;
    box-sizing: border-box;
    margin-top: 8px;
  }
  .mc-title {
    color: #000;
    font-weight: bold;
    font-size: 15px;
    text-align: center;
    margin-bottom: 6px;
  }
  .mc-row {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
  }
  .mc-cell {
    background: #fff;
    border: 1px solid #000;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    padding: 6px 4px;
    box-sizing: border-box;
  }
  .cpu { width: 60px; }
  .timer-counter { width: 176px; }
  .memory { width: 116px; }
  .clock { width: 120px; }
  .io-interface { width: 130px; }
  .usart { width: 106px; }
  .other-peripherals-cell { width: 244px; }

  .right-col {
    position: absolute;
    left: 340px;
    top: 15px;
    width: 470px;
  }
  .right-col .col-title {
    text-align: left;
    margin-left: 90px;
  }
  .right-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .r-box {
    border: 2px solid #000;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    box-sizing: border-box;
    height: 55px;
  }
  .microprocessor { background: #3fa050; width: 220px; }
  .clock-box { background: #a06a3e; width: 90px; }
  .usart-box { background: #7fc9d4; width: 130px; }
  .memory-box { background: #1ba7e0; width: 220px; height: 55px; }
  .io-box { background: #e8dfa8; width: 230px; height: 55px; }
  .timer-box { background: #9a9a9a; width: 220px; height: 55px; }
  .peripherals-group {
    display: flex;
    width: 230px;
    height: 55px;
    border: 2px solid #000;
    box-sizing: border-box;
    overflow: hidden;
  }
  .peripherals-group span {
    font-weight: bold;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .p-lav { background: #c9b7e6; width: 100px; }
  .p-tan { background: #e8dfa8; width: 40px; }
  .p-green { background: #8fd42a; width: 30px; }
  .p-pink { background: #f6a8c4; width: 60px; }

  .footer {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 15px;
    color: #000;
  }
  .page-num {
    position: absolute;
    bottom: 15px;
    right: 30px;
    font-weight: bold;
    font-size: 15px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="header-square"></div>
    <h1>Micro-controller vs. Micro-processor</h1>
  </div>

  <div class="diagram-container">
    <div class="left-col">
      <div class="col-title">One Chip</div>
      <div class="mc-box">
        <div class="mc-title">Microcontroller</div>
        <div class="mc-row">
          <div class="mc-cell cpu">CPU</div>
          <div class="mc-cell timer-counter">Timer/Counter</div>
        </div>
        <div class="mc-row">
          <div class="mc-cell memory">Memory</div>
          <div class="mc-cell clock">Clock</div>
        </div>
        <div class="mc-row">
          <div class="mc-cell io-interface">I/O Interface</div>
          <div class="mc-cell usart">USART</div>
        </div>
        <div class="mc-row">
          <div class="mc-cell other-peripherals-cell">Other Peripherals</div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="col-title">Many Different Chips</div>
      <div class="right-row">
        <div class="r-box microprocessor">Microprocessor</div>
        <div class="r-box clock-box">Clock</div>
        <div class="r-box usart-box">USART</div>
      </div>
      <div class="right-row">
        <div class="r-box memory-box">Memory</div>
        <div class="r-box io-box">I/O Interfaces</div>
      </div>
      <div class="right-row">
        <div class="r-box timer-box">Timer/Counter</div>
        <div class="peripherals-group">
          <span class="p-lav">Other Peripherals</span>
          <span class="p-tan"></span>
          <span class="p-green"></span>
          <span class="p-pink"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">© 2015 by Eng. Mohamed Tarek.</div>
  <div class="page-num">7</div>

</body>
</html>
