<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, #1b2a52 0%, #16224a 50%, #101a3d 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    min-height: 700px;
    padding: 24px 22px 40px 22px;
    position: relative;
    overflow: hidden;
  }
  .bg-watermark {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 140px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), transparent 60%);
    z-index: 0;
  }
  .title {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.5;
    margin-top: 90px;
    margin-bottom: 24px;
    text-align: left;
    letter-spacing: 1px;
  }
  table {
    position: relative;
    z-index: 1;
    width: 100%;
    border-collapse: collapse;
    background: transparent;
  }
  th, td {
    border: 1px solid rgba(255,255,255,0.35);
    padding: 14px 10px;
    color: #ffffff;
    font-size: 14px;
    text-align: center;
    vertical-align: middle;
  }
  thead th {
    font-size: 15px;
    font-weight: normal;
    padding: 12px 10px;
  }
  td.question {
    text-align: left;
    width: 60%;
    line-height: 1.4;
  }
  td.answer {
    width: 40%;
  }
  tr.note td {
    text-align: center;
    color: #d9dee8;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="bg-watermark"></div>
  <div class="title">富人眼中的富人是咋样？</div>

  <table>
    <thead>
      <tr>
        <th>问题</th>
        <th>回答</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="question">1.您觉得高净值人群资产拥有多少钱才算是？</td>
        <td class="answer">1亿7,388,4万元</td>
      </tr>
      <tr class="note">
        <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr>
        <td class="question">2.请问您每天工作小时数是？</td>
        <td class="answer">8.2小时</td>
      </tr>
      <tr>
        <td class="question">3.您预计退休年龄？</td>
        <td class="answer">59岁</td>
      </tr>
      <tr>
        <td class="question">4.您希望能活到多少岁？</td>
        <td class="answer">88.2岁</td>
      </tr>
      <tr class="note">
        <td colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr>
        <td class="question">5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="answer">6.2个国家</td>
      </tr>
      <tr>
        <td class="question">6.请问您平均每月阅读书籍数量</td>
        <td class="answer">2.4本书</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
