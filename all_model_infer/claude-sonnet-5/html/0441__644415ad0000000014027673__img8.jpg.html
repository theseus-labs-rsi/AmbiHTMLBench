<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长需要关注什么</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    background: #ddd;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
  }
  .slide {
    width: 540px;
    height: 300px;
    background: #ded9c9;
    position: relative;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  /* ---- Slide 1 (title) ---- */
  #slide1 {
    height: 210px;
  }
  .title-banner {
    position: absolute;
    top: 55px;
    left: 100px;
    width: 400px;
    height: 90px;
    background: linear-gradient(90deg, #7f8f6a, #a8b58f);
    clip-path: polygon(0 15%, 100% 0, 100% 85%, 0% 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .title-banner .main-title {
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .title-banner .sub-title {
    color: #eee;
    font-size: 13px;
    margin-top: 8px;
    letter-spacing: 4px;
  }
  .deer-placeholder {
    position: absolute;
    top: 10px;
    left: 40px;
    width: 340px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #556b4a;
    font-size: 12px;
    text-align: center;
    background: radial-gradient(circle at 40% 60%, rgba(150,180,140,0.25), transparent 70%);
  }
  .seal {
    position: absolute;
    bottom: 8px;
    left: 8px;
    width: 26px;
    height: 26px;
    border: 1px solid #a33;
    color: #a33;
    font-size: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1;
  }

  /* ---- Slides 2 & 3 (content) ---- */
  .content-slide {
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    padding: 20px 30px;
    box-sizing: border-box;
  }
  .col {
    width: 42%;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }
  .item {
    margin-bottom: 6px;
  }
  .item .num {
    display: inline-block;
    width: 26px;
    height: 26px;
    line-height: 26px;
    text-align: center;
    border-radius: 50%;
    border: 1px solid #6b8a6b;
    color: #3f6b4a;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .item .txt {
    font-size: 11px;
    color: #333;
    line-height: 1.5;
    margin-top: 2px;
  }
  .item .txt .strategy {
    color: #c0392b;
  }
  .center-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 6px solid #b89b6a;
    background: #efe6d0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: center;
    position: relative;
  }
  .center-circle .circle-text {
    color: #a33;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    line-height: 1.6;
    border: 1px solid #a33;
    padding: 6px 4px;
    width: 70px;
  }
  .right-col .item {
    text-align: left;
  }
  .left-col .item {
    text-align: left;
  }
</style>
</head>
<body>

  <!-- Slide 1: Title -->
  <div class="slide" id="slide1">
    <div class="deer-placeholder">
      [Illustration: deer standing on water, ink-wash style painting, top-left area]
    </div>
    <div class="title-banner">
      <div class="main-title">家长需要关注什么</div>
      <div class="sub-title">章 · 节 · 肆</div>
    </div>
    <div class="seal">[印]</div>
  </div>

  <!-- Slide 2: 成绩怎么看 -->
  <div class="slide content-slide">
    <div class="col left-col">
      <div class="item">
        <div class="num">壹</div>
        <div class="txt">看单科成绩<br>分析优势与劣势科目</div>
      </div>
      <div class="item">
        <div class="num">贰</div>
        <div class="txt">看进步<br>横向整体水平<br>纵向看进退情况</div>
      </div>
      <div class="item">
        <div class="num">叁</div>
        <div class="txt">分析错题</div>
      </div>
    </div>

    <div class="center-circle">
      <div class="circle-text">成绩怎么看</div>
    </div>

    <div class="col right-col">
      <div class="item">
        <div class="num">肆</div>
        <div class="txt">分析题错：<br>是遗憾丢分？是模糊丢分？<br>是不会做丢分？<br><span class="strategy">策略：</span>消除遗憾、纠正模糊、力争突破</div>
      </div>
      <div class="item">
        <div class="num">伍</div>
        <div class="txt">分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</div>
      </div>
    </div>
  </div>

  <!-- Slide 3: 家长五不要 -->
  <div class="slide content-slide">
    <div class="col left-col">
      <div class="item">
        <div class="num">壹</div>
        <div class="txt">不要过度焦虑</div>
      </div>
      <div class="item">
        <div class="num">贰</div>
        <div class="txt">不要过度关注孩子</div>
      </div>
      <div class="item">
        <div class="num">叁</div>
        <div class="txt">不要给孩子过高的期望</div>
      </div>
    </div>

    <div class="center-circle">
      <div class="circle-text">家长五不要</div>
    </div>

    <div class="col right-col">
      <div class="item">
        <div class="num">肆</div>
        <div class="txt">不要过度唠叨</div>
      </div>
      <div class="item">
        <div class="num">伍</div>
        <div class="txt">不要盲目攀比和迷信</div>
      </div>
    </div>
  </div>

</body>
</html>
