<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRADA 产品目录</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #f2f2f2;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    padding: 16px 20px 30px 20px;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
  }

  .brand-box {
    border: 1px dashed #999;
    text-align: center;
    padding: 14px 0;
    margin-bottom: 30px;
  }

  .brand-box h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    letter-spacing: 12px;
    font-size: 30px;
    color: #111;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 6px;
    row-gap: 4px;
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .placeholder {
    width: 100%;
    max-width: 160px;
    height: 90px;
    background: repeating-linear-gradient(
      45deg, #eaeaea, #eaeaea 6px, #f5f5f5 6px, #f5f5f5 12px
    );
    border: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #777;
    box-sizing: border-box;
    padding: 4px;
  }

  .caption {
    margin-top: 8px;
    font-size: 12px;
    color: #222;
    line-height: 1.4;
  }

  .caption .en {
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* staggered vertical positions to mimic original zig-zag layout */
  .row1-left   { grid-column: 1; grid-row: 1; margin-top: 50px; }
  .row1-center { grid-column: 2; grid-row: 1; margin-top: 0px; }
  .row1-right  { grid-column: 3; grid-row: 1; margin-top: 50px; }

  .row2-center { grid-column: 2; grid-row: 2; margin-top: 10px; }

  .row3-left   { grid-column: 1; grid-row: 3; margin-top: 10px; }
  .row3-right  { grid-column: 3; grid-row: 3; margin-top: 10px; }

  .row4-center { grid-column: 2; grid-row: 4; margin-top: 10px; }

  .row5-left   { grid-column: 1; grid-row: 5; margin-top: 10px; }
  .row5-right  { grid-column: 3; grid-row: 5; margin-top: 10px; }

</style>
</head>
<body>

<div class="page">

  <div class="brand-box">
    <h1>PRADA</h1>
  </div>

  <div class="grid">

    <div class="item row1-left">
      <div class="placeholder">[Photo: 黑色玛丽珍高跟鞋]</div>
      <div class="caption">玛丽珍鞋</div>
    </div>

    <div class="item row1-center">
      <div class="placeholder">[Photo: 黑色亮面高跟凉鞋]</div>
      <div class="caption">亮面皮革后饰带<br>高跟鞋</div>
    </div>

    <div class="item row1-right">
      <div class="placeholder">[Photo: 黑色乐福鞋，三角标]</div>
      <div class="caption"><span class="en">CHOCOLATE</span> 亮面<br>皮革乐福鞋</div>
    </div>

    <div class="item row2-center">
      <div class="placeholder">[Photo: 黑色乐福鞋]</div>
      <div class="caption"><span class="en">TRIANGOLO</span> 亮面<br>皮革乐福鞋</div>
    </div>

    <div class="item row3-left">
      <div class="placeholder">[Photo: 黑色厚底系带鞋]</div>
      <div class="caption"><span class="en">MONOLITH</span> 亮面<br>皮革系带鞋</div>
    </div>

    <div class="item row3-right">
      <div class="placeholder">[Photo: 黑色厚底凉鞋]</div>
      <div class="caption"><span class="en">MONOLITH</span> 亮面<br>皮革凉鞋</div>
    </div>

    <div class="item row4-center">
      <div class="placeholder">[Photo: 灰白色厚底运动鞋]</div>
      <div class="caption"><span class="en">DOUBLE WHEEL</span></div>
    </div>

    <div class="item row5-left">
      <div class="placeholder">[Photo: 白色针织运动鞋]</div>
      <div class="caption">华达呢织物运动鞋</div>
    </div>

    <div class="item row5-right">
      <div class="placeholder">[Photo: 白粉色拼接运动鞋]</div>
      <div class="caption"><span class="en">DOWNTOWN</span> 穿孔<br>皮革运动鞋</div>
    </div>

  </div>

</div>

</body>
</html>
