<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色 - 2023</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #fdfaf5;
    color: #222;
    width: 540px;
  }
  .header {
    background: #ee7d1e;
    position: relative;
    padding: 18px 24px 28px 24px;
    color: #111;
  }
  .header .copyright {
    font-size: 22px;
    border: 2px solid #111;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .dots {
    position: absolute;
    top: 55px;
    left: 26px;
    display: grid;
    grid-template-columns: repeat(2, 8px);
    grid-gap: 6px 6px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    background: #111;
    display: inline-block;
    transform: rotate(45deg);
  }
  .header h1 {
    font-size: 46px;
    font-weight: 900;
    margin: 14px 0 0 40px;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .year {
    position: absolute;
    top: 20px;
    right: 24px;
    font-size: 24px;
    font-weight: bold;
    color: #111;
  }
  .stamp {
    position: absolute;
    bottom: 8px;
    right: 24px;
    width: 30px;
    height: 30px;
    border: 1px solid #b04a00;
    color: #b04a00;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
  }

  .intro {
    padding: 18px 24px 10px 24px;
    font-size: 13px;
    line-height: 1.9;
    color: #333;
  }

  .section {
    margin: 18px 24px 24px 24px;
    border: 1.5px solid #ee7d1e;
    border-radius: 10px;
    padding: 16px 18px 18px 18px;
  }

  .section h2 {
    font-size: 19px;
    font-weight: bold;
    color: #111;
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
  }
  .section h2 .icon {
    color: #ee7d1e;
    margin-left: 6px;
    font-size: 16px;
  }

  .placeholder {
    width: 100%;
    height: 130px;
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }

  /* Blob composition 1: green left, yellow blob center, blue right */
  .blob1-bg {
    position: absolute;
    inset: 0;
    background: #1f7a4d;
  }
  .blob1-right {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 55%;
    background: #1a5fa8;
  }
  .blob1-yellow {
    position: absolute;
    top: -10%;
    left: 22%;
    width: 46%;
    height: 120%;
    background: #f5d417;
    border-radius: 50% 40% 60% 45% / 55% 45% 55% 45%;
    transform: rotate(8deg);
  }

  /* Blob composition 2: green-yellow left, pink right, black blob center */
  .blob2-bg {
    position: absolute;
    inset: 0;
    background: #8bc63e;
  }
  .blob2-right {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 45%;
    background: #f2265f;
  }
  .blob2-black {
    position: absolute;
    top: -15%;
    left: 20%;
    width: 55%;
    height: 130%;
    background: #111111;
    border-radius: 55% 45% 40% 60% / 50% 55% 45% 55%;
    transform: rotate(-6deg);
  }

  .caption {
    font-size: 12.5px;
    line-height: 1.85;
    color: #333;
    margin-top: 12px;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="copyright">©</div>
    <div class="dots">
      <span></span><span></span>
      <span></span><span></span>
      <span></span><span></span>
      <span></span><span></span>
    </div>
    <div class="year">2023</div>
    <h1>对比色配色</h1>
    <div class="stamp">瑞</div>
  </div>

  <div class="intro">
    对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都
    使用对比强烈的色彩，所以配色清晰而有力。
  </div>

  <div class="section">
    <h2>富有朝气的配色 <span class="icon">✦</span></h2>
    <div class="placeholder">
      <div class="blob1-bg"></div>
      <div class="blob1-right"></div>
      <div class="blob1-yellow"></div>
    </div>
    <div class="caption">
      以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
    </div>
  </div>

  <div class="section">
    <h2>视觉冲击强烈的配色 <span class="icon">✦</span></h2>
    <div class="placeholder">
      <div class="blob2-bg"></div>
      <div class="blob2-right"></div>
      <div class="blob2-black"></div>
    </div>
    <div class="caption">
      黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，
      视觉冲击强烈。
    </div>
  </div>

</body>
</html>
