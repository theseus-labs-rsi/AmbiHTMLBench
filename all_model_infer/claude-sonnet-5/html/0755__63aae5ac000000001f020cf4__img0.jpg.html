<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗六首</title>
<script type="text/javascript" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #f0c98a;
    display: flex;
    justify-content: center;
    font-family: "SimSun", "STSong", serif;
  }
  .page {
    width: 540px;
    background: #f0c98a;
    padding: 14px;
    box-sizing: border-box;
  }
  .grid-frame {
    background-image:
      linear-gradient(#e9e2c8 1px, transparent 1px),
      linear-gradient(90deg, #e9e2c8 1px, transparent 1px);
    background-size: 20px 20px;
    background-color: #fdfaf0;
    border: 2px solid #8a8a8a;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
  }
  .cell {
    border: 1px solid #b0855a;
    box-sizing: border-box;
    padding: 14px 18px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .author {
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: #333;
  }
  .poem {
    font-size: 16px;
    line-height: 1.9;
    text-align: left;
    align-self: flex-start;
    margin-left: 6px;
    color: #111;
  }
</style>
</head>
<body>
<div class="page">
  <div class="grid-frame">

    <div class="cell">
      <div class="title">《登鹳雀楼》</div>
      <div class="author">（唐－王之涣）</div>
      <div class="poem">
        白日依山尽，<br>
        黄河入海流。<br>
        欲穷千里目，<br>
        更上一层楼。
      </div>
    </div>

    <div class="cell">
      <div class="title">《静夜思》</div>
      <div class="author">（唐－李白）</div>
      <div class="poem">
        床前明月光，<br>
        疑是地上霜。<br>
        举头望明月，<br>
        低头思故乡。
      </div>
    </div>

    <div class="cell">
      <div class="title">《古朗月行》</div>
      <div class="author">（唐－李白）</div>
      <div class="poem">
        小时不识月，<br>
        呼作白玉盘。<br>
        又疑瑶台镜，<br>
        飞在青云端。
      </div>
    </div>

    <div class="cell">
      <div class="title">《寻隐者不遇》</div>
      <div class="author">（唐－贾岛）</div>
      <div class="poem">
        松下问童子，<br>
        言师采药去。<br>
        只在此山中，<br>
        云深不知处。
      </div>
    </div>

    <div class="cell">
      <div class="title">《咏鹅》</div>
      <div class="author">（唐－骆宾王）</div>
      <div class="poem">
        鹅鹅鹅，<br>
        曲项向天歌。<br>
        白毛浮绿水，<br>
        红掌拨清波。
      </div>
    </div>

    <div class="cell">
      <div class="title">《草》</div>
      <div class="author">（唐－白居易）</div>
      <div class="poem">
        离离原上草，<br>
        一岁一枯荣。<br>
        野火烧不尽，<br>
        春风吹又生。
      </div>
    </div>

  </div>
</div>
</body>
</html>
