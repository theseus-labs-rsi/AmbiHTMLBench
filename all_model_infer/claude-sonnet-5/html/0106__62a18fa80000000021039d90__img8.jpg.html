<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body {
    background: #f2e9e1;
    display: flex;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    margin: 0;
    padding: 20px 0;
  }
  .card {
    width: 500px;
    background: #f2e9e1;
    border: 6px solid #ffffff;
    border-radius: 20px;
    padding: 14px 16px 20px 16px;
    box-sizing: border-box;
  }
  .title-box {
    background: #ffffff;
    border-radius: 12px;
    text-align: center;
    padding: 14px 10px;
    margin-bottom: 16px;
    position: relative;
  }
  .title-box h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .title-box .qmark {
    color: #d64545;
    font-size: 22px;
  }
  .section-head {
    display: flex;
    align-items: center;
    margin: 10px 0 8px 2px;
  }
  .section-head .pin {
    color: #d64545;
    font-size: 16px;
    margin-right: 4px;
  }
  .section-head h2 {
    font-size: 15px;
    font-weight: 800;
    margin: 0;
    color: #1a1a1a;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  thead tr {
    background: #2f6f6b;
  }
  thead th {
    color: #ffffff;
    font-weight: 700;
    padding: 10px 6px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.25);
  }
  thead th:last-child { border-right: none; }
  tbody td {
    text-align: center;
    padding: 12px 8px;
    color: #333333;
    border-bottom: 1px solid #eee0d5;
    border-right: 1px solid #eee0d5;
    line-height: 1.4;
  }
  tbody td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }

  .relative-cell {
    position: relative;
  }
  .circle-mark {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    width: 62px;
    height: 30px;
    border: 2px solid #d47a7a;
    border-radius: 50%;
  }
  .sub-note {
    position: relative;
    text-align: center;
    font-size: 11px;
    color: #2a2a2a;
    background: transparent;
    margin: -4px 0 4px 0;
    z-index: 2;
  }
  .summary-banner {
    background: #2a2a2a;
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 700;
    text-align: center;
    padding: 10px 6px;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .summary-banner .highlight {
    color: #e8b800;
  }
  .red-bold {
    color: #d64545;
    font-weight: 800;
  }
  .blue-banner {
    background: #4a90c4;
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    padding: 6px 4px;
    border-radius: 6px;
    margin: 2px 0 4px 0;
  }
  .placeholder {
    display: none;
  }
</style>
</head>
<body>

<div class="card">

  <div class="title-box">
    <h1>猫砂都有哪些款<span class="qmark">❓</span></h1>
  </div>

  <div class="section-head">
    <span class="pin">📍</span>
    <h2>三种猫砂尺寸哪个是你最爱</h2>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:22%;">尺寸</th>
        <th style="width:22%;">重量</th>
        <th style="width:26%;">结团效果</th>
        <th style="width:30%;">其他</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1.5mm</td>
        <td>轻</td>
        <td>上</td>
        <td>易带出，价格<br>略高</td>
      </tr>
      <tr>
        <td class="relative-cell">
          <div class="circle-mark"></div>
          2mm
        </td>
        <td>中</td>
        <td>中</td>
        <td>综合性价比高</td>
      </tr>
      <tr>
        <td>3mm</td>
        <td>重</td>
        <td>67</td>
        <td>推荐度低，但<br>价格也低</td>
      </tr>
    </tbody>
  </table>
  <div class="sub-note">综合性价比推荐</div>

  <div class="section-head" style="margin-top:14px;">
    <span class="pin">📍</span>
    <h2>猫砂都有哪些种类</h2>
  </div>

  <div class="summary-banner">总结：<span class="highlight">2mm混合砂yyds</span></div>

  <table>
    <thead>
      <tr>
        <th style="width:24%;">种类</th>
        <th style="width:38%;">优点</th>
        <th style="width:38%;">其他</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>膨润土</td>
        <td>价格低廉</td>
        <td>粉尘大</td>
      </tr>
      <tr>
        <td>豆腐猫砂</td>
        <td>原料更安全，闻起来也比较好</td>
        <td>价格偏高，纯豆腐结团略差</td>
      </tr>
      <tr>
        <td class="relative-cell">
          <div class="circle-mark" style="width:70px;height:34px;"></div>
          混合猫砂
        </td>
        <td>结合上述优点，价格适中</td>
        <td>比例推荐<span class="red-bold">7:3或6:4</span>，结团快且用量省</td>
      </tr>
      <tr>
        <td>沸石</td>
        <td>可循环利用</td>
        <td>需要自己洗</td>
      </tr>
      <tr>
        <td>其他新型原料</td>
        <td>价格高，新颖</td>
        <td>效果待考核，贵</td>
      </tr>
    </tbody>
  </table>
  <div class="blue-banner">⬆普通养宠家庭足以满足需求✅</div>

</div>

</body>
</html>
