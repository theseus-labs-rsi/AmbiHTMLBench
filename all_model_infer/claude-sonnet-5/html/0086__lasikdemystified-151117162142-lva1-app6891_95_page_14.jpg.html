<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Should Be Less Than 40%</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #5b7a6b, #3f5648);
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }

  .title-bar {
    background: linear-gradient(to bottom, #eaf6fb 0%, #6fb6c9 50%, #4a9bb0 100%);
    padding: 18px 30px;
    margin: 20px 25px 0 25px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .title-bar h1 {
    margin: 0;
    color: #fff700;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
  }

  .content-box {
    background: linear-gradient(to bottom, #f5fbfd 0%, #ffffff 15%, #ffffff 100%);
    width: 730px;
    min-height: 390px;
    margin: 90px auto 0 auto;
    padding: 30px 60px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    box-sizing: border-box;
  }

  .formula-row {
    display: flex;
    align-items: center;
    margin-top: 20px;
    margin-bottom: 40px;
  }

  .pta-label {
    color: #1a1aad;
    font-weight: bold;
    font-size: 30px;
    margin-right: 15px;
  }

  .fraction {
    display: inline-block;
    text-align: center;
    margin-right: 30px;
  }

  .fraction .numerator {
    color: #1a1aad;
    font-weight: bold;
    font-size: 28px;
    padding: 0 5px 4px 5px;
    border-bottom: 3px solid #1a1aad;
  }

  .fraction .denominator {
    color: #1a1aad;
    font-weight: bold;
    font-size: 28px;
    padding-top: 4px;
  }

  .threshold {
    color: #cc0000;
    font-weight: bold;
    font-size: 26px;
  }

  .definitions p {
    color: #1a1aad;
    font-weight: bold;
    font-size: 25px;
    margin: 14px 0;
  }
</style>
</head>
<body>

  <div class="title-bar">
    <h1>PTA SHOULD BE LESS THAN 40 %</h1>
  </div>

  <div class="content-box">
    <div class="formula-row">
      <span class="pta-label">PTA =</span>
      <span class="fraction">
        <span class="numerator">(FT + AD)</span><br>
        <span class="denominator">CCT</span>
      </span>
      <span class="threshold">&lt; 40%</span>
    </div>

    <div class="definitions">
      <p>FT = flap thickness</p>
      <p>AD = ablation depth</p>
      <p>CCT = central corneal thickness</p>
    </div>
  </div>

</body>
</html>
