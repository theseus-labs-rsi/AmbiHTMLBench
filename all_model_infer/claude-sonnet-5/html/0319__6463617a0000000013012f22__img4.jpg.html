<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回避行为</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #eaeaea;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    position: relative;
    width: 554px;
    height: 700px;
    background-color: #ffffff;
    box-sizing: border-box;
    padding: 50px 40px 40px 40px;
    /* left blue bar, right notched decorative border */
    border-left: 10px solid #1a3a8f;
    overflow: hidden;
  }

  /* right side decorative notched border, approximated */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 8px;
    height: 100%;
    background-color: #1a3a8f;
    background-image:
      repeating-linear-gradient(
        to bottom,
        #1a3a8f 0px,
        #1a3a8f 30px,
        #ffffff 30px,
        #ffffff 34px
      );
  }

  .number {
    font-size: 60px;
    font-weight: 900;
    color: #111111;
    margin: 0 0 10px 0;
    line-height: 1;
  }

  .title {
    font-size: 46px;
    font-weight: 900;
    color: #111111;
    margin: 0 0 60px 0;
    line-height: 1.2;
  }

  .bold-text {
    font-size: 21px;
    font-weight: 700;
    color: #111111;
    line-height: 1.6;
    margin: 0 0 30px 0;
  }

  .normal-text {
    font-size: 19px;
    font-weight: 400;
    color: #111111;
    line-height: 1.7;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="number">03</div>
    <div class="title">回避行为</div>
    <p class="bold-text">自觉或不自觉地回避曾经的某些人、事、物。</p>
    <p class="normal-text">比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……</p>
  </div>
</body>
</html>
