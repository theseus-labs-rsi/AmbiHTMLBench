<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #222; }
.page { position: relative; width: 540px; height: 720px; margin: 0 auto; background: white; overflow: hidden; }
.heading { position: absolute; left: 88px; top: 28px; margin: 0; font-size: 33px; font-weight: 900; line-height: 47px; letter-spacing: -1px; }
.heading span { background: #fff947; display: table; height: 43px; margin-bottom: 5px; }
.number { position: absolute; left: 374px; top: 40px; width: 77px; height: 77px; border: 1.5px solid #e9e9e9; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 34px; font-weight: 800; }
.intro { position: absolute; left: 88px; top: 133px; margin: 0; font-size: 14px; line-height: 21px; white-space: nowrap; }
.panel { position: absolute; left: 88px; width: 363px; height: 231px; }
.correct { top: 175px; background: linear-gradient(120deg, #fff6f0, #fff5f7); }
.incorrect { top: 428px; background: linear-gradient(120deg, #effaff, #f4f3ff); }
.panel-title { position: absolute; left: 58px; top: 25px; margin: 0; font-size: 19px; font-weight: 700; line-height: 29px; }
.circle { position: absolute; left: 23px; top: 28px; width: 25px; height: 25px; border: 2px solid #d4b18a; border-radius: 50%; }
.cross { position: absolute; left: 24px; top: 29px; width: 23px; height: 23px; }
.cross::before, .cross::after { content: ""; position: absolute; left: 10px; top: -1px; width: 2px; height: 26px; background: #79a5bb; transform: rotate(45deg); }
.cross::after { transform: rotate(-45deg); }
.details { position: absolute; left: 99px; font-size: 14px; line-height: 22px; white-space: nowrap; }
.details.first { top: 78px; }
.details.second { top: 150px; }
.details.third { top: 98px; }
.row { display: flex; align-items: center; }
.label { font-weight: 700; }
.separator { height: 15px; border-left: 1px solid #777; margin: 0 8px; }
.tag { background: #ef7d87; color: #fff; font-size: 12px; font-weight: 700; height: 17px; line-height: 17px; padding: 0 4px; margin-right: 7px; }
.placeholder { position: absolute; display: flex; align-items: center; justify-content: center; color: #777; font-size: 9px; text-align: center; }
.cartoon-one { left: 291px; top: 170px; width: 68px; height: 79px; }
.cartoon-two { left: 289px; top: 174px; width: 73px; height: 76px; }
.footer-line { position: absolute; left: 89px; top: 682px; width: 362px; border-top: 1px solid #e9e9e9; }
.footer { position: absolute; left: 28px; top: 693px; font-size: 6px; line-height: 8px; }
.logo { position: absolute; left: 472px; top: 685px; width: 42px; height: 23px; border: 1px solid #aaa; }
.logo-title { position: absolute; top: 2px; left: 2px; right: 2px; font-size: 4px; text-align: center; }
.logo-mark { position: absolute; left: 3px; bottom: 1px; width: 14px; height: 12px; font-size: 5px; }
.logo-text { position: absolute; right: 2px; bottom: 2px; font-size: 5px; }
</style>
</head>
<body>
<main class="page">
<h1 class="heading"><span>使用合理的</span><span>标点符号</span></h1>
<div class="number">01</div>
<p class="intro">利用斜线、外框或直线会让整体更具视觉风格。</p>

<section class="panel correct">
<div class="circle" aria-label="正确"></div>
<h2 class="panel-title">使用直线或外框</h2>
<div class="details first">
<div class="row"><span class="label">地点</span><span class="separator"></span><span>武汉国际会展中心</span></div>
<div class="row"><span class="label">时间</span><span class="separator"></span><span>2018 年 8 月 20 日</span></div>
</div>
<div class="details second">
<div class="row"><span class="tag">地点</span><span>武汉国际会展中心</span></div>
<div class="row"><span class="tag">时间</span><span>2018 年 8 月 20 日</span></div>
</div>
<div class="placeholder cartoon-one">[插图：黄色卡通形象]</div>
</section>

<section class="panel incorrect">
<div class="cross" aria-label="错误"></div>
<h2 class="panel-title">使用冒号</h2>
<div class="details third">
<div class="row"><span class="label">地点：</span><span>武汉国际会展中心</span></div>
<div class="row"><span class="label">时间：</span><span>2018 年 8 月 20 日</span></div>
</div>
<div class="placeholder cartoon-two">[插图：黄色卡通形象]</div>
</section>

<div class="footer-line"></div>
<div class="footer">ADVERTISING CREATIVITY<br>2019.05</div>
<div class="logo">
<div class="logo-title">CREATIVE DESIGN</div>
<div class="placeholder logo-mark">[标志]</div>
<div class="logo-text">[illegible]</div>
</div>
</main>
</body>
</html>
