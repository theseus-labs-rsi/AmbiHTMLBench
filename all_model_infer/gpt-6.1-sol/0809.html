<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖、昨表帖書法</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #fafaf8; }
.page {
  position: relative;
  width: 540px;
  height: 1153px;
  margin: 0 auto;
  overflow: hidden;
  background: #fafaf8;
}
.paper {
  position: absolute;
  top: 54px;
  left: 0;
  width: 540px;
  height: 1048px;
  background: #d7c7ad;
  background-image: linear-gradient(90deg, rgba(255,255,255,.10), transparent 35%, rgba(255,255,255,.08));
}
.guides {
  position: absolute;
  top: 21px;
  left: 28px;
  width: 439px;
  height: 1010px;
  border: 1px solid rgba(246,235,212,.28);
  background: repeating-linear-gradient(90deg, transparent 0, transparent 61px, rgba(245,232,206,.22) 62px, transparent 63px);
}
.columns {
  position: absolute;
  top: 23px;
  left: 96px;
  width: 366px;
  height: 1009px;
  display: flex;
  flex-direction: row-reverse;
}
.column {
  width: 61px;
  flex: 0 0 61px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  white-space: nowrap;
  font-family: "STXingkai", "Xingkai SC", "KaiTi", "STKaiti", "DFKai-SB", cursive;
  font-size: 36px;
  font-weight: 400;
  line-height: 61px;
  letter-spacing: 1px;
  color: #211810;
}
.column:nth-child(2) { letter-spacing: 1.3px; }
.column:nth-child(3) { letter-spacing: .6px; }
.column:nth-child(4) { letter-spacing: 1.3px; }
.column:nth-child(5) { letter-spacing: .8px; }
.column:nth-child(6) { letter-spacing: 3px; }
.labels {
  position: absolute;
  left: 477px;
  top: 71px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: "KaiTi", "STKaiti", "DFKai-SB", cursive;
  font-size: 24px;
  letter-spacing: 3px;
  line-height: 30px;
  color: #261d14;
}
.labels .second { margin-top: 21px; }
.inscription {
  position: absolute;
  left: 42px;
  top: 198px;
  height: 510px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  white-space: nowrap;
  font-family: "STXingkai", "KaiTi", "STKaiti", "DFKai-SB", cursive;
  font-size: 31px;
  line-height: 40px;
  letter-spacing: 2px;
  color: #261d14;
}
.placeholder {
  position: absolute;
  left: 50px;
  width: 27px;
  height: 29px;
  border: 2px solid #c57552;
  color: #b76647;
  font: 7px/8px serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: .8;
}
.seal-one { top: 711px; }
.seal-two { top: 767px; height: 28px; }
</style>
</head>
<body>
<main class="page">
  <section class="paper" aria-label="直行書法">
    <div class="guides" aria-hidden="true"></div>
    <div class="labels">
      <div>祥除帖</div>
      <div class="second">昨表帖</div>
    </div>
    <div class="columns">
      <div class="column">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時嚴寒奉被</div>
      <div class="column">手詔伏承聖體御膳勝常以慰下情臣故患向爾氣上頓乏勿勿戀</div>
      <div class="column">恩垂愍每見慰問感戴屏營不勝衝遇謹表陳聞臣廙誠惶頓首</div>
      <div class="column">頓首死罪死罪臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
      <div class="column">慰下情不審宿昔復何如承鄭夫人乃爾委頓今復增損伏惟哀亡</div>
      <div class="column">愍存益勞聖心謹附承動靜臣廙言</div>
    </div>
    <div class="inscription">歲在癸卯蒼耀陽書於未央雲舍</div>
    <div class="placeholder seal-one">[朱印：左下]</div>
    <div class="placeholder seal-two">[朱印：左下]</div>
  </section>
</main>
</body>
</html>
