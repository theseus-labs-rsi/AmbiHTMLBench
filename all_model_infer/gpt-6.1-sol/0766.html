<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; color: #080808; }
.page {
  position: relative;
  width: 540px;
  height: 722px;
  overflow: hidden;
  background-color: #fff;
  background-image:
    linear-gradient(to right, rgba(140,140,140,.18) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(140,140,140,.18) 1px, transparent 1px),
    linear-gradient(to right, rgba(180,180,180,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(180,180,180,.07) 1px, transparent 1px);
  background-size: 21px 21px, 21px 21px, 10.5px 10.5px, 10.5px 10.5px;
  background-position: 14px 20px, 14px 20px, 14px 20px, 14px 20px;
}
h1 {
  position: absolute;
  top: 15px;
  left: 73px;
  margin: 0;
  font-size: 52px;
  font-weight: 900;
  line-height: 1.15;
  white-space: nowrap;
  letter-spacing: 0;
}
.blue { color: #002987; }
.day {
  position: absolute;
  left: 36px;
  top: 97px;
  width: 126px;
  height: 41px;
  background: #a9e8c5;
  text-align: center;
  font-size: 32px;
  font-weight: 700;
  line-height: 41px;
}
.columns { position: absolute; inset: 0; display: grid; grid-template-columns: 205px 305px; column-gap: 10px; pointer-events: none; }
.route { position: relative; height: 722px; }
.notes { position: relative; height: 722px; }
.stop {
  position: absolute;
  left: 0;
  width: 205px;
  text-align: center;
  font-weight: 700;
  font-size: 28px;
  line-height: 36px;
  white-space: nowrap;
}
.stop-one { top: 213px; }
.stop-two { top: 328px; }
.stop-three { top: 443px; }
.stop-four { top: 559px; }
.stop-five { top: 674px; }
.travel {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 31px;
  font-size: 24px;
  line-height: 31px;
  white-space: nowrap;
  background: rgba(249,223,226,.65);
  padding: 0 6px;
}
.travel-one { left: 30px; top: 264px; width: 159px; }
.travel-two { left: 20px; top: 379px; width: 170px; }
.travel-three { left: 38px; top: 494px; width: 157px; }
.travel-four { left: 41px; top: 609px; width: 157px; }
.placeholder.arrow {
  position: absolute;
  width: 25px;
  height: 47px;
  background: #77704c;
  clip-path: polygon(29% 0, 71% 0, 71% 48%, 100% 48%, 50% 100%, 0 48%, 29% 48%);
}
.placeholder.arrow::after {
  content: "";
  position: absolute;
  inset: 1px;
  background: #ffd12a;
  clip-path: polygon(29% 0, 71% 0, 71% 49%, 97% 49%, 50% 96%, 3% 49%, 29% 49%);
}
.arrow-zero { left: 88px; top: 149px; }
.arrow-one { left: 88px; top: 265px; }
.arrow-two { left: 91px; top: 379px; }
.arrow-three { left: 91px; top: 495px; }
.arrow-four { left: 93px; top: 610px; }
.caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.note {
  position: absolute;
  left: 0;
  width: 305px;
  height: 93px;
  border: 3px solid #a00000;
  padding: 3px 4px;
  font-size: 20px;
  line-height: 27px;
  font-weight: 400;
}
.note p { margin: 0; }
.note-one { top: 117px; }
.note-two { top: 244px; }
.note-three { top: 371px; }
.note-four { top: 498px; display: flex; align-items: center; }
.note-five { top: 624px; }
</style>
</head>
<body>
<main class="page">
<h1><span class="blue">第三天</span>路线规划</h1>
<div class="day">第三天</div>
<div class="columns">
<section class="route" aria-label="路线">
<div class="placeholder arrow arrow-zero"><span class="caption">[向下箭头]</span></div>
<div class="stop stop-one">磁器口</div>
<div class="travel travel-one"><span>1号线</span><span>30分钟</span></div>
<div class="placeholder arrow arrow-one"><span class="caption">[向下箭头]</span></div>
<div class="stop stop-two">罗中立美术馆</div>
<div class="travel travel-two"><span>1号线</span><span>80分钟</span></div>
<div class="placeholder arrow arrow-two"><span class="caption">[向下箭头]</span></div>
<div class="stop stop-three">山城步道</div>
<div class="travel travel-three"><span>公交</span><span>32分钟</span></div>
<div class="placeholder arrow arrow-three"><span class="caption">[向下箭头]</span></div>
<div class="stop stop-four">观音桥</div>
<div class="travel travel-four"><span>步行</span><span>15分钟</span></div>
<div class="placeholder arrow arrow-four"><span class="caption">[向下箭头]</span></div>
<div class="stop stop-five">九街</div>
</section>
<section class="notes" aria-label="景点介绍">
<div class="note note-one"><p><span class="blue">磁器口（免费）：</span>汇聚美食、重<br>庆特色伴手礼，始建于宋代“一<br>江两岸三山四巷”独特地貌</p></div>
<div class="note note-two"><p><span class="blue">罗中立美术馆（免费）：</span>拍照超<br>级出片，墙体比较花，拍照尽量<br>穿不花或者饱和度低的衣服</p></div>
<div class="note note-three"><p><span class="blue">山城步道（免费）：</span>建在悬崖边<br>的临江步道，汇聚老重庆特色步<br>道</p></div>
<div class="note note-four"><p><span class="blue">观音桥（免费）：</span>超大商圈，还<br>有很多地道重庆小吃</p></div>
<div class="note note-five"><p><span class="blue">九街（免费）：</span>酒吧一条街，娱<br>乐夜生活开启地，和式风格的酒<br>吧都有</p></div>
</section>
</div>
</main>
</body>
</html>
