<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语c术语</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.document {
  width: 540px;
  padding: 2px 30px 0 35px;
  color: #383838;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 24px;
  line-height: 35px;
}
section, h2, p { margin: 0; padding: 0; }
h2 { font-size: 24px; font-weight: 700; line-height: 35px; }
p { font-weight: 400; }
</style>
</head>
<body>
<main class="document">
<section>
<h2>审核：</h2>
<p>指进入语c群时，被群主审看人设、皮气等<br>行为。</p>
</section>
<section>
<h2>新人：</h2>
<p>指初入某个圈子的人。</p>
</section>
<section>
<h2>纯白：</h2>
<p>完全不了解语c的人或刚接触语c。</p>
</section>
<section>
<h2>小白：</h2>
<p>指出入语c圈或对语c一无所知的人。</p>
</section>
<section>
<h2>小窗：</h2>
<p>指聊天会话的窗口（与QQ的私聊差不多）</p>
</section>
<section>
<h2>隔壁：</h2>
<p>指代另一个地方（隔壁群，隔壁平台）</p>
</section>
<section>
<h2>首页：</h2>
<p>在语c平台中，上皮发言互动的地方。</p>
</section>
<section>
<h2>水区：</h2>
<p>在语c平台中，皮下发言探讨问题或闲聊的<br>地方。</p>
</section>
<section>
<h2>扩列：</h2>
<p>扩充列表，即加好友的意思。</p>
</section>
<section>
<h2>掌控：</h2>
<p>指开戏文字超过七百一段的人。</p>
</section>
<section>
<h2>字控：</h2>
<p>夸张手法，指一次开几个字为一段的人。</p>
</section>
<section>
<h2>句控：</h2>
<p>指开戏只开一行～三行为一段的人。</p>
</section>
</main>
</body>
</html>
