    <div class="headline">福国王夫人震怒欲逐之</div>
    <div class="headline">国朝妻管严疑有私生子</div>
  </div>
  <section class="introduction">
    <div class="first-line">瞳孔地震！将王安石抬进孔庙的好女婿蔡卞</div>
    <div>近日疑似陷入私生子风波。蔡卞妻福国夫人王氏</div>
    <div>闻之震怒，欲除妾生子，因故生病。</div>
  </section>
  <div class="source">本消息来自翰林医官院药方笔录：</div>
  <section class="excerpt">
    《香术散》：治妊娠五个月已后。常胸腹间气刺满痛，<br>
    或肠鸣，以至呕逆减食。此由喜怒忧虑过度，饮食失<br>
    节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病<br>
    。医官王师复处此方三服而愈，后用果验。
  </section>
