<h1 class="heading">第三课<br>社会生活离不开规则</h1>
<p class="introduction">井然有序的社会生活离不开社会规则的维系。规则划定自由的边界，保障人们的自由。我们应该自觉遵守规则，坚定维护规则，积极改进规则，与规则同行，创建美好生活。</p>
<div class="section-heading">维护秩序</div>
<section class="activity">
<div class="placeholder activity-icon">[图标]</div>

</figure>
<figure>

<figure>

<div class="questions">
<p class="question">以上图片体现了哪些方面的社会秩序？<span class="answer">社会管理秩序、生产秩序、交通秩序、公共场所秩序</span></p>
<p class="question">如果没有秩序，我们的生活将会怎样？<span class="answer">将会陷入无序化状态，混乱不堪。社会将不能正常</span></p>
