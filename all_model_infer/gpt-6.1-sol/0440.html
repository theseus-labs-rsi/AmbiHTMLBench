<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #050505; }
.page { position: relative; width: 540px; height: 720px; overflow: hidden; background: #fff; }
.header { position: absolute; left: 18px; right: 18px; top: 25px; height: 54px; border-bottom: 3px solid #111; display: flex; align-items: flex-start; justify-content: space-between; }
.brand { display: flex; align-items: center; height: 35px; white-space: nowrap; }
.logo { width: 112px; height: 36px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-style: italic; }
.sharing { font-size: 29px; font-weight: 700; font-style: italic; letter-spacing: -2px; }
.volume { font-size: 16px; font-weight: 700; margin-left: 7px; align-self: flex-start; margin-top: 1px; }
.web { display: flex; align-items: center; height: 30px; border: 3px solid #080808; margin-top: 2px; font-size: 20px; font-weight: 600; letter-spacing: -.7px; }
.folder-icon { width: 29px; height: 24px; background: #050505; color: #ddd; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.web-text { padding: 0 6px; }
.tiles { position: absolute; top: 95px; left: 0; width: 540px; height: 260px; overflow: hidden; }
.folder { position: absolute; background: linear-gradient(145deg,#f7f7f7,#dedede); border: 1px solid #dedede; border-radius: 8px 8px 3px 3px; box-shadow: inset 0 0 0 5px rgba(255,255,255,.3); }
.folder:before { content: ""; position: absolute; top: -17px; left: -1px; width: 51px; height: 22px; background: #f5f5f5; border: 1px solid #e5e5e5; border-bottom: none; border-radius: 10px 10px 0 0; clip-path: polygon(0 0,75% 0,100% 75%,100% 100%,0 100%); z-index: -1; }
.badge { display: flex; align-items: center; justify-content: center; border: 1px solid #d0d0d0; border-radius: 50%; color: #f8f8f8; background: linear-gradient(#e9e9e9,#c6c6c6); width: 33px; height: 33px; font-size: 27px; }
.tile-one { width: 165px; height: 102px; left: 5px; top: 55px; transform: rotate(-48deg); padding: 7px 9px; }
.tile-one .badge { position: absolute; left: 8px; top: 14px; }
.abcd { position: absolute; top: 5px; left: 47px; font-size: 38px; letter-spacing: -2px; }
.black { position: absolute; top: 44px; left: 67px; font-size: 21px; font-weight: 600; line-height: 20px; }
.cover { position: absolute; left: 14px; top: 68px; font-size: 20px; font-weight: 600; white-space: nowrap; }
.tile-two { width: 139px; height: 99px; left: 207px; top: 56px; transform: rotate(-1deg); padding: 5px; }
.reflection { font-size: 34px; font-weight: 700; white-space: nowrap; letter-spacing: -2px; }
.tile-two .badge { position: absolute; left: 5px; bottom: 11px; }
.reflex { position: absolute; left: 41px; top: 48px; font-size: 20px; font-weight: 700; line-height: 18px; }
.reflex span { display: block; margin-left: 22px; }
.tile-three { width: 148px; height: 108px; left: 390px; top: 43px; transform: rotate(37deg); padding: 8px; }
.studio { font-size: 18px; font-weight: 700; line-height: 18px; }
.eo { position: absolute; top: 27px; left: 64px; font-weight: 700; font-size: 19px; }
.tile-three .badge { position: absolute; top: 12px; right: 10px; }
.no-entry { position: absolute; left: 7px; top: 52px; font-size: 36px; font-weight: 700; white-space: nowrap; letter-spacing: -3px; }
.tile-four { left: 113px; top: 167px; width: 139px; height: 96px; padding: 8px 4px; }
.wang { font-size: 32px; font-weight: 700; letter-spacing: -2px; }
.tile-four .badge { position: absolute; right: 5px; top: 11px; }
.wang-en { position: absolute; left: 4px; top: 62px; font-size: 18px; font-weight: 700; letter-spacing: -.6px; white-space: nowrap; }
.tile-five { left: 302px; top: 166px; width: 139px; height: 98px; padding: 7px 3px; }
.nice { font-size: 38px; line-height: 43px; letter-spacing: -2px; }
.tile-five .badge { position: absolute; right: 5px; top: 9px; }
.nice-small { position: absolute; left: 4px; top: 51px; font-size: 14px; font-weight: 700; line-height: 12px; }
.lab { position: absolute; top: 45px; right: 4px; font-size: 38px; letter-spacing: -2px; }
.blue { position: absolute; top: 355px; left: 0; width: 540px; height: 43px; background: #3025e9; }
.main { position: absolute; top: 398px; left: 0; width: 540px; height: 322px; background: #94f7f6; padding: 0 18px; }
.title-line { height: 126px; border-bottom: 3px solid #080808; display: flex; align-items: center; justify-content: center; padding-top: 6px; }
.title-line h1 { margin: 0; font-size: 90px; font-weight: 500; line-height: 1; white-space: nowrap; letter-spacing: -6px; }
.title-line.second { height: 117px; padding-top: 0; }
.title-line.second h1 { font-size: 90px; letter-spacing: -6px; }
.footer { position: relative; height: 79px; display: flex; align-items: flex-start; padding-top: 20px; }
.copyright { width: 272px; font-size: 21px; font-weight: 700; line-height: 18px; letter-spacing: -1.1px; white-space: nowrap; }
.copyright-top { display: flex; justify-content: space-between; align-items: center; }
.official { font-size: 17px; margin-right: 17px; letter-spacing: -1px; }
.symbol { position: absolute; left: 280px; top: 21px; width: 39px; height: 37px; font-size: 9px; border: 3px solid #080808; clip-path: polygon(30% 0,70% 0,100% 70%,83% 100%,17% 100%,0 70%); display: flex; align-items: center; justify-content: center; }
.barcode-block { position: absolute; right: 0; top: 21px; width: 162px; }
.barcode { width: 162px; height: 34px; background: repeating-linear-gradient(90deg,#050505 0px,#050505 1px,transparent 1px,transparent 3px,#050505 3px,#050505 5px,transparent 5px,transparent 6px,#050505 6px,#050505 7px,transparent 7px,transparent 10px,#050505 10px,#050505 12px,transparent 12px,transparent 14px); font-size: 0; }
.barcode-caption { text-align: center; font-size: 10px; line-height: 13px; white-space: nowrap; letter-spacing: -.2px; }
</style>
</head>

</div>
