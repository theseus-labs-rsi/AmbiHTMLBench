<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takumi Sen9 VS Streakfly</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #ddd; font-family: Arial, "Microsoft YaHei", sans-serif; }
.page {
  position: relative;
  width: 540px;
  height: 721px;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(to right, #fff 0%, #fff 50%, #000 50%, #000 100%);
}
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  font-weight: normal;
}
.adidas { left: 85px; top: 5px; width: 90px; height: 54px; color: #000; }
.nike { left: 360px; top: 19px; width: 100px; height: 38px; color: #fff; }
.heading {
  position: absolute;
  left: 207px;
  top: 27px;
  width: 126px;
  text-align: center;
  font-weight: 900;
}
.heading .chinese { font-size: 18px; line-height: 21px; white-space: nowrap; }
.heading .english { font-size: 10px; line-height: 12px; white-space: nowrap; }
.dark { color: #000; }
.light { color: #fff; }
.vs {
  position: absolute;
  top: 80px;
  left: 230px;
  width: 80px;
  font-family: Impact, "Arial Narrow", sans-serif;
  font-size: 66px;
  font-weight: 900;
  line-height: 73px;
  letter-spacing: -5px;
  text-align: center;
}
.vs .v { color: #000; -webkit-text-stroke: 1px #fff; text-shadow: 2px 3px 3px #888; }
.vs .s { color: #000; -webkit-text-stroke: 1px #fff; }
.left-shoe { left: 20px; top: 108px; width: 229px; height: 103px; color: #000; }
.right-shoe { left: 291px; top: 112px; width: 228px; height: 99px; color: #fff; }
.distance {
  position: absolute;
  top: 240px;
  left: 210px;
  width: 120px;
  font-size: 25px;
  line-height: 31px;
  font-weight: 900;
  text-align: center;
}
.comparison {
  position: absolute;
  left: 0;
  right: 0;
  top: 283px;
  display: grid;
  grid-template-columns: 270px 270px;
  grid-auto-rows: 48px;
  font-size: 25px;
  line-height: 36px;
  font-weight: 900;
}
.cell { white-space: nowrap; }
.left { text-align: right; padding-right: 10px; color: #000; }
.right { text-align: left; padding-left: 10px; color: #fff; }
.model { letter-spacing: 1px; }
.mesh { font-size: 24px; }
.technology { letter-spacing: 1px; }
.continental { font-size: 23px; letter-spacing: .5px; }
@media (max-width: 540px) {
  body { background: #fff; }
  .page { margin: 0; }
}
</style>
</head>
<body>
<main class="page">
  <div class="placeholder adidas" role="img" aria-label="Adidas logo">[Logo: Adidas]</div>
  <div class="placeholder nike" role="img" aria-label="Nike logo">[Logo: Nike]</div>

  <header class="heading">
    <div class="chinese"><span class="dark">奔跑的</span><span class="light">小宇</span></div>
    <div class="english"><span class="dark">RUNNING</span> <span class="light">XIAOYU</span></div>
  </header>

  <div class="vs"><span class="v">V</span><span class="s">S</span></div>

  <figure class="placeholder left-shoe" style="margin:0;">[Photo: Takumi Sen9 shoe, left]</figure>
  <figure class="placeholder right-shoe" style="margin:0;">[Photo: Streakfly shoe, right]</figure>

  <div class="distance"><span class="dark">5-10</span><span class="light">KM</span></div>

  <section class="comparison" aria-label="Shoe comparison">
    <div class="cell left model">Takumi Sen9</div>
    <div class="cell right model">Streakfly</div>

    <div class="cell left">181g</div>
    <div class="cell right">165g</div>

    <div class="cell left">(27/33) 6mm</div>
    <div class="cell right">8mm (26/32)</div>

    <div class="cell left mesh">LIGHTWEIGHT MESH</div>
    <div class="cell right">织物鞋面</div>

    <div class="cell left technology">Lightstrike Pro</div>
    <div class="cell right technology">ZoomX</div>

    <div class="cell left">ENERGYROD玻纤柱</div>
    <div class="cell right">半掌碳板</div>

    <div class="cell left continental">Continental™</div>
    <div class="cell right">贴片橡胶</div>

    <div class="cell left">1499</div>
    <div class="cell right">999</div>
  </section>
</main>
</body>
</html>
