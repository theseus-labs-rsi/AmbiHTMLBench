<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商业思维｜底层逻辑｜个人提升</title>
  <script>
    window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #eeede9;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif;
      color: #080908;
    }
    .page {
      position: relative;
      width: 540px;
      height: 722px;
      margin: 0 auto;
      background: #eeede9;
      overflow: hidden;
    }
    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: absolute;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .line { white-space: nowrap; }
    .accent { color: #4d958d; }
    .first {
      left: 34px;
      top: 25px;
      line-height: 43.5px;
    }
    .second {
      left: 40px;
      top: 274px;
      line-height: 40px;
    }
    .third {
      left: 40px;
      top: 431px;
      line-height: 39.5px;
    }
    footer {
      position: absolute;
      top: 666px;
      left: 119px;
      color: #4d958d;
      font-size: 23px;
      font-weight: 700;
      line-height: 34px;
      white-space: nowrap;
    }
    footer .divider {
      display: inline-block;
      margin: 0 10px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main class="page">
    <ol>
      <li class="first">
        <div class="line">1、<span class="accent">你开始炫耀自己，往往都是灾难的开始。</span></div>
        <div class="line">就像老子在《道德经》里写到：“光而不耀，</div>
        <div class="line">静水流深。” 意思就是，无论身处什么位置，</div>
        <div class="line">什么环境，嘴上不逞强、不炫耀、不狂妄才能</div>
        <div class="line">兜住自己的福气。</div>
      </li>
      <li class="second">
        <div class="line">2、一个冷知识：<span class="accent">屏蔽力是一个人最顶级</span></div>
        <div class="line"><span class="accent">的能力</span>，任何消耗你的人和事，多看一眼</div>
        <div class="line">都是你的不对。</div>
      </li>
      <li class="third">
        <div class="line">3、大学时辅导员说了一句受益一生的</div>
        <div class="line">话：“<span class="accent">你不用变得很外向，内向挺好的</span>，</div>
        <div class="line">但需要你发言的时候，一定要勇敢。” 正</div>
        <div class="line">所谓：君子可内敛不可懦弱，而不公可起</div>
        <div class="line">而论之。</div>
      </li>
    </ol>
    <footer>商业思维<span class="divider">|</span>底层逻辑<span class="divider">|</span>个人提升</footer>
  </main>
</body>
</html>
