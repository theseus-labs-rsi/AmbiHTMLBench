<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固化的做题思维</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, "Microsoft YaHei", sans-serif; }
.document {
  position: relative;
  width: 540px;
  height: 405px;
  overflow: hidden;
  background: linear-gradient(100deg, #d8bd88, #dbc599 52%, #b7a079);
}
.screen {
  position: absolute;
  left: 34px;
  top: 16px;
  width: 503px;
  height: 381px;
  border: 3px solid #25251f;
  background: linear-gradient(115deg, #c6c7c2, #deded5 48%, #b9b9ad);
  box-shadow: 0 0 4px #554b38;
  transform: rotate(1.1deg) skewX(-0.5deg);
  transform-origin: center;
  overflow: hidden;
}
.status {
  position: absolute;
  left: 4px;
  top: 1px;
  color: #262626;
  font-size: 6px;
  line-height: 8px;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
  color: #333;
  font-size: 8px;
}
.control {
  position: absolute;
  top: 2px;
  left: 121px;
  width: 38px;
  height: 38px;
  background: #91918b;
  border-radius: 7px;
  color: #ecece5;
  font-size: 6px;
}
.video {
  position: absolute;
  top: 0;
  right: 0;
  width: 95px;
  height: 55px;
  background: #9d9c8d;
  border-left: 2px solid #6b604c;
}
.content {
  position: absolute;
  top: 75px;
  left: 58px;
  right: 38px;
  color: #ed3239;
  font-size: 13px;
  line-height: 19px;
  font-weight: 400;
}
.intro { margin: 0; }
.first { margin: 16px 0 0; }
.heading {
  color: #171918;
  font-family: "KaiTi", "STKaiti", Arial, sans-serif;
  font-size: 21px;
  font-weight: 400;
  text-align: center;
  white-space: nowrap;
  margin: 24px -6px 7px 51px;
  line-height: 29px;
  letter-spacing: 1px;
}
.second { margin: 0; white-space: nowrap; font-size: 12.5px; }
.underlined { border-bottom: 2px solid #ed3239; padding-bottom: 3px; }
.lower {
  display: grid;
  grid-template-columns: 192px 1fr;
  column-gap: 0;
  margin-top: 18px;
}
.left p { margin: 0 0 14px; white-space: nowrap; }
.right { padding-top: 3px; white-space: nowrap; }
.right p { margin: 0 0 13px; }
.note { margin-left: 22px !important; }
.camera-dot {
  position: absolute;
  left: 3px;
  top: 197px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #24251e;
}
</style>
</head>
<body>
<main class="document">
  <span class="camera-dot" aria-hidden="true"></span>
  <section class="screen">
    <div class="status">19:29　5月14日周五</div>
    <div class="placeholder control">[悬浮图标]</div>
    <div class="placeholder video">[视频画面：右上角]</div>
    <div class="content">
      <p class="intro">固化的做题思维：</p>
      <p class="first">1. 喜欢忠于自己的内心和感觉。</p>
      <h1 class="heading">2017年 12月第一套 Text 1</h1>
      <p class="second">2. 喜欢选<span class="underlined">符合常识的选项。</span> 20年左右的常识和经验的累积</p>
      <div class="lower">
        <div class="left">
          <p>3.　喜欢选自己认识的选项。</p>
          <p>4. 喜欢选自己不认识的选项。</p>
          <p>5. 火急火燎一把火</p>
        </div>
        <div class="right">
          <p>6. 囫囵吞枣选择法</p>
          <p class="note">（有逃避，有厌烦）</p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
