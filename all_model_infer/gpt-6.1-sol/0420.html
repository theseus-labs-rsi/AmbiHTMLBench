<!DOCTYPE html>

<head>

<title>学习建议</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fff;
  color: #111;
  font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", sans-serif;
}
.page {
  position: relative;
  width: 540px;
  height: 721px;
  margin: 0 auto;
  overflow: hidden;
  background: white;
}
.header {
  position: absolute;
  left: 104px;
  top: 10px;
  width: 322px;
  height: 99px;
  text-align: center;
}
.header h1 {
  position: absolute;
  top: 20px;
  left: 81px;
  margin: 0;
  font-size: 43px;
  line-height: 52px;
  font-weight: 900;
  letter-spacing: -3px;
  color: white;
  -webkit-text-stroke: 2px #82b4d5;
  text-shadow: 2px 3px 0 #82b4d5;
}
.placeholder { overflow: hidden; }
.header .placeholder {
  width: 322px;
  height: 99px;
  color: #b9a966;
  font-size: 10px;
  padding-top: 80px;
  border-bottom: 5px double #ead579;
}
.section-heading {
  position: absolute;
  left: 28px;
  right: 20px;
  display: flex;
  align-items: baseline;
  color: #b065ad;
  font-size: 21px;
  line-height: 30px;
}
.section-heading .number { width: 95px; flex-shrink: 0; }
.section-heading .title { font-weight: 600; white-space: nowrap; }
.heading-one { top: 126px; }
.heading-two { top: 421px; }
.text {
  position: absolute;
  left: 28px;
  right: 24px;
  font-size: 21px;
  line-height: 42px;
  letter-spacing: 0.6px;
}
.first { top: 171px; }
.line { height: 42px; white-space: nowrap; }
.highlight {
  background: #ffeb83;
  border-radius: 20px;
  padding: 5px 3px;
  margin: 0 -3px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.attribution {
  position: absolute;
  top: 345px;
  right: 30px;
  font-size: 20px;
  line-height: 28px;
  white-space: nowrap;
}
.attribution strong { font-size: 16px; font-weight: 700; }
.second { top: 466px; }
.emphasis { color: #c32243; font-weight: 700; }

  position: absolute;
  left: 424px;
  top: 623px;
  width: 76px;
  height: 98px;
  margin: 0;

  text-align: center;
  padding: 18px 3px 0;

  display: block;
  margin-top: 5px;
  color: #cc2931;
  font-size: 12px;

<body>
<main class="page">
  <header class="header">
    <div class="placeholder" role="img" aria-label="顶部装饰图案">[装饰图案：顶部居中]</div>
    <h1>学习建议</h1>
  </header>

  <div class="section-heading heading-one">
    <span class="number">09</span>
    <span class="title">「教材远比练习册重要」</span>
  </div>

  <section class="text first">
    <div class="line">教材远比练习册重要。</div>
    <div class="line">教材就是我们做题之前所要构建的一个框架，<span class="highlight">先熟</span></div>
    <div class="line"><span class="highlight">悉框架，然后不断地练题，才能将自己学习的这座</span></div>
    <div class="line"><span class="highlight">大厦构建得更加完整。</span></div>
  </section>

  <div class="attribution">——陈哲峰<strong>(被北京大学物理学院录取)</strong></div>

  <div class="section-heading heading-two">
    <span class="number">10</span>
    <span class="title">「有关数学与英语的学习方法」</span>
  </div>

  <section class="text second">
    <div class="line">数学压轴大题的第二问我没有做出来，但这并没有</div>
    <div class="line">影响接下来的考试中我的发挥。</div>
    <div class="line">我要保证的，<span class="emphasis">不是做出难题，而是做到容易题不丢</span></div>
    <div class="line"><span class="emphasis">分，难题多得分。</span>最后，我数学只有压轴题扣了</div>
    <div class="line">分。</div>
  </section>

  <figure class="placeholder bottom-illustration" role="img" aria-label="右下角人物举着高考加油横幅的插图">
    [人物插图：右下角]
    <span class="ribbon">高考加油</span>
  </figure>
</main>
