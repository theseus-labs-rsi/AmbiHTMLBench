<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #dddcd5; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #191b18;
  background-color: #c8c9bf;
  background-image:
    linear-gradient(rgba(61,66,58,.52) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,66,58,.52) 1px, transparent 1px);
  background-size: 19px 20px;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", "楷体", cursive;
}
.page::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 26px;
  background: linear-gradient(90deg, rgba(65,63,51,.24), transparent);
  border-right: 1px solid rgba(63,63,52,.48);
}
h1 {
  position: absolute;
  left: 94px;
  top: 43px;
  margin: 0;
  color: #70152c;
  font-size: 30px;
  font-weight: bold;
  white-space: nowrap;
  letter-spacing: -1px;
  transform: rotate(.5deg);
}
.zone {
  position: absolute;
  display: grid;
  grid-template-columns: 44px 1fr;
}
.questions {
  left: 61px;
  top: 118px;
  width: 458px;
  column-gap: 13px;
}
.vertical {
  color: #741831;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 12px;
  line-height: 1.15;
}
ol {
  padding: 0;
  margin: 0;
  list-style: none;
}
.questions li {
  color: #a24b50;
  font-size: 25px;
  line-height: 1.4;
  white-space: nowrap;
  margin-bottom: 25px;
  letter-spacing: -1.3px;
}
.formula {
  left: 65px;
  top: 317px;
  width: 438px;
  column-gap: 15px;
}
.formula .vertical { padding-top: 18px; }
.formula li {
  font-size: 27px;
  line-height: 1.5;
  letter-spacing: -1px;
  white-space: nowrap;
}
.formula li:nth-child(1) { margin-bottom: 15px; }
.formula li:nth-child(2) { margin-bottom: 19px; }
.continuation { padding-left: 28px; }
.blank { color: #965057; }
.placeholder {
  position: absolute;
  left: 444px;
  top: 333px;
  width: 56px;
  height: 106px;
  border-radius: 46% 43% 25% 29%;
  background: #92243a;
  color: #eee9d9;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 26px;
  line-height: 1.35;
  transform: rotate(-3deg);
}
.mnemonic {
  position: absolute;
  top: 523px;
  left: 79px;
  display: flex;
  align-items: baseline;
  gap: 12px;
  white-space: nowrap;
  transform: rotate(-2deg);
}
.label { color: #202943; font-size: 34px; }
.words {
  color: #791c35;
  font-size: 36px;
  font-weight: bold;
  word-spacing: 12px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<main class="page">
  <h1>句段结构作用好处赏析</h1>

  <section class="zone questions">
    <div class="vertical">常见问法</div>
    <ol>
      <li>1.请分析这句话的作用是什么！</li>
      <li>2.这句话这样描写有什么好处！</li>
      <li>3.请赏析这句话这样描写的表达效果。</li>
    </ol>
  </section>

  <section class="zone formula">
    <div class="vertical">满分公式</div>
    <ol>
      <li>① 这里<span class="blank">（　）</span>描写<br><span class="continuation">生动形象地写出<span class="blank">（　　）.</span></span></li>
      <li>② 更突出了<span class="blank">（　　）.</span></li>
      <li>③ 前后文呼应<span class="blank">/</span>为后文<span class="blank">（　）</span>做了铺垫</li>
    </ol>
  </section>

  <div class="placeholder" aria-label="印章：右侧">[?]<br>真</div>

  <div class="mnemonic">
    <span class="label">口诀：</span>
    <span class="words">生动秀 感心头 句句手</span>
  </div>
</main>
</body>
</html>
