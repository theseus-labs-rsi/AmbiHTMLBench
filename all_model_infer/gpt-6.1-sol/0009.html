<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖胖和丫丫</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    .page {
      position: relative;
      width: 540px;
      height: 496px;
      overflow: hidden;
      background: #fff;
    }
    .text {
      position: absolute;
      top: 7px;
      left: 25px;
      z-index: 2;
      color: #393932;
      font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
      font-size: 22px;
      font-weight: normal;
      line-height: 33px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .first-line { padding-left: 57px; }
    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font: 13px/1.5 Arial, sans-serif;
      text-align: center;
      background: #f7f7f4;
    }
    .main-illustration {
      left: 0;
      top: 141px;
      width: 540px;
      height: 355px;
      padding: 24px;
    }
    .upper-right-flowers {
      right: 0;
      top: 41px;
      width: 91px;
      height: 132px;
      padding: 7px;
      background: #fafaf7;
    }
    .flowers-above-window {
      left: 291px;
      top: 122px;
      width: 147px;
      height: 65px;
      padding: 5px;
      background: #fafaf7;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="text">
      <div class="first-line">“胖胖，中午好！”丫丫一进屋就看见了胖胖，</div>
      <div>胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微</div>
      <div>笑来和我打招呼的！”听到丫丫的话，</div>
      <div>大家都笑了起来。</div>
    </div>
    <div class="placeholder main-illustration">[插图：下方展开的绿色窗框，中央菱格窗；左侧为鹅和小鸭，右侧为大猪和小猪；窗上有淡黄色窗帘和花枝]</div>
    <div class="placeholder upper-right-flowers">[插图：右上方花枝]</div>
    <div class="placeholder flowers-above-window">[插图：窗框上方花枝]</div>
  </main>
</body>
</html>
