<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三页 — 手写文稿</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #eee; }
.page {
  position: relative;
  width: 540px;
  height: 405px;
  overflow: hidden;
  background: linear-gradient(90deg, #c9c8c1 0%, #d4d3cc 34%, #aaa9a2 37%, #d0cfc8 41%, #c7c6bf 100%);
  color: #272622;
}
.heading {
  position: absolute;
  left: 34px;
  top: 12px;
  margin: 0;
  font: italic bold 28px/1.2 sans-serif;
  color: #ffff82;
  -webkit-text-stroke: 1px #282820;
  text-shadow: 1px 1px #282820;
}
.ruling {
  position: absolute;
  top: 38px;
  height: 303px;
  background-image:
    repeating-linear-gradient(to bottom, transparent 0, transparent 16px, rgba(91,112,115,.17) 16px, rgba(91,112,115,.17) 17px),
    repeating-linear-gradient(to right, transparent 0, transparent 14px, rgba(91,112,115,.22) 14px, rgba(91,112,115,.22) 15px, transparent 15px, transparent 29px);
}
.left-grid { left: 0; width: 198px; }
.right-grid { left: 218px; width: 288px; }
.fold { position: absolute; left: 199px; top: 0; height: 405px; width: 5px; background: rgba(255,255,255,.25); }
.column {
  position: absolute;
  width: 30px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  font-size: 25px;
  line-height: 30px;
  letter-spacing: 2px;
}
.unclear {
  font-family: serif;
  font-size: 12px;
  letter-spacing: 0;
  text-orientation: mixed;
}
.placeholder {
  position: absolute;
  left: 73px;
  top: 226px;
  width: 29px;
  height: 40px;
  border: 2px solid #a5392c;
  border-radius: 3px;
  color: #a5392c;
  background: rgba(255,250,227,.3);
  font: 9px/11px serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
</style>
</head>
<body>
<main class="page" aria-label="第三页手写文稿，竖排，自右向左">
  <div class="ruling left-grid" aria-hidden="true"></div>
  <div class="ruling right-grid" aria-hidden="true"></div>
  <div class="fold" aria-hidden="true"></div>
  <h1 class="heading">第三页</h1>

  <div class="column" style="left:467px;top:40px;">因<span class="unclear">[illegible]</span></div>
  <div class="column" style="left:437px;top:43px;">清<span class="unclear">[illegible]</span></div>
  <div class="column" style="left:408px;top:39px;">用<span class="unclear">[illegible]</span></div>
  <div class="column" style="left:378px;top:29px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:346px;top:30px;">上<span class="unclear">[illegible]</span></div>
  <div class="column" style="left:308px;top:62px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:278px;top:113px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:250px;top:29px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:221px;top:30px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:190px;top:66px;"><span class="unclear">[illegible]</span></div>
  <div class="column" style="left:158px;top:47px;"><span class="unclear">[illegible]</span>。</div>

  <div class="column" style="left:105px;top:89px;">心<span class="unclear">[illegible]</span></div>
  <div class="column" style="left:72px;top:143px;">莫言</div>
  <div class="placeholder" role="img" aria-label="红色印章，左下方">[印章：<br>左下]</div>
  <div class="column" style="left:37px;top:149px;">癸<span class="unclear">[?]</span>三月七日<span class="unclear">[?]</span></div>
</main>
</body>
</html>
