<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #fff; font-family: Arial, "Microsoft YaHei", sans-serif; }
.scene {
  position: relative;
  width: 540px;
  height: 304px;
  overflow: hidden;
  background: #223d36;
}
.background {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 304px;
  background: linear-gradient(#10251f 0%, #182e26 50%, #678f7c 100%);
  color: #bbc9be;
  font-size: 10px;
  padding: 8px;
}
.dialog {
  position: absolute;
  left: 128px;
  top: 86px;
  width: 284px;
  height: 106px;
  display: flex;
  align-items: center;
  padding: 15px 18px 17px 27px;
  background: rgba(116, 146, 136, .83);
  box-shadow: 0 0 9px 5px rgba(153, 198, 187, .65);
  color: #f0efce;
}
.dialog::before, .dialog::after {
  content: "";
  position: absolute;
  top: 10px;
  bottom: 10px;
  width: 4px;
  border-left: 1px dotted rgba(228, 234, 209, .5);
  border-right: 1px dotted rgba(228, 234, 209, .5);
}
.dialog::before { left: 12px; }
.dialog::after { right: 12px; }
.mask {
  flex: 0 0 51px;
  width: 51px;
  height: 59px;
  margin-right: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #f3e8b6;
  font-size: 8px;
  background: radial-gradient(ellipse, rgba(212, 177, 72, .6), transparent 72%);
}
.description { align-self: flex-start; padding-top: 5px; white-space: nowrap; }
h1 { margin: 0 0 2px; font-size: 11px; line-height: 14px; font-weight: bold; }
.stat { height: 13px; font-size: 8px; line-height: 11px; }
.shield {
  display: inline-block;
  width: 7px;
  height: 8px;
  margin-right: 6px;
  vertical-align: middle;
  background: #efefd6;
  clip-path: polygon(0 0, 100% 0, 90% 65%, 50% 100%, 10% 65%);
}
p { margin: 0; font-size: 7px; line-height: 11px; }
.prompt {
  position: absolute;
  right: 20px;
  bottom: 9px;
  font-size: 6px;
  line-height: 9px;
}
.button {
  display: inline-flex;
  width: 8px;
  height: 8px;
  margin-left: 3px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: #768e7e;
  background: #f0f0d7;
  font-size: 8px;
  vertical-align: middle;
}
</style>
</head>
<body>
<main class="scene" aria-label="游戏物品说明画面">
  <div class="placeholder background">[游戏场景：石室、地面、中央宝箱及站在宝箱前的人物]</div>
  <section class="dialog">
    <div class="placeholder mask">[面具图像]</div>
    <div class="description">
      <h1>魔吉拉的面具</h1>
      <div class="stat"><span class="shield" aria-label="防御图标"></span>1</div>
      <p>从太古时期传下来的面具。<br>戴上它的话，有些怪物好像[illegible]自己。<br>这样的珍品好像很难获得的。</p>
    </div>
    <div class="prompt">打开袋子<span class="button">+</span></div>
  </section>
</main>
</body>
</html>
