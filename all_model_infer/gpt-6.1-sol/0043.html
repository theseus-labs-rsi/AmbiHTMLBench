<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
.page { position: relative; width: 540px; height: 720px; margin: 0 auto; overflow: hidden; background: white; }
.header {
  position: absolute; left: 14px; top: 0; width: 512px; height: 136px;
  background: #ed6500; border-radius: 0 0 27px 27px;
}
.copyright { position: absolute; left: 21px; top: 14px; color: #fff; font-size: 32px; line-height: 38px; }
.decorations { position: absolute; left: 25px; top: 53px; color: white; font-size: 20px; line-height: 13px; text-align: center; }
.year { position: absolute; right: 24px; top: 18px; font-size: 24px; line-height: 28px; font-weight: 700; }
h1 { position: absolute; left: 70px; top: 36px; margin: 0; font-size: 68px; line-height: 78px; font-weight: 900; letter-spacing: 1px; }
.mark { position: absolute; right: 25px; bottom: 3px; font-size: 22px; line-height: 26px; }
.introduction { position: absolute; left: 35px; top: 151px; width: 472px; margin: 0; font-size: 12px; line-height: 15px; color: #111; }
.card {
  position: absolute; left: 24px; width: 492px; height: 197px;
  border: 2px solid #dc6d12; border-radius: 25px;
  box-shadow: 0 7px 9px rgba(0,0,0,.12); background: #fff;
}
.card.first { top: 237px; }
.card.second { top: 483px; }
.card h2 { position: absolute; left: 7px; top: 13px; margin: 0; font-size: 20px; line-height: 25px; letter-spacing: .3px; font-weight: 700; }
.star { color: #df690b; font-size: 21px; padding-left: 6px; }
.placeholder { position: absolute; overflow: hidden; }
.first .placeholder { left: 16px; top: 40px; width: 444px; height: 105px; background: #075eaa; }
.second .placeholder { left: 27px; top: 36px; width: 444px; height: 106px; background: #ff1c60; }
.shape { position: absolute; height: 100%; }
.first .green { left: 0; top: 0; width: 166px; background: #00964d; }
.first .yellow {
  left: 98px; top: 0; width: 247px; height: 105px; background: #fff000;
  clip-path: polygon(14% 0,53% 0,54% 11%,59% 19%,69% 23%,84% 27%,94% 36%,99% 47%,100% 59%,95% 71%,86% 82%,84% 91%,84% 100%,41% 100%,36% 95%,18% 90%,7% 81%,1% 68%,0 55%,2% 44%,7% 36%,14% 30%,16% 22%,16% 11%);
}
.second .green { left: 0; top: 0; width: 178px; background: #90c31c; }
.second .black {
  left: 102px; top: 0; width: 247px; height: 106px; background: #000;
  clip-path: polygon(15% 0,53% 0,56% 10%,62% 17%,74% 21%,86% 26%,94% 35%,99% 46%,100% 58%,97% 68%,90% 78%,79% 87%,75% 100%,39% 100%,35% 95%,18% 88%,8% 78%,2% 66%,0 53%,2% 43%,8% 34%,14% 27%,16% 17%,16% 9%);
}
.placeholder-label {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: rgba(255,255,255,.8); text-shadow: 0 1px 2px #333;
}
.caption { position: absolute; left: 5px; right: 5px; margin: 0; color: #999; font-size: 12px; line-height: 15px; }
.first .caption { top: 152px; }
.second .caption { top: 145px; left: 8px; right: 10px; }
.footer { position: absolute; left: 14px; top: 695px; width: 512px; height: 25px; background: #ed6500; }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <span class="copyright">©</span>
    <div class="decorations" aria-hidden="true">✦<br>✦<br>✦<br>✦<br>✦</div>
    <span class="year">2023</span>
    <h1>对比色配色</h1>
    <span class="mark">瑞</span>
  </header>

  <p class="introduction">对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都<br>使用对比强烈的色彩，所以配色清晰而有力。</p>

  <section class="card first">
    <h2>富有朝气的配色<span class="star">✦</span></h2>
    <div class="placeholder" role="img" aria-label="绿色、黄色与蓝紫色配色示意图">
      <div class="shape green"></div>
      <div class="shape yellow"></div>
      <span class="placeholder-label">[配色示意图：绿色、黄色与蓝紫色]</span>
    </div>
    <p class="caption">以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。</p>
  </section>

  <section class="card second">
    <h2>视觉冲击强烈的配色<span class="star">✦</span></h2>
    <div class="placeholder" role="img" aria-label="黄绿色、黑色与深红色配色示意图">
      <div class="shape green"></div>
      <div class="shape black"></div>
      <span class="placeholder-label">[配色示意图：黄绿色、黑色与深红色]</span>
    </div>
    <p class="caption">黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，<br>视觉冲击强烈。</p>
  </section>

  <div class="footer"></div>
</main>
</body>
</html>
