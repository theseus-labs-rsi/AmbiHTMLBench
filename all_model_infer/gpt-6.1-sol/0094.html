<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT快捷键</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #ffa6c1; font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.page { width: 540px; height: 709px; position: relative; margin: 0 auto; background: #ffa6c1; padding-top: 85px; }
.sheet { width: 452px; height: 603px; margin-left: 44px; background: #fff; padding: 23px 15px 20px; }
.banner { position: absolute; left: 123px; top: 25px; width: 290px; height: 77px; background: #ffe6ed; border: 1.5px solid #262126; z-index: 2; padding: 4px; }
.banner-inner { height: 65px; background: white; border: 1.5px solid #262126; display: flex; align-items: center; justify-content: center; gap: 0; }
.title { font-size: 38px; font-weight: 400; letter-spacing: -2px; white-space: nowrap; transform: scaleX(.9); }
.check { display: inline-block; width: 43px; height: 43px; vertical-align: -5px; border: 2px solid #7bac29; border-radius: 9px; background: linear-gradient(135deg,#a5d947,#76b719); color: white; font-family: Arial,sans-serif; font-size: 42px; font-weight: bold; line-height: 40px; text-align: center; letter-spacing: 0; margin-right: 1px; }
.ear { position: absolute; top: -23px; width: 26px; height: 23px; background: #262126; clip-path: polygon(0 100%, 35% 0, 100% 100%); }
.ear::after { content: ""; position: absolute; inset: 2px 2px 0; background: white; clip-path: polygon(0 100%, 35% 0, 100% 100%); }
.ear.left { left: 59px; }
.ear.right { right: 55px; transform: scaleX(-1); }
.binding { position: absolute; width: 35px; height: 5px; border: 1px solid #262126; border-radius: 50%; background: white; }
.binding.l1 { left: -11px; top: 20px; transform: rotate(12deg); }
.binding.l2 { left: -11px; top: 36px; }
.binding.l3 { left: -11px; top: 49px; transform: rotate(-18deg); }
.binding.r1 { right: -14px; top: 18px; transform: rotate(-16deg); }
.binding.r2 { right: -14px; top: 34px; transform: rotate(-5deg); }
.binding.r3 { right: -14px; top: 49px; transform: rotate(19deg); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; color: #292b29; font-weight: 800; }
col:first-child { width: 172px; }
tr { height: 39.65px; }
td { padding: 0; vertical-align: middle; white-space: nowrap; }
td:first-child { font-size: 23px; letter-spacing: -.45px; }
td:last-child { font-size: 18px; letter-spacing: -.5px; }
tr:nth-child(n+5) td:last-child { padding-left: 7px; }
tr:nth-child(6) td:last-child,
tr:nth-child(7) td:last-child,
tr:nth-child(13) td:last-child,
tr:nth-child(14) td:last-child { padding-left: 4px; }
.small { font-size: 18px; letter-spacing: -.5px; }
@media (max-width: 540px) {
body { overflow-x: auto; }
.page { margin-left: 0; }
}
</style>
</head>
<body>
<main class="page">
<header class="banner">
<div class="ear left"></div>
<div class="ear right"></div>
<span class="binding l1"></span><span class="binding l2"></span><span class="binding l3"></span>
<span class="binding r1"></span><span class="binding r2"></span><span class="binding r3"></span>
<div class="banner-inner"><div class="title"><span class="check">✓</span>PPT快捷键</div></div>
</header>
<section class="sheet">
<table aria-label="PPT快捷键">
<colgroup><col><col></colgroup>
<tbody>
<tr><td>B</td><td>黑屏(在演示时)</td></tr>
<tr><td>W</td><td>切换至白屏/从黑白屏恢复放映</td></tr>
<tr><td>F4</td><td>重复上一步操作</td></tr>
<tr><td>Ctrl+D</td><td>快速复制选中对象</td></tr>
<tr><td>Ctrl+G</td><td>组合对象</td></tr>
<tr><td>Ctrl+ Shift+ G</td><td>取消组合</td></tr>
<tr><td>Ctrl+Alt+V</td><td>打开选择性粘贴窗口</td></tr>
<tr><td>Ctrl+<span class="small">单击</span></td><td>选择多个对象</td></tr>
<tr><td>Shift+<span class="small">鼠标</span></td><td>拖动等比例缩放图片</td></tr>
<tr><td>Shift+ F5</td><td>从当前页开始放映</td></tr>
<tr><td>Ctrl+ Shift+C</td><td>复制格式</td></tr>
<tr><td>Ctrl+ Shift+V</td><td>粘贴格式</td></tr>
<tr><td>Ctrl+ Shift+ &lt;</td><td>快速缩小字号</td></tr>
<tr><td>Ctrl+ Shift+&gt;</td><td>快速增大字号</td></tr>
</tbody>
</table>
</section>
</main>
</body>
</html>
