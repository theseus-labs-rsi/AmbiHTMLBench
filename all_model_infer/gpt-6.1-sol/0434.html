<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的与人民日报写的</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; }
.page {
  width: 540px;
  height: 720px;
  position: relative;
  overflow: hidden;
  font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
}
.upper {
  position: relative;
  height: 295px;
  background: #e8d29f;
  border: 1px solid #d6c192;
}
.lower {
  position: relative;
  height: 425px;
  background: #44415e;
  color: #ead69e;
}
h1, h2, p, figure { margin: 0; }
h1 {
  position: absolute;
  left: 56px;
  top: 72px;
  color: #39364d;
  font-size: 35px;
  line-height: 48px;
  font-weight: 900;
}
.short-text {
  position: absolute;
  top: 155px;
  left: 56px;
  color: #38354a;
  font-size: 24px;
  line-height: 42px;
  font-weight: 900;
}
.ring {
  position: absolute;
  left: 201px;
  top: 59px;
  width: 69px;
  height: 69px;
  border: 15px solid #bd0000;
  border-radius: 50%;
  box-shadow: 1px 2px 2px #ab9671;
}
.description {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.photo {
  position: absolute;
  left: 341px;
  top: 81px;
  width: 198px;
  height: 213px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #44415e;
  background: rgba(68, 65, 94, .08);
  font: 14px Arial, sans-serif;
}
.photo-label {
  position: absolute;
  left: 337px;
  bottom: 1px;
  white-space: nowrap;
  color: #fff;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  font-size: 28px;
  line-height: 33px;
  font-weight: 900;
}
h2 {
  position: absolute;
  left: 56px;
  top: 61px;
  font-size: 35px;
  line-height: 49px;
  font-weight: 700;
}
.check {
  position: absolute;
  left: 294px;
  top: 41px;
  width: 87px;
  height: 67px;
}
.check::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 4px;
  width: 29px;
  height: 60px;
  border-right: 12px solid #80c23a;
  border-bottom: 12px solid #80c23a;
  transform: rotate(42deg);
  border-radius: 2px 6px 4px 1px;
}
.long-text {
  position: absolute;
  top: 122px;
  left: 57px;
  width: 430px;
  font-size: 21px;
  line-height: 37.4px;
  font-weight: 900;
  white-space: nowrap;
}
.attribution {
  position: absolute;
  right: 35px;
  bottom: 14px;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
}
.watermark {
  position: absolute;
  transform: rotate(-19deg);
  color: #fff;
  opacity: .14;
  font-family: Arial, sans-serif;
  font-size: 31px;
  font-weight: bold;
  pointer-events: none;
}
.upper .watermark { left: 145px; top: 138px; }
.lower .watermark { left: 163px; top: 197px; }
</style>
</head>
<body>
<main class="page">
  <section class="upper">
    <div class="watermark">[illegible]</div>
    <h1>我写的:</h1>
    <div class="placeholder ring"><span class="description">[Red ring: upper center]</span></div>
    <p class="short-text">我们民族的追梦史充满<br>艰辛。</p>
    <figure class="placeholder photo">[Photo: child, upper-right]</figure>
    <p class="photo-label">学习使我妈快乐</p>
  </section>
  <section class="lower">
    <div class="watermark">[illegible]</div>
    <h2>人民日报写的:</h2>
    <div class="placeholder check"><span class="description">[Green check mark: beside heading]</span></div>
    <p class="long-text">我们这个民族，有数千年辉煌文明、有数百年<br>深重苦难，也有百余年不息奋斗，追寻梦想的<br>道路尤其艰难曲折。百余年来的救亡图存、道<br>路探索，多少仁人志士留下“有心杀贼，无力<br>回天”的悲愤，付出“春云碧血，秋雨黄花”<br>的牺牲，发出“拼将十万头颅血，须把乾坤力<br>挽回”的呐喊。</p>
    <p class="attribution">——2013.4.1《筑就民族复兴的“中国梦”》</p>
  </section>
</main>
</body>
</html>
