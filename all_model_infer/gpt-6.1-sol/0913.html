<style>

  position: relative;
  width: 540px;

    radial-gradient(ellipse at 4% 8%, rgba(217,255,251,.56), transparent 44%),
    linear-gradient(139deg, #fff 22%, #fff 48%, #eaf3ff 68%, #79aff1 100%);
}
h1, h2 {
  position: absolute;
  margin: 0;
  height: 50px;
  background: #0757ef;
  color: white;
  text-align: center;

  font-weight: 900;
  line-height: 50px;
  letter-spacing: 1px;

.registration {
  position: absolute;
  left: 26px;
  top: 102px;
  font-size: 20px;
  font-weight: 700;
  line-height: 33px;
  white-space: nowrap;
}
.points {
  position: absolute;
  top: 308px;
  left: 33px;
  width: 494px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 20px;
  font-weight: 700;
  line-height: 33px;
}

.blue { color: #075bea; }
.line { white-space: nowrap; }

  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 12px;
  text-align: center;
  background: rgba(255,255,255,.08);

<body>
<main class="page">
  <h1>报名和考试</h1>
  <div class="registration">
    个人参赛，由所在中学进行统一报名；<br>
    均为笔试考试，预赛为各省市自行组织、自主命题；<br>
    剩余考试环节均为全国统一命题。
  </div>

  <h2>可以自学吗？</h2>
  <ol class="points">
    <li>
      <div class="line">1、<span class="blue">高中课本内容可以自学</span>，当然我们也有初高中基础</div>
      <div class="line">知识课程，让你快速掌握竞赛考点。</div>
    </li>
    <li>
      <div class="line">2、一些难的知识点和不知道如何规划学习进度的时候</div>
      <div class="line">，最好选择报课，大部分学生在有人一起学的情况下</div>
      <div class="line">会比较好。</div>
      <div class="line">有时候你以为自己自学学的挺好，但是很多竞赛技巧</div>
      <div class="line">、思维是需要老师来指导的。时间和钱，不能兼得。</div>
    </li>
  </ol>

  <figure class="placeholder circular-diagram">[Diagram: circular geometric illustration, bottom-left]</figure>
  <figure class="placeholder bar-diagram">[Diagram: four outlined three-dimensional bars, bottom-right]</figure>
