<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写书页</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #d9d6cb; }
.page {
  position: relative;
  width: 540px;
  height: 698px;
  overflow: hidden;
  background: linear-gradient(90deg, #d7d1c5 0%, #e5dfd2 8%, #d5cebf 10%, #e8e1d4 15%, #eee8db 70%, #e3dfd2 98%, #b9bbaa 100%);
  color: #34362e;
  font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", cursive;
}
.gutter {
  position: absolute;
  left: 46px;
  top: 0;
  width: 13px;
  height: 698px;
  background: linear-gradient(90deg, transparent, rgba(89,72,46,.16), transparent);
  border-radius: 50%;
}
.title {
  position: absolute;
  left: 68px;
  top: 13px;
  margin: 0;
  font-size: 25px;
  font-weight: normal;
  color: #59665d;
  transform: rotate(-5deg);
}
.writing {
  position: absolute;
  top: 49px;
  left: 86px;
  width: 424px;
  font-size: 24px;
  line-height: 1;
  letter-spacing: .7px;
}
.line {
  height: 40px;
  white-space: nowrap;
  transform-origin: left center;
  transform: rotate(-1.4deg);
}
.line:first-child { padding-left: 7px; }
.line:nth-child(2) { margin-left: -7px; }
.line:nth-child(3) { margin-left: 7px; }
.line:nth-child(4) { margin-left: 2px; }
.line:nth-child(6) { margin-left: 2px; }
.line:nth-child(7) { margin-left: 3px; }
.line:nth-child(8) { margin-left: 7px; }
.line:nth-child(9) { margin-left: 4px; }
.line:nth-child(10) { margin-left: 7px; }
.line:nth-child(11) { margin-left: 8px; }
.closing {
  position: absolute;
  left: 108px;
  top: 460px;
  color: #934947;
  font-size: 26px;
  letter-spacing: 1px;
  line-height: 40px;
  transform: rotate(-2deg);
  white-space: nowrap;
}
.closing .second { padding-left: 84px; }
.adjacent {
  position: absolute;
  left: -18px;
  top: 494px;
  width: 57px;
  font-size: 23px;
  line-height: 38px;
  transform: rotate(-9deg);
}
.adjacent .lower { margin-top: 64px; }
.placeholder {
  position: absolute;
  right: -2px;
  top: 608px;
  width: 29px;
  height: 56px;
  border: 4px double #4d6858;
  border-radius: 12px 7px 9px 12px;
  color: #526052;
  font: 8px sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(222,223,207,.35);
}
</style>
</head>
<body>
<main class="page">
  <div class="gutter" aria-hidden="true"></div>
  <h1 class="title">使坏能量[?]</h1>
  <section class="writing">
    <div class="line">当偏见裹挟认知，无视事实，操纵舆论的事发</div>
    <div class="line">生，我们该如何对待？</div>
    <div class="line">如果我不害怕人微言轻，也许你就不会经历</div>
    <div class="line">人言可畏，用心辨别真相，用爱和真诚可以消</div>
    <div class="line">融流言。正如[illegible]所言，“[illegible]的</div>
    <div class="line">时候，小小的一盏灯都有可能是救命[?]，我们</div>
    <div class="line">谁都不想成为这样的人，我们也不愿成为加</div>
    <div class="line">害的人”，遭遇不公时，隐忍不是唯一道路，</div>
    <div class="line">我们可以向不公平呐喊，只有大家都勇敢</div>
    <div class="line">起来，加害者才会觉得我们没有那么好</div>
    <div class="line">欺负。</div>
  </section>
  <section class="closing">
    <div>愿你笔尖下皆自由之风，一笔一画，</div>
    <div class="second">一字一词，黑白分明。</div>
  </section>
  <aside class="adjacent">
    <div>[illegible]<br>[illegible]</div>
    <div class="lower">[illegible]</div>
  </aside>
  <div class="placeholder">[回形针：右下角]</div>
</main>
</body>
</html>
