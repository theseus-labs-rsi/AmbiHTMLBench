<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展览馆问答手写页</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.document {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  background: white;
}
.placeholder {
  position: absolute;
  left: 0;
  top: 157px;
  width: 540px;
  height: 405px;
  background: #b39754;
  color: #57451e;
  font: 11px serif;
  padding: 12px;
}
.paper {
  position: absolute;
  left: 0;
  top: 244px;
  width: 540px;
  height: 318px;
  background: #efeee8;
  clip-path: polygon(5.3% 0, 61% 1%, 83% 1%, 100% 6%, 100% 100%, 0 100%, 0 70%);
}
.number {
  position: absolute;
  left: 42px;
  top: 267px;
  font: italic 32px "KaiTi", "STKaiti", cursive;
  transform: rotate(-8deg);
}
.prompt {
  position: absolute;
  left: 85px;
  top: 277px;
  width: 425px;
  color: #25251f;
  font: 12px "SimSun", "Songti SC", serif;
  line-height: 25px;
  transform: rotate(-0.6deg);
  transform-origin: left top;
}
.handwriting {
  position: absolute;
  left: 47px;
  top: 315px;
  width: 488px;
  color: #22231e;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", cursive;
  font-size: 37px;
  line-height: 44px;
  letter-spacing: -1.6px;
  transform: rotate(-1.6deg);
  transform-origin: left top;
}
.handwriting .line { white-space: nowrap; }
.handwriting .line:first-child { padding-left: 18px; }
.handwriting .line:nth-child(2) { padding-left: 12px; }
.handwriting .line:nth-child(3) { padding-left: 5px; }
.handwriting .line:nth-child(4) { font-size: 36px; }
.handwriting .line:last-child { font-size: 36px; letter-spacing: -2px; }
.edge {
  position: absolute;
  left: 522px;
  top: 290px;
  width: 80px;
  font: 9px/22px "SimSun", serif;
  color: #77756c;
}
</style>
</head>
<body>
<main class="document">
  <div class="placeholder">[Photograph: wooden tabletop behind the document]</div>
  <div class="paper"></div>
  <div class="number">26</div>
  <div class="prompt">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>她看到了什么呢？</div>
  <div class="handwriting">
    <div class="line">我蹲下来，“这根肋骨让你感</div>
    <div class="line">到不舒服吗？”</div>
    <div class="line">展览台上是一尊白玉莹莹的肋</div>
    <div class="line">骨，下面的文字介绍引用了夏娃</div>
    <div class="line">的来历，说女人都是由肋骨所化。</div>
  </div>
  <div class="edge">[illegible]<br>[illegible]</div>
</main>
</body>
</html>
