<!DOCTYPE html>

<title>端午万宁三日游安排得明明白白</title>

<style>

body {
  background: #fff;
  font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

.page {
  width: 540px;
  height: 722px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 72% 30%, rgba(255,255,255,.35), transparent 35%),
    radial-gradient(ellipse at 19% 73%, rgba(255,255,255,.28), transparent 32%),
    linear-gradient(155deg, #cfe7ff 0%, #c8eaff 48%, #acd9f1 100%);

  position: absolute;
  left: 22px;
  top: 25px;
  margin: 0;
  white-space: nowrap;
  font-size: 36px;
  font-weight: 900;
  line-height: 59px;
  letter-spacing: -2.5px;
  color: #242424;
  -webkit-text-stroke: 5px white;
  paint-order: stroke fill;
}

  font-size: 49px;
  color: #e71913;
  letter-spacing: -3px;
}
.underline {
  position: absolute;
  left: 15px;
  top: 69px;
  width: 508px;
  height: 25px;
}
.day {
  position: absolute;
  left: 7px;
  top: 130px;
  width: 120px;
  height: 38px;
  border-radius: 24px;
  background: #ffeb00;
  text-align: center;
  line-height: 38px;
  font-size: 27px;
  font-weight: 700;
  color: #202020;
}
.itinerary {
  position: absolute;
  left: 148px;
  top: 119px;
  display: grid;
  grid-template-columns: 151px 218px;
  grid-template-rows: 108px 108px 108px 108px 108px;
  column-gap: 9px;
  row-gap: 12px;
}
.placeholder {
  margin: 0;
  width: 151px;
  height: 108px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 12px;
  color: #41545a;
  font-size: 13px;
  background: rgba(109,145,153,.28);
}
.photo-two { background: rgba(90,130,94,.27); }
.photo-three { background: rgba(135,160,181,.4); }
.photo-four { background: rgba(78,99,111,.3); }
.photo-five { background: rgba(154,144,91,.27); }

.description h2 {
  margin: 0 0 3px;
  font-size: 25px;
  font-weight: 800;

  color: #ffea00;
  letter-spacing: -1px;

  paint-order: stroke fill;

.description p {
  margin: 0 0 0 2px;

  position: absolute;
  left: 13px;
  width: 110px;
  height: 31px;

  line-height: 31px;
  font-size: 19px;

.travel-one { top: 244px; }
.travel-two { top: 364px; }
.travel-three { top: 486px; }

  left: 63px;
  width: 4px;
  background: #d5bd00;
}

  content: "";
  position: absolute;
  bottom: -1px;
  left: -4px;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 10px solid #d5bd00;
}
.arrow-one { top: 172px; height: 64px; }
.arrow-two { top: 291px; height: 64px; }

<body>
<main class="page">
  <h1>端午万宁<span class="red">三日游</span>安排得明明白白</h1>
  <svg class="underline" viewBox="0 0 508 25" aria-hidden="true">
    <path d="M1 9 Q15 25 43 15 T91 11 T145 16 T195 7 T253 13 T304 7 T356 14 T411 10 T463 11 T505 19" fill="none" stroke="#ffec00" stroke-width="3"/>
  </svg>

  <div class="day">第二天</div>
  <div class="arrow arrow-one"></div>
  <div class="travel travel-one">打车25分钟</div>
  <div class="arrow arrow-two"></div>
  <div class="travel travel-two">打车10分钟</div>
  <div class="arrow arrow-three"></div>
  <div class="travel travel-three">打车1小时</div>
  <div class="arrow arrow-four"></div>
  <div class="travel travel-four">打车1小时</div>
  <div class="arrow arrow-five"></div>

  <section class="itinerary">
    <figure class="placeholder">[照片：巴厘村建筑前的游客]</figure>
    <div class="description">
      <h2>巴厘村</h2>
      <p>去巴厘村拍照，假装自己在泰<br>国，租一套服装(80/人)而且<br>还需要门票。</p>
    </div>

    <figure class="placeholder photo-two">[照片：桥海牧场的田野与游客]</figure>
    <div class="description">
      <h2>桥海牧场</h2>
      <p>是类似于农村的田地，有一群<br>牛羊鹅等农家动物!体验感一般，<br>但拍照不错。</p>
    </div>

    <figure class="placeholder photo-three">[照片：海边红白相间的灯塔]</figure>
    <div class="description">
      <h2>神州半岛灯塔</h2>
      <p>拍照真的很出片，不要去太早，<br>很有宫崎骏漫画的感觉</p>
    </div>

    <figure class="placeholder photo-four">[照片：海边岩洞中的游客]</figure>
    <div class="description">
      <h2>山钦湾</h2>
      <p>傍晚的时候可以去燕子洞拍夕<br>阳剪影，还有很多礁石，真的<br>是分分钟氛围感大片！</p>
    </div>

    <figure class="placeholder photo-five">[照片：夜市水果摊]</figure>
    <div class="description">
      <h2>兴隆夜市</h2>
      <p>如果想吃南洋风味等一系列东<br>南亚美食，可以看看这里便宜<br>好吃实惠！</p>
    </div>
  </section>
</main>
