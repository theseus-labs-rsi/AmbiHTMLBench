<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten English Vocabulary Notes</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #2c211a;
  display: flex;
  justify-content: center;
}
.notebook {
  position: relative;
  width: 540px;
  height: 719px;
  overflow: hidden;
  background: #d1ceba;
  border-radius: 26px 0 0 20px;
  box-shadow: inset 10px 0 22px rgba(61,49,30,.16);
}
.page {
  position: absolute;
  inset: 0 69px 10px 15px;
  background: linear-gradient(95deg, #d2d0bc, #d8d7c4 68%, #c9c6b2);
  border-radius: 23px 0 0 17px;
}
.page::before {
  content: "";
  position: absolute;
  left: 20px;
  right: 20px;
  top: 67px;
  bottom: 30px;
  background: repeating-linear-gradient(
    to bottom,
    rgba(96,101,87,.36) 0,
    rgba(96,101,87,.36) 1px,
    transparent 1px,
    transparent 30.7px
  );
  transform: rotate(.65deg);
}
.gutter {
  position: absolute;
  left: 465px;
  top: 24px;
  width: 75px;
  height: 676px;
  background: linear-gradient(90deg, #b8b4a0 0, #dfdcc8 10%, #ccc9b7 30%, #cbc9b8 100%);
  box-shadow: -4px 0 8px rgba(76,64,46,.12);
}
.row {
  position: absolute;
  left: 29px;
  right: 12px;
  display: grid;
  grid-template-columns: 238px 1fr;
  align-items: start;
  color: #25271f;
  font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  font-size: 27px;
  line-height: 1.15;
  font-style: italic;
}
.meaning {
  font-family: "Kaiti SC", "KaiTi", "STKaiti", "Segoe Print", cursive;
  font-size: 25px;
  white-space: nowrap;
  letter-spacing: -1.4px;
}
.blue { color: #4c4984; }
.charity { top: 43px; }
.clarity { top: 79px; }
.clarify { top: 107px; }
.charity .meaning { padding-left: 15px; padding-top: 8px; }
.clarity .meaning { padding-left: 15px; padding-top: 4px; }
.clarify .meaning { padding-left: 20px; padding-top: 5px; }
.consistent { top: 163px; }
.consistent .meaning { font-size: 23px; padding-top: 6px; }
.resist { top: 195px; }
.insist { top: 226px; }
.resist .word, .insist .word { padding-left: 27px; }
.resist .meaning { padding-left: 12px; padding-top: 3px; }
.insist .meaning { padding-left: 18px; padding-top: 3px; }
.insert { top: 284px; }
.assert { top: 315px; }
.insert .meaning, .assert .meaning { padding-left: 3px; padding-top: 4px; }
.assert .meaning { font-size: 24px; }
.eminent { top: 377px; }
.prominent { top: 407px; }
.eliminate { top: 437px; }
.eminent .meaning, .prominent .meaning { padding-left: 5px; }
.prominent .meaning { font-size: 24px; }
.eliminate .meaning { padding-left: 17px; padding-top: 1px; }
.integral { top: 498px; }
.integrity { top: 533px; }
.integrate { top: 565px; }
.integral .meaning { padding-left: 18px; font-size: 24px; }
.integrity .meaning { padding-left: 37px; font-size: 24px; }
.integrate .meaning { padding-left: 34px; font-size: 24px; }
.fabricate { top: 627px; left: 24px; grid-template-columns: 283px 1fr; }
.fluctuate { top: 658px; left: 23px; grid-template-columns: 284px 1fr; }
.fabricate .meaning { font-size: 24px; }
.fluctuate .meaning { font-size: 23px; margin-top: -6px; }
</style>
</head>
<body>
<main class="notebook" aria-label="Handwritten vocabulary notebook">
<div class="gutter"></div>
<section class="page">
<div class="row charity"><span class="word">charity</span><span class="meaning">n. 慈善机构</span></div>
<div class="row clarity"><span class="word">clarity</span><span class="meaning">n. (思路, 图像)清晰</span></div>
<div class="row clarify"><span class="word">clarify</span><span class="meaning">v. 阐明, 解释</span></div>

<div class="row consistent blue"><span class="word">consistent</span><span class="meaning">adj. 一贯的, 与...一致的</span></div>
<div class="row resist blue"><span class="word">resist</span><span class="meaning">v. 抵制</span></div>
<div class="row insist blue"><span class="word">insist</span><span class="meaning">v. 坚持</span></div>

<div class="row insert"><span class="word">insert</span><span class="meaning">v. 插入, 嵌入</span></div>
<div class="row assert"><span class="word">assert</span><span class="meaning">v. 断言; 坚持主张</span></div>

<div class="row eminent blue"><span class="word">eminent</span><span class="meaning">adj. 杰出的</span></div>
<div class="row prominent blue"><span class="word">prominent</span><span class="meaning">adj. 杰出的, 重要的</span></div>
<div class="row eliminate blue"><span class="word">eliminate</span><span class="meaning">v. 消除; 淘汰</span></div>

<div class="row integral"><span class="word">integral</span><span class="meaning">adj. 必不可少的</span></div>
<div class="row integrity"><span class="word">integrity</span><span class="meaning">n. 诚实, 正直</span></div>
<div class="row integrate"><span class="word">integrate</span><span class="meaning">v. (使)融入</span></div>

<div class="row fabricate blue"><span class="word">fabricate</span><span class="meaning">v. 捏造</span></div>
<div class="row fluctuate blue"><span class="word">fluctuate</span><span class="meaning">v. 波动, 上下浮动</span></div>
</section>
</main>
</body>
</html>
