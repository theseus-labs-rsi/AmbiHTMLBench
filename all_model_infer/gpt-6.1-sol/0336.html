<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }

  right: 0;

  height: 40px;

}
.arrow-zone::after {
  content: "";
  position: absolute;
  top: 17px;
  left: 8px;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
