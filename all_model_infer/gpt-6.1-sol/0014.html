<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  display: flex;
  justify-content: center;
  background: #e7d3b1;

.page {
  position: relative;
  width: 540px;
  height: 720px;

  color: #100d08;

    linear-gradient(110deg, #dfc19b, #ead8b9 28%, #e9d6b6 70%, #ddbe96);

  content: "";

  inset: 0;

  left: 0;

  font-size: 32px;

  position: absolute;
  left: 23px;
  right: 36px;
  top: 105px;

}
.line {
  height: 75px;
  line-height: 55px;
  white-space: nowrap;

  text-align-last: justify;

.line.first {

  width: 402px;
}
.line.last {
  text-align: left;
  text-align-last: left;
  letter-spacing: 5px;

<body>
<article class="page">
  <header>老吴の创业随笔</header>
  <main>
    <div class="line first">《易经》中说：“小财</div>
    <div class="line">靠勤，大财靠德，德不厚</div>
    <div class="line">，无以载物。”靠出卖时</div>
    <div class="line">间和劳动力 赚钱的人，</div>
    <div class="line">只能发点小财。一个人每</div>
    <div class="line">天，时间有限，精力有限</div>
    <div class="line last">，分身乏术。</div>
