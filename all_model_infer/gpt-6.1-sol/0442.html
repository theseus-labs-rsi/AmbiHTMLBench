<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #333;
}
.page {
  width: 540px;
  min-height: 720px;
  margin: 0 auto;
  background: #fff;
}
.toolbar {
  height: 91px;
  padding: 30px 25px 0 15px;
  display: flex;
  align-items: flex-start;
  color: #b9b043;
}
.back {
  width: 16px;
  height: 33px;
  position: relative;
  margin-right: 12px;
}
.back::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border-left: 3px solid #c2b64a;
  border-bottom: 3px solid #c2b64a;
  transform: rotate(45deg);
  left: 3px;
  top: 10px;
}
.toolbar-title {
  font-size: 25px;
  line-height: 37px;
  white-space: nowrap;
}
.tools {
  margin-left: auto;
  display: flex;
  gap: 36px;
  align-items: center;
}
.placeholder { position: relative; flex-shrink: 0; }
.caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.collection { width: 39px; height: 38px; }
.collection::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border: 3px solid #c1b745;
  border-radius: 50%;
  left: 9px;
  top: 4px;
}
.collection::after {
  content: "✓";
  position: absolute;
  left: 0;
  top: 18px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #c1b745;
  color: white;
  font-size: 15px;
  line-height: 19px;
  text-align: center;
}
.collection .head {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #c1b745;
  top: 11px;
  left: 21px;
}
.collection .head::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 9px;
  border-radius: 8px 8px 3px 3px;
  background: #c1b745;
  left: -3px;
  top: 11px;
}
.share { width: 36px; height: 38px; }
.share::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 24px;
  border: 2px solid #b9b043;
  border-radius: 3px;
  left: 7px;
  top: 11px;
}
.share .arrow {
  position: absolute;
  width: 2px;
  height: 25px;
  background: #b9b043;
  left: 19px;
  top: 1px;
}
.share .arrow::before {
  content: "";
  position: absolute;
  width: 9px;
  height: 9px;
  border-left: 2px solid #b9b043;
  border-top: 2px solid #b9b043;
  transform: rotate(45deg);
  left: -4px;
  top: 2px;
}
.more {
  width: 32px;
  height: 32px;
  border: 3px solid #c1b745;
  border-radius: 50%;
  margin-top: 3px;
}
.more::before {
  content: "···";
  position: absolute;
  inset: -7px 0 0;
  text-align: center;
  font-size: 27px;
  font-weight: bold;
}
main { padding: 20px 35px 35px; }
.heading {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 33px;
}
.check {
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: #f0c51d;
  color: #fff;
  font-size: 27px;
  font-weight: 400;
  line-height: 33px;
  text-align: center;
  flex-shrink: 0;
}
h2 {
  margin: 0;
  font-size: 25px;
  line-height: 35px;
  font-weight: 600;
  letter-spacing: .15px;
}
.quote {
  margin: 39px 0 0;
  font-size: 25px;
  line-height: 35px;
  font-weight: 400;
  letter-spacing: .15px;
}
.quote-line { white-space: nowrap; }
.second { margin-top: 79px; }
.second .quote { margin-top: 39px; }
@media (max-width: 539px) {
  .page { transform-origin: top left; }
}
</style>
</head>
<body>
<div class="page">
  <header class="toolbar">
    <div class="placeholder back"><span class="caption">[返回图标：左上角]</span></div>
    <div class="toolbar-title">金句合集</div>
    <div class="tools">
      <div class="placeholder collection"><span class="head"></span><span class="caption">[合集图标：顶部右侧]</span></div>
      <div class="placeholder share"><span class="arrow"></span><span class="caption">[分享图标：顶部右侧]</span></div>
      <div class="placeholder more"><span class="caption">[更多图标：右上角]</span></div>
    </div>
  </header>
  <main>
    <section>
      <div class="heading">
        <div class="check">✓</div>
        <h2>他写「成长」，正是你所亲历</h2>
      </div>
      <p class="quote"><span class="quote-line">“我经由光阴，经由山水，经由乡村和城</span><br>
        <span class="quote-line">市，同样我也经由别人，经由一切他者以</span><br>
        <span class="quote-line">及由之引生的思绪和梦想而走成了我。那</span><br>
        <span class="quote-line">路途中的一切，有些与我擦肩而过从此天</span><br>
        <span class="quote-line">各一方，有些便永久驻进我的心魂，雕琢</span><br>
        <span class="quote-line">我，塑造我，锤炼我，融入我而成为我。”</span><br>
        <span class="quote-line">——《病隙碎笔》</span>
      </p>
    </section>
    <section class="second">
      <div class="heading">
        <div class="check">✓</div>
        <h2>他写「磨难」，报之以歌</h2>
      </div>
      <p class="quote"><span class="quote-line">“大劫大难之后人不该失去锐气，不该失去</span><br>
        <span class="quote-line">热度。你镇定了但仍在燃烧，你平稳了却</span><br>
        <span class="quote-line">更加浩荡。”——《好运设计》</span>
      </p>
    </section>
  </main>
</div>
</body>
</html>
