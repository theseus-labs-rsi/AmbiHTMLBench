<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头孢菌素分类</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
.page {
  position: relative;
  width: 540px;
  height: 379px;
  overflow: hidden;
  color: #d6e6d5;
  background: linear-gradient(110deg, #217c67, #197e67 64%, #27846e);
}
.heading {
  position: absolute;
  left: 10px;
  top: 3px;
  color: #e4ef70;
  font-size: 21px;
  line-height: 30px;
}
.star {
  position: absolute;
  left: 159px;
  top: 1px;
  width: 42px;
  height: 35px;
  color: #e7f35c;
  font-size: 35px;
  line-height: 35px;
  transform: rotate(16deg);
}
table { border-collapse: collapse; table-layout: fixed; }
.main {
  position: absolute;
  left: 4px;
  top: 38px;
  width: 542px;
  height: 152px;
  font-size: 19px;
  line-height: 25px;
}
td, th {
  border: 2px solid #b1d1c7;
  padding: 1px 5px;
  font-weight: normal;
}
.main .category { width: 80px; text-align: center; font-size: 20px; line-height: 27px; }
.main .generation { width: 81px; text-align: center; white-space: nowrap; }
.main .names { padding-left: 5px; white-space: nowrap; letter-spacing: -.6px; }
.yellow { color: #e3ee68; }
.mark { border-bottom: 2px solid #e8f05c; border-radius: 0 0 45% 40%; }
.circle { border: 2px solid #e6ef56; border-radius: 50%; padding: 1px 0; }
.mnemonic {
  position: absolute;
  left: 4px;
  top: 197px;
  width: 346px;
  height: 163px;
  font-size: 19px;
  line-height: 26px;
}
.mnemonic th { height: 30px; text-align: center; }
.mnemonic .label { width: 90px; color: #e5ef6d; }
.mnemonic td { height: 33px; white-space: nowrap; }
.mnemonic .phrase { padding-left: 6px; letter-spacing: -.5px; }
.images {
  position: absolute;
  left: 353px;
  top: 191px;
  width: 187px;
  height: 188px;
  display: grid;
  grid-template-columns: 102px 85px;
  grid-template-rows: 111px 77px;
}
.placeholder {
  margin: 0;
  border: 1px solid #b5d0bc;
  background: #fbfcf6;
  color: #666;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  padding: 5px;
  overflow: hidden;
}
.toilet { width: 102px; height: 111px; }
.food { width: 85px; height: 111px; background: #d2c0a1; }
.couple { width: 114px; height: 77px; background: #fff8f7; }
.cow { width: 73px; height: 77px; margin-left: 12px; }

</head>
<body>
<main class="page">
  <div class="heading">1.头孢菌素分类</div>
  <div class="star" aria-label="手绘星形标记">☆</div>

  <table class="main">
    <colgroup><col style="width:80px"><col style="width:81px"><col></colgroup>
    <tbody>
      <tr>
        <td class="category" rowspan="4">头孢<br>菌素类</td>
        <td class="generation">第一代</td>
        <td class="names">头孢唑林、氨<span class="yellow mark">苄</span>、羟氨<span class="yellow mark">苄</span>、<span class="yellow mark">拉定</span>、<span class="yellow mark">硫脒</span>、<span class="yellow mark">噻吩</span></td>
      </tr>
      <tr>
        <td class="generation">第二代</td>
        <td class="names">头孢呋辛、<span class="yellow mark">孟多</span>、<span class="yellow mark">替安</span>、<span class="yellow mark">克洛</span>、丙烯</td>
      </tr>
      <tr>
        <td class="generation">第<span class="yellow circle">三</span>代</td>
        <td class="names">头孢他啶、他美、<span class="yellow mark">匹胺</span>、<span class="yellow mark">哌酮</span>、<span class="yellow mark">曲松</span>、<span class="yellow mark">噻肟</span>、<br>克肟、唑肟、甲肟、泊肟、<span class="yellow circle">他[?]</span></td>
      </tr>
      <tr>
        <td class="generation">第<span class="yellow">四</span>代</td>
        <td class="names">头孢<span class="yellow mark">匹罗</span>、<span class="yellow">吡肟</span></td>
      </tr>
    </tbody>
  </table>

  <table class="mnemonic">
    <colgroup><col style="width:90px"><col></colgroup>
    <thead><tr><th colspan="2">记忆一下</th></tr></thead>
    <tbody>
      <tr>
        <td class="label">第一代</td>
        <td class="phrase">一头<span class="yellow">坐便拉定</span>，<span class="yellow mark">米粉</span>吃多了</td>
      </tr>
      <tr>
        <td class="label">第二代</td>
        <td class="phrase">二<span class="yellow mark">呋孟多</span>，<span class="yellow mark">替俺克丙</span></td>
      </tr>
      <tr>
        <td class="label">第三代</td>
        <td class="phrase"><span class="yellow">他胶哌曲肟</span>三妹<span class="yellow mark">地</span></td>
      </tr>
      <tr>
        <td class="label">第四代</td>
        <td class="phrase">四<span class="yellow mark">匹罗子吡肟</span>牛</td>
      </tr>
    </tbody>
  </table>

  <div class="images">
    <div class="placeholder toilet">[插图：人物与坐便器]</div>
    <div class="placeholder food">[照片：人物与食物]</div>
    <div class="placeholder couple">[插图：粉色心形背景中的两个人物]</div>
    <div class="placeholder cow">[插图：牛]</div>
  </div>
</main>
