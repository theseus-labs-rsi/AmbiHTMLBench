<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2017 校园艺术节</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #d5d5d5; padding: 51px 32px; }
.poster {
  width: 960px;
  height: 1440px;
  position: relative;
  overflow: hidden;
  background-color: #f4f1e8;
  background-image:
    radial-gradient(ellipse at 24% 30%, #ddd6c433 0, transparent 42%),
    radial-gradient(ellipse at 75% 70%, #ffffff70 0, transparent 52%),
    repeating-linear-gradient(114deg, transparent 0 13px, #d5cfbe0a 14px, transparent 16px);
  color: #080807;
}
.year { position: absolute; top: 72px; left: 35px; font: 26px Georgia, serif; letter-spacing: 12px; white-space: nowrap; }
.left-heading { position: absolute; left: 31px; top: 102px; display: flex; gap: 13px; height: 215px; }
.left-heading .slogan { writing-mode: vertical-rl; font: 41px "Songti SC", "SimSun", serif; color: #122564; line-height: 1; letter-spacing: 2px; }
.left-heading .festival { writing-mode: vertical-rl; font: bold 40px "Songti SC", "SimSun", serif; line-height: 1; letter-spacing: 3px; }
.artists { position: absolute; left: 33px; top: 335px; display: flex; align-items: flex-start; gap: 7px; height: 340px; }
.artist-note { writing-mode: vertical-rl; font: 20px "SimSun", serif; letter-spacing: 3px; line-height: 1.1; }
.artist-name { writing-mode: vertical-rl; font: 54px Georgia, "Times New Roman", serif; color: #13265d; line-height: 1; }
.artist-group { display: flex; gap: 7px; }
.artist-group + .artist-group { margin-left: 10px; }
.main-title { position: absolute; top: 179px; left: 367px; width: 254px; height: 650px; }
.glyph { position: absolute; font-family: "Songti SC", "STSong", "SimSun", serif; font-weight: 400; line-height: 1; font-size: 174px; width: 210px; text-align: center; }
.glyph::before, .glyph::after { content: attr(data-text); position: absolute; inset: 0; color: transparent; -webkit-text-stroke: 1px #c2bfb3; z-index: 0; }
.glyph::before { transform: translate(27px,-23px) scale(.97); }
.glyph::after { transform: translate(48px,-47px) scale(.94); opacity: .6; }
.glyph span { position: relative; z-index: 1; }
.glyph.one { top: 0; left: 8px; }
.glyph.two { top: 239px; left: 6px; }
.glyph.three { top: 480px; left: 7px; }
.dot { position: absolute; left: 108px; width: 17px; height: 17px; border-radius: 50%; background: #080807; }
.dot.first { top: 193px; }
.dot.second { top: 429px; }
.placeholder { position: absolute; overflow: hidden; color: #13245f; }
.placeholder figcaption { position: absolute; font: 10px Arial, sans-serif; background: #f4f1e8d9; padding: 2px 4px; }
.top-decoration { margin: 0; width: 302px; height: 460px; top: 0; right: 0; }
.top-decoration::before {
  content: ""; position: absolute; width: 650px; height: 770px; left: 0; top: -313px;
  border-radius: 50%;
  background: repeating-radial-gradient(ellipse at 84% 54%, transparent 0 5px, #13245f 6px 8px, transparent 9px 13px);
  transform: rotate(-22deg);
}
.top-decoration figcaption { right: 5px; top: 5px; }
.bottom-decoration { margin: 0; left: 0; bottom: 0; width: 480px; height: 608px; }
.bottom-decoration::before {
  content: ""; position: absolute; width: 641px; height: 641px; left: -165px; top: 1px; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 3px, #14265f 4px 5px, transparent 6px 8px);
}
.bottom-decoration::after {
  content: ""; position: absolute; width: 378px; height: 378px; left: 37px; top: 100px; border-radius: 50%;
  background: repeating-radial-gradient(ellipse at 31% 66%, #f4f1e8 0 4px, #14265f 5px 6px, #f4f1e8 7px 10px);
  transform: rotate(-28deg);
}
.bottom-decoration figcaption { left: 8px; bottom: 8px; z-index: 2; }
.date { position: absolute; top: 485px; right: 34px; width: 239px; text-align: right; }
.date-number { display: flex; justify-content: flex-end; align-items: center; color: #13245f; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 79px; font-weight: 200; letter-spacing: -5px; line-height: 1.04; }
.date-number .times { font: 71px "Times New Roman", serif; color: #151515; margin: 0 2px; }
.month { font: bold 23px Arial, sans-serif; margin-top: 3px; letter-spacing: -.7px; }
.month .times { font-family: "Times New Roman", serif; font-weight: 400; color: #777; }
.music { font: bold 17px Arial, sans-serif; white-space: nowrap; margin-top: 5px; }
.schedule { position: absolute; top: 704px; right: 36px; width: 220px; text-align: right; }
.event { margin-bottom: 16px; }
.event-code { font: bold 49px Arial, sans-serif; letter-spacing: 1px; line-height: 1.15; }
.time { font: 16px Arial, sans-serif; letter-spacing: 4px; margin-top: 6px; }
.venue { font: 25px "SimSun", "Songti SC", serif; line-height: 1.22; margin-top: 8px; }
.challenge { position: absolute; left: 617px; top: 1095px; width: 305px; }
.challenge h1 { font: bold 49px "Songti SC", "SimSun", serif; margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid #111; white-space: nowrap; }
.challenge h2 { font: bold 43px Georgia, "Times New Roman", serif; line-height: 1.03; letter-spacing: .1px; margin: 9px 0 13px; }
.challenge .question { border: 1px solid #14265f; color: #14265f; font: bold 22px "Songti SC", "SimSun", serif; padding: 6px 3px 4px; white-space: nowrap; }
.challenge p { margin: 6px 2px 0; color: #14265f; font: bold 23px Georgia, "Times New Roman", serif; line-height: 1.17; letter-spacing: .2px; }
</style>
</head>
<body>
<main class="poster">
  <div class="year">2017</div>
  <div class="left-heading">
    <div class="slogan">無∞极∞限</div>
    <div class="festival">校园艺术节</div>
  </div>

  <div class="artists">
    <div class="artist-group">
      <div class="artist-note">艺术设计教父经典作品震撼展出</div>
      <div class="artist-name">Steve Reich</div>
    </div>
    <div class="artist-group">
      <div class="artist-note">国际当代艺术大师</div>
      <div class="artist-name">Pascal Pons</div>
    </div>
  </div>

  <div class="main-title" aria-label="艺·术·节">
    <div class="glyph one" data-text="艺"><span>艺</span></div>
    <div class="dot first"></div>
    <div class="glyph two" data-text="术"><span>术</span></div>
    <div class="dot second"></div>
    <div class="glyph three" data-text="节"><span>节</span></div>
  </div>

  <figure class="placeholder top-decoration">
    <figcaption>[Decorative concentric curves: top-right]</figcaption>
  </figure>
  <figure class="placeholder bottom-decoration">
    <figcaption>[Decorative concentric spiral: bottom-left]</figcaption>
  </figure>

  <section class="date">
    <div class="date-number"><span>07</span><span class="times">×</span><span>31</span></div>
    <div class="month">JULY <span class="times">×</span> THIRTY</div>
    <div class="music">〈 Music for 18 Musicians 〉</div>
  </section>

  <section class="schedule">
    <div class="event">
      <div class="event-code">B2/10</div>
      <div class="time">AM8:00</div>
      <div class="venue">北京市<br>文化中心展馆</div>
    </div>
    <div class="event">
      <div class="event-code">B2/11</div>
      <div class="time">PM5:00</div>
      <div class="venue">北京市<br>文化中心展馆</div>
    </div>
  </section>

  <section class="challenge">
    <h1>期待你的挑战</h1>
    <h2>Look forward to<br>your challenge</h2>
    <div class="question">是困守原地，还是突破重生！</div>
    <p>To be stuck in the same place,<br>or to break out of rebirth!</p>
  </section>
</main>
</body>
</html>
