<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #080808; font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
.page { position: relative; width: 540px; height: 720px; margin: 0 auto; overflow: hidden; background: #fff; }
.binding { position: absolute; top: 14px; left: -12px; width: 564px; display: flex; justify-content: space-between; }
.hole { width: 24px; height: 24px; border: 2px solid #ccc; border-radius: 50%; box-shadow: inset 0 2px 3px #ddd; }
h1 { position: absolute; top: 60px; left: 110px; margin: 0; font-size: 36px; line-height: 48px; font-weight: 400; white-space: nowrap; }
.subtitle { position: absolute; top: 120px; left: 165px; margin: 0; font-size: 17px; line-height: 25px; letter-spacing: 1px; }
.step { position: absolute; top: 72px; left: 0; width: 43px; height: 108px; border-radius: 0 6px 6px 0; background: linear-gradient(145deg, #202027, #73313d 38%, #c44e36 68%, #702b4a); color: white; display: flex; align-items: center; justify-content: center; }
.step-text { writing-mode: vertical-rl; font-size: 24px; font-weight: bold; letter-spacing: 3px; }
.step-caption { position: absolute; bottom: 2px; font-size: 6px; }
.row { position: absolute; display: flex; align-items: flex-start; }
.row-one { top: 213px; left: 35px; }
.row-two { top: 375px; left: 35px; }
.row-three { top: 539px; left: 35px; }
.icon-zone { flex: 0 0 73px; width: 73px; height: 78px; display: flex; align-items: center; justify-content: center; }
.content { margin-left: 12px; width: 390px; }
.row-two .content { margin-left: 16px; width: 387px; }
.row-three .content { margin-left: 5px; width: 404px; }
h2 { margin: 0 0 3px; font-size: 23px; line-height: 31px; font-weight: 400; }
p { margin: 0; font-size: 17px; line-height: 24px; letter-spacing: .6px; }
.placeholder { position: relative; color: #333; }
.memory { width: 53px; height: 71px; border: 5px solid #333; border-radius: 8px 8px 6px 6px; }
.memory::before { content: ""; position: absolute; top: 2px; left: 5px; width: 33px; height: 14px; background: repeating-linear-gradient(to right, #333 0 3px, transparent 3px 7px); }
.memory::after { content: ""; position: absolute; left: 4px; bottom: 4px; width: 31px; height: 25px; border: 4px solid #333; border-radius: 3px; }
.memory-caption { position: absolute; top: 23px; left: -1px; width: 45px; font-size: 7px; text-align: center; }
.cpu { width: 58px; height: 58px; margin-top: 2px; border: 8px solid #333; border-radius: 7px; text-align: center; }
.cpu::before, .cpu::after { content: ""; position: absolute; z-index: 0; }
.cpu::before { left: -14px; top: 0; width: 70px; height: 42px; background: repeating-linear-gradient(to bottom, #333 0 4px, transparent 4px 9px); }
.cpu::after { left: 0; top: -15px; width: 42px; height: 72px; background: repeating-linear-gradient(to right, #333 0 4px, transparent 4px 9px); }
.cpu-face { position: relative; z-index: 1; width: 42px; height: 42px; background: #fff; border-radius: 2px; padding-top: 8px; font-size: 19px; font-weight: bold; }
.cpu-caption { position: absolute; z-index: 2; bottom: -5px; left: -4px; width: 50px; font-size: 6px; }
.resolution { width: 46px; height: 73px; border: 4px solid #333; border-radius: 7px; overflow: hidden; font-weight: bold; text-align: center; }
.resolution .four-k { height: 32px; font-size: 24px; line-height: 32px; letter-spacing: -2px; }
.resolution .uhd { height: 33px; background: #333; color: white; font-size: 21px; line-height: 32px; letter-spacing: -1px; }
.resolution-caption { position: absolute; bottom: 0; left: 0; width: 38px; font-size: 5px; color: white; font-weight: normal; }
</style>
</head>
<body>
<main class="page">
<div class="binding" aria-hidden="true">
<span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span>
</div>
<div class="placeholder step">
<span class="step-text">第二步</span>
<span class="step-caption">[彩色侧边标签]</span>
</div>
<h1>三大核心参数解读</h1>
<p class="subtitle">内存/芯片/分辨率参数解读</p>

<section class="row row-one">
<div class="icon-zone">
<div class="placeholder memory"><span class="memory-caption">[内存卡图标]</span></div>
</div>
<div class="content">
<h2>1.看内存</h2>
<p>内存越大速度越快，小于8GB不建议购买。（画圈：<br>GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）</p>
</div>
</section>

<section class="row row-two">
<div class="icon-zone">
<div class="placeholder cpu">
<div class="cpu-face">CPU</div>
<span class="cpu-caption">[芯片图标]</span>
</div>
</div>
<div class="content">
<h2>2.看芯片</h2>
<p>主流芯片A73和A53。追求性能玩游戏选A73，看<br>看电视想省电选A53。</p>
</div>
</section>

<section class="row row-three">
<div class="icon-zone">
<div class="placeholder resolution">
<div class="four-k">4K</div>
<div class="uhd">UHD</div>
<span class="resolution-caption">[分辨率图标]</span>
</div>
</div>
<div class="content">
<h2>3.看分辨率</h2>
<p>分辨率越高清晰。（目前电视基本都是超高清4K<br>也就是3840×2160的分辨率）</p>
</div>
</section>
</main>
</body>
</html>
