<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际博物馆日</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #eeeae2; }
.page {
  position: relative;
  width: 440px;
  height: 622px;
  overflow: hidden;
  background: #dedbd1;
  color: #143e33;
  font-family: "Songti SC", "SimSun", serif;
}
.heading {
  position: absolute;
  top: 18px;
  left: 27px;
  width: 280px;
  height: 128px;
}
.heading-top { display: flex; align-items: flex-start; gap: 10px; }
.chinese-top { font-size: 60px; line-height: 1.05; white-space: nowrap; }
.english {
  padding-top: 5px;
  color: #123a30;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 16px;
  line-height: 19px;
  letter-spacing: 1px;
}
.heading-bottom { font-size: 60px; line-height: 1.08; white-space: nowrap; }
.seal {
  position: absolute;
  top: 25px;
  left: 202px;
  width: 35px;
  height: 36px;
  margin: 0;
  background: #bc1618;
  color: white;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.motto {
  position: absolute;
  top: 25px;
  right: 16px;
  display: flex;
  flex-direction: row-reverse;
  gap: 5px;
  font-size: 13px;
  line-height: 16px;
}
.motto span {
  writing-mode: vertical-rl;
  border-left: 1px solid #284b3d;
  padding-left: 4px;
}
.date {
  position: absolute;
  left: 26px;
  top: 176px;
  font-size: 22px;
  line-height: 26px;
}
.date .year { font-size: 21px; letter-spacing: 1px; }
.date .month-day { position: relative; height: 48px; }
.date .month { position: absolute; top: 0; left: 3px; }
.date .slash { position: absolute; left: 15px; top: 0; height: 41px; border-left: 1px solid #23483c; transform: rotate(12deg); }
.date .day { position: absolute; top: 22px; left: 22px; }
.date-line {
  position: absolute;
  top: 211px;
  left: 18px;
  width: 1px;
  height: 54px;
  background: #345341;
}
.dot { position: absolute; left: 16px; width: 6px; height: 6px; border-radius: 50%; background: #364c2b; }
.dot.top { top: 196px; }
.dot.bottom { top: 518px; }
.vertical-phrase {
  position: absolute;
  top: 280px;
  left: 42px;
  display: grid;
  grid-template-columns: 16px 16px;
  column-gap: 2px;
  row-gap: 18px;
  font-size: 13px;
  line-height: 18px;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin: 0;
  border: 1px solid #6c8375;
  background: #aeb8a7;
  color: #254a3c;
  font-family: "SimSun", serif;
  font-size: 12px;
}
.main-art {
  position: absolute;
  left: 108px;
  top: 173px;
  width: 243px;
  height: 419px;
}
.small-art {
  position: absolute;
  top: 423px;
  left: 33px;
  width: 40px;
  height: 71px;
  font-size: 10px;
}
.lower-line { position: absolute; left: 18px; top: 416px; width: 1px; height: 91px; background: #345341; }
.explanation {
  position: absolute;
  top: 142px;
  right: 14px;
  height: 213px;
  width: 55px;
  writing-mode: vertical-rl;
  font-family: "SimSun", serif;
  font-size: 7px;
  line-height: 9px;
  color: #34372e;
}
.bottom-left, .bottom-right {
  position: absolute;
  top: 535px;
  font-family: "SimSun", serif;
  font-size: 14px;
  line-height: 21px;
  letter-spacing: 1px;
}
.bottom-left { left: 23px; }
.bottom-right { left: 363px; }
.latin { font-family: Arial, sans-serif; font-size: 16px; letter-spacing: 0; }
</style>
</head>
<body>
<main class="page">
  <header class="heading">
    <div class="heading-top">
      <div class="chinese-top">国际</div>
      <div class="english">International<br>Museum<br>Day</div>
    </div>
    <div class="heading-bottom">博物馆日</div>
    <figure class="placeholder seal">[illegible]</figure>
  </header>

  <div class="motto">
    <span>穿越千古</span>
    <span>追梦今[?]</span>
  </div>

  <span class="dot top"></span>
  <div class="date-line"></div>
  <section class="date">
    <div>时间:</div>
    <div class="year">2021</div>
    <div class="month-day">
      <span class="month">5</span>
      <span class="slash"></span>
      <span class="day">18</span>
    </div>
  </section>

  <div class="vertical-phrase">
    <span>一</span><span>两</span>
    <span>处</span><span>处</span>
    <span>文</span><span>情</span>
    <span>物</span><span>怀</span>
  </div>

  <figure class="placeholder main-art">[图片：中央青铜器]</figure>
  <div class="lower-line"></div>
  <figure class="placeholder small-art">[图片：小型青铜器]</figure>
  <span class="dot bottom"></span>

  <aside class="explanation">国际博物馆日定于每年的5月18日。1977年，国际博物馆协会（ICOM）[illegible]</aside>

  <div class="bottom-left">
    与历史相遇<br>
    <span class="latin">MING</span><br>
    明兴亡
  </div>
  <div class="bottom-right">
    打开时代<br>
    <span class="latin">DE</span><br>
    任意门
  </div>
</main>
</body>
</html>
