<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献阅读与综述写作聊天记录</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #fff; font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
}
.conversation {
  position: absolute;
  inset: 0 18px;
  background: #e8e8e8;
}
.placeholder {
  position: absolute;
  width: 51px;
  height: 51px;
  border-radius: 5px;
  background: #718ca7;
  color: #eef1f4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  text-align: center;
  overflow: hidden;
}
.avatar-left { left: 14px; }
.avatar-one { top: 3px; }
.avatar-two { top: 256px; }
.avatar-three { top: 414px; }
.avatar-four { top: 604px; }
.avatar-right { left: 439px; top: 671px; background: #816349; }
.bubble {
  position: absolute;
  left: 79px;
  width: 347px;
  border-radius: 5px;
  background: #fff;
  padding: 10px 15px;
  font-size: 21px;
  font-weight: 400;
  line-height: 31.5px;
  color: #111;
  white-space: nowrap;
}
.bubble::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 19px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 9px solid #fff;
}
.first { top: 3px; height: 238px; }
.second { top: 255px; height: 144px; }
.third { top: 414px; height: 175px; }
.fourth { top: 604px; width: 138px; height: 53px; padding-top: 10px; }
.number {
  display: inline-flex;
  vertical-align: 1px;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  margin-right: 7px;
  border-radius: 5px;
  border: 1px solid #8a9ca7;
  background: linear-gradient(#adc6d5, #55798d);
  box-shadow: inset 0 1px 2px #d4e2e9;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 21px;
  line-height: 26px;
}
.reply {
  left: 249px;
  top: 671px;
  width: 177px;
  height: 53px;
  background: #9af34b;
  padding: 10px 15px;
}
.reply::before {
  left: auto;
  right: -8px;
  border-right: 0;
  border-left: 9px solid #9af34b;
}
</style>
</head>
<body>
<main class="page">
  <section class="conversation" aria-label="聊天记录">
    <div class="placeholder avatar-left avatar-one">[头像]</div>
    <div class="bubble first">
      <span class="number">6</span>这个精读的过程可能要重复几<br>
      遍，好的文献不是读一遍就完事，<br>
      每读一遍你都会获取新的信息。<br>
      读第二第三遍的时候，在电脑打<br>
      开word，开始一遍读一边记录要<br>
      写进你文献综述的部分，注意要<br>
      用自己的话重述。
    </div>

    <div class="placeholder avatar-left avatar-two">[头像]</div>
    <div class="bubble second">
      <span class="number">7</span>最后将所有文献进行整理引<br>
      用，把同一小主题的贴在同一段<br>
      中，也可以加上小标题，使自己的<br>
      文章更有逻辑，条理更清晰
    </div>

    <div class="placeholder avatar-left avatar-three">[头像]</div>
    <div class="bubble third">
      <span class="number">8</span>尽量找出不同论文中矛盾冲<br>
      突的点，凸显出学术圈思维碰<br>
      撞的火花，学会用however,on<br>
      thecontrary,in contrast这类连接<br>
      词。
    </div>

    <div class="placeholder avatar-left avatar-four">[头像]</div>
    <div class="bubble fourth">你重新写吧</div>

    <div class="bubble reply">好的，谢谢老师</div>
    <div class="placeholder avatar-right">[头像]</div>
  </section>
</main>
</body>
</html>
