<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营48个必备工具</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #2c5343; }
.page {
  width: 540px;
  height: 720px;
  position: relative;
  overflow: hidden;
  background: #2c5343;
  color: #f8faf1;
  font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
h1 {
  position: absolute;
  left: 45px;
  top: 59px;
  margin: 0;
  font-size: 57px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: 1px;
}
h1 .first { letter-spacing: 3px; }
.author {
  position: absolute;
  left: 37px;
  top: 224px;
  width: 211px;
  height: 34px;
  background: #e3b900;
  padding: 3px 11px;
  font-size: 19px;
  line-height: 28px;
  font-weight: 700;
  white-space: nowrap;
}
.tools {
  position: absolute;
  left: 37px;
  top: 292px;
  display: grid;
  grid-template-columns: 227px 218px;
  gap: 14px;
}
.left {
  display: grid;
  grid-template-columns: 98px 116px;
  grid-template-rows: 95px 153px 95px;
  gap: 12px 13px;
}
.right {
  display: grid;
  grid-template-columns: 102px 102px;
  grid-template-rows: 117px 113px 112px;
  gap: 13px 14px;
}
.card { padding: 9px 12px; }
.left .card { background: #849972; }
.right .card { background: #609b5f; }
.part {
  font-size: 18px;
  line-height: 25px;
  font-weight: 400;
  white-space: nowrap;
}
.description {
  margin-top: 8px;
  font-size: 19px;
  line-height: 24px;
  font-weight: 700;
  white-space: nowrap;
}
.one { grid-column: 1; grid-row: 1 / 3; }
.two { grid-column: 2; grid-row: 1; padding-left: 16px; }
.three { grid-column: 2; grid-row: 2; padding-left: 16px; }
.four { grid-column: 1 / 3; grid-row: 3; }
.four .description { margin-top: 10px; }
.five { grid-column: 1 / 3; grid-row: 1; padding-left: 16px; }
.six { grid-column: 1; grid-row: 2 / 4; padding-left: 16px; }
.seven { grid-column: 2; grid-row: 2; }
.eight { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
<main class="page">
  <h1><span class="first">TikTok运营</span><br>48个必备工具</h1>
  <div class="author">@ 徐徐教你做TikTok</div>
  <section class="tools">
    <div class="left">
      <div class="card one">
        <div class="part">Part 01</div>
        <div class="description">7个TK<br>数据平台</div>
      </div>
      <div class="card two">
        <div class="part">Part 02</div>
        <div class="description">3个好用<br>选品网站</div>
      </div>
      <div class="card three">
        <div class="part">Part 03</div>
        <div class="description">5个视频<br>素材网站</div>
      </div>
      <div class="card four">
        <div class="part">Part 04</div>
        <div class="description">6个TK数据分析网站</div>
      </div>
    </div>
    <div class="right">
      <div class="card five">
        <div class="part">Part 05</div>
        <div class="description">4个剪辑<br>4个翻译软件</div>
      </div>
      <div class="card six">
        <div class="part">Part 06</div>
        <div class="description">8个TK<br>传输管理<br>网站</div>
      </div>
      <div class="card seven">
        <div class="part">Part 07</div>
        <div class="description">5个BGM<br>网站</div>
      </div>
      <div class="card eight">
        <div class="part">Part 08</div>
        <div class="description">7个投放<br>联盟网站</div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
