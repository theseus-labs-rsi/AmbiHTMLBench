<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 第③步：调整所得税</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f9f4e8;
  font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
}
.document {
  position: relative;
  width: 540px;
  height: 722px;
  margin: 0 auto;
  overflow: hidden;
  background: repeating-linear-gradient(
    92deg,
    #faf6e9 0px,
    #faf6e9 3px,
    #eae0cd 4px,
    #fcf8ee 5px,
    #fcf8ee 7px
  );
}
.sheet {
  position: absolute;
  left: 22px;
  top: 28px;
  width: 496px;
  height: 679px;
  border: 1px solid #716345;
  border-radius: 9px;
  background: #fff;
}
h1 {
  position: absolute;
  top: 58px;
  left: 65px;
  width: 434px;
  margin: 0;
  color: #765a2b;
  font-size: 36px;
  font-weight: 800;
  line-height: 1.28;
  text-align: center;
}
.subtitle {
  position: absolute;
  left: 69px;
  top: 197px;
  padding: 0 10px;
  color: #775b2e;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  line-height: 27px;
  background: linear-gradient(transparent 8%, #fff0c8 17%, #f5d397 48%, #ffe4b1 78%, transparent 96%);
}
.report {
  position: absolute;
  left: 67px;
  width: 337px;
  color: #111;
  font-size: 16px;
  line-height: 1.6;
}
.individual { top: 258px; }
.consolidated { top: 379px; }
.heading { white-space: nowrap; }
.heading strong { font-weight: 750; }
.calculation {
  display: flex;
  align-items: center;
  margin-top: 2px;
  margin-left: 36px;
  height: 61px;
  white-space: nowrap;
}
.values {
  width: 95px;
  flex-shrink: 0;
  text-align: center;
  line-height: 31px;
}
.brace {
  width: 15px;
  height: 62px;
  flex-shrink: 0;
  color: #6394a8;
  font-family: "Times New Roman", serif;
  font-size: 62px;
  font-weight: 400;
  line-height: 57px;
  transform: scaleX(.48);
  text-shadow: 3px 1px 3px #d6e2e6;
}
.result {
  font-size: 15px;
  letter-spacing: -.55px;
}
.result mjx-container { margin: 0 !important; }
.group {
  position: absolute;
  left: 398px;
  top: 318px;
  display: flex;
  align-items: flex-start;
  height: 107px;
}
.arrow {
  position: relative;
  width: 17px;
  height: 106px;
  flex-shrink: 0;
  background: transparent;
}
.arrow::before {
  content: "";
  position: absolute;
  top: 0;
  left: 5px;
  width: 8px;
  height: 96px;
  background: #659dca;
}
.arrow::after {
  content: "";
  position: absolute;
  left: 1px;
  bottom: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 11px solid #659dca;
}
.arrow .caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.group-label {
  margin-top: 2px;
  font-size: 17px;
  line-height: 31px;
  white-space: nowrap;
  color: #111;
}
.group-label .adjustment { text-align: center; }
.accounting {
  position: absolute;
  left: 82px;
  top: 503px;
  color: #7c6a48;
  font-size: 17px;
  line-height: 33px;
}
.credit { padding-left: 96px; }
.placeholder {
  display: flex;
  justify-content: center;
  align-items: center;
}
.decoration {
  position: absolute;
  color: #8b7758;
  font-size: 10px;
  text-align: center;
}
.paw-left {
  left: 145px;
  top: 42px;
  width: 25px;
  height: 24px;
}
.paw-right {
  left: 400px;
  top: 35px;
  width: 30px;
  height: 29px;
  color: #d8ab72;
}
.cat-left {
  left: 22px;
  top: 630px;
  width: 138px;
  height: 86px;
  background: #fbefc7;
  border-radius: 55% 55% 35% 35%;
}
.cat-right {
  left: 405px;
  top: 601px;
  width: 113px;
  height: 121px;
  border-radius: 30% 30% 14% 14%;
  background: #f4f1e9;
}
@media (max-width: 539px) {
  .document { margin-left: 0; }
}
</style>
</head>
<body>
<main class="document">
  <div class="sheet"></div>

  <div class="placeholder decoration paw-left">[Paw decoration]</div>
  <div class="placeholder decoration paw-right">[Paw decoration]</div>

  <h1>内部交易抵销<br>第③步：调整所得税</h1>

  <div class="subtitle">若实现60%对外销售</div>

  <section class="report individual">
    <div class="heading"><strong>个别报表层面</strong>因为存货跌价准备：</div>
    <div class="calculation">
      <div class="values">账面价值900<br>计税基础1200</div>
      <span class="brace">}</span>
      <div class="result">递延所得税资产$300*25\%=75$</div>
    </div>
  </section>

  <section class="report consolidated">
    <div class="heading"><strong>合并报表层面</strong>因为存货跌价准备：</div>
    <div class="calculation">
      <div class="values">账面价值800<br>计税基础1200</div>
      <span class="brace">}</span>
      <div class="result">递延所得税资产$400*25\%=100$</div>
    </div>
  </section>

  <div class="group">
    <div class="placeholder arrow"><span class="caption">[Arrow: downward]</span></div>
    <div class="group-label">
      <div>【集团角度】</div>
      <div class="adjustment">调增25</div>
    </div>
  </div>

  <div class="accounting">
    <div>会计处理：借：递延所得税资产25</div>
    <div class="credit">贷：所得税费用25</div>
  </div>

  <div class="placeholder decoration cat-left">[Illustration: reclining cat]</div>
  <div class="placeholder decoration cat-right">[Illustration: cat wearing a hat]</div>
</main>
</body>
</html>
