<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂花露与荷花露</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #e5c5cf; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  background: #e5c5cf;
  color: #646362;
  font-family: "SimHei", "Heiti SC", "Microsoft YaHei", sans-serif;
}
.frame {
  position: absolute;
  left: 21px;
  top: 21px;
  width: 500px;
  height: 651px;
  border: 1px solid #797471;
}
section {
  position: absolute;
  left: 65px;
  width: 412px;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 1px;
  line-height: 26px;
}
.osmanthus { top: 84px; }
.lotus { top: 370px; }
p { margin: 0; }
.heading { margin-bottom: 26px; }
.detail { margin-bottom: 26px; }
.footer {
  position: absolute;
  left: 22px;
  top: 680px;
  font-family: "SimSun", "Songti SC", serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #7d7375;
}
.watermark {
  position: absolute;
  right: 21px;
  top: 679px;
  font-size: 13px;
  color: #f4e6ec;
  letter-spacing: 0;
}
</style>
</head>
<body>
<main class="page">
  <div class="frame"></div>
  <section class="osmanthus">
    <p class="heading">△桂花露</p>
    <p class="detail">【功用】开胃消食，宽胸化痰</p>
    <p class="detail">【药物】桂花500克</p>
    <p>【制法】于9月底开花时采收，阴干，拣去<br>杂质。先加水浸泡2小时，放入蒸馏器蒸2<br>次，收集蒸馏液</p>
  </section>
  <section class="lotus">
    <p class="heading">△荷花露</p>
    <p class="detail">【功用】清暑凉营</p>
    <p class="detail">【药物】白荷花500克</p>
    <p>【制法】取含花未放的大花蕾或开放的<br>花，阴干切碎，加水浸泡2小时。放入蒸馏<br>器蒸2小时，收集蒸馏液</p>
  </section>
  <div class="footer">[ 中国色·藕荷 ]</div>
  <div class="watermark">图曰APP</div>
</main>
</body>
</html>
