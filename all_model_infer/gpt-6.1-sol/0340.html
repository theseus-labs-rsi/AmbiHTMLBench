<h1>计算思维二：分解思维</h1>
<div class="content">
<p>分解思维是指<span class="red">将复杂的问题（或任务）拆解成一<br>个个更易于解决的小问题（或任务）</span>。</p>
</div>
<section class="first">
<h2>1、问题梳理</h2>
<p>先明确这个复杂问题到底是什么，最终要达到什<br>么目的或效果。</p>
</section>
<section class="second">
<h2>2、问题分解</h2>
<p>将复杂问题进行分解，梳理解决这个问题需要哪<br>几步，每一步需要干什么事情，具体要怎么做，<br>这就是一个个的小任务。</p>
</section>
<section class="third">
<h2>3、整合方案</h2>
<p>制定方案去解决每个小任务，然后将解决方案整<br>合起来，就能轻松解决这个复杂问题了。</p>
</section>
