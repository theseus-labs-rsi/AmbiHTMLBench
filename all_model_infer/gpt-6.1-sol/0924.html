<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>做好竞品分析</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #e9cbb0;
  color: #161716;
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif;
}
.page {
  width: 540px;
  height: 722px;
  position: relative;
  margin: 0 auto;
  overflow: hidden;
  background: #e9cbb0;
}
.paper {
  position: absolute;
  left: 26px;
  top: 30px;
  width: 488px;
  height: 661px;
  background: #faf6ef;
  border-radius: 15px 15px 13px 13px;
  box-shadow: 3px 3px 5px rgba(101, 73, 50, .18);
}
.ribbon-shadow {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 205px;
  height: 27px;
  background: #e9dbcd;
}
.ribbon {
  position: absolute;
  left: 24px;
  top: 19px;
  height: 30px;
  width: 208px;
  padding-left: 8px;
  display: flex;
  align-items: center;
  color: #fff9f1;
  background: #885732;
  clip-path: polygon(0 0, 92% 0, 100% 50%, 92% 100%, 0 100%);
  font-size: 14px;
  letter-spacing: 3px;
  white-space: nowrap;
}
h1 {
  position: absolute;
  top: 82px;
  left: 24px;
  margin: 0;
  font-size: 40px;
  line-height: 55px;
  font-weight: 900;
  letter-spacing: .2px;
  white-space: nowrap;
}
h1 .number { margin-right: 20px; }
.intro, .analysis {
  position: absolute;
  left: 25px;
  margin: 0;
  font-size: 17px;
  line-height: 27px;
  letter-spacing: 1px;
}
.intro { top: 171px; }
.analysis { top: 250px; }
.points {
  position: absolute;
  left: 25px;
  top: 329px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 17px;
  line-height: 26.5px;
  letter-spacing: 1px;
}
.points li { margin: 0; padding: 0; }
.label { font-weight: 700; }
.detail { padding-left: 28px; font-weight: 400; }
.footer {
  position: absolute;
  left: 0;
  top: 608px;
  width: 488px;
  height: 53px;
  border-radius: 0 0 13px 13px;
  background: #edd9c9;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Noto Serif CJK SC", "Songti SC", SimSun, serif;
  font-size: 19px;
  font-weight: 700;
}
.footer::before {
  content: "";
  position: absolute;
  left: 0;
  top: -4px;
  width: 100%;
  height: 5px;
  background: linear-gradient(135deg, transparent 50%, #edd9c9 50%) 0 0 / 8px 5px repeat-x;
}
.notch {
  position: absolute;
  top: 589px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e9cbb0;
}
.notch.left { left: -10px; }
.notch.right { right: -10px; }
</style>
</head>
<body>
<main class="page">
  <article class="paper">
    <div class="ribbon-shadow"></div>
    <div class="ribbon">新媒体账号运营6种方法</div>
    <h1><span class="number">03</span>做好竞品分析</h1>
    <p class="intro">前期的竞品分析<br>一定要花大量的时间和精力去收集信息</p>
    <p class="analysis">仔细分析<br>可以从以下几个方面来看</p>
    <ol class="points">
      <li><span class="label">1、账号人设标签</span></li>
      <li><span class="label">2、账号选题规划</span></li>
      <li>
        <span class="label">3、内容脚本拆解：</span>
        <div class="detail">结构、矛盾点、金句、痒点</div>
      </li>
      <li>
        <span class="label">4、内容形式：</span>
        <div class="detail">场景道具服装，拍摄剪辑节奏</div>
      </li>
      <li>
        <span class="label">5、运营策略：</span>
        <div class="detail">发布时间和频率，封面，文案，线上互动<br>用户运营，引流途径</div>
      </li>
    </ol>
    <div class="notch left"></div>
    <div class="notch right"></div>
    <footer class="footer">@新媒体运营的十万个为什么</footer>
  </article>
</main>
</body>
</html>
