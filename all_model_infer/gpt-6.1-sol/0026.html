<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指读（Pointing Reading）</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #dedbd2;
  color: #55554e;
  font-family: "Songti SC", SimSun, "Noto Serif CJK SC", serif;
}
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  background: linear-gradient(95deg, #b0aea3 0%, #d2cfc2 7%, #dedbd0 47%, #d0cfc6 100%);
}
.running-title {
  position: absolute;
  top: 21px;
  left: 58px;
  font: 10px Arial, sans-serif;
  transform: rotate(-5deg);
}
.banner {
  position: absolute;
  left: 41px;
  top: 51px;
  width: 422px;
  height: 62px;
  background: #303235;
  color: #cecec6;
  border: 3px double #aaa99e;
  border-radius: 50% 5% 1% 2% / 23% 5% 1% 2%;
  display: flex;
  align-items: center;
  padding: 9px 14px 0;
}
.method {
  font-size: 14px;
  white-space: nowrap;
  padding-right: 13px;
  margin-right: 16px;
  border-right: 1px solid #aaa99e;
  line-height: 29px;
  transform: rotate(-5deg);
}
.heading {
  font-size: 29px;
  letter-spacing: 2px;
  white-space: nowrap;
}
.heading .english {
  font-family: "Times New Roman", serif;
  font-size: 28px;
  letter-spacing: 0;
}
.top-label {
  position: absolute;
  top: 32px;
  left: 87px;
  width: 258px;
  height: 27px;
  border: 1px solid #797970;
  background: #dad7cc;
  color: #41413a;
  text-align: center;
  font-size: 14px;
  letter-spacing: 3px;
  line-height: 24px;
  transform: rotate(-0.5deg);
}
.section {
  position: absolute;
  left: 42px;
  border: 5px solid #ff984e;
  padding: 12px 12px 8px;
}
.section-one {
  top: 166px;
  width: 325px;
  height: 53px;
}
.section-two {
  top: 274px;
  width: 302px;
  height: 47px;
  padding-top: 10px;
}
.section span {
  display: inline-block;
  color: #d8d8d0;
  background: #353735;
  font-size: 16px;
  letter-spacing: .5px;
  line-height: 19px;
  white-space: nowrap;
}
.focus {
  position: absolute;
  left: 67px;
  top: 224px;
  height: 32px;
  width: 196px;
  padding-left: 16px;
  border-bottom: 6px solid #ff984e;
  font-size: 16px;
  line-height: 25px;
}
.paragraph {
  position: absolute;
  top: 329px;
  left: 47px;
  width: 435px;
  font-size: 16px;
  line-height: 31px;
}
.line {
  height: 31px;
  white-space: nowrap;
  position: relative;
}
.line::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  height: 6px;
  background: #ff984e;
  width: 100%;
}
.line.first { padding-left: 36px; }
.line.first::after { left: 26px; width: 395px; }
.line:nth-child(3)::after { width: 426px; }
.line:nth-child(4)::after { width: 411px; }
.bottom-text {
  position: absolute;
  top: 453px;
  left: 50px;
  font-size: 16px;
  line-height: 31px;
  letter-spacing: 1px;
}
.bottom-text .line { width: 182px; }
.bottom-text .line:first-child { padding-left: 34px; }
.bottom-text .line:first-child::after { left: 29px; width: 152px; }
.bottom-text .line:nth-child(2)::after { width: 185px; }
.bottom-text .line:nth-child(3)::after { width: 179px; }
.bottom-text .line:nth-child(4)::after { width: 55px; }
.placeholder {
  position: absolute;
  left: 269px;
  top: 480px;
  width: 190px;
  height: 220px;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid rgba(70, 70, 60, .35);
  color: #5a5950;
  font-size: 13px;
  text-align: center;
}
.edge-label {
  position: absolute;
  left: 507px;
  top: 185px;
  width: 67px;
  height: 33px;
  border: 3px double #98998f;
  border-radius: 10px;
  background: #343638;
  color: #c7c7bf;
  padding: 7px 4px;
  font-size: 11px;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="page">
  <div class="running-title">实践 Plain reading</div>

  <header class="banner">
    <span class="method">方法40</span>
    <span class="heading">指读 <span class="english">（Pointing Reading）</span></span>
  </header>
  <div class="top-label">用手指来指引读书的方向</div>

  <div class="section section-one"><span>①用手指或是笔尖指着当前读到的位置</span></div>
  <div class="focus">视线聚焦在手指或笔尖。</div>

  <div class="section section-two"><span>②沿着阅读的方向移动手指或笔尖</span></div>

  <div class="paragraph">
    <div class="line first">一边往下读，一边移动手指或笔尖。此时视线依然聚焦在</div>
    <div class="line">手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相</div>
    <div class="line">同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速</div>
    <div class="line">度的制约，但是可以保证不会出现倒退或是看错行的情况。</div>
  </div>

  <div class="bottom-text">
    <div class="line">大家也可以试着将</div>
    <div class="line">这种方式与朗读结合起</div>
    <div class="line">来，将指着的内容出声</div>
    <div class="line">读出来。</div>
  </div>

  <figure class="placeholder">[插图：猫形角色用手指着书本阅读]</figure>
  <div class="edge-label">方法4[?]</div>
</main>
</body>
</html>
