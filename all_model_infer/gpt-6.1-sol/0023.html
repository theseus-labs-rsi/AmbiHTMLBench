<!DOCTYPE html>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f5f3f8;
  color: #49494d;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}
.page {
  position: relative;
  width: 540px;
  height: 722px;
  margin: 0 auto;
  background: #f5f3f8;
}
h1, h2 {
  position: absolute;
  margin: 0;
  width: 430px;
  height: 47px;
  background: #efd4d2;
  color: #090909;
  text-align: center;
  font-size: 23px;
  font-weight: 900;
  line-height: 47px;
  letter-spacing: -1px;
}
h1 { left: 51px; top: 45px; }
h2 { left: 53px; top: 348px; }
.book-row {
  position: absolute;
  left: 53px;
  display: grid;
  grid-template-columns: 154px 275px;
  column-gap: 18px;
  align-items: start;
}
.first { top: 122px; }
.second { top: 436px; }
.placeholder {
  width: 154px;
  height: 204px;
  margin: 0;
  overflow: hidden;
  border: 1px solid #d9d4d0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  font-family: Georgia, "SimSun", serif;
}
.cover-one {
  background: #c84223;
  color: #e6d394;
}
.cover-two {
  background: #b3a16b;

}
.caption {
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 11px;
  line-height: 16px;

}
.cover-title { font-size: 19px; line-height: 24px; }

.cover-small { margin-top: 8px; font-size: 10px; line-height: 14px; }

  font-size: 18px;
  font-weight: 700;
  line-height: 31.3px;
  letter-spacing: 1px;
}
.description p { margin: 0; }

  position: absolute;
  top: 692px;
  left: 158px;
  white-space: nowrap;
  color: #565a6b;
  font-family: "KaiTi", "STKaiti", cursive;
  font-size: 17px;

<body>
<main class="page">
  <h1>《达摩流浪者》</h1>
  <section class="book-row first" aria-label="达摩流浪者">
    <figure class="placeholder cover-one">
      <figcaption class="caption">[书籍封面：左上]</figcaption>
      <div class="cover-title">达摩流浪者</div>
      <div class="cover-english">THE<br>DHARMA<br>BUMS</div>
      <div class="cover-small">JACK KEROUAC<br>[illegible]</div>
    </figure>
    <div class="description">
      <p>评分：8.5</p>
      <p>永远年轻，永远热泪盈眶</p>
      <p>相信每个理想主义的nfper，每个<br>在庸碌生活中迷茫的人，每个还<br>没被社会总开关控制的人，都会<br>被书中纯净又赤诚的灵魂打动。</p>
    </div>
  </section>

  <h2>《深时之旅》</h2>
  <section class="book-row second" aria-label="深时之旅">
    <figure class="placeholder cover-two">
      <figcaption class="caption">[书籍封面：左下]</figcaption>
      <div class="cover-title">深时之旅</div>
      <div class="cover-small">UNDERLAND</div>
      <div style="font-size:13px; line-height:16px;">A Deep Time<br>Journey</div>
      <div class="cover-small">[illegible]</div>
    </figure>
    <div class="description">
      <p>评分：8.7</p>
      <p>地下，有另外一个世界！</p>
      <p>作者以充满灵性的语言，描绘了地<br>下世界一个又一个奇妙的科学现<br>象，神秘的传说和感人的故事。</p>
      <p>天呐！惊叹，将是你的主旋律</p>
    </div>
  </section>
  <footer>分享好书的 <span>Grit</span></footer>
