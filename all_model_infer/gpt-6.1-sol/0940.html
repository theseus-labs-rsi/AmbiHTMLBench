<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #111; }
.document { width: 540px; height: 540px; overflow: hidden; }
.banner {
  height: 86px;
  background: #66817a;
  color: #fff;
  text-align: center;
  border-bottom: 4px solid #faf5f2;
  padding-top: 13px;
}
h1 { margin: 0; font-size: 26px; line-height: 35px; font-weight: 700; letter-spacing: 1px; }
.subtitle { margin-top: 2px; font-size: 15px; line-height: 23px; }
table { width: 540px; border-collapse: collapse; table-layout: fixed; }
col.tool { width: 88px; }
col.use { width: 219px; }
col.advice { width: 138px; }
col.photo { width: 95px; }
th {
  height: 57px;
  padding: 0;
  color: white;
  background: #66817a;
  font-size: 17px;
  font-weight: 700;
  border-right: 4px solid #faf5f2;
  border-bottom: 4px solid #faf5f2;
}
th:last-child { border-right: none; }
td {
  padding: 0;
  text-align: center;
  vertical-align: middle;
  font-size: 15px;
  line-height: 21px;
  border-right: 4px solid #fbf6f3;
  border-bottom: 4px solid #fbf6f3;
}
td:last-child { border-right: none; }
.crochet { height: 137px; }
.yarn { height: 113px; }
.scissors { height: 80px; }
.needle { height: 69px; }
.tool-name { font-weight: 700; font-size: 16px; line-height: 22px; }
.required { color: #d77e65; font-weight: 700; font-size: 15px; line-height: 21px; }
.use-text { padding: 0 9px; }
.placeholder {
  margin-left: auto;
  margin-right: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #777;
  background: #fafafa;
  font-size: 11px;
  line-height: 16px;
  font-weight: normal;
}
.crochet-image { width: 79px; height: 54px; }
.yarn-image { width: 79px; height: 61px; }
.scissors-image { width: 65px; height: 62px; }
.needle-image { width: 80px; height: 65px; }
</style>
</head>
<body>
<main class="document">
<header class="banner">
<h1>钩针工具选择指南</h1>
<div class="subtitle">——only手作集——</div>
</header>
<table aria-label="钩针工具选择指南">
<colgroup>
<col class="tool">
<col class="use">
<col class="advice">
<col class="photo">
</colgroup>
<thead>
<tr>
<th>工具</th>
<th>用途</th>
<th>初学者建议</th>
<th>实物图</th>
</tr>
</thead>
<tbody>
<tr class="crochet">
<td><div class="tool-name">钩针</div><div class="required">（必备）</div></td>
<td class="use-text">钩针是钩针编织的必备工具，<br>有多种尺寸与规格，具体如何<br>选择可参考《钩针毛线对照<br>表》、《如何选择钩针和毛<br>线》</td>
<td>3mm左右的钩针<br>最实用</td>
<td><div class="placeholder crochet-image">[图片：彩色钩针]</div></td>
</tr>
<tr class="yarn">
<td><div class="tool-name">毛线</div><div class="required">（必备）</div></td>
<td class="use-text">毛线种类很多，新手建议选择<br>股数较少的，可减少失误次<br>数。具体如何选择参考《如何<br>选择钩针和毛线》</td>
<td>中粗的宝宝棉/牛<br>奶棉</td>
<td><div class="placeholder yarn-image">[图片：篮装毛线]</div></td>
</tr>
<tr class="scissors">
<td><div class="tool-name">剪刀</div><div class="required">（必备）</div></td>
<td class="use-text">剪断编织过程中的编织线</td>
<td>必备</td>
<td><div class="placeholder scissors-image">[图片：剪刀]</div></td>
</tr>
<tr class="needle">
<td><div class="tool-name">缝合针</div></td>
<td class="use-text">缝合、修补和连接编织面料</td>
<td>非必须</td>
<td><div class="placeholder needle-image">[图片：彩色缝合针]</div></td>
</tr>
</tbody>
</table>
</main>
</body>
</html>
