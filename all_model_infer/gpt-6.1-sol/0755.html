<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐诗六首</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f3cc8d;
  color: #111;
  padding: 23px 24px;
}
.page {
  width: 492px;
  height: 677px;
  display: grid;
  grid-template-columns: 246px 246px;
  grid-template-rows: 239px 232px 206px;
  background-color: #fff;
  background-image:
    linear-gradient(to right, rgba(165,176,183,.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(165,176,183,.13) 1px, transparent 1px);
  background-size: 12.5px 12.5px;
  box-shadow: 4px 4px 0 rgba(192,142,73,.20);
}
.poem {
  position: relative;
  overflow: hidden;
}
.poem:nth-child(odd) { border-right: 5px solid #e5aa85; }
.poem:nth-child(-n+4) { border-bottom: 5px solid #e5aa85; }
h1 {
  margin: 10px 0 0;
  text-align: center;
  white-space: nowrap;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif CJK SC", serif;
  font-size: 34px;
  font-weight: 900;
  line-height: 46px;
  letter-spacing: 1px;
}
.author {
  margin: 0 5px 0 0;
  text-align: right;
  white-space: nowrap;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
  font-size: 22px;
  line-height: 32px;
  letter-spacing: 1px;
}
.verse {
  margin: 10px 0 0 43px;
  font-family: "STSong", "SimSun", "Noto Serif CJK SC", serif;
  font-size: 26px;
  font-weight: 400;
  line-height: 32px;
  letter-spacing: 2px;
  white-space: nowrap;
}
.poem:nth-child(even) .verse { margin-left: 49px; }
.middle h1 { margin-top: 6px; }
.middle .author { margin-top: 1px; }
.middle .verse { margin-top: 10px; }
.bottom h1 {
  margin-top: 3px;
  font-size: 32px;
  line-height: 38px;
}
.bottom .author { line-height: 29px; }
.bottom .verse { margin-top: 2px; }
.bottom:nth-child(even) .verse { margin-left: 61px; }
.bottom:nth-child(even) .author {
  margin-right: 0;
  font-size: 20px;
  letter-spacing: 0;
}
</style>
</head>
<body>
<main class="page">
  <section class="poem">
    <h1>《登鹳雀楼》</h1>
    <div class="author">（唐－王之涣）</div>
    <div class="verse">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</div>
  </section>
  <section class="poem">
    <h1>《静夜思》</h1>
    <div class="author">（唐－李白）</div>
    <div class="verse">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</div>
  </section>
  <section class="poem middle">
    <h1>《古朗月行》</h1>
    <div class="author">（唐－李白）</div>
    <div class="verse">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</div>
  </section>
  <section class="poem middle">
    <h1>《寻隐者不遇》</h1>
    <div class="author">（唐－贾岛）</div>
    <div class="verse">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</div>
  </section>
  <section class="poem bottom">
    <h1>《咏鹅》</h1>
    <div class="author">（唐－骆宾王）</div>
    <div class="verse">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</div>
  </section>
  <section class="poem bottom">
    <h1>《草》</h1>
    <div class="author">（唐－白居易）</div>
    <div class="verse">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</div>
  </section>
</main>
</body>
</html>
