  <h1 class="title">瑞吉欧Reggio</h1>

  <div class="line" style="top:138px"><span class="band"><span class="dot"></span>基于皮亚杰和维果斯基等心理学家的</span></div>
  <div class="line" style="top:180px"><span class="band">建构主义心理学。</span></div>
  <svg class="mark" style="left:178px;top:206px;width:98px" viewBox="0 0 98 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L98 4"/></svg>

  <div class="line" style="top:222px"><span class="band"><span class="dot"></span>走进儿童心灵的儿童观，以孩子的思维、</span></div>
  <svg class="mark" style="left:92px;top:250px;width:126px" viewBox="0 0 126 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L96 4 L102 8 L108 4 L114 8 L120 4 L126 8"/></svg>
  <div class="line" style="top:264px"><span class="band">孩子的立场来看待一场</span></div>
  <div class="line" style="top:306px"><span class="band">不压制孩子，让其充分表现潜能</span></div>

  <div class="line" style="top:348px"><span class="band"><span class="dot"></span>弹性课程，从儿童的兴趣和需要出发</span></div>
  <svg class="mark" style="left:232px;top:372px;width:190px" viewBox="0 0 190 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L96 4 L102 8 L108 4 L114 8 L120 4 L126 8 L132 4 L138 8 L144 4 L150 8 L156 4 L162 8 L168 4 L174 8 L180 4 L186 8 L190 4"/></svg>
  <div class="line" style="top:390px"><span class="band">不让孩子生活在成人的包围之中。</span></div>

  <div class="line" style="top:432px"><span class="band"><span class="dot"></span>教师必须尽可能地减少介入，更不可过度介入。</span></div>
  <svg class="mark" style="left:219px;top:460px;width:98px" viewBox="0 0 98 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L98 4"/></svg>
  <div class="line" style="top:474px"><span class="band">与其牵着儿童的手，不如让他们用自己的双脚站立。</span></div>

  <div class="line" style="top:516px"><span class="band"><span class="dot"></span>儿童的自我表达和相互交流特别重要，是儿童探索、</span></div>
  <svg class="mark" style="left:80px;top:548px;width:215px" viewBox="0 0 215 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L96 4 L102 8 L108 4 L114 8 L120 4 L126 8 L132 4 L138 8 L144 4 L150 8 L156 4 L162 8 L168 4 L174 8 L180 4 L186 8 L192 4 L198 8 L204 4 L210 8 L215 4"/></svg>
  <div class="line" style="top:558px"><span class="band">研究、解决问题过程中的基本活动。</span></div>

  <div class="line" style="top:600px"><span class="band"><span class="dot"></span>在共同分享中，每个人均可提出最好的想法，</span></div>
  <svg class="mark" style="left:76px;top:629px;width:97px" viewBox="0 0 97 12" aria-hidden="true"><path d="M0 4 L6 8 L12 4 L18 8 L24 4 L30 8 L36 4 L42 8 L48 4 L54 8 L60 4 L66 8 L72 4 L78 8 L84 4 L90 8 L97 4"/></svg>
  <div class="line" style="top:642px"><span class="band">提升和加强团队间意见交流、</span></div>
  <div class="line" style="top:685px"><span class="band">并刺激新奇或出乎意料的事情发生。</span></div>
