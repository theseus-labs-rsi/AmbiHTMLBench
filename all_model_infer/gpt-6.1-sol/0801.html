<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我想所谓孤独</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #2b203e; }
.page {
  position: relative;
  width: 540px;
  height: 717px;
  margin: 0 auto;
  overflow: hidden;
  background: #2b203e;
  color: #b8a779;
}
.placeholder { position: absolute; }
.emblem {
  top: 131px;
  left: 190px;
  width: 160px;
  height: 160px;
}
.emblem .halo {
  position: absolute;
  left: 8px;
  top: 2px;
  width: 144px;
  height: 144px;
  border: 1px solid #a99971;
  border-radius: 50%;
  background: repeating-conic-gradient(from -5deg, #b8a779 0deg 14deg, #665846 14deg 15deg);
  clip-path: inset(0 0 48% 0);
}
.diamond {
  position: absolute;
  width: 113px;
  height: 113px;
  top: 23px;
  left: 24px;
  background: #2b203e;
  border: 2px solid #b8a779;
  transform: rotate(45deg);
}
.diamond::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid #b8a779;
}
.symbol-circle {
  position: absolute;
  left: 59px;
  top: 50px;
  width: 43px;
  height: 43px;
  border: 2px solid #b8a779;
  border-radius: 50%;
}
.symbol-stem {
  position: absolute;
  width: 2px;
  height: 25px;
  background: #b8a779;
  left: 79px;
  top: 91px;
}
.symbol-cross {
  position: absolute;
  width: 23px;
  height: 2px;
  background: #b8a779;
  left: 69px;
  top: 103px;
}
.caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.english {
  position: absolute;
  top: 330px;
  left: 75px;
  width: 404px;
  margin: 0;
  text-align: center;
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  font-weight: 300;
  line-height: 21px;
  letter-spacing: -0.25px;
}
.star {
  top: 328px;
  width: 24px;
  height: 27px;
  background: #b8a779;
  clip-path: polygon(50% 0%, 62% 32%, 100% 50%, 62% 64%, 50% 100%, 38% 64%, 0% 50%, 38% 32%);
}
.star-left { left: 42px; }
.star-right { left: 480px; }
.chinese {
  position: absolute;
  top: 397px;
  left: 105px;
  width: 340px;
  margin: 0;
  text-align: center;
  font-family: "Noto Serif CJK SC", "Songti SC", SimSun, serif;
  font-size: 23px;
  font-weight: 700;
  line-height: 29px;
  letter-spacing: 2px;
}
@media (max-width: 539px) {
  .page { margin-left: calc((100vw - 540px) / 2); }
}
</style>
</head>
<body>
<main class="page">
  <div class="placeholder emblem" role="img" aria-label="Gold geometric emblem with a female symbol, centered above the quotation">
    <div class="halo"></div>
    <div class="diamond"></div>
    <div class="symbol-circle"></div>
    <div class="symbol-stem"></div>
    <div class="symbol-cross"></div>
    <span class="caption">[Diagram: centered geometric emblem with female symbol]</span>
  </div>
  <div class="placeholder star star-left" role="img" aria-label="Gold four-point star to the left of the English quotation"><span class="caption">[Decoration: left star]</span></div>
  <p class="english">I think the so-called loneliness refers to the person you are facing,<br>whose emotions are not on the same frequency as your own.</p>
  <div class="placeholder star star-right" role="img" aria-label="Gold four-point star to the right of the English quotation"><span class="caption">[Decoration: right star]</span></div>
  <p class="chinese">“&nbsp; 我想所谓孤独，<br>就是你面对的那个人，<br>他的情绪和你自己的情绪，<br>不在同一个频率。&nbsp; ”</p>
</main>
</body>
</html>
