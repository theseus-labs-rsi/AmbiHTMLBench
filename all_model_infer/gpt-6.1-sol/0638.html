<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f8f7ed;
  color: #aaa58c;
  font-family: "Songti SC", SimSun, serif;
}
.page {
  position: relative;
  width: 540px;
  height: 769px;
  margin: 0 auto;
  background: #f9f8ef;
}
.navigation {
  display: grid;
  grid-template-columns: 44px 25px 51px 51px 57px 51px 79px 79px 58px 45px;
  height: 24px;
  align-items: center;
  background: #c6b599;
  border-bottom: 1px solid #b3a58c;
  color: #8f826b;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
}
.navigation .selected {
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px solid #a79a82;
  border-right: 1px solid #a79a82;
}
h1 {
  height: 41px;
  margin: 0;
  padding: 12px 8px 0;
  font-size: 15px;
  font-weight: normal;
  letter-spacing: 5px;
}
.sheet {
  width: 526px;
  margin-left: 7px;
  border: 1px solid #d2d1bf;
  font-size: 10px;
  letter-spacing: 2px;
}
.field {
  height: 30px;
  display: flex;
  align-items: center;
  padding-left: 10px;
  border-bottom: 1px solid #d2d1bf;
  background: rgba(211, 211, 190, .16);
}
.field:first-child { height: 31px; padding-left: 20px; }
.commentary {
  display: grid;
  grid-template-columns: 59px 1fr;
  height: 111px;
  border-bottom: 1px solid #d2d1bf;
}
.choices {
  margin: 0;
  padding: 7px 0 0 6px;
  list-style: none;
  border-right: 1px solid #d2d1bf;
}
.choices li {
  height: 24px;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.circle {
  display: inline-block;
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  border: 1px solid #d7d6c5;
  border-radius: 50%;
}
.analysis {
  display: grid;
  grid-template-columns: 297px 1fr;
  height: 223px;
  border-bottom: 1px solid #d2d1bf;
}
.analysis-left { border-right: 1px solid #d2d1bf; }
.analysis-heading {
  height: 30px;
  border-bottom: 1px solid #d2d1bf;
  background: rgba(211, 211, 190, .16);
  display: flex;
  align-items: center;
  justify-content: center;
}
.analysis-left .analysis-heading {
  justify-content: space-around;
}
.analysis-heading span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.transfer {
  display: grid;
  grid-template-columns: 59px 1fr;
  border-bottom: 1px solid #d2d1bf;
}
.transfer.sentence { height: 90px; }
.transfer.method { height: 81px; }
.transfer-label {
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid #d2d1bf;
  background: rgba(211, 211, 190, .16);
  white-space: nowrap;
}
.notes {
  height: 30px;
  display: flex;
  align-items: center;
  padding-left: 17px;
  background: rgba(211, 211, 190, .16);
}
.placeholder {
  position: absolute;
  right: 6px;
  bottom: 4px;
  width: 75px;
  height: 23px;
  color: #d6d5ca;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>
<main class="page">
  <nav class="navigation" aria-label="栏目">
    <span>行测</span>
    <span>&gt;</span>
    <span>常识</span>
    <span>言语</span>
    <span>数量</span>
    <span>判断</span>
    <span>资料</span>
    <span class="selected">申论</span>
    <span>联考</span>
    <span>计划</span>
  </nav>
  <h1>· 晨读笔记</h1>
  <section class="sheet">
    <div class="field">主题</div>
    <div class="field">应用领域</div>
    <div class="field">热门事件</div>
    <div class="field">宏观政策</div>
    <div class="field">媒体评论</div>
    <div class="commentary">
      <ul class="choices">
        <li><span class="circle"></span>意义</li>
        <li><span class="circle"></span>原因</li>
        <li><span class="circle"></span>问题</li>
        <li><span class="circle"></span>危害</li>
      </ul>
      <div></div>
    </div>
    <div class="analysis">
      <div class="analysis-left">
        <div class="analysis-heading">
          <span><i class="circle"></i>问题分析</span>
          <span><i class="circle"></i>原因分析</span>
        </div>
      </div>
      <div>
        <div class="analysis-heading">对策分析</div>
      </div>
    </div>
    <div class="transfer sentence">
      <div class="transfer-label">句子迁移</div>
      <div></div>
    </div>
    <div class="transfer method">
      <div class="transfer-label">方法迁移</div>
      <div></div>
    </div>
    <div class="notes">备注</div>
  </section>
  <div class="placeholder">[标志：粉笔]</div>
</main>
</body>
</html>
