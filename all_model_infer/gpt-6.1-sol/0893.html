<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #10182c;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}
.page {
  position: relative;
  width: 540px;
  height: 722px;
  margin: 0 auto;
  overflow: hidden;
  color: #eeeef2;
  background: linear-gradient(180deg, #385588 0%, #294779 25%, #183c79 57%, #0c245b 84%, #0b0c14 100%);
}
.placeholder {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 722px;
  background: radial-gradient(ellipse at 43% 8%, rgba(143,161,207,.22), transparent 49%);
}
.placeholder span {
  position: absolute;
  top: 12px;
  left: 18px;
  font-size: 11px;
  color: rgba(235,239,249,.35);
}
h1 {
  position: absolute;
  top: 137px;
  left: 25px;
  width: 495px;
  margin: 0;
  padding: 0 0 1px;
  border-bottom: 3px solid #eeeef2;
  font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
  font-size: 45px;
  font-weight: normal;
  line-height: 1.08;
  white-space: nowrap;
}
table {
  position: absolute;
  top: 222px;
  left: 18px;
  width: 495px;
  height: 435px;
  border-collapse: collapse;
  table-layout: fixed;
  color: #bfc7da;
  font-size: 16px;
  font-weight: 300;
}
col.question { width: 315px; }
col.answer { width: 178px; }
td, th {
  border: 1px solid #d7dbea;
  padding: 0 6px;
  font-weight: normal;
  vertical-align: middle;
}
th { text-align: center; }
td.answer { text-align: center; }
td.question {
  font-size: 15px;
  white-space: nowrap;
}
td.note {
  text-align: right;
  padding-right: 8px;
  font-size: 15px;
  white-space: nowrap;
}
.header { height: 35px; }
.row { height: 53px; }
.note-row { height: 42px; }
.fact-row { height: 39px; }
.last-row { height: 54px; }
</style>
</head>
<body>
<main class="page">
  <div class="placeholder" role="img" aria-label="蓝色调全页背景照片">
    <span>[照片：全页背景]</span>
  </div>
  <h1>富人眼中的富人是咋样？</h1>
  <table aria-label="富人调查问题与回答">
    <colgroup>
      <col class="question">
      <col class="answer">
    </colgroup>
    <tbody>
      <tr class="header">
        <th>问题</th>
        <th>回答</th>
      </tr>
      <tr class="row">
        <td class="question">1.您觉得高净值人群资产拥有多少钱才算是?</td>
        <td class="answer">1177.388.4万元</td>
      </tr>
      <tr class="note-row">
        <td class="note" colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr class="row">
        <td class="question">2.请问您每天工作小时数是?</td>
        <td class="answer">8.2小时</td>
      </tr>
      <tr class="row">
        <td class="question">3.您预计退休年龄?</td>
        <td class="answer">59岁</td>
      </tr>
      <tr class="row">
        <td class="question">4.您希望能活到多少岁?</td>
        <td class="answer">88.2岁</td>
      </tr>
      <tr class="fact-row">
        <td class="note" colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr class="row">
        <td class="question">5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="answer">6.2个国家</td>
      </tr>
      <tr class="last-row">
        <td class="question">6.请问您平均每月阅读书籍数量</td>
        <td class="answer">2.4本书</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
