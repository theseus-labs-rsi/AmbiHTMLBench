<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期末质量分析会</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #eeeae5; }
.page {
  position: relative;
  width: 540px;
  height: 540px;
  overflow: hidden;
  color: #073d71;
  font-family: "SimSun", "Songti SC", serif;
  background:
    radial-gradient(ellipse at 4% 38%, rgba(155,217,202,.45), transparent 34%),
    radial-gradient(ellipse at 97% 47%, rgba(149,215,201,.48), transparent 30%),
    repeating-linear-gradient(0deg, rgba(180,172,158,.025) 0px, rgba(180,172,158,.025) 1px, transparent 1px, transparent 4px),
    #f4f1ed;
}
.placeholder {
  position: absolute;
  color: #588779;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.leaves { top: 0; right: 0; width: 166px; height: 112px; }
.botanical { left: 0; top: 222px; width: 185px; height: 122px; }
.term {
  position: absolute;
  top: 56px;
  left: 143px;
  font-size: 21px;
  line-height: 27px;
  white-space: nowrap;
}
.headline {
  position: absolute;
  top: 96px;
  left: 57px;
  margin: 0;
  font-family: "SimHei", "Microsoft YaHei", sans-serif;
  font-size: 29px;
  font-weight: 700;
  line-height: 35px;
  white-space: nowrap;
}
.subtitle {
  position: absolute;
  top: 142px;
  left: 122px;
  color: #ed080b;
  font-family: "SimHei", "Microsoft YaHei", sans-serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 31px;
  white-space: nowrap;
}
.school {
  position: absolute;
  top: 188px;
  width: 100%;
  text-align: center;
  font-size: 16px;
}
.presenter {
  position: absolute;
  top: 224px;
  width: 100%;
  text-align: center;
  font-size: 16px;
}
.watermark {
  position: absolute;
  z-index: 3;
  font-family: "Microsoft YaHei", sans-serif;
  font-weight: bold;
  color: white;
  text-shadow: -1px -1px 0 #111, 1px -1px 0 #111, -1px 1px 0 #111, 1px 1px 0 #111;
  white-space: nowrap;
}
.watermark.top { top: 53px; left: 300px; font-size: 17px; transform: rotate(38deg); }
.watermark.middle { top: 151px; left: 129px; font-size: 16px; }
.section-band {
  position: absolute;
  top: 293px;
  left: 0;
  height: 28px;
  width: 540px;
  background: rgba(244,241,237,.8);
}
.section-title {
  position: absolute;
  top: 288px;
  left: 56px;
  color: #172416;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 3px;
  white-space: nowrap;
}
.watermark.section { top: 292px; left: 192px; font-size: 13px; }
.columns {
  position: absolute;
  top: 361px;
  left: 34px;
  width: 471px;
  display: grid;
  grid-template-columns: repeat(4, 110px);
  gap: 9px;
}
.column { position: relative; }
.label {
  position: relative;
  width: 105px;
  height: 33px;
  background: #008e8e;
  color: #f1f5e8;
  font-size: 14px;
  text-align: center;
  line-height: 33px;
  white-space: nowrap;
}
.column:not(:last-child) .label::after {
  content: "";
  position: absolute;
  left: 104px;
  top: 2px;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  border-left: 12px solid #008e8e;
}
.column:nth-child(2) .label,
.column:nth-child(3) .label,
.column:nth-child(4) .label { margin-top: 2px; }
.text-box {
  position: relative;
  margin-top: 35px;
  width: 110px;
  min-height: 94px;
  border: 2px solid #00938d;
  border-radius: 16px;
  padding: 5px 5px 4px;
  color: #242823;
  font-size: 14px;
  line-height: 16px;
}
.text-box::before {
  content: "";
  position: absolute;
  top: -16px;
  left: 23px;
  width: 23px;
  height: 23px;
  border-top: 2px solid #00938d;
  border-left: 2px solid #00938d;
  background: #f4f1ed;
  transform: rotate(45deg) skew(8deg, 8deg);
}
.text-box p { position: relative; margin: 0; }
.column:nth-child(1) .text-box { margin-top: 37px; }
.column:nth-child(2) .text-box { padding-top: 8px; }
.column:nth-child(3) .text-box { padding-top: 8px; }
.column:nth-child(4) .text-box { margin-left: 1px; padding-top: 12px; }
.column:nth-child(4) .text-box::before { left: 62px; }
</style>
</head>
<body>
<main class="page">
  <div class="placeholder leaves">[装饰图：右上方绿叶]</div>
  <div class="placeholder botanical">[装饰图：左侧植物与小鸟]</div>

  <div class="term">2022---2023学年第二学期</div>
  <div class="watermark top">@海淀小萌</div>
  <h1 class="headline">追光而遇有思　沐光而行致远</h1>
  <div class="subtitle">小学[illegible]期末质量分析会</div>
  <div class="watermark middle">@海淀小萌</div>
  <div class="school">红薯街道实验XXX</div>
  <div class="presenter">海淀小萌</div>

  <div class="section-band"></div>
  <div class="section-title">期末考试成绩</div>
  <div class="watermark section">@海淀小萌</div>

  <section class="columns">
    <div class="column">
      <div class="label">注重基础和积累</div>
      <div class="text-box">
        <p>尤其是古诗文和<br>名言警句积累占<br>的比例很大，反<br>映了对传统文化<br>的重视。</p>
      </div>
    </div>
    <div class="column">
      <div class="label">重视运用</div>
      <div class="text-box">
        <p>突出能力，重视<br>运用。阅读题体<br>现了核心素养中<br>重视思维发展与<br>提升的要求。</p>
      </div>
    </div>
    <div class="column">
      <div class="label">联系生活原则</div>
      <div class="text-box">
        <p>写作的安排正是<br>学生生活中外出<br>的经历，易于选<br>材，适合个性发<br>展。</p>
      </div>
    </div>
    <div class="column">
      <div class="label">难易程度适中</div>
      <div class="text-box">
        <p>只要认真积累和<br>复习的孩子基本<br>上可以取得不错<br>的成绩。</p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
