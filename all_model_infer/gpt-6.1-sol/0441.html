<style>

<main class="page">
<header class="header">
<div class="banner"></div>
<div class="placeholder deer">[插图：鹿与水波，左上]</div>
<h1>家长需要关注什么</h1>
<div class="subtitle">[?] · 书 · 肆</div>
<div class="placeholder stamp">[印章]</div>
</header>

<section class="panel">
<div class="section s1">
<div class="label">壹</div>
<p>看单科成绩<br>分析优势与劣势科目</p>
</div>
<div class="section s2">
<div class="label">贰</div>
<p>看进步<br>横向整体水平<br>纵向看进退情况</p>
</div>
<div class="section s3">
<div class="label">叁</div>
<p>分析错题</p>
</div>
<div class="emblem">
<div class="placeholder">[圆形装饰图案]</div>
<div class="vertical">成绩怎么看</div>
</div>
<div class="section s4">
<div class="label">肆</div>
<p>分析[?]错：<br>是遗憾丢分？是模糊丢分？<br>是不会做丢分？<br><span class="strategy">策略：</span>消除遗憾、纠正模<br>糊，力争突破</p>
</div>
<div class="section s5">
<div class="label">伍</div>
<p>分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</p>
</div>
<div class="placeholder corner-stamp">[印章]</div>
</section>

<div class="divider"></div>

<section class="panel bottom">
<div class="section b1">
<div class="label">壹</div>
<p>不要过度焦虑</p>
</div>
<div class="section b2">
<div class="label">贰</div>
<p>不要过度关注孩子</p>
</div>
<div class="section b3">
<div class="label">叁</div>
<p>不要给孩子过高的期望</p>
</div>
<div class="emblem">
<div class="placeholder">[圆形装饰图案]</div>
<div class="vertical">家长五不要</div>
</div>
<div class="section b4">
<div class="label">肆</div>
<p>不要过度唠叨</p>
</div>
<div class="section b5">
<div class="label">伍</div>
<p>不要盲目攀比和迷信</p>
</div>
<div class="placeholder corner-stamp">[印章]</div>
</section>
</main>
