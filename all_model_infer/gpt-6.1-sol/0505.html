<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif; }
.poster {
  position: relative;
  width: 1152px;
  height: 2048px;
  overflow: hidden;
  background: white;
}
.heading-zone {
  position: absolute;
  top: 118px;
  left: 82px;
  display: flex;
  align-items: flex-start;
  gap: 19px;
}
.roles {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.role {
  width: 96px;
  height: 96px;
  border: 2px solid #171717;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 63px;
  line-height: 1;
}
.main-title {
  display: flex;
  flex-direction: column;
  width: 151px;
  font-size: 149px;
  line-height: 153px;
  font-weight: 400;
}
.main-title span { display: block; height: 153px; }
.main-title .red { color: #d21422; }
.exhibition {
  position: absolute;
  top: 858px;
  left: 109px;
  font-size: 39px;
  line-height: 39px;
  writing-mode: vertical-rl;
}
.brand {
  position: absolute;
  top: 199px;
  right: 71px;
  width: 84px;
  text-align: right;
  font-family: "Times New Roman", serif;
  font-size: 33px;
  line-height: 43px;
}
.placeholder { position: absolute; margin: 0; overflow: hidden; }
.placeholder figcaption {
  position: absolute;
  font: 12px Arial, sans-serif;
  color: #666;
  background: rgba(255,255,255,.8);
  padding: 3px 5px;
}
.brand-mark {
  top: 119px;
  left: 1013px;
  width: 60px;
  height: 61px;
}
.diamonds {
  display: grid;
  grid-template-columns: repeat(3, 14px);
  gap: 6px;
  padding: 3px;
}
.diamonds i { width: 14px; height: 14px; background: #ce1024; transform: rotate(45deg); }
.brand-mark figcaption { font-size: 6px; bottom: 0; padding: 0; }
.artwork {
  left: 598px;
  top: 298px;
  width: 554px;
  height: 1328px;
}
.artwork .pink-corner {
  position: absolute;
  top: 0;
  right: 0;
  width: 77px;
  height: 151px;
  background: #e5007e;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}
.artwork .black-shape {
  position: absolute;
  left: 122px;
  top: 136px;
  width: 432px;
  height: 619px;
  background: #080808;
  clip-path: polygon(100% 0, 100% 55%, 79% 39%, 60% 53%, 41% 38%, 41% 100%, 0 71%);
}
.artwork .face {
  position: absolute;
  top: 374px;
  left: 297px;
  width: 257px;
  height: 531px;
  background: linear-gradient(to bottom, #e5749b 0%, #f1b1c7 24%, #fff 55%);
  clip-path: polygon(0 0, 33% 17%, 64% 0, 100% 17%, 100% 100%, 0 100%);
}
.artwork .pink-circle {
  position: absolute;
  top: 213px;
  left: 111px;
  width: 154px;
  height: 154px;
  border-radius: 50%;
  background: #d45c85;
}
.artwork .red-circle {
  position: absolute;
  top: 494px;
  left: 0;
  width: 154px;
  height: 154px;
  border-radius: 50%;
  background: #d0101a;
}
.artwork .pink-triangle {
  position: absolute;
  top: 575px;
  left: 326px;
  width: 107px;
  height: 52px;
  background: #d77397;
  clip-path: polygon(0 0, 100% 0, 48% 100%);
}
.artwork .black-triangle {
  position: absolute;
  top: 600px;
  left: 380px;
  width: 34px;
  height: 39px;
  background: #080808;
  clip-path: polygon(0 0, 100% 15%, 86% 100%);
}
.artwork .lower-triangle {
  position: absolute;
  top: 808px;
  right: 0;
  width: 48px;
  height: 47px;
  background: #d77397;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.artwork .red-bar {
  position: absolute;
  top: 753px;
  left: 237px;
  width: 59px;
  height: 575px;
  background: #d0101a;
}
.artwork figcaption { right: 8px; bottom: 10px; }
.details {
  position: absolute;
  left: 79px;
  top: 1363px;
  z-index: 2;
}
.detail-line {
  font-size: 45px;
  line-height: 58px;
  white-space: nowrap;
  margin-bottom: 20px;
}
.date-label {
  margin-top: 22px;
  font-family: "Times New Roman", serif;
  font-size: 18px;
  line-height: 21px;
}
.dates {
  display: flex;
  align-items: baseline;
  height: 99px;
  font-family: "Times New Roman", serif;
  white-space: nowrap;
}
.date-number { font-size: 82px; line-height: 90px; }
.weekday { font-size: 30px; margin-left: 13px; }
.separator {
  display: inline-block;
  width: 74px;
  height: 53px;
  margin: 0 8px 0 5px;
  position: relative;
}
.separator::before {
  content: "";
  position: absolute;
  width: 76px;
  height: 1px;
  background: #555;
  transform: rotate(-45deg);
  left: 10px;
  top: 18px;
}
.phone {
  margin-top: 13px;
  font-size: 43px;
  line-height: 60px;
  white-space: nowrap;
}
.phone .number {
  font-family: "Times New Roman", serif;
  font-size: 50px;
  margin-left: 15px;
}
.seal {
  top: 1430px;
  left: 675px;
  width: 49px;
  height: 49px;
  border-radius: 50%;
  background: radial-gradient(circle at 65% 67%, #ed7770, #d12026 70%, #fff 76%);
}
.seal figcaption { bottom: 12px; font-size: 7px; background: transparent; color: #862020; }
.landscape {
  left: 0;
  top: 1450px;
  width: 1152px;
  height: 598px;
  background: linear-gradient(to bottom, transparent 75%, #eee 93%, #fff 100%);
}
.landscape figcaption { bottom: 12px; left: 430px; }
@media (max-width: 1152px) {
  body { width: 100%; overflow-x: auto; }
}
</style>
</head>
<body>
<main class="poster">
  <header class="heading-zone">
    <div class="roles" aria-label="生旦净末丑">
      <span class="role">生</span>
      <span class="role">旦</span>
      <span class="role">净</span>
      <span class="role">末</span>
      <span class="role">丑</span>
    </div>
    <div class="main-title">
      <span class="red">京</span>
      <span class="red">剧</span>
      <span>艺</span>
      <span>术</span>
      <span>节</span>
    </div>
  </header>

  <div class="exhibition">稿定艺术展</div>

  <figure class="placeholder brand-mark" aria-label="Red nine-diamond logo">
    <div class="diamonds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <figcaption>[Logo]</figcaption>
  </figure>
  <div class="brand">Gao<br>Ding<br>Yi<br>Shu</div>

  <figure class="placeholder artwork" aria-label="Geometric opera-face artwork on the right">
    <div class="pink-corner"></div>
    <div class="black-shape"></div>
    <div class="face"></div>
    <div class="pink-circle"></div>
    <div class="red-circle"></div>
    <div class="pink-triangle"></div>
    <div class="black-triangle"></div>
    <div class="lower-triangle"></div>
    <div class="red-bar"></div>
    <figcaption>[Artwork: geometric opera face, right]</figcaption>
  </figure>

  <section class="details">
    <div class="detail-line">主办方：稿定集团</div>
    <div class="detail-line">地点：厦门市稿定剧院</div>
    <div class="date-label">DATE.</div>
    <div class="dates">
      <span class="date-number">12.20</span>
      <span class="weekday">SUN</span>
      <span class="separator" aria-hidden="true"></span>
      <span class="date-number">12.30</span>
      <span class="weekday">SAT</span>
    </div>
    <div class="phone">联系电话：<span class="number">0592-8888888</span></div>
  </section>

  <figure class="placeholder seal" aria-label="Small red circular mark">
    <figcaption>[Red mark]</figcaption>
  </figure>

  <figure class="placeholder landscape" aria-label="Ink landscape with misty mountains, birds, and two bare trees along the bottom">
    <figcaption>[Ink landscape: mountains, birds, and trees along the bottom]</figcaption>
  </figure>
</main>
</body>
</html>
