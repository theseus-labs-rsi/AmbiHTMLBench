<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二、建议、提案</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #e9e7dc;
  font-family: KaiTi, STKaiti, "楷体", "Kaiti SC", serif;
}
.page {
  position: relative;
  width: 540px;
  height: 717px;
  margin: 0 auto;
  overflow: hidden;
  background: #efede2;
  color: #151513;
  font-size: 20px;
  font-weight: 600;
}
.paper {
  position: absolute;
  inset: 0 29px 0 0;
  border-right: 2px solid #b7b5a7;
  box-shadow: 3px 0 5px #aaa99c;
}
h1 {
  position: absolute;
  top: 16px;
  left: 20px;
  width: 472px;
  margin: 0;
  color: #a52a27;
  text-align: center;
  font-size: 22px;
  line-height: 30px;
  letter-spacing: 1px;
}
.introduction {
  position: absolute;
  top: 48px;
  left: 21px;
  width: 477px;
  line-height: 32px;
  letter-spacing: 1px;
}
.line { display: block; white-space: nowrap; }
.format {
  position: absolute;
  top: 177px;
  left: 21px;
  color: #ad672c;
  line-height: 28px;
}
.example-title {
  position: absolute;
  top: 207px;
  left: 21px;
  width: 474px;
  text-align: center;
  line-height: 32px;
}
.example-subtitle {
  position: absolute;
  top: 239px;
  left: 21px;
  width: 474px;
  text-align: center;
  line-height: 32px;
  letter-spacing: 1px;
}
.example-body {
  position: absolute;
  top: 271px;
  left: 21px;
  width: 473px;
  line-height: 32px;
  letter-spacing: .8px;
}
.underlined {
  text-decoration: underline;
  text-decoration-color: #73756d;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}
.indent { padding-left: 40px; }
.blue { color: #467fa1; }
.items {
  position: absolute;
  top: 399px;
  left: 21px;
  width: 473px;
  margin: 0;
  padding: 0;
  list-style: none;
  line-height: 32px;
  letter-spacing: .8px;
}
.signature {
  position: absolute;
  top: 524px;
  right: 48px;
  text-align: right;
  line-height: 32px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<main class="page">
  <div class="paper" aria-hidden="true"></div>

  <h1>二、建议、提案</h1>

  <div class="introduction">
    <span class="line">建议是指下级部门因某个重要事项的解决，需要向上</span>
    <span class="line">级提出解决问题想法的文体。具体写作技巧包括以下几</span>
    <span class="line">个方面。提案一般为政协提案，具体格式见示例。</span>
  </div>

  <div class="format">格式：</div>

  <div class="example-title">关于 xxxx 的建议</div>
  <div class="example-subtitle">（“发文机关+关于+内容+文种”）</div>

  <div class="example-body">
    <span class="line underlined">各级领导(称谓要根据具体题目要求分析得出)：</span>
    <span class="line indent"><span class="underlined">当前，...等问题比较突出(或做了什么工作)，为了</span></span>
    <span class="line underlined">做好工作，提出以下建议：<span class="blue">(开头为背景分析，指出存</span></span>
    <span class="line blue underlined">在的主要问题和目的意义)</span>
  </div>

  <ul class="items">
    <li class="indent"><span class="underlined">一、....</span></li>
    <li class="indent"><span class="underlined">二、....</span></li>
    <li>
      <span class="line indent"><span class="underlined">三、....<span class="blue">(主体内容还原为对策题提出解决问题的措</span></span></span>
      <span class="line blue underlined">施)</span>
    </li>
  </ul>

  <div class="signature">
    <span class="underlined">发文机关</span><br>
    <span class="underlined">xx 年 xx 月 xX 日</span>
  </div>
</main>
</body>
</html>
