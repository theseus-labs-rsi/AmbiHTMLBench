<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬息之間 — 藝術攝影展</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #cecece; }
body { font-family: Arial, "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; color: #000; }
.poster {
  position: relative;
  width: 1080px;
  height: 1439px;
  margin: 0 auto;
  overflow: hidden;
  background: #cecece;
}
.header {
  position: absolute;
  top: 25px;
  left: 29px;
  right: 29px;
  display: grid;
  grid-template-columns: 235px 1fr 35px;
  align-items: start;
}
.header-chinese {
  font-size: 64px;
  font-weight: 900;
  line-height: 1.12;
  letter-spacing: -4px;
}
.header-english {
  font-size: 50px;
  line-height: .95;
  font-weight: 750;
  letter-spacing: -1.6px;
}
.vertical-title {
  writing-mode: vertical-rl;
  font-size: 34px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -2px;
  padding-top: 5px;
}
.rule {
  position: absolute;
  left: 30px;
  width: 1020px;
  height: 5px;
  background: #000;
}
.rule-top { top: 334px; }
.rule-bottom { top: 1037px; }
.exhibition {
  position: absolute;
  left: 24px;
  top: 379px;
  width: 1032px;
  height: 625px;
  display: grid;
  grid-template-columns: 565px 467px;
  grid-template-rows: 300px 325px;
}
.title-first {
  font-size: 275px;
  font-weight: 900;
  line-height: 1.06;
  letter-spacing: -16px;
  white-space: nowrap;
}
.title-english {
  padding-left: 20px;
  padding-top: 7px;
  font-size: 102px;
  font-weight: 750;
  line-height: .925;
  letter-spacing: -3px;
  white-space: nowrap;
}
.details {
  position: relative;
  padding-top: 23px;
  padding-left: 5px;
}
.artists {
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1.3;
}
.date {
  position: absolute;
  left: -4px;
  top: 181px;
  font-size: 137px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -5px;
}
.title-second {
  position: absolute;
  right: 0;
  top: 323px;
  font-size: 275px;
  font-weight: 900;
  line-height: 1.06;
  letter-spacing: -17px;
  white-space: nowrap;
}
.quote {
  position: absolute;
  left: 30px;
  top: 1238px;
  width: 510px;
  font-size: 20px;
  line-height: 28px;
  font-weight: 700;
  letter-spacing: -.55px;
}
.quote .spread {
  display: flex;
  justify-content: space-between;
}
.footer {
  position: absolute;
  left: 29px;
  right: 29px;
  top: 1380px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  white-space: nowrap;
  font-size: 28px;
  line-height: 38px;
  font-weight: 650;
  letter-spacing: -1.4px;
}
.footer .divider {
  margin-left: 20px;
  margin-right: 23px;
  font-weight: 400;
}
.footer .coffee {
  font-family: Arial, sans-serif;
  font-size: 31px;
  font-weight: 750;
  letter-spacing: -1px;
}
.watermark-logo {
  position: absolute;
  left: 912px;
  top: 1301px;
  width: 116px;
  height: 52px;
  border-radius: 29px;
  background: #fafafa;
  color: #cecece;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -2px;
  box-shadow: 0 3px 8px rgba(0,0,0,.035);
}
.watermark-account {
  position: absolute;
  right: 44px;
  top: 1371px;
  color: #fff;
  font-size: 30px;
  line-height: 36px;
  font-weight: 400;
  white-space: nowrap;
}
@media (max-width: 1080px) {
  body { overflow-x: auto; }
  .poster { margin-left: 0; }
}
</style>
</head>
<body>
<main class="poster">
  <header class="header">
    <div class="header-chinese">藝術<br>攝影展</div>
    <div class="header-english">ARTIST<br>PHOTO<br>EXHIBITION</div>
    <div class="vertical-title">定格光影</div>
  </header>

  <div class="rule rule-top"></div>

  <section class="exhibition">
    <div class="title-first">瞬息</div>
    <div class="title-english">IN THE<br>BLINK OF<br>AN EYE</div>

      <div class="artists">藝術家<br>森蘭 王沐春</div>
      <div class="date">08/14</div>
    </div>
    <div class="title-second">之間</div>
  </section>

  <div class="rule rule-bottom"></div>

  <div class="quote">
    <div>IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE</div>
    <div class="spread"><span>YOU'RE</span><span>NOT</span><span>CLOSE</span><span>ENOUGH.I</span><span>ALWAYS</span><span>SHOOT</span></div>
    <div>EVERYTHING IN MY MIND AS AN EXERCISE.</div>
  </div>

  <footer class="footer">
    <span>活動地址：濱江路西溪街二十七號</span>
    <span class="divider">|</span>
    <span>主辦單位：壹書咖啡館</span>
    <span class="coffee">ONE COFFEE</span>
  </footer>

  <div class="watermark-logo">小红书</div>
  <div class="watermark-account">小红书号：heyu11221</div>
</main>
</body>
</html>
