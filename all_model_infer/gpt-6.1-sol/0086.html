<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA SHOULD BE LESS THAN 40 %</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #3b5749; font-family: Arial, Helvetica, sans-serif; }
.slide {
  position: relative;
  width: 1024px;
  height: 576px;
  background: linear-gradient(to bottom, #607b6d 0%, #344f41 100%);
  overflow: hidden;
}
h1 {
  position: absolute;
  left: 65px;
  top: 25px;
  width: 914px;
  height: 65px;
  margin: 0;
  padding: 3px 8px 0;
  color: #ffff00;
  background: linear-gradient(to bottom, #78d0dc, #237d88);
  font-size: 48px;
  font-weight: 800;
  line-height: 59px;
  white-space: nowrap;
}
.panel {
  position: absolute;
  left: 120px;
  top: 164px;
  width: 733px;
  height: 381px;
  background: linear-gradient(to bottom, #ffffff 0%, #eef4f8 8%, #ffffff 17%, #ffffff 100%);
  color: #172d9e;
}
.formula {
  position: absolute;
  top: 65px;
  left: 219px;
  display: flex;
  align-items: center;
  gap: 32px;
  height: 95px;
  font-size: 28px;
  font-weight: 700;
}
.fraction {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  width: 133px;
  text-align: center;
}
.numerator { width: 100%; padding-bottom: 10px; border-bottom: 3px solid #172d9e; white-space: nowrap; }
.denominator { padding-top: 12px; }
.limit { color: #b32c2c; font-size: 24px; margin-left: 38px; white-space: nowrap; }
.definitions {
  position: absolute;
  left: 109px;
  top: 202px;
  font-size: 28px;
  line-height: 53px;
  font-weight: 700;
  white-space: nowrap;
}
.definitions p { margin: 0; }
</style>
</head>
<body>
<main class="slide">
<h1>PTA SHOULD BE LESS THAN 40 %</h1>
<section class="panel">
<div class="formula">
<span>PTA =</span>
<span class="fraction"><span class="numerator">(FT + AD)</span><span class="denominator">CCT</span></span>
<span class="limit">&lt; 40%</span>
</div>
<div class="definitions">
<p>FT = flap thickness</p>
<p>AD = ablation depth</p>
<p>CCT = central corneal thickness</p>
</div>
</section>
</main>
</body>
</html>
