  <h1>7.当题目中出现“原则”时，可用<br>以下模板：</h1>
  <section class="content">
    <p>(一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展</p>
    <p>(二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教</p>
    <p class="indented">（三）科学性原则。...能给幼儿正确的启蒙教<br>育</p>
    <p>(四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点</p>
    <p class="indented">（五）整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展</p>
    <p class="indented">（六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主</p>
  </section>
</main>
