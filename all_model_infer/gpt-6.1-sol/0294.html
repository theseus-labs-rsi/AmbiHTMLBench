<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur the King — Movie Poster</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, Helvetica, sans-serif; }
.poster { position: relative; width: 510px; height: 755px; overflow: hidden; }
.placeholder {
  position: absolute;
  inset: 0;
  width: 510px;
  height: 755px;
  margin: 0;
  background: #555d43;
  color: #e0e0d6;
}
.placeholder figcaption {
  position: absolute;
  top: 205px;
  left: 365px;
  width: 130px;
  font-size: 11px;
  line-height: 1.3;
}
.actor {
  position: absolute;
  left: 42px;
  top: 29px;
  width: 430px;
  display: flex;
  justify-content: space-between;
  color: white;
  font-size: 20px;
  font-weight: 800;
  line-height: 24px;
}
.actor span { letter-spacing: 20px; white-space: nowrap; }
.actor span:last-child { letter-spacing: 19px; margin-right: -19px; }
.tagline {
  position: absolute;
  top: 268px;
  left: 43px;
  margin: 0;
  color: white;
  font-size: 11px;
  line-height: 13.5px;
  font-weight: 400;
}
.title {
  position: absolute;
  left: 41px;
  top: 308px;
  margin: 0;
  color: #ffcf00;
  font-size: 70px;
  font-weight: 800;
  line-height: 1;
}
.title-line { display: flex; height: 136px; align-items: flex-start; padding-top: 1px; }
.arthur { width: 429px; justify-content: space-between; }
.the { width: 184px; justify-content: space-between; }
.king { width: 270px; justify-content: space-between; }
.based {
  position: absolute;
  right: 43px;
  top: 688px;
  color: white;
  font-size: 13px;
  line-height: 13px;
  text-align: right;
  margin: 0;
}
.release {
  position: absolute;
  right: 43px;
  top: 724px;
  color: white;
  font-size: 10px;
  line-height: 12px;
  font-weight: 800;
}
.studio {
  position: absolute;
  right: 44px;
  top: 736px;
  color: white;
  font-size: 11px;
  line-height: 12px;
}
.rating {
  position: absolute;
  left: 44px;
  top: 728px;
  width: 46px;
  height: 17px;
  border: 1px solid #aaa;
  display: flex;
  align-items: center;
  color: #bbb;
  font-size: 7px;
}
.rating strong { white-space: nowrap; padding: 1px; }
.rating small { border-left: 1px solid #aaa; font-size: 4px; padding-left: 1px; }
</style>
</head>
<body>
<main class="poster" aria-label="Arthur the King movie poster">
  <figure class="placeholder">
    <figcaption>[Photograph: man in profile above a shaggy dog, filling the poster]</figcaption>
  </figure>
  <div class="actor"><span>MARK</span><span>WAHLBERG</span></div>
  <p class="tagline">AN UNEXPECTED ENCOUNTER<br>AN UNLIKELY BOND<br>AN UNFORGETTABLE ADVENTURE</p>
  <h1 class="title" aria-label="ARTHUR THE KING">
    <span class="title-line arthur"><span>A</span><span>R</span><span>T</span><span>H</span><span>U</span><span>R</span></span>
    <span class="title-line the"><span>T</span><span>H</span><span>E</span></span>
    <span class="title-line king"><span>K</span><span>I</span><span>N</span><span>G</span></span>
  </h1>
  <p class="based">BASED ON THE<br>INCREDIBLE TRUE STORY</p>
  <div class="release">COMING SOON</div>
  <div class="studio">LIONSGATE</div>
  <div class="rating"><strong>PG-13</strong><small>[illegible]</small></div>
</main>
</body>
</html>
