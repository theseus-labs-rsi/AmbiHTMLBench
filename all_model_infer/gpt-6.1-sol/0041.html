<section class="prose">
<p>还可以发现，斜钉一根木条的四边形木架的形状不会改变。这是因为斜钉一根木条后，四边形变成两个三角形。由于三角形有稳定性，斜钉一根木条的篱笆在未安装好之前也不会变形。</p>
<p>三角形的稳定性有广泛的应用，图 11.1-8 表示其中一些例子。你能再举一些例子吗？</p>
