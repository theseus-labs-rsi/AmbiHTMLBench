<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰州旅行文案</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fff;
  color: #444;
  font-family: "Songti SC", SimSun, serif;
}
.page {
  width: 540px;
  height: 720px;
  margin: 0 auto;
  padding: 0 15px;
  display: grid;
  grid-template-columns: 152px 152px 156px;
  grid-template-rows: 240px 240px 240px;
  column-gap: 27.5px;
}
.zone { position: relative; }
.heading, .quote {
  position: absolute;
  left: -8px;
  right: -8px;
  margin: 0;
  text-align: center;
  font-size: 8px;
  font-weight: normal;
  line-height: 12px;
  white-space: nowrap;
}
.pin { color: #b42c42; font-size: 9px; }
.placeholder {
  position: absolute;
  left: 0;
  margin: 0;
  width: 152px;
  height: 153px;
  border: 1px solid #ddd;
  background: #f6f6f6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  color: #777;
  text-align: center;
  font-size: 10px;
  line-height: 1.6;
}
.top-left .heading { top: 29px; }
.top-left .quote { top: 48px; }
.top-left .placeholder { top: 73px; }
.top-center .heading { top: 20px; }
.top-center .quote { top: 48px; }
.top-center .placeholder { top: 73px; }
.top-right .heading { top: 18px; }
.top-right .quote { top: 37px; }
.top-right .placeholder {
  top: 63px;
  left: -3px;
  width: 157px;
  height: 158px;
}
.middle-left .heading, .middle-right .heading { top: 20px; }
.middle-left .quote, .middle-right .quote { top: 48px; }
.middle-left .placeholder, .middle-right .placeholder {
  top: 73px;
  height: 153px;
}
.middle-center {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 61px;
}
.title {
  margin: 0;
  writing-mode: vertical-rl;
  text-orientation: upright;
  color: #b82235;
  font-family: KaiTi, STKaiti, serif;
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 26px;
}
.bottom-left .heading { top: 19px; }
.bottom-left .quote { top: 47px; }
.bottom-left .placeholder { top: 72px; }
.bottom-center .heading { top: 29px; }
.bottom-center .quote { top: 48px; }
.bottom-center .placeholder { top: 73px; }
.bottom-right .heading { top: 29px; }
.bottom-right .quote { top: 49px; }
.bottom-right .placeholder { top: 73px; height: 154px; }
@media (max-width: 540px) {
  .page { margin-left: 0; }
}
</style>
</head>
<body>
<main class="page">
  <section class="zone top-left">
    <h2 class="heading"><span class="pin">📍</span>金城兰州</h2>
    <p class="quote">“淌不完的黄河水向东流”</p>
    <figure class="placeholder">[照片拼贴：兰州城市景观，三列三行]</figure>
  </section>

  <section class="zone top-center">
    <h2 class="heading"><span class="pin">📍</span>中山桥</h2>
    <p class="quote">“陌生的人 请给我一支兰州”</p>
    <figure class="placeholder">[照片拼贴：中山桥与黄河景观，三列三行]</figure>
  </section>

  <section class="zone top-right">
    <h2 class="heading"><span class="pin">📍</span>兰州美食</h2>
    <p class="quote">“四方食事 不过一碗人间烟火”</p>
    <figure class="placeholder">[照片拼贴：面食、饮品及烤串，三列三行]</figure>
  </section>

  <section class="zone middle-left">
    <h2 class="heading"><span class="pin">📍</span>[?]记巷</h2>
    <p class="quote">“繁华城市背后的另一面”</p>
    <figure class="placeholder">[照片拼贴：街巷、店铺与人物，三列三行]</figure>
  </section>

  <section class="zone middle-center">
    <h1 class="title">兰州旅行文案</h1>
  </section>

  <section class="zone middle-right">
    <h2 class="heading"><span class="pin">📍</span>甘肃省博物馆</h2>
    <p class="quote">“守河西[?][?] 传丝路文明”</p>
    <figure class="placeholder">[照片拼贴：博物馆展品，三列三行]</figure>
  </section>

  <section class="zone bottom-left">
    <h2 class="heading"><span class="pin">📍</span>白塔山公园</h2>
    <p class="quote">“行走在西北 看尽黄河水”</p>
    <figure class="placeholder">[照片拼贴：白塔山公园、白塔与黄河，三列三行]</figure>
  </section>

  <section class="zone bottom-center">
    <h2 class="heading"><span class="pin">📍</span>兰山公园</h2>
    <p class="quote">“白天阿富汗 晚上曼哈顿”</p>
    <figure class="placeholder">[照片拼贴：兰山公园与城市夜景，三列三行]</figure>
  </section>

  <section class="zone bottom-right">
    <h2 class="heading"><span class="pin">📍</span>正宁路小吃街</h2>
    <p class="quote">“人间烟火气 最抚凡人心”</p>
    <figure class="placeholder">[照片拼贴：小吃街摊位、美食与人物，三列三行]</figure>
  </section>
</main>
</body>
</html>
