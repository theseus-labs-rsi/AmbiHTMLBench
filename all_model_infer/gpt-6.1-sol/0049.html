<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易被忽视的养生小动作</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #e8e6df;
  color: #393934;
  font-family: "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
}
.page {
  width: 540px;
  min-height: 1141px;
  padding: 15px 17px 0;
  overflow: hidden;
}
h1 {
  margin: 0 0 19px;
  height: 69px;
  line-height: 69px;
  text-align: center;
  white-space: nowrap;
  font-family: "SimHei", "Noto Sans CJK SC", sans-serif;
  font-size: 49px;
  font-weight: 800;
  letter-spacing: 2px;
  transform: scaleX(.88);
}
p {
  margin: 0;
  font-size: 42px;
  font-weight: 400;
  line-height: 54px;
  white-space: nowrap;
}
.line {
  display: block;
  height: 54px;
}
.opening {
  display: flex;
  align-items: baseline;
  padding-left: 88px;
}
.label {
  font-size: 40px;
  font-weight: 900;
  margin-right: 48px;
}
.second {
  margin-top: 3px;
}
.second .opening {
  padding-left: 92px;
}
.second .label {
  margin-right: 48px;
}
</style>
</head>
<body>
<main class="page">
  <h1>易被忽视的养生小动作</h1>
  <p>
    <span class="line opening"><strong class="label">梳头</strong><span>梳头是脑部运</span></span>
    <span class="line">动最理想的项目，它可以刺</span>
    <span class="line">激穴位，增强分泌活动，改</span>
    <span class="line">善血液循环，促进新陈代</span>
    <span class="line">谢。此外，梳头还是治疗失</span>
    <span class="line">眠、眩晕、心悸、中风后遗症</span>
    <span class="line">和青少年白发的辅助手段。</span>
    <span class="line">平时每天可梳头3至5次，每</span>
    <span class="line">次不少于3至5分钟，其中晚</span>
    <span class="line">上睡前必须要梳一次。</span>
  </p>
  <p class="second">
    <span class="line opening"><strong class="label">伸懒腰</strong><span>伸懒腰会使</span></span>
    <span class="line">人体的脏器对心、肺产生</span>
    <span class="line">挤压。持续几秒钟的伸懒</span>
    <span class="line">腰，使很多淤积的血液被</span>
    <span class="line">赶回心脏，改善血液循环，</span>
    <span class="line">使更多的含氧量的血液供</span>
    <span class="line">给大脑，还可带走肌肉的</span>
    <span class="line">一些废物，从而消除人体</span>
    <span class="line">的疲劳。</span>
  </p>
</main>
</body>
</html>
