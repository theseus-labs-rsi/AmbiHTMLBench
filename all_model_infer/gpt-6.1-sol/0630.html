<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物膜系统与细胞核笔记</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ded9cc; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  background: #dcdcd1;
  color: #353936;
  font-family: "KaiTi", "Kaiti SC", "STKaiti", cursive;
  font-size: 22px;
  line-height: 1.32;
}
.page::before {
  content: "";
  position: absolute;
  left: 36px;
  top: 0;
  height: 720px;
  width: 1px;
  background: #afa999;
  transform: rotate(2deg);
}
.top-note { position: absolute; left: 75px; top: 7px; transform: rotate(-5deg); white-space: nowrap; }
.heading { position: absolute; left: 70px; top: 43px; transform: rotate(-5deg); }
.membranes {
  position: absolute; left: 243px; top: 37px;
  font-size: 21px; line-height: 1.02;
  transform: rotate(-5deg);
}
.bracket { position: absolute; left: 242px; top: 50px; font-size: 34px; transform: rotate(-12deg); }
.function { position: absolute; left: 109px; top: 77px; transform: rotate(-5deg); }
.function .arrow { display: block; line-height: 21px; }
.functions {
  position: absolute; left: 80px; top: 108px; width: 447px;
  margin: 0; padding: 0; list-style: none;
  transform: rotate(-2deg);
}
.functions li { display: flex; align-items: flex-start; }
.number { flex: 0 0 31px; font-size: 25px; }
.words { flex: 1; }
.first { margin-bottom: 13px; }
.first .continuation { margin-top: 5px; margin-left: -12px; line-height: 1.31; }
.second { margin-bottom: 15px; }
.third .last-line { margin-left: 98px; margin-top: 5px; }
.divider {
  position: absolute; left: 47px; top: 320px;
  width: 493px; border-top: 1px solid #4b504a;
  transform: rotate(-2deg);
}
.nucleus-title { position: absolute; left: 68px; top: 337px; transform: rotate(-4deg); white-space: nowrap; font-size: 24px; }
.diagram { position: absolute; inset: 0; }
.root { position: absolute; left: 61px; top: 448px; transform: rotate(-4deg); font-size: 24px; }
.branch { position: absolute; height: 1px; background: #41433d; transform-origin: left center; }
.branch-a { left: 145px; top: 429px; width: 49px; transform: rotate(-23deg); }
.branch-b { left: 155px; top: 456px; width: 49px; transform: rotate(-4deg); }
.branch-c { left: 166px; top: 488px; width: 48px; transform: rotate(61deg); }
.branch-d { left: 135px; top: 510px; width: 89px; transform: rotate(70deg); }
.note { position: absolute; transform: rotate(-3deg); font-size: 24px; }
.membrane-note { left: 216px; top: 383px; white-space: nowrap; }
.nucleolus-note { left: 215px; top: 428px; width: 360px; }
.nucleolus-note .second-line { margin-left: 62px; margin-top: 5px; white-space: nowrap; }
.chromatin-note { left: 210px; top: 503px; width: 320px; white-space: nowrap; }
.chromatin-note .down { margin-left: 55px; line-height: 23px; }
.chromatin-note .carrier { margin-left: 79px; }
.pore-note { left: 165px; top: 603px; width: 407px; white-space: nowrap; }
.pore-note .second-line { margin-left: 68px; margin-top: 7px; }
</style>
</head>
<body>
<main class="page">
  <div class="top-note">内质网　到→高尔基体，</div>
  <div class="heading">cell的生物膜系统</div>
  <div class="bracket">〈</div>
  <div class="membranes">cell膜<br>cell器膜<br>核膜</div>
  <div class="function">作用<span class="arrow">↓</span></div>

  <ol class="functions">
    <li class="first">
      <span class="number">①</span>
      <div class="words">
        使cell具有相对稳定的内部环境
        <div class="continuation">同时，在cell与外部环境进行物质交换，能量转<br>化，信息传递过程中起决定性作用。</div>
      </div>
    </li>
    <li class="second">
      <span class="number">②</span>
      <div class="words">广阔的膜面积为众多酶提供了附着位点。</div>
    </li>
    <li class="third">
      <span class="number">③</span>
      <div class="words">分隔→保证了cell生命活动高效、有序的<div class="last-line">进行。</div></div>
    </li>
  </ol>

  <div class="divider"></div>
  <div class="nucleus-title">cell核 控制着cell的代谢和遗传</div>

  <section class="diagram" aria-label="细胞核结构笔记">
    <div class="root">cell核</div>
    <div class="branch branch-a"></div>
    <div class="branch branch-b"></div>
    <div class="branch branch-c"></div>
    <div class="branch branch-d"></div>
    <div class="note membrane-note">核膜：双层，分隔</div>
    <div class="note nucleolus-note">
      核仁：与某种RNA的合成以及核[?]
      <div class="second-line">体的形成有关</div>
    </div>
    <div class="note chromatin-note">
      染色质→由DNA和pro组成
      <div class="down">↓</div>
      <div class="carrier">遗传信息的载体</div>
    </div>
    <div class="note pore-note">
      核孔：实现核质之间频繁的物质交
      <div class="second-line">和信息交流</div>
    </div>
  </section>
</main>
</body>
</html>
