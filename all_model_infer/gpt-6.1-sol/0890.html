<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>金句｜摘抄：坚持奋斗主题</title>
<script>

<style>

body { background: #faeee5; color: #2c2c28; }

  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
}
.header {
  position: relative;
  height: 173px;
  background: #faeee5;
}
.brand {
  position: absolute;
  left: 23px;
  top: 29px;
  width: 266px;
  text-align: center;
}
.brand-name {
  color: #bf2028;
  font-family: "STXingkai", "Xingkai SC", "KaiTi", cursive;
  font-size: 69px;
  font-weight: bold;
  line-height: 105px;
  letter-spacing: -5px;
  white-space: nowrap;
  transform: skew(-9deg);
}
.brand-subtitle {
  color: #b66a6b;

  font-size: 14px;
  letter-spacing: 3px;

  padding-right: 8px;
  font-size: 35px;
  line-height: 49px;
  white-space: nowrap;
}
.content {
  position: relative;
  height: 547px;
  background: #d6c8b1;
}
.quote {
  position: absolute;
  margin: 0;
  font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  font-size: 48px;
  font-weight: 400;
  line-height: 1.19;
  white-space: nowrap;
}
.first-quote { top: 10px; left: 129px; }
.second-quote { top: 262px; left: 86px; }

  position: absolute;

<main class="page">
  <header class="header">

    </div>
    <div class="header-titles">
      <div class="top-title">金句｜摘抄</div>
      <div class="theme">坚持奋斗主题</div>
    </div>
  </header>
  <section class="content">
    <h1 class="quote first-quote">夜色难免黑凉<br>前行必有曙光</h1>
    <p class="example example-one">举例:</p>
    <p class="explanation explanation-one">夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，<br>只要勇敢向前必定成功!</p>

    <h2 class="quote second-quote">道固远，笃行可至<br>事虽巨，坚为必成</h2>
    <p class="example example-two">举例:</p>
    <p class="explanation explanation-two">道固远，笃行可至;事虽巨，坚为必成。一个人也好，一<br>个国家也好，最可贵的就是心中有梦想，并且为实现梦想<br>不惧风雨、实干笃行、砥砺奋斗。</p>
  </section>
