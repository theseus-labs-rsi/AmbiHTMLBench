<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 · 金句摘抄 · 心态主题</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #ffffff;
  color: #302f2b;
  font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
}
.page {
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
}
.header {
  height: 173px;
  background: #fbefe5;
  display: grid;
  grid-template-columns: 300px 240px;
  align-items: start;
}
.placeholder.logo {
  width: 282px;
  height: 145px;
  margin: 22px 0 0 16px;
  color: #c41f26;
  position: relative;
}
.logo-name {
  position: absolute;
  left: 7px;
  top: 9px;
  width: 265px;
  font-family: "STXingkai", "Xingkai SC", "KaiTi", cursive;
  font-size: 69px;
  font-weight: bold;
  letter-spacing: -9px;
  transform: skew(-10deg);
  white-space: nowrap;
}
.logo-roman {
  position: absolute;
  top: 118px;
  left: 67px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
  white-space: nowrap;
  color: #af5656;
}
.header-right {
  padding-top: 29px;
  text-align: center;
  overflow: hidden;
}
.header-small {
  display: inline-block;
  height: 52px;
  margin-left: 58px;
  border-bottom: 2px solid #34332f;
  font-size: 34px;
  font-weight: 900;
  line-height: 45px;
  white-space: nowrap;
}
.divider {
  display: inline-block;
  margin: 0 9px;
  font-weight: normal;
}
.header-title {
  height: 65px;
  margin-top: 9px;
  margin-left: 9px;
  border-bottom: 3px solid #34332f;
  font-size: 49px;
  font-weight: 900;
  line-height: 62px;
  white-space: nowrap;
}
.content {
  height: 547px;
  background: linear-gradient(105deg, #cec2ac 0%, #d8c9b2 45%, #d7c8b2 100%);
  padding-top: 17px;
}
.quote-primary {
  margin: 0;
  text-align: center;
  font-size: 47px;
  font-weight: normal;
  line-height: 1.23;
  letter-spacing: 1px;
  padding-left: 18px;
}
.label {
  margin: 0;
  font-size: 19px;
  line-height: 26px;
}
.label-first {
  margin-top: -2px;
  margin-left: 22px;
}
.explanation-first {
  margin: 20px 22px 0;
  font-family: "SimSun", "Songti SC", serif;
  font-size: 19px;
  line-height: 23.3px;
  letter-spacing: 0;
}
.quote-secondary {
  margin: 15px 0 0;
  text-align: center;
  font-size: 34px;
  line-height: 40px;
  font-weight: normal;
}
.label-second {
  margin: -9px 0 0 35px;
}
.explanation-second {
  margin: 21px 35px 0;
  font-family: "SimSun", "Songti SC", serif;
  font-size: 19px;
  line-height: 23.4px;
}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div class="placeholder logo" role="img" aria-label="人民日报标志：左上方">
      <div class="logo-name">人民日报</div>
      <div class="logo-roman">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="header-small">金句<span class="divider">|</span>摘抄</div>
      <div class="header-title">心态主题</div>
    </div>
  </header>
  <section class="content">
    <h1 class="quote-primary">且行且忘且随风，<br>且行且看且从容。</h1>
    <p class="label label-first">释义:</p>
    <p class="explanation-first">意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从<br>容不迫。引申意思就是当我们遇到非常不平静的时候，只<br>要能有一个平静的心态，才能找出平静的办法去解决，讲<br>的是从容面对的淡定心态。人生百味，浓缩到最后，就是<br>一个淡字，正确地选择与取舍，是一生必修的功课。</p>
    <h2 class="quote-secondary">我将玫瑰藏于身后风起花落，<br>从此鲜花赠自己，<br>纵马踏花向自由。</h2>
    <p class="label label-second">释义:</p>
    <p class="explanation-second">我把心中的美好向往藏在身后，当面对现实的时候美<br>好的向往会随着花儿掉落，而从此以后美好赠送给自<br>己，骑着马儿迎着美好向往自由。</p>
  </section>
</main>
</body>
</html>
