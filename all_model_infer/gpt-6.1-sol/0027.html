<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核桃奶酪贝果与香蕉可可贝果</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #ffaa60;
  color: #69420d;
  font-family: KaiTi, STKaiti, "楷体", serif;
}
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  background: #ffaa60;
}
.sheet {
  position: absolute;
  left: 28px;
  top: 28px;
  width: 489px;
  height: 668px;
  border: 7px solid #ed890d;
  border-radius: 5px;
  background-color: #fffdf5;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 10px, rgba(255,190,129,.20) 10px 20px),
    repeating-linear-gradient(90deg, transparent 0 11px, rgba(255,190,129,.17) 11px 22px);
}
h1, h2, p, figure { margin: 0; }
.title {
  position: absolute;
  font-size: 38px;
  font-weight: normal;
  line-height: 1.15;
  white-space: nowrap;
}
.top-title { left: 132px; top: 36px; }
.bottom-title { left: 137px; top: 367px; }
.placeholder {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  border: 1px solid rgba(128,81,25,.22);
  background: rgba(255,250,235,.35);
  color: #85613a;
  font-family: KaiTi, STKaiti, serif;
  font-size: 12px;
}
.badge {
  position: absolute;
  left: 45px;
  top: 37px;
  width: 77px;
  height: 75px;
  border: 4px solid #cfa344;
  border-radius: 17px;
  background: #fffef1;
  color: #64728a;
  transform: rotate(-14deg);
  text-align: center;
  font-size: 29px;
  font-weight: bold;
  line-height: 30px;
  padding-top: 4px;
}
.preparation {
  position: absolute;
  font-size: 24px;
  letter-spacing: 3px;
  white-space: nowrap;
}
.top-preparation { left: 200px; top: 78px; }
.bottom-preparation { left: 48px; top: 418px; }
.ingredients {
  position: absolute;
  display: grid;
  text-align: center;
  align-items: start;
}
.top-ingredients {
  left: 198px;
  top: 104px;
  width: 207px;
  grid-template-columns: 65px 72px 70px;
}
.bottom-ingredients {
  left: 50px;
  top: 450px;
  width: 247px;
  grid-template-columns: 66px 82px 52px 47px;
}
.ingredient { position: relative; height: 69px; }
.ingredient .placeholder {
  position: relative;
  margin: 0 auto;
}
.ingredient p { margin-top: 3px; font-size: 16px; }
.instructions {
  position: absolute;
  font-size: 22px;
  letter-spacing: 1.2px;
  line-height: 25px;
}
.top-instructions { left: 195px; top: 177px; }
.bottom-instructions { left: 40px; top: 523px; }
.divider {
  position: absolute;
  left: 123px;
  top: 357px;
  width: 388px;
  height: 6px;
  background: repeating-linear-gradient(90deg, #e58b16 0 32px, transparent 32px 38px);
}
.credit {
  position: absolute;
  left: 329px;
  top: 419px;
  font-size: 21px;
  white-space: nowrap;
}
.sign {
  position: absolute;
  left: 352px;
  top: 478px;
  width: 66px;
  height: 72px;
  padding: 6px 2px;
  background: #ff6552;
  color: #fffbe6;
  transform: rotate(-15deg);
  border-radius: 6px;
  font-size: 25px;
  font-weight: bold;
  line-height: 29px;
  text-align: center;
  z-index: 2;
}
</style>
</head>
<body>
<main class="page">
  <div class="sheet"></div>

  <div class="badge">元气<br>满满</div>
  <h1 class="title top-title">核桃奶酪贝果</h1>
  <figure class="placeholder" style="left:369px;top:38px;width:41px;height:39px;">[贝果图案]</figure>

  <figure class="placeholder" style="left:41px;top:111px;width:148px;height:128px;">[核桃奶酪贝果插图]</figure>
  <p class="preparation top-preparation">1.准备材料</p>

  <div class="ingredients top-ingredients">
    <div class="ingredient">
      <figure class="placeholder" style="width:58px;height:47px;">[奶酪包装]</figure>
      <p>奶酪</p>
    </div>
    <div class="ingredient">
      <figure class="placeholder" style="width:58px;height:47px;">[贝果]</figure>
      <p>贝果</p>
    </div>
    <div class="ingredient">
      <figure class="placeholder" style="width:56px;height:47px;">[核桃仁]</figure>
      <p>核桃仁</p>
    </div>
  </div>

  <p class="instructions top-instructions">2.核桃仁烤2分钟左右，搓掉皮，<br>捣碎后和奶酪混合到一起，涂抹<br>在贝果上</p>

  <figure class="placeholder" style="left:34px;top:244px;width:96px;height:163px;">[女孩卡通插图]</figure>
  <figure class="placeholder" style="left:207px;top:254px;width:89px;height:81px;">[烤箱插图]</figure>
  <figure class="placeholder" style="left:299px;top:295px;width:30px;height:20px;">[向右箭头]</figure>
  <figure class="placeholder" style="left:324px;top:270px;width:81px;height:49px;">[碗内核桃碎]</figure>
  <figure class="placeholder" style="left:402px;top:292px;width:29px;height:20px;">[向右箭头]</figure>
  <figure class="placeholder" style="left:432px;top:268px;width:71px;height:53px;">[涂抹奶酪的贝果]</figure>

  <div class="divider"></div>

  <h2 class="title bottom-title">香蕉可可贝果</h2>
  <figure class="placeholder" style="left:375px;top:369px;width:44px;height:38px;">[贝果图案]</figure>

  <p class="preparation bottom-preparation">1.准备材料</p>
  <p class="credit">@哎呀牌绿豆汤</p>

  <div class="ingredients bottom-ingredients">
    <div class="ingredient">
      <figure class="placeholder" style="width:58px;height:50px;">[奶酪包装]</figure>
      <p>奶酪</p>
    </div>
    <div class="ingredient">
      <figure class="placeholder" style="width:60px;height:50px;">[贝果]</figure>
      <p>贝果</p>
    </div>
    <div class="ingredient">
      <figure class="placeholder" style="width:36px;height:50px;">[香蕉]</figure>
      <p>香蕉</p>
    </div>
    <div class="ingredient">
      <figure class="placeholder" style="width:39px;height:50px;">[可可粉包装]</figure>
      <p>可可粉</p>
    </div>
  </div>

  <p class="instructions bottom-instructions">2.奶酪加入可可粉，搅拌均匀涂<br>抹在贝果上摆上水果</p>

  <figure class="placeholder" style="left:49px;top:605px;width:82px;height:50px;">[奶酪与可可粉碗]</figure>
  <figure class="placeholder" style="left:130px;top:590px;width:45px;height:21px;">[向右弯曲箭头]</figure>
  <figure class="placeholder" style="left:164px;top:603px;width:71px;height:55px;">[涂抹可可奶酪的贝果]</figure>
  <figure class="placeholder" style="left:222px;top:591px;width:41px;height:23px;">[向右弯曲箭头]</figure>
  <figure class="placeholder" style="left:254px;top:599px;width:73px;height:61px;">[摆上香蕉片的贝果]</figure>
  <figure class="placeholder" style="left:309px;top:559px;width:38px;height:25px;">[香蕉片]</figure>
  <figure class="placeholder" style="left:307px;top:585px;width:20px;height:24px;">[向下箭头]</figure>

  <figure class="placeholder" style="left:354px;top:553px;width:151px;height:134px;">[香蕉可可贝果插图]</figure>
  <div class="sign">平安<br>喜乐</div>
  <figure class="placeholder" style="left:395px;top:544px;width:17px;height:31px;">[插牌木签]</figure>
</main>
</body>
</html>
