<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅拍婚纱照大PK</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
  color: #050505;
  background: linear-gradient(to right, #c3effb 0%, #c3effb 50.37%, #eaf6f8 50.37%, #eaf6f8 100%);
  font-family: KaiTi, STKaiti, "楷体", serif;
}
h1 {
  position: absolute;
  top: 25px;
  left: 43px;
  width: 465px;
  margin: 0;
  white-space: nowrap;
  font-size: 49px;
  line-height: 59px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
}
.headings {
  position: absolute;
  top: 94px;
  left: 22px;
  right: 22px;
  display: grid;
  grid-template-columns: 226px 45px 225px;
  align-items: center;
  font-size: 25px;
  line-height: 32px;
  font-style: italic;
  white-space: nowrap;
}
.vs { text-align: center; font-size: 27px; font-weight: bold; }
.right-heading { text-align: right; }
.columns {
  position: absolute;
  top: 144px;
  left: 20px;
  right: 17px;
  display: grid;
  grid-template-columns: 234px 234px;
  column-gap: 35px;
}
.photos {
  display: grid;
  grid-template-columns: 111px 111px;
  grid-template-rows: 145px 145px 108px;
  gap: 9px 12px;
}
.placeholder {
  width: 111px;
  height: 145px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 2px;
  background: rgba(128, 151, 145, .13);
  color: #50625f;
  font-family: KaiTi, STKaiti, "楷体", serif;
  font-size: 13px;
  text-align: center;
}
.wide { grid-column: 1 / 3; width: 234px; height: 108px; }
.copy {
  margin-top: 10px;
  width: 234px;
  font-size: 18px;
  line-height: 24px;
  font-style: italic;
  letter-spacing: .3px;
}
.copy .first-line { text-indent: 36px; }
</style>
</head>
<body>
<main class="page">
  <h1>“旅拍婚纱照大PK”</h1>
  <div class="headings">
    <div>新疆 · 喀什旅拍</div>
    <div class="vs">VS</div>
    <div class="right-heading">新疆 · 伊犁旅拍</div>
  </div>
  <div class="columns">
    <section>
      <div class="photos">
        <figure class="placeholder">[照片：新人与当地儿童合影]</figure>
        <figure class="placeholder">[照片：雪山前的新人与儿童]</figure>
        <figure class="placeholder">[照片：草地上的新人与儿童]</figure>
        <figure class="placeholder">[照片：新娘与当地儿童合影]</figure>
        <figure class="placeholder wide">[照片：雪山草地上的新人与儿童]</figure>
      </div>
      <div class="copy">
        <div class="first-line">在这片色彩浓郁的土地，</div>
        增添了文化和艺术的极致体现<br>
        满满的西部风格出片效果太绝<br>
        了！如果你想要不一样的婚纱<br>
        旅拍，这里一定是首要之选！
      </div>
    </section>
    <section>
      <div class="photos">
        <figure class="placeholder">[照片：山间草地上的新人]</figure>
        <figure class="placeholder">[照片：新人近景]</figure>
        <figure class="placeholder">[照片：戴帽子的新人与新郎]</figure>
        <figure class="placeholder">[照片：山坡草地上的新人]</figure>
        <figure class="placeholder wide">[照片：森林前草坡上的新人]</figure>
      </div>
      <div class="copy">
        <div class="first-line">阳光和草原的风景像儿时</div>
        梦里的画面一般梦幻，阳光下<br>
        吹过的风，晚间夕阳落在芳草<br>
        地上，都不及情到浓时两人相<br>
        视一笑的那一抹温柔
      </div>
    </section>
  </div>
</main>
</body>
</html>
