<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商业思维｜底层逻辑｜个人提升</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #eeede9;
      color: #080907;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-weight: 700;
    }
    .page {
      width: 540px;
      height: 722px;
      position: relative;
      background: #eeede9;
      overflow: hidden;
    }
    ol {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      position: absolute;
      font-size: 25px;
      letter-spacing: -0.35px;
    }
    .first {
      top: 24px;
      left: 34px;
      line-height: 43.5px;
    }
    .second {
      top: 273px;
      left: 40px;
      line-height: 39.5px;
    }
    .third {
      top: 430px;
      left: 40px;
      line-height: 39.5px;
    }
    .line {
      display: block;
      white-space: nowrap;
    }
    .accent { color: #4b9388; }
    .number { font-size: 28px; }
    footer {
      position: absolute;
      top: 667px;
      left: 119px;
      font-size: 23px;
      line-height: 32px;
      color: #4b9388;
      white-space: nowrap;
    }
    footer .divider {
      font-weight: 400;
      margin: 0 9px;
    }
  </style>
</head>
<body>
  <main class="page">
    <ol>
      <li class="first">
        <span class="line"><span class="number">1、</span><span class="accent">你开始炫耀自己，往往都是灾难的开始。</span></span>
        <span class="line">就像老子在《道德经》里写到：“光而不耀，</span>
        <span class="line">静水流深。”意思就是，无论身处什么位置，</span>
        <span class="line">什么环境，嘴上不逞强、不炫耀、不狂妄才能</span>
        <span class="line">兜住自己的福气。</span>
      </li>
      <li class="second">
        <span class="line"><span class="number">2、</span>一个冷知识：<span class="accent">屏蔽力是一个人最顶级</span></span>
        <span class="line"><span class="accent">的能力，</span>任何消耗你的人和事，多看一眼</span>
        <span class="line">都是你的不对。</span>
      </li>
      <li class="third">
        <span class="line"><span class="number">3、</span>大学时辅导员说了一句受益一生的</span>
        <span class="line">话：“<span class="accent">你不用变得很外向，内向挺好的</span>，</span>
        <span class="line">但需要你发言的时候，一定要勇敢。”正</span>
        <span class="line">所谓：君子可内敛不可懦弱，面不公可起</span>
        <span class="line">而论之。</span>
      </li>
    </ol>
    <footer>商业思维<span class="divider">|</span>底层逻辑<span class="divider">|</span>个人提升</footer>
  </main>
</body>
</html>
