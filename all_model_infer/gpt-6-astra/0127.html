<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集系列</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #fff;
  color: #19150e;
  font-family: "KaiTi", "STKaiti", "SimSun", "Noto Serif CJK SC", serif;
}
.page {
  width: 540px;
  min-height: 714px;
  overflow: hidden;
  background: #d4ba87;
}
.header {
  height: 150px;
  position: relative;
  background: #f2e4b5;
}
.brand {
  position: absolute;
  left: 7px;
  top: 2px;
  width: 278px;
  height: 134px;
  text-align: center;
}
.brand-name {
  height: 111px;
  color: #c83426;
  font-family: "STXingkai", "Xingkai SC", "KaiTi", "STKaiti", cursive;
  font-size: 73px;
  font-weight: bold;
  letter-spacing: -7px;
  line-height: 111px;
  white-space: nowrap;
  transform: rotate(-3deg);
  text-shadow: 3px 3px 5px #bba77c;
}
.brand-roman {
  margin-left: 10px;
  color: #a76649;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  letter-spacing: 3px;
  line-height: 21px;
}
.header-right {
  position: absolute;
  top: 8px;
  right: 0;
  width: 241px;
  height: 126px;
}
.categories {
  margin-left: 43px;
  height: 52px;
  border-bottom: 3px solid #28241b;
  font-size: 26px;
  line-height: 35px;
  white-space: nowrap;
}
.series {
  position: absolute;
  bottom: 1px;
  width: 241px;
  padding: 0 0 3px 34px;
  border-bottom: 3px solid #28241b;
  font-size: 31px;
  line-height: 36px;
  white-space: nowrap;
}
.content { position: relative; height: 564px; }
.quote {
  position: absolute;
  left: 13px;
  right: 8px;
}
.quote-one { top: 33px; }
.quote-two { top: 222px; left: 19px; }
.quote-three { top: 402px; left: 22px; }
.verse {
  display: grid;
  grid-template-columns: 59px 1fr;
  font-size: 39px;
  line-height: 46px;
  letter-spacing: 0;
}
.quote-two .verse { grid-template-columns: 57px 1fr; }
.quote-three .verse { grid-template-columns: 52px 1fr; }
.number { white-space: nowrap; }
.lines { white-space: nowrap; }
.explanation {
  position: absolute;
  left: 13px;
  right: 10px;
  font-size: 17px;
  line-height: 20px;
  letter-spacing: 0;
}
.explanation-one { top: 146px; }
.explanation-two { top: 318px; }
.explanation-three { top: 499px; left: 17px; }
.explanation p { margin: 0; }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div class="brand">
      <div class="brand-name">人民日报</div>
      <div class="brand-roman">RENMIN RIBAO</div>
    </div>
    <div class="header-right">
      <div class="categories">金句 | 素材 | 摘抄</div>
      <div class="series">金句合集系列</div>
    </div>
  </header>
  <section class="content">
    <div class="quote quote-one">
      <div class="verse">
        <span class="number">1、</span>
        <div class="lines">愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</div>
      </div>
    </div>
    <div class="explanation explanation-one">
      <p>释义:</p>
      <p>希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝<br>与琐事而烦恼忧愁。</p>
    </div>

    <div class="quote quote-two">
      <div class="verse">
        <span class="number">2、</span>
        <div class="lines">总有人间一两风，<br>填我十万八千梦。</div>
      </div>
    </div>
    <div class="explanation explanation-two">
      <p>释义:</p>
      <p>人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成<br>全你的理想。</p>
    </div>

    <div class="quote quote-three">
      <div class="verse">
        <span class="number">3、</span>
        <div class="lines">日出有盼，日落有思，<br>平平安安，所遇皆甜。</div>
      </div>
    </div>
    <div class="explanation explanation-three">
      <p>释义:</p>
      <p>只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，<br>遇到的都是美好。</p>
    </div>
  </section>
</main>
</body>
</html>
