<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖　昨表帖</title>
<script>

</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #fafaf8; }
.page {
  position: relative;
  width: 540px;
  height: 1153px;
  margin: 0 auto;
  padding-top: 54px;
  overflow: hidden;
}
.paper {
  position: relative;
  width: 540px;
  height: 1048px;
  background: #d8cbb8;
  background-image: linear-gradient(90deg, rgba(128,105,74,.035), rgba(255,255,255,.10) 45%, rgba(128,105,74,.025));
}
.rules {
  position: absolute;
  top: 21px;
  left: 27px;
  width: 440px;
  height: 1009px;
  border: 1px solid rgba(249,239,216,.27);
  background: repeating-linear-gradient(to right, transparent 0, transparent 61px, rgba(249,239,216,.24) 62px, transparent 63px);
}
.columns {
  position: absolute;
  top: 24px;
  left: 99px;
  width: 368px;
  height: 1008px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  direction: rtl;
}
.column {
  height: 1008px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  direction: ltr;
  font-family: "KaiTi", "Kaiti TC", "STKaiti", "DFKai-SB", cursive;
  font-size: 37px;
  font-weight: 400;
  line-height: 1.55;
  letter-spacing: 1.6px;
  color: #1b130f;
}
.column.short { letter-spacing: 4.8px; }
.column.fourth { font-size: 36px; letter-spacing: 1.15px; }
.break { display: inline-block; height: 31px; }
.caption {
  position: absolute;
  top: 70px;
  right: 30px;
  margin: 0;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: "KaiTi", "Kaiti TC", "STKaiti", "DFKai-SB", cursive;
  font-size: 25px;
  line-height: 1.15;
  letter-spacing: 2px;
  color: #241a14;
}
.caption .gap { display: inline-block; height: 17px; }
.signature {
  position: absolute;
  top: 197px;
  left: 42px;
  height: 503px;
  margin: 0;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: "KaiTi", "Kaiti TC", "STKaiti", "DFKai-SB", cursive;
  font-size: 31px;
  line-height: 1.25;
  letter-spacing: 6px;
  color: #211712;
}

  position: absolute;
  left: 50px;
  width: 27px;
  height: 28px;
  border: 2px solid #b66645;
  color: #aa593b;
  background: rgba(181,99,60,.045);
  font: 8px/10px serif;

  align-items: center;
  justify-content: center;
  text-align: center;

.seal-two { top: 767px; }

</head>
<body>
<main class="page">
  <section class="paper" aria-label="直行書法">
    <div class="rules" aria-hidden="true"></div>
    <p class="caption">祥除帖<span class="gap"></span>昨表帖</p>
    <div class="columns">
      <div class="column">臣廙言臣祥除以須五日窮思永遠肝心寸截廿雪應時嚴寒奉被</div>
      <div class="column">手詔伏承聖體御膳勝常以慰下情臣故患匈痛氣上頓乏勿勿慈</div>
      <div class="column">恩垂愍每見慰問感戴屏營不勝衝遇謹表陳聞臣廙誠惶頓首</div>
      <div class="column fourth">頓首死罪死罪<span class="break"></span>臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
      <div class="column">慰下情不審宿昔復何如承鄭夫人乃爾委頓今復增損伏惟哀亡</div>
      <div class="column short">慈存益勞聖心謹附承動靜臣廙言</div>
    </div>
    <p class="signature">歲在癸卯[?]耀陽書於未央雲舍</p>
    <div class="placeholder seal-one" aria-label="紅色印章">[Seal]</div>
    <div class="placeholder seal-two" aria-label="紅色印章">[Seal]</div>
  </section>
</main>
