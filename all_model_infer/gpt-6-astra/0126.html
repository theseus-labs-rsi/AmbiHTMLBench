<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE Book on Social Media in Health Care</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: white; }
body { font-family: Arial, Helvetica, sans-serif; }
.page {
  width: 1024px;
  height: 768px;
  border: 1px solid #929292;
  overflow: hidden;
  background: #fff;
}
h1 {
  margin: 23px 31px 0;
  font-size: 56px;
  line-height: 56px;
  font-weight: 400;
  color: #084887;
}
h1 em { font-weight: 400; }
.content {
  display: grid;
  grid-template-columns: 285px 560px;
  column-gap: 70px;
  margin: 35px 0 0 70px;
  align-items: start;
}
.book {
  width: 285px;
  height: 427px;
  margin: 0;
  background: #080e10;
  color: #e8e8e8;
  padding: 14px 18px 0 39px;
  position: relative;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 300;
}
.book .bringing { font-size: 39px; line-height: 43px; letter-spacing: -1.6px; white-space: nowrap; }
.book .social { font-size: 80px; line-height: 72px; letter-spacing: -3.5px; }
.book .media { font-size: 80px; line-height: 72px; letter-spacing: -3.5px; }
.book .revolution { font-size: 39px; line-height: 45px; letter-spacing: -1.8px; white-space: nowrap; }
.book .health { font-size: 32px; line-height: 37px; letter-spacing: -1px; white-space: nowrap; }
.book .publisher {
  margin-top: 39px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  white-space: nowrap;
}
.book figcaption {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 285px;
  height: 92px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #bcdbe4;
  background: #065575;
  font-size: 13px;
}
ul {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 42px;
  line-height: 42px;
  font-weight: 400;
}
li {
  position: relative;
  padding-left: 40px;
  margin: 0 0 23px;
}
li::before {
  content: "•";
  position: absolute;
  left: 1px;
  top: 0;
  color: #07509a;
  font-size: 44px;
}
li:nth-child(2) { margin-bottom: 24px; }
li:nth-child(3) { margin-bottom: 25px; }
u { text-underline-offset: 3px; text-decoration-thickness: 2px; }
</style>
</head>
<body>
<main class="page">
  <h1><em>THE</em> Book on Social Media in Health<br>Care</h1>
  <section class="content">
    <figure class="placeholder book" aria-label="Book cover">
      <div class="bringing">Bringing the</div>
      <div class="social">Social</div>
      <div class="media">Media</div>
      <div class="revolution">#Revolution</div>
      <div class="health">to Health Care</div>
      <div class="publisher">Mayo Clinic Center for Social Media</div>
      <figcaption>[Book cover artwork: blue waves]</figcaption>
    </figure>
    <ul>
      <li>Essays from 30 thought<br>leaders</li>
      <li>The “Why?” of social media<br>in health care</li>
      <li>Net proceeds fund patient<br>scholarships</li>
      <li>Available on <u>Amazon</u> and<br>discount bulk orders on<br><u>CreateSpace</u> (with offer<br>code Z4L7DBSN)</li>
    </ul>
  </section>
</main>
</body>
</html>
