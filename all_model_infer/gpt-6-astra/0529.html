<!DOCTYPE html>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
.poster {
  width: 1152px;
  height: 2048px;
  position: relative;
  overflow: hidden;
  background: #fff;
  color: #222483;
}
.background {
  position: absolute;
  inset: 0;
  background:

    linear-gradient(to right, transparent 710px, #ececec 711px, #ececec 713px, transparent 714px),
    linear-gradient(to right, transparent 1072px, #ececec 1073px, #ececec 1075px, transparent 1076px);
}
.gridline { position: absolute; left: 0; right: 0; height: 3px; background: #ededed; opacity: .85; }
.short-vertical { position: absolute; top: 617px; bottom: 0; left: 403px; width: 3px; background: #ededed; }
.abstract {
  position: absolute;
  pointer-events: none;
  opacity: .36;
  background: linear-gradient(180deg, #fff, #dedee5 48%, #fff);
}
.abstract.top { left: 408px; top: 78px; width: 666px; height: 860px; border-radius: 0 0 42% 0; }
.abstract.top::before { content: ""; position: absolute; background: white; width: 400px; height: 330px; left: -70px; top: -48px; border-radius: 50%; }
.abstract.top::after { content: ""; position: absolute; width: 355px; height: 355px; right: -177px; top: 234px; border: 72px solid white; border-radius: 50%; }
.abstract.bottom { left: 79px; top: 1050px; width: 994px; height: 868px; }
.abstract.bottom::before { content: ""; position: absolute; width: 550px; height: 840px; background: white; border-radius: 48%; left: 305px; top: -24px; transform: rotate(22deg); }
.abstract.bottom::after { content: ""; position: absolute; width: 335px; height: 280px; background: white; border-radius: 50%; left: -89px; bottom: -103px; }
.circle { position: absolute; top: 360px; left: 968px; width: 211px; height: 211px; border: 3px solid #ededed; border-radius: 50%; opacity: .6; }
.ghost { position: absolute; color: #eeeeF0; font-weight: 800; line-height: 1; }
.new { top: 31px; left: 66px; font-size: 277px; letter-spacing: 9px; }
.year-word { top: 1525px; left: 407px; font-size: 279px; letter-spacing: 0; }
.dash { position: absolute; height: 13px; background: #222483; }
.top-dash { left: 79px; top: 182px; width: 77px; }
.year { position: absolute; top: 211px; left: 72px; font-size: 174px; line-height: 1; font-weight: 800; letter-spacing: 1px; }
.art-banner {
  position: absolute;
  top: 419px;
  left: 79px;
  width: 632px;
  height: 153px;
  background: #222483;
}
.art-banner span {
  position: absolute;
  left: -8px;
  top: -17px;
  white-space: nowrap;
  font-size: 159px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1.1;
  color: transparent;
  background: linear-gradient(to bottom, #fff 0%, #fff 55%, #ff1473 55%, #ff1473 100%);
  background-clip: text;
  -webkit-background-clip: text;
}
.hero {
  position: absolute;
  top: 595px;
  left: 72px;
  width: 1004px;
  height: 687px;
  display: grid;
  grid-template-columns: 650px 354px;
}
.title {
  position: relative;
  font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  font-weight: 900;
  font-size: 326px;
  line-height: 1.055;
  letter-spacing: -1px;
}
.title::before {
  content: "";
  position: absolute;
  left: 7px;
  bottom: 2px;
  width: 632px;
  height: 91px;
  background: #ff1473;
}
.title div { position: relative; white-space: nowrap; }
.date { align-self: end; text-align: right; padding-bottom: 1px; }
.label { font-size: 41px; font-weight: 400; color: #292929; line-height: 1.4; }
.date .label { margin-bottom: 9px; }
.date-number {
  font-family: Impact, "Arial Narrow", "Roboto Condensed", sans-serif;
  font-stretch: condensed;
  color: #f91970;
  font-size: 73px;
  font-weight: 900;
  line-height: 1.12;
  letter-spacing: 3px;
  display: inline-block;
  transform: scaleX(.82);
  transform-origin: right center;
}
.date-separator { width: 46px; height: 13px; background: #f91970; margin: 23px 3px 25px auto; }
.details {
  position: absolute;
  left: 79px;
  right: 79px;
  top: 1370px;
  display: grid;
  grid-template-columns: 260px 1fr;
}
.price { padding-top: 25px; }
.price-value { color: #f91970; display: flex; align-items: baseline; height: 81px; }
.currency { font-size: 43px; margin-right: 10px; }
.amount { font-family: Impact, "Arial Narrow", sans-serif; font-size: 76px; line-height: 1; font-weight: 900; transform: scaleX(.85); transform-origin: left; margin-right: -6px; }
.start { font-size: 43px; }
.price .label { white-space: nowrap; }
.venue { text-align: right; }
.venue .dash { position: relative; width: 46px; margin-left: auto; margin-bottom: 22px; }
.venue-name { font-size: 49px; line-height: 1.4; white-space: nowrap; margin-top: 4px; }
.footer {
  position: absolute;
  top: 1819px;
  left: 79px;
  right: 79px;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.organizer-name { font-size: 51px; line-height: 1.5; margin-top: 4px; }
.contact { text-align: right; }
.contact .label { letter-spacing: 6px; margin-right: -6px; }
.phone {
  margin-top: 10px;
  font-family: Impact, "Arial Narrow", "Roboto Condensed", sans-serif;
  font-size: 55px;
  font-weight: 900;
  letter-spacing: 3px;
  white-space: nowrap;
  transform: scaleX(.82);
  transform-origin: right center;
}
.contact .dash { width: 46px; right: 0; top: 140px; }
.bottom-dash { left: 79px; top: 2013px; width: 46px; }
</style>
</head>

  <div class="ghost new">NEW</div>

  <div class="background" aria-hidden="true">
    <div class="gridline" style="top:76px"></div>
    <div class="gridline" style="top:271px"></div>

    <div class="gridline" style="top:1575px"></div>

  <footer class="footer">

    </div>
    <div class="contact">

    </div>
  </footer>
