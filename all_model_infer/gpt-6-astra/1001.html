<h1>世界气候类型的分布</h1>

<p class="introduction">虽然世界的气候复杂多样（图3.27），但是它们的分布有一定规律。例如，<mark>由赤道地区到极地地区，有规律地分布着热带的、亚热带的、温带的和寒带的气候。</mark>不同的气候类型呈现出不同的自然景观。</p>

<section class="gallery" aria-label="不同气候类型的自然景观">
<figure>
<div class="placeholder">[照片：热带雨林，左上]</div>
<figcaption><span class="pointer" aria-hidden="true"></span><mark>热带雨林气候主要分布在赤道附近地区。</mark>这里全年高温多雨，植物终年常绿，许多地方分布着茂密的热带雨林。</figcaption>
</figure>

<figure>
<div class="placeholder">[照片：热带草原，右上]</div>
<figcaption><span class="pointer" aria-hidden="true"></span><mark>热带草原气候主要分布在热带雨林气候的南北两侧。</mark>这里<mark>终年高温，一年中有明显的干季和雨季。</mark>地面上树木稀疏，长着较高的草。</figcaption>
</figure>

<figure class="lower">
<div class="placeholder">[照片：落叶阔叶林，左下]</div>
<figcaption><span class="pointer" aria-hidden="true"></span><mark>温带季风气候主要分布在温带地区的亚欧大陆东部。</mark>这里<mark>四季分明，夏季高温多雨，冬季寒冷干燥，</mark>生长着落叶阔叶林。</figcaption>
</figure>

<figure class="lower">
<div class="placeholder">[照片：冰雪景观与北极熊，右下]</div>
<figcaption><span class="pointer" aria-hidden="true"></span><mark>寒带气候主要分布在极圈以内，大部分地区气温很低，地面被冰雪覆盖。</mark></figcaption>
</figure>
</section>

<p class="figure-label">图3.27 不同气候类型的自然景观</p>

<p class="conclusion">其中，热带的气候大致分布在南、北回归线之间，寒带的气候大致分布在南、北极圈内，亚热带和温带的气候大致分布在北回归线与北极圈、南回归线与南极圈之间。在中纬度地区，由大陆东岸、大陆西岸向大陆内部，气候类型的分布也是有规律的。</p>
