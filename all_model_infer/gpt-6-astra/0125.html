<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句摘抄 · 心态主题</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #d6c8b0;
      color: #302e29;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #d6c8b0;
    }
    .header {
      height: 174px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: #fbefe5;
    }
    .logo {
      width: 293px;
      height: 166px;
      padding-top: 28px;
      color: #bb2027;
      text-align: center;
    }
    .logo-name {
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-family: "STXingkai", "Xingkai SC", "KaiTi", "STKaiti", cursive;
      font-size: 66px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: -5px;
      transform: rotate(-4deg);
    }
    .logo-name .large { font-size: 92px; }
    .logo-subtitle {
      margin-top: 4px;
      padding-left: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      letter-spacing: 3px;
      color: #ac6662;
    }
    .header-right {
      width: 232px;
      padding-top: 29px;
      text-align: center;
      font-weight: 900;
    }
    .category {
      width: 182px;
      margin-left: 50px;
      padding-bottom: 5px;
      border-bottom: 3px solid #393630;
      font-size: 35px;
      line-height: 44px;
      white-space: nowrap;
    }
    .category .separator {
      display: inline-block;
      margin: 0 12px;
      font-weight: normal;
    }
    .theme {
      margin-top: 14px;
      border-bottom: 3px solid #393630;
      font-size: 49px;
      line-height: 57px;
      white-space: nowrap;
      letter-spacing: 1px;
    }
    .quote {
      position: absolute;
      margin: 0;
      text-align: center;
      font-weight: normal;
    }
    .quote-one {
      top: 191px;
      left: 77px;
      width: 410px;
      font-size: 48px;
      line-height: 57px;
      letter-spacing: 1px;
    }
    .label {
      position: absolute;
      margin: 0;
      font-size: 19px;
      line-height: 25px;
    }
    .label-one { top: 303px; left: 21px; }
    .explanation {
      position: absolute;
      margin: 0;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 19px;
      line-height: 23px;
      font-weight: normal;
    }
    .explanation-one {
      top: 351px;
      left: 22px;
      width: 499px;
    }
    .quote-two {
      top: 484px;
      left: 34px;
      width: 471px;
      font-size: 34px;
      line-height: 40px;
    }
    .label-two { top: 592px; left: 35px; }
    .explanation-two {
      top: 640px;
      left: 35px;
      width: 476px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="logo" aria-label="人民日报 RENMIN RIBAO">
        <div class="logo-name"><span class="large">人</span>民日<span class="large">报</span></div>
        <div class="logo-subtitle">RENMIN RIBAO</div>
      </div>
      <div class="header-right">
        <div class="category">金句<span class="separator">|</span>摘抄</div>
        <div class="theme">心态主题</div>
      </div>
    </header>

    <h1 class="quote quote-one">且行且忘且随风，<br>且行且看且从容。</h1>
    <p class="label label-one">释义:</p>
    <p class="explanation explanation-one">意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从<br>容不迫。引申意思就是当我们遇到非常不平静的时候，只<br>要能有一个平静的心态，才能找出平静的办法去解决，讲<br>的是从容面对的淡定心态。人生百味，浓缩到最后，就是<br>一个淡字，正确地选择与取舍，是一生必修的功课。</p>

    <h2 class="quote quote-two">我将玫瑰藏于身后风起花落，<br>从此鲜花赠自己，<br>纵马踏花向自由。</h2>
    <p class="label label-two">释义:</p>
    <p class="explanation explanation-two">我把心中的的美好向往藏在身后，当面对现实的时候美<br>好的向往会随着花儿掉落，而从此以后美好赠送给自<br>己，骑着马儿迎着美好向往自由。</p>
  </main>
</body>
</html>
