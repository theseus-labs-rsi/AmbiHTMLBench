<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期末质量分析会</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; }
.page {
  position: relative;
  width: 540px;
  height: 540px;
  overflow: hidden;
  color: #07356d;
  font-family: "SimSun", "Songti SC", serif;
  background: #f4f1ec;
}
.wash {
  position: absolute;
  inset: 0 0 auto;
  height: 293px;
  background:
    radial-gradient(ellipse at 0% 82%, rgba(121,192,171,.48), transparent 49%),
    radial-gradient(ellipse at 100% 96%, rgba(122,198,176,.43), transparent 28%);
}
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #547f69;
  font: 12px "SimSun", serif;
  text-align: center;
}
.leaves { top: 0; right: 0; width: 166px; height: 110px; }
.flowers { top: 224px; left: 0; width: 194px; height: 118px; }
.year {
  position: absolute;
  top: 56px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 22px;
  line-height: 28px;
}
h1 {
  position: absolute;
  top: 95px;
  left: 56px;
  margin: 0;
  white-space: nowrap;
  font-family: "SimHei", "Microsoft YaHei", sans-serif;
  font-size: 29px;
  font-weight: 700;
  letter-spacing: 1px;
}
h2 {
  position: absolute;
  top: 143px;
  left: 0;
  width: 510px;
  margin: 0;
  text-align: center;
  color: #f00000;
  font-family: "SimHei", "Microsoft YaHei", sans-serif;
  font-size: 24px;
  line-height: 30px;
}
.school, .presenter {
  position: absolute;
  left: 0;
  width: 512px;
  text-align: center;
  font-size: 16px;
}
.school { top: 188px; }
.presenter { top: 224px; }
.watermark {
  position: absolute;
  z-index: 4;
  color: #fff;
  font: bold 16px Arial, "Microsoft YaHei", sans-serif;
  -webkit-text-stroke: 2px #151515;
  paint-order: stroke fill;
}
.watermark.top { top: 51px; left: 300px; transform: rotate(39deg); }
.watermark.middle { top: 150px; left: 130px; }
.watermark.lower { top: 292px; left: 192px; font-size: 13px; }
.section-title {
  position: absolute;
  top: 288px;
  left: 56px;
  margin: 0;
  color: #111b0c;
  font-size: 22px;
  letter-spacing: 3px;
  line-height: 27px;
}
.columns {
  position: absolute;
  top: 362px;
  left: 33px;
  width: 472px;
  display: grid;
  grid-template-columns: 112px 112px 112px 113px;
  gap: 8px;
}
.column { position: relative; }
.label {
  position: relative;
  height: 32px;
  margin-left: 2px;
  margin-right: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #00837f;
  color: #f5f2e9;
  white-space: nowrap;
  font-size: 14px;
}
.column:not(:last-child) .label::after {
  content: "";
  position: absolute;
  left: 100%;
  top: 0;
  width: 14px;
  height: 32px;
  background: #00837f;
  clip-path: polygon(0 0, 0 10%, 100% 50%, 0 100%, 0 75%, 43% 50%, 0 25%);
}
.box {
  position: relative;
  margin-top: 35px;
  height: 95px;
  border: 2px solid #008b83;
  border-radius: 18px;
  background: #f4f1ec;
  color: #252525;
  padding: 7px 5px 3px;
  font-size: 14px;
  line-height: 16px;
}
.box::before {
  content: "";
  position: absolute;
  width: 29px;
  height: 23px;
  top: -23px;
  left: 17px;
  background: #008b83;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.box::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 21px;
  top: -19px;
  left: 19px;
  background: #f4f1ec;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.column:nth-child(1) .box { margin-top: 36px; }
.column:nth-child(2) .box { margin-top: 34px; }
.column:nth-child(3) .box { margin-top: 34px; }
.column:nth-child(4) .box { margin-top: 34px; padding-top: 12px; }
.column:nth-child(4) .box::before { left: 59px; }
.column:nth-child(4) .box::after { left: 61px; }
</style>
</head>
<body>
<main class="page">
  <div class="wash"></div>
  <div class="placeholder leaves">[装饰图：右上角绿叶]</div>
  <div class="placeholder flowers">[装饰图：左侧花卉、枝叶与小鸟]</div>

  <div class="year">2022--2023学年第[?]学期</div>
  <h1>追光而遇有思　沐光而行致远</h1>
  <h2>小[illegible]期末质量分析会</h2>
  <div class="school">红[?]街道实验XXXX</div>
  <div class="presenter">海淀小萌</div>

  <div class="watermark top">@海淀小萌</div>
  <div class="watermark middle">@海淀小萌</div>

  <h3 class="section-title">期末考试成绩</h3>
  <div class="watermark lower">@海淀小萌</div>

  <section class="columns">
    <div class="column">
      <div class="label">注重基础和积累</div>
      <div class="box">尤其是古诗文和<br>名言警句积累占<br>的比例很大，反<br>映了对传统文化<br>的重视。</div>
    </div>
    <div class="column">
      <div class="label">重视运用</div>
      <div class="box">突出能力，重视<br>运用。阅读题体<br>现了核心素养中<br>重视思维发展与<br>提升的要求。</div>
    </div>
    <div class="column">
      <div class="label">联系生活原则</div>
      <div class="box">写作的安排正是<br>学生生活中外出<br>的经历，易于选<br>材，适合个性发<br>展。</div>
    </div>
    <div class="column">
      <div class="label">难易程度适中</div>
      <div class="box">只要认真积累和<br>复习的孩子基本<br>上可以取得不错<br>的成绩。</div>
    </div>
  </section>
</main>
</body>
</html>
