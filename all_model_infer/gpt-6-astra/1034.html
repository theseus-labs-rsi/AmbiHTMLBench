<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三大核心参数解读</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; color: #080808; }
    .page { position: relative; width: 540px; height: 720px; overflow: hidden; background: white; }
    .binding { position: absolute; top: 14px; left: -12px; display: flex; gap: 36px; }
    .hole { width: 24px; height: 24px; flex: 0 0 24px; border: 1px solid #c8c8c8; border-radius: 50%; box-shadow: inset 0 2px 3px #aaa; background: #fff; }
    header { position: absolute; top: 58px; left: 108px; width: 325px; text-align: center; }
    h1 { margin: 0; font-size: 36px; line-height: 51px; font-weight: 400; white-space: nowrap; }
    .subtitle { margin-top: 8px; font-size: 18px; line-height: 27px; color: #333; letter-spacing: 1px; white-space: nowrap; }
    .step { position: absolute; top: 72px; left: 0; width: 43px; height: 108px; overflow: hidden; border-radius: 0 6px 6px 0; background: #4d303e; color: #fff; display: flex; align-items: center; justify-content: center; }
    .step span { writing-mode: vertical-rl; font-weight: bold; font-size: 25px; letter-spacing: 1px; }
    .section { position: absolute; display: grid; align-items: start; }
    .memory { top: 212px; left: 40px; grid-template-columns: 56px 390px; column-gap: 24px; }
    .processor { top: 374px; left: 35px; grid-template-columns: 73px 386px; column-gap: 16px; }
    .resolution { top: 537px; left: 39px; grid-template-columns: 46px 394px; column-gap: 28px; }
    h2 { font-weight: 400; font-size: 23px; line-height: 31px; margin: 0 0 2px; }
    p { margin: 0; font-size: 17px; line-height: 24px; letter-spacing: 1px; white-space: nowrap; }
    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #353535; }
    .memory-icon { width: 56px; height: 72px; margin-top: 5px; border: 4px solid #353535; border-radius: 8px; font-size: 11px; text-align: center; }
    .cpu-icon { width: 73px; height: 73px; margin-top: 4px; border: 7px dotted #353535; border-radius: 10px; text-align: center; }
    .cpu-icon strong { font-size: 19px; }
    .cpu-icon small { font-size: 9px; }
    .resolution-icon { width: 46px; height: 73px; margin-top: 4px; border: 4px solid #353535; border-radius: 6px; overflow: hidden; font-family: Arial, sans-serif; font-weight: 900; }
    .resolution-icon span { width: 100%; text-align: center; font-size: 23px; line-height: 32px; }
    .resolution-icon .uhd { background: #353535; color: white; font-size: 21px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="binding" aria-hidden="true">
      <i class="hole"></i><i class="hole"></i><i class="hole"></i>
      <i class="hole"></i><i class="hole"></i><i class="hole"></i>
      <i class="hole"></i><i class="hole"></i><i class="hole"></i>
      <i class="hole"></i>
    </div>

    <div class="step placeholder" aria-label="彩色步骤标签"><span>第二步</span></div>

    <header>
      <h1>三大核心参数解读</h1>
      <div class="subtitle">内存/芯片/分辨率参数解读</div>
    </header>

    <section class="section memory">
      <div class="placeholder memory-icon">[存储卡图标]</div>
      <div>
        <h2>1.看内存</h2>
        <p>内存越大速度越快，小于8GB不建议购买。（画圈：<br>GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）</p>
      </div>
    </section>

    <section class="section processor">
      <div class="placeholder cpu-icon">
        <strong>CPU</strong>
        <small>[芯片图标]</small>
      </div>
      <div>
        <h2>2.看芯片</h2>
        <p>主流芯片A73和A53。追求性能玩游戏选A73，看<br>看电视想省电选A53。</p>
      </div>
    </section>

    <section class="section resolution">
      <div class="placeholder resolution-icon" aria-label="4K UHD图标占位">
        <span>4K</span>
        <span class="uhd">UHD</span>
      </div>
      <div>
        <h2>3.看分辨率</h2>
        <p>分辨率越高越清晰。（目前电视基本都是超高清4K<br>也就是3840×2160的分辨率）</p>
      </div>
    </section>
  </main>
</body>
</html>
