<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钩针工具选择指南</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #161616; }
    .page { width: 540px; height: 540px; overflow: hidden; margin: 0 auto; }
    .title-block {
      height: 85px;
      background: #67827b;
      color: #fff;
      text-align: center;
      padding-top: 13px;
      border-bottom: 3px solid #faf3f1;
    }
    h1 { margin: 0; font-size: 27px; line-height: 35px; font-weight: 700; letter-spacing: 1px; }
    .subtitle { margin-top: 2px; font-size: 15px; line-height: 23px; color: #e9edeb; }
    table { width: 540px; border-collapse: collapse; table-layout: fixed; text-align: center; }
    col.tool { width: 88px; }
    col.purpose { width: 219px; }
    col.advice { width: 138px; }
    col.picture { width: 95px; }
    th {
      height: 58px;
      background: #67827b;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border-right: 4px solid #faf3f1;
      border-bottom: 4px solid #faf3f1;
      padding: 0;
    }
    td {
      padding: 0;
      border-right: 4px solid #fcf5f3;
      border-bottom: 4px solid #fcf5f3;
      vertical-align: middle;
      font-size: 15px;
      line-height: 20.5px;
      font-weight: 400;
    }
    th:last-child, td:last-child { border-right: 0; }
    .hook { height: 138px; }
    .yarn { height: 113px; }
    .scissors { height: 79px; }
    .needle { height: 69px; }
    .tool-name { font-weight: 700; }
    .required { color: #d97963; font-weight: 700; }
    .purpose-text { padding: 0 10px; }
    .advice-text { padding: 0 6px; }
    .placeholder {
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      background: #fafafa;
      font-size: 11px;
      line-height: 16px;
      font-weight: 400;
    }
    .hook-photo { width: 79px; height: 55px; }
    .yarn-photo { width: 80px; height: 64px; }
    .scissors-photo { width: 60px; height: 66px; }
    .needle-photo { width: 77px; height: 64px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="title-block">
      <h1>钩针工具选择指南</h1>
      <div class="subtitle">——only手作集——</div>
    </header>
    <table aria-label="钩针工具选择指南">
      <colgroup>
        <col class="tool">
        <col class="purpose">
        <col class="advice">
        <col class="picture">
      </colgroup>
      <thead>
        <tr>
          <th>工具</th>
          <th>用途</th>
          <th>初学者建议</th>
          <th>实物图</th>
        </tr>
      </thead>
      <tbody>
        <tr class="hook">
          <td><span class="tool-name">钩针</span><br><span class="required">（必备）</span></td>
          <td class="purpose-text">钩针是钩针编织的必备工具，<br>有多种尺寸与规格，具体如何<br>选择可参考《钩针毛线对照<br>表》、《如何选择钩针和毛<br>线》</td>
          <td class="advice-text">3mm左右的钩针<br>最实用</td>
          <td><div class="placeholder hook-photo">[图片：彩色钩针]</div></td>
        </tr>
        <tr class="yarn">
          <td><span class="tool-name">毛线</span><br><span class="required">（必备）</span></td>
          <td class="purpose-text">毛线种类很多，新手建议选择<br>股数较少的，可减少失误次<br>数。具体如何选择参考《如何<br>选择钩针和毛线》</td>
          <td class="advice-text">中粗的宝宝棉/牛<br>奶棉</td>
          <td><div class="placeholder yarn-photo">[图片：篮装毛线球]</div></td>
        </tr>
        <tr class="scissors">
          <td><span class="tool-name">剪刀</span><br><span class="required">（必备）</span></td>
          <td class="purpose-text">剪断编织过程中的编织线</td>
          <td>必备</td>
          <td><div class="placeholder scissors-photo">[图片：剪刀]</div></td>
        </tr>
        <tr class="needle">
          <td><span class="tool-name">缝合针</span></td>
          <td class="purpose-text">缝合、修补和连接编织面料</td>
          <td>非必须</td>
          <td><div class="placeholder needle-photo">[图片：彩色缝合针]</div></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
