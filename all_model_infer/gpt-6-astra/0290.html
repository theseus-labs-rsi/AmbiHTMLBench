<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anything’s Possible — Prime Video</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #ecd0da; font-family: Arial, Helvetica, sans-serif; }
.poster {
  position: relative;
  width: 510px;
  height: 755px;
  margin: 0 auto;
  padding: 19px;
  background: #ecd0da;
}
.sheet {
  position: relative;
  width: 472px;
  height: 717px;
  overflow: hidden;
  background: #fff;
}
.prime {
  position: absolute;
  top: 3px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #080909;
  font-size: 45px;
  line-height: 52px;
  font-weight: 750;
  letter-spacing: -1.2px;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #777;
  font: 11px/1.35 Arial, sans-serif;
}
.smile {
  position: absolute;
  left: 176px;
  top: 54px;
  width: 120px;
  height: 28px;
}
.portrait {
  position: absolute;
  left: 32px;
  top: 105px;
  width: 391px;
  height: 534px;
  background: #f8f8f8;
}
.director-intro {
  position: absolute;
  top: 99px;
  left: 110px;
  width: 252px;
  color: #101b4d;
  text-align: center;
  font-size: 9px;
  line-height: 13px;
  letter-spacing: 1.2px;
}
.director-intro strong {
  display: block;
  font-size: 13px;
  letter-spacing: 1.5px;
  font-weight: 800;
}
.tagline {
  position: absolute;
  top: 134px;
  left: 203px;
  width: 70px;
  text-align: center;
  color: #bd4b95;
  font-size: 10px;
  letter-spacing: 1px;
  line-height: 17px;
}
.title {
  position: absolute;
  top: 535px;
  left: 31px;
  width: 410px;
  height: 102px;
  display: flex;
  align-items: center;
  white-space: nowrap;
}
.anything {
  position: relative;
  z-index: 1;
  color: #29216b;
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: 53px;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -4px;
  line-height: 1.35;
}
.possible {
  color: #cb328c;
  font-size: 57px;
  font-weight: 800;
  letter-spacing: -3px;
  margin-left: -2px;
}
.credits {
  position: absolute;
  top: 640px;
  left: 50px;
  right: 51px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #111d51;
  white-space: nowrap;
}
.credit {
  display: flex;
  align-items: center;
  gap: 3px;
}
.credit-label {
  font-size: 5px;
  line-height: 5px;
  color: #9c85b4;
  text-align: right;
}
.credit-name {
  font-size: 13px;
  line-height: 15px;
  letter-spacing: 1.4px;
  font-weight: 800;
}
.footer {
  position: absolute;
  left: 11px;
  right: 11px;
  bottom: 5px;
  height: 39px;
  display: flex;
  align-items: center;
}
.orion { width: 38px; height: 22px; margin-right: 17px; font-size: 9px; color: #ad95c5; }
.ua { width: 20px; height: 22px; margin-right: 23px; font-size: 12px; color: #ad95c5; }
.release {
  display: flex;
  height: 37px;
  align-items: center;
  color: #080909;
  white-space: nowrap;
}
.date { font-size: 23px; font-weight: 700; letter-spacing: .6px; }
.divider { height: 37px; width: 3px; background: #080909; margin: 0 15px 0 13px; }
.new-movie { font-size: 22px; letter-spacing: 1px; }
.rating { width: 32px; height: 16px; margin-left: 14px; font-size: 5px; color: #b29ac8; }
.amazon { margin-left: 14px; width: 40px; font-size: 5px; line-height: 8px; letter-spacing: 2px; text-align: center; color: #ae96c0; }
</style>
</head>
<body>
<main class="poster" aria-label="Anything’s Possible movie poster">
  <div class="sheet">
    <div class="prime">prime video</div>
    <div class="placeholder smile">[Prime Video smile logo]</div>

    <figure class="placeholder portrait" style="margin:0;">[Photo: a young woman on the left and a young man on the right, standing back-to-back]</figure>

    <div class="director-intro">
      FROM THE HEART &amp; SOUL OF DIRECTOR
      <strong>BILLY PORTER</strong>
    </div>

    <div class="tagline">WHEN IT<br>COMES<br>TO LOVE...</div>

    <div class="title">
      <span class="anything">anything’s</span><span class="possible">possible</span>
    </div>

    <div class="credits">
      <div class="credit">
        <span class="credit-label">WRITTEN<br>BY</span>
        <span class="credit-name">XIMENA GARCÍA LECUONA</span>
      </div>
      <div class="credit">
        <span class="credit-label">DIRECTED<br>BY</span>
        <span class="credit-name">BILLY PORTER</span>
      </div>
    </div>

    <div class="footer">
      <div class="placeholder orion">[ORION logo]</div>
      <div class="placeholder ua">[UA logo]</div>
      <div class="release">
        <span class="date">JULY 22</span>
        <span class="divider"></span>
        <span class="new-movie">NEW MOVIE</span>
      </div>
      <div class="placeholder rating">[Rating mark: illegible]</div>
      <div class="amazon">AMAZON<br>STUDIOS</div>
    </div>
  </div>
</main>
</body>
</html>
