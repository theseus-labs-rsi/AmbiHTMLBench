<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Up in the Biz — Documentary Film</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
}
.poster {
  width: 503px;
  height: 746px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#bcb29f 0%, #faf7e9 25%, #faf7e9 75%, #000 82%);
}
.topline {
  position: absolute;
  top: 17px;
  left: 138px;
  margin: 0;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 3.6px;
  white-space: nowrap;
}
.festival {
  position: absolute;
  top: 18px;
  left: 33px;
  width: 76px;
  height: 48px;
  color: white;
  text-align: center;
  font-weight: bold;
}
.festival-name { margin-top: 9px; font-size: 8px; line-height: 8px; }
.festival-year { margin-top: 3px; font-size: 13px; line-height: 13px; }
.festival-selection { font-size: 3.8px; letter-spacing: .25px; }
.laurels {
  position: absolute;
  inset: 0;
  width: 76px;
  height: 48px;
  border-left: 3px dotted rgba(255,255,255,.75);
  border-right: 3px dotted rgba(255,255,255,.75);
  border-radius: 45%;
}
.laurels span {
  position: absolute;
  top: 47px;
  left: 0;
  width: 76px;
  font-size: 5px;
  font-weight: normal;
}
.credit {
  position: absolute;
  top: 51px;
  left: 0;
  width: 100%;
  margin: 0;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}
.portrait {
  position: absolute;
  top: 81px;
  left: 0;
  width: 503px;
  height: 523px;
  margin: 0;
  background: linear-gradient(to bottom, #a5a59e, #434440 42%, #777973 76%, #000);
  color: #eee;
}
.portrait figcaption {
  position: absolute;
  top: 388px;
  left: 75px;
  width: 353px;
  text-align: center;
  font-size: 12px;
  line-height: 17px;
}
.title {
  position: absolute;
  top: 128px;
  left: 0;
  width: 100%;
  margin: 0;
  text-align: center;
  color: #ebc52e;
}
.title-small {
  display: block;
  font-size: 41px;
  line-height: 49px;
  font-weight: 900;
  letter-spacing: -1.8px;
}
.title-large {

  margin-top: -12px;

  font-size: 215px;
  font-weight: 900;
  font-style: normal;
  line-height: .83;
  letter-spacing: -16px;
  padding-right: 15px;
}
.subtitle {
  position: absolute;
  top: 384px;
  left: 0;
  width: 100%;
  margin: 0;
  text-align: center;
  color: #efbf24;
  font-size: 18px;
  font-weight: 700;
  line-height: 20px;
}
.footer {
  position: absolute;
  left: 0;
  top: 604px;
  width: 503px;
  height: 142px;
  background: #000;
  color: #fff;
  text-align: center;
}
.release {
  margin: 3px 0 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 3.2px;
  line-height: 22px;
}
.brands {
  height: 48px;
  margin-top: 11px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
}
.showtime {
  font-family: Impact, 'Arial Narrow', sans-serif;
  font-stretch: condensed;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -2px;
  transform: scaleX(.87);
  transform-origin: right center;
}
.showtime sup { font: 6px Arial, sans-serif; letter-spacing: 0; }
.divider { height: 45px; width: 3px; background: #fff; }
.paramount { width: 159px; position: relative; padding-top: 9px; }
.streaming {
  position: absolute;
  top: 1px;
  left: 39px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.4px;
  white-space: nowrap;
}
.paramount-name {
  font-family: 'Brush Script MT', 'URW Chancery L', cursive;
  font-style: italic;
  font-weight: 700;
  font-size: 33px;
  line-height: 36px;
  letter-spacing: -2px;
}
.plan {
  position: absolute;
  bottom: 3px;
  left: 0;
  width: 100%;
  margin: 0;
  color: #d0d0d0;
  font-size: 13px;
  line-height: 16px;
}
.plan .with { font-size: 10px; }

<body>
<main class="poster" aria-label="All Up in the Biz documentary film poster">
  <div class="festival">
    <div class="placeholder laurels"><span>[Festival laurels]</span></div>
    <div class="festival-name">TRIBECA<br>FESTIVAL</div>
    <div class="festival-year">2023</div>
    <div class="festival-selection">OFFICIAL SELECTION</div>
  </div>
  <p class="topline">SHOWTIME ORIGINAL</p>
  <p class="credit">A SACHA JENKINS JAMMIE</p>
  <figure class="placeholder portrait">
    <figcaption>[Black-and-white photograph: close-up of Biz Markie wearing a cap]</figcaption>
  </figure>
  <h1 class="title">
    <span class="title-small">ALL UP IN THE</span>
    <span class="title-large">BIZ</span>
  </h1>
  <p class="subtitle">THE LIFE AND RHYMES<br>OF BIZ MARKIE</p>
  <section class="footer">
    <p class="release">DOCUMENTARY FILM<br>AUGUST 11</p>
    <div class="brands">
      <div class="showtime">SHOWTIME<sup>®</sup></div>
      <div class="divider"></div>
      <div class="paramount">
        <span class="streaming">STREAMING ON</span>
        <span class="paramount-name">Paramount+</span>
      </div>
    </div>
    <p class="plan">PARAMOUNT+ <span class="with">WITH</span> SHOWTIME PLAN ONLY</p>
  </section>
</main>
