<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f8f7eb;
  color: #a49b80;
  font-family: "STSong", "SimSun", "Songti SC", serif;
}
.page {
  width: 540px;
  height: 769px;
  margin: 0 auto;
  position: relative;
  background: #faf9ee;
}
.navigation {
  height: 24px;
  display: flex;
  align-items: center;
  background: #c9b797;
  border-bottom: 1px solid #b3a487;
  color: #8b7b60;
  font-size: 10px;
  letter-spacing: 2px;
}
.navigation .subjects {
  width: 359px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-right: 1px solid #ac9a7a;
}
.navigation .essay {
  width: 77px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid #ac9a7a;
}
.navigation .other {
  flex: 1;
  display: flex;
  justify-content: space-around;
  letter-spacing: 1px;
}
h1 {
  margin: 13px 0 8px 9px;
  height: 20px;
  font-size: 15px;
  line-height: 20px;
  letter-spacing: 5px;
  font-weight: normal;
}
h1 .dot { letter-spacing: 0; margin-right: 7px; }
.sheet {
  position: absolute;
  left: 7px;
  top: 65px;
  width: 526px;
  height: 686px;
  border: 1px solid #d2d1c2;
  font-size: 10px;
  letter-spacing: 2px;
}
.shaded { background: rgba(212, 213, 195, 0.19); }
.line {
  height: 30px;
  border-bottom: 1px solid #d2d1c2;
  display: flex;
  align-items: center;
  padding-left: 10px;
}
.line:first-child { height: 31px; padding-left: 20px; }
.comment-options {
  height: 111px;
  display: grid;
  grid-template-columns: 59px 1fr;
  border-bottom: 1px solid #d2d1c2;
}
.options {
  border-right: 1px solid #d2d1c2;
  padding: 5px 0 5px 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
}
.option { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.circle {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 1px solid #d5d4c6;
  border-radius: 50%;
  flex: 0 0 10px;
}
.analysis {
  height: 223px;
  display: grid;
  grid-template-columns: 297px 1fr;
  border-bottom: 1px solid #d2d1c2;
}
.analysis-left { border-right: 1px solid #d2d1c2; }
.analysis-heading {
  height: 30px;
  border-bottom: 1px solid #d2d1c2;
  display: flex;
  align-items: center;
  justify-content: center;
}
.analysis-left .analysis-heading { justify-content: space-around; }
.analysis-heading .option { gap: 8px; }
.transfer {
  display: grid;
  grid-template-columns: 59px 1fr;
  border-bottom: 1px solid #d2d1c2;
}
.sentences { height: 90px; }
.methods { height: 81px; }
.transfer-label {
  border-right: 1px solid #d2d1c2;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 1px;
}
.review {
  height: 29px;
  display: flex;
  align-items: center;
  padding-left: 17px;
}
.placeholder {
  position: absolute;
  right: 6px;
  bottom: 3px;
  width: 74px;
  height: 23px;
  color: #d4d2c7;
  font-size: 8px;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>
<body>
<main class="page">
  <nav class="navigation" aria-label="分类">
    <div class="subjects">
      <span>行测</span><span>&gt;</span><span>常识</span><span>言语</span><span>数量</span><span>判断</span><span>资料</span>
    </div>
    <div class="essay">申论</div>
    <div class="other"><span>[illegible]</span><span>计划</span></div>
  </nav>

  <h1><span class="dot">·</span>晨读笔记</h1>

  <section class="sheet">
    <div class="line shaded">主题</div>
    <div class="line shaded">应用领域</div>
    <div class="line shaded">热门事件</div>
    <div class="line shaded">宏观政策</div>
    <div class="line shaded">媒体评论</div>

    <div class="comment-options">
      <div class="options shaded">
        <div class="option"><span class="circle"></span><span>意义</span></div>
        <div class="option"><span class="circle"></span><span>原因</span></div>
        <div class="option"><span class="circle"></span><span>问题</span></div>
        <div class="option"><span class="circle"></span><span>危害</span></div>
      </div>
      <div></div>
    </div>

    <div class="analysis">
      <div class="analysis-left">
        <div class="analysis-heading shaded">
          <div class="option"><span class="circle"></span><span>问题分析</span></div>
          <div class="option"><span class="circle"></span><span>原因分析</span></div>
        </div>
      </div>
      <div class="analysis-right">
        <div class="analysis-heading shaded">对策分析</div>
      </div>
    </div>

    <div class="transfer sentences">
      <div class="transfer-label shaded">句子迁移</div>
      <div></div>
    </div>
    <div class="transfer methods">
      <div class="transfer-label shaded">方法迁移</div>
      <div></div>
    </div>
    <div class="review shaded">复盘</div>
  </section>

  <div class="placeholder">[Logo: bottom-right]</div>
</main>
</body>
</html>
