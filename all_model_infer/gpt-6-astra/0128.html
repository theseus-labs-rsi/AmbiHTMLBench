<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原则题答题模板</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #292a29; }
.page {
  position: relative;
  width: 540px;
  height: 675px;
  overflow: hidden;
  padding: 32px 30px 20px 34px;
  color: #e7e7e7;
  background-color: #292a29;
  background-image: radial-gradient(circle, rgba(255,255,255,.018) 1px, transparent 2px);
  background-size: 9px 9px;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
}
h1 {
  position: relative;
  z-index: 2;
  margin: 0 0 7px;
  color: #ffcb29;
  font-size: 32px;
  font-weight: 600;
  line-height: 61px;
  white-space: nowrap;
}
h1 .number { font-style: italic; }
.text {
  position: relative;
  z-index: 2;
  font-size: 23px;
  font-weight: 400;
  line-height: 41.6px;
  letter-spacing: 0;
}
p { margin: 0; white-space: nowrap; }
.placeholder {
  position: absolute;
  z-index: 1;
  width: 265px;
  height: 65px;
  transform: rotate(-39deg);
  color: rgba(0, 126, 66, .23);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  text-align: center;
}
.watermark-one { left: 137px; top: 301px; }
.watermark-two { left: 163px; top: 532px; }
</style>
</head>
<body>
<main class="page">
  <div class="placeholder watermark-one">[Watermark: diagonal green text, illegible]</div>
  <div class="placeholder watermark-two">[Watermark: diagonal green text, illegible]</div>
  <h1><span class="number">7.</span>当题目中出现“原则”时，可用<br>以下模板：</h1>
  <section class="text">
    <p>(一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展</p>
    <p>(二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教</p>
    <p>（三）科学性原则。...能给幼儿正确的启蒙教<br>育</p>
    <p>(四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点</p>
    <p>（五）整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展</p>
    <p>（六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主</p>
  </section>
</main>
</body>
</html>
