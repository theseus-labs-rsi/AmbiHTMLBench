<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营48个必备工具</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #2c5343; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #f9faf1; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  background: #2c5343;
  overflow: hidden;
}
h1 {
  position: absolute;
  left: 45px;
  top: 59px;
  margin: 0;
  font-size: 58px;
  line-height: 1.25;
  font-weight: 600;
  white-space: nowrap;
}
h1 .brand { letter-spacing: 5px; }
h1 .second { display: block; letter-spacing: 1px; }
.credit {
  position: absolute;
  left: 38px;
  top: 224px;
  width: 210px;
  height: 34px;
  background: #e0b800;
  padding-left: 11px;
  font-size: 19px;
  font-weight: 700;
  line-height: 34px;
  white-space: nowrap;
}
.tools {
  position: absolute;
  left: 37px;
  top: 291px;
  width: 460px;
  height: 370px;
  display: grid;
  grid-template-columns: 98px 13px 116px 14px 103px 13px 103px;
  grid-template-rows: 96px 11px 12px 12px 113px 13px 4px 12px 96px 2px;
}
.part {
  padding: 9px 12px;
  border: 1px solid rgba(225, 239, 199, .08);
  background: #849975;
}
.label {
  font-size: 18px;
  line-height: 25px;
  font-weight: 400;
  white-space: nowrap;
}
.content {
  margin-top: 9px;
  font-size: 20px;
  line-height: 25px;
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: -.5px;
}
.part01 { grid-column: 1; grid-row: 1 / 8; }
.part02 { grid-column: 3; grid-row: 1; padding-left: 15px; }
.part03 { grid-column: 3; grid-row: 3 / 8; padding-left: 15px; }
.part04 { grid-column: 1 / 4; grid-row: 9; }
.part05 { grid-column: 5 / 8; grid-row: 1 / 4; padding-left: 15px; }
.part06 { grid-column: 5; grid-row: 5 / 10; padding-left: 15px; }
.part07 { grid-column: 7; grid-row: 5; }
.part08 { grid-column: 7; grid-row: 7 / 11; }
.part05, .part06, .part07, .part08 { background: #60995d; }
.part04 .content { margin-top: 10px; font-size: 19px; }
</style>
</head>
<body>
<main class="page">
  <h1><span class="brand">TikTok</span>运营<span class="second">48个必备工具</span></h1>
  <div class="credit">@ 徐徐教你做TikTok</div>
  <section class="tools" aria-label="必备工具分类">
    <div class="part part01">
      <div class="label">Part 01</div>
      <div class="content">7个TK<br>数据平台</div>
    </div>
    <div class="part part02">
      <div class="label">Part 02</div>
      <div class="content">3个好用<br>选品网站</div>
    </div>
    <div class="part part03">
      <div class="label">Part 03</div>
      <div class="content">5个视频<br>素材网站</div>
    </div>
    <div class="part part04">
      <div class="label">Part 04</div>
      <div class="content">6个TK数据分析网站</div>
    </div>
    <div class="part part05">
      <div class="label">Part 05</div>
      <div class="content">4个剪辑<br>4个翻译软件</div>
    </div>
    <div class="part part06">
      <div class="label">Part 06</div>
      <div class="content">8个TK<br>传输管理<br>网站</div>
    </div>
    <div class="part part07">
      <div class="label">Part 07</div>
      <div class="content">5个BGM<br>网站</div>
    </div>
    <div class="part part08">
      <div class="label">Part 08</div>
      <div class="content">7个投放<br>联盟网站</div>
    </div>
  </section>
</main>
</body>
</html>
