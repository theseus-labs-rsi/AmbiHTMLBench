<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰州旅行文案</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body { font-family: "Songti SC", SimSun, serif; color: #454545; }
.page {
  width: 540px;
  height: 720px;
  margin: 0 auto;
  padding: 0 15px;
  display: grid;
  grid-template-columns: repeat(3, 152px);
  column-gap: 27px;
  position: relative;
  background: #fff;
}
.column { position: relative; height: 720px; }
.zone { position: absolute; width: 152px; text-align: center; }
h2, p { margin: 0; font-weight: normal; }
h2 { font-size: 7.5px; line-height: 11px; white-space: nowrap; }
.pin { font-family: sans-serif; font-size: 8px; }
.quote { position: absolute; width: 170px; left: -9px; font-size: 7.3px; line-height: 11px; white-space: nowrap; }
.placeholder {
  position: absolute;
  left: 0;
  width: 152px;
  height: 152px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: #f4f4f2;
  border: 1px solid #dededb;
  color: #777;
  font-family: sans-serif;
  font-size: 10px;
  line-height: 1.6;
  text-align: center;
}
.top-left { top: 30px; }
.top-left .quote { top: 18px; }
.top-left .placeholder { top: 44px; }
.top-center { top: 20px; }
.top-center .quote { top: 28px; }
.top-center .placeholder { top: 53px; }
.top-right { top: 18px; }
.top-right .quote { top: 18px; }
.top-right .placeholder { top: 45px; left: -3px; width: 157px; height: 157px; }
.middle { top: 261px; }
.middle .quote { top: 26px; }
.middle .placeholder { top: 53px; }
.bottom-left { top: 499px; }
.bottom-left .quote { top: 27px; }
.bottom-left .placeholder { top: 54px; }
.bottom-center, .bottom-right { top: 509px; }
.bottom-center .quote, .bottom-right .quote { top: 18px; }
.bottom-center .placeholder, .bottom-right .placeholder { top: 45px; }
.main-title {
  position: absolute;
  top: 302px;
  left: 65px;
  width: 22px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: KaiTi, STKaiti, "Kaiti SC", serif;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0;
  line-height: 22px;
  color: #a52530;
}
</style>
</head>
<body>
<main class="page">
  <div class="column">
    <section class="zone top-left">
      <h2><span class="pin">📍</span>金城兰州</h2>
      <p class="quote">“淌不完的黄河水向东流”</p>
      <figure class="placeholder">[照片拼贴：兰州城市风光]</figure>
    </section>
    <section class="zone middle">
      <h2><span class="pin">📍</span>[illegible]</h2>
      <p class="quote">“繁华城市背后的另一面”</p>
      <figure class="placeholder">[照片拼贴：街巷、店铺与人物]</figure>
    </section>
    <section class="zone bottom-left">
      <h2><span class="pin">📍</span>白塔山公园</h2>
      <p class="quote">“[illegible]在西北 看最美河水”</p>
      <figure class="placeholder">[照片拼贴：白塔山公园]</figure>
    </section>
  </div>

  <div class="column">
    <section class="zone top-center">
      <h2><span class="pin">📍</span>中山桥</h2>
      <p class="quote">“陌生的人 请给我一支兰州”</p>
      <figure class="placeholder">[照片拼贴：中山桥与黄河景色]</figure>
    </section>
    <h1 class="main-title">兰州旅行文案</h1>
    <section class="zone bottom-center">
      <h2><span class="pin">📍</span>兰山公园</h2>
      <p class="quote">“白天[illegible] 晚上最绚烂”</p>
      <figure class="placeholder">[照片拼贴：兰山公园与城市夜景]</figure>
    </section>
  </div>

  <div class="column">
    <section class="zone top-right">
      <h2><span class="pin">📍</span>兰州美食</h2>
      <p class="quote">“四方食事 不过一碗人间烟火”</p>
      <figure class="placeholder">[照片拼贴：兰州美食与饮品]</figure>
    </section>
    <section class="zone middle">
      <h2><span class="pin">📍</span>甘肃省博物馆</h2>
      <p class="quote">“[illegible] 传丝路文明”</p>
      <figure class="placeholder">[照片拼贴：甘肃省博物馆展品]</figure>
    </section>
    <section class="zone bottom-right">
      <h2><span class="pin">📍</span>正宁路小吃街</h2>
      <p class="quote">“人间烟火气 最抚凡人心”</p>
      <figure class="placeholder">[照片拼贴：正宁路小吃街摊位与美食]</figure>
    </section>
  </div>
</main>
</body>
</html>
