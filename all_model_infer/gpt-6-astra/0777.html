<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三页</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #ecebe7; }
.page {
  position: relative;
  width: 540px;
  height: 405px;
  overflow: hidden;
  background:
    linear-gradient(90deg, transparent 32%, rgba(60,58,49,.13) 36.8%, rgba(255,255,255,.35) 37.5%, rgba(77,74,65,.14) 38.4%, transparent 43%),
    linear-gradient(110deg, #c9c8c0, #bcbab2 66%, #b1afa7);
  color: #292722;
}
h1 {
  position: absolute;
  z-index: 2;
  top: 12px;
  left: 34px;
  margin: 0;
  font: italic bold 28px/1.15 "Microsoft YaHei", sans-serif;
  color: #ffff91;
  -webkit-text-stroke: 1px #292919;
  text-shadow: 1px 1px 0 #292919;
}
.grid {
  position: absolute;
  top: 38px;
  height: 306px;
  opacity: .34;
  background-image:
    repeating-linear-gradient(to bottom, #7f9388 0, #7f9388 .6px, transparent .6px, transparent 17px),
    repeating-linear-gradient(to right, #7f9388 0, #7f9388 .6px, transparent .6px, transparent 17px, #7f9388 17px, #7f9388 17.6px, transparent 17.6px, transparent 29px);
}
.grid.left { left: 0; width: 200px; }
.grid.right { left: 220px; width: 281px; }
.columns {
  position: absolute;
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-start;
}
.main {
  right: 37px;
  top: 31px;
  width: 288px;
  height: 330px;
  justify-content: space-between;
}
.column {
  width: 29px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: "Kaiti SC", KaiTi, STKaiti, "Noto Serif CJK SC", serif;
  font-size: 25px;
  line-height: 1.12;
  letter-spacing: 2px;
}
.unclear {
  font-family: "Times New Roman", serif;
  font-size: 16px;
  letter-spacing: 0;
}
.c1 { padding-top: 7px; transform: rotate(-2deg); }
.c2 { padding-top: 7px; transform: rotate(-3deg); }
.c3 { transform: rotate(-3deg); }
.c4 { transform: rotate(-2deg); }
.c5 { padding-top: 32px; transform: rotate(-2deg); }
.c6 { transform: rotate(-3deg); }
.c7 { padding-top: 4px; transform: rotate(-3deg); }
.left-writing {
  left: 31px;
  top: 48px;
  width: 182px;
  height: 310px;
  justify-content: space-between;
}
.l1 { padding-top: 17px; transform: rotate(3deg); }
.l2 { transform: rotate(-4deg); }
.l3 { padding-top: 39px; transform: rotate(3deg); }
.signature {
  position: relative;
  width: 29px;
  margin-top: 94px;
}
.signature .column { font-size: 28px; }
.placeholder {
  position: absolute;
  top: 84px;
  left: 0;
  width: 29px;
  height: 40px;
  border: 2px solid #99472e;
  border-radius: 3px;
  background: rgba(161,61,34,.16);
  color: #833c29;
  font: 9px/11px serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transform: rotate(-3deg);
}
.date {
  padding-top: 98px;
  font-size: 25px;
  letter-spacing: 0;
  transform: rotate(4deg);
}
</style>
</head>
<body>
<main class="page" aria-label="第三页，竖排手写文稿">
  <h1>第三页</h1>
  <div class="grid left" aria-hidden="true"></div>
  <div class="grid right" aria-hidden="true"></div>

  <section class="columns main" aria-label="右侧正文">
    <div class="column c1">因为<span class="unclear">[illegible]</span></div>
    <div class="column c2"><span class="unclear">[illegible]</span></div>
    <div class="column c3"><span class="unclear">[illegible]</span></div>
    <div class="column c4">上<span class="unclear">[illegible]</span></div>
    <div class="column c5"><span class="unclear">[illegible]</span></div>
    <div class="column c6"><span class="unclear">[illegible]</span></div>
    <div class="column c7"><span class="unclear">[illegible]</span></div>
  </section>

  <section class="columns left-writing" aria-label="左侧正文及落款">
    <div class="column l1"><span class="unclear">[illegible]</span></div>
    <div class="column l2"><span class="unclear">[illegible]</span>。</div>
    <div class="column l3">小[?]，常健！</div>
    <div class="signature">
      <div class="column">莫言</div>
      <div class="placeholder" aria-label="红色印章">[Seal:<br>red]</div>
    </div>
    <div class="column date">癸卯三月七日晚</div>
  </section>
</main>
</body>
</html>
