<main class="page">
  <header class="header">
    <h1>3. 忽视你的需求，内耗你的精力</h1>
    <div class="placeholder" role="img" aria-label="右上方电池与闪电插图">[插图：电池与闪电]</div>
  </header>
  <section class="content">
    <p class="first"><strong>这一种人，不仅可能是身边的朋友，</strong>亲密关系中<br>也会出现。爱我们的人，也可能会“害”我们。</p>
    <p class="second"><strong>忽视需求，是关系中隐藏的一把刀，</strong>对人的伤害<br>就像刻在木头上的刀痕，再也恢复不到原样。</p>
    <p class="third">而忽视一次，就是给对方的内心，套上一层不透<br>气的薄膜，直到最后无法呼吸，内耗倒下。</p>
    <p class="fourth"><strong>经常忽视你需求的人，他们或许真的在乎你，但<br>这种错误方式，只会让你越来越疲惫。</strong></p>
    <div class="advice">
      <span class="check">✔</span>
      <p>面对关系亲近的人的控制，先做出必要的沟通，<br>坦诚表达自己的感受，必要时保持适当距离。</p>
    </div>
    <p class="closing">与人交往需要衡量，更需要智慧，愿你在前行路上<br>看清他人、做好自己。</p>
  </section>
