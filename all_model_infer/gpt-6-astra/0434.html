<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我写的与人民日报写的</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
}
.upper {
  position: relative;
  height: 295px;
  background: #e7d19e;
  color: #424056;
  border: 1px solid #cfc19e;
}
.lower {
  position: relative;
  height: 425px;
  background: #43405e;
  color: #ecdaa9;
}
h1, h2, p, figure { margin: 0; }
h1 {
  position: absolute;
  left: 56px;
  top: 72px;
  font-size: 35px;
  line-height: 48px;
  font-weight: 700;
}
.short-text {
  position: absolute;
  left: 56px;
  top: 156px;
  font-size: 24px;
  line-height: 41px;
  font-weight: 700;
  white-space: nowrap;
}
.circle {
  position: absolute;
  left: 200px;
  top: 59px;
  width: 70px;
  height: 69px;
  border: 14px solid #d90000;
  border-radius: 50%;
  box-shadow: 1px 2px 2px #927c52;
}
.circle figcaption {
  position: absolute;
  width: 64px;
  left: -11px;
  top: 12px;
  text-align: center;
  font: 8px Arial, sans-serif;
  color: #846c48;
}
.photo {
  position: absolute;
  right: 0;
  top: 80px;
  width: 198px;
  height: 214px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(67, 64, 94, .12);
  color: #43405e;
  text-align: center;
  font: 14px Arial, sans-serif;
}
.photo-text {
  position: absolute;
  right: 4px;
  bottom: -1px;
  color: white;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  font-size: 28px;
  line-height: 35px;
  font-weight: 900;
  white-space: nowrap;
  z-index: 3;
}
h2 {
  position: absolute;
  left: 56px;
  top: 60px;
  font-size: 35px;
  line-height: 48px;
  font-weight: 400;
  white-space: nowrap;
}
.check {
  position: absolute;
  left: 293px;
  top: 43px;
  width: 88px;
  height: 66px;
  color: #85c942;
  display: flex;
  align-items: center;
  justify-content: center;
}
.check .symbol {
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 99px;
  line-height: 66px;
  transform: rotate(5deg);
  text-shadow: 1px 2px #689b36;
}
.check figcaption {
  position: absolute;
  bottom: 0;
  font: 8px Arial, sans-serif;
  color: #a1bc78;
}
.long-text {
  position: absolute;
  left: 57px;
  top: 122px;
  font-size: 21px;
  line-height: 37.4px;
  font-weight: 700;
  white-space: nowrap;
  z-index: 2;
}
.citation {
  position: absolute;
  right: 35px;
  bottom: 16px;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 18px;
  font-weight: 700;
  color: #f2f0f1;
  white-space: nowrap;
}
.watermark {
  position: absolute;
  font-family: Arial, sans-serif;
  font-size: 30px;
  font-weight: bold;
  color: #fff;
  opacity: .17;
  transform: rotate(-20deg);
  pointer-events: none;
}
.upper .watermark { left: 147px; top: 142px; }
.lower .watermark { left: 159px; top: 196px; }
</style>
</head>
<body>
<main class="page">
  <section class="upper">
    <h1>我写的：</h1>
    <figure class="placeholder circle">
      <figcaption>[Red circle]</figcaption>
    </figure>
    <div class="watermark">[illegible]</div>
    <p class="short-text">我们民族的追梦史充满<br>艰辛。</p>
    <figure class="placeholder photo">
      <figcaption>[Photo: child in a red shirt]</figcaption>
    </figure>
    <p class="photo-text">学习使我妈快乐</p>
  </section>
  <section class="lower">
    <h2>人民日报写的：</h2>
    <figure class="placeholder check">
      <span class="symbol" aria-hidden="true">✓</span>
      <figcaption>[Green check mark]</figcaption>
    </figure>
    <div class="watermark">[illegible]</div>
    <p class="long-text">我们这个民族，有数千年辉煌文明、有数百年<br>深重苦难，也有百余年不息奋斗，追寻梦想的<br>道路尤其艰难曲折。百余年来的救亡图存、道<br>路探索，多少仁人志士留下“有心杀贼，无力<br>回天”的悲愤，付出“春云碧血，秋雨黄花”<br>的牺牲，发出“拼将十万头颅血，须把乾坤力<br>挽回”的呐喊。</p>
    <p class="citation">——2013.4.1《筑就民族复兴的“中国梦”》</p>
  </section>
</main>
</body>
</html>
