<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖胖和丫丫</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .page {
      position: relative;
      width: 540px;
      height: 496px;
      overflow: hidden;
      background: #fff;
    }
    .text {
      position: absolute;
      z-index: 2;
      top: 6px;
      left: 25px;
      margin: 0;
      color: #393933;
      font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 32px;
      letter-spacing: 1.3px;
      white-space: nowrap;
    }
    .first-line {
      display: inline-block;
      margin-left: 56px;
    }
    .placeholder {
      position: absolute;
      top: 40px;
      left: 0;
      width: 540px;
      height: 456px;
      margin: 0;
      background: #f2f3ef;
      clip-path: polygon(
        94% 0, 100% 0, 100% 100%, 0 100%,
        0 22%, 10% 30%, 40% 29%, 55% 27%,
        57% 18%, 74% 20%, 82% 16%, 85% 8%, 92% 9%
      );
    }
    .placeholder figcaption {
      position: absolute;
      left: 45px;
      right: 45px;
      top: 260px;
      color: #666;
      font: 14px/1.6 sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="text"><span class="first-line">“胖胖，中午好！”丫丫一进屋就看见了胖胖，</span><br>胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微<br>笑来和我打招呼的！”听到丫丫的话，<br>大家都笑了起来。</p>
    <figure class="placeholder" role="img" aria-label="插图：敞开的绿色窗户，中央交叉格窗；左边是大鸭子和小鸭子，右边是大猪和小猪；窗户上方及右上角有花枝。">
      <figcaption>[插图：绿色窗户中，鸭子在左，猪在右；花枝沿窗户上方延伸至右上角]</figcaption>
    </figure>
  </main>
</body>
</html>
