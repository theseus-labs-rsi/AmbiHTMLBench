<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江雪</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f7f6fa; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
  background: #fff;
  color: #151515;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
}
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #9a94a1;
  font: 11px/1.5 sans-serif;
  z-index: 0;
}
.top-decoration {
  left: 5px; top: 0; width: 529px; height: 85px;
  background: linear-gradient(135deg, #faedf0, #fff 46%, #fdf1f3);
  align-items: flex-start;
  padding-top: 5px;
}
.left-landscape {
  left: 5px; top: 130px; width: 112px; height: 260px;
  background: linear-gradient(40deg, #eeeaf3, #fbf8fc 55%, #fff);
}
.right-landscape {
  left: 365px; top: 200px; width: 170px; height: 246px;
  background: linear-gradient(145deg, #fff 35%, #f5eff3 70%, #eeebf2);
  align-items: flex-end;
  padding-bottom: 15px;
}
.water {
  left: 5px; top: 538px; width: 281px; height: 79px;
  background: #efebfa;
}
.boat {
  left: 290px; top: 549px; width: 212px; height: 114px;
  background: #f4f0f8;
}
.title {
  position: absolute;
  top: 24px;
  left: 216px;
  display: flex;
  gap: 24px;
  z-index: 1;
}
.character { display: flex; flex-direction: column; align-items: center; }
.pinyin {
  font-family: Arial, sans-serif;
  font-weight: normal;
  font-size: 15px;
  line-height: 21px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.title .hanzi { font-size: 39px; line-height: 43px; }
.author {
  position: absolute;
  top: 91px;
  left: 203px;
  display: flex;
  align-items: flex-end;
  z-index: 1;
}
.author .character { width: 29px; }
.author .dynasty { width: 44px; margin-right: 2px; }
.author .pinyin { font-size: 11px; line-height: 15px; letter-spacing: 1px; }
.author .hanzi { font-size: 21px; line-height: 24px; }
.poem {
  position: absolute;
  left: 161px;
  top: 142px;
  width: 251px;
  z-index: 1;
}
.verse {
  display: grid;
  grid-template-columns: repeat(5, 44.5px) 27px;
  height: 62px;
  align-items: start;
}
.verse .pinyin { font-size: 14px; line-height: 23px; }
.verse .hanzi { font-size: 31px; line-height: 39px; }
.punctuation {
  font-size: 30px;
  line-height: 39px;
  padding-top: 23px;
  text-align: center;
}
.translation {
  position: absolute;
  top: 396px;
  left: 103px;
  z-index: 2;
  width: 336px;
}
.label {
  display: inline-block;
  padding: 0 3px;
  height: 24px;
  background: #ca7454;
  border-radius: 3px;
  color: #fff7e7;
  font-size: 21px;
  line-height: 24px;
  transform: rotate(-2deg);
}
.translation p {
  margin: 4px 0 0;
  font-size: 21px;
  line-height: 23px;
  letter-spacing: 1.1px;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="page">
  <div class="placeholder top-decoration">[淡粉色背景装饰]</div>
  <div class="placeholder left-landscape">[插图：左侧雪山]</div>
  <div class="placeholder right-landscape">[插图：右侧雪山]</div>
  <div class="placeholder water">[插图：左下方江水]</div>
  <div class="placeholder boat">[插图：右下方，渔翁在舟中垂钓]</div>

  <header>
    <div class="title" aria-label="江雪">
      <span class="character"><span class="pinyin">jiāng</span><span class="hanzi">江</span></span>
      <span class="character"><span class="pinyin">xuě</span><span class="hanzi">雪</span></span>
    </div>
    <div class="author">
      <span class="character dynasty"><span class="pinyin">táng</span><span class="hanzi">[唐]</span></span>
      <span class="character"><span class="pinyin">liǔ</span><span class="hanzi">柳</span></span>
      <span class="character"><span class="pinyin">zōng</span><span class="hanzi">宗</span></span>
      <span class="character"><span class="pinyin">yuán</span><span class="hanzi">元</span></span>
    </div>
  </header>

  <section class="poem" aria-label="诗文">
    <div class="verse">
      <span class="character"><span class="pinyin">qiān</span><span class="hanzi">千</span></span>
      <span class="character"><span class="pinyin">shān</span><span class="hanzi">山</span></span>
      <span class="character"><span class="pinyin">niǎo</span><span class="hanzi">鸟</span></span>
      <span class="character"><span class="pinyin">fēi</span><span class="hanzi">飞</span></span>
      <span class="character"><span class="pinyin">jué</span><span class="hanzi">绝</span></span>
      <span class="punctuation">，</span>
    </div>
    <div class="verse">
      <span class="character"><span class="pinyin">wàn</span><span class="hanzi">万</span></span>
      <span class="character"><span class="pinyin">jìng</span><span class="hanzi">径</span></span>
      <span class="character"><span class="pinyin">rén</span><span class="hanzi">人</span></span>
      <span class="character"><span class="pinyin">zōng</span><span class="hanzi">踪</span></span>
      <span class="character"><span class="pinyin">miè</span><span class="hanzi">灭</span></span>
      <span class="punctuation">。</span>
    </div>
    <div class="verse">
      <span class="character"><span class="pinyin">gū</span><span class="hanzi">孤</span></span>
      <span class="character"><span class="pinyin">zhōu</span><span class="hanzi">舟</span></span>
      <span class="character"><span class="pinyin">suō</span><span class="hanzi">蓑</span></span>
      <span class="character"><span class="pinyin">lì</span><span class="hanzi">笠</span></span>
      <span class="character"><span class="pinyin">wēng</span><span class="hanzi">翁</span></span>
      <span class="punctuation">，</span>
    </div>
    <div class="verse">
      <span class="character"><span class="pinyin">dú</span><span class="hanzi">独</span></span>
      <span class="character"><span class="pinyin">diào</span><span class="hanzi">钓</span></span>
      <span class="character"><span class="pinyin">hán</span><span class="hanzi">寒</span></span>
      <span class="character"><span class="pinyin">jiāng</span><span class="hanzi">江</span></span>
      <span class="character"><span class="pinyin">xuě</span><span class="hanzi">雪</span></span>
      <span class="punctuation">。</span>
    </div>
  </section>

  <section class="translation">
    <span class="label">译文:</span>
    <p>群山之间，没有一只鸟儿飞过。<br>
纵横的小路上，见不到行人的踪<br>
迹。只有一位身披蓑衣、头戴笠<br>
帽的渔翁，架着小船，冒着风<br>
雪，在寒冷的江上独自垂钓。</p>
  </section>
</main>
</body>
</html>
