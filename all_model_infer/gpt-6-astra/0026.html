<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指读（Pointing Reading）</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #e0ddd3; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #595952;
  background: linear-gradient(90deg, #aaa89a 0, #c3c0b1 26px, #d4d1c3 60px, #d9d6c9 65%, #c5c3b9 100%);
  font-family: "Songti SC", SimSun, "Noto Serif CJK SC", serif;
}
.running-title {
  position: absolute;
  top: 20px;
  left: 58px;
  font: 10px Arial, sans-serif;
  transform: rotate(-6deg);
}
.banner {
  position: absolute;
  top: 49px;
  left: 41px;
  width: 423px;
  height: 65px;
  background: #343738;
  border: 3px double #a09f96;
  clip-path: polygon(0 19%, 18% 0, 100% 9%, 100% 94%, 31% 80%, 0 100%);
}
.banner-content {
  position: absolute;
  top: 58px;
  left: 58px;
  display: flex;
  align-items: center;
  color: #c8c7c0;
  white-space: nowrap;
}
.method {
  width: 57px;
  padding-top: 9px;
  height: 34px;
  border-right: 1px solid #95968e;
  font-size: 14px;
  transform: rotate(-5deg);
}
.heading {
  margin-left: 15px;
  font-size: 30px;
  letter-spacing: 2px;
}
.heading .english { font-family: "Times New Roman", serif; letter-spacing: 0; font-size: 29px; }
.ribbon {
  position: absolute;
  top: 31px;
  left: 87px;
  width: 259px;
  height: 29px;
  border: 1px solid #777970;
  background: #cecec4;
  text-align: center;
  padding-top: 2px;
  font-size: 14px;
  letter-spacing: 3px;
  transform: rotate(-.3deg);
}
.label {
  position: absolute;
  margin: 0;
  padding: 0 4px;
  color: #d6d5cd;
  background: #353735;
  font-size: 17px;
  line-height: 21px;
  font-weight: normal;
  white-space: nowrap;
}
.label.first { left: 59px; top: 185px; transform: rotate(-.7deg); }
.label.second { left: 59px; top: 292px; }
.orange-box {
  position: absolute;
  border: 6px solid rgba(255, 149, 58, .86);
  pointer-events: none;
}
.orange-box.first { top: 167px; left: 42px; width: 324px; height: 52px; transform: rotate(-.3deg); }
.orange-box.second { top: 274px; left: 42px; width: 302px; height: 47px; transform: rotate(-.3deg); }
.focus {
  position: absolute;
  top: 225px;
  left: 83px;
  margin: 0;
  font-size: 16px;
  line-height: 24px;
}
.paragraph {
  position: absolute;
  top: 329px;
  left: 58px;
  margin: 0;
  font-size: 16px;
  line-height: 31px;
  white-space: nowrap;
}
.paragraph .indent { padding-left: 26px; }
.closing {
  position: absolute;
  top: 455px;
  left: 58px;
  margin: 0;
  font-size: 16px;
  line-height: 31px;
  letter-spacing: 1px;
}
.closing .indent { padding-left: 26px; }
.underline {
  position: absolute;
  height: 6px;
  background: rgba(255, 151, 65, .78);
  transform: rotate(-.2deg);
}
.placeholder {
  position: absolute;
  left: 270px;
  top: 483px;
  width: 185px;
  height: 216px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 13px;
  color: #65655c;
}
.side-tab {
  position: absolute;
  left: 507px;
  top: 186px;
  width: 66px;
  height: 32px;
  padding: 7px 5px;
  border: 3px double #a1a299;
  border-radius: 10px;
  background: #373b3c;
  color: #d0d0c7;
  font-size: 11px;
  white-space: nowrap;
}
</style>
</head>
<body>
<main class="page">
  <div class="running-title">实践 Plain reading</div>
  <div class="banner"></div>
  <div class="banner-content">
    <span class="method">方法40</span>
    <span class="heading">指读 <span class="english">（Pointing Reading）</span></span>
  </div>
  <div class="ribbon">用手指来指引读书的方向</div>

  <h2 class="label first">①用手指或是笔尖指着当前读到的位置</h2>
  <div class="orange-box first"></div>
  <p class="focus">视线聚焦在手指或笔尖。</p>
  <div class="underline" style="left:66px;top:248px;width:197px;transform:rotate(-2deg)"></div>

  <h2 class="label second">②沿着阅读的方向移动手指或笔尖</h2>
  <div class="orange-box second"></div>

  <p class="paragraph"><span class="indent">一边往下读，一边移动手指或笔尖。此时视线依然聚焦在</span><br>
手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相<br>
同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速<br>
度的制约，但是可以保证不会出现倒退或是看错行的情况。</p>

  <div class="underline" style="left:76px;top:355px;width:392px"></div>
  <div class="underline" style="left:46px;top:384px;width:435px;transform:rotate(.2deg)"></div>
  <div class="underline" style="left:48px;top:415px;width:426px;transform:rotate(.5deg)"></div>
  <div class="underline" style="left:48px;top:444px;width:411px;transform:rotate(.2deg)"></div>

  <p class="closing"><span class="indent">大家也可以试着将</span><br>
这种方式与朗读结合起<br>
来，将指着的内容出声<br>
读出来。</p>
  <div class="underline" style="left:81px;top:476px;width:150px"></div>
  <div class="underline" style="left:49px;top:507px;width:185px"></div>
  <div class="underline" style="left:52px;top:539px;width:178px"></div>
  <div class="underline" style="left:49px;top:567px;width:56px;transform:rotate(4deg)"></div>

  <figure class="placeholder">[Illustration: a cat pointing at an open book, bottom-right]</figure>
  <div class="side-tab">方法4</div>
</main>
</body>
</html>
