<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Sustainability Summit</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root {
  --green: #006e2b;
  --cream: #f7f1df;
  --lime: #49c63b;
  --label: #65bf53;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--green); font-family: Arial, Helvetica, sans-serif; }
.poster {
  position: relative;
  width: 1536px;
  height: 2048px;
  overflow: hidden;
  background: var(--green);
}
.columns { display: grid; grid-template-columns: 783px 753px; height: 100%; }
.left, .right { position: relative; height: 100%; }
.main-panel {
  position: absolute;
  inset: 0 0 auto;
  height: 1658px;
  background: var(--cream);
  border-radius: 0 0 392px 392px;
}
h1 {
  position: absolute;
  left: 207px;
  top: 970px;
  width: 850px;
  margin: 0;
  transform: rotate(-90deg);
  transform-origin: top left;
  color: var(--green);
  font-size: 120px;
  font-weight: 800;
  letter-spacing: -3px;
  line-height: 1.11;
}
h1 span { display: block; }
.rule {
  position: absolute;
  top: 1073px;
  left: 211px;
  width: 361px;
  border-top: 2px solid var(--green);
}
.registration {
  position: absolute;
  left: 210px;
  top: 1153px;
  color: #232b20;
}
h2 {
  margin: 0;
  color: var(--label);
  font-size: 36px;
  font-weight: 600;
  line-height: 44px;
  letter-spacing: .4px;
}
.registration .category {
  margin: 14px 0 12px;
  font-size: 30px;
  line-height: 38px;
}
.registration .price {
  margin: 0;
  color: var(--green);
  font-size: 56px;
  font-weight: 800;
  line-height: 65px;
  letter-spacing: -1px;
}
.registration .second { margin-top: 25px; }
.visit-panel {
  position: absolute;
  left: 0;
  top: 1657px;
  width: 783px;
  height: 391px;
  border-radius: 0 0 392px 392px;
  background: var(--cream);
}
.visit {
  position: absolute;
  top: 71px;
  left: 210px;
  width: 490px;
}
.visit p {
  margin: 16px 0 0;
  color: #232b20;
  font-size: 30px;
  line-height: 40px;
}
.logo {
  position: absolute;
  top: 129px;
  right: 117px;
  width: 154px;
  height: 72px;
  color: var(--cream);
}
.logo-top { font-size: 37px; line-height: 36px; letter-spacing: -1.6px; }
.logo-bottom { font-size: 39px; font-weight: 800; line-height: 35px; letter-spacing: -1.5px; }
.logo sup { position: absolute; right: 0; top: 1px; font-size: 18px; }
.logo-symbol {
  position: absolute;
  left: 100px;
  top: 4px;
  width: 34px;
  height: 32px;
  font-size: 9px;
  text-align: center;
  line-height: 11px;
  overflow: hidden;
}
.tree {
  position: absolute;
  left: 0;
  top: 305px;
  width: 753px;
  height: 992px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cream);
  background: rgba(24, 62, 16, .16);
  font-size: 22px;
}
.event-panel {
  position: absolute;
  left: 1px;
  top: 1296px;
  width: 751px;
  height: 751px;
  background: var(--lime);
}
.event-circle {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--green);
}
.event-details {
  position: absolute;
  left: 204px;
  top: 202px;
  color: var(--cream);
}
.event-details h2 { color: var(--lime); }
.event-details p {
  margin: 17px 0 0;
  font-size: 32px;
  line-height: 43px;
  font-weight: 400;
}
.location { margin-top: 58px; }
</style>
</head>
<body>
<main class="poster">
  <div class="columns">
    <section class="left">
      <div class="main-panel">
        <h1><span>Global</span><span>Sustainability</span><span>Summit</span></h1>
        <div class="rule"></div>
        <section class="registration">
          <h2>REGISTRATION</h2>
          <p class="category">General Admission</p>
          <p class="price">$350</p>
          <p class="category second">Students &amp; Nonprofits</p>
          <p class="price">$200</p>
        </section>
      </div>
      <section class="visit-panel">
        <div class="visit">
          <h2>VISIT</h2>
          <p>www.yourwebsite.com for more<br>details and to register today!</p>
        </div>
      </section>
    </section>
    <section class="right">
      <div class="logo">
        <div class="logo-top">Your</div>
        <div class="placeholder logo-symbol">[Logo symbol]</div>
        <sup>®</sup>
        <div class="logo-bottom">LOGO</div>
      </div>
      <figure class="placeholder tree">
        <figcaption>[Photo: large tree with broad green canopy and visible trunk]</figcaption>
      </figure>
      <section class="event-panel">
        <div class="event-circle"></div>
        <div class="event-details">
          <section>
            <h2>DATE</h2>
            <p>27 January 2026<br>10:00 PM</p>
          </section>
          <section class="location">
            <h2>LOCATION</h2>
            <p>Grand Hall, Convention<br>Center, Chicago, IL</p>
          </section>
        </div>
      </section>
    </section>
  </div>
</main>
</body>
</html>
