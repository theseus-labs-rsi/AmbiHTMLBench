<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桂花露与荷花露</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e4c5d0;
      color: #66645f;
      font-family: "KaiTi", "STKaiti", "SimHei", sans-serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      background: #e4c5d0;
    }
    .frame {
      position: absolute;
      left: 21px;
      top: 21px;
      width: 500px;
      height: 651px;
      border: 1px solid #77716e;
    }
    .text {
      position: absolute;
      left: 65px;
      margin: 0;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 1.3px;
      line-height: 26px;
      white-space: nowrap;
    }
    .heading-one { top: 84px; }
    .use-one { top: 136px; }
    .ingredients-one { top: 188px; }
    .method-one { top: 240px; }
    .heading-two { top: 370px; }
    .use-two { top: 422px; }
    .ingredients-two { top: 474px; }
    .method-two { top: 526px; }
    .footer {
      position: absolute;
      left: 22px;
      right: 21px;
      top: 679px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .brand {
      color: #f5ebef;
      font-family: sans-serif;
      font-size: 13px;
      letter-spacing: 0;
    }

<body>
  <main class="page">
    <div class="frame"></div>

    <h1 class="text heading-one">△桂花露</h1>
    <p class="text use-one">〔功用〕开胃消食，宽胸化痰</p>
    <p class="text ingredients-one">〔药物〕桂花500克</p>
    <p class="text method-one">〔制法〕于9月底开花时采收，阴干，拣去<br>杂质。先加水浸泡2小时，放入蒸馏器蒸2<br>次，收集蒸馏液</p>

    <h2 class="text heading-two">△荷花露</h2>
    <p class="text use-two">〔功用〕清暑凉营</p>
    <p class="text ingredients-two">〔药物〕白荷花500克</p>
    <p class="text method-two">〔制法〕取含花未放的大花蕾或开放的<br>花，阴干切碎，加水浸泡2小时。放入蒸馏<br>器蒸2小时，收集蒸馏液</p>

    <footer class="footer">
      <span>〔中国色 · 藕荷〕</span>
      <span class="brand">图曰APP</span>
    </footer>
  </main>
