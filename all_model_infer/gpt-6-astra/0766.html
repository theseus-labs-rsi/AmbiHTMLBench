<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; color: #080808; }
.page {
  position: relative;
  width: 540px;
  height: 722px;
  overflow: hidden;
  background-color: #fff;
  background-image:
    repeating-linear-gradient(to right, transparent 0, transparent 19px, #dddddd 20px, transparent 21px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 19px, #dddddd 20px, transparent 21px),
    repeating-linear-gradient(to right, transparent 0, transparent 6px, #f4f4f4 7px, transparent 8px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 6px, #f4f4f4 7px, transparent 8px);
  background-position: 14px 0, 0 0, 0 0, 0 0;
}
h1 {
  position: absolute;
  top: 13px;
  left: 72px;
  margin: 0;
  font-size: 52px;
  line-height: 65px;
  font-weight: 900;
  letter-spacing: 0;
  white-space: nowrap;
}
h1 span { color: #062eab; }
.layout {
  position: absolute;
  top: 96px;
  left: 17px;
  display: grid;
  grid-template-columns: 181px 306px;
  column-gap: 17px;
  height: 626px;
}
.route { position: relative; }
.day {
  position: absolute;
  left: 20px;
  top: 1px;
  width: 125px;
  height: 41px;
  background: #b2ebcf;
  text-align: center;
  font-size: 33px;
  font-weight: 800;
  line-height: 41px;
}
.stop {
  position: absolute;
  margin: 0;
  font-size: 28px;
  font-weight: 800;
  line-height: 39px;
  white-space: nowrap;
}
.stop-one { top: 114px; left: 39px; }
.stop-two { top: 229px; left: 1px; }
.stop-three { top: 344px; left: 29px; }
.stop-four { top: 460px; left: 45px; }
.stop-five { top: 575px; left: 59px; }
.travel {
  position: absolute;
  height: 31px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3px;
  background: rgba(250, 231, 232, .86);
  font-size: 24px;
  line-height: 31px;
  white-space: nowrap;
}
.travel-one { left: 13px; top: 167px; width: 157px; }
.travel-two { left: 4px; top: 282px; width: 169px; }
.travel-three { left: 21px; top: 398px; width: 157px; }
.travel-four { left: 25px; top: 514px; width: 155px; }
.arrow {
  position: absolute;
  width: 25px;
  height: 47px;
  margin: 0;
  background: #947b23;
  clip-path: polygon(29% 0, 73% 0, 73% 49%, 97% 49%, 50% 100%, 3% 49%, 29% 49%);
  z-index: 2;
}
.arrow::after {
  content: "";
  position: absolute;
  inset: 1px;
  background: #ffda43;
  clip-path: polygon(30% 0, 71% 0, 71% 50%, 94% 50%, 50% 96%, 6% 50%, 30% 50%);
}
.arrow span {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.arrow-first { top: 53px; left: 71px; }
.arrow-second { top: 169px; left: 71px; }
.arrow-third { top: 283px; left: 74px; }
.arrow-fourth { top: 399px; left: 74px; }
.arrow-fifth { top: 514px; left: 76px; }
.notes {
  padding-top: 22px;
  display: flex;
  flex-direction: column;
  gap: 34px;
}
.note {
  flex: none;
  width: 306px;
  height: 93px;
  border: 3px solid #a80a10;
  padding: 3px 4px;
  font-size: 20px;
  line-height: 27px;
  font-weight: 400;
  letter-spacing: 0;
}
.note .name { color: #001d70; }
.note-four { padding-top: 16px; }
.note-five { margin-top: 0; }
</style>
</head>
<body>
<main class="page">
  <h1><span>第三天</span>路线规划</h1>
  <div class="layout">
    <section class="route" aria-label="第三天行程">
      <div class="day">第三天</div>
      <div class="placeholder arrow arrow-first"><span>[箭头：向下]</span></div>
      <h2 class="stop stop-one">磁器口</h2>
      <div class="travel travel-one"><span>1号线</span><span>30分钟</span></div>
      <div class="placeholder arrow arrow-second"><span>[箭头：向下]</span></div>
      <h2 class="stop stop-two">罗中立美术馆</h2>
      <div class="travel travel-two"><span>1号线</span><span>80分钟</span></div>
      <div class="placeholder arrow arrow-third"><span>[箭头：向下]</span></div>
      <h2 class="stop stop-three">山城步道</h2>
      <div class="travel travel-three"><span>公交</span><span>32分钟</span></div>
      <div class="placeholder arrow arrow-fourth"><span>[箭头：向下]</span></div>
      <h2 class="stop stop-four">观音桥</h2>
      <div class="travel travel-four"><span>步行</span><span>15分钟</span></div>
      <div class="placeholder arrow arrow-fifth"><span>[箭头：向下]</span></div>
      <h2 class="stop stop-five">九街</h2>
    </section>
    <section class="notes" aria-label="景点介绍">
      <div class="note">
        <span class="name">磁器口（免费）：</span>汇聚美食、重<br>
        庆特色伴手礼，始建于宋代“一<br>
        江两洗三山四巷”独特地貌
      </div>
      <div class="note">
        <span class="name">罗中立美术馆（免费）：</span>拍照超<br>
        级出片，墙体比较花，拍照尽量<br>
        穿不花或者饱和度低的衣服
      </div>
      <div class="note">
        <span class="name">山城步道（免费）：</span>建在悬崖边<br>
        的临江步道，汇聚老重庆特色步<br>
        道
      </div>
      <div class="note note-four">
        <span class="name">观音桥（免费）：</span>超大商圈，还<br>
        有很多地道重庆小吃
      </div>
      <div class="note note-five">
        <span class="name">九街（免费）：</span>酒吧一条街，娱<br>
        乐夜生活开启地，和式风格的酒<br>
        吧都有
      </div>
    </section>
  </div>
</main>
</body>
</html>
