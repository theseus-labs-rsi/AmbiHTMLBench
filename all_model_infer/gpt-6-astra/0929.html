<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头孢菌素分类</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.page {
  position: relative;
  width: 540px;
  height: 379px;
  overflow: hidden;
  color: #d7e8d3;
  background: linear-gradient(105deg, #237c65 0%, #20795f 56%, #25866d 100%);
}
.heading {
  position: absolute;
  left: 9px;
  top: 4px;
  margin: 0;
  color: #e8ee62;
  font-size: 22px;
  line-height: 28px;
  font-weight: normal;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
  color: #555;
  background: #f2f1e9;
  font-size: 12px;
  line-height: 1.35;
}
.star {
  position: absolute;
  left: 160px;
  top: 3px;
  width: 41px;
  height: 33px;
  background: transparent;
  color: #e6f044;
  font-size: 10px;
}
table { border-collapse: collapse; table-layout: fixed; }
.classification {
  position: absolute;
  left: 4px;
  top: 38px;
  width: 566px;
  font-size: 19px;
  line-height: 25px;
  letter-spacing: -0.6px;
}
.classification td {
  border: 2px solid rgba(204,231,213,.76);
  padding: 1px 5px;
  height: 33px;
  white-space: nowrap;
  font-weight: normal;
}
.classification .family {
  text-align: center;
  padding: 0;
  font-size: 20px;
  line-height: 26px;
}
.classification .generation {
  padding-left: 10px;
  font-size: 20px;
}
.classification .drugs { padding-left: 5px; }
.classification .third td { height: 51px; }
.yellow { color: #e0ed58; }
.mark {
  position: relative;
  color: #e1ee57;
}
.underline::after {
  content: "";
  position: absolute;
  left: 0;
  right: -1px;
  bottom: -3px;
  height: 5px;
  border-bottom: 2px solid #e5ef42;
  border-radius: 50%;
  transform: rotate(-3deg);
}
.loop::after {
  content: "";
  position: absolute;
  left: -5px;
  top: -6px;
  width: calc(100% + 9px);
  height: 33px;
  border: 2px solid #e5ef42;
  border-radius: 50%;
  transform: rotate(12deg);
}
.memory {
  position: absolute;
  left: 4px;
  top: 197px;
  width: 346px;
  color: #d7e8d3;
  font-size: 19px;
  line-height: 26px;
  letter-spacing: -0.8px;
}
.memory th, .memory td {
  border: 2px solid rgba(206,230,212,.77);
  height: 33px;
  padding: 1px 6px;
  white-space: nowrap;
  font-weight: normal;
}
.memory th {
  height: 30px;
  text-align: center;
  font-size: 20px;
}
.memory td:first-child { color: #e2ed62; }
.memory td:nth-child(2) { padding-left: 7px; }
.pictures {
  position: absolute;
  left: 354px;
  top: 191px;
  width: 186px;
  height: 188px;
}
.toilet {
  position: absolute;
  left: 0;
  top: 0;
  width: 101px;
  height: 111px;
  border-right: 2px solid #b3d2bc;
}
.food {
  position: absolute;
  left: 102px;
  top: 0;
  width: 84px;
  height: 111px;
  background: #bbb0a1;
}
.couple {
  position: absolute;
  left: 0;
  top: 112px;
  width: 114px;
  height: 76px;
  background: #f4e2e5;
}
.donkey {
  position: absolute;
  left: 116px;
  top: 112px;
  width: 70px;
  height: 76px;
  background: #ecebe3;
}
</style>
</head>
<body>
<main class="page">
  <h1 class="heading">1.头孢菌素分类</h1>
  <div class="placeholder star">[手绘星形]</div>

  <table class="classification">
    <colgroup>
      <col style="width:81px">
      <col style="width:81px">
      <col style="width:404px">
    </colgroup>
    <tbody>
      <tr>
        <td class="family" rowspan="4">头孢<br>菌素类</td>
        <td class="generation">第一代</td>
        <td class="drugs">头孢<span class="mark underline">唑林</span>、氨<span class="mark underline">苄</span>、羟氨<span class="mark underline">苄</span>、<span class="mark underline">拉定</span>、<span class="mark underline">硫脒</span>、<span class="mark underline">噻吩</span>、</td>
      </tr>
      <tr>
        <td class="generation">第二代</td>
        <td class="drugs">头孢<span class="mark">呋</span>辛、<span class="mark underline">孟多</span>、<span class="mark underline">替安</span>、克洛、丙烯</td>
      </tr>
      <tr class="third">
        <td class="generation">第<span class="mark loop">三</span>代</td>
        <td class="drugs">头孢<span class="yellow">他</span>啶、他美、匹<span class="yellow">胺</span>、<span class="mark underline">哌</span>酮、<span class="mark underline">曲</span>松、噻<span class="mark underline">肟</span>、<br>克肟、唑肟、甲肟、泊肟、<span class="mark loop">地</span>尼</td>
      </tr>
      <tr>
        <td class="generation">第<span class="yellow">四</span>代</td>
        <td class="drugs">头孢<span class="mark underline">匹罗</span>、<span class="mark underline">吡肟</span></td>
      </tr>
    </tbody>
  </table>

  <table class="memory">
    <colgroup>
      <col style="width:89px">
      <col style="width:257px">
    </colgroup>
    <tbody>
      <tr><th colspan="2">记忆一下</th></tr>
      <tr>
        <td>第一代</td>
        <td>一头<span class="yellow">坐便拉定</span>，<span class="yellow">米粉</span>吃多了</td>
      </tr>
      <tr>
        <td>第二代</td>
        <td>二<span class="mark underline">呋孟多</span>，<span class="mark underline">替俺克丙</span></td>
      </tr>
      <tr>
        <td>第三代</td>
        <td><span class="yellow">他胺哌曲肟</span>三妹<span class="mark underline">地</span></td>
      </tr>
      <tr>
        <td>第四代</td>
        <td>四<span class="mark underline">匹骡子吡肟</span>牛</td>
      </tr>
    </tbody>
  </table>

  <section class="pictures" aria-label="助记插图">
    <div class="placeholder toilet">[插图：人物与坐便器]</div>
    <div class="placeholder food">[照片：人物与食物]</div>
    <div class="placeholder couple">[插图：粉色心形中的人物]</div>
    <div class="placeholder donkey">[插图：卡通驴]</div>
  </section>
</main>
</body>
</html>
