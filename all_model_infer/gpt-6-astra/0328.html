<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #222; }
.page { position: relative; width: 540px; height: 720px; margin: 0 auto; background: #fff; overflow: hidden; }
.header { position: absolute; top: 28px; left: 88px; width: 365px; }
h1 { margin: 0; font-size: 32px; line-height: 47px; font-weight: 900; letter-spacing: 0; }
h1 span { background: #fff535; box-shadow: 0 -7px 0 #fff535; }
.number { position: absolute; top: 40px; left: 374px; width: 77px; height: 77px; border: 2px solid #ededed; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 34px; font-weight: 800; }
.subtitle { position: absolute; top: 132px; left: 88px; margin: 0; font-size: 14px; line-height: 23px; white-space: nowrap; }
.panel { position: absolute; left: 89px; width: 363px; height: 230px; }
.good { top: 176px; background: linear-gradient(115deg, #fff6f0, #fdf4f5); }
.bad { top: 429px; background: linear-gradient(110deg, #effbfe, #f3f3ff); }
.panel-heading { position: absolute; left: 22px; top: 26px; display: flex; gap: 11px; align-items: center; }
.panel-heading h2 { margin: 0; font-size: 19px; line-height: 27px; font-weight: 700; }
.circle { width: 25px; height: 25px; border: 2px solid #d1b08a; border-radius: 50%; }
.cross { position: relative; width: 25px; height: 25px; }
.cross::before, .cross::after { content: ""; position: absolute; left: 11px; top: 0; height: 26px; width: 2px; background: #84b4cf; transform: rotate(45deg); }
.cross::after { transform: rotate(-45deg); }
.example { position: absolute; left: 98px; font-size: 14px; line-height: 22px; white-space: nowrap; }
.first { top: 77px; }
.second { top: 149px; }
.bad .example { top: 98px; }
.row { display: flex; align-items: center; height: 22px; }
.label { font-weight: 700; }
.rule { display: inline-block; border-left: 1px solid #777; height: 15px; margin: 0 8px; }
.tag { background: #e97885; color: #fff; font-size: 12px; line-height: 17px; height: 17px; padding: 0 4px; margin-right: 7px; font-weight: 700; letter-spacing: 1px; }
.placeholder { display: flex; justify-content: center; align-items: center; text-align: center; color: #8d795f; background: rgba(246, 220, 165, .2); border: 1px solid rgba(171, 139, 88, .25); font-size: 10px; line-height: 14px; }
.character-one { position: absolute; left: 380px; top: 346px; width: 65px; height: 77px; }
.character-two { position: absolute; left: 378px; top: 604px; width: 69px; height: 74px; }
.footer-line { position: absolute; top: 681px; left: 29px; width: 416px; border-top: 1px solid #ededed; }
.footer-text { position: absolute; left: 29px; top: 692px; font-size: 6px; line-height: 8px; }
.logo { position: absolute; left: 472px; top: 685px; width: 42px; height: 28px; font-size: 6px; line-height: 8px; background: #fff; color: #333; border-color: #aaa; }
</style>
</head>
<body>
<main class="page">
<header class="header">
<h1><span>使用合理的</span><br><span>标点符号</span></h1>
</header>
<div class="number">01</div>
<p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>

<section class="panel good">
<div class="panel-heading">
<span class="circle" aria-hidden="true"></span>
<h2>使用直线或外框</h2>
</div>
<div class="example first">
<div class="row"><span class="label">地点</span><span class="rule"></span><span>武汉国际会展中心</span></div>
<div class="row"><span class="label">时间</span><span class="rule"></span><span>2018 年 8 月 20 日</span></div>
</div>
<div class="example second">
<div class="row"><span class="tag">地点</span><span>武汉国际会展中心</span></div>
<div class="row"><span class="tag">时间</span><span>2018 年 8 月 20 日</span></div>
</div>
</section>

<div class="placeholder character-one">[插图：黄色卡通角色]</div>

<section class="panel bad">
<div class="panel-heading">
<span class="cross" aria-hidden="true"></span>
<h2>使用冒号</h2>
</div>
<div class="example">
<div class="row"><span class="label">地点：</span><span>武汉国际会展中心</span></div>
<div class="row"><span class="label">时间：</span><span>2018 年 8 月 20 日</span></div>
</div>
</section>

<div class="placeholder character-two">[插图：黄色卡通角色]</div>
<div class="footer-line"></div>
<footer class="footer-text">ADVERTISING CREATIVITY<br>2019.05</footer>
<div class="placeholder logo">[标志]<br>CREATIVE DESIGN</div>
</main>
</body>
</html>
