<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山里的约会</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #18492e;
  background: #e1f1eb;
  font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #526b58;
  font: 12px/1.5 sans-serif;
  text-align: center;
}
.landscape {
  inset: 0;
  width: 540px;
  height: 720px;
  background: linear-gradient(#e2f2ec 0%, #d7ece4 49%, #b6c79d 65%, #d6dfb8 100%);
  align-items: flex-start;
  padding: 580px 80px 0;
}
.top-copy {
  position: absolute;
  top: -2px;
  right: 21px;
  margin: 0;
  font-size: 13px;
  font-weight: 400;
  line-height: 24px;
  text-align: right;
  white-space: nowrap;
}
.category {
  position: absolute;
  left: 28px;
  top: -3px;
  margin: 0;
  writing-mode: vertical-rl;
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 5px;
  line-height: 28px;
}
.side {
  position: absolute;
  left: 27px;
  margin: 0;
  writing-mode: vertical-rl;
  font-family: Arial, sans-serif;
  font-size: 28px;
  line-height: 30px;
  font-weight: 900;
}
.year { top: 237px; }
.autumn { top: 611px; }
.title {
  position: absolute;
  margin: 0;
  font-family: "STXingkai", "Xingkai SC", "STKaiti", "KaiTi", cursive;
  font-weight: 900;
  line-height: 1;
  color: #124829;
}
.mountain { left: 279px; top: 57px; font-size: 73px; transform: rotate(-5deg); }
.inside { left: 275px; top: 139px; font-size: 101px; }
.of { left: 271px; top: 249px; font-size: 87px; transform: rotate(-5deg); }
.meeting-one { left: 195px; top: 201px; font-size: 82px; transform: rotate(6deg); }
.meeting-two { left: 205px; top: 284px; font-size: 82px; transform: rotate(-5deg); }
.camera {
  left: 235px;
  top: 163px;
  width: 33px;
  height: 43px;
  font-size: 9px;
  border: 1px solid #41684b;
  transform: rotate(12deg);
}
.credit {
  position: absolute;
  top: 419px;
  left: 321px;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  line-height: 22px;
}
.credit small {
  display: block;
  font-family: Georgia, "Microsoft YaHei", serif;
  font-size: 11px;
  font-weight: 400;
  line-height: 15px;
}
.credit-mark {
  left: 289px;
  top: 421px;
  width: 29px;
  height: 32px;
  color: white;
  font-size: 8px;
}
.verses {
  position: absolute;
  left: 94px;
  right: 20px;
  top: 653px;
  display: grid;
  grid-template-columns: 152px 138px 1fr;
  font-family: "Songti SC", "SimSun", serif;
  font-size: 14px;
  line-height: 25px;
}
.verses p { margin: 0; white-space: nowrap; }
.verses .lower { padding-top: 25px; }
.verses .right { text-align: right; }
</style>
</head>
<body>
<main class="page">
  <div class="placeholder landscape" role="img" aria-label="水彩插画背景：浅绿色天空、远山、树林、田野和户外活动的人群">[插画：天空、远山、树林、田野和户外活动的人群]</div>

  <p class="top-copy">地上的路原来很平坦可是有太多人走过这些路过的人们太累了<br>于是他们决定扔下一些东西</p>
  <p class="category">大班综合</p>
  <p class="side year">TongCai 2021</p>
  <p class="side autumn">Autumn</p>

  <h1 aria-label="山里的约会">
    <span class="title mountain">山</span>
    <span class="title inside">里</span>
    <span class="title of">的</span>
    <span class="title meeting-one">约</span>
    <span class="title meeting-two">会</span>
  </h1>
  <div class="placeholder camera">[相机图案]</div>

  <div class="placeholder credit-mark">[白色图案]</div>
  <div class="credit">@Hiro豆豆老师<small>From 小红书</small></div>

  <section class="verses">
    <p class="lower">有的人扔下了悲伤<br>变成了路上的石头</p>
    <p class="lower">有的人留下快乐<br>变成了路上的树苗</p>
    <p class="right">我把装在瓶子里的思念<br>放在高高的山顶上<br>变成了黑夜的眼睛</p>
  </section>
</main>
</body>
</html>
