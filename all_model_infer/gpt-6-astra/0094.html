<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT快捷键</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #ffa5bf;
      font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #292b28;
    }
    .page {
      position: relative;
      width: 540px;
      height: 709px;
      margin: 0 auto;
      background: #ffa5bf;
      overflow: hidden;
    }
    .sheet {
      position: absolute;
      left: 44px;
      top: 85px;
      width: 452px;
      height: 603px;
      padding: 23px 15px 24px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-weight: 800;
    }
    col:first-child { width: 172px; }
    td {
      height: 39.6px;
      padding: 0;
      vertical-align: middle;
      white-space: nowrap;
    }
    td:first-child {
      font-size: 23px;
      letter-spacing: -0.55px;
    }
    td:last-child {
      font-size: 19px;
      letter-spacing: -0.55px;
    }
    tr:nth-child(n+5) td:last-child { padding-left: 6px; }
    tr:nth-child(6) td:last-child,
    tr:nth-child(7) td:last-child { padding-left: 3px; }
    .banner {
      position: absolute;
      z-index: 2;
      left: 123px;
      top: 25px;
      width: 289px;
      height: 77px;
      background: #f8dbea;
      border: 1.5px solid #292824;
      transform: rotate(-0.15deg);
    }
    .banner::before {
      content: "";
      position: absolute;
      inset: 5px 4px 5px 5px;
      border: 1.5px solid #292824;
      background: #fff;
      transform: rotate(0.35deg);
    }
    .title {
      position: absolute;
      inset: 8px -8px 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0c0c0c;
      white-space: nowrap;
    }
    .check {
      font-size: 42px;
      line-height: 1;
      width: 45px;
      margin-right: 0;
    }
    .title-text {
      font-size: 39px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -2px;
      transform: scaleX(.84);
      transform-origin: left center;
      margin-right: -28px;
    }
    .ear {
      position: absolute;
      z-index: 1;
      top: 5px;
      width: 24px;
      height: 27px;
      background: white;
      border: 1.5px solid #292824;
      clip-path: polygon(35% 0, 100% 100%, 0 100%);
    }
    .ear.left { left: 184px; transform: rotate(-9deg); }
    .ear.right { left: 331px; transform: rotate(10deg); }
    .tie {
      position: absolute;
      z-index: 3;
      width: 35px;
      height: 5px;
      background: #fff;
      border: 1.2px solid #292824;
      border-radius: 50%;
    }
    .tie.l1 { left: 114px; top: 47px; transform: rotate(13deg); }
    .tie.l2 { left: 112px; top: 62px; width: 27px; }
    .tie.l3 { left: 113px; top: 75px; transform: rotate(-20deg); }
    .tie.r1 { left: 390px; top: 44px; transform: rotate(-17deg); }
    .tie.r2 { left: 398px; top: 59px; width: 28px; transform: rotate(-8deg); }
    .tie.r3 { left: 392px; top: 75px; transform: rotate(18deg); }
  </style>
</head>
<body>
  <main class="page">
    <div class="ear left" aria-hidden="true"></div>
    <div class="ear right" aria-hidden="true"></div>
    <header class="banner">
      <div class="title"><span class="check">✅</span><span class="title-text">PPT快捷键</span></div>
    </header>
    <span class="tie l1" aria-hidden="true"></span>
    <span class="tie l2" aria-hidden="true"></span>
    <span class="tie l3" aria-hidden="true"></span>
    <span class="tie r1" aria-hidden="true"></span>
    <span class="tie r2" aria-hidden="true"></span>
    <span class="tie r3" aria-hidden="true"></span>
    <section class="sheet">
      <table aria-label="PPT快捷键">
        <colgroup><col><col></colgroup>
        <tbody>
          <tr><td>B</td><td>黑屏(在演示时)</td></tr>
          <tr><td>W</td><td>切换至白屏/从黑白屏恢复放映</td></tr>
          <tr><td>F4</td><td>重复上一步操作</td></tr>
          <tr><td>Ctrl+D</td><td>快速复制选中对象</td></tr>
          <tr><td>Ctrl+G</td><td>组合对象</td></tr>
          <tr><td>Ctrl+ Shift+ G</td><td>取消组合</td></tr>
          <tr><td>Ctrl+Alt+V</td><td>打开选择性粘贴窗口</td></tr>
          <tr><td>Ctrl+单击</td><td>选择多个对象</td></tr>
          <tr><td>Shift+鼠标</td><td>拖动等比例缩放图片</td></tr>
          <tr><td>Shift+ F5</td><td>从当前页开始放映</td></tr>
          <tr><td>Ctrl+ Shift+C</td><td>复制格式</td></tr>
          <tr><td>Ctrl+ Shift+V</td><td>粘贴格式</td></tr>
          <tr><td>Ctrl+ Shift+ &lt;</td><td>快速缩小字号</td></tr>
          <tr><td>Ctrl+ Shift+&gt;</td><td>快速增大字号</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
