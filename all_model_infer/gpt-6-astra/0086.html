<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA SHOULD BE LESS THAN 40 %</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #365344;
      font-family: Arial, Helvetica, sans-serif;
    }
    .slide {
      position: relative;
      width: 1024px;
      height: 576px;
      overflow: hidden;
      background: linear-gradient(to bottom, #5e796b 0%, #4a6758 48%, #324f40 100%);
    }
    h1 {
      position: absolute;
      left: 65px;
      top: 25px;
      width: 914px;
      height: 65px;
      margin: 0;
      padding: 3px 8px 0;
      background: linear-gradient(to bottom, #79cbd8 0%, #45adbd 47%, #257580 100%);
      color: #ffff00;
      font-size: 48px;
      line-height: 59px;
      font-weight: 900;
      white-space: nowrap;
    }
    .panel {
      position: absolute;
      left: 120px;
      top: 164px;
      width: 733px;
      height: 380px;
      background: linear-gradient(to bottom, #ffffff 0%, #f0f6f9 7%, #ffffff 16%, #ffffff 100%);
      color: #252c9d;
    }
    .equation {
      position: absolute;
      top: 67px;
      left: 218px;
      display: flex;
      align-items: center;
      height: 94px;
      font-size: 28px;
      font-weight: 700;
    }
    .fraction {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 132px;
      margin-left: 34px;
      line-height: 38px;
    }
    .numerator {
      width: 132px;
      padding-bottom: 7px;
      border-bottom: 3px solid #263c93;
      text-align: center;
      white-space: nowrap;
    }
    .denominator {
      padding-top: 8px;
      text-align: center;
    }
    .limit {
      margin-left: 70px;
      color: #b42e36;
      font-size: 23px;
      white-space: nowrap;
    }
    .definitions {
      position: absolute;
      left: 109px;
      top: 201px;
      font-size: 28px;
      line-height: 53px;
      font-weight: 700;
      white-space: nowrap;
    }
    .definitions p { margin: 0; }
  </style>
</head>
<body>
  <main class="slide">
    <h1>PTA SHOULD BE LESS THAN 40 %</h1>
    <section class="panel">
      <div class="equation">
        <span>PTA =</span>
        <span class="fraction" role="math" aria-label="(FT + AD) divided by CCT">
          <span class="numerator">(FT + AD)</span>
          <span class="denominator">CCT</span>
        </span>
        <span class="limit">&lt; 40%</span>
      </div>
      <div class="definitions">
        <p>FT = flap thickness</p>
        <p>AD = ablation depth</p>
        <p>CCT = central corneal thickness</p>
      </div>
    </section>
  </main>
</body>
</html>
