<span class="number">09</span>
<span>「教材远比练习册重要」</span>

<p class="text first-text">
教材远比练习册重要。<br>
教材就是我们做题之前所要构建的一个框架，<mark>先熟</mark><br>
<mark>悉框架，然后不断地练题，才能将自己学习的这座</mark><br>
<mark>大厦构建得更加完整。</mark>
</p>

<p class="attribution">——陈哲峰<strong>(被北京大学物理学院录取)</strong></p>

<div class="section-heading heading-two">
<span class="number">10</span>
<span>「有关数学与英语的学习方法」</span>
</div>

<p class="text second-text">
数学压轴大题的第二问我没有做出来，但这并没有<br>
影响接下来的考试中我的发挥。<br>
我要保证的，<span class="emphasis">不是做出难题，而是做到容易题不丢</span><br>
<span class="emphasis">分，难题多得分。</span>最后，我数学只有压轴题扣了<br>
分。
</p>
