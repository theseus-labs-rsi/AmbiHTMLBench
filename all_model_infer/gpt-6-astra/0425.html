<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRADA 鞋履</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #ebeded;
      font-family: "Times New Roman", "Songti SC", SimSun, serif;
    }
    .page {
      position: relative;
      width: 522px;
      height: 699px;
      margin: 8px auto 9px;
      background: white;
      overflow: hidden;
    }
    header {
      position: absolute;
      left: 57px;
      top: 15px;
      width: 408px;
      height: 52px;
      border: 1px dashed #aaa;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin: -3px 0 0;
      color: #000;
      font-size: 52px;
      line-height: 1;
      font-weight: bold;
      letter-spacing: 1px;
      transform: scaleX(1.12);
    }
    .item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      color: #555;
      text-align: center;
    }
    .placeholder {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border: 1px solid #e4e4e4;
      color: #888;
      font: 11px/1.35 Arial, sans-serif;
    }
    figcaption {
      white-space: nowrap;
      font-size: 16px;
      line-height: 18px;
      font-weight: normal;
    }
    .slingback { left: 182px; top: 91px; width: 149px; }
    .slingback .placeholder { width: 149px; height: 101px; }
    .slingback figcaption { margin-top: 9px; font-size: 15px; }
    .mary-jane { left: 35px; top: 176px; width: 145px; }
    .mary-jane .placeholder { width: 145px; height: 94px; }
    .mary-jane figcaption { margin-top: 9px; }
    .chocolate { left: 345px; top: 182px; width: 150px; }
    .chocolate .placeholder { width: 128px; height: 94px; align-self: flex-start; }
    .chocolate figcaption { margin-top: 6px; }
    .triangolo { left: 200px; top: 322px; width: 152px; }
    .triangolo .placeholder { width: 152px; height: 61px; }
    .triangolo figcaption { margin-top: 12px; font-size: 15px; line-height: 16px; }
    .monolith-lace { left: 39px; top: 384px; width: 128px; }
    .monolith-lace .placeholder { width: 126px; height: 66px; }
    .monolith-lace figcaption { margin-top: 10px; }
    .monolith-sandal { left: 363px; top: 401px; width: 140px; }
    .monolith-sandal .placeholder { width: 138px; height: 70px; }
    .monolith-sandal figcaption { margin-top: 9px; }
    .double-wheel { left: 183px; top: 477px; width: 147px; }
    .double-wheel .placeholder { width: 144px; height: 71px; }
    .double-wheel figcaption { margin-top: 12px; margin-left: 26px; }
    .gabardine { left: 37px; top: 569px; width: 154px; }
    .gabardine .placeholder { width: 154px; height: 69px; }
    .gabardine figcaption { margin-top: 11px; font-size: 14px; }
    .downtown { left: 343px; top: 557px; width: 150px; }
    .downtown .placeholder { width: 144px; height: 85px; align-self: flex-start; }
    .downtown figcaption { margin-top: 10px; line-height: 20px; }
  </style>
</head>
<body>
  <main class="page">
    <header><h1>PRADA</h1></header>

    <figure class="item slingback">
      <div class="placeholder">[Photo: black slingback heels]</div>
      <figcaption>亮面皮革后饰带<br>高跟鞋</figcaption>
    </figure>

    <figure class="item mary-jane">
      <div class="placeholder">[Photo: black Mary Jane shoes]</div>
      <figcaption>玛丽珍鞋</figcaption>
    </figure>

    <figure class="item chocolate">
      <div class="placeholder">[Photo: black platform loafers]</div>
      <figcaption>CHOCOLATE 亮面<br>皮革乐福鞋</figcaption>
    </figure>

    <figure class="item triangolo">
      <div class="placeholder">[Photo: black loafers]</div>
      <figcaption>TRIANGOLO 亮面<br>皮革乐福鞋</figcaption>
    </figure>

    <figure class="item monolith-lace">
      <div class="placeholder">[Photo: black lace-up shoes]</div>
      <figcaption>MONOLITH 亮面<br>皮革系带鞋</figcaption>
    </figure>

    <figure class="item monolith-sandal">
      <div class="placeholder">[Photo: black platform sandals]</div>
      <figcaption>MONOLITH 亮面<br>皮革凉鞋</figcaption>
    </figure>

    <figure class="item double-wheel">
      <div class="placeholder">[Photo: white platform sneakers]</div>
      <figcaption>DOUBLE WHEEL</figcaption>
    </figure>

    <figure class="item gabardine">
      <div class="placeholder">[Photo: white sneakers]</div>
      <figcaption>华达呢织物运动鞋</figcaption>
    </figure>

    <figure class="item downtown">
      <div class="placeholder">[Photo: white and pink sneakers]</div>
      <figcaption>DOWNTOWN 穿孔<br>皮革运动鞋</figcaption>
    </figure>
  </main>
</body>
</html>
