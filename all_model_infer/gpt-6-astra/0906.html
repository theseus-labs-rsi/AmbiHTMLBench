<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #d3d3ca;
  font-family: "华文行楷", "STXingkai", "KaiTi", "楷体", cursive;
}
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #171b17;
  background-color: #c6c8be;
  background-image:
    linear-gradient(90deg, rgba(47,50,43,.48) 1px, transparent 1px),
    linear-gradient(rgba(47,50,43,.48) 1px, transparent 1px),
    linear-gradient(105deg, rgba(58,60,49,.25), transparent 36%, rgba(255,255,244,.17) 75%, transparent);
  background-size: 20px 20px, 20px 20px, 100% 100%;
  background-position: 13px 0, 0 17px, 0 0;
}
.page::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 23px;
  height: 100%;
  background: linear-gradient(90deg, rgba(48,47,39,.32), rgba(232,228,206,.28) 55%, rgba(52,51,43,.3) 77%, transparent);
  border-right: 1px solid rgba(47,47,40,.45);
}
h1 {
  position: absolute;
  top: 43px;
  left: 92px;
  margin: 0;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #70152a;
  white-space: nowrap;
}
.vertical {
  position: absolute;
  color: #73172c;
  font-size: 33px;
  font-weight: bold;
  width: 43px;
  text-align: center;
}
.questions-label { left: 58px; top: 116px; }
.questions-label span { display: block; height: 48px; }
.questions {
  position: absolute;
  left: 119px;
  top: 120px;
  margin: 0;
  padding: 0;
  list-style: none;
  color: #a74c51;
  font-size: 25px;
  line-height: 1.5;
  white-space: nowrap;
  letter-spacing: -1.3px;
}
.questions li { height: 60px; transform: rotate(-1deg); transform-origin: left center; }
.formula-label { left: 64px; top: 331px; }
.formula-label span { display: block; height: 43px; }
.formulas {
  position: absolute;
  top: 316px;
  left: 124px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 29px;
  line-height: 1.5;
  white-space: nowrap;
}
.formulas li { transform: rotate(-2deg); transform-origin: left center; }
.formulas .first { height: 96px; }
.formulas .second { height: 65px; }
.formulas .third { font-size: 27px; letter-spacing: -1px; }
.continuation { display: block; padding-left: 27px; }
.blank, .slash { color: #813448; }
.placeholder {
  position: absolute;
  left: 446px;
  top: 333px;
  width: 56px;
  height: 107px;
  background: #931a2b;
  color: #d2d1bc;
  border-radius: 48% 47% 35% 40% / 25% 30% 22% 25%;
  transform: rotate(-3deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 43px;
  line-height: 47px;
  font-weight: bold;
}
.mnemonic {
  position: absolute;
  left: 77px;
  top: 526px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  white-space: nowrap;
  transform: rotate(-2deg);
  font-size: 35px;
  font-weight: bold;
}
.mnemonic .label { color: #172544; }
.mnemonic .words { color: #7b1830; word-spacing: 13px; }
</style>
</head>
<body>
<main class="page">
  <h1>句段结构作用好处赏析</h1>

  <div class="vertical questions-label" aria-label="常见问法">
    <span>常</span><span>见</span><span>问</span><span>法</span>
  </div>

  <ol class="questions">
    <li>1.请分析这句话的作用是什么！</li>
    <li>2.这句话这样描写有什么好处！</li>
    <li>3.请分析这句话这样描写的表达效果.</li>
  </ol>

  <div class="vertical formula-label" aria-label="满分公式">
    <span>满</span><span>分</span><span>公</span><span>式</span>
  </div>

  <ol class="formulas">
    <li class="first">
      ①这是<span class="blank">（　）</span>描写
      <span class="continuation">生动形象地写出<span class="blank">（　　）</span>.</span>
    </li>
    <li class="second">②更突出了<span class="blank">（　）</span>.</li>
    <li class="third">③前后文呼应<span class="slash">/</span>为后文<span class="blank">（　）</span>做了铺垫.</li>
  </ol>

  <div class="placeholder" role="img" aria-label="印章：右侧，学真">
    <span>学</span><span>真</span>
  </div>

  <div class="mnemonic">
    <span class="label">口诀：</span>
    <span class="words">生动秀 感心头 勾勾手</span>
  </div>
</main>
</body>
</html>
