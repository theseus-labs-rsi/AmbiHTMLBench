<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写答题页</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: "SimSun", "Songti SC", serif; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  margin: 0 auto;
  overflow: hidden;
  background: white;
}
.document {
  position: absolute;
  top: 157px;
  left: 0;
  width: 540px;
  height: 406px;
  overflow: hidden;
}
.placeholder {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 406px;
  background: #a18b54;
  color: #514324;
  font: 12px Arial, sans-serif;
  padding: 14px;
}
.yellow-edge {
  position: absolute;
  left: 0;
  top: 105px;
  width: 28px;
  height: 160px;
  background: #aaa119;
  transform: rotate(8deg);
}
.paper {
  position: absolute;
  left: 0;
  top: 86px;
  width: 540px;
  height: 331px;
  background: #e7e6e1;
  clip-path: polygon(5.4% 0, 61% 1.1%, 67% 2%, 79% 1.1%, 86% 2.4%, 89% 4.2%, 94% 4.5%, 100% 7%, 100% 100%, 0 100%, 0 61%);
}
.printed {
  position: absolute;
  top: 120px;
  left: 86px;
  font-size: 12px;
  line-height: 25px;
  white-space: nowrap;
  color: #34342e;
  transform: rotate(-0.4deg);
}
.number {
  position: absolute;
  top: 111px;
  left: 42px;
  color: #20231e;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", cursive;
  font-size: 31px;
  font-style: italic;
  transform: rotate(-9deg);
}
.handwriting {
  position: absolute;
  inset: 0;
  color: #242923;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "FangSong", cursive;
  font-weight: 400;
}
.line {
  position: absolute;
  margin: 0;
  white-space: nowrap;
  line-height: 1.12;
  transform-origin: left center;
  border-bottom: 1px dotted #777a70;
}
.line1 {
  top: 163px;
  left: 65px;
  font-size: 38px;
  letter-spacing: -2px;
  transform: rotate(-2deg);
}
.line2 {
  top: 205px;
  left: 62px;
  font-size: 38px;
  letter-spacing: -2px;
  transform: rotate(-3deg);
}
.line3 {
  top: 246px;
  left: 50px;
  font-size: 38px;
  letter-spacing: -3px;
  transform: rotate(-2deg);
}
.line4 {
  top: 290px;
  left: 49px;
  font-size: 39px;
  letter-spacing: -3px;
  transform: rotate(-3deg);
}
.line5 {
  top: 337px;
  left: 44px;
  font-size: 39px;
  letter-spacing: -3.1px;
  transform: rotate(-3deg);
}
.adjacent-page {
  position: absolute;
  left: 522px;
  top: 132px;
  width: 50px;
  color: #89877b;
  font-size: 8px;
  line-height: 22px;
  transform: rotate(5deg);
}
@media (max-width: 539px) {
  .page { margin-left: 0; }
}
</style>
</head>
<body>
<main class="page">
  <section class="document" aria-label="拍摄的手写答题页">
    <div class="placeholder">[Photo background: wooden tabletop]</div>
    <div class="yellow-edge"></div>
    <div class="paper"></div>
    <div class="number">26</div>
    <div class="printed">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。<br>她看到了什么呢？</div>
    <div class="handwriting">
      <p class="line line1">我蹲下来，“这根肋骨让你感</p>
      <p class="line line2">到不舒服吗？”</p>
      <p class="line line3">展览台上是一尊巨大莹莹的肋</p>
      <p class="line line4">骨，下面的文字介绍引用了夏娃</p>
      <p class="line line5">的来历，说女人都是由肋骨所化。</p>
    </div>
    <div class="adjacent-page">[illegible]<br>[illegible]</div>
  </section>
</main>
</body>
</html>
