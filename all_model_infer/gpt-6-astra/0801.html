<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我想所谓孤独</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #2b203e;
      color: #b7a576;
    }
    .page {
      position: relative;
      width: 540px;
      height: 717px;
      margin: 0 auto;
      overflow: hidden;
      background: #2b203e;
    }
    .emblem {
      position: absolute;
      top: 130px;
      left: 190px;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      font: 12px/1.5 Arial, sans-serif;
      color: #b7a576;
    }
    .english-zone {
      position: absolute;
      top: 328px;
      left: 42px;
      width: 462px;
      display: grid;
      grid-template-columns: 25px 412px 25px;
      align-items: start;
    }
    .english {
      margin: 1px 0 0;
      text-align: center;
      white-space: nowrap;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 300;
      line-height: 22px;
      letter-spacing: -0.35px;
    }
    .star {
      position: relative;
      width: 25px;
      height: 27px;
      color: #b7a576;
    }
    .star::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      clip-path: polygon(50% 0, 63% 32%, 100% 48%, 65% 63%, 50% 100%, 35% 64%, 0 48%, 35% 33%);
    }
    .star span {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    .chinese {
      position: absolute;
      top: 396px;
      left: 95px;
      width: 350px;
      margin: 0;
      text-align: center;
      font-family: "Noto Serif CJK SC", "Songti SC", SimSun, serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 29px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder emblem" role="img" aria-label="Gold geometric emblem with a female symbol">
      [Diagram: gold geometric emblem with female symbol]
    </div>

    <section class="english-zone" lang="en">
      <div class="placeholder star" role="img" aria-label="Gold four-point star">
        <span>[Decoration: gold four-point star]</span>
      </div>
      <p class="english">I think the so-called loneliness refers to the person you are facing,<br>
        whose emotions are not on the same frequency as your own.</p>
      <div class="placeholder star" role="img" aria-label="Gold four-point star">
        <span>[Decoration: gold four-point star]</span>
      </div>
    </section>

    <p class="chinese">“ 我想所谓孤独，<br>
      就是你面对的那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。 ”</p>
  </main>
</body>
</html>
