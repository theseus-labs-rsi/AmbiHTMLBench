<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #e2d8c5; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  color: #171714;
  background:
    radial-gradient(ellipse at 21% 24%, rgba(255,255,255,.17), transparent 65%),
    linear-gradient(110deg, #ded4bf, #d8cebb 66%, #cec3af);
}
.header {
  position: absolute;
  inset: 0 0 auto;
  height: 39px;
  font-family: Arial, sans-serif;
}
.week {
  position: absolute;
  left: -3px;
  top: 5px;
  display: flex;
  transform: rotate(-7deg);
  font-size: 8px;
}
.week span {
  width: 14px;
  height: 18px;
  border: 1px solid #55534a;
  border-right: 0;
  text-align: center;
  padding-top: 3px;
}
.week span:last-child { border-right: 1px solid #55534a; }
.date {
  position: absolute;
  left: 397px;
  top: 1px;
  font-size: 12px;
  white-space: nowrap;
}
.date .slashes { margin-left: 33px; letter-spacing: 14px; }
.header-rule {
  position: absolute;
  left: -4px;
  width: 539px;
  height: 15px;
  top: 23px;
  border-top: 2px solid #49483f;
  border-radius: 55% 10% 0 0;
  transform: rotate(-1deg);
}
.header-rule.second { top: 27px; border-top-width: 1px; }
.rule {
  position: absolute;
  left: -5px;
  width: 539px;
  height: 10px;
  border-top: 1px solid #55554d;
  border-radius: 45% 0 0 0;
  transform-origin: right center;
}
.writing {
  position: absolute;
  margin: 0;
  white-space: nowrap;
  font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", cursive;
  font-size: 35px;
  font-weight: 400;
  line-height: 42px;
  letter-spacing: 1px;
}
.title { left: 65px; top: 35px; font-size: 37px; letter-spacing: 3px; }
</style>
</head>
<body>
<main class="page" aria-label="手写文字">
  <div class="header">
    <div class="week"><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
    <div class="date">Date.<span class="slashes">/ / /</span></div>
    <div class="header-rule"></div>
    <div class="header-rule second"></div>
  </div>

  <div class="rule" style="top:69px;transform:rotate(-.8deg)"></div>
  <div class="rule" style="top:112px;transform:rotate(-.6deg)"></div>
  <div class="rule" style="top:155px;transform:rotate(-.5deg)"></div>
  <div class="rule" style="top:197px;transform:rotate(-.5deg)"></div>
  <div class="rule" style="top:239px;transform:rotate(-.4deg)"></div>
  <div class="rule" style="top:281px;transform:rotate(-.2deg)"></div>
  <div class="rule" style="top:323px;transform:rotate(0deg)"></div>
  <div class="rule" style="top:363px;width:532px;transform:rotate(.1deg)"></div>
  <div class="rule" style="top:404px;width:531px;transform:rotate(.2deg)"></div>
  <div class="rule" style="top:444px;width:528px;transform:rotate(.2deg)"></div>
  <div class="rule" style="top:483px;width:527px;transform:rotate(.1deg)"></div>
  <div class="rule" style="top:521px;width:524px;transform:rotate(.9deg)"></div>
  <div class="rule" style="top:558px;width:523px;transform:rotate(1.8deg)"></div>
  <div class="rule" style="top:598px;width:521px;transform:rotate(1.2deg)"></div>
  <div class="rule" style="top:634px;width:520px;transform:rotate(1.7deg)"></div>
  <div class="rule" style="top:670px;width:518px;transform:rotate(2.1deg)"></div>
  <div class="rule" style="top:708px;width:518px;transform:rotate(2.5deg)"></div>

  <h1 class="writing title">这是好的开始</h1>
  <p class="writing" style="left:50px;top:120px;transform:rotate(-1deg)">从你看到这篇文章开始.</p>
  <p class="writing" style="left:50px;top:163px">你会越来越有钱</p>
  <p class="writing" style="left:49px;top:205px">越来越好看.</p>
  <p class="writing" style="left:49px;top:246px;letter-spacing:0">生活和心态也会越来越好.</p>
  <p class="writing" style="left:49px;top:288px">请相信大数据.</p>
  <p class="writing" style="left:47px;top:329px;font-size:34px;letter-spacing:0">是你自己把一切美好的东西.</p>
  <p class="writing" style="left:48px;top:370px">都吸引了过来</p>
  <p class="writing" style="left:49px;top:411px;font-size:34px;letter-spacing:0">你已经调到了接收钱的频率</p>
  <p class="writing" style="left:51px;top:451px">接收美的频率.</p>
  <p class="writing" style="left:53px;top:491px;font-size:34px;letter-spacing:0">你的能量频率对了才接收到这</p>
  <p class="writing" style="left:52px;top:532px">条信息..</p>
  <p class="writing" style="left:56px;top:572px;font-size:34px;letter-spacing:0">留下一句“全收到”.</p>
  <p class="writing" style="left:55px;top:610px;font-size:35px;letter-spacing:1px;transform:rotate(-1deg)">愿所有的愿望全能实现！</p>
</main>
</body>
</html>
