<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif; }
.poster {
  width: 1152px;
  height: 2048px;
  position: relative;
  overflow: hidden;
  background: #fff;
  color: #050505;
}
.roles {
  position: absolute;
  left: 82px;
  top: 118px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.roles li {
  width: 96px;
  height: 96px;
  border: 2px solid #171717;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 64px;
  line-height: 1;
}
.title {
  position: absolute;
  top: 113px;
  left: 193px;
  margin: 0;
  display: flex;
  flex-direction: column;
  font-size: 150px;
  line-height: 153px;
  font-weight: normal;
}
.title span { display: block; height: 153px; }
.title .red { color: #cc1020; }
.exhibition {
  position: absolute;
  top: 857px;
  left: 109px;
  font-size: 40px;
  line-height: 39px;
  margin: 0;
}
.brand {
  position: absolute;
  top: 199px;
  right: 71px;
  width: 93px;
  text-align: right;
  font-family: "Times New Roman", serif;
  font-size: 34px;
  line-height: 43px;
}
.placeholder { position: absolute; overflow: hidden; }
.placeholder-caption {
  position: absolute;
  font: 12px/1.4 Arial, sans-serif;
  color: #777;
  background: rgba(255,255,255,.82);
  padding: 3px 5px;
}
.logo {
  top: 118px;
  left: 1012px;
  width: 61px;
  height: 63px;
  display: grid;
  grid-template-columns: repeat(3, 14px);
  grid-template-rows: repeat(3, 14px);
  gap: 6px;
  padding: 4px;
}
.logo i { background: #cd1025; transform: rotate(45deg); }
.logo .placeholder-caption { font-size: 7px; padding: 0; bottom: 0; left: 0; }
.art {
  left: 598px;
  top: 298px;
  width: 554px;
  height: 1329px;
}
.art .black {
  position: absolute;
  left: 91px;
  top: 129px;
  width: 463px;
  height: 624px;
  background: #070707;
  clip-path: polygon(100% 0,100% 55%,44% 100%,0 70%);
}
.art .magenta {
  position: absolute;
  left: 477px;
  top: 0;
  width: 154px;
  height: 151px;
  background: #e60082;
  clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.art .pink-circle {
  position: absolute;
  top: 212px;
  left: 111px;
  width: 154px;
  height: 155px;
  border-radius: 50%;
  background: #d35a82;
}
.art .red-circle {
  position: absolute;
  top: 494px;
  left: 0;
  width: 154px;
  height: 154px;
  border-radius: 50%;
  background: #d20e1b;
}
.art .face {
  position: absolute;
  left: 296px;
  top: 373px;
  width: 258px;
  height: 491px;
  background: linear-gradient(#df7398 0%, #f6dce5 40%, white 61%);
  clip-path: polygon(0 0,33% 19%,64% 0,100% 19%,100% 100%,0 100%);
}
.art .eye {
  position: absolute;
  top: 575px;
  left: 326px;
  width: 106px;
  height: 51px;
  background: #d66f96;
  clip-path: polygon(0 0,100% 0,48% 100%);
}
.art .eye-tip {
  position: absolute;
  top: 600px;
  left: 380px;
  width: 34px;
  height: 39px;
  background: #101010;
  clip-path: polygon(0 0,100% 17%,85% 100%);
}
.art .lip {
  position: absolute;
  top: 808px;
  left: 506px;
  width: 99px;
  height: 51px;
  background: #da789b;
  clip-path: polygon(0 0,100% 0,50% 100%);
}
.art .red-bar {
  position: absolute;
  left: 237px;
  top: 753px;
  width: 59px;
  height: 575px;
  background: #d20c19;
}
.art > .placeholder-caption { right: 8px; top: 916px; }
.details {
  position: absolute;
  left: 79px;
  top: 1363px;
  z-index: 2;
}
.details p { margin: 0; white-space: nowrap; }
.organizer { font-size: 44px; line-height: 58px; }
.venue { margin-top: 18px !important; font-size: 44px; line-height: 60px; }
.organizer strong, .venue strong { font-size: 48px; font-weight: 600; }
.date-label {
  margin-top: 23px !important;
  font-family: "Times New Roman", serif;
  font-size: 18px;
  line-height: 22px;
}
.dates {
  display: flex;
  align-items: baseline;
  height: 90px;
  font-family: "Times New Roman", serif;
  white-space: nowrap;
}
.date-number { font-size: 82px; line-height: 87px; }
.day { font-size: 30px; margin-left: 12px; }
.slash {
  display: inline-block;
  width: 75px;
  height: 65px;
  position: relative;
  margin: 0 4px 0 8px;
}
.slash::after {
  content: "";
  position: absolute;
  width: 76px;
  height: 1px;
  background: #333;
  transform: rotate(-45deg);
  top: 28px;
  left: 7px;
}
.contact { margin-top: 16px !important; font-size: 43px; line-height: 61px; }
.phone { font-family: "Times New Roman", serif; font-size: 52px; margin-left: 12px; }
.sun {
  left: 674px;
  top: 1429px;
  width: 51px;
  height: 51px;
  border-radius: 50%;
  background: radial-gradient(circle at 60% 65%, #e67671, #d62f33 58%, #fff 74%);
}
.sun .placeholder-caption { bottom: 0; font-size: 8px; padding: 0; }
.birds { left: 951px; top: 1453px; width: 181px; height: 146px; }
.birds .placeholder-caption { top: 53px; left: 17px; }
.landscape { left: 0; top: 1627px; width: 1152px; height: 421px; }
.landscape .placeholder-caption {
  left: 418px;
  bottom: 43px;
  padding: 8px 12px;
}
.landscape {
  background: linear-gradient(to top, #e5e5e5 0, #f5f5f5 12%, #fff 31%);
}
</style>
</head>
<body>
<main class="poster">
  <ul class="roles" aria-label="京剧行当">
    <li>生</li>
    <li>旦</li>
    <li>净</li>
    <li>末</li>
    <li>丑</li>
  </ul>

  <h1 class="title"><span class="red">京</span><span class="red">剧</span><span>艺</span><span>术</span><span>节</span></h1>

  <p class="exhibition">稿<br>定<br>艺<br>术<br>展</p>

  <div class="placeholder logo" role="img" aria-label="Red nine-diamond logo">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    <span class="placeholder-caption">[Logo]</span>
  </div>
  <div class="brand">Gao<br>Ding<br>Yi<br>Shu</div>

  <div class="placeholder art" role="img" aria-label="Geometric opera-face artwork on the right">
    <div class="black"></div>
    <div class="magenta"></div>
    <div class="pink-circle"></div>
    <div class="face"></div>
    <div class="red-circle"></div>
    <div class="eye"></div>
    <div class="eye-tip"></div>
    <div class="lip"></div>
    <div class="red-bar"></div>
    <span class="placeholder-caption">[Illustration: geometric opera face]</span>
  </div>

  <section class="details">
    <p class="organizer">主办方：<strong>稿定集团</strong></p>
    <p class="venue">地点： <strong>厦门市稿定剧院</strong></p>
    <p class="date-label">DATE.</p>
    <div class="dates">
      <span class="date-number">12.20</span><span class="day">SUN</span>
      <span class="slash" aria-label="／"></span>
      <span class="date-number">12.30</span><span class="day">SAT</span>
    </div>
    <p class="contact">联系电话：<span class="phone">0592-8888888</span></p>
  </section>

  <div class="placeholder sun" role="img" aria-label="Small red painted sun">
    <span class="placeholder-caption">[Sun]</span>
  </div>
  <div class="placeholder birds" role="img" aria-label="Flying birds at lower right">
    <span class="placeholder-caption">[Illustration: flying birds]</span>
  </div>
  <div class="placeholder landscape" role="img" aria-label="Ink-wash mountains, mist, and two bare trees along the bottom">
    <span class="placeholder-caption">[Illustration: ink-wash mountains, mist, and bare trees]</span>
  </div>
</main>
</body>
</html>
