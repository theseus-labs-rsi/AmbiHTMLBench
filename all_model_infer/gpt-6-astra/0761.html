<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侦探能量站</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #ddd9cf;
  font-family: "STKaiti", "KaiTi", "楷体", cursive;
}
.page {
  position: relative;
  width: 540px;
  height: 698px;
  overflow: hidden;
  color: #45443c;
  background: linear-gradient(90deg, #d4cfc2 0%, #e5e1d7 6%, #c6bfb0 9%, #ddd7ca 12%, #e7e3d8 31%, #eeebe2 80%, #e5e3d8 98%, #c2c8b8 100%);
}
.gutter {
  position: absolute;
  left: 49px;
  top: 0;
  width: 8px;
  height: 698px;
  border-left: 1px solid #b5ac9a;
  background: linear-gradient(90deg, rgba(255,255,255,.37), transparent);
  transform: rotate(-.5deg);
}
h1 {
  position: absolute;
  top: 13px;
  left: 68px;
  margin: 0;
  color: #566763;
  font-size: 25px;
  line-height: 32px;
  font-weight: normal;
  transform: rotate(-5deg);
}
.text {
  position: absolute;
  left: 85px;
  top: 47px;
  width: 424px;
  font-size: 22px;
  font-weight: normal;
  line-height: 38px;
  letter-spacing: .1px;
  transform: rotate(-1.2deg);
  transform-origin: left top;
}
.line { white-space: nowrap; }
.line:first-child { padding-left: 13px; }
.line:nth-child(2) { margin-left: -5px; }
.line:nth-child(3) { padding-left: 11px; }
.line:nth-child(10) { padding-left: 3px; }
.line:nth-child(11) { padding-left: 3px; }
.closing {
  position: absolute;
  top: 455px;
  left: 109px;
  width: 397px;
  color: #915354;
  font-size: 25px;
  line-height: 42px;
  transform: rotate(-1.5deg);
}
.closing .second { padding-left: 84px; }
.adjacent-page {
  position: absolute;
  left: -19px;
  top: 496px;
  width: 57px;
  font-size: 22px;
  line-height: 38px;
  transform: rotate(-5deg);
}
.adjacent-page .lower { margin-top: 60px; }
.placeholder {
  position: absolute;
  right: -7px;
  top: 609px;
  width: 33px;
  height: 55px;
  border: 4px solid #647e72;
  border-radius: 13px 9px 10px 13px;
  box-shadow: -2px 0 3px #777d71, inset 2px 0 2px #adb6a7;
  color: #46584f;
  font: 8px/11px sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transform: rotate(-3deg);
}
</style>
</head>
<body>
<main class="page">
  <div class="gutter" aria-hidden="true"></div>
  <h1>侦探能量站</h1>
  <section class="text">
    <div class="line">当偏见裹挟认知，无视事实，操纵舆论的事发</div>
    <div class="line">生，我们该如何对待？</div>
    <div class="line">如果我不害怕人微言轻，也许你就不会经历</div>
    <div class="line">人言可畏，用心辨别真相，用爱和真诚可以消</div>
    <div class="line">融流言。正如各位侦探所言，“大象与蚂蚁的</div>
    <div class="line">对抗，小小的一脚都有可能是致命伤，我们</div>
    <div class="line">谁都不想成为这样的人，我们也不愿成为加</div>
    <div class="line">害的人”，遭遇不公时，隐忍不是唯一道路，</div>
    <div class="line">我们可以向不公平呐喊，只有大家都勇敢</div>
    <div class="line">起来，加害者才会觉得我们没有那么好</div>
    <div class="line">欺负。</div>
  </section>
  <section class="closing">
    <div class="line">愿你笔尖下皆自由之风，一笔一画，</div>
    <div class="line second">一字一句，黑白分明。</div>
  </section>
  <aside class="adjacent-page">
    <div>[illegible]</div>
    <div>[illegible]</div>
    <div class="lower">[illegible]</div>
  </aside>
  <div class="placeholder" role="img" aria-label="右下角的金属书夹">[书夹]</div>
</main>
</body>
</html>
