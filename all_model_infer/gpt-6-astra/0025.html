<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献精读与整理聊天记录</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #151515;
}
.chat {
  position: absolute;
  left: 18px;
  top: 0;
  width: 504px;
  height: 720px;
  background: #eaeaea;
}
.message {
  position: absolute;
  left: 14px;
  width: 476px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.placeholder {
  flex: 0 0 51px;
  width: 51px;
  height: 51px;
  margin: 0;
  border-radius: 5px;
  background: #8193a4;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 9px;
  line-height: 13px;
  overflow: hidden;
}
.bubble {
  position: relative;
  background: #fff;
  border-radius: 5px;
  padding: 9px 15px;
  font-size: 21px;
  font-weight: 400;
  line-height: 31.5px;
  white-space: nowrap;
}
.bubble::before {
  content: "";
  position: absolute;
  top: 20px;
  left: -8px;
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 9px solid #fff;
}
.number {
  display: inline-flex;
  width: 26px;
  height: 26px;
  margin-right: 7px;
  border-radius: 5px;
  justify-content: center;
  align-items: center;
  vertical-align: 1px;
  background: linear-gradient(#a5becb, #4d7185);
  border: 1px solid #9bafba;
  box-shadow: inset 0 1px 2px #d7e1e7;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 21px;
  line-height: 26px;
}
.first { top: 4px; }
.first .bubble { width: 347px; height: 237px; }
.second { top: 256px; }
.second .bubble { width: 347px; height: 143px; }
.third { top: 414px; }
.third .bubble { width: 347px; height: 175px; }
.fourth { top: 604px; }
.fourth .bubble { width: 138px; height: 53px; padding-top: 10px; }
.outgoing {
  top: 671px;
  justify-content: flex-end;
  gap: 14px;
}
.outgoing .bubble {
  background: #9bef65;
  width: 175px;
  height: 53px;
  padding: 10px 15px;
}
.outgoing .bubble::before {
  left: auto;
  right: -8px;
  border-right: none;
  border-left: 9px solid #9bef65;
}
.outgoing .placeholder { background: #8d7758; }
</style>
</head>
<body>
<main class="page">
<section class="chat" aria-label="聊天记录">
  <div class="message first">
    <div class="placeholder" role="img" aria-label="风景头像">[风景头像]</div>
    <div class="bubble"><span class="number">6</span>这个精读的过程可能要重复几<br>遍，好的文献不是读一遍就完事，<br>每读一遍你都会获取新的信息。<br>读第二第三遍的时候，在电脑打<br>开word，开始一遍读一边记录要<br>写进你文献综述的部分，注意要<br>用自己的话重述。</div>
  </div>
  <div class="message second">
    <div class="placeholder" role="img" aria-label="风景头像">[风景头像]</div>
    <div class="bubble"><span class="number">7</span>最后将所有文献进行整理引<br>用，把同一小主题的贴在同一段<br>中，也可以加上小标题，使自己的<br>文章更有逻辑，条理更清晰</div>
  </div>
  <div class="message third">
    <div class="placeholder" role="img" aria-label="风景头像">[风景头像]</div>
    <div class="bubble"><span class="number">8</span>尽量找出不同论文中矛盾冲<br>突的点，凸显出学术圈思维碰<br>撞的火花，学会用however,on<br>thecontrary,in contrast这类连接<br>词。</div>
  </div>
  <div class="message fourth">
    <div class="placeholder" role="img" aria-label="风景头像">[风景头像]</div>
    <div class="bubble">你重新写吧</div>
  </div>
  <div class="message outgoing">
    <div class="bubble">好的，谢谢老师</div>
    <div class="placeholder" role="img" aria-label="右侧照片头像">[照片头像]</div>
  </div>
</section>
</main>
</body>
</html>
