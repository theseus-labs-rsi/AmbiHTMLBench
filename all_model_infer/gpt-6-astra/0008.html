<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, "Microsoft YaHei", sans-serif; }
.scene {
  position: relative;
  width: 540px;
  height: 304px;
  overflow: hidden;
  background: #263e36;
}
.background {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 304px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
  color: #b8cbc0;
  font-size: 11px;
  background: #263e36;
}
.panel {
  position: absolute;
  left: 125px;
  top: 83px;
  width: 290px;
  height: 111px;
  color: #eeeede;
  background: rgba(121, 156, 147, .73);
  box-shadow: 0 0 8px 5px rgba(155, 197, 187, .45);
}
.ornament {
  position: absolute;
  top: 12px;
  width: 7px;
  height: 86px;
  overflow: hidden;
  border-left: 1px dotted #b3c5b8;
  border-right: 1px dotted #b3c5b8;
  color: transparent;
}
.ornament.left { left: 15px; }
.ornament.right { right: 15px; }
.mask {
  position: absolute;
  left: 34px;
  top: 29px;
  width: 51px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e0dfbc;
  font-size: 8px;
  text-align: center;
}
.content {
  position: absolute;
  left: 92px;
  top: 23px;
  width: 183px;
}
h1 {
  margin: 0 0 2px;
  font-size: 11px;
  line-height: 14px;
  font-weight: 600;
}
.stat {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 12px;
  font-size: 8px;
}
.armor {
  width: 12px;
  height: 10px;
  overflow: hidden;
  font-size: 6px;
  white-space: nowrap;
}
.description {
  margin-top: 2px;
  font-size: 7.5px;
  line-height: 11px;
  white-space: nowrap;
}
.action {
  position: absolute;
  right: 25px;
  bottom: 11px;
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 7px;
  font-style: italic;
}
.button {
  display: inline-flex;
  width: 8px;
  height: 8px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: #738c7f;
  background: #eeeee0;
  font-size: 8px;
  font-style: normal;
}
</style>
</head>
<body>
<main class="scene">
  <div class="placeholder background">[游戏画面：石室内的人物与宝箱]</div>
  <section class="panel">
    <div class="placeholder ornament left" aria-label="左侧装饰边框">[装饰边框]</div>
    <div class="placeholder ornament right" aria-label="右侧装饰边框">[装饰边框]</div>
    <div class="placeholder mask">[面具图像]</div>
    <div class="content">
      <h1>魔吉拉的面具</h1>
      <div class="stat"><span class="placeholder armor">[防具图标]</span><span>1</span></div>
      <div class="description">
        从太古时期留下来的面具。<br>
        戴上它的话，有些怪物好像很难发现自己。<br>
        [illegible]
      </div>
    </div>
    <div class="action">打开袋子 <span class="button">+</span></div>
  </section>
</main>
</body>
</html>
