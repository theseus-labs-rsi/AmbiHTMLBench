<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body { font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.page { width: 540px; height: 720px; position: relative; margin: 0 auto; overflow: hidden; background: white; }
.banner {
  position: absolute; top: 0; left: 14px; width: 512px; height: 136px;
  background: #ed6500; border-radius: 0 0 38px 38px / 0 0 12px 12px;
}
.copyright { position: absolute; left: 20px; top: 13px; color: white; font-size: 35px; line-height: 39px; }
.stars { position: absolute; left: 25px; top: 54px; color: white; font-size: 19px; line-height: 12px; text-align: center; }
.year { position: absolute; right: 24px; top: 18px; font-size: 24px; font-weight: 700; }
h1 { position: absolute; left: 70px; top: 36px; margin: 0; font-size: 69px; line-height: 80px; font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
.mark { position: absolute; right: 23px; top: 108px; font-size: 23px; line-height: 26px; }
.intro { position: absolute; left: 35px; top: 152px; width: 475px; margin: 0; font-size: 12px; line-height: 14px; color: #111; }
.card {
  position: absolute; left: 24px; width: 492px; height: 197px;
  border: 2px solid #db701e; border-radius: 25px;
  background: #fff; box-shadow: 0 7px 8px rgba(0,0,0,.12);
}
.first { top: 237px; }
.second { top: 484px; height: 196px; }
h2 { position: absolute; left: 7px; top: 14px; margin: 0; font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: .25px; }
.spark { color: #e96a0a; padding-left: 7px; font-size: 21px; }
.placeholder { position: absolute; margin: 0; overflow: hidden; }
.first .placeholder { left: 16px; top: 40px; width: 444px; height: 105px; background: #095eac; }
.second .placeholder { left: 27px; top: 35px; width: 444px; height: 106px; background: #ff195b; }
.placeholder svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.placeholder figcaption {
  position: absolute; left: 7px; bottom: 4px; padding: 2px 4px;
  background: rgba(255,255,255,.82); color: #555; font-size: 10px; line-height: 13px;
}
.caption { position: absolute; margin: 0; font-size: 12px; line-height: 15px; color: #999; font-weight: 400; }
.first .caption { left: 4px; top: 152px; width: 480px; }
.second .caption { left: 7px; top: 143px; width: 474px; }
.bottom-band { position: absolute; left: 14px; top: 695px; width: 512px; height: 25px; background: #ed6500; }
</style>
</head>
<body>
<main class="page">
  <header class="banner">
    <div class="copyright">©</div>
    <div class="stars" aria-hidden="true">✦<br>✦<br>✦<br>✦<br>✦</div>
    <div class="year">2023</div>
    <h1>对比色配色</h1>
    <div class="mark">瑞</div>
  </header>

  <p class="intro">对比色配色是有意识的使用相反色以及明度对比进行色彩搭配的方法。因为色相和色调都<br>使用对比强烈的色彩，所以配色清晰而有力。</p>

  <section class="card first">
    <h2>富有朝气的配色<span class="spark">✦</span></h2>
    <figure class="placeholder" aria-label="绿色、黄色和蓝色配色图">
      <svg viewBox="0 0 444 105" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="444" height="105" fill="#075dab"/>
        <path d="M0 0H230C226 27 267 23 303 29C335 34 346 46 344 65C343 83 303 91 304 105H0Z" fill="#fff000"/>
        <path d="M0 0H135C145 21 132 31 114 39C90 49 90 72 114 85C134 96 176 97 198 105H0Z" fill="#00984c"/>
      </svg>
      <figcaption>[配色图：绿色、黄色和蓝色]</figcaption>
    </figure>
    <p class="caption">以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。</p>
  </section>

  <section class="card second">
    <h2>视觉冲击强烈的配色<span class="spark">✦</span></h2>
    <figure class="placeholder" aria-label="黄绿色、黑色和深红色配色图">
      <svg viewBox="0 0 444 106" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="444" height="106" fill="#ff195b"/>
        <path d="M0 0H234C238 23 279 23 307 29C337 35 351 44 348 63C346 87 305 88 305 106H0Z" fill="#000"/>
        <path d="M0 0H139C150 22 133 31 117 39C95 49 97 70 116 83C140 98 166 96 196 106H0Z" fill="#92c21a"/>
      </svg>
      <figcaption>[配色图：黄绿色、黑色和深红色]</figcaption>
    </figure>
    <p class="caption">黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，<br>视觉冲击强烈。</p>
  </section>

  <div class="bottom-band"></div>
</main>
</body>
</html>
