<body>
<main class="page">
  <div class="paper"></div>

  <div class="badge">元气<br>满满</div>
  <h1 class="top-title">核桃奶酪贝果</h1>
  <div class="placeholder title-icon-top">[贝果插图]</div>
  <div class="placeholder top-bagel">[核桃奶酪贝果图片]</div>

  <p class="step top-step">1.准备材料</p>
  <div class="ingredients top-ingredients">
    <figure>
      <div class="placeholder cheese-top">[奶酪包装]</div>
      <figcaption>奶酪</figcaption>
    </figure>
    <figure>
      <div class="placeholder bagel-top">[贝果图片]</div>
      <figcaption>贝果</figcaption>
    </figure>
    <figure>
      <div class="placeholder walnuts">[核桃仁图片]</div>
      <figcaption>核桃仁</figcaption>
    </figure>
  </div>

  <p class="top-instructions">2.将桃仁烤2分钟左右，搓掉皮，<br>捣碎后和奶酪混合到一起，涂抹<br>在贝果上</p>
  <div class="placeholder character">[女孩卡通插图]</div>
  <div class="placeholder top-process">[制作示意图：烤箱 → 碗中的核桃碎 → 混合奶酪]</div>

  <div class="divider"></div>
  <h2 class="bottom-title">香蕉可可贝果</h2>
  <div class="placeholder title-icon-bottom">[贝果插图]</div>

  <p class="step bottom-step">1.准备材料</p>
  <p class="credit">@哎呀牌绿豆汤</p>

  <div class="ingredients bottom-ingredients">
    <figure>
      <div class="placeholder cheese-bottom">[奶酪包装]</div>
      <figcaption>奶酪</figcaption>
    </figure>
    <figure>
      <div class="placeholder bagel-bottom">[贝果图片]</div>
      <figcaption>贝果</figcaption>
    </figure>
    <figure>
      <div class="placeholder banana">[香蕉图片]</div>
      <figcaption>香蕉</figcaption>
    </figure>
    <figure>
      <div class="placeholder cocoa">[可可粉包装]</div>
      <figcaption>可可粉</figcaption>
    </figure>
  </div>

  <p class="bottom-instructions">2.奶酪加入可可粉，搅拌均匀涂<br>抹在贝果上摆上水果</p>
  <div class="placeholder bottom-process">[制作示意图：碗中混合物 → 涂抹可可奶酪的贝果 → 摆上香蕉片]</div>
  <div class="placeholder bottom-bagel">[香蕉可可贝果图片]</div>
  <div class="sign">平安<br>喜乐</div>
