  <h1>1、会被无缘无故讨厌的原因有哪些?</h1>
  <section class="text">
    <div class="line opening">“无缘无故的讨厌”有很多原因，比如:</div>
    <div class="line">①长相凶狠的人让我们害怕(承认吧，我</div>
    <div class="line">们都是外貌协会);</div>
    <div class="line">②刻板印象让你对一个人产生先入为主</div>
    <div class="line">的偏见:印象里重庆人火爆，上海人爱计</div>

    <div class="line">重庆人当街斗殴，你的大脑就会激活 “</div>
    <div class="line">重庆人火爆”的认知并加强;</div>
    <div class="line emphasis">③心理学上认为的:对一个人的好恶可能</div>
    <div class="line emphasis">是“投射效应”在起作用。</div>
    <div class="line">那么，“投射效应”到底是如何会让别</div>
