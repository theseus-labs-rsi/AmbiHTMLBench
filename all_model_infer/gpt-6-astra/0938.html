<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takumi Sen9 VS Streakfly</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #eee; font-family: Arial, "Microsoft YaHei", sans-serif; }
.page {
  position: relative;
  width: 542px;
  height: 721px;
  overflow: hidden;
  background: linear-gradient(to right, #fff 0, #fff 270px, #000 270px, #000 100%);
}
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  font-weight: normal;
  color: #777;
}
.adidas { left: 85px; top: 5px; width: 91px; height: 54px; }
.nike { left: 361px; top: 20px; width: 99px; height: 36px; color: #bbb; }
.shoe-left { left: 20px; top: 108px; width: 228px; height: 102px; }
.shoe-right { left: 291px; top: 112px; width: 228px; height: 100px; color: #bbb; }
.brand {
  position: absolute;
  left: 207px;
  top: 27px;
  width: 126px;
  text-align: center;
  font-weight: 900;
  background: linear-gradient(to right, #000 63px, #fff 63px);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.brand .chinese { font-size: 18px; line-height: 21px; }
.brand .english { font-size: 10px; line-height: 12px; letter-spacing: .15px; }
.versus {
  position: absolute;
  left: 233px;
  top: 78px;
  font-size: 68px;
  line-height: 78px;
  font-weight: 900;
  letter-spacing: -7px;
  color: #000;
  -webkit-text-stroke: 1px #fff;
  text-shadow: -2px 2px 2px #999;
  transform: scaleX(.86);
  transform-origin: left center;
}
.distance {
  position: absolute;
  top: 241px;
  left: 218px;
  width: 105px;
  text-align: center;
  font-size: 25px;
  line-height: 29px;
  font-weight: 900;
  background: linear-gradient(to right, #000 52px, #fff 52px);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.comparison {
  position: absolute;
  top: 279px;
  left: 0;
  width: 542px;
  display: grid;
  grid-template-columns: 270px 272px;
  grid-auto-rows: 48px;
  font-size: 25px;
  line-height: 48px;
  font-weight: 800;
}
.left { color: #000; text-align: right; padding-right: 10px; white-space: nowrap; }
.right { color: #fff; text-align: left; padding-left: 10px; white-space: nowrap; }
.model { letter-spacing: 1px; }
.mesh { font-size: 24px; }
.foam { letter-spacing: 1px; }
.rod { font-size: 25px; letter-spacing: -.5px; }
.rubber { font-size: 24px; letter-spacing: .5px; }
.price { font-size: 24px; }
</style>
</head>
<body>
<main class="page">
  <div class="placeholder adidas" role="img" aria-label="Adidas logo">[Adidas logo]</div>
  <div class="placeholder nike" role="img" aria-label="Nike logo">[Nike logo]</div>

  <header class="brand">
    <div class="chinese">奔跑的小宇</div>
    <div class="english">RUNNING XIAOYU</div>
  </header>

  <div class="placeholder shoe-left" role="img" aria-label="Photo of Adidas Takumi Sen9 shoe">[Photo: Adidas Takumi Sen9 shoe]</div>
  <div class="placeholder shoe-right" role="img" aria-label="Photo of Nike Streakfly shoe">[Photo: Nike Streakfly shoe]</div>
  <div class="versus">VS</div>
  <div class="distance">5-10KM</div>

  <section class="comparison" aria-label="Shoe comparison">
    <div class="left model">Takumi Sen9</div>
    <div class="right model">Streakfly</div>

    <div class="left">181g</div>
    <div class="right">165g</div>

    <div class="left">(27/33) 6mm</div>
    <div class="right">8mm (26/32)</div>

    <div class="left mesh">LIGHTWEIGHT MESH</div>
    <div class="right">织物鞋面</div>

    <div class="left foam">Lightstrike Pro</div>
    <div class="right foam">ZoomX</div>

    <div class="left rod">ENERGYROD玻纤柱</div>
    <div class="right">半掌碳板</div>

    <div class="left rubber">Continental™</div>
    <div class="right">贴片橡胶</div>

    <div class="left price">1499</div>
    <div class="right price">999</div>
  </section>
</main>
</body>
</html>
