  <h1>2、为新疆人民打出一个民主联合政府</h1>

  <p class="text first">受到长期迫害的新疆各族人民奋勇反抗，发动了伊犁、<br>塔城、阿山三区人民革命。革命军队很快占领了以上三<br>个地区，成立了临时革命政府。</p>

  <p class="text second">三区人民革命让盛世才感受到了各族人民抗争的力量，<br>最终在革命力量和国民政府的双重压力下败走新疆。<br>1945年日本投降以后，国民政府在全国各族人民的多<br>方压力下，与临时革命政府开启谈判，假借谈判的手段<br>分化瓦解革命力量。</p>
