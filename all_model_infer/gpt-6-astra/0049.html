<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易被忽视的养生小动作</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #fff;
  color: #30302d;
  font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
}
.page {
  width: 540px;
  min-height: 1141px;
  padding: 14px 19px 0 16px;
}
h1 {
  margin: 0 0 23px;
  height: 68px;
  font-size: 53px;
  line-height: 68px;
  font-weight: 900;
  text-align: center;
  white-space: nowrap;
  letter-spacing: 2px;
  transform: scaleX(.91);
  transform-origin: center;
}
p { margin: 0; }
.first {
  font-size: 42px;
  line-height: 53px;
}
.second {
  margin-top: 3px;
  font-size: 43px;
  line-height: 56px;
}
.line {
  display: block;
  white-space: nowrap;
  text-align: justify;
  text-align-last: justify;
}
.line.end {
  text-align: left;
  text-align-last: left;
}
.intro {
  display: flex;
  align-items: baseline;
  white-space: nowrap;
}
.intro strong {
  display: inline-block;
  flex-shrink: 0;
  font-size: 40px;
  font-weight: 900;
}
.first .intro {
  padding-left: 89px;
  gap: 47px;
}
.second .intro {
  padding-left: 91px;
  gap: 47px;
}
.intro .lead {
  flex: 1;
  text-align: justify;
  text-align-last: justify;
}
</style>
</head>
<body>
<main class="page">
  <h1>易被忽视的养生小动作</h1>
  <p class="first">
    <span class="intro"><strong>梳头</strong><span class="lead">梳头是脑部运</span></span>
    <span class="line">动最理想的项目，可以刺</span>
    <span class="line">激穴位，增强分泌活动，改</span>
    <span class="line">善血液循环，促进新陈代</span>
    <span class="line">谢。此外，梳头还是治疗失</span>
    <span class="line">眠、眩晕、心悸、中风后遗症</span>
    <span class="line">和青少年白发的辅助手段。</span>
    <span class="line">平时每天可梳头3至5次，每</span>
    <span class="line">次不少于3至5分钟，其中晚</span>
    <span class="line end">上睡前必须要梳一次。</span>
  </p>
  <p class="second">
    <span class="intro"><strong>伸懒腰</strong><span class="lead">伸懒腰会使</span></span>
    <span class="line">人体的脏器对心、肺产生</span>
    <span class="line">挤压。持续几秒钟的伸懒</span>
    <span class="line">腰，使很多淤积的血液被</span>
    <span class="line">赶回心脏，改善血液循环，</span>
    <span class="line">使更多的含氧量的血液供</span>
    <span class="line">给大脑，还可带走肌肉的</span>
    <span class="line">一些废物，从而消除人体</span>
    <span class="line end">的疲劳。</span>
  </p>
</main>
</body>
</html>
