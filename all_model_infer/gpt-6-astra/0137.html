<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国家名</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #ffffff; }
    .page {
      position: relative;
      width: 526px;
      height: 720px;
      margin-left: 7px;
      background: #fcf5ef;
      color: #242420;
      padding-top: 49px;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
    }
    h1 {
      margin: 0 0 35px 211px;
      font-family: "SimHei", "Heiti SC", sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 34px;
      color: #ed8938;
    }
    .columns {
      display: grid;
      grid-template-columns: 70px 70px;
      column-gap: 169px;
      margin-left: 75px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      height: 41.6px;
      font-size: 23px;
      line-height: 30px;
      white-space: nowrap;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>国家名</h1>
    <div class="columns">
      <ul>
        <li>弘昼国</li>
        <li>安平国</li>
        <li>苍狼国</li>
        <li>黑鹰国</li>
        <li>古木国</li>
        <li>临越国</li>
        <li>临月国</li>
        <li>逸水国</li>
        <li>飞虎国</li>
        <li>静月国</li>
        <li>火凤国</li>
        <li>长风国</li>
        <li>凤临国</li>
      </ul>
      <ul>
        <li>金鹏国</li>
        <li>玄龙国</li>
        <li>夜莲国</li>
        <li>北冥国</li>
        <li>绮霞国</li>
        <li>银霜国</li>
        <li>轩辕国</li>
        <li>真北国</li>
        <li>碧潭国</li>
        <li>青果国</li>
        <li>鸿熙国</li>
        <li>阳明国</li>
        <li>落霞国</li>
      </ul>
    </div>
  </main>
</body>
</html>
