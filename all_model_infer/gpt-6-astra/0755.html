<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗六首</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #f2ca89;
  color: #101010;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
}
.page {
  width: 540px;
  height: 722px;
  padding: 23px 24px;
  margin: 0 auto;
}
.poems {
  width: 492px;
  height: 676px;
  display: grid;
  grid-template-columns: 246px 246px;
  grid-template-rows: 241px 232px 203px;
  background-color: #fff;
  background-image:
    linear-gradient(to right, rgba(190, 190, 190, .15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(190, 190, 190, .15) 1px, transparent 1px);
  background-size: 13px 13px;
  box-shadow: 4px 4px 0 rgba(195, 146, 85, .22);
}
.poem {
  min-width: 0;
  position: relative;
  padding-top: 11px;
}
.poem:nth-child(odd) { border-right: 5px solid #e5ad87; }
.poem:nth-child(-n+4) { border-bottom: 5px solid #e5ad87; }
h1 {
  margin: 0;
  height: 44px;
  text-align: center;
  font-size: 34px;
  line-height: 44px;
  font-weight: 700;
  white-space: nowrap;
  letter-spacing: 1px;
}
.author {
  margin: 0;
  padding-right: 5px;
  height: 37px;
  text-align: right;
  font-size: 22px;
  line-height: 30px;
  white-space: nowrap;
  letter-spacing: 2px;
}
.verse {
  margin: 3px 0 0 43px;
  font-size: 27px;
  line-height: 32px;
  letter-spacing: 2px;
  white-space: nowrap;
}
.poem:nth-child(even) .verse { margin-left: 49px; }
.poem:nth-child(3), .poem:nth-child(4) { padding-top: 6px; }
.poem:nth-child(3) .author,
.poem:nth-child(4) .author { height: 42px; }
.poem:nth-child(5), .poem:nth-child(6) { padding-top: 1px; }
.poem:nth-child(5) h1,
.poem:nth-child(6) h1 { height: 36px; line-height: 36px; font-size: 32px; }
.poem:nth-child(5) .author,
.poem:nth-child(6) .author { height: 32px; line-height: 30px; font-size: 21px; }
.poem:nth-child(5) .verse,
.poem:nth-child(6) .verse { margin-top: 0; }
.poem:nth-child(6) .verse { margin-left: 60px; }
</style>
</head>
<body>
<main class="page">
  <div class="poems">
    <section class="poem">
      <h1>《登鹳雀楼》</h1>
      <p class="author">（唐－王之涣）</p>
      <p class="verse">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</p>
    </section>
    <section class="poem">
      <h1>《静夜思》</h1>
      <p class="author">（唐－李白）</p>
      <p class="verse">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</p>
    </section>
    <section class="poem">
      <h1>《古朗月行》</h1>
      <p class="author">（唐－李白）</p>
      <p class="verse">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</p>
    </section>
    <section class="poem">
      <h1>《寻隐者不遇》</h1>
      <p class="author">（唐－贾岛）</p>
      <p class="verse">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</p>
    </section>
    <section class="poem">
      <h1>《咏鹅》</h1>
      <p class="author">（唐－骆宾王）</p>
      <p class="verse">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</p>
    </section>
    <section class="poem">
      <h1>《草》</h1>
      <p class="author">（唐－白居易）</p>
      <p class="verse">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</p>
    </section>
  </div>
</main>
</body>
</html>
