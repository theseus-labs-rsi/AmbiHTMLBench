<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body {
  font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #383838;
}
.page {
  width: 540px;
  min-height: 720px;
  padding-top: 30px;
  background: #fff;
}
.toolbar {
  display: flex;
  align-items: center;
  height: 39px;
  padding: 0 24px 0 12px;
  color: #bfb849;
}
.back {
  width: 19px;
  height: 31px;
  margin-right: 10px;
}
.toolbar-title {
  font-size: 25px;
  line-height: 35px;
  white-space: nowrap;
}
.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 37px;
  margin-left: auto;
}
.toolbar-actions .placeholder {
  width: 36px;
  height: 38px;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #bab344;
  font-family: Arial, sans-serif;
  font-size: 8px;
  line-height: 10px;
  overflow: hidden;
}
main { padding: 0 35px; }
.entry:first-child { margin-top: 41px; }
.entry-heading {
  display: flex;
  align-items: center;
  min-height: 35px;
}
.check {
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  margin-right: 18px;
  border-radius: 50%;
  background: #f8d32b;
  color: white;
  font-size: 7px;
}
h2 {
  margin: 0;
  font-size: 25px;
  line-height: 35px;
  font-weight: 600;
  letter-spacing: .25px;
  white-space: nowrap;
}
.quote {
  margin: 38px 0 0;
  font-size: 24px;
  line-height: 35px;
  font-weight: 400;
  letter-spacing: .45px;
}
.quote-line { display: block; white-space: nowrap; }
.entry + .entry { margin-top: 79px; }
.entry + .entry .quote { margin-top: 38px; }
</style>
</head>
<body>
<div class="page">
  <header class="toolbar">
    <div class="placeholder back">[Back icon]</div>
    <div class="toolbar-title">金句合集</div>
    <div class="toolbar-actions">
      <div class="placeholder">[Collaboration icon]</div>
      <div class="placeholder">[Share icon]</div>
      <div class="placeholder">[More icon]</div>
    </div>
  </header>
  <main>
    <section class="entry">
      <div class="entry-heading">
        <div class="placeholder check">[Check icon]</div>
        <h2>他写「成长」，正是你所亲历</h2>
      </div>
      <p class="quote">
        <span class="quote-line">“我经由光阴，经由山水，经由乡村和城</span>
        <span class="quote-line">市，同样我也经由别人，经由一切他者以</span>
        <span class="quote-line">及由之引生的思绪和梦想而走成了我。那</span>
        <span class="quote-line">路途中的一切，有些与我擦肩而过从此天</span>
        <span class="quote-line">各一方，有些便永久驻进我的心魂，雕琢</span>
        <span class="quote-line">我，塑造我，锤炼我，融入我而成为我。”</span>
        <span class="quote-line">——《病隙碎笔》</span>
      </p>
    </section>
    <section class="entry">
      <div class="entry-heading">
        <div class="placeholder check">[Check icon]</div>
        <h2>他写「磨难」，报之以歌</h2>
      </div>
      <p class="quote">
        <span class="quote-line">“大劫大难之后人不该失去锐气，不该失去</span>
        <span class="quote-line">热度，你镇定了但仍在燃烧，你平稳了却</span>
        <span class="quote-line">更加浩荡。”——《好运设计》</span>
      </p>
    </section>
  </main>
</div>
</body>
</html>
