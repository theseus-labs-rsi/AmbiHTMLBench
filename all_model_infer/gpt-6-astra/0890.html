<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句摘抄：坚持奋斗主题</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; color: #302e28; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  background: #d6c8b0;
}
.header {
  position: absolute;
  inset: 0 0 auto;
  height: 173px;
  background: #fbefe5;
}
.placeholder {
  position: absolute;
  left: 22px;
  top: 30px;
  width: 261px;
  height: 128px;
  margin: 0;
  color: #c4262b;
}
.logo-name {
  position: absolute;
  inset: 1px 0 auto;
  height: 105px;
  font-family: "STXingkai", "STKaiti", "KaiTi", cursive;
  font-size: 65px;
  font-weight: bold;
  white-space: nowrap;
  letter-spacing: -3px;
  line-height: 105px;
}
.logo-roman {
  position: absolute;
  top: 109px;
  left: 61px;
  font-family: Georgia, serif;
  font-size: 14px;
  letter-spacing: 3px;
  white-space: nowrap;
}
.caption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.header-label {
  position: absolute;
  top: 28px;
  right: 0;
  width: 182px;
  height: 53px;
  border-bottom: 3px solid #38362f;
  font: bold 35px/47px "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  white-space: nowrap;
}
.separator {
  display: inline-block;
  height: 34px;
  margin: 0 8px 0 7px;
  border-left: 1px solid #38362f;
  vertical-align: -4px;
}
.theme {
  position: absolute;
  top: 100px;
  right: 0;
  width: 231px;
  height: 54px;
  padding-left: 9px;
  border-bottom: 3px solid #38362f;
  font: bold 35px/48px "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  white-space: nowrap;
}
.quote {
  position: absolute;
  margin: 0;
  font-family: "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  font-size: 47px;
  font-weight: 500;
  line-height: 1.22;
  white-space: nowrap;
}
.quote-one {
  top: 182px;
  left: 128px;
}
.example-label, .example-text {
  position: absolute;
  margin: 0;
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 19px;
  font-weight: 400;
  line-height: 24px;
}
.label-one { top: 303px; left: 27px; }
.text-one { top: 350px; left: 27px; width: 495px; }
.quote-two {
  top: 435px;
  left: 85px;
  font-size: 48px;
  line-height: 1.2;
  letter-spacing: 1px;
}
.label-two { top: 578px; left: 35px; }
.text-two { top: 626px; left: 35px; width: 493px; }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <figure class="placeholder" aria-label="人民日报标志，左上方">
      <div class="logo-name">人民日报</div>
      <div class="logo-roman">RENMIN RIBAO</div>
      <figcaption class="caption">[标志：左上方]</figcaption>
    </figure>
    <div class="header-label">金句<span class="separator"></span>摘抄</div>
    <div class="theme">坚持奋斗主题</div>
  </header>

  <div class="quote quote-one">夜色难免黑凉<br>前行必有曙光</div>
  <p class="example-label label-one">举例:</p>
  <p class="example-text text-one">夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，<br>只要勇敢向前必定成功!</p>

  <div class="quote quote-two">道固远，笃行可至<br>事虽巨，坚为必成</div>
  <p class="example-label label-two">举例:</p>
  <p class="example-text text-two">道固远，笃行可至;事虽巨，坚为必成。一个人也好，一<br>个国家也好，最可贵的就是心中有梦想，并且为实现梦想<br>不惧风雨、实干笃行、砥砺奋斗。</p>
</main>
</body>
</html>
