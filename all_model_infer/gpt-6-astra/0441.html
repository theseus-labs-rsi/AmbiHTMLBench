<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长需要关注什么</title>
<script>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #fff; color: #171914; font-family: "SimSun", "Songti SC", serif; }
.document {
  width: 422px;
  height: 720px;
  margin: 0 auto;
  background: #d9c8a8;
  border: 1px solid #b5a58e;
  overflow: hidden;
}
.cover { height: 240px; position: relative; border-bottom: 5px solid #24251e; }
.banner {
  position: absolute;
  top: 56px;
  left: 72px;
  width: 348px;
  height: 125px;
  background: #5c9485;
}
h1 {
  position: absolute;
  top: 86px;
  left: 194px;
  margin: 0;
  color: #fff1b8;
  font-size: 27px;
  font-family: "KaiTi", "STKaiti", serif;
  font-weight: bold;
  white-space: nowrap;
  letter-spacing: 1px;
}
.chapter {
  position: absolute;
  top: 139px;
  left: 268px;
  color: #dedcac;
  font-size: 10px;
  letter-spacing: 4px;
}
.placeholder { display: flex; align-items: center; justify-content: center; text-align: center; }
.deer {
  position: absolute;
  left: 25px;
  top: 19px;
  width: 184px;
  height: 190px;
  color: #f8e8b6;
  font-size: 11px;
}
.seal {
  position: absolute;
  width: 15px;
  height: 23px;
  color: #b97456;
  border: 1px solid #ba8062;
  font-size: 6px;
  line-height: 7px;
}
.cover .seal { left: 24px; top: 195px; }
.section { position: relative; height: 240px; padding: 8px 8px 7px; border-bottom: 4px solid #292921; }
.board { position: relative; width: 100%; height: 222px; background: #fff; border: 1px solid #9c9c86; }
.group { position: absolute; font-size: 12px; line-height: 15px; }
.group p { margin: 9px 0 0 5px; white-space: nowrap; }
.number {
  width: 43px;
  height: 18px;
  padding-left: 7px;
  color: #fff;
  font-family: "KaiTi", "STKaiti", serif;
  font-size: 12px;
  line-height: 18px;
  font-weight: bold;
  background: linear-gradient(100deg, #77a69a 0%, #77a69a 46%, #c2d8cf 76%, #fff 100%);
  clip-path: polygon(6% 4%, 41% 6%, 75% 28%, 65% 38%, 95% 57%, 77% 63%, 100% 88%, 23% 90%, 5% 81%, 0% 42%);
}
.grades .one { top: 12px; left: 15px; }
.grades .two { top: 80px; left: 15px; }
.grades .three { top: 161px; left: 19px; }
.grades .four { top: 7px; left: 250px; }
.grades .four p { margin-top: 8px; }
.grades .five { top: 122px; left: 266px; }
.grades .five p { margin-left: 12px; margin-top: 6px; }
.strategy { color: #a1543e; }
.medallion {
  position: absolute;
  border-radius: 50%;
  border: 4px solid #b6a67e;
  box-shadow: 0 0 2px 2px #ddd7c7, inset 0 0 0 2px #e6e0d1;
  overflow: hidden;
}
.grades .medallion { left: 126px; top: 65px; width: 119px; height: 119px; }
.medallion .ornament {
  position: absolute;
  top: 0;
  height: 100%;
  width: 26%;
  color: #a48c64;
  font-size: 8px;
  line-height: 12px;
  border-right: 3px double #b3a381;
}
.medallion .ornament.right { right: 0; border-right: 0; border-left: 3px double #b3a381; }
.medallion .vertical-title {
  position: absolute;
  inset: 8px 27%;
  color: #699b8b;
  font-family: "KaiTi", "STKaiti", serif;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  line-height: 20px;
}
.section > .seal { left: 1px; bottom: 0; width: 14px; height: 23px; }
.parents { border-bottom: 0; }
.parents .one { top: 12px; left: 15px; }
.parents .two { top: 80px; left: 15px; }
.parents .three { top: 160px; left: 19px; }
.parents .four { top: 35px; left: 291px; }
.parents .five { top: 149px; left: 282px; }
.parents .group p { font-weight: bold; margin-top: 11px; }
.parents .three p { margin-left: 4px; }
.parents .five p { margin-left: -12px; margin-top: 10px; }
.parents .four p { margin-top: 17px; }
.parents .medallion { left: 128px; top: 44px; width: 146px; height: 146px; }
.parents .vertical-title { inset: 16px 27%; font-size: 18px; line-height: 20px; }

<body>
<main class="document">
  <header class="cover">
    <div class="banner"></div>
    <div class="placeholder deer">[插画：鹿与水波]</div>
    <h1>家长需要关注什么</h1>
    <div class="chapter">章 · 节 · 肆</div>
    <div class="placeholder seal">[印章]</div>
  </header>

  <section class="section grades">
    <div class="board">
      <div class="group one">
        <div class="number">壹</div>
        <p>看单科成绩<br>分析优势与劣势科目</p>
      </div>
      <div class="group two">
        <div class="number">贰</div>
        <p>看进步<br>横向整体水平<br>纵向看进退情况</p>
      </div>
      <div class="group three">
        <div class="number">叁</div>
        <p>分析错题</p>
      </div>

      <div class="medallion">
        <div class="placeholder ornament">[窗格纹饰]</div>
        <div class="placeholder ornament right">[窗格纹饰]</div>
        <div class="vertical-title">成<br>绩<br>怎<br>么<br>看</div>
      </div>

      <div class="group four">
        <div class="number">肆</div>
        <p>分析[?]错：<br>是遗憾丢分？是模糊丢分？<br>是不会做丢分？<br><span class="strategy">策略：</span>消除遗憾、纠正模<br>糊，力争突破</p>
      </div>
      <div class="group five">
        <div class="number">伍</div>
        <p>分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</p>
      </div>
    </div>
    <div class="placeholder seal">[印章]</div>
  </section>

  <section class="section parents">
    <div class="board">
      <div class="group one">
        <div class="number">壹</div>
        <p>不要过度焦虑</p>
      </div>
      <div class="group two">
        <div class="number">贰</div>
        <p>不要过度关注孩子</p>
      </div>
      <div class="group three">
        <div class="number">叁</div>
        <p>不要给孩子过高的期望</p>
      </div>

      <div class="medallion">
        <div class="placeholder ornament">[窗格纹饰]</div>
        <div class="placeholder ornament right">[窗格纹饰]</div>
        <div class="vertical-title">家<br>长<br>五<br>不<br>要</div>
      </div>

      <div class="group four">
        <div class="number">肆</div>
        <p>不要过度唠叨</p>
      </div>
      <div class="group five">
        <div class="number">伍</div>
        <p>不要盲目攀比和迷信</p>
      </div>
    </div>
    <div class="placeholder seal">[印章]</div>
  </section>
</main>
</body>
</html>
