<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Vocabulary Notes</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #30201a;
}
.notebook {
  position: relative;
  width: 540px;
  height: 719px;
  overflow: hidden;
  background: linear-gradient(90deg, #cecebb 0%, #d6d5c1 65%, #c4c2ac 85%, #aaa895 87%, #d3d0bc 89%, #cbc8b6 100%);
  border-radius: 24px 0 0 20px;
}
.notebook::before {
  content: "";
  position: absolute;
  left: 26px;
  right: 88px;
  top: 66px;
  height: 614px;
  background: repeating-linear-gradient(to bottom, rgba(85,88,76,.27) 0, rgba(85,88,76,.27) 1px, transparent 1px, transparent 29.3px);
  transform: rotate(1.5deg);
}
.notebook::after {
  content: "";
  position: absolute;
  top: 20px;
  bottom: 20px;
  left: 466px;
  width: 2px;
  background: linear-gradient(to bottom, transparent, rgba(80,70,53,.19), transparent);
}
.row {
  position: absolute;
  left: 45px;
  width: 413px;
  display: grid;
  grid-template-columns: 238px 175px;
  align-items: baseline;
  color: #25261f;
}
.word {
  font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  font-style: italic;
  font-size: 27px;
  line-height: 1.2;
  letter-spacing: .3px;
}
.definition {
  font-family: "Kaiti SC", "KaiTi", "STKaiti", cursive;
  font-size: 23px;
  line-height: 1.2;
  white-space: nowrap;
  letter-spacing: -1.1px;
}
.pos {
  font-family: "Segoe Print", "Comic Sans MS", cursive;
  font-style: italic;
  letter-spacing: -1px;
}
.blue { color: #494574; }
.small { font-size: 21px; letter-spacing: -1.5px; }
</style>
</head>
<body>
<main class="notebook" aria-label="Handwritten English vocabulary and Chinese definitions">
  <div class="row" style="top:43px;left:49px;">
    <div class="word">charity</div>
    <div class="definition" style="padding-left:10px;transform:rotate(4deg);"><span class="pos">n.</span> 慈善机构</div>
  </div>
  <div class="row" style="top:77px;left:53px;">
    <div class="word">clarity</div>
    <div class="definition small" style="transform:rotate(4deg);"><span class="pos">n.</span> (思路,图像)清晰</div>
  </div>
  <div class="row" style="top:106px;left:53px;">
    <div class="word">clarify</div>
    <div class="definition" style="padding-left:10px;transform:rotate(3deg);"><span class="pos">v.</span> 阐明,阐释</div>
  </div>

  <div class="row blue" style="top:163px;">
    <div class="word">consistent</div>
    <div class="definition small" style="transform:rotate(4deg);"><span class="pos">adj.</span> 一贯的,与...一致的</div>
  </div>
  <div class="row blue" style="top:194px;">
    <div class="word" style="padding-left:27px;">resist</div>
    <div class="definition" style="padding-left:11px;"><span class="pos">v.</span> 抵制</div>
  </div>
  <div class="row blue" style="top:224px;">
    <div class="word" style="padding-left:24px;">insist</div>
    <div class="definition" style="padding-left:17px;"><span class="pos">v.</span> 坚持</div>
  </div>

  <div class="row" style="top:283px;">
    <div class="word">insert</div>
    <div class="definition"><span class="pos">v.</span> 插入,嵌入</div>
  </div>
  <div class="row" style="top:314px;">
    <div class="word">assert</div>
    <div class="definition small"><span class="pos">v.</span> 断言;坚持主张</div>
  </div>

  <div class="row blue" style="top:376px;">
    <div class="word">eminent</div>
    <div class="definition"><span class="pos">adj.</span> 杰出的</div>
  </div>
  <div class="row blue" style="top:406px;">
    <div class="word">prominent</div>
    <div class="definition small"><span class="pos">adj.</span> 杰出的,重要的</div>
  </div>
  <div class="row blue" style="top:437px;">
    <div class="word">eliminate</div>
    <div class="definition" style="padding-left:17px;"><span class="pos">v.</span> 消除;淘汰</div>
  </div>

  <div class="row" style="top:498px;left:42px;">
    <div class="word">integral</div>
    <div class="definition small" style="padding-left:20px;"><span class="pos">adj.</span> 必不可少的</div>
  </div>
  <div class="row" style="top:531px;left:42px;">
    <div class="word">integrity</div>
    <div class="definition" style="padding-left:40px;"><span class="pos">n.</span> 诚实,正直</div>
  </div>
  <div class="row" style="top:563px;left:42px;">
    <div class="word">integrate</div>
    <div class="definition" style="padding-left:36px;"><span class="pos">v.</span> (使)融入</div>
  </div>

  <div class="row blue" style="top:627px;left:38px;">
    <div class="word">fabricate</div>
    <div class="definition" style="padding-left:50px;"><span class="pos">v.</span> 捏造</div>
  </div>
  <div class="row blue" style="top:656px;left:38px;">
    <div class="word">fluctuate</div>
    <div class="definition small" style="padding-left:50px;transform:rotate(-3deg);"><span class="pos">v.</span> 波动,上下浮动</div>
  </div>
</main>
</body>
</html>
