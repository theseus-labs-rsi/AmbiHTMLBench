<p>进行直播数据复盘的时候，重点关注4个关键数据:</p>
<ul>
<li>人气峰值和平均在线</li>
<li>观众平均停留时长</li>
<li>带货转化率</li>

<div class="root">2、数据复盘</div>

<div class="note one">一般平均在线能稳定在50人左右直播就有<br>基本的带货能力，能够赚到钱</div>
<div class="metric one"><div class="metric-inner">① 人气峰值和平均在线人数</div></div>

<div class="note two">通常停留时长超过2分钟算不错的数据，超<br>过30s是一个及格线</div>
<div class="metric two"><div class="metric-inner">② 观众平均停留时长</div></div>

<div class="note three">一般带货转化率达到1%以上算合格，优秀的<br>3%以上</div>
<div class="metric three"><div class="metric-inner">③ 带货转化率</div></div>

<div class="note four">单个用户给直播间贡献的价值，这个数值越<br>高，说明用户在这个直播间的付费意愿更强</div>
