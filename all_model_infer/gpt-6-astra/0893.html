<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #101729; }
.page {
  position: relative;
  width: 540px;
  height: 722px;
  overflow: hidden;
  color: #c2c8d7;
  background: linear-gradient(180deg, #344e87 0%, #203d79 30%, #122e68 68%, #081329 91%, #0c0d15 100%);
}
.placeholder {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 722px;
  margin: 0;
  background: radial-gradient(ellipse at 44% 15%, rgba(154,172,212,.23), transparent 53%);
}
.placeholder figcaption {
  position: absolute;
  top: 16px;
  left: 18px;
  font: 12px sans-serif;
  color: #8c9bb7;
}
h1 {
  position: absolute;
  top: 136px;
  left: 25px;
  margin: 0;
  width: 495px;
  height: 54px;
  border-bottom: 3px solid #f2f2ef;
  color: #faf9f0;
  font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  font-size: 44px;
  font-weight: 500;
  line-height: 51px;
  white-space: nowrap;
}
table {
  position: absolute;
  top: 222px;
  left: 18px;
  width: 495px;
  height: 436px;
  border-collapse: collapse;
  table-layout: fixed;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  font-size: 15px;
  font-weight: 300;
}
col:first-child { width: 315px; }
col:last-child { width: 178px; }
th, td {
  border: 1px solid #d6d8df;
  padding: 0 6px;
  vertical-align: middle;
  font-weight: 300;
}
th { text-align: center; }
td:first-child { text-align: left; }
td.answer { text-align: center; font-size: 16px; }
td.note { text-align: right; padding-right: 8px; }
.header { height: 35px; }
.question { height: 53px; }
.asset-note { height: 42px; }
.fact-note { height: 40px; }
.last { height: 54px; }
</style>
</head>
<body>
<main class="page">
  <figure class="placeholder" aria-label="背景照片：人物特写">
    <figcaption>[背景照片：人物特写]</figcaption>
  </figure>
  <h1>富人眼中的富人是咋样？</h1>
  <table>
    <colgroup><col><col></colgroup>
    <tbody>
      <tr class="header">
        <th>问题</th>
        <th>回答</th>
      </tr>
      <tr class="question">
        <td>1.您觉得高净值人群资产拥有多少钱才算是?</td>
        <td class="answer">1127,388.4万元</td>
      </tr>
      <tr class="asset-note">
        <td colspan="2" class="note">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr class="question">
        <td>2.请问您每天工作小时数是?</td>
        <td class="answer">8.2小时</td>
      </tr>
      <tr class="question">
        <td>3.您预计退休年龄?</td>
        <td class="answer">59岁</td>
      </tr>
      <tr class="question">
        <td>4.您希望能活到多少岁?</td>
        <td class="answer">88.2岁</td>
      </tr>
      <tr class="fact-note">
        <td colspan="2" class="note">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr class="question">
        <td>5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="answer">6.2个国家</td>
      </tr>
      <tr class="last">
        <td>6.请问您平均每月阅读书籍数量</td>
        <td class="answer">2.4本书</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
