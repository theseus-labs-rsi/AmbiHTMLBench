<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Story Captions</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; font-family: Arial, Helvetica, sans-serif; }
.page { width: 540px; height: 720px; overflow: hidden; }
.panel { position: relative; width: 540px; overflow: hidden; }
.panel-one { height: 314px; }
.panel-two { height: 104px; }
.panel-three { height: 119px; }
.panel-four { height: 95px; }
.panel-five { height: 88px; }
.placeholder {
  position: absolute;
  inset: 0;
  width: 540px;
  height: 100%;
  margin: 0;
  background: #e7e3d4;
}
.placeholder figcaption {
  position: absolute;
  top: 7px;
  left: 8px;
  color: #645f56;
  font-size: 12px;
}
.panel-two .placeholder,
.panel-five .placeholder { background: #b6b0a2; }
.panel-three .placeholder { background: #e4d4ae; }
.panel-four .placeholder { background: #dfd3bf; }
.subtitle {
  position: absolute;
  margin: 0;
  padding: 1px 5px;
  color: #fff;
  background: rgba(20, 17, 13, .79);
  font-weight: 400;
  white-space: nowrap;
  line-height: 1.15;
}
.panel-one .subtitle { top: 217px; left: 60px; font-size: 22px; }
.panel-two .subtitle { top: 27px; left: 35px; font-size: 20px; }
.panel-three .subtitle { top: 40px; left: 69px; font-size: 29px; padding: 1px 7px; }
.panel-four .subtitle { top: 23px; left: 18px; font-size: 20px; }
.panel-five .subtitle { top: 39px; left: 6px; font-size: 18px; padding: 1px 4px; }
.chinese-box {
  position: absolute;
  left: 239px;
  top: 91px;
  width: 205px;
  height: 63px;
  border: 1px solid #222;
  background: rgba(80, 80, 80, .27);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 27px;
  font-weight: 900;
  text-shadow: -1px -1px 0 #777, 1px -1px 0 #777, -1px 1px 0 #777, 1px 1px 0 #777;
}
.handle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  border: 1px solid #444;
}
.tl { top: -4px; left: -4px; }
.tr { top: -4px; right: -4px; }
.bl { bottom: -4px; left: -4px; }
.br { bottom: -4px; right: -4px; }
.connector {
  position: absolute;
  left: 211px;
  top: 116px;
  width: 15px;
  height: 15px;
  border: 1px solid #333;
  background: #fff;
}
.connector::after {
  content: "";
  position: absolute;
  left: 14px;
  top: 6px;
  width: 13px;
  border-top: 1px solid #333;
}
</style>
</head>
<body>
<main class="page">
  <section class="panel panel-one">
    <figure class="placeholder" style="height:314px;">
      <figcaption>[Illustration: man in a jacket beside a doorway]</figcaption>
    </figure>
    <div class="connector" aria-hidden="true"></div>
    <div class="chinese-box" lang="zh">
      故事都非常好
      <span class="handle tl" aria-hidden="true"></span>
      <span class="handle tr" aria-hidden="true"></span>
      <span class="handle bl" aria-hidden="true"></span>
      <span class="handle br" aria-hidden="true"></span>
    </div>
    <p class="subtitle">"Well, no," said Mr. McBee. "Not really."</p>
  </section>
  <section class="panel panel-two">
    <figure class="placeholder" style="height:104px;">
      <figcaption>[Photo: person holding an open book]</figcaption>
    </figure>
    <p class="subtitle">"But there's a lion!" said Mr. McBee. "In the library!"</p>
  </section>
  <section class="panel panel-three">
    <figure class="placeholder" style="height:119px;">
      <figcaption>[Illustration: lion beside the card catalog]</figcaption>
    </figure>
    <p class="subtitle">He sniffed the card catalog.</p>
  </section>
  <section class="panel panel-four">
    <figure class="placeholder" style="height:95px;">
      <figcaption>[Illustration: close-up of a lion]</figcaption>
    </figure>
    <p class="subtitle">There weren't any rules about lions at story hour, either.</p>
  </section>
  <section class="panel panel-five">
    <figure class="placeholder" style="height:88px;">
      <figcaption>[Photo: person holding an open book]</figcaption>
    </figure>
    <p class="subtitle">He waited for another story, but the children began to walk away.</p>
  </section>
</main>
</body>
</html>
