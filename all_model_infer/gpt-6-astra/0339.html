<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅拍婚纱照大PK</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif CJK SC", serif;
  color: #080a0a;
}
.page {
  position: relative;
  width: 540px;
  min-height: 720px;
  padding-top: 22px;
  background: linear-gradient(to right, #c3effb 0, #c3effb 272px, #eaf6f8 272px, #eaf6f8 100%);
  overflow: hidden;
}
h1 {
  margin: 0;
  height: 65px;
  text-align: center;
  font-size: 49px;
  line-height: 65px;
  font-weight: 900;
  font-style: italic;
  white-space: nowrap;
}
.headings {
  position: relative;
  display: grid;
  grid-template-columns: 234px 234px;
  column-gap: 35px;
  margin: 4px 17px 0 20px;
  height: 53px;
}
.headings h2 {
  margin: 0;
  font-size: 26px;
  line-height: 36px;
  font-weight: normal;
  font-style: italic;
  white-space: nowrap;
}
.headings h2:first-child { padding-left: 3px; }
.headings h2:last-child { text-align: right; padding-right: 8px; }
.versus {
  position: absolute;
  top: 1px;
  left: 234px;
  font-family: "Times New Roman", serif;
  font-size: 26px;
  line-height: 34px;
  font-weight: bold;
  font-style: italic;
}
.columns {
  display: grid;
  grid-template-columns: 234px 234px;
  gap: 35px;
  margin: 0 17px 0 20px;
}
.gallery {
  display: grid;
  grid-template-columns: 111px 111px;
  grid-template-rows: 145px 145px 108px;
  column-gap: 12px;
  row-gap: 9px;
}
.placeholder {
  margin: 0;
  width: 111px;
  height: 145px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9px;
  overflow: hidden;
  border-radius: 2px;
  background: rgba(142, 157, 150, 0.18);
  color: #485652;
  font-family: "KaiTi", "STKaiti", serif;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}
.placeholder.wide {
  grid-column: 1 / 3;
  width: 234px;
  height: 108px;
  margin-top: 1px;
}
.description {
  margin: 12px 0 0;
  font-size: 18px;
  line-height: 24px;
  letter-spacing: 0.5px;
  font-style: italic;
  white-space: nowrap;
}
.description .indent { padding-left: 36px; }
</style>
</head>
<body>
<main class="page">
  <h1>“旅拍婚纱照大PK”</h1>
  <div class="headings">
    <h2>新疆 · 喀什旅拍</h2>
    <span class="versus">VS</span>
    <h2>新疆 · 伊犁旅拍</h2>
  </div>
  <div class="columns">
    <section>
      <div class="gallery">
        <figure class="placeholder">[照片：新人与身着民族服饰的儿童合影]</figure>
        <figure class="placeholder">[照片：雪山前新人与儿童合影]</figure>
        <figure class="placeholder">[照片：新人与儿童走在雪山下的草地上]</figure>
        <figure class="placeholder">[照片：新娘与身着民族服饰的儿童合影]</figure>
        <figure class="placeholder wide">[照片：雪山下新人与儿童在草地上奔跑]</figure>
      </div>
      <p class="description"><span class="indent">在这片色彩浓郁的土地，</span><br>
增添了文化和艺术的极致体现<br>
满满的西部风格出片效果太绝<br>
了！如果你想要不一样的婚纱<br>
旅拍，这里一定是首要之选！</p>
    </section>
    <section>
      <div class="gallery">
        <figure class="placeholder">[照片：山林草坡上的新人]</figure>
        <figure class="placeholder">[照片：戴白帽的新娘与新郎近景]</figure>
        <figure class="placeholder">[照片：新娘与白色西装新郎合影]</figure>
        <figure class="placeholder">[照片：新人走在山间草坡上]</figure>
        <figure class="placeholder wide">[照片：阳光下新人与深色树林前的草坡]</figure>
      </div>
      <p class="description"><span class="indent">阳光和草原的风景像儿时</span><br>
梦里的画面一般梦幻，阳光下<br>
吹过的风，晚间夕阳落在芳草<br>
地上，都不及情到浓时两人相<br>
视一笑的那一抹温柔</p>
    </section>
  </div>
</main>
</body>
</html>
