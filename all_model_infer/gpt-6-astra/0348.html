<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销——第③步：调整所得税</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #faf5e9;
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", "SimHei", sans-serif;
}
.page {
  position: relative;
  width: 540px;
  height: 722px;
  margin: 0 auto;
  overflow: hidden;
  background: repeating-linear-gradient(91deg, #faf5e9 0px, #faf5e9 3px, #eae2d1 4px, #faf5e9 5px);
}
.sheet {
  position: absolute;
  inset: 28px 22px 15px;
  background: #fff;
  border: 1.3px solid #766348;
  border-radius: 10px;
}
h1 {
  position: absolute;
  top: 56px;
  left: 68px;
  width: 424px;
  margin: 0;
  text-align: center;
  color: #735b30;
  font-size: 36px;
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: 0;
}
.subtitle {
  position: absolute;
  left: 69px;
  top: 198px;
  padding: 0 10px;
  height: 26px;
  color: #795829;
  font-size: 20px;
  font-weight: 700;
  line-height: 26px;
  letter-spacing: 3px;
  background: linear-gradient(0deg, transparent, #fce7b8 22%, #f9dda1 65%, transparent);
  border-radius: 40%;
}
.section {
  position: absolute;
  left: 67px;
  width: 332px;
  height: 98px;
  font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  font-size: 17px;
  color: #161616;
}
.individual { top: 257px; }
.consolidated { top: 378px; }
.section-title { margin: 0; line-height: 28px; white-space: nowrap; }
.section-title strong { font-weight: 800; }
.calculation {
  display: grid;
  grid-template-columns: 130px 15px 1fr;
  align-items: center;
  margin-top: 0;
  height: 64px;
}
.values {
  text-align: right;
  line-height: 31px;
  white-space: nowrap;
  font-size: 17px;
}
.brace {
  height: 61px;
  color: #6499b0;
  font-family: Georgia, serif;
  font-size: 65px;
  font-weight: normal;
  line-height: 55px;
  transform: scaleX(.43);
  transform-origin: center;
  text-shadow: 3px 1px 4px #c6d8dc;
}
.result {
  font-size: 16px;
  white-space: nowrap;
  letter-spacing: -0.65px;
}
.group-note {
  position: absolute;
  left: 410px;
  top: 321px;
  width: 95px;
  font-size: 17px;
  line-height: 31px;
  text-align: center;
}
.entry {
  position: absolute;
  top: 500px;
  left: 82px;
  color: #7a6a48;
  font-family: "Noto Serif CJK SC", "SimSun", serif;
  font-size: 17px;
  line-height: 33px;
  white-space: nowrap;
}
.entry .credit { padding-left: 96px; }
.placeholder {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #887655;
  font-family: sans-serif;
  font-size: 10px;
  text-align: center;
}
.paw-left { top: 42px; left: 145px; width: 24px; height: 24px; }
.paw-right { top: 35px; left: 400px; width: 30px; height: 30px; }
.cat-left { left: 22px; top: 630px; width: 138px; height: 85px; background: #fcf4dc; border-radius: 55%; }
.cat-right { left: 404px; top: 601px; width: 115px; height: 121px; background: #fbf7ed; border-radius: 45% 45% 15% 15%; }
.arrow {
  left: 399px;
  top: 319px;
  width: 15px;
  height: 106px;
  background: #619fc3;
  clip-path: polygon(24% 0, 79% 0, 79% 90%, 100% 90%, 50% 100%, 0 90%, 24% 90%);
}
.arrow span { font-size: 6px; color: #eaf5fb; writing-mode: vertical-rl; }
</style>
</head>
<body>
<main class="page">
  <div class="sheet"></div>
  <div class="placeholder paw-left">[爪印装饰]</div>
  <div class="placeholder paw-right">[爪印装饰]</div>

  <h1>内部交易抵销<br>第③步：调整所得税</h1>

  <div class="subtitle">若实现60%对外销售</div>

  <section class="section individual">
    <p class="section-title"><strong>个别报表层面</strong>因为存货跌价准备:</p>
    <div class="calculation">
      <div class="values">账面价值900<br>计税基础1200</div>
      <div class="brace">}</div>
      <div class="result">递延所得税资产300*25%=75</div>
    </div>
  </section>

  <div class="placeholder arrow"><span>[向下箭头]</span></div>
  <div class="group-note">【集团角度】<br>调增25</div>

  <section class="section consolidated">
    <p class="section-title"><strong>合并报表层面</strong>因为存货跌价准备:</p>
    <div class="calculation">
      <div class="values">账面价值800<br>计税基础1200</div>
      <div class="brace">}</div>
      <div class="result">递延所得税资产400*25%=100</div>
    </div>
  </section>

  <div class="entry">
    <div>会计处理：借：递延所得税资产25</div>
    <div class="credit">贷：所得税费用25</div>
  </div>

  <div class="placeholder cat-left">[插画：左下方蜷卧的猫]</div>
  <div class="placeholder cat-right">[插画：右下方戴帽子的猫]</div>
</main>
</body>
</html>
