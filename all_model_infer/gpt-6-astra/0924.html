<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 做好竞品分析</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #e9cbb1;
  color: #181918;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
}
.document {
  position: relative;
  width: 540px;
  height: 722px;
  margin: 0 auto;
  overflow: hidden;
}
.paper {
  position: absolute;
  left: 26px;
  top: 30px;
  width: 488px;
  height: 661px;
  border-radius: 17px 17px 13px 13px;
  background: #faf7f0;
  box-shadow: 3px 3px 5px rgba(95, 66, 43, .17);
}
.ribbon-shadow {
  position: absolute;
  top: 14px;
  left: 15px;
  width: 204px;
  height: 28px;
  background: #e9dbcc;
  clip-path: polygon(0 0, 94% 0, 100% 50%, 94% 100%, 0 100%);
}
.ribbon {
  position: absolute;
  left: 25px;
  top: 19px;
  width: 207px;
  height: 29px;
  padding-left: 7px;
  line-height: 29px;
  color: #fff9ec;
  background: #955b32;
  font-size: 13px;
  letter-spacing: 3px;
  white-space: nowrap;
  clip-path: polygon(0 0, 93% 0, 100% 50%, 93% 100%, 0 100%);
}
h1 {
  position: absolute;
  left: 24px;
  top: 82px;
  margin: 0;
  font-size: 39px;
  line-height: 55px;
  font-weight: 900;
  letter-spacing: .1px;
}
h1 .number {
  display: inline-block;
  margin-right: 20px;
  font-family: Arial, sans-serif;
  font-size: 41px;
  font-weight: 900;
}
.copy {
  position: absolute;
  left: 25px;
  top: 170px;
  font-size: 17px;
  line-height: 27px;
  letter-spacing: 1px;
}
.copy p { margin: 0; }
.copy .second { margin-top: 25px; }
ol {
  list-style: none;
  padding: 0;
  margin: 26px 0 0;
  line-height: 26.5px;
}
li { margin: 0; padding: 0; }
.item-title { font-weight: 700; }
.detail { padding-left: 27px; }
.footer {
  position: absolute;
  left: 0;
  top: 608px;
  width: 488px;
  height: 53px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: 2px;
  border-radius: 0 0 13px 13px;
  background: #ecd8c8;
  font-family: "Songti SC", SimSun, serif;
  font-size: 19px;
  font-weight: 700;
}
.footer::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -3px;
  height: 4px;
  background: linear-gradient(135deg, transparent 50%, #ecd8c8 50%) 0 0 / 8px 4px repeat-x;
}
.notch {
  position: absolute;
  top: 589px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e9cbb1;
}
.notch.left { left: -10px; }
.notch.right { right: -10px; }
</style>
</head>
<body>
<main class="document">
  <article class="paper">
    <div class="ribbon-shadow" aria-hidden="true"></div>
    <div class="ribbon">新媒体账号运营6种方法</div>
    <h1><span class="number">03</span>做好竞品分析</h1>
    <section class="copy">
      <p>前期的竞品分析<br>一定要花大量的时间和精力去收集信息</p>
      <p class="second">仔细分析<br>可以从以下几个方面来看</p>
      <ol>
        <li><div class="item-title">1、账号人设标签</div></li>
        <li><div class="item-title">2、账号选题规划</div></li>
        <li>
          <div class="item-title">3、内容脚本拆解：</div>
          <div class="detail">结构、矛盾点、金句、痒点</div>
        </li>
        <li>
          <div class="item-title">4、内容形式：</div>
          <div class="detail">场景道具服装，拍摄剪辑节奏</div>
        </li>
        <li>
          <div class="item-title">5、运营策略：</div>
          <div class="detail">发布时间和频率，封面，文案，线上互动<br>用户运营，引流途径</div>
        </li>
      </ol>
    </section>
    <footer class="footer">@新媒体运营的十万个为什么</footer>
    <div class="notch left" aria-hidden="true"></div>
    <div class="notch right" aria-hidden="true"></div>
  </article>
</main>
</body>
</html>
