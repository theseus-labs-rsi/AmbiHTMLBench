<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地球自然篇（一）</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #ffffff; font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
.page {
  position: relative;
  width: 540px;
  height: 720px;
  overflow: hidden;
  border: 7px solid #59d9bd;
  background: linear-gradient(160deg, #59a9e9 0%, #5eade7 45%, #84c8ea 100%);
  color: white;
}
.banner {
  position: absolute;
  top: 22px;
  right: -1px;
  width: 247px;
  height: 49px;
  border-radius: 29px 0 0 29px;
  background: #ffdc00;
  box-shadow: -4px 3px 0 rgba(30, 130, 207, .32);
  color: #20252c;
  font-size: 28px;
  line-height: 49px;
  text-align: center;
  font-weight: 900;
  white-space: nowrap;
}
.entry {
  position: absolute;
  left: 32px;
  width: 462px;
  height: 186px;
  display: grid;
  grid-template-columns: 135px 307px;
  column-gap: 20px;
}
.first { top: 82px; }
.second { top: 291px; }
.third { top: 500px; }
.cover {
  position: relative;
  margin: 0;
  width: 135px;
  height: 186px;
  border: 3px solid #ffffff;
  border-radius: 19px;
  box-shadow: -4px 4px 0 rgba(51, 139, 198, .3);
  overflow: hidden;
  background: rgba(14, 79, 115, .35);
  text-align: center;
}
.cover .caption {
  position: absolute;
  top: 72px;
  left: 6px;
  right: 6px;
  font-size: 12px;
  line-height: 20px;
  color: #fff;
}
.cover-title {
  margin-top: 19px;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 14px;
}
.cover-subtitle {
  margin-top: 5px;
  font-size: 5px;
  letter-spacing: .4px;
}
.cover-credit {
  position: absolute;
  bottom: 13px;
  width: 100%;
  font-size: 5px;
  line-height: 7px;
  letter-spacing: .6px;
}
.details { position: relative; height: 186px; }
h2 {
  display: inline-block;
  margin: 15px 0 0;
  padding: 0 0 7px;
  border-bottom: 1px solid rgba(255,255,255,.94);
  font-size: 27px;
  line-height: 34px;
  font-weight: 900;
  letter-spacing: -.6px;
  white-space: nowrap;
}
.rating {
  margin-top: 7px;
  font-size: 14px;
  line-height: 23px;
}
.score {
  padding-left: 4px;
  color: #ffdf00;
  font-size: 24px;
  font-weight: 800;
}
.platform { font-size: 14px; line-height: 22px; }
.platform strong { font-weight: 700; }
.summary {
  position: absolute;
  left: 0;
  top: 123px;
  width: 307px;
  min-height: 59px;
  display: flex;
  gap: 7px;
  align-items: flex-start;
  padding: 10px 10px 7px 16px;
  background: #fff;
  border-radius: 15px;
  box-shadow: 0 -5px 0 #ffe992, -4px 3px 0 rgba(56, 155, 212, .28);
  color: #222;
  font-size: 16px;
  line-height: 20px;
}
.summary::before {
  content: "";
  position: absolute;
  left: 11px;
  top: -7px;
  width: 15px;
  height: 12px;
  background: #fff;
  border-top: 4px solid #ffe992;
  transform: rotate(-36deg);
  border-radius: 5px;
}
.label { flex: 0 0 34px; font-weight: 800; position: relative; }
.summary-text { flex: 1; white-space: nowrap; position: relative; }
.red { color: #ff5c66; }
.rule {
  position: absolute;
  left: 18px;
  right: 18px;
  height: 0;
  border-top: 2px dashed rgba(230, 249, 255, .48);
}
.rule-one { top: 277px; }
.rule-two { top: 486px; }
.second h2 { margin-top: 14px; }
.third h2 { margin-top: 14px; font-size: 26px; }
.third .summary { top: 126px; }
</style>
</head>
<body>
<main class="page">
  <header class="banner">地球自然篇（一）</header>

  <section class="entry first">
    <figure class="placeholder cover" aria-label="蓝色星球2海报">
      <div class="cover-title">BLUE PLANET II</div>
      <div class="cover-subtitle">A New World of Hidden Depths</div>
      <figcaption class="caption">[海报：海底世界与鲸]</figcaption>
      <div class="cover-credit">JAMES HONEYBORNE<br>MARK BROWNLOW</div>
    </figure>
    <div class="details">
      <h2>《 蓝色星球2 》</h2>
      <div class="rating">豆瓣评分：<span class="score">9.9</span></div>
      <div class="platform">观看平台：<strong>腾 xun 视频</strong></div>
      <div class="summary">
        <span class="label">简介</span>
        <div class="summary-text"><span class="red">BBC史上最美</span>纪录片，和孩子一起<br><span class="red">探索奇妙、未知的海底世界</span></div>
      </div>
    </div>
  </section>

  <div class="rule rule-one"></div>

  <section class="entry second">
    <figure class="placeholder cover" aria-label="地球脉动2海报">
      <div class="cover-title">PLANET EARTH II</div>
      <figcaption class="caption">[海报：地球]</figcaption>
    </figure>
    <div class="details">
      <h2>《 地球脉动 2 》</h2>
      <div class="rating">豆瓣评分：<span class="score">9.9</span></div>
      <div class="platform">观看平台：<strong>腾 xun 视频</strong></div>
      <div class="summary">
        <span class="label">简介</span>
        <div class="summary-text">绚丽多彩，属于孩子的第一堂<span class="red">自</span><br><span class="red">然启蒙</span>课</div>
      </div>
    </div>
  </section>

  <div class="rule rule-two"></div>

  <section class="entry third">
    <figure class="placeholder cover" aria-label="七个世界一个星球海报">
      <div class="cover-subtitle">[illegible]</div>
      <div class="cover-title" style="margin-top:12px;font-size:7px;line-height:8px;">BBC<br>SEVEN<br>WORLDS<br>ONE<br>PLANET</div>
      <div class="cover-subtitle">THERE'S NO PLACE LIKE EARTH</div>
      <figcaption class="caption" style="top:104px;">[海报：金丝猴]</figcaption>
      <div class="cover-credit">DAVID ATTENBOROUGH</div>
    </figure>
    <div class="details">
      <h2>《 七个世界一个星球 》</h2>
      <div class="rating">豆瓣评分：<span class="score">9.7</span></div>
      <div class="platform">观看平台：<strong>腾 xun 视频</strong></div>
      <div class="summary">
        <span class="label">简介</span>
        <div class="summary-text">BBC与CCTV联合巨制，用全新的<br>自然视野，<span class="red">带给孩子思考与感动</span></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
