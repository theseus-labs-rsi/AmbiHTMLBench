<!DOCTYPE html>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #fff; }
.page {
  position: relative;

  height: 722px;
  overflow: hidden;

    repeating-linear-gradient(to bottom, transparent 0 74px, rgba(129,173,180,.12) 74px 75px);
  background-position: 6px 2px;
}
.holes {
  position: absolute;
  left: 14px;
  top: 17px;
  width: 14px;
  height: 705px;
  background: radial-gradient(circle at 6px 6px, #abc2ce 0 5px, transparent 6px) 0 0 / 14px 46px repeat-y;
}
h1 {
  position: absolute;
  top: -2px;
  left: 25px;
  margin: 0;
  color: #321675;
  font-family: "STKaiti", "KaiTi", "Kaiti SC", cursive;
  font-size: 35px;
  line-height: 43px;
  font-weight: 900;
  letter-spacing: 2px;
  white-space: nowrap;
}
.writing {
  position: absolute;
  left: 38px;
  top: 52px;
  color: #ee6972;

  letter-spacing: 3px;

}
.writing div { height: 42px; white-space: nowrap; }
.writing .wide { letter-spacing: 2px; }
.note {
  position: absolute;
  top: 43px;
  left: 379px;
  width: 163px;
  height: 161px;
  filter: drop-shadow(-2px 3px 1px rgba(60,62,41,.4));
  transform: rotate(1deg);
}
.note-paper {
  width: 100%;
  height: 100%;
  padding: 12px 12px;
  background: linear-gradient(112deg, #fffedd, #f8f2c5);
  clip-path: polygon(0 0, 100% 0, 100% 80%, 81% 100%, 0 100%);

  font-family: "STKaiti", "KaiTi", "Kaiti SC", cursive;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 33px;
}
.note-paper::after {
  content: "";

  right: 0;
  bottom: 0;
  width: 32px;
  height: 37px;
  background: linear-gradient(135deg, #faf2c9, #dbd6ad);

.table-zone {
  position: absolute;
  left: 43px;
  top: 467px;
  width: 481px;
}

  width: 100%;
  height: 209px;
  border-collapse: collapse;

  border: 1px solid #99b467;

<main class="page">

        <tr><td>生物</td><td>58</td><td>9</td><td></td><td>67</td></tr>
        <tr><td>信息学</td><td>34</td><td>13</td><td></td><td>53</td></tr>

      </tbody>
    </table>
  </section>
