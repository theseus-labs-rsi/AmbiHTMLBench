<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固化的做题思维</title>
<script>
window.MathJax = {tex: {inlineMath: [['$', '$']], displayMath: [['$$', '$$']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #c5a77d;
  font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
.page {
  position: relative;
  width: 540px;
  height: 405px;
  overflow: hidden;
  background: linear-gradient(105deg, #d6b482, #b8996d);
}
.screen {
  position: absolute;
  left: 34px;
  top: 16px;
  width: 504px;
  height: 384px;
  border: 3px solid #242522;
  background: linear-gradient(120deg, #b9bab4, #cdcdc4 48%, #aaa99b);
  transform: rotate(1.1deg);
  transform-origin: center;
  box-shadow: 0 0 5px #655841;
  overflow: hidden;
}
.status {
  position: absolute;
  left: 5px;
  top: 1px;
  color: #272724;
  font-size: 6px;
  white-space: nowrap;
}
.placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #383936;
  font-size: 9px;
  text-align: center;
}
.floating-control {
  position: absolute;
  left: 119px;
  top: 0;
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: rgba(85, 87, 81, .48);
  font-size: 7px;
  color: #e0e0d9;
}
.video {
  position: absolute;
  right: 0;
  top: 0;
  width: 94px;
  height: 54px;
  border: 1px solid #726c52;
  background: #85877a;
}
.content {
  position: absolute;
  inset: 0;
  color: #e5393e;
  font-size: 13px;
  line-height: 1.5;
}
.line { position: absolute; margin: 0; white-space: nowrap; }
.heading { left: 56px; top: 73px; }
.first { left: 56px; top: 106px; }
.test-title {
  left: 140px;
  top: 147px;
  font-size: 21px;
  letter-spacing: 1px;
  color: #171915;
  font-family: "KaiTi", "STKaiti", Arial, sans-serif;
}
.second { left: 58px; top: 185px; }
.lower {
  position: absolute;
  left: 59px;
  top: 220px;
  width: 420px;
  display: grid;
  grid-template-columns: 190px 230px;
  column-gap: 2px;
}
.left-column p, .right-column p {
  margin: 0 0 14px;
  white-space: nowrap;
}
.right-column { padding-top: 2px; }
.right-column .note { padding-left: 22px; margin-top: -2px; }
.underlined { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<main class="page">
  <section class="screen">
    <div class="status">19:29 5月14日周五</div>
    <div class="placeholder floating-control">[悬浮按钮]</div>
    <div class="placeholder video">[右上角：人物视频画面]</div>
    <div class="content">
      <p class="line heading">固化的做题思维：</p>
      <p class="line first">1. 喜欢忠于自己的内心和感觉。</p>
      <div class="line test-title">2017年 12月第一套 Text 1</div>
      <p class="line second">2. 喜欢选符合<span class="underlined">常识的选项。</span> <span class="underlined">20年</span>左右的常识和经验的累积</p>
      <div class="lower">
        <div class="left-column">
          <p>3. 喜欢选自己认识的选项。</p>
          <p>4. 喜欢选自己不认识的选项。</p>
          <p>5. 火急火燎一把火</p>
        </div>
        <div class="right-column">
          <p>6. 囫囵吞枣选择法</p>
          <p class="note">（有逃避，有厌烦）</p>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
