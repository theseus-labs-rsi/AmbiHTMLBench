  <section class="introduction">
    <p class="indent">还可以发现，斜钉一根木条的四边形木架的形状不会改变，这是因为斜钉<br>一根木条后，四边形变成两个三角形。由于三角形有稳定性，斜钉一根木条的<br>窗框在未安装好之前也不会变形。</p>
    <p class="indent">三角形的稳定性有广泛的应用，图11.1-8表示其中一些例子。你能再举一<br>些例子吗？</p>
