<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你能接受孩子的平庸吗？</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Simulating mobile width */
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px;
            border-bottom: 1px solid transparent; /* Visual spacing */
        }

        .header-left {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .back-icon {
            font-size: 20px;
            color: #333;
            margin-right: 12px;
            font-weight: bold;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .write-answer {
            display: flex;
            align-items: center;
            color: #1772d6; /* Zhihu blue-ish */
            font-size: 15px;
            font-weight: 500;
        }

        .write-answer svg {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            fill: currentColor;
        }

        .more-icon {
            font-size: 20px;
            color: #333;
            letter-spacing: 2px;
        }

        /* Content Styles */
        .content {
            padding: 20px 24px;
            font-size: 19px;
            line-height: 1.6;
            color: #222;
            text-align: justify;
        }

        .paragraph {
            margin-bottom: 28px;
        }

        .highlight {
            background-color: #fce4e4; /* Light pink highlight */
            padding: 2px 0;
            /* To make the highlight look like the image where it wraps lines */
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        
        /* Specific adjustment for the highlighted block to match image spacing */
        .highlight-block {
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .link-text {
            color: #1772d6;
            position: relative;
        }
        
        .search-icon {
            font-size: 12px;
            vertical-align: super;
            margin-left: 2px;
        }

        /* Footer Meta */
        .meta-info {
            font-size: 13px;
            color: #999;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        /* Share Bar */
        .share-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 0 30px 0;
        }

        .share-btn {
            display: flex;
            align-items: center;
            background-color: #f7f7f7;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: #555;
        }

        .share-icon {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Icon Colors */
        .icon-wechat { background-color: #2dc100; }
        .icon-moments { background: conic-gradient(from 180deg at 50% 50%, #FFD700 0deg, #FF4500 90deg, #1E90FF 180deg, #32CD32 270deg, #FFD700 360deg); }
        .icon-qq { background-color: #12b7f5; }
        .icon-image { background-color: #1772d6; border-radius: 4px; }

    </style>
</head>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="back-icon">&lt;</span>
            <span class="header-title">你能接受孩子的平庸吗？</span>
        </div>
        <div class="header-right">
            <div class="write-answer">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>

    <!-- Main Content -->
    <div class="content">
        <div class="paragraph">
            以上是我最近在读的一本书，作家<span class="link-text">刘继荣<span class="search-icon">🔍</span></span>《坐在路边鼓掌的人》里面讲的小故事。
        </div>

        <div class="paragraph highlight-block">
            <span class="highlight">天下有多少雄心勃勃的父母，奢望自己的孩子既能做顶天立地的栋梁，又能开繁花结硕果。我们的欲望有多深，孩子就有多累。</span>
        </div>

        <div class="paragraph">
            如果孩子能自己找到出路，快乐与成就兼得，如果能平庸而幸福地过一生，父母又何必强求。
        </div>

        <div class="paragraph">
            如果他们健康、快乐，如果那是他们想要的生活，我们的孩子，又何妨做一个普通人。
        </div>

        <div class="meta-info">
            编辑于 2023-03-03 10:44 · IP 属地江苏

    </div>
