<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为什么选择新概念动画版？</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #cce6ff; /* Light blue background matching the image border */
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 20px 25px 30px 25px;
            box-sizing: border-box;
            position: relative;
            /* Simulating the white card look */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-wrapper {
            text-align: center;
            margin-bottom: 25px;
            margin-top: -10px;
        }

        .main-title {
            display: inline-block;
            background-color: #ffcc66; /* Orange-yellow pill shape */
            color: #333;
            font-size: 22px;
            font-weight: bold;
            padding: 8px 25px;
            border-radius: 25px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            letter-spacing: 1px;
        }

        .section {
            margin-bottom: 18px;
        }

        .section-title {
            color: #d32f2f; /* Red color for headers */
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .section-content {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            padding-left: 2px;
        }

        .emoji {
            font-style: normal;
            margin: 0 2px;
        }

        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
        }

        .text-column {
            flex: 1;
            padding-right: 10px;
        }

        .image-placeholder {
            width: 180px;
            height: 140px;
            /* Using a gradient to simulate the book covers roughly if image fails, 
               but primarily acting as a placeholder container */
            background: linear-gradient(to right, #e67e22, #f1c40f, #2ecc71, #3498db);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        
        /* Simulating the book stack visual slightly better with CSS since I can't embed the real image */
        .book-stack {
            width: 160px;
            height: 130px;
            position: relative;
        }
        .book {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 110px;
            border-radius: 2px 4px 4px 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .b1 { left: 0; background: #e67e22; z-index: 1; }
        .b2 { left: 25px; background: #9b59b6; z-index: 2; }
        .b3 { left: 50px; background: #3498db; z-index: 3; }
        .b4 { left: 75px; width: 80px; background: #f1c40f; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-weight: bold; font-size: 10px; border: 1px solid #d4ac0d;}
        
        .b4 span { display: block; }
        .b4 .num { font-size: 24px; color: #27ae60; margin-top: 5px; }

        .arrow {
            font-family: monospace;
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="header-wrapper">
        <div class="main-title">为什么选择新概念动画版？</div>
    </div>

    <div class="section">
        <div class="section-title">一、无需死记硬背</div>
        <div class="section-content">
            打破枯燥学习方式<span class="emoji">🧐</span>，用动画通俗易懂掌握听说读写能力
        </div>
    </div>

    <div class="section">
        <div class="section-title">二、融入生活场景</div>
        <div class="section-content">
            <span class="emoji">💪</span>加入幽默段子、人文历史，生动形象又很好理解
        </div>
    </div>

    <div class="section">
        <div class="section-title">三、螺旋式教学</div>
        <div class="section-content">
            从基础层层提高，不怕孩子基础差跟不上<span class="emoji">👍</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">四、闭环学习</div>
        <div class="section-content">
            <span class="emoji">👉</span>预热<span class="arrow">→</span>精讲<span class="arrow">→</span>巩固<span class="arrow">→</span>个性报告<br>
            “听说读写练”覆盖式讲解，看完有题干巩固基础
        </div>
    </div>

    <div class="section">
        <div class="section-title">五、内容优质放心</div>
        <div class="section-content">
            有多年经验，《新概念英语》原创班底深度参与，原汁原味诠释精髓<span class="emoji">✌️</span>
        </div>
    </div>

    <div class="bottom-area">
        <div class="text-column">
            <div class="section" style="margin-bottom: 0;">
                <div class="section-title">六、时间恰当</div>
                <div class="section-content">
                    每天只需花20min<span class="emoji">🕐</span>左右防止时间过长产生厌恶感
                </div>
            </div>
        </div>
        
        <div class="image-placeholder" style="background: transparent; box-shadow: none;">
            <!-- CSS representation of the book stack to maintain layout fidelity without external assets -->
            <div class="book-stack">
                <div class="book b1"></div>
                <div class="book b2"></div>
                <div class="book b3"></div>
                <div class="book b4">
                    <span style="font-size: 8px;">新概念英语</span>
                    <span style="font-size: 6px;">NEW CONCEPT ENGLISH</span>
                    <span class="num">1</span>
                    <div style="width: 20px; height: 20px; background: #3498db; border-radius: 50%; margin-top: 5px;"></div>
                    <div style="display: flex; gap: 2px; margin-top: 2px;">
                        <div style="width: 10px; height: 10px; background: #e67e22; border-radius: 50%;"></div>
                        <div style="width: 10px; height: 10px; background: #e67e22; border-radius: 50%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
