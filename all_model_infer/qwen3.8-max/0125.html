<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句摘抄 - 心态主题</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333; /* Dark background to highlight the card */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Songti SC", "SimSun", "STSong", serif;
        }

        .card {
            width: 600px;
            background-color: #dcbfa6; /* Beige/Tan background matching the image */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Header Section */
        .header {
            background-color: #f2e6d9; /* Lighter beige for header */
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", serif; /* Calligraphy style approximation */
            font-size: 58px;
            color: #d32f2f; /* Red color */
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
            transform: skewX(-5deg); /* Slight italic effect common in logos */
        }

        .logo-subtext {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #d32f2f;
            letter-spacing: 4px;
            margin-top: 8px;
            margin-left: 5px;
        }

        .title-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .top-label {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        .main-theme {
            font-size: 42px;
            font-weight: bold;
            color: #000;
            border-bottom: 4px solid #000;
            padding-bottom: 5px;
            font-family: "SimHei", "Heiti SC", sans-serif;
            letter-spacing: 2px;
        }

        /* Content Section */
        .content {
            padding: 40px 50px;
            color: #333;
        }

        .quote-block {
            margin-bottom: 50px;
        }

        .quote-text {
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #2c2c2c;
            font-family: "Songti SC", "SimSun", serif;
        }

        .definition-label {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        .definition-text {
            font-size: 20px;
            line-height: 1.6;
            text-align: justify;
            color: #444;
            font-family: "SimHei", "Heiti SC", sans-serif; /* The definition text looks slightly more sans-serif or standard songti in the image, sticking to a clean readable font */
        }
        
        /* Adjusting definition text font to match image better (looks like a standard Hei or Song mix, let's use a clean sans for readability as per image appearance) */
        .definition-text {
             font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
             font-weight: 500;
        }

    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-text">人民日報</div>
                <div class="logo-subtext">RENMIN RIBAO</div>
            </div>
            <div class="title-container">
                <div class="top-label">金句 | 摘抄</div>
                <div class="main-theme">心态主题</div>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            
            <!-- First Quote -->
            <div class="quote-block">
                <div class="quote-text">
                    且行且忘且随风，<br>
                    且行且看且从容。
                </div>
                <div class="definition-label">释义：</div>
                <div class="definition-text">
                    意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。
                </div>
            </div>

            <!-- Second Quote -->
            <div class="quote-block">
                <div class="quote-text">
                    我将玫瑰藏于身后风起花落，<br>
                    从此鲜花赠自己，<br>
                    纵马踏花向自由。
                </div>
                <div class="definition-label">释义：</div>
                <div class="definition-text">
                    我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。
                </div>
            </div>

        </div>
    </div>

</body>
</html>
