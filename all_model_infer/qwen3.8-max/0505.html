<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京剧艺术节海报</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --primary-red: #c8161d;
            --dark-red: #a01015;
            --pink-accent: #d65a7a;
            --light-pink: #f4b8c6;
            --black: #111111;
            --bg-color: #fdfdfd;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
        }

        .poster-container {
            width: 100%;
            max-width: 600px; /* Approximate mobile/poster ratio */
            aspect-ratio: 9 / 16;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- Top Right Logo Area --- */
        .top-right-logo {
            position: absolute;
            top: 40px;
            right: 40px;
            text-align: right;
            z-index: 10;
        }

        .logo-icon {
            display: grid;
            grid-template-columns: repeat(3, 8px);
            gap: 2px;
            margin-bottom: 8px;
            margin-left: auto;
            width: fit-content;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-red);
            transform: rotate(45deg);
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            line-height: 1.2;
            color: var(--black);
            font-weight: 700;
        }

        /* --- Left Vertical Title Area --- */
        .left-title-group {
            position: absolute;
            top: 60px;
            left: 40px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            z-index: 10;
        }

        .role-circles {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-right: 15px;
            margin-top: 10px;
        }

        .circle-char {
            width: 36px;
            height: 36px;
            border: 1.5px solid var(--black);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 400;
            color: var(--black);
        }

        .main-title-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 58px;
            font-weight: 900;
            letter-spacing: 5px;
            line-height: 1;
        }

        .title-red {
            color: var(--primary-red);
        }

        .title-black {
            color: var(--black);
        }

        .sub-title-vertical {
            position: absolute;
            top: 420px;
            left: 55px;
            writing-mode: vertical-rl;
            font-size: 16px;
            letter-spacing: 4px;
            color: var(--black);
            font-weight: 400;
        }

        /* --- Abstract Face Graphics (Right Side) --- */
        .graphics-layer {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Pink Circle */
        .shape-pink-circle {
            position: absolute;
            top: 25%;
            right: 25%;
            width: 80px;
            height: 80px;
            background-color: var(--pink-accent);
            border-radius: 50%;
        }

        /* Red Circle */
        .shape-red-circle {
            position: absolute;
            top: 40%;
            right: 35%;
            width: 80px;
            height: 80px;
            background-color: var(--primary-red);
            border-radius: 50%;
        }

        /* Black Triangle/Hair shape */
        .shape-black-hair {
            position: absolute;
            top: 15%;
            right: -10%;
            width: 300px;
            height: 400px;
            background-color: var(--black);
            clip-path: polygon(100% 0, 100% 100%, 0 100%, 40% 40%);
            transform: rotate(-15deg);
        }
        
        /* Refined Black Shape to match image better */
        .shape-black-main {
            position: absolute;
            top: 220px;
            right: 0;
            width: 250px;
            height: 350px;
            background: var(--black);
            clip-path: polygon(100% 0, 100% 60%, 50% 100%, 0 50%);
        }

        /* Pink Face Gradient Area */
        .shape-face-gradient {
            position: absolute;
            top: 320px;
            right: 0;
            width: 180px;
            height: 250px;
            background: linear-gradient(to bottom, var(--light-pink), transparent);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 20% 100%);
        }

        /* Small Pink Triangle (Eye/Brow accent) */
        .shape-pink-tri {
            position: absolute;
            top: 420px;
            right: 120px;
            width: 0; 
            height: 0; 
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 20px solid var(--pink-accent);
            transform: rotate(10deg);
        }
        
        /* Small Black Triangle inside pink */
        .shape-black-tri-small {
            position: absolute;
            top: 435px;
            right: 135px;
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid var(--black);
            transform: rotate(-20deg);
        }

        /* Top Right Pink Corner */
        .shape-pink-corner {
            position: absolute;
            top: 140px;
            right: 0;
            width: 60px;
            height: 60px;
            background-color: #e6007e; /* Bright magenta/pink */
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
        }

        /* Vertical Red Bar */
        .shape-red-bar {
            position: absolute;
            top: 510px;
            right: 160px;
            width: 30px;
            height: 280px;
            background-color: var(--primary-red);
        }

        /* Small Red Dot near bottom */
        .shape-red-dot-small {
            position: absolute;
            bottom: 280px;
            right: 280px;
            width: 25px;
            height: 25px;
            background-color: var(--primary-red);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(1px);
        }

        /* --- Bottom Info Area --- */
        .bottom-info {
            position: absolute;
            bottom: 180px;
            left: 40px;
            z-index: 10;
            color: var(--black);
        }

        .info-line {
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            align-items: baseline;
        }

        .info-label {
            margin-right: 10px;
        }

        .date-section {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .date-label {
            font-family: 'Playfair Display', serif;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .date-row {
            display: flex;
            align-items: baseline;
            font-family: 'Playfair Display', serif;
        }

        .date-big {
            font-size: 42px;
            font-weight: 400;
            line-height: 1;
        }

        .date-day {
            font-size: 14px;
            margin-left: 8px;
            margin-right: 20px;
            font-family: 'Noto Serif SC', serif;
        }

        .date-separator {
            font-size: 30px;
            margin: 0 10px;
            font-weight: 300;
            transform: skewX(-20deg);
            display: inline-block;
        }

        .contact-line {
            font-size: 18px;
            font-weight: 700;
        }

        /* --- Background Ink Mountains --- */
        .ink-mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 250px;
            z-index: 0;
            /* Using a placeholder div with gradient to simulate ink wash since we can't load external images reliably without URLs */
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 30%, transparent 100%);
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,100 L0,80 Q10,60 20,85 T40,70 T60,90 T80,60 T100,80 L100,100 Z" fill="black"/></svg>');
            mask-size: 100% 100%;
            mask-repeat: no-repeat;
            opacity: 0.6;
        }
        
        /* Simulating the specific mountain shapes with CSS clips/gradients is hard, 
           so we use a placeholder block that represents the visual weight at the bottom */
        .mountain-placeholder {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 150%, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 40%, transparent 70%);
        }
        
        .mountain-peak-1 {
            position: absolute;
            bottom: 20px;
            left: 10%;
            width: 150px;
            height: 100px;
            background: radial-gradient(circle at 50% 100%, #000 0%, transparent 70%);
            opacity: 0.8;
            clip-path: polygon(0% 100%, 20% 40%, 40% 80%, 60% 20%, 80% 60%, 100% 100%);
            filter: blur(2px);
        }

        .mountain-peak-2 {
            position: absolute;
            bottom: 40px;
            right: 10%;
            width: 200px;
            height: 120px;
            background: radial-gradient(circle at 50% 100%, #333 0%, transparent 70%);
            opacity: 0.6;
            clip-path: polygon(0% 100%, 30% 50%, 50% 70%, 70% 30%, 100% 100%);
            filter: blur(3px);
        }

        /* Birds */
        .birds {
            position: absolute;
            bottom: 220px;
            right: 50px;
            width: 100px;
            height: 60px;
            z-index: 2;
        }
        
        .bird {
            position: absolute;
            width: 10px;
            height: 5px;
            border-top: 2px solid #333;
            border-radius: 50%;
            transform: rotate(-10deg);
        }
        .bird::after {
            content: '';
            position: absolute;
            left: 5px;
            top: -2px;
            width: 10px;
            height: 5px;
            border-top: 2px solid #333;
            border-radius: 50%;
            transform: rotate(20deg);
        }

        .b1 { top: 10px; left: 10px; transform: scale(0.8); }
        .b2 { top: 20px; left: 40px; transform: scale(1); }
        .b3 { top: 5px; left: 70px; transform: scale(0.6); }
        .b4 { top: 35px; left: 20px; transform: scale(0.7); }
        .b5 { top: 30px; left: 60px; transform: scale(0.9); }
        .b6 { top: 45px; left: 80px; transform: scale(0.5); }

        /* Trees */
        .trees {
            position: absolute;
            bottom: 30px;
            right: 180px;
            z-index: 2;
            opacity: 0.7;
        }
        .tree-stem {
            width: 2px;
            height: 30px;
            background: #333;
            margin: 0 auto;
        }
        .tree-branch {
            width: 15px;
            height: 15px;
            border-top: 1px solid #333;
            border-right: 1px solid #333;
            transform: rotate(45deg);
            position: absolute;
            top: 5px;
            left: -6px;
        }

    </style>
</head>
<body>

<div class="poster-container">
    
    <!-- Top Right Logo -->
    <div class="top-right-logo">
        <div class="logo-icon">
            <div class="logo-dot"></div><div class="logo-dot"></div><div class="logo-dot"></div>
            <div class="logo-dot"></div><div class="logo-dot"></div><div class="logo-dot"></div>
            <div class="logo-dot"></div><div class="logo-dot"></div><div class="logo-dot"></div>
        </div>
        <div class="logo-text">
            Gao<br>Ding<br>Yi<br>Shu
        </div>
    </div>

    <!-- Abstract Graphics Layer -->
    <div class="graphics-layer">
        <div class="shape-pink-corner"></div>
        <div class="shape-pink-circle"></div>
        <div class="shape-red-circle"></div>
        
        <!-- Complex Black Shape -->
        <div class="shape-black-main"></div>
        
        <!-- Face Gradient -->
        <div class="shape-face-gradient"></div>
        
        <!-- Eye details -->
        <div class="shape-pink-tri"></div>
        <div class="shape-black-tri-small"></div>
        
        <!-- Vertical Red Bar -->
        <div class="shape-red-bar"></div>
        
        <!-- Small floating red dot -->
        <div class="shape-red-dot-small"></div>
    </div>

    <!-- Left Title Group -->
    <div class="left-title-group">
        <div class="role-circles">
            <div class="circle-char">生</div>
            <div class="circle-char">旦</div>
            <div class="circle-char">净</div>
            <div class="circle-char">末</div>
            <div class="circle-char">丑</div>
        </div>
        <div class="main-title-vertical">
            <span class="title-red">京剧</span><span class="title-black">艺术节</span>
        </div>
    </div>

    <div class="sub-title-vertical">
        稿定艺术展
    </div>

    <!-- Bottom Information -->
    <div class="bottom-info">
        <div class="info-line">
            <span class="info-label">主办方：</span>
            <span>稿定集团</span>
        </div>
        <div class="info-line">
            <span class="info-label">地点：</span>
            <span>厦门市稿定剧院</span>
        </div>
        
        <div class="date-section">
            <span class="date-label">DATE.</span>
            <div class="date-row">
                <span class="date-big">12.20</span>
                <span class="date-day">SUN</span>
                <span class="date-separator">/</span>
                <span class="date-big">12.30</span>
                <span class="date-day">SAT</span>
            </div>
        </div>

        <div class="contact-line">
            联系电话： 0592-8888888
        </div>
    </div>

    <!-- Background Elements (Mountains, Birds, Trees) -->
    <div class="mountain-placeholder"></div>
    <div class="mountain-peak-1"></div>
    <div class="mountain-peak-2"></div>
    
    <div class="birds">
        <div class="bird b1"></div>
        <div class="bird b2"></div>
        <div class="bird b3"></div>
        <div class="bird b4"></div>
        <div class="bird b5"></div>
        <div class="bird b6"></div>
    </div>

    <div class="trees">
        <div style="position: relative; width: 20px; height: 40px;">
            <div class="tree-stem"></div>
            <div class="tree-branch"></div>
            <div class="tree-branch" style="top: 12px; left: -2px; transform: rotate(45deg) scale(0.8);"></div>
        </div>
        <div style="position: relative; width: 20px; height: 35px; margin-left: 15px; margin-top: -30px;">
            <div class="tree-stem" style="height: 25px;"></div>
            <div class="tree-branch" style="top: 2px; transform: rotate(45deg) scale(0.7);"></div>
        </div>
    </div>

</div>

</body>
</html>
