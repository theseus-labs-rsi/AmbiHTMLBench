<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Lion Story</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Approximate aspect ratio of the image */
            background-color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .panel {
            position: relative;
            width: 100%;
            min-height: 120px; /* Base height for panels */
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simulating the background images with gradients/colors since I can't extract the actual jpgs */
        .panel-1 {
            height: 280px;
            background: linear-gradient(to bottom, #eaddcf, #dcbfa6);
            /* In a real scenario, this would be background-image: url('panel1.jpg'); */
        }
        
        .panel-2 {
            height: 100px;
            background: linear-gradient(to bottom, #8a7b6c, #5c5045);
        }

        .panel-3 {
            height: 120px;
            background: linear-gradient(to bottom, #c4a482, #8f6e4e);
        }

        .panel-4 {
            height: 90px;
            background: linear-gradient(to bottom, #dcdcdc, #a9a9a9);
        }

        .panel-5 {
            height: 100px;
            background: linear-gradient(to bottom, #6e6055, #4a4038);
        }

        /* The illustration overlay for the first panel */
        .illustration-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Placeholder for the drawing of Mr. McBee */
            background: radial-gradient(circle at 30% 40%, rgba(200, 150, 100, 0.4) 0%, transparent 60%);
            pointer-events: none;
        }

        .subtitle-box {
            background-color: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 8px 16px;
            font-size: 18px;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
            z-index: 10;
        }

        .chinese-box {
            position: absolute;
            top: 80px;
            right: 80px; /* Adjusted based on visual */
            background-color: rgba(128, 128, 128, 0.6);
            border: 1px dashed #333;
            padding: 10px 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .checkbox-icon {
            width: 12px;
            height: 12px;
            border: 1px solid white;
            background: white;
            display: inline-block;
        }

        /* Specific positioning adjustments to match the image flow */
        .p1-sub {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
        }

        .p2-sub {
            width: 90%;
        }

        .p3-sub {
            width: 80%;
            font-size: 22px;
            padding: 10px 20px;
        }

        .p4-sub {
            width: 95%;
            font-size: 16px;
        }

        .p5-sub {
            width: 95%;
            font-size: 16px;
            position: absolute;
            bottom: 10px;
        }

        /* Decorative elements to mimic the book pages in background */
        .book-page-hint {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50% 50% 0 0;
            z-index: 1;
        }

    </style>
</head>
<body>

<div class="container">

    <!-- Panel 1: Mr. McBee Illustration -->
    <div class="panel panel-1">
        <div class="illustration-overlay"></div>
        
        <!-- Chinese Text Box with selection handles look -->
        <div class="chinese-box">
            <span class="checkbox-icon"></span>
            故事都非常好
        </div>

        <!-- English Subtitle -->
        <div class="subtitle-box p1-sub">
            "Well, no," said Mr. McBee. "Not really."
        </div>
    </div>

    <!-- Panel 2: Book holding -->
    <div class="panel panel-2">
        <div class="subtitle-box p2-sub">
            "But there's a lion!" said Mr. McBee. "In the library!"
        </div>
    </div>

    <!-- Panel 3: Sniffing -->
    <div class="panel panel-3">
        <div class="subtitle-box p3-sub">
            He sniffed the card catalog.
        </div>
    </div>

    <!-- Panel 4: Rules -->
    <div class="panel panel-4">
        <div class="subtitle-box p4-sub">
            There weren't any rules about lions at story hour, either.
        </div>
    </div>

    <!-- Panel 5: Walking away -->
    <div class="panel panel-5">
        <div class="book-page-hint"></div>
        <div class="subtitle-box p5-sub">
            He waited for another story, but the children began to walk away.
        </div>
    </div>

</div>

</body>
</html>
