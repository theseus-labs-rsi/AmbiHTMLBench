<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief is Life Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Serif+SC:wght@400;700&display=swap');

        :root {
            --primary-orange: #d35400;
            --light-orange: #e67e22;
            --bg-cream: #fdfbf7;
            --swirl-color: rgba(230, 126, 34, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #333; /* Dark background to frame the poster */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
        }

        .poster-container {
            position: relative;
            width: 600px;
            height: 850px;
            background-color: var(--bg-cream);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Abstract Background Swirls */
        .background-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .swirl {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.6;
        }

        /* Simulating the dragon/cloud shape with CSS gradients and shapes */
        .shape-1 {
            top: -10%;
            left: -10%;
            width: 120%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(230, 126, 34, 0.2) 0%, rgba(253, 251, 247, 0) 70%);
            transform: rotate(-15deg);
        }

        .shape-2 {
            top: 20%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at center, rgba(211, 84, 0, 0.15) 0%, rgba(253, 251, 247, 0) 60%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .shape-3 {
            bottom: -10%;
            left: 10%;
            width: 90%;
            height: 50%;
            background: radial-gradient(ellipse at top, rgba(230, 126, 34, 0.2) 0%, rgba(253, 251, 247, 0) 70%);
            transform: rotate(10deg);
        }
        
        /* Specific jagged edges simulation using clip-path or multiple divs would be complex, 
           using layered radial gradients to approximate the watercolor/ink wash effect */
        .ink-wash {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(230, 126, 34, 0.25) 0%, transparent 25%),
                radial-gradient(circle at 20% 80%, rgba(230, 126, 34, 0.2) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, transparent 60%);
            mix-blend-mode: multiply;
        }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            color: var(--primary-orange);
        }

        /* Top Left */
        .top-left {
            position: absolute;
            top: 40px;
            left: 40px;
            font-weight: 900;
            font-size: 14px;
            line-height: 1.4;
            text-transform: uppercase;
        }
        .date {
            font-size: 24px;
            margin-bottom: 5px;
            display: block;
        }

        /* Top Right */
        .top-right {
            position: absolute;
            top: 40px;
            right: 40px;
            text-align: right;
        }
        .headline {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subhead {
            font-size: 18px;
            font-weight: 700;
            margin: 5px 0 15px 0;
            text-transform: uppercase;
        }
        .chinese-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.8;
            color: var(--primary-orange);
        }

        /* Main Vertical Text (Left Side) */
        .vertical-text-container {
            position: absolute;
            left: 40px;
            top: 180px;
            bottom: 100px;
            display: flex;
            gap: 20px;
        }

        .vertical-line {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 58px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .line-1 {
            /* "THREE THOUSAND" */
        }
        
        .line-2 {
            /* "I LOVE YOU" */
            margin-top: 0; 
        }

        /* Right Side Vertical Small Text */
        .right-vertical {
            position: absolute;
            right: 50px;
            top: 250px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 12px;
            letter-spacing: 8px;
            font-weight: 400;
            color: var(--light-orange);
            text-transform: uppercase;
        }
        
        .right-vertical::after {
            content: '';
            display: block;
            width: 1px;
            height: 150px;
            background-color: var(--light-orange);
            margin: 20px auto 0 auto;
        }

        /* Bottom Right */
        .bottom-right {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: left; /* Text inside is left aligned relative to its block, but block is right */
            max-width: 300px;
        }

        .quote {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 15px;
            color: var(--light-orange);
        }

        .footer-badge {
            background-color: var(--primary-orange);
            color: var(--bg-cream);
            padding: 8px 15px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            display: inline-block;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Art -->
        <div class="background-art">
            <div class="swirl shape-1"></div>
            <div class="swirl shape-2"></div>
            <div class="swirl shape-3"></div>
            <div class="ink-wash"></div>
            <!-- Additional texture overlay to mimic the paper/grain -->
            <div style="position:absolute; width:100%; height:100%; background:url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E'); opacity: 0.4;"></div>
        </div>

        <!-- Content -->
        <div class="content">
            
            <!-- Top Left Info -->
            <div class="top-left">
                <span class="date">11/07</span>
                DESIGNED BY<br>KERRLEE
            </div>

            <!-- Top Right Header -->
            <div class="top-right">
                <h1 class="headline">BRIFE IS LIFE</h1>
                <h2 class="subhead">BUT LOVE IS LONG</h2>
                <div class="chinese-text">
                    你要知道生命虽短，但爱却绵长<br>
                    爱你三千遍
                </div>
            </div>

            <!-- Main Vertical Typography -->
            <div class="vertical-text-container">
                <div class="vertical-line line-1">THREE THOUSAND</div>
                <div class="vertical-line line-2">I LOVE YOU</div>
            </div>

            <!-- Right Side Decorative Text -->
            <div class="right-vertical">
                AUGENSTERN
            </div>

            <!-- Bottom Right Footer -->
            <div class="bottom-right">
                <div class="quote">
                    Life was like a box of chocolates,<br>
                    you never know what you are gonna get.
                </div>
                <div class="footer-badge">
                    YOU GOTTA HAVE LITTLE FAITH
                </div>
            </div>

        </div>
    </div>

</body>
</html>
