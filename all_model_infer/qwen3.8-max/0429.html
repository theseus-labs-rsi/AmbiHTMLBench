<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中药方剂 - 桂花露与荷花露</title>
    <style>
        body {
            background-color: #dcb4c4; /* Approximate dusty pink background */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
            color: #333;
        }

        .page-container {
            width: 100%;
            max-width: 500px; /* Aspect ratio approximation */
            background-color: #dcb4c4;
            border: 1px solid #555; /* Thin outer border */
            padding: 4px;
            box-sizing: border-box;
            position: relative;
        }

        .inner-border {
            border: 1px solid #555; /* Inner border line */
            height: 100%;
            min-height: 600px;
            padding: 40px 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .content-area {
            flex-grow: 1;
        }

        .recipe-block {
            margin-bottom: 40px;
        }

        .title {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .field {
            margin-bottom: 15px;
            line-height: 1.6;
            font-size: 1.05em;
            text-align: justify;
        }

        .label {
            /* Styling for the brackets if needed, but keeping verbatim text */
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.8em;
            color: #555;
            margin-top: 20px;
        }

        .footer-left {
            letter-spacing: 1px;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .app-icon {
            width: 16px;
            height: 16px;
            background-color: rgba(255,255,255,0.5);
            display: inline-block;
            vertical-align: middle;
            margin-right: 2px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="inner-border">
            
            <div class="content-area">
                <!-- Recipe 1: Gui Hua Lu -->
                <div class="recipe-block">
                    <div class="title">△桂花露</div>
                    
                    <div class="field">
                        〔功用〕开胃消食，宽胸化痰
                    </div>
                    
                    <div class="field">
                        〔药物〕桂花500克
                    </div>
                    
                    <div class="field">
                        〔制法〕于9月底开花时采收，阴于，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液
                    </div>
                </div>

                <!-- Recipe 2: He Hua Lu -->
                <div class="recipe-block">
                    <div class="title">△荷花露</div>
                    
                    <div class="field">
                        〔功用〕清暑凉营
                    </div>
                    
                    <div class="field">
                        〔药物〕白荷花500克
                    </div>
                    
                    <div class="field">
                        〔制法〕取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-left">
                    [ 中国色 · 藕荷 ]
                </div>
                <div class="footer-right">
                    <span class="app-icon"></span> 中医百科APP
                </div>
            </div>

        </div>
    </div>

</body>
</html>
