<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的分类</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 600px;
            background-color: #dcdcdc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Header Section */
        .header {
            background-color: #2b2b2b;
            color: white;
            padding: 15px 20px;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed #555;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background-color: #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #ccc;
            position: relative;
        }
        .logo-icon::after {
            content: "模型";
            position: absolute;
            top: -5px;
            left: -5px;
            background: #d35400;
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
        }
        .logo-text h2 {
            margin: 0;
            font-size: 16px;
            color: #fff;
        }
        .logo-text span {
            color: #e67e22;
        }
        .logo-text p {
            margin: 0;
            font-size: 10px;
            color: #aaa;
        }
        .ratings {
            text-align: right;
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
        }
        .stars {
            color: #e67e22;
            letter-spacing: 2px;
        }

        .title-section {
            text-align: center;
            margin-top: 10px;
        }
        .number {
            font-size: 48px;
            font-weight: bold;
            color: #5dade2;
            float: left;
            margin-left: 20px;
            line-height: 1;
        }
        .main-title {
            font-size: 42px;
            font-weight: bold;
            color: #5dade2;
            margin: 0;
            display: inline-block;
            vertical-align: top;
            margin-top: 5px;
        }
        .subtitle {
            clear: both;
            text-align: center;
            font-size: 14px;
            color: #ddd;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        /* Content Section */
        .content {
            padding: 20px;
            background-color: #dcdcdc;
        }
        .model-label {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 5px 20px;
            font-size: 14px;
            width: 100px;
            margin: 0 auto 20px auto;
            border-radius: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 10px;
        }
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .icon-placeholder {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Simulating icons with CSS shapes/colors for fidelity without external images */
        .icon-1 { background: radial-gradient(circle at 30% 30%, #85c1e9, #5dade2); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); opacity: 0.8; position: relative;}
        .icon-1::after { content:''; position:absolute; width:100%; height:100%; background:rgba(255,255,255,0.3); border-radius:inherit; transform:translate(10px, 10px); z-index:-1;}
        
        .icon-2 { background: #5dade2; border-radius: 50%; width: 50px; height: 40px; position: relative; display:flex; justify-content:center; align-items:center;}
        .icon-2::before { content:'♥'; color:white; font-size:20px; }
        .icon-2::after { content:''; position:absolute; top:-10px; left:5px; width:20px; height:20px; background:#5dade2; border-radius:50%; box-shadow: 20px 0 0 #5dade2; }

        .icon-3 { display: flex; gap: 2px; }
        .icon-3 div { width: 25px; height: 40px; background: #555; border-radius: 20px 20px 0 0; transform: rotate(-45deg); }
        .icon-3 div:last-child { transform: rotate(45deg); }
        .icon-3 span { position: absolute; font-size: 20px; color: #555; font-weight: bold; }

        .icon-4 { width: 50px; height: 45px; background: #e74c3c; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); position: relative; }
        .icon-4::after { content:''; position:absolute; top:-15px; left:10px; width:40px; height:10px; border:3px solid #f1c40f; border-radius:50%; transform:rotate(45deg); }

        .icon-5 { display: flex; flex-wrap: wrap; width: 50px; justify-content: center; }
        .icon-5 div { width: 20px; height: 20px; background: #555; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); margin: 2px; }
        .icon-5 div:nth-child(2) { background: #ccc; }
        .icon-5 div:nth-child(3) { background: #e6b0aa; }

        .icon-6 { width: 50px; height: 50px; border: 4px solid #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .icon-6::after { content: '♥'; color: #e74c3c; font-size: 20px; }

        .icon-7 { display: flex; gap: 5px; }
        .icon-7 div { width: 25px; height: 25px; border: 2px solid #555; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }
        .icon-7 div:nth-child(2) { background: #555; border: none; }
        .icon-7 div:nth-child(3) { background: #e6b0aa; border: none; }

        .icon-8 { width: 50px; height: 45px; background: #f1c40f; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); display: flex; justify-content: center; align-items: center; }
        .icon-8::after { content: '👁'; font-size: 20px; transform: rotate(45deg); }

        .icon-9 { width: 50px; height: 45px; background: linear-gradient(to right, #000 50%, #5dade2 50%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }

        .icon-10 { width: 50px; height: 45px; background: #e74c3c; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); position: relative; }
        .icon-10::before { content: '♛'; position: absolute; top: -25px; left: 15px; color: #f1c40f; font-size: 24px; transform: rotate(45deg); }

        .icon-11 { display: flex; gap: 5px; }
        .icon-11 div { width: 20px; height: 30px; background: #e74c3c; border-radius: 20px 20px 0 0; transform: rotate(-45deg); opacity: 0.7;}
        .icon-11 div:last-child { background: #5dade2; transform: rotate(45deg) translateY(10px); }

        .icon-12 { width: 50px; height: 45px; background: repeating-linear-gradient(45deg, #27ae60, #27ae60 2px, #2ecc71 2px, #2ecc71 4px); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }

        .icon-13 { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .icon-13 div { width: 30px; height: 25px; background: #333; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }
        .icon-13 div:nth-child(2) { width: 25px; height: 20px; background: #555; }
        .icon-13 div:nth-child(3) { width: 20px; height: 15px; background: #777; }

        .icon-14 { width: 50px; height: 45px; border: 3px double #555; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); display: flex; justify-content: center; align-items: center; }
        .icon-14::after { content: ''; width: 30px; height: 25px; border: 2px solid #999; border-radius: inherit; }

        .icon-15 { width: 50px; height: 45px; background: #e6b0aa; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); display: flex; justify-content: center; align-items: center; }
        .icon-15::after { content: '🕊'; font-size: 20px; transform: rotate(45deg); color: white; }

        .icon-16 { display: flex; gap: -10px; }
        .icon-16 div { width: 35px; height: 35px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }
        .icon-16 div:first-child { background: #e74c3c; z-index: 2; }
        .icon-16 div:last-child { background: #5dade2; margin-left: -15px; z-index: 1; display:flex; justify-content:center; align-items:center;}
        .icon-16 div:last-child::after { content:'♥'; color:white; font-size:12px; transform:rotate(45deg);}

        .icon-17 { width: 50px; height: 45px; background: #000; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); border: 3px dotted #e74c3c; }

        .icon-18 { width: 50px; height: 45px; background: radial-gradient(circle, #555 20%, transparent 20%); background-size: 10px 10px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); position: relative;}
        .icon-18::after { content:'♥'; position:absolute; color:#e74c3c; font-size:20px; top:10px; left:15px; transform:rotate(45deg);}

        .icon-19 { display: flex; align-items: center; gap: 5px; }
        .icon-19 div { width: 40px; height: 35px; background: #5dade2; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }
        .icon-19 span { font-size: 24px; color: #5dade2; font-weight: bold; }

        .icon-20 { width: 50px; height: 45px; background: #f1c40f; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); opacity: 0.6; position: relative;}
        .icon-20::after { content:'~'; position:absolute; color:#f39c12; font-size:30px; top:0; left:10px; transform:rotate(45deg); font-weight:bold;}

        .icon-21 { display: flex; gap: 10px; align-items: flex-end; }
        .icon-21 div { background: #e6b0aa; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }
        .icon-21 div:first-child { width: 25px; height: 22px; }
        .icon-21 div:last-child { width: 35px; height: 30px; background: #e74c3c; }

        .icon-22 { width: 50px; height: 45px; background: #333; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); position: relative; }
        .icon-22::after { content: ''; position: absolute; bottom: -5px; right: -5px; width: 20px; height: 20px; background: #e74c3c; border-radius: 50%; }

        .icon-23 { width: 50px; height: 45px; border: 3px solid #e74c3c; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); display: flex; justify-content: center; align-items: center; }
        .icon-23::after { content: '♥'; color: #e74c3c; font-size: 24px; }

        .icon-24 { width: 50px; height: 45px; border: 2px dashed #555; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(-45deg); }

        .item-text {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        
        .footer-dots {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 5px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border: 1px solid #999;
            border-radius: 50%;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="top-bar">
            <div class="logo-area">
                <div class="logo-icon">
                    <!-- Placeholder for avatar -->
                    <div style="width:20px; height:20px; background:#ccc; border-radius:50%;"></div>
                </div>
                <div class="logo-text">
                    <h2>打造<span>超级</span>学习个体 <span style="font-size:12px;">♡</span></h2>
                    <p>- To build Super Charged individual -</p>
                </div>
            </div>
            <div class="ratings">
                <div>学习难易 <span class="stars">★★★</span></div>
                <div>理解难易 <span class="stars">★★★</span></div>
                <div>应用难易 <span class="stars">★★★</span></div>
            </div>
        </div>

        <div class="title-section">
            <div class="number">25</div>
            <h1 class="main-title">爱的分类</h1>
            <div class="subtitle">为爱而爱，是神；为被爱而爱，是人。 拜伦</div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="model-label">模型</div>

        <div class="grid">
            <!-- Row 1 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-1"></div></div>
                <div class="item-text">基于伦理的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-2"></div></div>
                <div class="item-text">理想化的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder">
                    <div class="icon-3">
                        <div></div><span>+</span><div></div>
                    </div>
                </div>
                <div class="item-text">基于逻辑的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-4"></div></div>
                <div class="item-text">真挚的爱</div>
            </div>

            <!-- Row 2 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-5"><div></div><div></div><div></div></div></div>
                <div class="item-text">方法论的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-6"></div></div>
                <div class="item-text">可爱的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-7"><div></div><div></div><div></div></div></div>
                <div class="item-text">基于归纳的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-8"></div></div>
                <div class="item-text">感性的爱</div>
            </div>

            <!-- Row 3 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-9"></div></div>
                <div class="item-text">基于伦理的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-10"></div></div>
                <div class="item-text">暴政式的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-11"><div></div><div></div></div></div>
                <div class="item-text">自由主义的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-12"></div></div>
                <div class="item-text">自然主义的爱</div>
            </div>

            <!-- Row 4 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-13"><div></div><div></div><div></div></div></div>
                <div class="item-text">超体验的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-14"></div></div>
                <div class="item-text">易感受的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-15"></div></div>
                <div class="item-text">有意志的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-16"><div></div><div></div></div></div>
                <div class="item-text">辩证的爱</div>
            </div>

            <!-- Row 5 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-17"></div></div>
                <div class="item-text">革命式的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-18"></div></div>
                <div class="item-text">令人疯狂的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder">
                    <div class="icon-19">
                        <div></div><span>+</span>
                    </div>
                </div>
                <div class="item-text">积极的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-20"></div></div>
                <div class="item-text">非理性的爱</div>
            </div>

            <!-- Row 6 -->
            <div class="item">
                <div class="icon-placeholder"><div class="icon-21"><div></div><div></div></div></div>
                <div class="item-text">相对的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-22"></div></div>
                <div class="item-text">现象主义的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-23"></div></div>
                <div class="item-text">存在主义的爱</div>
            </div>
            <div class="item">
                <div class="icon-placeholder"><div class="icon-24"></div></div>
                <div class="item-text">超越善恶的爱</div>
            </div>
        </div>
    </div>
    
    <div class="footer-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

</body>
</html>
