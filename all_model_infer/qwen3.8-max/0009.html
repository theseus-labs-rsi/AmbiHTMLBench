<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Book Page — 胖胖和丫丫</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #fffdf6;
  }
  .page {
    position: relative;
    width: 463px;
    margin: 0 auto;
    padding: 10px 0 0 0;
    font-family: "KaiTi", "STKaiti", "BiauKai", "SimSun", serif;
    color: #2b2b2b;
    overflow: hidden;
  }
  .story {
    position: relative;
    z-index: 2;
    margin: 0;
    padding: 4px 22px 6px 25px;
    font-size: 21px;
    line-height: 30px;
    letter-spacing: 1px;
    text-align: left;
  }
  .story .line { display: block; }
  .story .line.first { text-indent: 2em; }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #f2f5ea;
    border: 1px dashed #9aa08f;
    color: #6f7565;
    font-size: 12px;
    font-family: sans-serif;
    padding: 4px;
  }
  .branch {
    position: absolute;
    top: 32px;
    right: 0;
    width: 215px;
    height: 140px;
    z-index: 1;
    background: transparent;
    border: none;
  }
  .illustration {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 312px;
    margin: 2px 0 0 0;
    background: #eef3e2;
  }
</style>
</head>
<body>
<div class="page">

  <p class="story">
    <span class="line first">“胖胖，中午好！”丫丫一进屋就看见了胖胖，</span>
    <span class="line">胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微</span>
    <span class="line">笑来和我打招呼的！”听到丫丫的话，</span>
    <span class="line">大家都笑了起来。</span>
  </p>

  <div class="placeholder branch">[Illustration: flowering branch with blossoms, upper-right corner]</div>

  <figure class="placeholder illustration" style="margin:2px 0 0 0;">
    [Illustration: open green-framed lattice window; left panel shows a white duck wearing a hood beside a small chick in red; right panel shows a pig in a white bonnet holding a piglet in blue overalls; yellow curtain valances at top of panels]
  </figure>

</div>
</body>
</html>
