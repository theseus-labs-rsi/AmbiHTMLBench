<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Cliff L.I. Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cabin:wght@700&family=Fredoka+One&family=Oswald:wght@500;700&family=Patrick+Hand&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cabin', sans-serif;
        }

        .poster-container {
            width: 600px;
            height: 900px;
            background-color: #2b3a8c; /* Deep Blue Background */
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 8px solid #e8e4d9; /* Cream border */
            box-sizing: border-box;
        }

        /* Background Illustration Layer */
        .illustration-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Skyline Placeholder */
        .skyline {
            position: absolute;
            top: 120px;
            right: 0;
            width: 70%;
            height: 150px;
            background: #e8e4d9;
            clip-path: polygon(0% 100%, 0% 80%, 10% 80%, 10% 60%, 15% 60%, 15% 80%, 25% 80%, 25% 50%, 30% 50%, 30% 80%, 40% 80%, 40% 40%, 50% 40%, 50% 80%, 60% 80%, 60% 30%, 70% 30%, 70% 80%, 80% 80%, 80% 20%, 90% 20%, 90% 80%, 100% 80%, 100% 100%);
            opacity: 0.9;
        }
        
        /* Trylon and Perisphere shapes */
        .trylon {
            position: absolute;
            top: 0;
            right: 50px;
            width: 60px;
            height: 250px;
            background: #e8e4d9;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        .perisphere {
            position: absolute;
            top: 140px;
            right: 80px;
            width: 140px;
            height: 140px;
            background: #e8e4d9;
            border-radius: 50%;
        }

        /* Water */
        .water {
            position: absolute;
            top: 250px;
            left: 0;
            width: 100%;
            height: 400px;
            background: #2b3a8c;
        }
        
        .water-reflection {
            position: absolute;
            top: 260px;
            right: 50px;
            width: 100px;
            height: 150px;
            background: repeating-linear-gradient(to bottom, #e8e4d9 0, #e8e4d9 5px, transparent 5px, transparent 10px);
            opacity: 0.6;
        }

        /* Foliage / Cliff (Green) */
        .cliff {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: #4a6b28; /* Olive Green */
            clip-path: polygon(0% 100%, 0% 40%, 15% 45%, 30% 55%, 50% 70%, 70% 75%, 100% 80%, 100% 100%);
            z-index: 2;
        }

        .foliage-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 35%;
            background: #4a6b28;
            clip-path: polygon(0% 0%, 100% 0%, 80% 20%, 90% 40%, 60% 50%, 70% 70%, 40% 80%, 20% 100%, 0% 100%);
            z-index: 2;
        }

        /* Boat */
        .boat {
            position: absolute;
            bottom: 280px;
            right: 80px;
            width: 250px;
            height: 120px;
            z-index: 3;
            transform: rotate(-15deg);
        }
        .boat-hull {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #e8e4d9;
            border-radius: 0 0 50px 50px;
            clip-path: polygon(0% 0%, 100% 20%, 90% 100%, 10% 80%);
        }
        .boat-deck {
            position: absolute;
            bottom: 40px;
            left: 20px;
            width: 200px;
            height: 40px;
            background: #f4c430; /* Yellow */
            clip-path: polygon(10% 0%, 90% 20%, 80% 100%, 0% 80%);
        }
        .boat-smokestack {
            position: absolute;
            bottom: 70px;
            left: 120px;
            width: 20px;
            height: 50px;
            background: #f4c430;
            transform: skewX(-10deg);
        }
        .smoke {
            position: absolute;
            bottom: 110px;
            left: 130px;
            width: 150px;
            height: 60px;
            background: #e8e4d9;
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(2px);
        }

        /* Lighthouse / Pillar */
        .pillar {
            position: absolute;
            top: 320px;
            left: 40px;
            width: 80px;
            height: 180px;
            background: #e8e4d9;
            z-index: 3;
            clip-path: polygon(20% 0%, 80% 0%, 90% 20%, 70% 25%, 80% 100%, 20% 100%, 30% 25%, 10% 20%);
        }
        .pillar-top {
            position: absolute;
            top: 290px;
            left: 30px;
            width: 100px;
            height: 40px;
            background: #f4c430;
            z-index: 3;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }

        /* Text Layers */
        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .header-text {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #f4c430; /* Yellow */
            font-family: 'Patrick Hand', cursive;
            font-size: 52px;
            line-height: 1;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .header-sub {
            font-family: 'Oswald', sans-serif;
            font-size: 58px;
            letter-spacing: 2px;
            margin-top: -5px;
            display: block;
        }

        .mid-text {
            position: absolute;
            top: 280px;
            width: 100%;
            text-align: center;
            color: #f4c430;
            font-family: 'Patrick Hand', cursive;
            font-size: 64px;
            line-height: 0.9;
        }

        .lower-mid-text {
            position: absolute;
            bottom: 260px;
            left: 40px;
            color: #e8e4d9; /* Cream */
            font-family: 'Patrick Hand', cursive;
            font-size: 58px;
            line-height: 0.9;
            text-align: left;
        }

        .main-title {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #e8e4d9;
            font-family: 'Fredoka One', cursive; /* Rounded bold font */
            font-size: 110px;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 4px 4px 0px #2b3a8c; /* Blue shadow effect */
            white-space: nowrap;
        }
        
        .main-title span {
            font-size: 60px;
            vertical-align: baseline;
            margin-left: 10px;
        }

        .footer-info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #e8e4d9;
            font-family: 'Patrick Hand', cursive;
            font-size: 32px;
            line-height: 1.1;
        }

        .sponsor {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #e8e4d9;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .wpa {
            position: absolute;
            bottom: 2px;
            width: 100%;
            text-align: center;
            color: #e8e4d9;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Illustrations -->
        <div class="illustration-layer">
            <div class="skyline"></div>
            <div class="trylon"></div>
            <div class="perisphere"></div>
            <div class="water"></div>
            <div class="water-reflection"></div>
            
            <div class="foliage-top"></div>
            <div class="cliff"></div>
            
            <div class="pillar-top"></div>
            <div class="pillar"></div>
            
            <div class="boat">
                <div class="smoke"></div>
                <div class="boat-smokestack"></div>
                <div class="boat-deck"></div>
                <div class="boat-hull"></div>
            </div>
        </div>

        <!-- Text Content -->
        <div class="text-layer">
            <div class="header-text">
                While visiting
                <span class="header-sub">THE FAIR</span>
            </div>

            <div class="mid-text">
                commute<br>
                by land or water
            </div>

            <div class="lower-mid-text">
                to<br>
                beautiful
            </div>

            <div class="main-title">
                SEA CLIFF <span>L.I.</span>
            </div>

            <div class="footer-info">
                250 feet above sea level. NO MOSQUITOS<br>
                golf and bathing
            </div>

            <div class="sponsor">
                SPONSORED BY THE VILLAGE OF SEA CLIFF
            </div>
            
            <div class="wpa">
                WPA FEDERAL ART PROJECT 01/.4
            </div>
        </div>
    </div>

</body>
</html>
