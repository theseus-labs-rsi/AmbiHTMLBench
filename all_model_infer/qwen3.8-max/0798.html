<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新手佩戴水晶常见30个问题</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }

        .card-container {
            width: 480px;
            background: linear-gradient(to bottom, #fdfdfd, #eef0f2);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 
                0 0 0 4px #333,
                0 0 0 8px #666,
                0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        /* Inner border effect */
        .card-container::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 15px;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 32px;
            font-weight: bold;
            color: #2c2c2c;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
        }

        .sub-title {
            font-size: 34px;
            font-weight: bold;
            color: #2c2c2c;
            margin: 5px 0 15px 0;
            letter-spacing: 1px;
        }

        .highlight {
            color: #d35400;
            font-style: italic;
        }

        .divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .divider-line {
            height: 2px;
            background: #d35400;
            flex-grow: 1;
            opacity: 0.6;
        }

        .divider-icon {
            margin: 0 15px;
            color: #d35400;
            font-size: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .question-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            font-style: italic;
        }

        .crystal-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-left: 10px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* Specific crystal colors based on image */
        .crystal-1 { background: radial-gradient(circle at 30% 30%, #f1c40f, #d35400); } /* Amber/Yellow */
        .crystal-2 { background: radial-gradient(circle at 30% 30%, #e74c3c, #900); } /* Red */
        .crystal-3 { background: radial-gradient(circle at 30% 30%, #fadbd8, #d98880); } /* Pink/Rose */
        .crystal-4 { background: radial-gradient(circle at 30% 30%, #fff, #e74c3c, #900); } /* Strawberry Quartz look */

        .content-block {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            padding-left: 5px;
            text-shadow: 1px 1px 0px #fff;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .number-badge {
            background-color: #85c1e9;
            color: white;
            font-size: 14px;
            padding: 0 4px;
            border-radius: 3px;
            margin-right: 6px;
            margin-top: 4px;
            font-family: sans-serif;
            font-weight: bold;
            min-width: 14px;
            text-align: center;
        }

        .text-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2px;
        }

        .grid-row {
            display: flex;
            flex-wrap: wrap;
        }
        
        .grid-item {
            margin-right: 5px;
        }

    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <h1 class="main-title">新手佩戴水晶</h1>
        <h2 class="sub-title">常见<span class="highlight">30个</span>问题</h2>
        <div class="divider-container">
            <div class="divider-line"></div>
            <div class="divider-icon">&#128220;</div> <!-- Scroll icon approximation -->
            <div class="divider-line"></div>
        </div>
    </div>

    <!-- Section 1 -->
    <div class="section">
        <div class="question-row">
            <span class="question-text">Q:水晶戴左手还是右手?</span>
            <div class="crystal-icon crystal-1"></div>
        </div>
        <div class="content-block">
            <div class="list-item">
                <span class="number-badge">1</span>
                <span>黄水晶、草莓晶、紫水晶、海蓝宝、粉晶、月光石、萤石等常佩戴在左手;</span>
            </div>
            <div class="list-item">
                <span class="number-badge">2</span>
                <span>黑/银曜石、白水晶、虎眼石等常佩戴在右手。</span>
            </div>
        </div>
    </div>

    <!-- Section 2 -->
    <div class="section">
        <div class="question-row">
            <span class="question-text">Q:哪些水晶不能碰水?</span>
            <div class="crystal-icon crystal-2"></div>
        </div>
        <div class="content-block text-grid">
            <div class="grid-row">
                <span class="grid-item">太阳石、</span><span class="grid-item">方解石、</span><span class="grid-item">萤石、</span><span class="grid-item">孔雀石、</span><span class="grid-item">天青石</span>
            </div>
            <div class="grid-row">
                <span class="grid-item">青金石、</span><span class="grid-item">海纹石、</span><span class="grid-item">月光石、</span><span class="grid-item">天河石、</span><span class="grid-item">绿松石</span>
            </div>
            <div class="grid-row">
                <span class="grid-item">蓝铜矿、</span><span class="grid-item">蓝晶石、</span><span class="grid-item">堇青石、</span><span class="grid-item">紫龙晶、</span><span class="grid-item">紫锂辉石</span>
            </div>
            <div class="grid-row">
                <span class="grid-item">透石膏、</span><span class="grid-item">灰月光、</span><span class="grid-item">赤铁矿、</span><span class="grid-item">紫锂云母</span>
            </div>
        </div>
    </div>

    <!-- Section 3 -->
    <div class="section">
        <div class="question-row">
            <span class="question-text">Q:水晶怎么消磁?</span>
            <div class="crystal-icon crystal-3"></div>
        </div>
        <div class="content-block">
            <div>碎石消磁、海盐消磁、鼠尾草消磁、月光消磁</div>
            <div>流水消磁</div>
        </div>
    </div>

    <!-- Section 4 -->
    <div class="section">
        <div class="question-row">
            <span class="question-text">Q:不佩戴水晶的时候放哪里?</span>
            <div class="crystal-icon crystal-4"></div>
        </div>
        <div class="content-block">
            <div class="list-item">
                <span class="number-badge">1</span>
                <span>可以放在装有消磁石的盒子里存放起来;</span>
            </div>
            <div class="list-item">
                <span class="number-badge">2</span>
                <span>可以放在水晶簇或水晶洞里面;</span>
            </div>
            <div class="list-item">
                <span class="number-badge">3</span>
                <span>可以放一个软布在木盒，然后将水晶放里面。</span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
