<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租房注意事项</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #7a9c82; /* Approximate green background */
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            color: #4a6b53;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .circle-icon {
            width: 20px;
            height: 20px;
            border: 4px solid #d32f2f;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #d32f2f;
            padding-bottom: 2px;
            display: inline-block;
        }

        .list-item {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .inline-list {
            display: flex;
            gap: 20px;
        }

        /* Watermark styling */
        .watermark {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            pointer-events: none;
            text-align: center;
            color: #888;
            font-size: 16px;
            z-index: 0;
        }
        
        .watermark span {
            display: block;
        }

        /* Cat illustration placeholder */
        .cat-placeholder {
            position: absolute;
            bottom: 180px;
            right: 40px;
            width: 120px;
            height: 160px;
            /* Using a simple border to indicate position if image fails, 
               but primarily relying on the description */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
            font-size: 12px;
            text-align: center;
            z-index: 1;
        }

        /* Content wrapper to sit above watermark */
        .content {
            position: relative;
            z-index: 2;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Watermark -->
        <div class="watermark">
            <span>@带毛的栗子</span>
            <span>From 小红书</span>
        </div>

        <div class="content">
            <h1>租房注意事项</h1>

            <!-- Section 1: Bedroom -->
            <div class="section-header">
                <span class="circle-icon"></span>
                <span class="section-title">卧室</span>
            </div>

            <div class="list-item">1.空调是否正常使用，空调排水位置，外机位置</div>
            <div class="list-item">2.所有电灯，插座是否ok</div>
            <div class="list-item">3.床都否OK，躺下翻身是否有响声</div>
            <div class="list-item">4.卧室地板情况</div>
            <div class="list-item">5.衣柜是否完好</div>
            <div class="list-item">6.各个房间是否能反锁</div>
            <div class="list-item">7.装修情况，不要太新，也不要太久</div>
            <div class="list-item">8.排查针孔摄像头</div>
            <div class="list-item">9.wifi信号情况</div>

            <!-- Cat Illustration Placeholder -->
            <div class="cat-placeholder">
                [Illustration: White cat with red headphones standing]
            </div>

            <!-- Section 2: Others -->
            <div class="section-header">
                <span class="circle-icon"></span>
                <span class="section-title">其他</span>
            </div>

            <div class="list-item inline-list">
                <span>1.各类遥控器清点</span>
                <span>2.所有钥匙清点</span>
            </div>
            <div class="list-item">3.所有墙面情况，有无裂痕掉漆，脱皮</div>
            <div class="list-item">4.所有水龙头一起打开，看水压是否足够</div>
            <div class="list-item">5.如果是燃气热水器，也留意下安全使用情况</div>
        </div>
    </div>

</body>
</html>
