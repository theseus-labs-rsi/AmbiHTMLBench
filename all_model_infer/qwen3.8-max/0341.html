<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f0efeb;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            color: #1a1a1a;
        }
        .container {
            max-width: 600px;
            width: 100%;
            line-height: 1.6;
            font-size: 22px;
            font-weight: bold;
        }
        .paragraph {
            margin-bottom: 35px;
            text-align: justify;
        }
        .highlight {
            color: #5fa396;
        }
        .footer {
            text-align: center;
            color: #5fa396;
            margin-top: 50px;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .footer span {
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="paragraph">
            1、<span class="highlight">你开始炫耀自己，往往都是灾难的开始。</span><br>
            就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
        </div>

        <div class="paragraph">
            2、一个冷知识：<span class="highlight">屏蔽力是一个人最顶级的能力</span>，任何消耗你的人和事，多看一眼都是你的不对。
        </div>

        <div class="paragraph">
            3、大学时辅导员说了一句受益一生的话：<span class="highlight">“你不用变得很外向，内向挺好的，但需要你发言的时候，一定要勇敢。”</span>正所谓：君子可内敛不可懦弱，面不公可起而论之。
        </div>

        <div class="footer">
            商业思维 <span>|</span> 底层逻辑 <span>|</span> 个人提升
        </div>
    </div>
</body>
</html>
