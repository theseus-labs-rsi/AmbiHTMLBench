<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频剪辑素材</title>
    <style>
        body {
            background-color: #fcf9e3;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            color: #000000;
            margin-top: 0;
            margin-bottom: 35px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .item {
            margin-bottom: 25px;
        }

        .item:last-child {
            margin-bottom: 0;
        }

        .title {
            font-size: 18px;
            color: #333333;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .desc {
            font-size: 15px;
            color: #555555;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 95%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>视频剪辑素材</h1>

        <div class="item">
            <div class="title">Videezy</div>
            <div class="desc">提供免F高清视频素材、音频素材和音效素材</div>
        </div>

        <div class="item">
            <div class="title">Coverr</div>
            <div class="desc">每周更新免F高清视频素材库，可以下zai和使用</div>
        </div>

        <div class="item">
            <div class="title">Pixabay</div>
            <div class="desc">提供免F高清视频素材、照片素材和插图素材，可下zai和使用</div>
        </div>

        <div class="item">
            <div class="title">Life of Vids</div>
            <div class="desc">提供免F高清视频素材，可以使用</div>
        </div>

        <div class="item">
            <div class="title">视频中国</div>

        </div>

            <div class="title">Pexels Videos</div>
            <div class="desc">提供免F高清视频素材和动画素材，可下zai和使用</div>
        </div>

        <div class="item">
            <div class="title">找台词</div>
            <div class="desc">可以根据想要的台词找到影视片段</div>
        </div>
    </div>

</body>
</html>
