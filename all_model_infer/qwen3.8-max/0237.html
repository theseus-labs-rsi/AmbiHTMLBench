<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光明日报 - 公益广告</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap');

        :root {
            --primary-green: #2e8b36;
            --light-green-bg: #e3edc6;
            --dark-green-text: #1a7a28;
            --header-blue: #1a4b8c;
            --logo-red: #c41e24;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 900px;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px 20px 10px 20px;
            border-bottom: 2px solid var(--header-blue);
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background-color: var(--header-blue);
        }

        .masthead-logo {
            font-family: 'Ma Shan Zheng', cursive; /* Approximation for calligraphy */
            font-size: 32px;
            color: var(--logo-red);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .header-right {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .date-info {
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        .section-title {
            font-size: 36px;
            font-weight: 900;
            color: var(--header-blue);
            letter-spacing: 2px;
        }

        .page-number {
            font-size: 36px;
            font-weight: 400;
            color: #333;
            margin-left: 5px;
        }

        /* Main Ad Content */
        .ad-container {
            position: relative;
            background-color: var(--light-green-bg);
            /* Simulating the textured background pattern */
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 11px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 11px),
                repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(200,220,180,0.2) 15px, rgba(200,220,180,0.2) 16px);
            min-height: 1100px;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .series-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-green-text);
            margin-bottom: 60px;
        }

        .main-headline {
            position: absolute;
            top: 180px;
            right: 80px;
            text-align: right;
            font-size: 72px;
            font-weight: 900;
            color: var(--dark-green-text);
            line-height: 1.1;
            letter-spacing: 2px;
        }

        /* Central Graphic Placeholder */
        .central-graphic {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG approximation of the bike/leaf graphic */
        .graphic-svg {
            width: 100%;
            height: 100%;
        }

        .body-text {
            position: absolute;
            bottom: 180px;
            left: 80px;
            width: 55%;
            font-size: 18px;
            line-height: 2.2;
            color: #333;
            text-align: justify;
        }

        /* Footer Wave and Logo */
        .footer-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, #4caf50 0%, #4caf50 40%, transparent 100%);
            clip-path: ellipse(150% 100% at 50% 100%);
        }
        
        .footer-wave-dark {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #388e3c;
            clip-path: polygon(0 40%, 100% 10%, 100% 100%, 0 100%);
        }

        .footer-logo {
            position: absolute;
            bottom: 30px;
            right: 60px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 38px;
            color: #fff;
            letter-spacing: 4px;
            z-index: 10;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Header -->
    <div class="header">
        <div class="masthead-logo">光明日報</div>
        <div class="header-right">
            <span class="date-info">2025年 1月 5日 星期日</span>
            <span class="section-title">公益广告</span>
            <span class="page-number">05</span>
        </div>
    </div>

    <!-- Main Advertisement Area -->
    <div class="ad-container">
        <div class="series-title">绿色生活系列公益广告</div>

        <div class="main-headline">
            绿色出行<br>低碳环保
        </div>

        <!-- Central Graphic: Cyclist on Leaf -->
        <div class="central-graphic">
            <svg class="graphic-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Leaf Base -->
                <path d="M100,350 Q400,300 750,380 Q600,480 400,480 Q200,480 100,350 Z" fill="#4caf50" />
                <path d="M150,360 Q400,330 700,380" stroke="#e3edc6" stroke-width="4" fill="none" />
                <path d="M300,380 Q400,360 500,390" stroke="#e3edc6" stroke-width="3" fill="none" />
                <path d="M450,420 Q550,400 650,410" stroke="#e3edc6" stroke-width="3" fill="none" />
                
                <!-- Leaf Stem -->
                <path d="M700,380 Q780,390 800,410" stroke="#4caf50" stroke-width="15" stroke-linecap="round" fill="none" />

                <!-- Bicycle Wheels (Green Rings) -->
                <circle cx="280" cy="280" r="70" stroke="#8bc34a" stroke-width="25" fill="none" />
                <circle cx="520" cy="280" r="70" stroke="#8bc34a" stroke-width="25" fill="none" />

                <!-- Cyclist Figure (Black Abstract) -->
                <!-- Head -->
                <circle cx="350" cy="140" r="22" fill="#000" />
                <!-- Body/Frame -->
                <path d="M350,170 Q400,200 480,220 L420,240 Q380,280 480,320" stroke="#000" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                <!-- Arm/Handlebar area -->
                <path d="M380,190 L280,220" stroke="#000" stroke-width="20" stroke-linecap="round" fill="none" />
            </svg>
        </div>

        <div class="body-text">
            选择绿色出行方式，既节约能源、减少污染，又益于健康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具，或者选择步行、骑自行车等出行方式，降低出行中产生的能耗和污染，绿色出行、低碳出行、文明出行。
        </div>

        <!-- Footer Graphics -->
        <div class="footer-wave"></div>
        <div class="footer-wave-dark"></div>
        <div class="footer-logo">光明日報社</div>
    </div>
</div>

</body>
</html>
