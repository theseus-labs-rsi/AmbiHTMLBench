<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班队会记录</title>
    <style>
        body {
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .page-container {
            background-color: #fff;
            width: 800px;
            min-height: 1000px;
            padding: 40px 50px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            letter-spacing: 5px;
            margin-bottom: 20px;
            font-weight: normal;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #333;
        }
        td, th {
            border: 1px solid #333;
            padding: 10px;
            vertical-align: top;
            font-size: 18px;
            line-height: 1.6;
        }
        .label-col {
            width: 80px;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            background-color: #fafafa;
        }
        .content-col {
            /* Handwriting simulation */
            font-family: "Kaiti", "STKaiti", cursive; 
        }
        .header-row td {
            height: 40px;
            vertical-align: middle;
        }
        .indent {
            text-indent: 2em;
        }
        .list-item {
            margin-bottom: 5px;
        }
        .page-number {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        /* Specific adjustments for the layout */
        .col-time-label { width: 60px; text-align: center; vertical-align: middle;}
        .col-time-val { width: 150px; text-align: center; vertical-align: middle;}
        .col-class-label { width: 100px; text-align: center; vertical-align: middle;}
        .col-class-val { text-align: center; vertical-align: middle;}
        
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 5px;
            margin: 0 auto;
            display: block;
            width: fit-content;
        }
        
        .handwritten {
            font-family: "Kaiti", "STKaiti", "Comic Sans MS", cursive;
            font-size: 20px;
            color: #2c3e50;
        }

        .purpose-cell {
            padding: 15px;
        }
        
        .process-cell {
            padding: 15px;
            min-height: 300px;
        }

        .effect-cell {
            padding: 15px;
            min-height: 100px;
        }
        
        .remark-cell {
            padding: 15px;
            text-align: center;
            font-size: 22px;
        }

    </style>
</head>
<body>

<div class="page-container">
    <h1>班队会记录</h1>
    
    <table>
        <!-- Row 1: Time and Class -->
        <tr class="header-row">
            <td class="col-time-label">时间</td>
            <td class="col-time-val handwritten">2023.5.22</td>
            <td class="col-class-label">班级（中队）</td>
            <td class="col-class-val handwritten">五（3）中队</td>
        </tr>
        
        <!-- Row 2: Theme -->
        <tr>
            <td class="label-col">主题</td>
            <td colspan="3" class="content-col handwritten" style="padding-left: 20px;">
                争做良好习惯的小标兵
            </td>
        </tr>
        
        <!-- Row 3: Purpose/Requirements -->
        <tr>
            <td class="label-col">目的<br>要求</td>
            <td colspan="3" class="content-col handwritten purpose-cell">
                <div class="indent">教育归根结底是培养习惯，养成习惯，习惯是行为的自动化，习惯一旦养成，就会成为支配人生的一种力量。通过本次班队会，就是要培养同学们的良好习惯。</div>
            </td>
        </tr>
        
        <!-- Row 4: Process -->
        <tr>
            <td class="label-col">过<br><br><br>程</td>
            <td colspan="3" class="content-col handwritten process-cell">
                <div class="list-item">一、观看事例.</div>
                <div class="list-item" style="margin-left: 2em;">故事告诉我们的道理：世界上，最可怕的力量是习惯，世界上最宝贵的财富也是习惯。</div>
                <div class="list-item">二、小品《发生在我们身边的事》</div>
                <div class="list-item">三、怎样告别坏习惯.</div>
                <div class="list-item">四、分享好习惯.</div>
                <div class="list-item">五、养成好习惯.</div>
            </td>
        </tr>
        
        <!-- Row 5: Effect -->
        <tr>
            <td class="label-col">效<br>果</td>
            <td colspan="3" class="content-col handwritten effect-cell">
                <div class="indent">今天的班队会开得很成功，相信大家也受到了很大的教育和促动，我相信我们的后校会更加美好。</div>
            </td>
        </tr>
        
        <!-- Row 6: Remarks -->
        <tr>
            <td class="label-col">备注</td>
            <td colspan="3" class="content-col handwritten remark-cell">
                争做良好习惯
            </td>
        </tr>
    </table>

    <div class="page-number">- 46 -</div>
</div>

</body>
</html>
