<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祥除帖 昨表帖</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: "KaiTi", "STKaiti", "BiauKai", "楷体", serif;
        }

        .page-container {
            background-color: #dcbfa6; /* Approximate paper color */
            width: 600px;
            height: 1100px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 60px 40px;
            box-sizing: border-box;
            overflow: hidden;
            /* Subtle texture simulation */
            background-image: linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .calligraphy-grid {
            display: flex;
            flex-direction: row-reverse; /* Right to left layout */
            height: 100%;
            width: 100%;
            justify-content: space-between;
        }

        .column {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 28px;
            line-height: 1.2;
            color: #1a1a1a;
            letter-spacing: 4px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .col-title {
            font-size: 20px;
            margin-right: 10px; /* Space between title and main text in vertical flow context if needed, but here it's a separate column */
            align-self: flex-start;
            margin-top: 20px;
        }

        .col-main-1, .col-main-2, .col-main-3, .col-main-4, .col-main-5 {
            font-size: 32px;
            font-weight: bold;
        }

        .col-signature {
            font-size: 26px;
            margin-top: 150px; /* Indentation for signature */
        }

        .seal-container {
            position: absolute;
            bottom: 180px;
            left: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .seal {
            width: 36px;
            height: 36px;
            background-color: #c43c3c;
            border-radius: 4px;
            opacity: 0.85;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #dcbfa6;
            font-size: 14px;
            font-family: "SimSun", serif;
            border: 2px solid #a02020;
        }

        /* Specific adjustments for spacing to match image */
        .col-main-1 { margin-right: 5px; }
        .col-main-2 { margin-right: 5px; }
        .col-main-3 { margin-right: 5px; }
        .col-main-4 { margin-right: 5px; }
        
        .title-col {
            margin-right: 30px;
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="calligraphy-grid">
            
            <!-- Column 1 (Rightmost): Title -->
            <div class="column title-col">
                <span style="font-size: 22px;">祥除帖&nbsp;&nbsp;昨表帖</span>
            </div>

            <!-- Column 2 -->
            <div class="column col-main-1">
                臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時嚴寒奉被
            </div>

            <!-- Column 3 -->
            <div class="column col-main-2">
                手詔伏承聖體御膳勝常以慰下情臣故患匈滿氣上頓乏勿勿慈
            </div>

            <!-- Column 4 -->
            <div class="column col-main-3">
                恩垂愍每見慰問感戴屏營不勝衝遇謹表陳聞臣廙誠惶頓首
            </div>

            <!-- Column 5 -->
            <div class="column col-main-4">
                頓首死罪死罪&nbsp;&nbsp;臣廙言昨表不宣奉賜手詔伏承聖體勝常以
            </div>

            <!-- Column 6 -->
            <div class="column col-main-5">
                慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀亡
            </div>

            <!-- Column 7 -->
            <div class="column col-main-5" style="margin-right: 20px;">
                愍存益勞聖心謹附承動静臣廙言
            </div>

            <!-- Column 8 (Leftmost): Signature -->
            <div class="column col-signature">
                歲在癸卯春耀陽書於未央雲舍
            </div>

        </div>

        <!-- Seals -->
        <div class="seal-container">
            <div class="seal" style="border-radius: 50%;">印</div>
            <div class="seal">耀陽</div>
        </div>
    </div>

</body>
</html>
