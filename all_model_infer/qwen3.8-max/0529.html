<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 破晓艺术跨界展览</title>
    <style>
        :root {
            --primary-blue: #1a237e;
            --accent-pink: #ff1764;
            --bg-color: #f8f9fa;
            --grid-color: #e0e0e0;
            --text-grey: #333;
            --watermark-color: rgba(0, 0, 0, 0.04);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ddd;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 9 / 16;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            /* Grid Background */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20% 12.5%; /* Approximate grid based on image */
            background-position: center center;
        }

        /* Watermarks */
        .watermark {
            position: absolute;
            font-weight: 900;
            color: var(--watermark-color);
            z-index: 0;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: -2px;
        }
        .wm-new {
            top: 2%;
            left: 5%;
            font-size: 18vw;
            line-height: 0.8;
        }
        .wm-year {
            bottom: 10%;
            right: 5%;
            font-size: 22vw;
            line-height: 0.8;
        }
        .wm-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.02);
            z-index: 0;
        }
        .circle-1 { width: 40vw; height: 40vw; top: 15%; right: -10%; }
        .circle-2 { width: 50vw; height: 50vw; bottom: 5%; left: 20%; }

        /* Content Layer */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 8% 6%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Top Section */
        .top-bar {
            width: 30px;
            height: 4px;
            background-color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .year {
            font-size: 12vw;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1;
            margin: 0;
            letter-spacing: -2px;
        }

        .subtitle-box {
            background-color: var(--primary-blue);
            display: inline-block;
            padding: 5px 10px;
            margin-top: 15px;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .subtitle-text {
            color: var(--accent-pink);
            font-size: 7vw;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Main Title Area */
        .main-title-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .big-title {
            display: flex;
            flex-direction: column;
        }

        .title-line {
            font-size: 22vw;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 0.9;
            margin: 0;
            letter-spacing: -5px;
        }

        .title-highlight {
            position: relative;
            display: inline-block;
        }
        
        /* The pink bar behind the bottom of the last characters */
        .title-highlight::after {
            content: '';
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 25%;
            background-color: var(--accent-pink);
            z-index: -1;
        }

        /* Right Side Info (Time) */
        .info-right {
            text-align: right;
            margin-bottom: 20px;
            align-self: flex-end;
            margin-top: -150px; /* Pull up to align with title */
        }

        .label {
            font-size: 3.5vw;
            color: var(--text-grey);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .date {
            font-size: 7vw;
            font-weight: 900;
            color: var(--accent-pink);
            line-height: 1.1;
        }

        .dash {
            display: block;
            width: 20px;
            height: 4px;
            background-color: var(--primary-blue);
            margin: 5px 0 5px auto;
        }
        
        .dash-left {
            margin: 5px 0 5px 0;
        }

        /* Middle Info Section */
        .middle-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            margin-bottom: 60px;
        }

        .price-box {
            text-align: left;
        }

        .price {
            font-size: 6vw;
            font-weight: 900;
            color: var(--accent-pink);
            display: flex;
            align-items: baseline;
        }
        .price span {
            font-size: 3vw;
            margin-left: 2px;
        }
        .price-label {
            font-size: 3.5vw;
            color: var(--text-grey);
            margin-top: 5px;
        }

        .location-box {
            text-align: right;
        }
        .location-text {
            font-size: 4.5vw;
            color: var(--primary-blue);
            font-weight: bold;
            margin-top: 5px;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
        }

        .footer-left {
            text-align: left;
        }
        .footer-right {
            text-align: right;
        }

        .footer-label {
            font-size: 3.5vw;
            color: var(--text-grey);
            margin-bottom: 5px;
        }

        .footer-value {
            font-size: 5vw;
            color: var(--primary-blue);
            font-weight: 900;
        }
        
        .phone-number {
            font-family: monospace;
            letter-spacing: 1px;
        }

        .bottom-dash {
            width: 30px;
            height: 4px;
            background-color: var(--primary-blue);
            margin-top: 15px;
        }
        .bottom-dash-right {
            margin-left: auto;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Elements -->
        <div class="watermark wm-new">NEW</div>
        <div class="watermark wm-year">YEAR</div>
        <div class="wm-circle circle-1"></div>
        <div class="wm-circle circle-2"></div>

        <div class="content">
            <!-- Top -->
            <div class="top-bar"></div>
            <h1 class="year">2026</h1>
            
            <div class="subtitle-box">
                <h2 class="subtitle-text">破晓艺术</h2>
            </div>

            <!-- Main Title & Date -->
            <div class="main-title-area">
                <div class="big-title">
                    <div class="title-line">跨界</div>
                    <div class="title-line title-highlight">展览</div>
                </div>
                
                <div class="info-right">
                    <div class="label">活动时间</div>
                    <div class="date">01/01</div>
                    <div class="dash"></div>
                    <div class="date">01/03</div>
                </div>
            </div>

            <!-- Middle Info -->
            <div class="middle-section">
                <div class="price-box">
                    <div class="price">¥ 60<span>起</span></div>
                    <div class="price-label">单人票价</div>
                </div>

                <div class="location-box">
                    <div class="dash dash-left" style="margin-left: auto; width: 20px; height: 4px; background: var(--primary-blue); margin-bottom: 10px;"></div>
                    <div class="label">活动地点</div>
                    <div class="location-text">厦门湖里区稿定艺术馆</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-left">
                    <div class="footer-label">主办方：</div>
                    <div class="footer-value">稿定集团</div>
                    <div class="bottom-dash"></div>
                </div>
                <div class="footer-right">
                    <div class="footer-label">联系电话</div>
                    <div class="footer-value phone-number">0592-88888888</div>
                    <div class="bottom-dash bottom-dash-right"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
