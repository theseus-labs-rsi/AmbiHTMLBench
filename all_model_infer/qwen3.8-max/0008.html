<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔吉拉的面具 - 物品提示框</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #1c211b;
}
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 480px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(190,210,190,0.25), rgba(0,0,0,0) 55%),
    linear-gradient(180deg, #232a24 0%, #2c352d 22%, #465247 45%, #66756a 62%, #7d8d80 78%, #93a394 100%);
}
.stage::before {
  content: "";
  position: absolute; left: 0; right: 0; top: 0; height: 38%;
  background: linear-gradient(90deg,
    rgba(20,24,20,0.85) 0%, rgba(30,36,30,0.55) 18%,
    rgba(40,48,40,0.25) 40%, rgba(40,48,40,0.25) 60%,
    rgba(30,36,30,0.55) 82%, rgba(20,24,20,0.85) 100%);
}
.placeholder {
  display: flex; align-items: center; justify-content: center;
  text-align: center; color: #eef3ee; font-size: 11px; line-height: 1.4;
  background: rgba(0,0,0,0.18); border: 1px dashed rgba(255,255,255,0.25);
}
.scene-fig {
  position: absolute; left: 40%; top: 58%; width: 30%; height: 40%;
  margin: 0;
  background: rgba(0,0,0,0.10);
  border: 1px dashed rgba(255,255,255,0.18);
}
.dialog {
  position: absolute; left: 23%; top: 26%; width: 54%; min-width: 320px;
  background: rgba(206,214,209,0.92);
  border: 1px solid rgba(255,255,255,0.85);
  box-shadow: 0 0 22px rgba(255,255,255,0.45), 0 6px 18px rgba(0,0,0,0.35);
  padding: 16px 26px 10px 26px;
  color: #fff;
}
.dialog::before, .dialog::after {
  content: "";
  position: absolute; top: 10px; bottom: 10px; width: 5px;
  background: repeating-linear-gradient(180deg,
    rgba(110,120,114,0.75) 0 7px, rgba(255,255,255,0) 7px 12px);
}
.dialog::before { left: 10px; }
.dialog::after { right: 10px; }
.inner { display: flex; align-items: flex-start; gap: 14px; }
.mask-slot {
  flex: 0 0 24%; height: 118px;
  border: none;
  background: radial-gradient(circle at 50% 50%,
    rgba(255,236,170,0.95) 0%, rgba(255,196,110,0.55) 34%, rgba(255,255,255,0) 72%);
  color: #6b5a33; font-size: 10px;
}
.content { flex: 1 1 auto; }
.title {
  margin: 0 0 7px 0; font-size: 15px; font-weight: 700; letter-spacing: 1px;
  color: #fff; text-shadow: 0 1px 3px rgba(60,70,60,0.6);
}
.meta { display: flex; align-items: center; gap: 7px; margin: 0 0 7px 0; }
.item-icon {
  display: inline-block; width: 17px; height: 15px;
  background: linear-gradient(180deg, #dfe5e1, #b9c2bc);
  border: 1px solid #8f9891; border-radius: 2px;
}
.count {
  display: inline-block; background: #3d4340; color: #fff;
  font-size: 11px; line-height: 1; padding: 3px 8px; border-radius: 2px;
}
.desc {
  margin: 0; font-size: 12px; line-height: 1.6; color: #fff;
  text-shadow: 0 1px 2px rgba(60,70,60,0.55);
}
.footer {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 6px; margin-top: 9px;
}
.footer .label { font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(60,70,60,0.55); }
.btn {
  display: inline-block; width: 15px; height: 15px; border-radius: 50%;
  background: #f4f6f4; border: 1px solid #7d867f;
  box-shadow: inset 0 -2px 3px rgba(0,0,0,0.25);
}
</style>
</head>
<body>
<div class="stage">
  <figure class="placeholder scene-fig">[游戏场景：角色站在石台上的宝箱前]</figure>
  <div class="dialog">
    <div class="inner">
      <div class="placeholder mask-slot">[图标：魔吉拉的面具，带放射光芒]</div>
      <div class="content">
        <h1 class="title">魔吉拉的面具</h1>
        <div class="meta">
          <span class="item-icon"></span>
          <span class="count">1</span>
        </div>
        <p class="desc">
          从太古时期留传下来的面具。<br>
          戴上它的话　其怪异的外观不容易显现自己。<br>
          这样的珍品并非轻易就能得到。
        </p>
      </div>
    </div>
    <div class="footer">
      <span class="label">打开箱子</span>
      <span class="btn"></span>
    </div>
  </div>
</div>
</body>
</html>
