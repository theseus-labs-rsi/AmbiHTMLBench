<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家名</title>
    <style>
        body {
            background-color: #fdf2ec;
            font-family: "SimSun", "Songti SC", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #e67e22;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .list-container {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 40%;
        }
        .item {
            font-size: 20px;
            color: #333;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>国家名</h1>
        <div class="list-container">
            <div class="column">
                <div class="item">弘昼国</div>
                <div class="item">安平国</div>
                <div class="item">苍狼国</div>
                <div class="item">黑鹰国</div>
                <div class="item">古木国</div>
                <div class="item">临越国</div>
                <div class="item">临月国</div>
                <div class="item">逸水国</div>
                <div class="item">飞虎国</div>
                <div class="item">静月国</div>
                <div class="item">火凤国</div>
                <div class="item">长风国</div>
                <div class="item">凤临国</div>
            </div>
            <div class="column">
                <div class="item">金鹏国</div>
                <div class="item">玄龙国</div>
                <div class="item">夜莲国</div>
                <div class="item">北冥国</div>
                <div class="item">绮霞国</div>
                <div class="item">银霜国</div>
                <div class="item">轩辕国</div>
                <div class="item">真北国</div>
                <div class="item">碧潭国</div>
                <div class="item">青果国</div>
                <div class="item">鸿熙国</div>
                <div class="item">阳明国</div>
                <div class="item">落霞国</div>
            </div>
        </div>
    </div>
</body>
</html>
