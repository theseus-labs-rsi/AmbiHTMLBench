<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效背书</title>
    <style>
        body {
            background-color: #4a6b53; /* Dark green background matching the image border */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .card-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 25px 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-title {
            background-color: #4a6b53;
            color: white;
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            width: 85%;
            letter-spacing: 2px;
        }

        .divider {
            height: 1px;
            background-color: #dcdcdc;
            margin: 15px 0;
            width: 100%;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            color: #4a6b53;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .section-content {
            color: #333333;
            font-size: 16px;
            line-height: 1.6;
            text-align: justify;
        }

        .example-block {
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 15px;
            line-height: 1.8;
            color: #333;
        }

        .highlight-label {
            background-color: #ffeb3b; /* Yellow highlight */
            color: #000;
            padding: 0 4px;
            font-weight: bold;
            margin-right: 5px;
            display: inline-block;
            min-width: 40px;
            text-align: center;
        }

        .bold-text {
            font-weight: bold;
        }

        .footer-area {
            display: flex;
            align-items: center;
            margin-top: 10px;
            position: relative;
        }

        .avatar-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .avatar-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .speech-bubble {
            border: 1px solid #999;
            border-radius: 4px;
            padding: 10px 15px;
            margin-left: 15px;
            margin-right: 15px;
            flex-grow: 1;
            position: relative;
            font-size: 15px;
            color: #333;
            background-color: #fff;
        }

        /* Triangle for speech bubble pointing left */
        .speech-bubble::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 8px 8px 8px 0;
            border-style: solid;
            border-color: transparent #999 transparent transparent;
        }
        
        .speech-bubble::after {
            content: "";
            position: absolute;
            left: -7px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 7px 7px 7px 0;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
        }

        .play-button {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #4a6b53;
            flex-shrink: 0;
        }

        .watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            color: #fff; /* White text on dark bg outside card, but here it's inside? No, looking at image, it's at the very bottom right on the green bg */
        }
        
        /* Adjusting watermark to be outside the white card based on image */
        .outer-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        .bottom-watermark {
            text-align: right;
            color: #e0e0e0;
            font-size: 12px;
            margin-top: 5px;
            padding-right: 5px;
        }

    </style>
</head>
<body>

<div class="outer-wrapper">
    <div class="card-container">
        <!-- Header -->
        <div class="header-title">高效背书</div>
        
        <div class="divider"></div>

        <!-- Section 01 -->
        <div class="section">
            <div class="section-title">01.理解背诵</div>
            <div class="section-content">
                还有几天考试，很多东西还没背。不要慌张，先理解再背诵，考试运用得心应手
            </div>
        </div>

        <!-- Section 02 -->
        <div class="section">
            <div class="section-title">02.关键复述</div>
            <div class="section-content">
                边读边画关键词，再把关键词抄在草稿纸上。把内容都遮住，然后就看自己写在草稿纸上的关键词，进行复述
            </div>
            
            <div class="example-block">
                <div><span class="highlight-label">原文</span>：<span class="bold-text">德思礼夫妇</span>总是<span class="bold-text">得意</span>地说他们是<span class="bold-text">非常规矩</span>的人家</div>
                <div><span class="highlight-label">关键</span>：<span class="bold-text">德思礼夫妇 + 得意 + 非常规矩</span></div>
                <div><span class="highlight-label">复述</span>：<span class="bold-text">德思礼夫妇得意</span>地说他们是<span class="bold-text">非常规矩</span>的一家</div>
            </div>
        </div>

        <!-- Section 03 -->
        <div class="section">
            <div class="section-title">03.关键背诵</div>
            <div class="section-content">
                这样就背关键词，考试的时候也能顺利展开内容
            </div>
        </div>

        <!-- Section 04 -->
        <div class="section">
            <div class="section-title">04.睡觉记忆</div>
            <div class="section-content">
                睡前30分钟再复习背诵的内容。睡醒后10分钟，再看关键词进行复述，并默写出来
            </div>
        </div>

        <div class="divider"></div>

        <!-- Footer -->
        <div class="footer-area">
            <div class="avatar-placeholder">
                <!-- Placeholder for the cartoon avatar -->
                <div style="font-size: 10px; color: #999; text-align: center;">[Avatar]</div>
            </div>
            <div class="speech-bubble">
                这样背书，就像用了魔法，过目不忘
            </div>
            <div class="play-button"></div>
        </div>

    </div>
    
    <!-- Watermark outside the card -->
    <div class="bottom-watermark">
        小红书号: 4141895475
    </div>
</div>

</body>
</html>
