<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into The Darkness - Film Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 3;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .header {
            margin-top: 6%;
            text-align: center;
            z-index: 10;
        }

        .presents {
            font-size: 1.2rem;
            letter-spacing: 0.4em;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: #c1272d;
            font-size: 5.5rem;
            line-height: 0.9;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin: 0;
        }

        .image-area {
            width: 100%;
            flex-grow: 1;
            position: relative;
            margin-top: -20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simulating the dark parking garage image with CSS gradients and a placeholder structure */
        .garage-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #000 0%, #1a1a1a 40%, #333 60%, #000 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Placeholder for the actual photo content to maintain layout fidelity */
        .photo-placeholder {
            width: 100%;
            height: 60%;
            position: absolute;
            top: 25%;
            background: radial-gradient(circle at center, #444 0%, #000 70%);
            opacity: 0.6;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 0.8rem;
        }

        .clearance-sign {
            position: absolute;
            top: 42%;
            right: 15%;
            background-color: #fff;
            color: #000;
            padding: 5px 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            z-index: 20;
            transform: perspective(500px) rotateY(-5deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .footer {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .director {
            color: #c1272d;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .details {
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .title { font-size: 3.5rem; }
            .presents { font-size: 0.9rem; }
            .clearance-sign { font-size: 0.8rem; top: 40%; right: 10%; }
            .director { font-size: 1rem; }
            .details { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="poster-container">
        
        <div class="header">
            <div class="presents">Soulful Film Presents</div>
            <h1 class="title">Into The<br>Darkness</h1>
        </div>

        <div class="image-area">
            <div class="garage-bg"></div>
            <div class="photo-placeholder">
                [Image: Black and white photo of a car in a dark parking garage tunnel]
            </div>
            <div class="clearance-sign">SELF PARK 6'-0'' CLEARANCE</div>
        </div>

        <div class="footer">
            <div class="director">Directed by Levi Stanford</div>
            <div class="details">
                May 23, 2019 | 2:00 pm<br>
                Michael Hopper Auditorium<br>
                Oreixs university, OH
            </div>
        </div>

    </div>

</body>
</html>
