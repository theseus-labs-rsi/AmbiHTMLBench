<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易被忽视的养生小动作</title>
    <style>
        body {
            background-color: #dcdcdc;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-family: "SimSun", "Songti SC", "STSong", serif;
        }
        .page-container {
            background-color: #e6e4df;
            width: 380px;
            padding: 15px 20px 30px 20px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            position: relative;
            /* Simulating the paper texture/noise slightly with a subtle gradient if needed, but solid color is safer for fidelity */
            background-image: linear-gradient(to bottom, #e8e6e1, #e0ded9);
        }
        /* The vertical line on the right edge seen in the crop */
        .page-container::after {
            content: '';
            position: absolute;
            top: 0;
            right: 8px;
            bottom: 0;
            width: 2px;
            background-color: #333;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            color: #1a1a1a;
        }
        .content-block {
            margin-bottom: 20px;
            text-align: justify;
            line-height: 1.6;
            font-size: 19px;
            color: #222;
        }
        .bold-term {
            font-weight: bold;
            margin-right: 15px;
            font-size: 20px;
        }
        p {
            margin: 0;
            text-indent: 0; /* The image uses bold terms as inline headers rather than standard indentation for the first line, except visually it looks like a hanging indent or just inline bold */
        }
        /* Adjusting for the specific layout where the bold term starts the paragraph */
        .paragraph-wrapper {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="page-container">
    <h1>易被忽视的养生小动作</h1>

    <div class="paragraph-wrapper">
        <p class="content-block">
            <span class="bold-term">梳头</span>梳头是脑部运动最理想的项目，它可以刺激穴位，增强分泌活动，改善血液循环，促进新陈代谢。此外，梳头还是治疗失眠、眩晕、心悸、中风后遗症和青少年白发的辅助手段。平时每天可梳头3至5次，每次不少于3至5分钟，其中晚上睡前必须要梳一次。
        </p>
    </div>

    <div class="paragraph-wrapper">
        <p class="content-block">
            <span class="bold-term">伸懒腰</span>伸懒腰会使人体的脏器对心、肺产生挤压。持续几秒钟的伸懒腰，使很多淤积的血液被赶回心脏，改善血液循环，使更多的含氧量的血液供给大脑，还可带走肌肉的一些废物，从而消除人体的疲劳。
        </p>
    </div>
</div>

</body>
</html>
