<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30天学会自然拼读</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@700;900&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: 'Nunito', 'Microsoft YaHei', sans-serif;
        }

        .page-container {
            width: 600px;
            background-color: #fff;
            border: 4px solid #333;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            /* Simulating the colorful border background */
            background-image: 
                linear-gradient(to right, #ff4d4d 0%, #ff4d4d 100%),
                linear-gradient(to right, #ffd700 0%, #ffd700 100%),
                linear-gradient(to right, #4da6ff 0%, #4da6ff 100%);
            background-size: 100% 15px, 100% 15px, 100% 15px;
            background-position: top, bottom, bottom;
            background-repeat: no-repeat;
        }

        /* Outer decorative borders simulation */
        .outer-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 15px solid transparent;
            border-image: linear-gradient(to bottom, #ff4d4d 33%, #ffd700 33%, #ffd700 66%, #4da6ff 66%) 1;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Actually, let's use a simpler wrapper for the colored frame */
        .frame-wrapper {
            background: linear-gradient(to bottom, #ff4d4d 0%, #ff4d4d 15%, #ffd700 15%, #ffd700 85%, #4da6ff 85%, #4da6ff 100%);
            padding: 10px;
            border-radius: 4px;
        }

        .inner-content {
            background-color: #fff;
            border: 2px solid #333;
            padding: 30px 20px;
            position: relative;
            min-height: 800px;
        }

        /* Top Title */
        .main-title {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .main-title h1 {
            display: inline-block;
            background-color: #ffb6c1; /* Pink highlight */
            color: #333;
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            font-size: 32px;
            padding: 5px 20px;
            margin: 0;
            border-radius: 5px;
            position: relative;
            z-index: 2;
        }
        .main-title::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 40px;
            background-color: #ff99aa;
            border-radius: 10px;
            z-index: 1;
            opacity: 0.6;
        }
        .blue-bar {
            height: 15px;
            background-color: #aaccff;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        /* Section Layouts */
        .section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 50px;
            position: relative;
        }

        .left-col {
            width: 45%;
        }

        .right-col {
            width: 50%;
            padding-top: 10px;
        }

        /* Subtitles */
        .subtitle-cn {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
            display: inline-block;
            padding: 2px 15px;
            border-radius: 20px;
        }
        .bg-blue { background-color: #cce5ff; }
        .bg-yellow { background-color: #e6ffcc; }

        .subtitle-en {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Text Boxes */
        .text-box {
            background-color: #ffe6e6;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            font-weight: bold;
        }
        
        .poem-box {
            background-color: #ffe6e6;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-weight: bold;
            display: inline-block;
        }

        /* Word Lists */
        .word-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 10px;
            font-size: 22px;
            font-weight: 900;
            color: #333;
        }
        .word-item span.red {
            color: #ff4d4d;
        }

        /* Illustrations Placeholders */
        .illustration-row {
            display: flex;
            justify-content: space-around;
            margin: 10px 0;
            height: 60px;
            align-items: flex-end;
        }
        .avatar {
            width: 40px;
            height: 50px;
            background-color: #ddd;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        /* Simplified avatar shapes */
        .av1 { background: #8b4513; border-radius: 50%; width: 45px; height: 45px; }
        .av2 { background: #ffcc99; width: 30px; height: 40px; border-radius: 10px 10px 0 0; position: relative; }
        .av2::before { content:''; position:absolute; top:-10px; left:5px; width:20px; height:20px; background:#ff69b4; border-radius:50%; }
        .av3 { background: #8b4513; width: 35px; height: 45px; border-radius: 15px 15px 0 0; }
        .av4 { background: #ffcc99; width: 30px; height: 40px; border-radius: 10px 10px 0 0; position: relative;}
        .av4::before { content:''; position:absolute; top:-15px; left:5px; width:20px; height:25px; background:#4db8ff; border-radius:50%; }

        .boy-illustration {
            width: 100px;
            height: 180px;
            position: absolute;
            right: -10px;
            bottom: -20px;
            /* Placeholder for the boy */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .boy-head { width: 50px; height: 50px; background: #ffcc99; border-radius: 50%; border: 2px solid #333; position: relative; z-index: 2;}
        .boy-hair { width: 55px; height: 25px; background: #333; border-radius: 20px 20px 0 0; position: absolute; top: -5px; }
        .boy-body { width: 40px; height: 70px; background: #ff4d4d; border-radius: 10px; margin-top: -5px; z-index: 1; }
        .boy-legs { width: 30px; height: 60px; background: #333; margin-top: 0; display: flex; justify-content: space-between; }
        .leg { width: 12px; height: 100%; background: #2c3e50; }

        /* Decorative Elements */
        .flower-top-right {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ffcc00 20%, transparent 20%),
                        radial-gradient(circle at 30% 30%, #ff99cc 30%, transparent 30%),
                        radial-gradient(circle at 70% 30%, #ff99cc 30%, transparent 30%),
                        radial-gradient(circle at 50% 70%, #ff99cc 30%, transparent 30%);
            opacity: 0.8;
            z-index: 5;
        }
        
        .hearts-right {
            position: absolute;
            right: 10px;
            top: 50%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .heart { width: 20px; height: 20px; background: #ffb6c1; border-radius: 50%; position: relative; transform: rotate(45deg); }
        .heart::before, .heart::after { content: ''; width: 20px; height: 20px; background: inherit; border-radius: 50%; position: absolute; }
        .heart::before { left: -10px; }
        .heart::after { top: -10px; }
        .h-pink { background: #ffb6c1; }
        .h-green { background: #ccffcc; }
        .h-blue { background: #cce5ff; }

        .bottom-deco {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
        .good-text {
            font-family: 'Comic Sans MS', cursive;
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #333;
            margin-bottom: 5px;
        }
        .bear-placeholder {
            width: 120px;
            height: 80px;
            background: #d2691e;
            border-radius: 50% 50% 10px 10px;
            margin: 0 auto;
            position: relative;
        }
        .bear-ears { position: absolute; top: -10px; width: 100%; display: flex; justify-content: space-between; padding: 0 10px; box-sizing: border-box;}
        .ear { width: 25px; height: 25px; background: #d2691e; border-radius: 50%; }
        
        .watermark {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            z-index: 20;
        }

        .green-bar-bottom {
            height: 15px;
            background-color: #e6ffcc;
            width: 100%;
            margin-top: 20px;
            border-radius: 2px;
        }

        /* Specific positioning for section 2 */
        .section-2 .left-col {
            position: relative;
        }
        
        .corner-deco-left {
            position: absolute;
            bottom: 20px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-left: 3px solid #333;
            border-bottom: 3px solid #333;
        }
        .corner-deco-right {
            position: absolute;
            bottom: 20px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-right: 3px solid #333;
            border-bottom: 3px solid #333;
        }
        
        .lines-left {
            position: absolute;
            bottom: 40px;
            left: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .line { width: 20px; height: 2px; background: #333; }

    </style>
</head>
<body>

<div class="frame-wrapper">
    <div class="inner-content">
        <!-- Decorative Corners/Elements -->
        <div class="flower-top-right"></div>
        <div class="lines-left">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
        <div class="corner-deco-left"></div>
        <div class="corner-deco-right"></div>

        <!-- Top Blue Bar -->
        <div class="blue-bar"></div>

        <!-- Main Title -->
        <div class="main-title">
            <h1>30天学会自然拼读</h1>
        </div>

        <!-- Section 1: Syllable Counting -->
        <div class="section">
            <div class="left-col">
                <div class="subtitle-cn bg-blue">数音节</div>
                
                <!-- Avatars Row -->
                <div class="illustration-row">
                    <div class="av1"></div>
                    <div class="av2"></div>
                    <div class="av3"></div>
                    <div class="av4"></div>
                </div>

                <div class="text-box">
                    有几个发音的元音（或元<br>音组合）就有几个音节。
                </div>
            </div>

            <div class="right-col">
                <div class="subtitle-en">Syllable Counting</div>
                <div class="word-grid">
                    <div class="word-item"><span class="red">ca</span>t</div>
                    <div class="word-item"><span class="red">ca</span>ke</div>
                    <div class="word-item"><span class="red">rai</span>n</div>
                    <div class="word-item"><span class="red">ro</span>w</div>
                    <div class="word-item"><span class="red">ro</span>bot</div>
                    <div class="word-item"><span class="red">tea</span>cher</div>
                    <div class="word-item"><span class="red">ta</span>ble</div>
                    <div class="word-item"><span class="red">a</span>pple</div>
                </div>
            </div>
        </div>

        <!-- Section 2: Syllable Division -->
        <div class="section section-2">
            <div class="left-col">
                <div class="subtitle-cn bg-yellow">划分音节</div>
                
                <div style="position: relative;">
                    <div class="poem-box">
                        有时一靠后，<br>
                        常常二分手。<br>
                        组合共发音，<br>
                        一起被分走。<br>
                        词根词缀分离，<br>
                        多音节词不易，<br>
                        还请多练多听。
                    </div>
                    
                    <!-- Boy Illustration Placeholder -->
                    <div class="boy-illustration">
                        <div class="boy-hair"></div>
                        <div class="boy-head"></div>
                        <div class="boy-body"></div>
                        <div class="boy-legs">
                            <div class="leg"></div>
                            <div class="leg"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-col">
                <div class="subtitle-en">Syllable Division</div>
                
                <!-- Hearts Decoration -->
                <div class="hearts-right">
                    <div class="heart h-pink" style="transform: scale(0.8) rotate(45deg);"></div>
                    <div class="heart h-green" style="transform: scale(0.6) rotate(45deg); margin-left: 10px;"></div>
                    <div class="heart h-pink" style="transform: scale(0.9) rotate(45deg); margin-top: 10px;"></div>
                    <div class="heart h-blue" style="transform: scale(0.7) rotate(45deg); margin-left: 15px;"></div>
                </div>

                <div class="word-grid">
                    <div class="word-item"><span class="red">ra</span>bbit</div>
                    <div class="word-item"><span class="red">ba</span>sket</div>
                    <div class="word-item"><span class="red">ba</span>by</div>
                    <div class="word-item"><span class="red">ro</span>bot</div>
                    <div class="word-item"><span class="red">clo</span>set</div>
                    <div class="word-item"><span class="red">pla</span>net</div>
                    <div class="word-item"><span class="red">de</span>stroy</div>
                    <div class="word-item"><span class="red">com</span>plex</div>
                    <div class="word-item"><span class="red">un</span>happy</div>
                    <div class="word-item"><span class="red">hope</span>fully</div>
                </div>
            </div>
        </div>

        <!-- Bottom Green Bar -->
        <div class="green-bar-bottom"></div>

        <!-- Bottom Decoration -->
        <div class="bottom-deco">
            <div class="good-text">GOOD</div>
            <div class="bear-placeholder">
                <div class="bear-ears">
                    <div class="ear"></div>
                    <div class="ear"></div>
                </div>
                <!-- Simplified bear face details -->
                <div style="position: absolute; top: 30px; left: 30px; width: 10px; height: 10px; background: #333; border-radius: 50%;"></div>
                <div style="position: absolute; top: 30px; right: 30px; width: 10px; height: 10px; background: #333; border-radius: 50%;"></div>
                <div style="position: absolute; top: 45px; left: 50px; width: 20px; height: 15px; background: #ffcc99; border-radius: 50%;"></div>
            </div>
            <!-- Small mushroom deco -->
            <div style="position: absolute; bottom: 10px; left: 30%; width: 20px; height: 20px; background: #ff4d4d; border-radius: 50% 50% 0 0;"></div>
            <div style="position: absolute; bottom: 0px; left: calc(30% + 5px); width: 10px; height: 10px; background: #fff;"></div>
        </div>

        <div class="watermark">
            @哆来咪爱学习<br>
            <span style="font-size: 10px; opacity: 0.8;">From 小红书</span>
        </div>

    </div>
</div>

</body>
</html>
