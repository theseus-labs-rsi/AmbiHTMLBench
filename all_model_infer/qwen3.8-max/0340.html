<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算思维二：分解思维</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            color: #333;
        }
        .page-container {
            width: 600px;
            height: 850px;
            background-color: #ffffff;
            position: relative;
            padding: 60px 70px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        /* Corner Brackets */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #a0b0a0;
            border-style: solid;
        }
        .top-left {
            top: 30px;
            left: 30px;
            border-width: 2px 0 0 2px;
        }
        .top-right {
            top: 30px;
            right: 30px;
            border-width: 2px 2px 0 0;
        }
        .bottom-left {
            bottom: 30px;
            left: 30px;
            border-width: 0 0 2px 2px;
        }
        .bottom-right {
            bottom: 30px;
            right: 30px;
            border-width: 0 2px 2px 0;
        }

        /* Typography */
        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: normal;
            margin-top: 10px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .intro-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .red-text {
            color: #d32f2f;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .section-content {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
        }

        /* Footer Elements */
        .footer-area {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
        }
        .original-text {
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
        .next-page-btn {
            position: absolute;
            bottom: 50px;
            right: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow-shape {
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 40px solid black;
            position: relative;
        }
        .arrow-body {
            width: 60px;
            height: 50px;
            background-color: black;
            position: absolute;
            right: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow-text {
            color: white;
            font-size: 14px;
            font-weight: bold;
            z-index: 2;
            position: relative;
            right: -10px;
        }
        
        /* Custom Arrow Construction */
        .custom-arrow {
            position: relative;
            width: 100px;
            height: 50px;
        }
        .arrow-rect {
            position: absolute;
            left: 0;
            top: 0;
            width: 70px;
            height: 50px;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .arrow-tri {
            position: absolute;
            right: 0;
            top: 0;
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 30px solid black;
        }
        .arrow-label {
            color: white;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Corner Decorations -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Title -->
    <h1>计算思维二：分解思维</h1>

    <!-- Introduction -->
    <div class="intro-text">
        分解思维是指<span class="red-text">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）。</span>
    </div>

    <!-- Section 1 -->
    <div class="section-title">1、问题梳理</div>
    <div class="section-content">
        先明确这个复杂问题到底是什么，最终要达到什么目的或效果。
    </div>

    <!-- Section 2 -->
    <div class="section-title">2、问题分解</div>
    <div class="section-content">
        将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。
    </div>

    <!-- Section 3 -->
    <div class="section-title">3、整合方案</div>
    <div class="section-content">
        制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。
    </div>

    <!-- Footer Area -->
    <div class="footer-area">
        <div class="original-text">原创：学习方法社</div>
    </div>

    <!-- Next Page Button -->
    <div class="next-page-btn">
        <div class="custom-arrow">
            <div class="arrow-rect">
                <span class="arrow-label">翻页</span>
            </div>
            <div class="arrow-tri"></div>
        </div>
    </div>

</div>

</body>
</html>
