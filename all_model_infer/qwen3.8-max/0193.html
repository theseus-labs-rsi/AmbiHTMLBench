<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asgari Ücret Afişi</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #d3cfc6; /* Concrete wall approximation */
            background-image: radial-gradient(#b0aba0 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Arial', 'Helvetica', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster {
            width: 600px;
            background-color: white;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Yellow Section */
        .section-yellow {
            background-color: #f7e017;
            padding: 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .bullet-points {
            flex: 1;
            padding-right: 20px;
        }

        .bullet-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: bold;
            color: #222;
            line-height: 1.1;
        }

        .pin {
            color: #d32f2f;
            margin-right: 15px;
            font-size: 24px;
            margin-top: 5px;
        }

        .graphic-placeholder {
            width: 220px;
            height: 220px;
            background-color: #e67e22; /* Orange circle approx */
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Simulating the graphic elements with CSS shapes/text for fidelity without external images */
        .graphic-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .arrow-up {
            position: absolute;
            right: 20px;
            top: 40px;
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 60px solid #d32f2f;
            transform: rotate(45deg);
        }
        .arrow-line {
            position: absolute;
            right: 40px;
            top: 80px;
            width: 80px;
            height: 15px;
            background-color: #d32f2f;
            transform: rotate(45deg);
        }
        .coin {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 60px;
            height: 60px;
            background-color: #f1c40f;
            border-radius: 50%;
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 30px;
            color: white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .stack {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 80px;
            height: 50px;
            background: repeating-linear-gradient(
                0deg,
                #f1c40f,
                #f1c40f 10px,
                #fff 10px,
                #fff 12px
            );
            border: 2px solid #d35400;
        }
        .pencil {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            height: 15px;
            background-color: #d32f2f;
            transform: rotate(-45deg);
        }
        .pencil::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 0;
            border-top: 7.5px solid transparent;
            border-bottom: 7.5px solid transparent;
            border-left: 15px solid #333;
        }

        /* Middle White Section */
        .section-white-middle {
            background-color: white;
            padding: 30px 30px;
            text-align: left;
        }

        .slogan {
            color: #c0392b;
            font-size: 42px;
            font-weight: 900;
            line-height: 1.1;
            margin: 0;
        }

        /* Red Banner Section */
        .section-red-banner {
            background-color: #c0392b;
            padding: 25px 30px;
            text-align: center;
        }

        .main-title {
            color: white;
            font-size: 48px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Bottom Footer Section */
        .section-footer {
            background-color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .org-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            margin-right: 20px;
            position: relative;
        }
        
        /* CSS Logo Approximation */
        .gear {
            width: 80px;
            height: 80px;
            background-color: #c0392b;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .gear::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            background: repeating-conic-gradient(from 0deg, #c0392b 0deg 10deg, transparent 10deg 20deg);
            border-radius: 50%;
            z-index: -1;
            mask: radial-gradient(transparent 55%, black 56%);
            -webkit-mask: radial-gradient(transparent 55%, black 56%);
        }
        .globe {
            width: 50px;
            height: 50px;
            background-color: #f1c40f;
            border-radius: 50%;
            border: 2px solid #c0392b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #c0392b;
            font-size: 14px;
            background-image: linear-gradient(#c0392b 1px, transparent 1px), linear-gradient(90deg, #c0392b 1px, transparent 1px);
            background-size: 10px 10px;
            background-position: center;
        }

        .org-text {
            text-align: left;
        }

        .org-name {
            color: #c0392b;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
        }

        .org-sub {
            color: #c0392b;
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0 0 0;
        }

        .contact-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 16px;
            color: #c0392b;
            font-weight: bold;
        }

        .contact-item {
            display: flex;
            align-items: center;
        }

        .icon-box {
            width: 24px;
            height: 24px;
            border: 2px solid #c0392b;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
            font-size: 14px;
        }
        
        .icon-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #c0392b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
            font-size: 12px;
        }

    </style>
</head>
<body>

    <div class="poster">
        <!-- Top Yellow Section -->
        <div class="section-yellow">
            <div class="bullet-points">
                <div class="bullet-item">
                    <span class="pin">&#128204;</span>
                    <span>Enflasyon<br>yükseliyor</span>
                </div>
                <div class="bullet-item">
                    <span class="pin">&#128204;</span>
                    <span>TL değer<br>kaybediyor</span>
                </div>
                <div class="bullet-item">
                    <span class="pin">&#128204;</span>
                    <span>Ücretler eriyor</span>
                </div>
            </div>
            
            <div class="graphic-placeholder">
                <div class="graphic-inner">
                    <div class="pencil"></div>
                    <div class="arrow-line"></div>
                    <div class="arrow-up"></div>
                    <div class="coin">1</div>
                    <div class="stack"></div>
                </div>
            </div>
        </div>

        <!-- Middle White Section -->
        <div class="section-white-middle">
            <h2 class="slogan">Vergiden muaf,<br>insanca yaşanacak</h2>
        </div>

        <!-- Red Banner Section -->
        <div class="section-red-banner">
            <h1 class="main-title">ASGARİ ÜCRET!</h1>
        </div>

        <!-- Bottom Footer Section -->
        <div class="section-footer">
            <div class="org-info">
                <div class="logo-placeholder">
                    <div class="gear">
                        <div class="globe">EMEP</div>
                    </div>
                </div>
                <div class="org-text">
                    <p class="org-name">EMEK<br>PARTİSİ</p>
                    <p class="org-sub">Ankara İl Örgütü</p>
                </div>
            </div>

            <div class="contact-bar">
                <div class="contact-item">
                    <div class="icon-box">f</div>
                    <span>/ankaraemep</span>
                </div>
                <div class="contact-item">
                    <div class="icon-circle">&#9673;</div>
                    <span>@emepankara</span>
                </div>
                <div class="contact-item">
                    <div class="icon-circle">&#9742;</div>
                    <span>0 (312) 232 41 97</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
