<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香水浓度</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #8B5A2B; /* Fallback for wood texture */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%238B5A2B"/></svg>'); /* Placeholder for wood bg if image not available, but user wants layout reproduction. I will simulate the wood background with a color or pattern if possible, but primarily focus on the white card. */
            background: #a67c52; /* Approximate wood color */
            font-family: "Songti SC", "SimSun", "STSong", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #fff;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        h1 {
            text-align: center;
            color: #5D4037;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .table-container {
            display: grid;
            grid-template-columns: 60px repeat(5, 1fr);
            row-gap: 25px;
            column-gap: 10px;
            align-items: center;
            text-align: center;
            color: #5D4037;
            font-weight: bold;
            font-size: 16px;
        }

        .row-label {
            text-align: left;
            font-size: 14px;
            /* Simulating the cut-off look on the left if necessary, but here we just align left */
            padding-left: 0;
        }

        .bottle-row {
            grid-column: 2 / -1;
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
        }

        .bottle {
            width: 60px;
            height: 80px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CSS Drawing of the perfume bottle */
        .bottle-cap {
            width: 24px;
            height: 24px;
            background-color: #E53935;
            border-radius: 50%;
            z-index: 2;
            margin-bottom: -2px;
        }

        .bottle-neck {
            width: 8px;
            height: 6px;
            background-color: #ccc;
            z-index: 1;
        }

        .bottle-body {
            width: 50px;
            height: 50px;
            border: 2px solid #999;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            /* Trapezoid shape approximation using clip-path or borders is hard, using simple rect with rounded bottom for now, or SVG */
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
            width: 55px;
            height: 55px;
            border: 2px solid #888;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #D3D3D3;
        }

        /* Specific liquid levels */
        .lvl-1 .liquid { height: 75%; }
        .lvl-2 .liquid { height: 60%; }
        .lvl-3 .liquid { height: 45%; }
        .lvl-4 .liquid { height: 30%; }
        .lvl-5 .liquid { height: 15%; }

        .spray-lines {
            position: absolute;
            top: 25px;
            right: -10px;
            width: 20px;
            height: 20px;
        }
        
        .spray-lines::before, .spray-lines::after {
            content: '';
            position: absolute;
            background: #999;
            height: 1px;
            width: 15px;
            transform-origin: left center;
        }
        .spray-lines::before { transform: rotate(-20deg); top: 5px; }
        .spray-lines::after { transform: rotate(20deg); top: 10px; }


        .cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.4;
        }

        .tips-section {
            margin-top: 40px;
            font-size: 12px;
            color: #5D4037;
            line-height: 1.8;
            text-align: left;
            padding-left: 10px;
        }

        .tips-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
        }

        /* Adjusting grid for the specific layout where labels are on the far left */
        .grid-row {
            display: contents;
        }

        .label-col {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 15px;
        }

        .data-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            min-height: 40px;
        }

        .english-name {
            font-family: "Times New Roman", serif;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="card">
        <h1>香水浓度</h1>

        <div class="table-container">
            <!-- Row 1: Bottles (Visuals only, spanning data columns) -->
            <div class="row-label"></div> <!-- Empty corner -->
            <div class="bottle-row">
                <div class="bottle lvl-1">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    <div class="bottle-body"><div class="liquid"></div></div>
                    <div class="spray-lines"></div>
                </div>
                <div class="bottle lvl-2">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    <div class="bottle-body"><div class="liquid"></div></div>
                    <div class="spray-lines"></div>
                </div>
                <div class="bottle lvl-3">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    <div class="bottle-body"><div class="liquid"></div></div>
                    <div class="spray-lines"></div>
                </div>
                <div class="bottle lvl-4">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    <div class="bottle-body"><div class="liquid"></div></div>
                    <div class="spray-lines"></div>
                </div>
                <div class="bottle lvl-5">
                    <div class="bottle-cap"></div>
                    <div class="bottle-neck"></div>
                    <div class="bottle-body"><div class="liquid"></div></div>
                    <div class="spray-lines"></div>
                </div>
            </div>

            <!-- Row 2: Category -->
            <div class="label-col">分类</div>
            <div class="data-col">浓香精</div>
            <div class="data-col">淡香精</div>
            <div class="data-col">淡香水</div>
            <div class="data-col">古龙水</div>
            <div class="data-col">清香水</div>

            <!-- Row 3: Name -->
            <div class="label-col">名称</div>
            <div class="data-col english-name">Parfum</div>
            <div class="data-col english-name">Eau<br>De<br>Parfum</div>
            <div class="data-col english-name">Eau<br>De<br>Toilette</div>
            <div class="data-col english-name">Eau<br>De<br>Cologne</div>
            <div class="data-col english-name">Eau<br>Fraiche</div>

            <!-- Row 4: Abbreviation -->
            <div class="label-col">缩写</div>
            <div class="data-col">(P)</div>
            <div class="data-col">(EDP)</div>
            <div class="data-col">(EDT)</div>
            <div class="data-col">(EDC)</div>
            <div class="data-col">(EF)</div>

            <!-- Row 5: Concentration -->
            <div class="label-col">浓度</div>
            <div class="data-col">15-20%</div>
            <div class="data-col">10-15%</div>
            <div class="data-col">5-10%</div>
            <div class="data-col">3-5%</div>
            <div class="data-col">&lt;3%</div>

            <!-- Row 6: Longevity -->
            <div class="label-col">留香</div>
            <div class="data-col">5-8H</div>
            <div class="data-col">3-5H</div>
            <div class="data-col">3-4H</div>
            <div class="data-col">2-3H</div>
            <div class="data-col">&lt;1h</div>
        </div>

        <div class="tips-section">
            <div class="tips-title">tips:</div>
            <div>浓度高的香水不代表留香时间长,主要取决于香料种类</div>
            <div>在相同的浓度比较下，木质香的留香时间是碾压花果香的</div>
        </div>
    </div>

</body>
</html>
