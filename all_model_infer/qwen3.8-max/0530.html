<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>女學雜誌 第五百二十二號</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 40px;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho Pro", serif;
        }

        .page-container {
            width: 800px;
            height: 1150px;
            background-color: #fdfbf7;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Outer Margins / Side Text */
        .side-text-right {
            position: absolute;
            right: 20px;
            top: 150px;
            writing-mode: vertical-rl;
            color: #5a7d5a;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .side-text-right-bottom {
            position: absolute;
            right: 20px;
            bottom: 150px;
            writing-mode: vertical-rl;
            color: #5a7d5a;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .side-text-left {
            position: absolute;
            left: 20px;
            top: 200px;
            writing-mode: vertical-rl;
            color: #5a7d5a;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .page-number {
            position: absolute;
            left: 30px;
            bottom: 100px;
            writing-mode: vertical-rl;
            color: #5a7d5a;
            font-size: 14px;
        }

        /* Main Border Box */
        .main-border {
            border: 2px solid #5a7d5a;
            height: 100%;
            width: 100%;
            position: relative;
            padding: 40px 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Title Section (Green) */
        .title-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            writing-mode: vertical-rl;
            color: #5a7d5a;
            gap: 40px;
            margin-bottom: 20px;
        }

        .title-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 64px;
            font-weight: 900;
            line-height: 1.2;
        }

        .ruby-text {
            font-size: 16px;
            font-weight: 400;
            margin-left: 5px; /* Adjust for vertical layout spacing */
        }
        
        /* Specific adjustments for ruby in vertical mode */
        .char-with-ruby {
            display: inline-flex;
            flex-direction: row; /* Ruby on the right in vertical text usually, but here it looks like small kana next to it */
            align-items: center;
        }

        .wavy-line {
            width: 100%;
            height: 10px;
            background-image: repeating-linear-gradient(135deg, #5a7d5a 0, #5a7d5a 2px, transparent 2px, transparent 6px);
            /* Simulating a wavy line with CSS is hard, using an SVG or simple border trick */
            border-bottom: 2px wavy #5a7d5a;
            margin: 10px 0 30px 0;
            opacity: 0.7;
        }
        
        /* Better wavy line simulation */
        .wavy-divider {
            width: 80%;
            height: 15px;
            margin: 0 auto 30px auto;
            background: radial-gradient(circle at 10px -5px, transparent 12px, #5a7d5a 13px, #5a7d5a 15px, transparent 16px) repeat-x;
            background-size: 20px 20px;
            transform: rotate(180deg);
        }

        /* Poem Section (Red) */
        .poem-section {
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            writing-mode: vertical-rl;
            color: #c44536;
            gap: 20px;
            font-size: 22px;
            line-height: 2;
            padding-top: 20px;
        }

        .poem-title {
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
            margin-left: 20px;
            display: flex;
            align-items: center;
        }
        
        .poem-title::before, .poem-title::after {
            content: "";
            display: block;
            width: 2px;
            height: 100px;
            background-color: #c44536;
            margin: 0 10px;
        }

        .poem-body {
            display: flex;
            gap: 15px;
        }

        .poem-line {
            white-space: nowrap;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: sans-serif;
            color: #888;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
        }
        
        .google-logo {
            font-family: 'Product Sans', Arial, sans-serif;
            font-size: 16px;
            color: #555;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <!-- Right Side Text -->
        <div class="side-text-right">
            女學雜誌第五百二十二號
        </div>
        <div class="side-text-right-bottom">
            （明治卅六年十月十日發行）（每月一回十五日）
        </div>

        <!-- Left Side Text -->
        <div class="side-text-left">
            （明治三十六年六月十七日第三種郵便物認可）
        </div>
        <div class="page-number">
            （五二三）
        </div>

        <!-- Main Content Box -->
        <div class="main-border">
            
            <!-- Title Area -->
            <div class="title-section">
                <!-- Column 1 (Rightmost in image) -->
                <div class="title-col">
                    <span>市</span>
                    <span>川</span>
                    <span>團</span>
                </div>
                
                <!-- Column 2 -->
                <div class="title-col">
                    <span>十</span>
                    <span>郎</span>
                    <span>の</span>
                </div>

                <!-- Column 3 -->
                <div class="title-col">
                    <div class="char-with-ruby">
                        <span>石</span>
                        <span class="ruby-text">しやく</span>
                    </div>
                    <div class="char-with-ruby">
                        <span>橋</span>
                        <span class="ruby-text">けう</span>
                    </div>
                </div>

                <!-- Column 4 (Leftmost in image) -->
                <div class="title-col">
                    <div class="char-with-ruby">
                        <span>（獅</span>
                        <span class="ruby-text">ライ</span>
                    </div>
                    <div class="char-with-ruby">
                        <span>子）</span>
                        <span class="ruby-text">オン</span>
                    </div>
                </div>
            </div>

            <!-- Divider -->
            <div class="wavy-divider"></div>

            <!-- Poem Area -->
            <div class="poem-section">
                <!-- Right Title -->
                <div class="poem-title">ライオン齒磨</div>

                <!-- Poem Body -->
                <div class="poem-body">
                    <div class="poem-line">花にたはぶれ、杖に伏しまろび、</div>
                    <div class="poem-line">げにも上なき獅子王のいきほ</div>
                    <div class="poem-line">ひ、なびかぬ草木もなき時なれ</div>
                    <div class="poem-line">や。萬歲千秋と舞ひをさめ、萬</div>
                    <div class="poem-line">歲千秋と舞ひをさめ 獅子の座</div>
                    <div class="poem-line">にこそなほりけれ。</div>
                </div>

                <!-- Left Title -->
                <div class="poem-title">ライオン齒磨</div>
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <div>Digitized by <span class="google-logo">Google</span></div>
            <div>Original from<br>CORNELL UNIVERSITY</div>
        </div>
    </div>

</body>
</html>
