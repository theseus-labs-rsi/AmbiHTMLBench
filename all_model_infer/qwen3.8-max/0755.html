<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tang Poetry Collection</title>
    <style>
        body {
            background-color: #eebb77; /* Approximate orange border color */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "KaiTi", "STKaiti", "BiauKai", serif; /* Traditional Chinese serif fonts */
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 12px; /* The orange grid lines */
            background-color: #eebb77;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3 / 4;
        }

        .card {
            background-color: #fff;
            /* Simulating the grid paper background */
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 2px;
            color: #000;
        }

        .author {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .poem-body {
            font-size: 24px;
            line-height: 1.6;
            text-align: center;
            color: #000;
            letter-spacing: 1px;
        }

        /* Adjustments for specific layout nuances */
        .card:nth-child(1) .title, .card:nth-child(2) .title, 
        .card:nth-child(3) .title, .card:nth-child(4) .title,
        .card:nth-child(5) .title, .card:nth-child(6) .title {
            font-family: "SimHei", "Heiti SC", sans-serif; /* Titles look slightly bolder/different */
        }
        
        /* Specific tweak for the grid background to look more like the image (faint blue/grey lines) */
        .card {
             background-image: 
                linear-gradient(#dcebf5 1px, transparent 1px),
                linear-gradient(90deg, #dcebf5 1px, transparent 1px);
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Row 1, Col 1 -->
    <div class="card">
        <div class="title">《登鹳雀楼》</div>
        <div class="author">（唐-王之涣）</div>
        <div class="poem-body">
            白日依山尽，<br>
            黄河入海流。<br>
            欲穷千里目，<br>
            更上一层楼。
        </div>
    </div>

    <!-- Row 1, Col 2 -->
    <div class="card">
        <div class="title">《静夜思》</div>
        <div class="author">（唐-李白）</div>
        <div class="poem-body">
            床前明月光，<br>
            疑是地上霜。<br>
            举头望明月，<br>
            低头思故乡。
        </div>
    </div>

    <!-- Row 2, Col 1 -->
    <div class="card">
        <div class="title">《古朗月行》</div>
        <div class="author">（唐-李白）</div>
        <div class="poem-body">
            小时不识月，<br>
            呼作白玉盘。<br>
            又疑瑶台镜，<br>
            飞在青云端。
        </div>
    </div>

    <!-- Row 2, Col 2 -->
    <div class="card">
        <div class="title">《寻隐者不遇》</div>
        <div class="author">（唐-贾岛）</div>
        <div class="poem-body">
            松下问童子，<br>
            言师采药去。<br>
            只在此山中，<br>
            云深不知处。
        </div>
    </div>

    <!-- Row 3, Col 1 -->
    <div class="card">
        <div class="title">《咏鹅》</div>
        <div class="author">（唐-骆宾王）</div>
        <div class="poem-body">
            鹅鹅鹅，<br>
            曲项向天歌。<br>
            白毛浮绿水，<br>
            红掌拨清波。
        </div>
    </div>

    <!-- Row 3, Col 2 -->
    <div class="card">
        <div class="title">《草》</div>
        <div class="author">（唐-白居易）</div>
        <div class="poem-body">
            离离原上草，<br>
            一岁一枯荣。<br>
            野火烧不尽，<br>
            春风吹又生。
        </div>
    </div>
</div>

</body>
</html>
