<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 - 金句摘抄</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: "SimSun", "Songti SC", serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #dcbfa6; /* Main beige background */
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header {
            background-color: #f2e6d9; /* Lighter top background */
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", serif; /* Calligraphy style approximation */
            font-size: 48px;
            color: #d32f2f;
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
            transform: skewX(-5deg);
        }

        .logo-sub {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #d32f2f;
            letter-spacing: 4px;
            margin-top: 5px;
            margin-left: 5px;
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .tag-line {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        .theme-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            border-bottom: 3px solid #333;
            padding-bottom: 5px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        /* Content Section */
        .content {
            padding: 30px 40px;
        }

        .quote-block {
            margin-bottom: 40px;
        }

        .main-quote {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #2c2c2c;
            line-height: 1.4;
            margin-bottom: 25px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        .example-label {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .example-text {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            text-align: justify;
        }

        /* Specific adjustments for the second quote spacing */
        .quote-block:last-child {
            margin-bottom: 20px;
        }
        
        .quote-block:last-child .main-quote {
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-text">人民日報</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="header-right">
            <div class="tag-line">金句 | 摘抄</div>
            <div class="theme-title">坚持奋斗主题</div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        
        <!-- First Quote Block -->
        <div class="quote-block">
            <div class="main-quote">
                夜色难免黑凉<br>
                前行必有曙光
            </div>
            <div class="example-label">举例:</div>
            <div class="example-text">
                夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!
            </div>
        </div>

        <!-- Second Quote Block -->
        <div class="quote-block">
            <div class="main-quote">
                道固远，笃行可至<br>
                事虽巨，坚为必成
            </div>
            <div class="example-label">举例:</div>
            <div class="example-text">
                道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
            </div>
        </div>

    </div>
</div>

</body>
</html>
