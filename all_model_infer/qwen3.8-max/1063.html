<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奔驰 大G - 普通人赚一辆豪车需要多久</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            color: #000000;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            background-color: #ffffff;
            z-index: 1;
        }

        /* Watermark styling */
        .watermark {
            position: absolute;
            bottom: 40px;
            right: -20px;
            width: 350px;
            height: 350px;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        .watermark svg {
            width: 100%;
            height: 100%;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
        }

        /* Image Placeholder */
        .car-image-container {
            text-align: center;
            margin-bottom: 10px;
        }

        .placeholder {
            display: inline-block;
            background-color: #f0f0f0;
            border: 1px dashed #ccc;
            color: #666;
            font-size: 14px;
            line-height: 200px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            height: 200px;
            margin: 0 auto;
        }

        /* Typography */
        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            margin: 10px 0 5px 0;
            letter-spacing: 2px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 25px 0;
            letter-spacing: 1px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 16px;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #e0e0e0;
            font-weight: bold;
            color: #333;
        }

        td {
            font-weight: bold;
            color: #000;
        }

        /* Column widths approximation */
        col:nth-child(1) { width: 30%; }
        col:nth-child(2) { width: 35%; }
        col:nth-child(3) { width: 35%; }

        /* Footer Note */
        .footer-note {
            text-align: right;
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            padding-right: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Watermark SVG (Mercedes Logo Approximation) -->
    <div class="watermark">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" fill="none" stroke="#000" stroke-width="2"/>
            <circle cx="50" cy="50" r="44" fill="none" stroke="#000" stroke-width="1"/>
            <path d="M50 6 L50 50 L12 72 M50 50 L88 72" stroke="#000" stroke-width="3" fill="none"/>
        </svg>
    </div>

    <div class="content-wrapper">
        <!-- Car Image -->
        <div class="car-image-container">
            <div class="placeholder">
                [Image: Black Mercedes-Benz G-Class SUV centered]<br>
                <span style="font-size: 10px; vertical-align: top; display: block; margin-top: -180px; margin-left: -150px; background: white; padding: 2px; border-radius: 4px;">易车App</span>
            </div>
        </div>

        <!-- Headings -->
        <h1>奔驰 大G</h1>
        <h2>普通人 赚一辆豪车 需要多久?</h2>

        <!-- Data Table -->
        <table>
            <colgroup>
                <col>
                <col>
                <col>
            </colgroup>
            <thead>
                <tr>
                    <th>职业</th>
                    <th>月薪</th>
                    <th>时间</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>外卖员</td>
                    <td>5000元/月</td>
                    <td>大约45年</td>
                </tr>
                <tr>
                    <td>建筑工人</td>
                    <td>6000元/月</td>
                    <td>大约38年</td>
                </tr>
                <tr>
                    <td>出租车司机</td>
                    <td>6500元/月</td>
                    <td>大约35年</td>
                </tr>
                <tr>
                    <td>教师</td>
                    <td>8000元/月</td>
                    <td>大约28年</td>
                </tr>
                <tr>
                    <td>医生</td>
                    <td>10000元/月</td>
                    <td>大约23年</td>
                </tr>
                <tr>
                    <td>互联网职工</td>
                    <td>15000元/月</td>
                    <td>大约15年</td>
                </tr>
                <tr>
                    <td>银行职员</td>
                    <td>20000元/月</td>
                    <td>大约11年</td>
                </tr>
                <tr>
                    <td>销售</td>
                    <td>25000元/月</td>
                    <td>大约9年</td>
                </tr>
                <tr>
                    <td>私企老板</td>
                    <td>50000元/月</td>
                    <td>大约5年</td>
                </tr>
            </tbody>
        </table>

        <!-- Footer Note -->
        <div class="footer-note">*月薪按30%作为日常基本开销</div>
    </div>
</div>

</body>
</html>
