<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sustainability Summit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --dark-green: #006b27;
            --light-green: #5cb836;
            --cream: #f4ebd9;
            --text-dark: #1a1a1a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #333; /* Background for the viewer */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poster-container {
            width: 1000px;
            height: 1414px; /* Approx A4 ratio */
            background-color: var(--dark-green);
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- Left Column (Cream Background Shapes) --- */
        .left-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .cream-top-shape {
            background-color: var(--cream);
            width: 100%;
            height: 80%;
            border-bottom-left-radius: 50% 20%;
            border-bottom-right-radius: 50% 20%;
            position: relative;
            padding: 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .cream-bottom-shape {
            background-color: var(--cream);
            width: 100%;
            height: 25%;
            position: absolute;
            bottom: 0;
            left: 0;
            border-top-left-radius: 50% 30%;
            border-top-right-radius: 50% 30%;
            padding: 40px 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- Right Column --- */
        .right-col {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        .logo-area {
            position: absolute;
            top: 40px;
            right: 40px;
            color: white;
            text-align: right;
            font-weight: 700;
            font-size: 24px;
            line-height: 1.1;
            z-index: 10;
        }
        
        .logo-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 4px;
            margin-left: 5px;
            vertical-align: middle;
            position: relative;
        }
        .logo-icon::after {
            content: "®";
            font-size: 10px;
            position: absolute;
            top: -5px;
            right: -10px;
        }

        .tree-placeholder {
            width: 100%;
            height: 65%;
            position: relative;
            /* Simulating the tree image placement */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .tree-img {
            width: 120%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            /* Using a gradient/shape to simulate the tree if image fails, 
               but primarily relying on the placeholder structure requested */
            background: radial-gradient(circle at 50% 30%, #2e5c1e 0%, transparent 60%);
        }

        .bottom-right-section {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 40%;
            background-color: var(--light-green);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dark-green-circle {
            width: 480px;
            height: 480px;
            background-color: var(--dark-green);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 60px;
            box-sizing: border-box;
            color: white;
            position: relative;
            top: -20px; /* Slight overlap adjustment */
        }

        /* --- Typography & Content Styling --- */
        
        .main-title-container {
            margin-top: 40px;
            margin-bottom: 40px;
            height: 400px;
            display: flex;
            align-items: center;
        }

        .vertical-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 64px;
            font-weight: 800;
            color: var(--dark-green);
            line-height: 1.1;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .divider {
            width: 280px;
            height: 2px;
            background-color: var(--dark-green);
            margin: 20px 0 40px 0;
            opacity: 0.5;
        }

        .section-label {
            color: var(--light-green);
            font-weight: 700;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .price-block {
            margin-bottom: 25px;
        }

        .price-desc {
            color: var(--text-dark);
            font-size: 20px;
            margin-bottom: 5px;
        }

        .price-val {
            color: var(--dark-green);
            font-size: 36px;
            font-weight: 800;
        }

        .visit-text {
            color: var(--text-dark);
            font-size: 18px;
            line-height: 1.5;
            max-width: 350px;
        }

        .info-block {
            margin-bottom: 40px;
        }

        .info-text {
            font-size: 20px;
            line-height: 1.5;
            color: white;
        }

        /* Specific positioning for the tree image simulation */
        .tree-visual {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23006b27"/><circle cx="50" cy="40" r="35" fill="%232d5a27"/><rect x="48" y="40" width="4" height="40" fill="%235c4033"/></svg>'); 
            /* Fallback pattern, but we will use a div placeholder as per instructions for non-text elements */
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="poster-container">
        
        <!-- Left Column -->
        <div class="left-col">
            <div class="cream-top-shape">
                
                <div class="main-title-container">
                    <div class="vertical-title">
                        Global<br>Sustainability<br>Summit
                    </div>
                </div>

                <div class="divider"></div>

                <div class="registration-section">
                    <div class="section-label">Registration</div>
                    
                    <div class="price-block">
                        <div class="price-desc">General Admission</div>
                        <div class="price-val">$350</div>
                    </div>

                    <div class="price-block">
                        <div class="price-desc">Students &amp; Nonprofits</div>
                        <div class="price-val">$200</div>
                    </div>
                </div>

            </div>

            <div class="cream-bottom-shape">
                <div class="section-label">Visit</div>
                <div class="visit-text">
                    www.yourwebsite.com for more<br>
                    details and to register today!
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-col">
            
            <div class="logo-area">
                Your <span class="logo-icon"></span><br>
                LOGO
            </div>

            <div class="tree-placeholder">
                <!-- Placeholder for the tree image -->
                <div class="placeholder" style="width: 100%; height: 100%; background: transparent; display: flex; justify-content: center; align-items: center;">
                    <!-- In a real scenario, an <img> tag would go here. 
                         Using a visual representation of the tree structure via CSS/SVG placeholder logic -->
                    <div style="width: 80%; height: 90%; background: radial-gradient(ellipse at center, #3a5f28 0%, #1e3d15 60%, transparent 70%); border-radius: 50% 50% 0 0; position: relative;">
                        <div style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 40%; background: #5d4037; border-radius: 5px;"></div>
                        <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.5); font-size: 12px; text-align: center;">[Image: Large Green Tree]</span>
                    </div>
                </div>
            </div>

            <div class="bottom-right-section">
                <div class="dark-green-circle">
                    
                    <div class="info-block">
                        <div class="section-label">Date</div>
                        <div class="info-text">
                            27 January 2026<br>
                            10:00 PM
                        </div>
                    </div>

                    <div class="info-block">
                        <div class="section-label">Location</div>
                        <div class="info-text">
                            Grand Hall, Convention<br>
                            Center, Chicago, IL
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
