<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #333;
            font-size: 16px;
            line-height: 1.8;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        /* Main vertical line for the first level */
        .main-list {
            list-style: none;
            padding-left: 20px;
            border-left: 2px solid #e0e0e0;
            margin-left: 10px;
        }

        .main-item {
            position: relative;
            margin-bottom: 15px;
        }

        /* Red text for the first item */
        .highlight-red {
            color: #c0504d;
            font-weight: bold;
        }

        /* Bullet points */
        .bullet {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #555;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .bullet-red {
            background-color: #c0504d;
        }

        /* Nested lists */
        .sub-list {
            list-style: none;
            padding-left: 30px;
            border-left: 2px solid #e0e0e0;
            margin-top: 10px;
            margin-left: 10px;
        }

        .sub-item {
            position: relative;
            margin-bottom: 8px;
        }

        .sub-sub-list {
            list-style: none;
            padding-left: 30px;
            border-left: 2px solid #e0e0e0;
            margin-top: 10px;
            margin-left: 10px;
        }

        /* Dropdown arrows on the right */
        .arrow-container {
            position: absolute;
            right: -40px;
            top: 0;
            width: 30px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            border-left: 1px solid #eee;
            cursor: pointer;
        }
        
        /* Simulating the right sidebar structure seen in the image */
        .row-wrapper {
            display: flex;
            align-items: flex-start;
            position: relative;
        }

        .content-area {
            flex-grow: 1;
        }

        .sidebar-arrow {
            width: 30px;
            min-height: 30px;
            background-color: #fcfcfc;
            border-left: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
            margin-left: 10px;
            align-self: stretch;
        }
        
        /* Specific styling to match the visual indentation and lines */
        .level-1-container {
            display: flex;
        }
        
        .vertical-line {
            width: 2px;
            background-color: #dcdcdc;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .text-content {
            flex-grow: 1;
        }

        .item-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .bullet-point {
            width: 6px;
            height: 6px;
            background-color: #666;
            border-radius: 50%;
            margin-top: 10px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .bullet-point.red {
            background-color: #c0504d;
            width: 8px;
            height: 8px;
            margin-top: 9px;
        }

        .arrow-icon {
            color: #aaa;
            font-size: 10px;
            margin-left: auto;
            padding-left: 20px;
        }

        /* Structure for the whole block to handle the right-side arrows correctly */
        .outline-block {
            display: table;
            width: 100%;
        }
        
        .outline-row {
            display: table-row;
        }
        
        .outline-cell-content {
            display: table-cell;
            padding: 4px 0;
            vertical-align: top;
        }
        
        .outline-cell-arrow {
            display: table-cell;
            width: 30px;
            vertical-align: top;
            text-align: center;
            color: #aaa;
            font-size: 10px;
            border-left: 1px solid #f0f0f0;
            background: linear-gradient(to right, #fff, #fafafa);
        }

        /* Refined Layout using Flexbox for better control */
        .flex-row {
            display: flex;
            width: 100%;
        }
        
        .flex-content {
            flex: 1;
            padding-right: 10px;
        }
        
        .flex-arrow {
            width: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 10px;
            border-left: 1px solid #eee;
            background-color: #fdfdfd;
        }

        .indent-1 { padding-left: 0; }
        .indent-2 { padding-left: 25px; }
        .indent-3 { padding-left: 50px; }

        .v-line-container {
            display: flex;
        }
        
        .v-line {
            width: 2px;
            background-color: #ddd;
            margin-right: 15px;
        }
        
        .v-spacer {
            width: 2px;
            margin-right: 15px;
        }

    </style>
</head>
<body>

<div class="container">
    
    <!-- Level 1 Item -->
    <div class="flex-row">
        <div class="flex-content">
            <div class="v-line-container">
                <div class="v-line" style="height: 100%;"></div>
                <div style="flex: 1;">
                    <div class="item-row">
                        <div class="bullet-point red"></div>
                        <div class="highlight-red">第三阶段 认识自我，找到自我</div>
                    </div>
                    
                    <!-- Level 2 Container -->
                    <div class="v-line-container">
                        <div class="v-spacer"></div>
                        <div class="v-line" style="height: 100%;"></div>
                        <div style="flex: 1;">
                            
                            <!-- Item 2.1 -->
                            <div class="item-row">
                                <div class="bullet-point"></div>
                                <div>不同国家的妆容模仿</div>
                            </div>
                            
                            <!-- Level 3 Container for 2.1 -->
                            <div class="v-line-container">
                                <div class="v-spacer"></div>
                                <div class="v-spacer"></div>
                                <div class="v-line" style="height: 100%;"></div>
                                <div style="flex: 1;">
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>不同国家妆容特点分析</div>
                                    </div>
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>逐个部位模仿</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Item 2.2 -->
                            <div class="item-row" style="margin-top: 10px;">
                                <div class="bullet-point"></div>
                                <div>明星出圈妆容模仿</div>
                            </div>

                            <!-- Level 3 Container for 2.2 -->
                            <div class="v-line-container">
                                <div class="v-spacer"></div>
                                <div class="v-spacer"></div>
                                <div class="v-line" style="height: 100%;"></div>
                                <div style="flex: 1;">
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>鞠婧祎妆容</div>
                                    </div>
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>虞书欣妆容</div>
                                    </div>
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>宋慧乔妆容</div>
                                    </div>
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>女团妆容</div>
                                    </div>
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>日本杂志妆容</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Item 2.3 -->
                            <div class="item-row" style="margin-top: 10px;">
                                <div class="bullet-point"></div>
                                <div>找到适合自己的风格和妆容</div>
                            </div>

                            <!-- Level 3 Container for 2.3 -->
                            <div class="v-line-container">
                                <div class="v-spacer"></div>
                                <div class="v-spacer"></div>
                                <div class="v-line" style="height: 100%;"></div>
                                <div style="flex: 1;">
                                    <div class="item-row">
                                        <div class="bullet-point"></div>
                                        <div>根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Side Arrows Column -->
        <div style="display: flex; flex-direction: column; width: 30px; border-left: 1px solid #f0f0f0; background: #fcfcfc;">
            <div style="height: 38px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px;">▼</div>
            <div style="height: 76px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px;">▼</div>
            <div style="height: 190px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px;">▼</div>
            <div style="height: 76px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px;">▼</div>
        </div>
    </div>

</div>

</body>
</html>
