<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建议、提案格式</title>
    <style>
        body {
            background-color: #f4f1ea;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .page-container {
            width: 100%;
            max-width: 600px;
            background-color: #f4f1ea;
            position: relative;
            padding-right: 30px; /* Space for the binder edge effect */
            box-sizing: border-box;
            line-height: 1.8;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: bold;
        }
        
        /* Simulating the binder/scroll edge on the right */
        .binder-edge {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 25px;
            background: linear-gradient(to right, #e0dcd3, #cfcac0);
            border-left: 1px solid #d0ccc0;
            z-index: 10;
        }
        .binder-tab {
            position: absolute;
            right: 0;
            width: 25px;
            height: 40px;
            background-color: #dcd8cf;
            border-radius: 5px 0 0 5px;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #c0392b;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .section-label {
            color: #d35400;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .template-title {
            text-align: center;
            margin-bottom: 5px;
        }

        .template-subtitle {
            text-align: center;
            margin-bottom: 15px;
        }

        .underline-text {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .blue-text {
            color: #2980b9;
        }

        .indent-1 {
            padding-left: 2em;
        }

        .indent-2 {
            padding-left: 4em;
        }

        .signature-block {
            text-align: right;
            margin-top: 30px;
            padding-right: 20px;
        }

        .signature-line {
            display: inline-block;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 2px;
            margin-bottom: 10px;
        }
        
        .date-line {
            display: inline-block;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 2px;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Decorative binder tabs on the right -->
    <div class="binder-edge"></div>
    <div class="binder-tab" style="top: 10%;"></div>
    <div class="binder-tab" style="top: 25%;"></div>
    <div class="binder-tab" style="top: 40%;"></div>
    <div class="binder-tab" style="top: 55%;"></div>
    <div class="binder-tab" style="top: 70%;"></div>
    <div class="binder-tab" style="top: 85%;"></div>

    <h2>二、建议、提案</h2>

    <p>建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。</p>

    <div class="section-label">格式：</div>

    <div class="template-title">关于 xxxxx 的建议</div>
    <div class="template-subtitle">（“发文机关+关于+内容+文种”）</div>

    <p class="underline-text">各级领导(称谓要根据具体题目要求分析得出)：</p>

    <p class="indent-1">
        当前，…等问题比较突出(或做了什么工作)，为了做好……工作，提出以下建议：<span class="blue-text">(开头为背景分析，指出存在的主要问题和目的意义)</span>
    </p>

    <p class="indent-2 underline-text">一、……</p>
    <p class="indent-2 underline-text">二、……</p>
    <p class="indent-2">
        <span class="underline-text">三、……</span><span class="blue-text">(主体内容还原为对策题,提出解决问题的措施)</span>
    </p>

    <div class="signature-block">
        <div class="signature-line">发文机关</div><br>
        <div class="date-line">xx 年 xx 月 xx 日</div>
    </div>

</div>

</body>
</html>
