<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钩针工具选择指南</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #5d7a6e;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th {
            background-color: #5d7a6e;
            color: white;
            padding: 12px 5px;
            font-weight: normal;
            font-size: 16px;
            border: 2px solid #fff;
        }
        td {
            padding: 15px 10px;
            vertical-align: middle;
            text-align: center;
            border: 2px solid #fce4e4; /* Light pinkish grid lines */
            background-color: #fffaf9; /* Very light pink/cream background for cells */
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }
        /* Column widths */
        col.col-tool { width: 15%; }
        col.col-usage { width: 45%; }
        col.col-advice { width: 25%; }
        col.col-img { width: 15%; }

        .tool-name {
            font-weight: bold;
            font-size: 16px;
        }
        .required {
            color: #d9534f;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }
        .placeholder {
            width: 60px;
            height: 40px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .placeholder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        /* Specific styling for the image placeholders to mimic the content */
        .img-hooks { background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40"><rect width="60" height="40" fill="none"/><line x1="5" y1="35" x2="55" y2="5" stroke="blue" stroke-width="2"/><line x1="5" y1="30" x2="55" y2="0" stroke="purple" stroke-width="2"/><line x1="5" y1="25" x2="55" y2="-5" stroke="orange" stroke-width="2"/></svg>') no-repeat center; }
        .img-yarn { background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40"><ellipse cx="30" cy="30" rx="25" ry="10" fill="%238B4513"/><circle cx="20" cy="25" r="5" fill="pink"/><circle cx="30" cy="22" r="5" fill="yellow"/><circle cx="40" cy="25" r="5" fill="green"/></svg>') no-repeat center; }
        .img-scissors { background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40"><path d="M20,10 L40,30 M40,10 L20,30" stroke="black" stroke-width="2"/><circle cx="18" cy="8" r="3" fill="none" stroke="black"/><circle cx="42" cy="8" r="3" fill="none" stroke="black"/></svg>') no-repeat center; }
        .img-needles { background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40"><line x1="10" y1="35" x2="50" y2="5" stroke="red" stroke-width="2"/><line x1="15" y1="35" x2="55" y2="5" stroke="green" stroke-width="2"/><line x1="20" y1="35" x2="60" y2="5" stroke="blue" stroke-width="2"/></svg>') no-repeat center; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>钩针工具选择指南</h1>
        <p>——only手作集——</p>
    </div>

    <table>
        <colgroup>
            <col class="col-tool">
            <col class="col-usage">
            <col class="col-advice">
            <col class="col-img">
        </colgroup>
        <thead>
            <tr>
                <th>工具</th>
                <th>用途</th>
                <th>初学者建议</th>
                <th>实物图</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <span class="tool-name">钩针</span>
                    <span class="required">(必备)</span>
                </td>
                <td style="text-align: left; padding-left: 15px;">
                    钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》
                </td>
                <td>3mm左右的钩针最实用</td>
                <td>
                    <div class="placeholder img-hooks" title="钩针图片"></div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">毛线</span>
                    <span class="required">(必备)</span>
                </td>
                <td style="text-align: left; padding-left: 15px;">
                    毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》
                </td>
                <td>中粗的宝宝棉/牛奶棉</td>
                <td>
                    <div class="placeholder img-yarn" title="毛线图片"></div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">剪刀</span>
                    <span class="required">(必备)</span>
                </td>
                <td>剪断编织过程中的编织线</td>
                <td>必备</td>
                <td>
                    <div class="placeholder img-scissors" title="剪刀图片"></div>
                </td>
            </tr>
            <tr>
                <td>
                    <span class="tool-name">缝合针</span>
                </td>
                <td>缝合、修补和连接编织面料</td>
                <td>非必须</td>
                <td>
                    <div class="placeholder img-needles" title="缝合针图片"></div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
