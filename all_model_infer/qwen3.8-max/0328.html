<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用合理的标点符号</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 40px;
            background-color: #f0f0f0;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 600px;
            background-color: #ffffff;
            padding: 50px 60px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .highlight-title {
            background-color: #fff200;
            color: #222;
            font-size: 32px;
            font-weight: 900;
            line-height: 1.4;
            padding: 0 10px;
            display: inline-block;
            width: fit-content;
            margin-bottom: 5px;
        }

        .number-circle {
            width: 70px;
            height: 70px;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-top: 15px;
            margin-bottom: 40px;
        }

        /* Content Boxes */
        .content-box {
            padding: 30px;
            border-radius: 4px;
            margin-bottom: 25px;
            position: relative;
        }

        .box-pink {
            background-color: #fff0ed;
        }

        .box-blue {
            background-color: #eef4ff;
        }

        .section-header {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }

        .icon-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #ffbca8;
            border-radius: 50%;
            margin-right: 15px;
        }

        .icon-cross {
            color: #a0c4ff;
            font-size: 24px;
            margin-right: 15px;
            font-weight: bold;
        }

        /* Data Rows */
        .data-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
            color: #333;
            padding-left: 60px; /* Indent to match visual */
        }

        .label-text {
            font-weight: bold;
            margin-right: 10px;
        }

        .separator-line {
            color: #ccc;
            margin-right: 10px;
        }

        .tag {
            background-color: #ff7b7b;
            color: white;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 13px;
            margin-right: 10px;
            font-weight: normal;
        }

        .colon-sep {
            margin-right: 5px;
        }

        /* Mascot Placeholders */
        .mascot {
            position: absolute;
            bottom: -10px;
            right: 20px;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .mascot img {
            max-width: 100%;
            max-height: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .footer-left {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-right {
            width: 50px;
            height: 50px;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            color: #666;
            text-align: center;
        }
        
        .footer-logo-icon {
            font-size: 16px;
            margin-bottom: 2px;
        }

    </style>
</head>
<body>

<div class="page-container">
    
    <!-- Header -->
    <div class="header">
        <div class="title-group">
            <div class="highlight-title">使用合理的</div>
            <div class="highlight-title">标点符号</div>
        </div>
        <div class="number-circle">01</div>
    </div>

    <div class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</div>

    <!-- Pink Box Section -->
    <div class="content-box box-pink">
        <div class="section-header">
            <div class="icon-circle"></div>
            使用直线或外框
        </div>

        <!-- Style 1: Line Separator -->
        <div class="data-row">
            <span class="label-text">地点</span>
            <span class="separator-line">|</span>
            <span>武汉国际会展中心</span>
        </div>
        <div class="data-row">
            <span class="label-text">时间</span>
            <span class="separator-line">|</span>
            <span>2018 年 8 月 20 日</span>
        </div>

        <br>

        <!-- Style 2: Tag/Box -->
        <div class="data-row">
            <span class="tag">地点</span>
            <span>武汉国际会展中心</span>
        </div>
        <div class="data-row">
            <span class="tag">时间</span>
            <span>2018 年 8 月 20 日</span>
        </div>

        <!-- Mascot Placeholder -->
        <div class="mascot">
            <div style="font-size: 50px;">🐥</div> <!-- Emoji placeholder for the chicken character -->
        </div>
    </div>

    <!-- Blue Box Section -->
    <div class="content-box box-blue">
        <div class="section-header">
            <span class="icon-cross">✕</span>
            使用冒号
        </div>

        <div class="data-row">
            <span class="label-text">地点<span class="colon-sep">：</span></span>
            <span>武汉国际会展中心</span>
        </div>
        <div class="data-row">
            <span class="label-text">时间<span class="colon-sep">：</span></span>
            <span>2018 年 8 月 20 日</span>
        </div>

        <!-- Mascot Placeholder -->
        <div class="mascot">
             <div style="font-size: 50px;">😤</div> <!-- Emoji placeholder for the angry chicken character -->
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-left">
            ADVERTISING CREATIVITY<br>
            2023.05
        </div>
        <div class="footer-right">
            <div class="footer-logo-icon">🐱</div>
            CREATIVE DESIGN<br>大猫<br>设计馆
        </div>
    </div>

</div>

</body>
</html>
