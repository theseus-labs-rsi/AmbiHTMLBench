<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 540px; /* Approximate width based on aspect ratio */
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Top Section */
        .top-section {
            background-color: #e6cd9e; /* Beige/Tan color */
            padding: 40px 30px 20px 30px;
            position: relative;
            min-height: 280px;
        }
        
        .top-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .top-title {
            font-size: 28px;
            font-weight: bold;
            color: #2c2c54; /* Dark blue/purple */
            margin-right: 20px;
        }
        
        .icon-circle {
            width: 50px;
            height: 50px;
            background-color: #cc0000;
            border-radius: 50%;
            position: relative;
            display: inline-block;
        }
        .icon-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background-color: #e6cd9e; /* Match background to create ring effect */
            border-radius: 50%;
        }

        .top-text {
            font-size: 20px;
            font-weight: bold;
            color: #2c2c54;
            line-height: 1.6;
            max-width: 60%;
        }

        .meme-image-container {
            position: absolute;
            right: 0;
            top: 60px;
            width: 200px;
            text-align: center;
        }

        .placeholder-img {
            width: 180px;
            height: 200px;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
            border: 1px solid #999;
            /* Simulating the cutout look roughly */
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
        }

        .meme-caption {
            color: white;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-top: -30px;
            position: relative;
            z-index: 10;
            text-align: right;
            padding-right: 10px;
        }

        /* Bottom Section */
        .bottom-section {
            background-color: #3b3b58; /* Dark purple/blue */
            padding: 40px 30px;
            color: #e6cd9e; /* Text color matches top bg */
        }

        .bottom-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .bottom-title {
            font-size: 28px;
            font-weight: bold;
            margin-right: 15px;
        }

        .icon-check {
            color: #7cb342; /* Green */
            font-size: 40px;
            font-weight: bold;
            /* Simple CSS checkmark approximation or just use character */
        }
        
        .check-svg {
            width: 50px;
            height: 40px;
            fill: #7cb342;
        }

        .bottom-text {
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
            font-weight: bold;
        }

        .footer-citation {
            text-align: right;
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        /* Watermark simulation */
        .watermark {
            position: absolute;
            color: rgba(255, 255, 255, 0.2);
            font-size: 24px;
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 5;
        }
        .wm-1 { top: 150px; left: 150px; }
        .wm-2 { top: 450px; left: 100px; }

    </style>
</head>
<body>

<div class="container">
    <!-- Top Section -->
    <div class="top-section">
        <div class="watermark wm-1">看报的美女纸</div>
        
        <div class="top-header">
            <span class="top-title">我写的：</span>
            <div class="icon-circle"></div>
        </div>
        
        <div class="top-text">
            我们民族的追梦史充满<br>艰辛。
        </div>

        <div class="meme-image-container">
            <!-- Placeholder for the crying boy image -->
            <div class="placeholder-img" style="background: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'180\' height=\'200\'><rect width=\'180\' height=\'200\' fill=\'%23888\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-size=\'12\'>[Image: Crying Boy]</text></svg>') no-repeat center; background-size: cover;">
            </div>
            <div class="meme-caption">学习使我妈快乐</div>
        </div>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
        <div class="watermark wm-2">看报的美女纸</div>

        <div class="bottom-header">
            <span class="bottom-title">人民日报写的：</span>
            <!-- Green Checkmark SVG -->
            <svg class="check-svg" viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <div class="bottom-text">
            我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
        </div>

        <div class="footer-citation">
            ——2013.4.1《筑就民族复兴的“中国梦”》
        </div>
    </div>
</div>

</body>
</html>
