<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA Formula</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #5a6b5d, #3e4f42);
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-banner {
            background: linear-gradient(to bottom, #7ec8d6, #3a9eb5);
            color: #ffff00;
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            padding: 12px 30px;
            width: 90%;
            max-width: 900px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .content-card {
            background-color: #ffffff;
            width: 75%;
            max-width: 750px;
            padding: 60px 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .formula-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
            gap: 40px;
        }

        .pta-label {
            color: #1a36b8;
            font-size: 28px;
            font-weight: bold;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
        }

        .numerator {
            color: #1a36b8;
            font-size: 28px;
            font-weight: bold;
            padding: 0 10px 5px 10px;
        }

        .fraction-line {
            width: 100%;
            height: 3px;
            background-color: #1a36b8;
        }

        .denominator {
            color: #1a36b8;
            font-size: 28px;
            font-weight: bold;
            padding: 5px 10px 0 10px;
        }

        .threshold {
            color: #cc0000;
            font-size: 24px;
            font-weight: bold;
        }

        .definitions {
            margin-left: 20px;
        }

        .def-item {
            color: #1a36b8;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        PTA SHOULD BE LESS THAN 40 %
    </div>

    <div class="content-card">
        <div class="formula-row">
            <span class="pta-label">PTA =</span>
            <div class="fraction">
                <span class="numerator">(FT + AD)</span>
                <div class="fraction-line"></div>
                <span class="denominator">CCT</span>
            </div>
            <span class="threshold">&lt; 40%</span>
        </div>

        <div class="definitions">
            <div class="def-item">FT = flap thickness</div>
            <div class="def-item">AD = ablation depth</div>
            <div class="def-item">CCT = central corneal thickness</div>
        </div>
    </div>

</body>
</html>
