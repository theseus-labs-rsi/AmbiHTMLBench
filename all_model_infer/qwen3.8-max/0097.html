<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2017年 12月第一套 Text 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #dcbfa6; /* Approximate wood/desk color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }

        .screen-container {
            width: 900px;
            height: 675px; /* 4:3 aspect ratio approx */
            background-color: #f0f0f0; /* Screen background */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 15px solid #222; /* Bezel */
            border-radius: 10px;
            overflow: hidden;
            /* Subtle scanline effect to mimic screen photo */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.02) 50%);
            background-size: 100% 4px;
        }

        .top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        .camera-placeholder {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background-color: #ccc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.7;
        }
        
        .camera-lens {
            width: 20px;
            height: 20px;
            background-color: #555;
            border-radius: 50%;
        }

        .video-feed {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 140px;
            height: 105px;
            background-color: #333;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 10px;
            text-align: center;
            overflow: hidden;
        }

        .content-area {
            position: absolute;
            top: 120px;
            left: 80px;
            right: 80px;
            bottom: 50px;
            color: #c0392b; /* Reddish text color */
        }

        .header-text {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: normal;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #000; /* Title looks darker/black in image */
            margin: 40px 0;
            letter-spacing: 2px;
        }

        .list-container {
            position: relative;
            font-size: 20px;
            line-height: 2.2;
        }

        .item {
            margin-bottom: 10px;
        }

        .underline {
            text-decoration: underline;
            text-decoration-color: #c0392b;
            text-underline-offset: 4px;
        }

        .side-note {
            position: absolute;
            right: 0;
            font-size: 18px;
        }

        .note-1 {
            top: 135px; /* Aligned with item 2 roughly */
        }

        .note-2 {
            top: 235px; /* Aligned with item 3/4 area */
        }
        
        .item-6 {
            position: absolute;
            right: 150px;
            top: 235px;
        }

        /* Specific positioning adjustments based on visual inspection */
        .row-2 {
            display: flex;
            justify-content: space-between;
        }
        
        .row-3 {
            display: flex;
            justify-content: space-between;
        }

        .left-col {
            flex: 1;
        }

        .right-col {
            flex: 1;
            text-align: left;
            padding-left: 50px;
        }

    </style>
</head>
<body>

    <div class="screen-container">
        <!-- Top Bar -->
        <div class="top-bar">19:28 5月14日周五</div>

        <!-- Camera Icon Placeholder -->
        <div class="camera-placeholder">
            <div class="camera-lens"></div>
        </div>

        <!-- Video Feed Placeholder -->
        <div class="video-feed">
            [Video Feed: Person in room]
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <div class="header-text">固化的做题思维：</div>
            
            <div class="item">1. 喜欢忠于自己的内心和感觉。</div>

            <div class="main-title">2017年 12月第一套 Text 1</div>

            <div class="list-container">
                <div class="item">
                    2. 喜欢选符合<span class="underline">常识的选项</span>。 
                    <span style="margin-left: 10px;">20年左右的常识和经验的累积</span>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                    <div style="flex: 1;">
                        <div class="item">3. &nbsp;喜欢选自己认识的选项。</div>
                        <div class="item">4. 喜欢选自己不认识的选项。</div>
                        <div class="item">5. 火急火燎一把火</div>
                    </div>
                    
                    <div style="flex: 1; padding-left: 40px; padding-top: 0px;">
                         <div class="item" style="margin-top: 0px;">6. 囫囵吞枣选择法</div>
                         <div class="item" style="margin-top: 38px;">（有逃避，有厌烦）</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
