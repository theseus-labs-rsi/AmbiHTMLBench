<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侦探能量站</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "楷体", serif;
        }
        .page-container {
            background-color: #fdfbf7;
            width: 100%;
            max-width: 600px;
            min-height: 800px;
            padding: 40px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
            /* Simulating the slight curve/shadow of the book binding on the left */
            background-image: linear-gradient(to right, rgba(0,0,0,0.05) 0%, transparent 5%);
        }
        .header {
            color: #2c5aa0;
            font-size: 1.4em;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .content {
            color: #333;
            font-size: 1.25em;
            line-height: 2.2;
            text-align: justify;
            letter-spacing: 1px;
        }
        .content p {
            margin: 0;
            text-indent: 2em;
        }
        .footer-text {
            color: #a83232;
            font-size: 1.3em;
            line-height: 2.2;
            margin-top: 30px;
            text-align: center;
            letter-spacing: 2px;
        }
        .footer-line-1 {
            text-indent: 2em;
            text-align: left;
            margin-left: 10%;
        }
        .footer-line-2 {
            text-align: center;
            margin-left: 15%;
        }
        .margin-notes {
            position: absolute;
            left: -60px;
            bottom: 150px;
            color: #333;
            font-size: 1em;
            writing-mode: vertical-rl;
            text-orientation: upright;
            opacity: 0.7;
        }
        .margin-note-bottom {
            position: absolute;
            left: -40px;
            bottom: 50px;
            color: #333;
            font-size: 1em;
            opacity: 0.7;
        }
        /* Simulating the metal clip at bottom right */
        .clip {
            position: absolute;
            bottom: 20px;
            right: -10px;
            width: 30px;
            height: 50px;
            border: 3px solid #999;
            border-radius: 5px;
            background: transparent;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">侦探能量站</div>
    
    <div class="content">
        <p>当偏见裹挟认知，无视事实，操纵舆论的事发生，我们该如何对待？</p>
        <p>如果我不害怕人微言轻，也许你就不会经历人言可畏，用心辨别真相，用爱和真诚可以消融流言。正如名侦探柯南所言，“千军万马踩过的时侯，小小的一脚都有可能是致命伤，我们谁都不想成为这样的人，我们也不要成为加害的人”，遭遇不公时，隐忍不是唯一道路，我们可以向不公平呐喊，只有大家都勇敢起来，加害者才会觉得我们没有那么好欺负。</p>
    </div>

    <div class="footer-text">
        <div class="footer-line-1">愿你笔尖下皆自由之风，一笔一画，</div>
        <div class="footer-line-2">一字一句，黑白分明</div>
    </div>

    <!-- Margin notes visible on the left edge -->
    <div class="margin-notes">
        右转<br>侧
    </div>
    <div class="margin-note-bottom">
        腐
    </div>

    <!-- Decorative clip element -->
    <div class="clip"></div>
</div>

</body>
</html>
