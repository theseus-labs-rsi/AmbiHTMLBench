<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAY3 3.特色路线</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #eef4f9;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  .page {
    position: relative;
    width: 600px;
    height: 800px;
    margin: 0 auto;
    background: #eef4f9;
    overflow: hidden;
  }
  .abs { position: absolute; }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #23405a;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(0,0,0,0.08);
    padding: 4px;
  }
  .label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f8c6b0;
    padding: 6px 20px 8px 12px;
    border-radius: 14px 46px 18px 50px / 42px 16px 46px 14px;
    transform: rotate(-1.5deg);
  }
  .label .pin { font-size: 16px; line-height: 1; }
  .label .txt {
    font-size: 21px;
    font-weight: 800;
    color: #1c1c1c;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .purple {
    color: #7d71c0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 1px;
  }
  .orange {
    color: #ee4017;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: 1px;
  }
  .day3-text {
    font-family: "Arial Rounded MT Bold", Verdana, sans-serif;
    font-size: 58px;
    font-weight: 900;
    color: #f6a058;
    letter-spacing: 3px;
    transform: rotate(-2deg);
    margin-left: 24px;
    margin-top: -8px;
    text-shadow:
      -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff,
      -4px 0 0 #fff, 4px 0 0 #fff, 0 -4px 0 #fff, 0 4px 0 #fff,
      5px 7px 0 rgba(242,150,80,0.35);
  }
  .title {
    background: #aee800;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 41px;
    font-weight: 900;
    color: #0d0d0d;
    letter-spacing: 3px;
    transform: rotate(-0.4deg);
  }
  svg.arrow { overflow: visible; }
  svg.arrow path {
    fill: none;
    stroke: #ed4a1c;
    stroke-width: 7;
    stroke-linecap: round;
    marker-end: url(#arrowhead);
  }
</style>
</head>
