<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五大学科竞赛国家集训队名单</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', cursive, sans-serif;
        }

        .page-container {
            width: 600px;
            min-height: 850px;
            background-color: #fff;
            /* Grid paper background */
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
            padding: 20px 20px 20px 60px; /* Left padding for holes */
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Spiral binding holes simulation */
        .holes {
            position: absolute;
            left: 15px;
            top: 20px;
            bottom: 20px;
            width: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hole {
            width: 12px;
            height: 12px;
            background-color: #dcdcdc;
            border-radius: 50%;
            border: 1px solid #bbb;
        }

        h1 {
            color: #4a2c8c; /* Dark purple/blue */
            font-size: 32px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .content-area {
            position: relative;
            margin-bottom: 30px;
        }

        .main-text {
            color: #ff6b6b; /* Reddish pink */
            font-size: 26px;
            line-height: 1.6;
            padding-right: 140px; /* Space for the sticky note */
            text-align: justify;
        }

        .bullet-point {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff6b6b;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            opacity: 0.7;
        }
        
        /* Simulating the bullet points on the left margin as seen in image */
        .margin-bullets {
            position: absolute;
            left: -35px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 38px; /* Approximate line height spacing */
        }
        
        .margin-bullet {
            width: 10px;
            height: 10px;
            background-color: #a0c4ff;
            border-radius: 50%;
            opacity: 0.6;
        }

        .sticky-note {
            position: absolute;
            top: 0;
            right: 0;
            width: 160px;
            height: 180px;
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            padding: 15px;
            transform: rotate(2deg);
            border-bottom-right-radius: 20px 5px; /* Curl effect approximation */
        }
        
        .sticky-note::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.05) 50%);
            border-bottom-right-radius: 5px;
        }

        .sticky-text {
            color: #333;
            font-size: 22px;
            line-height: 1.8;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 20px;
            background-color: rgba(255, 255, 255, 0.8);
        }

        th, td {
            border: 1px solid #8bc34a; /* Light green border */
            padding: 8px;
            text-align: center;
            color: #333;
        }

        th {
            background-color: #8bc34a; /* Green header */
            color: white;
            font-weight: normal;
        }
        
        /* Alternating row colors based on image */
        tr:nth-child(even) td {
            background-color: #dcedc8; /* Lighter green */
        }
        
        tr:nth-child(odd) td {
            background-color: #f1f8e9; /* Very light green/white */
        }
        
        /* Specific styling for the header row to match image */
        thead tr th {
            background-color: #7cb342;
        }

        .table-container {
            position: relative;
        }
        
        /* Table margin bullets */
        .table-bullets {
            position: absolute;
            left: -35px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Spiral Holes -->
    <div class="holes">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class=" (simulated by space-between)"></div>
        <!-- Adding more holes manually to ensure density -->
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    </div>

    <h1>五大学科竞赛国家集训队名单</h1>

    <div class="content-area">
        <!-- Margin Bullets for text -->
        <div class="margin-bullets">
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
        </div>

        <div class="main-text">
            2023年进入国际五项学科奥赛国家集训队符合保送生资格的总人数为274人。其中生物学科人数最多为67人；其次是数学学科，为64人信息学学科有53人；化学学科有47人；物理学科人数最少，为43人！
        </div>

        <div class="sticky-note">
            <div class="sticky-text">
                生竞67人<br>
                数竞64人<br>
                化竞47人<br>
                物竞43人
            </div>
        </div>
    </div>

    <div class="table-container">
        <!-- Margin Bullets for table -->
        <div class="table-bullets">
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
            <div class="margin-bullet"></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>学科</th>
                    <th>2023 年</th>
                    <th>2022 年</th>
                    <th>2021 年</th>
                    <th>小计</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>数学</td>
                    <td>19</td>
                    <td>32</td>
                    <td>13</td>
                    <td>64</td>
                </tr>
                <tr>
                    <td>化学</td>
                    <td>47</td>
                    <td></td>
                    <td></td>
                    <td>47</td>
                </tr>
                <tr>
                    <td>物理</td>
                    <td>37</td>
                    <td>6</td>
                    <td></td>
                    <td>43</td>
                </tr>
                <tr>
                    <td>生物</td>
                    <td>58</td>
                    <td>9</td>
                    <td></td>
                    <td>67</td>
                </tr>
                <tr>
                    <td>信息学</td>
                    <td>34</td>
                    <td>13</td>
                    <td></td>
                    <td>53</td>
                </tr>
                <tr>
                    <td>合计</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>274</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <!-- Bottom holes continuation -->
    <div style="position: absolute; bottom: 20px; left: 15px; display: flex; flex-direction: column; gap: 20px;">
         <div class="hole"></div>
         <div class="hole"></div>
    </div>

</div>

</body>
</html>
