<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍 - Self Introduction</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slide-container {
            width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* Decorative background blobs to simulate watercolor */
        .bg-blob-1 {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(168,230,207,0) 70%);
            border-radius: 50%;
        }
        .bg-blob-2 {
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,211,182,0.4) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding-top: 25px;
            position: relative;
            z-index: 10;
        }

        .title-bubbles {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .bubble-char {
            width: 45px;
            height: 45px;
            background-color: #ffcc5c;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.5);
        }

        .subtitle {
            color: #555;
            font-size: 16px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Main Content Card */
        .content-card {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 30px;
            margin: 20px 40px;
            padding: 30px 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: 340px;
            display: flex;
            flex-direction: column;
        }

        /* Top Row: Info, Goal, Photo */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        /* Left Column: Personal Info */
        .personal-info {
            flex: 0 0 25%;
            padding-top: 10px;
        }

        .info-item {
            margin-bottom: 15px;
            font-size: 16px;
            color: #d35400; /* Orange-brown text color */
            font-weight: bold;
        }

        .info-label {
            color: #d35400;
        }

        .info-value {
            color: #555;
            font-weight: normal;
            margin-left: 5px;
        }

        /* Middle Column: Work Goal Bubble */
        .work-goal-container {
            flex: 0 0 45%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .thought-bubble {
            background-color: #ffcc5c;
            border-radius: 20px;
            padding: 20px 25px;
            position: relative;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 2px 10px rgba(255, 204, 92, 0.3);
            width: 100%;
            max-width: 280px;
        }

        /* Simulating the cloud/thought bubble shape with pseudo-elements */
        .thought-bubble::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 20px;
            width: 20px;
            height: 20px;
            background-color: #ffcc5c;
            border-radius: 50%;
        }
        .thought-bubble::before {
            content: '';
            position: absolute;
            right: -30px;
            top: 10px;
            width: 12px;
            height: 12px;
            background-color: #ffcc5c;
            border-radius: 50%;
        }
        
        /* Additional small bubbles for effect */
        .mini-bubble-1 {
            position: absolute;
            right: -45px;
            top: 5px;
            width: 8px;
            height: 8px;
            background-color: #ffcc5c;
            border-radius: 50%;
        }

        .goal-title {
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .goal-text {
            color: #666;
        }

        /* Right Column: Photo */
        .photo-container {
            flex: 0 0 20%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .photo-frame {
            width: 110px;
            height: 110px;
            background-color: #ff6b6b;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background-color: #ff6b6b;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            color: white;
            font-size: 10px;
            position: relative;
        }
        
        /* Simulating the person in the photo */
        .person-silhouette {
            width: 80%;
            height: 80%;
            background-color: #fff;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: -10px;
            opacity: 0.9;
        }
        .person-head {
            width: 40px;
            height: 50px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            left: 35px;
        }
        .person-body {
            width: 70px;
            height: 60px;
            background-color: #fff;
            border-radius: 40px 40px 0 0;
            position: absolute;
            bottom: 0;
            left: 20px;
        }
        .sunglasses {
            width: 30px;
            height: 10px;
            background-color: #ff6b6b;
            position: absolute;
            top: 35px;
            left: 40px;
            border-radius: 5px;
            z-index: 2;
        }

        /* Bottom Row: Description */
        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
            text-align: justify;
            border-top: 1px dashed rgba(0,0,0,0.05);
            padding-top: 15px;
            margin-top: auto;
        }

        .desc-indent {
            text-indent: 2em;
        }

    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Background decorative elements -->
        <div class="bg-blob-1"></div>
        <div class="bg-blob-2"></div>

        <!-- Header -->
        <div class="header">
            <div class="title-bubbles">
                <div class="bubble-char">自</div>
                <div class="bubble-char">我</div>
                <div class="bubble-char">介</div>
                <div class="bubble-char">绍</div>
            </div>
            <div class="subtitle">SELF INTRODUCTION</div>
        </div>

        <!-- Main Content Card -->
        <div class="content-card">
            
            <div class="top-row">
                <!-- Left: Personal Info -->
                <div class="personal-info">
                    <div class="info-item">
                        <span class="info-label">姓名：</span><span class="info-value">咸鱼</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">年龄：</span><span class="info-value">20</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">爱好：</span><span class="info-value">看电影，打游戏</span>
                    </div>
                </div>

                <!-- Middle: Work Goal -->
                <div class="work-goal-container">
                    <div class="thought-bubble">
                        <div class="mini-bubble-1"></div>
                        <div class="goal-title">工作目标：</div>
                        <div class="goal-text">
                            1.学习好专业知识，同时广泛涉及其他专业知识。<br><br>
                            2.尽量多争取一些等级证书，这不仅是能力的证明，也是就业的有力武器。
                        </div>
                    </div>
                </div>

                <!-- Right: Photo -->
                <div class="photo-container">
                    <div class="photo-frame">
                        <div class="photo-placeholder">
                            <!-- Abstract representation of the photo content -->
                            <div class="person-head"></div>
                            <div class="sunglasses"></div>
                            <div class="person-body"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom: Description -->
            <div class="description">
                <p style="margin: 0 0 5px 0;">大家好，我叫咸鱼，来自山东青岛。</p>
                <p class="desc-indent" style="margin: 0;">
                    本人性格沉稳、细致、观体，发挥所长。在工作上，细致入微，认真负责。具有很好的团队合作精神，注重团体的利益，集体意识强。能够与人充分合作，充分听取他人的意见和建议，并不断进步。观察力强，上进心强而且为人随和，易于沟通，能够快速地融入工作群团队及成员给出良好的意见。
                </p>
            </div>

        </div>
    </div>

</body>
</html>
