<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题、主题意义、主题的联系与区别</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        
        /* Top Box */
        .top-box {
            border: 2px solid #333;
            padding: 15px 10px;
            text-align: center;
            margin-bottom: 25px;
            background-color: #fff;
        }
        .top-box h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            line-height: 1.4;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 14px;
        }
        th, td {
            padding: 12px 8px;
            text-align: left;
            vertical-align: middle;
        }
        /* Header Row */
        thead tr {
            background-color: #b3b322; /* Olive green */
            color: white;
        }
        thead th {
            font-weight: bold;
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.3);
        }
        thead th:last-child {
            border-right: none;
        }
        /* Diagonal Header Cell Simulation */
        .diagonal-header {
            position: relative;
            width: 80px;
            height: 50px;
            background-color: #b3b322;
        }
        .diagonal-text-top {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 12px;
        }
        .diagonal-text-bottom {
            position: absolute;
            bottom: 5px;
            left: 10px;
            font-size: 12px;
        }
        .diagonal-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top right, transparent calc(50% - 1px), rgba(255,255,255,0.5) 50%, transparent calc(50% + 1px));
        }

        /* Table Body */
        tbody tr:nth-child(odd) {
            background-color: #f2f2e6; /* Light beige/green */
        }
        tbody tr:nth-child(even) {
            background-color: #e8e8d8; /* Slightly darker beige/green */
        }
        tbody td:first-child {
            font-weight: bold;
            color: #fff;
            background-color: #b3b322; /* Match header color for first column */
            text-align: center;
            width: 80px;
        }
        /* Override specific row colors to match image pattern better if needed, 
           but the image shows alternating rows for the data cells, 
           while the first column is solid green blocks? 
           Actually, looking closely, the first column cells are green blocks.
           The rest of the row alternates light yellow/white.
           Let's refine:
           Row 1 (Header): Green
           Row 2 (Data): First col Green, rest Light Yellow
           Row 3 (Data): First col Green, rest White/Light Grey
           Row 4 (Data): First col Green, rest Light Yellow
           Row 5 (Data): First col Green, rest White/Light Grey
           
           Wait, the image shows:
           Header: Green
           Row 1 (意义特征): First col Green, rest Light Yellowish
           Row 2 (表达方式): First col Green, rest Light Yellowish (actually looks like alternating bands across the whole row except the first col is always green block)
           
           Let's look at the image again.
           The first column "维度" cells are distinct green blocks.
           The rest of the table has alternating background colors for the rows.
           Row 1 (意义特征): Light cream
           Row 2 (表达方式): Light cream (actually looks like the whole table body is a gradient or alternating very subtly).
           Let's stick to a simple alternating scheme for the data cells.
        */
        
        tbody td {
            color: #333;
            border-bottom: 1px solid #fff;
        }

        /* Middle Title */
        .middle-title {
            text-align: center;
            margin: 30px 0;
        }
        .middle-title h2 {
            margin: 0;
            font-size: 24px;
            color: #333;
            text-shadow: 2px 2px 0px #b3b322, -1px -1px 0 #fff; /* Simulating the outline effect */
            font-weight: 900;
            line-height: 1.3;
            /* The image has a specific yellow/gold outline style */
            color: #fff;
            -webkit-text-stroke: 1px #b3b322;
            text-stroke: 1px #b3b322;
            /* Fallback for text shadow to mimic the thick outline */
            text-shadow: 
                2px 2px 0 #b3b322,
                -2px -2px 0 #b3b322,
                2px -2px 0 #b3b322,
                -2px 2px 0 #b3b322,
                0px 2px 0 #b3b322,
                2px 0px 0 #b3b322,
                0px -2px 0 #b3b322,
                -2px 0px 0 #b3b322;
        }
        /* Re-evaluating the middle title style: It looks like yellow text with black outline or vice versa? 
           Actually, it looks like white text with a thick yellow/gold border and a drop shadow.
           Let's try a simpler approach that looks close. */
        .middle-title h2 span {
            display: block;
        }

        /* Second Box */
        .second-box {
            border: 1px solid #333;
            padding: 15px 10px;
            text-align: center;
            margin: 20px auto 40px auto;
            width: 80%;
            background-color: #fff;
        }
        .second-box p {
            margin: 0;
            font-size: 16px;
            color: #333;
            line-height: 1.4;
        }

        /* Diagram Section */
        .diagram-container {
            position: relative;
            height: 250px;
            margin-top: 20px;
            background-color: #f9f9f9;
            overflow: hidden;
        }
        
        /* Steps / Arrows */
        .step {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        
        /* Step 1: Blue */
        .step-1 {
            bottom: 0;
            left: 0;
            width: 33%;
            height: 60px;
            background-color: #2c5f7c; /* Dark Blue */
            z-index: 3;
        }
        .step-1 .label-top {
            position: absolute;
            top: -50px;
            left: 10px;
            color: #333;
            font-size: 14px;
            text-align: left;
            width: 120px;
            line-height: 1.2;
        }
        .step-1 .label-top::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #b3b322;
            transform: rotate(-45deg);
        }
        /* Actually the labels are in boxes with arrows pointing up/right. Let's simplify to text blocks positioned relatively */
        
        .step-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .step-title {
            font-size: 16px;
            margin-bottom: 2px;
        }
        .step-subtitle {
            font-size: 10px;
            font-weight: normal;
        }

        /* Step 2: Yellow/Orange */
        .step-2 {
            bottom: 30px;
            left: 28%;
            width: 33%;
            height: 60px;
            background-color: #f0a500; /* Orange/Yellow */
            z-index: 2;
            clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);
        }
        .step-2 .label-top {
            position: absolute;
            top: -50px;
            left: 20px;
            color: #333;
            font-size: 14px;
            text-align: left;
            width: 120px;
            line-height: 1.2;
        }

        /* Step 3: Green */
        .step-3 {
            bottom: 60px;
            left: 56%;
            width: 44%;
            height: 60px;
            background-color: #b3b322; /* Olive Green */
            z-index: 1;
            clip-path: polygon(0 0, 85% 0, 100% 50%, 85% 100%, 0 100%);
        }
        .step-3 .label-top {
            position: absolute;
            top: -50px;
            left: 20px;
            color: #333;
            font-size: 14px;
            text-align: left;
            width: 140px;
            line-height: 1.2;
        }

        /* Decorative Triangles for labels */
        .label-box {
            position: absolute;
            background: #fff;
            border: 2px solid #b3b322;
            padding: 5px;
            font-size: 13px;
            color: #333;
            line-height: 1.2;
            text-align: center;
        }
        .label-box::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #b3b322 transparent;
            display: block;
            width: 0;
        }
        /* This CSS arrow approach is tricky to align perfectly without trial and error. 
           I will use a simplified visual representation using divs that approximates the layout. */

        .diagram-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            margin-top: 10px;
        }

        /* Base bars */
        .bar {
            position: absolute;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-direction: column;
        }
        .bar-blue {
            background-color: #2b5c7a;
            bottom: 0;
            left: 0;
            width: 35%;
            z-index: 3;
        }
        .bar-yellow {
            background-color: #f5a623;
            bottom: 25px;
            left: 30%;
            width: 35%;
            z-index: 2;
            /* Arrow shape right */
            clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
        }
        .bar-green {
            background-color: #aeb32b;
            bottom: 50px;
            left: 60%;
            width: 40%;
            z-index: 1;
            /* Arrow shape right */
            clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
        }

        /* Labels above bars */
        .label-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .label-text-box {
            border: 2px solid #aeb32b;
            background: white;
            padding: 8px 5px;
            font-size: 13px;
            color: #333;
            text-align: center;
            line-height: 1.3;
            position: relative;
            margin-bottom: 5px;
        }
        /* Triangle pointer */
        .triangle-up {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 10px solid #aeb32b;
        }
        /* The image has triangles pointing somewhat diagonally or from the side. 
           I will place them approximately. */
        
        .lg-1 { bottom: 55px; left: 5%; }
        .lg-2 { bottom: 80px; left: 32%; }
        .lg-3 { bottom: 105px; left: 62%; }

        /* Adjusting triangle positions to look like the image (floating above) */
        .pointer {
            position: absolute;
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 12px solid #aeb32b;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }
        /* The image pointers are actually separate geometric shapes, not just CSS triangles attached to boxes.
           They look like little flags. I'll stick to the box + triangle approximation for structural fidelity. */

        .bar-text-main { font-size: 15px; }
        .bar-text-sub { font-size: 10px; font-weight: normal; margin-top: 2px; }

        /* Footer */
        .footer {
            text-align: right;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            padding-right: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Top Section -->
    <div class="top-box">
        <h1>话题、主题意义、主题的联系与区别<br>(读者视角)</h1>
    </div>

    <!-- Table Section -->
    <table>
        <thead>
            <tr>
                <th style="position: relative; width: 80px; padding: 0;">
                    <div class="diagonal-line"></div>
                    <span class="diagonal-text-top">概念</span>
                    <span class="diagonal-text-bottom">维度</span>
                </th>
                <th>话题</th>
                <th>主题意义</th>
                <th>主题</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>意义特征</td>
                <td>具体</td>
                <td>界于二者之间</td>
                <td>抽象</td>
            </tr>
            <tr>
                <td>表达方式</td>
                <td>直接</td>
                <td>蕴含</td>
                <td>拓展</td>
            </tr>
            <tr>
                <td>核心意义</td>
                <td>语篇讨论的中心</td>
                <td>语篇的寓意</td>
                <td>语篇寓意所属的范畴</td>
            </tr>
            <tr>
                <td>本质特征</td>
                <td>特定性</td>
                <td>由语篇内容延伸的普<br>适性（去细节的）</td>
                <td>普遍性</td>
            </tr>
        </tbody>
    </table>

    <!-- Middle Title -->
    <div class="middle-title">
        <h2>
            <span>话题，主题意义，主题</span>
            <span>与学习活动的层次息息相关</span>
        </h2>
    </div>

    <!-- Second Box -->
    <div class="second-box">
        <p>话题、主题意义、主题的联系与区别<br>(学习视角)</p>
    </div>

    <!-- Diagram Section -->
    <div class="diagram-wrapper">
        <!-- Labels -->
        <div class="label-group lg-1">
            <div class="label-text-box">基于语篇的学习<br>为主<div class="pointer"></div></div>
        </div>
        <div class="label-group lg-2">
            <div class="label-text-box">深入语篇的学习<br>为主<div class="pointer"></div></div>
        </div>
        <div class="label-group lg-3">
            <div class="label-text-box">超越语篇的学习<br>为主<div class="pointer"></div></div>
        </div>

        <!-- Bars -->
        <div class="bar bar-blue">
            <div class="bar-text-main">话题</div>
            <div class="bar-text-sub">What+How</div>
        </div>
        <div class="bar bar-yellow">
            <div class="bar-text-main">主题意义</div>
            <div class="bar-text-sub">Why+How</div>
        </div>
        <div class="bar bar-green">
            <div class="bar-text-main">主题</div>
            <div class="bar-text-sub">What+Why+How+So what (else)</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        (葛炳芳，2022：出版中)
    </div>
    
    <!-- Small icon placeholder bottom right -->
    <div style="position: absolute; bottom: 10px; right: 10px; width: 20px; height: 20px; background-color: #4da6ff; border-radius: 50%; opacity: 0.8;"></div>

</div>

</body>
</html>
