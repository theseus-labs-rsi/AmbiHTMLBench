<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早发白帝城 - 李白</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #333; /* Dark background to simulate the viewer environment */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
        }

        .page-container {
            width: 600px;
            height: 850px;
            background-color: #4a5278; /* Muted blue-purple background */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Vertical Text Utility */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        /* Left Side: Author and Title */
        .meta-info {
            position: absolute;
            left: 40px;
            top: 120px;
            color: #e0e0e0;
            font-size: 18px;
            letter-spacing: 8px;
            line-height: 1.5;
        }

        .meta-info span {
            display: block;
            margin-bottom: 20px;
        }

        /* Right Side: Main Poem (Large) */
        .poem-main {
            position: absolute;
            right: 60px;
            top: 120px;
            color: #2b304a; /* Darker shade for the main text */
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 15px;
            line-height: 1.8;
        }

        /* Center-Left: Secondary Poem Lines (Medium) */
        .poem-secondary {
            position: absolute;
            left: 180px;
            top: 220px;
            color: #e0e0e0;
            font-size: 32px;
            letter-spacing: 10px;
            line-height: 1.8;
        }

        /* Bottom Footer */
        .footer {
            height: 60px;
            background-color: #f4eedc; /* Beige strip */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .footer-text {
            color: #333;
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="main-content">
            
            <!-- Meta Info (Left) -->
            <div class="meta-info vertical-text">
                <span>唐</span>
                <span>李白</span>
                <span>早发白帝城</span>
            </div>

            <!-- Main Poem Columns (Right) -->
            <div class="poem-main vertical-text">
                朝辭白帝彩雲間<br>
                千里江陵一日還
            </div>

            <!-- Secondary Poem Columns (Center-Left) -->
            <div class="poem-secondary vertical-text">
                两岸猿声啼不住，<br>
                轻舟已过万重山。
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。
            </div>
        </div>
    </div>

</body>
</html>
