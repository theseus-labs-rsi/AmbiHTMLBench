<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Note</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #8b6f47; /* Wood-like background approximation */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
        }

        .paper-container {
            background-color: #f4f4f0;
            width: 100%;
            max-width: 800px;
            padding: 40px 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            transform: rotate(-1deg); /* Slight tilt to match photo */
            overflow: hidden;
        }

        /* Shadow overlay to simulate the lighting in the photo */
        .shadow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.05) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .header-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
        }

        .question-number {
            font-size: 28px;
            font-weight: bold;
            margin-right: 15px;
            font-family: "Comic Sans MS", cursive, sans-serif; /* Handwritten number style */
            color: #333;
        }

        .printed-text {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            font-family: "SimSun", "Songti SC", serif;
        }

        .sub-question {
            margin-left: 45px; /* Indent to align with text after number */
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
            font-family: "SimSun", "Songti SC", serif;
        }

        .handwriting-area {
            margin-top: 10px;
            position: relative;
        }

        .handwriting-line {
            font-size: 32px;
            line-height: 1.8;
            color: #1a1a1a;
            font-family: "KaiTi", "STKaiti", "Brush Script MT", cursive;
            border-bottom: 1px dashed #999; /* Dotted lines for writing */
            padding-bottom: 5px;
            margin-bottom: 5px;
            white-space: pre-wrap;
        }

        /* Specific styling to mimic the handwriting flow */
        .hw-text {
            display: block;
            width: 100%;
        }

        .right-edge-text {
            position: absolute;
            right: -20px;
            top: 0;
            font-size: 12px;
            color: #666;
            writing-mode: vertical-rl;
            opacity: 0.7;
        }

    </style>
</head>
<body>

    <div class="paper-container">
        <div class="shadow-overlay"></div>
        
        <!-- Right edge cut-off text simulation -->
        <div class="right-edge-text">
            有一<br>五[?]
        </div>

        <div class="header-row">
            <span class="question-number">26</span>
            <span class="printed-text">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</span>
        </div>

        <div class="sub-question">
            她看到了什么呢？
        </div>

        <div class="handwriting-area">
            <div class="handwriting-line">
                <span class="hw-text">我蹲下来，“这根肋骨让你感</span>
            </div>
            <div class="handwriting-line">
                <span class="hw-text">到不舒服吗？”</span>
            </div>
            <div class="handwriting-line">
                <span class="hw-text">展览台上是一尊白玉莹莹的肋</span>
            </div>
            <div class="handwriting-line">
                <span class="hw-text">骨，下面的文字介绍引用了夏娃</span>
            </div>
            <div class="handwriting-line">
                <span class="hw-text">的来历，说女人都是由肋骨所化。</span>
            </div>
        </div>
    </div>

</body>
</html>
