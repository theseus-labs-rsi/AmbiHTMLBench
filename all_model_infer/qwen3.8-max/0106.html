<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫砂都有哪些款</title>
    <style>
        body {
            background-color: #f3e1d6; /* Light peach background */
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: #fdfaf6;
            border: 4px solid #a3c9c6; /* Teal border */
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Main Title */
        .main-title {
            text-align: center;
            margin-bottom: 25px;
        }
        .main-title span {
            background-color: #ffffff;
            border: 3px solid #a3c9c6;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            display: inline-block;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .question-mark {
            color: #f4d03f;
            -webkit-text-stroke: 1px #333;
            font-size: 32px;
            margin-left: 5px;
        }

        /* Section Headers */
        .section-header {
            font-size: 18px;
            font-weight: bold;
            color: #5a4a42;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
        }
        .pin-icon {
            color: #e74c3c;
            margin-right: 5px;
            font-size: 20px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        
        /* Table 1 Styling */
        .table-1 th {
            background-color: #5d6373; /* Dark grey-blue */
            color: white;
            padding: 12px 5px;
            font-weight: normal;
        }
        .table-1 td {
            border: 1px solid #e0e0e0;
            padding: 12px 5px;
            color: #333;
            background-color: #fff;
        }

        /* Table 2 Styling */
        .table-2 th {
            background-color: #2c5e63; /* Dark teal */
            color: white;
            padding: 12px 5px;
            font-weight: normal;
        }
        .table-2 td {
            border: 1px solid #e0e0e0;
            padding: 12px 5px;
            color: #333;
            background-color: #fff;
        }

        /* Specific Layout Elements */
        .summary-box {
            background-color: #c0392b;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 14px;
            display: inline-block;
            float: right;
            margin-top: -35px; /* Pull up to align with header */
            margin-bottom: 10px;
        }

        /* Annotations & Overlays */
        .relative-cell {
            position: relative;
        }
        
        .circle-annotation {
            position: absolute;
            border: 2px solid #e74c3c;
            border-radius: 50%;
            width: 70px;
            height: 35px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            pointer-events: none;
            z-index: 10;
        }

        .handwritten-text {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-weight: bold;
            font-style: italic;
            font-size: 13px;
            white-space: nowrap;
            z-index: 11;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        }

        .highlight-red {
            color: #e74c3c;
            font-weight: bold;
        }

        .bottom-overlay {
            position: absolute;
            bottom: 5px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            z-index: 20;
        }
        .arrow-up {
            color: #3498db;
            margin-right: 3px;
            font-weight: bold;
        }
        .check-mark {
            color: #2ecc71;
            margin-left: 5px;
            font-weight: bold;
        }

        /* Utility */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Title -->
    <div class="main-title">
        <span>猫砂都有哪些款 <span class="question-mark">?</span></span>
    </div>

    <!-- Section 1 -->
    <div class="section-header">
        <span class="pin-icon">📍</span> 三种猫砂尺寸哪个是你最爱
    </div>

    <table class="table-1">
        <thead>
            <tr>
                <th style="width: 25%;">尺寸</th>
                <th style="width: 25%;">重量</th>
                <th style="width: 25%;">结团效果</th>
                <th style="width: 25%;">其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.5mm</td>
                <td>轻</td>
                <td>上</td>
                <td>易带出，价格<br>略高</td>
            </tr>
            <tr>
                <td class="relative-cell">
                    2mm
                    <div class="circle-annotation"></div>
                    <div class="handwritten-text">综合性价比推荐</div>
                </td>
                <td>中</td>
                <td>中</td>
                <td>综合性价比高</td>
            </tr>
            <tr>
                <td>3mm</td>
                <td>重</td>
                <td>67</td>
                <td>推荐度低，但<br>价格也低</td>
            </tr>
        </tbody>
    </table>

    <!-- Section 2 -->
    <div class="clearfix">
        <div class="section-header" style="display: inline-block; margin-bottom: 0;">
            <span class="pin-icon">📍</span> 猫砂都有哪些种类
        </div>
        <div class="summary-box">
            总结：2mm混合砂yyds
        </div>
    </div>

    <table class="table-2" style="margin-top: 10px;">
        <thead>
            <tr>
                <th style="width: 25%;">种类</th>
                <th style="width: 40%;">优点</th>
                <th style="width: 35%;">其他</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>膨润土</td>
                <td>价格低廉</td>
                <td>粉尘大</td>
            </tr>
            <tr>
                <td>豆腐猫砂</td>
                <td>原料更安全，闻起来<br>也比较好</td>
                <td>价格偏高，纯豆腐结团略差</td>
            </tr>
            <tr>
                <td class="relative-cell">
                    混合猫砂
                    <div class="circle-annotation" style="width: 80px; height: 30px;"></div>
                    <!-- Overlay for the row below spans across, but visually starts here -->
                </td>
                <td>结合上述优点，价格<br>适中</td>
                <td>比例推荐 <span class="highlight-red">7:3或6:4</span>，结团<br>快且用量省</td>
            </tr>
            <tr>
                <td class="relative-cell">
                    沸石
                    <div class="bottom-overlay">
                        <span class="arrow-up">⬆</span> 普通养宠家庭足以满足需求 <span class="check-mark">✅</span>
                    </div>
                </td>
                <td>可循环利用</td>
                <td>需要自己洗</td>
            </tr>
            <tr>
                <td>其他新型原料</td>
                <td>价格高，新颖</td>
                <td>效果待考核，贵</td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
