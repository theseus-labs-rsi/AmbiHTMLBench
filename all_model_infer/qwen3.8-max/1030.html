<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江雪 - 柳宗元</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
        }

        .page-container {
            width: 500px;
            height: 750px;
            background-color: #fdfbf7;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* Simulating the paper texture/background */
            background-image: radial-gradient(circle at 50% 0%, #fff0f5 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, #e6e6fa 0%, transparent 50%);
        }

        /* Background Decorative Elements (Mountains/Clouds) */
        .bg-mountain-left {
            position: absolute;
            top: 250px;
            left: -20px;
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, transparent 40%, #4a3b5c 41%, #2d2438 100%);
            clip-path: polygon(0% 100%, 100% 100%, 80% 60%, 50% 70%, 20% 40%, 0% 50%);
            opacity: 0.8;
            z-index: 1;
        }
        
        .bg-mountain-right {
            position: absolute;
            top: 350px;
            right: -30px;
            width: 180px;
            height: 150px;
            background: linear-gradient(135deg, transparent 40%, #4a3b5c 41%, #2d2438 100%);
            clip-path: polygon(0% 100%, 100% 100%, 90% 50%, 60% 60%, 30% 30%, 0% 40%);
            opacity: 0.8;
            z-index: 1;
        }

        .bg-cloud-bottom {
            position: absolute;
            bottom: 50px;
            left: 20px;
            width: 200px;
            height: 80px;
            background: #dcd0ff;
            border-radius: 50px;
            opacity: 0.6;
            filter: blur(5px);
            z-index: 1;
        }
        
        .bg-cloud-bottom-2 {
            position: absolute;
            bottom: 80px;
            left: 150px;
            width: 120px;
            height: 40px;
            background: #dcd0ff;
            border-radius: 50px;
            opacity: 0.5;
            filter: blur(3px);
            z-index: 1;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 10;
            padding: 40px 50px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Section */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .pinyin-title {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .main-title {
            font-size: 36px;
            font-weight: bold;
            color: #000;
            letter-spacing: 15px;
            margin: 0 0 10px 15px; /* Offset for letter-spacing */
        }

        .author-pinyin {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 12px;
            color: #333;
            margin-bottom: 2px;
        }

        .author-name {
            font-size: 18px;
            color: #000;
            letter-spacing: 5px;
        }

        /* Poem Section */
        .poem-section {
            width: 100%;
            margin-bottom: 30px;
        }

        .poem-line {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .line-pinyin {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
            letter-spacing: 1px;
            word-spacing: 8px;
        }

        .line-text {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            letter-spacing: 12px;
            margin-left: 12px; /* Offset for letter-spacing alignment */
        }

        /* Translation Section */
        .translation-section {
            width: 100%;
            text-align: left;
            margin-top: 10px;
        }

        .translation-label {
            display: inline-block;
            background-color: #d45d3c;
            color: white;
            padding: 2px 8px;
            font-size: 14px;
            border-radius: 3px;
            margin-bottom: 10px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .translation-text {
            font-size: 16px;
            line-height: 1.8;
            color: #000;
            text-align: justify;
            font-family: 'Noto Serif SC', serif;
        }

        /* Illustration Placeholder */
        .illustration {
            position: absolute;
            bottom: 40px;
            right: 60px;
            width: 140px;
            height: 100px;
            z-index: 5;
        }
        
        /* Simple CSS drawing for the boat and fisherman to avoid external images */
        .boat-hull {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 100px;
            height: 25px;
            background-color: #5c4a52;
            border-radius: 0 0 50px 50px;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
        }
        
        .fisherman-body {
            position: absolute;
            bottom: 30px;
            left: 70px;
            width: 30px;
            height: 35px;
            background-color: #6b4c56;
            border-radius: 15px 15px 0 0;
        }
        
        .fisherman-hat {
            position: absolute;
            bottom: 60px;
            left: 65px;
            width: 40px;
            height: 15px;
            background-color: #d45d3c;
            border-radius: 50% 50% 0 0;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        
        .fishing-rod {
            position: absolute;
            bottom: 50px;
            left: 10px;
            width: 80px;
            height: 2px;
            background-color: #333;
            transform: rotate(-15deg);
            transform-origin: right center;
        }
        
        .fishing-line {
            position: absolute;
            bottom: 10px;
            left: 12px;
            width: 1px;
            height: 40px;
            background-color: #999;
        }

        .snow-flakes {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        .flake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Background Elements -->
    <div class="bg-mountain-left"></div>
    <div class="bg-mountain-right"></div>
    <div class="bg-cloud-bottom"></div>
    <div class="bg-cloud-bottom-2"></div>
    
    <!-- Snowflakes simulation -->
    <div class="snow-flakes">
        <div class="flake" style="top: 10%; left: 20%; width: 3px; height: 3px;"></div>
        <div class="flake" style="top: 30%; left: 80%; width: 2px; height: 2px;"></div>
        <div class="flake" style="top: 50%; left: 10%; width: 4px; height: 4px;"></div>
        <div class="flake" style="top: 70%; left: 60%; width: 2px; height: 2px;"></div>
        <div class="flake" style="top: 85%; left: 30%; width: 3px; height: 3px;"></div>
        <div class="flake" style="top: 20%; left: 50%; width: 2px; height: 2px;"></div>
        <div class="flake" style="top: 60%; left: 90%; width: 3px; height: 3px;"></div>
        <div class="flake" style="top: 90%; left: 70%; width: 2px; height: 2px;"></div>
    </div>

    <div class="content">
        <!-- Title -->
        <div class="title-section">
            <div class="pinyin-title">jiāng xuě</div>
            <h1 class="main-title">江 雪</h1>
            <div class="author-pinyin">táng liǔ zōng yuán</div>
            <div class="author-name">[唐] 柳 宗 元</div>
        </div>

        <!-- Poem -->
        <div class="poem-section">
            <div class="poem-line">
                <div class="line-pinyin">qiān shān niǎo fēi jué</div>
                <div class="line-text">千 山 鸟 飞 绝 ，</div>
            </div>
            <div class="poem-line">
                <div class="line-pinyin">wàn jìng rén zōng miè</div>
                <div class="line-text">万 径 人 踪 灭 。</div>
            </div>
            <div class="poem-line">
                <div class="line-pinyin">gū zhōu suō lì wēng</div>
                <div class="line-text">孤 舟 蓑 笠 翁 ，</div>
            </div>
            <div class="poem-line">
                <div class="line-pinyin">dú diào hán jiāng xuě</div>
                <div class="line-text">独 钓 寒 江 雪 。</div>
            </div>
        </div>

        <!-- Translation -->
        <div class="translation-section">
            <div class="translation-label">译文：</div>
            <div class="translation-text">
                群山之间，没有一只鸟儿飞过。<br>
                纵横的小路上，见不到行人的踪<br>
                迹。只有一位身披蓑衣、头戴笠<br>
                帽的渔翁，架着小船，冒着风<br>
                雪，在寒冷的江上独自垂钓。
            </div>
        </div>
    </div>

    <!-- Illustration (CSS Art) -->
    <div class="illustration">
        <div class="fishing-rod"></div>
        <div class="fishing-line"></div>
        <div class="fisherman-hat"></div>
        <div class="fisherman-body"></div>
        <div class="boat-hull"></div>
        <!-- Small snow dots on the boat area -->
        <div class="flake" style="top: 20px; left: 40px; width: 2px; height: 2px;"></div>
        <div class="flake" style="top: 50px; left: 80px; width: 2px; height: 2px;"></div>
        <div class="flake" style="top: 70px; left: 30px; width: 2px; height: 2px;"></div>
    </div>

</div>

</body>
</html>
