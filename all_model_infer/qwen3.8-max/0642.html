<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-controller vs. Micro-processor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            background: linear-gradient(to right, #4a5a9a 0%, #d0d5e5 40%, #ffffff 100%);
            height: 60px;
            padding-left: 10px;
            position: relative;
        }

        .header-pattern {
            display: grid;
            grid-template-columns: repeat(3, 12px);
            grid-template-rows: repeat(3, 12px);
            gap: 2px;
            margin-right: 15px;
        }

        .pixel {
            width: 12px;
            height: 12px;
        }
        .pixel.dark { background-color: #2b3a8c; }
        .pixel.light { background-color: #aeb6d6; }
        .pixel.white { background-color: #ffffff; opacity: 0.5; }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        /* Main Content Area */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .diagram-box {
            background-color: #eeeeee;
            border: 1px solid #cccccc;
            border-radius: 20px;
            padding: 30px 40px;
            display: flex;
            gap: 60px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            width: 80%;
            max-width: 900px;
            justify-content: space-between;
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .col-title {
            font-size: 20px;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 25px;
            color: #000;
        }

        /* Left Column: One Chip */
        .microcontroller-chip {
            background-color: #00a2e8;
            border: 2px solid #000;
            padding: 10px;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chip-header {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #000;
            margin-bottom: 5px;
        }

        .chip-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .chip-block {
            background-color: #ffffff;
            border: 2px solid #000;
            padding: 8px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chip-block.small {
            flex: 0.4;
        }
        
        .chip-block.medium {
            flex: 0.6;
        }

        /* Right Column: Many Chips */
        .chips-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }

        .ext-block {
            border: 2px solid #000;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .bg-green { background-color: #2ca02c; color: white; }
        .bg-brown { background-color: #a0522d; color: white; }
        .bg-lightblue { background-color: #add8e6; color: black; }
        .bg-blue { background-color: #00a2e8; color: white; }
        .bg-beige { background-color: #f0e68c; color: black; }
        .bg-grey { background-color: #c0c0c0; color: black; }
        
        .multi-color-block {
            display: flex;
            padding: 0;
            overflow: hidden;
        }
        .multi-color-block span {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
        }
        .mc-1 { background-color: #d8bfd8; } /* Purple-ish */
        .mc-2 { background-color: #faebd7; } /* Beige-ish */
        .mc-3 { background-color: #adff2f; } /* Green-yellow */
        .mc-4 { background-color: #ffb6c1; } /* Pink */

        /* Specific Grid Placements */
        .grid-mp { grid-column: 1 / 2; }
        .grid-clock { grid-column: 2 / 3; width: 60%; justify-self: start;} /* Adjusting to match visual roughly */
        .grid-usart { grid-column: 2 / 3; width: 40%; justify-self: end; margin-left: -60%;} /* Hacky alignment for top row */
        
        /* Let's use a more robust flex layout for the right side rows to match image exactly */
        .right-row {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
        }
        .right-row:last-child {
            margin-bottom: 0;
        }

        .r-block {
            border: 2px solid #000;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Row 1 */
        .r-mp { flex: 2; background-color: #2ca02c; color: white; }
        .r-clock { flex: 0.8; background-color: #a0522d; color: white; }
        .r-usart { flex: 1.2; background-color: #add8e6; color: black; }

        /* Row 2 */
        .r-mem { flex: 1; background-color: #00a2e8; color: white; }
        .r-io { flex: 1; background-color: #f0e68c; color: black; }

        /* Row 3 */
        .r-timer { flex: 1; background-color: #c0c0c0; color: black; }
        .r-other { 
            flex: 1; 
            display: flex; 
            padding: 0; 
            border: 2px solid #000;
        }
        .r-other div {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        .r-other div:last-child { border-right: none; }
        .ro-1 { background-color: #d8bfd8; }
        .ro-2 { background-color: #faebd7; }
        .ro-3 { background-color: #adff2f; }
        .ro-4 { background-color: #ffb6c1; }
        
        /* Overlay text for multi-color block */
        .other-text-overlay {
            position: absolute;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            z-index: 10;
        }
        .r-other-container {
            position: relative;
            flex: 1;
            display: flex;
            border: 2px solid #000;
        }


        /* Footer */
        .footer {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 14px;
            color: #000;
            margin-bottom: 10px;
        }

        .page-num {
            position: absolute;
            right: 40px;
            font-weight: bold;
            font-size: 16px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-pattern">
            <div class="pixel light"></div><div class="pixel light"></div><div class="pixel white"></div>
            <div class="pixel dark"></div><div class="pixel light"></div><div class="pixel white"></div>
            <div class="pixel white"></div><div class="pixel white"></div><div class="pixel white"></div>
        </div>
        <h1>Micro-controller vs. Micro-processor</h1>
    </div>

    <div class="main-container">
        <div class="diagram-box">
            
            <!-- Left Column -->
            <div class="column">
                <div class="col-title">One Chip</div>
                <div class="microcontroller-chip">
                    <div class="chip-header">Microcontroller</div>
                    
                    <div class="chip-row">
                        <div class="chip-block small">CPU</div>
                        <div class="chip-block">Timer/Counter</div>
                    </div>
                    
                    <div class="chip-row">
                        <div class="chip-block">Memory</div>
                        <div class="chip-block medium">Clock</div>
                    </div>
                    
                    <div class="chip-row">
                        <div class="chip-block">I/O Interface</div>
                        <div class="chip-block medium">USART</div>
                    </div>
                    
                    <div class="chip-row">
                        <div class="chip-block">Other Peripherals</div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="column">
                <div class="col-title">Many Different Chips</div>
                
                <div style="width: 100%; max-width: 480px;">
                    <!-- Row 1 -->
                    <div class="right-row">
                        <div class="r-block r-mp">Microprocessor</div>
                        <div class="r-block r-clock">Clock</div>
                        <div class="r-block r-usart">USART</div>
                    </div>

                    <!-- Row 2 -->
                    <div class="right-row">
                        <div class="r-block r-mem">Memory</div>
                        <div class="r-block r-io">I/O Interfaces</div>
                    </div>

                    <!-- Row 3 -->
                    <div class="right-row">
                        <div class="r-block r-timer">Timer/Counter</div>
                        <div class="r-other-container">
                            <div class="ro-1"></div>
                            <div class="ro-2"></div>
                            <div class="ro-3"></div>
                            <div class="ro-4"></div>
                            <div class="other-text-overlay">Other Peripherals</div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="footer">
        <span>&copy; 2015 by Eng. Mohamed Tarek.</span>
        <span class="page-num">7</span>
    </div>

</body>
</html>
