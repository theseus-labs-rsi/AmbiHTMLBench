<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOW TO MAKE PROGRESS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }
  .slide {
    position: relative;
    width: 600px;
    height: 720px;
    background: #000;
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    box-sizing: border-box;
    padding: 36px 64px;
    overflow: hidden;
  }
  h1 {
    margin: 0;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #ffffff;
  }
  .list {
    margin-top: 148px;
  }
  .row {
    display: flex;
    align-items: baseline;
    margin-bottom: 13px;
    line-height: 24px;
  }
  .num {
    width: 132px;
    flex-shrink: 0;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .txt {
    font-size: 23px;
    font-weight: 400;
    color: #ffffff;
    letter-spacing: 1px;
  }
  .footer {
    position: absolute;
    left: 64px;
    bottom: 58px;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #cccccc;
  }
</style>
</head>
<body>
<div class="slide">
  <h1>HOW TO MAKE PROGRESS</h1>

  <div class="list">
    <div class="row"><span class="num">01</span><span class="txt">设定明确的目标</span></div>
    <div class="row"><span class="num">02</span><span class="txt">学习新知识</span></div>
    <div class="row"><span class="num">03</span><span class="txt">发展技能</span></div>
    <div class="row"><span class="num">04</span><span class="txt">持续反思和改进</span></div>
    <div class="row"><span class="num">05</span><span class="txt">与优秀的人合作</span></div>
    <div class="row"><span class="num">06</span><span class="txt">克服困难</span></div>
    <div class="row"><span class="num">07</span><span class="txt">坚持努力</span></div>
    <div class="row"><span class="num">08</span><span class="txt">接受反馈</span></div>
    <div class="row"><span class="num">09</span><span class="txt">健康生活方式</span></div>
    <div class="row"><span class="num">10</span><span class="txt">保持积极心态</span></div>
  </div>

  <div class="footer">@ THE LAB C</div>
</div>
</body>
</html>
