<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Biology Notes</title>
    <style>
        body {
            font-family: "Kaiti", "STKaiti", "KaiTi", "楷体", serif;
            background-color: #f4f1ea;
            color: #2c3e50;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .page {
            width: 100%;
            max-width: 600px;
            background-color: #fdfbf7;
            padding: 40px 50px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            line-height: 1.8;
            font-size: 18px;
        }
        .handwriting {
            font-style: normal;
        }
        .indent-1 { margin-left: 2em; }
        .indent-2 { margin-left: 4em; }
        .indent-3 { margin-left: 6em; }
        
        .flex-row {
            display: flex;
            align-items: flex-start;
        }
        .brace-group {
            display: flex;
            flex-direction: column;
            margin-left: 10px;
        }
        .divider {
            border: none;
            border-top: 2px solid #555;
            margin: 30px 0;
            opacity: 0.6;
        }
        .highlight-box {
            background-color: rgba(200, 200, 200, 0.3);
            padding: 0 4px;
            border-radius: 2px;
        }
        .tree-line {
            display: inline-block;
            width: 40px;
            height: 1px;
            background-color: #333;
            vertical-align: middle;
            margin-right: 10px;
        }
        .tree-branch {
            position: relative;
            padding-left: 30px;
        }
        .tree-branch::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 20px;
            height: 1px;
            background-color: #333;
        }
        .vertical-line {
            border-left: 1px solid #333;
            padding-left: 15px;
            margin-left: 10px;
        }
        .arrow-down {
            display: inline-block;
            margin: 0 5px;
        }
        .correction-tape {
            background-color: #e0e0e0;
            color: #333;
            padding: 0 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="page handwriting">
    <!-- Top Section -->
    <div style="margin-bottom: 10px;">
        内质网 <span style="margin-left: 10px;">到 → 高尔基体</span>
    </div>

    <div class="flex-row" style="margin-bottom: 10px;">
        <div>cell的生物膜系统</div>
        <div style="margin-left: 20px; display: flex; align-items: center;">
            <span style="font-size: 24px; margin-right: 5px;">{</span>
            <div class="brace-group">
                <div>cell膜</div>
                <div>cell器膜</div>
                <div>核膜</div>
            </div>
        </div>
    </div>

    <div style="margin-left: 2em; margin-bottom: 10px;">
        ↓ 作用
    </div>

    <div style="margin-bottom: 15px;">
        ① 使cell具有相对稳定的内部环境<br>
        <span class="indent-1">同时，在cell与外部环境进行物质运输、能量转</span><br>
        <span class="indent-1">化、信息传递的过程中起决定性作用.</span>
    </div>

    <div style="margin-bottom: 15px;">
        ② 广阔的膜面积为许多酶提供了附着位点.
    </div>

    <div style="margin-bottom: 10px;">
        ③ 分隔 → 保证了cell生命活动高效、有序的<br>
        <span class="indent-2">进行 .</span>
    </div>

    <hr class="divider">

    <!-- Bottom Section -->
    <div style="margin-bottom: 20px;">
        <span class="correction-tape">cell</span>核控制着 cell 的代谢和遗传
    </div>

    <div class="flex-row">
        <div style="margin-top: 60px; margin-right: 20px;">cell核</div>
        
        <div style="flex-grow: 1;">
            <!-- Branch 1: Nuclear Membrane -->
            <div class="flex-row" style="margin-bottom: 15px;">
                <div class="tree-line" style="transform: rotate(-15deg); width: 50px;"></div>
                <div>核膜：<span class="correction-tape">双层</span>，外膜</div>
            </div>

            <!-- Branch 2: Nucleolus -->
            <div class="flex-row" style="margin-bottom: 15px;">
                <div class="tree-line" style="width: 50px;"></div>
                <div>
                    核仁：与某种 RNA的合成以及核糖<br>
                    <span class="indent-2">体的形成有关</span>
                </div>
            </div>

            <!-- Branch 3: Chromatin -->
            <div class="flex-row" style="margin-bottom: 5px;">
                <div class="tree-line" style="transform: rotate(15deg); width: 50px;"></div>
                <div>
                    染色质 → 由 DNA 和 Pro组成<br>
                    <span style="margin-left: 3em;">↓ 遗传信息的载体</span>
                </div>
            </div>

            <!-- Long vertical connector for the last item roughly aligning with cell核 -->
            <div style="position: relative; margin-top: 10px; margin-left: -60px;">
                 <div style="border-left: 1px solid #333; height: 60px; position: absolute; left: 75px; top: -40px;"></div>
            </div>

            <!-- Branch 4: Nuclear Pore -->
            <div style="margin-left: 2em; margin-top: 10px;">
                核孔：实现核质之间频繁的物质交换<br>
                <span class="indent-2"><span class="correction-tape">和</span>信息交流</span>
            </div>
        </div>
    </div>

    <!-- Finger placeholder at bottom left -->
    <div style="position: absolute; bottom: -20px; left: -20px; width: 100px; height: 150px; z-index: 10;">
        <!-- Visual representation of the finger is omitted as per instructions to use placeholders for non-text, 
             but since it's an obstruction, we just ensure text isn't hidden. 
             The prompt asks for placeholders for charts/diagrams. A finger is part of the photo context.
             I will leave the layout clean. -->
    </div>

</div>

</body>
</html>
