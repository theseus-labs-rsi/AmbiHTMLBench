<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部交易抵销 - 调整所得税</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f4eadd; /* Light wood/beige background approximation */
            background-image: repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0,0,0,0.03) 20px);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #fffdf9;
            width: 100%;
            max-width: 500px;
            border: 2px solid #8c6b4a;
            border-radius: 12px;
            padding: 40px 30px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* Paw prints decoration */
        .paw-left, .paw-right {
            position: absolute;
            top: 20px;
            width: 30px;
            height: 30px;
            opacity: 0.8;
        }
        .paw-left { left: 80px; transform: rotate(-15deg); }
        .paw-right { right: 80px; transform: rotate(15deg); }
        
        .paw-icon {
            fill: #d4a373;
        }

        h1 {
            text-align: center;
            color: #5c4033;
            font-size: 28px;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #5c4033;
            font-size: 26px;
            margin: 0 0 30px 0;
            font-weight: bold;
        }

        .highlight-badge {
            background-color: #fceabb;
            color: #8c6b4a;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .section-title {
            font-weight: bold;
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .calculation-block {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .values-col {
            display: flex;
            flex-direction: column;
            margin-right: 5px;
            text-align: right;
            font-size: 15px;
            color: #333;
            line-height: 1.8;
        }

        .brace {
            font-size: 40px;
            color: #666;
            font-weight: 100;
            margin: 0 5px;
            transform: scaleY(1.2);
            font-family: serif;
        }

        .result-text {
            font-size: 15px;
            color: #333;
        }

        .group-angle-container {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            height: 100%;
        }

        .arrow-down {
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 140px solid #5dade2;
            margin-right: 10px;
            position: relative;
        }
        
        /* Simulating the thick blue arrow line */
        .arrow-line {
            width: 8px;
            height: 140px;
            background-color: #5dade2;
            position: absolute;
            right: 65px;
            top: 50%;
            transform: translateY(-50%);
        }
        .arrow-head {
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #5dade2;
            position: absolute;
            right: 59px;
            bottom: -15px; /* Adjust based on container */
        }

        /* Re-doing the arrow structure for better layout control */
        .main-content-area {
            position: relative;
            padding-right: 80px; /* Space for the arrow and text */
        }

        .side-arrow-group {
            position: absolute;
            right: 0;
            top: 20px; /* Align with first block */
            bottom: 20px; /* Align with second block */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
        }

        .blue-bar {
            width: 6px;
            background-color: #5dade2;
            flex-grow: 1;
            margin: 5px 0;
        }
        
        .blue-arrow-head {
            width: 0; 
            height: 0; 
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #5dade2;
        }

        .side-text {
            text-align: center;
            font-size: 14px;
            color: #333;
            margin-top: 5px;
            line-height: 1.5;
        }

        .accounting-entry {
            margin-top: 40px;
            font-size: 15px;
            color: #5c4033;
            line-height: 2;
            padding-left: 20px;
        }

        .indent {
            padding-left: 4em;
        }

        /* Cat Illustrations Placeholders */
        .cat-left {
            position: absolute;
            bottom: -10px;
            left: -10px;
            width: 120px;
            height: 100px;
        }
        
        .cat-right {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 120px;
            height: 120px;
        }

        .placeholder-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

    </style>
</head>
<body>

<div class="card">
    <!-- Decorative Paws -->
    <svg class="paw-left" viewBox="0 0 100 100">
        <path class="paw-icon" d="M50 60 C30 60 20 45 25 35 C30 25 45 30 50 40 C55 30 70 25 75 35 C80 45 70 60 50 60 Z M30 20 A8 8 0 1 1 30 19 Z M50 15 A8 8 0 1 1 50 14 Z M70 20 A8 8 0 1 1 70 19 Z M85 35 A6 6 0 1 1 85 34 Z M15 35 A6 6 0 1 1 15 34 Z"/>
    </svg>
    <svg class="paw-right" viewBox="0 0 100 100">
        <path class="paw-icon" d="M50 60 C30 60 20 45 25 35 C30 25 45 30 50 40 C55 30 70 25 75 35 C80 45 70 60 50 60 Z M30 20 A8 8 0 1 1 30 19 Z M50 15 A8 8 0 1 1 50 14 Z M70 20 A8 8 0 1 1 70 19 Z M85 35 A6 6 0 1 1 85 34 Z M15 35 A6 6 0 1 1 15 34 Z"/>
    </svg>

    <h1>内部交易抵销</h1>
    <h2>第③步：调整所得税</h2>

    <div class="highlight-badge">若实现60%对外销售</div>

    <div class="main-content-area">
        <!-- Side Arrow and Text -->
        <div class="side-arrow-group">
            <div class="blue-bar"></div>
            <div class="blue-arrow-head"></div>
            <div class="side-text" style="position: absolute; right: -60px; top: 50%; transform: translateY(-50%); width: 80px; text-align: left;">
                【集团角度】<br>调增25
            </div>
        </div>

        <!-- Block 1 -->
        <div class="section-title">个别报表层面因为存货跌价准备：</div>
        <div class="calculation-block">
            <div class="values-col">
                <div>账面价值 900</div>
                <div>计税基础 1200</div>
            </div>
            <div class="brace">}</div>
            <div class="result-text">递延所得税资产300*25%=75</div>
        </div>

        <!-- Block 2 -->
        <div class="section-title" style="margin-top: 10px;">合并报表层面因为存货跌价准备：</div>
        <div class="calculation-block">
            <div class="values-col">
                <div>账面价值 800</div>
                <div>计税基础 1200</div>
            </div>
            <div class="brace">}</div>
            <div class="result-text">递延所得税资产400*25%=100</div>
        </div>
    </div>

    <div class="accounting-entry">
        <div>会计处理：借：递延所得税资产25</div>
        <div class="indent">贷：所得税费用25</div>
    </div>

    <!-- Cat Illustrations -->
    <div class="cat-left">
        <!-- Placeholder for sleeping cat -->
        <svg viewBox="0 0 120 100" class="placeholder-img">
            <ellipse cx="60" cy="80" rx="50" ry="15" fill="#fceabb" />
            <path d="M20 70 Q10 40 40 30 Q60 20 80 30 Q110 40 100 70 Q90 90 60 90 Q30 90 20 70 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <path d="M30 40 Q20 20 40 30 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <path d="M90 40 Q100 20 80 30 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <path d="M40 60 Q50 65 60 60" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/>
            <path d="M80 60 Q70 65 60 60" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"/>
            <circle cx="60" cy="65" r="3" fill="#ffb6c1"/>
            <path d="M25 50 Q15 55 5 50" fill="none" stroke="#ccc" stroke-width="3"/>
            <path d="M25 60 Q15 65 5 60" fill="none" stroke="#ccc" stroke-width="3"/>
            <path d="M95 50 Q105 55 115 50" fill="none" stroke="#ccc" stroke-width="3"/>
            <path d="M95 60 Q105 65 115 60" fill="none" stroke="#ccc" stroke-width="3"/>
        </svg>
    </div>

    <div class="cat-right">
        <!-- Placeholder for standing cat with hat -->
        <svg viewBox="0 0 120 120" class="placeholder-img">
            <path d="M40 100 Q30 60 60 50 Q90 60 80 100 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <circle cx="60" cy="45" r="25" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <path d="M45 30 L40 15 L55 25 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <path d="M75 30 L80 15 L65 25 Z" fill="#e0e0e0" stroke="#999" stroke-width="2"/>
            <!-- Hat -->
            <ellipse cx="60" cy="25" rx="30" ry="8" fill="#d4a373" stroke="#8c6b4a" stroke-width="1"/>
            <path d="M45 25 Q60 10 75 25 Z" fill="#d4a373" stroke="#8c6b4a" stroke-width="1"/>
            <!-- Face -->
            <circle cx="50" cy="45" r="2" fill="#333"/>
            <circle cx="70" cy="45" r="2" fill="#333"/>
            <path d="M58 52 Q60 55 62 52" fill="none" stroke="#333" stroke-width="1.5"/>
            <line x1="60" y1="52" x2="60" y2="56" stroke="#333" stroke-width="1.5"/>
            <!-- Whiskers -->
            <line x1="30" y1="45" x2="45" y2="48" stroke="#ccc" stroke-width="1"/>
            <line x1="30" y1="50" x2="45" y2="50" stroke="#ccc" stroke-width="1"/>
            <line x1="90" y1="45" x2="75" y2="48" stroke="#ccc" stroke-width="1"/>
            <line x1="90" y1="50" x2="75" y2="50" stroke="#ccc" stroke-width="1"/>
            <!-- Body stripes -->
            <path d="M85 70 Q95 75 90 85" fill="none" stroke="#ccc" stroke-width="4"/>
            <path d="M80 80 Q90 85 85 95" fill="none" stroke="#ccc" stroke-width="4"/>
            <!-- Arm holding something -->
            <path d="M45 70 Q35 80 45 90" fill="none" stroke="#999" stroke-width="2"/>
            <line x1="40" y1="85" x2="60" y2="100" stroke="#8c6b4a" stroke-width="2"/>
        </svg>
    </div>

</div>

</body>
</html>
