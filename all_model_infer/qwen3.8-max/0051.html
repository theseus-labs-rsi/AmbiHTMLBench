<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The (Happiness of) Midsummer</title>
    <style>
        body {
            background-color: #f7f5f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #3b82f6;
        }

        .poster-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.1;
        }

        .title-the {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 1.4rem;
            margin-bottom: -5px;
        }

        .title-happiness {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-weight: bold;
            font-size: 2.2rem;
        }

        .title-midsummer {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 2.4rem;
            letter-spacing: 0.5px;
        }

        .meta-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding: 0 2px;
            box-sizing: border-box;
        }

        .image-placeholder {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #87CEEB; /* Sky blue fallback */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            border: 1px solid #e0e0e0;
        }

        /* Simulating the image content visually for fidelity */
        .image-content {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4a90e2 0%, #87ceeb 60%, #2c3e50 100%);
            position: relative;
        }
        
        .tree {
            position: absolute;
            right: 0;
            top: 10%;
            width: 20%;
            height: 50%;
            background-color: #2d5a27;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            opacity: 0.8;
        }

        .bridge {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 30%;
            background-color: #333;
            transform: skewY(-5deg);
            transform-origin: left;
        }

        .traffic-light {
            position: absolute;
            bottom: 25%;
            right: 15%;
            display: flex;
            gap: 5px;
        }

        .light {
            width: 15px;
            height: 30px;
            background-color: #111;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff00;
            font-family: monospace;
            font-size: 10px;
        }

        .footer-section {
            margin-top: 25px;
            text-align: center;
            width: 100%;
        }

        .chinese-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .english-subtitle {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .fine-print {
            font-size: 0.55rem;
            line-height: 1.4;
            max-width: 80%;
            margin: 0 auto;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        
        <div class="header-title">
            <div class="title-the">The</div>
            <div class="title-happiness">(Happiness of)</div>
            <div class="title-midsummer">Midsummer&reg;</div>
        </div>

        <div class="meta-row">
            <span>MOMENTS</span>
            <span>s/s 2023</span>
        </div>

        <div class="image-placeholder">
            <!-- Visual representation of the photo -->
            <div class="image-content">
                <div style="position: absolute; top: 20%; left: 10%; width: 80%; height: 40%; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);"></div>
                <div class="tree"></div>
                <div style="position: absolute; top: 45%; left: 0; width: 100%; height: 2px; background: #555; transform: rotate(-15deg);"></div>
                <div style="position: absolute; top: 48%; left: 0; width: 100%; height: 2px; background: #555; transform: rotate(-15deg);"></div>
                <div style="position: absolute; top: 46%; left: 40%; width: 60%; height: 4px; background: #777; transform: rotate(-5deg);"></div>
                
                <div class="bridge"></div>
                
                <div style="position: absolute; bottom: 20%; right: 20%; width: 15%; height: 25%; background: #888; opacity: 0.6;"></div>
                <div style="position: absolute; bottom: 20%; right: 36%; width: 10%; height: 20%; background: #777; opacity: 0.6;"></div>

                <div class="traffic-light">
                    <div class="light">01</div>
                    <div class="light">&uarr;</div>
                    <div class="light">&rarr;</div>
                </div>
            </div>
        </div>

        <div class="footer-section">
            <div class="chinese-text">&「2023仲夏 正在进行时」</div>
            <div class="english-subtitle">HAVE A GOOD ONE</div>
            <div class="fine-print">
                Thorough final do wander every where, Swifter than the moon's sphere; To dew her orbs<br>
                upon the green: The cowslips tall her pensioners be; In their gold coats spots you see; Farewell, I'll be gone
            </div>
        </div>

    </div>

</body>
</html>
