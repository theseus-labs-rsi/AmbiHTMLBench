<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富人眼中的富人是咋样？</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #1a2342; /* Dark blue base */
            background-image: radial-gradient(circle at center, #2a3b6e 0%, #0f152b 100%);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #d0d8e8;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        /* Simulating the faint background face texture with a subtle overlay if needed, 
           but CSS gradients usually suffice for the mood. 
           Adding a subtle noise or pattern could help but keeping it clean for readability. */
        
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="none"/></svg>'); 
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 30px;
            text-decoration: underline;
            text-underline-offset: 8px;
            text-decoration-thickness: 2px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ffffff;
            background-color: rgba(20, 30, 60, 0.6);
            backdrop-filter: blur(2px);
        }

        th, td {
            border: 1px solid #ffffff;
            padding: 12px 15px;
            text-align: center;
            vertical-align: middle;
            font-size: 0.95rem;
        }

        th {
            font-weight: normal;
            color: #aebbd4;
            width: 50%;
        }

        td:first-child {
            text-align: left;
            padding-left: 20px;
            color: #e0e6f0;
        }

        td:last-child {
            text-align: center;
            color: #ffffff;
        }

        .merged-row {
            text-align: right !important;
            padding-right: 20px !important;
            color: #aebbd4 !important;
            font-size: 0.9rem;
        }

        /* Specific adjustments for the merged cells to align right as in image */
        tr.merged td {
            text-align: right;
            padding-right: 20px;
            color: #c5d0e6;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Background visual placeholder for the face texture -->
        <div class="placeholder" style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; opacity: 0.15; background: radial-gradient(circle, #fff 0%, transparent 70%); border-radius: 50%; z-index: -1; filter: blur(20px);"></div>

        <h1>富人眼中的富人是咋样？</h1>

        <table>
            <thead>
                <tr>
                    <th>问题</th>
                    <th>回答</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1.您觉得高净值人群资产拥有多少钱才算是?</td>
                    <td>1亿7,388.4万元</td>
                </tr>
                <tr class="merged">
                    <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
                </tr>
                <tr>
                    <td>2.请问您每天工作小时数是?</td>
                    <td>8.2小时</td>
                </tr>
                <tr>
                    <td>3.您预计退休年龄?</td>
                    <td>59岁</td>
                </tr>
                <tr>
                    <td>4.您希望能活到多少岁?</td>
                    <td>88.2岁</td>
                </tr>
                <tr class="merged">
                    <td colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
                </tr>
                <tr>
                    <td>5.请问您曾去过国家数量（包括商务出差）</td>
                    <td>6.2个国家</td>
                </tr>
                <tr>
                    <td>6.请问您平均每月阅读书籍数量</td>
                    <td>2.4本书</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
