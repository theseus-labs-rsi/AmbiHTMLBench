<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为新疆人民打出一个民主联合政府</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#f4f4f4;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#2b2b2b;}
  .band{
    height:90px;
    background-color:#3d4e69;
    background-image:
      radial-gradient(circle at 50% 100%, rgba(0,0,0,0) 0 24%, #16181c 24% 30%, rgba(0,0,0,0) 30% 46%, #16181c 46% 52%, rgba(0,0,0,0) 52% 68%, #16181c 68% 74%, rgba(0,0,0,0) 74% 100%),
      radial-gradient(circle at 50% 100%, rgba(0,0,0,0) 0 24%, #16181c 24% 30%, rgba(0,0,0,0) 30% 46%, #16181c 46% 52%, rgba(0,0,0,0) 52% 68%, #16181c 68% 74%, rgba(0,0,0,0) 74% 100%);
    background-size:62px 31px;
    background-position:0 0, 31px 16px;
    background-repeat:repeat;
  }
  .band.bottom{height:70px;}
  .page{max-width:600px;margin:0 auto;padding:30px 22px 6px 22px;box-sizing:border-box;}
  .heading{font-size:20px;font-weight:700;color:#111;margin:14px 0 44px 0;letter-spacing:1px;}
  .para{font-size:17px;line-height:2.0;margin:0 0 36px 0;text-align:justify;}
  .red-line{display:inline-block;border-bottom:5px solid #d40000;padding-bottom:3px;line-height:1.7;}
  .brush-stroke{width:265px;height:8px;background:#d40000;border-radius:5px;margin:4px 0 14px 0;}
</style>
</head>
<body>
  <div class="band top"></div>
  <main class="page">
    <h2 class="heading">2、为新疆人民打出一个民主联合政府</h2>
    <p class="para">
      受到长期迫害的新疆各族人民奋勇反抗，发动了伊犁、<br>
      塔城、阿山三区人民革命。革命军队很快占领了以上三<br>
      个地区，成立了临时革命政府。
    </p>
    <p class="para">
      三区人民革命让盛世才感受到了各族人民抗争的力量，<br>
      最终在革命力量和国民政府的双重压力下败走新疆。<br>
      1945年日本投降以后，国民政府在全国各族人民的多<br>
      方压力下，与临时革命政府开启谈判，假借谈判的手段<br>
      分化瓦解革命力量。
    </p>
    <p class="para" style="margin-bottom:6px;">
      <span class="red-line">恐怕谈判桌上的所有人都不会想到，赛福鼎以后会成为</span><br>
      <span class="red-line">新中国的副国级领导人。</span>
    </p>
    <div class="brush-stroke"></div>
  </main>
  <div class="band bottom"></div>
</body>
</html>
