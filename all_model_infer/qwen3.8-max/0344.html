<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 850px;
        }
        h1 {
            font-size: 28px;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            color: #333;
        }
        th, td {
            border: 1px solid #a0a0a0;
            padding: 12px 10px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #eef2f5;
            font-weight: bold;
            color: #333;
        }
        /* Alternating row colors based on the image */
        tr:nth-child(even) td {
            background-color: #eef2f7; /* Light blue-grey for even rows (2, 4, 6 in data, but header is row 1) */
        }
        tr:nth-child(odd) td {
            background-color: #ffffff; /* White for odd rows */
        }
        
        /* Specific column widths to match visual proportion */
        th:nth-child(1), td:nth-child(1) { width: 8%; }
        th:nth-child(2), td:nth-child(2) { width: 18%; }
        th:nth-child(3), td:nth-child(3) { width: 12%; }
        th:nth-child(4), td:nth-child(4) { width: 25%; }
        th:nth-child(5), td:nth-child(5) { width: 15%; }
        th:nth-child(6), td:nth-child(6) { width: 22%; }

    </style>
</head>
<body>

<div class="container">
    <h1>一月-任务</h1>
    
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>任务描述</th>
                <th>岗位</th>
                <th>操作动作</th>
                <th>开始时间</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>租厂房</td>
                <td>总经理</td>
                <td>申请60w 租厂房</td>
                <td>1月1日</td>
                <td>花60w租A厂房</td>
            </tr>
            <tr>
                <td>2</td>
                <td>资质开发</td>
                <td>总经理</td>
                <td>P3资质开发</td>
                <td>1月1日</td>
                <td>申请20w 资质开发</td>
            </tr>
            <tr>
                <td>3</td>
                <td>批拨款</td>
                <td>财务</td>
                <td>批准</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>支付管理费</td>
                <td>财务</td>
                <td>5w管理费</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>5</td>
                <td>建设生产线</td>
                <td>生产</td>
                <td>4条自动线生产P3</td>
                <td>1月1日</td>
                <td>申请200w资金建线</td>
            </tr>
            <tr>
                <td>6</td>
                <td>iso开发</td>
                <td>总经理</td>
                <td>两个iso的开发</td>
                <td>1月1日</td>
                <td>申请资金开发</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
