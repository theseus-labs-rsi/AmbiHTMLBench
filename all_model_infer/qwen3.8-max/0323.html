<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何避免/减少巴纳姆效应？</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e3; /* Light cream background */
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 600px; /* Approximate aspect ratio of the image */
            background-color: #fdf6e3;
            position: relative;
            padding: 20px 40px 60px 40px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Top Right Badge */
        .badge-container {
            position: absolute;
            top: 0;
            right: 40px;
            z-index: 10;
        }

        .badge {
            background-color: #d4a017; /* Gold/Mustard color */
            color: white;
            width: 50px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            font-size: 18px;
            font-weight: bold;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
            line-height: 1.2;
        }

        /* Rainbow Arc Background */
        .rainbow-bg {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 300px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }
        
        .arc {
            position: absolute;
            border-radius: 50%;
            border-top: 12px solid transparent;
            width: 80%;
            height: 200px;
            left: 10%;
        }

        .arc-1 { top: 0; border-color: #a8d5ba transparent transparent transparent; width: 90%; left: 5%; height: 220px; }
        .arc-2 { top: 15px; border-color: #f4c2c2 transparent transparent transparent; width: 80%; left: 10%; height: 200px; }
        .arc-3 { top: 30px; border-color: #fce38a transparent transparent transparent; width: 70%; left: 15%; height: 180px; }
        .arc-4 { top: 45px; border-color: #e2f0cb transparent transparent transparent; width: 60%; left: 20%; height: 160px; }

        /* Content Styling */
        .content {
            position: relative;
            z-index: 1;
            margin-top: 80px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #000;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .list-item {
            margin-bottom: 20px;
            font-size: 18px;
            line-height: 1.6;
            text-align: justify;
        }

        .highlight {
            color: #d4a017; /* Gold color for highlights */
            font-weight: bold;
        }

        /* Watermarks */
        .watermark {
            position: absolute;
            color: rgba(0, 0, 0, 0.1);
            font-size: 16px;
            transform: rotate(-30deg);
            pointer-events: none;
            z-index: 0;
        }

        .wm-1 { top: 30%; left: 40%; }
        .wm-2 { bottom: 10%; right: 20%; font-size: 20px; }
        .wm-3 { bottom: 35%; left: 10%; }

    </style>
</head>
<body>

<div class="page-container">
    
    <!-- Top Right Badge -->
    <div class="badge-container">
        <div class="badge">
            <span>心</span>
            <span>理</span>
        </div>
    </div>

    <!-- Decorative Rainbow Arcs -->
    <div class="rainbow-bg">
        <div class="arc arc-1"></div>
        <div class="arc arc-2"></div>
        <div class="arc arc-3"></div>
        <div class="arc arc-4"></div>
    </div>

    <!-- Watermarks -->
    <div class="watermark wm-1">@小颖</div>
    <div class="watermark wm-2">PPT by @</div>
    <div class="watermark wm-3">@</div>

    <!-- Main Content -->
    <div class="content">
        <h1>如何避免/减少巴纳姆效应？</h1>

        <div class="list-item">
            1、要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。
        </div>

        <div class="list-item">
            2、我们的自我认知往往是主观的，我们需要保持<span class="highlight">谦虚和开放</span>的心态，不要<span class="highlight">过分自信或者自卑。</span>我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。
        </div>

        <div class="list-item">
            3、<span class="highlight">听取他人的评价。</span>全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。
        </div>

        <div class="list-item">
            4、我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要<span class="highlight">学会辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。
        </div>
    </div>

</div>

</body>
</html>
