<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝体质特点&奶粉选购</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #3b7bc6; /* Outer blue background */
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #3b7bc6;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin: 10px 0 20px 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .card {
            background-color: #eef4fb; /* Light blue/white inner background */
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section-header {
            background-color: #4a90e2;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .star-icon {
            color: #ffd700;
            margin-right: 8px;
            font-size: 22px;
        }

        /* Top Section: Icons Grid */
        .features-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 22%;
        }

        .icon-placeholder {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }
        
        /* Simulating the illustrations with CSS shapes/text for fidelity without external images */
        .ill-baby-1::after { content: "👶"; font-size: 40px; opacity: 0.8; }
        .ill-gut::after { content: "🌀"; font-size: 40px; color: #e67e22; opacity: 0.8; }
        .ill-baby-2::after { content: "😭"; font-size: 40px; opacity: 0.8; }
        .ill-baby-3::after { content: "😴"; font-size: 40px; opacity: 0.8; }

        .feature-label {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        /* Bottom Section: List */
        .list-item {
            margin-bottom: 15px;
        }

        .list-title {
            color: #4a90e2;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }
        
        .list-title span {
            background-color: #dcebf7;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 5px;
            /* Creating the outlined number effect roughly */
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
            color: #4a90e2;
            border: 1px solid #4a90e2;
        }

        .list-content {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            padding-left: 5px;
        }

        .highlight {
            color: #4a90e2;
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="main-title">宝宝体质特点&奶粉选购</div>

    <!-- Section 1 -->
    <div class="card">
        <div class="section-header">
            <span class="star-icon">★</span> 新生儿宝宝的体质有哪些特点？
        </div>
        
        <div class="features-grid">
            <div class="feature-item">
                <div class="icon-placeholder ill-baby-1">
                    <!-- Placeholder for baby holding stomach -->
                </div>
                <div class="feature-label">肚肚脆弱</div>
            </div>
            <div class="feature-item">
                <div class="icon-placeholder ill-gut">
                    <!-- Placeholder for intestine -->
                </div>
                <div class="feature-label">吸收差</div>
            </div>
            <div class="feature-item">
                <div class="icon-placeholder ill-baby-2">
                    <!-- Placeholder for crying baby -->
                </div>
                <div class="feature-label">体质差</div>
            </div>
            <div class="feature-item">
                <div class="icon-placeholder ill-baby-3">
                    <!-- Placeholder for sleeping/sick baby -->
                </div>
                <div class="feature-label">体质敏感</div>
            </div>
        </div>
    </div>

    <!-- Section 2 -->
    <div class="card">
        <div class="section-header">
            <span class="star-icon">★</span> 选择奶粉的时候要选哪种？
        </div>

        <div class="list-item">
            <div class="list-title"><span>1.</span>奶源纯净安全的</div>
            <div class="list-content">
                建议<span class="highlight">优选有机的奶源</span>，从牧场到加工都满足有机生产的要求，从源头更安全。
            </div>
        </div>

        <div class="list-item">
            <div class="list-title"><span>2.</span>低敏不刺激的</div>
            <div class="list-content">
                新生宝宝的肚肚娇弱，选择<span class="highlight">A2蛋白</span>的A2奶源更亲和宝宝小肚肚，不会刺激小肚肚从而引起肚肚不适。
            </div>
        </div>

        <div class="list-item">
            <div class="list-title"><span>3.</span>好消化吸收的</div>
            <div class="list-content">
                看奶粉的成分中是否包含助力宝宝吸收的<span class="highlight">益生菌和益生元</span>成分，这些都是可以帮助宝宝更好吸收营养的。
            </div>
        </div>

        <div class="list-item">
            <div class="list-title"><span>4.</span>味道清淡，口感蓬松细腻的</div>
            <div class="list-content">
                新生宝宝更适合<span class="highlight">口味清淡</span>的奶粉哦~
            </div>
        </div>
    </div>
</div>

</body>
</html>
