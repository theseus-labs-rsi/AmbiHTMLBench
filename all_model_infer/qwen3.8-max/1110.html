<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok运营 48个必备工具</title>
    <style>
        body {
            background-color: #2c4a36;
            color: #ffffff;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 48px;
            line-height: 1.3;
            margin: 0 0 30px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .tag {
            background-color: #eeb111;
            color: #ffffff;
            display: inline-block;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 40px;
            border-radius: 2px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 15px;
        }

        .box {
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .box-olive {
            background-color: #798c63;
        }

        .box-green {
            background-color: #568f56;
        }

        .part-label {
            font-size: 16px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .part-content {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* Grid Placements */
        .item-01 { grid-column: 1 / 2; grid-row: 1 / 3; }
        .item-02 { grid-column: 2 / 3; grid-row: 1 / 2; }
        .item-03 { grid-column: 2 / 3; grid-row: 2 / 3; }
        .item-04 { grid-column: 1 / 3; grid-row: 3 / 4; }
        
        .item-05 { grid-column: 3 / 5; grid-row: 1 / 2; }
        .item-06 { grid-column: 3 / 4; grid-row: 2 / 4; }
        .item-07 { grid-column: 4 / 5; grid-row: 2 / 3; }
        .item-08 { grid-column: 4 / 5; grid-row: 3 / 4; }

    </style>
</head>
<body>

<div class="container">
    <h1>TikTok运营<br>48个必备工具</h1>
    
    <div class="tag">@ 徐徐教你做TikTok</div>

    <div class="grid-layout">
        <!-- Part 01 -->
        <div class="box box-olive item-01">
            <div class="part-label">Part 01</div>
            <div class="part-content">7个TK<br>数据平台</div>
        </div>

        <!-- Part 02 -->
        <div class="box box-olive item-02">
            <div class="part-label">Part 02</div>
            <div class="part-content">3个好用<br>选品网站</div>
        </div>

        <!-- Part 05 -->
        <div class="box box-green item-05">
            <div class="part-label">Part 05</div>
            <div class="part-content">4个剪辑<br>4个翻译软件</div>
        </div>

        <!-- Part 03 -->
        <div class="box box-olive item-03">
            <div class="part-label">Part 03</div>
            <div class="part-content">5个视频<br>素材网站</div>
        </div>

        <!-- Part 06 -->
        <div class="box box-green item-06">
            <div class="part-label">Part 06</div>
            <div class="part-content">8个TK<br>传输管理<br>网站</div>
        </div>

        <!-- Part 07 -->
        <div class="box box-green item-07">
            <div class="part-label">Part 07</div>
            <div class="part-content">5个BGM<br>网站</div>
        </div>

        <!-- Part 04 -->
        <div class="box box-olive item-04">
            <div class="part-label">Part 04</div>
            <div class="part-content">6个TK数据分析网站</div>
        </div>

        <!-- Part 08 -->
        <div class="box box-green item-08">
            <div class="part-label">Part 08</div>
            <div class="part-content">7个投放<br>联盟网站</div>
        </div>
    </div>
</div>

</body>
</html>
