<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句合集</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            color: #d4a017; /* Golden yellow color matching the image */
            font-size: 18px;
            font-weight: 500;
        }

        .back-icon {
            font-size: 20px;
            margin-right: 8px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            fill: #d4a017;
            cursor: pointer;
        }

        /* Content Styles */
        .content {
            padding: 20px 24px 40px 24px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .check-icon {
            width: 24px;
            height: 24px;
            background-color: #f5b800; /* Yellow/Orange circle */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .check-icon svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .title-text {
            font-size: 19px;
            font-weight: bold;
            color: #333333;
            letter-spacing: 0.5px;
        }

        .quote-body {
            font-size: 17px;
            line-height: 1.8;
            color: #4a4a4a;
            text-align: justify;
            padding-left: 4px; /* Slight indent to align with text, not icon */
        }

        .quote-source {
            display: block;
            margin-top: 5px;
        }
        
        /* Specific adjustment for the second quote source which is inline in the image */
        .inline-source {
            display: inline;
        }

    </style>
</head>
<body>

<div class="mobile-container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="back-icon">&lt;</span>
            <span>金句合集</span>
        </div>
        <div class="header-right">
            <!-- User/Group Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                <circle cx="12" cy="8" r="3" fill="#d4a017" opacity="0.5"/> <!-- Approximation of the specific icon style -->
            </svg>
            <!-- Share Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
            </svg>
            <!-- More Icon -->
            <svg class="icon-btn" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="none"/>
                <circle cx="12" cy="12" r="10" stroke="#d4a017" stroke-width="2" fill="none"/>
                <circle cx="8" cy="12" r="1.5" fill="#d4a017"/>
                <circle cx="12" cy="12" r="1.5" fill="#d4a017"/>
                <circle cx="16" cy="12" r="1.5" fill="#d4a017"/>
            </svg>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        
        <!-- Section 1 -->
        <div class="section">
            <div class="section-title">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <div class="title-text">他写「成长」，正是你所亲历</div>
            </div>
            <div class="quote-body">
                “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”
                <span class="quote-source">——《病隙碎笔》</span>
            </div>
        </div>

        <!-- Section 2 -->
        <div class="section">
            <div class="section-title">
                <div class="check-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <div class="title-text">他写「磨难」，报之以歌</div>
            </div>
            <div class="quote-body">
                “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”<span class="inline-source">——《好运设计》</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
