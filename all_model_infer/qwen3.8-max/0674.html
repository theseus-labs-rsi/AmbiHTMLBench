<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海牙体系概况</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px 60px;
            box-sizing: border-box;
        }

        /* Watermark simulation */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 48px;
            color: rgba(0, 0, 0, 0.05);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            width: 150%;
            text-align: center;
            line-height: 1.5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 42px;
            color: #c0504d;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            background-color: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 5px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin-right: 10px;
            /* Placeholder for the logo graphic */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #003366;
            font-size: 24px;
            font-style: italic;
            border-right: 2px solid #ccc;
            padding-right: 10px;
        }
        
        .logo-icon span {
            color: #c0504d;
            font-size: 16px;
            position: absolute;
            margin-left: -20px;
            margin-top: -10px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 28px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            letter-spacing: 4px;
        }

        .logo-url {
            font-size: 14px;
            color: #ffffff;
            text-align: right;
            margin-top: 2px;
        }

        .section-title {
            font-size: 32px;
            color: #1f497d;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .square-bullet {
            width: 18px;
            height: 18px;
            background-color: #1f497d;
            display: inline-block;
            margin-right: 15px;
        }

        .comparison-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            padding: 0 40px;
        }

        .column {
            width: 45%;
        }

        .col-header {
            font-size: 30px;
            color: #c0504d;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            font-size: 26px;
            color: #c0504d;
            line-height: 1.4;
        }

        .circle-bullet {
            width: 14px;
            height: 14px;
            background-color: #c0504d;
            border-radius: 50%;
            display: inline-block;
            margin-right: 15px;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .footer-text {
            font-size: 26px;
            color: #1f497d;
            line-height: 1.6;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
        }

        .footer-text .highlight {
            color: #c0504d;
            font-weight: bold;
        }

        .page-number {
            position: absolute;
            bottom: 30px;
            right: 50px;
            font-size: 20px;
            color: #666;
            z-index: 1;
        }

    </style>
</head>
<body>

<div class="slide-container">
    <!-- Watermark Layer -->
    <div class="watermark">
        仅供学习交流使用 禁止用于商业用途<br>
        仅供学习交流使用 禁止用于商业用途
    </div>

    <!-- Header -->
    <div class="header">
        <div class="title">海牙体系概况</div>
        <div class="logo-area">
            <div class="logo-icon">
                <span>★</span>P
            </div>
            <div class="logo-text">
                <div class="logo-title">公益讲座</div>
                <div class="logo-url">www.cnipa.gov.cn/wxfw</div>
            </div>
        </div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
        <span class="square-bullet"></span>海牙体系的优势
    </div>

    <!-- Comparison Columns -->
    <div class="comparison-container">
        <!-- Left Column -->
        <div class="column">
            <div class="col-header">国家或地区途径</div>
            
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>向多个局分别提交申请</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>撰写多种语言的文本</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>使用多种货币缴费</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>分别注册</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>分别办理续展</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>提交申请即需委托当地<br>代理机构</span>
            </div>
        </div>

        <!-- Right Column -->
        <div class="column">
            <div class="col-header">海牙途径</div>
            
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>向一个局提交申请</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>撰写一种语言（英/法/西）文本</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>使用一种货币（瑞士法郎）缴费</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>国际注册</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>统一办理续展</span>
            </div>
            <div class="list-item">
                <span class="circle-bullet"></span>
                <span>驳回时才需委托当地代理机构</span>
            </div>
        </div>
    </div>

    <!-- Footer Text -->
    <div class="footer-text">
        <span class="square-bullet" style="margin-top: 8px;"></span>
        <span>如果需要在<span class="highlight">多个</span>国家或地区获得外观设计专利权，通过海牙途径提交国际申请代替原本向不同国家或地区局提交一系列申请，可以节约工作量、时间和费用。</span>
    </div>

    <!-- Page Number -->
    <div class="page-number">8</div>
</div>

</body>
</html>
