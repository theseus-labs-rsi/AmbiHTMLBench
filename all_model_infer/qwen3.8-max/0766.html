<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三天路线规划</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #fdfdfd;
            /* Simulating the grid paper background */
            background-image: 
                linear-gradient(#e5e5e5 1px, transparent 1px),
                linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
            background-size: 25px 25px;
            font-family: "Microsoft YaHei", "PingFang SC", "Heiti SC", sans-serif;
            color: #000;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .main-title {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .main-title .blue-text {
            color: #0033cc;
        }

        .main-title .black-text {
            color: #000;
        }

        .timeline-row {
            display: flex;
            align-items: stretch;
            margin-bottom: 5px;
        }

        /* Left Column: The vertical path */
        .left-col {
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .day-badge {
            background-color: #a8e6cf;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            padding: 4px 24px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .arrow-down {
            color: #ffcc00;
            font-size: 36px;
            line-height: 1;
            margin: 2px 0;
            text-shadow: 1px 1px 0px #d4a000; /* Slight depth */
        }

        .location-name {
            font-size: 26px;
            font-weight: bold;
            margin: 8px 0;
            text-align: center;
        }

        .transport-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 4px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .tag-pink {
            background-color: #ffe4e1;
            padding: 2px 8px;
            border-radius: 2px;
        }

        .time-text {
            color: #000;
        }

        /* Right Column: The description boxes */
        .right-col {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 15px;
        }

        .desc-box {
            border: 3px solid #8b0000;
            background-color: rgba(255, 255, 255, 0.85); /* Slight transparency to see grid faintly if needed, or solid white */
            background-color: #fff;
            padding: 12px 15px;
            font-size: 18px;
            line-height: 1.5;
            color: #333;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .desc-box strong {
            color: #0033cc;
            font-weight: bold;
        }

        /* Specific adjustments for alignment */
        .row-start {
            align-items: flex-start;
        }
        
        .spacer-top {
            height: 48px; /* Aligns with the badge height roughly */
        }

    </style>
</head>
<body>

<div class="container">
    <div class="main-title">
        <span class="blue-text">第三天</span><span class="black-text">路线规划</span>
    </div>

    <!-- Row 1: Start / Ciqikou -->
    <div class="timeline-row">
        <div class="left-col">
            <div class="day-badge">第三天</div>
            <div class="arrow-down">⬇</div>
            <div class="location-name">磁器口</div>
        </div>
        <div class="right-col">
            <div class="desc-box">
                <span><strong>磁器口（免费）：</strong>汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌</span>
            </div>
        </div>
    </div>

    <!-- Row 2: Transport to Luo Zhongli -->
    <div class="timeline-row">
        <div class="left-col">
            <div class="transport-info">
                <span class="tag-pink">1号线</span>
                <span class="arrow-down" style="font-size: 28px;">⬇</span>
                <span class="time-text">30分钟</span>
            </div>
            <div class="location-name">罗中立美术馆</div>
        </div>
        <div class="right-col">
            <div class="desc-box">
                <span><strong>罗中立美术馆（免费）：</strong>拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服</span>
            </div>
        </div>
    </div>

    <!-- Row 3: Transport to Mountain City Step -->
    <div class="timeline-row">
        <div class="left-col">
            <div class="transport-info">
                <span class="tag-pink">1号线</span>
                <span class="arrow-down" style="font-size: 28px;">⬇</span>
                <span class="time-text">80分钟</span>
            </div>
            <div class="location-name">山城步道</div>
        </div>
        <div class="right-col">
            <div class="desc-box">
                <span><strong>山城步道（免费）：</strong>建在悬崖边的临江步道，汇聚老重庆特色步道</span>
            </div>
        </div>
    </div>

    <!-- Row 4: Transport to Guanyinqiao -->
    <div class="timeline-row">
        <div class="left-col">
            <div class="transport-info">
                <span class="tag-pink">公交</span>
                <span class="arrow-down" style="font-size: 28px;">⬇</span>
                <span class="time-text">32分钟</span>
            </div>
            <div class="location-name">观音桥</div>
        </div>
        <div class="right-col">
            <div class="desc-box">
                <span><strong>观音桥（免费）：</strong>超大商圈，还有很多地道重庆小吃</span>
            </div>
        </div>
    </div>

    <!-- Row 5: Transport to Jiu Jie -->
    <div class="timeline-row">
        <div class="left-col">
            <div class="transport-info">
                <span class="tag-pink">步行</span>
                <span class="arrow-down" style="font-size: 28px;">⬇</span>
                <span class="time-text">15分钟</span>
            </div>
            <div class="location-name">九街</div>
        </div>
        <div class="right-col">
            <div class="desc-box">
                <span><strong>九街（免费）：</strong>酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有</span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
