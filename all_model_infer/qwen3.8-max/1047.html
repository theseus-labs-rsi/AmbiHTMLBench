<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            background-color: #dcbfb6; /* Approximate pinkish-beige background */
            background-image: radial-gradient(#cbb0a7 1px, transparent 1px);
            background-size: 4px 4px; /* Subtle texture simulation */
            font-family: "SimSun", "Songti SC", "STSong", serif;
            color: #2b2b2b;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            max-width: 800px;
            width: 100%;
            gap: 20px;
        }

        /* Vertical Banners on the Left */
        .sidebar {
            display: flex;
            flex-direction: row;
            gap: 10px;
            flex-shrink: 0;
        }

        .banner {
            background-color: #333333;
            color: #e0e0e0;
            writing-mode: vertical-rl;
            text-orientation: upright;
            padding: 15px 10px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            border-radius: 2px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            height: fit-content;
            min-height: 300px; /* Ensure they look like long banners */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content Area */
        .content {
            flex-grow: 1;
            font-size: 18px;
            line-height: 1.8;
            padding-top: 10px;
            border-right: 2px solid #555; /* The vertical line on the far right */
            padding-right: 15px;
        }

        .paragraph {
            margin-bottom: 25px;
            text-align: justify;
            text-indent: 2em;
        }

        .source-line {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            text-indent: 0;
        }

        .recipe-title {
            font-weight: bold;
        }

        /* Specific styling for the first paragraph to match indentation visually if needed, 
           though standard text-indent handles most Chinese formatting */
        .intro-text {
            text-indent: 2em;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side: Vertical Banners -->
        <div class="sidebar">
            <div class="banner">福国王夫人震怒欲逐之</div>
            <div class="banner">国朝妻管严疑有私生子</div>
        </div>

        <!-- Right Side: Main Text -->
        <div class="content">
            <div class="paragraph intro-text">
                瞳孔地震！将王安石抬进孔庙的好女婿蔡卞近日疑似陷入私生子风波。蔡卞妻福国夫人王氏闻之震怒，欲除妾生子，因故生病。
            </div>

            <div class="paragraph source-line">
                本消息来自翰林医官院药方笔录：
            </div>

            <div class="paragraph">
                <span class="recipe-title">《香术散》</span>：治妊娠五个月已后。常胸腹间气刺满痛，或肠鸣，以至呕逆减食。此由喜怒忧虑过度、饮食失节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病。医官王师复处此方三服而愈，后用果验。
            </div>
        </div>
    </div>

</body>
</html>
