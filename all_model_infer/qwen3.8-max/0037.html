<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学语文期末质量分析会</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f0f0;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            display: flex;
            justify-content: center;
        }

        .slide-container {
            width: 600px;
            height: 600px;
            background: linear-gradient(to bottom, #eef5f0 0%, #fdfbf7 40%, #fdfbf7 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Decorative Elements Placeholders */
        .deco-top-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 180px;
            height: 120px;
            z-index: 1;
        }
        
        .deco-mid-left {
            position: absolute;
            top: 220px;
            left: 0;
            width: 200px;
            height: 120px;
            z-index: 1;
        }

        .placeholder-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
            text-align: center;
            opacity: 0.7;
        }

        /* Watermark styling simulation */
        .watermark {
            position: absolute;
            color: rgba(0, 0, 0, 0.6);
            font-weight: bold;
            font-size: 14px;
            transform: rotate(-45deg);
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 0px white;
        }
        .wm-1 { top: 60px; right: 80px; }
        .wm-2 { top: 160px; left: 120px; }
        .wm-3 { top: 310px; left: 180px; }

        /* Header Section */
        .header-section {
            margin-top: 50px;
            text-align: center;
            z-index: 2;
            width: 100%;
        }

        .subtitle-date {
            color: #1a4b8c;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .main-title {
            color: #1a4b8c;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .meeting-title {
            color: #d32f2f;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .school-name {
            color: #1a4b8c;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .author-name {
            color: #1a4b8c;
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Middle Section Title */
        .section-title-wrapper {
            position: relative;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 30px;
            z-index: 2;
        }

        .section-title {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
            position: relative;
        }
        
        /* Yellow highlight effect behind text */
        .section-title::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: #ffeb3b;
            opacity: 0.6;
            z-index: -1;
            transform: translateY(-50%) rotate(-2deg);
        }

        /* Flowchart Section */
        .flowchart-container {
            width: 90%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .flow-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .flow-box {
            background-color: #00796b;
            color: white;
            padding: 8px 5px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            width: 22%;
            clip-path: polygon(0% 0%, 90% 0%, 100% 50%, 90% 100%, 0% 100%, 10% 50%);
            /* Adjusting clip path for first and last might be needed but keeping uniform for simplicity based on image */
        }
        
        /* Specific adjustments for arrows shape */
        .arrow-box {
            background-color: #00796b;
            color: white;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            width: 23%;
            position: relative;
            margin-right: 5px;
        }
        
        .arrow-box::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 10px solid #00796b;
        }
        
        .arrow-box::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 10px solid #fdfbf7; /* Match background */
        }
        
        .arrow-box:first-child::before {
            border-left: none;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-card {
            width: 23%;
            border: 2px solid #00796b;
            border-radius: 10px;
            padding: 10px 8px;
            background-color: rgba(255,255,255,0.6);
            position: relative;
            font-size: 12px;
            color: #333;
            line-height: 1.5;
            text-align: justify;
        }

        /* Triangle pointer on top of cards */
        .detail-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 10px solid #00796b;
        }
        
        .detail-card::after {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid #fdfbf7;
        }

    </style>
</head>
<body>

<div class="slide-container">
    <!-- Decorative Images -->
    <div class="deco-top-right">
        <div class="placeholder-img">[Leaves Graphic]</div>
    </div>
    <div class="deco-mid-left">
        <div class="placeholder-img">[Lotus & Bird Graphic]</div>
    </div>

    <!-- Watermarks -->
    <div class="watermark wm-1">@海淀小萌</div>
    <div class="watermark wm-2">@海淀小萌</div>
    <div class="watermark wm-3">@海淀小萌</div>

    <!-- Header Content -->
    <div class="header-section">
        <div class="subtitle-date">2022--2023学年第二学期</div>
        <div class="main-title">追光而遇有思&nbsp;&nbsp;&nbsp;沐光而行致远</div>
        <div class="meeting-title">小学语文期末质量分析会</div>
        <div class="school-name">红薯街道实验XXXX</div>
        <div class="author-name">海淀小萌</div>
    </div>

    <!-- Section Title -->
    <div class="section-title-wrapper">
        <div class="section-title">期末考试成绩</div>
    </div>

    <!-- Flowchart Content -->
    <div class="flowchart-container">
        <!-- Top Row: Arrows -->
        <div class="flow-row">
            <div class="arrow-box">注重基础和积累</div>
            <div class="arrow-box">重视运用</div>
            <div class="arrow-box">联系生活原则</div>
            <div class="arrow-box" style="margin-right: 0;">难易程度适中</div>
        </div>

        <!-- Bottom Row: Detail Cards -->
        <div class="details-row">
            <div class="detail-card">
                尤其是古诗文和名言警句积累占的比例很大，反映了对传统文化的重视。
            </div>
            <div class="detail-card">
                突出能力，重视运用。阅读题体现了核心素养中重视思维发展与提升的要求。
            </div>
            <div class="detail-card">
                写作的安排正是学生生活中外出的经历，易于选材，适合个性发展。
            </div>
            <div class="detail-card">
                只要认真积累和复习的孩子基本上可以取得不错的成绩。
            </div>
        </div>
    </div>

</div>

</body>
</html>
