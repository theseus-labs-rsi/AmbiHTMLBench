<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2017 校园艺术节 - Art Festival Poster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg-color: #f4f1ea;
            --ink-blue: #1a237e;
            --text-black: #111;
            --paper-texture: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjRmMWVhIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNlOGU0ZDkiIG9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=');
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
        }

        .poster-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 3;
            background-color: var(--bg-color);
            background-image: var(--paper-texture);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: var(--text-black);
        }

        /* Graphic Elements */
        .spiral-top-right {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 50%;
            height: 40%;
            background: radial-gradient(circle at 70% 30%, transparent 10%, var(--ink-blue) 11%, transparent 12%, transparent 14%, var(--ink-blue) 15%, transparent 16%, transparent 18%, var(--ink-blue) 19%, transparent 20%, transparent 22%, var(--ink-blue) 23%, transparent 24%, transparent 26%, var(--ink-blue) 27%, transparent 28%, transparent 30%, var(--ink-blue) 31%, transparent 32%, transparent 34%, var(--ink-blue) 35%, transparent 36%, transparent 38%, var(--ink-blue) 39%, transparent 40%, transparent 42%, var(--ink-blue) 43%, transparent 44%, transparent 46%, var(--ink-blue) 47%, transparent 48%, transparent 50%, var(--ink-blue) 51%, transparent 52%, transparent 54%, var(--ink-blue) 55%, transparent 56%, transparent 58%, var(--ink-blue) 59%, transparent 60%, transparent 62%, var(--ink-blue) 63%, transparent 64%, transparent 66%, var(--ink-blue) 67%, transparent 68%, transparent 70%, var(--ink-blue) 71%, transparent 72%, transparent 74%, var(--ink-blue) 75%, transparent 76%, transparent 78%, var(--ink-blue) 79%, transparent 80%, transparent 82%, var(--ink-blue) 83%, transparent 84%, transparent 86%, var(--ink-blue) 87%, transparent 88%, transparent 90%, var(--ink-blue) 91%, transparent 92%, transparent 94%, var(--ink-blue) 95%, transparent 96%);
            border-radius: 50%;
            transform: rotate(-20deg);
            opacity: 0.9;
            z-index: 1;
        }

        .spiral-bottom-left {
            position: absolute;
            bottom: -5%;
            left: -10%;
            width: 60%;
            height: 45%;
            background: radial-gradient(circle at 30% 70%, transparent 5%, var(--ink-blue) 6%, transparent 7%, transparent 9%, var(--ink-blue) 10%, transparent 11%, transparent 13%, var(--ink-blue) 14%, transparent 15%, transparent 17%, var(--ink-blue) 18%, transparent 19%, transparent 21%, var(--ink-blue) 22%, transparent 23%, transparent 25%, var(--ink-blue) 26%, transparent 27%, transparent 29%, var(--ink-blue) 30%, transparent 31%, transparent 33%, var(--ink-blue) 34%, transparent 35%, transparent 37%, var(--ink-blue) 38%, transparent 39%, transparent 41%, var(--ink-blue) 42%, transparent 43%, transparent 45%, var(--ink-blue) 46%, transparent 47%, transparent 49%, var(--ink-blue) 50%, transparent 51%, transparent 53%, var(--ink-blue) 54%, transparent 55%, transparent 57%, var(--ink-blue) 58%, transparent 59%, transparent 61%, var(--ink-blue) 62%, transparent 63%, transparent 65%, var(--ink-blue) 66%, transparent 67%, transparent 69%, var(--ink-blue) 70%, transparent 71%, transparent 73%, var(--ink-blue) 74%, transparent 75%, transparent 77%, var(--ink-blue) 78%, transparent 79%, transparent 81%, var(--ink-blue) 82%, transparent 83%, transparent 85%, var(--ink-blue) 86%, transparent 87%, transparent 89%, var(--ink-blue) 90%, transparent 91%, transparent 93%, var(--ink-blue) 94%, transparent 95%);
            border-radius: 50%;
            transform: rotate(15deg);
            opacity: 0.9;
            z-index: 1;
        }

        /* Layout Grid */
        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: grid;
            grid-template-columns: 25% 35% 40%;
            grid-template-rows: 1fr;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Left Column */
        .col-left {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 20px;
        }

        .year-text {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            letter-spacing: 5px;
            font-size: 1.2rem;
            margin-bottom: 10px;
            writing-mode: horizontal-tb;
        }

        .vertical-title-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .v-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 5px;
        }

        .v-text.blue {
            color: var(--ink-blue);
        }

        .names-section {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .name-block {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 8px;
        }

        .v-name {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--ink-blue);
            transform: rotate(180deg); /* To make it read top-to-bottom in vertical mode properly or just use standard vertical */
            /* Actually, for English names in vertical layout, usually we rotate the container or use specific writing modes. 
               Looking at the image, the English names are rotated 90deg counter-clockwise effectively, reading bottom-to-top? 
               No, "Steve Reich" reads top-to-bottom but letters are sideways. 
               Let's use writing-mode: vertical-rl and text-orientation: sideways for the English names to match the visual style where letters are stacked vertically but readable if you tilt head left? 
               Actually, in the image, "Steve Reich" is vertical. S-t-e-v-e. 
               Let's try standard vertical-rl with upright or mixed. 
               Visual check: The letters are rotated 90 degrees clockwise? No, they look like standard horizontal text rotated 90 degrees counter-clockwise.
               Let's use transform: rotate(-90deg) on a horizontal block for precise control.
            */
        }
        
        /* Refined approach for the names based on visual */
        .artist-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .artist-name-en {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--ink-blue);
            margin-bottom: 10px;
            /* In the image, the text runs top to bottom, letters are upright relative to the vertical line? 
               No, "Steve Reich" -> S is top, h is bottom. The letters themselves are rotated 90 deg clockwise? 
               Actually, looking closely at "Steve Reich", the 'S' is at the top. The text flows down. 
               The letters are oriented such that you read them by tilting your head to the left.
               So: transform: rotate(-90deg) is not quite right for the whole block if we want vertical flow.
               Let's use writing-mode: vertical-rl; text-orientation: sideways; 
            */
            text-orientation: sideways;
        }

        .artist-desc-cn {
            writing-mode: vertical-rl;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-black);
        }
        
        .artist-desc-cn.small {
            font-size: 0.8rem;
            font-weight: 400;
        }

        /* Center Column */
        .col-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .main-title-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 20px;
            color: var(--text-black);
            position: relative;
            z-index: 2;
            /* Creating the sketch/echo effect */
            text-shadow: 
                2px 2px 0px rgba(0,0,0,0.1),
                4px 4px 0px rgba(0,0,0,0.05),
                -2px -2px 0px rgba(0,0,0,0.05);
        }
        
        /* Simulating the hand-drawn sketch lines behind the main title */
        .sketch-lines {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 60%;
            height: 80%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            z-index: 1;
            filter: blur(1px);
        }

        /* Right Column */
        .col-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 15%;
            padding-bottom: 5%;
            text-align: right;
        }

        .date-block {
            margin-bottom: 40px;
        }

        .date-large {
            font-family: 'Roboto', sans-serif;
            font-size: 4rem;
            font-weight: 300;
            color: var(--ink-blue);
            line-height: 1;
            letter-spacing: -2px;
        }
        
        .date-large span {
            font-weight: 100;
        }

        .date-sub {
            font-family: 'Roboto', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 5px;
            color: var(--text-black);
        }

        .music-ref {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 5px;
        }

        .schedule-item {
            margin-bottom: 30px;
        }

        .schedule-code {
            font-family: 'Roboto', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-black);
            line-height: 1;
        }

        .schedule-time {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin: 5px 0;
        }

        .schedule-loc {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .footer-block {
            text-align: right;
            margin-top: auto;
        }

        .challenge-cn {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 5px;
            border-bottom: 2px solid var(--text-black);
            display: inline-block;
            padding-bottom: 5px;
        }

        .challenge-en {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .quote-box {
            border: 2px solid var(--ink-blue);
            display: inline-block;
            padding: 5px 10px;
            color: var(--ink-blue);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .quote-en {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--ink-blue);
            font-weight: 700;
            line-height: 1.4;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .poster-container {
                aspect-ratio: auto;
                height: auto;
                min-height: 100vh;
            }
            .content-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                gap: 40px;
                position: relative;
                padding: 20px;
            }
            .col-left, .col-center, .col-right {
                position: relative;
                z-index: 20;
                background: rgba(244, 241, 234, 0.8);
                padding: 20px;
                border-radius: 8px;
            }
            .col-center {
                order: -1;
            }
            .main-title-vertical {
                writing-mode: horizontal-tb;
                font-size: 4rem;
                letter-spacing: 10px;
            }
            .v-text, .artist-name-en, .artist-desc-cn {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
            }
            .vertical-title-group {
                flex-direction: row;
            }
            .names-section {
                flex-direction: column;
            }
            .artist-block {
                flex-direction: row;
                gap: 15px;
            }
            .spiral-top-right, .spiral-bottom-left {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <!-- Background Graphics -->
        <div class="spiral-top-right"></div>
        <div class="spiral-bottom-left"></div>

        <!-- Content Layer -->
        <div class="content-layer">
            
            <!-- Left Column -->
            <div class="col-left">
                <div class="year-text">2 0 1 7</div>
                
                <div class="vertical-title-group">
                    <div class="v-text blue">無&infin;极&infin;限</div>
                    <div class="v-text">校园艺术节</div>
                </div>

                <div class="names-section">
                    <div class="artist-block">
                        <div class="artist-name-en">Steve Reich</div>
                        <div class="artist-desc-cn small">艺术设计教父经典作品震撼展出</div>
                    </div>
                    <div class="artist-block">
                        <div class="artist-name-en">Pascal Pons</div>
                        <div class="artist-desc-cn">國際當代藝術大師</div>
                    </div>
                </div>
            </div>

            <!-- Center Column -->
            <div class="col-center">
                <div class="sketch-lines"></div>
                <div class="main-title-vertical">艺术·节</div>
            </div>

            <!-- Right Column -->
            <div class="col-right">
                
                <div class="date-block">
                    <div class="date-large">07<span>&times;</span>31</div>
                    <div class="date-sub">JULY &times; THIRTY</div>
                    <div class="music-ref">&langle; Music for 18 Musicians &rangle;</div>
                </div>

                <div class="schedule-item">
                    <div class="schedule-code">B2/10</div>
                    <div class="schedule-time">AM8:00</div>
                    <div class="schedule-loc">北京市<br>文化中心展馆</div>
                </div>

                <div class="schedule-item">
                    <div class="schedule-code">B2/11</div>
                    <div class="schedule-time">PM5:00</div>
                    <div class="schedule-loc">北京市<br>文化中心展馆</div>
                </div>

                <div class="footer-block">
                    <div class="challenge-cn">期待你的挑战</div>
                    <div class="challenge-en">Look forward to<br>your challenge</div>
                    <div class="quote-box">是困守原地，还是突破重生!</div>
                    <div class="quote-en">To be stuck in the same place,<br>or to break out of rebirth!</div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
