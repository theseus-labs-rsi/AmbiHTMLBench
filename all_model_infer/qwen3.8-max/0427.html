<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业长图 - 设计分享</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

        :root {
            --neon-green: #ccff00;
            --deep-purple: #6b4cfa;
            --hot-pink: #ff0055;
            --black: #000000;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Approximate mobile width */
            background-color: var(--black);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background-color: var(--black);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-weight: 900;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--white);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-line {
            height: 2px;
            background-color: var(--white);
            width: 40px;
            position: relative;
        }
        
        .header-line::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-left: 6px solid var(--white);
        }
        
        .header-line.left::after {
            left: 0;
            right: auto;
            border-left: none;
            border-right: 6px solid var(--white);
        }

        .design-pill {
            border: 2px solid var(--white);
            border-radius: 20px;
            padding: 2px 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Main Content Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }

        .col-left {
            background-color: var(--neon-green);
            padding: 15px;
            border-right: 2px solid var(--black);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .col-right {
            background-color: var(--neon-green);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        /* Typography & Elements */
        .text-block {
            font-weight: 900;
            line-height: 1.2;
        }

        .underline-text {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .boxed-text {
            border: 2px solid var(--black);
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255,255,255,0.5);
            box-shadow: 2px 2px 0 var(--black);
        }

        .dashed-box {
            border: 2px dashed var(--black);
            padding: 5px;
            text-align: center;
        }

        /* Left Column Specifics */
        .top-left-text {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .gloves-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .glove {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            position: relative;
        }
        .glove-blue { background: var(--deep-purple); border: 2px solid var(--black); }
        .glove-pink { background: var(--hot-pink); border: 2px solid var(--black); }

        .pk-section {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .pk-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--hot-pink) 0%, var(--deep-purple) 100%);
            clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
            z-index: 1;
        }
        
        .pk-ring {
            position: absolute;
            width: 140%;
            height: 140%;
            border: 2px solid var(--hot-pink);
            transform: perspective(200px) rotateX(60deg);
            z-index: 0;
            top: -20%;
        }

        .pk-text {
            font-size: 5rem;
            color: var(--deep-purple);
            z-index: 2;
            font-style: italic;
            text-shadow: 4px 4px 0 var(--white), -2px -2px 0 var(--hot-pink);
            transform: skewX(-10deg);
        }

        .tiandu-banner {
            background: var(--deep-purple);
            color: var(--white);
            padding: 5px 10px;
            font-size: 1.5rem;
            transform: skewX(-10deg);
            display: inline-block;
            margin-top: -20px;
            z-index: 3;
            position: relative;
            border: 2px solid var(--white);
        }
        
        .tiandu-sub {
            background: var(--hot-pink);
            color: var(--white);
            font-size: 1rem;
            padding: 2px 5px;
            margin-left: 5px;
        }

        .info-box {
            border: 2px solid var(--black);
            background: var(--white);
            padding: 10px;
            font-size: 0.75rem;
            position: relative;
        }
        
        .info-header {
            text-align: center;
            font-weight: 900;
            border-bottom: 2px solid var(--black);
            margin-bottom: 5px;
            padding-bottom: 2px;
        }

        .info-icons {
            position: absolute;
            left: -25px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .icon-box {
            width: 20px;
            height: 20px;
            background: var(--white);
            border: 2px solid var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

        .bottom-left-highlight {
            background: var(--deep-purple);
            color: var(--white);
            padding: 5px;
            transform: skewX(-5deg);
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        /* Right Column Specifics */
        .rings-container {
            height: 180px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--deep-purple); /* Top part bg */
            margin: -15px -15px 0 -15px; /* Bleed to top */
            padding-top: 20px;
        }
        
        /* Simulating the rings with CSS borders */
        .ring {
            position: absolute;
            border: 15px solid var(--deep-purple);
            border-radius: 50%;
            width: 120px;
            height: 40px;
            box-shadow: 0 0 0 2px var(--white);
        }
        
        .ring-1 { transform: rotate(-20deg) translate(-20px, -20px); border-color: #8a73ff; }
        .ring-2 { transform: rotate(10deg) translate(20px, 0px); border-color: #5a3ce0; }
        .ring-3 { transform: rotate(-5deg) translate(0px, 20px); border-color: #7b5cff; }
        
        .ring-text {
            position: absolute;
            color: var(--white);
            font-size: 0.6rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .stars {
            position: absolute;
            right: 10px;
            bottom: 10px;
            color: var(--black);
            font-size: 2rem;
        }

        .headline-right {
            font-size: 2.2rem;
            line-height: 1;
            margin-top: 10px;
            color: var(--black);
        }

        .checkered-line {
            height: 10px;
            background-image: linear-gradient(45deg, var(--black) 25%, transparent 25%, transparent 75%, var(--black) 75%, var(--black)), 
                              linear-gradient(45deg, var(--black) 25%, transparent 25%, transparent 75%, var(--black) 75%, var(--black));
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            margin: 10px 0;
        }

        .text-right-body {
            font-size: 0.9rem;
            line-height: 1.6;
            font-weight: 700;
        }

        .highlight-pill {
            background: var(--deep-purple);
            color: var(--white);
            padding: 0 5px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .arrow-icon {
            display: inline-block;
            transform: rotate(180deg);
        }

        /* Decorative elements */
        .deco-stripes {
            width: 50px;
            height: 20px;
            background: repeating-linear-gradient(
                -45deg,
                var(--black),
                var(--black) 5px,
                transparent 5px,
                transparent 10px
            );
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div>商业长图</div>
        <div class="header-center">
            <div class="header-line left"></div>
            <div class="design-pill">DESIGN</div>
            <div class="header-line"></div>
        </div>
        <div>设计分享</div>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
        
        <!-- Left Column -->
        <div class="col-left">
            <div class="top-left-text text-block">
                <div class="underline-text" style="text-align: center;">两大征稿专栏</div>
                <div>将在本期</div>
                <div style="text-align: right;">与大家做个正式的告别</div>
            </div>

            <div style="text-align: center;">
                <div class="boxed-text text-block" style="font-size: 1.1rem;">江湖从不缺传奇</div>
            </div>

            <div class="gloves-container">
                <div class="glove glove-blue"></div>
                <div class="boxed-text text-block" style="background: var(--white);">这一次</div>
                <div class="glove glove-pink"></div>
            </div>

            <div class="dashed-box text-block" style="font-size: 1.2rem;">
                TA燃情出炉，战力拉满
            </div>

            <!-- PK Graphic Area -->
            <div class="pk-section">
                <div class="pk-ring"></div>
                <div class="pk-bg"></div>
                <div class="pk-text">PK</div>
            </div>
            
            <div style="margin-top: -30px; z-index: 10; position: relative;">
                <span class="tiandu-banner">天都擂台</span>
                <span class="tiandu-banner tiandu-sub">栏目今日上线</span>
            </div>

            <!-- Info Box -->
            <div style="position: relative; margin-top: 20px; padding-left: 25px;">
                <div class="info-icons">
                    <div class="icon-box">↘</div>
                    <div class="icon-box">☺</div>
                    <div class="icon-box">↗</div>
                </div>
                <div class="info-box">
                    <div class="info-header">正反两派 互相PK</div>
                    <div style="text-align: center; line-height: 1.4;">
                        征稿玩法大升级，狂掀对垒浪潮<br>
                        注意！注意！注意！<br>
                        <span style="background: var(--black); color: var(--white); padding: 0 2px;">入选参赛的投稿者都将收获礼品一份</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span class="bottom-left-highlight">胜者一方</span>
                    <span class="text-block" style="font-size: 1.2rem;">但！</span>
                </div>
                <div class="bottom-left-highlight" style="width: 90%; text-align: center; margin-top: 5px;">
                    将抢走更加超值的奖励
                </div>
                <div style="font-size: 1.5rem; letter-spacing: 2px; margin-top: 5px;">!!!!!</div>
                <div style="text-align: right; margin-top: 10px; font-weight: 900;">
                    具体怎么参与？
                </div>
            </div>
            
            <div class="deco-stripes"></div>

        </div>

        <!-- Right Column -->
        <div class="col-right">
            <!-- Rings Graphic -->
            <div class="rings-container">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <!-- Simulated text on rings -->
                <div class="ring-text" style="top: 30px; left: 40px; transform: rotate(-15deg);">重磅 · 5.0</div>
                <div class="ring-text" style="top: 60px; left: 80px; transform: rotate(10deg);">升级 02</div>
                <div class="ring-text" style="top: 90px; left: 30px; transform: rotate(-5deg);">重磅升级</div>
                
                <div class="stars">✦✦</div>
            </div>

            <div class="checkered-line"></div>

            <div class="headline-right text-block">
                擂台大比拼<br>
                一切“我”掌控
            </div>

            <div class="checkered-line"></div>
            
            <div style="text-align: right; font-size: 1.5rem; margin-top: -10px;">
                ← ←
            </div>

            <div class="text-right-body">
                <div style="margin-bottom: 10px;">
                    公众号每期的 <span class="highlight-pill">「次条福利文」</span>，
                </div>
                <div style="margin-bottom: 10px;">
                    都向家人们抛出了各种<br>
                    <span style="text-align: right; display: block;">热议的话题</span>
                </div>
                <div style="margin-bottom: 10px;">
                    送出了一轮又一轮的奖励
                </div>
                <div style="margin-bottom: 10px;">
                    而 “侃侃而谈” 和 “开店风云”
                </div>
                <div style="border-top: 1px solid var(--black); border-bottom: 1px solid var(--black); padding: 5px 0; margin: 10px 0; text-align: center;">
                    两大征稿专栏
                </div>
                <div>
                    将在本期<br>
                    <span style="text-align: right; display: block;">与大家做个正式的告别</span>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
