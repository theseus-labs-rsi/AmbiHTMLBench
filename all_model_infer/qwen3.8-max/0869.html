<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.语法</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #7ba686; /* Sage green background */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: "Kaiti", "STKaiti", "KaiTi", "楷体", serif; /* Handwriting-style font fallback */
        }

        .notebook-page {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            min-height: 700px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 60px 40px 40px 40px;
            box-sizing: border-box;
            /* Grid pattern background */
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: -1px -1px;
        }

        /* Spiral binding holes */
        .binding-holes {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .hole {
            width: 18px;
            height: 18px;
            background-color: #7ba686;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #333;
            margin-top: 20px;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
            text-align: justify;
            margin-bottom: 25px;
            text-indent: 2em; /* Indent for paragraphs */
            position: relative;
            z-index: 2;
        }

        /* Specific alignment for the last paragraph to match image */
        p:last-of-type {
            margin-bottom: 0;
        }

        /* Decorative elements */
        .deco-star-1 {
            position: absolute;
            top: 280px;
            left: 60px;
            width: 20px;
            height: 20px;
            opacity: 0.6;
            z-index: 1;
        }
        
        .deco-star-2 {
            position: absolute;
            bottom: 80px;
            left: 70px;
            width: 25px;
            height: 25px;
            opacity: 0.6;
            z-index: 1;
        }

        .deco-question {
            position: absolute;
            top: 420px;
            right: 60px;
            font-size: 40px;
            color: #f4d03f;
            opacity: 0.5;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 1;
            transform: rotate(10deg);
        }

        .deco-flower {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 50px;
            height: 50px;
            z-index: 1;
        }

        /* SVG styles for decorations */
        .star-svg {
            fill: none;
            stroke: #f4d03f;
            stroke-width: 2;
        }
        
        .flower-svg {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 2;
        }
        
        .leaf-svg {
            fill: none;
            stroke: #7ba686;
            stroke-width: 2;
        }

    </style>
</head>
<body>

    <div class="notebook-page">
        <!-- Binding Holes -->
        <div class="binding-holes">
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
            <div class="hole"></div>
        </div>

        <!-- Title -->
        <h1>4.语法</h1>

        <!-- Content -->
        <p>语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。</p>

        <p>虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。</p>

        <p>学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。</p>

        <p>零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。</p>

        <!-- Decorations -->
        <!-- Yellow Star near top left of second paragraph area -->
        <svg class="deco-star-1" viewBox="0 0 24 24">
            <path class="star-svg" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>

        <!-- Yellow Question Mark -->
        <div class="deco-question">?</div>

        <!-- Yellow Star near bottom left -->
        <svg class="deco-star-2" viewBox="0 0 24 24">
            <path class="star-svg" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>

        <!-- Flower at bottom right -->
        <svg class="deco-flower" viewBox="0 0 50 50">
            <!-- Flower petals -->
            <path class="flower-svg" d="M25 10 C 20 5, 15 10, 20 15 C 15 10, 10 15, 15 20 C 10 15, 5 20, 10 25 C 5 20, 10 30, 15 25 C 10 30, 15 35, 20 30 C 15 35, 20 40, 25 35 C 20 40, 30 40, 30 35 C 35 40, 40 35, 35 30 C 40 35, 45 30, 40 25 C 45 30, 40 20, 35 25 C 40 20, 35 15, 30 20 C 35 15, 30 10, 25 15 Z" />
            <circle class="flower-svg" cx="25" cy="25" r="3" />
            <!-- Leaves -->
            <path class="leaf-svg" d="M35 35 Q 45 45 40 50 Q 35 45 35 35" />
            <path class="leaf-svg" d="M38 38 Q 48 38 50 45 Q 45 40 38 38" />
        </svg>

    </div>

</body>
</html>
