<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三页 - 手写信札</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap');

        body {
            margin: 0;
            padding: 40px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Ma Shan Zheng", "KaiTi", "STKaiti", serif;
        }

        .page-container {
            position: relative;
            width: 900px;
            height: 650px;
            background-color: #fcfcf9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            overflow: hidden;
            /* Simulating the paper texture slightly */
            background-image: linear-gradient(to right, transparent 49.8%, #e0e0e0 50%, transparent 50.2%);
        }

        /* The vertical fold line in the middle */
        .fold-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .header-label {
            position: absolute;
            top: 20px;
            left: 30px;
            font-family: "SimHei", sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: #d4af37; /* Gold/Yellow color */
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            z-index: 20;
            letter-spacing: 2px;
        }

        /* Grid Background for the writing area */
        .writing-area {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            direction: rtl; /* Right to left layout for traditional Chinese */
        }

        .column {
            flex: 1;
            height: 100%;
            border-left: 1px solid #ccc; /* Vertical grid lines */
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        
        /* Last column on the far left needs a border too if we want full grid, 
           but usually the edge is the border. Let's add borders to simulate the grid cells */
        .column:last-child {
            border-left: 1px solid #ccc;
        }

        /* Horizontal grid lines simulation using repeating linear gradient on the container */
        .grid-overlay {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            bottom: 40px;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 38px,
                #ddd 38px,
                #ddd 39px
            );
            pointer-events: none;
            z-index: 1;
        }
        
        /* Vertical grid lines overlay to ensure they span the whole height */
        .vertical-grid-overlay {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            bottom: 40px;
            background-image: repeating-linear-gradient(
                to right,
                transparent,
                transparent 59px, /* Approximate column width */
                #ddd 59px,
                #ddd 60px
            );
            pointer-events: none;
            z-index: 1;
        }

        .handwriting {
            font-family: "Zhi Mang Xing", "Ma Shan Zheng", cursive;
            font-size: 26px;
            color: #1a1a1a;
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 100%;
            line-height: 1.8;
            letter-spacing: 5px;
            z-index: 5;
            position: relative;
            /* Slight rotation to mimic handwriting imperfection */
            transform: rotate(-1deg);
        }

        .col-text {
            margin-right: 5px; /* Spacing between columns */
        }

        /* Specific adjustments for columns to match image flow */
        .col-1 { margin-right: 0; }
        .col-2 { margin-right: 0; }
        .col-3 { margin-right: 0; }
        .col-4 { margin-right: 0; }
        .col-5 { margin-right: 0; }
        .col-6 { margin-right: 0; }
        .col-7 { margin-right: 0; }
        .col-8 { margin-right: 0; }

        .signature-block {
            margin-top: 40px;
            font-size: 28px;
        }

        .date-block {
            margin-top: 20px;
            font-size: 24px;
        }

        .seal {
            width: 40px;
            height: 40px;
            background-color: #c41e3a;
            color: white;
            font-family: "SimSun", serif;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 4px;
            margin: 10px auto;
            opacity: 0.9;
            transform: rotate(-5deg);
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            writing-mode: horizontal-tb;
            line-height: 1.2;
            padding: 2px;
        }

        /* Responsive scaling */
        @media (max-width: 950px) {
            .page-container {
                transform: scale(0.8);
                transform-origin: top center;
            }
        }
        @media (max-width: 750px) {
            .page-container {
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="header-label">第三页</div>
        <div class="fold-line"></div>
        
        <!-- Grid Backgrounds -->
        <div class="grid-overlay"></div>
        <div class="vertical-grid-overlay"></div>

        <div class="writing-area">
            <!-- Column 1 (Far Right) -->
            <div class="column col-1">
                <div class="handwriting">回家时稍[?]母羊，对此狠</div>
            </div>
            
            <!-- Column 2 -->
            <div class="column col-2">
                <div class="handwriting">情我下一般情况下是不会</div>
            </div>

            <!-- Column 3 -->
            <div class="column col-3">
                <div class="handwriting">用舌头[?]水的用舌头接水的是</div>
            </div>

            <!-- Column 4 -->
            <div class="column col-4">
                <div class="handwriting">狗与猫），他们会把嘴贴到水面</div>
            </div>

            <!-- Column 5 -->
            <div class="column col-5">
                <div class="handwriting">上往里吸水。</div>
            </div>

            <!-- Column 6 -->
            <div class="column col-6">
                <div class="handwriting">总之，必须注意观察细</div>
            </div>

            <!-- Column 7 -->
            <div class="column col-7">
                <div class="handwriting">节，也要注意训练在考试的</div>
            </div>

            <!-- Column 8 -->
            <div class="column col-8">
                <div class="handwriting">基础上想信细节的能力。</div>
            </div>

            <!-- Column 9 -->
            <div class="column col-9">
                <div class="handwriting">拉雅[?]案，都是对生活的误</div>
            </div>

            <!-- Column 10 -->
            <div class="column col-10">
                <div class="handwriting">读是吧。</div>
            </div>

            <!-- Column 11 (Signature Area) -->
            <div class="column col-11">
                <div class="handwriting signature-block">
                    吕顿 笔健！
                </div>
            </div>

            <!-- Column 12 (Name & Seal) -->
            <div class="column col-12">
                <div class="handwriting" style="margin-top: 60px;">
                    莫言
                </div>
                <div class="seal">莫言之印</div>
            </div>

            <!-- Column 13 (Date) -->
            <div class="column col-13">
                <div class="handwriting date-block">
                    癸卯年七月晚
                </div>
            </div>
            
            <!-- Empty columns to fill space if needed, or just let flex handle it -->
            <div class="column" style="flex: 0.5;"></div>
        </div>
    </div>

</body>
</html>
