<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对比色配色</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
        }
        
        /* Header Section */
        .header {
            background-color: #ea580c;
            border-radius: 12px;
            padding: 20px 30px;
            position: relative;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 15px;
        }
        .copyright {
            color: white;
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 5px;
        }
        .diamonds {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .diamond {
            width: 8px;
            height: 8px;
            background-color: white;
            transform: rotate(45deg);
        }
        .header-title {
            flex-grow: 1;
            text-align: center;
        }
        .header-title h1 {
            margin: 0;
            color: #000000;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
            min-width: 60px;
        }
        .year {
            color: #000000;
            font-size: 20px;
            font-weight: bold;
        }
        .logo-char {
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            margin-top: auto;
        }

        /* Intro Text */
        .intro-text {
            font-size: 14px;
            color: #333333;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Card Section */
        .card {
            border: 2px solid #ea580c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            background-color: #ffffff;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin-right: 10px;
        }
        .card-diamond {
            width: 10px;
            height: 10px;
            background-color: #ea580c;
            transform: rotate(45deg);
        }
        
        /* Color Blocks */
        .color-block-container {
            width: 100%;
            height: 120px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }
        
        /* Block 1: Green, Yellow, Blue */
        .block-1 {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .block-1-green {
            background-color: #009645;
            width: 33%;
            height: 100%;
            border-top-right-radius: 50% 80%;
            border-bottom-right-radius: 20% 50%;
        }
        .block-1-yellow {
            background-color: #ffe600;
            width: 34%;
            height: 100%;
            margin-left: -10%;
            z-index: 1;
            border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%;
        }
        .block-1-blue {
            background-color: #00479d;
            width: 43%;
            height: 100%;
            margin-left: -10%;
            border-top-left-radius: 60% 40%;
            border-bottom-left-radius: 40% 60%;
        }

        /* Block 2: Lime, Black, Pink */
        .block-2 {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .block-2-lime {
            background-color: #8cc63f;
            width: 33%;
            height: 100%;
            border-top-right-radius: 50% 80%;
            border-bottom-right-radius: 20% 50%;
        }
        .block-2-black {
            background-color: #000000;
            width: 34%;
            height: 100%;
            margin-left: -10%;
            z-index: 1;
            border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%;
        }
        .block-2-pink {
            background-color: #ed1e5a;
            width: 43%;
            height: 100%;
            margin-left: -10%;
            border-top-left-radius: 60% 40%;
            border-bottom-left-radius: 40% 60%;
        }

        .card-desc {
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }

        /* Footer Bar */
        .footer-bar {
            height: 20px;
            background-color: #ea580c;
            width: 100%;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="copyright">©</div>
            <div class="diamonds">
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
                <div class="diamond"></div>
            </div>
        </div>
        <div class="header-title">
            <h1>对比色配色</h1>
        </div>
        <div class="header-right">
            <div class="year">2023</div>
            <div class="logo-char">瑞</div>
        </div>
    </div>

    <!-- Intro -->
    <div class="intro-text">
        对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
    </div>

    <!-- Card 1 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">富有朝气的配色</div>
            <div class="card-diamond"></div>
        </div>
        
        <div class="color-block-container">
            <div class="block-1">
                <div class="block-1-green"></div>
                <div class="block-1-yellow"></div>
                <div class="block-1-blue"></div>
            </div>
        </div>

        <div class="card-desc">
            以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
        </div>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">视觉冲击强烈的配色</div>
            <div class="card-diamond"></div>
        </div>
        
        <div class="color-block-container">
            <div class="block-2">
                <div class="block-2-lime"></div>
                <div class="block-2-black"></div>
                <div class="block-2-pink"></div>
            </div>
        </div>

        <div class="card-desc">
            黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar"></div>

</div>

</body>
</html>
