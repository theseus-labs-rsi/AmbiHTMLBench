<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音 VS 快手 - 产品小课堂</title>
    <style>
        body {
            background-color: #dcb683;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        /* Header Section */
        .main-title-wrapper {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .main-title {
            display: inline-block;
            background-color: #f5a623; /* Orange-yellow bar behind text roughly */
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            padding: 10px 30px;
            border-radius: 8px;
            text-shadow: 2px 2px 0px #5a3e2b, -1px -1px 0px #5a3e2b, 1px -1px 0px #5a3e2b, -1px 1px 0px #5a3e2b;
            letter-spacing: 2px;
            position: relative;
        }
        
        /* Simulating the orange bar behind the title */
        .main-title::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -10%;
            right: -10%;
            height: 60%;
            background-color: #f7b733;
            z-index: -1;
            transform: translateY(-30%);
            border-radius: 4px;
        }

        .white-card {
            background-color: #fff;
            width: 100%;
            min-height: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 40px;
        }

        .sub-header {
            background-color: #fceabb;
            border: 2px solid #dcb683;
            border-radius: 30px;
            padding: 10px 40px;
            margin: -25px auto 30px auto;
            width: fit-content;
            position: relative;
            z-index: 10;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .sub-header h2 {
            margin: 0;
            color: #5a3e2b;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 0px #fff;
        }

        .brush-icon {
            position: absolute;
            left: -40px;
            top: -10px;
            width: 80px;
            height: 80px;
            z-index: 11;
        }
        
        /* Placeholder for brush since I can't generate images, using CSS shape or emoji approximation if needed, 
           but instructions say use placeholder div for non-text elements */
        .brush-placeholder {
            position: absolute;
            left: -30px;
            top: -20px;
            width: 70px;
            height: 90px;
            z-index: 11;
            /* Using a simple representation */
        }

        /* Content Sections */
        .section {
            padding: 0 30px;
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-number {
            background-color: #4a2c2a;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 20px;
            margin-right: 15px;
        }

        .section-title {
            color: #4a2c2a;
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #f7b733;
            opacity: 0.5;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }

        th {
            background-color: #f7b733;
            color: #fff;
            padding: 8px 5px;
            font-weight: normal;
        }

        td {
            padding: 10px 5px;
            color: #333;
            border-bottom: 1px solid #fceabb;
        }

        tr:nth-child(even) td {
            background-color: #fdf6e3;
        }
        
        tr:nth-child(odd) td {
            background-color: #fff;
        }
        
        /* Specific styling for the first column to match image */
        td:first-child {
            font-weight: bold;
            color: #4a2c2a;
            background-color: #fceabb !important; /* Light orange bg for label col */
        }
        
        /* Adjusting table 1 specific colors based on image */
        .table-1 td:first-child {
             background-color: #fceabb !important;
        }
        .table-1 tr:nth-child(2) td { background-color: #fceabb; }
        .table-1 tr:nth-child(3) td { background-color: #fff; } /* Actually image shows alternating or specific blocks */
        
        /* Re-evaluating table colors from image:
           Row 1 (Header): Orange
           Row 2 (Douyin): Light Orange/Cream
           Row 3 (Kuaishou): White/Light Cream
           Actually, looking closely:
           Col 1 is distinct.
           Rows seem to have a very subtle alternation or just plain.
           Let's stick to a clean look close to the image.
        */
        
        .custom-table td {
            border: none;
        }
        
        .row-douyin {
            background-color: #fceabb;
        }
        
        .row-kuaishou {
            background-color: #fff;
        }

        .footer-dots {
            text-align: center;
            color: #f7b733;
            font-size: 20px;
            letter-spacing: 5px;
            margin-top: 20px;
        }

        .bottom-bar {
            height: 15px;
            background-color: #f7b733;
            width: 100%;
            margin-top: 20px;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Main Title -->
    <div class="main-title-wrapper">
        <div class="main-title">抖音 VS 快手</div>
    </div>

    <div class="white-card">
        <!-- Sub Header with Brush -->
        <div style="position: relative; width: fit-content; margin: 0 auto;">
            <div class="brush-placeholder">
                <!-- [Image: Paint Brush] -->
                <svg width="70" height="90" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,80 Q10,90 30,95 Q50,100 40,80 L60,40 L80,10 L60,5 L40,35 Z" fill="#dcb683" stroke="#a67c52" stroke-width="2"/>
                    <rect x="35" y="35" width="30" height="15" fill="#a8d5ba" transform="rotate(-60 50 42)" />
                    <path d="M60,5 L85,0 L90,15 L65,20 Z" fill="#e8cfa6" />
                </svg>
            </div>
            <div class="sub-header">
                <h2>产品小课堂</h2>
            </div>
        </div>

        <!-- Section 03 -->
        <div class="section">
            <div class="section-header">
                <div class="section-number">03</div>
                <div class="section-title">抖音与快手</div>
            </div>

            <table class="custom-table table-1">
                <thead>
                    <tr>
                        <th style="background-color: #f7b733; width: 15%;"></th> <!-- Empty corner or part of header -->
                        <th style="background-color: #f7b733; width: 25%;">slogan</th>
                        <th style="background-color: #f7b733; width: 20%;">产品定位</th>
                        <th style="background-color: #f7b733; width: 20%;">策略</th>
                        <th style="background-color: #f7b733; width: 20%;">变现</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="row-douyin">
                        <td>抖音</td>
                        <td>记录美好生活</td>
                        <td>短视频媒体</td>
                        <td>以优质内容为中心</td>
                        <td>广告收入、电商</td>
                    </tr>
                    <tr class="row-kuaishou">
                        <td>快手</td>
                        <td>拥抱每一种生活</td>
                        <td>短视频社区</td>
                        <td>以社交中心，大部分流量</td>
                        <td>直播收入、电商</td>
                    </tr>
                    <!-- Empty rows to match visual spacing in image -->
                    <tr><td colspan="5" style="height: 20px; border: none; background: transparent;"></td></tr>
                </tbody>
            </table>
        </div>

        <!-- Section 04 -->
        <div class="section">
            <div class="section-header">
                <div class="section-number">04</div>
                <div class="section-title">抖音电商与快手电商</div>
            </div>

            <table class="custom-table">
                <thead>
                    <tr>
                        <th style="background-color: #f7b733; width: 20%;"></th>
                        <th style="background-color: #f7b733; width: 50%;">产品定位</th>
                        <th style="background-color: #f7b733; width: 30%;">重点指标</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="row-douyin">
                        <td>抖音电商</td>
                        <td>兴趣逻辑，内容场景刺激需求</td>
                        <td>直播间GPM</td>
                    </tr>
                    <tr class="row-kuaishou">
                        <td>快手电商</td>
                        <td>信任逻辑，头部主播优势</td>
                        <td>复购</td>
                    </tr>
                     <!-- Empty rows to match visual spacing -->
                     <tr><td colspan="3" style="height: 40px; border: none; background: transparent;"></td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer-dots">
            _ _ _ _ _ _ _
        </div>
        
        <div class="bottom-bar"></div>
    </div>
</div>

</body>
</html>
