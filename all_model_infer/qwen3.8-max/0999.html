<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Notes - Typhoon In-fa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap');

        body {
            margin: 0;
            padding: 40px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: 'Ma Shan Zheng', 'Zhi Mang Xing', cursive, sans-serif;
            color: #2c3e50;
        }

        .notebook-page {
            width: 800px;
            min-height: 1100px;
            background-color: #fdfdfd;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 60px 80px 60px 100px;
            box-sizing: border-box;
            /* Lined paper effect */
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 40px;
            background-position: 0 55px; /* Align lines with text */
            line-height: 40px;
            font-size: 22px;
        }

        /* Spiral binding holes simulation */
        .binding-holes {
            position: absolute;
            right: 20px;
            top: 40px;
            bottom: 40px;
            width: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .hole {
            width: 12px;
            height: 12px;
            background-color: #e0e0e0;
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Header area */
        .header {
            position: absolute;
            top: 20px;
            left: 100px;
            font-size: 14px;
            color: #999;
            font-family: sans-serif;
        }

        .watermark-top-right {
            position: absolute;
            top: 20px;
            right: 60px;
            font-size: 14px;
            color: #ccc;
            transform: rotate(-15deg);
            font-family: sans-serif;
            opacity: 0.7;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 40px;
            font-size: 16px;
            color: #888;
            font-family: serif;
            font-style: italic;
        }

        /* Content Styling */
        .content {
            position: relative;
            z-index: 1;
        }

        p {
            margin: 0;
            padding: 0;
            min-height: 40px; /* Match line height */
        }

        .indent-1 {
            padding-left: 2em;
        }

        .indent-2 {
            padding-left: 4em;
        }

        /* Handwriting colors */
        .black-ink {
            color: #1a1a1a;
        }

        .blue-ink {
            color: #2980b9;
        }

        /* Highlights and Underlines */
        .underline-red {
            text-decoration: underline;
            text-decoration-color: #e74c3c;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .underline-blue {
            text-decoration: underline;
            text-decoration-color: #3498db;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .circle-blue {
            border: 2px solid #3498db;
            border-radius: 50% / 40%; /* Irregular circle look */
            padding: 0 8px;
            display: inline-block;
            position: relative;
            top: -2px;
        }

        .triangle-marker {
            color: #3498db;
            font-size: 18px;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Specific adjustments for handwriting feel */
        .hand-text {
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="notebook-page">
        <div class="header">Date.</div>
        <div class="watermark-top-right">@田三单要争气哦 ✨ 小红书</div>
        
        <!-- Simulated binding holes on the right -->
        <div class="binding-holes">
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            <div class="hole"></div><div class="hole"></div><div class="hole"></div>
        </div>

        <div class="content hand-text">
            <!-- Line 1 -->
            <p class="black-ink">了东南季风，形成强降水。</p>
            
            <!-- Line 2 -->
            <p class="black-ink">(3). 受台风"<span class="underline-red">烟花</span>"逼近，带来了大量水汽</p>
            
            <!-- Line 3 -->
            <p class="black-ink">(4). 这次的降水过程中，中小尺度对流反复在伏牛山前地</p>
            
            <!-- Line 4 -->
            <p class="black-ink indent-1">区发展并向郑州方向移动，也就形成了<span class="circle-blue">"列车效应"</span>，</p>
            
            <!-- Line 5 -->
            <p class="black-ink indent-1">导致降水强度大、维持时间长，引起局地极端降水。</p>
            
            <!-- Line 6 (Blue definition start) -->
            <p class="blue-ink"><span class="triangle-marker">△</span>列车效应：指长时间的降水并不是因为一块稳定不动的</p>
            
            <!-- Line 7 -->
            <p class="blue-ink indent-2">降雨云团造成，而是<span class="underline-blue">对流系统反复生成发展</span>，</p>
            
            <!-- Line 8 -->
            <p class="blue-ink indent-2">使很多降水云团先后经过同一个地方，造成同</p>
            
            <!-- Line 9 -->
            <p class="blue-ink indent-2">一地区出现长时间降水情况。就像列车的</p>
            
            <!-- Line 10 -->
            <p class="blue-ink indent-2">不同车厢先后经过同一块铁轨一样，这种情</p>
            
            <!-- Line 11 -->
            <p class="blue-ink indent-2">况叫做列车效应。</p>
        </div>

        <div class="footer">Campus</div>
    </div>

</body>
</html>
