<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loneliness Quote</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b1d42;
            color: #cdae73;
            font-family: "Songti SC", "SimSun", "STSong", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .icon-container {
            margin-bottom: 60px;
            margin-top: 40px;
        }

        .english-quote-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            width: 100%;
        }

        .star-icon {
            width: 20px;
            height: 20px;
            fill: #cdae73;
            flex-shrink: 0;
        }

        .english-text {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            color: #cdae73;
            letter-spacing: 0.5px;
        }

        .chinese-quote {
            font-size: 22px;
            line-height: 1.8;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .quote-mark {
            font-family: "Songti SC", "SimSun", serif;
        }

        /* SVG Styles */
        .main-icon {
            width: 180px;
            height: 180px;
        }
        
        .stroke-gold {
            stroke: #cdae73;
            fill: none;
            stroke-width: 2;
        }
        
        .fill-gold {
            fill: #cdae73;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- Top Icon -->
        <div class="icon-container">
            <svg class="main-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer Fan/Arc segments -->
                <path d="M 40 80 A 80 80 0 0 1 160 80" class="stroke-gold" />
                <!-- Radial lines for the fan -->
                <line x1="100" y1="20" x2="100" y2="40" class="stroke-gold" />
                <line x1="60" y1="30" x2="70" y2="48" class="stroke-gold" />
                <line x1="140" y1="30" x2="130" y2="48" class="stroke-gold" />
                <line x1="45" y1="55" x2="60" y2="65" class="stroke-gold" />
                <line x1="155" y1="55" x2="140" y2="65" class="stroke-gold" />
                
                <!-- Diamond Shape -->
                <polygon points="100,40 160,100 100,160 40,100" class="stroke-gold" />
                <polygon points="100,48 152,100 100,152 48,100" class="stroke-gold" stroke-width="1" />

                <!-- Venus Symbol inside -->
                <circle cx="100" cy="90" r="18" class="stroke-gold" />
                <line x1="100" y1="108" x2="100" y2="135" class="stroke-gold" />
                <line x1="88" y1="122" x2="112" y2="122" class="stroke-gold" />
            </svg>
        </div>

        <!-- English Quote Section -->
        <div class="english-quote-wrapper">
            <!-- Left Star -->
            <svg class="star-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" />
            </svg>
            
            <div class="english-text">
                I think the so-called loneliness refers to the person you are facing,<br>
                whose emotions are not on the same frequency as your own.
            </div>

            <!-- Right Star -->
            <svg class="star-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" />
            </svg>
        </div>

        <!-- Chinese Quote Section -->
        <div class="chinese-quote">
            <span class="quote-mark">&ldquo;</span>&nbsp;&nbsp;我想所谓孤独，<br>
            就是你面对的那个人，<br>
            他的情绪和你自己的情绪，<br>
            不在同一个频率。&nbsp;&nbsp;<span class="quote-mark">&rdquo;</span>
        </div>

    </div>

</body>
</html>
