<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核桃奶酪贝果 &amp; 香蕉可可贝果</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f7a447;
    font-family: 'ZCOOL KuaiLe', 'Yuanti SC', 'YouYuan', 'Comic Sans MS', sans-serif;
    color: #8a5a2a;
    padding: 12px 0 24px;
  }
  .page { width: 620px; margin: 0 auto; }
  .panel {
    position: relative;
    border: 3px solid #e2882f;
    border-radius: 4px;
    padding: 12px 8px 30px;
    background-color: #fdf3e3;
    background-image:
      linear-gradient(rgba(238,180,120,.22) 50%, transparent 50%),
      linear-gradient(90deg, rgba(238,180,120,.22) 50%, transparent 50%);
    background-size: 28px 28px;
  }
  .placeholder {
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 9px; line-height: 1.2;
    color: #b08968; background: rgba(255,255,255,.4);
    border: 1px dashed #d9b38c; border-radius: 6px;
    padding: 2px; overflow: hidden;
  }
  h1.title {
    font-size: 34px; color: #7a4a1f; text-align: center;
    letter-spacing: 6px; font-weight: 700; margin: 4px 0 2px;
  }
  h1.title .placeholder { display: inline-flex; vertical-align: middle; margin-left: 8px; }
  h2 { font-size: 20px; color: #8a5a2a; letter-spacing: 3px; margin: 6px 0 4px; font-weight: 700; }
  .step {
    font-size: 19px; color: #8a5a2a; letter-spacing: 2px;
    line-height: 1.6; margin: 8px 0 8px 4px;
  }
  .tag-genki {
    position: absolute; top: 18px; left: 28px; z-index: 4;
    transform: rotate(-8deg);
    background: #fffdf6; border: 3px solid #f3c66f; border-radius: 10px;
    color: #6f8fe0; font-size: 26px; font-weight: 700; letter-spacing: 4px;
    padding: 8px 12px; line-height: 1.3; text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
  }
  .tag-genki::after {
    content: ""; position: absolute; bottom: -30px; left: 50%;
    width: 3px; height: 30px; background: #b98a4a;
    transform: translateX(-50%) rotate(6deg);
  }
  .top-grid { display: flex; gap: 10px; margin-top: 6px; }
  .top-left { flex: 0 0 190px; display: flex; justify-content: center; padding-top: 26px; }
  .top-right { flex: 1; }
  .top-right h2 { text-align: center; }
  .ing-row { display: flex; justify-content: center; margin: 6px 0 4px; }
  .ing-row.left { justify-content: flex-start; padding-left: 26px; gap: 8px; }
  .ing { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0 12px; }
  .ing span { font-size: 14px; letter-spacing: 2px; }
  .proc-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
  .arrow { font-size: 26px; color: #8a5a2a; }
  .girl { position: absolute; left: 22px; top: 258px; width: 115px; height: 165px; z-index: 6; }
  .divider { border-top: 5px dashed #e2882f; margin: 10px 4px 6px; }
  .prep-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 44px 0 30px; margin-top: 2px;
  }
  .credit { font-size: 18px; letter-spacing: 2px; color: #8a5a2a; }
  .sec-bottom .step { padding-left: 26px; }
  .proc-row.bottom {
    position: relative; justify-content: flex-start;
    align-items: flex-end; padding: 56px 10px 0 22px; gap: 6px;
  }
  .slices-wrap {
    position: absolute; top: 4px; left: 332px;
    display: flex; flex-direction: column; align-items: flex-start;
  }
  .slices-wrap .arrow { margin: -6px 0 0 -20px; font-size: 22px; }
  .right-cluster { position: relative; width: 172px; height: 148px; margin-left: 14px; }
  .right-cluster .big-bagel2 { position: absolute; bottom: 0; left: 0; }
  .tag-red {
    position: absolute; top: -42px; left: -16px; z-index: 3;
    transform: rotate(12deg);
    background: #e8433f; color: #fff; border-radius: 8px;
    font-size: 21px; font-weight: 700; letter-spacing: 3px;
    line-height: 1.25; text-align: center; padding: 8px 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .tag-red::after {
    content: ""; position: absolute; bottom: -26px; left: 50%;
    width: 3px; height: 26px; background: #b98a4a;
    transform: translateX(-50%) rotate(8deg);
  }
  /* placeholder sizes */
  .icon-bagel { width: 38px; height: 38px; }
  .big-bagel { width: 172px; height: 150px; }
  .ph-cheese { width: 64px; height: 48px; }
  .ph-bagel1 { width: 56px; height: 52px; }
  .ph-walnut { width: 56px; height: 46px; }
  .ph-oven { width: 92px; height: 78px; }
  .ph-bowl1 { width: 92px; height: 58px; }
  .ph-spread1 { width: 74px; height: 56px; }
  .ph-bowl2 { width: 92px; height: 58px; }
  .ph-spread2 { width: 78px; height: 62px; }
  .ph-banana-bagel { width: 80px; height: 62px; }
  .ph-slices { width: 46px; height: 26px; }
  .big-bagel2 { width: 168px; height: 142px; }
  .ph-cocoa { width: 46px; height: 62px; }
  .ph-banana { width: 40px; height: 62px; }
</style>
</head>
<body>
<div class="page">
  <div class="panel">

    <div class="tag-genki">元气<br>满满</div>

    <!-- ============ TOP SECTION ============ -->
    <section class="sec-top">
      <h1 class="title">核桃奶酪贝果 <span class="placeholder icon-bagel">[图: 贝果]</span></h1>

      <div class="top-grid">
        <div class="top-left">
          <figure class="placeholder big-bagel">[图: 核桃奶酪贝果三明治]</figure>
        </div>
        <div class="top-right">
          <h2>1.准备材料</h2>
          <div class="ing-row">
            <div class="ing">
              <figure class="placeholder ph-cheese">[图: 奶酪包装]</figure>
              <span>奶酪</span>
            </div>
            <div class="ing">
              <figure class="placeholder ph-bagel1">[图: 贝果]</figure>
              <span>贝果</span>
            </div>
            <div class="ing">
              <figure class="placeholder ph-walnut">[图: 核桃仁]</figure>
              <span>核桃仁</span>
            </div>
          </div>
          <p class="step">2.核桃仁烤2分钟左右，搓掉皮，<br>捣碎后和奶酪混合到一起，涂抹<br>在贝果上</p>
          <div class="proc-row">
            <figure class="placeholder ph-oven">[图: 烤箱]</figure>
            <span class="arrow">↝</span>
            <figure class="placeholder ph-bowl1">[图: 碗装核桃碎]</figure>
            <span class="arrow">↝</span>
            <figure class="placeholder ph-spread1">[图: 涂抹奶酪的贝果]</figure>
          </div>
        </div>
      </div>
    </section>

    <figure class="placeholder girl">[插画: 拿勺子的女孩]</figure>

    <div class="divider"></div>

    <!-- ============ BOTTOM SECTION ============ -->
    <section class="sec-bottom">
      <h1 class="title">香蕉可可贝果 <span class="placeholder icon-bagel">[图: 贝果]</span></h1>

      <div class="prep-row">
        <h2>1.准备材料</h2>
        <span class="credit">@哎呀牌绿豆汤</span>
      </div>

      <div class="ing-row left">
        <div class="ing">
          <figure class="placeholder ph-cheese">[图: 奶酪包装]</figure>
          <span>奶酪</span>
        </div>
        <div class="ing">
          <figure class="placeholder ph-bagel1">[图: 贝果]</figure>
          <span>贝果</span>
        </div>
        <div class="ing">
          <figure class="placeholder ph-banana">[图: 香蕉]</figure>
          <span>香蕉</span>
        </div>
        <div class="ing">
          <figure class="placeholder ph-cocoa">[图: 可可粉包装]</figure>
          <span>可可粉</span>
        </div>
      </div>

      <p class="step">2.奶酪加入可可粉，搅拌均匀涂<br>抹在贝果上摆上水果</p>

      <div class="proc-row bottom">
        <figure class="placeholder ph-bowl2">[图: 碗装可可奶酪]</figure>
        <span class="arrow">↝</span>
        <figure class="placeholder ph-spread2">[图: 涂可可酱的贝果]</figure>
        <span class="arrow">↝</span>
        <figure class="placeholder ph-banana-bagel">[图: 摆香蕉片的贝果]</figure>
        <div class="slices-wrap">
          <figure class="placeholder ph-slices">[图: 香蕉片]</figure>
          <span class="arrow">↙</span>
        </div>
        <div class="right-cluster">
          <div class="tag-red">平安<br>喜乐</div>
          <figure class="placeholder big-bagel2">[图: 香蕉可可贝果三明治]</figure>
        </div>
      </div>
    </section>

  </div>
</div>
</body>
</html>
