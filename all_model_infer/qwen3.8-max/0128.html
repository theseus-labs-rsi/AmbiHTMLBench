<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Document</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #e0e0e0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            line-height: 1.8;
            font-size: 18px;
        }
        .title {
            color: #f5a623;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .item {
            margin-bottom: 15px;
            text-align: justify;
        }
        .indent {
            padding-left: 2em;
        }
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-35deg);
            color: rgba(76, 175, 80, 0.25);
            font-size: 80px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }
        .content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="watermark">琳子幼资</div>
        <div class="content">
            <div class="title">7.当题目中出现“原则”时，可用以下模板：</div>
            
            <div class="item">(一)教育性原则。...体现教育目标，有利于幼儿身的全面发展</div>
            
            <div class="item">(二)个别差异性原则。每个幼儿不一样，教师要因材施教</div>
            
            <div class="item indent">(三) 科学性原则 。...能给幼儿正确的启蒙教育</div>
            
            <div class="item">(四)发展适宜性原则。考虑到不同年龄阶段孩子的特点</div>
            
            <div class="item indent">(五) 整体性原则 。考虑到多方面的要素，促进幼儿整体的发展</div>
            
            <div class="item indent">(六) 活动性原则。注重幼儿亲身体验，直接参与，以各种游戏活动为主</div>
        </div>
    </div>
</body>
</html>
