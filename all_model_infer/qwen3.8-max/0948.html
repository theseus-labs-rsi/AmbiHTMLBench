<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会被无缘无故讨厌的原因有哪些</title>
    <style>
        body {
            /* Simulating the textured paper background */
            background-color: #e8e8e8;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: "KaiTi", "STKaiti", "楷体", serif; /* Using a serif/kai font to match the style */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            color: #1a1a1a;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            /* Subtle shadow to lift it off the background slightly if needed, though the image is flat */
        }

        h1 {
            color: #2e7d32; /* Dark green */
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: justify;
        }

        .intro {
            margin-bottom: 10px;
        }

        .point {
            margin-bottom: 10px;
        }

        .highlight-green {
            color: #2e7d32; /* Dark green matching the header */
            font-weight: bold;
        }

        .footer-question {
            margin-top: 20px;
        }

        /* Specific styling for the circled numbers to ensure they look right */
        .circle-num {
            font-family: sans-serif; /* Fallback for symbols */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>1、会被无缘无故讨厌的原因有哪些?</h1>

    <p class="intro">“无缘无故的讨厌”有很多原因，比如:</p>

    <p class="point">
        <span class="circle-num">①</span> 长相凶狠的人让我们害怕(承认吧，我们都是外貌协会);
    </p>

    <p class="point">
        <span class="circle-num">②</span> 刻板印象让你对一个人产生先入为主的偏见:印象里重庆人火爆，上海人爱计较。于是你真去到重庆，并且正好遇到重庆人当街斗殴，你的大脑就会激活“重庆人火爆”的认知并加强;
    </p>

    <p class="point">
        <span class="circle-num">③</span> <span class="highlight-green">心理学上认为的:对一个人的好恶可能是“投射效应”在起作用。</span>
    </p>

    <p class="footer-question">
        那么，“投射效应”到底是如何会让别人无缘无故讨厌你的呢?
    </p>
</div>

</body>
</html>
