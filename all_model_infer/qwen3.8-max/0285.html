<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All In: The Fight for Democracy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arial+Narrow:wght@700&family=Open+Sans:wght@400;600;700;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Open Sans', Arial, sans-serif;
        }

        .poster {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            aspect-ratio: 2 / 3;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .amazon-original {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.3em;
            color: #000;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 60px;
        }

        .subtitle {
            color: #1a56db;
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.02em;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 80px;
        }

        .all-in {
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: #1a56db;
            line-height: 0.8;
            letter-spacing: -0.02em;
            margin-right: 15px;
            transform: scaleY(1.1);
        }

        .fight-for-democracy {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .fight-line {
            color: #1a56db;
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.1;
            border-bottom: 6px solid #e32626;
            padding-bottom: 2px;
            margin-bottom: 8px;
        }

        .democracy-line {
            color: #1a56db;
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.1;
            border-bottom: 6px solid #e32626;
            padding-bottom: 2px;
        }

        .laurels {
            width: 120px;
            height: 60px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Simulating the laurel wreath with CSS/SVG placeholder logic */
        .laurel-svg {
            width: 100%;
            height: 100%;
            fill: #6ba4d8;
        }

        .credits {
            color: #6ba4d8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .credits span {
            margin: 0 5px;
        }

        .coming-soon {
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 0.02em;
        }

        .release-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            width: 100%;
        }

        .date {
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .divider {
            width: 2px;
            height: 25px;
            background-color: #000;
        }

        .prime-video-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #000;
            position: relative;
            display: inline-block;
        }
        
        /* Simplified Prime Video Logo representation */
        .prime-text {
            font-family: Arial, sans-serif;
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        .smile-arrow {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 10px;
            border-bottom: 2px solid #000;
            border-radius: 50%;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 85% 100%, 85% 50%, 15% 50%, 15% 100%, 0 100%);
        }
        /* Better arrow simulation */
        .arrow-container {
            position: relative;
            display: inline-block;
        }
        .arrow-curve {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 8px;
            border-bottom: 2px solid black;
            border-radius: 0 0 50% 50%;
        }
        .arrow-head {
            position: absolute;
            bottom: -6px;
            right: -2px;
            width: 0; 
            height: 0; 
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid black;
            transform: rotate(-45deg);
        }

        .footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .rating-box {
            width: 50px;
            height: 30px;
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.4rem;
            line-height: 1.2;
            text-align: center;
        }
        .rating-pg {
            font-weight: bold;
            font-size: 0.6rem;
            border-bottom: 1px solid #000;
            width: 100%;
        }

        .hashtag-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hashtag-line-top {
            width: 180px;
            height: 3px;
            background-color: #e32626;
            margin-bottom: 5px;
        }

        .hashtag {
            color: #1a56db;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hashtag-line-bottom {
            width: 180px;
            height: 3px;
            background-color: #e32626;
            margin-top: 5px;
        }

        .amazon-studios {
            text-align: right;
            font-size: 0.5rem;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            line-height: 1.2;
            letter-spacing: 0.1em;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            .all-in { font-size: 5rem; }
            .fight-line, .democracy-line { font-size: 1.5rem; }
            .subtitle { font-size: 1rem; }
            .amazon-original { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="poster">
        <div class="amazon-original">Amazon Original</div>

        <div class="subtitle">How the Right to Vote Went Wrong</div>

        <div class="title-container">
            <div class="all-in">ALL IN</div>
            <div class="fight-for-democracy">
                <div class="fight-line">The Fight For</div>
                <div class="democracy-line">Democracy</div>
            </div>
        </div>

        <div class="laurels">
            <!-- SVG Placeholder for Telluride Film Festival Laurels -->
            <svg class="laurel-svg" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <!-- Left Branch -->
                <path d="M20,45 Q10,25 25,5 Q20,15 22,25 Q15,35 20,45" fill="none" stroke="#6ba4d8" stroke-width="1.5"/>
                <path d="M22,40 Q15,35 18,30" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M23,35 Q16,30 19,25" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M24,30 Q17,25 20,20" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M25,25 Q18,20 21,15" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M25,20 Q18,15 22,10" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                
                <!-- Right Branch -->
                <path d="M80,45 Q90,25 75,5 Q80,15 78,25 Q85,35 80,45" fill="none" stroke="#6ba4d8" stroke-width="1.5"/>
                <path d="M78,40 Q85,35 82,30" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M77,35 Q84,30 81,25" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M76,30 Q83,25 80,20" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M75,25 Q82,20 79,15" fill="none" stroke="#6ba4d8" stroke-width="1"/>
                <path d="M75,20 Q82,15 78,10" fill="none" stroke="#6ba4d8" stroke-width="1"/>

                <!-- Text inside -->
                <text x="50" y="20" font-family="serif" font-size="6" fill="#6ba4d8" text-anchor="middle" font-style="italic">Telluride</text>
                <text x="50" y="28" font-family="serif" font-size="6" fill="#6ba4d8" text-anchor="middle" font-style="italic">Filmfestival</text>
                <text x="50" y="36" font-family="sans-serif" font-size="5" fill="#6ba4d8" text-anchor="middle" font-weight="bold">2020</text>
            </svg>
        </div>

        <div class="credits">
            Written by <span>Jack Youngelson</span> &nbsp;&nbsp; Directed by <span>Liz Garbus</span> and <span>Lisa Cortés</span>
        </div>

        <div class="coming-soon">Coming Soon to Theaters</div>

        <div class="release-info">
            <div class="date">September 18</div>
            <div class="divider"></div>
            <div class="prime-video-logo">
                <span class="prime-text">prime video</span>
                <div class="arrow-container">
                    <div class="arrow-curve"></div>
                    <div class="arrow-head"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="rating-box">
                <div class="rating-pg">PG-13</div>
                <div>[illegible]</div>
            </div>

            <div class="hashtag-container">
                <div class="hashtag-line-top"></div>
                <div class="hashtag">#AllInForVoting</div>
                <div class="hashtag-line-bottom"></div>
            </div>

            <div class="amazon-studios">
                Amazon<br>Studios
            </div>
        </div>
    </div>

</body>
</html>
