<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals & Objectives</title>
    <style>
        body {
            font-family: 'Calibri', 'Arial', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            color: #3e2723;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        h1 {
            text-align: right;
            font-size: 48px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 40px;
            color: #3e2723;
        }

        .subtitle {
            font-size: 28px;
            margin-bottom: 50px;
            color: #3e2723;
        }

        .content-area {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .goals-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-right: 20px;
        }

        .goal-group {
            margin-bottom: 40px;
        }

        .goal-item {
            font-size: 32px;
            color: #006d6f;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        .brackets-column {
            width: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .bracket-svg {
            height: 100%;
            width: 60px;
        }

        .labels-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: 20px;
        }

        .label-group {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .arrow-container {
            width: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow-svg {
            width: 60px;
            height: 40px;
            fill: #006d6f;
        }

        .label-text {
            font-size: 28px;
            color: #3e2723;
            text-align: center;
            line-height: 1.3;
            flex: 1;
        }

        /* Specific spacing adjustments to match image */
        .group-1 {
            flex: 1.2;
        }
        
        .group-2 {
            flex: 0.8;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Goals &amp; Objectives</h1>
    
    <div class="subtitle">From January 1, 2016 – December 31, 2018, we will:</div>

    <div class="content-area">
        <!-- Left Column: Goals -->
        <div class="goals-column">
            <div class="goal-group group-1">
                <div class="goal-item">Goal 1: XX</div>
                <div class="goal-item">Goal 2: XX</div>
                <div class="goal-item">Goal 3: XX</div>
            </div>
            <div class="goal-group group-2">
                <div class="goal-item">Goal 4: Money</div>
                <div class="goal-item">Goal 5: People &amp; Infrastructure</div>
            </div>
        </div>

        <!-- Middle Column: Brackets -->
        <div class="brackets-column">
            <div class="goal-group group-1" style="width: 100%; display: flex; align-items: center;">
                <svg class="bracket-svg" viewBox="0 0 50 200" preserveAspectRatio="none">
                    <path d="M 5,5 L 45,5 L 45,195 L 5,195" fill="none" stroke="#3e2723" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
                </svg>
            </div>
            <div class="goal-group group-2" style="width: 100%; display: flex; align-items: center;">
                <svg class="bracket-svg" viewBox="0 0 50 200" preserveAspectRatio="none">
                    <path d="M 5,5 L 45,5 L 45,195 L 5,195" fill="none" stroke="#3e2723" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
                </svg>
            </div>
        </div>

        <!-- Right Column: Arrows and Labels -->
        <div class="labels-column">
            <div class="label-group group-1">
                <div class="arrow-container">
                    <svg class="arrow-svg" viewBox="0 0 100 60">
                        <polygon points="100,20 40,20 40,0 0,30 40,60 40,40 100,40" />
                    </svg>
                </div>
                <div class="label-text">
                    Theory<br>of<br>Change<br>Goals
                </div>
            </div>
            
            <div class="label-group group-2">
                <div class="arrow-container">
                    <svg class="arrow-svg" viewBox="0 0 100 60">
                        <polygon points="100,20 40,20 40,0 0,30 40,60 40,40 100,40" />
                    </svg>
                </div>
                <div class="label-text">
                    Organization<br>Goals
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
