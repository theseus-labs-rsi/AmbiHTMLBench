<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是好的开始</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: "Kaiti", "STKaiti", "KaiTi", "楷体", serif;
        }

        .page {
            width: 500px;
            height: 700px;
            background-color: #e6e4d8; /* Beige paper color */
            position: relative;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            /* Create the horizontal lines */
            background-image: repeating-linear-gradient(
                transparent,
                transparent 39px,
                #888 39px,
                #888 40px
            );
            background-position: 0 38px; /* Align lines with text */
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 10px;
            color: #333;
            border-bottom: 1px solid #888;
            background-color: #e6e4d8;
            z-index: 10;
        }

        .days {
            display: flex;
            border: 1px solid #333;
        }

        .day {
            padding: 2px 4px;
            border-right: 1px solid #333;
        }
        .day:last-child {
            border-right: none;
        }

        .date-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-line {
            width: 20px;
            border-bottom: 1px solid #333;
            display: inline-block;
        }

        .content {
            position: absolute;
            top: 40px; /* Start below header */
            left: 0;
            width: 100%;
            padding: 0 40px;
            box-sizing: border-box;
            color: #1a1a1a;
            font-size: 26px;
            line-height: 40px; /* Match the background gradient */
            font-weight: bold;
        }

        .title {
            text-align: center;
            margin-bottom: 40px; /* Skip a line */
            font-size: 28px;
        }

        .line {
            white-space: nowrap;
            overflow: hidden;
        }
        
        /* Simulate handwriting slight variations */
        .handwriting {
            transform: rotate(-0.5deg);
            display: inline-block;
        }

    </style>
</head>
<body>

    <div class="page">
        <div class="header">
            <div class="days">
                <div class="day">Tu</div>
                <div class="day">We</div>
                <div class="day">Th</div>
                <div class="day">Fr</div>
                <div class="day">Sa</div>
                <div class="day">Su</div>
            </div>
            <div class="date-section">
                <span>Date.</span>
                <span class="date-line"></span> / 
                <span class="date-line"></span> / 
                <span class="date-line"></span>
            </div>
        </div>

        <div class="content">
            <div class="title line">这是好的开始</div>
            
            <div class="line">从你看到这篇文章开始</div>
            <div class="line">你会越来越有钱</div>
            <div class="line">越来越好看</div>
            <div class="line">生活和心态也会越来越好</div>
            <div class="line">请相信大数据</div>
            <div class="line">是你自己把一切美好的东西</div>
            <div class="line">都吸引了过来</div>
            <div class="line">你已经调到了接收钱的频率</div>
            <div class="line">接收美的频率</div>
            <div class="line">你的能量频率对了才接收到这</div>
            <div class="line">条信息</div>
            <div class="line">留下一句“全收到”</div>
            <div class="line">愿所有的愿望全能实现！</div>
        </div>
    </div>

</body>
</html>
