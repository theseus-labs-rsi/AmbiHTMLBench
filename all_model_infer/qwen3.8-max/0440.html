<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio Web - Vol.07</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --bg-top: #f4f4f4;
            --bg-bottom: #aef5f5;
            --divider-blue: #2b2bff;
            --text-black: #000000;
            --folder-bg: #e0e0e0;
            --folder-tab: #d0d0d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #333; /* Dark background outside the poster */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .poster {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-top);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            aspect-ratio: 3 / 4; /* Approximate ratio based on image */
            display: flex;
            flex-direction: column;
        }

        /* --- Top Section --- */
        .top-section {
            flex: 1;
            padding: 20px 25px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .logo-script {
            font-size: 2.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -2px;
            /* Simulating the brush/script look */
            font-family: 'Brush Script MT', cursive, sans-serif; 
            transform: skewX(-10deg);
        }
        
        /* Fallback for the specific logo shape if font fails */
        .logo-custom {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .share-text {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .vol-text {
            font-size: 0.9rem;
            font-weight: 700;
            margin-left: 5px;
        }

        .web-badge {
            border: 2px solid black;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            background: white;
        }

        .folder-icon-small {
            width: 16px;
            height: 14px;
            background: #555;
            clip-path: polygon(0 20%, 30% 20%, 40% 0, 100% 0, 100% 100%, 0 100%);
        }

        .divider-line {
            width: 100%;
            height: 2px;
            background-color: black;
            margin-bottom: 20px;
        }

        /* --- Folder Grid Area --- */
        .folders-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 15px;
            padding: 10px;
        }

        .folder {
            width: 140px;
            height: 90px;
            background-color: var(--folder-bg);
            position: relative;
            border-radius: 2px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            /* Texture simulation */
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 4px 4px;
        }

        /* Folder Tab */
        .folder::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 10px;
            width: 40px;
            height: 10px;
            background-color: var(--folder-bg);
            border-radius: 2px 2px 0 0;
            z-index: -1;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 4px 4px;
        }

        .folder-num {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #555;
        }
        
        .folder-num-right {
            left: auto;
            right: 8px;
        }

        .folder h3 {
            font-size: 1.1rem;
            font-weight: 800;
            line-height: 1.1;
            color: #000;
            z-index: 2;
        }

        .folder p {
            font-size: 0.65rem;
            font-weight: 700;
            color: #000;
            margin-top: 2px;
            z-index: 2;
        }

        /* Specific Folder Positioning & Rotation */
        .f1 { transform: rotate(-35deg) translate(-10px, -10px); width: 150px; height: 95px; }
        .f2 { transform: translateY(-20px); }
        .f3 { transform: rotate(25deg) translate(10px, -10px); width: 130px; height: 95px; }
        .f4 { transform: translate(-20px, 10px); }
        .f5 { transform: translate(20px, 10px); width: 150px; }

        /* Adjust text for rotated folders */
        .f1 h3 { font-size: 1.4rem; }
        .f3 h3 { font-size: 1.2rem; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px;}
        .f3 p { writing-mode: vertical-rl; }
        
        /* Re-doing F3 layout to match image better (Diagonal text) */
        .f3 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .f3 .diag-text {
            transform: rotate(0deg); /* The folder is rotated, text stays relative */
            font-size: 1.3rem;
            font-weight: 900;
            line-height: 1;
        }
        .f3 .sub-text {
            font-size: 0.6rem;
            margin-top: 5px;
        }

        /* --- Divider Strip --- */
        .blue-strip {
            height: 40px;
            background-color: var(--divider-blue);
            width: 100%;
        }

        /* --- Bottom Section --- */
        .bottom-section {
            background-color: var(--bg-bottom);
            flex: 1.2;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-title {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.1;
            color: black;
            letter-spacing: 2px;
        }

        .title-line {
            width: 100%;
            height: 3px;
            background-color: black;
            margin: 10px 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 15px;
        }

        .copyright {
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .footer-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-triangle {
            width: 30px;
            height: 30px;
            border: 2px solid black;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.2rem;
        }
        
        .icon-triangle span {
            transform: translateY(-2px);
        }

        .barcode {
            height: 35px;
            width: 120px;
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 2px,
                transparent 2px,
                transparent 4px,
                #000 4px,
                #000 5px,
                transparent 5px,
                transparent 8px
            );
            position: relative;
        }
        
        .barcode::after {
            content: "((( JIDN SHARE @2023 )))";
            position: absolute;
            bottom: -12px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.5rem;
            font-weight: bold;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            .main-title { font-size: 2.5rem; }
            .folder { width: 110px; height: 75px; }
            .f1 h3 { font-size: 1.1rem; }
            .f3 .diag-text { font-size: 1rem; }
            .logo-script { font-size: 2rem; }
        }

    </style>
</head>
<body>

    <div class="poster">
        <!-- Top Half -->
        <div class="top-section">
            <div class="header">
                <div class="logo-area">
                    <!-- Simulating the stylized logo with text -->
                    <span class="logo-custom" style="font-style: italic; transform: skewX(-15deg); display: inline-block;">Jidn</span>
                    <span class="share-text">(分享)</span>
                    <span class="vol-text">Vol.07</span>
                </div>
                <div class="web-badge">
                    <div class="folder-icon-small"></div>
                    Design studio web
                </div>
            </div>
            
            <div class="divider-line"></div>

            <div class="folders-container">
                <!-- Folder 1 -->
                <div class="folder f1">
                    <div class="folder-num">1</div>
                    <h3>ABCD</h3>
                    <p>A BLACK<br>COVER DESIGN</p>
                </div>

                <!-- Folder 2 -->
                <div class="folder f2">
                    <div class="folder-num">2</div>
                    <h3>条件反射</h3>
                    <p>REFLEX<br>DESIGN</p>
                </div>

                <!-- Folder 3 -->
                <div class="folder f3">
                    <div class="folder-num folder-num-right">3</div>
                    <div style="transform: rotate(0deg); text-align: center;">
                        <div style="font-size: 0.7rem; font-weight: bold;">STUDIO</div>
                        <div style="font-size: 0.6rem; font-weight: bold;">No. EO</div>
                        <div class="diag-text">立入禁止</div>
                    </div>
                </div>

                <!-- Folder 4 -->
                <div class="folder f4">
                    <div class="folder-num folder-num-right">4</div>
                    <h3>王志弘</h3>
                    <p>WANG ZHI HONG</p>
                </div>

                <!-- Folder 5 -->
                <div class="folder f5">
                    <div class="folder-num folder-num-right">5</div>
                    <div style="display: flex; align-items: baseline; gap: 5px;">
                        <h3 style="font-size: 1.4rem;">NICE</h3>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-end; padding: 0 5px;">
                        <p style="text-align: left; font-size: 0.6rem;">NICE LAB<br>STUDIO</p>
                        <h3 style="font-size: 1.4rem;">LAB</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Blue Divider -->
        <div class="blue-strip"></div>

        <!-- Bottom Half -->
        <div class="bottom-section">
            <div>
                <div class="main-title">国内知名设计</div>
                <div class="title-line"></div>
                <div class="main-title">工作室的官网</div>
                <div class="title-line"></div>
            </div>

            <div class="footer">
                <div class="copyright">
                    Copyright© 2023 &nbsp;&nbsp;&nbsp; (官网)<br>
                    Jidn share all rights reserved.
                </div>
                <div class="footer-icons">
                    <div class="icon-triangle">
                        <span>A</span>
                    </div>
                    <div class="barcode"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
