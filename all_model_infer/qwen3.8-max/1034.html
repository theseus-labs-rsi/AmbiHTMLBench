<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三大核心参数解读</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 500px;
            min-height: 700px;
            background-color: #ffffff;
            position: relative;
            padding-top: 40px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Top perforation holes */
        .holes-container {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .hole {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background-color: #fff;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header-section {
            position: relative;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .step-badge {
            position: absolute;
            left: 0;
            top: 0;
            width: 40px;
            height: 90px;
            background: linear-gradient(to bottom, #2c3e50, #8e44ad, #c0392b);
            color: white;
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 5px;
            border-radius: 0 5px 5px 0;
        }

        .main-title {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin: 0;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }

        /* Content Sections */
        .content-item {
            display: flex;
            align-items: flex-start;
            margin: 0 30px 40px 30px;
        }

        .icon-container {
            width: 60px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            padding-top: 5px;
        }

        .text-container {
            flex-grow: 1;
            margin-left: 15px;
        }

        .item-title {
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin-bottom: 8px;
        }

        .item-desc {
            font-size: 14px;
            color: #333;
            line-height: 1.6;
            text-align: justify;
        }

        /* SVG Icons Styling */
        svg {
            width: 50px;
            height: 50px;
            fill: #333;
        }

        .icon-4k {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .icon-4k span:first-child { font-size: 16px; }
        .icon-4k span:last-child { font-size: 12px; }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Top Holes -->
    <div class="holes-container">
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
        <div class="hole"></div>
    </div>

    <!-- Header -->
    <div class="header-section">
        <div class="step-badge">第二步</div>
        <h1 class="main-title">三大核心参数解读</h1>
        <div class="sub-title">内存/芯片/分辨率参数解读</div>
    </div>

    <!-- Item 1: Memory -->
    <div class="content-item">
        <div class="icon-container">
            <!-- SD Card Icon Approximation -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2H6ZM13 3.5L18.5 9H14C13.4477 9 13 8.55228 13 8V3.5ZM8 12H16V14H8V12ZM8 16H16V18H8V16Z" fill="#333"/>
                <rect x="7" y="4" width="2" height="4" fill="#333"/>
                <rect x="10" y="4" width="2" height="4" fill="#333"/>
            </svg>
        </div>
        <div class="text-container">
            <div class="item-title">1.看内存</div>
            <div class="item-desc">
                内存越大速度越快，小于8GB不建议购买。(圈圈：GB≠Gb,大GB是小Gb的8倍，尽量选择大GB)
            </div>
        </div>
    </div>

    <!-- Item 2: Chip -->
    <div class="content-item">
        <div class="icon-container">
            <!-- CPU Icon Approximation -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 2V4H7C5.89543 4 5 4.89543 5 6V8H3V10H5V14H3V16H5V18C5 19.1046 5.89543 20 7 20H9V22H11V20H13V22H15V20H17C18.1046 20 19 19.1046 19 18V16H21V14H19V10H21V8H19V6C19 4.89543 18.1046 4 17 4H15V2H13V4H11V2H9ZM7 6H17V18H7V6Z" fill="#333"/>
                <text x="12" y="13.5" font-size="5" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#333">CPU</text>
            </svg>
        </div>
        <div class="text-container">
            <div class="item-title">2.看芯片</div>
            <div class="item-desc">
                主流芯片A73和A53，追求性能玩游戏选A73，看看电视想省电选A53。
            </div>
        </div>
    </div>

    <!-- Item 3: Resolution -->
    <div class="content-item">
        <div class="icon-container">
            <div class="icon-4k">
                <span>4K</span>
                <span>UHD</span>
            </div>
        </div>
        <div class="text-container">
            <div class="item-title">3.看分辨率</div>
            <div class="item-desc">
                分辨率越高越清晰。（目前电视基本都是超高清4K也就是3840×2160的分辨率）
            </div>
        </div>
    </div>

</div>

</body>
</html>
