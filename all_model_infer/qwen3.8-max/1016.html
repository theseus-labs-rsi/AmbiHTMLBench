<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宿建议</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f4f1ea; /* Light beige background to simulate paper */
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZjRmMWVhIi8+CjxwYXRoIGQ9Ik0wIDBMNCA0Wk00IDBMMCA0WiIgc3Ryb2tlPSIjZTBlMGUwIiBzdHJva2Utd2lkdGg9IjAuNSIvPgo8L3N2Zz4='); /* Subtle texture pattern */
            color: #333;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.4); /* Slight transparency to blend with bg */
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            letter-spacing: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .underline-red {
            border-bottom: 2px solid #d9534f;
            padding-bottom: 2px;
        }

        h2 {
            text-align: center;
            font-size: 1.4em;
            margin-top: 10px;
            margin-bottom: 40px;
            font-weight: bold;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Decorative dots under subtitle */
        h2::after {
            content: "。 。 。";
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: #d9534f;
            font-size: 0.6em;
            letter-spacing: 5px;
        }

        .section {
            margin-bottom: 30px;
            text-align: justify;
            font-size: 1.05em;
        }

        .label {
            font-weight: bold;
        }

        .wavy-underline {
            text-decoration: underline wavy #d9534f;
            text-underline-offset: 4px;
        }

        .straight-underline {
            text-decoration: underline solid #d9534f;
            text-underline-offset: 4px;
        }

        p {
            margin: 0;
            text-indent: 0; /* The image uses brackets for labels, not indentation */
        }
        
        /* Specific spacing for the bracketed labels */
        .bracket-label {
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>住宿<span class="underline-red">建议</span></h1>
    
    <div style="text-align: center;">
        <h2>[ 选酒店关注点 ]</h2>
    </div>

    <div class="section">
        <p>
            <span class="bracket-label">【<span class="wavy-underline">沙滩</span>】</span>：亲子家庭出行游，对<span class="straight-underline">沙滩的质量</span>和海水的选择上要干净、清澈，<span class="straight-underline">沙子细软不扎脚</span>的。有私人海滩更佳
        </p>
    </div>

    <div class="section">
        <p>
            <span class="bracket-label">【<span class="wavy-underline">酒店设施</span>】</span>：针对酒店的洗护<span class="straight-underline">有没有提供宝宝专用</span>，以及宝宝专用的洗漱台和马桶等等，以及<span class="straight-underline">有没有婴儿床、床围</span>等床上用品提供
        </p>
    </div>

    <div class="section">
        <p>
            <span class="bracket-label">【<span class="wavy-underline">房间</span>】</span>：房间主题最好有小朋友喜欢的主题，<span class="straight-underline">比如太空主题</span>的房间或者星空主题的房间；以及房间有没有提供儿童帐篷、滑梯等玩乐设施。房型<span class="straight-underline">面积最好大一些</span>，<span class="straight-underline">有足够的空间</span>给小朋友跑跳玩乐
        </p>
    </div>

    <div class="section">
        <p>
            <span class="bracket-label">【<span class="wavy-underline">儿童玩乐设施</span>】</span>：看酒店儿童玩乐设施<span class="straight-underline">室内还是室外</span>.设施是不是<span class="wavy-underline">每日一消毒</span>，看空间宽不宽敞。有没有家长休息区。有没有<span class="straight-underline">托管服务</span>，托管时间，托管玩的项目等具体小朋友玩乐细节
        </p>
    </div>
</div>

</body>
</html>
