<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忽视你的需求，内耗你的精力</title>
    <style>
        body {
            background-color: #f4f5f3;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #4a6b5d;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .title-badge {
            background-color: #4a6b5d;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            letter-spacing: 1px;
        }

        .battery-icon {
            width: 50px;
            height: 60px;
            margin-right: 10px;
            margin-top: -10px;
        }

        .content-block {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: justify;
            font-weight: 500;
        }

        .bold-text {
            font-weight: bold;
        }

        .check-list {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            font-size: 18px;
            line-height: 1.8;
            font-weight: 500;
        }

        .check-icon {
            color: #4a6b5d;
            margin-right: 10px;
            font-weight: bold;
            font-size: 20px;
            margin-top: 2px;
        }

        .footer-text {
            font-size: 18px;
            line-height: 1.8;
            font-weight: bold;
            margin-top: 30px;
        }

        /* SVG styling for the battery icon to match the image */
        .svg-battery {
            fill: none;
            stroke: #4a6b5d;
            stroke-width: 2;
        }
        .svg-battery-body {
            fill: #a8caba;
            stroke: #4a6b5d;
            stroke-width: 2;
        }
        .svg-lightning {
            fill: #e74c3c;
            stroke: #333;
            stroke-width: 1;
        }
        .svg-slash {
            stroke: #333;
            stroke-width: 2;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="title-badge">3. 忽视你的需求，内耗你的精力</div>
        <div class="battery-icon">
            <svg viewBox="0 0 40 50" width="100%" height="100%">
                <!-- Battery Top -->
                <rect x="12" y="2" width="16" height="4" fill="#4a6b5d" />
                <!-- Battery Body -->
                <rect x="4" y="6" width="32" height="40" rx="2" class="svg-battery-body" />
                <!-- Lightning Bolt -->
                <path d="M22 12 L12 26 L19 26 L16 38 L28 22 L21 22 Z" class="svg-lightning" />
                <!-- Slash through it (indicating empty/draining) -->
                <line x1="2" y1="48" x2="38" y2="2" class="svg-slash" />
            </svg>
        </div>
    </div>

    <div class="content-block">
        这一种人，不仅可能是身边的朋友，亲密关系中也会出现。爱我们的人，也可能会“害”我们。
    </div>

    <div class="content-block">
        <span class="bold-text">忽视需求，是关系中隐藏的一把刀，</span>对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。
    </div>

    <div class="content-block">
        而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。
    </div>

    <div class="content-block">
        <span class="bold-text">经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。</span>
    </div>

    <div class="check-list">
        <span class="check-icon">✔</span>
        <span>面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。</span>
    </div>

    <div class="footer-text">
        与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。
    </div>
</div>

</body>
</html>
