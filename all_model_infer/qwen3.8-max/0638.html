<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨读笔记</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --grid-color: #e6e2d6;
            --border-color: #cfc9b8;
            --header-bg: #e3ddcf;
            --text-color: #5a5245;
            --tab-active: #dcd5c4;
            --tab-inactive: #cbbfa6;
            --font-main: "KaiTi", "STKaiti", "SimSun", serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #e0e0e0;
            font-family: var(--font-main);
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 800px;
            background-color: var(--bg-color);
            /* Subtle grid pattern */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 20px;
        }

        /* Top Navigation Tabs */
        .top-nav {
            display: flex;
            height: 30px;
            background-color: var(--tab-inactive);
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-item {
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(0,0,0,0.05);
            cursor: default;
        }

        .nav-item.active {
            background-color: var(--tab-active);
            font-weight: bold;
        }

        .nav-spacer {
            flex-grow: 1;
        }

        /* Main Title */
        .main-title {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 20px;
            letter-spacing: 2px;
        }

        /* Main Table Structure */
        .note-table {
            width: 96%;
            margin: 0 auto;
            border-collapse: collapse;
            border: 1px solid var(--border-color);
            table-layout: fixed;
        }

        .note-table td, .note-table th {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            vertical-align: middle;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.3); /* Slight lighten for cells */
        }

        /* Specific Row Heights */
        .row-sm { height: 30px; }
        .row-md { height: 60px; }
        .row-lg { height: 150px; }
        .row-xl { height: 100px; }

        /* Label Column Styling */
        .label-col {
            width: 80px;
            text-align: left;
            font-weight: bold;
            background-color: rgba(227, 221, 207, 0.4);
        }

        .content-col {
            text-align: left;
        }

        /* Radio Button List Area */
        .radio-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .radio-list li {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .radio-circle {
            width: 12px;
            height: 12px;
            border: 1px solid var(--text-color);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        /* Analysis Section Header */
        .analysis-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
            background-color: rgba(227, 221, 207, 0.4);
        }

        .analysis-item {
            display: flex;
            align-items: center;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            opacity: 0.5;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            pointer-events: none;
        }
        
        .watermark span {
            font-family: sans-serif;
            font-size: 16px;
        }

    </style>
</head>
<body>

<div class="page-container">
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="nav-item">行测</div>
        <div class="nav-item" style="padding: 0 5px;">&gt;</div>
        <div class="nav-item">常识</div>
        <div class="nav-item">言语</div>
        <div class="nav-item">数量</div>
        <div class="nav-item">判断</div>
        <div class="nav-item">资料</div>
        <div class="nav-spacer"></div>
        <div class="nav-item active">申论</div>
        <div class="nav-spacer"></div>
        <div class="nav-item">纸张</div>
        <div class="nav-item">计划</div>
    </div>

    <!-- Title -->
    <div class="main-title">· 晨 读 笔 记</div>

    <!-- Main Content Table -->
    <table class="note-table">
        <!-- Row 1: Theme -->
        <tr class="row-sm">
            <td class="label-col">主题</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 2: Application Area -->
        <tr class="row-sm">
            <td class="label-col">应用领域</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 3: Hot Events -->
        <tr class="row-sm">
            <td class="label-col">热门事件</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 4: Macro Policy -->
        <tr class="row-sm">
            <td class="label-col">宏观政策</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 5: Media Commentary Header -->
        <tr class="row-sm">
            <td class="label-col">媒体评论</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 6: Media Commentary Content (Split) -->
        <tr class="row-lg">
            <td class="label-col" style="vertical-align: top; padding-top: 15px;">
                <ul class="radio-list">
                    <li><span class="radio-circle"></span>意义</li>
                    <li><span class="radio-circle"></span>原因</li>
                    <li><span class="radio-circle"></span>问题</li>
                    <li><span class="radio-circle"></span>危害</li>
                </ul>
            </td>
            <td class="content-col" colspan="3" style="background-image: none;"></td>
        </tr>
        <!-- Row 7: Analysis Headers -->
        <tr class="row-sm">
            <td colspan="2" style="padding: 0;">
                <div class="analysis-header">
                    <div class="analysis-item"><span class="radio-circle"></span>问题分析</div>
                    <div class="analysis-item"><span class="radio-circle"></span>原因分析</div>
                </div>
            </td>
            <td colspan="2" style="padding: 0;">
                <div class="analysis-header" style="justify-content: center;">
                    <div class="analysis-item">对策分析</div>
                </div>
            </td>
        </tr>
        <!-- Row 8: Analysis Content Areas -->
        <tr class="row-xl" style="height: 200px;">
            <td colspan="2" class="content-col"></td>
            <td colspan="2" class="content-col"></td>
        </tr>
        <!-- Row 9: Sentence Transfer -->
        <tr class="row-xl">
            <td class="label-col">句子迁移</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 10: Method Transfer -->
        <tr class="row-xl">
            <td class="label-col">方法迁移</td>
            <td class="content-col" colspan="3"></td>
        </tr>
        <!-- Row 11: Remarks -->
        <tr class="row-sm">
            <td class="label-col">备注</td>
            <td class="content-col" colspan="3"></td>
        </tr>
    </table>

    <!-- Watermark -->
    <div class="watermark">
        <span>Fb</span> 粉笔
    </div>
</div>

</body>
</html>
