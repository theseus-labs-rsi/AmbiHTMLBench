<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报金句合集</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: "SimSun", "Songti SC", serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 600px;
            background-color: #dcbfa0; /* Base paper color */
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZGNiZmEwIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNjYmFmOTAiIG9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4='); /* Subtle noise texture simulation */
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        /* Header Section */
        .header {
            background-color: #f3e6c8; /* Lighter beige for header */
            padding: 15px 20px;
            border-bottom: 2px solid #5a4a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 48px;
            color: #c41e1e; /* Red calligraphy color */
            font-weight: bold;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
            transform: skewX(-5deg);
        }

        .logo-sub {
            font-family: "Arial", sans-serif;
            font-size: 12px;
            color: #8b7d6b;
            letter-spacing: 4px;
            margin-top: 5px;
            margin-left: 5px;
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80px;
        }

        .header-top-text {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-line {
            width: 100%;
            height: 2px;
            background-color: #333;
            margin: 5px 0;
        }

        .header-bottom-text {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 2px solid #333;
            padding-bottom: 2px;
            display: inline-block;
        }

        /* Content Section */
        .content {
            padding: 30px 25px;
            color: #2c2c2c;
        }

        .item {
            margin-bottom: 35px;
        }

        .quote {
            font-size: 26px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
            font-family: "SimHei", "Heiti SC", sans-serif;
        }

        .quote-number {
            margin-right: 5px;
        }

        .explanation-label {
            font-size: 14px;
            color: #4a4a4a;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .explanation-text {
            font-size: 14px;
            color: #4a4a4a;
            line-height: 1.6;
            text-align: justify;
        }

        /* Specific adjustments for layout matching */
        .indent {
            padding-left: 2em;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-text">人民日報</div>
            <div class="logo-sub">RENMIN RIBAO</div>
        </div>
        <div class="header-right">
            <div class="header-top-text">金句 | 素材 | 摘抄</div>
            <div style="flex-grow: 1;"></div>
            <div class="header-bottom-text">金句合集系列</div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        
        <!-- Item 1 -->
        <div class="item">
            <div class="quote">
                <span class="quote-number">1、</span>愿你千山暮雪海棠依旧，<br>
                <span class="indent"></span>不为岁月惊扰平添忧愁。
            </div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">
                希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝与琐事而烦恼忧愁。
            </div>
        </div>

        <!-- Item 2 -->
        <div class="item">
            <div class="quote">
                <span class="quote-number">2、</span>总有人间一两风，<br>
                <span class="indent"></span>填我十万八千梦。
            </div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">
                人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。
            </div>
        </div>

        <!-- Item 3 -->
        <div class="item">
            <div class="quote">
                <span class="quote-number">3、</span>日出有盼，日落有思，<br>
                <span class="indent"></span>平平安安，所遇皆甜。
            </div>
            <div class="explanation-label">释义：</div>
            <div class="explanation-text">
                只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。
            </div>
        </div>

    </div>
</div>

</body>
</html>
