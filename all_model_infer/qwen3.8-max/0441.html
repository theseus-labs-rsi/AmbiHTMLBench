<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家长需要关注什么</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 600px;
            background-color: #dcbfa3; /* Beige background */
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* --- Header Section --- */
        .header-section {
            position: relative;
            height: 280px;
            background-color: #dcbfa3;
            padding: 20px;
            box-sizing: border-box;
            border-bottom: 4px solid #000;
        }

        .header-banner {
            background-color: #3a6b5e; /* Teal green */
            height: 180px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            border-radius: 2px;
        }

        .deer-illustration {
            position: absolute;
            left: 20px;
            top: -20px;
            width: 250px;
            height: 220px;
            /* Placeholder for the deer image */
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        
        /* Simulating the deer with CSS shapes/text since no external images allowed */
        .deer-placeholder {
            position: absolute;
            left: 40px;
            top: 10px;
            width: 200px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .header-text {
            text-align: right;
            padding-right: 40px;
            color: #fff;
            z-index: 2;
        }

        .header-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header-subtitle {
            font-size: 14px;
            letter-spacing: 5px;
            opacity: 0.9;
        }

        .seal-stamp {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 30px;
            height: 30px;
            background-color: #a33;
            color: #fff;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            opacity: 0.8;
            writing-mode: vertical-rl;
        }

        /* --- Content Sections Common --- */
        .content-section {
            background-color: #fff;
            margin: 15px;
            padding: 20px;
            position: relative;
            border: 1px solid #ccc;
            min-height: 280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-divider {
            height: 4px;
            background-color: #000;
            width: 100%;
        }

        /* --- Center Circle Element --- */
        .center-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #8c6b4a;
            background-color: #f9f6f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
            margin: 0 20px;
        }

        .center-circle::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid #8c6b4a;
            border-radius: 50%;
        }
        
        /* Lattice pattern simulation */
        .lattice-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0.3;
            background-image: 
                linear-gradient(45deg, #8c6b4a 25%, transparent 25%, transparent 75%, #8c6b4a 75%, #8c6b4a),
                linear-gradient(45deg, #8c6b4a 25%, transparent 25%, transparent 75%, #8c6b4a 75%, #8c6b4a);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            mask-image: radial-gradient(circle, transparent 60%, black 61%);
            -webkit-mask-image: radial-gradient(circle, transparent 60%, black 61%);
        }

        .center-text {
            writing-mode: vertical-rl;
            font-size: 20px;
            font-weight: bold;
            color: #3a6b5e;
            letter-spacing: 5px;
            z-index: 2;
        }

        /* --- List Items --- */
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .item {
            position: relative;
            padding-left: 35px;
        }

        .number-badge {
            position: absolute;
            left: 0;
            top: -5px;
            width: 24px;
            height: 18px;
            background-color: #5a8a7a;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%); /* Parallelogram shape */
            transform: skewX(-10deg);
        }
        
        .number-badge span {
            transform: skewX(10deg); /* Counter skew for text */
            display: block;
        }

        .item-content {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }

        .item-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
            display: block;
        }

        .highlight-red {
            color: #a33;
            font-weight: bold;
        }

        /* --- Specific Adjustments for Section 2 (Five Don'ts) --- */
        .section-two .item-content {
            font-weight: bold;
            font-size: 16px;
            color: #000;
        }
        
        .section-two .item {
            padding-left: 35px;
        }

        /* Layout tweaks for alignment */
        .left-col { align-items: flex-start; }
        .right-col { align-items: flex-start; }

        /* Small seal in content */
        .content-seal {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 20px;
            height: 20px;
            background-color: #a33;
            opacity: 0.6;
            border-radius: 2px;
        }

    </style>
</head>
<body>

<div class="page-container">

    <!-- Header Section -->
    <div class="header-section">
        <div class="header-banner">
            <div class="deer-placeholder">
                [Illustration: White Deer on Green Background]
            </div>
            <div class="header-text">
                <div class="header-title">家长需要关注什么</div>
                <div class="header-subtitle">章 · 节 · 肆</div>
            </div>
        </div>
        <div class="seal-stamp">印章</div>
    </div>

    <div class="section-divider"></div>

    <!-- Section 1: How to view grades -->
    <div class="content-section">
        <div class="content-seal"></div>
        
        <!-- Left Column -->
        <div class="column left-col">
            <div class="item">
                <div class="number-badge"><span>壹</span></div>
                <div class="item-content">
                    <span class="item-title">看单科成绩</span>
                    分析优势与劣势科目
                </div>
            </div>
            <div class="item">
                <div class="number-badge"><span>贰</span></div>
                <div class="item-content">
                    <span class="item-title">看进步</span>
                    横向整体水平<br>
                    纵向看进退情况
                </div>
            </div>
            <div class="item">
                <div class="number-badge"><span>叁</span></div>
                <div class="item-content">
                    <span class="item-title">分析错题</span>
                </div>
            </div>
        </div>

        <!-- Center Circle -->
        <div class="center-circle">
            <div class="lattice-pattern"></div>
            <div class="center-text">成绩怎么看</div>
        </div>

        <!-- Right Column -->
        <div class="column right-col">
            <div class="item">
                <div class="number-badge"><span>肆</span></div>
                <div class="item-content">
                    <span class="item-title">分析题错：</span>
                    是遗憾丢分？是模糊丢分？<br>
                    是不会做丢分？<br>
                    <span class="highlight-red">策略：</span>消除遗憾，纠正模<br>
                    糊、力争突破
                </div>
            </div>
            <div class="item">
                <div class="number-badge"><span>伍</span></div>
                <div class="item-content">
                    <span class="item-title">分析考试技巧</span>
                    策略是否得当？<br>
                    是否按标准答题？<br>
                    是否摆正心态？
                </div>
            </div>
        </div>
    </div>

    <div class="section-divider"></div>

    <!-- Section 2: Five Don'ts for Parents -->
    <div class="content-section section-two">
        <div class="content-seal"></div>

        <!-- Left Column -->
        <div class="column left-col">
            <div class="item">
                <div class="number-badge"><span>壹</span></div>
                <div class="item-content">不要过度焦虑</div>
            </div>
            <div class="item">
                <div class="number-badge"><span>贰</span></div>
                <div class="item-content">不要过度关注孩子</div>
            </div>
            <div class="item">
                <div class="number-badge"><span>叁</span></div>
                <div class="item-content">不要给孩子过高的期望</div>
            </div>
        </div>

        <!-- Center Circle -->
        <div class="center-circle">
            <div class="lattice-pattern"></div>
            <div class="center-text">家长五不要</div>
        </div>

        <!-- Right Column -->
        <div class="column right-col" style="justify-content: center; gap: 40px;">
            <div class="item">
                <div class="number-badge"><span>肆</span></div>
                <div class="item-content">不要过度唠叨</div>
            </div>
            <div class="item">
                <div class="number-badge"><span>伍</span></div>
                <div class="item-content">不要盲目攀比和迷信</div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
