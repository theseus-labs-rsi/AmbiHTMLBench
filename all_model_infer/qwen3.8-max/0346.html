<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兰州旅行文案</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f7f7f7;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #fcfcfc;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Grid Layout for the 3 rows */
        .grid-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .grid-row.middle {
            grid-template-columns: 1fr 1fr 1fr; /* Left, Center Title, Right */
            align-items: center;
        }

        /* Individual Item Styling */
        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .location {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .pin-icon {
            color: #d32f2f;
            font-size: 16px;
        }

        .quote {
            font-size: 13px;
            color: #555;
            font-style: normal;
        }

        /* Image Grid Placeholder */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #ddd;
            border: 1px solid #eee;
        }

        .img-cell {
            background-color: #ccc;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
            overflow: hidden;
            position: relative;
        }
        
        /* Simulating images with gradients/colors for visual fidelity without external assets */
        .img-cell.night { background: linear-gradient(135deg, #1a237e, #4a148c); }
        .img-cell.day { background: linear-gradient(135deg, #81d4fa, #e1f5fe); }
        .img-cell.food { background: linear-gradient(135deg, #ffcc80, #ffe0b2); }
        .img-cell.street { background: linear-gradient(135deg, #a1887f, #d7ccc8); }
        .img-cell.museum { background: linear-gradient(135deg, #bcaaa4, #efebe9); }
        .img-cell.park { background: linear-gradient(135deg, #a5d6a7, #c8e6c9); }
        .img-cell.neon { background: linear-gradient(135deg, #000, #d500f9); }

        /* Center Title Styling */
        .center-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 28px;
            font-weight: bold;
            color: #c62828;
            letter-spacing: 10px;
            font-family: "KaiTi", "STKaiti", serif;
            text-align: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Specific adjustments for the middle row to align grids with title */
        .middle .item {
            justify-content: flex-start;
        }
        
        .middle .center-title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* Decorative line at bottom right of middle section */
        .decor-line {
            position: absolute;
            right: 20px;
            top: 65%;
            width: 40px;
            height: 2px;
            background-color: #4caf50;
        }

    </style>
</head>
<body>

<div class="container">

    <!-- Row 1 -->
    <div class="grid-row">
        <!-- Item 1: 金城兰州 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 金城兰州</div>
                <div class="quote">“淌不完的黄河水向东流”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell night"></div><div class="img-cell night"></div><div class="img-cell night"></div>
                <div class="img-cell night"></div><div class="img-cell night"></div><div class="img-cell day"></div>
                <div class="img-cell night"></div><div class="img-cell night"></div><div class="img-cell night"></div>
            </div>
        </div>

        <!-- Item 2: 中山桥 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 中山桥</div>
                <div class="quote">“陌生的人 请给我一支兰州”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell day"></div><div class="img-cell day"></div><div class="img-cell day"></div>
                <div class="img-cell day"></div><div class="img-cell day"></div><div class="img-cell day"></div>
                <div class="img-cell day"></div><div class="img-cell day"></div><div class="img-cell day"></div>
            </div>
        </div>

        <!-- Item 3: 兰州美食 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 兰州美食</div>
                <div class="quote">“四方食事 不过一碗人间烟火”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
            </div>
        </div>
    </div>

    <!-- Row 2 (Middle) -->
    <div class="grid-row middle">
        <!-- Item 4: 骆驼巷 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 骆驼巷</div>
                <div class="quote">“繁华城市背后的另一面”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell street"></div><div class="img-cell street"></div><div class="img-cell street"></div>
                <div class="img-cell street"></div><div class="img-cell street"></div><div class="img-cell street"></div>
                <div class="img-cell street"></div><div class="img-cell street"></div><div class="img-cell street"></div>
            </div>
        </div>

        <!-- Center Title -->
        <div class="center-title-container">
            <div class="center-title">兰州旅行文案</div>
        </div>

        <!-- Item 5: 甘肃省博物馆 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 甘肃省博物馆</div>
                <div class="quote">“守护西诸魄 传丝路文明”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell museum"></div><div class="img-cell museum"></div><div class="img-cell museum"></div>
                <div class="img-cell museum"></div><div class="img-cell museum"></div><div class="img-cell museum"></div>
                <div class="img-cell museum"></div><div class="img-cell museum"></div><div class="img-cell museum"></div>
            </div>
        </div>
        
        <div class="decor-line"></div>
    </div>

    <!-- Row 3 -->
    <div class="grid-row">
        <!-- Item 6: 白塔山公园 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 白塔山公园</div>
                <div class="quote">“行走在西北 看尽黄河水”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell park"></div><div class="img-cell park"></div><div class="img-cell park"></div>
                <div class="img-cell park"></div><div class="img-cell park"></div><div class="img-cell park"></div>
                <div class="img-cell park"></div><div class="img-cell park"></div><div class="img-cell park"></div>
            </div>
        </div>

        <!-- Item 7: 兰山公园 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 兰山公园</div>
                <div class="quote">“白天阿富汗 晚上曼哈顿”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell neon"></div><div class="img-cell neon"></div><div class="img-cell neon"></div>
                <div class="img-cell neon"></div><div class="img-cell neon"></div><div class="img-cell neon"></div>
                <div class="img-cell neon"></div><div class="img-cell neon"></div><div class="img-cell neon"></div>
            </div>
        </div>

        <!-- Item 8: 正宁路小吃街 -->
        <div class="item">
            <div class="header">
                <div class="location"><span class="pin-icon">📍</span> 正宁路小吃街</div>
                <div class="quote">“人间烟火气 最抚凡人心”</div>
            </div>
            <div class="image-grid">
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
                <div class="img-cell food"></div><div class="img-cell food"></div><div class="img-cell food"></div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
