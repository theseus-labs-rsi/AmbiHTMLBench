<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #000;
            margin-bottom: 20px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: center;
        }
        th, td {
            border: 1px solid #666;
            padding: 10px 5px;
        }
        th {
            background-color: #eef2f7;
            font-weight: bold;
            color: #333;
        }
        /* Alternating row colors based on the image pattern (odd rows white, even rows light blue) */
        /* Actually looking closely: Row 1 (header) is light blue. Row 2 (data 1) is light blue. Row 3 (data 2) is white. Row 4 (data 3) is light blue. */
        /* Let's re-evaluate: 
           Header: Light Blue
           Row 1: Light Blue
           Row 2: White
           Row 3: Light Blue
           Row 4: White
           Row 5: Light Blue
           Row 6: White
           Row 7: Light Blue
           
           Wait, looking at the image again:
           Header: Light Blue/Grey
           Row 1 (Seq 1): Light Blue
           Row 2 (Seq 2): White
           Row 3 (Seq 3): Light Blue
           Row 4 (Seq 4): White
           Row 5 (Seq 5): Light Blue
           Row 6 (Seq 6): White
           Row 7 (Seq 7): Light Blue
        */
        
        tr:nth-child(even) {
            background-color: #ffffff;
        }
        tr:nth-child(odd) {
            background-color: #dbe4ef;
        }
        
        /* Override for header to ensure it matches the specific shade if needed, though nth-child handles it mostly */
        thead tr {
            background-color: #dbe4ef;
        }

        .col-seq { width: 8%; }
        .col-desc { width: 22%; }
        .col-role { width: 12%; }
        .col-action { width: 28%; }
        .col-time { width: 12%; }
        .col-note { width: 18%; }

    </style>
</head>
<body>

<div class="container">
    <h1>十一月-任务(必做:支付管理费+拨款)</h1>
    
    <table>
        <thead>
            <tr>
                <th class="col-seq">序号</th>
                <th class="col-desc">任务描述</th>
                <th class="col-role">岗位</th>
                <th class="col-action">操作动作</th>
                <th class="col-time">开始时间</th>
                <th class="col-note">备注</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>柔性线推进</td>
                <td>生产</td>
                <td>申请200w推进</td>
                <td>11月1日</td>
                <td>柔性线推进</td>
            </tr>
            <tr>
                <td>2</td>
                <td>订购原材料</td>
                <td>采购</td>
                <td>4份P3+4份P5</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>3</td>
                <td>九月订购的原料入库</td>
                <td>采购</td>
                <td>申请资金入库</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>申请贷款</td>
                <td>财务</td>
                <td>没钱就申请,有钱就不申请</td>
                <td>11月1日</td>
                <td>申请四季短贷</td>
            </tr>
            <tr>
                <td>5</td>
                <td>生产线预配</td>
                <td>生产</td>
                <td>全线开产</td>
                <td>11月1日</td>
                <td>收下9月的产品</td>
            </tr>
            <tr>
                <td>6</td>
                <td>交货</td>
                <td>销售</td>
                <td>交第三个订单</td>
                <td>11月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>7</td>
                <td>应收账款</td>
                <td>财务</td>
                <td>收钱</td>
                <td>11月</td>
                <td>尽量不贴现</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
