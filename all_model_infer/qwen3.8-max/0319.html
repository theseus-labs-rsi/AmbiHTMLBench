<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 回避行为</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .card-container {
            width: 500px;
            height: 700px;
            background-color: #ffffff;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Decorative Blue Corners */
        .corner {
            position: absolute;
            background-color: #1a36a8; /* Deep blue matching the image */
            z-index: 10;
        }

        .top-left {
            top: 0;
            left: 0;
            width: 140px;
            height: 25px;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }
        
        /* Additional shape for top left to match the specific cut */
        .top-left::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 25px;
            height: 180px;
            background-color: #1a36a8;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
        }

        .top-right {
            top: 180px;
            right: 0;
            width: 25px;
            height: 120px;
            background-color: #1a36a8;
        }

        .bottom-left {
            bottom: 0;
            left: 0;
            width: 25px;
            height: 120px;
            background-color: #1a36a8;
            clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%);
        }
        
        .bottom-left-h {
            bottom: 0;
            left: 0;
            width: 280px;
            height: 25px;
            background-color: #1a36a8;
            clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
        }

        .bottom-right {
            bottom: 0;
            right: 0;
            width: 140px;
            height: 25px;
            background-color: #1a36a8;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
        }
        
        .bottom-right-v {
            bottom: 0;
            right: 0;
            width: 25px;
            height: 100px;
            background-color: #1a36a8;
            clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%);
        }

        /* Content Styling */
        .content {
            padding: 60px 50px;
            position: relative;
            z-index: 5;
            height: 100%;
            box-sizing: border-box;
        }

        .number {
            font-size: 64px;
            font-weight: 900;
            color: #000;
            line-height: 1;
            margin-bottom: 10px;
            font-family: Arial, sans-serif;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            color: #000;
            margin-top: 0;
            margin-bottom: 80px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 26px;
            font-weight: bold;
            color: #000;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .body-text {
            font-size: 24px;
            color: #333;
            line-height: 1.6;
            font-weight: normal;
        }

    </style>
</head>
<body>

    <div class="card-container">
        <!-- Decorative Elements -->
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-left-h"></div>
        <div class="corner bottom-right"></div>
        <div class="corner bottom-right-v"></div>

        <!-- Text Content -->
        <div class="content">
            <div class="number">03</div>
            <h1 class="title">回避行为</h1>

            <div class="subtitle">
                自觉或不自觉地回避曾经的某些人、<br>事、物。
            </div>

            <div class="body-text">
                比如，学生时代受过伤，可能回避同<br>学聚会，不再听某些歌、看某些电影、<br>去某家餐厅……
            </div>
        </div>
    </div>

</body>
</html>
