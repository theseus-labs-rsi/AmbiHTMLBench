<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Photo Exhibition - In The Blink Of An Eye</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Helvetica+Neue:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #b3b3b3; /* Grey background matching the image */
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Noto Sans TC', sans-serif;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poster-container {
            width: 100%;
            max-width: 800px; /* Approximate aspect ratio container */
            aspect-ratio: 3 / 4;
            background-color: #b3b3b3;
            position: relative;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .cn-title-small {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .en-title-small {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 5px;
        }

        /* Middle Section - Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .divider-line {
            width: 100%;
            height: 4px;
            background-color: #000;
            margin: 20px 0;
        }

        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 10px;
        }

        .huge-cn-left {
            font-size: 12rem;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -5px;
        }

        .huge-en-right {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 0.9;
            text-align: left;
            margin-top: 10px;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: -20px; /* Pull up to overlap visually if needed, or just spacing */
        }

        .artist-info {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .date-info {
            font-size: 5rem;
            font-weight: 900;
            margin-top: 10px;
        }

        .huge-cn-right {
            font-size: 12rem;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -5px;
            text-align: right;
        }

        /* Bottom Section */
        .footer {
            margin-top: auto;
            position: relative;
        }

        .quote {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            max-width: 60%;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .address-info {
            display: flex;
            gap: 15px;
        }

        .watermark-area {
            position: absolute;
            bottom: 0;
            right: 0;
            text-align: right;
            font-size: 0.9rem;
            color: #333;
            opacity: 0.8;
        }
        
        .watermark-logo {
            display: inline-block;
            background: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #ff2442; /* Xiaohongshu red approx */
            font-weight: bold;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            .cn-title-small { font-size: 1.5rem; }
            .en-title-small { font-size: 1.2rem; }
            .huge-cn-left, .huge-cn-right { font-size: 6rem; }
            .huge-en-right { font-size: 2.5rem; }
            .date-info { font-size: 3rem; }
            .artist-info { font-size: 1rem; }
            .quote { font-size: 0.7rem; max-width: 100%; }
            .bottom-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="poster-container">
    
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="cn-title-small">藝術<br>攝影展</div>
            <div class="en-title-small">ARTIST<br>PHOTO<br>EXHIBITION</div>
        </div>
        <div class="vertical-text">定格光影</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="divider-line"></div>
        
        <div class="hero-section">
            <div class="huge-cn-left">瞬息</div>
            <div class="huge-en-right">IN THE<br>BLINK OF<br>AN EYE</div>
        </div>

        <div class="details-row">
            <div>
                <div class="artist-info">藝術家<br>森蘭 王沐春</div>
                <div class="date-info">08/14</div>
            </div>
            <div class="huge-cn-right">之間</div>
        </div>

        <div class="divider-line"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="quote">
            IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
            YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
            EVERYTHING IN MY MIND AS AN EXERCISE.
        </div>

        <div class="bottom-bar">
            <div class="address-info">
                <span>活動地址：濱江路西溪街二十七號</span>
                <span>|</span>
                <span>主辦單位：壹畫咖啡館</span>
            </div>
            <div style="font-weight: 900; font-size: 1.2rem;">ONE COFFEE</div>
        </div>

        <!-- Watermark simulation based on image bottom right -->
        <div class="watermark-area">
            <div class="watermark-logo">小红书</div><br>
            小红书号：heyu11221
        </div>
    </div>

</div>

</body>
</html>
