<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习建议</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title-graphic {
            display: inline-block;
            position: relative;
            padding: 10px 20px;
        }

        .title-text {
            font-size: 32px;
            font-weight: bold;
            color: #5fa8d3; /* Light blue */
            text-shadow: 2px 2px 0px #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            letter-spacing: 2px;
            z-index: 2;
            position: relative;
            /* Simulating the outline effect */
            -webkit-text-stroke: 1px #aaddff;
        }

        .wavy-line {
            height: 10px;
            background: repeating-linear-gradient(
                45deg,
                #f9e79f,
                #f9e79f 10px,
                #f7dc6f 10px,
                #f7dc6f 20px
            );
            border-radius: 5px;
            margin-top: -5px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.8;
        }
        
        /* Decorative elements simulation */
        .deco-star {
            position: absolute;
            top: -10px;
            right: 20%;
            color: #f1c40f;
            font-size: 20px;
        }
        .deco-cloud {
            position: absolute;
            top: -15px;
            left: 25%;
            width: 40px;
            height: 20px;
            background: #eee;
            border-radius: 20px;
            opacity: 0.5;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .section-number {
            color: #9b59b6; /* Purple */
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
            min-width: 30px;
        }

        .section-title {
            color: #9b59b6; /* Purple */
            font-size: 18px;
            font-weight: bold;
        }

        .content-text {
            font-size: 16px;
            color: #2c3e50;
            text-align: justify;
            margin-bottom: 15px;
        }

        .highlight-yellow {
            background-color: #fff9c4; /* Light yellow highlight */
            padding: 2px 4px;
            border-radius: 4px;
            /* To mimic the rounded box look in the image for specific phrases */
            display: inline; 
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        
        /* Specific styling for the blocky highlights in the image */
        .highlight-block {
            background-color: #ffeb3b;
            color: #333;
            padding: 2px 8px;
            border-radius: 15px; /* Rounded ends */
            display: inline-block;
            margin: 2px 0;
            line-height: 1.6;
        }
        
        /* The image shows highlights that wrap. We will use a span with background */
        .text-with-highlight {
            line-height: 2.2; /* Increase line height to accommodate highlights */
        }
        
        .hl-span {
            background-color: #fce488; /* Yellowish */
            padding: 4px 0;
            border-radius: 20px; /* Rounded corners for the highlight bar */
            /* Since it wraps, we can't easily do perfect rounded ends on every line without complex CSS, 
               but we will approximate the look */
        }
        
        /* Refined highlight to match image: distinct rounded rectangles */
        .hl-phrase {
            background-color: #fde074;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 4px 2px;
            color: #333;
        }

        .quote-author {
            text-align: right;
            font-size: 14px;
            color: #333;
            margin-top: 10px;
            padding-right: 10px;
        }

        .red-text {
            color: #e74c3c;
            font-weight: bold;
        }

        .footer-image-placeholder {
            float: right;
            width: 80px;
            height: 100px;
            margin-top: -20px;
            margin-left: 10px;
            /* In a real scenario, this would be an img tag. 
               Here we simulate the girl with a banner using a placeholder div as requested for non-text, 
               but since I can't generate the image, I will use a descriptive placeholder. */
            position: relative;
        }
        
        /* Attempting to visually represent the girl/banner roughly with CSS shapes/text if possible, 
           but instructions say use placeholder for diagrams/photos. */
        .girl-placeholder {
            width: 70px;
            height: 90px;
            background-color: transparent;
            position: relative;
            float: right;
            margin-top: -30px;
            margin-right: 10px;
        }
        
        .girl-placeholder::after {
            content: "[Illustration: Girl holding red banner]";
            font-size: 10px;
            color: #999;
            text-align: center;
            display: block;
            width: 100%;
            margin-top: 40px;
        }

        /* Actually, let's try to make the placeholder look like the space it occupies */
        .illustration-spot {
            float: right;
            width: 80px;
            height: 110px;
            /* border: 1px dashed #ccc; */ /* Optional: to see bounds */
            margin-top: -40px;
            margin-right: 0px;
            position: relative;
            z-index: 10;
        }
        
        .illustration-spot div {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="header-container">
        <div class="deco-cloud"></div>
        <div class="deco-star">✦</div>
        <div class="title-graphic">
            <!-- Simulating the stylized title -->
            <div style="font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 36px; color: #6cb4ee; font-weight: 900; letter-spacing: 5px; text-shadow: 2px 2px 0 #fff, 0 0 5px #aaddff;">
                学习建议
            </div>
        </div>
        <div class="wavy-line"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">09</span>
            <span class="section-title">「 教材远比练习册重要 」</span>
        </div>
        
        <div class="content-text">
            教材远比练习册重要。
        </div>
        
        <div class="content-text text-with-highlight">
            教材就是我们做题之前所要构建的一个框架，<span class="hl-phrase">先熟</span><br>
            <span class="hl-phrase">悉框架，然后不断地练题，才能将自己学习的这座</span><br>
            <span class="hl-phrase">大厦构建得更加完整。</span>
        </div>

        <div class="quote-author">
            ——陈哲峰<span style="font-size: 12px;">(被北京大学物理学院录取)</span>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-number">10</span>
            <span class="section-title">「 有关数学与英语的学习方法 」</span>
        </div>

        <div class="content-text">
            数学压轴大题的第二问我没有做出来，但这并没有<br>
            影响接下来的考试中我的发挥。
        </div>

        <div class="content-text" style="position: relative;">
            <!-- Floating illustration placeholder -->
            <div class="illustration-spot">
                <div class="placeholder">[Illustration: Girl with red banner saying "高考加油"]</div>
            </div>
            
            我要保证的，<span class="red-text">不是做出难题，而是做到容易题不丢</span><br>
            <span class="red-text">分，难题多得分。</span>最后，我数学只有压轴题扣了<br>
            分。
        </div>
    </div>

</body>
</html>
