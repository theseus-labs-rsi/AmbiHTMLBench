<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Outline</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            color: #333;
            background-color: #fff;
            padding: 20px;
            line-height: 1.6;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
            position: relative;
        }

        /* Top level item style */
        .level-1 {
            color: #a84c4c; /* Reddish brown color from image */
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Second level items */
        .level-2 {
            font-size: 1.05em;
            color: #222;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .level-2-text {
            flex-grow: 1;
        }

        .arrow {
            color: #ccc;
            font-size: 0.8em;
            margin-left: 10px;
        }

        /* Third level items container to mimic the vertical line */
        .sub-list-container {
            border-left: 2px solid #eaeaea;
            margin-left: 10px; /* Adjust alignment */
            padding-left: 15px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .level-3 {
            font-size: 0.95em;
            color: #444;
            margin-bottom: 5px;
        }

        /* Specific styling for the last long text */
        .long-text {
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <ul>
        <li class="level-1">第三阶段 认识自我，找到自我
            <ul>
                <li>
                    <div class="level-2">
                        <span class="level-2-text">不同国家的妆容模仿</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="sub-list-container">
                        <ul style="list-style-type: disc; border: none; padding-left: 15px;">
                            <li class="level-3">不同国家妆容特点分析</li>
                            <li class="level-3">逐个部位模仿</li>
                        </ul>
                    </div>
                </li>
                
                <li>
                    <div class="level-2">
                        <span class="level-2-text">明星出圈妆容模仿</span>
                        <span class="arrow">▼</span>
                    </div>
                    <ul style="list-style-type: disc; padding-left: 20px; margin-top: 5px;">
                        <li class="level-3">鞠婧祎妆容</li>
                        <li class="level-3">虞书欣妆容</li>
                        <li class="level-3">宋慧乔妆容</li>
                        <li class="level-3">女团妆容</li>
                        <li class="level-3">日本杂志妆容</li>
                    </ul>
                </li>

                <li>
                    <div class="level-2">
                        <span class="level-2-text">找到适合自己的风格和妆容</span>
                        <span class="arrow">▼</span>
                    </div>
                    <ul style="list-style-type: disc; padding-left: 20px; margin-top: 5px;">
                        <li class="level-3">
                            根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格
                        </li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>

</body>
</html>
