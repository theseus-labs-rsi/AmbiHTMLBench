<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一招，请不断尝试独立赚钱这件事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            padding: 20px;
        }

        .page {
            background-color: #ffffff;
            max-width: 780px;
            width: 100%;
            padding: 40px 50px 30px 50px;
            position: relative;
        }

        .header-bar {
            background-color: #1a1a1a;
            padding: 14px 24px;
            margin-bottom: 24px;
        }

        .header-bar h1 {
            color: #00e5cc;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .content {
            padding: 0 10px;
        }

        .bullet-item {
            margin-bottom: 20px;
            font-size: 17px;
            line-height: 1.7;
            color: #222;
            position: relative;
            padding-left: 20px;
        }

        .bullet-item::before {
            content: "•";
            position: absolute;
            left: 0;
            top: 0;
            font-size: 18px;
            color: #222;
        }

        .highlight {
            background-color: #f5e642;
            padding: 1px 3px;
            display: inline;
        }

        .info-box {
            background-color: #d4f0f0;
            padding: 18px 22px;
            margin-top: 24px;
            font-size: 17px;
            line-height: 1.8;
            color: #222;
            border-radius: 2px;
        }

        .info-box p {
            margin-bottom: 6px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .next-page {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-top: 30px;
            gap: 12px;
        }

        .next-page span {
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }

        .next-page .arrow {
            width: 0;
            height: 0;
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 30px solid #00c9a7;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header-bar">
            <h1>第一招，请不断尝试独立赚钱这件事</h1>
        </div>

        <div class="content">
            <div class="bullet-item">
                这是一个最差的时代，同时也是最好的时代。<span class="highlight">这是你唯一存在的一个时代，你没得选</span>
            </div>

            <div class="bullet-item">
                我至今都记得我在其他平台D视频带货的一单团购2.6元的佣金，比在公司直播GMV破千万都开心，目前收入还不行，坚持中，有结果了就分享
            </div>

            <div class="bullet-item">
                但是这个过程，经历过可能更重要
            </div>

            <div class="bullet-item">
                独立赚钱，是建立个人和市场自由交换的能力，在这个时代，有太多选择
            </div>

            <div class="bullet-item">
                不过在<span class="highlight">没有经过独立项目赚到钱之前，你以为的都是错的。</span>
            </div>

            <div class="bullet-item">
                <span class="highlight">看的再多，不如实干一个。</span>
            </div>

            <div class="info-box">
                <p>并不是说带货就好，最合适的项目只有自己知道，但是不管怎么找项目，下场弄脏双手最重要</p>
                <p>（来自于筛选了30个项目，还是尝试了第一个项目的乱水）</p>
            </div>

            <div class="next-page">
                <span>下一页</span>
                <div class="arrow"></div>
            </div>
        </div>
    </div>
</body>
</html>
