<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祥除帖 昨表帖（臨書）</title>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#e7e2d6;}
  body{
    font-family:"KaiTi","STKaiti","TW-Kai","Noto Serif CJK SC","Noto Serif CJK TC",serif;
    color:#141414;
  }
  .sheet{
    box-sizing:border-box;
    margin:0 auto;
    padding:64px 46px 90px 46px;
    background:#d8d2c3;
    background-image:radial-gradient(rgba(120,110,90,.06) 1px, transparent 1px);
    background-size:7px 7px;
    display:flex;
    flex-direction:row-reverse;
    align-items:flex-start;
    justify-content:center;
    width:fit-content;
    min-width:760px;
  }
  .titlebox{
    display:flex;
    flex-direction:row-reverse;
    gap:8px;
    margin:46px 2px 0 26px;
  }
  .titlebox span{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-size:15px;
    letter-spacing:5px;
    line-height:1.0;
    white-space:nowrap;
  }
  .col{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-size:21px;
    letter-spacing:3px;
    line-height:3.05;
    white-space:pre;
    height:1020px;
    margin:0 17px;
  }
  .sigitem{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    margin:0 6px 0 22px;
  }
  .sig{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-size:19px;
    letter-spacing:4px;
    line-height:3.0;
    white-space:nowrap;
    margin-top:186px;
  }
  .seals{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:13px;
    align-items:flex-start;
  }
  .placeholder{
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:4px;
    background:#b23a2f;
    color:#f3e5df;
    font-family:"Songti SC","SimSun",serif;
    font-size:9px;
    line-height:1;
    letter-spacing:0;
    opacity:.92;
  }
</style>
</head>
<body>
  <main class="sheet">
    <div class="titlebox">
      <span>祥除帖</span>
      <span>昨表帖</span>
    </div>
    <div class="col">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時巖寒奉被</div>
    <div class="col">手詔伏承聖體御膳勝常以慰下情臣故患匈滿氣上頓乏勿勿慈</div>
    <div class="col">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>
    <div class="col">頓首死罪死罪 臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
    <div class="col">慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀亡</div>
    <div class="col">愍存益勞聖心謹附承動靜臣廙言</div>
    <div class="sigitem">
      <div class="sig">歲在癸卯春耀陽書於未央雲舍</div>
      <div class="seals">
        <div class="placeholder">[Seal]</div>
        <div class="placeholder">[Seal]</div>
      </div>
    </div>
  </main>
</body>
</html>
