<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>为什么选择新概念动画版?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #aed6f5;
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    padding: 18px 14px;
    position: relative;
  }
  .page {
    width: 540px;
    max-width: 100%;
    margin: 0 auto;
    position: relative;
  }
  .title-banner {
    width: 372px;
    margin: 0 auto 14px auto;
    background: linear-gradient(#ffd75e, #ffc531);
    border-radius: 22px;
    text-align: center;
    padding: 8px 10px 10px 10px;
    box-shadow: 0 1px 0 rgba(0,0,0,.15);
    position: relative;
    z-index: 2;
  }
  .title-banner h1 {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 900;
    color: #111;
    letter-spacing: 1px;
    text-shadow:
      -2px -2px 0 #fff,
       2px -2px 0 #fff,
      -2px  2px 0 #fff,
       2px  2px 0 #fff,
       0    3px 0 rgba(0,0,0,.25);
    white-space: nowrap;
  }
  .card {
    background: #ffffff;
    border-radius: 4px;
    padding: 18px 22px 26px 18px;
    position: relative;
    min-height: 625px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.02);
  }
  .item { margin-bottom: 14px; }
  .item h2 {
    color: #e0231d;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 8px;
    letter-spacing: .5px;
  }
  .item p {
    color: #151515;
    font-size: 19px;
    line-height: 1.55;
    font-weight: 500;
  }
  .item .indent { margin-top: 6px; }
  .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .books {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 182px;
    height: 142px;
  }
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #666;
    font-size: 12px;
    background: transparent;
  }
  .section-six { padding-right: 178px; }
</style>
</head>
<body>
<div class="page">
  <div class="title-banner">
    <h1>为什么选择新概念动画版?</h1>
  </div>

  <div class="card">
    <div class="item">
      <h2>一、无需死记硬背</h2>
      <p>打破枯燥学习方式<span class="emoji">😄</span>，用动画通俗易懂掌握听说读写<br>能力</p>
    </div>

    <div class="item">
      <h2>二、融入生活场景</h2>
      <p><span class="emoji">💪</span>加入幽默段子、人文历史，生动形象又很好理解</p>
    </div>

    <div class="item">
      <h2>三、螺旋式教学</h2>
      <p>从基础层层提高，不怕孩子基础差跟不上<span class="emoji">👍</span></p>
    </div>

    <div class="item">
      <h2>四、闭环学习</h2>
      <p><span class="emoji">👉</span>预热→精讲→巩固→个性报告</p>
      <p class="indent">“听说读写练”覆盖式讲解，看完有题干巩固基础</p>
    </div>

    <div class="item">
      <h2>五、内容优质放心</h2>
      <p>有多年经验，《新概念英语》原创班底深度参与，原汁<br>原味诠释精髓<span class="emoji">✌</span></p>
    </div>

    <div class="item section-six">
      <h2>六、时间恰当</h2>
      <p>每天只需花20min<span class="emoji">🕐</span>左右防止时间<br>过长产生厌恶感</p>
    </div>

    <div class="books">
      <figure class="placeholder">[Photo: 新概念英语 books, bottom-right]</figure>
    </div>
  </div>
</div>
</body>
</html>
