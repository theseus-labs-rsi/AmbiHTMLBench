<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司资产负债表</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: #333;
    background: #fff;
    padding: 40px 60px;
    max-width: 1100px;
    margin: 0 auto;
    font-size: 14px;
    line-height: 1.6;
  }
  .header {
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 36px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .header .date {
    font-size: 14px;
    color: #555;
    margin-bottom: 4px;
  }
  .header .note {
    font-size: 14px;
    color: #555;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  thead th {
    text-align: right;
    padding: 8px 12px;
    font-size: 13px;
    color: #e07040;
    font-weight: normal;
    border-bottom: 1px solid #e07040;
  }
  thead th:first-child {
    text-align: left;
  }
  thead th:nth-child(2) {
    text-align: center;
  }
  tbody td {
    padding: 5px 12px;
    font-size: 14px;
  }
  tbody td:first-child {
    text-align: left;
  }
  tbody td:nth-child(2) {
    text-align: center;
    color: #e07040;
    font-size: 13px;
  }
  tbody td:nth-child(3),
  tbody td:nth-child(4) {
    text-align: right;
  }
  .section-header {
    font-weight: 700;
    font-size: 15px;
    color: #1a1a1a;
    padding: 10px 0 4px 0;
  }
  .subsection-header {
    font-weight: 700;
    font-size: 14px;
    color: #1a1a1a;
    padding: 6px 0 2px 0;
  }
  .indent-1 {
    padding-left: 20px;
  }
  .indent-2 {
    padding-left: 40px;
  }
  .bold {
    font-weight: 700;
  }
  .total-row td {
    border-top: 2px solid #e07040;
    border-bottom: 2px solid #e07040;
    padding: 8px 12px;
    font-weight: 700;
  }
  .total-row td:first-child {
    font-weight: 700;
  }
  .separator {
    border-top: 1px solid #e07040;
  }
  .footer-note {
    margin-top: 30px;
    font-size: 14px;
    color: #555;
  }
  .page-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
    padding-top: 10px;
    font-size: 13px;
    color: #888;
  }
  .page-footer .page-num {
    font-size: 20px;
    color: #333;
    font-weight: 300;
  }
  .page-footer .year-report {
    color: #e07040;
    margin-left: 10px;
  }
  .page-footer .company-name {
    color: #888;
  }
  .dash {
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>公司资产负债表</h1>
  <div class="date">2024年12月31日</div>
  <div class="note">（除特别注明外，金额单位为人民币百万元）</div>
</div>

<table>
  <thead>
    <tr>
      <th></th>
      <th>附注十五</th>
      <th>2024年12月31日</th>
      <th>2023年12月31日</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="section-header" colspan="4">资产</td>
    </tr>
    <tr>
      <td class="indent-1">货币资金</td>
      <td>1</td></body></html>
