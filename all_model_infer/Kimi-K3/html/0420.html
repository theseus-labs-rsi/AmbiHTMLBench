<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习建议</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 0 60px;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #222;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 540px;
    max-width: 94vw;
    margin: 0 auto;
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    position: relative;
    text-align: center;
    padding-top: 6px;
    margin-bottom: 26px;
  }
  .header .deco-icon {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-112px);
    width: 62px;
    height: 30px;
    font-size: 10px;
    color: #999;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .header .star {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(92px);
    color: #e8d36b;
    font-size: 18px;
  }
  .header h1 {
    display: inline-block;
    margin: 0;
    font-size: 40px;
    letter-spacing: 4px;
    font-weight: 900;
    color: #7fb0dc;
    -webkit-text-stroke: 1.5px #5b93c9;
    text-shadow:
      2px 2px 0 #ffffff,
      4px 4px 0 rgba(91,147,201,.35);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.1;
  }
  .header .waves {
    margin: 4px auto 0;
    width: 320px;
    height: 16px;
    background: repeating-linear-gradient(
      0deg,
      transparent 0 4px,
      rgba(0,0,0,0) 4px 6px
    );
    position: relative;
    overflow: hidden;
  }
  .header .waves::before,
  .header .waves::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    background:
      radial-gradient(circle at 6px 3px, transparent 4px, #f0cf6b 4.5px, #f0cf6b 6px, transparent 6.5px) repeat-x;
    background-size: 16px 6px;
  }
  .header .waves::before { top: 1px; }
  .header .waves::after { top: 8px; }
  .header .flag {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-178px);
    color: #8fb4d8;
    font-size: 14px;
  }

  /* ---------- Sections ---------- */
  .sec { margin: 0 0 34px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .sec-num {
    width: 44px;
    flex: 0 0 44px;
    color: #9a6fae;
    font-size: 21px;
    font-weight: 500;
    font-family: Georgia, "Times New Roman", serif;
  }
  .sec-title {
    color: #a05aa8;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .sec-body { padding-left: 0; }
  p {
    margin: 0 0 16px;
    font-size: 20px;
    line-height: 1.85;
    letter-spacing: .5px;
    text-align: justify;
  }
  .hl {
    background: #fff283;
    padding: 1px 0;
    box-shadow: 0 0 0 1px #fff283;
  }
  .red { color: #d6255b; font-weight: 700; }
  .attrib {
    text-align: right;
    margin: 6px 0 0;
    font-size: 18px;
    letter-spacing: .5px;
    color: #111;
  }
  .attrib .small { font-size: 14px; }

  /* bottom-right cartoon placeholder */
  .mascot {
    position: absolute;
    right: 4px;
    bottom: -6px;
    width: 74px;
    height: 100px;
  }
  .placeholder {
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #bbb;
    font-size: 11px;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="deco-icon placeholder">[Icon: piglet]</div>
    <div class="star">✦</div>
    <h1>学习建议</h1>
    <div class="flag">⚑</div>
    <div class="waves"></div>
  </div>

  <div class="sec">
    <div class="sec-head">
      <span class="sec-num">09</span>
      <span class="sec-title">「教材远比练习册重要」</span>
    </div>
    <div class="sec-body">
      <p>教材远比练习册重要。</p>
      <p>教材就是我们做题之前所要构建的一个框架，<span class="hl">先熟</span><br><span class="hl">悉框架，然后不断地练题，才能将自己学习的这座</span><br><span class="hl">大厦构建得更加完整。</span></p>
      <p class="attrib">——陈哲峰<span class="small">(被北京大学物理学院录取)</span></p>
    </div>
  </div>

  <div class="sec">
    <div class="sec-head">
      <span class="sec-num">10</span>
      <span class="sec-title">「有关数学与英语的学习方法」</span>
    </div>
    <div class="sec-body">
      <p>数学压轴大题的第二问我没有做出来，但这并没有<br>影响接下来的考试中我的发挥。</p>
      <p>我要保证的，<span class="red">不是做出难题，而是做到容易题不丢</span><br><span class="red">分，难题多得分。</span>最后，我数学只有压轴题扣了<br>分。</p>
    </div>
  </div>

  <figure class="mascot placeholder">[Cartoon: girl holding “高考加油” banner, bottom-right]</figure>

</div>
</body>
</html>
