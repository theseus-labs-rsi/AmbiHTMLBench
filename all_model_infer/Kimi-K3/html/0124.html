<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Notebook Page</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;}
  body{
    background:#3d3d3d;
    display:flex;
    justify-content:center;
    padding:16px 0 30px;
  }
  .sheet{
    position:relative;
    width:540px;
    min-height:718px;
    box-sizing:border-box;
    padding:54px 40px 60px 46px;
    background-color:#f7f5ee;
    background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 45px, #b6bed1 45px, #b6bed1 46px);
    background-size:100% 46px;
    background-position:0 8px;
    color:#26264a;
    box-shadow:9px 5px 0 #d6d2c6, 20px 14px 26px rgba(0,0,0,.5);
    font-family:"Segoe Script","Lucida Handwriting","KaiTi","STKaiti",cursive;
  }
  .sheet::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:26px; height:100%;
    background:linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,.06) 45%, rgba(0,0,0,.16) 78%, #c9c4b6 100%);
    pointer-events:none;
  }
  .group{ }
  .group + .group{ margin-top:46px; }
  .entry{
    height:46px;
    display:flex;
    align-items:flex-end;
    padding-bottom:7px;
    box-sizing:border-box;
  }
  .en{
    width:44%;
    font-size:22px;
    font-style:italic;
    letter-spacing:.4px;
    color:#22223f;
    font-family:"Segoe Script","Lucida Handwriting","Apple Chancery",cursive;
    white-space:nowrap;
  }
  .en.bl{ color:#3a3f92; }
  .zh{
    width:56%;
    font-size:19px;
    color:#26263a;
    font-family:"Kaiti SC","KaiTi","STKaiti",serif;
    white-space:nowrap;
  }
  .pos{
    color:#3b54c8;
    font-style:italic;
    font-size:17px;
    margin-right:2px;
    font-family:"Segoe Script","Lucida Handwriting",cursive;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="group">
      <div class="entry"><span class="en">charity</span><span class="zh"><span class="pos">n.</span>慈善机构</span></div>
      <div class="entry"><span class="en">clarity</span><span class="zh"><span class="pos">n.</span>(思路,图像)清晰</span></div>
      <div class="entry"><span class="en">clarify</span><span class="zh"><span class="pos">v.</span>阐明,阐释</span></div>
    </div>
    <div class="group">
      <div class="entry"><span class="en bl">consistent</span><span class="zh"><span class="pos">adj.</span>一贯的,与…一致的</span></div>
      <div class="entry"><span class="en">resist</span><span class="zh"><span class="pos">v.</span>抵制</span></div>
      <div class="entry"><span class="en">insist</span><span class="zh"><span class="pos">v.</span>坚持</span></div>
    </div>
    <div class="group">
      <div class="entry"><span class="en">insert</span><span class="zh"><span class="pos">v.</span>插入,嵌入</span></div>
      <div class="entry"><span class="en">assert</span><span class="zh"><span class="pos">v.</span>断言;坚持主张</span></div>
    </div>
    <div class="group">
      <div class="entry"><span class="en bl">eminent</span><span class="zh"><span class="pos">adj.</span>杰出的</span></div>
      <div class="entry"><span class="en bl">prominent</span><span class="zh"><span class="pos">adj.</span>杰出的,重要的</span></div>
      <div class="entry"><span class="en bl">eliminate</span><span class="zh"><span class="pos">v.</span>消除;淘汰</span></div>
    </div>
    <div class="group">
      <div class="entry"><span class="en">integral</span><span class="zh"><span class="pos">adj.</span>必不可少的</span></div>
      <div class="entry"><span class="en bl">integrity</span><span class="zh"><span class="pos">n.</span>诚实,正直</span></div>
      <div class="entry"><span class="en bl">integrate</span><span class="zh"><span class="pos">v.</span>(使)融入</span></div>
    </div>
    <div class="group">
      <div class="entry"><span class="en bl">fabricate</span><span class="zh"><span class="pos">v.</span>捏造</span></div>
      <div class="entry"><span class="en bl">fluctuate</span><span class="zh"><span class="pos">v.</span>波动,上下浮动</span></div>
    </div>
  </div>
</body>
</html>
