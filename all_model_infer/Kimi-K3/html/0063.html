<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heath Ceramics Advertisement - Architecture California</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            background-color: white;
            width: 850px; /* Approximate aspect ratio of a magazine page */
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .ad-box {
            border: 2px solid black;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .image-placeholder {
            width: 100%;
            height: 650px;
            background-color: #e0e0e0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="%23d3d3d3"/><text x="50%" y="50%" font-family="sans-serif" font-size="24" fill="%23666" text-anchor="middle" dominant-baseline="middle">[Photo: Interior atrium with hexagonal tile floor, Transpacific Building]</text></svg>');
            background-size: cover;
            background-position: center;
            margin-bottom: 0;
        }

        .content-area {
            padding: 20px 30px 40px 30px;
        }

        .top-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 40px;
            color: #333;
        }

        .headline {
            text-align: center;
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 60px;
            letter-spacing: -0.5px;
        }

        .bottom-info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 16px;
            color: #333;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .company-name {
            font-weight: bold;
            font-size: 20px;
        }

        .tagline {
            font-size: 16px;
        }

        .right-col {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .footer-meta {
            position: absolute;
            bottom: 15px;
            right: 40px;
            font-size: 10px;
            color: #555;
            display: flex;
            gap: 15px;
        }
        
        .footer-meta span {
            margin-left: 10px;
        }

    </style>
</head>
<body>

    <div class="page-container">
        <div class="ad-box">
            <div class="image-placeholder">
                <!-- Visual representation of the atrium photo -->
            </div>
            
            <div class="content-area">
                <div class="top-info-row">
                    <div>Transpacific Building — Oakland, CA</div>
                    <div>Wong & Tung International Architects</div>
                </div>

                <div class="headline">
                    “tile that humanizes”
                </div>

                <div class="bottom-info-row">
                    <div class="left-col">
                        <div class="company-name">Heath Ceramics, Sausalito, CA 94965</div>
                        <div class="tagline">(Custom-made by people—not automated)</div>
                    </div>
                    <div class="right-col">
                        <div>Phone (415) 332-3732</div>
                        <div>Edith Heath</div>
                        <div>Jon Brooder</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-meta">
            September/October 1983 <span>Architecture California</span> <span>3</span>
        </div>
    </div>

</body>
</html>
