<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线式构图 · 版式设计</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#ffffff;}
  body{font-family:"SimHei","Heiti SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;}
  .page{position:relative;width:540px;height:720px;margin:0 auto;background:#ffffff;overflow:hidden;color:#111;}
  .yellow{background:#ffee00;}
  .black{background:#0b0b0b;}
  .abs{position:absolute;}

  /* header */
  .hd-l{left:37px;top:22px;}
  .hd-l .zh{font-size:17px;color:#3a3a3a;letter-spacing:1px;font-weight:600;}
  .hd-l .en{font-size:9px;color:#6d6d6d;letter-spacing:2px;margin-top:4px;font-weight:600;}
  .hd-r{right:37px;top:23px;text-align:right;}
  .hd-r .zh{font-size:15px;color:#3a3a3a;letter-spacing:4px;font-weight:600;}
  .hd-r .en{font-size:10px;color:#4d4d4d;letter-spacing:2px;margin-top:6px;}

  /* block A yellow 酷 */
  .bA{left:37px;top:66px;width:139px;height:126px;text-align:center;}
  .bA span{display:block;line-height:126px;font-size:84px;font-weight:900;color:#111;}

  /* block B black 酷设而遇 COOLS */
  .bB{left:197px;top:67px;width:306px;height:125px;color:#ffee00;text-align:center;padding-top:11px;}
  .bB .l1{display:block;font-size:46px;font-weight:900;letter-spacing:24px;line-height:1.12;padding-left:12px;}
  .bB .l2{display:block;font-size:41px;font-weight:800;letter-spacing:30px;line-height:1.25;padding-left:15px;}

  .bar1{left:65px;top:219px;width:77px;height:20px;}

  /* block C yellow 构图的重要性 */
  .bC{left:37px;top:263px;width:139px;height:126px;color:#111;text-align:center;padding-top:20px;}
  .bC div{font-size:31px;font-weight:800;line-height:1.45;letter-spacing:1px;}

  /* block D black 酷设永远 */
  .bD{left:340px;top:228px;width:163px;height:161px;color:#ffee00;text-align:center;padding-top:22px;}
  .bD div{font-size:49px;font-weight:900;letter-spacing:12px;line-height:1.62;padding-left:6px;}

  .bar2{left:377px;top:404px;width:92px;height:20px;}

  /* block E black the importance */
  .bE{left:37px;top:417px;width:139px;height:126px;color:#bfb268;padding:49px 0 0 8px;}
  .bE div{font-size:10px;letter-spacing:1.6px;line-height:1.7;font-weight:700;white-space:nowrap;}

  /* block F black 在顶点 */
  .bF{left:187px;top:435px;width:316px;height:108px;color:#ffee00;text-align:center;}
  .bF span{display:block;line-height:108px;font-size:66px;font-weight:900;letter-spacing:36px;padding-left:18px;}

  .ybar{left:64px;top:559px;width:69px;height:18px;}

  /* repeated strip */
  .rep{left:187px;top:558px;width:316px;}
  .rep .row{height:12px;line-height:12px;background:#161616;color:#d6d6d6;font-size:7px;white-space:nowrap;overflow:hidden;margin-bottom:7px;letter-spacing:0;}
  .rep .row:last-child{margin-bottom:0;}
  .rep .row i{font-style:normal;display:inline-block;padding:0 9px;border-right:1px solid #e8e8e8;}

  /* bottom */
  .circ{left:48px;top:595px;width:84px;height:84px;border-radius:50%;}
  .bbar{left:154px;top:643px;width:261px;height:20px;color:#f2f2f2;text-align:center;}
  .bbar span{display:block;line-height:20px;font-size:10px;letter-spacing:1.2px;font-weight:700;white-space:nowrap;}
  .ysq{left:429px;top:626px;width:73px;height:52px;}

  .foot{left:37px;top:694px;width:466px;font-size:15px;color:#111;letter-spacing:1px;white-space:nowrap;font-weight:500;}
</style>
</head>
<body>
<div class="page">

  <div class="abs hd-l">
    <div class="zh">曲线式构图</div>
    <div class="en">CURVILINEAR&nbsp;COMPOSITION</div>
  </div>
  <div class="abs hd-r">
    <div class="zh">版式设计</div>
    <div class="en">2023/6/07</div>
  </div>

  <div class="abs yellow bA"><span>酷</span></div>

  <div class="abs black bB">
    <span class="l1">酷设而遇</span>
    <span class="l2">COOLS</span>
  </div>

  <div class="abs black bar1"></div>

  <div class="abs yellow bC">
    <div>构图的</div>
    <div>重要性</div>
  </div>

  <div class="abs black bD">
    <div>酷设</div>
    <div>永远</div>
  </div>

  <div class="abs black bar2"></div>

  <div class="abs black bE">
    <div>THE&nbsp;IMPORTANCE</div>
    <div>OF&nbsp;COMPOSITION</div>
  </div>

  <div class="abs black bF"><span>在顶点</span></div>

  <div class="abs yellow ybar"></div>

  <div class="abs rep">
    <div class="row"><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以</i></div>
    <div class="row"><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以</i></div>
    <div class="row"><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以是图片</i><i>都可以</i></div>
  </div>

  <div class="abs yellow circ"></div>
  <div class="abs black bbar"><span>COOL&nbsp;SET&nbsp;IS&nbsp;ALWAYS&nbsp;AT&nbsp;THE&nbsp;TOP</span></div>
  <div class="abs yellow ysq"></div>

  <div class="abs foot">我&nbsp;/&nbsp;看&nbsp;/&nbsp;不&nbsp;/&nbsp;懂&nbsp;/&nbsp;但&nbsp;/&nbsp;大&nbsp;/&nbsp;受&nbsp;/&nbsp;震&nbsp;/&nbsp;撼</div>

</div>
</body>
</html>
