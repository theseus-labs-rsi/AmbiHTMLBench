<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内知名设计工作室的官网 Vol.07</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#e6e6e6;font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#111;}
  .page{width:540px;margin:0 auto;background:#fff;overflow:hidden;}
  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;}
  .brand{display:flex;align-items:baseline;white-space:nowrap;}
  .brand .script{font-family:"Segoe Script","Comic Sans MS",cursive;font-style:italic;font-weight:800;font-size:34px;letter-spacing:-1px;}
  .brand sup{font-size:11px;margin:0 1px;}
  .brand .share{font-size:21px;font-weight:500;}
  .brand .vol{font-style:italic;font-size:19px;margin-left:6px;font-weight:600;}
  .ds{display:flex;align-items:center;gap:6px;}
  .folderico{width:24px;height:18px;background:#111;border-radius:2px;position:relative;}
  .folderico::before{content:"";position:absolute;top:-6px;left:0;width:12px;height:8px;background:#111;border-radius:3px 6px 0 0;}
  .dsbox{border:2px solid #111;padding:2px 8px;font-size:15px;display:flex;align-items:center;gap:8px;background:#fff;}
  .dsbox .scr{width:7px;height:14px;border:1.5px solid #111;border-radius:3px;position:relative;}
  .dsbox .scr::after{content:"";position:absolute;left:1px;top:1px;width:3px;height:5px;background:#111;border-radius:2px;}
  .hr{border-top:2px solid #111;margin:4px 16px 0;}
  /* folders */
  .folders{position:relative;height:280px;background:#fff;}
  .fd{position:absolute;background:linear-gradient(180deg,#f0f0f0 0%,#dddddd 100%);border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:9px 11px;}
  .fd::before{content:"";position:absolute;top:-15px;left:11px;width:72px;height:17px;background:linear-gradient(180deg,#f4f4f4,#e4e4e4);border-radius:7px 12px 0 0;}
  .num{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(178,178,178,.65);color:#7d7d7d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .f1{left:0;top:42px;width:168px;height:106px;transform:rotate(-26deg);}
  .f1 .row{display:flex;align-items:flex-start;}
  .f1 .abcd{font-size:35px;font-style:italic;font-weight:800;line-height:.95;letter-spacing:-1px;}
  .f1 .ab{margin-left:6px;line-height:1.05;}
  .f1 .ab .a{font-size:13px;font-weight:600;display:block;}
  .f1 .ab .black{font-size:15px;font-weight:800;display:block;}
  .f1 .cover{font-size:15px;font-weight:800;margin-top:2px;}
  .f1 .num{left:22px;bottom:8px;}
  .f2{left:208px;top:55px;width:150px;height:92px;}
  .f2 .cn{font-size:27px;font-weight:800;text-align:right;line-height:1;}
  .f2 .lat{text-align:right;font-size:14px;font-weight:700;line-height:1.15;margin-top:8px;}
  .f2 .num{left:16px;bottom:14px;}
  .f3{left:382px;top:26px;width:162px;height:108px;transform:rotate(24deg);}
  .f3 .studio{font-size:15px;font-weight:800;text-align:right;line-height:1.05;}
  .f3 .na{font-size:15px;font-weight:800;line-height:1.05;}
  .f3 .eo{position:absolute;right:38px;top:52px;font-size:14px;font-weight:800;}
  .f3 .jp{font-size:30px;font-weight:900;letter-spacing:2px;margin-top:4px;}
  .f3 .num{right:14px;bottom:16px;}
  .f4{left:114px;top:174px;width:140px;height:86px;}
  .f4 .cn{font-size:26px;font-weight:800;display:inline-block;}
  .f4 .en{font-size:13px;font-weight:700;margin-top:8px;letter-spacing:.5px;}
  .f4 .num{right:12px;top:18px;}
  .f5{left:303px;top:178px;width:150px;height:86px;}
  .f5 .nice{font-size:29px;font-weight:800;line-height:1;display:inline-block;}
  .f5 .small{font-size:11px;font-weight:800;line-height:1.15;display:inline-block;vertical-align:bottom;}
  .f5 .lab{font-size:29px;font-weight:800;line-height:1;float:right;margin-top:14px;}
  .f5 .num{right:16px;top:14px;}
  /* blue band */
  .blue{height:44px;background:#2a1fe5;}
  /* aqua */
  .aqua{background:#bdf3ee;padding-bottom:10px;}
  .bigline{font-size:92px;font-weight:900;line-height:1.12;padding:14px 22px 0;letter-spacing:0;}
  .rule{border-top:4px solid #111;margin:4px 22px 6px;}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 22px 6px;}
  .copy{font-size:16px;line-height:1.2;font-weight:500;}
  .copy .gw{margin-left:26px;}
  .tri{width:38px;height:38px;border:3px solid #111;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .tri i{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:15px solid #111;display:block;}
  .bc{text-align:center;}
  .bars{width:168px;height:42px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 8px,transparent 8px 10px,#111 10px 11px,transparent 11px 15px,#111 15px 19px,transparent 19px 21px,#111 21px 22px,transparent 22px 26px);}
  .bc .cap{font-size:11px;font-weight:600;margin-top:3px;letter-spacing:.5px;}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand">
      <span class="script">九点</span><sup>®</sup><span class="share">(分享)</span><span class="vol">Vol.07</span>
    </div>
    <div class="ds">
      <span class="folderico"></span>
      <span class="dsbox">Design studio web <span class="scr"></span></span>
    </div>
  </div>
  <div class="hr"></div>

  <div class="folders">
    <div class="fd f1">
      <div class="row">
        <span class="abcd">ABCD</span>
        <span class="ab"><span class="a">A</span><span class="black">BLACK</span></span>
      </div>
      <div class="cover">COVER DESIGN</div>
      <span class="num">1</span>
    </div>

    <div class="fd f2">
      <div class="cn">条件反射</div>
      <div class="lat">REFLEX<br>DESIGN</div>
      <span class="num">2</span>
    </div>

    <div class="fd f3">
      <div class="studio">STUDIO</div>
      <div class="na">NA.</div>
      <span class="eo">EO</span>
      <div class="jp">立入禁止</div>
      <span class="num">3</span>
    </div>

    <div class="fd f4">
      <span class="cn">王志弘</span>
      <div class="en">WANG ZHI HONG</div>
      <span class="num">4</span>
    </div>

    <div class="fd f5">
      <span class="nice">NICE</span>
      <span class="num">5</span>
      <div>
        <span class="small">NICE LAB<br>STUDIO</span>
        <span class="lab">LAB</span>
      </div>
    </div>
  </div>

  <div class="blue"></div>

  <div class="aqua">
    <div class="bigline">国内知名设计</div>
    <div class="rule"></div>
    <div class="bigline">工作室的官网</div>
    <div class="rule"></div>

    <div class="foot">
      <div class="copy">
        Copyright© 2023 <span class="gw">(官网)</span><br>
        Jidn share all rights reserved.
      </div>
      <div class="tri"><i></i></div>
      <div class="bc">
        <div class="bars"></div>
        <div class="cap">&lt;&lt;&lt; JIDN SHARE ©2023 &gt;&gt;&gt;</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
