<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loneliness Quote Card</title>
<script>
  MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#141126;}
  .page{
    position:relative;
    width:min(94vw,540px);
    aspect-ratio:3/4;
    margin:0 auto;
    container-type:inline-size;
    background:
      radial-gradient(130% 100% at 50% 32%,
        #383153 0%, #2b2546 40%, #1e1a37 70%, #161229 100%);
    overflow:hidden;
    font-family:Georgia,"Times New Roman","Songti SC","SimSun","Noto Serif CJK SC",serif;
  }
  .topmark{
    position:absolute;top:0.6%;left:16%;
    color:#cfc6d8;opacity:.22;font-size:clamp(7px,1.5cqw,11px);letter-spacing:.18em;
  }
  .emblem{
    position:absolute;top:16.6%;left:50%;transform:translateX(-50%);
    width:31.5%;color:#d6bd86;
  }
  .emblem svg{display:block;width:100%;height:auto;}
  .eng-zone{position:absolute;top:44.6%;left:0;width:100%;}
  .sp{
    position:absolute;top:50%;transform:translateY(-50%);
    color:#e0c98f;font-size:clamp(12px,3.1cqw,19px);line-height:1;
    text-shadow:0 0 6px rgba(224,201,143,.55);
  }
  .sp-l{left:8.2%;}
  .sp-r{right:6.6%;}
  .eng{
    margin:0 auto;max-width:76%;text-align:center;
    color:#c9c4d6;
    font-size:clamp(10px,2.35cqw,15px);
    line-height:1.72;letter-spacing:.045em;
  }
  .zh{
    position:absolute;top:55%;left:0;width:100%;text-align:center;
    color:#dabf8c;
    font-size:clamp(15px,4.0cqw,26px);
    line-height:1.5;letter-spacing:.02em;
    font-family:"Songti SC","SimSun","STSong","Noto Serif CJK SC",serif;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topmark">[illegible]</div>

    <figure class="emblem" style="margin:0;">
      <svg viewBox="0 0 170 176" role="img" aria-label="gold diamond emblem with Venus symbol and ticked semicircular dial">
        <defs>
          <clipPath id="tophalf"><rect x="0" y="0" width="170" height="88"/></clipPath>
        </defs>
        <g fill="none" stroke="#d6bd86" stroke-width="1.2" opacity=".85" clip-path="url(#tophalf)">
          <circle cx="85" cy="88" r="82"/>
          <line x1="13.52" y1="68.85" x2="5.79" y2="66.78"/>
          <line x1="20.91" y1="51" x2="13.99" y2="47"/>
          <line x1="32.67" y1="35.67" x2="27.02" y2="30.02"/>
          <line x1="48" y1="23.91" x2="44" y2="16.99"/>
          <line x1="65.85" y1="16.52" x2="63.78" y2="8.79"/>
          <line x1="85" y1="14" x2="85" y2="6"/>
          <line x1="104.15" y1="16.52" x2="106.22" y2="8.79"/>
          <line x1="122" y1="23.91" x2="126" y2="16.99"/>
          <line x1="137.33" y1="35.67" x2="142.98" y2="30.02"/>
          <line x1="149.09" y1="51" x2="156.01" y2="47"/>
          <line x1="156.48" y1="68.85" x2="164.21" y2="66.78"/>
        </g>
        <g fill="none" stroke="#d6bd86">
          <polygon points="85,4 166,88 85,172 4,88" stroke-width="1.4"/>
          <polygon points="85,14 156,88 85,162 14,88" stroke-width="1" opacity=".85"/>
        </g>
        <g fill="none" stroke="#d6bd86" stroke-width="1.6">
          <circle cx="85" cy="66" r="20"/>
          <line x1="85" y1="86" x2="85" y2="108"/>
          <line x1="73" y1="97" x2="97" y2="97"/>
        </g>
      </svg>
    </figure>

    <div class="eng-zone">
      <span class="sp sp-l">✦</span>
      <div class="eng">I think the so-called loneliness refers to the person you are facing,<br>
whose emotions are not on the same frequency as your own.</div>
      <span class="sp sp-r">✦</span>
    </div>

    <div class="zh">“ 我想所谓孤独，<br>
就是你面对的那个人，<br>
他的情绪和你自己的情绪，<br>
不在同一个频率。 ”</div>
  </div>
</body>
</html>
