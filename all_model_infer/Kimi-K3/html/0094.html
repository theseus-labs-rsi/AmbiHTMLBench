<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT快捷键</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8a0c0;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            position: relative;
        }

        .header-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            position: relative;
        }

        .header-box {
            position: relative;
            display: inline-block;
            background: #fff;
            border: 3px solid #333;
            border-radius: 4px;
            padding: 10px 40px;
            text-align: center;
            z-index: 2;
        }

        .header-box::before,
        .header-box::after {
            content: '';
            position: absolute;
            top: -18px;
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 20px solid #fff;
        }

        .header-box::before {
            left: 30%;
        }

        .header-box::after {
            right: 30%;
        }

        .header-box .ear-outline {
            position: absolute;
            top: -20px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 22px solid #333;
        }

        .ear-left {
            left: calc(30% - 1px);
        }

        .ear-right {
            right: calc(30% - 1px);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #4caf50;
            border-radius: 6px;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .scribble-left,
        .scribble-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 40px;
        }

        .scribble-left {
            left: -25px;
        }

        .scribble-right {
            right: -25px;
        }

        .scribble-left svg,
        .scribble-right svg {
            width: 100%;
            height: 100%;
        }

        .content-area {
            background: #fff;
            padding: 30px 40px 40px;
            margin-top: -5px;
        }

        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .shortcut-row {
            display: flex;
            align-items: center;
        }

        .shortcut-key {
            width: 220px;
            min-width: 220px;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            letter-spacing: 0.5px;
        }

        .shortcut-desc {
            flex: 1;
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <div class="header-box">
                <div class="ear-outline ear-left"></div>
                <div class="ear-outline ear-right"></div>
                <div class="scribble-left">
                    <svg viewBox="0 0 30 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 5 Q15 10 5 15 Q15 20 5 25 Q15 30 5 35" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M10 3 Q20 8 10 13 Q20 18 10 23 Q20 28 10 33" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M15 5 Q25 10 15 15 Q25 20 15 25 Q25 30 15 35" stroke="#333" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="scribble-right">
                    <svg viewBox="0 0 30 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M25 5 Q15 10 25 15 Q15 20 25 25 Q15 30 25 35" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M20 3 Q10 8 20 13 Q10 18 20 23 Q10 28 20 33" stroke="#333" stroke-width="2" fill="none"/>
                        <path d="M15 5 Q5 10 15 15 Q5 20 15 25 Q5 30 15 35" stroke="#333" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="header-content">
                    <span class="check-icon">✓</span>
                    <span>PPT快捷键</span>
                </div>
            </div>
        </div>
        <div class="content-area">
            <div class="shortcut-list">
                <div class="shortcut-row">
                    <div class="shortcut-key">B</div>
                    <div class="shortcut-desc">黑屏(在演示时)</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">W</div>
                    <div class="shortcut-desc">切换至白屏/从黑白屏恢复放映</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">F4</div>
                    <div class="shortcut-desc">重复上一步操作</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+D</div>
                    <div class="shortcut-desc">快速复制选中对象</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+G</div>
                    <div class="shortcut-desc">组合对象</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+ Shift+ G</div>
                    <div class="shortcut-desc">取消组合</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+Alt+V</div>
                    <div class="shortcut-desc">打开选择性粘贴窗口</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+单击</div>
                    <div class="shortcut-desc">选择多个对象</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Shift+鼠标</div>
                    <div class="shortcut-desc">拖动等比例缩放图片</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Shift+ F5</div>
                    <div class="shortcut-desc">从当前页开始放映</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+ Shift+C</div>
                    <div class="shortcut-desc">复制格式</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+ Shift+V</div>
                    <div class="shortcut-desc">粘贴格式</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+ Shift+ &lt;</div>
                    <div class="shortcut-desc">快速缩小字号</div>
                </div>
                <div class="shortcut-row">
                    <div class="shortcut-key">Ctrl+ Shift+&gt;</div>
                    <div class="shortcut-desc">快速增大字号</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
