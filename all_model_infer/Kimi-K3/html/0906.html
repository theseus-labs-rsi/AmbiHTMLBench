<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d0;
    font-family: "Kaiti SC","STKaiti","KaiTi","BiauKai","SimSun",serif;
    color: #1b1b1b;
  }
  .page {
    position: relative;
    width: 720px;
    min-height: 980px;
    margin: 24px auto;
    padding: 46px 70px 60px 74px;
    background-color: #fbfbf4;
    background-image:
      linear-gradient(#aaaaaa 1px, transparent 1px),
      linear-gradient(90deg, #aaaaaa 1px, transparent 1px);
    background-size: 38px 38px;
    box-shadow: 0 4px 18px rgba(0,0,0,.28);
  }
  .red { color: #b23028; }
  .dark { color: #26221f; }

  .title {
    margin: 0 0 46px 0;
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #b23028;
  }

  .section {
    display: flex;
    align-items: stretch;
  }
  .side {
    flex: 0 0 46px;
    color: #b23028;
    font-size: 34px;
    font-weight: 700;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-right: 18px;
    padding-top: 4px;
  }
  .content {
    flex: 1 1 auto;
    font-size: 27px;
    line-height: 1.9;
  }
  .content p { margin: 0; }
  .q { color: #a92e27; }
  .q p { margin: 2px 0 10px 0; }

  .formula-wrap {
    position: relative;
    margin-top: 66px;
  }
  .formula .side { letter-spacing: 24px; }
  .formula .content {
    font-size: 27px;
    line-height: 2.05;
    color: #24211e;
  }
  .formula .sub {
    display: block;
    padding-left: 96px;
  }

  .seal {
    position: absolute;
    right: 6px;
    top: 84px;
    width: 62px;
    height: 118px;
    background: #b9332c;
    color: #f6efe8;
    border-radius: 46% / 38%;
    box-shadow: inset 0 0 0 2px rgba(120,10,10,.35), 0 1px 3px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 6px;
    transform: rotate(3deg);
  }

  .koujue {
    margin-top: 58px;
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .koujue .label { color: #3a2a26; }
  .koujue .g1 { color: #4a2620; }
  .koujue .g2 { color: #b23028; }
  .koujue .g3 { color: #8c2822; }
</style>
</head>
<body>
  <div class="page">
    <h1 class="title">句段结构作用好处赏析</h1>

    <div class="section">
      <div class="side">常见问法</div>
      <div class="content q">
        <p>1.请分析这句话的作用是什么?</p>
        <p>2.这句话这样描写有什么好处?</p>
        <p>3.请分析这句话这样描写的表达效果.</p>
      </div>
    </div>

    <div class="formula-wrap">
      <div class="section formula">
        <div class="side">满分公式</div>
        <div class="content">
          <p>① 这是( )描写<span class="sub">生动形象地写出( ),</span></p>
          <p>② 更突出了( ).</p>
          <p>③ 前后文呼应/为后文( )做了铺垫.</p>
        </div>
      </div>
      <div class="seal">存真</div>
    </div>

    <div class="koujue">
      <span class="label">口诀:</span>
      <span class="g1">生动秀</span>
      <span class="g2">感心头</span>
      <span class="g3">勾勾手</span>
    </div>
  </div>
</body>
</html>
