<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王源 最新机场私服Look</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background:#e9e9e9; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",Arial,sans-serif;
    color:#111;
    -webkit-font-smoothing: antialiased;
    display:flex; justify-content:center; align-items:flex-start;
    padding:18px;
  }
  .board {
    width:1080px; height:720px;
    display:flex; flex-direction:row; align-items:stretch;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    overflow:hidden;
  }
  /* side photos */
  .photo {
    flex:13 1 0; position:relative; min-width:0;
    background:linear-gradient(160deg,#d7dee2 0%,#c3ccd2 45%,#aeb9c0 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .photo.right { background:linear-gradient(160deg,#c9d2c4 0%,#b9c2b4 40%,#9aa89b 100%); }
  .placeholder {
    border:1px dashed rgba(0,0,0,.25);
    background:rgba(255,255,255,.28);
    color:rgba(0,0,0,.45);
    font-size:13px; line-height:1.5; text-align:center;
    display:flex; align-items:center; justify-content:center;
    padding:10px;
  }
  .photo .placeholder { width:82%; height:94%; }
  /* center info column */
  .info {
    flex:10 1 0; min-width:0;
    background:#ffffff;
    text-align:center;
    padding:16px 8px 10px;
    display:flex; flex-direction:column; align-items:center;
  }
  .info h1 {
    font-size:50px; font-weight:900; letter-spacing:2px; line-height:1.05;
    margin-top:2px;
  }
  .info .look { font-size:14px; font-weight:600; margin-top:5px; letter-spacing:.5px; }
  .info .brand { font-size:20px; font-weight:800; margin-top:7px; }
  .info .sub   { font-size:13px; margin-top:2px; }
  .info .price { font-size:13px; margin-top:2px; }
  .pic { background:#f6f6f6; border:none; color:rgba(0,0,0,.35); font-size:11px; }
  .pic.glasses { width:96px; height:64px; margin:12px auto 2px; }
  .pic.tee     { width:150px; height:104px; margin:12px auto 2px; }
  .pic.jeans   { width:168px; height:122px; margin:12px auto 2px; }
  .pic.shoes   { width:152px; height:62px; margin:12px auto 2px; }
</style>
</head>
<body>
  <div class="board">
    <figure class="photo left">
      <div class="placeholder">[Photo: left full-height — 王源 正面/侧面，粉色短发、眼镜、黑色口罩，白色星星印花T恤]</div>
    </figure>

    <section class="info">
      <h1>王源</h1>
      <div class="look">最新机场私服Look</div>

      <div class="placeholder pic glasses">[图: 眼镜/口罩特写]</div>
      <div class="brand">PRSR帕莎</div>
      <div class="sub">品牌定制款</div>

      <div class="placeholder pic tee">[图: 白色星星T恤]</div>
      <div class="brand">Etudes</div>
      <div class="sub">LOGO印花圆领短袖T恤</div>
      <div class="price">参考价 ¥1,080</div>

      <div class="placeholder pic jeans">[图: 深蓝色翻边牛仔裤 正/背面]</div>
      <div class="brand">LOEWE</div>
      <div class="sub">单宁布渔夫翻边牛仔裤</div>
      <div class="price">参考价 ¥7,700</div>

      <div class="placeholder pic shoes">[图: 白色运动鞋]</div>
      <div class="brand">GUCCI</div>
      <div class="sub">MAC80系列男士运动鞋</div>
      <div class="price">参考价 ¥7,600</div>
    </section>

    <figure class="photo right">
      <div class="placeholder">[Photo: right full-height — 王源 背影，粉色短发，白色T恤、深蓝翻边牛仔裤、白色运动鞋]</div>
    </figure>
  </div>
</body>
</html>
