<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>While visiting THE FAIR — Sea Cliff WPA Poster</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#444;}
  body{display:flex;justify-content:center;padding:18px 0;}
  .poster{
    position:relative;
    width:700px;
    height:1107px;
    background:#2c39a6;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#f3efe2;
  }
  /* decorative green color fields (foliage / hill) */
  .green-left{
    position:absolute;left:-6%;top:-2%;width:46%;height:78%;
    background:#2f5b22;
    border-radius:0 38% 46% 0 / 0 30% 42% 0;
    z-index:1;
  }
  .green-left::after{
    content:"";position:absolute;right:-34%;top:6%;width:70%;height:88%;
    background:#2c39a6;border-radius:50%;
  }
  .green-hill{
    position:absolute;left:-4%;bottom:-6%;width:112%;height:34%;
    background:#2f5b22;
    border-radius:50% 50% 0 0 / 70% 70% 0 0;
    z-index:1;
  }
  .green-hill::before{
    content:"";position:absolute;left:0;top:-38%;width:46%;height:80%;
    background:#2f5b22;border-radius:0 60% 40% 0;
  }
  /* representational illustrations */
  .placeholder{
    position:absolute;box-sizing:border-box;
    color:rgba(243,239,226,.85);
    font:12px/1.2 Arial,Helvetica,sans-serif;
    display:flex;align-items:flex-end;justify-content:center;
    text-align:center;padding:4px;z-index:2;
  }
  .fair-art{
    left:29%;top:12.5%;width:70%;height:23%;
    background:rgba(243,239,226,.10);
    outline:1px solid rgba(243,239,226,.35);
  }
  .sailboat{
    left:50%;top:52%;width:49%;height:22%;
    background:rgba(245,217,10,.10);
    outline:1px solid rgba(243,239,226,.35);
  }
  .txt{position:absolute;z-index:5;white-space:nowrap;}
  .script{font-family:"Brush Script MT","Segoe Script",cursive;font-weight:700;}
  .yellow{color:#f4d80b;}
  .white{color:#f3efe2;}
  .while{left:33%;top:3.4%;font-size:58px;transform:rotate(-2deg);}
  .thefair{left:37.5%;top:7.6%;font-size:66px;font-weight:900;letter-spacing:4px;transform:rotate(-1deg);}
  .commute{left:35%;top:30.4%;font-size:66px;}
  .byland{left:19%;top:35.2%;font-size:82px;}
  .to{left:9%;top:61.5%;font-size:58px;font-weight:700;}
  .beautiful{left:8.6%;top:65.4%;font-size:96px;}
  .seacliff{
    left:3.5%;top:71.2%;font-size:142px;font-weight:900;letter-spacing:2px;
    color:#f3efe2;text-shadow:10px 10px 0 #2c39a6;
  }
  .tagline{left:5%;top:87.6%;font-size:31px;font-weight:800;letter-spacing:.5px;}
  .golf{left:0;right:0;top:90.6%;text-align:center;font-size:58px;}
  .sponsor{left:0;right:0;top:95.4%;text-align:center;font-size:23px;font-weight:800;letter-spacing:3px;}
  .wpa{left:0;right:0;top:97.6%;text-align:center;font-size:21px;font-weight:800;letter-spacing:3px;}
</style>
</head>
<body>
  <div class="poster">
    <div class="green-left"></div>
    <div class="green-hill"></div>

    <figure class="placeholder fair-art">[Illustration: fairgrounds with Trylon and Perisphere, upper-right]</figure>
    <figure class="placeholder sailboat">[Illustration: yellow sailboat on water, right-center]</figure>

    <div class="txt script yellow while">While visiting</div>
    <div class="txt yellow thefair">THE FAIR</div>

    <div class="txt script yellow commute">commute</div>
    <div class="txt script yellow byland">by land or water</div>

    <div class="txt white to">to</div>
    <div class="txt script white beautiful">beautiful</div>
    <div class="txt seacliff">SEA CLIFF</div>

    <div class="txt white tagline">250 feet above sea level. NO MOSQUITOS</div>
    <div class="txt script white golf">golf and bathing</div>
    <div class="txt white sponsor">SPONSORED BY THE VILLAGE OF SEA CLIFF</div>
    <div class="txt white wpa">WPA FEDERAL ART PROJECT</div>
  </div>
</body>
</html>
