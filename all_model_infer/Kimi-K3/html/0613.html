<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播后数据复盘</title>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#8f99a8;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
    color:#222;
  }
  .sheet{width:540px;margin:0 auto;background:#fff;}
  /* top band */
  .band-top{
    background:#b5becb;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:20px 24px 16px;
  }
  .doc-title{
    font-family:"KaiTi","STKaiti","SimSun",serif;
    font-style:italic;
    font-size:31px;
    color:#3b404b;
    letter-spacing:3px;
    line-height:1;
    padding-top:4px;
  }
  .credit{text-align:right;color:#ffffff;font-size:12px;line-height:1.45;padding-top:2px;}
  .credit .from{display:block;font-size:9px;color:#eef1f5;margin-top:2px;letter-spacing:.5px;}
  /* yellow band */
  .band-yellow{
    background:#fbe77d;
    padding:13px 24px 17px;
    color:#2b2b2b;
  }
  .band-yellow .yh{font-weight:800;font-size:16px;margin:0 0 7px;}
  .band-yellow .yintro{font-size:13.5px;margin:0 0 6px;}
  .band-yellow ul{margin:0;padding-left:19px;font-size:13.5px;line-height:1.55;}
  .band-yellow li{margin:0;padding:0;}
  .band-yellow li::marker{font-size:11px;color:#2b2b2b;}
  /* white content */
  .content{background:#ffffff;padding:20px 0 30px;}
  .flow{display:flex;align-items:center;padding:4px 16px 4px 14px;}
  .flow-tag{
    flex:0 0 auto;
    background:#efefef;
    border-radius:8px;
    padding:11px 13px;
    font-weight:800;
    font-size:16px;
    color:#1f1f1f;
    white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .flow-join{flex:0 0 auto;width:15px;height:0;border-top:2px solid #2b2b2b;}
  .flow-items{flex:1 1 auto;position:relative;padding-left:26px;}
  .flow-items::before{
    content:"";position:absolute;left:0;top:100px;bottom:34px;
    border-left:2px solid #2b2b2b;
  }
  .fitem{margin:11px 0;}
  .fitem .note{
    background:#3f4db3;
    color:#ffffff;
    border-radius:7px;
    padding:11px 14px;
    font-size:14px;
    line-height:1.55;
    margin:0 0 9px 10px;
    box-shadow:0 1px 2px rgba(0,0,0,.22);
  }
  .fitem .capsule{
    position:relative;
    background:#ffffff;
    border:2px dashed #8a93ad;
    border-radius:11px;
    padding:11px 16px;
    font-size:15px;
    color:#202020;
  }
  .fitem .capsule::before{
    content:"";position:absolute;left:-26px;top:50%;width:26px;border-top:2px solid #2b2b2b;
  }
  .fitem .capsule .no{margin-right:6px;}
  /* bottom band */
  .band-bottom{background:#b5becb;height:82px;}
</style>
</head>
<body>
<div class="sheet">
  <div class="band-top">
    <div class="doc-title">三、直播后</div>
    <div class="credit">@自律的营销学姐Renita<span class="from">From 小红书</span></div>
  </div>

  <div class="band-yellow">
    <p class="yh">2、数据复盘</p>
    <p class="yintro">进行直播数据复盘的时候，重点关注4个关键数据：</p>
    <ul>
      <li>人气峰值和平均在线</li>
      <li>观众平均停留时长</li>
      <li>带货转化率</li>
      <li>UV价值</li>
    </ul>
  </div>

  <div class="content">
    <div class="flow">
      <div class="flow-tag">2、数据复盘</div>
      <div class="flow-join"></div>
      <div class="flow-items">
        <div class="fitem">
          <div class="note">一般平均在线能稳定在50人左右直播就有基本的带货能力，能够赚到钱</div>
          <div class="capsule"><span class="no">①</span>人气峰值和平均在线人数</div>
        </div>
        <div class="fitem">
          <div class="note">通常停留时长超过2分钟算不错的数据，超过30s是一个及格线</div>
          <div class="capsule"><span class="no">②</span>观众平均停留时长</div>
        </div>
        <div class="fitem">
          <div class="note">一般带货转化率达到1%以上算合格，优秀的3%以上</div>
          <div class="capsule"><span class="no">③</span>带货转化率</div>
        </div>
        <div class="fitem">
          <div class="note">单个用户给直播间贡献的价值，这个数值越高，说明用户在这个直播间的付费意愿更强</div>
          <div class="capsule"><span class="no">④</span>UV价值</div>
        </div>
      </div>
    </div>
  </div>

  <div class="band-bottom"></div>
</div>
</body>
</html>
