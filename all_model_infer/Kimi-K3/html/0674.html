<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海牙体系概况</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
            background: linear-gradient(135deg, #a8d8d0 0%, #d4e8e4 50%, #b8e0d8 100%);
            min-height: 100vh;
            padding: 40px 60px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        
        .main-title {
            color: #c44a4a;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 4px;
        }
        
        .logo-area {
            text-align: right;
        }
        
        .logo-text {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(to right, #2a9d8f, #1d7a6e);
            padding: 8px 20px;
            display: inline-block;
            letter-spacing: 8px;
        }
        
        .logo-sub {
            color: #fff;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .logo-icon {
            display: inline-flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .logo-symbol {
            width: 50px;
            height: 50px;
            margin-right: 10px;
            position: relative;
        }
        
        .logo-symbol::before {
            content: "";
            position: absolute;
            width: 30px;
            height: 40px;
            border: 3px solid #1e4a8c;
            border-radius: 0 50% 50% 0;
            left: 15px;
            top: 5px;
        }
        
        .logo-symbol::after {
            content: "★★★";
            position: absolute;
            color: #c44a4a;
            font-size: 10px;
            left: 0;
            top: 15px;
            letter-spacing: -2px;
        }
        
        .section-title {
            color: #1e3a5f;
            font-size: 26px;
            font-weight: bold;
            margin: 25px 0 20px 0;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: "";
            width: 14px;
            height: 14px;
            background: #1e3a5f;
            margin-right: 8px;
            display: inline-block;
        }
        
        .content-area {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            padding: 0 40px;
        }
        
        .column {
            width: 45%;
        }
        
        .column-title {
            color: #a03030;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        
        .list-item {
            color: #a03030;
            font-size: 26px;
            margin: 14px 0;
            display: flex;
            align-items: flex-start;
            line-height: 1.4;
        }
        
        .list-item::before {
            content: "●";
            color: #a03030;
            font-size: 16px;
            margin-right: 12px;
            margin-top: 8px;
            flex-shrink: 0;
        }
        
        .bottom-text {
            color: #1e3a5f;
            font-size: 26px;
            line-height: 1.6;
            margin-top: 35px;
            padding: 0 10px;
        }
        
        .bottom-text .highlight {
            color: #c44a4a;
            font-weight: bold;
        }
        
        .section-title-bottom {
            color: #1e3a5f;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        
        .section-title-bottom::before {
            content: "";
            width: 14px;
            height: 14px;
            background: #1e3a5f;
            margin-right: 8px;
            display: inline-block;
        }
        
        .page-number {
            text-align: right;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.08;
            font-size: 60px;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-30deg);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="watermark">禁止用于商业用途</div>
    
    <div class="header">
        <div class="main-title">海牙体系概况</div>
        <div class="logo-area">
            <div class="logo-icon">
                <div class="logo-symbol"></div>
                <div>
                    <div class="logo-text">公益讲座</div>
                    <div class="logo-sub">www.cnipa.gov.cn/wxfw</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="section-title">海牙体系的优势</div>
    
    <div class="content-area">
        <div class="column">
            <div class="column-title">国家或地区途径</div>
            <div class="list-item">向多个局分别提交申请</div>
            <div class="list-item">撰写多种语言的文本</div>
            <div class="list-item">使用多种货币缴费</div>
            <div class="list-item">分别注册</div>
            <div class="list-item">分别办理续展</div>
            <div class="list-item">提交申请即需委托当地代理机构</div>
        </div>
        <div class="column">
            <div class="column-title">海牙途径</div>
            <div class="list-item">向一个局提交申请</div>
            <div class="list-item">撰写一种语言（英/法/西）文本</div>
            <div class="list-item">使用一种货币（瑞士法郎）缴费</div>
            <div class="list-item">国际注册</div>
            <div class="list-item">统一办理续展</div>
            <div class="list-item">驳回时才需委托当地代理机构</div>
        </div>
    </div>
    
    <div class="bottom-text">
        <span class="section-title-bottom">如果需要在</span><span class="highlight">多个</span><span style="color: #1e3a5f; font-size: 26px; font-weight: bold;">国家或地区获得外观设计专利权，通过海牙途径提交国际申请代替原本向不同国家或地区局提交一系列申请，可以节约工作量、时间和费用。</span>
    </div>
    
    <div class="page-number">8</div>
</body>
</html>
