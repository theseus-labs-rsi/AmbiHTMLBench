<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何避免/减少巴纳姆效应？</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#ece7d2;
    display:flex;
    justify-content:center;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    color:#111;
  }
  .page{
    position:relative;
    width:540px;
    min-height:720px;
    background:#fbf4da;
    overflow:hidden;
    padding:118px 34px 40px 34px;
  }
  /* yellow bookmark ribbon top-right */
  .ribbon{
    position:absolute;
    top:0;
    right:38px;
    width:54px;
    height:72px;
    background:#f2c200;
    background:linear-gradient(90deg,#e6b800 0%,#f6cf1a 18%,#f6cf1a 82%,#caa200 100%);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
    color:#fff;
    font-weight:700;
    font-size:20px;
    line-height:1.15;
    text-align:center;
    padding-top:8px;
    letter-spacing:1px;
    z-index:5;
    text-shadow:0 1px 1px rgba(0,0,0,.15);
  }
  /* rainbow arc */
  .rainbow{
    position:absolute;
    left:0;
    top:44px;
    width:540px;
    height:190px;
    z-index:1;
  }
  h1{
    position:relative;
    z-index:2;
    text-align:center;
    font-size:25px;
    font-weight:800;
    margin:6px 0 26px 0;
    letter-spacing:.5px;
  }
  .content{
    position:relative;
    z-index:2;
    font-size:16.5px;
    line-height:1.85;
    text-align:justify;
  }
  .content p{ margin:0 0 16px 0; }
  .hl{ background:#fff000; padding:0 1px; font-weight:700; }
  .wm1{
    position:absolute;
    left:180px;
    top:225px;
    font-size:20px;
    color:#c9c2a4;
    opacity:.55;
    transform:rotate(-18deg);
    z-index:0;
    letter-spacing:2px;
  }
  .wm2{
    position:absolute;
    right:60px;
    bottom:92px;
    font-size:14px;
    color:#c9c2a4;
    opacity:.55;
    transform:rotate(-18deg);
    z-index:0;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="ribbon">心<br>理</div>

  <svg class="rainbow" viewBox="0 0 540 190" aria-hidden="true">
    <path d="M22 188 A 252 252 0 0 1 518 188" fill="none" stroke="#bcd8d9" stroke-width="12"/>
    <path d="M36 188 A 238 238 0 0 1 504 188" fill="none" stroke="#d6c2e0" stroke-width="12"/>
    <path d="M50 188 A 224 224 0 0 1 490 188" fill="none" stroke="#f2b8c6" stroke-width="12"/>
    <path d="M64 188 A 210 210 0 0 1 476 188" fill="none" stroke="#f4cf8d" stroke-width="12"/>
    <path d="M78 188 A 196 196 0 0 1 462 188" fill="none" stroke="#f6e7a0" stroke-width="12"/>
    <path d="M92 188 A 182 182 0 0 1 448 188" fill="none" stroke="#a9d6b6" stroke-width="12"/>
    <path d="M106 188 A 168 168 0 0 1 434 188" fill="none" stroke="#e79fb2" stroke-width="12"/>
  </svg>

  <div class="wm1">小颖</div>
  <div class="wm2">PPT by</div>

  <h1>如何避免/减少巴纳姆效应？</h1>

  <div class="content">
    <p>1、要学会用<span class="hl">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。</p>
    <p>2、我们的自我认知往往是主观的，我们需要保持<span class="hl">谦虚和开放</span>的心态，不要<span class="hl">过分自信或者自卑</span>。我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。</p>
    <p>3、<span class="hl">听取他人的评价</span>。全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。</p>
    <p>4、我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要<span class="hl">学会辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。</p>
  </div>
</div>
</body>
</html>
