<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是好的开始</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;}
  body{
    background:#f6f2e9;
    color:#151515;
    font-family:"Kaiti SC","STKaiti","KaiTi","楷体","DFKai-SB",serif;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    width:100%;
    max-width:600px;
    margin:0 auto;
    background:#f6f2e9;
    border-top:1px solid #8d8d8d;
    box-sizing:border-box;
  }
  /* printed top band */
  .topband{
    height:27px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:1px 6px 0 2px;
    box-sizing:border-box;
    border-bottom:1px solid #8d8d8d;
    font-family:Arial,Helvetica,sans-serif;
  }
  .days{line-height:1;font-size:0;}
  .days span{
    display:inline-block;
    font-size:9px;
    color:#3a3a3a;
    border:1px solid #6f6f6f;
    border-right:none;
    padding:1px 1px 0 1px;
    line-height:1;
  }
  .days span:last-child{border-right:1px solid #6f6f6f;}
  .date{
    font-family:"Times New Roman",serif;
    font-size:15px;
    color:#222;
    letter-spacing:1px;
    white-space:nowrap;
    padding-right:6px;
  }
  .date .sl{display:inline-block;margin:0 34px;}
  .date .sl.last{margin-right:0;}
  /* ruled rows */
  .r{
    height:46px;
    box-sizing:border-box;
    border-bottom:1px solid #9a9a9a;
    display:flex;
    align-items:flex-end;
    padding:0 30px 7px 52px;
    font-size:26px;
    letter-spacing:2px;
    line-height:1;
    white-space:nowrap;
  }
  .r.title{
    justify-content:center;
    padding-left:30px;
    font-size:31px;
    font-weight:700;
    letter-spacing:4px;
    padding-bottom:9px;
  }
  .r.title u{
    text-decoration:none;
    border-bottom:2px solid #1c1c1c;
    padding-bottom:1px;
    line-height:1.05;
  }
  .r.empty{padding:0;}
</style>
</head>
<body>
  <div class="sheet">
    <div class="topband">
      <div class="days"><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div class="date">Date.<span class="sl">/</span><span class="sl">/</span><span class="sl last">/</span></div>
    </div>

    <div class="r title"><u>这是好的开始</u></div>
    <div class="r empty"></div>

    <div class="r">从你看到这篇文章开始.</div>
    <div class="r">你会越来越有钱</div>
    <div class="r">越来越好看.</div>
    <div class="r">生活和心态也会越来越好.</div>
    <div class="r">请相信大数据.</div>
    <div class="r">是你自己把一切美好的东西.</div>
    <div class="r">都吸引了过来</div>
    <div class="r">你已经调到了接收钱的频率</div>
    <div class="r">接收美的频率.</div>
    <div class="r">你的能量频率对了才接收到这</div>
    <div class="r">条信息.</div>
    <div class="r">留下一句"全收到";</div>
    <div class="r">愿所有的愿望全能实现!</div>

    <div class="r empty"></div>
    <div class="r empty"></div>
  </div>
</body>
</html>
