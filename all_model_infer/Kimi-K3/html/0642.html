<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-controller vs. Micro-processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(to right, #4a6fa5 0%, #4a6fa5 15%, #d0d0d0 15%, #e8e8e8 100%);
            height: 32px;
            display: flex;
            align-items: center;
            padding-left: 20px;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 20px;
        }
        
        .diagram-box {
            background: #e8e8e8;
            border: 2px solid #b0b0b0;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            gap: 60px;
            min-width: 800px;
        }
        
        .left-section, .right-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 15px;
        }
        
        .microcontroller-box {
            background: #0099cc;
            border: 2px solid #000080;
            padding: 10px;
            width: 220px;
        }
        
        .microcontroller-title {
            color: black;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .mcu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .mcu-cell {
            background: white;
            border: 2px solid black;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        
        .mcu-cell.full-width {
            grid-column: span 2;
        }
        
        .right-chips {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 380px;
        }
        
        .chip-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        
        .chip {
            border: 2px solid #333;
            padding: 12px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chip.green {
            background: #4CAF50;
            color: white;
            flex: 1;
        }
        
        .chip.brown {
            background: #8B4513;
            color: white;
            width: 70px;
        }
        
        .chip.light-blue {
            background: #87CEEB;
            color: black;
            width: 100px;
        }
        
        .chip.blue {
            background: #2196F3;
            color: white;
            flex: 1;
        }
        
        .chip.beige {
            background: #F5F5DC;
            color: black;
            flex: 1;
        }
        
        .chip.gray {
            background: #9E9E9E;
            color: black;
            flex: 1;
        }
        
        .chip.multi {
            display: flex;
            flex: 1;
            border: none;
            background: transparent;
            padding: 0;
            gap: 2px;
        }
        
        .chip.multi .segment {
            flex: 1;
            border: 2px solid #333;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .chip.multi .segment.purple {
            background: #D8BFD8;
        }
        
        .chip.multi .segment.yellow {
            background: #F0E68C;
        }
        
        .chip.multi .segment.lime {
            background: #90EE90;
        }
        
        .chip.multi .segment.pink {
            background: #FFB6C1;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: black;
        }
        
        .page-number {
            position: absolute;
            right: 30px;
            bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Micro-controller vs. Micro-processor</h1>
    </div>
    
    <div class="main-container">
        <div class="diagram-box">
            <div class="left-section">
                <div class="section-title">One Chip</div>
                <div class="microcontroller-box">
                    <div class="microcontroller-title">Microcontroller</div>
                    <div class="mcu-grid">
                        <div class="mcu-cell">CPU</div>
                        <div class="mcu-cell">Timer/Counter</div>
                        <div class="mcu-cell">Memory</div>
                        <div class="mcu-cell">Clock</div>
                        <div class="mcu-cell">I/O Interface</div>
                        <div class="mcu-cell">USART</div>
                        <div class="mcu-cell full-width">Other Peripherals</div>
                    </div>
                </div>
            </div>
            
            <div class="right-section">
                <div class="section-title">Many Different Chips</div>
                <div class="right-chips">
                    <div class="chip-row">
                        <div class="chip green">Microprocessor</div>
                        <div class="chip brown">Clock</div>
                        <div class="chip light-blue">USART</div>
                    </div>
                    <div class="chip-row">
                        <div class="chip blue">Memory</div>
                        <div class="chip beige">I/O Interfaces</div>
                    </div>
                    <div class="chip-row">
                        <div class="chip gray">Timer/Counter</div>
                        <div class="chip multi">
                            <div class="segment purple">Other</div>
                            <div class="segment yellow">Peri</div>
                            <div class="segment lime">pher</div>
                            <div class="segment pink">als</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        © 2015 by Eng. Mohamed Tarek.
    </div>
    
    <div class="page-number">7</div>
</body>
</html>
