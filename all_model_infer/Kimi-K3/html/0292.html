<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Up in the Biz - Showtime Original</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Playfair+Display:wght@700;900&family=Roboto:wght@300;400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Roboto', sans-serif;
  }

  .poster {
    width: 600px;
    max-width: 100%;
    background: #c8c0b0;
    position: relative;
    overflow: hidden;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 30px 10px;
    position: relative;
  }

  .laurel {
    width: 100px;
    height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid #888;
    border-radius: 50% 50% 0 0;
    padding: 8px 12px 4px;
    position: relative;
  }

  .laurel::before,
  .laurel::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 30px;
    height: 20px;
    border: 2px solid #888;
    border-radius: 0 0 50% 50%;
  }

  .laurel::before {
    left: 5px;
  }

  .laurel::after {
    right: 5px;
  }

  .laurel-text {
    font-size: 7px;
    text-align: center;
    color: #555;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .laurel-year {
    font-size: 14px;
    font-weight: 700;
    color: #555;
  }

  .top-center {
    text-align: center;
    flex: 1;
    padding-top: 5px;
  }

  .showtime-original {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #333;
    text-transform: uppercase;
  }

  .sacha-jenkins {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
    margin-top: 12px;
  }

  .main-image {
    position: relative;
    width: 100%;
    height: 520px;
    background: linear-gradient(180deg, #b8b0a0 0%, #a09888 30%, #888070 60%, #605848 100%);
    overflow: hidden;
  }

  .cap-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 380px;
    background: linear-gradient(180deg, #5a5a5a 0%, #4a4a4a 40%, #3a3a3a 70%, #2a2a2a 100%);
    border-radius: 50% 50% 0 0 / 60% 60% 0 0;
    margin: 0 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
  }

  .cap-text-top {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #d4a820;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  .cap-text-biz {
    font-family: 'Playfair Display', serif;
    font-size: 140px;
    font-weight: 900;
    color: #d4a820;
    line-height: 1;
    text-align: center;
    margin-top: -10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .cap-brim {
    position: absolute;
    top: 310px;
    left: 10px;
    right: 10px;
    height: 70px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 10px;
  }

  .cap-brim-text {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #d4a820;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.4;
  }

  .face-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: linear-gradient(180deg, #706858 0%, #605848 50%, #504838 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 20px;
  }

  .eyes-container {
    display: flex;
    gap: 60px;
    margin-top: 10px;
  }

  .eye {
    width: 70px;
    height: 40px;
    background: #fff;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .eye::after {
    content: '';
    width: 28px;
    height: 28px;
    background: #222;
    border-radius: 50%;
  }

  .eyebrow {
    position: absolute;
    top: -15px;
    width: 80px;
    height: 12px;
    background: #333;
    border-radius: 50%;
  }

  .eyebrow-left {
    left: -5px;
    transform: rotate(-5deg);
  }

  .eyebrow-right {
    right: -5px;
    transform: rotate(5deg);
  }

  .bottom-section {
    background: #111;
    padding: 30px 20px 25px;
    text-align: center;
  }

  .doc-film {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }

  .date {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
  }

  .showtime-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
  }

  .showtime-logo span {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid #fff;
    border-radius: 50%;
    text-align: center;
    line-height: 26px;
    font-size: 20px;
    margin-right: 2px;
    vertical-align: middle;
  }

  .divider {
    width: 2px;
    height: 40px;
    background: #fff;
  }

  .paramount-logo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .streaming-on {
    font-size: 9px;
    color: #aaa;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .paramount-text {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    font-style: italic;
  }

  .paramount-plus {
    font-size: 14px;
    color: #fff;
    font-style: normal;
  }

  .bottom-note {
    font-size: 10px;
    color: #888;
    letter-spacing: 1px;
    margin-top: 15px;
    text-transform: uppercase;
  }

  .face-placeholder {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 220px;
    background: linear-gradient(180deg, #8a8070 0%, #706858 30%, #605848 60%, #504838 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 30px;
  }

  .face-features {
    position: relative;
    width: 300px;
    height: 180px;
  }

  .forehead {
    position: absolute;
    top: 0;
    left: 20px;
    right: 20px;
    height: 60px;
    background: linear-gradient(180deg, #7a7060, #8a8070);
    border-radius: 10px 10px 0 0;
  }

  .forehead-line {
    position: absolute;
    top: 20px;
    left: 40px;
    right: 40px;
    height: 2px;
    background: #6a6050;
    border-radius: 1px;
  }

  .forehead-line2 {
    position: absolute;
    top: 35px;
    left: 50px;
    right: 50px;
    height: 2px;
    background: #6a6050;
    border-radius: 1px;
  }

  .brow-area {
    position: absolute;
    top: 55px;
    left: 10px;
    right: 10px;
    height: 30px;
  }

  .brow {
    position: absolute;
    width: 100px;
    height: 14px;
    background: #3a3020;
    border-radius: 50%;
  }

  .brow-left {
    left: 20px;
    transform: rotate(-3deg);
  }

  .brow-right {
    right: 20px;
    transform: rotate(3deg);
  }

  .eye-area {
    position: absolute;
    top: 80px;
    left: 10px;
    right: 10px;
    height: 60px;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .eye-shape {
    width: 80px;
    height: 42px;
    background: #e8e0d0;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #5a5040;
  }

  .pupil {
    width: 30px;
    height: 30px;
    background: #1a1510;
    border-radius: 50%;
    position: relative;
  }

  .pupil::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 8px;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
  }

  .nose-area {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 30px;
  }

  .ear-left {
    position: absolute;
    top: 60px;
    left: -10px;
    width: 30px;
    height: 60px;
    background: #7a7060;
    border-radius: 50%;
    border: 2px solid #6a6050;
  }

  .earring {
    position: absolute;
    top: 80px;
    left: -5px;
    width: 15px;
    height: 15px;
    border: 3px solid #ccc;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="laurel">
      <div class="laurel-text">TRIBECA<br>FESTIVAL</div>
      <div class="laurel-year">2023</div>
    </div>
    <div class="top-center">
      <div class="showtime-original">SHOWTIME ORIGINAL</div>
      <div class="sacha-jenkins">A SACHA JENKINS JAMMIE</div>
    </div>
    <div style="width:100px;"></div>
  </div>

  <!-- Main Image Area -->
  <div class="main-image">
    <!-- Cap -->
    <div class="cap-area">
      <div class="cap-text-top">ALL UP IN THE</div>
      <div class="cap-text-biz">BIZ</div>
    </div>

    <!-- Cap Brim -->
    <div class="cap-brim">
      <div class="cap-brim-text">THE LIFE AND RHYMES<br>OF BIZ MARKIE</div>
    </div>

    <!-- Face -->
    <div class="face-placeholder">
      <div class="face-features">
        <div class="forehead">
          <div class="forehead-line"></div>
          <div class="forehead-line2"></div>
        </div>
        <div class="brow-area">
          <div class="brow brow-left"></div>
          <div class="brow brow-right"></div>
        </div>
        <div class="eye-area">
          <div class="eye-shape">
            <div class="pupil"></div>
          </div>
          <div class="eye-shape">
            <div class="pupil"></div>
          </div>
        </div>
        <div class="ear-left">
          <div class="earring"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Section -->
  <div class="bottom-section">
    <div class="doc-film">DOCUMENTARY FILM</div>
    <div class="date">AUGUST 11</div>

    <div class="logos">
      <div class="showtime-logo">
        <span>S</span>HOWTIME
      </div>
      <div class="divider"></div>
      <div class="paramount-logo">
        <div class="streaming-on">STREAMING ON</div>
        <div class="paramount-text">Paramount<span class="paramount-plus">+</span></div>
      </div>
    </div>

    <div class="bottom-note">PARAMOUNT+ WITH SHOWTIME PLAN ONLY.</div>
  </div>
</div>

</body>
</html>
