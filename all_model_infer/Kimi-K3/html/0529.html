<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 破晓艺术跨界展览</title>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#dcdce4;}
  body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
  .poster{
    position:relative;flex:0 0 auto;width:1200px;height:2133px;overflow:hidden;
    background:#f6f6fa;
    font-family:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei","PingFang SC","Heiti SC",sans-serif;
    --blue:#1d2a93; --pink:#ff2e63; --ink:#3a3a3a; --faint:#efeff6; --grid:rgba(185,185,205,.5);
  }
  .grid{position:absolute;inset:0;z-index:0;
    background-image:repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 147px);
  }
  .vline{position:absolute;top:0;bottom:0;width:1px;background:var(--grid);z-index:0;}
  .faint{position:absolute;z-index:1;color:var(--faint);font-weight:900;line-height:1;white-space:nowrap;}
  .faint.new{left:64px;top:52px;font-size:262px;letter-spacing:56px;}
  .faint.year{left:424px;top:1616px;font-size:262px;letter-spacing:34px;}
  .el{position:absolute;z-index:2;}
  .dash{position:absolute;z-index:2;background:var(--blue);}
  .pdash{position:absolute;z-index:2;background:var(--pink);}
  .y2026{left:76px;top:228px;color:var(--blue);font-weight:900;font-size:172px;line-height:1;letter-spacing:2px;}
  .poxiao{left:80px;top:434px;width:660px;height:164px;background:var(--blue);overflow:visible;}
  .poxiao .red{position:absolute;left:-6px;top:56px;z-index:1;color:var(--pink);font-weight:900;font-size:150px;line-height:1;letter-spacing:2px;white-space:nowrap;}
  .poxiao .white{position:absolute;left:0;top:7px;z-index:2;color:#ffffff;font-weight:900;font-size:150px;line-height:1;letter-spacing:2px;white-space:nowrap;}
  .big{color:var(--blue);font-weight:900;font-size:330px;line-height:1;white-space:nowrap;}
  .big .gap{display:inline-block;}
  .big1{left:74px;top:630px;}
  .big1 .gap{width:52px;}
  .big2wrap{left:74px;top:992px;}
  .big2wrap .redbar{position:absolute;left:8px;top:246px;width:662px;height:92px;background:var(--pink);z-index:0;}
  .big2{position:relative;z-index:1;}
  .big2 .gap{width:45px;}
  .label{color:var(--ink);font-size:34px;font-weight:400;line-height:1.2;white-space:nowrap;}
  .acttime{left:950px;top:1046px;}
  .t1{left:936px;top:1106px;color:var(--pink);font-weight:900;font-size:78px;line-height:1;letter-spacing:2px;}
  .t2{left:928px;top:1256px;color:var(--pink);font-weight:900;font-size:78px;line-height:1;letter-spacing:2px;}
  .loc{left:588px;top:1528px;width:528px;text-align:right;color:var(--blue);font-weight:700;font-size:40px;line-height:1.2;white-space:nowrap;}
  .price{left:82px;top:1448px;white-space:nowrap;line-height:1;}
  .price .yen{color:var(--pink);font-weight:700;font-size:40px;}
  .price .num{color:var(--pink);font-weight:900;font-size:98px;}
  .price .qi{color:var(--pink);font-weight:700;font-size:38px;}
  .price-sub{left:84px;top:1540px;}
  .org1{left:84px;top:1898px;}
  .org2{left:84px;top:1960px;color:var(--blue);font-weight:900;font-size:46px;line-height:1.2;white-space:nowrap;}
  .contact1{left:928px;top:1900px;}
  .contact2{left:700px;top:1962px;width:416px;text-align:right;color:var(--blue);font-weight:900;font-size:44px;line-height:1.2;letter-spacing:1px;white-space:nowrap;}
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="vline" style="left:80px;"></div>
    <div class="vline" style="left:425px;"></div>
    <div class="vline" style="left:742px;"></div>
    <div class="vline" style="left:1119px;"></div>

    <div class="faint new">NEW</div>
    <div class="faint year">YEAR</div>

    <div class="dash" style="left:82px;top:188px;width:82px;height:8px;"></div>
    <div class="el y2026">2026</div>

    <div class="el poxiao">
      <span class="red">破晓艺术</span>
      <span class="white">破晓艺术</span>
    </div>

    <div class="el big big1">跨<span class="gap"></span>界</div>

    <div class="el big2wrap">
      <div class="redbar"></div>
      <div class="big big2">展<span class="gap"></span>览</div>
    </div>

    <div class="el label acttime">活动时间</div>
    <div class="el t1">01/01</div>
    <div class="pdash" style="left:1070px;top:1212px;width:46px;height:9px;"></div>
    <div class="el t2">01/03</div>

    <div class="dash" style="left:1070px;top:1426px;width:46px;height:9px;"></div>

    <div class="el price"><span class="yen">¥</span><span class="num">60</span><span class="qi">起</span></div>
    <div class="el label price-sub">单人票价</div>

    <div class="el label" style="left:950px;top:1466px;">活动地点</div>
    <div class="el loc">厦门湖里区稿定艺术馆</div>

    <div class="el label org1">主办方：</div>
    <div class="el org2">稿定集团</div>

    <div class="el label contact1">联系电话</div>
    <div class="el contact2">0592-88888888</div>

    <div class="dash" style="left:1070px;top:2042px;width:46px;height:10px;"></div>
    <div class="dash" style="left:80px;top:2096px;width:50px;height:11px;"></div>
  </div>
</body>
</html>
