<!DOCTYPE html>
<html>
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE Book on Social Media in Health Care</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: Calibri, Arial, Helvetica, sans-serif;
  }
  .slide {
    width: 1024px;
    height: 768px;
    border: 1px solid #000;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    padding: 28px 34px;
  }
  h1.title {
    color: #1F4E79;
    font-size: 43px;
    font-weight: normal;
    line-height: 1.12;
    letter-spacing: 0.2px;
  }
  h1.title em { font-style: italic; }
  .content {
    display: flex;
    align-items: flex-start;
    margin-top: 38px;
  }
  .book {
    width: 286px;
    height: 428px;
    margin-left: 36px;
    background: #050505;
    color: #ffffff;
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
  }
  .book .cover-text {
    position: absolute;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    line-height: 1.0;
  }
  .book .line1 { font-size: 31px; font-weight: normal; }
  .book .line2 { font-size: 57px; font-weight: normal; letter-spacing: 1px; }
  .book .line3 { font-size: 31px; font-weight: normal; margin-top: 4px; }
  .book .line4 { font-size: 27px; font-weight: normal; margin-top: 2px; }
  .book .footer {
    position: absolute;
    bottom: 96px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #d9d9d9;
  }
  .book .waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 150px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #063a5e 35%, #0a6ea8 70%, #0b3f68 100%);
  }
  .bullets {
    margin-left: 72px;
    margin-top: 2px;
    width: 560px;
  }
  .bullets ul {
    list-style: none;
  }
  .bullets li {
    position: relative;
    font-size: 31px;
    line-height: 1.18;
    color: #000000;
    padding-left: 38px;
    margin-bottom: 26px;
  }
  .bullets li::before {
    content: "\2022";
    color: #1F4E79;
    position: absolute;
    left: 0;
    top: -2px;
    font-size: 31px;
  }
  .bullets a, .bullets u {
    color: #000000;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="slide">
    <h1 class="title"><em>THE</em> Book on Social Media in Health<br>Care</h1>
    <div class="content">
      <figure class="book placeholder" aria-label="Book cover: Bringing the Social Media #Revolution to Health Care">
        <div class="cover-text">
          <div class="line1">Bringing the</div>
          <div class="line2">Social<br>Media</div>
          <div class="line3">#Revolution</div>
          <div class="line4">to Health Care</div>
        </div>
        <div class="footer">Mayo Clinic Center for Social Media</div>
        <div class="waves"></div>
      </figure>
      <div class="bullets">
        <ul>
          <li>Essays from 30 thought<br>leaders</li>
          <li>The &ldquo;Why?&rdquo; of social media<br>in health care</li>
          <li>Net proceeds fund patient<br>scholarships</li>
          <li>Available on <u>Amazon</u> and<br>discount bulk orders on<br><u>CreateSpace</u> (with offer<br>code Z4L7DBSN)</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
