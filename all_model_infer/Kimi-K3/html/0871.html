<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief Is Life But Love Is Long</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#f3f3f3;}
  body{display:flex;justify-content:center;align-items:flex-start;font-family:Georgia,'Times New Roman',serif;}
  .poster{position:relative;width:540px;height:720px;overflow:hidden;background:
    radial-gradient(circle at 28% 16%, rgba(247,192,142,.55), rgba(255,255,255,0) 44%),
    radial-gradient(circle at 82% 30%, rgba(246,188,136,.50), rgba(255,255,255,0) 46%),
    radial-gradient(circle at 68% 80%, rgba(246,186,132,.45), rgba(255,255,255,0) 52%),
    radial-gradient(circle at 18% 82%, rgba(248,202,162,.42), rgba(255,255,255,0) 42%),
    radial-gradient(circle at 55% 45%, rgba(255,255,255,.95), rgba(255,255,255,0) 40%),
    #ffffff;}

  .tl{position:absolute;top:20px;left:26px;color:#f08a34;}
  .tl .d{font-weight:700;font-size:13px;letter-spacing:3px;}
  .tl .by{display:block;margin-top:2px;font-size:9px;letter-spacing:.6px;line-height:1.25;color:#ef9648;}

  .tr{position:absolute;top:17px;right:24px;color:#f58220;font-weight:900;}
  .tr .l1{font-size:26px;letter-spacing:1px;line-height:1;}
  .tr .l2{font-size:17px;letter-spacing:2px;line-height:1;margin-top:5px;padding-left:37px;}

  .cn{position:absolute;top:78px;right:25px;text-align:right;color:#ef9a4f;font-size:10px;line-height:1.7;letter-spacing:1px;font-family:'Times New Roman',Georgia,serif;}
  .cn .sp{letter-spacing:11px;}

  .vbig{position:absolute;color:#f07f22;font-weight:900;font-size:41px;line-height:1;text-align:center;}
  .vbig i{display:block;font-style:normal;}
  .vbig i.g{height:.42em;}
  .love{left:97px;top:133px;width:1.1em;}
  .three{left:22px;top:133px;width:1.1em;}

  .vsmall{position:absolute;right:15px;top:186px;color:#e9a260;font-weight:600;font-size:11px;line-height:1;text-align:center;}
  .vsmall i{display:block;font-style:normal;margin-bottom:15px;}

  .quote{position:absolute;left:170px;right:18px;top:620px;text-align:center;color:#e08b4e;font-size:12px;line-height:1.55;}
  .badge{position:absolute;left:286px;top:675px;background:#f58220;color:#ffffff;font-weight:800;font-size:12px;letter-spacing:1px;padding:4px 9px;line-height:1;}
</style>
</head>
<body>
<div class="poster">
  <div class="tl"><span class="d">11/07</span><span class="by">DESIGNED BY<br>KERRLEE</span></div>

  <div class="tr">
    <div class="l1">BRIEF IS LIFE</div>
    <div class="l2">BUT LOVE IS LONG</div>
  </div>

  <div class="cn">你要知道生命虽短，但爱却绵长<br><span class="sp">爱你三千遍</span></div>

  <div class="vbig love"><i>I</i><i class="g"></i><i>L</i><i>O</i><i>V</i><i>E</i><i class="g"></i><i>Y</i><i>O</i><i>U</i></div>
  <div class="vbig three"><i>T</i><i>H</i><i>R</i><i>E</i><i>E</i><i class="g"></i><i>T</i><i>H</i><i>O</i><i>U</i><i>S</i><i>A</i><i>N</i><i>D</i></div>

  <div class="vsmall"><i>A</i><i>U</i><i>G</i><i>E</i><i>N</i><i>S</i><i>T</i><i>E</i><i>R</i><i>N</i></div>

  <div class="quote">Life was like a box of chocolates,<br>you never know what you are gonna get.</div>

  <div class="badge">YOU GOTTA HAVE LITTLE FAITH</div>
</div>
</body>
</html>
