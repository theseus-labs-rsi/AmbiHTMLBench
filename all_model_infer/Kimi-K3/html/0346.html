<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰州旅行文案</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color: #3a3a3a;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1060px; margin: 0 auto; padding: 34px 30px 60px; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: 58px;
    row-gap: 46px;
    align-items: start;
  }

  .sec { text-align: center; }
  .head { display: flex; justify-content: center; align-items: center; gap: 5px; }
  .pin { width: 13px; height: 13px; flex: none; fill: #cf3f38; }
  .name { font-size: 14px; font-weight: 700; color: #3b3b3b; letter-spacing: .5px; }
  .quote { margin: 7px 0 13px; font-size: 11px; color: #9a9a9a; letter-spacing: .5px; }

  figure.photos { width: 100%; max-width: 300px; margin: 0 auto; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: #ffffff; }
  .ph { aspect-ratio: 1 / 1; background: #dcdcdc; }
  .ph:nth-child(2n) { background: #d2d2d2; }
  .ph:nth-child(3n) { background: #e2e2e2; }
  .vhcap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .brand {
    align-self: center;
    justify-self: center;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: "STKaiti","KaiTi","DFKai-SB","SimSun",serif;
    font-weight: 700;
    color: #c63b34;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 9px;
    padding: 6px 0;
  }
</style>
</head>

<div class="page">

        <span class="name">金城兰州</span>
      </div>
      <div class="quote">“淌不完的黄河水向东流”</div>
