<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建议、提案</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#f6f3ea;}
  .sheet{display:flex;min-height:100vh;background:#f7f4ec;}
  .content{
    flex:1 1 auto;
    padding:16px 10px 60px 22px;
    font-family:"SimSun","Songti SC","STSong",serif;
    color:#1b1b1b;
    font-size:17px;
    line-height:2.05;
  }
  .doc-title{
    text-align:center;
    color:#cf2b23;
    font-weight:700;
    font-size:21px;
    letter-spacing:1px;
    margin:2px 0 4px 0;
  }
  .prose{margin:0;text-align:justify;}
  .label{
    color:#d0802e;
    font-weight:700;
    margin:14px 0 0 0;
  }
  .center{text-align:center;margin:0;}
  .center.t1{margin-top:16px;font-size:18px;}
  .center.t2{font-size:15px;margin-top:2px;}
  .u{text-decoration:underline;text-underline-offset:4px;}
  .note{color:#2f6fae;}
  .indent{margin:0;text-indent:2em;}
  .to-line{margin:6px 0 0 0;}
  .measures{margin:2px 0 0 0;}
  .measures p{margin:0;text-indent:2em;}
  .sig{
    text-align:right;
    margin-top:34px;
    padding-right:34px;
    line-height:2.0;
  }
  /* right spiral binding */
  .binding{
    flex:0 0 46px;
    position:relative;
    border-left:1px solid #ddd8cb;
    background:linear-gradient(to right,#f1eee4 0%,#e9e5d8 55%,#ded9c9 100%);
  }
  .tab{position:absolute;right:0;width:15px;border-radius:2px 0 0 2px;box-shadow:-1px 1px 2px rgba(0,0,0,.18);}
  .tab.g1{top:5%;height:70px;background:#8aa86c;}
  .tab.t1{top:19%;height:64px;background:#d6c795;}
  .tab.o1{top:33%;height:70px;background:#d78a4c;}
  .tab.g2{top:49%;height:66px;background:#93ad74;}
  .tab.t2{top:64%;height:70px;background:#d9cb9f;}
  .tab.o2{top:80%;height:66px;background:#d88f52;}
  .ring{
    position:absolute;left:5px;width:22px;height:22px;border-radius:50%;
    background:#fbfaf6;border:2px solid #b6b2a6;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
    z-index:2;
  }
  .r1{top:6%;}.r2{top:20%;}.r3{top:34%;}.r4{top:48%;}.r5{top:62%;}.r6{top:76%;}.r7{top:90%;}
</style>
</head>
<body>
<div class="sheet">
  <div class="content">
    <div class="doc-title">二、建议、提案</div>
    <p class="prose">建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。</p>

    <p class="label">格式:</p>

    <p class="center t1">关于 xxxxx 的建议</p>
    <p class="center t2">("发文机关+关于+内容+文种")</p>

    <p class="to-line"><span class="u">各级领导(称谓要根据具体题目要求分析得出):</span></p>

    <p class="indent"><span class="u">当前,...等问题比较突出(或做了什么工作),为了做好.....工作,提出以下建议:</span><span class="note">(开头为背景分析,指出存在的主要问题和目的意义)</span></p>

    <div class="measures">
      <p>一、......</p>
      <p>二、......</p>
      <p>三、......<span class="note">(主体内容还原为对策题,提出解决问题的措施)</span></p>
    </div>

    <div class="sig">
      <span class="u">发文机关</span><br>
      <span class="u">xx 年 xx 月 xx 日</span>
    </div>
  </div>
  <div class="binding" aria-hidden="true">
    <div class="tab g1"></div>
    <div class="tab t1"></div>
    <div class="tab o1"></div>
    <div class="tab g2"></div>
    <div class="tab t2"></div>
    <div class="tab o2"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="ring r6"></div>
    <div class="ring r7"></div>
  </div>
</div>
</body>
</html>
