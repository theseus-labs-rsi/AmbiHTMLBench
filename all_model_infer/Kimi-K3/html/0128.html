<head>

<title>原则模板</title>

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    max-width: 540px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 44px 30px 30px 30px;
    background: #1a1a1a;
  }
  .y {
    color: #f2c200;
    font-weight: 700;
    font-size: 33px;
    line-height: 1.42;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .y.first { margin-bottom: 22px; }
  .y.second { margin-bottom: 30px; }

    color: #e7e7e7;

    font-size: 28px;
    line-height: 1.62;
    letter-spacing: 0.3px;
  }

<body>
  <div class="sheet">
    <p class="y first">7.当题目中出现“原则”时，可用</p>
    <p class="y second">以下模板：</p>
    <div class="w">(一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展<br>(二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教<br>（三）科学性原则 。...能给幼儿正确的启蒙教<br>育<br>(四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点<br>（五）整体性原则 。考虑到多方面的要素，促<br>进幼儿整体的发展<br>（六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主</div>
  </div>
</body>
</html>
