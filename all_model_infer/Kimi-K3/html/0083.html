<!DOCTYPE html>
<html lang="zh-TW">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瞬息之間 - 藝術攝影展</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #c8c8c8;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .poster {
    width: 100%;
    max-width: 900px;
    background-color: #c8c8c8;
    padding: 30px 40px;
    position: relative;
  }

  .top-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 40px;
  }

  .top-left {
    display: flex;
    gap: 30px;
    align-items: flex-start;
  }

  .chinese-title {
    font-size: 42px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: 2px;
  }

  .english-title {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: 1px;
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
  }

  .top-right {
    writing-mode: vertical-rl;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
  }

  .divider {
    border: none;
    border-top: 2px solid #1a1a1a;
    margin: 10px 0 30px 0;
  }

  .main-content {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-bottom: 30px;
    position: relative;
  }

  .main-left {
    flex: 1;
    min-width: 300px;
  }

  .main-right {
    flex: 1;
    min-width: 300px;
  }

  .big-title-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 20px;
  }

  .big-chinese {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 5px;
  }

  .big-english {
    font-size: 48px;
    font-weight: 900;
    line-height: 1.15;
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
    letter-spacing: 1px;
    padding-top: 10px;
  }

  .artist-info {
    margin-top: 20px;
  }

  .artist-label {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .artist-names {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 15px;
  }

  .date {
    font-size: 64px;
    font-weight: 900;
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
  }

  .big-chinese-bottom {
    font-size: 140px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 5px;
    text-align: right;
    margin-top: 40px;
  }

  .bottom-quote {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.6;
    font-family: "Arial", "Helvetica Neue", sans-serif;
    margin-top: 40px;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .bottom-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 700;
    border-top: 2px solid #1a1a1a;
    padding-top: 15px;
  }

  .bottom-info-left {
    display: flex;
    gap: 15px;
    align-items: center;
  }

  .bottom-info-right {
    font-size: 16px;
    font-weight: 900;
    font-family: "Arial Black", "Helvetica Neue", sans-serif;
  }

  .watermark {
    position: absolute;
    bottom: 10px;
    right: 40px;
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .watermark-badge {
    background: #fff;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 11px;
    color: #333;
  }

  @media (max-width: 700px) {
    .big-chinese {
      font-size: 72px;
    }
    .big-english {
      font-size: 32px;
    }
    .big-chinese-bottom {
      font-size: 90px;
    }
    .date {
      font-size: 48px;
    }
    .chinese-title {
      font-size: 28px;
    }
    .english-title {
      font-size: 20px;
    }
  }
</style>
</head>
<body>
<div class="poster">
  <div class="top-section">
    <div class="top-left">
      <div class="chinese-title">藝術<br>攝影展</div>
      <div class="english-title">ARTIST<br>PHOTO<br>EXHIBITION</div>
    </div>
    <div class="top-right">定格光影</div>
  </div>

  <hr class="divider">

  <div class="main-content">
    <div class="main-left">
      <div class="big-title-row">
        <div class="big-chinese">瞬息</div>
        <div class="big-english">IN THE<br>BLINK OF<br>AN EYE</div>
      </div>
      <div class="artist-info">
        <div class="artist-label">藝術家</div>
        <div class="artist-names">森蘭 王沐春</div>
      </div>
      <div class="date">08/14</div>
    </div>
    <div class="main-right">
      <div class="big-chinese-bottom">之間</div>
    </div>
  </div>

  <hr class="divider">

  <div class="bottom-quote">
    IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
    YOU'RE NOT CLOSE ENOUGH. I ALWAYS SHOOT<br>
    EVERYTHING IN MY MIND AS AN EXERCISE.
  </div>

  <div class="bottom-info">
    <div class="bottom-info-left">
      <span>活動地址：濱江路西溪街二十七號</span>
      <span>|</span>
      <span>主辦單位：壹畫咖啡館</span>
    </div>
    <div class="bottom-info-right">ONE COFFEE</div>
  </div>

  <div class="watermark">
    <span class="watermark-badge">小红书</span>
    <span>小红书号：heyu11221</span>
  </div>
</div>
</body>
</html>
