<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句摘抄 心态主题</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "SimSun", "STSong", "Songti SC", serif;
    color: #26221d;
    background: #d8ccb9;
  }
  .top {
    background: #f6f0e4;
    padding: 34px 42px 22px 42px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .logo {
    line-height: 1;
  }
  .logo .cn {
    font-family: "STXingkai", "Xingkai SC", "KaiTi", cursive;
    color: #d4161d;
    font-size: 92px;
    font-weight: 700;
    letter-spacing: 2px;
    display: block;
    transform: scaleY(1.05);
  }
  .logo .en {
    display: block;
    margin-top: 10px;
    margin-left: 58px;
    font-family: "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 8px;
    color: #a08374;
  }
  .head-right {
    text-align: right;
    padding-top: 4px;
  }
  .head-right .small {
    display: inline-block;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1d1a16;
    border-bottom: 4px solid #1d1a16;
    padding: 0 6px 8px 6px;
  }
  .head-right .big {
    display: inline-block;
    margin-top: 26px;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #1d1a16;
    border-bottom: 4px solid #1d1a16;
    padding: 0 4px 10px 4px;
  }
  .content {
    background: #d8ccb9;
    padding: 46px 46px 70px 46px;
  }
  .quote {
    text-align: center;
    font-size: 43px;
    font-weight: 800;
    line-height: 1.55;
    letter-spacing: 2px;
    color: #2a251f;
    margin: 0;
  }
  .label {
    font-size: 20px;
    font-weight: 700;
    color: #4a4238;
    margin: 34px 0 18px 0;
  }
  .para {
    font-size: 21px;
    line-height: 1.85;
    color: #38322a;
    margin: 0;
    text-align: left;
  }
  .quote2 {
    text-align: center;
    font-size: 37px;
    font-weight: 800;
    line-height: 1.6;
    letter-spacing: 1px;
    color: #2a251f;
    margin: 56px 0 0 0;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">
      <span class="cn">人民日报</span>
      <span class="en">RENMIN RIBAO</span>
    </div>
    <div class="head-right">
      <span class="small">金句｜摘抄</span><br>
      <span class="big">心态主题</span>
    </div>
  </div>

  <div class="content">
    <p class="quote">且行且忘且随风，<br>且行且看且从容。</p>

    <div class="label">释义:</div>

    <p class="para">意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从容不迫。引申意思就是当我们遇到非常不平静的时候，只要能有一个平静的心态，才能找出平静的办法去解决，讲的是从容面对的淡定心态。人生百味，浓缩到最后，就是一个淡字，正确地选择与取舍，是一生必修的功课。</p>

    <p class="quote2">我将玫瑰藏于身后风起花落，<br>从此鲜花赠自己，<br>纵马踏花向自由。</p>

    <div class="label">释义:</div>

    <p class="para">我把心中的的美好向往藏在身后，当面对现实的时候美好的向往会随着花儿掉落，而从此以后美好赠送给自己，骑着马儿迎着美好向往自由。</p>
  </div>
</body>
</html>
