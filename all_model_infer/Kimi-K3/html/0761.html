    <p class="q">当偏见裹挟认知，无视事实，操纵舆论的事发<br>生，我们该如何对待？</p>
    <p>如果我不害怕人微言轻，也许你就不会经历<br>
    人言可畏。用心辨别真相，用爱和真诚可以消<br>
    融流言。正如各位侦探所言，“千军万马踩过的<br>
    时候，小小的一脚都有可能是致命伤。我们<br>
    谁都不想成为这样的人，我们也不要成为加<br>
    害的人”。遭遇不公时，隐忍不是唯一道路，<br>
    我们可以向不公平呐喊，只有大家都勇敢<br>
    起来，加害者才会觉得我们没有那么好<br>
    欺负。</p>
    <p class="red">愿你笔尖下皆自由之风，一笔一画，</p>
    <p class="red l2">一字一句，黑白分明。</p>
