<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香水浓度</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: #7a5a43;
    background-image: radial-gradient(circle at 20% 10%, rgba(0,0,0,0.10), transparent 40%),
                      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.18), transparent 45%);
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    padding: 26px 34px;
    color: #3a2b23;
  }
  .card {
    background: #f8f4ec;
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
    padding: 22px 34px 26px 34px;
    min-height: calc(100vh - 52px);
  }
  h1.title {
    text-align: center;
    font-size: 44px;
    line-height: 1.15;
    letter-spacing: 6px;
    font-weight: 800;
    color: #6b3a1f;
    margin: 4px 0 18px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: 62px repeat(5, 1fr);
    column-gap: 6px;
    row-gap: 14px;
    align-items: center;
  }
  .lab {
    text-align: left;
    font-size: 17px;
    font-weight: 700;
    color: #26211d;
    white-space: nowrap;
  }
  .val {
    text-align: center;
    font-size: 17px;
    color: #3c332c;
    line-height: 1.25;
  }
  .val.cat { font-size: 20px; font-weight: 700; color: #33291f; }
  .val.name { font-size: 15px; line-height: 1.18; }
  .val.abbr { font-size: 17px; }
  .placeholder {
    grid-column: span 5;
    height: 96px;
    border: 1px dashed #c9c2b8;
    background: #f1ede5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a938a;
    font-size: 12px;
    text-align: center;
    padding: 0 10px;
  }
  .tips {
    margin-top: 34px;
    margin-left: 62px;
    font-size: 13px;
    line-height: 1.6;
    color: #6e675f;
    font-family: "Songti SC", "SimSun", serif;
  }
  .tips .t { font-weight: 700; color: #5f5952; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="title">香水浓度</h1>
    <div class="grid">
      <div class="lab"></div>
      <figure class="placeholder">[Illustration: five perfume bottles in a row, gray fill level decreasing from left to right, each with a red spherical cap]</figure>

      <div class="lab">分类</div>
      <div class="val cat">浓香精</div>
      <div class="val cat">淡香精</div>
      <div class="val cat">淡香水</div>
      <div class="val cat">古龙水</div>
      <div class="val cat">清香水</div>

      <div class="lab">名称</div>
      <div class="val name">Parfum</div>
      <div class="val name">Eau<br>De<br>Parfum</div>
      <div class="val name">Eau<br>De<br>Toilette</div>
      <div class="val name">Eau<br>De<br>Cologne</div>
      <div class="val name">Eau<br>Fraiche</div>

      <div class="lab">缩写</div>
      <div class="val abbr">(P)</div>
      <div class="val abbr">(EDP)</div>
      <div class="val abbr">(EDT)</div>
      <div class="val abbr">(EDC)</div>
      <div class="val abbr">(EF)</div>

      <div class="lab">浓度</div>
      <div class="val">15-20%</div>
      <div class="val">10-15%</div>
      <div class="val">5-10%</div>
      <div class="val">3-5%</div>
      <div class="val">&lt;3%</div>

      <div class="lab">留香</div>
      <div class="val">5-8H</div>
      <div class="val">3-5H</div>
      <div class="val">3-4H</div>
      <div class="val">2-3H</div>
      <div class="val">&lt;1h</div>
    </div>

    <div class="tips">
      <div class="t">tips:</div>
      <div>浓度高的香水不代表留香时间长,主要取决于香料种类</div>
      <div>在相同的浓度比较下,木质香的留香时间是碾压花果香的</div>
    </div>
  </div>
</body>
</html>
