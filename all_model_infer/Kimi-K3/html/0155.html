<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 2025年1月3日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", "Songti SC", serif;
            font-size: 14px;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .newspaper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #c00;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .masthead {
            flex: 1;
        }
        .masthead h1 {
            font-size: 72px;
            color: #c00;
            font-family: "KaiTi", "Kaiti SC", serif;
            letter-spacing: 10px;
            line-height: 1;
            margin-bottom: 5px;
        }
        .masthead .pinyin {
            font-size: 14px;
            color: #c00;
            letter-spacing: 8px;
            margin-left: 10px;
        }
        .masthead .website {
            font-size: 11px;
            color: #333;
            margin-top: 5px;
        }
        .date-box {
            border: 2px solid #333;
            padding: 8px 15px;
            text-align: center;
            margin: 0 20px;
        }
        .date-box .year-month {
            font-size: 14px;
            font-weight: bold;
        }
        .date-box .day {
            font-size: 24px;
            font-weight: bold;
        }
        .date-box .weekday {
            font-size: 12px;
        }
        .publication-info {
            text-align: right;
            font-size: 11px;
            line-height: 1.8;
        }
        .main-content {
            display: flex;
            gap: 20px;
        }
        .left-column {
            width: 50%;
        }
        .right-column {
            width: 50%;
        }
        .article {
            margin-bottom: 15px;
        }
        .article h2 {
            font-size: 28px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .article h3 {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .article .subtitle {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .article .author {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-bottom: 8px;
        }
        .article p {
            font-size: 13px;
            text-indent: 2em;
            margin-bottom: 8px;
            text-align: justify;
        }
        .article .dateline {
            font-size: 12px;
            color: #333;
            margin-bottom: 8px;
        }
        .headline-box {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 8px;
            float: left;
            margin-right: 15px;
            height: 400px;
        }
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        .small-articles {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .small-article {
            width: calc(50% - 8px);
        }
        .small-article h4 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .small-article p {
            font-size: 12px;
            text-indent: 2em;
        }
        .divider {
            border-top: 1px solid #333;
            margin: 10px 0;
        }
        .thick-divider {
            border-top: 3px solid #000;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <div class="header">
            <div class="masthead">
                <h1>人民日报</h1>
                <div class="pinyin">RENMIN RIBAO</div>
                <div class="website">人民网网址：http://www.people.com.cn</div>
            </div>
            <div class="date-box">
                <div class="year-month">2025年1月</div>
                <div class="day">3</div>
                <div class="weekday">星期五</div>
            </div>
            <div class="publication-info">
                <div>人民日报出版</div>
                <div>国内统一连续出版物号</div>
                <div>CN 11-0065</div>
                <div>邮发代号 1-1</div>
                <div>第29384期</div>
                <div>今日20版</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="left-column">
                <div class="article">
                    <h2>习近平和夫人彭丽媛向美国华盛顿州中学师生代表</body></html>
