<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; min-height: 100%; }
  body {
    background: #141d4d;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(120,140,200,0.35) 0%, rgba(20,29,77,0) 60%),
      linear-gradient(180deg, #3d4f8f 0%, #1a2456 45%, #0d1330 100%);
    font-family: "Songti SC", "SimSun", "STSong", serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    padding: 150px 16px 60px;
  }
  .page {
    width: 100%;
    max-width: 516px;
  }
  h1.title {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 2px;
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 2px;
    margin-bottom: 34px;
    white-space: nowrap;
  }
  table.survey {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 21px;
    line-height: 1.35;
  }
  table.survey col.q { width: 62%; }
  table.survey col.a { width: 38%; }
  table.survey th,
  table.survey td {
    border: 1.5px solid rgba(255,255,255,0.85);
    padding: 14px 16px;
    vertical-align: middle;
    font-weight: 400;
  }
  table.survey thead th {
    text-align: center;
    font-size: 22px;
    padding: 12px 16px;
  }
  table.survey td.qcell { text-align: left; }
  table.survey td.acell { text-align: center; }
  table.survey td.span {
    text-align: center;
    font-size: 20px;
    padding: 13px 16px;
  }
</style>
</head>
<body>
  <div class="page">
    <h1 class="title">富人眼中的富人是咋样？</h1>
    <table class="survey">
      <colgroup>
        <col class="q">
        <col class="a">
      </colgroup>
      <thead>
        <tr>
          <th>问题</th>
          <th>回答</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="qcell">1.您觉得高净值人群资产拥有多少钱才算是？</td>
          <td class="acell">1亿7,388.4万元</td>
        </tr>
        <tr>
          <td class="span" colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
        </tr>
        <tr>
          <td class="qcell">2.请问您每天工作小时数是？</td>
          <td class="acell">8.2小时</td>
        </tr>
        <tr>
          <td class="qcell">3.您预计退休年龄？</td>
          <td class="acell">59岁</td>
        </tr>
        <tr>
          <td class="qcell">4.您希望能活到多少岁？</td>
          <td class="acell">88.2岁</td>
        </tr>
        <tr>
          <td class="span" colspan="2">小知识:2021年中国平均寿命:77.3岁</td>
        </tr>
        <tr>
          <td class="qcell">5.请问您曾去过国家数量（包括商务出差）</td>
          <td class="acell">6.2个国家</td>
        </tr>
        <tr>
          <td class="qcell">6.请问您平均每月阅读书籍数量</td>
          <td class="acell">2.4本书</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
