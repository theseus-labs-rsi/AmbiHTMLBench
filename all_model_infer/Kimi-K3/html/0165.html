<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 2025年2月13日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", "Songti SC", serif;
            font-size: 14px;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .newspaper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .masthead {
            flex: 1;
        }
        .masthead h1 {
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #c00;
            line-height: 1;
        }
        .masthead .pinyin {
            font-size: 16px;
            letter-spacing: 12px;
            color: #c00;
            margin-top: 5px;
        }
        .header-center {
            text-align: center;
            padding: 0 20px;
        }
        .date-box {
            border: 2px solid #000;
            padding: 8px 15px;
            font-size: 14px;
            line-height: 1.8;
        }
        .header-right {
            text-align: right;
            font-size: 12px;
            line-height: 1.8;
        }
        /* Main content grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        .col-span-2 {
            grid-column: span 2;
        }
        .col-span-3 {
            grid-column: span 3;
        }
        /* Article styling */
        .article {
            margin-bottom: 15px;
        }
        .article-title {
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 28px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        .article-title.small {
            font-size: 20px;
        }
        .article-subtitle {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }
        .article-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .article-body {
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
        }
        .article-body p {
            text-indent: 2em;
            margin-bottom: 8px;
        }
        /* Highlight box */
        .highlight-box {
            background: #c00;
            color: #fff;
            padding: 8px 15px;
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        /* Red label */
        .red-label {
            background: #c00;
            color: #fff;
            padding: 5px 12px;
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        /* Secondary articles */
        .secondary-article {
            border-top: 2px solid #000;
            padding-top: 10px;
            margin-top: 10px;
        }
        .secondary-article .article-title {
            font-size: 22px;
        }
        /* Right column special */
        .right-column {
            border-left: 1px solid #ccc;
            padding-left: 15px;
        }
        .vertical-title {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.4;
            height: 400px;
            float: left;
            margin-right: 15px;
        }
        /* Photo placeholder */
        .photo-placeholder {
            width: 100%;
            height: 200px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            margin: 10px 0;
        }
        .photo-caption {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
        /* Small articles grid */
        .small-articles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        /* Bottom section */
        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            border-top: 2px solid #000;
            padding-top: 15px;
        }
        .bottom-article {
            font-size: 12px;
            line-height: 1.8;
        }
        .bottom-article h3 {
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 18px;
            margin-bottom: 8px;
        }
        /* Special layout for 从百分之五看定力与信心 */
        .special-layout {
            display: flex;
            gap: 15px;
        }
        .special-content {
            flex: 1;
        }
        /* Table of contents style */
        .toc-box {
            border: 1px solid #000;
            padding: 10px;
            font-size: 12px;
            line-height: 2;
        }
        .toc-box h4 {
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 14px;
            margin-bottom: 5px;
        }
        /* Inline photo small */
        .inline-photo {
            float: right;
            width: 150px;
            height: 100px;
            background: #ddd;
            margin: 0 0 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }
        /* Clearfix */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        /* News ticker style */
        .news-ticker {
            background: #f5f5f5;
            padding: 10px;
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        .news-ticker h4 {
            font-family: "SimHei", "Heiti SC", sans-serif;
            font-size: 14px;
            margin-bottom: 5px;
        }
    </style>
</head>
