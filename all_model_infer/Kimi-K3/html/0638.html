<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#f6f2e9;
    color:#6b6255;
    font-family:"Microsoft YaHei","PingFang SC","SimSun",sans-serif;
    font-size:13px;
    position:relative;
    min-height:100vh;
  }
  .tabs{
    background:#e8e2d2;
    border-bottom:1px solid #d8d1c0;
    padding:6px 10px;
    white-space:nowrap;
    overflow:hidden;
  }
  .tabs span{
    display:inline-block;
    padding:3px 14px;
    margin-right:2px;
    color:#7a7263;
  }
  .tabs .lead{color:#8a8172;}
  .tabs .active{
    background:#d9bd93;
    color:#6b5636;
    font-weight:bold;
  }
  h1{
    font-size:16px;
    font-weight:bold;
    color:#5d564a;
    margin:14px 0 8px 8px;
  }
  table.form{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    background:#fffdf7;
  }
  table.form td{
    border:1px solid #dcd5c5;
    vertical-align:top;
    padding:5px 8px;
  }
  td.label{
    background:#f4f0e7;
    color:#7d7668;
  }
  td.h26{height:26px;}
  td.opts{
    height:118px;
    padding:6px 8px;
  }
  .opts .opt{
    height:25%;
    display:flex;
    align-items:center;
    white-space:nowrap;
  }
  td.ah{
    height:30px;
    vertical-align:middle;
    background:#fffdf7;
    color:#7d7668;
    white-space:nowrap;
  }
  td.ah.center{text-align:center;}
  td.big{height:190px;}
  td.migr{height:92px;}
  td.m56{height:56px;}
  td.m46{height:46px;}
  .watermark{
    position:absolute;
    right:14px;
    bottom:10px;
    color:#b9b2a2;
    opacity:.55;
    font-size:15px;
    letter-spacing:1px;
    user-select:none;
  }
</style>
</head>
<body>
  <div class="tabs">
    <span class="lead">行测</span><span class="lead">&gt;</span><span>常识</span><span>言语</span><span>数量</span><span>判断</span><span>资料</span><span class="active">申论</span><span>纸张</span><span>计划</span>
  </div>

  <h1>· 晨读笔记</h1>

  <table class="form">
    <colgroup>
      <col style="width:12%">
      <col style="width:22%">
      <col style="width:22%">
      <col style="width:44%">
    </colgroup>
    <tr>
      <td class="label">主题</td>
      <td colspan="3" class="h26"></td>
    </tr>
    <tr>
      <td class="label">应用领域</td>
      <td colspan="3" class="h26"></td>
    </tr>
    <tr>
      <td class="label">热门事件</td>
      <td colspan="3" class="h26"></td>
    </tr>
    <tr>
      <td class="label">宏观政策</td>
      <td colspan="3" class="h26"></td>
    </tr>
    <tr>
      <td class="label">媒体评论</td>
      <td colspan="3" class="h26"></td>
    </tr>
    <tr>
      <td class="label opts">
        <div class="opt">○ 意义</div>
        <div class="opt">○ 原因</div>
        <div class="opt">○ 问题</div>
        <div class="opt">○ 危害</div>
      </td>
      <td colspan="3"></td>
    </tr>
    <tr>
      <td colspan="2" class="ah">○ 问题分析</td>
      <td class="ah">○ 原因分析</td>
      <td class="ah center">对策分析</td>
    </tr>
    <tr>
      <td colspan="3" class="big"></td>
      <td class="big"></td>
    </tr>
    <tr>
      <td class="label">句子迁移</td>
      <td colspan="3" class="migr"></td>
    </tr>
    <tr>
      <td class="label">方法迁移</td>
      <td colspan="3" class="m56"></td>
    </tr>
    <tr>
      <td class="label">备注</td>
      <td colspan="3" class="m46"></td>
    </tr>
  </table>

  <div class="watermark">粉笔</div>
</body>
</html>
