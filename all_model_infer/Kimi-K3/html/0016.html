<div class="page">
  <div class="statusbar">
    <span class="left"><span class="hd">HD</span><span class="sig"><i></i><i></i><i></i><i></i></span><span class="wifi"></span></span>

  <div class="tagrow">
    <span class="num5">5</span>
    <span class="tagtitle">月经来潮需停药</span>
  </div>

  <p>药物推迟月经可能会失败，服药过程中如月经来潮需停药。</p>

  <div class="bigsection">
    <span class="big2">2<span class="dot">.</span></span>
    <span class="subtitle">缓解痛经</span>
  </div>

  <p>如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。</p>

  <div class="plan">
    <span class="label">常用方案</span><span class="chev"></span>
  </div>

  <p>痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。</p>

  <p>以下三种方法，选其中一种方法即可：</p>

  <div class="list">
    <div class="item">1.布洛芬&nbsp; 首剂 800 mg，之后根据需要 400～800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。</div>
    <div class="item">2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。</div>
  </div>
</div>
