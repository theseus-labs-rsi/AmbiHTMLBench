<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五大学科竞赛国家集训队名单</title>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    background:#e9eef0;
    font-family:"STKaiti","KaiTi","楷体",serif;
  }
  .page{
    position:relative;
    width:560px;
    margin:0 auto;
    padding:26px 26px 30px 38px;
    background-color:#ffffff;
    background-image:
      linear-gradient(#cfe3ea 1px, transparent 1px),
      linear-gradient(90deg,#cfe3ea 1px, transparent 1px);
    background-size:23px 23px;
    overflow:hidden;
  }
  /* loose-leaf holes on the left edge */
  .page::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:32px;
    background-image:radial-gradient(circle at 16px 24px, #ffffff 0 5px, #c3cbce 6px, transparent 7px);
    background-size:32px 80px;
    background-repeat:repeat-y;
    pointer-events:none;
  }
  h1.title{
    margin:0 0 14px 0;
    text-align:center;
    color:#45408f;
    font-size:31px;
    letter-spacing:3px;
    font-weight:700;
    text-shadow:1px 1px 0 #c7c2e2;
  }
  .redwrap{
    color:#ef4f70;
    font-size:23px;
    font-weight:700;
    line-height:2.02;
    letter-spacing:1px;
  }
  .redwrap p{ margin:0; }
  .note{
    float:right;
    width:160px;
    margin:2px 0 10px 16px;
    padding:14px 14px 12px 16px;
    background:linear-gradient(#fff6ad,#fdf0a0);
    color:#222;
    font-family:"STKaiti","KaiTi","楷体",serif;
    font-size:22px;
    line-height:1.55;
    font-weight:700;
    box-shadow:5px 6px 5px rgba(60,60,40,.30);
    transform:rotate(-1.2deg);
  }
  .note div{ white-space:nowrap; }
  table.grid{
    clear:both;
    border-collapse:collapse;
    width:470px;
    margin:26px 0 0 14px;
    table-layout:fixed;
    font-family:"Microsoft YaHei","微软雅黑",sans-serif;
    font-size:17px;
    color:#3f5149;
    border:2px solid #9aa07d;
  }
  table.grid col.c1{width:96px;}
  table.grid col.c2{width:96px;}
  table.grid col.c3{width:96px;}
  table.grid col.c4{width:96px;}
  table.grid col.c5{width:86px;}
  table.grid th, table.grid td{
    border:1px solid #d7d7c8;
    text-align:center;
    padding:6px 4px;
    height:34px;
    font-weight:400;
  }
  table.grid thead th{
    background:#abbd60;
    color:#ffffff;
    font-size:18px;
    border-color:#9aa95a;
  }
  table.grid td{ background:rgba(255,255,255,.55); }
  table.grid td.sub{ }
</style>
</head>
<body>
<div class="page">
  <h1 class="title">五大学科竞赛国家集训队名单</h1>

  <div class="redwrap">
    <div class="note">
      <div>生竞67人</div>
      <div>数竞64人</div>
      <div>化竞47人</div>
      <div>物竞43人</div>
    </div>
    <p>2023年进入国际五项<br>
    学科奥赛国家集训队<br>
    符合保送生资格的总<br>
    人数为274人。其中<br>
    生物学科人数最多<br>
    为67人；其次是数学学科，为64<br>
    人信息学学科有53人；化学学科<br>
    有47人；物理学科人数最少，为<br>
    43人！</p>
  </div>

  <table class="grid">
    <colgroup>
      <col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5">
    </colgroup>
    <thead>
      <tr>
        <th>学科</th><th>2023年</th><th>2022年</th><th>2021年</th><th>小计</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>数学</td><td>19</td><td>32</td><td>13</td><td class="sub">64</td></tr>
      <tr><td>化学</td><td>47</td><td>&nbsp;</td><td>&nbsp;</td><td class="sub">47</td></tr>
      <tr><td>物理</td><td>37</td><td>6</td><td>&nbsp;</td><td class="sub">43</td></tr>
      <tr><td>生物</td><td>58</td><td>9</td><td>&nbsp;</td><td class="sub">67</td></tr>
      <tr><td>信息学</td><td>34</td><td>13</td><td>&nbsp;</td><td class="sub">53</td></tr>
      <tr><td>合计</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td class="sub">274</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
