<!DOCTYPE html>
<html>
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钩针工具选择指南</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
    background: #e9e9e9;
    color: #333;
    padding: 0;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #fff;
  }
  .title-band {
    background: #5f7d70;
    color: #fff;
    text-align: center;
    padding: 18px 10px 14px 10px;
  }
  .title-band h1 {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .title-band .sub {
    margin-top: 8px;
    font-size: 15px;
    color: #e6e6e6;
    letter-spacing: 1px;
  }
  table.guide {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: #fff;
  }
  table.guide col.c1 { width: 16.5%; }
  table.guide col.c2 { width: 40.5%; }
  table.guide col.c3 { width: 25%; }
  table.guide col.c4 { width: 18%; }
  table.guide thead th {
    background: #5f7d70;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    padding: 13px 4px;
    border-right: 3px solid #fff;
    letter-spacing: 1px;
  }
  table.guide thead th:last-child { border-right: none; }
  table.guide tbody td {
    background: #fff;
    vertical-align: middle;
    padding: 18px 10px;
    border-bottom: 1px solid #e3e3e3;
    font-size: 13.5px;
    line-height: 1.55;
  }
  td.tool {
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    color: #2b2b2b;
    border-right: 1px solid #efefef;
  }
  td.tool .tag {
    color: #c98a4b;
    font-weight: 700;
    font-size: 13px;
  }
  td.use {
    color: #333;
    border-right: 1px solid #efefef;
  }
  td.advice {
    text-align: center;
    color: #333;
    font-size: 13.5px;
    border-right: 1px solid #efefef;
  }
  td.pic {
    text-align: center;
    padding: 10px 6px;
  }
  .placeholder {
    display: inline-block;
    border: 1px dashed #bbb;
    background: #fafafa;
    color: #999;
    font-size: 11px;
    text-align: center;
    vertical-align: middle;
  }
  .ph-hooks { width: 78px; height: 42px; line-height: 42px; }
  .ph-yarn  { width: 80px; height: 48px; line-height: 48px; }
  .ph-scis  { width: 58px; height: 62px; line-height: 62px; }
  .ph-needle{ width: 76px; height: 46px; line-height: 46px; }
</style>
</head>
<body>
<div class="page">
  <div class="title-band">
    <h1>钩针工具选择指南</h1>
    <div class="sub">——only手作集——</div>
  </div>
  <table class="guide">
    <colgroup>
      <col class="c1"><col class="c2"><col class="c3"><col class="c4">
    </colgroup>
    <thead>
      <tr>
        <th>工具</th>
        <th>用途</th>
        <th>初学者建议</th>
        <th>实物图</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="tool">钩针<br><span class="tag">(必备)</span></td>
        <td class="use">钩针是钩针编织的必备工具，有多种尺寸与规格，具体如何选择可参考《钩针毛线对照表》、《如何选择钩针和毛线》</td>
        <td class="advice">3mm左右的钩针最实用</td>
        <td class="pic"><div class="placeholder ph-hooks">[实物图: 彩色钩针]</div></td>
      </tr>
      <tr>
        <td class="tool">毛线<br><span class="tag">(必备)</span></td>
        <td class="use">毛线种类很多，新手建议选择股数较少的，可减少失误次数。具体如何选择参考《如何选择钩针和毛线》</td>
        <td class="advice">中粗的宝宝棉/牛奶棉</td>
        <td class="pic"><div class="placeholder ph-yarn">[实物图: 毛线篮]</div></td>
      </tr>
      <tr>
        <td class="tool">剪刀<br><span class="tag">(必备)</span></td>
        <td class="use">剪断编织过程中的编织线</td>
        <td class="advice">必备</td>
        <td class="pic"><div class="placeholder ph-scis">[实物图: 剪刀]</div></td>
      </tr>
      <tr>
        <td class="tool">缝合针</td>
        <td class="use">缝合、修补和连接编织面料</td>
        <td class="advice">非必须</td>
        <td class="pic"><div class="placeholder ph-needle">[实物图: 缝合针]</div></td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
