<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 2025年2月11日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Noto Serif SC", "SimSun", "Songti SC", serif;
            font-size: 14px;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .newspaper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Header */
        .header {
            display: flex;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-left {
            flex: 1;
            display: flex;
            align-items: center;
        }
        .masthead {
            font-family: "Noto Serif SC", "KaiTi", "STKaiti", serif;
            font-size: 72px;
            font-weight: bold;
            color: #c00;
            letter-spacing: 8px;
            line-height: 1;
        }
        .masthead-pinyin {
            font-size: 16px;
            letter-spacing: 6px;
            color: #c00;
            margin-top: 5px;
        }
        .header-center {
            width: 120px;
            text-align: center;
            border: 2px solid #000;
            padding: 10px;
            margin: 0 20px;
        }
        .date-box {
            font-size: 14px;
            font-weight: bold;
        }
        .header-right {
            flex: 1;
            text-align: right;
        }
        .header-right h1 {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
        }
        /* Main content grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        /* Left column articles */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Right column articles */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Article styling */
        .article {
            margin-bottom: 15px;
        }
        .article-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        .article-title.large {
            font-size: 28px;
        }
        .article-subtitle {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .article-meta {
            font-size: 12px;
            color: #333;
            margin-bottom: 8px;
        }
        .article-body {
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
        }
        .article-body p {
            text-indent: 2em;
            margin-bottom: 8px;
        }
        /* Vertical text for sidebar */
        .vertical-sidebar {
            writing-mode: vertical-rl;
            position: absolute;
            left: 10px;
            top: 200px;
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #000;
            height: 600px;
        }
        /* Special layouts */
        .top-news {
            grid-column: 1 / -1;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .two-col-article {
            column-count: 2;
            column-gap: 20px;
        }
        /* Image placeholder */
        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 1px solid #999;
        }
        .image-placeholder span {
            color: #666;
            font-size: 14px;
        }
        /* Bottom section */
        .bottom-section {
            margin-top: 20px;
            border-top: 2px solid #000;
            padding-top: 15px;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        /* Small text */
        .small-text {
            font-size: 12px;
            line-height: 1.6;
        }
        .caption {
            font-size: 11px;
            color: #333;
            margin-top: 5px;
        }
        /* Box styling */
        .boxed {
            border: 1px solid #000;
            padding: 10px;
            margin: 10px 0;
        }
        .highlight-box {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
        }
        /* Flex layout for side-by-side */
        .flex-row {
            display: flex;
            gap: 20px;
        }
        .flex-col {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div>
                    <div class="masthead">人民日报</div>
                    <div class="masthead-pinyin">RENMIN RIBAO</div>
                    <div style="font-size: 12px; margin-top: 5px;">人民网网址：http://www.people.com.cn</div>
                </div>
            </div>
            <div class="header-center">
                <div class="date-box">2025年2月<br>11<br>星期二<br>乙巳年正月十四</div>
                <div style="font-size: 11px; margin-top: 5px;">人民日报社出版<br>国内统一刊号<br>CN11-0065<br>代号1-1<br>第29739期<br>今日20版</div>
            </div>
            <div class="header-right">
                <h1>习近平就</body></html>
