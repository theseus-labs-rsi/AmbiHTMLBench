<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>话题、主题意义、主题的联系与区别</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e9e9e9;
    font-family: "Microsoft YaHei", "SimSun", "PingFang SC", sans-serif;
    color: #222;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    background: #efefef;
    padding: 18px 14px 26px 14px;
    position: relative;
  }
  .title-box {
    border: 2px solid #333;
    background: #fff;
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.35;
    padding: 8px 10px;
    margin: 0 0 14px 0;
  }
  table.cmp {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 14px;
  }
  table.cmp th, table.cmp td {
    border: 2px solid #fff;
    padding: 7px 6px;
    vertical-align: middle;
    text-align: left;
  }
  table.cmp thead th {
    background: #b3b31f;
    color: #fff;
    font-weight: 700;
    text-align: center;
    font-size: 15px;
  }
  table.cmp thead th.diag {
    position: relative;
    text-align: left;
    background:
      linear-gradient(to bottom right,
        transparent calc(50% - 1px), #e6e6e6 calc(50% - 1px),
        #e6e6e6 calc(50% + 1px), transparent calc(50% + 1px)),
      #b3b31f;
    height: 46px;
  }
  .diag .t { position: absolute; top: 3px; right: 14px; font-size: 13px; }
  .diag .b { position: absolute; bottom: 3px; left: 8px; font-size: 13px; }
  table.cmp tbody th {
    background: #b3b31f;
    color: #fff;
    font-weight: 700;
    width: 78px;
    text-align: left;
  }
  table.cmp tbody td {
    background: #fff;
    color: #222;
    font-weight: 600;
  }
  .slogan {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    font-style: italic;
    color: #f6c90e;
    line-height: 1.35;
    margin: 26px 0 18px 0;
    text-shadow:
      -2px -2px 0 #222, 2px -2px 0 #222,
      -2px 2px 0 #222, 2px 2px 0 #222,
      0 3px 0 #222;
    letter-spacing: 1px;
  }
  .title-box2 {
    border: 2px solid #333;
    background: #fff;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    padding: 8px 10px;
    margin: 0 26px 26px 26px;
  }
  .steps {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 190px;
    margin: 0 0 8px 0;
    padding-right: 26px;
  }
  .step {
    position: relative;
    width: 31%;
    text-align: center;
  }
  .step .cap {
    background: #fff;
    border: 1px solid #d8d8d8;
    border-bottom: none;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    padding: 8px 4px;
  }
  .step .body {
    color: #fff;
    font-weight: 700;
    padding: 8px 4px 10px 4px;
    line-height: 1.25;
  }
  .step .body .name { font-size: 16px; display: block; }
  .step .body .formula { font-size: 11px; font-weight: 600; display: block; margin-top: 3px; }
  .step.s1 { margin-bottom: 0; }
  .step.s1 .body { background: #2f6f9f; height: 58px; }
  .step.s2 { margin-bottom: 34px; }
  .step.s2 .body { background: #f3c300; height: 58px; }
  .step.s3 { margin-bottom: 68px; }
  .step.s3 .body { background: #aaaa1d; height: 58px; text-align: right; padding-right: 8px; }
  .step.s3 .body .formula { text-align: left; font-size: 10px; }
  .arrow {
    position: absolute;
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
  }
  .arrow.up { border-bottom: 22px solid; }
  .a-yellow {
    left: 50%;
    top: -30px;
    transform: translateX(30px) rotate(38deg);
    border-bottom-color: #f3c300;
  }
  .a-olive {
    left: 50%;
    top: -30px;
    transform: translateX(30px) rotate(38deg);
    border-bottom-color: #aaaa1d;
  }
  .big-blue {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 0; height: 0;
    border-top: 34px solid transparent;
    border-bottom: 34px solid transparent;
    border-left: 26px solid #2f6f9f;
    transform: rotate(-90deg);
    transform-origin: center;
  }
  .cite {
    text-align: right;
    font-size: 11px;
    color: #555;
    margin-top: 6px;
    padding-right: 34px;
  }
  .pageno {
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #2f9be8;
    color: #fff;
    font-size: 11px;
    text-align: center;
    line-height: 18px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="title-box">话题、主题意义、主题的联系与区别<br>（读者视角）</div>

  <table class="cmp">
    <thead>
      <tr>
        <th class="diag"><span class="t">概念</span><span class="b">维度</span></th>
        <th>话题</th>
        <th>主题意义</th>
        <th>主题</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>意义特征</th>
        <td>具体</td>
        <td>界于二者之间</td>
        <td>抽象</td>
      </tr>
      <tr>
        <th>表达方式</th>
        <td>直接</td>
        <td>蕴含</td>
        <td>拓展</td>
      </tr>
      <tr>
        <th>核心意义</th>
        <td>语篇讨论的中心</td>
        <td>语篇的寓意</td>
        <td>语篇寓意所属的范畴</td>
      </tr>
      <tr>
        <th>本质特征</th>
        <td>特定性</td>
        <td>由语篇内容延伸的普适性（去细节的）</td>
        <td>普遍性</td>
      </tr>
    </tbody>
  </table>

  <div class="slogan">话题，主题意义，主题<br>与学习活动的层次息息相关</div>

  <div class="title-box2">话题、主题意义、主题的联系与区别<br>（学习视角）</div>

  <div class="steps">
    <div class="step s1">
      <div class="cap">基于语篇的学习<br>为主</div>
      <div class="body"><span class="name">话题</span><span class="formula">What+How</span></div>
    </div>
    <div class="step s2">
      <div class="arrow up a-yellow"></div>
      <div class="cap">深入语篇的学习<br>为主</div>
      <div class="body"><span class="name">主题意义</span><span class="formula">Why+How</span></div>
    </div>
    <div class="step s3">
      <div class="arrow up a-olive"></div>
      <div class="cap">超越语篇的学习<br>为主</div>
      <div class="body"><span class="name">主题</span><span class="formula">What+Why+How+So what (else)</span></div>
    </div>
    <div class="big-blue"></div>
  </div>

  <div class="cite">（葛炳芳，2022：出版中）</div>
  <div class="pageno">6</div>
</div>
</body>
</html>
