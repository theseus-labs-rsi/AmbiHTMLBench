<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精酿、原浆、鲜啤、生啤、扎啤、干啤、冰啤的区别</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#e9ebf8;}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    color:#22264d;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    position:relative;
    width:540px;
    margin:0 auto;
    min-height:720px;
    padding:34px 26px 40px;
    background:linear-gradient(180deg,#f2f3fc 0%,#e7e9f8 55%,#e3e6f6 100%);
    overflow:hidden;
  }
  /* decorative background shapes */
  .deco{position:absolute;border-radius:50%;pointer-events:none;}
  .deco.tr1{width:120px;height:120px;right:-34px;top:-30px;background:radial-gradient(circle at 35% 30%,#cfc6f4,#b7a9ec 60%,#a594e6);}
  .deco.tr2{width:58px;height:58px;right:60px;top:52px;background:radial-gradient(circle at 35% 30%,#e6e0fb,#c8baf0);}
  .deco.star{right:26px;top:96px;width:26px;height:26px;border-radius:0;background:transparent;
     clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
     background:#8f7fe0;box-shadow:0 0 0 4px rgba(143,127,224,.18);}
  .deco.bl1{width:170px;height:170px;left:-70px;bottom:-70px;background:radial-gradient(circle at 60% 40%,rgba(201,192,240,.9),rgba(183,169,236,.55) 55%,rgba(183,169,236,0) 72%);}
  .deco.bl2{width:40px;height:40px;left:150px;bottom:96px;background:radial-gradient(circle at 35% 30%,#d9d2f7,#bdb0ec);opacity:.7;}

  h1.title{
    position:relative;
    font-size:33px;line-height:1.35;font-weight:800;letter-spacing:1px;
    color:#232a56;
    margin:6px 4px 22px;
    text-shadow:0 1px 0 #fff;
  }
  .card{
    position:relative;
    background:#ffffff;
    border-radius:18px;
    padding:26px 22px 30px 20px;
    box-shadow:0 10px 26px rgba(80,86,160,.16), 0 2px 0 rgba(255,255,255,.9) inset;
  }

  .group{display:flex;align-items:center;}
  .group + .group{margin-top:26px;}
  .leftnode{flex:0 0 128px;display:flex;justify-content:center;}
  .wires{flex:0 0 86px;}
  .branches{flex:1;display:flex;flex-direction:column;justify-content:space-between;}
  .branch{display:flex;align-items:center;}
  .leaf{margin-left:16px;font-weight:800;color:#252b57;font-size:15px;white-space:nowrap;}

  /* hand-painted stroke label */
  .stroke{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
    padding:9px 16px;white-space:nowrap;
    border-radius:46% 8% 50% 10% / 62% 22% 66% 26%;
    transform:rotate(-1.2deg);
    box-shadow:0 2px 0 rgba(0,0,0,.06), inset 0 -3px 0 rgba(0,0,0,.10), inset 0 3px 0 rgba(255,255,255,.16);
  }
  .stroke::before,.stroke::after{content:"";position:absolute;left:6%;right:6%;height:6px;border-radius:50%;background:inherit;filter:brightness(1.02);}
  .stroke::before{top:-4px;transform:rotate(1deg);}
  .stroke::after{bottom:-4px;transform:rotate(-1deg);filter:brightness(.96);}
  .red{background:#ef3a55;}
  .orange{background:#f4ac3c;}
  .yellow{background:#f6d42e;color:#3a3410;}
  .green{background:#17c39a;}
  .blue{background:#6f79e8;}
  .dark{background:#1b1e3a;}
  .stroke.big{font-size:16px;padding:12px 20px;}
  .stroke.dark{border-radius:44% 10% 48% 12% / 58% 26% 62% 30%;}

  .note{
    flex:1;margin-left:14px;
    background:#fdf0f5;
    border-radius:6px;
    padding:10px 12px;
    font-size:12.5px;line-height:1.75;color:#3a3f66;font-weight:600;
    text-align:justify;
  }
  .g1 .wires{height:318px;}
  .g1 .branches{height:318px;}
  .g2 .wires{height:150px;}
  .g2 .branches{height:150px;}
  .g3 .wires{height:270px;}
  .g3 .branches{height:270px;}
  .g3 .branch{align-items:center;}
  .g3 .stroke{align-self:center;}
</style>
</head>
<body>
<div class="page">
  <div class="deco tr1"></div>
  <div class="deco tr2"></div>
  <div class="deco star"></div>
  <div class="deco bl1"></div>
  <div class="deco bl2"></div>

  <h1 class="title">精酿、原浆、鲜啤、生啤、<br>扎啤、干啤、冰啤的区别</h1>

  <div class="card">

    <div class="group g1">
      <div class="leftnode"><span class="stroke dark big">啤酒原浆</span></div>
      <svg class="wires" viewBox="0 0 86 318" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,159 C42,159 42,31 86,31"  fill="none" stroke="#ef3a55" stroke-width="2"/>
        <path d="M0,159 C42,159 42,95 86,95"  fill="none" stroke="#f4ac3c" stroke-width="2"/>
        <path d="M0,159 C42,159 42,159 86,159" fill="none" stroke="#f6d42e" stroke-width="2"/>
        <path d="M0,159 C42,159 42,223 86,223" fill="none" stroke="#17c39a" stroke-width="2"/>
        <path d="M0,159 C42,159 42,287 86,287" fill="none" stroke="#6f79e8" stroke-width="2"/>
      </svg>
      <div class="branches">
        <div class="branch"><span class="stroke red">不杀菌+不滤清</span><span class="leaf">原浆啤酒</span></div>
        <div class="branch"><span class="stroke orange">不杀菌+滤清</span><span class="leaf">鲜啤</span></div>
        <div class="branch"><span class="stroke yellow">不杀菌+滤清+膜过滤除菌(非高温)</span><span class="leaf">生啤</span></div>
        <div class="branch"><span class="stroke green">桶装鲜啤+二氧化碳+冰镇</span><span class="leaf">扎啤</span></div>
        <div class="branch"><span class="stroke blue">滤清+巴氏杀菌或瞬时高温杀菌</span><span class="leaf">熟啤</span></div>
      </div>
    </div>

    <div class="group g2">
      <div class="leftnode"><span class="stroke dark big">啤酒</span></div>
      <svg class="wires" viewBox="0 0 86 150" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,75 C44,75 44,37 86,37"  fill="none" stroke="#ef3a55" stroke-width="2"/>
        <path d="M0,75 C44,75 44,113 86,113" fill="none" stroke="#f4ac3c" stroke-width="2"/>
      </svg>
      <div class="branches">
        <div class="branch"><span class="stroke red">精酿啤酒</span><span class="leaf">追求独特的口味</span></div>
        <div class="branch"><span class="stroke orange">工业啤酒</span><span class="leaf">追求工业标准化</span></div>
      </div>
    </div>

    <div class="group g3">
      <div class="leftnode"><span class="stroke dark big">按工艺区分</span></div>
      <svg class="wires" viewBox="0 0 86 270" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,135 C44,135 44,68 86,68"   fill="none" stroke="#ef3a55" stroke-width="2"/>
        <path d="M0,135 C44,135 44,206 86,206" fill="none" stroke="#f4ac3c" stroke-width="2"/>
      </svg>
      <div class="branches">
        <div class="branch">
          <span class="stroke red">冰啤</span>
          <div class="note">先把啤酒的温度降到冰点，使啤酒因低温而产生冷浑浊，然后再进行过滤使啤酒变清。和普通啤酒最大的不同之处在于降温的冰晶化处理，使酒色更亮丽，口感更清爽醇厚，酒精度数也有一定提高。</div>
        </div>
        <div class="branch">
          <span class="stroke orange">干啤</span>
          <div class="note">干啤采用了特殊的酵母进行发酵酿制，使啤酒中所含的糖分完全转化为酒精，比普通啤酒更低，让干啤喝起来的口感干爽而不甜，清爽而无余味。</div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
