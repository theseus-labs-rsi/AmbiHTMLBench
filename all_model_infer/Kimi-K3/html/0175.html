<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 - 2025年3月10日</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            font-size: 14px;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .newspaper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #c00;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header-left {
            flex: 1;
        }
        .paper-title {
            font-size: 72px;
            font-weight: bold;
            color: #c00;
            line-height: 1;
            letter-spacing: 8px;
        }
        .paper-subtitle {
            font-size: 14px;
            color: #c00;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        .paper-url {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .header-center {
            text-align: center;
            padding: 0 20px;
        }
        .date-box {
            border: 2px solid #333;
            padding: 8px 15px;
            display: inline-block;
        }
        .date-box .year-month {
            font-size: 14px;
            font-weight: bold;
        }
        .date-box .day {
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }
        .date-box .weekday {
            font-size: 12px;
        }
        .date-box .lunar {
            font-size: 11px;
            color: #666;
        }
        .header-right {
            text-align: right;
            font-size: 12px;
            line-height: 1.8;
        }
        /* Main layout */
        .main-content {
            display: flex;
            gap: 15px;
        }
        .left-column {
            width: 65%;
        }
        .right-column {
            width: 35%;
        }
        /* Article styling */
        .article {
            margin-bottom: 15px;
        }
        .article-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .article-title.large {
            font-size: 36px;
            line-height: 1.2;
        }
        .article-subtitle {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .article-meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .article-body {
            font-size: 13px;
            line-height: 1.8;
            text-align: justify;
        }
        .article-body p {
            text-indent: 2em;
            margin-bottom: 8px;
        }
        /* Special labels boxes */
        .label-box {
            display: inline-block;
            border: 1px solid #333;
            padding: 2px 8px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .label-red {
            background: #c00;
            color: #fff;
        }
        .label-orange {
            background: #f60;
            color: #fff;
        }
        /* Vertical text for special labels */
        .vertical-label {
            writing-mode: vertical-rl;
            position: absolute;
            right: -25px;
            top: 0;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
        }
        /* Two column layout within left */
        .two-col-inner {
            display: flex;
            gap: 15px;
        }
        .two-col-inner > div {
            flex: 1;
        }
        /* Right column articles */
        .right-article {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .right-article:last-child {
            border-bottom: none;
        }
        .right-article .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .right-article .title.large {
            font-size: 24px;
        }
        .right-article .subtitle {
            font-size: 13px;
            color: #333;
            margin-bottom: 5px;
        }
        .right-article .body {
            font-size: 12px;
            line-height: 1.7;
        }
        .right-article .body p {
            text-indent: 2em;
            margin-bottom: 6px;
        }
        /* Quote box */
        .quote-box {
            border-left: 4px solid #c00;
            padding-left: 15px;
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
        }
        /* Section header */
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .section-tag {
            background: #c00;
            color: #fff;
            padding: 3px 10px;
            font-size: 12px;
            margin-right: 10px;
        }
        .section-name {
            font-size: 14px;
            font-weight: bold;
        }
        /* Image placeholder */
        .placeholder {
            background: #f0f0f0;
            border: 1px dashed #999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 12px;
            margin: 10px 0;
        }
        /* Small article list */
        .small-articles {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .small-article {
            width: calc(50% - 5px);
            font-size: 12px;
        }
        .small-article .stitle {
            font-weight: bold;
            margin-bottom: 3px;
        }
        /* Bottom section */
        .bottom-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #333;
        }
        /* Inline photo */
        .inline-photo {
            float: right;
            width: 200px;
            height: 150px;
            margin-left: 15px;
            margin-bottom: 10px;
        }
        /* Clearfix */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        /* Red title */
        .red-title {
            color: #c00;
        }
        /* Editor note */
        .editor-note {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        /* Horizontal line */
        .hline {
            border: none;
            border-top: 1px solid #333;
            margin: 10px 0;
        }
        .hline-thick {
            border: none;
            border-top: 3px solid #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="paper-title">人民日报</div>
                <div class="paper-subtitle">RENMIN RIBAO</div>
                <div class="paper-url">人民网网址：http://www.people.com.cn</div>
            </div>
            <div class="header-center">
                <div class="date-box">
                    <div class="year-month">2025年3月</div>
                    <div class="day">10</div>
                    <div class="weekday">星期一</div>
                    <div class="lunar">乙巳年二月十一</div>
                </div>
            </div>
            <div class="header-right">
                <div>人民日报出版社</div>
                <div>国内统一连续出版物号</div>
                <div>CN11—0001</div>
                <div>代号1—1</div>
                <div>第28920期</div>
                <div>今日20版</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Column (65%) -->
            <div class="left-column">
                <!-- Top section with labels and main headline -->
                <div style="display: flex; margin-bottom: 15px;">
                    <div style="width: 80%;">
                        <div style="margin-bottom: 10px;">
                            <span class="label-box label-red">头条</span>
                            <span class="label-box label-orange">评论</span>
                        </div>
                        <div class="article-title large">坚持教育科技人才一起抓</div>
                        <div style="font-size: 13px; color: #666; margin-top: 8px;">——代表委员议国是</div>
                    </div>
                    <div style="width: 20%; position: relative;">
                        <div style="writing-mode: vertical-rl; font-size: 16px; font-weight: bold; letter-spacing: 4px; height: 200px;">
                            代表委员议国是
                        </div>
                    </div>
                </div>

                <!-- Two column inner layout -->
                <div class="two-col-inner">
                    <div>
                        <!-- Article 1 -->
                        <div class="article">
                            <div class="section-header">
                                <span class="section-tag">教育</span>
                                <span class="section-name">一段跨越千里的教育情缘</span>
                            </div>
                            <div class="article-body">
                                <p>不久前</body></html>
