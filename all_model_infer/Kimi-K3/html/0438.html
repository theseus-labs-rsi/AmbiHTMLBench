<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习题与手写回答</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(96deg, rgba(120,78,32,.10) 0 3px, rgba(255,255,255,0) 3px 9px),
      linear-gradient(180deg, #bd904e 0%, #d3b077 46%, #c9a368 100%);
    font-family: "SimSun", "Songti SC", "STSong", serif;
  }
  .sheet {
    position: relative;
    width: min(94%, 980px);
    margin: 24vh auto 0;
    background: #ffffff;
    transform: rotate(-1.1deg);
    transform-origin: 50% 0;
    box-shadow: 0 10px 22px rgba(60, 40, 10, .28), 0 2px 6px rgba(0,0,0,.18);
    padding: 30px 70px 70px 34px;
  }
  .q-row {
    display: flex;
    align-items: flex-start;
    color: #3a3a3a;
  }
  .q-num {
    font-size: 27px;
    font-weight: 700;
    line-height: 1.1;
    margin: 2px 14px 0 6px;
    letter-spacing: 1px;
  }
  .q-text {
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: .5px;
    padding-top: 7px;
  }
  .q-sub {
    margin: 2px 0 0 48px;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: .5px;
    color: #3a3a3a;
  }
  .answer {
    margin: 20px 26px 0 2px;
    padding: 0 10px;
    border-left: 2px dotted #c6c6c6;
    border-right: 2px dotted #c6c6c6;
  }
  .hand {
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "楷体", "TW-Kai", cursive;
    font-size: 31px;
    line-height: 1.46;
    color: #151515;
    white-space: nowrap;
    padding: 1px 2px 0;
    border-bottom: 2px dotted #c2c2c2;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="q-row">
      <span class="q-num">26</span>
      <span class="q-text">你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</span>
    </div>
    <div class="q-sub">她看到了什么呢？</div>

    <div class="answer">
      <div class="hand">我蹲下来，“这根肋骨让你感</div>
      <div class="hand">到不舒服吗？”</div>
      <div class="hand">展览台上是一尊白玉莹莹的肋</div>
      <div class="hand">骨，下面的文字介绍引用了夏娃</div>
      <div class="hand">的来历，说女人都是由肋骨所化。</div>
    </div>
  </div>
</body>
</html>
