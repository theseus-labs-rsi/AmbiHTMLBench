<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语C术语解释</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "Heiti SC", sans-serif;
            color: #333;
            line-height: 1.6;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #fff;
        }
        .entry {
            margin-bottom: 1.2em;
        }
        .term {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 0.2em;
        }
        .definition {
            margin: 0;
            text-indent: 0;
        }
    </style>
</head>
<body>

    <div class="entry">
        <div class="term">审核：</div>
        <p class="definition">指进入语c群时，被群主审看人设、皮气等行为。</p>
    </div>

    <div class="entry">
        <div class="term">新人：</div>
        <p class="definition">指初入某个圈子的人。</p>
    </div>

    <div class="entry">
        <div class="term">纯白：</div>
        <p class="definition">完全不了解语c的人或刚接触语c。</p>
    </div>

    <div class="entry">
        <div class="term">小白：</div>
        <p class="definition">指出入语c圈或对语c一无所知的人。</p>
    </div>

    <div class="entry">
        <div class="term">小窗：</div>
        <p class="definition">指聊天会话的窗口（与QQ的私聊差不多）</p>
    </div>

    <div class="entry">
        <div class="term">隔壁：</div>
        <p class="definition">指代另一个地方（隔壁群，隔壁平台）</p>
    </div>

    <div class="entry">
        <div class="term">首页：</div>
        <p class="definition">在语c平台中，上皮发言互动的地方。</p>
    </div>

    <div class="entry">
        <div class="term">水区：</div>
        <p class="definition">在语c平台中，皮下发言探讨问题或闲聊的地方。</p>
    </div>

    <div class="entry">
        <div class="term">扩列：</div>
        <p class="definition">扩充列表，即加好友的意思。</p>
    </div>

    <div class="entry">
        <div class="term">掌控：</div>
        <p class="definition">指开戏文字超过七百一段的人。</p>
    </div>

    <div class="entry">
        <div class="term">字控：</div>
        <p class="definition">夸张手法，指一次开几个字为一段的人。</p>
    </div>

    <div class="entry">
        <div class="term">句控：</div>
        <p class="definition">指开戏只开一行～三行为一段的人。</p>
    </div>

</body>
</html>
