<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三大核心参数解读</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#e9e9e9;}
  body{overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;color:#111;}
  .page{position:relative;width:540px;min-height:720px;margin:0 auto;background:#ffffff;}

  /* spiral binding holes */
  .holes{display:flex;justify-content:space-between;align-items:center;margin:0 -11px;padding:13px 0 0;}
  .hole{width:23px;height:23px;border:2px solid #a6a6a6;border-radius:50%;background:#fff;
        box-shadow:inset 0 1px 2px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.08);flex:0 0 auto;}

  /* left vertical banner */
  .side-banner{position:absolute;left:0;top:72px;width:44px;height:110px;
    background:linear-gradient(180deg,#8a2430 0%,#4a1019 55%,#2c0a12 100%);
    color:#fff;writing-mode:vertical-rl;text-orientation:upright;
    display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:900;letter-spacing:5px;
    border-radius:0 5px 5px 0;box-shadow:2px 2px 7px rgba(0,0,0,.35);}
  .side-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:linear-gradient(180deg,#ff7a3c,#d23b2a 60%,#7a1a24);border-radius:0 5px 5px 0;}

  /* title */
  .title{text-align:center;margin-top:16px;}
  .title h1{margin:0;font-size:34px;font-weight:900;letter-spacing:2px;color:#111;}
  .title p{margin:13px 0 0;font-size:15px;color:#2b2b2b;letter-spacing:1px;}

  /* content rows */
  .row{display:flex;align-items:flex-start;margin:46px 40px 0;}
  .icon{flex:0 0 56px;width:56px;margin-right:22px;}
  .txt{flex:1;}
  .txt h3{margin:0 0 9px;font-size:20px;font-weight:900;color:#111;}
  .txt p{margin:0;font-size:16px;line-height:1.55;color:#111;}

  /* SD card icon */
  .sd{position:relative;width:52px;height:63px;border:4px solid #1d1d1d;border-radius:7px;background:#fff;}
  .sd::before{content:"";position:absolute;top:6px;left:9px;right:9px;height:11px;
    background:repeating-linear-gradient(90deg,#1d1d1d 0 3px,transparent 3px 8px);}
  .sd::after{content:"";position:absolute;left:9px;bottom:8px;width:21px;height:25px;
    border:3px solid #1d1d1d;border-radius:3px;background:#fff;}

  /* CPU icon */
  .cpu{position:relative;width:56px;height:56px;border:4px solid #1d1d1d;border-radius:6px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#1d1d1d;}
  .cpu::before,.cpu::after{content:"";position:absolute;top:7px;width:7px;height:42px;
    background:repeating-linear-gradient(180deg,#1d1d1d 0 4px,transparent 4px 12px);}
  .cpu::before{left:-11px;}
  .cpu::after{right:-11px;}

  /* 4K UHD icon */
  .uhd{width:52px;height:63px;border:4px solid #1d1d1d;border-radius:9px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1d1d1d;}
  .uhd .k{font-size:21px;font-weight:900;line-height:1;}
  .uhd .u{margin-top:4px;padding:2px 6px 3px;background:#1d1d1d;color:#fff;border-radius:4px;
    font-size:13px;font-weight:900;line-height:1;letter-spacing:1px;}
</style>
</head>
<body>
<div class="page">
  <div class="holes">
    <span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span>
    <span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span><span class="hole"></span>
  </div>

  <div class="side-banner">第三步</div>

  <div class="title">
    <h1>三大核心参数解读</h1>
    <p>内存/芯片/分辨率参数解读</p>
  </div>

  <div class="row">
    <div class="icon"><div class="sd"></div></div>
    <div class="txt">
      <h3>1.看内存</h3>
      <p>内存越大速度越快，小于8GB不建议购买。(画圈：<br>GB≠Gb,大GB是小Gb的8倍，尽量选择大GB)</p>
    </div>
  </div>

  <div class="row">
    <div class="icon"><div class="cpu">CPU</div></div>
    <div class="txt">
      <h3>2.看芯片</h3>
      <p>主流芯片A73和A53。追求性能玩游戏选A73，看<br>看电视想省电选A53。</p>
    </div>
  </div>

  <div class="row">
    <div class="icon"><div class="uhd"><span class="k">4K</span><span class="u">UHD</span></div></div>
    <div class="txt">
      <h3>3.看分辨率</h3>
      <p>分辨率越高越清晰。（目前电视基本都是超高清4K<br>也就是3840×2160的分辨率）</p>
    </div>
  </div>
</div>
</body>
</html>
