<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2017 校园艺术节</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#bcbcbc;}
  body{font-family:Georgia,"Times New Roman","SimSun",serif;}
  .poster{position:relative;width:720px;height:1080px;margin:22px auto;background:#f4efe6;overflow:hidden;box-shadow:0 0 0 1px #d8d3c8 inset;}
  /* decorative concentric-ring graphics (non-text) */
  figure.placeholder{position:absolute;margin:0;border-radius:50%;
    background:repeating-radial-gradient(circle at center,#1c2a6b 0 2.4px,rgba(28,42,107,0) 2.4px 8.2px);}
  figure.placeholder figcaption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .ring-tr{width:600px;height:600px;right:-280px;top:-260px;}
  .ring-bl{width:600px;height:600px;left:-247px;top:564px;}

  /* top-left header : year + two vertical columns */
  .head{position:absolute;left:58px;top:63px;z-index:6;}
  .digits{font-size:15px;letter-spacing:13px;color:#111;}
  .cols{margin-top:5px;display:flex;flex-direction:row-reverse;align-items:flex-start;}
  .cols .c{writing-mode:vertical-rl;text-orientation:mixed;color:#10255f;}
  .c.festival{font:700 27px/1 "SimSun",serif;letter-spacing:7px;height:205px;color:#111;}
  .c.motto{font:700 31px/1 "SimSun",serif;letter-spacing:5px;height:235px;margin-right:9px;color:#10255f;}

  /* left middle : artists (vertical columns, right-to-left) */
  .names{position:absolute;left:38px;top:382px;display:flex;flex-direction:row-reverse;align-items:flex-start;z-index:6;}
  .names .col{writing-mode:vertical-rl;text-orientation:mixed;margin-left:7px;color:#10255f;}
  .names .lat{font:700 31px/1 Georgia,"Times New Roman",serif;letter-spacing:1px;height:320px;}
  .names .cn{font:13px/1 "SimSun",serif;letter-spacing:3px;color:#111;}
  .names .cn.long{height:200px;}
  .names .cn.short{height:130px;padding-top:2px;}

  /* central large title with faded echoes trailing up-right */
  .title{position:absolute;left:0;right:0;top:120px;text-align:center;z-index:5;}
  .g{position:relative;height:152px;font:700 116px/1 "STSong","SimSun",serif;}
  .g span{position:absolute;top:0;left:50%;transform:translateX(-50%);font-style:normal;white-space:pre;}
  .g .main{color:#151515;z-index:3;}
  .g .echo{color:#dddbd2;z-index:1;}
  .g .e1{left:calc(50% + 16px);top:-24px;opacity:.95;}
  .g .e2{left:calc(50% + 34px);top:-50px;opacity:.55;}
  .g .e3{left:calc(50% + 54px);top:-78px;opacity:.30;}
  .g.arts{margin-left:6px;}
  .g.shu{margin-left:-22px;}
  .g.jie{margin-left:-2px;}

  /* right information column */
  .right{position:absolute;right:34px;top:330px;width:250px;z-index:6;color:#111;}
  .date{text-align:center;}
  .date .d1{font:300 54px/1 Georgia,"Times New Roman",serif;color:#10255f;letter-spacing:1px;}
  .date .d2{margin-top:8px;font:700 17px/1.1 Georgia,serif;letter-spacing:1px;}
  .date .d3{margin-top:5px;font:700 13px/1.2 Georgia,serif;}
  .slot{margin-top:34px;}
  .slot .hall{font:800 31px/1 Georgia,serif;letter-spacing:1px;}
  .slot .time{margin-top:4px;font:13px/1.3 Georgia,serif;text-align:right;letter-spacing:1px;}
  .slot .place{font:700 17px/1.35 "SimSun",serif;text-align:right;}
  .cta{margin-top:52px;text-align:left;}
  .cta .zh{display:inline-block;font:800 31px/1.2 "SimSun",serif;border-bottom:2px solid #111;padding-bottom:6px;letter-spacing:1px;}
  .cta .en{margin-top:8px;font:700 27px/1.22 Georgia,serif;}
  .cta .box{display:inline-block;margin-top:14px;border:1.6px solid #10255f;color:#10255f;font:700 15px/1.3 "SimSun",serif;padding:5px 7px;letter-spacing:1px;}
  .cta .en2{margin-top:7px;font:700 14.5px/1.35 Georgia,serif;}
</style>
</head>
<body>
<div class="poster">

  <figure class="placeholder ring-tr"><figcaption>[Diagram: concentric blue rings, cropped at top-right corner]</figcaption></figure>
  <figure class="placeholder ring-bl"><figcaption>[Diagram: concentric blue spiral rings, cropped at bottom-left]</figcaption></figure>

  <div class="head">
    <div class="digits">2017</div>
    <div class="cols">
      <div class="c festival">校园艺术节</div>
      <div class="c motto">无∞极∞限</div>
    </div>
  </div>

  <div class="names">
    <div class="col lat">Pascal&nbsp;Pons</div>
    <div class="col cn short">國際當代藝術大師</div>
    <div class="col lat">Steve&nbsp;Reich</div>
    <div class="col cn long">艺术设计教父经典作品震撼展出</div>
  </div>

  <div class="title" aria-label="艺术节">
    <div class="g arts">
      <span class="echo e3" aria-hidden="true">艺</span>
      <span class="echo e2" aria-hidden="true">艺</span>
      <span class="echo e1" aria-hidden="true">艺</span>
      <span class="main">艺</span>
    </div>
    <div class="g shu">
      <span class="echo e3" aria-hidden="true">术</span>
      <span class="echo e2" aria-hidden="true">术</span>
      <span class="echo e1" aria-hidden="true">术</span>
      <span class="main">术</span>
    </div>
    <div class="g jie">
      <span class="echo e3" aria-hidden="true">节</span>
      <span class="echo e2" aria-hidden="true">节</span>
      <span class="echo e1" aria-hidden="true">节</span>
      <span class="main">节</span>
    </div>
  </div>

  <div class="right">
    <div class="date">
      <div class="d1">07×31</div>
      <div class="d2">JULY × THIRTY</div>
      <div class="d3">〈 Music for 18 Musicians 〉</div>
    </div>

    <div class="slot">
      <div class="hall">B2/10</div>
      <div class="time">AM8:00</div>
      <div class="place">北京市<br>文化中心展馆</div>
    </div>

    <div class="slot">
      <div class="hall">B2/11</div>
      <div class="time">PM5:00</div>
      <div class="place">北京市<br>文化中心展馆</div>
    </div>

    <div class="cta">
      <span class="zh">期待你的挑战</span>
      <div class="en">Look forward to<br>your challenge</div>
      <span class="box">是困守原地，还是突破重生！</span>
      <div class="en2">To be stuck in the same place,<br>or to break out of rebirth!</div>
    </div>
  </div>

</div>
</body>
</html>
