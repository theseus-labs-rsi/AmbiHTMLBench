<!DOCTYPE html>
<html>
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#e9e9e9;}
  #stage{width:100%;display:flex;justify-content:center;overflow:hidden;}
  #poster{position:relative;width:1200px;height:2133px;background:#ffffff;flex:0 0 auto;transform-origin:top center;font-family:"Noto Serif SC","Songti SC","STSong",serif;color:#111;}
  .placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:#8a8a8a;font-size:22px;border:1px dashed #c7c7c7;background:rgba(0,0,0,0.015);}

  /* left vertical role circles */
  .roles{position:absolute;left:86px;top:124px;display:flex;flex-direction:column;align-items:center;}
  .role{width:98px;height:98px;border:2px solid #3a3a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;color:#111;margin-bottom:18px;line-height:1;}

  /* main vertical title */
  .title{position:absolute;left:204px;top:122px;writing-mode:vertical-rl;font-size:134px;line-height:1;letter-spacing:10px;font-weight:500;}
  .title .r{color:#d81e2c;}
  .title .b{color:#111;}

  .subvert{position:absolute;left:114px;top:890px;writing-mode:vertical-rl;font-size:34px;letter-spacing:9px;color:#1a1a1a;}

  /* top right logo + name */
  .logo{position:absolute;left:1052px;top:124px;width:68px;height:64px;}
  .brand{position:absolute;left:1038px;top:212px;width:96px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:33px;line-height:1.42;color:#111;}
  .brand .yi{padding-left:22px;}

  /* geometric decoration */
  .pinkdot{position:absolute;left:738px;top:531px;width:164px;height:164px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#e495b6,#cf5f8d);}
  .reddot{position:absolute;left:622px;top:823px;width:164px;height:164px;border-radius:50%;background:#e20f1f;}
  .redbar{position:absolute;left:870px;top:1094px;width:62px;height:600px;background:#e20f1f;}
  .smalldot{position:absolute;left:702px;top:1487px;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e33a31,#b80d12);}
  .magdiamond{position:absolute;left:1120px;top:310px;width:92px;height:92px;background:#e6007e;transform:rotate(45deg);}
  .mask{position:absolute;left:930px;top:447px;width:270px;height:648px;}
  .pinktri{position:absolute;left:1150px;top:1150px;width:0;height:0;border-left:52px solid #d8739d;border-top:30px solid transparent;border-bottom:30px solid transparent;}
  .facetri1{position:absolute;left:962px;top:910px;width:0;height:0;border-left:56px solid #d8739d;border-top:28px solid transparent;border-bottom:28px solid transparent;transform:rotate(180deg);}
  .facetri2{position:absolute;left:1018px;top:934px;width:0;height:0;border-left:40px solid #111;border-top:22px solid transparent;border-bottom:22px solid transparent;transform:rotate(135deg);}

  /* bottom information block */
  .info{position:absolute;left:84px;top:1420px;width:680px;color:#111;}
  .info .row{font-size:42px;line-height:1.55;white-space:nowrap;}
  .datelabel{font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:3px;margin-top:16px;color:#111;}
  .dateline{margin-top:8px;display:flex;align-items:baseline;white-space:nowrap;}
  .dnum{font-family:Georgia,"Times New Roman",serif;font-size:98px;line-height:1;color:#111;}
  .dday{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin-left:8px;color:#111;}
  .slash{font-family:Georgia,"Times New Roman",serif;font-size:70px;margin:0 34px;color:#333;font-weight:300;}
  .phone{font-size:38px;margin-top:24px;letter-spacing:1px;}

  .birds{position:absolute;left:990px;top:1500px;width:195px;height:165px;}
  .mountains{position:absolute;left:0;bottom:0;width:1200px;height:443px;}
</style>
</head>
<body>
<div id="stage">
  <div id="poster">

    <div class="roles">
      <div class="role">生</div>
      <div class="role">旦</div>
      <div class="role">净</div>
      <div class="role">末</div>
      <div class="role">丑</div>
    </div>

    <div class="title"><span class="r">京</span><span class="r">剧</span><span class="b">艺</span><span class="b">术</span><span class="b">节</span></div>

    <div class="subvert">稿定艺术展</div>

    <div class="logo placeholder">[Logo: red checker]</div>
    <div class="brand">Gao<br>Ding<br><span class="yi">Yi</span><br>Shu</div>

    <div class="magdiamond"></div>
    <div class="mask placeholder">[Illustration: geometric Peking-opera face, black &amp; pink gradient]</div>
    <div class="pinkdot"></div>
    <div class="reddot"></div>
    <div class="redbar"></div>
    <div class="smalldot"></div>
    <div class="pinktri"></div>
    <div class="facetri1"></div>
    <div class="facetri2"></div>

    <div class="info">
      <div class="row">主办方：稿定集团</div>
      <div class="row">地点：厦门市稿定剧院</div>
      <div class="datelabel">DATE.</div>
      <div class="dateline">
        <span class="dnum">12.20</span><span class="dday">SUN</span>
        <span class="slash">/</span>
        <span class="dnum">12.30</span><span class="dday">SAT</span>
      </div>
      <div class="phone">联系电话：0592-8888888</div>
    </div>

    <div class="birds placeholder">[Illustration: flying birds]</div>
    <div class="mountains placeholder">[Illustration: ink-wash mountains with small trees along the bottom]</div>

  </div>
</div>
<script>
  function fit(){
    var w=window.innerWidth,h=window.innerHeight;
    var s=Math.min(w/1200,h/2133);
    var p=document.getElementById('poster');
    p.style.transform='scale('+s+')';
    document.getElementById('stage').style.height=(2133*s)+'px';
  }
  window.addEventListener('resize',fit);
  fit();
</script>
</body>
</html>
