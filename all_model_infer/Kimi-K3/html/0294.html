<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur the King - Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
        }

        .poster {
            position: relative;
            width: 600px;
            height: 900px;
            background: linear-gradient(180deg, 
                #8a9a7a 0%, 
                #7a8a6a 10%, 
                #6a7a5a 20%, 
                #5a6a4a 30%, 
                #4a5a3a 40%, 
                #3a4a2a 50%, 
                #2a3a1a 60%, 
                #1a2a0a 70%, 
                #0a1a00 80%, 
                #000 100%
            );
            overflow: hidden;
        }

        .poster-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 20%, rgba(180, 200, 160, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(200, 210, 180, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, 
                    #9aaa8a 0%, 
                    #8a9a7a 15%, 
                    #7a8a6a 30%, 
                    #6a7a5a 45%, 
                    #5a6a4a 55%, 
                    #4a5a3a 65%, 
                    #3a4a2a 75%, 
                    #2a3a1a 85%, 
                    #1a2a0a 95%, 
                    #0a1500 100%
                );
        }

        .actor-name {
            position: absolute;
            top: 38px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 18px;
            text-transform: uppercase;
            z-index: 10;
            padding-left: 18px;
        }

        .taglines {
            position: absolute;
            top: 330px;
            left: 50px;
            z-index: 10;
        }

        .taglines p {
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1.5px;
            line-height: 1.8;
            text-transform: uppercase;
        }

        .title-arthur {
            position: absolute;
            top: 380px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .title-arthur span {
            color: #f0c020;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .title-the {
            position: absolute;
            top: 540px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .title-the span {
            color: #f0c020;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .title-king {
            position: absolute;
            top: 690px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .title-king span {
            color: #f0c020;
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .bottom-right {
            position: absolute;
            bottom: 55px;
            right: 50px;
            text-align: right;
            z-index: 10;
        }

        .bottom-right p {
            color: #fff;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .bottom-right .coming-soon {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .bottom-right .lionsgate {
            font-size: 10px;
            letter-spacing: 3px;
            color: #ccc;
            margin-top: 2px;
        }

        .rating-box {
            position: absolute;
            bottom: 40px;
            left: 50px;
            z-index: 10;
            border: 1px solid #888;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rating-box .pg {
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid #fff;
            padding: 1px 4px;
        }

        .rating-box .rating-text {
            color: #aaa;
            font-size: 7px;
            line-height: 1.2;
        }

        .placeholder-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 45%;
            z-index: 1;
        }

        .placeholder-dog {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="poster-bg"></div>

        <div class="placeholder-face" title="Mark Wahlberg face - upper portion of poster"></div>
        <div class="placeholder-dog" title="Scruffy dog (Arthur) - lower portion of poster"></div>

        <div class="actor-name">Mark Wahlberg</div>

        <div class="taglines">
            <p>An Unexpected Encounter</p>
            <p>An Unlikely Bond</p>
            <p>An Unforgettable Adventure</p>
        </div>

        <div class="title-arthur">
            <span>Arthur</span>
        </div>

        <div class="title-the">
            <span>The</span>
        </div>

        <div class="title-king">
            <span>King</span>
        </div>

        <div class="bottom-right">
            <p>Based on the<br>Incredible True Story</p>
            <p class="coming-soon">Coming Soon</p>
            <p class="lionsgate">Lionsgate</p>
        </div>

        <div class="rating-box">
            <span class="pg">PG-13</span>
            <span class="rating-text">[rating info]</span>
        </div>
    </div>
</body>
</html>
