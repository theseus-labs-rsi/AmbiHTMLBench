<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #d2d2d2;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    color: #141414;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 540px;
    min-height: 100%;
    background: #f5f5f5;
    padding: 14px 12px 30px 12px;
  }
  .msg {
    display: flex;
    align-items: flex-start;
    margin: 14px 0;
  }
  .msg.left { flex-direction: row; }
  .msg.right { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 4px;
    overflow: hidden;
    font-size: 8px;
    line-height: 1.1;
    color: rgba(255,255,255,.85);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
  }
  .avatar.sky { background: linear-gradient(#b9c7d2 0%, #8fa6b6 55%, #5f7484 100%); }
  .avatar.room { background: linear-gradient(#caa06a 0%, #8a5a34 60%, #4a2f1c 100%); }

  .bubble {
    position: relative;
    max-width: 400px;
    padding: 11px 13px;
    border-radius: 6px;
    font-size: 16.5px;
    line-height: 1.52;
    word-break: break-word;
  }
  .msg.left .bubble {
    background: #ffffff;
    margin-left: 10px;
    border: 1px solid #e6e6e6;
  }
  .msg.left .bubble::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 14px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 6px solid #ffffff;
  }
  .msg.right .bubble {
    background: #95ec69;
    margin-right: 10px;
  }
  .msg.right .bubble::before {
    content: "";
    position: absolute;
    right: -6px;
    top: 14px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 6px solid #95ec69;
  }

  .num {
    display: inline-block;
    width: 23px;
    height: 23px;
    line-height: 23px;
    text-align: center;
    border-radius: 4px;
    background: #8b99a7;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    margin-right: 7px;
    vertical-align: -3px;
  }
</style>
</head>
<body>
  <div class="page">

    <div class="msg left">
      <div class="avatar sky placeholder">[Avatar]</div>
      <div class="bubble"><span class="num">6</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。</div>
    </div>

    <div class="msg left">
      <div class="avatar sky placeholder">[Avatar]</div>
      <div class="bubble"><span class="num">7</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰</div>
    </div>

    <div class="msg left">
      <div class="avatar sky placeholder">[Avatar]</div>
      <div class="bubble"><span class="num">8</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。</div>
    </div>

    <div class="msg left">
      <div class="avatar sky placeholder">[Avatar]</div>
      <div class="bubble">你重新写吧</div>
    </div>

    <div class="msg right">
      <div class="avatar room placeholder">[Avatar]</div>
      <div class="bubble">好的，谢谢老师</div>
    </div>

  </div>
</body>
</html>
