<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一月-任务</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  body {
    margin: 0;
    padding: 28px 22px;
    background: #ffffff;
    font-family: "SimSun", "Songti SC", "Microsoft YaHei", serif;
    color: #000;
  }
  h1 {
    margin: 0 0 34px 8px;
    font-size: 26px;
    font-weight: 700;
    font-family: "Microsoft YaHei", "SimHei", sans-serif;
    letter-spacing: 1px;
  }
  table {
    border-collapse: collapse;
    width: 98%;
    table-layout: fixed;
    font-size: 13px;
  }
  th, td {
    border: 1px solid #7f7f7f;
    padding: 7px 6px;
    text-align: center;
    vertical-align: middle;
    word-break: break-all;
    background: #ffffff;
  }
  thead th {
    background: #f2f2f2;
    font-weight: 700;
  }
  .blue { background: #ddebf7; }
  col.c-no { width: 8%; }
  col.c-desc { width: 18%; }
  col.c-post { width: 13%; }
  col.c-act { width: 24%; }
  col.c-time { width: 15%; }
  col.c-note { width: 22%; }
</style>
</head>
<body>
  <h1>一月-任务</h1>
  <table>
    <colgroup>
      <col class="c-no">
      <col class="c-desc">
      <col class="c-post">
      <col class="c-act">
      <col class="c-time">
      <col class="c-note">
    </colgroup>
    <thead>
      <tr>
        <th>序号</th>
        <th>任务描述</th>
        <th>岗位</th>
        <th>操作动作</th>
        <th>开始时间</th>
        <th>备注</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="blue">1</td>
        <td class="blue">租厂房</td>
        <td class="blue">总经理</td>
        <td class="blue">申请60w 租厂房</td>
        <td class="blue">1月1日</td>
        <td>花60w租A厂房</td>
      </tr>
      <tr>
        <td class="blue">2</td>
        <td class="blue">资质开发</td>
        <td class="blue">总经理</td>
        <td class="blue">P3资质开发</td>
        <td class="blue">1月1日</td>
        <td>申请20w 资质开发</td>
      </tr>
      <tr>
        <td class="blue">3</td>
        <td class="blue">批拨款</td>
        <td class="blue">财务</td>
        <td class="blue">批准</td>
        <td class="blue">1月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>4</td>
        <td>支付管理费</td>
        <td>财务</td>
        <td>5w管理费</td>
        <td>1月1日</td>
        <td></td>
      </tr>
      <tr>
        <td>5</td>
        <td>建设生产线</td>
        <td>生产</td>
        <td>4条自动线生产P3</td>
        <td>1月1日</td>
        <td>申请200w资金建线</td>
      </tr>
      <tr>
        <td>6</td>
        <td>iso开发</td>
        <td>总经理</td>
        <td>两个iso的开发</td>
        <td>1月1日</td>
        <td>申请资金开发</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
