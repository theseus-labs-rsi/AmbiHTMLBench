<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用合理的标点符号</title>
<script>
  MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#ececec;}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;}
  .page{position:relative;width:540px;height:720px;margin:0 auto;background:#ffffff;border:1px solid #e7e7e7;box-sizing:border-box;overflow:hidden;color:#222;}

  /* 标题（黄色高亮） */
  .title{position:absolute;left:86px;top:27px;margin:0;font-size:33px;line-height:1.32;font-weight:900;color:#141414;letter-spacing:1px;}
  .title .mark{display:inline-block;background:#f8e71e;padding:4px 3px 1px 3px;margin:-4px -3px -1px -3px;}

  .subtitle{position:absolute;left:87px;top:136px;font-size:14px;color:#777;letter-spacing:.3px;}

  .num{position:absolute;left:377px;top:40px;width:74px;height:74px;border:1px solid #e4e4e4;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#1d1d1d;box-sizing:border-box;}

  .panel{position:absolute;left:88px;width:363px;border-radius:13px;box-sizing:border-box;overflow:visible;}
  .panel.pink{top:176px;height:232px;background:linear-gradient(#fbf4f1,#faeeea);}
  .panel.blue{top:429px;height:229px;background:#eef5fb;}

  .headrow{position:absolute;left:23px;top:27px;display:flex;align-items:center;}
  .headrow .ring{width:23px;height:23px;border:2px solid #cbb4a8;border-radius:50%;box-sizing:border-box;background:transparent;}
  .headrow .x{font-size:26px;line-height:1;color:#a9c3d6;font-weight:400;transform:translateY(-1px);}
  .headrow .txt{margin-left:13px;font-size:20px;font-weight:900;color:#2a2a2a;letter-spacing:.5px;}

  .kv{position:absolute;left:97px;}
  .kv .line{font-size:15px;line-height:1.8;color:#3a3a3a;white-space:nowrap;}
  .kv b{color:#1b1b1b;font-weight:800;}
  .kv .sep{color:#9a9a9a;font-weight:400;}
  .kv1{top:78px;}
  .kv2{top:150px;}
  .kv2 .r{display:flex;align-items:center;margin-bottom:7px;}
  .kv2 .tag{background:#f2665c;color:#fff;font-size:13px;line-height:1;border-radius:3px;padding:4px 7px;font-weight:700;}
  .kv2 .val{margin-left:7px;font-size:15px;color:#383838;white-space:nowrap;}
  .blue .kv{top:100px;}
  .blue .kv .line{line-height:1.75;}

  .placeholder{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
               font-size:10px;line-height:1.25;color:#a6a6a6;box-sizing:border-box;}
  .chick1{left:294px;top:168px;width:62px;height:79px;}
  .chick2{left:290px;top:175px;width:69px;height:76px;}

  .footL{position:absolute;left:27px;top:689px;font-size:8px;color:#7b7b7b;letter-spacing:1px;line-height:1.5;}
  .logo{position:absolute;left:472px;top:684px;width:41px;height:26px;border:1px solid #d8d8d8;font-size:6px;color:#999;letter-spacing:0;}
</style>
</head>
<body>
  <div class="page">
    <h1 class="title"><span class="mark">使用合理的</span><br><span class="mark">标点符号</span></h1>
    <div class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</div>
    <div class="num">01</div>

    <!-- 粉色示例面板 -->
    <section class="panel pink">
      <div class="headrow">
        <span class="ring"></span>
        <span class="txt">使用直线或外框</span>
      </div>

      <div class="kv kv1">
        <div class="line"><b>地点</b><span class="sep"> | </span>武汉国际会展中心</div>
        <div class="line"><b>时间</b><span class="sep"> | </span>2018 年 8 月 20 日</div>
      </div>

      <div class="kv kv2">
        <div class="r"><span class="tag">地点</span><span class="val">武汉国际会展中心</span></div>
        <div class="r"><span class="tag">时间</span><span class="val">2018 年 8 月 20 日</span></div>
      </div>

      <div class="placeholder chick1">[插图：右侧<br>戴红帽小鸡]</div>
    </section>

    <!-- 蓝色示例面板 -->
    <section class="panel blue">
      <div class="headrow">
        <span class="x">×</span>
        <span class="txt">使用冒号</span>
      </div>

      <div class="kv">
        <div class="line"><b>地点：</b>武汉国际会展中心</div>
        <div class="line"><b>时间：</b>2018 年 8 月 20 日</div>
      </div>

      <div class="placeholder chick2">[插图：右下<br>生气小鸡]</div>
    </section>

    <div class="footL">ADVERTISING CREATIVITY<br>2018.01</div>
    <div class="placeholder logo">[Logo]<br>[illegible]</div>
  </div>
</body>
</html>
