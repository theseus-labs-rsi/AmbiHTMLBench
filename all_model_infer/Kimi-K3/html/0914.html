<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录 - Building Thinking Classrooms</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e7e7e7;
    font-family: "SimSun", "Songti SC", "STSong", serif;
    color: #111;
  }
  .page {
    width: 760px;
    margin: 22px auto;
    background: #ffffff;
    padding: 34px 42px 70px 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }

  /* Masthead */
  .masthead {
    display: flex;
    align-items: flex-end;
    margin: 6px 0 34px 0;
  }
  .bigB {
    font-family: "Times New Roman", Georgia, serif;
    font-size: 78px;
    line-height: .82;
    font-weight: 400;
    margin-right: 4px;
  }
  .mast-right { flex: 1; }
  .cn {
    text-align: center;
    font-size: 25px;
    letter-spacing: 28px;
    margin-right: -28px; /* recenter after letter-spacing */
    padding: 0 0 8px 0;
    font-weight: 400;
  }
  .rule { border-top: 1px solid #3f3f3f; }
  .en {
    font-family: "Times New Roman", Georgia, serif;
    font-style: italic;
    font-size: 17px;
    padding: 7px 0 8px 0;
    text-align: left;
    white-space: nowrap;
  }

  /* TOC entries */
  .entry { margin: 0 0 25px 0; }
  .band {
    display: flex;
    align-items: center;
    height: 65px;
    background:
      linear-gradient(to right, #8d8d8d 0 27px, rgba(0,0,0,0) 27px),
      linear-gradient(to bottom, #d8d8d8 0%, #c6c6c6 55%, #b4b4b4 100%);
  }
  .icon-wrap {
    flex: 0 0 auto;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: #a3a3a3;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 42px;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #f7f7f7;
    border: 1px solid #7c7c7c;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .icon .cap { font-size: 8px; line-height: 1.1; color: #6f6f6f; padding: 0 3px; }
  .icon .q { font-size: 30px; color: #222; font-family: Georgia, serif; }

  .txt { margin-left: 26px; line-height: 1.55; }
  .txt .t { font-size: 15px; white-space: nowrap; }
  .txt .s { font-size: 15px; white-space: nowrap; padding-left: 58px; }
  .pg {
    margin-left: auto;
    padding-right: 40px;
    font-size: 14px;
    font-family: "Times New Roman", Georgia, serif;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <div class="bigB">B</div>
      <div class="mast-right">
        <div class="cn">目录</div>
        <div class="rule"></div>
        <div class="en">uilding Thinking Classrooms</div>
        <div class="rule"></div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第一章 | 激发学习兴趣</div>
          <div class="s">——布置思考题</div>
        </div>
        <div class="pg">001</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第二章 | 探索课堂合作</div>
          <div class="s">——频繁地进行透明化的随机分组</div>
        </div>
        <div class="pg">019</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第三章 | 改变被动的行为习惯</div>
          <div class="s">——运用白板</div>
        </div>
        <div class="pg">037</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第四章 | 打造自由思考的空间</div>
          <div class="s">——课桌椅随意摆放</div>
        </div>
        <div class="pg">051</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon"><span class="q">?</span></div></div>
        <div class="txt">
          <div class="t">第五章 | 应对学生的提问</div>
          <div class="s">——只回答持续思考的问题</div>
        </div>
        <div class="pg">063</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第六章 | 提高课堂参与度</div>
          <div class="s">——站着口述题目</div>
        </div>
        <div class="pg">079</div>
      </div>
    </div>

    <div class="entry">
      <div class="band">
        <div class="icon-wrap"><div class="icon placeholder"><span class="cap">[Icon]</span></div></div>
        <div class="txt">
          <div class="t">第七章 | 布置有效果的作业</div>
          <div class="s">——布置自测题</div>
        </div>
        <div class="pg">097</div>
      </div>
    </div>
  </div>
</body>
</html>
