<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维二：分解思维</title>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #1c1c1c;
  }
  .page {
    position: relative;
    width: 540px;
    height: 722px;
    margin: 0 auto;
    background: #ffffff;
    overflow: hidden;
  }
  /* corner brackets */
  .corner { position: absolute; width: 0; height: 0; border: 0 solid #6f9085; }
  .tl { left: 27px; top: 30px; width: 66px; height: 76px; border-left-width: 3px; border-top-width: 3px; }
  .tr { right: 29px; top: 30px; width: 62px; height: 76px; border-right-width: 3px; border-top-width: 3px; }
  .bl { left: 27px; bottom: 30px; width: 66px; height: 78px; border-left-width: 3px; border-bottom-width: 3px; }
  .br { right: 29px; bottom: 30px; width: 58px; height: 78px; border-right-width: 3px; border-bottom-width: 3px; }

  .inner { padding: 52px 70px 0 64px; }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .def {
    margin: 34px 0 0;
    color: #e02f28;
    font-size: 17px;
    letter-spacing: 1.9px;
    line-height: 1.85;
  }
  h2 {
    margin: 30px 0 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
  }
  p.txt {
    margin: 14px 0 0;
    font-size: 17px;
    letter-spacing: 1.9px;
    line-height: 1.7;
  }

  .turn {
    position: absolute;
    right: 49px;
    bottom: 44px;
    width: 66px;
    height: 53px;
    background: #111111;
    color: #ffffff;
    font-size: 14px;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    padding-left: 7px;
    clip-path: polygon(0 28%, 56% 28%, 56% 0, 100% 50%, 56% 100%, 56% 72%, 0 72%);
  }
  .credit {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 9px;
    text-align: center;
    font-size: 15px;
    color: #222222;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="inner">
    <h1>计算思维二：分解思维</h1>
    <p class="def">分解思维是指将复杂的问题（或任务）拆解成一<br>个个更易于解决的小问题（或任务）。</p>

    <h2>1、问题梳理</h2>
    <p class="txt">先明确这个复杂问题到底是什么，最终要达到什<br>么目的或效果。</p>

    <h2>2、问题分解</h2>
    <p class="txt">将复杂问题进行分解，梳理解决这个问题需要哪<br>几步，每一步需要干什么事情，具体要怎么做，<br>这就是一个个的小任务。</p>

    <h2>3、整合方案</h2>
    <p class="txt">制定方案去解决每个小任务，然后将解决方案整<br>合起来，就能轻松解决这个复杂问题了。</p>
  </div>

  <div class="turn">翻页</div>
  <div class="credit">原创：学习方法社</div>
</div>
</body>
</html>
