<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宿建议</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f6f3ea;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #111;
  }
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 34px 30px 60px;
    background: #f6f3ea;
    line-height: 1.85;
  }
  h1 {
    text-align: center;
    font-size: 34px;
    letter-spacing: 6px;
    font-weight: 700;
    margin: 0 0 18px;
  }
  h1 .u { border-bottom: 3px solid #d33; padding-bottom: 2px; }
  .subtitle {
    text-align: center;
    font-size: 24px;
    letter-spacing: 3px;
    font-weight: 700;
    margin: 0 0 34px;
    position: relative;
  }
  .dots {
    position: absolute;
    left: 50%;
    transform: translateX(18px);
    bottom: -12px;
    white-space: nowrap;
  }
  .dots i {
    display: inline-block;
    width: 7px;
    height: 7px;
    border: 2px solid #d33;
    border-radius: 50%;
    margin: 0 4px;
    background: transparent;
  }
  p {
    font-size: 16.5px;
    margin: 0 0 26px;
    text-align: justify;
    letter-spacing: .5px;
  }
  .label { font-weight: 700; }
  .u {
    border-bottom: 2px solid #d33;
    padding-bottom: 1px;
  }
</style>
</head>
<body>
<div class="page">
  <h1>住宿<span class="u">建议</span></h1>
  <div class="subtitle">[选酒店关注点]<span class="dots"><i></i><i></i><i></i></span></div>

  <p><span class="label">【<span class="u">沙滩</span>】</span>:亲子家庭出行游,<span class="u">对沙滩的质量和海水</span>的选择上要<span class="u">干净、清澈,沙子细软不扎脚</span>的。有私人海滩更佳</p>

  <p><span class="label">【<span class="u">酒店设施</span>】</span>:针对酒店的洗护有没有提供<span class="u">宝宝专用</span>,以及宝宝专用的洗漱台和马桶等等,以及<span class="u">有没有婴儿床、床围</span>等床上用品提供</p>

  <p><span class="label">【<span class="u">房间</span>】</span>:房间主题最好有小朋友喜欢的主题,比如<span class="u">太空主题</span>的房间或者星空主题的房间;以及房间有没有提供儿童帐篷、滑梯等玩乐设施。<span class="u">房型面积最好大一些,有足够的空间</span>给小朋友跑跳玩乐</p>

  <p><span class="label">【<span class="u">儿童玩乐设施</span>】</span>:看酒店<span class="u">儿童玩乐设施室内还是室外</span>.设施是不是<span class="u">每日一消毒</span>,看空间宽不宽敞。有没有家长休息区。有没有<span class="u">托管服务</span>,托管时间,托管玩的项目等具体小朋友玩乐细节</p>
</div>
</body>
</html>
