<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 · 金句合集系列</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ded6c5;
    font-family: "Songti SC", "SimSun", "STSong", serif;
    color: #25201b;
  }
  .page {
    width: 540px;
    margin: 0 auto;
    box-shadow: 0 0 8px rgba(0,0,0,.18);
  }
  /* 顶部浅色报头区 */
  .top {
    background: #f7ecd5;
    height: 150px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 6px 0 6px;
  }
  .logo { line-height: 1; }
  .logo .cn {
    font-family: "STKaiti", "KaiTi", "STSong", "SimSun", serif;
    font-size: 78px;
    font-weight: 700;
    color: #d2362b;
    letter-spacing: 0;
  }
  .logo .py {
    margin-top: 12px;
    font-family: "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 7px;
    color: #a94c3e;
  }
  .head-right { width: 236px; color: #1f1f1f; }
  .head-right .tags {
    font-size: 21px;
    font-weight: 700;
    text-align: right;
    letter-spacing: 1px;
  }
  .head-right .r1 {
    width: 200px;
    margin: 16px 0 0 auto;
    border-bottom: 2px solid #2b2b2b;
  }
  .head-right .series {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 20px 0 0 30px;
  }
  .head-right .r2 {
    width: 236px;
    margin: 6px 0 0 0;
    border-bottom: 2px solid #2b2b2b;
  }
  /* 主体牛皮纸色区 */
  .main {
    background: #c9b087;
    padding: 22px 14px 48px 14px;
  }
  .item { margin: 0 0 28px 0; }
  .quote {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 1px;
    padding-left: 1.55em;
    text-indent: -1.55em;
  }
  .label {
    margin: 16px 0 4px 0;
    font-size: 16px;
    font-weight: 700;
  }
  .meaning {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="logo">
      <div class="cn">人民日报</div>
      <div class="py">RENMIN&nbsp;RIBAO</div>
    </div>
    <div class="head-right">
      <div class="tags">金句|素材|摘抄</div>
      <div class="r1"></div>
      <div class="series">金句合集系列</div>
      <div class="r2"></div>
    </div>
  </div>
  <div class="main">
    <div class="item">
      <p class="quote">1、愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</p>
      <p class="label">释义：</p>
      <p class="meaning">希望你不论经过多少事都能如往昔依然不变，不因为时间的流逝与琐事而烦恼忧愁。</p>
    </div>
    <div class="item">
      <p class="quote">2、总有人间一两风，<br>填我十万八千梦。</p>
      <p class="label">释义：</p>
      <p class="meaning">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。</p>
    </div>
    <div class="item">
      <p class="quote">3、日出有盼，日落有思，<br>平平安安，所遇皆甜。</p>
      <p class="label">释义：</p>
      <p class="meaning">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。</p>
    </div>
  </div>
</div>
</body>
</html>
