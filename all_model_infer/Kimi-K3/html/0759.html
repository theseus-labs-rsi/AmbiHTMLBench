<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狗狗随行与拒食训练</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3ece0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    color: #2c2c2c;
    display: flex;
    justify-content: center;
    padding: 12px;
  }
  .page {
    width: 520px;
    background: #fbf4e4;
    border: 4px solid #ee97a2;
    border-radius: 18px;
    padding: 14px 22px 22px 20px;
    position: relative;
    line-height: 1.55;
  }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 2px 0 4px 0;
  }
  .sec-title {
    font-size: 27px;
    font-weight: 800;
    color: #232323;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .sec-sub {
    font-size: 14px;
    font-weight: 700;
    color: #6b9a37;
    line-height: 1.3;
  }
  .row {
    display: flex;
    align-items: flex-start;
  }
  .placeholder {
    background: #efe6d2;
    border: 1px dashed #c9bda6;
    color: #9a8f79;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    flex: 0 0 auto;
  }
  .corgi1 { width: 132px; height: 176px; margin: 2px 10px 0 4px; }
  .corgi2 { width: 128px; height: 168px; margin: 6px 12px 0 4px; }
  .s1-side, .s2-side { flex: 1 1 auto; }
  .item {
    font-size: 15px;
    margin: 0 0 8px 0;
    text-align: justify;
  }
  .item .num { font-weight: 800; }
  .full { margin: 2px 0 0 0; }
  .hl { color: #e3547d; font-weight: 800; }
  .strip {
    width: 100%;
    height: 92px;
    margin: 6px 0 10px 0;
    border: none;
    background: transparent;
    display: flex;
    gap: 8px;
    padding: 0;
  }
  .strip .panel {
    flex: 1;
    height: 100%;
    border: none;
    background: transparent;
  }
  hr.sep {
    border: none;
    border-top: 2px dashed #b6ad98;
    margin: 4px 0 10px 0;
  }
  .s2 .sec-head { margin-top: 0; }
</style>
</head>
<body>
<div class="page">
  <section class="s1">
    <div class="sec-head">
      <div class="sec-title">稳定随行</div>
      <div class="sec-sub">训练狗狗跟着人走而不是人跟着狗走</div>
    </div>
    <div class="row">
      <figure class="placeholder corgi1">[插图：柯基犬]</figure>
      <div class="s1-side">
        <p class="item"><span class="num">①</span>前期可以选择靠墙位置，用玩具或零食吸引狗狗注意力<span class="hl">在人身上</span></p>
        <p class="item"><span class="num">②</span>如果狗狗出现前冲或者<span class="hl">爆冲</span>行为，主人要握紧牵绳，<span class="hl">原地保持不</span>动，或者右转90度，让狗狗走在你身后</p>
      </div>
    </div>
    <p class="item full"><span class="num">③</span>狗狗一旦回头找你或者牵引绳<span class="hl">恢复了松弛状态</span>，你再继续走，重复多次</p>
    <figure class="placeholder strip">
      <div class="placeholder panel">[图示：牵引随行分解动作一]</div>
      <div class="placeholder panel">[图示：牵引随行分解动作二]</div>
      <div class="placeholder panel">[图示：牵引随行分解动作三]</div>
    </figure>
  </section>
  <hr class="sep">
  <section class="s2">
    <div class="sec-head">
      <div class="sec-title">拒食训练</div>
      <div class="sec-sub">训练狗狗不随便在外面捡东西吃</div>
    </div>
    <div class="row">
      <figure class="placeholder corgi2">[插图：柯基犬]</figure>
      <div class="s2-side">
        <p class="item"><span class="num">①</span>系上牵引绳，将狗狗爱吃的零食放在手上，当它想吃的时候，<span class="hl">拉绳</span>子说NO，并握紧食物，<span class="hl">反复训练直</span>到狗狗看到手中食物就避开</p>
      </div>
    </div>
    <p class="item full"><span class="num">②</span>当狗狗能做到在手里的食物可以成功拒食后，可以把食物<span class="hl">放在地上</span>，带狗狗经过，狗狗嗅闻的时候，拉绳子说NO，直到狗狗无视地上食物</p>
  </section>
</div>
</body>
</html>
