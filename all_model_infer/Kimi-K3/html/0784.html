<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:#5f6298;
    font-family:"Kaiti SC","STKaiti","KaiTi","DFKai-SB","TW-Kai",serif;
  }
  .page{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    background:#5f6298;
    overflow:hidden;
  }
  .vcol{
    position:absolute;
    writing-mode:vertical-rl;
    text-orientation:upright;
    white-space:nowrap;
    font-weight:700;
  }
  .dark{ color:#3c3f6f; font-size:41px; letter-spacing:24px; }
  .light{ color:#f2efe6; font-size:34px; letter-spacing:7px; }

  #c1{ top:14%;  right:8.5%; }
  #c2{ top:23.5%; right:25%; }
  #c3{ top:26%;  left:36.5%; }
  #c4{ top:26%;  left:27%; }

  .author{
    top:14.5%; left:5.5%;
    color:#efede4;
    font-size:17px;
    letter-spacing:3px;
    font-weight:400;
    line-height:1.9;
  }

  .footnote{
    position:absolute;
    left:0; right:0; bottom:0;
    background:#f2ecdb;
    color:#555;
    font-family:"Songti SC","SimSun",serif;
    font-size:13px;
    letter-spacing:1px;
    padding:13px 40px 16px 78px;
    box-sizing:border-box;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="vcol dark" id="c1">朝辭白帝彩雲間</div>
    <div class="vcol dark" id="c2">千里江陵一日還</div>
    <div class="vcol light" id="c3">两岸猿声啼不住，</div>
    <div class="vcol light" id="c4">轻舟已过万重山。</div>

    <div class="vcol author">唐&#12288;&#12288;李白&#12288;&#12288;早发白帝城</div>

    <div class="footnote">两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。</div>
  </div>
</body>
</html>
