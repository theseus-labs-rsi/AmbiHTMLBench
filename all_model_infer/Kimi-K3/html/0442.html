<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #2b2b2b;
  }
  .screen {
    max-width: 640px;
    margin: 0 auto;
    background: #ffffff;
    min-height: 100vh;
    padding: 14px 22px 40px 22px;
  }
  /* Top navigation bar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    margin: 0 -6px 18px -6px;
  }
  .nav-left {
    display: flex;
    align-items: center;
    color: #c39b22;
    font-size: 19px;
    letter-spacing: 0.5px;
  }
  .nav-left .chevron {
    display: inline-flex;
    margin-right: 10px;
    margin-left: 2px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 22px;
    color: #c39b22;
  }
  .nav-right svg, .nav-left svg { display: block; }

  /* Section block */
  .section { margin-bottom: 34px; }
  .section-head {
    display: flex;
    align-items: center;
    margin: 0 0 16px 0;
  }
  .check {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #f4b400;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .check svg { display: block; }
  .section-title {
    font-size: 19px;
    font-weight: 700;
    color: #2b2b2b;
    letter-spacing: 0.3px;
  }
  .quote {
    margin: 0;
    padding: 0;
    font-size: 18px;
    line-height: 1.78;
    color: #333333;
    letter-spacing: 0.2px;
    text-align: justify;
  }
  .quote .attr-block {
    display: block;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="screen">

  <div class="navbar">
    <div class="nav-left">
      <span class="chevron">
        <svg width="14" height="22" viewBox="0 0 14 22" fill="none">
          <path d="M12 2 L3 11 L12 20" stroke="#c39b22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>金句合集</span>
    </div>
    <div class="nav-right">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="10" cy="9" r="4" stroke="#c39b22" stroke-width="1.8"/>
        <path d="M3.5 21c.6-3.4 3.2-5.4 6.5-5.4 1.5 0 2.8.4 3.9 1.1" stroke="#c39b22" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M15.5 16.5 l2.2 2.2 4-4.2" stroke="#c39b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg width="24" height="26" viewBox="0 0 24 26" fill="none">
        <path d="M12 17 V4" stroke="#c39b22" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.5 8.5 L12 4 L16.5 8.5" stroke="#c39b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 13.5 V20.5 C5 21.6 5.9 22.5 7 22.5 H17 C18.1 22.5 19 21.6 19 20.5 V13.5" stroke="#c39b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="11" stroke="#c39b22" stroke-width="1.6"/>
        <circle cx="8" cy="13" r="1.5" fill="#c39b22"/>
        <circle cx="13" cy="13" r="1.5" fill="#c39b22"/>
        <circle cx="18" cy="13" r="1.5" fill="#c39b22"/>
      </svg>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="check">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M3 7.8 L6.2 11 L12 4.2" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="section-title">他写「成长」，正是你所亲历</span>
    </div>
    <p class="quote">“我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”<span class="attr-block">——《病隙碎笔》</span></p>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="check">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M3 7.8 L6.2 11 L12 4.2" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="section-title">他写「磨难」，报之以歌</span>
    </div>
    <p class="quote">“大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》</p>
  </div>

</div>
</body>
</html>
