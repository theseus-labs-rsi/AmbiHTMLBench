<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三页</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html,body{margin:0;padding:0;background:#dcdcdc;font-family:"KaiTi","STKaiti","FangSong",serif;}
  .page{
    position:relative;
    width:540px;
    height:405px;
    margin:18px auto;
    background:#f4f3ec;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    overflow:hidden;
    /* square grid of the manuscript paper */
    background-image:
      repeating-linear-gradient(to right, rgba(80,90,80,.28) 0 1px, transparent 1px 27px),
      repeating-linear-gradient(to bottom, rgba(80,90,80,.28) 0 1px, transparent 1px 27px);
    background-size:27px 27px,27px 27px;
    background-position:0 42px,0 42px;
  }
  .page::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.06),transparent 18%,transparent 85%,rgba(0,0,0,.05));pointer-events:none;}
  .pagetitle{
    position:absolute;top:6px;left:34px;z-index:3;
    font-family:"HeiTi","SimHei",sans-serif;font-weight:900;font-size:27px;letter-spacing:2px;
    color:#e7e56a;
    -webkit-text-stroke:1.4px #4c5a2a;
    text-shadow:1px 1px 0 #4c5a2a;
  }
  /* Vertical letter, columns read right -> left */
  .letter{
    position:absolute;
    top:44px;left:44px;right:36px;bottom:22px;
    writing-mode:vertical-rl;
    text-orientation:upright;
    direction:ltr;
    font-size:19px;
    line-height:27px;          /* matches grid pitch */
    letter-spacing:3px;
    color:#20211d;
    white-space:pre-wrap;
  }
  .letter p{margin:0;padding:0;}
  .sig{margin-top:0;}
  .seal{
    /* red square seal beside the name */
    display:inline-block;
    width:22px;height:22px;
    margin:2px 6px 0 0;
    background:#b2321f;
    color:#f6e6cf;
    box-shadow:inset 0 0 0 1.5px rgba(246,230,207,.85), inset 0 0 0 3px rgba(178,50,31,.9);
    text-align:center;
    writing-mode:horizontal-tb;
    font-size:8px;line-height:22px;letter-spacing:0;
    vertical-align:top;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="pagetitle">第三页</div>

    <div class="letter"><p>因家[?]住過醫[?]，我比較
清楚：一般情況下，牛[?]是不會
用舌頭卷水的，用舌頭[?]水的[?]
（狗與貓），牠們會把嘴貼到水面
上往裡吸水。

總之，必須注意觀察細
節，也要注意訓練在[?]的
基礎上[?]像細節的能力。
[?][?]閒[?]，都是[?]。

請[?]吧。

即頌
筆健！

<span class="seal">莫言</span>莫言
癸卯三月七日晚</p></div>
  </div>
</body>
</html>
