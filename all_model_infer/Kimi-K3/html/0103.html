<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高频考点汇总</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #8faa7e;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .page {
    background: #fff;
    max-width: 700px;
    width: 100%;
    padding: 30px 40px 40px;
    position: relative;
    border-radius: 4px;
  }

  .header {
    text-align: center;
    position: relative;
    margin-bottom: 20px;
  }

  .header-title {
    display: inline-block;
    background: linear-gradient(135deg, #f5c6d0, #f0a0b0);
    padding: 8px 30px;
    border-radius: 20px;
    font-size: 24px;
    font-weight: bold;
    color: #5a3a4a;
    position: relative;
  }

  .header-title::before {
    content: "♥";
    position: absolute;
    top: -8px;
    right: -10px;
    color: #f0a0b0;
    font-size: 14px;
  }

  .header-title::after {
    content: "♥";
    position: absolute;
    top: -5px;
    left: -8px;
    color: #f0a0b0;
    font-size: 12px;
  }

  .cartoon-top {
    position: absolute;
    top: -10px;
    right: 20px;
    width: 80px;
    height: 90px;
  }

  .cartoon-top svg {
    width: 100%;
    height: 100%;
  }

  .section-title {
    font-size: 20px;
    font-weight: bold;
    color: #7ab8c9;
    margin-top: 18px;
    margin-bottom: 10px;
  }

  .section-title.blue {
    color: #7ab8c9;
  }

  .section-title.green {
    color: #7ab8c9;
  }

  .item {
    font-size: 16px;
    color: #333;
    line-height: 1.8;
    margin-left: 10px;
  }

  .sub-item {
    font-size: 16px;
    color: #333;
    line-height: 1.8;
    margin-left: 10px;
  }

  .stars {
    display: inline-block;
    font-size: 28px;
    color: #f5a623;
    margin-left: 10px;
    vertical-align: middle;
  }

  .content-area {
    position: relative;
  }

  .cloud-decoration {
    position: absolute;
    right: 20px;
    top: 120px;
    width: 160px;
    height: 140px;
  }

  .animal-decoration {
    position: absolute;
    right: 10px;
    bottom: 20px;
    width: 140px;
    height: 130px;
  }

  .watermark {
    position: absolute;
    bottom: 10px;
    right: 20px;
    font-size: 12px;
    color: #aaa;
    text-align: right;
  }

  .watermark .name {
    font-size: 13px;
    color: #999;
  }

  .bracket-text {
    color: #333;
  }

  .highlight-box {
    background: #f0f8ff;
    border: 1px solid #d0e8f0;
    border-radius: 6px;
    padding: 8px 12px;
    margin: 5px 0;
    display: inline-block;
  }

  .dash {
    color: #555;
  }

  .section-content {
    position: relative;
  }

  .inline-stars {
    color: #f5a623;
    font-size: 26px;
    letter-spacing: 2px;
  }

  .pencil-cartoon {
    position: absolute;
    top: 0;
    right: 30px;
    width: 90px;
    height: 100px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-title">高频考点汇总</div>
    <div class="pencil-cartoon">
      <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
        <!-- Cute cat/character holding pencil -->
        <ellipse cx="50" cy="30" rx="28" ry="25" fill="#f5d5a0"/>
        <ellipse cx="35" cy="12" rx="10" ry="12" fill="#f5d5a0"/>
        <ellipse cx="65" cy="12" rx="10" ry="12" fill="#f5d5a0"/>
        <ellipse cx="35" cy="12" rx="6" ry="8" fill="#f0b8a0"/>
        <ellipse cx="65" cy="12" rx="6" ry="8" fill="#f0b8a0"/>
        <circle cx="42" cy="28" r="4" fill="#333"/>
        <circle cx="58" cy="28" r="4" fill="#333"/>
        <ellipse cx="50" cy="36" rx="4" ry="3" fill="#f0a0a0"/>
        <path d="M46 40 Q50 44 54 40" stroke="#333" fill="none" stroke-width="1.5"/>
        <!-- Pencil -->
        <rect x="55" y="45" width="12" height="55" rx="3" fill="#f5d560" transform="rotate(15, 61, 72)"/>
        <polygon points="55,100 67,100 61,110" fill="#f5c0a0" transform="rotate(15, 61, 72)"/>
        <rect x="55" y="42" width="12" height="8" rx="2" fill="#e0e0e0" transform="rotate(15, 61, 72)"/>
        <!-- Body -->
        <ellipse cx="50" cy="65" rx="22" ry="18" fill="#f5d5a0"/>
      </svg>
    </div>
  </div>

  <div class="content-area">
    <!-- Cloud decoration -->
    <div class="cloud-decoration">
      <svg viewBox="0 0 180 160" xmlns="http://www.w3.org/2000/svg">
        <!-- Cloud body -->
        <ellipse cx="90" cy="80" rx="75" ry="50" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
        <ellipse cx="55" cy="70" rx="40" ry="35" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
        <ellipse cx="125" cy="70" rx="40" ry="35" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
        <ellipse cx="90" cy="55" rx="45" ry="30" fill="#f0f0f0"/>
        <!-- Face -->
        <circle cx="72" cy="78" r="5" fill="#5588cc"/>
        <circle cx="108" cy="78" r="5" fill="#5588cc"/>
        <ellipse cx="90" cy="90" rx="6" ry="4" fill="#f0a0a0"/>
        <ellipse cx="65" cy="92" rx="8" ry="5" fill="#f5c0c0" opacity="0.6"/>
        <ellipse cx="115" cy="92" rx="8" ry="5" fill="#f5c0c0" opacity="0.6"/>
        <!-- Coin -->
        <circle cx="75" cy="125" r="18" fill="#f5d560" stroke="#d4a830" stroke-width="2"/>
        <text x="75" y="131" text-anchor="middle" font-size="16" fill="#d4a830" font-weight="bold">¥</text>
        <!-- Leaves -->
        <ellipse cx="100" cy="135" rx="15" ry="8" fill="#7ab87a" transform="rotate(-20, 100, 135)"/>
        <ellipse cx="115" cy="140" rx="12" ry="7" fill="#6aa86a" transform="rotate(10, 115, 140)"/>
      </svg>
    </div>

    <div class="section-content">
      <div class="section-title blue">(五)设计选项卡考点</div>
      <div class="item">1.设计—设置背景格式</div>
      <div class="item">2.设计幻灯片主题，调整主题字体</div>
      <div class="item">和主题颜色</div>

      <div class="section-title blue" style="margin-top: 25px;">(六)切换考点</div>
      <div class="item">1.基础考点</div>
      <div class="item">2.设置幻灯片自动放映：切换—</div>
      <div class="sub-item">勾选【设置自动换片时间】</div>
      <div class="sub-item">—设置时间—点击应用到全部</div>

      <div class="section-title blue" style="margin-top: 25px;">
        (七)动画考点 <span class="inline-stars">★★★★★</span>
      </div>
      <div class="item">1.常规考点，动画效果，设置多个动画，</div>
      <div class="sub-item">利用【动画窗格】选择调整动画顺序</div>
      <div class="item">2.设置动画计时</div>

      <div class="section-title blue" style="margin-top: 25px;">(八)视图选项卡考点</div>
      <div class="item">1.颜色，灰度，黑白模式的调整</div>

      <div class="section-title blue" style="margin-top: 25px;">(九)幻灯片放映</div>
      <div class="item">设置幻灯片放映等</div>
    </div>

    <!-- Animal decoration at bottom right -->
    <div class="animal-decoration">
      <svg viewBox="0 0 160 150" xmlns="http://www.w3.org/2000/svg">
        <!-- Cute animal body -->
        <ellipse cx="80" cy="100" rx="55" ry="45" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
        <!-- Head -->
        <ellipse cx="80" cy="55" rx="40" ry="35" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
        <!-- Ears/horns -->
        <ellipse cx="50" cy="25" rx="12" ry="18" fill="#8B7355" transform="rotate(-15, 50, 25)"/>
        <ellipse cx="110" cy="25" rx="12" ry="18" fill="#8B7355" transform="rotate(15, 110, 25)"/>
        <!-- Face -->
        <circle cx="65" cy="52" r="5" fill="#5588cc"/>
        <circle cx="95" cy="52" r="5" fill="#5588cc"/>
        <ellipse cx="80" cy="65" rx="5" ry="4" fill="#f0a0a0"/>
        <ellipse cx="58" cy="62" rx="8" ry="5" fill="#f5c0c0" opacity="0.5"/>
        <ellipse cx="102" cy="62" rx="8" ry="5" fill="#f5c0c0" opacity="0.5"/>
        <!-- Arms -->
        <ellipse cx="35" cy="100" rx="15" ry="10" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2" transform="rotate(-20, 35, 100)"/>
        <ellipse cx="125" cy="100" rx="15" ry="10" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2" transform="rotate(20, 125, 100)"/>
      </svg>
    </div>
  </div>

  <div class="watermark">
    <div class="name">🌸 分糖小姐</div>
    <div>From 小红书</div>
  </div>
</div>
</body>
</html>
