<div class="page">
  <h1 class="title">世界气候类型的分布</h1>

  <p class="intro">虽然世界的气候复杂多样（图3.27），但是它们的分布有一定规律。例如，<span class="hl">由赤道地区到极地地区，有规律地分布着热带的、亚热带的、温带的和寒带的气候</span>。不同的气候类型呈现出不同的自然景观。</p>

  <div class="grid">
    <figure class="cell r1">
      <div class="ph">[Photo: 茂密的热带雨林景观]</div>
      <p class="cap"><span class="ico"></span>热带雨林气候主要分布在赤道附近地区。<span class="hl">这里全年高温多雨</span>，植物终年常绿，许多地方分布着茂密的热带雨林。</p>
    </figure>
    <figure class="cell r1">
      <div class="ph">[Photo: 热带草原（稀树草原）景观]</div>
      <p class="cap"><span class="ico"></span>热带草原气候主要分布在热带雨林气候的南北两侧。这里终年高温，一年中有<span class="hl">明显的干季和雨季</span>。地面上树木稀疏，长着较高的草。</p>
    </figure>
    <figure class="cell r2">
      <div class="ph">[Photo: 温带落叶阔叶林（秋季）景观]</div>
      <p class="cap"><span class="ico"></span>温带季风气候主要分布在温带地区的亚欧大陆东部。<span class="hl">这里四季分明，夏季高温多雨，冬季寒冷干燥</span>。生长着落叶阔叶林。</p>
    </figure>
    <figure class="cell r2">
      <div class="ph">[Photo: 寒带冰雪覆盖景观（北极熊）]</div>
      <p class="cap"><span class="ico"></span>寒带气候主要分布在极圈以内，大部分<span class="hl">地区气温很低，地面被冰雪覆盖</span>。</p>
    </figure>
  </div>

  <p class="figcap">图3.27 不同气候类型的自然景观</p>

  <p class="bottom">其中，热带的气候大致分布在南、北回归线之间，寒带的气候大致分布在南、北极圈内，亚热带和温带的气候大致分布在北回归线与北极圈、南回归线与南极圈之间。在中纬度地区，由大陆东岸、大陆西岸向大陆内部，气候类型的分布也是有规律的。</p>
