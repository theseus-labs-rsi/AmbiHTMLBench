<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30天学会自然拼读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 520px;
            background: #fff;
            border: 3px solid #333;
            position: relative;
            padding: 0;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 8px solid #e85a4f;
            z-index: -1;
        }
        
        .container::after {
            content: '';
            position: absolute;
            top: -16px;
            left: -16px;
            width: 40px;
            height: 100%;
            background: #f4d03f;
            z-index: -2;
        }
        
        .header {
            text-align: center;
            padding: 20px 0 10px;
            position: relative;
        }
        
        .title-box {
            display: inline-block;
            background: #ff8ba7;
            padding: 8px 30px;
            border-radius: 4px;
            border: 2px solid #333;
            position: relative;
        }
        
        .title-box::before {
            content: '';
            position: absolute;
            top: 4px;
            left: -10px;
            right: -10px;
            height: 100%;
            background: #ffb3c1;
            z-index: -1;
            border-radius: 4px;
            border: 2px solid #333;
        }
        
        .title {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
        }
        
        .blue-bar {
            height: 12px;
            background: #a8d8ea;
            margin: 10px 20px;
            border-radius: 6px;
        }
        
        .section {
            padding: 0 25px 15px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .section-label {
            display: inline-block;
            background: #a8d8ea;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-right: 15px;
        }
        
        .section-label.green {
            background: #d4e157;
        }
        
        .section-title-en {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            font-style: italic;
        }
        
        .content-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        
        .illustration {
            width: 180px;
            flex-shrink: 0;
        }
        
        .people-icons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .person {
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        
        .person1 { background: #5d4037; }
        .person2 { background: #f48fb1; }
        .person3 { background: #d84315; }
        .person4 { background: #80cbc4; }
        
        .person::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 20px;
            background: inherit;
            border-radius: 0 0 50% 50%;
        }
        
        .speech-bubble {
            background: #ffccbc;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            position: relative;
            margin-top: 20px;
        }
        
        .speech-bubble::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #ffccbc;
        }
        
        .word-list {
            flex: 1;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 30px;
        }
        
        .word {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        
        .word.red {
            color: #c62828;
        }
        
        .boy-illustration {
            width: 80px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .boy-head {
            width: 50px;
            height: 50px;
            background: #ffccbc;
            border-radius: 50%;
            position: relative;
            border: 2px solid #333;
        }
        
        .boy-hair {
            position: absolute;
            top: -5px;
            left: 5px;
            width: 40px;
            height: 20px;
            background: #333;
            border-radius: 50% 50% 0 0;
        }
        
        .boy-face {
            position: absolute;
            top: 18px;
            left: 10px;
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
            box-shadow: 20px 0 0 #333;
        }
        
        .boy-smile {
            position: absolute;
            top: 28px;
            left: 15px;
            width: 20px;
            height: 10px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 50% 50%;
        }
        
        .boy-body {
            width: 40px;
            height: 60px;
            background: #e53935;
            border-radius: 10px 10px 0 0;
            margin-top: -5px;
            border: 2px solid #333;
            border-top: none;
        }
        
        .boy-legs {
            display: flex;
            gap: 5px;
        }
        
        .boy-leg {
            width: 15px;
            height: 50px;
            background: #1a237e;
            border: 2px solid #333;
            border-top: none;
        }
        
        .rules-box {
            background: #ffccbc;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
            width: 180px;
            flex-shrink: 0;
        }
        
        .flower-decoration {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 80px;
            height: 80px;
        }
        
        .flower {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ff8ba7;
            border-radius: 50%;
            border: 2px solid #333;
        }
        
        .flower::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 15px;
            height: 15px;
            background: #ffd54f;
            border-radius: 50%;
        }
        
        .flower1 { top: 10px; right: 10px; }
        .flower2 { top: 30px; right: 35px; background: #ffcc80; }
        .flower3 { top: 5px; right: 45px; background: #fff176; }
        
        .heart-decoration {
            position: absolute;
            right: 15px;
            top: 50%;
        }
        
        .heart {
            width: 20px;
            height: 18px;
            position: relative;
            margin: 5px 0;
        }
        
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 18px;
            background: #ff8ba7;
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        
        .heart::after {
            left: 12px;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        
        .heart.green::before,
        .heart.green::after {
            background: #c5e1a5;
        }
        
        .heart.blue::before,
        .heart.blue::after {
            background: #b3e5fc;
        }
        
        .footer-bear {
            position: relative;
            height: 80px;
            margin-top: 10px;
        }
        
        .green-bar {
            height: 8px;
            background: #d4e157;
            margin: 0 20px;
            border-radius: 4px;
        }
        
        .bear-placeholder {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 70px;
            background: #ffccbc;
            border-radius: 50% 50% 40% 40%;
            border: 2px solid #333;
        }
        
        .bear-ears {
            position: absolute;
            top: -10px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #ffccbc;
            border-radius: 50%;
            border: 2px solid #333;
            box-shadow: 65px 0 0 #ffccbc, 65px 0 0 2px #333;
        }
        
        .good-text {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #ffd54f;
            text-shadow: 2px 2px 0 #333;
            font-style: italic;
        }
        
        .watermark {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #999;
        }
        
        .corner-decoration {
            position: absolute;
            bottom: -10px;
            left: -10px;
            width: 30px;
            height: 30px;
            background: #e85a4f;
            border-radius: 50%;
        }
        
        .mushroom {
            position: absolute;
            bottom: 5px;
            left: 30px;
            width: 25px;
            height: 20px;
            background: #e53935;
            border-radius: 50% 50% 0 0;
            border: 2px solid #333;
        }
        
        .mushroom::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ffccbc;
            border-radius: 0 0 50% 50%;
            border: 2px solid #333;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flower-decoration">
            <div class="flower flower1"></div>
            <div class="flower flower2"></div>
            <div class="flower flower3"></div>
        </div>
        
        <div class="header">
            <div class="title-box">
                <h1 class="title">30天学会自然拼读</h1>
            </div>
        </div>
        
        <div class="blue-bar"></div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-label">数音节</span>
                <span class="section-title-en">Syllable Counting</span>
            </div>
            <div class="content-row">
                <div class="illustration">
                    <div class="people-icons">
                        <div class="person person1"></div>
                        <div class="person person2"></div>
                        <div class="person person3"></div>
                        <div class="person person4"></div>
                    </div>
                    <div class="speech-bubble">
                        有几个发音的元音（或元音组合）就有几个音节。
                    </div>
                </div>
                <div class="word-list">
                    <div class="word-grid">
                        <div class="word">cat</div>
                        <div class="word red">cake</div>
                        <div class="word">rain</div>
                        <div class="word red">row</div>
                        <div class="word">robot</div>
                        <div class="word red">teacher</div>
                        <div class="word">table</div>
                        <div class="word red">apple</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header">
                <span class="section-label green">划分音节</span>
                <span class="section-title-en">Syllable Division</span>
            </div>
            <div class="content-row">
                <div class="rules-box">
                    有时一靠后，<br>
                    常常二分手。<br>
                    组合共发音，<br>
                    一起被分走。<br>
                    词根词缀分离，<br>
                    多音节词不易，<br>
                    还请多练多听。
                </div>
                <div class="boy-illustration">
                    <div class="boy-head">
                        <div class="boy-hair"></div>
                        <div class="boy-face"></div>
                        <div class="boy-smile"></div>
                    </div>
                    <div class="boy-body"></div>
                    <div class="boy-legs">
                        <div class="boy-leg"></div>
                        <div class="boy-leg"></div>
                    </div>
                </div>
                <div class="word-list">
                    <div class="word-grid">
                        <div class="word">rabbit</div>
                        <div class="word">basket</div>
                        <div class="word red">baby</div>
                        <div class="word">robot</div>
                        <div class="word">closet</div>
                        <div class="word">planet</div>
                        <div class="word red">destroy</div>
                        <div class="word">complex</div>
                        <div class="word red">unhappy</div>
                        <div class="word red">hopefully</div>
                    </div>
                </div>
                <div class="heart-decoration">
                    <div class="heart"></div>
                    <div class="heart green"></div>
                    <div class="heart blue"></div>
                </div>
            </div>
        </div>
        
        <div class="green-bar"></div>
        
        <div class="footer-bear">
            <div class="good-text">GOOD!</div>
            <div class="bear-placeholder">
                <div class="bear-ears"></div>
            </div>
            <div class="mushroom"></div>
            <div class="watermark">@哆啦A梦爱学习 From 小红书</div>
        </div>
        
        <div class="corner-decoration"></div>
    </div>
</body>
</html>
