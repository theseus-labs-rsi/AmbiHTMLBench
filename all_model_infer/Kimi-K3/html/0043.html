<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色 2023</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fff;
    max-width: 900px;
    margin: 0 auto;
    padding: 0;
    color: #333;
  }
  .header {
    background: #e87722;
    padding: 20px 30px 25px 30px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 0 0 8px 8px;
    min-height: 120px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .copyright-icon {
    font-size: 28px;
    color: #fff;
    font-weight: bold;
  }
  .decorative-dots {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .decorative-dots span {
    display: block;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
  }
  .decorative-dots span.diamond {
    border-radius: 0;
    transform: rotate(45deg);
    width: 7px;
    height: 7px;
  }
  .main-title {
    font-size: 64px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 4px;
    flex: 1;
    text-align: center;
  }
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 30px;
  }
  .year {
    font-size: 28px;
    font-weight: bold;
    color: #1a1a1a;
  }
  .author {
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
  }
  .intro-text {
    padding: 25px 30px 30px 30px;
    font-size: 15px;
    line-height: 1.8;
    color: #333;
  }
  .card {
    margin: 20px 20px 30px 20px;
    border: 2px solid #e87722;
    border-radius: 16px;
    padding: 20px 25px 25px 25px;
    background: #fff;
  }
  .card-title {
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .diamond {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #e87722;
    transform: rotate(45deg);
  }
  .color-swatch {
    width: 100%;
    height: 140px;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    margin-bottom: 15px;
  }
  .swatch-1 {
    display: flex;
  }
  .swatch-1 .green {
    width: 30%;
    background: #1a9e5c;
    position: relative;
  }
  .swatch-1 .yellow {
    width: 40%;
    background: #f5e620;
    position: relative;
  }
  .swatch-1 .blue {
    width: 30%;
    background: #005baa;
    position: relative;
  }
  .swatch-1 svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .swatch-2 {
    display: flex;
  }
  .swatch-2 .green2 {
    width: 30%;
    background: #7cb342;
    position: relative;
  }
  .swatch-2 .black {
    width: 40%;
    background: #1a1a1a;
    position: relative;
  }
  .swatch-2 .pink {
    width: 30%;
    background: #f5226e;
    position: relative;
  }
  .swatch-2 svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .card-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #666;
  }
  .bottom-bar {
    background: #e87722;
    height: 40px;
    margin-top: 10px;
  }
  .color-swatch-container {
    position: relative;
    width: 100%;
    height: 140px;
    margin-bottom: 15px;
    border-radius: 4px;
    overflow: hidden;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="copyright-icon">©</div>
    <div class="decorative-dots">
      <span class="diamond"></span>
      <span></span>
      <span class="diamond"></span>
      <span></span>
      <span class="diamond"></span>
      <span></span>
      <span class="diamond"></span>
    </div>
  </div>
  <div class="main-title">对比色配色</div>
  <div class="header-right">
    <div class="year">2023</div>
    <div class="author">瑞</div>
  </div>
</div>

<div class="intro-text">
  对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
</div>

<div class="card">
  <div class="card-title">
    富有朝气的配色 <span class="diamond"></span>
  </div>
  <div class="color-swatch-container">
    <svg viewBox="0 0 800 140" preserveAspectRatio="none" width="100%" height="100%">
      <!-- Green background left -->
      <rect x="0" y="0" width="800" height="140" fill="#1a9e5c"/>
      <!-- Blue background right -->
      <rect x="400" y="0" width="400" height="140" fill="#005baa"/>
      <!-- Yellow wavy shape in center -->
      <path d="M 200,20 C 250,10 300,30 350,25 C 400,20 450,15 500,20 C 550,25 600,30 620,50 C 640,70 630,90 600,100 C 570,110 530,105 500,110 C 460,115 420,120 380,115 C 340,110 300,105 270,95 C 240,85 220,70 210,55 C 200,40 195,30 200,20 Z" fill="#f5e620"/>
    </svg>
  </div>
  <div class="card-desc">
    以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
  </div>
</div>

<div class="card">
  <div class="card-title">
    视觉冲击强烈的配色 <span class="diamond"></span>
  </div>
  <div class="color-swatch-container">
    <svg viewBox="0 0 800 140" preserveAspectRatio="none" width="100%" height="100%">
      <!-- Green background left -->
      <rect x="0" y="0" width="800" height="140" fill="#7cb342"/>
      <!-- Pink background right -->
      <rect x="420" y="0" width="380" height="140" fill="#f5226e"/>
      <!-- Black wavy shape in center -->
      <path d="M 220,40 C 260,30 310,45 360,40 C 410,35 460,30 510,35 C 560,40 610,50 630,70 C 650,90 640,110 610,115 C 580,120 540,115 500,118 C 450,122 400,125 360,120 C 320,115 280,110 250,100 C 220,90 200,75 205,60 C 210,48 215,42 220,40 Z" fill="#1a1a1a"/>
    </svg>
  </div>
  <div class="card-desc">
    黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
  </div>
</div>

<div class="bottom-bar"></div>

</body>
</html>
