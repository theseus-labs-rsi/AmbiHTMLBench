<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞吉欧Reggio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            position: relative;
            background: linear-gradient(rgba(30, 30, 30, 0.85), rgba(30, 30, 30, 0.9)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23333" width="100" height="100"/></svg>');
            background-size: cover;
            padding: 40px 30px 50px;
            border-radius: 8px;
        }

        .title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 12px 30px;
            display: inline-block;
            border-radius: 4px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            letter-spacing: 2px;
        }

        .bullet-item {
            margin-bottom: 18px;
            line-height: 1.8;
            font-size: 17px;
        }

        .bullet-item .bullet-text {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 3px;
            display: inline;
        }

        .bullet-item .sub-text {
            display: block;
            text-align: center;
            margin-top: 4px;
            font-size: 17px;
            line-height: 1.8;
        }

        .highlight {
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #f0c040;
            text-underline-offset: 3px;
        }

        .bullet-dot {
            color: #ffffff;
            font-size: 18px;
            margin-right: 4px;
        }

        .line-center {
            text-align: center;
        }

        .text-block {
            background-color: rgba(0, 0, 0, 0.55);
            padding: 6px 12px;
            border-radius: 4px;
            display: inline-block;
            margin: 2px 0;
        }

        .text-block-full {
            background-color: rgba(0, 0, 0, 0.55);
            padding: 6px 12px;
            border-radius: 4px;
            display: block;
            margin: 2px auto;
            text-align: center;
            max-width: 90%;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
            width: 100%;
            justify-content: center;
        }

        .item-row .dot {
            flex-shrink: 0;
            margin-right: 6px;
            margin-top: 6px;
            font-size: 16px;
        }

        .item-content {
            text-align: center;
            line-height: 2;
        }

        .item-content .line {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 3px 14px;
            border-radius: 3px;
            display: inline-block;
            margin: 2px 0;
            font-size: 17px;
        }

        .item-content .line-full {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 3px 14px;
            border-radius: 3px;
            display: block;
            margin: 2px auto;
            font-size: 17px;
            max-width: 95%;
            text-align: center;
        }

        .spacer {
            height: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">瑞吉欧Reggio</div>

        <div class="content-wrapper">
            <!-- Item 1 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line">基于皮亚杰和维果斯基等心理学家的</span><br>
                    <span class="line"><span class="highlight">建构主义心理学</span>。</span>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Item 2 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line"><span class="highlight">走进儿童心灵的儿童观</span>，以孩子的思维、</span><br>
                    <span class="line">孩子的立场來看待一场</span><br>
                    <span class="line-full">不压制孩子，让其充分表现潜能</span>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Item 3 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line">弹性课程，<span class="highlight">从儿童的兴趣和需要出发</span></span><br>
                    <span class="line-full">不让孩子生活在成人的包围之中。</span>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Item 4 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line">教师必须尽可能地<span class="highlight">减少介入</span>，更不可过度介入。</span><br>
                    <span class="line-full">与其牵着儿童的手，不如让他们用自己的双脚站立。</span>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Item 5 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line">儿童的<span class="highlight">自我表达和相互交流特别重要</span>，是儿童探索、</span><br>
                    <span class="line-full">研究、解决问题过程中的基本活动。</span>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Item 6 -->
            <div class="item-row">
                <span class="dot">●</span>
                <div class="item-content">
                    <span class="line"><span class="highlight">在共同分享中</span>，每个人均可提出最好的想法，</span><br>
                    <span class="line-full">提升和加强团队间意见交流、</span><br>
                    <span class="line-full">并刺激新奇或出乎意料的事情发生。</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
