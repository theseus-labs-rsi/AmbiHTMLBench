<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Page</title>
    <style>
        body {
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
        }

        .text-block {
            margin-bottom: 30px;
            text-align: left;
            /* The text in the image looks like a standard paragraph block */
        }

        .illustration-container {
            width: 100%;
            height: 500px;
            border: 4px solid #4a7c59; /* Green window frame color */
            border-radius: 5px;
            position: relative;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Simulating the window structure roughly */
        .window-pane {
            position: absolute;
            top: 10%;
            bottom: 0;
            width: 45%;
            border: 2px solid #4a7c59;
            background-color: #fffacd; /* Light yellow interior */
        }
        .window-pane.left { left: 5%; }
        .window-pane.right { right: 5%; }
        
        .window-center {
            position: absolute;
            top: 10%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            background: repeating-linear-gradient(
                45deg,
                #fff,
                #fff 10px,
                #4a7c59 10px,
                #4a7c59 12px
            ),
            repeating-linear-gradient(
                -45deg,
                #fff,
                #fff 10px,
                #4a7c59 10px,
                #4a7c59 12px
            );
            border: 2px solid #4a7c59;
        }

        .placeholder-text {
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
            text-align: center;
            margin-top: 200px; /* Push down */
        }

        .branches {
            position: absolute;
            top: -20px;
            right: 0;
            width: 300px;
            height: 100px;
            /* Just a visual hint */
        }
    </style>
</head>
<body>

    <div class="text-block">
        “胖胖，中午好！”丫丫一进屋就看见了胖胖，胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微笑来和我打招呼的！”听到丫丫的话，大家都笑了起来。
    </div>

    <div class="illustration-container">
        <!-- Visual hints for layout fidelity -->
        <div class="window-pane left"></div>
        <div class="window-center"></div>
        <div class="window-pane right"></div>
        
        <div class="placeholder-text">
            [Illustration: A window scene. Left pane: A mother duck and a chick. Right pane: A mother pig holding a piglet. Top: Floral branches.]
        </div>
    </div>

</body>
</html>
