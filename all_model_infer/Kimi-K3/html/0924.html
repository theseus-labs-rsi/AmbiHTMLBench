<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新媒体账号运营6种方法 - 03 做好竞品分析</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#d8c0a4; }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:#1d1d1f;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative;
    width:min(520px, 100%);
    background:#f6f1e7;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(80,55,30,.18);
    padding:0 44px 0 44px;
    overflow:visible;
  }
  /* ribbon */
  .ribbon{
    position:relative;
    display:inline-block;
    margin-top:40px;
    background:#8a5a2b;
    color:#f3e6d2;
    font-size:14px;
    font-weight:600;
    letter-spacing:1px;
    padding:9px 26px 9px 14px;
    line-height:1.2;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .ribbon::after{
    content:"";
    position:absolute;
    right:-22px;
    top:0;
    width:0;
    height:0;
    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-left:22px solid #8a5a2b;
  }
  h1{
    margin-top:34px;
    font-size:44px;
    font-weight:800;
    color:#141414;
    letter-spacing:1px;
    line-height:1.15;
    display:flex;
    align-items:baseline;
    gap:18px;
  }
  h1 .num{ font-size:42px; font-weight:900; }
  .block{ margin-top:26px; font-size:19px; line-height:1.55; color:#202020; }
  .block p{ margin:0; }
  .gap{ height:34px; }
  ol.list{
    list-style:none;
    margin-top:24px;
    font-size:19px;
    line-height:1.5;
    color:#1b1b1b;
  }
  ol.list li{ margin:0 0 2px 0; }
  ol.list .sub{ padding-left:34px; margin:0; }
  /* side notches near bottom */
  .notch{
    position:absolute;
    width:26px; height:26px;
    background:#d8c0a4;
    border-radius:50%;
    bottom:66px;
  }
  .notch.left{ left:-13px; }
  .notch.right{ right:-13px; }
  .tear{
    margin:56px -44px 0 -44px;
    height:20px;
    background:
      linear-gradient(45deg, transparent 10px, #f6f1e7 0) 0 0/22px 22px repeat-x,
      linear-gradient(-45deg, transparent 10px, #f6f1e7 0) 11px 0/22px 22px repeat-x;
    background-color:transparent;
    position:relative;
  }
  .handle{
    margin:0 -44px;
    background:#f6f1e7;
    text-align:center;
    font-size:19px;
    color:#222;
    padding:14px 0 34px 0;
    letter-spacing:.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ribbon">新媒体账号运营6种方法</div>

    <h1><span class="num">03</span><span>做好竞品分析</span></h1>

    <div class="block">
      <p>前期的竞品分析</p>
      <p>一定要花大量的时间和精力去收集信息</p>
    </div>

    <div class="gap"></div>

    <div class="block" style="margin-top:0;">
      <p>仔细分析</p>
      <p>可以从以下几个方面来看</p>
    </div>

    <ol class="list">
      <li>1、账号人设标 签</li>
      <li>2、账号选题规划</li>
      <li>3、内容脚本拆解：
        <p class="sub">结构、矛盾点、金句、痒点</p>
      </li>
      <li>4、内容形式：
        <p class="sub">场景道具服装，拍摄剪辑节奏</p>
      </li>
      <li>5、运营策略：
        <p class="sub">发布时间和频率，封面，文案，线上互动</p>
        <p class="sub">用户运营，引流途径</p>
      </li>
    </ol>

    <div class="notch left"></div>
    <div class="notch right"></div>
    <div class="tear"></div>
    <div class="handle">@新媒体运营的十万个为什么</div>
  </div>
</body>
</html>
