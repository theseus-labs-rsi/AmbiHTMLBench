<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人民日报 - 2025年1月17日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", "宋体", serif;
            font-size: 12px;
            line-height: 1.6;
            color: #000;
            background: #fff;
        }
        .newspaper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .masthead {
            flex: 1;
        }
        .masthead-title {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 72px;
            font-weight: bold;
            color: #c00;
            letter-spacing: 8px;
            line-height: 1;
        }
        .masthead-pinyin {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 18px;
            color: #c00;
            letter-spacing: 4px;
            margin-top: 5px;
            text-align: center;
        }
        .masthead-url {
            font-size: 11px;
            margin-top: 5px;
        }
        .date-box {
            border: 2px solid #000;
            padding: 8px 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.8;
            min-width: 120px;
        }
        .date-box .year-month {
            font-size: 14px;
            font-weight: bold;
        }
        .date-box .day {
            font-size: 28px;
            font-weight: bold;
        }
        /* Top news banner */
        .top-news {
            background: #000;
            color: #fff;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .top-news-title {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.4;
        }
        /* Main content area */
        .main-content {
            display: flex;
            gap: 20px;
        }
        .left-column {
            width: 60%;
        }
        .right-column {
            width: 40%;
        }
        /* Article styling */
        .article {
            margin-bottom: 15px;
        }
        .article-title {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .article-subtitle {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .article-body {
            font-size: 12px;
            line-height: 1.8;
            text-align: justify;
        }
        .article-body p {
            text-indent: 2em;
            margin-bottom: 0.5em;
        }
        /* Headline article special */
        .headline-article {
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .headline-article .article-title {
            font-size: 28px;
        }
        /* Secondary articles */
        .secondary-article {
            margin-bottom: 15px;
        }
        .secondary-article .article-title {
            font-size: 18px;
        }
        /* Right column articles */
        .right-article {
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 1px solid #ccc;
        }
        .right-article .article-title {
            font-size: 18px;
            writing-mode: vertical-rl;
            height: 200px;
            float: left;
            margin-right: 10px;
        }
        .vertical-title {
            writing-mode: vertical-rl;
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.4;
            height: 250px;
            float: left;
            margin-right: 15px;
        }
        /* Photo placeholder */
        .photo-placeholder {
            width: 100%;
            height: 200px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border: 1px solid #999;
        }
        .photo-caption {
            font-size: 11px;
            color: #333;
            text-align: center;
            margin-top: 5px;
        }
        /* Small boxes */
        .info-box {
            border: 2px solid #000;
            padding: 10px;
            margin-bottom: 15px;
        }
        .info-box-title {
            font-family: "SimHei", "黑体", sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }
        /* Bottom section */
        .bottom-section {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            border-top: 2px solid #000;
            padding-top: 15px;
        }
        .bottom-left {
            width: 30%;
        }
        .bottom-center {
            width: 40%;
        }
        .bottom-right {
            width: 30%;
        }
        /* Special labels */
        .label-red {
            color: #c00;
            font-weight: bold;
        }
        .stamp-box {
            display: inline-block;
            border: 2px solid #c00;
            color: #c00;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 14px;
            margin: 5px 0;
        }
        /* Clear floats */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        /* News ticker style */
        .news-ticker {
            background: #f0f0f0;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 11px;
        }
        /* Column text for vertical articles */
        .vertical-text-container {
            display: flex;
            gap: 15px;
        }
        .vertical-text-container .article {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="newspaper">
        <!-- Header -->
        <div class="header">
            <div class="masthead">
                <div class="masthead-title">人民日报</div>
                <div class="masthead-pinyin">RENMIN RIBAO</div>
                <div class="masthead-url">人民网网址：http://www.people.com.cn</div>
            </div>
            <div class="date-box">
                <div class="year-month">2025年1月</div>
                <div class="day">17</div>
                <div>星期五</div>
                <div>农历十二月十八</div>
                <div style="margin-top:5px; font-size:10px;">
                    人民日报社出版<br>
                    国内统一连续出版物号<br>
                    CN11-0065<br>
                    代号1-1<br>
                    第27930期<br>
                    今日20版
                </div>
            </div>
        </div>

        <!-- Top News Banner -->
        <div class="top-news">
            <div class="top-news-title">习近平同摩纳哥元首阿尔贝二世亲王<br>就中摩建交30周年</body></html>
