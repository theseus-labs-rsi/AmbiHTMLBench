<!DOCTYPE html>

<title>Document</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #e9e9e2;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    color: #111;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 540px;
    max-width: 100%;
    margin: 0 auto;
    background: #efefe8;
    padding: 34px 34px 40px 34px;
    min-height: 722px;
  }
  .item {
    margin: 0 0 42px 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .item p {
    margin: 0;
  }
  .teal { color: #3c988c; }
  .black { color: #101010; }
  .footer {
    margin-top: 8px;

    color: #3c988c;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
  }

<body>
  <div class="page">
    <div class="item">
      <p><span class="black">1、</span><span class="teal">你开始炫耀自己，往往都是灾难的开始。</span></p>
      <p><span class="black">就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。</span></p>
    </div>

    <div class="item">
      <p><span class="black">2、一个冷知识：</span><span class="teal">屏蔽力是一个人最顶级的能力</span><span class="black">，任何消耗你的人和事，多看一眼都是你的不对。</span></p>
    </div>

    <div class="item">
      <p><span class="black">3、大学时辅导员说了一句受益一生的话：“</span><span class="teal">你不用变得很外向，内向挺好的，</span><span class="black">但需要你发言的时候，一定要勇敢。”正所谓：君子可内敛不可懦弱，面不公可起而论之。</span></p>
    </div>

    <div class="footer">商业思维｜底层逻辑｜个人提升</div>
  </div>
