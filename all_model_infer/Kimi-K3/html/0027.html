<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核桃奶酪贝果 / 香蕉可可贝果</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#f47c1f;
    font-family:"Yuanti SC","YouYuan","STYuanti","Microsoft YaHei","PingFang SC",sans-serif;
    color:#5b3a1c;
    display:flex;
    justify-content:center;
    padding:18px 0;
  }
  .card{
    position:relative;
    width:540px;
    height:720px;
    border:3px solid #e07a1e;
    border-radius:4px;
    background-color:#fffaf2;
    background-image:
      repeating-linear-gradient(0deg, rgba(238,176,116,.28) 0 12px, rgba(238,176,116,0) 12px 24px),
      repeating-linear-gradient(90deg, rgba(238,176,116,.28) 0 12px, rgba(238,176,116,0) 12px 24px);
    overflow:hidden;
  }
  .title{
    position:absolute;
    font-size:34px;
    font-weight:900;
    color:#4c2f14;
    letter-spacing:1px;
    white-space:nowrap;
  }
  .step{
    position:absolute;
    font-size:17px;
    font-weight:800;
    color:#4c2f14;
    line-height:1.55;
  }
  .ing-label{
    position:absolute;
    font-size:14px;
    font-weight:800;
    color:#4c2f14;
    text-align:center;
  }
  .placeholder{
    position:absolute;
    background:rgba(255,246,234,.55);
    border:1.5px dashed #d9a066;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#a97f4e;
    font-size:11px;
    font-weight:700;
    padding:4px;
  }
  .arrow{
    position:absolute;
    font-size:26px;
    color:#8a6a45;
    font-weight:900;
    line-height:1;
  }
  .sign-yuanqi{
    position:absolute;
    left:38px;top:40px;
    width:86px;height:74px;
    background:#fffdf6;
    border:3px solid #f2c14e;
    border-radius:12px;
    transform:rotate(-11deg);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    color:#4f74a8;
    font-size:22px;font-weight:900;line-height:1.15;
    box-shadow:0 1px 0 rgba(0,0,0,.05);
  }
  .sign-yuanqi::after{
    content:"";position:absolute;left:64px;top:70px;width:3px;height:34px;
    background:#e8b23f;transform:rotate(24deg);transform-origin:top;
  }
  .sign-pingan{
    position:absolute;
    left:352px;top:474px;
    width:78px;height:86px;
    background:#ef3f35;
    border-radius:8px;
    transform:rotate(11deg);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    color:#fff;font-size:22px;font-weight:900;line-height:1.2;
    box-shadow:0 2px 0 rgba(0,0,0,.08);
  }
  .sign-pingan::after{
    content:"";position:absolute;left:38px;top:84px;width:4px;height:56px;
    background:#f2c14e;transform:rotate(-14deg);transform-origin:top;
  }
  .divider{
    position:absolute;left:0;right:0;top:356px;
    border-top:3px dashed #cf7a26;
  }
  .handle{
    position:absolute;font-size:15px;font-weight:800;color:#4c2f14;
  }
</style>
</head>
<body>
<div class="card">

  <!-- ===== Top recipe: 核桃奶酪贝果 ===== -->
  <div class="sign-yuanqi">元气<br>满满</div>

  <div class="title" style="left:132px;top:36px;">核桃奶酪贝果</div>
  <div class="placeholder" style="left:372px;top:38px;width:38px;height:34px;border-radius:50%;">[贝果]</div>

  <div class="placeholder" style="left:42px;top:112px;width:148px;height:126px;border-radius:50%;">[Image: 核桃奶酪贝果成品]</div>

  <div class="step" style="left:200px;top:80px;">1.准备材料</div>

  <div class="placeholder" style="left:200px;top:108px;width:62px;height:44px;">[奶酪]</div>
  <div class="ing-label" style="left:200px;top:156px;width:62px;">奶酪</div>

  <div class="placeholder" style="left:278px;top:104px;width:56px;height:50px;border-radius:50%;">[贝果]</div>
  <div class="ing-label" style="left:278px;top:156px;width:56px;">贝果</div>

  <div class="placeholder" style="left:340px;top:96px;width:56px;height:56px;">[核桃仁]</div>
  <div class="ing-label" style="left:340px;top:156px;width:56px;">核桃仁</div>

  <div class="step" style="left:196px;top:176px;width:330px;">
    2.核桃仁烤2分钟左右，搓掉皮，<br>
    捣碎后和奶酪混合到一起，涂抹<br>
    在贝果上
  </div>

  <div class="placeholder" style="left:210px;top:262px;width:80px;height:70px;">[烤箱]</div>
  <div class="arrow" style="left:302px;top:286px;">⤳</div>
  <div class="placeholder" style="left:324px;top:270px;width:82px;height:52px;border-radius:50%;">[碗]</div>
  <div class="arrow" style="left:414px;top:286px;">⤳</div>
  <div class="placeholder" style="left:436px;top:268px;width:66px;height:54px;border-radius:50%;">[涂抹贝果]</div>

  <div class="placeholder" style="left:34px;top:244px;width:96px;height:160px;border-radius:12px;">[Image: 卡通女孩]</div>

  <div class="divider"></div>

  <!-- ===== Bottom recipe: 香蕉可可贝果 ===== -->
  <div class="title" style="left:138px;top:368px;">香蕉可可贝果</div>
  <div class="placeholder" style="left:382px;top:370px;width:38px;height:34px;border-radius:50%;">[贝果]</div>

  <div class="step" style="left:48px;top:420px;">1.准备材料</div>
  <div class="handle" style="left:330px;top:421px;">@哎呀牌绿豆汤</div>

  <div class="placeholder" style="left:54px;top:456px;width:60px;height:42px;">[奶酪]</div>
  <div class="ing-label" style="left:54px;top:506px;width:60px;">奶酪</div>

  <div class="placeholder" style="left:130px;top:452px;width:56px;height:50px;border-radius:50%;">[贝果]</div>
  <div class="ing-label" style="left:130px;top:506px;width:56px;">贝果</div>

  <div class="placeholder" style="left:202px;top:446px;width:34px;height:56px;">[香蕉]</div>
  <div class="ing-label" style="left:196px;top:506px;width:48px;">香蕉</div>

  <div class="placeholder" style="left:250px;top:448px;width:40px;height:54px;">[可可粉]</div>
  <div class="ing-label" style="left:244px;top:506px;width:56px;">可可粉</div>

  <div class="step" style="left:40px;top:534px;width:310px;">
    2.奶酪加入可可粉，搅拌均匀涂<br>
    抹在贝果上摆上水果
  </div>

  <div class="sign-pingan">平安<br>喜乐</div>

  <div class="placeholder" style="left:50px;top:606px;width:82px;height:50px;border-radius:50%;">[碗]</div>
  <div class="arrow" style="left:140px;top:592px;">⤳</div>
  <div class="placeholder" style="left:164px;top:604px;width:70px;height:52px;border-radius:50%;">[可可贝果]</div>
  <div class="arrow" style="left:240px;top:592px;">⤳</div>
  <div class="placeholder" style="left:256px;top:600px;width:70px;height:58px;border-radius:50%;">[香蕉贝果]</div>
  <div class="arrow" style="left:318px;top:566px;">⤦</div>
  <div class="placeholder" style="left:318px;top:560px;width:34px;height:22px;">[黄油]</div>

  <div class="placeholder" style="left:356px;top:554px;width:154px;height:132px;border-radius:50%;">[Image: 香蕉可可贝果成品]</div>

</div>
</body>
</html>
