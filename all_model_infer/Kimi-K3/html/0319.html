<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回避行为</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#e9e9e9;}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;color:#111;}
  .page{
    position:relative;
    width:540px;
    height:720px;
    margin:0 auto;
    background:#ffffff;
    overflow:hidden;
  }
  .blue{background:#1f3fae;}
  /* top-left frame */
  .tl-v{position:absolute;left:0;top:0;width:17px;height:205px;}
  .tl-h{position:absolute;left:0;top:0;width:168px;height:13px;border-top-left-radius:22px;}
  .tl-notch{position:absolute;left:0;top:198px;width:6px;height:22px;clip-path:polygon(0 0,100% 0,0 100%);}
  .tr-chip{position:absolute;right:0;top:0;width:14px;height:0;}
  /* right middle tab */
  .r-tab{position:absolute;right:0;top:191px;width:16px;height:137px;clip-path:polygon(100% 0,100% 100%,0 88%,0 12%);}
  /* bottom frame */
  .bl-v{position:absolute;left:0;bottom:0;width:17px;height:112px;}
  .bl-h{position:absolute;left:0;bottom:0;width:312px;height:14px;border-bottom-left-radius:22px;}
  .bl-h-cut{position:absolute;left:298px;bottom:0;width:22px;height:30px;clip-path:polygon(0 100%,100% 100%,72% 0);}
  .br-h{position:absolute;right:0;bottom:0;width:144px;height:14px;border-bottom-right-radius:22px;}
  .br-h-cut{position:absolute;right:130px;bottom:0;width:22px;height:30px;clip-path:polygon(0 100%,100% 100%,28% 0);}
  .br-v{position:absolute;right:0;bottom:0;width:16px;height:100px;}

  .content{position:relative;z-index:2;padding:64px 34px 0 31px;}
  .num{font-size:63px;line-height:1;font-weight:800;color:#000;letter-spacing:1px;}
  h1.title{margin-top:26px;font-size:66px;line-height:1.12;font-weight:900;color:#000;letter-spacing:1px;}
  p.lead{margin-top:112px;width:476px;font-size:27px;line-height:1.78;font-weight:800;color:#000;}
  p.body{margin-top:36px;width:482px;font-size:27px;line-height:1.82;font-weight:400;color:#333;}
</style>
</head>
<body>
  <div class="page">
    <div class="blue tl-h"></div>
    <div class="blue tl-v"></div>
    <div class="blue tl-notch"></div>
    <div class="blue r-tab"></div>
    <div class="blue bl-v"></div>
    <div class="blue bl-h"></div>
    <div class="blue bl-h-cut"></div>
    <div class="blue br-h"></div>
    <div class="blue br-h-cut"></div>
    <div class="blue br-v"></div>

    <div class="content">
      <div class="num">03</div>
      <h1 class="title">回避行为</h1>
      <p class="lead">自觉或不自觉地回避曾经的某些人、事、物。</p>
      <p class="body">比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……</p>
    </div>
  </div>
</body>
</html>
