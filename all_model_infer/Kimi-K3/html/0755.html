<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐诗六首</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#eaa23d;
    font-family:"Kaiti SC","STKaiti","KaiTi","楷体","TW-Kai","SimSun","宋体",serif;
    color:#141414;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:600px;
    margin:0 auto;
    padding:26px 24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
  }
  .card{
    background-color:#ffffff;
    background-image:
      linear-gradient(#e6e6e6 1px, transparent 1px),
      linear-gradient(90deg,#e6e6e6 1px, transparent 1px);
    background-size:23px 23px;
    border:1px solid #d8cbae;
    padding:15px 16px 18px 27px;
    min-height:198px;
  }
  h2.t{
    margin:0 0 3px 0;
    font-size:23px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:1px;
    text-align:left;
  }
  p.author{
    margin:0 0 11px 0;
    font-size:15px;
    line-height:1.3;
    text-align:left;
    padding-left:33px;
    letter-spacing:.5px;
  }
  p.poem{
    margin:0;
    font-size:21px;
    line-height:1.5;
    text-align:left;
    letter-spacing:1px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <section class="card">
      <h2 class="t">《登鹳雀楼》</h2>
      <p class="author">（唐-王之涣）</p>
      <p class="poem">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</p>
    </section>
    <section class="card">
      <h2 class="t">《静夜思》</h2>
      <p class="author">（唐-李白）</p>
      <p class="poem">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</p>
    </section>
    <section class="card">
      <h2 class="t">《古朗月行》</h2>
      <p class="author">（唐-李白）</p>
      <p class="poem">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</p>
    </section>
    <section class="card">
      <h2 class="t">《寻隐者不遇》</h2>
      <p class="author">（唐-贾岛）</p>
      <p class="poem">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</p>
    </section>
    <section class="card">
      <h2 class="t">《咏鹅》</h2>
      <p class="author">（唐-骆宾王）</p>
      <p class="poem">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</p>
    </section>
    <section class="card">
      <h2 class="t">《草》</h2>
      <p class="author">（唐-白居易）</p>
      <p class="poem">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</p>
    </section>
  </div>
</body>
</html>
