<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际博物馆日 International Museum Day</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#c9c9c1;font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;}
  .poster{position:relative;width:440px;height:622px;margin:0 auto;background:#eae8e0;color:#2f4a41;overflow:hidden;}
  /* faint ornamental swirls (background pattern) */
  .orn{position:absolute;border-radius:50%;pointer-events:none;opacity:.5;}
  .orn1{right:-70px;top:-40px;width:230px;height:230px;border:2px solid rgba(120,118,105,.22);box-shadow:inset 0 0 0 14px rgba(120,118,105,.10),inset 0 0 0 34px rgba(120,118,105,.08);}
  .orn2{left:-40px;top:230px;width:170px;height:170px;border:2px solid rgba(120,118,105,.20);box-shadow:inset 0 0 0 12px rgba(120,118,105,.10),inset 0 0 0 30px rgba(120,118,105,.07);}
  /* main title */
  .title{position:absolute;left:31px;top:13px;font-size:66px;font-weight:800;line-height:1.08;letter-spacing:3px;color:#2f4a41;}
  .en-title{position:absolute;left:162px;top:27px;font-size:15px;line-height:1.3;letter-spacing:.4px;color:#333;font-family:"Times New Roman",serif;}
  /* red seal */
  .seal{position:absolute;left:231px;top:43px;width:38px;height:40px;background:#b9352b;color:#fff;font-size:14px;line-height:1;letter-spacing:1px;padding:3px 4px;writing-mode:vertical-rl;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.06) inset;}
  /* top-right slogan */
  .slogan{position:absolute;right:24px;top:24px;font-size:17px;font-weight:700;letter-spacing:7px;color:#2f4a41;writing-mode:vertical-rl;}
  .slogan .sp{display:inline-block;margin-left:12px;}
  /* right vertical description */
  .desc{position:absolute;right:16px;top:142px;height:212px;font-size:9px;line-height:1.6;letter-spacing:.5px;color:#3c3c3c;writing-mode:vertical-rl;text-align:justify;}
  /* central bronze photograph placeholder */
  .bronze{position:absolute;left:105px;top:171px;width:250px;height:420px;background:linear-gradient(180deg,#d9d6cc,#c6c3b8);border:1px solid rgba(90,95,85,.35);display:flex;align-items:center;justify-content:center;text-align:center;}
  .bronze .cap{font-size:11px;color:#6a6f66;padding:0 18px;line-height:1.6;}
  /* left rail with dots */
  .rail{position:absolute;left:16px;top:176px;height:412px;border-left:1px solid #5c5c5c;opacity:.65;}
  .rail::before,.rail::after{content:"";position:absolute;left:-3px;width:5px;height:5px;border-radius:50%;background:#5c5c5c;}
  .rail::before{top:0;} .rail::after{bottom:0;}
  /* time block */
  .time{position:absolute;left:23px;top:179px;font-size:17px;line-height:1.12;color:#1f1f1f;font-weight:600;}
  .time .lab{font-size:18px;}
  .time .yr{margin-top:4px;}
  .date{margin-top:2px;font-family:"Times New Roman",serif;font-weight:700;}
  .date em{font-style:normal;font-size:20px;}
  .date b{display:inline-block;font-size:34px;font-weight:400;line-height:.6;margin:0 1px;vertical-align:-6px;color:#1f1f1f;}
  .date em.t{vertical-align:top;} .date em.b{vertical-align:bottom;}
  /* small verse */
  .verse{position:absolute;left:40px;top:285px;display:flex;flex-direction:row-reverse;gap:9px;}
  .verse .c{writing-mode:vertical-rl;font-size:16px;letter-spacing:13px;line-height:1;color:#1f1f1f;font-weight:600;}
  /* small thumbnail placeholder */
  .thumb{position:absolute;left:35px;top:424px;width:38px;height:69px;background:linear-gradient(180deg,#d6d3c8,#c0bdb2);border:1px solid rgba(90,95,85,.4);display:flex;align-items:center;justify-content:center;}
  .thumb .cap{font-size:7px;color:#6a6f66;text-align:center;line-height:1.4;padding:0 2px;}
  .raildot{position:absolute;left:13px;top:516px;width:6px;height:6px;border-radius:50%;background:#5c5c5c;}
  /* bottom captions */
  .bl{position:absolute;left:23px;top:537px;font-size:14px;line-height:1.55;font-weight:700;color:#2f4a41;}
  .bl .py,.br .py{font-family:"Times New Roman",serif;font-weight:600;letter-spacing:1px;font-size:13px;color:#2f4a41;}
  .br{position:absolute;right:21px;top:540px;font-size:14px;line-height:1.55;font-weight:700;color:#2f4a41;text-align:left;}
</style>
</head>
<body>
  <div class="poster">
    <div class="orn orn1"></div>
    <div class="orn orn2"></div>

    <div class="title">国际<br>博物馆日</div>

    <div class="en-title">International<br>Museum<br>Day</div>
    <div class="seal">重庆[?][?]</div>

    <div class="slogan">穿越千古<span class="sp">追梦今古</span></div>

    <div class="desc">国际博物馆日定于每年的5月18日，是由国际博物馆协会（ICOM）发起并创立的。1977年国际博物馆协会为促进全球博物馆事业的健康发展，吸引全社会公众对博物馆事业的了解、参与和关注，向全世界宣告1977年5月18日为第一个国际博物馆日，并每年为国际博物馆日确定活动主题。</div>

    <figure class="bronze placeholder"><div class="cap">[Photo: bronze ritual hu vessel with taotie mask and dragon handles, centered]</div></figure>

    <div class="rail"></div>

    <div class="time">
      <span class="lab">&#8226;时间：</span><br>
      <span class="yr">&nbsp;2021</span><br>
      <span class="date">&nbsp;<em class="t">5</em><b>/</b><em class="b">18</em></span>
    </div>

    <div class="verse">
      <span class="c">两处情怀</span>
      <span class="c">一处文物</span>
    </div>

    <figure class="thumb placeholder"><div class="cap">[Photo: small bronze vessel, lower-left]</div></figure>
    <div class="raildot"></div>

    <div class="bl">与历史相遇<br><span class="py">MING</span><br>明兴亡</div>

    <div class="br">打开时代<br><span class="py">DE</span><br>任意门</div>
  </div>
</body>
</html>
