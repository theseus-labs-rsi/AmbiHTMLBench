<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写法对比</title>
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  html,body{margin:0;padding:0;background:#7a7a7a;}
  .page{width:540px;height:720px;margin:0 auto;position:relative;background:#e7d6a4;font-family:"SimHei","Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;}
  /* Top beige panel */
  .panel-top{position:relative;width:540px;height:295px;background:#e9d7a5;}
  .top-left{position:absolute;left:56px;top:72px;width:300px;color:#26335f;}
  .wrote-row{display:flex;align-items:center;}
  .wrote-label{font-size:34px;font-weight:700;letter-spacing:1px;color:#26335f;}
  .red-o{display:inline-block;width:54px;height:54px;margin-left:28px;border:16px solid #c0161b;border-radius:50%;box-sizing:content-box;}
  .top-sentence{margin-top:46px;font-size:27px;font-weight:700;line-height:1.55;color:#26335f;}
  .kid{position:absolute;right:-2px;top:84px;width:168px;height:212px;background:#9aa0a6;border:3px solid #6f747b;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:14px;}
  .mom-happy{position:absolute;left:330px;bottom:2px;width:210px;z-index:2;text-align:right;color:#ffffff;font-size:26px;font-weight:800;white-space:nowrap;
    text-shadow:2px 0 0 #1a1a1a,-2px 0 0 #1a1a1a,0 2px 0 #1a1a1a,0 -2px 0 #1a1a1a,2px 2px 0 #1a1a1a,-2px 2px 0 #1a1a1a,2px -2px 0 #1a1a1a,-2px -2px 0 #1a1a1a;}
  /* Bottom purple panel */
  .panel-bottom{position:relative;width:540px;height:425px;background:#4b4569;color:#d8ba67;font-family:"STZhongsong","SimSun","Songti SC",serif;}
  .pd-title{position:absolute;left:57px;top:58px;font-size:35px;font-weight:700;color:#d8ba67;letter-spacing:1px;display:flex;align-items:flex-start;}
  .tick{display:inline-block;margin-left:14px;color:#63b83d;font-family:Arial,"Helvetica Neue",sans-serif;font-size:76px;font-weight:900;line-height:.7;transform:translateY(2px) rotate(-4deg);}
  .pd-body{position:absolute;left:57px;top:150px;width:432px;font-size:24px;line-height:1.56;color:#d8ba67;text-align:justify;}
  .pd-src{position:absolute;left:57px;top:392px;width:432px;text-align:right;font-size:17px;color:#d8ba67;}
</style>
</head>
<body>
<div class="page">
  <div class="panel-top">
    <div class="top-left">
      <div class="wrote-row">
        <span class="wrote-label">我写的：</span>
        <span class="red-o"></span>
      </div>
      <div class="top-sentence">我们民族的追梦史充满<br>艰辛。</div>
    </div>
    <div class="kid placeholder">[Photo: cutout sticker of a young boy in a red shirt with a strained smile, right side]</div>
    <div class="mom-happy">学习使我妈快乐</div>
  </div>
  <div class="panel-bottom">
    <div class="pd-title">人民日报写的：<span class="tick">✓</span></div>
    <div class="pd-body">我们这个民族，有数千年辉煌文明、有数百年<br>
深重苦难，也有百余年不息奋斗，追寻梦想的<br>
道路尤其艰难曲折。百余年来的救亡图存、道<br>
路探索，多少仁人志士留下“有心杀贼，无力<br>
回天”的悲愤，付出“春云碧血，秋雨黄花”<br>
的牺牲，发出“拼将十万头颅血，须把乾坤力<br>
挽回”的呐喊。</div>
    <div class="pd-src">——2013.4.1《筑就民族复兴的“中国梦”》</div>
  </div>
</div>
</body>
</html>
