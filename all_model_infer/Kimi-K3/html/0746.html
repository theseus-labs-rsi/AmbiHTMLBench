<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一张图搞定HMO</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background-color:#9fd0e4;
    background-image:
      linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
    background-size: 22px 22px;
    padding: 14px 10px;
    display:flex; justify-content:center;
  }
  .page {
    position:relative;
    width:100%;
    max-width:520px;
    background:#ffffff;
    border-radius:26px;
    padding:22px 16px 26px;
    box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  /* spiral binding on left edge */
  .bind{
    position:absolute; left:56px; top:96px; width:10px;
  }
  .bind i{
    display:block; width:8px; height:8px; border:2px solid #8a8a8a;
    border-radius:50%; margin:0 0 14px 0; background:transparent;
  }
  .cow{
    position:absolute; right:-6px; top:78px; width:92px; height:92px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:11px; color:#666;
  }
  h1{
    text-align:center;
    font-size:44px;
    font-weight:900;
    letter-spacing:2px;
    color:#f0837c;
    -webkit-text-stroke:2px #ffffff;
    text-shadow:
      0 0 0 #fff,
      3px 3px 0 #fff,
      -3px 3px 0 #fff,
      3px -3px 0 #fff,
      -3px -3px 0 #fff,
      4px 5px 0 rgba(190,120,110,.55);
    margin:0 0 18px;
    line-height:1.15;
  }
  .intro{
    background:#b7e4f6;
    border-radius:16px;
    padding:16px 18px;
    color:#5b4636;
    font-size:15.5px;
    font-weight:700;
    line-height:1.75;
    text-align:justify;
  }
  .intro sup, .bar sup, .note sup{ font-size:10px; font-weight:900; }
  .section{ margin-top:18px; }
  .bar{
    background:linear-gradient(#ffa052,#ff7a1a);
    border:2px solid #ef9a4d;
    border-radius:16px;
    padding:8px 14px;
    color:#ffffff;
    font-weight:900;
    font-size:19px;
    letter-spacing:.5px;
    text-shadow:1px 1px 0 rgba(150,80,20,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
    white-space:nowrap;
  }
  .content{
    background:#efefef;
    border-radius:14px;
    margin:-2px 4px 0;
    padding:16px 14px 14px;
    color:#4a4a4a;
    font-size:16px;
    font-weight:800;
    line-height:1.65;
    text-align:center;
  }
  .content .just{ display:block; text-align:justify; }
</style>
</head>
<body>
  <div class="page">
    <div class="bind" aria-hidden="true"><i></i><i></i></div>

    <figure class="cow placeholder" style="border:none;">[Image: 卡通奶牛, top-right]</figure>

    <h1>一张图搞定HMO</h1>

    <div class="intro">
      HMO-中文“母乳低聚糖”，是源乳中的第一大免疫<br>
      活性营养<sup>2</sup>，而且含量还是乳铁蛋白的12倍<sup>7</sup>，在牛乳、<br>
      羊乳中都没有这个成分，被誉为“乳黄金”。
    </div>

    <div class="section">
      <div class="bar">HMO具有调节肠道菌群平衡作用<sup>3-6</sup></div>
      <div class="content">
        肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自<br>
        于肠道，因此呵护好宝宝肠道对提升保护力非常重要。<br>
        而HMO可以促进有益菌生长，提高保护力。
      </div>
    </div>

    <div class="section">
      <div class="bar">HMO为宝宝建立一道健康防护屏障<sup>5-6</sup></div>
      <div class="content">
        HMO能够为宝宝建立一道健康防护屏障，<br>
        防止有害菌侵扰。
      </div>
    </div>

    <div class="section">
      <div class="bar">HMO激发免疫系统，提高宝宝保护力<sup>6</sup></div>
      <div class="content">
        HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝<br>
        保护力，增强宝宝体质。<sup>7-8</sup>
      </div>
    </div>
  </div>
</body>
</html>
