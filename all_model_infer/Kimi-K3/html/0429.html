<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国色·藕荷</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #dcb7bf;
    color: #38292c;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  }
  .frame {
    position: relative;
    box-sizing: border-box;
    margin: 22px;
    border: 1px solid rgba(70, 50, 56, 0.75);
    min-height: calc(100vh - 44px);
    padding: 66px 48px 74px 76px;
  }
  .block {
    line-height: 2.05;
    font-size: 19px;
    letter-spacing: 0.5px;
  }
  .block .title {
    margin: 0 0 30px 0;
  }
  .block p {
    margin: 0 0 26px 0;
  }
  .block p.last {
    margin-bottom: 0;
  }
  .block + .block {
    margin-top: 66px;
  }
  .footer {
    position: absolute;
    left: 24px;
    right: 18px;
    bottom: 18px;
    font-size: 12px;
    color: rgba(60, 42, 48, 0.85);
    letter-spacing: 0.5px;
  }
  .footer .right {
    float: right;
  }
  .footer .logo {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 1px solid rgba(60,42,48,0.8);
    vertical-align: -2px;
    margin-right: 3px;
    background:
      linear-gradient(rgba(60,42,48,.5),rgba(60,42,48,.5)) 33% 0/1px 100% no-repeat,
      linear-gradient(rgba(60,42,48,.5),rgba(60,42,48,.5)) 66% 0/1px 100% no-repeat,
      linear-gradient(rgba(60,42,48,.5),rgba(60,42,48,.5)) 0 33%/100% 1px no-repeat,
      linear-gradient(rgba(60,42,48,.5),rgba(60,42,48,.5)) 0 66%/100% 1px no-repeat;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="block">
      <p class="title">△桂花露</p>
      <p>〔功用〕开胃消食，宽胸化痰</p>
      <p>〔药物〕桂花500克</p>
      <p class="last">〔制法〕于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</p>
    </div>

    <div class="block">
      <p class="title">△荷花露</p>
      <p>〔功用〕清暑凉营</p>
      <p>〔药物〕白荷花500克</p>
      <p class="last">〔制法〕取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</p>
    </div>

    <div class="footer">
      <span>〔中国色·藕荷〕</span>
      <span class="right"><span class="logo"></span>图虫APP</span>
    </div>
  </div>
</body>
</html>
