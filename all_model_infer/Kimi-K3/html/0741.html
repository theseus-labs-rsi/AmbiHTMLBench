<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房注意事项</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#e9e9e9;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;}
  .page{width:540px;height:720px;margin:0 auto;background:#607668;position:relative;overflow:hidden;}
  .card{position:absolute;left:27px;top:27px;width:483px;height:676px;background:#ffffff;padding:22px 34px 26px 32px;}
  h1.title{text-align:center;color:#739678;font-size:33px;font-weight:800;letter-spacing:2px;line-height:1;margin:2px 0 18px;}
  .sec{display:flex;align-items:flex-end;margin:6px 0 14px;}
  .ring{flex:0 0 auto;width:33px;height:33px;border:5px solid #a30000;border-radius:50%;margin-right:2px;transform:translateY(3px);}
  .sec-name{font-size:27px;font-weight:800;color:#111;border-bottom:3px solid #71201f;line-height:1;padding:0 62px 2px 0;}
  .item{font-size:19px;color:#151515;line-height:1.22;margin:0 0 17px;letter-spacing:.2px;white-space:nowrap;}
  .other .item{margin-bottom:15px;}
  .sec.other-head{margin-top:6px;margin-bottom:12px;}
  .sec.other-head .ring{width:31px;height:31px;border-width:5px;}
  .sec.other-head .sec-name{font-size:26px;padding-right:60px;}
  /* faint watermark */
  .wm{position:absolute;left:286px;top:282px;color:#c9c9c9;opacity:.55;text-align:center;font-size:17px;line-height:1.5;pointer-events:none;user-select:none;}
  .wm .heart{font-size:26px;display:block;margin-bottom:2px;color:#cfcfcf;}
  .wm .from{font-size:14px;}
  /* right-side animal illustration footprint */
  .placeholder{position:absolute;border:1px dashed #bbb;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f0f0f0 6px,#f0f0f0 12px);color:#9a9a9a;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;}
  .cat{right:0;top:362px;width:120px;height:168px;border-radius:8px;}
  .bottom-mini{position:absolute;left:286px;bottom:-2px;width:26px;height:30px;border-radius:4px;}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <h1 class="title">租房注意事项</h1>

    <div class="sec">
      <span class="ring"></span>
      <span class="sec-name">卧室</span>
    </div>

    <p class="item">1.空调是否正常使用，空调排水位置，外机位置</p>
    <p class="item">2.所有电灯，插座是否ok</p>
    <p class="item">3.床都否OK，躺下翻身是否有响声</p>
    <p class="item">4.卧室地板情况</p>
    <p class="item">5.衣柜是否完好</p>
    <p class="item">6.各个房间是否能反锁</p>
    <p class="item">7.装修情况，不要太新，也不要太久</p>
    <p class="item">8.排查针孔摄像头</p>
    <p class="item">9.wifi信号情况</p>

    <div class="sec other-head">
      <span class="ring"></span>
      <span class="sec-name">其他</span>
    </div>

    <div class="other">
      <p class="item">1.各类遥控器清点&nbsp;&nbsp;2.所有钥匙清点</p>
      <p class="item">3.所有墙面情况，有无裂痕掉漆，脱皮</p>
      <p class="item">4.所有水龙头一起打开，看水压是否足够</p>
      <p class="item">5.如果是燃气热水器，也留意下安全使用情况</p>
    </div>

    <div class="wm">
      <span class="heart">♡</span>
      @带毛的栗子<br>
      <span class="from">From 小红书</span>
    </div>

    <figure class="placeholder cat">[Illustration: white cartoon cat with red cheeks, waving, right side]</figure>
  </div>
  <figure class="placeholder bottom-mini">[Illustration: small object at bottom edge]</figure>
</div>
</body>
</html>
