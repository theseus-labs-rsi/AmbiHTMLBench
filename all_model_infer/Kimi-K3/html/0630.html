<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            font-size: 16px;
            line-height: 1.6;
            background: #f5f5f0;
            padding: 20px;
        }
        
        .notebook-page {
            width: 700px;
            min-height: 900px;
            background: #fffef8;
            margin: 0 auto;
            padding: 30px 40px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
            position: relative;
        }
        
        .content-block {
            margin-bottom: 20px;
        }
        
        .arrow-flow {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        
        .arrow {
            font-size: 14px;
        }
        
        .title-line {
            font-size: 15px;
            margin-bottom: 8px;
        }
        
        .indent-block {
            padding-left: 20px;
        }
        
        .bracket-structure {
            position: relative;
            padding-left: 60px;
        }
        
        .bracket-left {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 60px;
            line-height: 1;
            font-family: serif;
            color: #333;
        }
        
        .sub-item {
            margin-left: 40px;
            position: relative;
        }
        
        .sub-item::before {
            content: "—";
            position: absolute;
            left: -30px;
            top: 0;
        }
        
        .sub-sub-item {
            margin-left: 60px;
        }
        
        .dashed-line {
            border-bottom: 1px dashed #333;
            margin: 15px 0;
        }
        
        .highlight-box {
            display: inline-block;
            background: #e8e8e8;
            padding: 2px 6px;
            margin: 2px;
        }
        
        .numbered-list {
            list-style: none;
            padding-left: 10px;
        }
        
        .numbered-list li {
            margin-bottom: 8px;
            text-indent: 0;
        }
        
        .circle-num {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 1px solid #333;
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            margin-right: 6px;
            vertical-align: middle;
        }
        
        .tree-branch {
            position: relative;
            padding-left: 80px;
        }
        
        .branch-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 40px;
        }
        
        .branch-line::before {
            content: "";
            position: absolute;
            left: 0;
            top: 15px;
            width: 30px;
            height: 1px;
            background: #333;
        }
        
        .branch-line::after {
            content: "";
            position: absolute;
            left: 0;
            top: 15px;
            width: 1px;
            height: 60px;
            background: #333;
        }
        
        .tree-content {
            padding-top: 10px;
        }
        
        .tree-item {
            margin-bottom: 12px;
            position: relative;
        }
        
        .tree-item::before {
            content: "—";
            position: absolute;
            left: -35px;
            top: 0;
        }
        
        .nested-tree {
            margin-left: 30px;
            margin-top: 5px;
        }
        
        .nested-tree .tree-item::before {
            content: "";
            position: absolute;
            left: -25px;
            top: 8px;
            width: 15px;
            height: 1px;
            background: #333;
        }
        
        .small-text {
            font-size: 14px;
        }
        
        .correction-mark {
            display: inline-block;
            background: #d0d0d0;
            padding: 0 3px;
            margin: 0 2px;
        }
        
        .arrow-down {
            display: inline-block;
            transform: rotate(90deg);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="notebook-page">
        <!-- 第一块：内质网到高尔基体 -->
        <div class="content-block">
            <div class="arrow-flow">
                <span>内质网</span>
                <span class="arrow">→</span>
                <span>高尔基体</span>
            </div>
        </div>
        
        <!-- 第二块：cell的生物膜系统 -->
        <div class="content-block">
            <div class="title-line">
                cell的生物膜系统 <span style="margin-left: 30px;">cell膜</span>
            </div>
            <div class="indent-block" style="margin-left: 120px; margin-top: -5px;">
                cell器膜
            </div>
            <div class="indent-block" style="margin-left: 120px;">
                核膜
            </div>
            <div style="margin-top: 5px; margin-left: 60px;">
                ↓ 作用
            </div>
        </div>
        
        <!-- 编号列表 -->
        <div class="content-block">
            <ol class="numbered-list" style="padding-left: 5px;">
                <li>
                    <span class="circle-num">1</span>使cell具有相对稳定的内部环境
                    <div style="margin-left: 28px; margin-top: 5px;">
                        同时，在cell与外部环境进行物质运输、能量转<br>
                        化、信息传递的过程中起决定性作用
                    </div>
                </li>
                <li>
                    <span class="circle-num">2</span>广阔的膜面积为许多酶提供了附着位点
                </li>
                <li>
                    <span class="circle-num">3</span>外障 → 保证了cell生命活动高效、有序的<br>
                    <span style="margin-left: 28px;">进行</span>
                </li>
            </ol>
        </div>
        
        <!-- 分隔线 -->
        <div class="dashed-line"></div>
        
        <!-- 第三块：cell核控制着cell的代谢和遗传 -->
        <div class="content-block" style="margin-top: 15px;">
            <div class="highlight-box">cell核控制着cell的代谢和遗传</div>
        </div>
        
        <!-- 树状结构：cell核 -->
        <div class="content-block" style="position: relative; padding-left: 80px; margin-top: 20px;">
            <!-- 左侧大括号效果，用线条模拟 -->
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 60px;">
                <!-- 竖线 -->
                <div style="position: absolute; left: 30px; top: 10px; bottom: 20px; width: 1px; background: #333;"></div>
                <!-- 上横线 -->
                <div style="position: absolute; left: 30px; top: 10px; width: 20px; height: 1px; background: #333;"></div>
                <!-- 中横线 -->
                <div style="position: absolute; left: 30px; top: 55px; width: 20px; height: 1px; background: #333;"></div>
                <!-- 下横线 -->
                <div style="position: absolute; left: 30px; top: 140px; width: 20px; height: 1px; background: #333;"></div>
                <!-- 底部横线 -->
                <div style="position: absolute; left: 30px; bottom: 20px; width: 20px; height: 1px; background: #333;"></div>
            </div>
            <div style="position: absolute; left: 5px; top: 50%; transform: translateY(-50%); font-size: 18px;">
                cell核
            </div>
            
            <!-- 右侧内容 -->
            <div style="padding-top: 5px;">
                <!-- 核膜 -->
                <div style="margin-bottom: 15px; position: relative;">
                    <span style="position: absolute; left: -25px; top: 5px;">—</span>
                    核膜：<span class="highlight-box">双层</span>，外障
                </div>
                
                <!-- 核仁 -->
                <div style="margin-bottom: 15px; position: relative;">
                    <span style="position: absolute; left: -25px; top: 5px;">—</span>
                    核仁：与某种<span class="highlight-box">RNA</span>的合成以及核<br>
                    <span style="margin-left: 48px;">体的形成有关</span>
                </div>
                
                <!-- 染色质 -->
                <div style="margin-bottom: 15px; position: relative;">
                    <span style="position: absolute; left: -25px; top: 5px;">—</span>
                    染色质 → 由<span class="highlight-box">DNA</span>和<span class="highlight-box">Pro</span>组成
                    <div style="margin-left: 20px; margin-top: 5px;">
                        ↓ 遗传信息的载体
                    </div>
                </div>
                
                <!-- 核孔 -->
                <div style="position: relative;">
                    <span style="position: absolute; left: -25px; top: 5px;">—</span>
                    核孔：实现核质之间频繁的物质交<br>
                    <span style="margin-left: 48px;">和信息交流</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
