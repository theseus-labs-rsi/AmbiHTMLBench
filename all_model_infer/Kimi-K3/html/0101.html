<!DOCTYPE html>
<html lang="en">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Lion - Story Panels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .panel {
            width: 100%;
            max-width: 700px;
            position: relative;
            margin-bottom: 4px;
            overflow: hidden;
            background-color: #e8e0d8;
        }

        .panel-image {
            width: 100%;
            height: 220px;
            background-color: #d4c8b8;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-image.tall {
            height: 320px;
        }

        .panel-image.medium {
            height: 200px;
        }

        .subtitle {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            white-space: nowrap;
            border-radius: 2px;
            text-align: center;
        }

        .chinese-box {
            position: absolute;
            top: 100px;
            right: 80px;
            background-color: rgba(180, 180, 180, 0.85);
            border: 2px solid #555;
            padding: 10px 20px;
            font-size: 22px;
            color: #fff;
            font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
            white-space: nowrap;
        }

        .chinese-box::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 2px;
            background-color: #555;
        }

        .chinese-box::after {
            content: '';
            position: absolute;
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border: 2px solid #555;
            background-color: #fff;
        }

        .book-placeholder {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 80px;
            background-color: #c8b8a8;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            font-style: italic;
        }

        .illustration-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .panel-1-bg {
            background: linear-gradient(135deg, #e8ddd0 0%, #d4c4b0 40%, #c8b8a8 60%, #b8a898 100%);
        }

        .panel-2-bg {
            background: linear-gradient(180deg, #c8b8a8 0%, #b8a898 50%, #a89888 100%);
        }

        .panel-3-bg {
            background: linear-gradient(180deg, #d8c8b8 0%, #c8b8a8 50%, #b8a898 100%);
        }

        .panel-4-bg {
            background: linear-gradient(180deg, #e0d0c0 0%, #d0c0b0 50%, #c0b0a0 100%);
        }

        .panel-5-bg {
            background: linear-gradient(180deg, #c8b8a8 0%, #b8a898 50%, #a89888 100%);
        }

        .figure-person {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(180deg, #d4b896 0%, #c8a880 30%, #b89870 60%, #a88860 100%);
            opacity: 0.6;
        }

        .figure-wall {
            position: absolute;
            top: 0;
            right: 0;
            width: 35%;
            height: 100%;
            background: linear-gradient(180deg, #c8b0a0 0%, #b8a090 50%, #a89080 100%);
            opacity: 0.7;
        }

        .hair-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 60%;
            background: linear-gradient(180deg, #a07840 0%, #906830 50%, #805820 100%);
            opacity: 0.5;
            border-radius: 0 0 50% 50%;
        }

        .catalog-element {
            position: absolute;
            top: 20px;
            right: 10px;
            width: 40%;
            height: 50%;
            background: linear-gradient(180deg, #d8c8b8 0%, #c8b8a8 100%);
            opacity: 0.5;
            border: 1px solid #aaa;
        }

        .person-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, #c8a880 0%, #b89870 100%);
            opacity: 0.4;
        }

        .cabinet-element {
            position: absolute;
            top: 0;
            right: 0;
            width: 30%;
            height: 100%;
            background: linear-gradient(180deg, #b8a898 0%, #a89888 100%);
            opacity: 0.5;
        }

        .cabinet-drawer {
            position: absolute;
            top: 30px;
            right: 10px;
            width: 25%;
            height: 20px;
            background-color: #999;
            border-radius: 3px;
            opacity: 0.6;
        }

        .cabinet-drawer2 {
            position: absolute;
            top: 70px;
            right: 10px;
            width: 25%;
            height: 20px;
            background-color: #999;
            border-radius: 3px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Panel 1 -->
    <div class="panel">
        <div class="panel-image tall panel-1-bg">
            <div class="figure-person"></div>
            <div class="figure-wall"></div>
            <div class="chinese-box">故事都非常好</div>
            <div class="subtitle">"Well, no," said Mr. McBee. "Not really."</div>
        </div>
    </div>

    <!-- Panel 2 -->
    <div class="panel">
        <div class="panel-image medium panel-2-bg">
            <div class="cabinet-element"></div>
            <div class="cabinet-drawer"></div>
            <div class="cabinet-drawer2"></div>
            <div class="book-placeholder">Library Lion</div>
            <div class="subtitle">"But there's a lion!" said Mr. McBee. "In the library!"</div>
        </div>
    </div>

    <!-- Panel 3 -->
    <div class="panel">
        <div class="panel-image medium panel-3-bg">
            <div class="hair-element"></div>
            <div class="catalog-element"></div>
            <div class="subtitle">He sniffed the card catalog.</div>
        </div>
    </div>

    <!-- Panel 4 -->
    <div class="panel">
        <div class="panel-image medium panel-4-bg">
            <div class="person-bottom"></div>
            <div class="subtitle">There weren't any rules about lions at story hour, either.</div>
        </div>
    </div>

    <!-- Panel 5 -->
    <div class="panel">
        <div class="panel-image medium panel-5-bg">
            <div class="cabinet-element"></div>
            <div class="cabinet-drawer"></div>
            <div class="cabinet-drawer2"></div>
            <div class="book-placeholder">Library Lion</div>
            <div class="subtitle">He waited for another story, but the children began to walk away.</div>
        </div>
    </div>

</body>
</html>
