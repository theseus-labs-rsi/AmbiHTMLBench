<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人民日报 金句摘抄 · 坚持奋斗主题</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #cfc6b6;
    font-family: "SimSun", "Songti SC", "STSong", serif;
    color: #29241f;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 540px;
    max-width: 100%;
    margin: 0 auto;
    background: #d8cfbf;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
  }
  /* ===== masthead ===== */
  .masthead {
    background: #f5eee2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 34px 8px 26px 22px;
  }
  .brand { width: 262px; }
  .brand .cn {
    color: #ea352a;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", cursive;
    font-weight: 700;
    font-style: italic;
    font-size: 76px;
    line-height: .95;
    letter-spacing: -6px;
    transform: skewX(-7deg);
    display: inline-block;
    white-space: nowrap;
  }
  .brand .en {
    margin-top: 10px;
    text-align: center;
    color: #a39a8f;
    font-family: "Times New Roman", serif;
    font-size: 14px;
    letter-spacing: 7px;
    text-indent: 7px;
  }
  .rubric { text-align: right; padding-top: 4px; }
  .rubric .tag {
    display: inline-block;
    font-size: 29px;
    font-weight: 700;
    color: #26221d;
    padding: 0 2px 8px;
    border-bottom: 3px solid #2c2722;
  }
  .rubric .theme {
    display: inline-block;
    margin-top: 26px;
    font-size: 33px;
    font-weight: 800;
    color: #26221d;
    padding: 0 2px 12px;
    border-bottom: 3px solid #2c2722;
    letter-spacing: 1px;
  }
  /* ===== content ===== */
  .content { padding: 16px 26px 42px; }
  .quote1 {
    text-align: center;
    font-size: 47px;
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: 2px;
    color: #2a2520;
    margin-top: 24px;
  }
  .label {
    margin-top: 26px;
    font-size: 17px;
    color: #4c463d;
  }
  .ex {
    margin-top: 24px;
    font-size: 18px;
    line-height: 1.72;
    color: #37322b;
  }
  .quote2 {
    margin-top: 48px;
    display: grid;
    grid-template-columns: auto auto;
    justify-content: center;
    column-gap: 42px;
    row-gap: 14px;
    font-size: 46px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: 1px;
    color: #2a2520;
  }
  .quote2 span { white-space: nowrap; }
  .label2 { margin-top: 44px; }
  .ex2 { margin-top: 24px; line-height: 1.85; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">
      <span class="cn">人民日报</span>
      <div class="en">RENMIN RIBAO</div>
    </div>
    <div class="rubric">
      <span class="tag">金句 | 摘抄</span><br>
      <span class="theme">坚持奋斗主题</span>
    </div>
  </header>

  <main class="content">
    <div class="quote1">夜色难免黑凉<br>前行必有曙光</div>

    <div class="label">举例:</div>
    <p class="ex">夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功!</p>

    <div class="quote2">
      <span>道固远，</span><span>笃行可至</span>
      <span>事虽巨，</span><span>坚为必成</span>
    </div>

    <div class="label label2">举例:</div>
    <p class="ex ex2">道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。</p>
  </main>
</div>
</body>
</html>
