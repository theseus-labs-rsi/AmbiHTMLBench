<title>第十一章 三角形</title>
<style>

<body>

<p>还可以发现，斜钉一根木条的四边形木架的形状不会改变。这是因为斜钉一根木条后，四边形变成两个三角形，由于三角形有稳定性，斜钉一根木条的窗框在未安装好之前也不会变形。</p>

<p>三角形的稳定性有广泛的应用，图 11.1-8 表示其中一些例子。你能再举一些例子吗？</p>

<div class="figure-row">
  <div class="figure-item">
    <div class="placeholder bridge-img">[图片：钢架桥]</div>
    <div class="figure-caption">钢架桥</div>
  </div>
  <div class="figure-item">
    <div class="placeholder crane-img">[图片：起重机]</div>
    <div class="figure-caption">起重机</div>
  </div>
</div>
<div class="figure-label">图 11.1-8</div>

<p>四边形的不稳定性也有广泛的应用，图 11.1-9 表示其中一些例子。</p>

<div class="figure-row">
  <div class="figure-item">
    <div class="placeholder hanger-img">[图片：活动挂架]</div>
    <div class="figure-caption">活动挂架</div>
  </div>
  <div class="figure-item">
    <div class="placeholder gate-img">[图片：伸缩门]</div>
    <div class="figure-caption">伸缩门</div>
  </div>
</div>
<div class="figure-label">图 11.1-9</div>

<div class="exercise-box">
  <div class="exercise-title">练习</div>

  <div class="shapes-grid">

        <svg width="110" height="80" viewBox="0 0 110 80">
          <polygon points="10,60 50,10 90,10 50,60" fill="none" stroke="#555" stroke-width="1.5"/>
          <line x1="50" y1="10" x2="50" y2="60" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(1)</div>
    </div>
    <div class="shape-item">
      <div class="shape-placeholder">
        <svg width="110" height="80" viewBox="0 0 110 80">
          <rect x="10" y="15" width="90" height="50" fill="none" stroke="#555" stroke-width="1.5"/>
          <line x1="55" y1="15" x2="55" y2="65" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(2)</div>
    </div>
    <div class="shape-item">
      <div class="shape-placeholder">
        <svg width="110" height="80" viewBox="0 0 110 80">
          <polygon points="20,55 20,25 55,10 90,25 90,55" fill="none" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(3)</div>
    </div>
    <div class="shape-item">
      <div class="shape-placeholder">
        <svg width="110" height="80" viewBox="0 0 110 80">
          <polygon points="15,20 55,10 95,20 75,65 35,65" fill="none" stroke="#555" stroke-width="1.5"/>
          <line x1="15" y1="20" x2="75" y2="65" stroke="#555" stroke-width="1.5"/>
          <line x1="15" y1="20" x2="35" y2="65" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(4)</div>
    </div>
    <div class="shape-item">
      <div class="shape-placeholder">
        <svg width="110" height="80" viewBox="0 0 110 80">
          <polygon points="20,15 55,10 90,25 90,55 55,70 20,55" fill="none" stroke="#555" stroke-width="1.5"/>
          <line x1="20" y1="15" x2="90" y2="55" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(5)</div>
    </div>
    <div class="shape-item">
      <div class="shape-placeholder">
        <svg width="110" height="80" viewBox="0 0 110 80">
          <polygon points="55,10 90,25 90,55 55,70 20,55 20,25" fill="none" stroke="#555" stroke-width="1.5"/>
          <line x1="55" y1="10" x2="55" y2="70" stroke="#555" stroke-width="1.5"/>
          <line x1="20" y1="25" x2="90" y2="55" stroke="#555" stroke-width="1.5"/>
          <line x1="90" y1="25" x2="20" y2="55" stroke="#555" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="shape-label">(6)</div>

</div>
