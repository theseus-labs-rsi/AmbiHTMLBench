<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销 第③步：调整所得税</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background:#ece5d3; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
    display:flex; justify-content:center; padding:18px;
  }
  .page {
    width:560px;
    background:
      repeating-linear-gradient(90deg, #f3ecdc 0 14px, #e9dfcb 14px 15px);
    border:1px solid #d8cdb6;
    padding:22px 18px 18px 18px;
  }
  .card {
    position:relative;
    height:690px;
    background:#fffdf8;
    border:1.5px solid #a89e88;
    border-radius:16px;
    box-shadow: inset 0 0 0 3px #f7f2e6;
    overflow:hidden;
  }
  /* title */
  .title { text-align:center; padding-top:34px; color:#6b4a1e; }
  .title .l1 { font-size:38px; font-weight:800; letter-spacing:2px; line-height:1.15; }
  .title .l2 { font-size:34px; font-weight:800; letter-spacing:1px; margin-top:6px; }
  .paw { position:absolute; width:30px; height:26px; color:#b98a4a; font-size:24px; line-height:1; }
  .paw.tl { left:150px; top:38px; transform:rotate(-18deg); }
  .paw.tr { right:118px; top:34px; transform:rotate(14deg); }

  .highlight {
    margin:34px 0 0 66px;
    display:inline-block;
    background:linear-gradient(180deg,#ffe28a,#ffd25e);
    color:#6b4a1e;
    font-weight:800;
    font-size:20px;
    padding:6px 16px;
    border-radius:8px;
    letter-spacing:2px;
  }

  .content { position:relative; margin-top:26px; }
  .sec { position:relative; width:360px; margin-left:64px; }
  .sec h3 { font-size:18px; color:#111; font-weight:800; }
  .pair { position:relative; margin:10px 0 6px 42px; font-size:17px; color:#111; line-height:1.55; }
  .pair .brace {
    position:absolute; left:104px; top:-4px; height:48px;
    font-size:44px; font-weight:300; color:#6b4a1e; line-height:1;
  }
  .pair .res {
    position:absolute; left:136px; top:14px; font-size:15px; color:#222; white-space:nowrap;
  }
  .sec2 { margin-top:20px; }

  /* right arrow zone */
  .groupzone { position:absolute; left:402px; top:8px; width:130px; }
  .groupzone .cap { font-size:16px; color:#111; font-weight:700; white-space:nowrap; }
  .groupzone .inc { font-size:17px; color:#111; margin-top:46px; margin-left:14px; }
  .arrow {
    position:absolute; left:6px; top:38px; width:0; height:118px;
    border-left:8px solid #4aa3df;
  }
  .arrow::after{
    content:""; position:absolute; left:-14px; bottom:-2px;
    border-left:10px solid transparent; border-right:10px solid transparent;
    border-top:18px solid #4aa3df;
  }

  .acct { margin:34px 0 0 82px; font-size:18px; color:#111; }
  .acct .cr { margin-left:96px; margin-top:6px; }

  .placeholder {
    position:absolute; display:flex; align-items:center; justify-content:center;
    color:#8a8172; font-size:12px; text-align:center; border:1px dashed #c9bfa9; background:#fbf8f0;
  }
  .catL { left:34px; bottom:0; width:118px; height:76px; border:none; background:transparent; }
  .catR { right:34px; bottom:0; width:110px; height:118px; border:none; background:transparent; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <span class="paw tl">❝</span>
    <span class="paw tr">❞</span>

    <div class="title">
      <div class="l1">内部交易抵销</div>
      <div class="l2">第③步：调整所得税</div>
    </div>

    <div class="highlight">若实现60%对外销售</div>

    <div class="content">
      <div class="sec sec1">
        <h3>个别报表层面因为存货跌价准备：</h3>
        <div class="pair">
          账面价值 900<br>
          计税基础 1200
          <span class="brace">}</span>
          <span class="res">递延所得税资产300*25%=75</span>
        </div>
      </div>

      <div class="groupzone">
        <div class="cap">【集团角度】</div>
        <div class="arrow"></div>
        <div class="inc">调增25</div>
      </div>

      <div class="sec sec2">
        <h3>合并报表层面因为存货跌价准备：</h3>
        <div class="pair">
          账面价值800<br>
          计税基础1200
          <span class="brace">}</span>
          <span class="res">递延所得税资产400*25%=100</span>
        </div>
      </div>
    </div>

    <div class="acct">
      会计处理： 借：递延所得税资产25
      <div class="cr">贷：所得税费用25</div>
    </div>

    <div class="placeholder catL">[Image: sleeping cat, bottom-left]</div>
    <div class="placeholder catR">[Image: cat with straw hat, bottom-right]</div>
  </div>
</div>
</body>
</html>
