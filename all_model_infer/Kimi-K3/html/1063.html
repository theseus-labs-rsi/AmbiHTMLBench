<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奔驰 大G - 普通人赚一辆豪车需要多久</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #111;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    position: relative;
    width: 540px;
    margin: 0 auto;
    padding: 12px 42px 18px 42px;
    background: #ffffff;
    overflow: hidden;
  }
  .car-photo {
    width: 300px;
    height: 178px;
    margin: 0 auto 6px auto;
  }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f4;
    color: #999;
    font-size: 13px;
    border: 1px dashed #ccc;
  }
  h1 {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.15;
    margin-top: 2px;
  }
  h2 {
    text-align: center;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
    margin: 8px 0 22px 0;
    white-space: nowrap;
  }
  .table-wrap { position: relative; }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.92);
  }
  col.c1 { width: 34%; }
  col.c2 { width: 33%; }
  col.c3 { width: 33%; }
  th, td {
    border: 1px solid #8c8c8c;
    padding: 13px 10px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
  }
  thead th {
    background: #e6e6e6;
    font-weight: 800;
  }
  th:nth-child(1), td:nth-child(1) { text-align: left; padding-left: 8px; }
  th:nth-child(2), td:nth-child(2) { text-align: center; }
  th:nth-child(3), td:nth-child(3) { text-align: center; }
  .watermark {
    position: absolute;
    right: -30px;
    top: 120px;
    width: 190px;
    height: 190px;
    z-index: 1;
    opacity: 0.10;
    border: 6px solid #777;
    border-radius: 50%;
    pointer-events: none;
  }
  .watermark::before, .watermark::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 150px;
    background: #777;
    transform-origin: center;
  }
  .watermark::before { transform: translate(-50%,-50%) rotate(90deg); }
  .watermark::after { transform: translate(-50%,-50%) rotate(210deg); }
  .watermark span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 150px;
    background: #777;
    transform: translate(-50%,-50%) rotate(330deg);
  }
  .footnote {
    margin-top: 8px;
    text-align: right;
    font-size: 10px;
    color: #8a8a8a;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="page">
    <figure class="car-photo placeholder" style="background:#fff;border:none;color:#bbb;">[Photo: black Mercedes-Benz G-Class SUV, centered top]</figure>

    <h1>奔驰 大G</h1>
    <h2>普通人 赚一辆豪车 需要多久?</h2>

    <div class="table-wrap">
      <div class="watermark"><span></span></div>
      <table>
        <colgroup>
          <col class="c1"><col class="c2"><col class="c3">
        </colgroup>
        <thead>
          <tr>
            <th>职业</th>
            <th>月薪</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>外卖员</td><td>5000元/月</td><td>大约45年</td></tr>
          <tr><td>建筑工人</td><td>6000元/月</td><td>大约38年</td></tr>
          <tr><td>出租车司机</td><td>6500元/月</td><td>大约35年</td></tr>
          <tr><td>教师</td><td>8000元/月</td><td>大约28年</td></tr>
          <tr><td>医生</td><td>10000元/月</td><td>大约23年</td></tr>
          <tr><td>互联网职工</td><td>15000元/月</td><td>大约15年</td></tr>
          <tr><td>银行职员</td><td>20000元/月</td><td>大约11年</td></tr>
          <tr><td>销售</td><td>25000元/月</td><td>大约9年</td></tr>
          <tr><td>私企老板</td><td>50000元/月</td><td>大约5年</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footnote">*月薪按30%作为日常基本开销</div>
  </div>
</body>
</html>
