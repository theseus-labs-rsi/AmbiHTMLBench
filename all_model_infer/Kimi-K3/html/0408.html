<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals &amp; Objectives</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  .slide{position:relative;width:1024px;height:768px;margin:0 auto;background:#ffffff;overflow:hidden;}
  .brown{color:#572b2b;font-family:Georgia,'Times New Roman',serif;font-weight:normal;}
  .title{position:absolute;top:20px;left:0;width:1024px;text-align:center;font-size:60px;line-height:1.1;}
  .date{position:absolute;top:143px;left:0;width:1024px;text-align:center;font-size:39px;line-height:1.15;}
  .goals{position:absolute;left:40px;top:255px;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;font-size:40px;color:#187f7b;line-height:42px;}
  .goals .g{height:80px;}
  .goals .gap{height:50px;}
  .bracket{position:absolute;border:5px solid #572b2b;border-left:none;border-radius:0 12px 12px 0;box-sizing:border-box;}
  .b1{left:556px;top:250px;width:96px;height:258px;}
  .b2{left:566px;top:534px;width:94px;height:174px;}
  .arrow{position:absolute;width:112px;height:86px;background:#187f7b;
    clip-path:polygon(0% 50%,38% 0%,38% 28%,100% 28%,100% 72%,38% 72%,38% 100%);}
  .a1{left:664px;top:314px;}
  .a2{left:664px;top:552px;}
  .label{position:absolute;text-align:center;font-size:40px;line-height:1.12;}
  .l1{left:788px;top:282px;width:234px;}
  .l1 .of{font-size:32px;}
  .l2{left:778px;top:552px;width:254px;font-size:39px;}
</style>
</head>
<body>
<div class="slide">
  <div class="brown title">Goals &amp; Objectives</div>
  <div class="brown date">From January 1, 2016 &ndash; December 31, 2018, we will:</div>

  <div class="goals">
    <div class="g">Goal 1: XX</div>
    <div class="g">Goal 2: XX</div>
    <div class="g">Goal 3: XX</div>
    <div class="gap"></div>
    <div class="g">Goal 4: Money</div>
    <div class="g">Goal 5: People &amp; Infrastructure</div>
  </div>

  <div class="bracket b1"></div>
  <div class="bracket b2"></div>
  <div class="arrow a1"></div>
  <div class="arrow a2"></div>

  <div class="brown label l1">Theory<br><span class="of">of</span><br>Change<br>Goals</div>
  <div class="brown label l2">Organization<br>Goals</div>
</div>
</body>
</html>
