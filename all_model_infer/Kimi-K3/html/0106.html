<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#f1d1c6;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:#1c1c1c;
    display:flex;
    justify-content:center;
    padding:46px 14px 30px;
  }
  .card{
    position:relative;
    width:100%;
    max-width:512px;
    background:#ffffff;
    border:3px solid #5d9aa2;
    border-radius:14px;
    padding:34px 16px 24px;
    overflow:visible;
  }
  .title-wrap{
    position:absolute;
    top:-32px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    border:3px solid #5d9aa2;
    border-radius:12px;
    padding:6px 20px 8px;
    display:flex;
    align-items:flex-start;
    white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
    z-index:10;
  }
  .title-wrap h1{
    font-size:33px;
    line-height:1.15;
    font-weight:900;
    letter-spacing:1px;
    color:#101010;
  }
  .q-badge{
    margin-left:6px;
    margin-top:-14px;
    width:36px;
    height:44px;
    background:#fff;
    border:3px solid #5d9aa2;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    color:#f4c20d;
    -webkit-text-stroke:1.5px #4a4a4a;
    text-shadow:1px 1px 0 #4a4a4a;
    transform:rotate(4deg);
  }
  .sec-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:14px 0 9px;
  }
  .sec-left{
    display:flex;
    align-items:center;
    min-width:0;
  }
  .pin{flex:0 0 auto;margin-right:3px;}
  .hl{
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;
    padding:0 3px;
    background:linear-gradient(to top,#ffec4d 0 64%,rgba(255,236,77,0) 64%);
  }
  .sum-box{
    flex:0 0 auto;
    margin-left:10px;
    background:linear-gradient(90deg,#e23b1d 0%,#ef6a1a 100%);
    color:#fff;
    font-weight:900;
    font-size:16px;
    padding:8px 12px;
    border-radius:4px;
    box-shadow:0 2px 3px rgba(0,0,0,.18);
    white-space:nowrap;
  }
  .tbl-wrap{position:relative;}
  table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    background:#fff;
  }
  th,td{
    border:1px solid #aab3ba;
    text-align:center;
    vertical-align:middle;
    padding:11px 5px;
    font-size:15px;
    line-height:1.45;
    word-break:break-all;
  }
  thead th{
    color:#fff;
    font-weight:800;
    font-size:16px;
    padding:12px 5px;
  }
  .t1 thead th{background:#4b5866;border-color:#4b5866;}
  .t2 thead th{background:#2e6f76;border-color:#2e6f76;}
  .t1 col.c1{width:24%;}
  .t1 col.c2{width:22%;}
  .t1 col.c3{width:24%;}
  .t1 col.c4{width:30%;}
  .t2 col.d1{width:23%;}
  .t2 col.d2{width:39%;}
  .t2 col.d3{width:38%;}
  .circled{position:relative;display:inline-block;padding:1px 8px;}
  .circled::after{
    content:"";
    position:absolute;
    left:-16px;right:-16px;top:-9px;bottom:-9px;
    border:3px solid #d23b3b;
    border-radius:50%;
    transform:rotate(-5deg);
    pointer-events:none;
  }
  .rec-cell{position:relative;}
  .rec-tag{
    position:absolute;
    left:-34px;
    top:calc(100% - 15px);
    white-space:nowrap;
    z-index:6;
    font-size:22px;
    font-weight:900;
    font-style:italic;
    letter-spacing:1px;
    color:#151515;
    transform:rotate(-1deg);
    text-shadow:-2px 0 0 #fff,2px 0 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,
      -2px -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,
      0 0 4px #fff;
    pointer-events:none;
  }
  .mix-cell{position:relative;}
  .home-tag{
    position:absolute;
    left:-8px;
    top:calc(100% - 17px);
    white-space:nowrap;
    z-index:7;
    display:flex;
    align-items:center;
    font-size:17px;
    font-weight:900;
    color:#111;
    text-shadow:-2px 0 0 #fff,2px 0 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,
      -2px -2px 0 #fff,2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff;
    pointer-events:none;
  }
  .up-ico,.ok-ico{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;height:22px;
    border-radius:5px;
    color:#fff;
    font-size:14px;
    font-weight:900;
    text-shadow:none;
    margin-right:1px;
  }
  .up-ico{background:#2f6fb2;}
  .ok-ico{background:#1fa36b;margin-left:1px;}
  .red{color:#d22f2f;font-weight:900;}
</style>
</head>
<body>
  <div class="card">
    <div class="title-wrap">
      <h1>猫砂都有哪些款</h1>
      <span class="q-badge">?</span>
    </div>

    <div class="sec-row">
      <div class="sec-left">
        <svg class="pin" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="#d32f2f" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span class="hl">三种猫砂尺寸哪个是你最爱</span>
      </div>
    </div>

    <div class="tbl-wrap">
      <table class="t1">
        <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
        <thead>
          <tr><th>尺寸</th><th>重量</th><th>结团效果</th><th>其他</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>1.5mm</td><td>轻</td><td>上</td><td>易带出，价格<br>略高</td>
          </tr>
          <tr>
            <td class="rec-cell"><span class="circled">2mm</span><span class="rec-tag">综合性价比推荐</span></td>
            <td>中</td><td>中</td><td>综合性价比高</td>
          </tr>
          <tr>
            <td>3mm</td><td>重</td><td>67</td><td>推荐度低，但<br>价格也低</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="sec-row" style="margin-top:20px;">
      <div class="sec-left">
        <svg class="pin" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="#d32f2f" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span class="hl">猫砂都有哪些种类</span>
      </div>
      <div class="sum-box">总结：2mm混合砂yyds</div>
    </div>

    <div class="tbl-wrap">
      <table class="t2">
        <colgroup><col class="d1"><col class="d2"><col class="d3"></colgroup>
        <thead>
          <tr><th>种类</th><th>优点</th><th>其他</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>膨润土</td><td>价格低廉</td><td>粉尘大</td>
          </tr>
          <tr>
            <td>豆腐猫砂</td><td>原料更安全，闻起来<br>也比较好</td><td>价格偏高，纯豆腐结团略差</td>
          </tr>
          <tr>
            <td class="mix-cell"><span class="circled">混合猫砂</span>
              <span class="home-tag"><span class="up-ico">↑</span>普通养宠家庭足以满足需求<span class="ok-ico">✓</span></span>
            </td>
            <td>结合上述优点，价格<br>适中</td>
            <td>比例推荐<span class="red">7:3或6:4</span>，结团<br>快且用量省</td>
          </tr>
          <tr>
            <td>沸石</td><td>可循环利用</td><td>需要自己洗</td>
          </tr>
          <tr>
            <td>其他新型原料</td><td>价格高，新颖</td><td>效果待考核，贵</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
