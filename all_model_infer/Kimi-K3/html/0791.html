<!DOCTYPE html>
<html>
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步行游览区 北线（接上篇）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#e9edf0;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;}
  .page{position:relative;width:540px;min-height:720px;margin:0 auto;background:#ffffff;overflow:hidden;color:#1c1c1c;}

  /* vertical divider with top dot */
  .divider{position:absolute;left:150px;top:14px;width:2px;height:492px;background:#c3cdd2;}
  .divider::before{content:"";position:absolute;left:-4px;top:-12px;width:9px;height:9px;border-radius:50%;background:#5b9bad;}

  /* left rail */
  .rail{position:absolute;left:0;top:0;width:150px;height:100%;}
  .vlabels{position:absolute;left:80px;top:22px;display:flex;flex-direction:column;gap:13px;}
  .vlabels span{width:49px;height:53px;background:#4e7c88;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .route{position:absolute;left:90px;top:366px;display:flex;flex-direction:column;align-items:center;}
  .route .rc{width:36px;height:50px;border:2px solid #6f7d84;color:#2b2b2b;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:#fff;}
  .route .down{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:16px solid #5b6f78;margin:6px 0 8px 0;}
  .pagenum{position:absolute;left:82px;top:552px;width:58px;height:78px;}
  .pagenum .n{font-size:86px;font-weight:900;color:#35b3ab;line-height:1;font-family:"Comic Sans MS","Segoe Print",cursive;transform:rotate(-4deg);display:inline-block;text-shadow:2px 2px 0 rgba(53,179,171,.25);}
  .pagenum .dot{position:absolute;left:6px;top:4px;width:7px;height:7px;border-radius:50%;background:#f4a7c3;}
  .pagenum .ring{position:absolute;right:-4px;bottom:2px;width:16px;height:16px;border-radius:50%;border:2px solid #bfe6e2;}

  /* main */
  .main{margin-left:160px;padding:14px 14px 20px 6px;position:relative;}
  .continued{position:relative;height:42px;display:flex;align-items:flex-start;}
  .continued .txt{position:absolute;left:172px;top:0;color:#4e7c88;font-size:21px;font-weight:900;letter-spacing:1px;}
  .continued .peaks{position:absolute;left:286px;top:10px;width:34px;height:24px;}
  .continued .peaks i{position:absolute;bottom:0;width:0;height:0;}
  .continued .peaks .p1{left:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid #4e7c88;}
  .continued .peaks .p2{left:13px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #aebfc7;}
  .continued .bigtri{position:absolute;right:-2px;top:0;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:26px solid #4c6570;}
  .continued .doodle{position:absolute;left:86px;top:2px;width:70px;height:26px;}
  .continued .doodle::before{content:"";position:absolute;left:24px;top:8px;width:34px;height:12px;border-top:2px dashed #7d8f98;border-radius:50%;transform:rotate(-8deg);}
  .continued .doodle::after{content:"";position:absolute;left:0;top:10px;width:0;height:0;border-left:12px solid #7d8f98;border-top:6px solid transparent;border-bottom:6px solid transparent;transform:rotate(-18deg);}

  .stop{margin-top:6px;}
  .stop + .stop{margin-top:14px;}
  .srow{display:flex;align-items:center;justify-content:space-between;}
  .signwrap{position:relative;padding-top:30px;flex:0 0 auto;}
  .signwrap .bar{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:88px;border-top:2px solid #8fb4c1;}
  .signwrap .bar::after{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #8fb4c1;}
  .signbox{position:relative;border:2px solid #8fb4c1;border-radius:16px;background:#fff;padding:9px 20px;color:#5d9bad;font-weight:900;text-align:center;letter-spacing:2px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .signbox .w{position:absolute;top:-30px;width:2px;height:32px;background:#8fb4c1;}
  .signbox .w.l{left:24px;transform:rotate(22deg);transform-origin:bottom;}
  .signbox .w.r{right:24px;transform:rotate(-22deg);transform-origin:bottom;}
  .signbox .g{position:absolute;top:-4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #8fb4c1;}
  .signbox .g.l{left:18px;} .signbox .g.r{right:18px;}
  .t-mada{font-size:18px;line-height:1.25;}
  .t-one{font-size:17px;line-height:1.3;white-space:nowrap;}

  .placeholder{background:#d8dde0;border:1px solid #b9c2c7;color:#6b767c;font-size:11px;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;flex:0 0 auto;}
  .ph1{width:150px;height:108px;margin-right:2px;}
  .ph2{width:120px;height:142px;margin-right:6px;}
  .ph3{width:150px;height:112px;margin-right:4px;}

  .stop p{margin-top:10px;font-size:14.5px;line-height:1.62;font-weight:700;color:#1c1c1c;text-align:justify;}
</style>
</head>
<body>
<div class="page">
  <div class="divider"></div>

  <div class="rail">
    <div class="vlabels">
      <span>步</span><span>行</span><span>游</span><span>览</span><span>区</span>
    </div>
    <div class="route">
      <div class="rc">北</div>
      <div class="down"></div>
      <div class="rc">线</div>
    </div>
    <div class="pagenum"><span class="dot"></span><span class="n">6</span><span class="ring"></span></div>
  </div>

  <div class="main">
    <div class="continued">
      <span class="doodle"></span>
      <span class="txt">接上篇</span>
      <span class="peaks"><i class="p2"></i><i class="p1"></i></span>
      <span class="bigtri"></span>
    </div>

    <section class="stop">
      <div class="srow">
        <div class="signwrap">
          <span class="bar"></span>
          <div class="signbox t-mada">
            <i class="w l"></i><i class="w r"></i><i class="g l"></i><i class="g r"></i>
            马达加斯加<br>丛林
          </div>
        </div>
        <figure class="placeholder ph1">[Photo: 饲养员肩上的环尾狐猴，右上]</figure>
      </div>
      <p>环尾狐猴的天堂，成群结队的环尾狐猴在这里攀爬跳跃，在零距离投喂专属食物的时候有可能会跳到你的肩膀上哦，这时候就是拍照留念的最佳时机啦！</p>
    </section>

    <section class="stop">
      <div class="srow">
        <div class="signwrap">
          <span class="bar"></span>
          <div class="signbox t-one">
            <i class="w l"></i><i class="w r"></i><i class="g l"></i><i class="g r"></i>
            小熊猫展区
          </div>
        </div>
        <figure class="placeholder ph2">[Photo: 小熊猫玩偶/投喂互动，右侧]</figure>
      </div>
      <p>北野里最受欢迎的网红打卡地之一，里面设有零食铺子可以购买竹叶和小熊猫互动，注：自带的食物不能给它吃哦！</p>
    </section>

    <section class="stop">
      <div class="srow">
        <div class="signwrap">
          <span class="bar"></span>
          <div class="signbox t-one">
            <i class="w l"></i><i class="w r"></i><i class="g l"></i><i class="g r"></i>
            爬行动物馆
          </div>
        </div>
        <figure class="placeholder ph3">[Photo: 黄金蟒盘踞，右下]</figure>
      </div>
      <p>喜欢蟒蛇、蜥蜴的小伙伴们千万不要错过这里，黄金蟒、网纹蟒、红鬣蜥、绿鬣蜥、黑白泰迦等等都有昂！PS:怕蛇的小伙伴就不要挑战自己啦！</p>
    </section>
  </div>
</div>
</body>
</html>
