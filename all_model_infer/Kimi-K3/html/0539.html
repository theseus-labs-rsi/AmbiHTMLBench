<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Into the Darkness - Film Poster</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: Arial, Helvetica, sans-serif;
  }
  .poster {
    position: relative;
    width: 794px;
    height: 1123px;
    background: #000;
    overflow: hidden;
    color: #fff;
  }
  .presents {
    position: absolute;
    top: 70px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 21px;
    letter-spacing: 9px;
    color: #ffffff;
    font-weight: 400;
    white-space: nowrap;
  }
  .title {
    position: absolute;
    top: 128px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "Times New Roman", Times, serif;
    font-weight: 700;
    color: #bc3641;
    font-size: 118px;
    line-height: 0.98;
    letter-spacing: 2px;
  }
  .photo {
    position: absolute;
    top: 348px;
    left: 0;
    width: 100%;
    height: 560px;
    background: linear-gradient(to bottom, #050505 0%, #0c0c0c 18%, #1a1a1a 45%, #2b2b2b 62%, #161616 100%);
    overflow: hidden;
  }
  .photo .caption {
    position: absolute;
    top: 300px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #6f6f6f;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 0 40px;
  }
  .sign {
    position: absolute;
    top: 148px;
    left: 68%;
    transform: translateX(-50%);
    background: #f4f4f4;
    color: #151515;
    font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 1px;
    padding: 6px 16px;
    white-space: nowrap;
  }
  .directed {
    position: absolute;
    top: 938px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #bc3641;
    font-size: 24px;
    letter-spacing: 5px;
    font-weight: 400;
  }
  .details {
    position: absolute;
    top: 982px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #ffffff;
    font-size: 25px;
    letter-spacing: 4px;
    line-height: 1.55;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="presents">SOULFUL FILM PRESENTS</div>
    <div class="title">INTO THE<br>DARKNESS</div>
    <div class="photo placeholder">
      <div class="sign">SELF PARK 6'-0&quot; CLEARANCE</div>
      <div class="caption">[Photo: black-and-white parking garage interior with a parked car, ramp and overhead fluorescent lights; full-width, centered]</div>
    </div>
    <div class="directed">Directed by Levi Stanford</div>
    <div class="details">
      May 23, 2019 | 2:00 pm<br>
      Michael Hopper Auditorium<br>
      Oreixs university, OH
    </div>
  </div>
</body>
</html>
