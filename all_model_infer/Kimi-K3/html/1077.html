<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月薪3000这样存</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
<style>
  *{box-sizing:border-box;}
  body{background:#e7e7e7;margin:0;padding:24px 0;font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Comic Sans MS",cursive;}
  .page{
    position:relative;width:820px;margin:0 auto;background:#ffffff;
    padding:26px 46px 70px 86px;min-height:1120px;
    box-shadow:0 3px 14px rgba(0,0,0,.25);
    background-image:repeating-linear-gradient(to bottom,transparent 0 33px,#a9c0d8 33px 34px);
    background-position:0 26px;
    color:#c00000;font-size:22px;line-height:34px;
  }
  .binding{position:absolute;left:0;top:0;bottom:0;width:40px;pointer-events:none;
    background-image:
      radial-gradient(circle at 20px 17px,#1c1c1c 0 4px,#6a6a6a 5px 7px,transparent 8px),
      radial-gradient(circle at 20px 17px,transparent 0 9px,#2b2b2b 10px 12px,transparent 13px);
    background-size:40px 34px;background-repeat:repeat-y;background-position:0 26px;
  }
  .date{position:absolute;top:14px;right:70px;color:#4a4a4a;font-size:14px;font-family:Georgia,serif;}
  .title{color:#111;font-size:52px;line-height:68px;height:68px;letter-spacing:2px;margin:6px 0 26px 6px;font-weight:700;}
  .title .num{font-size:46px;letter-spacing:0;}
  .row{line-height:34px;min-height:34px;white-space:nowrap;}
  .gap{display:inline-block;width:26px;}
  .y{display:inline-block;min-width:86px;}
  .tri{display:inline-block;vertical-align:top;line-height:34px;}
  .tri .c{display:inline-block;width:92px;text-align:center;}
  .tri .sub{font-size:20px;}
  .amt{display:inline-block;margin-right:46px;}
  .amt.last{margin-right:0;}
  .group{display:flex;align-items:center;min-height:68px;}
  .g-left .row{min-height:34px;}
  .g-brace{font-size:56px;line-height:1;margin:0 8px 0 14px;font-family:Georgia,serif;font-weight:400;}
  .g-note{white-space:nowrap;}
  .indent{display:inline-block;width:0;}
</style>
</head>
<body>
  <div class="page">
    <div class="binding"></div>
    <div class="date">Date.</div>

    <div class="title">月薪 <span class="num">3000</span>这样存</div>

    <div class="row">收入3000，每月存下1000元</div>
    <div class="row">&nbsp;</div>

    <div class="row">
      <span class="y">第1年：</span><span>1000分成3分</span><span class="gap"></span><span class="tri"><span class="c">300元</span><span class="c">300元</span><span class="c">400元</span><br><span class="c sub">一年期</span><span class="c sub">两年期</span><span class="c sub">三年期</span></span>
    </div>
    <div class="row"><span class="y"></span><span>12个月后得到</span><span class="gap"></span><span class="amt">24个300元</span><span class="amt last">12个400元</span></div>
    <div class="row">&nbsp;</div>

    <div class="row"><span class="y">第2年：</span><span class="group" style="display:inline-flex;vertical-align:middle;"><span class="g-left"><span class="row">每月有一笔300元到期</span><br><span class="row">每月继续存1000元</span></span><span class="g-brace">}</span><span class="g-note">1300元共存3年期</span></span></div>
    <div class="row"><span class="y"></span><span>12个月后得到</span><span class="gap"></span><span class="amt">12个300元</span><span class="amt">12个400元</span><span class="amt last">12个1300元</span></div>
    <div class="row">&nbsp;</div>

    <div class="row"><span class="y">第3年：</span><span class="group" style="display:inline-flex;vertical-align:middle;"><span class="g-left"><span class="row">每月有一笔300元到期</span><br><span class="row">每月继续存1000元</span></span><span class="g-brace">}</span><span class="g-note">共1300元存3年期</span></span></div>
    <div class="row"><span class="y"></span><span>12个月后得到</span><span class="gap"></span><span class="amt">24个1300元</span><span class="amt last">12个400元</span></div>
    <div class="row">&nbsp;</div>

    <div class="row"><span class="y">第4年：</span><span class="group" style="display:inline-flex;vertical-align:middle;"><span class="g-left"><span class="row">每月有一笔400元到期</span><br><span class="row">每月继续存1000元</span></span><span class="g-brace">}</span><span class="g-note">共1400元存3年期</span></span></div>
    <div class="row"><span class="y"></span><span>12个月后得到</span><span class="gap"></span><span class="amt">24个1300元</span><span class="amt last">12个1400元</span></div>
  </div>
</body>
</html>
