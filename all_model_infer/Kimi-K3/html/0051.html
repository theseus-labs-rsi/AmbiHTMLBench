<!DOCTYPE html>
<html>
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The (Happiness of) Midsummer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e9e4d8; font-family: Georgia, 'Times New Roman', serif; }
  .sheet {
    width:540px;
    min-height:720px;
    margin:0 auto;
    background:#f6f2e9;
    padding:24px 66px 18px 66px;
  }
  .title { text-align:center; color:#4e7ca8; line-height:1.12; }
  .title .the { display:block; font-style:italic; font-size:15px; font-weight:400; margin-bottom:2px; }
  .title .l1 { display:block; font-size:27px; letter-spacing:.5px; }
  .title .l2 { display:block; font-size:29px; letter-spacing:.5px; }
  .meta {
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-top:14px; margin-bottom:6px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:8px; letter-spacing:1px; color:#3a3a3a;
  }
  .placeholder {
    width:408px; height:542px;
    background:#9db8cf;
    border:0;
    display:flex; align-items:center; justify-content:center;
    color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:12px; letter-spacing:1px;
  }
  .caption { text-align:center; margin-top:12px; color:#4e7ca8; font-size:16px; font-weight:700; letter-spacing:.5px; }
  .goodone {
    text-align:center; margin-top:10px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:9px; letter-spacing:3px; color:#2f2f2f; font-weight:700;
  }
  .fineprint {
    text-align:center; margin-top:6px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:6px; line-height:1.5; color:#6f6f6f; letter-spacing:.2px;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="title">
      <span class="the">The</span>
      <span class="l1">(Happiness of)</span>
      <span class="l2">Midsummer&reg;</span>
    </div>
    <div class="meta">
      <span>MOMENTS</span>
      <span>S/S 2023</span>
    </div>
    <div class="placeholder">[Photo: centered]</div>
    <div class="caption">「2023仲夏 正在进行时」</div>
    <div class="goodone">HAVE A GOOD ONE</div>
    <div class="fineprint">
      Through field to wander every where, But from the moon's sphere, To dew her orbs<br>
      upon the green, The cowslips tall her pensioners be; In their gold coats spots you see; Farewell, I'll be gone
    </div>
  </div>
</body>
