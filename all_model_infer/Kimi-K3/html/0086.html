<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA Formula</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #4a6b5a;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-banner {
            background: linear-gradient(to bottom, #5bc0de, #3a9fbf);
            padding: 14px 30px;
            border-radius: 4px;
            margin-bottom: 40px;
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .header-banner h1 {
            color: #ffff00;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .content-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 750px;
            padding: 50px 60px;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .formula-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .formula {
            font-size: 1.6rem;
            color: #1a3a8a;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .formula .label {
            font-size: 1.6rem;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
        }

        .fraction .numerator {
            border-bottom: 2.5px solid #1a3a8a;
            padding: 0 10px 4px 10px;
            font-size: 1.5rem;
            color: #1a3a8a;
            font-weight: bold;
        }

        .fraction .denominator {
            padding: 4px 10px 0 10px;
            font-size: 1.5rem;
            color: #1a3a8a;
            font-weight: bold;
        }

        .constraint {
            color: #cc0000;
            font-size: 1.4rem;
            font-weight: bold;
            margin-left: 20px;
        }

        .definitions {
            margin-top: 10px;
        }

        .definition-item {
            font-size: 1.35rem;
            color: #1a3a8a;
            font-weight: bold;
            margin-bottom: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>PTA SHOULD BE LESS THAN 40 %</h1>
    </div>

    <div class="content-card">
        <div class="formula-row">
            <div class="formula">
                <span class="label">PTA =</span>
                <div class="fraction">
                    <span class="numerator">(FT + AD)</span>
                    <span class="denominator">CCT</span>
                </div>
            </div>
            <span class="constraint">&lt; 40%</span>
        </div>

        <div class="definitions">
            <div class="definition-item">FT = flap thickness</div>
            <div class="definition-item">AD = ablation depth</div>
            <div class="definition-item">CCT = central corneal thickness</div>
        </div>
    </div>

</body>
</html>
