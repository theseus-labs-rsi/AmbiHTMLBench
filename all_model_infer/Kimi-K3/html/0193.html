<!DOCTYPE html>
<html lang="tr">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emek Partisi Ankara İl Örgütü - Asgari Ücret Afişi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #c9c7bd;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .poster {
    width: 720px;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  /* Top yellow zone */
  .yellow {
    background: #f3df17;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 34px 34px 26px 30px;
  }
  .bullets { display: flex; flex-direction: column; gap: 26px; padding-top: 6px; }
  .bullet { display: flex; align-items: flex-start; gap: 18px; }
  .pin {
    width: 26px; height: 34px; flex: 0 0 26px; margin-top: 4px;
    border-radius: 50% 50% 50% 0;
    background: radial-gradient(circle at 35% 30%, #e23b3b 0 55%, #a01818 56% 100%);
    transform: rotate(-35deg);
    position: relative;
  }
  .pin::after {
    content:""; position:absolute; left:9px; bottom:-12px; width:7px; height:16px;
    background:#cfcfcf; border-radius:3px; transform:rotate(35deg);
  }
  .bullet-text {
    color:#111; font-weight: 800; font-size: 46px; line-height: 1.04;
    letter-spacing: .5px;
  }
  .econ-graphic {
    width: 300px; height: 300px; flex: 0 0 300px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #f2994a 0 58%, #e8862f 59% 100%);
    position: relative; margin-right: 8px;
  }
  .econ-graphic .cap {
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    color: rgba(255,255,255,.0);
  }
  .econ-graphic::before {
    content:""; position:absolute; left:56px; top:78px; width:170px; height:14px;
    background:#202020; transform: rotate(38deg); border-radius:3px;
  }
  .econ-graphic::after {
    content:""; position:absolute; right:36px; top:26px; width:0; height:0;
    border-left: 34px solid #d8272e; border-top: 20px solid transparent; border-bottom: 20px solid transparent;
    transform: rotate(-42deg);
  }
  .coin {
    position:absolute; left:26px; bottom:34px; width:78px; height:78px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #f7e74c 0 60%, #d9b90c 61% 100%);
    border:5px solid #6a5b00; color:#fff; font-weight:800; font-size:40px;
    display:flex; align-items:center; justify-content:center; text-shadow:0 1px 0 #b79b00;
  }
  .cash {
    position:absolute; right:30px; bottom:44px; width:96px; height:70px;
    background: repeating-linear-gradient(0deg,#f4d13d 0 12px,#e8bd22 12px 15px);
    border:4px solid #4d3b12;
  }
  /* Red demand text */
  .demand {
    background:#fff; color:#d3272e; text-align:center;
    font-weight:900; font-size:52px; line-height:1.18; padding: 26px 18px 14px;
  }
  .redband {
    background:#cf262d; color:#fff; text-align:center;
    font-weight:900; font-size:64px; letter-spacing:1px; padding: 8px 6px 10px;
    font-style: normal;
  }
  /* Footer */
  .footer { background:#fff; padding: 22px 26px 20px; }
  .org { display:flex; align-items:center; justify-content:center; gap: 40px; }
  .logo {
    width: 128px; height: 128px; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #f4cf33 0 46%, #d3272e 47% 100%);
    position:relative;
  }
  .logo::before {
    content:""; position:absolute; inset:18px; border-radius:50%;
    background:
      linear-gradient(0deg, transparent 48%, #a01818 49% 51%, transparent 52%),
      linear-gradient(90deg, transparent 48%, #a01818 49% 51%, transparent 52%),
      radial-gradient(circle at 50% 50%, #f4cf33 0 100%);
    border:3px solid #a01818;
  }
  .logo::after {
    content:"EMEP"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#d3272e; font-weight:900; font-size:24px; letter-spacing:1px;
  }
  .party { text-align:left; color:#d3272e; }
  .party .name { font-weight:900; font-size:38px; line-height:1.08; }
  .party .sub { font-weight:800; font-size:24px; margin-top:6px; }
  .social {
    margin-top: 18px; display:flex; align-items:center; justify-content:center; gap: 34px;
    color:#d3272e; font-weight:700; font-size:22px;
  }
  .sitem { display:flex; align-items:center; gap:8px; }
  .icon {
    width:30px; height:30px; border:3px solid #d3272e; border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:20px;
  }
  .icon.round { border-radius:50%; }
</style>
</head>
<body>
  <div class="poster">
    <div class="yellow">
      <div class="bullets">
        <div class="bullet">
          <div class="pin"></div>
          <div class="bullet-text">Enflasyon<br>yükseliyor</div>
        </div>
        <div class="bullet">
          <div class="pin"></div>
          <div class="bullet-text">TL değer<br>kaybediyor</div>
        </div>
        <div class="bullet">
          <div class="pin"></div>
          <div class="bullet-text">Ücretler eriyor</div>
        </div>
      </div>
      <div class="econ-graphic placeholder" aria-label="[Diagram: rising red arrow, pencil, 1 TL coin and stack of banknotes inside orange circle, top-right]">
        <div class="coin">1</div>
        <div class="cash"></div>
      </div>
    </div>

    <div class="demand">Vergiden muaf,<br>İnsanca yaşanacak</div>
    <div class="redband">ASGARİ ÜCRET!</div>

    <div class="footer">
      <div class="org">
        <div class="logo placeholder" aria-label="[Logo: EMEP gear with globe]"></div>
        <div class="party">
          <div class="name">EMEK<br>PARTİSİ</div>
          <div class="sub">Ankara İl Örgütü</div>
        </div>
      </div>
      <div class="social">
        <span class="sitem"><span class="icon">f</span>/ankaraemep</span>
        <span class="sitem"><span class="icon">◎</span>@emepankara</span>
        <span class="sitem"><span class="icon round">✆</span>0 (312) 232 41 97</span>
      </div>
    </div>
  </div>
</body>
</html>
