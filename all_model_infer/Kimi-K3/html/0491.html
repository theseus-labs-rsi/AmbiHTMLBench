  .lvl-board .pill{margin-bottom:-19px;padding-left:34px;padding-right:34px;}

  .sub-pills{display:flex;justify-content:space-between;position:relative;z-index:3;margin:-4px 0 -17px;padding:0 6px;}

      <h1>向零笃行 应对气候挑战</h1>
      <p>气候变化是全球面临的共同挑战。为了响应国家适应气候变化的战略，美的集团参考国际可持续发展准则理事会（ISSB）发布的IFRS S2《国际财务报告可持续披露准则第 2 号 — 气候相关披露》的披露建议，进一步完善气候变化治理框架及气候风险的识别与管理流程，识别与自身经营相关的气候变化风险与机遇并落实气候变化应对措施，助力全球气候变化治理，全面推进美的集团可持续发展。</p>
