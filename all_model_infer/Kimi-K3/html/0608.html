<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山里的约会</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', serif;
            background: #e8e4d9;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            background: linear-gradient(to bottom, #c5d5c5 0%, #a8c4a8 30%, #d4c4a8 60%, #b8a878 100%);
            min-height: 1200px;
        }
        
        /* Sky area */
        .sky-area {
            position: relative;
            height: 380px;
            background: linear-gradient(to bottom, #c5d5c5 0%, #b8c8b8 50%, transparent 100%);
        }
        
        /* Top text */
        .top-text {
            position: absolute;
            top: 15px;
            right: 20px;
            text-align: right;
            font-size: 13px;
            color: #4a4a4a;
            line-height: 1.8;
            max-width: 380px;
        }
        
        /* Left vertical text */
        .left-vertical {
            position: absolute;
            left: 15px;
            top: 50px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 18px;
            font-weight: bold;
            color: #2a3a2a;
            letter-spacing: 8px;
            font-family: 'ZCOOL XiaoWei', serif;
        }
        
        .left-english {
            position: absolute;
            left: 15px;
            top: 280px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 16px;
            color: #3a4a3a;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }
        
        .left-autumn {
            position: absolute;
            left: 15px;
            bottom: 80px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 16px;
            color: #3a4a3a;
            letter-spacing: 4px;
            font-family: 'Georgia', serif;
        }
        
        /* Main title */
        .main-title {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-45%);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 72px;
            font-weight: bold;
            color: #1a3a1a;
            letter-spacing: 15px;
            line-height: 1.3;
            font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
            z-index: 10;
        }
        
        .main-title .small-clock {
            font-size: 36px;
            display: inline-block;
            transform: rotate(-15deg);
        }
        
        /* Landscape illustration placeholder */
        .landscape {
            position: absolute;
            top: 320px;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                #8a9a6a 20%, 
                #6a8a4a 40%, 
                #5a7a3a 60%, 
                #4a6a2a 80%, 
                #3a5a1a 100%);
            border-radius: 50% 50% 0 0 / 30% 30% 0 0;
        }
        
        .landscape::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 10%;
            width: 80%;
            height: 80px;
            background: linear-gradient(to bottom, 
                #a8b898 0%, 
                #8a9a7a 100%);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            opacity: 0.6;
        }
        
        /* Scene illustration placeholder */
        .scene-illustration {
            position: absolute;
            top: 480px;
            left: 0;
            right: 0;
            height: 500px;
            background: linear-gradient(to bottom, #b8a878 0%, #a89868 30%, #9a8860 60%, #8a7858 100%);
        }
        
        .scene-illustration::before {
            content: '[Illustration: Rural autumn scene with people working in fields, stone walls, trees with fruit, traditional oven, and mountains in background]';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #5a4a3a;
            font-size: 14px;
            text-align: center;
            width: 80%;
            line-height: 1.6;
            opacity: 0.7;
        }
        
        /* Watermark */
        .watermark {
            position: absolute;
            top: 420px;
            left: 55%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #5a6a5a;
            z-index: 5;
        }
        
        .watermark .heart {
            color: #fff;
            font-size: 16px;
        }
        
        /* Bottom text */
        .bottom-text {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 13px;
            color: #4a4a4a;
            line-height: 1.8;
        }
        
        .bottom-left {
            max-width: 200px;
        }
        
        .bottom-center {
            text-align: center;
            max-width: 180px;
        }
        
        .bottom-right {
            text-align: right;
            max-width: 200px;
        }
        
        /* Decorative elements */
        .clouds {
            position: absolute;
            top: 60px;
            left: 20%;
            width: 200px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            filter: blur(20px);
        }
        
        .clouds::after {
            content: '';
            position: absolute;
            top: 30px;
            left: 80px;
            width: 150px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            filter: blur(15px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sky and top area -->
        <div class="sky-area">
            <div class="clouds"></div>
            
            <!-- Top right text -->
            <div class="top-text">
                地上的路原来很平坦可是有太多人走过这些路过的人们太累了<br>
                于是他们决定扔下一些东西
            </div>
            
            <!-- Left vertical Chinese -->
            <div class="left-vertical">
                大班综合
            </div>
            
            <!-- Left vertical English -->
            <div class="left-english">
                TongCai 2021
            </div>
            
            <!-- Left autumn -->
            <div class="left-autumn">
                Autumn
            </div>
            
            <!-- Main title -->
            <div class="main-title">
                山里的约会
            </div>
            
            <!-- Watermark -->
            <div class="watermark">
                <span class="heart">♥</span>
                <span>@Hiro豆豆老师</span>
                <span>From 小红书</span>
            </div>
        </div>
        
        <!-- Landscape background -->
        <div class="landscape"></div>
        
        <!-- Main scene illustration -->
        <div class="scene-illustration"></div>
        
        <!-- Bottom text -->
        <div class="bottom-text">
            <div class="bottom-left">
                有的人扔下了悲伤<br>
                变成了路上的石头
            </div>
            <div class="bottom-center">
                有的人留下快乐<br>
                变成了山上的树苗
            </div>
            <div class="bottom-right">
                我把装在瓶子里的思念<br>
                放在高高的山顶上<br>
                交成了黑夜的眼睛
            </div>
        </div>
    </div>
</body>
</html>
