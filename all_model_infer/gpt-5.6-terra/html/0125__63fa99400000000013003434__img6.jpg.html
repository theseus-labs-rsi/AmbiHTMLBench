    }
    .brand {

      position: absolute;
      top: 76px;

      position: absolute;
      top: 96px;
      right: 17px;
      font-size: 47px;
      font-weight: bold;

      white-space: nowrap;
    }
    .topic-rule {
      position: absolute;
      top: 150px;
      right: 0;
      width: 231px;
      border-top: 3px solid #303030;
    }

      padding: 18px 22px 12px;
    }

      margin: 0 0 0 82px;

      line-height: 1.2;

    .meaning-one {
      margin: 23px 0 0;
      font-family: "SimSun", "Noto Serif SC", serif;
      font-size: 18px;

      letter-spacing: .2px;

      margin: 19px 0 0 37px;

<body>
  <main class="page">
    <header class="header">
      <div class="brand">人民日报</div>
      <div class="roman">RENMIN RIBAO</div>
      <div class="top-right">金句｜摘抄</div>
      <div class="top-rule"></div>
      <div class="topic">心态主题</div>
      <div class="topic-rule"></div>
    </header>

    <section class="content">
      <div class="quote-one">且行且忘且随风，<br>且行且看且从容。</div>

      <div class="meaning-label">释义：</div>
      <p class="meaning-one">
        意思是顺风而行，轻松的走着;边走边观察，不慌不忙，从<br>
        容不迫。引申意思就是当我们遇到非常不平静的时候，只<br>
        要能有一个平静的心态，才能找出平静的办法去解决，讲<br>
        的是从容面对的淡定心态。人生百味，浓缩到最后，就是<br>
        一个淡字，正确地选择与取舍，是一生必修的功课。
      </p>

      <div class="quote-two">
        我将玫瑰藏于身后风起花落，<br>
        从此鲜花赠自己，<br>
        纵马踏花向自由。
      </div>

      <div class="meaning-label second">释义：</div>
      <p class="meaning-two">
        我把心中的美好向往藏在身后，当面对现实的时候美<br>
        好的向往会随着花儿掉落，而从此以后美好赠送给自<br>
        己，骑着马儿迎着美好的往自由。
      </p>
    </section>
  </main>
