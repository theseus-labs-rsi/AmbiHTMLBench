<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家长需要关注什么</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f5f0;
      font-family: "SimSun", "Songti SC", serif;
      color: #171717;
    }
    .page {
      width: 420px;
      min-height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background:
        linear-gradient(rgba(226,205,167,.8), rgba(235,218,183,.82)),
        repeating-linear-gradient(90deg, rgba(110,80,45,.035) 0, rgba(110,80,45,.035) 1px, transparent 1px, transparent 6px);
      border-left: 1px solid #c9b993;
      border-right: 1px solid #c9b993;
      position: relative;
    }
    .header {
      height: 238px;
      position: relative;
      border-bottom: 4px solid #181713;
    }
    .banner {
      position: absolute;
      top: 56px;
      left: 72px;
      width: 347px;
      height: 125px;
      background:
        radial-gradient(ellipse at 45% 25%, rgba(194,210,169,.18) 0 16%, transparent 17%),
        radial-gradient(ellipse at 82% 84%, rgba(127,171,156,.25) 0 19%, transparent 20%),
        #277875;
      overflow: hidden;
    }
    .banner:before {
      content: "";
      position: absolute;
      left: -10px;
      bottom: 7px;
      width: 180px;
      height: 105px;
      border-radius: 50%;
      background: repeating-radial-gradient(ellipse at 80% 100%, #a1bd8a 0 2px, transparent 3px 24px);
      opacity: .9;
    }
    .deer {
      position: absolute;
      top: 24px;
      left: 69px;
      width: 98px;
      height: 116px;
      z-index: 2;
      color: #f3eed8;
      font-size: 8px;
      text-align: center;
      padding-top: 96px;
    }
    .deer:before {
      content: "";
      position: absolute;
      left: 19px;
      top: 27px;
      width: 49px;
      height: 35px;
      border-radius: 55% 45% 50% 45%;
      background: #f7f2d8;
      transform: rotate(-22deg);
      box-shadow: 8px -25px 0 -9px #f7f2d8;
    }
    .deer:after {
      content: "";
      position: absolute;
      left: 14px;
      top: 53px;
      width: 61px;
      height: 58px;
      border-left: 3px solid #f7f2d8;
      border-bottom: 3px solid #f7f2d8;
      transform: skew(-22deg);
    }
    .title {
      position: absolute;
      top: 88px;
      left: 195px;
      white-space: nowrap;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #f4ebcf;
      text-shadow: 1px 1px 1px #35615d;
    }
    .author {
      position: absolute;
      top: 138px;
      left: 268px;
      color: #f2ead0;
      font-size: 12px;
      letter-spacing: 7px;
    }
    .seal {
      position: absolute;
      left: 25px;
      bottom: 19px;
      color: #b84c3e;
      font-size: 11px;
      line-height: 9px;
      writing-mode: vertical-rl;
      letter-spacing: 1px;
      opacity: .85;
    }
    .content {
      padding: 7px 5px 9px;
    }
    .card {
      background: #fff;
      border: 1px solid #7f7667;
      height: 224px;
      margin-bottom: 9px;
      padding: 13px 23px;
      position: relative;
      box-shadow: inset 0 0 0 2px #eee7d9;
    }
    .card:last-child { margin-bottom: 0; }
    .top-grid {
      display: grid;
      grid-template-columns: 124px 1fr;
      column-gap: 16px;
      height: 100%;
    }
    .side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }
    .right.side { padding-bottom: 2px; }
    .section { font-size: 13px; line-height: 15px; }
    .label {
      width: 42px;
      height: 17px;
      margin-bottom: 6px;
      padding: 1px 0 0 10px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      line-height: 16px;
      background: #5d9e91;
      clip-path: polygon(0 15%, 72% 0, 100% 48%, 72% 94%, 0 86%);
    }
    .section p { margin: 0; }
    .center-round {
      position: absolute;
      left: 130px;
      top: 62px;
      width: 125px;
      height: 125px;
      border: 4px solid #9a8154;
      border-radius: 50%;
      background: #fbfaf5;
      box-shadow: inset 0 0 0 2px #d8d1bc;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .center-round:before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px solid #a08a63;
      border-radius: 47%;
      opacity: .85;
    }
    .vertical-text {
      position: relative;
      z-index: 2;
      color: #55938c;
      writing-mode: vertical-rl;
      font-weight: bold;
      font-size: 16px;
      line-height: 26px;
      letter-spacing: 3px;
    }
    .bottom-card {
      padding: 12px 25px;
    }
    .five-grid {
      position: relative;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 58px 58px 50px;
      column-gap: 52px;
      align-items: start;
    }
    .five-grid .section { font-size: 14px; line-height: 18px; font-weight: bold; }
    .five-grid .label { margin-bottom: 5px; }
    .five-grid .s1 { grid-column: 1; grid-row: 1; }
    .five-grid .s4 { grid-column: 2; grid-row: 1; padding-left: 5px; }
    .five-grid .s2 { grid-column: 1; grid-row: 2; }
    .five-grid .s5 { grid-column: 2; grid-row: 2; padding-left: 5px; }
    .five-grid .s3 { grid-column: 1 / span 2; grid-row: 3; }
    .bottom-round {
      position: absolute;
      left: 103px;
      top: 29px;
      width: 148px;
      height: 148px;
      border: 4px solid #91794d;
      border-radius: 50%;
      background: #fffefa;
      box-shadow: inset 0 0 0 2px #d9d0bb;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
    }
    .bottom-round:before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 3px solid #927b55;
      border-radius: 48%;
    }
    .bottom-round .vertical-text {
      font-size: 17px;
      line-height: 27px;
    }
    .card-seal {
      position: absolute;
      left: 1px;
      bottom: 1px;
      color: #bd5c4a;
      font-size: 10px;
      line-height: 8px;
      writing-mode: vertical-rl;
      opacity: .75;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="banner"></div>
      <div class="deer placeholder">[Illustration: deer]</div>
      <div class="title">家长需要关注什么</div>
      <div class="author">章·书·锋</div>
      <div class="seal">书锋</div>
    </header>

    <section class="content">
      <section class="card">
        <div class="top-grid">
          <div class="side">
            <div class="section">
              <div class="label">壹</div>
              <p>看单科成绩<br>分析优势与劣势科目</p>
            </div>
            <div class="section">
              <div class="label">贰</div>
              <p>看进步<br>横向看总体水平<br>纵向看进退情况</p>
            </div>
            <div class="section">
              <div class="label">叁</div>
              <p>分析错题</p>
            </div>
          </div>

          <div class="side right">
            <div class="section">
              <div class="label">肆</div>
              <p>分析短板：<br>是遗憾丢分？是模糊丢分？<br>是不该做丢分？<br>策略：消除遗憾，纠正模<br>糊，力争突破</p>
            </div>
            <div class="section">
              <div class="label">伍</div>
              <p>分析考试技巧<br>策略是否得当？<br>是否按标准答题？<br>是否摆正心态？</p>
            </div>
          </div>
        </div>
        <div class="center-round">
          <div class="vertical-text">成绩怎么查看</div>
        </div>
        <div class="card-seal">书锋</div>
      </section>

      <section class="card bottom-card">
        <div class="five-grid">
          <div class="section s1">
            <div class="label">壹</div>
            <p>不要过度焦虑</p>
          </div>
          <div class="section s4">
            <div class="label">肆</div>
            <p>不要过度唠叨</p>
          </div>
          <div class="section s2">
            <div class="label">贰</div>
            <p>不要过度关注孩子</p>
          </div>
          <div class="section s5">
            <div class="label">伍</div>
            <p>不要盲目攀比和迷信</p>
          </div>
          <div class="section s3">
            <div class="label">叁</div>
            <p>不要给孩子过高的期望</p>
          </div>
          <div class="bottom-round">
            <div class="vertical-text">家长五不要</div>
          </div>
        </div>
        <div class="card-seal">书锋</div>
      </section>
    </section>
  </main>
</body>
</html>
