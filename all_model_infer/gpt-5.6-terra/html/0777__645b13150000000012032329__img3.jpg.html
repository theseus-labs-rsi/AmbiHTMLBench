<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三頁</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #dad9d4;
      font-family: "KaiTi", "STKaiti", "DFKai-SB", serif;
      color: #252322;
    }
    .paper {
      position: relative;
      width: min(100vw, 920px);
      min-height: 75vw;
      margin: 0 auto;
      overflow: hidden;
      background-color: #efefea;
      background-image:
        linear-gradient(rgba(123, 145, 150, .24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 145, 150, .24) 1px, transparent 1px);
      background-size: 28px 28px;
      box-shadow: inset 0 0 18px rgba(0,0,0,.12);
    }
    .page-fold {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 37%;
      width: 15px;
      background: linear-gradient(90deg, rgba(50,50,45,.13), rgba(255,255,255,.27), rgba(50,50,45,.09));
      opacity: .75;
    }
    .heading {
      position: absolute;
      top: 11px;
      left: 7%;
      margin: 0;
      color: #ffff43;
      font-family: Arial, sans-serif;
      font-size: clamp(17px, 4vw, 29px);
      font-weight: 900;
      font-style: italic;
      line-height: 1;
      letter-spacing: 0;
      text-shadow:
        -2px -2px 0 #343425,
         2px -2px 0 #343425,
        -2px  2px 0 #343425,
         2px  2px 0 #343425;
      z-index: 2;
    }
    .writing {
      position: absolute;
      inset: 48px 6% 22px 7%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      direction: rtl;
    }
    .column {
      width: 13%;
      min-height: 290px;
      font-size: clamp(16px, 3.45vw, 28px);
      line-height: 1.08;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 1px;
      white-space: normal;
      text-align: left;
      transform: rotate(-1deg);
    }
    .column:nth-child(2) { transform: rotate(1deg); margin-top: 8px; }
    .column:nth-child(3) { transform: rotate(-2deg); margin-top: -8px; }
    .column:nth-child(4) { transform: rotate(1deg); margin-top: 11px; }
    .column:nth-child(5) { transform: rotate(-1deg); margin-top: 78px; }
    .column:nth-child(6) { transform: rotate(2deg); margin-top: 121px; }
    .column:nth-child(7) { transform: rotate(-2deg); margin-top: 102px; }
    .seal {
      position: absolute;
      left: 13.4%;
      top: 55.8%;
      width: 31px;
      height: 39px;
      border: 2px solid #b63322;
      color: #b63322;
      background: rgba(183, 49, 34, .12);
      font-family: serif;
      font-size: 11px;
      line-height: 12px;
      text-align: center;
      padding-top: 4px;
      transform: rotate(-3deg);
    }
    @media (max-width: 560px) {
      .paper { min-height: 405px; }
      .writing { inset-top: 45px; }
      .column { min-height: 286px; }
    }
  </style>
</head>
<body>
  <main class="paper" aria-label="手寫中文文件第三頁">
    <div class="page-fold"></div>
    <h1 class="heading">第三頁</h1>

    <section class="writing" aria-label="手寫內容">
      <div class="column">因客即在報告時，寫一段關於採購流程之事項。</div>
      <div class="column">南華寫，麥購大中之事，還有今</div>
      <div class="column">甲生稱，老分利用台灣採購部份</div>
      <div class="column">物品辦，收於公司抱機器與用</div>
      <div class="column">十經用之財料。</div>
      <div class="column">竟了，以經三字，記錄有關</div>
      <div class="column">重要之物品設備，並將其保存。</div>
    </section>

    <div class="seal" aria-label="紅色印章">[印<br>章]</div>
  </main>
</body>
</html>
