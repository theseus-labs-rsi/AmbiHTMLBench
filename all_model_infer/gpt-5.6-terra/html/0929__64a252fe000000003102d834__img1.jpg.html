<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>头孢菌素分类</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      background:#08755f;
      font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;
      color:#eceee0;
    }
    .page{
      position:relative;
      width:540px;
      height:400px;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 70% 0%,rgba(37,151,119,.30),transparent 45%),
        linear-gradient(90deg,#087762 0%,#08745d 100%);
    }
    .title{
      height:39px;
      padding:3px 0 0 9px;
      color:#e5ed36;
      font-size:20px;
      font-weight:bold;
      line-height:31px;
      text-shadow:0 0 1px #d7eb3f;
      position:relative;
    }
    .star{
      position:absolute;
      left:163px;
      top:0;
      width:35px;
      height:34px;
      color:#e7f131;
      font-size:42px;
      line-height:31px;
      font-family:cursive;
      font-weight:normal;
      transform:rotate(-15deg);
    }
    .top-table{
      margin-left:4px;
      width:536px;
      height:151px;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:18px;
      line-height:27px;
      font-weight:500;
    }
    .top-table td{
      border:2px solid rgba(238,244,231,.72);
      padding:0 10px;
      vertical-align:middle;
      white-space:nowrap;
    }
    .top-table .side{
      width:80px;
      text-align:center;
      padding:0;
      line-height:27px;
    }
    .top-table .gen{
      width:82px;
      padding-left:11px;
      color:#e7ed35;
      font-weight:bold;
    }
    .drug{padding-left:9px!important}
    .yellow{
      color:#e7ec33;
      font-weight:bold;
      text-shadow:0 0 1px #f4ed2c;
    }
    .circle{
      display:inline-block;
      border:3px solid #e8ef27;
      border-radius:50%;
      padding:0 2px;
      line-height:23px;
      transform:rotate(-12deg);
    }
    .bottom{
      position:absolute;
      left:4px;
      top:197px;
      width:536px;
      display:flex;
      align-items:flex-start;
    }
    .mnemonic{
      width:346px;
      height:195px;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:18px;
      line-height:31px;
    }
    .mnemonic td{
      border:2px solid rgba(238,244,231,.72);
      padding:0 8px;
      white-space:nowrap;
    }
    .mnemonic .memo-title{
      text-align:center;
      font-size:19px;
      height:30px;
      color:#e6e9df;
    }
    .mnemonic .generation{
      width:90px;
      color:#e8ed33;
      font-weight:bold;
      padding-left:7px;
    }
    .pictures{
      width:186px;
      height:210px;
      margin-left:4px;
      display:grid;
      grid-template-columns:92px 92px;
      grid-auto-rows:105px;
      overflow:hidden;
    }
    .placeholder{
      position:relative;
      overflow:hidden;
      border:1px solid rgba(235,235,225,.75);
      background:#f6f5e7;
      color:#555;
      font-size:10px;
    }
    .placeholder span{
      position:absolute;
      left:4px;
      bottom:2px;
      opacity:.72;
    }
    .toilet{
      background:
        radial-gradient(circle at 28px 31px,#fff 0 9px,#222 10px 11px,transparent 12px),
        radial-gradient(ellipse at 61px 36px,#fff 0 14px,#777 15px 16px,transparent 17px),
        linear-gradient(90deg,#fbfbef,#ecebdc);
    }
    .toilet:before{
      content:"";
      position:absolute;
      left:54px;top:8px;
      width:20px;height:47px;
      border:2px solid #777;
      border-radius:10px 10px 13px 13px;
      background:#fafaf2;
    }
    .toilet:after{
      content:"";
      position:absolute;
      left:18px;top:45px;
      width:25px;height:40px;
      border-left:2px solid #555;
      border-bottom:2px solid #555;
      transform:rotate(-18deg);
    }
    .food{
      background:
        radial-gradient(ellipse at 40px 74px,#d9b76e 0 28px,transparent 29px),
        linear-gradient(133deg,#5c3a28 0 34%,#8c6852 35% 61%,#251f1c 62% 100%);
    }
    .food:before{
      content:"";
      position:absolute;
      left:31px;top:34px;
      width:51px;height:54px;
      border-radius:50%;
      background:radial-gradient(circle at 22px 18px,#f1d9c8 0 16px,#d2a691 17px 21px,transparent 22px);
    }
    .dance{
      background:
        radial-gradient(ellipse at 47px 36px,#f28a9b 0 41px,transparent 42px),
        linear-gradient(145deg,#f5d7d0 0 45%,#f9f6eb 46% 100%);
    }
    .dance:before{
      content:"";
      position:absolute;
      left:36px;top:49px;
      width:14px;height:42px;
      background:#151514;
      transform:rotate(27deg);
      box-shadow:17px 9px 0 -2px #151514;
    }
    .cow{
      background:#f8f5e7;
    }
    .cow:before{
      content:"";
      position:absolute;
      top:39px;left:15px;
      width:67px;height:34px;
      border-radius:45% 48% 40% 35%;
      background:#a7907c;
      box-shadow:17px -11px 0 -6px #5e5048;
    }
    .cow:after{
      content:"";
      position:absolute;
      top:48px;left:33px;
      width:18px;height:12px;
      border-radius:50%;
      background:#473c37;
      box-shadow:26px 5px 0 -3px #473c37;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">1.头孢菌素分类<span class="star">☆</span></div>

    <table class="top-table">
      <tr>
        <td class="side" rowspan="4">头孢<br>菌素类</td>
        <td class="gen">第一代</td>
        <td class="drug">头孢唑林、<span class="yellow">氨苄</span>、<span class="yellow">羟氨苄</span>、<span class="yellow">拉定</span>、<span class="yellow">硫脒</span>、<span class="yellow">噻吩</span></td>
      </tr>
      <tr>
        <td class="gen">第二代</td>
        <td class="drug">头孢呋辛、<span class="yellow">孟多</span>、<span class="yellow">替硝安</span>、<span class="yellow">克洛</span>、<span class="yellow">丙烯</span></td>
      </tr>
      <tr>
        <td class="gen">第<span class="circle">三</span>代</td>
        <td class="drug">头孢他啶、他唑、<span class="yellow">匹胺</span>、<span class="yellow">哌酮</span>、<span class="yellow">曲松</span>、<span class="yellow">噻肟</span>、<br>克肟、唑酮、甲肟、泊肟、<span class="yellow">曲尼</span></td>
      </tr>
      <tr>
        <td class="gen">第四代</td>
        <td class="drug">头孢<span class="yellow">匹罗</span>、<span class="yellow">吡肟</span></td>
      </tr>
    </table>

    <div class="bottom">
      <table class="mnemonic">
        <tr><td class="memo-title" colspan="2">记忆一下</td></tr>
        <tr>
          <td class="generation">第一代</td>
          <td>一头坐<span class="yellow">便拉定</span>，<span class="yellow">米粉</span>吃多了</td>
        </tr>
        <tr>
          <td class="generation">第二代</td>
          <td>二<span class="yellow">呋孟多</span>，<span class="yellow">替硝克丙</span></td>
        </tr>
        <tr>
          <td class="generation">第三代</td>
          <td><span class="yellow">他啶唑曲肟三妹地</span></td>
        </tr>
        <tr>
          <td class="generation">第四代</td>
          <td><span class="yellow">四匹罗子吡肟牛</span></td>
        </tr>
      </table>

      <div class="pictures">
        <div class="placeholder toilet"><span>[插图]</span></div>
        <div class="placeholder food"><span>[照片]</span></div>
        <div class="placeholder dance"><span>[插图]</span></div>
        <div class="placeholder cow"><span>[插图]</span></div>
      </div>
    </div>
  </div>
</body>
</html>
