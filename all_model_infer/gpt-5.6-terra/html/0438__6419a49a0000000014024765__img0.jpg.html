<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Worksheet</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      font-family: "Songti SC", "SimSun", serif;
    }
    .canvas {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .blank-top {
      height: 157px;
      background: #fff;
    }
    .photo {
      height: 406px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(118deg, rgba(36,24,8,.72) 0 20%, rgba(102,72,24,.46) 20% 38%, rgba(240,217,164,.7) 39% 66%, rgba(181,144,82,.22) 66% 100%),
        repeating-linear-gradient(8deg, #78551d 0 2px, #906b2c 3px 4px, #b18d4d 5px 6px);
    }
    .paper {
      position: absolute;
      top: 96px;
      left: 22px;
      width: 520px;
      height: 318px;
      padding: 29px 20px 15px 21px;
      background: linear-gradient(105deg, #e7e3d8 0%, #f6f5ed 42%, #fbfbf8 100%);
      transform: rotate(2.2deg);
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
      color: #2d2a28;
    }
    .number {
      position: absolute;
      left: 20px;
      top: 28px;
      font-family: "Times New Roman", serif;
      font-style: italic;
      font-size: 31px;
      color: #171717;
      transform: rotate(-7deg);
    }
    .question {
      margin-left: 42px;
      width: 410px;
      font-size: 12px;
      line-height: 2.3;
      letter-spacing: .1px;
      color: #383634;
    }
    .handwriting {
      position: absolute;
      left: 22px;
      top: 69px;
      width: 465px;
      color: #242220;
      font-family: "KaiTi", "STKaiti", "DFKai-SB", cursive;
      font-size: 34px;
      line-height: 1.12;
      letter-spacing: 1px;
      font-weight: 400;
      transform: rotate(-1.6deg);
    }
    .handwriting .line {
      height: 43px;
      white-space: nowrap;
    }
    .handwriting .small-gap { margin-left: 10px; }
    .cutoff-print {
      position: absolute;
      right: -17px;
      top: 116px;
      width: 34px;
      color: #777;
      font-size: 9px;
      line-height: 2.2;
      transform: rotate(2deg);
    }
    .bottom-white {
      height: 157px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blank-top"></div>
    <div class="photo">
      <div class="paper">
        <div class="number">26</div>
        <div class="question">
          你的女儿在国家展览馆上看到下某样让她十分舒服的东西。<br>
          她看到了什么呢？
        </div>
        <div class="handwriting">
          <div class="line">我看见朱“这报纸有让你感</div>
          <div class="line">到不舒服吗？”</div>
          <div class="line">展览会上是一尊白玉莹莹的雕</div>
          <div class="line">塑，下面的文字介绍了引内是她</div>
          <div class="line">的来历，说是女人给她自由的雕饰化。</div>
        </div>
        <div class="cutoff-print">另一个<br>多样</div>
      </div>
    </div>
    <div class="bottom-white"></div>
  </div>
</body>
</html>
