<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易被忽视的养生小动作</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      background: #d0cfca;
      font-family: "STSong", "SimSun", "Songti SC", serif;
      color: #353535;
    }
    .page {
      width: 540px;
      min-height: 1138px;
      margin: 0 auto;
      padding: 18px 14px 8px 17px;
      background:
        radial-gradient(circle at 18% 10%, rgba(70,70,70,.08) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 24%, rgba(70,70,70,.06) 0 1px, transparent 2px),
        radial-gradient(circle at 35% 74%, rgba(255,255,255,.19) 0 2px, transparent 3px),
        linear-gradient(90deg, rgba(75,75,75,.06), transparent 10%, transparent 90%, rgba(75,75,75,.05)),
        #d4d3ce;
      background-size: 19px 17px, 23px 27px, 31px 29px, 100% 100%, auto;
      box-shadow: inset -4px 0 5px rgba(0,0,0,.13);
      overflow: hidden;
    }
    h1 {
      margin: 0 0 20px 22px;
      font-size: 42px;
      line-height: 1.15;
      letter-spacing: 2px;
      font-weight: 700;
      color: #303030;
      white-space: nowrap;
    }
    .section {
      margin: 0;
    }
    .text {
      margin: 0;
      font-size: 39px;
      line-height: 1.38;
      letter-spacing: 0;
      font-weight: 400;
      text-align: justify;
      text-justify: inter-ideograph;
    }
    .heading {
      display: inline-block;
      margin-left: 90px;
      margin-right: 28px;
      font-weight: 700;
      white-space: nowrap;
    }
    .section-two {
      margin-top: 0;
    }
    .section-two .heading {
      margin-left: 91px;
      margin-right: 28px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>易被忽视的养生小动作</h1>

    <section class="section">
      <p class="text"><span class="heading">梳头</span>梳头是脑部运动最理想的项目，它可以刺激穴位，增强分泌活动，改善血液循环，促进新陈代谢。此外，梳头还是治疗失眠、眩晕、心悸、中风后遗症和青少年白发的辅助手段。平时每天可梳头3至5次，每次不少于3至5分钟，其中晚上睡前必须要梳一次。</p>
    </section>

    <section class="section section-two">
      <p class="text"><span class="heading">伸懒腰</span>伸懒腰会使人体的脏器对心、肺产生挤压。持续几秒钟的伸懒腰，使很多淤积的血液被赶回心脏，改善血液循环，使更多的含氧量的血液供给大脑，还可带走肌肉的一些废物，从而消除人体的疲劳。</p>
    </section>
  </main>
</body>
