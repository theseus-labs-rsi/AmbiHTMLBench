<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals &amp; Objectives</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-width: 1024px;
      height: 100%;
      min-height: 768px;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #3d1d1b;
    }
    .page {
      position: relative;
      width: 1024px;
      height: 768px;
      margin: 0 auto;
      background: #fff;
    }
    h1 {
      position: absolute;
      top: 17px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-weight: 400;
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: -1.8px;
      color: #3d1d1b;
    }
    .subtitle {
      position: absolute;
      top: 143px;
      left: 63px;
      margin: 0;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -1px;
      white-space: nowrap;
    }
    .goals {
      position: absolute;
      left: 41px;
      top: 252px;
      width: 500px;
      color: #187d80;
      font-size: 42px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1.3px;
    }
    .goals .goal {
      height: 79px;
      white-space: nowrap;
    }
    .goals .gap {
      height: 49px;
    }
    .brace {
      position: absolute;
      width: 98px;
      border-right: 8px solid #3d1d1b;
      border-radius: 0 15px 15px 0;
    }
    .brace.top {
      left: 558px;
      top: 249px;
      height: 261px;
      border-top: 8px solid #3d1d1b;
      border-bottom: 8px solid #3d1d1b;
    }
    .brace.bottom {
      left: 566px;
      top: 534px;
      height: 176px;
      border-top: 8px solid #3d1d1b;
      border-bottom: 8px solid #3d1d1b;
    }
    .arrow {
      position: absolute;
      width: 109px;
      height: 86px;
    }
    .arrow .shaft {
      position: absolute;
      top: 30px;
      right: 0;
      width: 68px;
      height: 44px;
      background: #187d80;
    }
    .arrow .head {
      position: absolute;
      left: 0;
      top: 8px;
      width: 0;
      height: 0;
      border-top: 36px solid transparent;
      border-bottom: 36px solid transparent;
      border-right: 41px solid #187d80;
    }
    .arrow.one {
      left: 666px;
      top: 312px;
    }
    .arrow.two {
      left: 666px;
      top: 552px;
    }
    .theory {
      position: absolute;
      top: 282px;
      left: 808px;
      width: 177px;
      text-align: center;
      font-size: 40px;
      line-height: 1.16;
      letter-spacing: -1px;
      font-weight: 400;
    }
    .organization {
      position: absolute;
      top: 544px;
      left: 779px;
      width: 228px;
      text-align: center;
      font-size: 40px;
      line-height: 1.12;
      letter-spacing: -1.2px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Goals &amp; Objectives</h1>

    <p class="subtitle">From January 1, 2016 – December 31, 2018, we will:</p>

    <section class="goals" aria-label="Goals">
      <div class="goal">Goal 1: XX</div>
      <div class="goal">Goal 2: XX</div>
      <div class="goal">Goal 3: XX</div>
      <div class="gap"></div>
      <div class="goal">Goal 4: Money</div>
      <div class="goal">Goal 5: People &amp; Infrastructure</div>
    </section>

    <div class="brace top" aria-hidden="true"></div>
    <div class="arrow one" aria-hidden="true"><span class="head"></span><span class="shaft"></span></div>
    <div class="theory">Theory<br>of<br>Change<br>Goals</div>

    <div class="brace bottom" aria-hidden="true"></div>
    <div class="arrow two" aria-hidden="true"><span class="head"></span><span class="shaft"></span></div>
    <div class="organization">Organization<br>Goals</div>
  </main>
</body>
</html>
