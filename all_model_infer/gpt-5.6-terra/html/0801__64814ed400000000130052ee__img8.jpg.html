<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loneliness Quote</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #291c3a;
      color: #c5ad77;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    }
    .page {
      width: min(100vw, 540px);
      min-height: 717px;
      height: 100vh;
      min-height: min(717px, 100vh);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #291c3a;
      padding-top: 132px;
    }
    .symbol {
      width: 170px;
      height: 160px;
      position: relative;
      margin: 0 auto;
    }
    .sun {
      position: absolute;
      width: 142px;
      height: 72px;
      left: 14px;
      top: 4px;
      overflow: hidden;
      border: 1.5px solid #c5ad77;
      border-radius: 142px 142px 0 0;
    }
    .sun::before,
    .sun::after {
      content: "";
      position: absolute;
      top: -28px;
      width: 1px;
      height: 118px;
      background: #9c895f;
      transform-origin: bottom center;
    }
    .sun::before {
      left: 35px;
      transform: rotate(-42deg);
      box-shadow: 28px 0 #9c895f, 56px 0 #9c895f, 84px 0 #9c895f;
    }
    .sun::after {
      left: 48px;
      transform: rotate(-20deg);
      box-shadow: 28px 0 #9c895f, 56px 0 #9c895f;
    }
    .diamond {
      position: absolute;
      width: 114px;
      height: 114px;
      left: 28px;
      top: 22px;
      border: 2px solid #c5ad77;
      transform: rotate(45deg);
    }
    .diamond::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid #a99468;
    }
    .venus {
      position: absolute;
      width: 48px;
      height: 68px;
      left: 61px;
      top: 49px;
      z-index: 2;
    }
    .venus .circle {
      position: absolute;
      top: 0;
      left: 4px;
      width: 43px;
      height: 43px;
      border: 2px solid #c5ad77;
      border-radius: 50%;
    }
    .venus .stem {
      position: absolute;
      left: 25px;
      top: 43px;
      width: 2px;
      height: 25px;
      background: #c5ad77;
    }
    .venus .cross {
      position: absolute;
      left: 15px;
      top: 54px;
      width: 22px;
      height: 2px;
      background: #c5ad77;
    }
    .english {
      margin: 35px auto 0;
      width: 460px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 14px;
      color: #c4b08a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 21px;
      font-weight: 300;
      text-align: center;
    }
    .star {
      flex: 0 0 auto;
      color: #d6ba79;
      font-size: 25px;
      line-height: 35px;
      margin-top: -5px;
    }
    .english p {
      margin: 0;
      white-space: nowrap;
    }
    .quote {
      margin: 26px auto 0;
      color: #c7b17e;
      text-align: center;
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      font-size: 22px;
      line-height: 29px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 2px rgba(205, 183, 129, .2);
    }
    .quote .open,
    .quote .close {
      display: inline-block;
      vertical-align: top;
      font-family: Georgia, serif;
      font-size: 27px;
      line-height: 20px;
      margin: 0 10px;
    }
    .quote .close { vertical-align: bottom; }
    @media (max-width: 500px) {
      .english { width: 94%; gap: 8px; font-size: 12px; }
      .english p { white-space: normal; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder symbol" role="img" aria-label="Geometric Venus symbol">
      <div class="sun"></div>
      <div class="diamond"></div>
      <div class="venus">
        <div class="circle"></div>
        <div class="stem"></div>
        <div class="cross"></div>
      </div>
    </div>

    <section class="english" aria-label="English quote">
      <span class="star">✦</span>
      <p>I think the so-called loneliness refers to the person you are facing,<br>whose emotions are not on the same frequency as your own.</p>
      <span class="star">✦</span>
    </section>

    <section class="quote" lang="zh">
      <span class="open">“</span> 我想所谓孤独，<br>
      就是你面对那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。 <span class="close">”</span>
    </section>
  </main>
</body>
</html>
