<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一月-任务</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
    }

    .document {
      width: 540px;
      min-height: 405px;
      padding: 68px 22px 0 13px;
    }

    h1 {
      margin: 0 0 16px 4px;
      font-size: 24px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
      text-align: center;
    }

    th,
    td {
      height: 31px;
      padding: 5px 4px;
      border: 1px solid #8b8b8b;
      vertical-align: middle;
      font-weight: 400;
      white-space: nowrap;
    }

    th {
      height: 27px;
      background: #ffffff;
      font-weight: 700;
    }

    tbody tr:nth-child(odd) td {
      background: #d9e6f3;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 7.5%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 21%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 13%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 26%;
    }

    th:nth-child(5),
    td:nth-child(5) {
      width: 13%;
    }

    th:nth-child(6),
    td:nth-child(6) {
      width: 19.5%;
    }
  </style>
</head>
<body>
  <main class="document">
    <h1>一月-任务</h1>
    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>任务描述</th>
          <th>岗位</th>
          <th>操作动作</th>
          <th>开始时间</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>租机房</td>
          <td>总经理</td>
          <td>申请60w租户房</td>
          <td>1月1日</td>
          <td>花60w租厂房</td>
        </tr>
        <tr>
          <td>2</td>
          <td>资质开发</td>
          <td>总经理</td>
          <td>P3资质开发</td>
          <td>1月1日</td>
          <td>申请20w资质开发</td>
        </tr>
        <tr>
          <td>3</td>
          <td>批拨款</td>
          <td>财务</td>
          <td>批准</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>支付管理费</td>
          <td>财务</td>
          <td>5w管理费</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>5</td>
          <td>建设生产线</td>
          <td>生产</td>
          <td>4条自动线生产P3</td>
          <td>1月1日</td>
          <td>申请200w资金建设线</td>
        </tr>
        <tr>
          <td>6</td>
          <td>iso开发</td>
          <td>总经理</td>
          <td>两个iso的开发</td>
          <td>1月1日</td>
          <td>申请资金开发</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
