<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫砂都有哪些款？</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 720px;
      background: #f8e3d7;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #25262b;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
    }
    .sheet {
      position: absolute;
      left: 15px;
      top: 53px;
      width: 510px;
      height: 644px;
      background: #fff;
      border: 4px solid #aad3ce;
      border-radius: 11px;
      padding: 39px 9px 10px;
    }
    .title {
      position: absolute;
      z-index: 4;
      top: 19px;
      left: 79px;
      width: 382px;
      height: 69px;
      border: 4px solid #afd7d4;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      line-height: 61px;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #9b9b9b;
      white-space: nowrap;
    }
    .title .question {
      color: #ffe030;
      -webkit-text-stroke: 3px #263039;
      margin-left: 7px;
      font-size: 43px;
      vertical-align: -2px;
    }
    .section-title {
      height: 40px;
      display: flex;
      align-items: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 1px 1px 0 #aaa;
      white-space: nowrap;
    }
    .pin {
      position: relative;
      display: inline-block;
      width: 15px;
      height: 22px;
      margin: 0 3px 0 4px;
    }
    .pin::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      top: 3px;
      left: 1px;
      border-radius: 50%;
      background: #ef4055;
      box-shadow: 0 0 0 2px #fff, 0 0 2px 3px #b7b7b7;
    }
    .pin::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 12px;
      width: 2px;
      height: 10px;
      background: #666;
      transform: rotate(5deg);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 17px;
    }
    th {
      height: 49px;
      background: #677181;
      color: white;
      font-size: 18px;
      font-weight: 700;
      border: 1px solid #87909d;
    }
    td {
      height: 54px;
      border: 1px solid #ddd;
      text-align: center;
      vertical-align: middle;
      line-height: 25px;
      padding: 3px 5px;
    }
    .size-table td:nth-child(1) { width: 24%; }
    .size-table td:nth-child(2) { width: 18%; }
    .size-table td:nth-child(3) { width: 25%; }
    .size-table td:nth-child(4) { width: 33%; }
    .size-table .small { font-size: 16px; }
    .circled {
      position: relative;
      display: inline-block;
      z-index: 1;
    }
    .circled::before {
      content: "";
      position: absolute;
      left: -13px;
      top: -10px;
      width: 74px;
      height: 42px;
      border: 3px solid #d98791;
      border-radius: 50%;
      transform: rotate(-13deg);
    }
    .recommend-note {
      position: absolute;
      top: 230px;
      left: 67px;
      z-index: 3;
      font-size: 18px;
      font-weight: 900;
      line-height: 23px;
      white-space: nowrap;
      text-shadow: 1px 1px 0 #d4d4d4;
    }
    .summary {
      position: absolute;
      right: 17px;
      top: 309px;
      z-index: 5;
      width: 199px;
      height: 32px;
      padding-top: 4px;
      text-align: center;
      background: #c84b2f;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      transform: rotate(0.4deg);
      box-shadow: 1px 1px 1px #a7a7a7;
      white-space: nowrap;
    }
    .summary b { font-size: 18px; }
    .species-title {
      margin-top: 5px;
      height: 40px;
    }
    .species-table th {
      height: 38px;
      background: #2e707b;
      border-color: #8aaeb2;
      font-size: 17px;
    }
    .species-table td {
      height: 49px;
      font-size: 16px;
      line-height: 24px;
      padding: 2px 4px;
    }
    .species-table td:nth-child(1) { width: 24%; }
    .species-table td:nth-child(2) { width: 34%; }
    .species-table td:nth-child(3) { width: 42%; }
    .species-table tr:nth-child(3) td { height: 59px; }
    .species-table tr:nth-child(4) td { height: 40px; }
    .ratio {
      color: #d84037;
      font-size: 18px;
      font-weight: 900;
    }
    .family-note {
      position: absolute;
      z-index: 6;
      left: 47px;
      top: 535px;
      height: 25px;
      color: #fff629;
      font-size: 18px;
      font-weight: 900;
      line-height: 25px;
      letter-spacing: -1px;
      white-space: nowrap;
      text-shadow:
        -2px -2px 0 #4d5828,
         2px -2px 0 #4d5828,
        -2px  2px 0 #4d5828,
         2px  2px 0 #4d5828,
         1px  1px 0 #4d5828;
    }
    .family-note .house {
      display: inline-block;
      color: white;
      font-size: 18px;
      text-shadow:
        -2px -2px 0 #536154,
         2px -2px 0 #536154,
        -2px  2px 0 #536154,
         2px  2px 0 #536154;
    }
    .check {
      display: inline-block;
      min-width: 19px;
      height: 19px;
      margin-left: 4px;
      border-radius: 3px;
      background: #18bb42;
      color: #fff;
      font-size: 17px;
      text-align: center;
      line-height: 19px;
      text-shadow: none;
      vertical-align: 1px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">猫砂都有哪些款<span class="question">?</span></div>

    <main class="sheet">
      <div class="section-title"><span class="pin"></span>三种猫砂尺寸哪个是你最爱</div>

      <table class="size-table" aria-label="猫砂尺寸比较">
        <thead>
          <tr>
            <th>尺寸</th>
            <th>重量</th>
            <th>结团效果</th>
            <th>其他</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1.5mm</td>
            <td>轻</td>
            <td>上</td>
            <td class="small">易带出，价格<br>略高</td>
          </tr>
          <tr>
            <td><span class="circled">2mm</span></td>
            <td>中</td>
            <td>中</td>
            <td>综合性价比高</td>
          </tr>
          <tr>
            <td>3mm</td>
            <td>重</td>
            <td>67</td>
            <td class="small">推荐度低，但<br>价格也低</td>
          </tr>
        </tbody>
      </table>

      <div class="recommend-note">综合性价比推荐</div>

      <div class="section-title species-title"><span class="pin"></span>猫砂都有哪些种类</div>
      <div class="summary">总结: <b>2mm混合砂yyds</b></div>

      <table class="species-table" aria-label="猫砂种类比较">
        <thead>
          <tr>
            <th>种类</th>
            <th>优点</th>
            <th>其他</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>膨润土</td>
            <td>价格低廉</td>
            <td>粉尘大</td>
          </tr>
          <tr>
            <td>豆腐猫砂</td>
            <td>原料更安全，闻起来<br>也比较好</td>
            <td>价格偏高，纯豆腐结团略差</td>
          </tr>
          <tr>
            <td>混合猫砂</td>
            <td>结合上述优点，价格<br>适中</td>
            <td>比例推荐 <span class="ratio">7:3或6:4</span>，结团<br>快且用量省</td>
          </tr>
          <tr>
            <td>沸石</td>
            <td>可循环利用</td>
            <td>需要自己洗</td>
          </tr>
          <tr>
            <td>其他新型原料</td>
            <td>价格高，新颖</td>
            <td>效果待考核，贵</td>
          </tr>
        </tbody>
      </table>

      <div class="family-note"><span class="house">⌂</span> 普通养宠家庭建议满足需求<span class="check">✓</span></div>
    </main>
  </div>
</body>
</html>
