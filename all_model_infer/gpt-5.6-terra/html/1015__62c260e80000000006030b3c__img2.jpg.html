<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建议、提案</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      background: #e8e4d9;
      font-family: "KaiTi", "STKaiti", "FangSong", "SimSun", serif;
      color: #111;
    }
    .page {
      position: relative;
      width: 540px;
      min-height: 710px;
      overflow: hidden;
      padding: 17px 42px 55px 22px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.28), rgba(247,244,231,.68)),
        #f4f1e4;
      box-shadow: 0 0 10px rgba(0,0,0,.08);
    }
    .binding {
      position: absolute;
      top: 0;
      right: 0;
      width: 29px;
      height: 100%;
      border-left: 2px solid #aaa89d;
      background: #c9d0c5;
      opacity: .85;
    }
    .tab {
      position: absolute;
      right: 0;
      width: 28px;
      height: 55px;
      border: 2px solid #aaa89d;
      border-right: none;
      border-radius: 0 0 0 18px;
      background: #efeee5;
    }
    .tab:nth-child(1) { top: 0; height: 32px; border-radius: 0 0 0 15px; }
    .tab:nth-child(2) { top: 28px; }
    .tab:nth-child(3) { top: 82px; }
    .tab:nth-child(4) { top: 136px; }
    .tab:nth-child(5) { top: 190px; }
    .tab:nth-child(6) { top: 244px; }
    .tab:nth-child(7) { top: 298px; }
    .tab:nth-child(8) { top: 352px; }
    .tab:nth-child(9) { top: 406px; }
    .tab:nth-child(10) { top: 460px; }
    .tab:nth-child(11) { top: 514px; }
    .tab:nth-child(12) { top: 568px; }
    .tab:nth-child(13) { top: 622px; }
    .heading {
      margin: 0 0 5px;
      text-align: center;
      color: #a02b2b;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 5px;
      line-height: 1.25;
    }
    .intro {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.78;
      letter-spacing: .5px;
    }
    .format {
      margin: 31px 0 5px;
      color: #ae5e35;
      font-size: 18px;
      font-weight: bold;
    }
    .example {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.75;
      letter-spacing: .45px;
    }
    .doc-title {
      margin-top: 2px;
      text-align: center;
      font-size: 19px;
      line-height: 1.7;
    }
    .doc-subtitle {
      text-align: center;
      font-size: 18px;
      line-height: 1.55;
    }
    .recipient {
      margin-top: 2px;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .paragraph {
      margin: 1px 0 0;
      text-indent: 2em;
    }
    .blue {
      color: #407d9c;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .list {
      margin: 5px 0 0 39px;
      line-height: 1.78;
    }
    .closing {
      margin-top: 2px;
      text-align: right;
      line-height: 1.7;
      padding-right: 2px;
    }
    .closing .issuer,
    .closing .date {
      display: inline-block;
      border-bottom: 1px solid #111;
      line-height: 1.22;
    }
    .closing .date {
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="binding" aria-hidden="true">
      <div class="tab"></div><div class="tab"></div><div class="tab"></div>
      <div class="tab"></div><div class="tab"></div><div class="tab"></div>
      <div class="tab"></div><div class="tab"></div><div class="tab"></div>
      <div class="tab"></div><div class="tab"></div><div class="tab"></div>
      <div class="tab"></div>
    </div>

    <h1 class="heading">二、建议、提案</h1>

    <p class="intro">
      建议是指下级部门因为某个重要事项的解决，需要向上<br>
      级提出解决问题想法的文体。具体写作技巧包括以下几<br>
      个方面。提案一般为政协提案，具体格式见示例：
    </p>

    <div class="format">格式：</div>

    <section class="example">
      <div class="doc-title">关于xxxx的建议</div>
      <div class="doc-subtitle">（“发文机关+关于+内容+文种”）</div>
      <div class="recipient">各级领导(称谓要根据具体题目要求分析得出):</div>

      <p class="paragraph">
        当前，...等问题比较突出(或做了什么工作)，为了<br>
        做好__工作，提出以下建议:<span class="blue">(开头为背景分析，指出存<br>在的主要问题和目的意义)</span>
      </p>

      <div class="list">
        一、.....<br>
        二、.....<br>
        三、.....<span class="blue">(主体内容还原为对策题提出解决问题的措<br>施)</span>
      </div>

      <div class="closing">
        <span class="issuer">发文机关</span><br>
        <span class="date">xx 年 xx 月 xx 日</span>
      </div>
    </section>
  </main>
</body>
</html>
