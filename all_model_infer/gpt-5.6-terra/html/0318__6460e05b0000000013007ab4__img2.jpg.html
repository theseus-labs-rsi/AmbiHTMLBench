<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王源机场私服Look</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .document {
      width: 100vw;
      max-width: 540px;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 37% 26% 37%;
      overflow: hidden;
      background: #fff;
    }

    .photo-panel {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(15, 28, 36, .95) 0 17%, transparent 17% 100%),
        linear-gradient(110deg, #72b4cf 0%, #c5d7dd 21%, #66787b 53%, #8a796f 100%);
    }

    .photo-panel::before,
    .photo-panel::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .left-photo::before {
      width: 74%;
      height: 30%;
      left: 10%;
      top: 7%;
      border-radius: 47% 53% 42% 58%;
      background: linear-gradient(145deg, #d3b8d7, #f4e1e6 42%, #9e91aa 100%);
      transform: rotate(-12deg);
      box-shadow: 23px 36px 0 -6px rgba(200, 183, 198, .6);
    }

    .left-photo::after {
      width: 73%;
      height: 74%;
      left: 10%;
      bottom: -5%;
      border-radius: 42% 44% 8% 10%;
      background:
        radial-gradient(ellipse at 65% 15%, #eed8df 0 10%, transparent 11%),
        linear-gradient(100deg, #f5f6f2 0 66%, #d8e0de 67% 100%);
      transform: rotate(5deg);
    }

    .right-photo {
      background:
        radial-gradient(circle at 76% 11%, rgba(159, 183, 117, .9), transparent 22%),
        linear-gradient(130deg, #6a7b5b 0%, #b0b49a 27%, #6b765b 48%, #ad9b91 78%, #60574e 100%);
    }

    .right-photo::before {
      width: 50%;
      height: 19%;
      right: 10%;
      top: 3%;
      border-radius: 50% 52% 43% 47%;
      background: linear-gradient(130deg, #f1dce0, #fff4f1 48%, #bca7af);
      transform: rotate(-4deg);
    }

    .right-photo::after {
      width: 90%;
      height: 73%;
      left: 5%;
      top: 17%;
      border-radius: 43% 43% 9% 9%;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(224, 232, 226, .95) 11% 88%, transparent 89%),
        linear-gradient(180deg, #f5f7f2 0 57%, #283d6a 58% 100%);
      transform: rotate(-2deg);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      color: transparent;
      font-size: 1px;
    }

    .catalog {
      min-height: 100vh;
      padding: 6px 12px 10px;
      background: #fff;
      color: #080808;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      margin: 0;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      font-size: clamp(34px, 7vw, 48px);
      line-height: .95;
      letter-spacing: 0;
      font-weight: 900;
      white-space: nowrap;
    }

    .subtitle {
      margin: 7px 0 4px;
      font-size: 7px;
      font-weight: 700;
      white-space: nowrap;
    }

    .item-image {
      width: 100%;
      position: relative;
      flex: 0 0 auto;
      color: transparent;
      overflow: hidden;
    }

    .glasses {
      height: 57px;
      margin: 0 0 3px;
      background:
        linear-gradient(165deg, transparent 0 28%, rgba(180, 180, 180, .7) 29% 31%, transparent 32%),
        linear-gradient(90deg, transparent 0 18%, rgba(110, 110, 110, .55) 19% 21%, transparent 22% 48%, rgba(110, 110, 110, .55) 49% 51%, transparent 52% 100%),
        linear-gradient(180deg, #f4e5df, #d7c7c1);
      border: 1px solid #e5d9d4;
    }

    .shirt {
      height: 84px;
      margin: 10px 0 4px;
      background:
        radial-gradient(circle at 50% 46%, transparent 0 17%, #1d7b63 18% 21%, transparent 22%),
        radial-gradient(circle at 39% 48%, #1d7b63 0 4%, transparent 5%),
        radial-gradient(circle at 61% 48%, #1d7b63 0 4%, transparent 5%),
        linear-gradient(125deg, transparent 0 24%, #f8f8f4 25% 75%, transparent 76%);
    }

    .pants {
      height: 155px;
      margin: 13px 0 3px;
      background:
        linear-gradient(90deg, transparent 0 13%, #162848 14% 43%, transparent 44% 55%, #17294b 56% 86%, transparent 87%),
        linear-gradient(180deg, transparent 0 70%, #b7b9ae 71% 79%, transparent 80%);
    }

    .shoes {
      height: 67px;
      margin: 13px 0 2px;
      background:
        radial-gradient(ellipse at 42% 62%, #d9d6c9 0 28%, transparent 29%),
        radial-gradient(ellipse at 66% 62%, #d9d6c9 0 25%, transparent 26%),
        linear-gradient(165deg, transparent 0 37%, #f5f4ee 38% 67%, transparent 68%);
    }

    .product {
      width: 100%;
      margin: 0;
      font-size: 7px;
      line-height: 1.35;
    }

    .product strong {
      display: block;
      margin-bottom: 2px;
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0;
    }

    .product .detail {
      display: block;
      white-space: nowrap;
    }

    .product .price {
      display: block;
      margin-top: 2px;
      white-space: nowrap;
    }

    .section-gap {
      height: 5px;
      flex: 0 0 auto;
    }

    @media (max-width: 390px) {
      .catalog {
        padding-left: 8px;
        padding-right: 8px;
      }

      .brand {
        font-size: 31px;
      }

      .product strong {
        font-size: 13px;
      }

      .product {
        font-size: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="document">
    <section class="photo-panel left-photo" aria-label="[Photo: left portrait]">
      <div class="placeholder">[Photo: left portrait]</div>
    </section>

    <section class="catalog">
      <h1 class="brand">王源</h1>
      <p class="subtitle">最新机场私服Look</p>

      <div class="item-image glasses placeholder" aria-label="[Photo: glasses]">[Photo: glasses]</div>
      <div class="product">
        <strong>PSR帕莎</strong>
        <span class="detail">品牌定制款</span>
      </div>

      <div class="item-image shirt placeholder" aria-label="[Photo: T-shirt]">[Photo: T-shirt]</div>
      <div class="product">
        <strong>Etudes</strong>
        <span class="detail">LOGO印花圆领短袖T恤</span>
        <span class="price">参考价 ¥1,080</span>
      </div>

      <div class="item-image pants placeholder" aria-label="[Photo: jeans]">[Photo: jeans]</div>
      <div class="product">
        <strong>LOEWE</strong>
        <span class="detail">缝中布海蓝翻边仔裤</span>
        <span class="price">参考价 ¥7,700</span>
      </div>

      <div class="item-image shoes placeholder" aria-label="[Photo: sneakers]">[Photo: sneakers]</div>
      <div class="product">
        <strong>GUCCI</strong>
        <span class="detail">MAC80系列男士运动鞋</span>
        <span class="price">参考价 ¥7,600</span>
      </div>
    </section>

    <section class="photo-panel right-photo" aria-label="[Photo: right rear portrait]">
      <div class="placeholder">[Photo: right rear portrait]</div>
    </section>
  </main>
</body>
</html>
