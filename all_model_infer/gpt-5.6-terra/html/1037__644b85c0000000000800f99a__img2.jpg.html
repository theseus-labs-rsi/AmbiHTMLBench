<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频剪辑素材</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      background: #ffffe8;
      color: #222;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 25px 15px 28px;
    }
    .page {
      width: 100%;
      max-width: 540px;
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 1px;
      color: #111;
    }
    .card {
      width: 100%;
      min-height: 615px;
      background: #fff;
      border-radius: 18px;
      padding: 7px 9px 4px;
      text-align: center;
    }
    .entry {
      margin: 0 0 21px;
      font-size: 17px;
      line-height: 1.55;
      font-weight: 400;
    }
    .entry:last-child {
      margin-bottom: 0;
    }
    .name {
      margin: 0 0 3px;
      font-size: 18px;
      line-height: 1.35;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-weight: 400;
    }
    .description {
      margin: 0;
      white-space: normal;
    }
    .entry.long {
      margin-top: -1px;
      margin-bottom: 19px;
    }
    .entry.long .description {
      max-width: 490px;
      margin: 0 auto;
    }
    .entry.last {
      margin-top: -1px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>视频剪辑素材</h1>

    <section class="card">
      <div class="entry">
        <p class="name">Videezy</p>
        <p class="description">提供免F高清视频素材、音频素材和音效素材</p>
      </div>

      <div class="entry">
        <p class="name">Coverr</p>
        <p class="description">每周更新免F高清视频素材库，可以Tzai和使用</p>
      </div>

      <div class="entry">
        <p class="name">Pixabay</p>
        <p class="description">提供免F高清视频素材、照片素材和插图素材，可下zai和使用</p>
      </div>

      <div class="entry">
        <p class="name">Life of Vids</p>
        <p class="description">提供免F高清视频素材，可以使用</p>
      </div>

      <div class="entry">
        <p class="name">视频中国</p>
        <p class="description">提供各种类型的免F视频素材，可以按照分类进行检索</p>
      </div>

      <div class="entry long">
        <p class="name">无版权素材库</p>
        <p class="description">提供各种类型的免F剪辑素材，包括视频、音乐、插件等，所有素材均为无版权素材，可自由使用</p>
      </div>

      <div class="entry">
        <p class="name">Pexels Videos</p>
        <p class="description">提供免F高清视频素材和动画素材，可下zai和使用</p>
      </div>

      <div class="entry last">
        <p class="name">找台词</p>
        <p class="description">可以根据想要的台词找到影视片段</p>
      </div>
    </section>
  </main>
</body>
</html>
