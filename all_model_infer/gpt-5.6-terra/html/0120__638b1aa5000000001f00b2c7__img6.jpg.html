<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语文练习</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #aa8acb;
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
      color: #171317;
    }
    .canvas {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(127,79,166,.18), transparent 12%, transparent 88%, rgba(104,65,149,.2)),
        #ad8bce;
    }
    .page {
      position: absolute;
      top: 22px;
      left: 20px;
      width: 500px;
      height: 671px;
      padding: 101px 23px 30px;
      background: #fffefd;
    }
    .section {
      margin: 0 0 14px;
    }
    h2 {
      margin: 0 0 12px 6px;
      color: #35105b;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }
    p {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 500;
      letter-spacing: .2px;
    }
    .reading h2 { margin-top: 11px; }
    .training h2 { margin-top: 13px; }
    .training p {
      padding-left: 0;
      font-size: 20px;
      line-height: 1.28;
    }
    .magic {
      position: absolute;
      top: 16px;
      left: 24px;
      width: 95px;
      height: 106px;
      transform: rotate(-12deg);
    }
    .book {
      position: absolute;
      right: 2px;
      bottom: 1px;
      width: 72px;
      height: 78px;
      background: #563582;
      border: 2px solid #715095;
      box-shadow: inset 0 0 0 2px #d4b8e7;
    }
    .book::before {
      content: "MAGIC";
      position: absolute;
      left: 8px;
      top: 12px;
      color: #e9c4df;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      writing-mode: vertical-rl;
    }
    .ghost {
      position: absolute;
      right: 15px;
      bottom: 18px;
      width: 34px;
      height: 38px;
      border-radius: 50% 50% 42% 42%;
      background: #fff;
      border: 2px solid #f0e6ee;
    }
    .ghost::before,
    .ghost::after {
      content: "";
      position: absolute;
      top: 15px;
      width: 4px;
      height: 6px;
      border-radius: 50%;
      background: #402b69;
    }
    .ghost::before { left: 9px; }
    .ghost::after { right: 9px; }
    .star {
      position: absolute;
      color: #ffc64c;
      -webkit-text-stroke: 1px #78527f;
      font-size: 26px;
    }
    .star.one { top: 57px; left: 3px; }
    .star.two { top: 76px; left: 0; color: #f39ab2; font-size: 20px; }
    .paper {
      position: absolute;
      top: -3px;
      left: 19px;
      width: 67px;
      height: 45px;
      background: #f9e5bb;
      border: 1px solid #77617d;
      transform: rotate(21deg);
    }
    .paper::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-top: 1px solid #a18577;
      border-bottom: 1px solid #a18577;
    }
    .bottom-art {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 110px;
      height: 108px;
    }
    .balloon {
      position: absolute;
      top: 11px;
      left: 7px;
      width: 28px;
      height: 23px;
      border-radius: 50%;
      background: #f5b7c7;
      border: 1px solid #9e5773;
      transform: rotate(26deg);
    }
    .balloon::after {
      content: "";
      position: absolute;
      top: 22px;
      left: 14px;
      height: 25px;
      border-left: 1px solid #9e5773;
      transform: rotate(-22deg);
    }
    .character {
      position: absolute;
      right: 1px;
      bottom: 1px;
      width: 73px;
      height: 83px;
      border: 2px solid #d67c97;
      border-radius: 48% 47% 42% 45%;
      background: #fff9fa;
    }
    .character::before {
      content: "•  •\A ︶";
      white-space: pre;
      position: absolute;
      top: 26px;
      left: 18px;
      color: #b54e6c;
      font-size: 18px;
      line-height: 12px;
      letter-spacing: 12px;
    }
    .cloud {
      position: absolute;
      bottom: -12px;
      right: -14px;
      width: 88px;
      height: 50px;
      border-radius: 48% 0 0 0;
      background: #f3aacd;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="magic" aria-label="[插图：魔法书]">
      <div class="paper"></div>
      <div class="book"></div>
      <div class="ghost"></div>
    </div>
    <div class="star one">★</div>
    <div class="star two">★</div>

    <main class="page">
      <section class="section">
        <h2>四，句式练习</h2>
        <p>仿写、修改病句、把字句变被字句、反问句变陈述句、<br>陈述句变感叹句、缩句扩句等等</p>
      </section>

      <section class="section reading">
        <h2>五，阅读理解</h2>
        <p>课内阅读理解：主要复习课文笔记、中心思想以及<br>课后习题。<br>课外阅读理解：主要是要掌握好答题技巧。</p>
      </section>

      <section class="section training">
        <h2>六，阅读训练</h2>
        <p>1，圈出题目里面的关键词。<br>2，记住答案的宗旨就是答案都在原文里。<br>3，掌握表达方式，修辞手法的运用，解释词语，<br>找近反义词。<br>4，概括主要内容就是，时间，地点，人物，事情。<br>5，答题技巧，人物评价围绕品质，景物围绕热爱<br>之情来答。</p>
      </section>

      <div class="bottom-art" aria-label="[插图：拿着气球的卡通人物]">
        <div class="balloon"></div>
        <div class="character"></div>
        <div class="cloud"></div>
      </div>
    </main>
  </div>
</body>
</html>
