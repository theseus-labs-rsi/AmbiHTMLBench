<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIMAGE 双拼高光</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f3f1;
      color: #111;
      font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 72%, rgba(255,255,255,.72), transparent 38%),
        linear-gradient(115deg, #f7f7f5 0%, #efeeec 100%);
    }

    .placeholder {
      position: absolute;
      overflow: hidden;
      color: rgba(70, 65, 59, .55);
      font-size: 7px;
      text-align: center;
    }

    .lamp {
      top: -20px;
      left: 10px;
      width: 180px;
      height: 178px;
      border-radius: 42% 45% 48% 52%;
      background:
        repeating-linear-gradient(78deg, rgba(255,255,255,.9) 0 13px, rgba(211,207,197,.9) 14px 19px),
        #d4b58b;
      box-shadow: 5px 12px 15px rgba(77, 53, 28, .18);
      transform: rotate(-8deg);
    }

    .lamp::after {
      content: "";
      position: absolute;
      left: 3px;
      bottom: 1px;
      width: 173px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(160deg, #d9b583, #bd8e58);
      border-top: 1px solid rgba(103, 65, 28, .22);
    }

    .makeup-set {
      top: 264px;
      left: 119px;
      width: 278px;
      height: 280px;
    }

    .compact {
      position: absolute;
      left: 13px;
      top: 24px;
      width: 123px;
      height: 135px;
      border-radius: 38% 52% 48% 42%;
      background: linear-gradient(145deg, #b5cdd0, #9c7c52 45%, #7d3726 47%, #552015 100%);
      transform: rotate(-20deg);
      box-shadow: 2px 5px 7px rgba(55, 34, 18, .28);
    }

    .compact::before {
      content: "";
      position: absolute;
      inset: 19px 14px 15px;
      border-radius: 45%;
      background: linear-gradient(135deg, #d9e2db, #ead7c5 54%, #b88c78);
      border: 3px solid rgba(105, 80, 56, .6);
    }

    .tube {
      position: absolute;
      right: 17px;
      top: 80px;
      width: 83px;
      height: 145px;
      border-radius: 13px 13px 23px 23px;
      background: linear-gradient(100deg, #d4cdc9, #f8f4ef 45%, #c4beb9);
      transform: rotate(25deg);
      box-shadow: 2px 5px 8px rgba(70, 52, 41, .22);
    }

    .tube::before {
      content: "Lovely";
      position: absolute;
      left: 13px;
      top: 48px;
      color: #584d47;
      font-family: Georgia, serif;
      font-size: 13px;
      font-style: italic;
      transform: rotate(-2deg);
    }

    .tube::after {
      content: "";
      position: absolute;
      left: 12px;
      bottom: -17px;
      width: 58px;
      height: 22px;
      border-radius: 3px 3px 8px 8px;
      background: linear-gradient(#b68a52, #6e4828);
      border: 2px solid #7b5a3a;
    }

    .swatch {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      border: 1px solid #fff;
      box-shadow: 0 0 0 1px rgba(100,100,100,.3);
    }

    .swatch-left {
      left: 26px;
      top: 272px;
      background:
        radial-gradient(ellipse at 42% 42%, rgba(255,255,255,.8) 0 17%, transparent 19%),
        linear-gradient(145deg, #d5d0cb, #bdb8b2 55%, #eeeae4);
      transform: rotate(-13deg);
    }

    .swatch-right {
      right: 29px;
      top: 426px;
      width: 111px;
      height: 111px;
      background:
        radial-gradient(ellipse at 56% 49%, #e8d6d0 0 29%, transparent 31%),
        linear-gradient(145deg, #d7c6c8, #b99fa4);
    }

    .intro {
      position: absolute;
      top: 199px;
      left: 69px;
      width: 416px;
      display: grid;
      grid-template-columns: 126px 1fr;
      column-gap: 28px;
      align-items: start;
    }

    .brand {
      padding-top: 1px;
      font-size: 16px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 10px;
      padding-left: 36px;
      font-size: 14px;
      white-space: nowrap;
    }

    .description {
      margin: 0;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      white-space: nowrap;
    }

    .watermark {
      position: absolute;
      top: 351px;
      left: 217px;
      color: rgba(255,255,255,.75);
      font-size: 10px;
      letter-spacing: 0;
    }

    .section-title {
      position: absolute;
      top: 523px;
      left: 58px;
      font-size: 14px;
      font-weight: 800;
      font-style: italic;
    }

    .review {
      position: absolute;
      top: 580px;
      left: 42px;
      width: 463px;
      font-size: 14px;
      line-height: 22px;
    }

    .review p {
      margin: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder lamp" aria-label="[Photo: upper-left wooden lamp]">[Photo: upper-left]</div>

    <section class="intro">
      <div>
        <div class="brand">TIMAGE</div>
        <div class="subtitle">| 双拼高光</div>
      </div>
      <p class="description">
        基本每天都在用，挺实用的粉＋膏的双拼组合<br>
        两个质地都轻薄又细腻，不用担心妆重<br>
        高光膏是奶油质地，滋润服帖，提高润泽面中<br>
        高光粉可以提亮鼻梁 鼻头等，妈生立体感<br>
        清透粉感不重，一个神仙单品
      </p>
    </section>

    <figure class="placeholder makeup-set" aria-label="[Photo: makeup products centered]">
      <div class="compact"></div>
      <div class="tube"></div>
      <figcaption>[Photo: centered makeup products]</figcaption>
    </figure>

    <div class="placeholder swatch swatch-left" aria-label="[Detail: powder swatch, left]">[Detail: left]</div>
    <div class="placeholder swatch swatch-right" aria-label="[Detail: cream swatch, right]">[Detail: right]</div>

    <div class="watermark">©小泪姐 | 小红书</div>

    <h2 class="section-title">恋爱魔镜粉霜</h2>

    <section class="review">
      <p>坠白的00我都觉得不白，唯一的缺点了，希望出个白一点的色号呀！</p>
      <p>可以用提亮粉饼来拯救，我用的是大饼—自然细腻的奶油肌妆感</p>
      <p>给人天生好底子的感觉，妆效挺自然的，百元粉霜里的三好学生</p>
    </section>
  </main>
</body>
</html>
