<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唐诗六首</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3ca89;
      color: #111;
      font-family: "KaiTi", "STKaiti", "Kaiti SC", "SimKai", serif;
    }
    .page {
      width: min(92vw, 540px);
      aspect-ratio: 540 / 724;
      padding: 24px;
      background-color: #fcfcf9;
      background-image:
        linear-gradient(rgba(205, 215, 211, .25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(205, 215, 211, .25) 1px, transparent 1px);
      background-size: 12px 12px;
      box-shadow: 0 1px 6px rgba(110, 70, 25, .22);
    }
    .poem-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      border: 4px solid #dda178;
    }
    .poem {
      min-width: 0;
      padding: 8px 10px 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .poem:nth-child(odd) {
      border-right: 5px solid #dda178;
    }
    .poem:nth-child(-n+4) {
      border-bottom: 5px solid #dda178;
    }
    h2 {
      margin: 0;
      white-space: nowrap;
      font-size: clamp(23px, 5vw, 33px);
      line-height: 1.08;
      font-weight: 700;
    }
    .author {
      width: 100%;
      margin: 3px 0 13px;
      padding-right: 1px;
      text-align: right;
      white-space: nowrap;
      font-size: clamp(15px, 3.3vw, 21px);
      line-height: 1;
    }
    .lines {
      width: 100%;
      text-align: left;
      padding-left: 22px;
      white-space: nowrap;
      font-size: clamp(21px, 4.6vw, 29px);
      line-height: 1.27;
      font-weight: 500;
    }
    @media (max-width: 390px) {
      .page { padding: 14px; }
      .poem { padding: 7px 5px; }
      .lines { padding-left: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="poem-grid">
      <article class="poem">
        <h2>《登鹳雀楼》</h2>
        <div class="author">（唐—王之涣）</div>
        <div class="lines">白日依山尽，<br>黄河入海流。<br>欲穷千里目，<br>更上一层楼。</div>
      </article>
      <article class="poem">
        <h2>《静夜思》</h2>
        <div class="author">（唐—李白）</div>
        <div class="lines">床前明月光，<br>疑是地上霜。<br>举头望明月，<br>低头思故乡。</div>
      </article>
      <article class="poem">
        <h2>《古朗月行》</h2>
        <div class="author">（唐—李白）</div>
        <div class="lines">小时不识月，<br>呼作白玉盘。<br>又疑瑶台镜，<br>飞在青云端。</div>
      </article>
      <article class="poem">
        <h2>《寻隐者不遇》</h2>
        <div class="author">（唐—贾岛）</div>
        <div class="lines">松下问童子，<br>言师采药去。<br>只在此山中，<br>云深不知处。</div>
      </article>
      <article class="poem">
        <h2>《咏鹅》</h2>
        <div class="author">（唐—骆宾王）</div>
        <div class="lines">鹅鹅鹅，<br>曲项向天歌。<br>白毛浮绿水，<br>红掌拨清波。</div>
      </article>
      <article class="poem">
        <h2>《草》</h2>
        <div class="author">（唐—白居易）</div>
        <div class="lines">离离原上草，<br>一岁一枯荣。<br>野火烧不尽，<br>春风吹又生。</div>
      </article>
    </section>
  </main>
</body>
</html>
