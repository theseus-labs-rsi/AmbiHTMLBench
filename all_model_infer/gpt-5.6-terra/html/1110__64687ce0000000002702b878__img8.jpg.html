<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok运营 48个必备工具</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      background: #295b47;
      color: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #295b47;
    }
    h1 {
      position: absolute;
      top: 61px;
      left: 45px;
      margin: 0;
      font-size: 52px;
      line-height: 1.32;
      font-weight: 500;
      letter-spacing: 0;
    }
    .tag {
      position: absolute;
      top: 224px;
      left: 37px;
      height: 34px;
      padding: 3px 12px 4px;
      background: #e7ba00;
      color: #fff;
      font-size: 18px;
      line-height: 27px;
      font-weight: 700;
      white-space: nowrap;
    }
    .grid {
      position: absolute;
      top: 292px;
      left: 37px;
      width: 459px;
      height: 368px;
      display: grid;
      grid-template-columns: 97px 116px 102px 102px;
      grid-template-rows: 94px 153px 96px;
      gap: 12px 14px;
    }
    .tile {
      background: #849c78;
      padding: 9px 13px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 400;
      overflow: hidden;
    }
    .tile strong {
      display: block;
      margin-top: 11px;
      font-size: 19px;
      line-height: 1.28;
      font-weight: 500;
    }
    .part01 { grid-column: 1; grid-row: 1 / span 2; }
    .part02 { grid-column: 2; grid-row: 1; }
    .part03 { grid-column: 2; grid-row: 2; }
    .part04 { grid-column: 1 / span 2; grid-row: 3; }
    .part05 {
      grid-column: 3 / span 2;
      grid-row: 1;
      background: #60a061;
    }
    .part06 {
      grid-column: 3;
      grid-row: 2 / span 2;
      background: #60a061;
    }
    .part07 {
      grid-column: 4;
      grid-row: 2;
      background: #60a061;
    }
    .part08 {
      grid-column: 4;
      grid-row: 3;
      background: #60a061;
    }
    .part01 strong { margin-top: 12px; }
    .part02 strong { margin-top: 11px; }
    .part03 strong { margin-top: 11px; }
    .part04 strong { margin-top: 11px; }
    .part05 strong { margin-top: 10px; }
    .part06 strong { margin-top: 11px; }
    .part07 strong { margin-top: 11px; }
    .part08 strong { margin-top: 11px; }
    @media (max-width: 540px) {
      .page {
        transform-origin: top left;
        transform: scale(calc(100vw / 540));
      }
      body { height: calc(720px * 100vw / 540); }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>TikTok运营<br>48个必备工具</h1>
    <div class="tag">@ 徐徐教你做TikTok</div>

    <section class="grid" aria-label="TikTok运营工具分类">
      <div class="tile part01">Part 01<strong>7个TK<br>数据平台</strong></div>
      <div class="tile part02">Part 02<strong>3个好用<br>选品网站</strong></div>
      <div class="tile part03">Part 03<strong>5个视频<br>素材网站</strong></div>
      <div class="tile part04">Part 04<strong>6个TK数据分析网站</strong></div>
      <div class="tile part05">Part 05<strong>4个剪辑<br>4个翻译软件</strong></div>
      <div class="tile part06">Part 06<strong>8个TK<br>传输管理<br>网站</strong></div>
      <div class="tile part07">Part 07<strong>5个BGM<br>网站</strong></div>
      <div class="tile part08">Part 08<strong>7个投放<br>联盟网站</strong></div>
    </section>
  </main>
</body>
</html>
