<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三大核心参数解读</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#fff}
    body{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;color:#111}
    .page{
      position:relative;
      width:540px;
      height:720px;
      margin:0 auto;
      overflow:hidden;
      background:#fff;
    }
    .binding{
      position:absolute;
      top:14px;
      left:-11px;
      display:flex;
      gap:35px;
      width:570px;
    }
    .hole{
      width:23px;
      height:23px;
      flex:none;
      border-radius:50%;
      border:1px solid #9c9c9c;
      background:radial-gradient(circle at 43% 35%,#fafafa 0 43%,#e2e2e2 68%,#aaa 100%);
      box-shadow:inset 0 0 3px rgba(0,0,0,.18);
    }
    .book{
      position:absolute;
      top:72px;
      left:0;
      width:43px;
      height:108px;
      overflow:hidden;
      border-radius:0 6px 6px 0;
      background:
        linear-gradient(125deg,rgba(40,0,70,.65),transparent 35%),
        radial-gradient(circle at 20% 80%,#c01f25 0 20%,transparent 43%),
        radial-gradient(circle at 93% 25%,#dd9030 0 10%,transparent 36%),
        linear-gradient(150deg,#071942,#741429 55%,#bd3830);
    }
    .book:before{
      content:"第三步";
      position:absolute;
      left:10px;
      top:19px;
      width:24px;
      color:#fff;
      font-weight:700;
      font-size:20px;
      line-height:26px;
      text-align:center;
      text-shadow:0 1px 2px #000;
      writing-mode:vertical-rl;
    }
    h1{
      position:absolute;
      top:61px;
      left:113px;
      margin:0;
      font-size:35px;
      font-weight:400;
      letter-spacing:1px;
      line-height:45px;
      white-space:nowrap;
    }
    .subtitle{
      position:absolute;
      top:122px;
      left:164px;
      margin:0;
      font-size:17px;
      line-height:25px;
      color:#353535;
      white-space:nowrap;
    }
    .item{
      position:absolute;
      left:38px;
      width:466px;
      display:flex;
      align-items:flex-start;
    }
    .item.one{top:216px}
    .item.two{top:377px}
    .item.three{top:541px}
    .icon{
      width:66px;
      height:75px;
      flex:0 0 66px;
      margin-right:10px;
    }
    .copy{
      padding-top:0;
      width:390px;
    }
    .heading{
      font-size:22px;
      line-height:28px;
      font-weight:400;
      margin:0 0 4px 0;
    }
    .desc{
      font-size:16px;
      line-height:24px;
      margin:0;
      font-weight:400;
      letter-spacing:.1px;
    }
    .two .copy{padding-top:0}
    .three .copy{padding-top:0}
    svg{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <main class="page">
    <div class="binding" aria-hidden="true">
      <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
      <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
      <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    </div>

    <div class="book" aria-hidden="true"></div>

    <h1>三大核心参数解读</h1>
    <p class="subtitle">内存/芯片/分辨率参数解读</p>

    <section class="item one">
      <div class="icon" aria-label="[内存卡图标]">
        <svg viewBox="0 0 66 75" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#383838" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M14 3h37c3 0 5 2 5 5v57c0 3-2 5-5 5H14c-3 0-5-2-5-5v-9h5V36H9v-8h5V8c0-3 2-5 5-5z"/>
            <path d="M20 4v12M26 4v12M32 4v12M38 4v12M44 4v12M50 4v12"/>
            <rect x="19" y="25" width="28" height="28" rx="1"/>
            <path d="M25 32h16v14H25zM20 61h27"/>
          </g>
        </svg>
      </div>
      <div class="copy">
        <p class="heading">1.看内存</p>
        <p class="desc">内存越大速度越快，小于8GB不建议购买。（画圈：<br>GB≠Gb,大GB是小Gb的8倍，尽量选择大GB）</p>
      </div>
    </section>

    <section class="item two">
      <div class="icon" aria-label="[CPU芯片图标]">
        <svg viewBox="0 0 66 75" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#383838" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="10" width="46" height="48" rx="5"/>
            <path d="M4 18h6M4 28h6M4 38h6M4 48h6M4 58h6M56 18h6M56 28h6M56 38h6M56 48h6M56 58h6"/>
            <path d="M18 4v6M28 4v6M38 4v6M48 4v6M18 58v10M28 58v10M38 58v10M48 58v10"/>
          </g>
          <rect x="17" y="22" width="32" height="25" rx="2" fill="#383838"/>
          <text x="33" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">CPU</text>
        </svg>
      </div>
      <div class="copy">
        <p class="heading">2.看芯片</p>
        <p class="desc">主流芯片A73和A53。追求性能玩游戏选A73，看<br>重电视想省电选A53。</p>
      </div>
    </section>

    <section class="item three">
      <div class="icon" aria-label="[4K UHD图标]">
        <svg viewBox="0 0 66 75" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="1" width="48" height="69" rx="5" fill="#383838"/>
          <rect x="7" y="5" width="40" height="61" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
          <text x="27" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#fff">4K</text>
          <line x1="8" y1="36" x2="46" y2="36" stroke="#fff" stroke-width="2"/>
          <text x="27" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">UHD</text>
        </svg>
      </div>
      <div class="copy">
        <p class="heading">3.看分辨率</p>
        <p class="desc">分辨率越高越清晰。（目前电视基本都是超高清4K<br>也就是3840×2160的分辨率）</p>
      </div>
    </section>
  </main>
</body>
</html>
