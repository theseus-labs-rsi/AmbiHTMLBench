<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沁园春·雪 - 题目解析</title>

    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f5f5;
      color: #4a4a4a;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 10px;
      line-height: 1.48;
    }
    .screen {
      width: 540px;
      height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .topbar {
      height: 42px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      color: #171717;
      font-size: 12px;
    }
    .back {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 300;
      line-height: 1;
    }
    .progress {
      text-align: center;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .columns {
      height: 468px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .pane {
      min-width: 0;
      padding: 6px 10px 8px;
      overflow: hidden;
      position: relative;
    }
    .pane + .pane {
      border-left: 1px solid #f0f0f0;
    }
    .book {
      font-weight: 700;
      margin: 0 0 8px 4px;
    }
    .question {
      text-align: justify;
      margin: 0 2px 10px;
      color: #494949;
    }
    .choice {
      display: grid;
      grid-template-columns: 18px 1fr;
      column-gap: 3px;
      align-items: center;
      padding: 10px 9px;
      margin: 4px 0;
      min-height: 57px;
    }
