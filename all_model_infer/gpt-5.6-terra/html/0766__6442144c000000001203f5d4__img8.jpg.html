<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三天路线规划</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      min-height: 718px;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #111;
    }
    body {
      background-color: #fff;
      background-image:
        linear-gradient(rgba(190, 190, 190, .38) 1px, transparent 1px),
        linear-gradient(90deg, rgba(190, 190, 190, .38) 1px, transparent 1px);
      background-size: 20px 20px;
      overflow: hidden;
    }
    .page {
      width: 540px;
      min-height: 718px;
      padding-top: 14px;
    }
    h1 {
      margin: 0 0 18px;
      text-align: center;
      font-size: 50px;
      line-height: 1.22;
      letter-spacing: 0;
      font-weight: 900;
      white-space: nowrap;
    }
    h1 .blue { color: #05399d; }
    .layout {
      display: grid;
      grid-template-columns: 204px 1fr;
      column-gap: 11px;
      padding: 0 20px;
      align-items: start;
    }
    .route {
      text-align: center;
      padding-top: 1px;
      font-weight: 700;
    }
    .day {
      display: inline-block;
      padding: 1px 13px 2px;
      background: #9bf0c9;
      font-size: 33px;
      line-height: 1.15;
      white-space: nowrap;
    }
    .arrow {
      position: relative;
      width: 24px;
      height: 51px;
      margin: 4px auto 7px;
    }
    .arrow::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      width: 8px;
      height: 28px;
      background: #ffc51c;
      border: 1px solid #9c7800;
    }
    .arrow::after {
      content: "";
      position: absolute;
      top: 25px;
      left: 1px;
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 22px solid #ffc51c;
      filter: drop-shadow(0 1px 0 #9c7800);
    }
    .stop {
      font-size: 29px;
      line-height: 1.16;
      white-space: nowrap;
    }
    .travel {
      display: inline-block;
      margin-top: 11px;
      padding: 0 8px;
      background: rgba(255, 237, 239, .83);
      font-size: 24px;
      line-height: 1.28;
      font-weight: 400;
      white-space: nowrap;
    }
    .travel .mini-arrow {
      display: inline-block;
      position: relative;
      width: 16px;
      height: 35px;
      margin: 0 5px -10px 3px;
      vertical-align: middle;
    }
    .travel .mini-arrow::before {
      content: "";
      position: absolute;
      top: 0;
      left: 5px;
      width: 7px;
      height: 20px;
      background: #ffc51c;
      border: 1px solid #9c7800;
    }
    .travel .mini-arrow::after {
      content: "";
      position: absolute;
      top: 18px;
      left: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 16px solid #ffc51c;
      filter: drop-shadow(0 1px 0 #9c7800);
    }
    .gap-small { margin-top: 3px; }
    .gap-medium { margin-top: 7px; }
    .notes {
      display: flex;
      flex-direction: column;
      gap: 34px;
      padding-top: 22px;
    }
    .note {
      min-height: 93px;
      border: 3px solid #8f1113;
      padding: 5px 5px 4px;
      background: rgba(255,255,255,.45);
      font-size: 19px;
      line-height: 1.42;
      font-weight: 400;
    }
    .note .place {
      color: #0a3a9c;
    }
    .note.n2 { min-height: 92px; }
    .note.n3 { min-height: 92px; }
    .note.n4 { min-height: 92px; }
    .note.n5 { min-height: 91px; }
  </style>
</head>
<body>
  <main class="page">
    <h1><span class="blue">第三天</span>路线规划</h1>

    <section class="layout">
      <section class="route" aria-label="第三天路线">
        <div class="day">第三天</div>
        <div class="arrow"></div>
        <div class="stop">磁器口</div>

        <div class="travel">1号线<span class="mini-arrow"></span>30分钟</div>
        <div class="gap-small"></div>
        <div class="stop">罗中立美术馆</div>

        <div class="travel">1号线<span class="mini-arrow"></span>80分钟</div>
        <div class="gap-small"></div>
        <div class="stop">山城步道</div>

        <div class="travel">公交<span class="mini-arrow"></span>32分钟</div>
        <div class="gap-medium"></div>
        <div class="stop">观音桥</div>

        <div class="travel">步行<span class="mini-arrow"></span>15分钟</div>
        <div class="gap-small"></div>
        <div class="stop">九街</div>
      </section>

      <section class="notes" aria-label="景点说明">
        <div class="note">
          <span class="place">磁器口（免费）</span>：汇聚美食、重<br>
          庆特色伴手礼，始建于宋代 “一<br>
          江两浙三山四巷” 独特地貌
        </div>
        <div class="note n2">
          <span class="place">罗中立美术馆（免费）</span>：拍照超<br>
          级出片，墙体比较花，拍照尽量<br>
          穿不花或者饱和度低的衣服
        </div>
        <div class="note n3">
          <span class="place">山城步道（免费）</span>：建在悬崖边<br>
          的临江步道，汇聚老重庆特色步<br>
          道
        </div>
        <div class="note n4">
          <span class="place">观音桥（免费）</span>：超大商圈，还<br>
          有很多地道重庆小吃
        </div>
        <div class="note n5">
          <span class="place">九街（免费）</span>：酒吧一条街，娱<br>
          乐夜生活开启地，和式风格的酒<br>
          吧都有
        </div>
      </section>
    </section>
  </main>
</body>
</html>
