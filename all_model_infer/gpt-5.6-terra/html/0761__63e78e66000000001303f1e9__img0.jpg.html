<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康能量</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #d7d1c6;
      color: #262321;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
    }
    .book {
      width: min(540px, 100vw);
      min-height: 700px;
      margin: 0 auto;
      padding: 20px 46px 90px 88px;
      background:
        linear-gradient(90deg, rgba(83,70,52,.08) 0, rgba(255,255,255,0) 24px),
        linear-gradient(90deg, #e9e5db 0%, #f4f1e8 12%, #f1eee6 100%);
      box-shadow: 0 0 10px rgba(0,0,0,.2);
    }
    h1 {
      margin: 0 0 10px -19px;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.2;
      transform: rotate(-4deg);
    }
    .writing {
      font-size: 23px;
      line-height: 1.72;
      letter-spacing: .06em;
    }
    .line {
      min-height: 39px;
      white-space: nowrap;
      transform-origin: left center;
    }
    .line:nth-child(1) { transform: rotate(-1deg); }
    .line:nth-child(2) { transform: rotate(-.5deg); }
    .line:nth-child(3) { transform: rotate(-.8deg); }
    .line:nth-child(4) { transform: rotate(.3deg); }
    .line:nth-child(5) { transform: rotate(-.4deg); }
    .line:nth-child(6) { transform: rotate(.3deg); }
    .line:nth-child(7) { transform: rotate(-.7deg); }
    .line:nth-child(8) { transform: rotate(-.2deg); }
    .line:nth-child(9) { transform: rotate(.4deg); }
    .red {
      margin-top: 4px;
      color: #8c3735;
    }
    .red .line:first-child { margin-left: 13px; }
    .red .line:last-child { margin-left: 96px; }
    @media (max-width: 480px) {
      .book { padding-left: 18vw; padding-right: 7vw; }
      .writing { font-size: clamp(17px, 5vw, 23px); }
    }
  </style>
</head>
<body>
  <main class="book">
    <h1>健康能量</h1>
    <section class="writing">
      <div class="line">当痛苦袭来时，古今中外，[illegible]的事后</div>
      <div class="line">日，我们该如何对待？</div>
      <div class="line">如果我本事同个性言者，也许你就不会给痛</div>
      <div class="line">人言的票。用心理学的真相，用爱和真诚可以消</div>
      <div class="line">融痛苦。正如冬[illegible]所言，“[illegible]早与早锻连的</div>
      <div class="line">时际，小小的一脚[illegible]都有可能是致命伤。我们</div>
      <div class="line">谁都不想成为这样的人，我们也不愿意成为加</div>
      <div class="line">害别人”，遭遇不公时，除了不吝吐一道苦，</div>
      <div class="line">我们可以同不公平呐喊，只有大家都勇敢</div>
      <div class="line">起来，加害者才会觉得我们没有那么好</div>
      <div class="line">欺负。</div>
    </section>
    <section class="writing red">
      <div class="line">愿你笔尖下皆自由之风，一笔一画，</div>
      <div class="line">一字一句，黑白分明</div>
    </section>
  </main>
</body>
</html>
