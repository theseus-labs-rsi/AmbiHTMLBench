  <main class="page">
    <header class="topbar">

      <div class="question">你能接受孩子的平庸吗?</div>

      </div>
      <div class="more" aria-label="更多">
        <i></i><i></i><i></i>
      </div>
    </header>

    <article class="content">
      <p class="intro">
        以上是我最近在读的一本书，作家<span class="author">刘继荣<sup>a</sup></span><br>
        《坐在路边鼓掌的人》里面讲的小故事。
      </p>

      <p class="highlight">
        <span>天下有多少雄心勃勃的父母，奢望自己的孩<br>
        子既能做顶天立地的栋梁，又能开繁花结硕<br>
        果。我们的欲望有多深，孩子就有多累。</span>
      </p>

      <p class="paragraph">
        如果孩子能自己找到出路，快乐与成就兼<br>
        得，如果能平庸而幸福地过一生，父母又何<br>
        必强求。
      </p>

      <p class="paragraph">
        如果他们健康、快乐，如果那是他们想要的<br>
        生活，我们的孩子，又何妨做一个普通人。
      </p>
