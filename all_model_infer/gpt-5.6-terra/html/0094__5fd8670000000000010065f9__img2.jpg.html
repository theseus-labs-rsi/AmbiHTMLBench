<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT快捷键</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }
    body {
      background: #f79ab3;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #252525;
    }
    .canvas {
      position: relative;
      width: 540px;
      height: 709px;
      margin: 0 auto;
      overflow: hidden;
      background: #f79ab3;
    }
    .paper {
      position: absolute;
      left: 44px;
      top: 84px;
      width: 452px;
      height: 604px;
      background: #fff;
      padding: 28px 15px 24px 15px;
    }
    .title-sign {
      position: absolute;
      z-index: 3;
      left: 123px;
      top: 25px;
      width: 290px;
      height: 77px;
      background: #f5d7e1;
      border: 2px solid #333;
      transform: rotate(-0.4deg);
      box-shadow: inset 0 0 0 3px #f5d7e1;
    }
    .title-sign::before,
    .title-sign::after {
      content: "";
      position: absolute;
      top: -23px;
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 22px solid #fff;
      filter: drop-shadow(0 0 0 #333);
    }
    .title-sign::before { left: 59px; }
    .title-sign::after { right: 55px; }
    .title-content {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      font-size: 31px;
      font-weight: 400;
      letter-spacing: -2px;
      white-space: nowrap;
    }
    .check {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 42px;
      height: 42px;
      margin-right: 3px;
      border-radius: 8px;
      background: linear-gradient(135deg, #8dcc16 0%, #5cab05 55%, #78c609 100%);
      border: 2px solid #7eaa15;
      box-shadow: inset 2px 2px 2px rgba(255,255,255,.6), inset -2px -2px 3px rgba(0,0,0,.16);
      color: #fff;
      font-size: 39px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 0;
    }
    .clip {
      position: absolute;
      z-index: 4;
      width: 35px;
      height: 30px;
    }
    .clip.left { left: 113px; }
    .clip.right { right: 113px; transform: scaleX(-1); }
    .clip.one { top: 38px; }
    .clip.two { top: 58px; }
    .clip.three { top: 76px; }
    .clip span {
      position: absolute;
      left: 0;
      top: 8px;
      width: 35px;
      height: 3px;
      background: #f5d7e1;
      border: 1.5px solid #333;
      border-radius: 3px;
      transform: rotate(10deg);
    }
    .clip.two span { transform: rotate(-3deg); }
    .clip.three span { transform: rotate(-10deg); }
    .shortcut-list {
      width: 100%;
      margin-top: 0;
    }
    .row {
      display: grid;
      grid-template-columns: 171px 1fr;
      align-items: center;
      min-height: 40px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    .key {
      padding-left: 0;
      letter-spacing: -0.4px;
    }
    .description {
      padding-left: 0;
      letter-spacing: -0.45px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="paper">
      <div class="shortcut-list">
        <div class="row"><div class="key">B</div><div class="description">黑屏(在演示时)</div></div>
        <div class="row"><div class="key">W</div><div class="description">切换至白屏/从黑白屏恢复放映</div></div>
        <div class="row"><div class="key">F4</div><div class="description">重复上一步操作</div></div>
        <div class="row"><div class="key">Ctrl+D</div><div class="description">快速复制选中对象</div></div>
        <div class="row"><div class="key">Ctrl+G</div><div class="description">组合对象</div></div>
        <div class="row"><div class="key">Ctrl+ Shift+ G</div><div class="description">取消组合</div></div>
        <div class="row"><div class="key">Ctrl+Alt+V</div><div class="description">打开选择性粘贴窗口</div></div>
        <div class="row"><div class="key">Ctrl+单击</div><div class="description">选择多个对象</div></div>
        <div class="row"><div class="key">Shift+鼠标</div><div class="description">拖动等比例缩放图片</div></div>
        <div class="row"><div class="key">Shift+ F5</div><div class="description">从当前页开始放映</div></div>
        <div class="row"><div class="key">Ctrl+ Shift+C</div><div class="description">复制格式</div></div>
        <div class="row"><div class="key">Ctrl+ Shift+V</div><div class="description">粘贴格式</div></div>
        <div class="row"><div class="key">Ctrl+ Shift+&lt;</div><div class="description">快速缩小字号</div></div>
        <div class="row"><div class="key">Ctrl+ Shift+&gt;</div><div class="description">快速增大字号</div></div>
      </div>
    </div>

    <div class="title-sign">
      <div class="title-content"><span class="check">✓</span>PPT快捷键</div>
    </div>

    <div class="clip left one"><span></span></div>
    <div class="clip left two"><span></span></div>
    <div class="clip left three"><span></span></div>
    <div class="clip right one"><span></span></div>
    <div class="clip right two"><span></span></div>
    <div class="clip right three"><span></span></div>
  </div>
</body>
</html>
