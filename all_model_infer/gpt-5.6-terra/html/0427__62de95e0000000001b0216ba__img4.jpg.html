<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业长图｜设计分享</title>
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e9e9}
  body{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif}
  .page{
    width:538px;height:720px;margin:0 auto;overflow:hidden;position:relative;
    background:#a9f500;color:#050505;border-top:1px solid #161616;
  }
  .header{
    height:59px;background:#050505;color:#fff;border-bottom:2px solid #111;
    display:grid;grid-template-columns:138px 1fr 132px;align-items:center;
    font-weight:900;letter-spacing:1px;position:relative;
  }
  .head-left{font-size:24px;padding-left:7px;white-space:nowrap}
  .head-right{font-size:25px;text-align:center;white-space:nowrap}
  .design{
    height:38px;position:relative;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-family:Arial,sans-serif;font-weight:bold;letter-spacing:1px;
  }
  .design:before,.design:after{
    content:"";position:absolute;top:18px;width:47px;border-top:1px solid white;
  }
  .design:before{left:2px}.design:after{right:2px}
  .design span{
    position:relative;z-index:1;border:1px solid #fff;border-radius:50%;
    padding:2px 28px;background:#050505;
  }
  .design i{position:absolute;font-style:normal;top:7px;font-size:22px;z-index:2}
  .design i:first-child{left:4px}.design i:last-child{right:4px}
  .columns{display:grid;grid-template-columns:267px 4px 267px;height:661px}
  .divider{background:#060606}
  .left,.right{position:relative;overflow:hidden;background:#a9f500}
  .left:before,.right:before{
    content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
    background:
      linear-gradient(147deg,transparent 0 18%,#ecff24 18% 25%,transparent 25% 100%),
      linear-gradient(27deg,transparent 0 43%,#e7ff29 43% 52%,transparent 52% 100%);
  }

  .topnote{position:relative;height:87px;padding-top:8px;text-align:center;font-size:15px;line-height:19px;z-index:2}
  .topnote .line{display:block;border-top:1px solid #303c12;width:228px;margin:0 auto -1px}
  .topnote .highlight{background:#c8ff00;padding:0 4px}
  .legend{
    position:relative;z-index:3;width:159px;height:40px;margin:3px auto 0;
    background:#fff;border:2px solid #111;text-align:center;font-size:23px;
    line-height:36px;font-weight:900;letter-spacing:3px;
  }
  .legend:before,.legend:after{
    content:"";position:absolute;width:4px;height:4px;background:white;border:1px solid black;top:-6px
  }
  .legend:before{left:-4px}.legend:after{right:-4px}
  .bubble{position:absolute;z-index:4;background:#8267ef;border:1.5px solid #080808;border-radius:48%;width:55px;height:55px;top:117px}
  .bubble.leftb{left:-8px;transform:rotate(-18deg)}
  .bubble.rightb{right:-5px;background:#f42183;transform:rotate(28deg)}
  .bubble:before,.bubble:after{content:"";position:absolute;border:1.5px solid #111;border-radius:50%;width:22px;height:28px}
  .bubble:before{left:11px;top:-14px}.bubble:after{right:-13px;top:9px}
  .once{
    width:112px;height:42px;border:2px solid #111;background:white;margin:0 auto;
    position:relative;z-index:3;text-align:center;font-weight:900;font-size:23px;line-height:38px;
  }
  .banner{
    position:relative;z-index:3;background:#fff;width:243px;margin:6px auto 0;
    border:2px solid #080808;font-weight:900;font-size:22px;line-height:29px;
    height:31px;padding-left:3px;white-space:nowrap;transform:skew(-2deg);
  }
  .battle{
    height:164px;position:relative;z-index:2;overflow:hidden;margin-top:0;
    background:
     repeating-linear-gradient(25deg,transparent 0 17px,#ff2369 18px 20px,transparent 21px 36px),
     repeating-linear-gradient(155deg,transparent 0 18px,#6555db 19px 21px,transparent 22px 38px);
  }
  .battle .wire{position:absolute;left:21px;right:14px;top:18px;height:68px;border:1px solid #303f49;transform:skewY(-10deg)}
  .pk{position:absolute;top:18px;left:54px;font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:96px;line-height:100px;letter-spacing:-30px}
  .pk .p{color:#5646d8;display:inline-block;transform:rotate(-15deg)}
  .pk .k{color:#fa1678;display:inline-block;margin-left:2px;transform:rotate(10deg)}
  .stage{position:absolute;bottom:-1px;left:0;width:100%;height:71px;background:#f42866;clip-path:polygon(0 15%,50% 58%,100% 12%,100% 100%,0 100%)}
  .stage:after{content:"";position:absolute;left:10px;right:7px;bottom:4px;height:29px;background:#fff;clip-path:polygon(0 25%,46% 65%,100% 0,100% 57%,48% 100%,0 59%)}
  .launch{
    position:relative;z-index:5;margin-top:-56px;height:67px;color:#fff;
    transform:rotate(-4deg);font-weight:900;font-size:35px;line-height:54px;
    white-space:nowrap;letter-spacing:-2px;padding-left:6px;
  }
  .rules{
    position:relative;z-index:3;margin:3px auto 0;width:226px;height:76px;background:#fff;
    border:2px solid #101010;font-size:10px;line-height:13px;padding:0 4px;
  }
  .rules .rtitle{text-align:center;font-size:14px;font-weight:900;border-bottom:1px solid #111;letter-spacing:3px}
  .rules .icons{float:left;width:31px;border-right:1px solid #111;height:56px;font-size:17px;line-height:18px;text-align:center}
  .rules .copy{margin-left:35px;text-align:center;padding-top:3px}
  .rules .foot{position:absolute;bottom:1px;left:37px;right:2px;background:#111;color:white;text-align:center;font-size:10px}
  .lower-left{position:relative;z-index:3;margin-top:16px;text-align:center;font-size:15px;line-height:20px}
  .lower-left .ruled{border-bottom:1px solid #202c13;margin:0 17px}
  .violet{display:inline-block;color:#fff;background:#7163d6;transform:skew(-10deg);padding:0 6px;line-height:17px}
  .slashes{position:absolute;bottom:-1px;left:111px;width:90px;height:42px;background:repeating-linear-gradient(122deg,#090909 0 13px,transparent 13px 21px)}

  .right{background:#aafd00}
  .rings{
    height:238px;position:relative;z-index:2;background:#7860e8;overflow:hidden;
  }
  .rings:after{content:"";position:absolute;bottom:-31px;left:-14px;width:290px;height:125px;background:#aafd00;clip-path:polygon(0 70%,18% 28%,44% 42%,67% 0,100% 29%,100% 100%,0 100%)}
  .ring{
    position:absolute;border:24px solid #7666df;border-radius:50%;width:173px;height:70px;
    box-shadow:inset 0 0 0 1px #e1ddff,0 0 0 1px #e1ddff;color:white;font-size:15px;
    line-height:22px;text-align:center;padding-top:11px;letter-spacing:2px;white-space:nowrap;
  }
  .ring.a{left:46px;top:47px;transform:rotate(22deg)}
  .ring.b{left:82px;top:86px;transform:rotate(-20deg)}
  .spark{position:absolute;z-index:5;right:8px;top:180px;width:65px;height:65px}
  .spark:before,.spark:after{content:"";position:absolute;background:#050505}
  .spark:before{width:65px;height:12px;top:27px;left:0}.spark:after{width:12px;height:65px;top:0;left:27px}
  .spark i,.spark b{position:absolute;background:#050505;width:46px;height:12px;top:26px;left:9px;transform:rotate(45deg)}
  .spark b{transform:rotate(-45deg)}
  .check{position:relative;z-index:4;height:13px;margin:0 18px;border-top:5px solid #111;border-bottom:5px solid #111;background:repeating-linear-gradient(90deg,#111 0 7px,#fff 7px 13px)}
  .bigtitle{position:relative;z-index:4;padding:13px 12px 1px;font-size:49px;line-height:51px;font-weight:900;letter-spacing:-5px;white-space:nowrap}
  .bigtitle .second{font-size:43px;margin-left:34px;letter-spacing:-4px}
  .check.lower{margin-top:7px}
  .small-spark{height:45px;position:relative;z-index:3}
  .small-spark:before,.small-spark:after{content:"";position:absolute;background:#fff;height:3px;width:60px;right:18px;top:17px;transform:rotate(-12deg)}
  .small-spark:after{transform:rotate(12deg)}
  .article{position:relative;z-index:4;padding:0 18px;font-size:16px;line-height:25px;text-align:center}
  .article div{border-bottom:1px solid #273b0a;min-height:25px;white-space:nowrap}
  .article .label{background:#6d59dc;color:white;padding:0 4px}
  .article .hl{background:#c9ff00;padding:0 3px}
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="head-left">商业长图</div>
    <div class="design"><i>↟</i><span>DESIGN</span><i>↡</i></div>
    <div class="head-right">设计分享</div>
  </header>

  <main class="columns">
    <section class="left">
      <div class="topnote">
        <span class="line">两天征稿专栏</span>
        <span class="line">将在本期</span>
        <span class="line">与大家做个正式的告别</span>
      </div>
      <div class="bubble leftb"></div>
      <div class="bubble rightb"></div>
      <div class="legend">江湖从不缺传奇</div>
      <div class="once">这一次</div>
      <div class="banner">TA燃情出帆,战力拉满</div>
      <div class="battle">
        <div class="wire"></div>
        <div class="pk"><span class="p">P</span><span class="k">K</span></div>
        <div class="stage"></div>
      </div>
      <div class="launch">天都蓝台&nbsp;轮今日上线</div>
      <div class="rules">
        <div class="rtitle">正反两派&nbsp; 互相PK</div>
        <div class="icons">♙<br>色<br>☺<br>↗</div>
        <div class="copy">征稿玩法升级，狂掀才美浪潮<br>注意！注意！注意！</div>
        <div class="foot">入选参赛的投稿都将收录礼品一份</div>
      </div>
      <div class="lower-left">
        <div class="ruled">但！</div>
        <div class="ruled"><span class="violet">胜者一方</span></div>
        <div class="ruled">将抢走更加超值的奖励</div>
        <div class="ruled">!!!!!</div>
        <div class="ruled">具体怎么参与？</div>
      </div>
      <div class="slashes"></div>
    </section>

    <div class="divider"></div>

    <section class="right">
      <div class="rings">
        <div class="ring a">重·SO级升级&nbsp; 重磅升级</div>
        <div class="ring b">干劲重磅&nbsp; SO级升级</div>
        <div class="spark"><i></i><b></b></div>
      </div>
      <div class="check"></div>
      <div class="bigtitle">擂台大比拼<br><span class="second">一切“我”掌控</span></div>
      <div class="check lower"></div>
      <div class="small-spark"></div>
      <div class="article">
        <div>公众号每期的<span class="label">「次条福利文」</span></div>
        <div>都向家人们抛出了各种</div>
        <div>热议的话题</div>
        <div>送出了一轮又一轮的奖励</div>
        <div>而“侃侃而谈”和“升官风云”</div>
        <div>两天征稿专栏</div>
        <div>将在本期</div>
        <div>与大家做个正式的告别</div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
