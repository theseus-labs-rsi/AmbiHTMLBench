<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Into the Darkness</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }
    body {
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poster {
      width: min(100vw, 1600px);
      min-height: 2240px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .presenter {
      position: absolute;
      top: 141px;
      width: 100%;
      text-align: center;
      color: #f4f4f4;
      font-size: 39px;
      font-weight: 400;
      letter-spacing: 14px;
      white-space: nowrap;
    }
    .title {
      position: absolute;
      top: 263px;
      width: 100%;
      color: #c5343a;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      font-size: 203px;
      line-height: .94;
      font-weight: 700;
      letter-spacing: -7px;
    }
    .title span {
      display: block;
    }
    .garage {
      position: absolute;
      top: 705px;
      left: 0;
      width: 100%;
      height: 1180px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #000 0 13%, #050505 13% 18%, #101010 18% 33%, #3b3b3b 33% 57%, #181818 57% 100%);
    }
    .garage::before {
      content: "";
      position: absolute;
      top: 198px;
      left: -4%;
      width: 108%;
      height: 230px;
      background:
        repeating-linear-gradient(84deg, transparent 0 52px, rgba(230,230,230,.9) 53px 60px, transparent 61px 128px),
        repeating-linear-gradient(96deg, transparent 0 70px, rgba(245,245,245,.8) 71px 77px, transparent 78px 165px);
      opacity: .72;
      transform: perspective(400px) rotateX(35deg);
    }
    .garage::after {
      content: "";
      position: absolute;
      top: 420px;
      left: 0;
      width: 100%;
      height: 760px;
      background:
        linear-gradient(160deg, transparent 0 36%, rgba(210,210,210,.32) 36.2% 36.8%, transparent 37% 100%),
        linear-gradient(24deg, transparent 0 58%, rgba(190,190,190,.25) 58.2% 58.8%, transparent 59% 100%),
        repeating-linear-gradient(89deg, rgba(0,0,0,.25) 0 11px, transparent 11px 42px);
      opacity: .68;
    }
    .ceiling-light {
      position: absolute;
      z-index: 2;
      top: 23px;
      height: 138px;
      width: 38px;
      background: #f5f5f5;
      box-shadow: 0 0 12px #fff;
      transform: skewX(-25deg);
    }
    .l1 { left: 19%; }
    .l2 { left: 61%; }
    .sign {
      position: absolute;
      z-index: 3;
      top: 298px;
      left: 50%;
      transform: translateX(-50%);
      width: 558px;
      padding: 7px 10px 5px;
      color: #111;
      background: #f4f4f4;
      border: 3px solid #bdbdbd;
      text-align: center;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 37px;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .placeholder {
      position: absolute;
      z-index: 1;
      color: transparent;
    }
    .car {
      top: 582px;
      left: 28%;
      width: 165px;
      height: 135px;
      border-radius: 45% 45% 18% 18%;
      background: linear-gradient(160deg, #eee 0 10%, #222 12% 34%, #eee 35% 42%, #101010 45% 100%);
      box-shadow: 0 30px 25px rgba(0,0,0,.9);
    }
    .car::before, .car::after {
      content: "";
      position: absolute;
      bottom: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #070707;
    }
    .car::before { left: 17px; }
    .car::after { right: 17px; }
    .rail {
      position: absolute;
      z-index: 3;
      left: -15px;
      top: 778px;
      width: 420px;
      height: 165px;
      border-top: 13px solid #151515;
      border-left: 14px solid #1b1b1b;
      transform: skewY(-16deg);
      background: repeating-linear-gradient(90deg, transparent 0 35px, #151515 35px 47px, transparent 47px 72px);
      opacity: .95;
    }
    .details {
      position: absolute;
      z-index: 5;
      top: 1881px;
      width: 100%;
      text-align: center;
    }
    .director {
      margin: 0 0 41px;
      color: #c5343a;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 8px;
    }
    .info {
      color: #f6f6f6;
      font-size: 40px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 7px;
    }
    @media (max-width: 800px) {
      .poster { transform-origin: top center; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="presenter">SOULFUL FILM PRESENTS</div>

    <div class="title">
      <span>INTO THE</span>
      <span>DARKNESS</span>
    </div>

    <div class="garage" aria-label="[Photo: black-and-white underground parking garage]">
      <div class="ceiling-light l1"></div>
      <div class="ceiling-light l2"></div>
      <div class="sign">SELF PARK 6’-0” CLEARANCE</div>
      <div class="placeholder car">[Car]</div>
      <div class="rail"></div>
    </div>

    <section class="details">
      <p class="director">Directed by Levi Stanford</p>
      <div class="info">
        May 23, 2019 | 2:00 pm<br>
        Michael Hopper Auditorium<br>
        Oreixs university, OH
      </div>
    </section>
  </main>
</body>
</html>
