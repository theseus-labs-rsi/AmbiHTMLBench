<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>做好竞品分析</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    body {
      background: #e9c7a7;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #202020;
    }
    .canvas {
      width: 540px;
      min-height: 722px;
      position: relative;
      padding-top: 30px;
      background: #e9c7a7;
    }
    .paper {
      position: relative;
      width: 488px;
      height: 661px;
      margin: 0 auto;
      background: #f8f4f0;
      border-radius: 15px 15px 11px 11px;
      box-shadow: 2px 3px 2px rgba(101, 72, 50, .20);
      overflow: hidden;
    }
    .top-tag {
      position: absolute;
      top: 16px;
      left: 26px;
      height: 30px;
      padding: 5px 15px 4px 10px;
      color: #fffdf9;
      background: #875c3a;
      font-size: 15px;
      line-height: 21px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .top-tag::after {
      content: "";
      position: absolute;
      top: 0;
      right: -12px;
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 12px solid #875c3a;
    }
    .content {
      position: absolute;
      top: 87px;
      left: 26px;
      right: 25px;
    }
    h1 {
      margin: 0;
      font-size: 37px;
      line-height: 1.12;
      letter-spacing: 1px;
      font-weight: 900;
      color: #202020;
    }
    .intro {
      margin-top: 41px;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: .25px;
    }
    .analysis {
      margin-top: 25px;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.58;
      letter-spacing: .25px;
    }
    .list {
      margin-top: 28px;
      font-size: 17px;
      line-height: 1.57;
      font-weight: 600;
      letter-spacing: .15px;
    }
    .item {
      white-space: nowrap;
    }
    .subitem {
      padding-left: 27px;
      font-weight: 500;
      white-space: nowrap;
    }
    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3e4d7;
      border-top: 2px dotted #dfc2aa;
      font-size: 18px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: .2px;
      color: #292322;
    }
    .footer::before,
    .footer::after {
      content: "";
      position: absolute;
      top: -18px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #e9c7a7;
    }
    .footer::before { left: -9px; }
    .footer::after { right: -9px; }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="paper">
      <div class="top-tag">新媒体账号运营6种方法</div>

      <div class="content">
        <h1>03&nbsp;&nbsp;做好竞品分析</h1>

        <div class="intro">
          前期的竞品分析<br>
          一定要花大量的时间和精力去收集信息
        </div>

        <div class="analysis">
          仔细分析<br>
          可以从以下几个方面来看
        </div>

        <div class="list">
          <div class="item">1、账号人设标签</div>
          <div class="item">2、账号选题规划</div>
          <div class="item">3、内容脚本拆解：</div>
          <div class="subitem">结构、矛盾点、金句、痛点</div>
          <div class="item">4、内容形式：</div>
          <div class="subitem">场景道具服装，拍摄剪辑节奏</div>
          <div class="item">5、运营策略：</div>
          <div class="subitem">发布时间和频率，封面，文案，线上互动</div>
          <div class="subitem">用户运营，引流途径</div>
        </div>
      </div>

      <div class="footer">@新媒体运营的十万个为什么</div>
    </section>
  </main>
</body>
</html>
