<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30天学会自然拼读</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ececec;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }
    .poster {
      position: relative;
      width: 540px;
      height: 755px;
      margin: 0 auto;
      overflow: hidden;
      background:
        linear-gradient(to bottom, #f05846 0 15.8%, #ffd849 15.8% 85.7%, #49a7ef 85.7% 100%);
      border: 2px solid #202020;
    }
    .poster:before {
      content: "";
      position: absolute;
      inset: 13px 16px 14px 18px;
      border: 3px solid #1d1d1d;
      pointer-events: none;
    }
    .paper {
      position: absolute;
      left: 34px;
      top: 31px;
      width: 473px;
      height: 688px;
      background: #fff;
      border: 1px solid #bcbcbc;
      overflow: hidden;
    }
    .top-blue {
      position: absolute;
      top: 35px;
      left: 2px;
      width: 469px;
      height: 18px;
      background: #a7c8fb;
    }
    .title-brush {
      position: absolute;
      top: 55px;
      left: 91px;
      width: 285px;
      height: 55px;
      transform: rotate(-1deg);
      background: #f77591;
      border-radius: 5px 12px 12px 7px;
      box-shadow:
        0 5px 0 -2px #f99bad,
        4px -4px 0 -2px #f888a1,
        -5px 5px 0 -3px #f899ad;
    }
    .title-brush:before, .title-brush:after {
      content: "";
      position: absolute;
      left: 13px;
      right: 8px;
      height: 2px;
      background: rgba(255,255,255,.55);
    }
    .title-brush:before { top: 7px; }
    .title-brush:after { bottom: 7px; }
    .title {
      position: absolute;
      z-index: 2;
      top: 63px;
      width: 100%;
      text-align: center;
      color: #141414;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .cloud-label {
      position: absolute;
      left: 22px;
      top: 134px;
      width: 157px;
      height: 35px;
      background: #a9c8fb;
      border-radius: 50% 35% 45% 46%;
      transform: rotate(3deg);
    }
    .cloud-label span {
      display: block;
      padding: 3px 0 0 28px;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 8px;
      transform: rotate(-3deg);
    }
    .section-title {
      position: absolute;
      top: 113px;
      right: 27px;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      color: #050505;
      font-size: 21px;
      font-weight: bold;
      transform: rotate(2deg);
    }
    .count-words {
      position: absolute;
      top: 151px;
      right: 27px;
      width: 204px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 28px;
      row-gap: 13px;
      font-size: 21px;
      font-family: Arial, sans-serif;
      font-weight: 800;
      color: #101010;
    }
    .count-words span::first-letter,
    .division-words span::first-letter {
      color: #eb3042;
    }
    .people {
      position: absolute;
      left: 34px;
      top: 178px;
      width: 184px;
      height: 48px;
      display: flex;
      align-items: end;
      gap: 10px;
    }
    .person-small {
      position: relative;
      width: 42px;
      height: 45px;
      text-align: center;
      font-size: 29px;
      line-height: 37px;
    }
    .person-small:nth-child(2) { font-size: 34px; }
    .person-small:nth-child(3) { font-size: 31px; }
    .person-small:nth-child(4) { font-size: 32px; }
    .person-small:after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 11px;
      width: 21px;
      height: 14px;
      border-radius: 12px 12px 2px 2px;
      background: #f09a5d;
    }
    .definition {
      position: absolute;
      left: 27px;
      top: 220px;
      width: 217px;
      min-height: 73px;
      padding: 7px 8px;
      background: #f8d7d3;
      color: #202020;
      font-size: 18px;
      line-height: 1.58;
      font-weight: 500;
    }
    .highlight {
      position: absolute;
      left: 27px;
      top: 341px;
      width: 184px;
      height: 46px;
      border-radius: 45% 55% 49% 40%;
      background: #e3fb84;
      transform: rotate(2deg);
    }
    .highlight span {
      display: block;
      padding: 5px 0 0 28px;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: 6px;
      transform: rotate(-2deg);
    }
    .poem {
      position: absolute;
      left: 26px;
      top: 390px;
      width: 135px;
      padding: 7px 8px 5px;
      background: #f8d7d3;
      color: #222;
      font-size: 18px;
      line-height: 1.68;
      white-space: nowrap;
    }
    .boy {
      position: absolute;
      left: 153px;
      top: 393px;
      width: 79px;
      height: 213px;
    }
    .boy .head {
      position: absolute;
      left: 15px;
      top: 16px;
      width: 48px;
      height: 54px;
      border-radius: 48% 52% 47% 47%;
      background: #f5b17f;
    }
    .boy .hair {
      position: absolute;
      left: 14px;
      top: 4px;
      width: 56px;
      height: 31px;
      background: #151515;
      border-radius: 60% 65% 25% 25%;
      clip-path: polygon(0 45%, 12% 5%, 22% 28%, 37% 0, 51% 20%, 75% 7%, 100% 38%, 94% 65%, 70% 52%, 43% 44%, 14% 65%);
    }
    .boy .eye { position: absolute; width: 4px; height: 5px; top: 40px; background: #111; border-radius: 50%; }
    .boy .eye.left { left: 30px; } .boy .eye.right { left: 52px; }
    .boy .body {
      position: absolute;
      left: 21px;
      top: 65px;
      width: 38px;
      height: 84px;
      border-radius: 9px 9px 3px 3px;
      background: #ee4439;
    }
    .boy .shirt {
      position: absolute;
      left: 31px;
      top: 71px;
      height: 19px;
      border-left: 5px solid white;
      transform: rotate(12deg);
    }
    .boy .arm { position: absolute; top: 75px; width: 11px; height: 65px; background: #f5b17f; border-radius: 8px; }
    .boy .arm.left { left: 13px; transform: rotate(11deg); }
    .boy .arm.right { left: 58px; transform: rotate(-4deg); }
    .boy .leg { position: absolute; top: 145px; width: 12px; height: 63px; background: #142a4f; border-radius: 2px; }
    .boy .leg.left { left: 27px; transform: rotate(2deg); }
    .boy .leg.right { left: 46px; transform: rotate(-2deg); }
    .boy .shoe { position: absolute; top: 203px; width: 22px; height: 7px; background: #171717; border-radius: 7px 4px 2px 2px; }
    .boy .shoe.left { left: 19px; } .boy .shoe.right { left: 43px; }
    .division-title {
      position: absolute;
      top: 363px;
      right: 48px;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      color: #050505;
      font-size: 20px;
      font-weight: bold;
      transform: rotate(2deg);
    }
    .division-words {
      position: absolute;
      top: 419px;
      right: 25px;
      width: 216px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 22px;
      row-gap: 12px;
      font-family: Arial, sans-serif;
      font-size: 21px;
      font-weight: 800;
      color: #101010;
    }
    .lime-line {
      position: absolute;
      left: 2px;
      bottom: 32px;
      width: 469px;
      height: 22px;
      background: #e4ff83;
    }
    .flower {
      position: absolute;
      z-index: 5;
      width: 46px;
      height: 46px;
      font-size: 43px;
      line-height: 46px;
      text-align: center;
    }
    .flower.one { top: 6px; right: 18px; transform: rotate(15deg); }
    .flower.two { top: 27px; right: -1px; transform: rotate(-20deg); font-size: 39px; }
    .flower.three { top: 55px; right: 4px; transform: rotate(20deg); font-size: 35px; }
    .heart {
      position: absolute;
      z-index: 4;
      color: #b4dfca;
      font-size: 27px;
    }
    .heart.one { right: 31px; top: 439px; transform: rotate(-20deg); }
    .heart.two { right: -4px; top: 464px; color: #aadbd7; font-size: 34px; }
    .heart.three { right: 5px; top: 488px; color: #f5c1b5; font-size: 38px; }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 1px;
      overflow: hidden;
    }
    .bottom-decoration {
      position: absolute;
      z-index: 7;
      left: 83px;
      bottom: -3px;
      width: 218px;
      height: 60px;
    }
    .bottom-decoration .flowerline {
      position: absolute;
      top: 0;
      left: 70px;
      font-size: 39px;
      letter-spacing: -12px;
      transform: rotate(-10deg);
    }
    .bottom-decoration .fox {
      position: absolute;
      left: 2px;
      bottom: 0;
      font-size: 49px;
      transform: rotate(-9deg);
    }
    .bottom-decoration .bear {
      position: absolute;
      right: 1px;
      bottom: -3px;
      font-size: 55px;
    }
    .bottom-decoration .blur-text {
      position: absolute;
      left: 73px;
      top: 26px;
      width: 110px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 1px 2px #777;
      opacity: .82;
    }
    .side-mark {
      position: absolute;
      z-index: 4;
      color: #151515;
      font-size: 32px;
      line-height: 16px;
      font-weight: bold;
    }
    .side-mark.left { left: 3px; bottom: 67px; transform: rotate(-18deg); }
    .side-mark.right { right: 6px; bottom: 48px; transform: rotate(90deg); }
  </style>
</head>
<body>
  <main class="poster">
    <div class="paper">
      <div class="top-blue"></div>
      <div class="title-brush"></div>
      <div class="title">30天学会自然拼读</div>

      <div class="cloud-label"><span>数音节</span></div>
      <div class="section-title">Syllable Counting</div>

      <div class="people placeholder" aria-label="[Illustration: four children]">
        <span class="person-small">👩🏿</span>
        <span class="person-small">👩</span>
        <span class="person-small">👩🏾</span>
        <span class="person-small">👩🏽</span>
      </div>

      <div class="definition">
        有几个发音的元音（或元<br>
        音组合）就有几个音节。
      </div>

      <div class="count-words">
        <span>cat</span><span>cake</span>
        <span>rain</span><span>row</span>
        <span>robot</span><span>teacher</span>
        <span>table</span><span>apple</span>
      </div>

      <div class="highlight"><span>划分音节</span></div>

      <div class="poem">
        有时一靠后，<br>
        常常二分手。<br>
        组合共发音，<br>
        一起被分走。<br>
        词根词缀分离，<br>
        多音节词不易，<br>
        还请多练多听。
      </div>

      <div class="boy placeholder" aria-label="[Illustration: boy standing]">
        <div class="head"></div><div class="hair"></div>
        <div class="eye left"></div><div class="eye right"></div>
        <div class="body"></div><div class="shirt"></div>
        <div class="arm left"></div><div class="arm right"></div>
        <div class="leg left"></div><div class="leg right"></div>
        <div class="shoe left"></div><div class="shoe right"></div>
      </div>

      <div class="division-title">Syllable Division</div>
      <div class="division-words">
        <span>rabbit</span><span>basket</span>
        <span>baby</span><span>robot</span>
        <span>closet</span><span>planet</span>
        <span>destroy</span><span>complex</span>
        <span>unhappy</span><span>hopefully</span>
      </div>

      <div class="heart one">♥</div>
      <div class="heart two">♥</div>
      <div class="heart three">♥</div>
      <div class="lime-line"></div>
    </div>

    <div class="flower one placeholder" aria-label="[Decoration: flower]">🌸</div>
    <div class="flower two placeholder" aria-label="[Decoration: flower]">🌼</div>
    <div class="flower three placeholder" aria-label="[Decoration: flower]">🌸</div>

    <div class="side-mark left">≋</div>
    <div class="side-mark right">≋</div>

    <div class="bottom-decoration placeholder" aria-label="[Decoration: animals and flowers at bottom]">
      <div class="flowerline">🌼🌼🌼</div>
      <div class="fox">🦊</div>
      <div class="bear">🧸</div>
      <div class="blur-text">[illegible]</div>
    </div>
  </main>
</body>
</html>
