  <main class="page">
    <h1 class="lesson">第三课</h1>
    <h2 class="title">社会生活离不开规则</h2>

    <p class="intro">井然有序的社会生活离不开社会规则的维系。规则划定自由的边界，保障人们的自由。我们应该自觉遵守规则，积极改进规则，与规则同行，创建美好生活。</p>

    <div class="section-title">维护秩序</div>

    <section class="experience" aria-label="运用你的经验">
      <span class="icon">◆</span>
      <div class="experience-heading">运用你的经验</div>

      <div class="photo-grid">
        <figure>
          <div class="placeholder">[照片：人们排队进行安全检查]</div>
          <figcaption>人们排队进行安全检查</figcaption>
        </figure>
        <figure>
          <div class="placeholder">[照片：纺纱工人按操作规程工作]</div>
          <figcaption>纺纱工人按操作规程工作</figcaption>
        </figure>
        <figure>
          <div class="placeholder">[照片：路口行人、自行车、机动车各行其道]</div>
          <figcaption>行人、自行车、机动车各行其道</figcaption>
        </figure>
        <figure>
          <div class="placeholder">[照片：公共场所保持安静]</div>
          <figcaption>人们在公共场所保持安静</figcaption>
        </figure>
      </div>

      <div class="questions">
        <div class="question">以上图片体现了哪些方面的社会秩序？<span class="answer">社会管理秩序、生产秩序、交通秩序、公共场所秩序</span></div>
        <div class="question">如果没有秩序，我们的生活将会怎样？<span class="answer">将会陷入无序化状态，混乱不堪。社会将不能正常运转，人民将不能安居乐业……</span></div>
      </div>
    </section>
