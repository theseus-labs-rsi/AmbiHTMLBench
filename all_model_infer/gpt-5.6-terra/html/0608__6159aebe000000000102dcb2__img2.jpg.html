<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山里的约会</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #e7ece4;
      font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
    }
    .poster {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      color: #103d21;
      background:
        radial-gradient(ellipse at 83% 15%, rgba(255,255,255,.84) 0 8%, transparent 20%),
        radial-gradient(ellipse at 13% 11%, rgba(133,205,190,.24) 0 10%, transparent 29%),
        radial-gradient(ellipse at 68% 34%, rgba(116,190,177,.22) 0 9%, transparent 26%),
        linear-gradient(180deg, #dff0eb 0%, #eff5ee 48%, #d7e2c3 70%, #dce6bf 100%);
    }
    .wash {
      position: absolute;
      opacity: .65;
      filter: blur(10px);
      border-radius: 50%;
      background: #99cfc3;
    }
    .w1 { width: 225px; height: 92px; top: 60px; left: -34px; }
    .w2 { width: 250px; height: 82px; top: 145px; right: -52px; background:#a7d4ca; }
    .w3 { width: 198px; height: 75px; top: 258px; left: 75px; background:#baded4; }
    .w4 { width: 180px; height: 76px; top: 329px; right: -20px; background:#95c7ba; }

    .side-cn {
      position: absolute;
      top: 0;
      left: 25px;
      font-family: "SimHei", sans-serif;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
      letter-spacing: 3px;
      writing-mode: vertical-rl;
      z-index: 5;
    }
    .side-en {
      position: absolute;
      left: 27px;
      top: 236px;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      z-index: 5;
    }
    .side-en.bottom { top: 610px; }

    .top-copy {
      position: absolute;
      top: 1px;
      right: 20px;
      width: 372px;
      color: #1c382a;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.85;
      text-align: right;
      z-index: 5;
    }
    .title {
      position: absolute;
      top: 51px;
      left: 192px;
      width: 155px;
      height: 323px;
      color: #0a3c20;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 61px;
      font-weight: 700;
      line-height: .98;
      letter-spacing: 7px;
      z-index: 4;
    }
    .title .shan {
      position: absolute;
      top: 0;
      left: 96px;
      font-size: 58px;
    }
    .title .li {
      position: absolute;
      top: 96px;
      left: 94px;
    }
    .title .de {
      position: absolute;
      top: 202px;
      left: 96px;
    }
    .title .yue {
      position: absolute;
      top: 155px;
      left: 4px;
    }
    .title .hui {
      position: absolute;
      top: 242px;
      left: 5px;
    }

    .mountains {
      position: absolute;
      left: 0;
      right: 0;
      top: 354px;
      height: 100px;
      overflow: hidden;
      z-index: 2;
    }
    .mountains:before,
    .mountains:after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 77px;
      background: #79ae98;
      clip-path: polygon(0 78%, 13% 63%, 27% 65%, 42% 31%, 52% 47%, 62% 22%, 74% 46%, 86% 6%, 100% 44%, 100% 100%, 0 100%);
      opacity: .72;
    }
    .mountains:after {
      height: 67px;
      background: #4f8e69;
      clip-path: polygon(0 76%, 13% 63%, 26% 73%, 38% 47%, 49% 61%, 59% 36%, 70% 55%, 80% 4%, 90% 25%, 100% 23%, 100% 100%, 0 100%);
      opacity: .94;
    }

    .landscape.placeholder {
      position: absolute;
      left: 0;
      top: 410px;
      width: 540px;
      height: 228px;
      border: 0;
      background:
        radial-gradient(ellipse at 87% 24%, #5f9d49 0 8%, transparent 8.5%),
        radial-gradient(ellipse at 91% 34%, #497e3e 0 14%, transparent 14.5%),
        radial-gradient(ellipse at 76% 20%, #326a43 0 9%, transparent 9.5%),
        repeating-linear-gradient(175deg, transparent 0 11px, rgba(81,103,41,.2) 12px 13px),
        linear-gradient(180deg, #9ab76a 0%, #9eaf65 16%, #bfbd7e 17%, #d2cf98 52%, #b9c285 100%);
      z-index: 3;
      color: transparent;
    }
    .road {
      position: absolute;
      left: 86px;
      top: 482px;
      width: 385px;
      height: 163px;
      background: rgba(210,208,163,.8);
      clip-path: polygon(29% 0, 69% 0, 100% 100%, 0 100%);
      z-index: 3;
    }
    .wall {
      position: absolute;
      top: 484px;
      left: 0;
      width: 540px;
      height: 45px;
      background:
        repeating-linear-gradient(22deg, transparent 0 17px, rgba(60,73,41,.62) 18px 20px),
        repeating-linear-gradient(-19deg, transparent 0 20px, rgba(83,76,43,.5) 21px 22px),
        #a6a17a;
      opacity: .85;
      z-index: 4;
    }
    .people {
      position: absolute;
      top: 487px;
      left: 43px;
      width: 460px;
      height: 140px;
      z-index: 5;
      background:
        radial-gradient(circle at 7% 24%, #dfb282 0 4px, transparent 4.5px),
        radial-gradient(circle at 15% 40%, #47362d 0 4px, transparent 4.5px),
        radial-gradient(circle at 25% 19%, #dfb282 0 4px, transparent 4.5px),
        radial-gradient(circle at 39% 36%, #553e31 0 5px, transparent 5.5px),
        radial-gradient(circle at 52% 20%, #dcae83 0 4px, transparent 4.5px),
        radial-gradient(circle at 66% 35%, #51392c 0 5px, transparent 5.5px),
        radial-gradient(circle at 84% 17%, #d8a87d 0 4px, transparent 4.5px),
        radial-gradient(circle at 96% 36%, #4c382d 0 4px, transparent 4.5px);
      opacity: .93;
    }
    .watermark {
      position: absolute;
      top: 421px;
      left: 288px;
      color: white;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-weight: 700;
      font-size: 15px;
      line-height: 1.4;
      text-shadow: 0 1px 2px #477558;
      z-index: 7;
    }
    .watermark .heart { font-size: 25px; vertical-align: -3px; }
    .watermark small {
      display: block;
      text-align: center;
      font-size: 9px;
      font-weight: 400;
    }

    .bottom-text {
      position: absolute;
      top: 656px;
      width: 148px;
      font-size: 14px;
      line-height: 1.95;
      color: #315238;
      z-index: 8;
      white-space: nowrap;
    }
    .bottom-text.left { left: 64px; }
    .bottom-text.middle { left: 247px; }
    .bottom-text.right { left: 385px; }
  </style>
</head>
<body>
  <main class="poster">
    <div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div><div class="wash w4"></div>

    <div class="side-cn">大班综合</div>
    <div class="side-en">Tongcai 2021</div>
    <div class="side-en bottom">Autumn</div>

    <div class="top-copy">
      地上的路原来很平坦可是有太多人走过这些路过的人们太累了<br>
      于是他们决定扔下一些东西
    </div>

    <div class="title" aria-label="山里的约会">
      <span class="shan">山</span>
      <span class="li">里</span>
      <span class="de">的</span>
      <span class="yue">约</span>
      <span class="hui">会</span>
    </div>

    <div class="mountains"></div>
    <div class="landscape placeholder">[插图：山间田野与人物]</div>
    <div class="road"></div>
    <div class="wall"></div>
    <div class="people"></div>

    <div class="watermark"><span class="heart">♥</span> @Hiro豆豆老师<small>From 小红书</small></div>

    <div class="bottom-text left">有的人扔下了悲伤<br>变成了路上的石头</div>
    <div class="bottom-text middle">有的人留下快乐<br>变成了山上的树苗</div>
    <div class="bottom-text right">我把装在瓶子里的思念<br>放在高高的山顶上<br>交成了黑夜的眼睛</div>
  </main>
</body>
</html>
