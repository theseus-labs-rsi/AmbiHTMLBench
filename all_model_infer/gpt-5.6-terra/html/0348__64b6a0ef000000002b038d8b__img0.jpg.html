<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内部交易抵销 第③步：调整所得税</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      height: 734px;
      overflow: hidden;
    }
    body {
      background:
        repeating-linear-gradient(90deg, rgba(126,95,47,.08) 0, rgba(126,95,47,.08) 1px, transparent 1px, transparent 5px),
        #faf3df;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #171717;
    }
    .page {
      position: relative;
      width: 540px;
      height: 734px;
    }
    .board {
      position: absolute;
      left: 22px;
      top: 28px;
      width: 496px;
      height: 680px;
      background: #fff;
      border: 1.5px solid #6e5735;
      border-radius: 9px;
      box-shadow: inset 0 0 0 2px rgba(248,244,233,.85);
      overflow: hidden;
    }
    .paw {
      position: absolute;
      color: #9c773a;
      font-size: 31px;
      line-height: 1;
      opacity: .95;
    }
    .paw.one { left: 122px; top: 11px; transform: rotate(-16deg); }
    .paw.two { right: 88px; top: 8px; color: #e9ad65; transform: rotate(14deg); }
    .title {
      position: absolute;
      top: 28px;
      width: 100%;
      text-align: center;
      color: #765727;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 1px;
      font-size: 33px;
    }
    .title .line2 { font-size: 33px; }
    .highlight {
      position: absolute;
      left: 53px;
      top: 169px;
      color: #765727;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 1px 4px 2px;
      background: linear-gradient(transparent 28%, #f3d980 28%, #f3d980 91%, transparent 91%);
    }
    .section {
      position: absolute;
      left: 44px;
      width: 410px;
      font-size: 16px;
      line-height: 1.85;
    }
    .individual { top: 227px; }
    .consolidated { top: 348px; }
    .lead {
      margin: 0 0 3px;
    }
    .lead strong { font-weight: 800; }
    .entries {
      position: relative;
      margin-left: 40px;
      height: 74px;
      line-height: 1.85;
      white-space: nowrap;
    }
    .numbers {
      position: absolute;
      left: 0;
      top: 0;
      width: 99px;
      text-align: left;
    }
    .brace {
      position: absolute;
      left: 96px;
      top: 0px;
      color: #5d9bca;
      font-family: Georgia, serif;
      font-size: 51px;
      line-height: 1.18;
      transform: scaleX(.48);
      transform-origin: left top;
    }
    .tax {
      position: absolute;
      left: 105px;
      top: 20px;
      font-size: 14px;
    }
    .group-arrow {
      position: absolute;
      right: 3px;
      top: 53px;
      width: 64px;
      height: 108px;
      color: #151515;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.8;
      white-space: nowrap;
    }
    .group-arrow .shaft {
      position: absolute;
      left: -28px;
      top: -5px;
      height: 95px;
      border-left: 7px solid #5d9bca;
    }
    .group-arrow .shaft:after {
      content: "";
      position: absolute;
      left: -10px;
      bottom: -1px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid #5d9bca;
    }
    .group-arrow .label { display: block; }
    .group-arrow .adjust {
      display: block;
      margin-left: 0;
      font-weight: 400;
    }
    .accounting {
      position: absolute;
      top: 474px;
      left: 60px;
      width: 360px;
      color: #735d39;
      font-size: 16px;
      line-height: 2.05;
      white-space: nowrap;
    }
    .accounting .credit { padding-left: 94px; }
    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: transparent;
      font-size: 1px;
    }
    .cat-left {
      left: 12px;
      bottom: -3px;
      width: 133px;
      height: 90px;
      border-radius: 50% 48% 36% 42%;
      background:
        radial-gradient(ellipse at 42% 53%, #f6f4ed 0 26%, transparent 27%),
        radial-gradient(ellipse at 54% 44%, #a6a09a 0 29%, transparent 30%),
        radial-gradient(ellipse at 46% 70%, #efede4 0 40%, transparent 41%),
        #9e9993;
      border: 2px solid #4e4b48;
      box-shadow: 21px 13px 0 -4px #f2db8d;
      transform: rotate(-4deg);
    }
    .cat-right {
      right: -2px;
      bottom: -11px;
      width: 106px;
      height: 120px;
      border-radius: 47% 49% 39% 43%;
      background:
        radial-gradient(ellipse at 51% 31%, #f6f3e8 0 23%, transparent 24%),
        radial-gradient(ellipse at 50% 65%, #f4f1e7 0 43%, transparent 44%),
        #d8d0bf;
      border: 2px solid #4d4944;
    }
    .cat-right:before {
      content: "";
      position: absolute;
      left: 15px;
      top: -17px;
      width: 67px;
      height: 26px;
      border-radius: 50%;
      background: #d5a561;
      border: 1px solid #504638;
      transform: rotate(8deg);
      box-shadow: 0 8px 0 -4px #6c5942;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="board">
      <div class="paw one">♣</div>
      <div class="paw two">♣</div>

      <div class="title">
        <div>内部交易抵销</div>
        <div class="line2">第③步：调整所得税</div>
      </div>

      <div class="highlight">若实现60%对外销售</div>

      <section class="section individual">
        <p class="lead"><strong>个别报表层面</strong>因为存货跌价准备：</p>
        <div class="entries">
          <div class="numbers">账面价值 900<br>计税基础 1200</div>
          <div class="brace">}</div>
          <div class="tax">递延所得税资产300*25%=75</div>
        </div>
      </section>

      <div class="group-arrow">
        <div class="shaft"></div>
        <span class="label">【集团角度】</span>
        <span class="adjust">调增25</span>
      </div>

      <section class="section consolidated">
        <p class="lead"><strong>合并报表层面</strong>因为存货跌价准备：</p>
        <div class="entries">
          <div class="numbers">账面价值800<br>计税基础1200</div>
          <div class="brace">}</div>
          <div class="tax">递延所得税资产400*25%=100</div>
        </div>
      </section>

      <div class="accounting">
        会计处理：借：递延所得税资产25<br>
        <span class="credit">贷：所得税费用25</span>
      </div>

      <div class="placeholder cat-left">[Cat illustration: bottom-left]</div>
      <div class="placeholder cat-right">[Cat illustration: bottom-right]</div>
    </main>
  </div>
</body>
</html>
