<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Notes</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #29221b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
    }
    .page {
      width: 540px;
      height: 710px;
      padding: 36px 38px 18px 38px;
      color: #1f1b18;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 35px,
          rgba(101, 107, 95, .34) 36px,
          transparent 37px
        ),
        #e8e4d3;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .55);
      transform: rotate(.8deg);
      overflow: hidden;
    }
    .section {
      margin: 0 0 20px 0;
    }
    .section:first-child {
      margin-bottom: 24px;
    }
    .row {
      min-height: 30px;
      display: grid;
      grid-template-columns: 58% 42%;
      align-items: baseline;
      font-size: 24px;
      line-height: 1.18;
      white-space: nowrap;
    }
    .english {
      padding-left: 2px;
      letter-spacing: .2px;
    }
    .meaning {
      color: #31345b;
      font-family: "KaiTi", "STKaiti", "DFKai-SB", serif;
      font-size: 23px;
      letter-spacing: .2px;
    }
    .top .meaning {
      color: #1f1b18;
    }
    .blue .english,
    .blue .meaning {
      color: #51558c;
    }
    .indent .english {
      padding-left: 29px;
    }
    .spacer {
      height: 16px;
    }
    .bottom {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="section top">
      <div class="row"><span class="english">charity</span><span class="meaning">n. 慈善机构</span></div>
      <div class="row"><span class="english">clarity</span><span class="meaning">n. 思路, 图像清晰</span></div>
      <div class="row"><span class="english">clarify</span><span class="meaning">V. 阐明, 解释</span></div>
    </section>

    <section class="section blue">
      <div class="row"><span class="english">consistent</span><span class="meaning">adj. 一贯的, [?]一致的</span></div>
      <div class="row indent"><span class="english">resist</span><span class="meaning">V. 抵制</span></div>
      <div class="row indent"><span class="english">insist</span><span class="meaning">V. 坚持</span></div>
    </section>

    <section class="section">
      <div class="row"><span class="english">insert</span><span class="meaning">V. 插入, 嵌入</span></div>
      <div class="row"><span class="english">assert</span><span class="meaning">V. 断言; 坚持主张</span></div>
    </section>

    <section class="section blue">
      <div class="row"><span class="english">eminent</span><span class="meaning">adj. 杰出的</span></div>
      <div class="row"><span class="english">Prominent</span><span class="meaning">adj. 杰出的, 重要的</span></div>
      <div class="row"><span class="english">eliminate</span><span class="meaning">V. 消除, 淘汰</span></div>
    </section>

    <section class="section">
      <div class="row"><span class="english">integral</span><span class="meaning">adj. 必不可少的</span></div>
      <div class="row"><span class="english">integrity</span><span class="meaning">n. 诚实, 正直</span></div>
      <div class="row"><span class="english">integrate</span><span class="meaning">V. (使)融入</span></div>
    </section>

    <section class="section blue bottom">
      <div class="row"><span class="english">fabricate</span><span class="meaning">V. 捏造</span></div>
      <div class="row"><span class="english">fluctuate</span><span class="meaning">V. 波动; 上下浮动</span></div>
    </section>
  </main>
</body>
</html>
