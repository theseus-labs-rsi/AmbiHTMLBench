<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>端午万宁三日游安排</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #cceafa;
      color: #333;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(221,242,253,.95), rgba(191,224,242,.96)),
        #cceafa;
    }
    .sea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 134px;
      background: rgba(154,203,226,.28);
      border-top: 2px solid rgba(240,250,253,.52);
    }
    .sea:before, .sea:after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.65);
      transform: skewY(-7deg);
    }
    .sea:before { width: 400px; height: 4px; top: 30px; right: -35px; }
    .sea:after { width: 310px; height: 3px; top: 71px; left: 155px; }
    .pier {
      position: absolute;
      right: -10px;
      bottom: 0;
      width: 247px;
      height: 108px;
      border-top: 5px solid rgba(225,237,239,.9);
      background: repeating-linear-gradient(90deg, rgba(215,231,235,.9) 0 3px, transparent 3px 20px);
      opacity: .85;
      transform: skewY(-5deg);
    }
    .title {
      position: relative;
      z-index: 2;
      margin: 25px 13px 0;
      white-space: nowrap;
      text-align: center;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-weight: 900;
      font-size: 38px;
      line-height: 1;
      letter-spacing: -2px;
      color: #252525;
      text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    }
    .title .red { color: #ed1b24; }
    .swoosh {
      position: absolute;
      z-index: 1;
      left: 15px;
      top: 75px;
      width: 509px;
      height: 20px;
      border-top: 3px solid #f4db00;
      border-radius: 50%;
      transform: rotate(-1deg);
    }
    .swoosh:after {
      content: "";
      position: absolute;
      width: 175px;
      height: 15px;
      left: 86px;
      top: -9px;
      border-top: 3px solid #f4db00;
      border-radius: 50%;
      transform: rotate(-4deg);
    }
    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 135px 152px 1fr;
      column-gap: 12px;
      margin-top: 40px;
      padding: 0 7px;
    }
    .timeline {
      grid-column: 1;
      position: relative;
      height: 570px;
    }
    .day {
      width: 120px;
      margin: 0 auto;
      padding: 4px 0 3px;
      border-radius: 20px;
      background: #ffe000;
      color: #222;
      text-align: center;
      font-family: "SimHei", sans-serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.1;
    }
    .arrow {
      position: relative;
      width: 4px;
      height: 67px;
      margin: 5px auto 5px;
      background: #d9c800;
    }
    .arrow:after {
      content: "";
      position: absolute;
      left: -5px;
      bottom: -1px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 10px solid #d9c800;
    }
    .travel {
      width: 110px;
      margin: 0 auto;
      padding: 4px 2px;
      background: #ffe000;
      color: #222;
      text-align: center;
      white-space: nowrap;
      font-family: "SimHei", sans-serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.15;
    }
    .stops { grid-column: 2 / 4; }
    .stop {
      display: grid;
      grid-template-columns: 152px 1fr;
      column-gap: 8px;
      min-height: 112px;
      margin-bottom: 8px;
    }
    .placeholder {
      width: 152px;
      height: 108px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      color: rgba(255,255,255,.9);
      font-size: 11px;
      text-align: center;
      line-height: 108px;
      text-shadow: 1px 1px 2px #222;
    }
    .temple {
      background:
        linear-gradient(90deg, transparent 0 16%, rgba(72,48,35,.85) 16% 29%, transparent 29% 70%, rgba(88,57,40,.8) 70% 84%, transparent 84%),
        linear-gradient(0deg, rgba(81,60,40,.18), rgba(67,111,67,.45)),
        #9c9876;
    }
    .farm {
      background:
        linear-gradient(0deg, rgba(40,81,37,.68) 0 28%, transparent 28%),
        repeating-linear-gradient(160deg, rgba(42,75,40,.7) 0 5px, rgba(117,157,91,.45) 5px 11px),
        #719763;
    }
    .tower {
      background:
        linear-gradient(90deg, transparent 43%, #e9e6d9 43% 52%, #c93631 52% 59%, #eee9d9 59% 65%, transparent 65%),
        linear-gradient(180deg, #b2d8e8 0 65%, #98a28c 65%);
    }
    .cave {
      background:
        radial-gradient(ellipse at 54% 69%, #47a5bc 0 19%, #d8dfca 20% 25%, transparent 26%),
        radial-gradient(ellipse at 48% 66%, transparent 0 45%, #2d251d 46% 77%, #17140f 78%),
        #3a3023;
    }
    .market {
      background:
        radial-gradient(circle at 18% 30%, #f2be37 0 5px, transparent 6px),
        radial-gradient(circle at 42% 40%, #d43825 0 5px, transparent 6px),
        radial-gradient(circle at 70% 31%, #e7b423 0 6px, transparent 7px),
        radial-gradient(circle at 88% 62%, #8aac3a 0 5px, transparent 6px),
        repeating-linear-gradient(18deg, #4f3420 0 9px, #b8853b 9px 17px);
    }
    .copy { padding-top: 5px; }
    .place {
      display: inline-block;
      margin: 0 0 3px;
      color: #ffe300;
      font-family: "SimHei", "Microsoft YaHei", sans-serif;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      -webkit-text-stroke: 1px #333;
      text-shadow: 2px 2px 0 #333;
    }
    .desc {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.17;
      color: #3d3d3d;
      text-shadow: 1px 1px 0 rgba(255,255,255,.8);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="sea"></div>
    <div class="pier"></div>
    <div class="title">端午万宁<span class="red">三日游</span>安排得明明白白</div>
    <div class="swoosh"></div>

    <section class="content">
      <aside class="timeline">
        <div class="day">第二天</div>
        <div class="arrow"></div>
        <div class="travel">打车25分钟</div>
        <div class="arrow"></div>
        <div class="travel">打车10分钟</div>
        <div class="arrow"></div>
        <div class="travel">打车1小时</div>
        <div class="arrow"></div>
        <div class="travel">打车1小时</div>
        <div class="arrow"></div>
      </aside>

      <section class="stops">
        <article class="stop">
          <div class="placeholder temple">[照片：巴厘村]</div>
          <div class="copy">
            <div class="place">巴厘村</div>
            <p class="desc">去巴厘村拍照，假装自己在泰国，租一套服装(80/人)而且还需要门票</p>
          </div>
        </article>

        <article class="stop">
          <div class="placeholder farm">[照片：桥海牧场]</div>
          <div class="copy">
            <div class="place">桥海牧场</div>
            <p class="desc">是类似于农村的田地，有一群牛羊鹅还有家动物!体验感一般，但拍照不错。</p>
          </div>
        </article>

        <article class="stop">
          <div class="placeholder tower">[照片：神州半岛灯塔]</div>
          <div class="copy">
            <div class="place">神州半岛灯塔</div>
            <p class="desc">拍照真的很出片，不要去太早，很有宫崎骏漫画的感觉</p>
          </div>
        </article>

        <article class="stop">
          <div class="placeholder cave">[照片：山钦湾]</div>
          <div class="copy">
            <div class="place">山钦湾</div>
            <p class="desc">傍晚的时候可以去燕子洞拍夕阳剪影，还有很多礁石，真的是分分钟氛围感大片</p>
          </div>
        </article>

        <article class="stop">
          <div class="placeholder market">[照片：兴隆夜市]</div>
          <div class="copy">
            <div class="place">兴隆夜市</div>
            <p class="desc">如果想吃南洋风味等一系列东南亚美食，可以看看这里便宜好吃实惠!</p>
          </div>
        </article>
      </section>
    </section>
  </main>
</body>
</html>
