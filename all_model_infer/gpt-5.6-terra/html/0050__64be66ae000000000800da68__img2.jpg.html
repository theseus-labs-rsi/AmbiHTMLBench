<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Document</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333333;
      font-family: Arial, "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    body {
      width: 540px;
      min-height: 956px;
      padding: 0 25px 22px;
      font-size: 21px;
      line-height: 1.43;
      overflow-x: hidden;
    }

    .content {
      width: 100%;
    }

    p {
      margin: 0 0 4px;
      letter-spacing: 0;
    }

    .first {
      padding-left: 47px;
      text-indent: -47px;
    }

    .photo {
      position: relative;
      width: 484px;
      height: 538px;
      margin: 10px 0 10px;
      overflow: hidden;
      background:
        linear-gradient(132deg, rgba(238, 237, 229, .98) 0 19%, rgba(248, 249, 247, .95) 19% 52%, rgba(224, 232, 230, .95) 52% 100%);
      border: 1px solid #eeeeee;
    }

    .photo::before {
      content: "";
      position: absolute;
      right: -34px;
      top: 44px;
      width: 168px;
      height: 430px;
      border-left: 18px solid rgba(125, 119, 102, .7);
      border-radius: 50%;
      transform: rotate(23deg);
    }

    .photo::after {
      content: "";
      position: absolute;
      left: -20px;
      top: 38px;
      width: 35px;
      height: 440px;
      background: linear-gradient(to right, rgba(50, 50, 50, .8), transparent);
      opacity: .65;
    }

    .price-list {
      position: absolute;
      z-index: 1;
      left: 14px;
      top: 25px;
      width: 382px;
      min-height: 499px;
      padding: 13px 18px 13px;
      background: rgba(255, 255, 255, .94);
      border-radius: 0 5px 5px 0;
      color: #222222;
      font-size: 21px;
      line-height: 1.49;
    }

    .price-list p {
      margin: 0;
    }

    .caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .bottom {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <main class="content">
    <p class="first">📧，点开显示 won 就证明你非常幸运有票了！在中选者购票时间内付款就行了，显示 miss 就证明落选了💔</p>
    <p>中选者名单公布的时候，一些黄牛就开始出代刷价格了❕如果打算代刷，最好越早预定越好！不然后期越来越贵</p>
    <p>像我最开始 vip 代刷 4.7k 我都以为很贵了，结果后期过户 v 都 2w 左右➡️</p>

    <figure class="photo" aria-label="[Photo: centered]">
      <figcaption class="caption">[Photo: centered]</figcaption>
      <div class="price-list">
        <p>svt 首尔会员代抢</p>
        <p>开票 interpark, 日期：6.30</p>
        <p>内场 vip 随机 4730</p>
        <p>内场非 vip 随机 3530</p>
        <p>看台 D,T 区 3530</p>
        <p>1 楼看台随机 3030</p>
        <p>2 楼看台随机 2530</p>
        <p>3,4 楼看台随机 1530</p>
        <p>以上价格不含票价，国际版自带（visa/master/jcb）信用卡卡号和有效期</p>
        <p>演出取消或者延期代刷费用不退，无补偿</p>
        <p>刷不到会全退，刷到以后不得以任何理由要求退款</p>
      </div>
    </figure>

    <p class="bottom">参考一下中选当天出的价格<br>
    （甚至这次因为抽了太多票，当天就截单了）<br>
    所以建议大家都尝试自己抽一下，因为这次真的好多都是抽中了</p>
  </main>
</body>
</html>
