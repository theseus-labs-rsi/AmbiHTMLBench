<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早發白帝城</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }
    body {
      background: #536595;
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "SimSun", serif;
    }
    .page {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #536595;
    }
    .blue-area {
      position: relative;
      width: 100%;
      height: 674px;
      background: #536595;
    }
    .source {
      position: absolute;
      top: 112px;
      left: 25px;
      color: rgba(246, 240, 216, 0.9);
      font-size: 15px;
      line-height: 1.42;
      letter-spacing: 1px;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .title {
      position: absolute;
      top: 113px;
      right: 42px;
      display: flex;
      flex-direction: row;
      gap: 25px;
      color: rgba(29, 42, 76, 0.9);
      font-size: 45px;
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: 3px;
    }
    .title .column {
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }
    .poem {
      position: absolute;
      top: 184px;
      left: 148px;
      display: flex;
      flex-direction: row-reverse;
      gap: 24px;
      color: #fff7da;
      font-size: 29px;
      font-weight: 400;
      line-height: 1.36;
      letter-spacing: 3px;
    }
    .poem .column {
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }
    .footer {
      height: 46px;
      width: 100%;
      background: #fff1d4;
      color: #4e4d48;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 1px;
      font-size: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="blue-area">
      <div class="source">唐<br>李白<br>早發白帝城</div>

      <div class="title" aria-label="朝辭白帝彩雲間，千里江陵一日還">
        <div class="column">朝辭白帝彩雲間</div>
        <div class="column">千里江陵一日還</div>
      </div>

      <div class="poem" aria-label="兩岸猿聲啼不住，輕舟已過萬重山。">
        <div class="column">兩岸猿聲啼不住，</div>
        <div class="column">輕舟已過萬重山。</div>
      </div>
    </section>
    <footer class="footer">兩岸猿聲，還在耳邊不停地啼叫不知不覺，輕舟已穿過萬重青山。</footer>
  </main>
</body>
</html>
