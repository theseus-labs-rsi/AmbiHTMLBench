<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如何挑选性格好的猫咪</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #080808;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page {
      width: 540px;
      min-height: 721px;
      margin: 0 auto;
      padding: 21px 9px 12px;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      white-space: nowrap;
      font-size: 47px;
      line-height: 1.12;
      letter-spacing: -3px;
      font-weight: 900;
    }
    h1 .red { color: #f13b38; }
    .top-content {
      display: flex;
      align-items: center;
      margin-top: 20px;
      padding-left: 23px;
    }
    .checks {
      width: 347px;
      font-size: 19px;
      line-height: 1.73;
      font-weight: 800;
    }
    .check-row {
      height: 31px;
      white-space: nowrap;
    }
    .check {
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-right: 9px;
      vertical-align: -4px;
      border: 3px solid #f19a39;
      color: #ee7741;
      font-size: 21px;
      line-height: 17px;
      text-align: center;
      font-weight: 900;
    }
    .highlight { background: #fff1d8; padding: 1px 5px 2px 2px; }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      overflow: hidden;
    }
    .cat-face {
      width: 145px;
      height: 122px;
      margin-left: 6px;
      border-radius: 50%;
      font-size: 84px;
      line-height: 1;
    }
    .section-title {
      display: inline-block;
      margin: 18px 0 15px 6px;
      padding: 0 7px 2px;
      background: #fff;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -2px;
      text-shadow:
        -2px -2px 0 #111, 2px -2px 0 #111,
        -2px 2px 0 #111, 2px 2px 0 #111;
      color: white;
      position: relative;
    }
    .section-title::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 17px;
      height: 24px;
      left: -3px;
      bottom: -4px;
      background: #f3a52c;
      transform: skew(-13deg);
    }
    .cats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 13px;
      row-gap: 26px;
      padding: 0 3px;
    }
    .cat-card {
      width: 100%;
      text-align: center;
    }
    .cat-image {
      width: 111px;
      height: 111px;
      margin: 0 auto -4px;
      border-radius: 50%;
      background: #fff0d4;
      font-size: 79px;
      line-height: 108px;
    }
    .cat-name {
      margin: 0 0 4px;
      font-size: 27px;
      line-height: 1.08;
      letter-spacing: -1px;
      font-weight: 900;
    }
    .description {
      margin: 0;
      text-align: left;
      font-size: 17px;
      line-height: 1.62;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .smallcat { font-size: 76px; }
  </style>
</head>
<body>
  <main class="page">
    <h1>如何挑选<span class="red">性格好</span>的猫咪</h1>

    <div class="top-content">
      <div class="checks">
        <div class="check-row"><span class="check">✓</span><span class="highlight">伸手摸它，看会不会主动过来蹭</span></div>
        <div class="check-row"><span class="check">✓</span><span class="highlight">抱一下猫咪，看会不会抗拒</span></div>
        <div class="check-row"><span class="check">✓</span><span class="highlight">喂食物，会不会主动积极吃</span></div>
        <div class="check-row"><span class="check">✓</span><span class="highlight">对猫咪喵喵叫，看会不会积极回应</span></div>
      </div>
      <div class="placeholder cat-face" aria-label="[Cartoon cat illustration: upper-right]">😸</div>
    </div>

    <div class="section-title">猫咪品种看性格</div>

    <section class="cats">
      <article class="cat-card">
        <div class="placeholder cat-image" aria-label="[Cat photo: 布偶]">🐱</div>
        <h2 class="cat-name">布偶</h2>
        <p class="description">性格温和，外表美丽<br>肠胃不太好</p>
      </article>

      <article class="cat-card">
        <div class="placeholder cat-image" aria-label="[Cat photo: 英短]">🐈</div>
        <h2 class="cat-name">英短</h2>
        <p class="description">体型圆胖、毛短而密<br>温柔平静、对人友善</p>
      </article>

      <article class="cat-card">
        <div class="placeholder cat-image smallcat" aria-label="[Cat photo: 美短]">🐱</div>
        <h2 class="cat-name">美短</h2>
        <p class="description">性格活泼好动<br>适应能力也比较强</p>
      </article>

      <article class="cat-card">
        <div class="placeholder cat-image" aria-label="[Cat photo: 狸花]">🐈</div>
        <h2 class="cat-name">狸花</h2>
        <p class="description">身体素质好，聪明<br>好养活，寿命长</p>
      </article>

      <article class="cat-card">
        <div class="placeholder cat-image" aria-label="[Cat photo: 暹罗]">🐱</div>
        <h2 class="cat-name">暹罗</h2>
        <p class="description">活泼好动，智商高<br>胆子比较大</p>
      </article>

      <article class="cat-card">
        <div class="placeholder cat-image" aria-label="[Cat photo: 曼基康]">🐱</div>
        <h2 class="cat-name">曼基康</h2>
        <p class="description">活泼友善，性格好<br>小短腿底盘容易脏</p>
      </article>
    </section>
  </main>
</body>
</html>
