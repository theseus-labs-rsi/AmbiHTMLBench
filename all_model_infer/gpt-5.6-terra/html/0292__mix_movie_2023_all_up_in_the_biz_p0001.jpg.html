<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Up in the Biz</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #161616;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poster {
      position: relative;
      width: min(100vw, 509px);
      height: min(150.88vw, 768px);
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;
      background: #d8d0be;
      color: #fff;
    }
    .photo {
      position: absolute;
      inset: 0 0 165px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 46% 23% at 49% 82%, #111 0 19%, #393732 20% 35%, transparent 36%),
        radial-gradient(ellipse 40% 25% at 43% 84%, #77736b 0 4%, #151515 5% 10%, transparent 11%),
        radial-gradient(ellipse 40% 25% at 63% 84%, #77736b 0 4%, #151515 5% 10%, transparent 11%),
        radial-gradient(ellipse 54% 20% at 50% 72%, #171717 0 45%, #4b4944 47% 57%, transparent 59%),
        radial-gradient(ellipse 45% 57% at 48% 55%, #5a5851 0 18%, #292926 19% 41%, #101010 42% 56%, transparent 57%),
        linear-gradient(180deg, #d9d2c0 0 11%, #d6d0c0 12% 15%, #77736a 16% 28%, #252523 29% 67%, #8b877e 68% 100%);
      filter: grayscale(1);
    }
    .photo::before {
      content: "";
      position: absolute;
      left: 5%;
      top: 9%;
      width: 90%;
      height: 59%;
      border-radius: 47% 47% 19% 19%;
      background:
        radial-gradient(ellipse 20% 10% at 34% 67%, #060606 0 38%, #6b6861 41% 53%, transparent 55%),
        radial-gradient(ellipse 20% 10% at 68% 67%, #060606 0 38%, #6b6861 41% 53%, transparent 55%),
        linear-gradient(170deg, transparent 0 35%, rgba(0,0,0,.55) 36% 55%, transparent 56%);
      opacity: .85;
    }
    .photo::after {
      content: "[Photograph: black-and-white close-up portrait wearing a cap]";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      color: transparent;
      font-size: 1px;
    }
    .festival {
      position: absolute;
      top: 20px;
      left: 36px;
      width: 74px;
      height: 47px;
      color: #fff;
      text-align: center;
      font-size: 7px;
      line-height: 1.05;
      opacity: .94;
    }
    .festival::before,
    .festival::after {
      content: "❯ ❯ ❯ ❯";
      position: absolute;
      top: 1px;
      color: #fff;
      font-size: 6px;
      letter-spacing: 1px;
      transform: rotate(-54deg);
    }
    .festival::before { left: -7px; }
    .festival::after { right: -9px; transform: rotate(54deg) scaleX(-1); }
    .festival strong {
      display: block;
      padding-top: 10px;
      font-size: 8px;
      letter-spacing: .5px;
    }
    .festival b {
      display: block;
      font-size: 16px;
      line-height: .9;
    }
    .original {
      position: absolute;
      top: 19px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
    }
    .credit {
      position: absolute;
      top: 52px;
      width: 100%;
      color: #080808;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }
    .title {
      position: absolute;
      top: 130px;
      width: 100%;
      color: #eabd1f;
      text-align: center;
      font-weight: 900;
      line-height: .8;
    }
    .title .up {
      display: block;
      margin-bottom: 3px;
      font-size: 40px;
      letter-spacing: -1px;
    }
    .title .biz {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 147px;
      letter-spacing: -13px;
      transform: scaleX(1.07);
    }
    .subtitle {
      position: absolute;
      top: 385px;
      width: 100%;
      color: #eabd1f;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
    }
    .footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 166px;
      padding-top: 10px;
      background: #030303;
      text-align: center;
    }
    .documentary {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 4px;
      line-height: 1.45;
    }
    .release {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
    }
    .networks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 13px;
      color: #fff;
    }
    .showtime {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 31px;
      letter-spacing: -2px;
      transform: scaleX(.9);
    }
    .divider {
      height: 49px;
      width: 3px;
      background: #fff;
    }
    .paramount {
      position: relative;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-style: italic;
      line-height: .8;
    }
    .paramount small {
      position: absolute;
      top: -9px;
      left: 17px;
      white-space: nowrap;
      font-family: Arial, sans-serif;
      font-size: 7px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .plan {
      margin-top: 17px;
      font-size: 12px;
      letter-spacing: .2px;
      color: #ddd;
    }
    @media (max-width: 390px) {
      .original { font-size: 12px; letter-spacing: 3px; }
      .title .up { font-size: 31px; }
      .title .biz { font-size: 116px; }
      .subtitle { font-size: 13px; }
      .documentary, .release { font-size: 13px; }
      .showtime { font-size: 25px; }
      .paramount { font-size: 25px; }
      .plan { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="All Up in the Biz documentary film poster">
    <div class="photo placeholder" aria-label="Photograph: black-and-white close-up portrait wearing a cap"></div>

    <div class="festival">
      <strong>TRIBECA<br>FESTIVAL</strong>
      <b>2023</b>
      OFFICIAL SELECTION
    </div>

    <div class="original">SHOWTIME ORIGINAL</div>
    <div class="credit">A SACHA JENKINS JAMMIE</div>

    <div class="title">
      <span class="up">ALL UP IN THE</span>
      <span class="biz">BIZ</span>
    </div>

    <div class="subtitle">THE LIFE AND RHYMES<br>OF BIZ MARKIE</div>

    <footer class="footer">
      <div class="documentary">DOCUMENTARY FILM</div>
      <div class="release">AUGUST 11</div>
      <div class="networks">
        <div class="showtime">SHOWTIME</div>
        <div class="divider"></div>
        <div class="paramount"><small>STREAMING ON</small>Paramount+</div>
      </div>
      <div class="plan">PARAMOUNT+ WITH SHOWTIME PLAN ONLY.</div>
    </footer>
  </main>
</body>
</html>
