<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>江戸時代のやきもの</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eee;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      color: #132f31;
    }
    .poster {
      position: relative;
      width: 440px;
      height: 629px;
      margin: 0 auto;
      overflow: hidden;
      background: #fafaf7;
      box-shadow: 0 0 5px rgba(0,0,0,.18);
    }
    .top {
      position: absolute;
      top: 17px;
      left: 20px;
      color: #333;
      font-size: 16px;
      letter-spacing: .08em;
      line-height: 1.9;
    }
    .season {
      font-size: 14px;
      letter-spacing: .35em;
    }
    .teal-strip {
      position: absolute;
      top: 0;
      right: 34px;
      width: 66px;
      height: 100%;
      background: #003a45;
    }
    .title {
      position: absolute;
      top: 77px;
      left: 19px;
      color: #082e31;
      font-size: 76px;
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.15em;
      white-space: nowrap;
    }
    .title .line2 {
      margin-top: 10px;
      font-size: 68px;
    }
    .title .line3 {
      margin-top: 8px;
      font-size: 72px;
    }
    .english {
      position: absolute;
      top: 176px;
      left: 182px;
      color: #17373a;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: .28em;
      white-space: nowrap;
    }
    .subtitle {
      position: absolute;
      left: 21px;
      top: 358px;
      font-size: 29px;
      line-height: 1.72;
      letter-spacing: .08em;
      color: #454545;
    }
    .date {
      position: absolute;
      top: 508px;
      left: 21px;
      font-size: 14px;
      color: #333;
      letter-spacing: .06em;
    }
    .venue {
      position: absolute;
      top: 540px;
      left: 20px;
      color: #222;
      line-height: 1.1;
    }
    .venue .small {
      font-size: 7px;
      letter-spacing: .2em;
    }
    .venue strong {
      display: block;
      margin-top: 3px;
      font-size: 21px;
      font-weight: 400;
      letter-spacing: .13em;
    }
    .venue .roman {
      display: block;
      margin-top: 1px;
      font-family: Georgia, serif;
      font-size: 8px;
      letter-spacing: .23em;
    }
    .address {
      margin-top: 4px;
      font-family: Arial, sans-serif;
      font-size: 5px;
      line-height: 1.35;
      letter-spacing: .02em;
    }
    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: rgba(255,255,255,.88);
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 5px;
      line-height: 1.3;
    }
    .ceramic-top {
      top: 67px;
      right: 35px;
      width: 126px;
      height: 93px;
      color: #222;
    }
    .ceramic-middle {
      top: 194px;
      right: 34px;
      width: 104px;
      height: 110px;
      color: #eee;
    }
    .ceramic-small {
      top: 331px;
      right: 35px;
      width: 75px;
      height: 83px;
    }
    .ceramic-bottom {
      top: 452px;
      right: 2px;
      width: 150px;
      height: 153px;
      color: #eee;
    }
    .dish {
      position: absolute;
      left: 183px;
      bottom: 16px;
      width: 116px;
      height: 61px;
      border-radius: 50%;
      background: #0a3937;
      box-shadow: inset 0 0 0 4px #1b5551;
    }
    .dish::before {
      content: "";
      position: absolute;
      left: 38px;
      top: 10px;
      width: 40px;
      height: 34px;
      border-radius: 48% 52% 44% 55%;
      background: #c94a31;
      box-shadow:
        -13px 9px 0 -5px #d05032,
        15px 7px 0 -5px #d05032,
        -7px 17px 0 -6px #d76b38,
        8px 18px 0 -6px #d76b38;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="teal-strip"></div>

    <div class="top">
      ひと目でわかる京焼300年の歴史<br>
      <span class="season">平成29年度　春季展</span>
    </div>

    <div class="title">
      江戸
      <div class="line2">時代の</div>
      <div class="line3">やきもの</div>
    </div>
    <div class="english">Ceramics of the Edo Period</div>

    <div class="subtitle">
      仁清・乾山窯と<br>
      後期京焼の<br>
      食器を中心に
    </div>

    <div class="date">平成29年4月8日(土)〜7月30日(日)</div>

    <div class="venue">
      <span class="small">公益財団法人</span>
      <strong>湯木美術館</strong>
      <span class="roman">YUKI MUSEUM OF ART</span>
      <div class="address">〒541-0046 大阪市中央区平野町3-3-9<br>TEL 06-6203-0188　FAX 06-6203-1088<br>http://www.yuki-museum.or.jp</div>
    </div>

    <div class="placeholder ceramic-top">[Ceramic dish]</div>
    <div class="placeholder ceramic-middle">[Ceramic bowl]</div>
    <div class="placeholder ceramic-small">[Ceramic vessel]</div>
    <div class="placeholder ceramic-bottom">[Ceramic plate]</div>
    <div class="dish" aria-label="[Ceramic dish]"></div>
  </main>
</body>
</html>
