<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钩针工具选择指南</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$','$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #111;
    }
    .page {
      width: 540px;
      min-height: 540px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }
    .title {
      height: 85px;
      background: #718c85;
      color: white;
      text-align: center;
      padding-top: 14px;
      border-bottom: 3px solid #fff;
    }
    .title h1 {
      margin: 0;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .title p {
      margin: 0;
      font-size: 15px;
      line-height: 22px;
      letter-spacing: 1px;
      font-weight: 400;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-right: 4px solid #f5eeee;
      border-bottom: 4px solid #f5eeee;
    }
    th:last-child, td:last-child { border-right: 0; }
    th {
      height: 57px;
      background: #718c85;
      color: #fff;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
    }
    .col-tool { width: 88px; }
    .col-use { width: 218px; }
    .col-advice { width: 138px; }
    .col-photo { width: 96px; }

    td {
      text-align: center;
      vertical-align: middle;
      font-size: 16px;
      line-height: 21px;
      padding: 8px 8px;
      background: #fffdfd;
    }
    .row1 { height: 137px; }
    .row2 { height: 113px; }
    .row3 { height: 81px; }
    .row4 { height: 90px; }

    .tool-name {
      font-size: 16px;
      line-height: 21px;
      font-weight: 700;
    }
    .required {
      color: #d65a43;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .use {
      font-size: 15px;
      line-height: 21px;
      padding-left: 10px;
      padding-right: 10px;
    }
    .advice {
      font-size: 16px;
      line-height: 22px;
      padding: 8px 6px;
    }
    .photo-cell {
      padding: 4px;
      background: #fff;
    }
    .placeholder {
      width: 82px;
      margin: 0 auto;
      color: transparent;
      position: relative;
      overflow: hidden;
    }
    .crochet-hooks {
      height: 56px;
      background:
        linear-gradient(156deg, transparent 0 38%, #5b39b9 39% 42%, transparent 43%),
        linear-gradient(153deg, transparent 0 45%, #df2e50 46% 49%, transparent 50%),
        linear-gradient(150deg, transparent 0 52%, #3ea9d9 53% 56%, transparent 57%),
        linear-gradient(147deg, transparent 0 59%, #f4bf25 60% 63%, transparent 64%),
        linear-gradient(144deg, transparent 0 66%, #ed6f31 67% 70%, transparent 71%),
        #fafafa;
    }
    .yarn {
      height: 63px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 27% 43%, #f2d84c 0 9px, transparent 10px),
        radial-gradient(circle at 45% 33%, #f290b9 0 10px, transparent 11px),
        radial-gradient(circle at 64% 42%, #67b8c5 0 10px, transparent 11px),
        radial-gradient(circle at 55% 56%, #89bc55 0 11px, transparent 12px),
        radial-gradient(circle at 32% 60%, #e68f52 0 10px, transparent 11px),
        radial-gradient(ellipse at 50% 72%, #ab7a42 0 42%, transparent 43%);
    }
    .scissors {
      height: 64px;
      background:
        linear-gradient(125deg, transparent 0 45%, #3a3a39 46% 49%, transparent 50%),
        linear-gradient(54deg, transparent 0 45%, #3a3a39 46% 49%, transparent 50%);
    }
    .scissors::before,
    .scissors::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 22px;
      border: 3px solid #3a3a39;
      border-radius: 50%;
      bottom: 4px;
    }
    .scissors::before { left: 25px; transform: rotate(35deg); }
    .scissors::after { right: 25px; transform: rotate(-35deg); }
    .sewing {
      height: 68px;
      background:
        linear-gradient(126deg, transparent 0 30%, #e72d34 31% 34%, transparent 35%),
        linear-gradient(122deg, transparent 0 41%, #f2b928 42% 45%, transparent 46%),
        linear-gradient(118deg, transparent 0 52%, #53b84d 53% 56%, transparent 57%),
        linear-gradient(114deg, transparent 0 63%, #26a9dc 64% 67%, transparent 68%),
        linear-gradient(110deg, transparent 0 74%, #df4e98 75% 78%, transparent 79%);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="title">
      <h1>钩针工具选择指南</h1>
      <p>——only手作集——</p>
    </header>

    <table aria-label="钩针工具选择指南">
      <colgroup>
        <col class="col-tool">
        <col class="col-use">
        <col class="col-advice">
        <col class="col-photo">
      </colgroup>
      <thead>
        <tr>
          <th>工具</th>
          <th>用途</th>
          <th>初学者建议</th>
          <th>实物图</th>
        </tr>
      </thead>
      <tbody>
        <tr class="row1">
          <td>
            <div class="tool-name">钩针</div>
            <div class="required">（必备）</div>
          </td>
          <td class="use">钩针是钩针编织的必备工具，<br>有多种尺寸与规格，具体如何<br>选择可参考《钩针毛线对照<br>表》、《如何选择钩针和毛<br>线》</td>
          <td class="advice">3mm左右的钩针<br>最实用</td>
          <td class="photo-cell"><div class="placeholder crochet-hooks">[钩针实物图]</div></td>
        </tr>
        <tr class="row2">
          <td>
            <div class="tool-name">毛线</div>
            <div class="required">（必备）</div>
          </td>
          <td class="use">毛线种类很多，新手建议选择<br>股数较少的，可减少失误次<br>数。具体如何选择参考《如何<br>选择钩针和毛线》</td>
          <td class="advice">中粗的宝宝棉/牛<br>奶棉</td>
          <td class="photo-cell"><div class="placeholder yarn">[毛线实物图]</div></td>
        </tr>
        <tr class="row3">
          <td>
            <div class="tool-name">剪刀</div>
            <div class="required">（必备）</div>
          </td>
          <td class="use">剪断编织过程中的编织线</td>
          <td class="advice">必备</td>
          <td class="photo-cell"><div class="placeholder scissors">[剪刀实物图]</div></td>
        </tr>
        <tr class="row4">
          <td><div class="tool-name">缝合针</div></td>
          <td class="use">缝合、修补和连接编织面料</td>
          <td class="advice">非必须</td>
          <td class="photo-cell"><div class="placeholder sewing">[缝合针实物图]</div></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
