<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Sustainability Summit</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <style>
    :root {
      --green: #007c35;
      --light-green: #4dca46;
      --cream: #f3eedc;
      --dark-text: #1d2a1e;
      --white: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ddd;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--dark-text);
    }

    .page {
      position: relative;
      width: 2048px;
      height: 1152px;
      overflow: hidden;
      background: linear-gradient(90deg, var(--cream) 0 51%, var(--green) 51% 100%);
    }

    .left-cream {
      position: absolute;
      left: 0;
      top: 0;
      width: 1044px;
      height: 808px;
      background: var(--cream);
      z-index: 1;
    }

    .bottom-green-band {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 2048px;
      height: 344px;
      background: var(--green);
      z-index: 0;
    }

    .cream-curve-top {
      position: absolute;
      left: 0;
      top: 0;
      width: 1044px;
      height: 1016px;
      background: var(--cream);
      border-bottom-right-radius: 540px;
      z-index: 2;
    }

    .cream-circle-bottom {
      position: absolute;
      left: -1px;
      bottom: -222px;
      width: 1045px;
      height: 560px;
      background: var(--cream);
      border-radius: 0 0 540px 540px;
      z-index: 2;
    }

    .right-field {
      position: absolute;
      left: 1044px;
      top: 0;
      width: 1004px;
      height: 100%;
      background: var(--green);
      z-index: 1;
    }

    .logo {
      position: absolute;
      top: 173px;
      right: 181px;
      width: 205px;
      height: 92px;
      color: var(--white);
      z-index: 5;
      text-align: left;
      line-height: 1;
      font-weight: 700;
    }

    .logo .your {
      display: block;
      font-size: 47px;
      font-weight: 300;
      letter-spacing: -1px;
    }

    .logo-mark {
      display: inline-block;
      position: relative;
      width: 52px;
      height: 34px;
      margin-left: 7px;
      vertical-align: 1px;
    }

    .logo-mark span {
      position: absolute;
      width: 18px;
      height: 18px;
      background: var(--white);
      border-radius: 50% 50% 50% 4px;
    }

    .logo-mark span:nth-child(1) { left: 4px; top: 0; }
    .logo-mark span:nth-child(2) { right: 4px; top: 0; transform: rotate(90deg); }
    .logo-mark span:nth-child(3) { left: 4px; bottom: 0; transform: rotate(-90deg); }
    .logo-mark span:nth-child(4) { right: 4px; bottom: 0; transform: rotate(180deg); }

    .registered {
      position: absolute;
      top: 1px;
      right: -16px;
      font-size: 20px;
      font-weight: 700;
    }

    .logo .word {
      display: block;
      margin-top: -3px;
      font-size: 51px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 24px;
      letter-spacing: 0.5px;
      text-align: center;
      overflow: hidden;
    }

    .tree-photo {
      position: absolute;
      left: 1044px;
      top: 398px;
      width: 1004px;
      height: 610px;
      z-index: 4;
      color: transparent;
      background:
        radial-gradient(ellipse at 52% 17%, rgba(58, 101, 22, 0.96) 0 34%, transparent 35%),
        radial-gradient(ellipse at 37% 24%, rgba(50, 91, 18, 0.95) 0 30%, transparent 31%),
        radial-gradient(ellipse at 70% 24%, rgba(48, 88, 18, 0.94) 0 33%, transparent 34%),
        radial-gradient(ellipse at 18% 30%, rgba(40, 80, 18, 0.95) 0 21%, transparent 22%),
        radial-gradient(ellipse at 88% 34%, rgba(35, 74, 18, 0.94) 0 22%, transparent 23%),
        linear-gradient(80deg, transparent 47%, #5a351d 48% 51%, transparent 52%),
        linear-gradient(105deg, transparent 51%, #6a4226 52% 55%, transparent 56%),
        linear-gradient(90deg, transparent 54%, #6d4224 55% 60%, transparent 61%);
    }

    .tree-photo::before {
      content: "";
      position: absolute;
      left: 485px;
      top: 336px;
      width: 82px;
      height: 278px;
      background: linear-gradient(90deg, #4b2c19, #7d4a2a 48%, #3f2516);
      border-radius: 46% 50% 14% 20%;
      transform: rotate(5deg);
      box-shadow:
        -78px -233px 0 -55px #5b361f,
        67px -228px 0 -53px #5b361f,
        -160px -172px 0 -59px #5b361f,
        196px -171px 0 -61px #5b361f;
    }

    .tree-photo::after {
      content: "[Photo: large tree centered]";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      color: rgba(255, 255, 255, 0.01);
    }

    .light-green-block {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 1002px;
      height: 392px;
      background: var(--light-green);
      z-index: 2;
    }

    .date-circle {
      position: absolute;
      right: -1px;
      bottom: -165px;
      width: 1004px;
      height: 651px;
      border-radius: 50% 50% 0 0;
      background: var(--green);
      z-index: 3;
    }

    .event-info {
      position: absolute;
      left: 1318px;
      top: 858px;
      width: 500px;
      color: var(--white);
      z-index: 4;
      font-size: 38px;
      font-weight: 300;
      line-height: 1.45;
      letter-spacing: 1px;
    }

    .event-info .label {
      margin: 0 0 22px 0;
      color: var(--light-green);
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 6px;
    }

    .event-info .date-text {
      margin-bottom: 86px;
    }

    .event-info .location-text {
      width: 500px;
    }

    .title-wrap {
      position: absolute;
      left: 79px;
      top: 93px;
      width: 740px;
      height: 620px;
      z-index: 4;
    }

    .title-rotated {
      position: absolute;
      left: 13px;
      top: 482px;
      transform-origin: left top;
      transform: rotate(-90deg);
      color: var(--green);
      font-size: 102px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -3px;
      white-space: nowrap;
    }

    .title-rotated .line {
      display: inline-block;
      vertical-align: bottom;
      margin-right: 48px;
    }

    .title-rotated .line:nth-child(2) {
      font-size: 101px;
    }

    .title-rotated .line:nth-child(3) {
      font-size: 101px;
      margin-right: 0;
    }

    .divider {
      position: absolute;
      left: 281px;
      top: 715px;
      width: 483px;
      height: 2px;
      background: var(--green);
      z-index: 4;
    }

    .registration {
      position: absolute;
      left: 281px;
      top: 826px;
      width: 480px;
      z-index: 4;
    }

    .registration .heading,
    .visit .heading {
      color: var(--light-green);
      font-size: 45px;
      font-weight: 700;
      letter-spacing: 4px;
      margin: 0 0 26px 0;
      line-height: 1;
    }

    .registration .small {
      margin: 0 0 20px 0;
      font-size: 38px;
      line-height: 1.15;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .registration .price {
      margin: 0 0 44px 0;
      color: var(--green);
      font-size: 66px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .registration .price:last-child {
      margin-bottom: 0;
    }

    .visit {
      position: absolute;
      left: 281px;
      top: 1031px;
      width: 560px;
      z-index: 5;
      transform: translateY(0);
    }

    .visit .heading {
      margin-bottom: 27px;
    }

    .visit .copy {
      margin: 0;
      font-size: 38px;
      line-height: 1.28;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    @media (max-width: 2048px) {
      .page {
        transform-origin: top left;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Global Sustainability Summit flyer">
    <section class="left-cream"></section>
    <section class="right-field"></section>
    <section class="bottom-green-band"></section>
    <section class="cream-curve-top"></section>
    <section class="cream-circle-bottom"></section>

    <div class="title-wrap">
      <div class="title-rotated">
        <span class="line">Global</span>
        <span class="line">Sustainability</span>
        <span class="line">Summit</span>
      </div>
    </div>

    <div class="divider"></div>

    <section class="registration">
      <h2 class="heading">REGISTRATION</h2>
      <p class="small">General Admission</p>
      <p class="price">$350</p>
      <p class="small">Students &amp; Nonprofits</p>
      <p class="price">$200</p>
    </section>

    <section class="visit">
      <h2 class="heading">VISIT</h2>
      <p class="copy">www.yourwebsite.com for more<br>details and to register today!</p>
    </section>

    <div class="logo" aria-label="Your LOGO">
      <span class="your">Your<span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span class="registered">®</span></span>
      <span class="word">LOGO</span>
    </div>

    <figure class="placeholder tree-photo" aria-label="Photo placeholder">
      [Photo: large tree centered]
    </figure>

    <section class="light-green-block"></section>
    <section class="date-circle"></section>

    <section class="event-info">
      <div class="label">DATE</div>
      <div class="date-text">27 January 2026<br>10:00 PM</div>
      <div class="label">LOCATION</div>
      <div class="location-text">Grand Hall, Convention<br>Center, Chicago, IL</div>
    </section>
  </main>
</body>
</html>
