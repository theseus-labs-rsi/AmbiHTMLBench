<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「新中式」女装品牌盘点</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
    }

    body {
      width: 540px;
      min-height: 720px;
      padding: 14px 12px 20px;
      overflow-x: hidden;
    }

    .top-label {
      width: 207px;
      height: 20px;
      margin-left: 308px;
      padding: 2px 8px 2px 10px;
      background: #050505;
      color: #fff;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .top-label::first-letter {
      font-size: 11px;
    }

    .title {
      margin: 13px 0 20px 10px;
      font-size: 17px;
      line-height: 22px;
      font-weight: 700;
      white-space: nowrap;
    }

    .title .arrow {
      display: inline-block;
      margin-right: 13px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: 251px 251px;
      grid-auto-rows: 296px;
      column-gap: 12px;
      row-gap: 18px;
    }

    .panel {
      width: 251px;
      height: 296px;
      border: 1px dashed #777;
      padding: 13px 12px 9px;
      text-align: center;
      position: relative;
    }

    .panel-title {
      height: 22px;
      color: #555;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .brand-image {
      width: 226px;
      height: 170px;
      margin: 0 auto 13px;
      background:
        linear-gradient(90deg, #f3f0ed 0 33.33%, #e6e1dd 33.33% 66.66%, #f1eeeb 66.66%),
        #eee;
      position: relative;
      overflow: hidden;
    }

    .brand-image::before {
      content: "[照片]";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a8a8a;
      font-size: 12px;
      letter-spacing: 1px;
      opacity: .8;
    }

    .brand-image::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: linear-gradient(transparent, rgba(255,255,255,.24));
    }

    .brand-name {
      margin: 0 0 5px;
      color: #a40000;
      font-size: 13px;
      line-height: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .description {
      margin: 0;
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }

    .panel:nth-child(2) .panel-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 1px;
      color: #333;
    }

    .panel:nth-child(2) .brand-image,
    .panel:nth-child(4) .brand-image {
      background:
        linear-gradient(90deg, #eee9e4 0 33.33%, #d8d3ce 33.33% 66.66%, #e9e4de 66.66%),
        #e5e0db;
    }

    .panel:nth-child(3) .panel-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #777;
    }

    .panel:nth-child(3) .brand-image {
      background:
        linear-gradient(90deg, #eee9df 0 33.33%, #dedfd4 33.33% 66.66%, #eee5df 66.66%),
        #e8e2da;
    }

    .panel:nth-child(4) .panel-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: #333;
      line-height: 18px;
    }

    .panel:nth-child(4) .brand-image {
      margin-top: 0;
      margin-bottom: 13px;
    }
  </style>
</head>
<body>
  <div class="top-label">◆ 40个「新中式」女装品牌盘点</div>

  <div class="title">
    <span class="arrow">➤</span>「新中式」：东方优雅熟女——中高端
  </div>

  <main class="grid">
    <section class="panel">
      <div class="panel-title">轮廓</div>
      <div class="brand-image placeholder" aria-label="服装照片"></div>
      <h2 class="brand-name">钵腰（南京）</h2>
      <p class="description">
        打造中国最具民族品牌<br>
        传统民族文化注入现代设计中<br>
        创造立于世界之中的中华服饰
      </p>
    </section>

    <section class="panel">
      <div class="panel-title">TING TÁNG</div>
      <div class="brand-image placeholder" aria-label="服装照片"></div>
      <h2 class="brand-name">厅町TINGTANG（台州）</h2>
      <p class="description">
        以家居服拓展到日常服饰<br>
        融合中式元素与现代审美<br>
        演绎东方美学松弛感
      </p>
    </section>

    <section class="panel">
      <div class="panel-title">SHI BAI 拾白</div>
      <div class="brand-image placeholder" aria-label="服装照片"></div>
      <h2 class="brand-name">拾白SHIBAI（广州）</h2>
      <p class="description">
        原创新中式女装品牌<br>
        传承东方古典美的韵<br>
        把女性的温婉柔美刻画的淋漓尽致
      </p>
    </section>

    <section class="panel">
      <div class="panel-title">HECO</div>
      <div class="brand-image placeholder" aria-label="服装照片"></div>
      <h2 class="brand-name">HECO（佛山）</h2>
      <p class="description">
        中式艺术家品牌<br>
        融合中国古典文化与当代时装<br>
        呈现出时髦、日常的新中式服装
      </p>
    </section>
  </main>
</body>
</html>
