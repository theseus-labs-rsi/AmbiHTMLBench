<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takumi Sen9 vs Streakfly</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ececec;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    .page {
      width: 543px;
      height: 721px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(to right, #fff 0, #fff 50%, #000 50%, #000 100%);
    }
    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 270px;
      width: 3px;
      background: #050505;
      z-index: 2;
    }
    .half {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      text-align: center;
    }
    .left { left: 0; color: #050505; }
    .right { right: 0; color: #f9f9f9; }

    .brand {
      position: absolute;
      top: 4px;
      height: 61px;
      width: 100%;
    }
    .adidas-mark {
      position: absolute;
      left: 85px;
      top: 0;
      width: 93px;
      height: 57px;
    }
    .adidas-mark i {
      position: absolute;
      display: block;
      background: #020202;
      transform: skewX(29deg);
      transform-origin: bottom;
    }
    .adidas-mark i:nth-child(1) { width: 19px; height: 19px; left: 7px; top: 37px; }
    .adidas-mark i:nth-child(2) { width: 23px; height: 37px; left: 30px; top: 20px; }
    .adidas-mark i:nth-child(3) { width: 26px; height: 54px; left: 60px; top: 3px; }

    .running {
      position: absolute;
      top: 25px;
      right: -3px;
      width: 74px;
      text-align: left;
      font-weight: 900;
      line-height: 1;
    }
    .running .cn {
      display: block;
      white-space: nowrap;
      font-size: 17px;
      letter-spacing: -1px;
    }
    .running .en {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      letter-spacing: .2px;
    }

    .nike-logo {
      position: absolute;
      top: 12px;
      left: 88px;
      width: 105px;
      height: 45px;
    }
    .nike-logo svg { width: 100%; height: 100%; display: block; }

    .vs {
      position: absolute;
      z-index: 4;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      color: #080808;
      font-family: Impact, Arial Black, sans-serif;
      font-size: 61px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -6px;
      -webkit-text-stroke: 3px #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
    }

    .shoe {
      position: absolute;
      top: 106px;
      height: 112px;
    }
    .left .shoe { left: 14px; width: 243px; }
    .right .shoe { left: 12px; width: 247px; }
    .placeholder {
      overflow: hidden;
    }
    .placeholder .caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    .shoe svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .distance {
      position: absolute;
      top: 241px;
      width: 100%;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0;
    }
    .model {
      position: absolute;
      top: 286px;
      width: 100%;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .weight {
      position: absolute;
      top: 333px;
      width: 100%;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 1px;
    }
    .size {
      position: absolute;
      top: 381px;
      width: 100%;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .feature {
      position: absolute;
      width: 100%;
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .f1 { top: 433px; }
    .f2 { top: 480px; }
    .f3 { top: 529px; }
    .f4 { top: 578px; }
    .price {
      position: absolute;
      top: 623px;
      width: 100%;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 1px;
    }
    .right .feature,
    .right .model,
    .right .weight,
    .right .size,
    .right .distance,
    .right .price {
      text-align: left;
      padding-left: 8px;
    }
    .right .model { padding-left: 9px; }
    .right .size { padding-left: 7px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="divider"></div>

    <section class="half left">
      <div class="brand">
        <div class="adidas-mark" aria-label="Adidas logo"><i></i><i></i><i></i></div>
        <div class="running">
          <span class="cn">奔跑的小小宇</span>
          <span class="en">RUNNING XIAOYU</span>
        </div>
      </div>

      <div class="shoe placeholder">
        <span class="caption">[Image: Adidas running shoe]</span>
        <svg viewBox="0 0 243 112" aria-hidden="true">
          <defs>
            <linearGradient id="leftUpper" x1="0" x2="1">
              <stop offset="0" stop-color="#33404a"/>
              <stop offset=".48" stop-color="#aeb5b7"/>
              <stop offset="1" stop-color="#666d70"/>
            </linearGradient>
            <linearGradient id="leftSole" x1="0" x2="1">
              <stop offset="0" stop-color="#dce0d5"/>
              <stop offset="1" stop-color="#f8f5e8"/>
            </linearGradient>
            <pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="1.1" fill="#5d6568" opacity=".55"/>
            </pattern>
          </defs>
          <path d="M10 68 C18 54,18 30,26 17 C51 23,71 35,95 35 C121 34,154 49,184 56 C211 62,224 70,231 80 L229 91 C178 101,73 103,12 89 Z" fill="url(#leftUpper)"/>
          <path d="M31 19 C53 26,75 41,104 43 L83 55 C63 46,44 38,23 36 Z" fill="#a9afb0"/>
          <path d="M61 35 C110 34,161 54,205 66 L187 79 L70 56 Z" fill="url(#mesh)" opacity=".85"/>
          <path d="M22 77 C75 88,150 87,229 80 C235 84,233 92,226 95 C168 108,67 108,10 94 C8 90,12 83,22 77 Z" fill="url(#leftSole)"/>
          <path d="M32 87 C82 94,153 94,210 87" fill="none" stroke="#b7bbb3" stroke-width="1.5"/>
          <path d="M88 40 L100 43 L77 62 L64 57 Z" fill="#c9ee59"/>
          <path d="M113 44 L126 48 L98 67 L85 63 Z" fill="#c9ee59"/>
          <path d="M140 50 L153 54 L121 72 L108 68 Z" fill="#c9ee59"/>
          <path d="M21 37 L47 47 L29 60 L16 56 Z" fill="#1f2930"/>
          <path d="M42 30 L61 37" stroke="#e6e8e4" stroke-width="2"/>
          <path d="M49 34 L70 42" stroke="#e6e8e4" stroke-width="2"/>
          <path d="M57 38 L79 46" stroke="#e6e8e4" stroke-width="2"/>
        </svg>
      </div>

      <div class="distance">5-10KM</div>
      <div class="model">Takumi&nbsp; Sen9</div>
      <div class="weight">181g</div>
      <div class="size">(27 /33)&nbsp;&nbsp;6mm</div>
      <div class="feature f1">LIGHTWEIGHT&nbsp; MESH</div>
      <div class="feature f2">Lightstrike&nbsp; Pro</div>
      <div class="feature f3">ENERGYROD玻纤柱</div>
      <div class="feature f4">Continental™</div>
      <div class="price">1499</div>
    </section>

    <section class="half right">
      <div class="brand">
        <div class="nike-logo" aria-label="Nike logo">
          <svg viewBox="0 0 105 45" aria-hidden="true">
            <path d="M4 29 C10 42,25 42,43 33 C61 24,82 11,101 5 C77 16,52 28,31 34 C16 38,6 37,4 29 Z" fill="#fff"/>
          </svg>
        </div>
      </div>

      <div class="shoe placeholder">
        <span class="caption">[Image: Nike running shoe]</span>
        <svg viewBox="0 0 247 112" aria-hidden="true">
          <defs>
            <linearGradient id="rightUpper" x1="0" x2="1">
              <stop offset="0" stop-color="#e8e9e4"/>
              <stop offset=".52" stop-color="#fff"/>
              <stop offset="1" stop-color="#dadcd9"/>
            </linearGradient>
            <pattern id="rightMesh" width="6" height="6" patternUnits="userSpaceOnUse">
              <circle cx="2.2" cy="2" r=".9" fill="#aeb3af"/>
            </pattern>
          </defs>
          <path d="M12 71 C25 61,39 49,56 42 C75 34,91 20,106 19 C124 18,140 37,158 44 C181 53,211 58,231 68 L238 82 C197 91,58 101,10 88 Z" fill="url(#rightUpper)"/>
          <path d="M41 61 C77 48,104 31,120 31 C143 33,157 51,193 59 L195 73 L56 78 Z" fill="url(#rightMesh)" opacity=".85"/>
          <path d="M15 78 C68 89,171 83,235 75 L239 85 C193 100,57 105,11 91 Z" fill="#f7f7ee"/>
          <path d="M21 88 C74 96,172 91,229 83" fill="none" stroke="#c7c8c3" stroke-width="1.5"/>
          <path d="M40 56 C56 52,74 47,93 44" fill="none" stroke="#131313" stroke-width="2"/>
          <path d="M52 65 C69 61,86 57,104 52" fill="none" stroke="#202020" stroke-width="1.5"/>
          <path d="M72 43 C80 39,87 37,94 36" fill="none" stroke="#202020" stroke-width="1.3"/>
          <path d="M143 58 C162 51,181 48,212 45 C184 51,163 60,149 68 C143 70,139 67,143 58 Z" fill="none" stroke="#111" stroke-width="2"/>
          <path d="M194 73 L218 69 L225 78 L200 82 Z" fill="#e48b27"/>
          <text x="203" y="78" font-family="Arial" font-size="5" fill="#222">ZOOMX</text>
          <text x="199" y="91" font-family="Arial" font-size="6" fill="#333">ZOOMX</text>
        </svg>
      </div>

      <div class="distance">5-10KM</div>
      <div class="model">Streakfly</div>
      <div class="weight">165g</div>
      <div class="size">8mm&nbsp;&nbsp;(26 /32)</div>
      <div class="feature f1">织物鞋面</div>
      <div class="feature f2">ZoomX</div>
      <div class="feature f3">半掌碳板</div>
      <div class="feature f4">贴片橡胶</div>
      <div class="price">999</div>
    </section>

    <div class="vs">VS</div>
  </main>
</body>
</html>
