<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这是好的开始</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #d7d1c4;
      display: flex;
      justify-content: center;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
      color: #171512;
    }
    .page {
      width: 540px;
      min-height: 720px;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 39px,
          rgba(37, 38, 35, 0.65) 40px,
          rgba(37, 38, 35, 0.65) 41px,
          transparent 42px
        ),
        #d9d4c8;
      position: relative;
      padding-top: 38px;
      overflow: hidden;
    }
    .top {
      height: 34px;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      border-bottom: 2px solid #252525;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
    }
    .days {
      position: absolute;
      top: 1px;
      left: 0;
      display: flex;
    }
    .day {
      width: 14px;
      height: 19px;
      border: 1px solid #353535;
      border-right: 0;
      text-align: center;
      line-height: 17px;
      font-size: 8px;
    }
    .day:last-child { border-right: 1px solid #353535; }
    .date {
      position: absolute;
      right: 5px;
      top: 2px;
      letter-spacing: 1px;
    }
    .date .slashes {
      display: inline-block;
      margin-left: 34px;
      word-spacing: 18px;
    }
    .writing {
      margin-left: 52px;
      padding-top: 0;
      font-size: 30px;
      line-height: 42px;
      font-weight: 500;
      letter-spacing: 1px;
      transform: rotate(-1deg);
    }
    .title {
      margin: 0 0 41px 13px;
      font-size: 31px;
      line-height: 40px;
    }
    p {
      margin: 0;
      height: 42px;
      white-space: nowrap;
    }
    .indent { padding-left: 2px; }
    .slight-indent { padding-left: 5px; }
    @media (max-width: 540px) {
      .page { width: 100vw; min-height: 100vh; }
      .writing { font-size: 5.55vw; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="days">
        <span class="day">Tu</span>
        <span class="day">We</span>
        <span class="day">Th</span>
        <span class="day">Fr</span>
        <span class="day">Sa</span>
        <span class="day">Su</span>
      </div>
      <div class="date">Date. <span class="slashes">/ / /</span></div>
    </header>

    <section class="writing">
      <div class="title">这是好的开始</div>
      <p>从你看到这篇文章开始.</p>
      <p class="indent">你会越来越有钱</p>
      <p>越来越好看.</p>
      <p>生活和心态也会越来越好.</p>
      <p>请相信大数据.</p>
      <p>是你自己把一切美好的东西</p>
      <p>都吸引了过来</p>
      <p>你已经调到了接收钱的频率</p>
      <p>接收美的频率.</p>
      <p>你的能量频率对了才接收到这</p>
      <p>条信息.</p>
      <p class="slight-indent">留下-句"全收到".</p>
      <p>愿所有的愿望全能实现!</p>
    </section>
  </main>
</body>
</html>
