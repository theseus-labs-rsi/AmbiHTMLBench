<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heath Ceramics Advertisement</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f8f5e9;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 1000px;
      min-height: 1320px;
      margin: 0 auto;
      padding: 52px 79px 25px;
      background:
        linear-gradient(90deg, rgba(200,190,150,.05), transparent 8%, transparent 92%, rgba(200,190,150,.05)),
        #fbf9ee;
      position: relative;
    }
    .ad {
      width: 842px;
      margin: 0 auto;
      border: 4px solid #060606;
      background: #fffef9;
    }
    .photo {
      width: 100%;
      height: 850px;
      border-bottom: 4px solid #060606;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(155deg, rgba(239,223,158,.82) 0 23%, transparent 23.3%),
        linear-gradient(15deg, transparent 0 47%, rgba(223,215,184,.72) 47.2% 48.3%, transparent 48.6%),
        linear-gradient(147deg, transparent 0 60%, rgba(210,197,161,.55) 60.2% 61.7%, transparent 62%),
        linear-gradient(25deg, transparent 0 45%, rgba(55,83,41,.86) 45.2% 51%, transparent 51.2%),
        linear-gradient(142deg, rgba(44,68,40,.89) 0 36%, transparent 36.3%),
        linear-gradient(165deg, transparent 0 59%, rgba(227,212,166,.9) 59.2% 76%, transparent 76.2%),
        linear-gradient(24deg, #233525 0 29%, #645739 29.2% 45%, #38472d 45.2% 56%, #b4ab7b 56.2% 74%, #ded2a3 74.2% 100%);
    }
    .photo::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .78;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(11,22,17,.7) 10.2% 11%, transparent 11.2% 46%, rgba(16,17,13,.88) 46.2% 48%, transparent 48.3%),
        linear-gradient(180deg, transparent 0 28%, rgba(17,24,16,.7) 28.3% 31%, transparent 31.2% 57%, rgba(228,221,178,.78) 57.2% 58.5%, transparent 58.8%),
        repeating-linear-gradient(32deg, transparent 0 75px, rgba(226,218,180,.6) 77px 83px, transparent 85px 150px),
        repeating-linear-gradient(148deg, transparent 0 120px, rgba(239,228,185,.5) 122px 129px, transparent 131px 230px);
      mix-blend-mode: screen;
    }
    .photo::after {
      content: "[Photograph: interior atrium of the Transpacific Building, with tiled geometric floor, escalator, balconies, green lighting, and central planter]";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64%;
      padding: 12px 16px;
      text-align: center;
      color: rgba(255,255,255,.78);
      background: rgba(0,0,0,.36);
      border: 1px solid rgba(255,255,255,.35);
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: .2px;
    }
    .caption {
      height: 83px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 17px 20px 0;
      font-size: 21px;
      font-style: italic;
      white-space: nowrap;
      letter-spacing: .15px;
    }
    .caption span:last-child { padding-right: 2px; }
    .copy {
      height: 345px;
      position: relative;
      padding: 0 19px;
    }
    .headline {
      position: absolute;
      top: 21px;
      width: 100%;
      left: 0;
      text-align: center;
      font-size: 49px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: .5px;
    }
    .company {
      position: absolute;
      left: 19px;
      bottom: 52px;
      font-size: 27px;
      letter-spacing: -.3px;
      white-space: nowrap;
    }
    .company strong {
      font-weight: 800;
      font-style: italic;
    }
    .custom {
      position: absolute;
      left: 19px;
      bottom: 17px;
      font-size: 22px;
      font-style: italic;
      white-space: nowrap;
    }
    .contact {
      position: absolute;
      right: 19px;
      bottom: 16px;
      font-size: 22px;
      line-height: 1.08;
      text-align: right;
      font-style: italic;
      white-space: nowrap;
    }
    .footer {
      width: 842px;
      margin: 19px auto 0;
      text-align: right;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      color: #1c1b18;
    }
    .footer b { margin-left: 12px; }
  </style>
</head>
<body>
  <main class="page">
    <section class="ad">
      <div class="photo placeholder"></div>
      <div class="caption">
        <span>Transpacific Building — Oakland, CA</span>
        <span>Wong &amp; Tung International Architects</span>
      </div>
      <div class="copy">
        <div class="headline">“tile that humanizes”</div>
        <div class="company"><strong>Heath Ceramics</strong>, Sausalito, CA 94965</div>
        <div class="custom">(Custom-made by people—not automated)</div>
        <div class="contact">Phone (415) 332-3732<br>Edith Heath<br>Jon Brooder</div>
      </div>
    </section>
    <footer class="footer">September/October 1983&nbsp;&nbsp;&nbsp; Architecture California <b>3</b></footer>
  </main>
</body>
</html>
