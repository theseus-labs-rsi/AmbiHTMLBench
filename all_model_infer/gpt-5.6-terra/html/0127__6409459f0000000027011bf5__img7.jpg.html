<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句合集系列</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      background: #d5c18b;
      color: #15110d;
      font-family: "Songti SC", "STSong", "SimSun", serif;
    }
    .page {
      width: 540px;
      min-height: 716px;
      overflow: hidden;
      background:
        linear-gradient(rgba(135, 100, 51, .07), rgba(135, 100, 51, .07)),
        repeating-linear-gradient(0deg, rgba(92, 65, 28, .025) 0, rgba(92, 65, 28, .025) 1px, transparent 1px, transparent 4px),
        #cbb07b;
    }
    header {
      height: 148px;
      position: relative;
      background:
        repeating-linear-gradient(90deg, rgba(150, 115, 50, .025) 0, rgba(150, 115, 50, .025) 1px, transparent 1px, transparent 5px),
        #f4e8ba;
      border-bottom: 4px solid rgba(110, 76, 34, .16);
    }
    .masthead {
      position: absolute;
      left: 13px;
      top: 5px;
      width: 272px;
      height: 132px;
    }
    .people {
      position: absolute;
      top: -11px;
      left: 0;
      color: #d82924;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
      font-size: 76px;
      line-height: 1;
      font-weight: bold;
      font-style: italic;
      transform: scaleX(.94);
      text-shadow: 2px 3px 2px rgba(95, 40, 20, .32);
      white-space: nowrap;
    }
    .roman {
      position: absolute;
      top: 108px;
      left: 59px;
      color: #a23b2d;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 2px;
      transform: scaleX(.9);
      white-space: nowrap;
    }
    .top-right {
      position: absolute;
      top: 10px;
      right: 0;
      width: 241px;
      color: #15120d;
    }
    .small-title {
      margin-left: 42px;
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .rule {
      height: 3px;
      margin-top: 15px;
      background: #17120c;
    }
    .series {
      margin-top: 28px;
      margin-left: 34px;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .content {
      padding: 34px 13px 9px 15px;
    }
    .quote {
      margin: 0 0 20px;
    }
    .quote-main {
      display: flex;
      align-items: flex-start;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.14;
      letter-spacing: 0;
    }
    .number {
      flex: 0 0 61px;
      padding-top: 2px;
      font-size: 36px;
    }
    .words {
      flex: 1;
      white-space: nowrap;
    }
    .meaning {
      margin-top: 22px;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .meaning-label {
      display: block;
    }
    .quote:nth-child(2) {
      margin-top: 18px;
      margin-bottom: 25px;
    }
    .quote:nth-child(2) .meaning {
      margin-top: 11px;
    }
    .quote:nth-child(3) {
      margin-top: 20px;
      margin-bottom: 0;
    }
    .quote:nth-child(3) .meaning {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="masthead">
        <div class="people">人民日报</div>
        <div class="roman">RENMIN RIBAO</div>
      </div>
      <div class="top-right">
        <div class="small-title">金句 | 素材 | 摘抄</div>
        <div class="rule"></div>
        <div class="series">金句合集系列</div>
        <div class="rule"></div>
      </div>
    </header>

    <section class="content">
      <article class="quote">
        <div class="quote-main">
          <div class="number">1、</div>
          <div class="words">愿你千山暮雪海棠依旧，<br>不为岁月惊扰平添忧愁。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝<br>
          与琐事而烦恼忧愁。
        </div>
      </article>

      <article class="quote">
        <div class="quote-main">
          <div class="number">2、</div>
          <div class="words">总有人间一两风，<br>填我十万八千梦。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成<br>
          全你的理想。
        </div>
      </article>

      <article class="quote">
        <div class="quote-main">
          <div class="number">3、</div>
          <div class="words">日出有盼，日落有思，<br>平平安安，所遇皆甜。</div>
        </div>
        <div class="meaning">
          <span class="meaning-label">释义:</span>
          只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，<br>
          遇到的都是美好。
        </div>
      </article>
    </section>
  </main>
</body>
</html>
