<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea Cliff Poster</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #eee5c9;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 10px;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    .poster {
      position: relative;
      width: min(96vw, 900px);
      aspect-ratio: 2380 / 3120;
      overflow: hidden;
      background: #123aa9;
      border: 7px solid #f4e9cb;
      color: #ffc813;
    }
    .top-text {
      position: absolute;
      z-index: 4;
      top: 3.4%;
      left: 31%;
      width: 56%;
      text-align: center;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: .94;
    }
    .while {
      font-size: clamp(24px, 4.6vw, 52px);
      white-space: nowrap;
    }
    .fair {
      margin-top: 1.5%;
      font-family: Arial, sans-serif;
      font-size: clamp(42px, 7.3vw, 87px);
      font-weight: 900;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .skyline {
      position: absolute;
      z-index: 2;
      top: 15.3%;
      left: 31%;
      width: 69%;
      height: 18%;
      background: #f8eccd;
      clip-path: polygon(0 50%, 5% 48%, 6% 58%, 8% 57%, 9% 36%, 10% 52%, 13% 52%, 14% 20%, 15% 19%, 16% 51%, 21% 50%, 22% 45%, 25% 49%, 27% 39%, 30% 39%, 32% 50%, 38% 50%, 40% 39%, 41% 40%, 43% 48%, 45% 47%, 47% 26%, 48% 25%, 49% 48%, 54% 48%, 56% 35%, 58% 31%, 61% 32%, 64% 45%, 66% 43%, 69% 35%, 72% 33%, 75% 39%, 79% 25%, 84% 17%, 88% 21%, 92% 33%, 96% 36%, 100% 31%, 100% 88%, 91% 83%, 83% 80%, 77% 76%, 72% 74%, 63% 70%, 55% 71%, 48% 73%, 40% 69%, 30% 71%, 20% 68%, 10% 70%, 0 67%);
    }
    .bridge {
      position: absolute;
      z-index: 3;
      top: 18.2%;
      right: 6%;
      width: 31%;
      height: 13%;
      border-top: 12px solid #123aa9;
      border-radius: 48% 48% 0 0;
      transform: rotate(-2deg);
    }
    .bridge::before, .bridge::after {
      content: "";
      position: absolute;
      bottom: -40%;
      width: 13%;
      height: 135%;
      background: #123aa9;
      border-radius: 50% 50% 0 0;
    }
    .bridge::before { left: 1%; }
    .bridge::after { right: 1%; }
    .water {
      position: absolute;
      z-index: 1;
      top: 28%;
      left: 26%;
      width: 76%;
      height: 16%;
      background: #f8eccd;
      clip-path: polygon(0 25%, 23% 12%, 63% 15%, 100% 0, 100% 64%, 81% 65%, 93% 76%, 68% 72%, 83% 86%, 53% 80%, 35% 91%, 10% 76%, 0 70%);
    }
    .tree {
      position: absolute;
      z-index: 5;
      left: -5%;
      top: -1%;
      width: 40%;
      height: 51%;
    }
    .tree .foliage {
      position: absolute;
      inset: 0 5% 10% 0;
      background: #385d05;
      clip-path: polygon(16% 0,45% 2%,54% 9%,77% 5%,95% 15%,73% 19%,94% 29%,70% 31%,95% 42%,71% 48%,91% 57%,72% 63%,83% 77%,57% 72%,52% 91%,35% 80%,21% 95%,17% 76%,0 87%,8% 65%,0 55%,11% 47%,2% 37%,17% 33%,0 21%,10% 13%);
    }
    .tree .trunk {
      position: absolute;
      left: 8%;
      top: 45%;
      width: 18%;
      height: 57%;
      background: #f7edcf;
      clip-path: polygon(42% 0,58% 0,63% 35%,88% 66%,71% 100%,20% 100%,35% 62%,0 38%,25% 29%);
    }
    .shore {
      position: absolute;
      z-index: 2;
      bottom: 23%;
      left: -1%;
      width: 67%;
      height: 29%;
      background: #385d05;
      clip-path: polygon(0 40%, 12% 30%, 23% 34%, 31% 46%, 41% 44%, 51% 56%, 64% 61%, 76% 72%, 88% 77%, 100% 100%, 0 100%);
    }
    .boat {
      position: absolute;
      z-index: 5;
      right: 6%;
      bottom: 22%;
      width: 39%;
      height: 19%;
    }
    .boat .hull {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30%;
      background: #f7edcf;
      border-bottom: 14px solid #ffc813;
      clip-path: polygon(0 0,100% 5%,67% 93%,20% 100%);
      transform: skewX(-12deg);
    }
    .boat .cabin {
      position: absolute;
      bottom: 24%;
      left: 35%;
      width: 34%;
      height: 33%;
      background: #ffc813;
      border: 7px solid #f7edcf;
    }
    .boat .mast {
      position: absolute;
      left: 54%;
      bottom: 51%;
      width: 5%;
      height: 42%;
      background: #ffc813;
    }
    .boat .flag {
      position: absolute;
      left: 58%;
      bottom: 83%;
      width: 19%;
      height: 10%;
      background: #f7edcf;
      clip-path: polygon(0 0,100% 30%,0 60%);
    }
    .commute {
      position: absolute;
      z-index: 7;
      top: 34.3%;
      left: 25%;
      width: 67%;
      text-align: center;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-size: clamp(32px, 6.6vw, 75px);
      font-weight: 700;
      line-height: .95;
      letter-spacing: -2px;
      color: #ffc813;
    }
    .commute span { display: block; }
    .sea-area {
      position: absolute;
      z-index: 7;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 31%;
      padding-top: 2.4%;
      text-align: center;
      color: #f7edcf;
      background: #385d05;
    }
    .beautiful {
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-size: clamp(35px, 7vw, 86px);
      font-weight: 500;
      line-height: .9;
    }
    .sea-cliff {
      margin-top: 1%;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(75px, 15vw, 184px);
      font-weight: 900;
      letter-spacing: -7px;
      line-height: .9;
      white-space: nowrap;
    }
    .tagline {
      margin-top: 3.2%;
      font-size: clamp(15px, 2.8vw, 35px);
      font-weight: 700;
      white-space: nowrap;
    }
    .golf {
      margin-top: 1%;
      font-family: Georgia, serif;
      font-size: clamp(28px, 5.6vw, 67px);
      letter-spacing: 2px;
      line-height: 1;
    }
    .sponsor {
      margin-top: 3.1%;
      font-size: clamp(12px, 2.1vw, 25px);
      font-weight: 900;
      letter-spacing: 4px;
      white-space: nowrap;
    }
    .wpa {
      margin-top: 1.2%;
      font-family: monospace;
      font-size: clamp(10px, 1.7vw, 19px);
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .placeholder {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Vintage Sea Cliff travel poster">
    <div class="top-text">
      <div class="while">While visiting</div>
      <div class="fair">THE FAIR</div>
    </div>

    <div class="tree" aria-hidden="true">
      <div class="foliage"></div>
      <div class="trunk"></div>
    </div>

    <div class="skyline" aria-hidden="true"></div>
    <div class="bridge" aria-hidden="true"></div>
    <div class="water" aria-hidden="true"></div>
    <div class="shore" aria-hidden="true"></div>

    <div class="commute">
      <span>Commute</span>
      <span>by land or water</span>
    </div>

    <div class="boat" aria-hidden="true">
      <div class="mast"></div>
      <div class="flag"></div>
      <div class="cabin"></div>
      <div class="hull"></div>
    </div>

    <section class="sea-area">
      <div class="beautiful">to<br>beautiful</div>
      <div class="sea-cliff">SEA CLIFF</div>
      <div class="tagline">250 feet above sea level. NO MOSQUITOS!</div>
      <div class="golf">golf and bathing</div>
      <div class="sponsor">SPONSORED BY THE VILLAGE OF SEA CLIFF</div>
      <div class="wpa">WPA FEDERAL ART PROJECT 0124</div>
    </section>

    <div class="placeholder">[Illustration: tree, waterfront fair, bridge, shore, and motorboat]</div>
  </main>
</body>
</html>
