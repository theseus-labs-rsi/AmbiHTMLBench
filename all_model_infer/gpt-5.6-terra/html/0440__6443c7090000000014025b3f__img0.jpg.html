<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design studio web Vol.07</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, "Microsoft YaHei", sans-serif;
      color: #000;
    }
    body {
      display: flex;
      justify-content: center;
      background: #f4f4f4;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #fff;
    }

    .top {
      position: relative;
      height: 355px;
      background: #fff;
      overflow: hidden;
    }
    .header {
      position: absolute;
      left: 17px;
      right: 17px;
      top: 27px;
      height: 51px;
      border-bottom: 3px solid #080808;
      display: flex;
      align-items: flex-start;
    }
    .brand {
      display: flex;
      align-items: center;
      height: 33px;
      white-space: nowrap;
    }
    .scribble {
      position: relative;
      width: 117px;
      height: 35px;
      margin-right: 2px;
      font-size: 0;
    }
    .scribble span {
      position: absolute;
      display: block;
      height: 5px;
      background: #050505;
      border-radius: 3px;
      transform-origin: left center;
    }
    .scribble .a { width: 38px; left: 1px; top: 27px; transform: rotate(-41deg); }
    .scribble .b { width: 36px; left: 30px; top: 21px; transform: rotate(-13deg); }
    .scribble .c { width: 32px; left: 55px; top: 19px; transform: rotate(5deg); }
    .scribble .d { width: 21px; left: 77px; top: 15px; transform: rotate(-7deg); }
    .scribble .e { width: 25px; left: 95px; top: 23px; transform: rotate(0deg); }
    .scribble .f { width: 19px; left: 11px; top: 31px; transform: rotate(3deg); }
    .brand-share {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 31px;
    }
    .volume {
      font-size: 16px;
      font-weight: 700;
      margin: 3px 0 0 8px;
    }
    .web-label {
      position: absolute;
      top: 0;
      right: 1px;
      width: 206px;
      height: 30px;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      padding: 1px 8px 1px 5px;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
    }
    .web-icon {
      width: 23px;
      height: 20px;
      margin-right: 10px;
      background: #151515;
      border: 2px solid #050505;
      position: relative;
    }
    .web-icon:after {
      content: "";
      position: absolute;
      width: 15px;
      height: 13px;
      left: 2px;
      top: 1px;
      background: linear-gradient(135deg, #dbe0e2 45%, #8495a3 46%);
      transform: skewY(-8deg);
    }

    .card {
      position: absolute;
      background: linear-gradient(145deg, #f8f8f8, #dedede);
      border: 1px solid #d7d7d7;
      box-shadow: -8px 7px 0 rgba(230,230,230,.78), 0 1px 2px rgba(0,0,0,.12);
      color: #060606;
    }
    .card:before {
      content: "";
      position: absolute;
      top: -9px;
      left: 10px;
      width: 38px;
      height: 11px;
      border: 1px solid #dfdfdf;
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: #f5f5f5;
    }
    .circle {
      position: absolute;
      width: 33px;
      height: 33px;
      border-radius: 50%;
      background: rgba(180,180,180,.45);
      color: #eee;
      text-align: center;
      line-height: 33px;
      font-size: 24px;
      font-weight: 700;
    }

    .card-one {
      top: 145px;
      left: 29px;
      width: 107px;
      height: 132px;
      padding: 14px 7px 7px 12px;
      transform: rotate(-42deg);
    }
    .card-one .circle { left: 2px; bottom: 8px; }
    .ab {
      font-size: 34px;
      line-height: 27px;
      font-weight: 500;
      letter-spacing: -2px;
    }
    .black {
      margin-left: 35px;
      font-size: 16px;
      line-height: 15px;
      font-weight: 700;
    }
    .cover {
      margin-top: 4px;
      margin-left: 2px;
      font-size: 15px;
      line-height: 15px;
      font-weight: 700;
    }

    .card-two {
      top: 147px;
      left: 208px;
      width: 136px;
      height: 98px;
      padding: 13px 5px 4px;
      text-align: center;
    }
    .card-two .circle { left: 6px; bottom: 8px; }
    .cn-small {
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 31px;
      line-height: 35px;
      font-weight: 700;
      letter-spacing: -3px;
    }
    .reflex {
      font-size: 18px;
      line-height: 19px;
      font-weight: 700;
    }
    .design-small {
      font-size: 18px;
      line-height: 18px;
      font-weight: 700;
    }

    .card-three {
      top: 133px;
      right: 25px;
      width: 113px;
      height: 126px;
      padding: 12px 8px;
      transform: rotate(35deg);
    }
    .card-three .circle { right: 8px; bottom: 8px; }
    .studio {
      font-size: 16px;
      line-height: 14px;
      font-weight: 700;
    }
    .naeo {
      font-size: 16px;
      line-height: 14px;
      font-weight: 700;
    }
    .prohibit {
      margin-top: 9px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 30px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -3px;
    }

    .card-four {
      top: 267px;
      left: 114px;
      width: 137px;
      height: 92px;
      padding: 9px 6px;
    }
    .card-four .circle { top: 8px; right: 6px; }
    .zhihong {
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 39px;
    }
    .wang {
      margin-top: 9px;
      font-size: 16px;
      line-height: 15px;
      font-weight: 700;
    }

    .card-five {
      top: 265px;
      left: 303px;
      width: 133px;
      height: 97px;
      padding: 5px 4px;
    }
    .card-five .circle { top: 8px; right: 6px; }
    .nice {
      font-size: 35px;
      font-weight: 500;
      line-height: 38px;
      letter-spacing: -2px;
    }
    .nice-small {
      margin-top: 1px;
      font-size: 14px;
      line-height: 13px;
      font-weight: 700;
    }
    .lab {
      margin-left: 29px;
      margin-top: -4px;
      font-size: 32px;
      line-height: 31px;
      font-weight: 500;
      letter-spacing: -2px;
    }

    .blue-bar {
      height: 43px;
      background: #282de7;
    }
    .bottom {
      position: relative;
      height: 322px;
      background: #92f1f4;
      padding: 18px 18px 0;
      overflow: hidden;
    }
    .headline {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: 68px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -7px;
      white-space: nowrap;
    }
    .headline.second {
      margin-top: 20px;
      font-size: 76px;
      letter-spacing: -9px;
    }
    .rule {
      width: 100%;
      height: 3px;
      background: #000;
      margin-top: 12px;
    }
    .second + .rule { margin-top: 10px; }

    .footer {
      position: absolute;
      left: 17px;
      right: 17px;
      bottom: 10px;
      height: 49px;
      display: flex;
      align-items: flex-start;
    }
    .copyright {
      width: 209px;
      padding-top: 1px;
      font-size: 20px;
      line-height: 17px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }
    .official {
      width: 72px;
      padding-top: 2px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 17px;
      line-height: 20px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .symbol {
      position: relative;
      width: 50px;
      height: 43px;
      margin: 1px 10px 0 0;
    }
    .symbol:before {
      content: "";
      position: absolute;
      left: 8px;
      top: 5px;
      width: 29px;
      height: 27px;
      border: 4px solid #111;
      border-radius: 4px;
      transform: rotate(60deg) skewY(-8deg);
    }
    .symbol:after {
      content: "";
      position: absolute;
      left: 19px;
      top: 15px;
      width: 11px;
      height: 10px;
      border: 3px solid #111;
      transform: rotate(60deg) skewY(-8deg);
    }
    .barcode-wrap {
      flex: 1;
      min-width: 0;
      padding-top: 3px;
      text-align: center;
    }
    .barcode {
      height: 36px;
      width: 164px;
      margin: 0 auto;
      background:
        repeating-linear-gradient(
          90deg,
          #000 0 2px,
          transparent 2px 4px,
          #000 4px 5px,
          transparent 5px 7px,
          #000 7px 10px,
          transparent 10px 12px,
          #000 12px 13px,
          transparent 13px 16px,
          #000 16px 20px,
          transparent 20px 22px,
          #000 22px 24px,
          transparent 24px 27px
        );
    }
    .barcode-text {
      margin-top: -1px;
      font-size: 8px;
      font-weight: 500;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <header class="header">
        <div class="brand">
          <div class="scribble" aria-hidden="true">
            <span class="a"></span><span class="b"></span><span class="c"></span>
            <span class="d"></span><span class="e"></span><span class="f"></span>
          </div>
          <span class="brand-share">·(分享)</span>
          <span class="volume">Vol.07</span>
        </div>
        <div class="web-label"><span class="web-icon"></span>Design studio web</div>
      </header>

      <div class="card card-one">
        <div class="ab">ABCD</div>
        <div class="black">BLACK<br>DESIGN</div>
        <div class="cover">A<br>COVER DESIGN</div>
        <span class="circle">1</span>
      </div>

      <div class="card card-two">
        <div class="cn-small">条件反射</div>
        <div class="reflex">REFLEX</div>
        <div class="design-small">DESIGN</div>
        <span class="circle">2</span>
      </div>

      <div class="card card-three">
        <div class="studio">STUDIO</div>
        <div class="naeo">NA.　EO</div>
        <div class="prohibit">设计禁止</div>
        <span class="circle">3</span>
      </div>

      <div class="card card-four">
        <div class="zhihong">王志弘</div>
        <div class="wang">WANG ZHI HONG</div>
        <span class="circle">4</span>
      </div>

      <div class="card card-five">
        <div class="nice">NICE</div>
        <div class="nice-small">NICE LAB<br>STUDIO</div>
        <div class="lab">LAB</div>
        <span class="circle">5</span>
      </div>
    </section>

    <div class="blue-bar"></div>

    <section class="bottom">
      <div class="headline">国内知名设计</div>
      <div class="rule"></div>
      <div class="headline second">工作室的官网</div>
      <div class="rule"></div>

      <footer class="footer">
        <div class="copyright">Copyright© 2023<br>Jidnshare all rights reserved.</div>
        <div class="official">（官网）</div>
        <div class="symbol" aria-hidden="true"></div>
        <div class="barcode-wrap">
          <div class="barcode"></div>
          <div class="barcode-text">CC　JIDN SHARE ©2023　&gt;&gt;&gt;</div>
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
