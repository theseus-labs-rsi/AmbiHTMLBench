<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香水浓度</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 540px;
      height: 720px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      background-color: #96724d;
      background-image:
        radial-gradient(ellipse at 18% 4%, rgba(51, 29, 13, .55) 0 2px, transparent 4px),
        radial-gradient(ellipse at 88% 92%, rgba(54, 29, 14, .48) 0 3px, transparent 5px),
        repeating-linear-gradient(115deg,
          rgba(62, 36, 17, .42) 0 3px,
          rgba(181, 140, 91, .22) 4px 13px,
          rgba(73, 42, 21, .34) 14px 17px,
          rgba(155, 112, 68, .22) 18px 30px),
        repeating-linear-gradient(8deg,
          rgba(255, 224, 164, .10) 0 2px,
          transparent 3px 21px,
          rgba(58, 31, 13, .17) 22px 25px,
          transparent 26px 43px),
        linear-gradient(135deg, #b08a5d, #765333 52%, #a67f52);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .45;
      background:
        linear-gradient(73deg, transparent 0 7%, rgba(52, 29, 13, .58) 7.2% 7.7%, transparent 8% 100%),
        linear-gradient(102deg, transparent 0 83%, rgba(55, 29, 14, .44) 83.2% 83.7%, transparent 84% 100%),
        repeating-radial-gradient(ellipse at 30% 45%, transparent 0 28px, rgba(64, 35, 17, .18) 30px 32px, transparent 34px 65px);
      pointer-events: none;
    }

    .edge-label {
      position: absolute;
      left: -1px;
      z-index: 1;
      width: 39px;
      color: #fff;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 17px;
      font-weight: bold;
      line-height: 22px;
      white-space: nowrap;
      text-shadow: 1px 1px 1px #422617, -1px 0 #422617;
    }

    .edge-label.one { top: 291px; }
    .edge-label.two { top: 360px; }
    .edge-label.three { top: 429px; }
    .edge-label.four { top: 498px; }
    .edge-label.five { top: 566px; }

    .poster {
      position: absolute;
      left: 36px;
      top: 27px;
      width: 459px;
      height: 662px;
      z-index: 2;
      overflow: hidden;
      background: #fff;
    }

    h1 {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      margin: 0;
      color: #754a32;
      font-family: "STKaiti", "KaiTi", "SimSun", serif;
      font-size: 50px;
      font-weight: bold;
      line-height: 62px;
      letter-spacing: 2px;
      text-align: center;
    }

    .columns {
      position: absolute;
      left: 5px;
      right: 5px;
      top: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .column {
      position: relative;
      height: 100%;
      color: #684b3a;
      text-align: center;
    }

    .placeholder.bottle {
      position: absolute;
      top: 118px;
      left: 50%;
      width: 64px;
      height: 98px;
      margin: 0;
      transform: translateX(-50%);
    }

    .bottle svg {
      display: block;
      width: 64px;
      height: 98px;
      overflow: visible;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .cn-name,
    .english,
    .abbr,
    .percentage,
    .duration {
      position: absolute;
      left: 0;
      width: 100%;
      white-space: nowrap;
    }

    .cn-name {
      top: 264px;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 17px;
      font-weight: bold;
      line-height: 22px;
    }

    .english {
      top: 315px;
      font-size: 18px;
      font-weight: bold;
      line-height: 18px;
    }

    .column:first-child .english {
      top: 337px;
    }

    .abbr {
      top: 393px;
      font-size: 18px;
      font-weight: bold;
      line-height: 22px;
    }

    .percentage {
      top: 463px;
      font-size: 19px;
      font-weight: bold;
      line-height: 23px;
    }

    .duration {
      top: 527px;
      font-size: 19px;
      font-weight: bold;
      line-height: 24px;
    }

    .tips {
      position: absolute;
      left: 22px;
      top: 585px;
      width: 420px;
      color: #684b3a;
      font-size: 12px;
      font-weight: bold;
      line-height: 19px;
      white-space: nowrap;
    }

    .tips .tip-head {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 17px;
    }
  </style>
</head>
<body>
  <div class="edge-label one">分类</div>
  <div class="edge-label two">名称</div>
  <div class="edge-label three">缩写</div>
  <div class="edge-label four">浓度</div>
  <div class="edge-label five">留香</div>

  <main class="poster">
    <h1>香水浓度</h1>

    <section class="columns">
      <div class="column">
        <figure class="placeholder bottle" aria-label="Perfume bottle illustration">
          <svg viewBox="0 0 64 98" role="img" aria-hidden="true">
            <defs>
              <clipPath id="b1">
                <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"/>
              </clipPath>
              <linearGradient id="red1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f25561"/>
                <stop offset="1" stop-color="#d91d35"/>
              </linearGradient>
            </defs>
            <circle cx="31" cy="16" r="13" fill="url(#red1)" stroke="#a83b46" stroke-width="1"/>
            <path d="M31 29 L31 34 M43 28 C50 27 54 27 56 30 C52 32 48 32 44 32 C52 32 56 34 57 36 C51 37 46 36 42 35"
                  fill="none" stroke="#777" stroke-width="1.2"/>
            <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"
                  fill="#fafafa" stroke="#777" stroke-width="1"/>
            <rect x="10" y="59" width="44" height="34" fill="#b8b8bb" opacity=".78" clip-path="url(#b1)"/>
            <path d="M12 59 H50" stroke="#c8c8cb" stroke-width="1"/>
          </svg>
          <figcaption class="sr-only">[Illustration: perfume bottle]</figcaption>
        </figure>
        <div class="cn-name">浓香精</div>
        <div class="english">Parfum</div>
        <div class="abbr">(P)</div>
        <div class="percentage">15-20%</div>
        <div class="duration">5-8H</div>
      </div>

      <div class="column">
        <figure class="placeholder bottle" aria-label="Perfume bottle illustration">
          <svg viewBox="0 0 64 98" role="img" aria-hidden="true">
            <defs>
              <clipPath id="b2">
                <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"/>
              </clipPath>
              <linearGradient id="red2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f25561"/>
                <stop offset="1" stop-color="#d91d35"/>
              </linearGradient>
            </defs>
            <circle cx="31" cy="16" r="13" fill="url(#red2)" stroke="#a83b46" stroke-width="1"/>
            <path d="M31 29 L31 34 M43 28 C50 27 54 27 56 30 C52 32 48 32 44 32 C52 32 56 34 57 36 C51 37 46 36 42 35"
                  fill="none" stroke="#777" stroke-width="1.2"/>
            <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"
                  fill="#fafafa" stroke="#777" stroke-width="1"/>
            <rect x="10" y="65" width="44" height="29" fill="#b9b8bc" opacity=".72" clip-path="url(#b2)"/>
            <path d="M12 65 H50" stroke="#d1d0d2" stroke-width="1"/>
          </svg>
          <figcaption class="sr-only">[Illustration: perfume bottle]</figcaption>
        </figure>
        <div class="cn-name">淡香精</div>
        <div class="english">Eau<br>De<br>Parfum</div>
        <div class="abbr">(EDP)</div>
        <div class="percentage">10-15%</div>
        <div class="duration">3-5H</div>
      </div>

      <div class="column">
        <figure class="placeholder bottle" aria-label="Perfume bottle illustration">
          <svg viewBox="0 0 64 98" role="img" aria-hidden="true">
            <defs>
              <clipPath id="b3">
                <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"/>
              </clipPath>
              <linearGradient id="red3" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f25561"/>
                <stop offset="1" stop-color="#d91d35"/>
              </linearGradient>
            </defs>
            <circle cx="31" cy="16" r="13" fill="url(#red3)" stroke="#a83b46" stroke-width="1"/>
            <path d="M31 29 L31 34 M43 28 C50 27 54 27 56 30 C52 32 48 32 44 32 C52 32 56 34 57 36 C51 37 46 36 42 35"
                  fill="none" stroke="#777" stroke-width="1.2"/>
            <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"
                  fill="#fafafa" stroke="#777" stroke-width="1"/>
            <rect x="10" y="65" width="44" height="29" fill="#b7b6b9" opacity=".68" clip-path="url(#b3)"/>
            <path d="M12 65 H50" stroke="#d3d2d4" stroke-width="1"/>
          </svg>
          <figcaption class="sr-only">[Illustration: perfume bottle]</figcaption>
        </figure>
        <div class="cn-name">淡香水</div>
        <div class="english">Eau<br>De<br>Toilette</div>
        <div class="abbr">(EDT)</div>
        <div class="percentage">5-10%</div>
        <div class="duration">3-4H</div>
      </div>

      <div class="column">
        <figure class="placeholder bottle" aria-label="Perfume bottle illustration">
          <svg viewBox="0 0 64 98" role="img" aria-hidden="true">
            <defs>
              <clipPath id="b4">
                <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"/>
              </clipPath>
              <linearGradient id="red4" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f25561"/>
                <stop offset="1" stop-color="#d91d35"/>
              </linearGradient>
            </defs>
            <circle cx="31" cy="16" r="13" fill="url(#red4)" stroke="#a83b46" stroke-width="1"/>
            <path d="M31 29 L31 34 M43 28 C50 27 54 27 56 30 C52 32 48 32 44 32 C52 32 56 34 57 36 C51 37 46 36 42 35"
                  fill="none" stroke="#777" stroke-width="1.2"/>
            <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"
                  fill="#fafafa" stroke="#777" stroke-width="1"/>
            <rect x="10" y="68" width="44" height="26" fill="#b6b5b8" opacity=".60" clip-path="url(#b4)"/>
            <path d="M12 68 H50" stroke="#d6d5d7" stroke-width="1"/>
          </svg>
          <figcaption class="sr-only">[Illustration: perfume bottle]</figcaption>
        </figure>
        <div class="cn-name">古龙水</div>
        <div class="english">Eau<br>De<br>Cologne</div>
        <div class="abbr">(EDC)</div>
        <div class="percentage">3-5%</div>
        <div class="duration">2-3H</div>
      </div>

      <div class="column">
        <figure class="placeholder bottle" aria-label="Perfume bottle illustration">
          <svg viewBox="0 0 64 98" role="img" aria-hidden="true">
            <defs>
              <clipPath id="b5">
                <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"/>
              </clipPath>
              <linearGradient id="red5" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f25561"/>
                <stop offset="1" stop-color="#d91d35"/>
              </linearGradient>
            </defs>
            <circle cx="31" cy="16" r="13" fill="url(#red5)" stroke="#a83b46" stroke-width="1"/>
            <path d="M31 29 L31 34 M43 28 C50 27 54 27 56 30 C52 32 48 32 44 32 C52 32 56 34 57 36 C51 37 46 36 42 35"
                  fill="none" stroke="#777" stroke-width="1.2"/>
            <path d="M12 37 Q12 33 17 33 H47 Q51 33 51 37 L47 84 Q46 90 40 91 H22 Q16 90 15 84 Z"
                  fill="#fcfcfc" stroke="#777" stroke-width="1"/>
            <rect x="10" y="76" width="44" height="18" fill="#d4d3d5" opacity=".36" clip-path="url(#b5)"/>
            <path d="M12 76 H50" stroke="#e0dfe0" stroke-width="1"/>
          </svg>
          <figcaption class="sr-only">[Illustration: perfume bottle]</figcaption>
        </figure>
        <div class="cn-name">清香水</div>
        <div class="english">Eau<br>Fraîche</div>
        <div class="abbr">(EF)</div>
        <div class="percentage">&lt;3%</div>
        <div class="duration">&lt;1h</div>
      </div>
    </section>

    <div class="tips">
      <div class="tip-head">tips:</div>
      <div>浓度高的香水代表留香时间长,主要取决于香料种类</div>
      <div>在相同的浓度比较下，木质香的留香时间是馥郁花果香的</div>
    </div>
  </main>
</body>
</html>
