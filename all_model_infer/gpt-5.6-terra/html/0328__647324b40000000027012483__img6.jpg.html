<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用合理的标点符号</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #202020;
    }
    .page {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }
    .content {
      width: 362px;
      margin-left: 89px;
      padding-top: 28px;
    }
    .headline {
      display: inline-block;
      margin: 0;
      font-size: 31px;
      line-height: 1.38;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .headline span {
      display: table;
      padding: 0 3px 0 0;
      background: linear-gradient(transparent 19%, #fff01d 19%, #fff01d 79%, transparent 79%);
    }
    .headline span + span {
      margin-top: -1px;
    }
    .number {
      position: absolute;
      top: 41px;
      right: 89px;
      width: 76px;
      height: 76px;
      border: 1px solid #dedede;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
    }
    .subtitle {
      margin: 8px 0 24px 0;
      font-size: 14px;
      white-space: nowrap;
      letter-spacing: .1px;
    }
    .card {
      position: relative;
      width: 362px;
      overflow: hidden;
    }
    .card-one {
      height: 230px;
      padding: 25px 21px;
      background: #fff5f0;
    }
    .card-two {
      height: 230px;
      margin-top: 22px;
      padding: 25px 22px;
      background: #f0f7ff;
    }
    .card-title {
      display: flex;
      align-items: center;
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
    }
    .circle-mark {
      width: 25px;
      height: 25px;
      margin-right: 11px;
      border: 2px solid #d4a17d;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .cross-mark {
      width: 25px;
      height: 25px;
      margin-right: 11px;
      position: relative;
      flex: 0 0 auto;
    }
    .cross-mark:before, .cross-mark:after {
      content: "";
      position: absolute;
      top: 11px;
      left: 1px;
      width: 23px;
      height: 2px;
      background: #83a7cf;
    }
    .cross-mark:before { transform: rotate(45deg); }
    .cross-mark:after { transform: rotate(-45deg); }
    .detail {
      margin: 28px 0 0 76px;
      font-size: 14px;
      line-height: 1.65;
      white-space: nowrap;
    }
    .detail b {
      font-weight: 800;
    }
    .detail-two {
      margin-top: 39px;
    }
    .labels {
      margin: 28px 0 0 76px;
      display: flex;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.7;
      white-space: nowrap;
    }
    .label-boxes {
      margin-right: 8px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      color: #fff;
    }
    .label-boxes span {
      display: block;
      width: 31px;
      height: 18px;
      padding-left: 3px;
      background: #f46f76;
    }
    .label-boxes span + span {
      margin-top: 1px;
    }
    .label-text { padding-top: 0; }
    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 0;
    }
    .mascot-one {
      width: 68px;
      height: 82px;
      right: 2px;
      bottom: -8px;
    }
    .mascot-two {
      width: 72px;
      height: 83px;
      right: 0;
      bottom: -11px;
    }
    .mascot-one:after, .mascot-two:after {
      content: "🐥";
      color: #d89831;
      font-size: 59px;
      line-height: 1;
      filter: saturate(1.2);
    }
    .mascot-two:after {
      content: "🐤";
      font-size: 60px;
    }
    .footer-line {
      position: absolute;
      bottom: 38px;
      left: 28px;
      width: 484px;
      height: 1px;
      background: #e8e8e8;
    }
    .footer-copy {
      position: absolute;
      left: 28px;
      bottom: 13px;
      font-family: Arial, sans-serif;
      font-size: 5px;
      line-height: 1.3;
      color: #555;
    }
    .footer-copy b {
      font-size: 6px;
      font-weight: 700;
    }
    .footer-logo {
      position: absolute;
      right: 26px;
      bottom: 12px;
      width: 42px;
      height: 23px;
      border: 1px solid #777;
      font-family: Arial, sans-serif;
      text-align: center;
      font-size: 4px;
      line-height: 1.05;
      padding-top: 3px;
      color: #333;
    }
    .footer-logo .icon {
      width: 10px;
      height: 8px;
      margin: 2px auto 1px;
      border: 1px solid #444;
      position: relative;
    }
    .footer-logo .icon:after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #444;
      top: 1px;
      left: 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content">
      <h1 class="headline">
        <span>使用合理的</span>
        <span>标点符号</span>
      </h1>

      <div class="number">01</div>

      <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>

      <section class="card card-one">
        <div class="card-title">
          <span class="circle-mark"></span>
          <span>使用直线或外框</span>
        </div>

        <div class="detail">
          <b>地点</b>｜武汉国际会展中心<br>
          <b>时间</b>｜2018 年 8 月 20 日
        </div>

        <div class="labels">
          <div class="label-boxes">
            <span>地点</span>
            <span>时间</span>
          </div>
          <div class="label-text">
            武汉国际会展中心<br>
            2018 年 8 月 20 日
          </div>
        </div>

        <div class="placeholder mascot-one">[卡通形象：右下角]</div>
      </section>

      <section class="card card-two">
        <div class="card-title">
          <span class="cross-mark"></span>
          <span>使用冒号</span>
        </div>

        <div class="detail detail-two">
          <b>地点：</b>武汉国际会展中心<br>
          <b>时间：</b>2018 年 8 月 20 日
        </div>

        <div class="placeholder mascot-two">[卡通形象：右下角]</div>
      </section>
    </section>

    <div class="footer-line"></div>
    <div class="footer-copy">
      ADVERTISING CREATIVITY<br>
      <b>2023.05</b>
    </div>
    <div class="footer-logo">
      CREATIVE DESIGN
      <div class="icon"></div>
      ADVERTISING
    </div>
  </main>
</body>
</html>
