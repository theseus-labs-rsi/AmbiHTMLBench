<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程大纲</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 540px;
      height: 516px;
      overflow: hidden;
      background: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #25292d;
    }
    .tree {
      width: 100%;
      padding-top: 4px;
      font-size: 22px;
      line-height: 1.82;
    }
    .node {
      position: relative;
      min-height: 40px;
      padding-left: 59px;
      padding-right: 34px;
      white-space: nowrap;
    }
    .node::before {
      content: "";
      position: absolute;
      left: 33px;
      top: 17px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #697680;
    }
    .node.expandable::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 14px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #909ba2;
    }
    .root {
      color: #a8443b;
      font-size: 21px;
      line-height: 1.75;
    }
    .branch {
      position: relative;
      margin-left: 37px;
      border-left: 1px solid #d5d9dc;
    }
    .branch > .node {
      padding-left: 57px;
    }
    .branch > .node::before {
      left: 31px;
    }
    .branch .branch {
      margin-left: 36px;
    }
    .branch .branch > .node {
      padding-left: 56px;
    }
    .branch .branch > .node::before {
      left: 30px;
    }
    .spaced {
      margin-top: 1px;
    }
    .multiline {
      white-space: normal;
      line-height: 1.55;
      padding-top: 2px;
      padding-bottom: 7px;
    }
  </style>
</head>
<body>
  <main class="tree">
    <div class="node root expandable">第三阶段 认识自我，找到自我</div>

    <section class="branch">
      <div class="node expandable">不同国家的妆容模仿</div>
      <section class="branch">
        <div class="node">不同国家妆容特点分析</div>
        <div class="node">逐个部位模仿</div>
      </section>

      <div class="node expandable spaced">明星出圈妆容模仿</div>
      <section class="branch">
        <div class="node">鞠婧祎妆容</div>
        <div class="node">虞书欣妆容</div>
        <div class="node">宋慧乔妆容</div>
        <div class="node">女团妆容</div>
        <div class="node">日本杂志妆容</div>
      </section>

      <div class="node expandable spaced">找到适合自己的风格和妆容</div>
      <section class="branch">
        <div class="node multiline">根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</div>
      </section>
    </section>
  </main>
</body>
</html>
