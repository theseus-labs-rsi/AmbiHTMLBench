<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biology Notes</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #bdb9af;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: "KaiTi", "STKaiti", "FangSong", cursive;
    }
    .page {
      width: 540px;
      min-height: 720px;
      position: relative;
      overflow: hidden;
      padding: 16px 25px 28px 48px;
      color: #26323a;
      background:
        linear-gradient(90deg, rgba(125,140,150,.10) 0, rgba(125,140,150,.10) 2px, transparent 2px),
        repeating-linear-gradient(0deg, rgba(120,120,110,.025) 0, rgba(120,120,110,.025) 1px, transparent 1px, transparent 22px),
        #efeee7;
      border-radius: 0 22px 18px 0;
      box-shadow: 0 2px 9px rgba(0,0,0,.28);
      transform: rotate(1deg);
    }
    .gutter {
      position: absolute;
      left: 31px;
      top: 0;
      bottom: 0;
      width: 7px;
      background: linear-gradient(90deg, rgba(85,83,76,.22), rgba(255,255,255,.20), rgba(95,95,88,.10));
    }
    .ink {
      font-size: 20px;
      line-height: 1.48;
      letter-spacing: .5px;
    }
    .top-note {
      position: relative;
      min-height: 300px;
      transform: rotate(-2deg);
    }
    .er {
      font-size: 22px;
      margin-left: 28px;
      margin-top: -5px;
    }
    .arrow-note {
      position: absolute;
      top: -9px;
      left: 92px;
      font-size: 18px;
    }
    .membrane {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 6px;
      margin-left: -9px;
    }
    .cell-list {
      font-size: 18px;
      line-height: 1.15;
      margin-top: -2px;
    }
    .action {
      margin-left: 77px;
      font-size: 20px;
      line-height: 1.2;
    }
    .down {
      margin-left: 67px;
      margin-top: -2px;
      font-size: 24px;
    }
    .points {
      margin-top: 0;
      margin-left: 0;
      font-size: 19px;
      line-height: 1.62;
    }
    .point {
      display: flex;
      align-items: flex-start;
    }
    .number {
      width: 34px;
      flex: 0 0 34px;
      font-size: 20px;
    }
    .point-text { flex: 1; }
    .continued {
      padding-left: 34px;
    }
    .divider {
      height: 1px;
      background: #34424a;
      margin: 14px -23px 14px -2px;
      transform: rotate(-1deg);
    }
    .nucleus {
      position: relative;
      min-height: 370px;
      transform: rotate(-1deg);
    }
    .heading {
      font-size: 21px;
      margin-left: 0;
      white-space: nowrap;
    }
    .branch {
      position: absolute;
      left: 27px;
      top: 42px;
      width: 118px;
      height: 1px;
      background: #26323a;
      transform: rotate(-13deg);
    }
    .branch.two {
      top: 93px;
      width: 73px;
      transform: rotate(-5deg);
    }
    .branch.three {
      left: 53px;
      top: 139px;
      width: 1px;
      height: 91px;
      transform: rotate(-20deg);
    }
    .branch.four {
      left: 89px;
      top: 151px;
      width: 1px;
      height: 100px;
      transform: rotate(-25deg);
    }
    .nucleus-label {
      position: absolute;
      left: -13px;
      top: 93px;
      font-size: 20px;
    }
    .items {
      margin-left: 126px;
      margin-top: 10px;
      font-size: 20px;
      line-height: 1.52;
    }
    .items p { margin: 0 0 6px 0; }
    .items .indent { padding-left: 57px; }
    .chromatin {
      margin-top: 13px !important;
      margin-left: -12px;
    }
    .down-info {
      margin-left: 58px;
      line-height: 1.18;
    }
    .pore {
      margin-top: 15px !important;
      margin-left: -48px;
      white-space: nowrap;
    }
    .pore-next {
      margin-left: 28px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="gutter"></div>

    <section class="top-note ink">
      <div class="er">内质网</div>
      <div class="arrow-note">新 → 高尔基体</div>

      <div class="membrane">
        <div>cell膜主要的膜系统</div>
        <div class="cell-list">↙ cell膜<br>↙ cell器<br>　核膜</div>
      </div>

      <div class="action">作用</div>
      <div class="down">↓</div>

      <div class="points">
        <div class="point">
          <div class="number">①</div>
          <div class="point-text">使cell具有相对稳定的内部环境</div>
        </div>
        <div class="continued">同时，在cell与外部环境进行物质运输、能量转</div>
        <div class="continued">化、信息传递的过程中起着决定性作用。</div>

        <div class="point" style="margin-top:7px;">
          <div class="number">②</div>
          <div class="point-text">广阔的膜面积为多种酶提供了附着位点。</div>
        </div>

        <div class="point" style="margin-top:6px;">
          <div class="number">③</div>
          <div class="point-text">将各种cell器官分隔开，使cell内能够同时</div>
        </div>
        <div class="continued">进行。</div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="nucleus ink">
      <div class="heading">cell核为遗传物质储存和复制的主要场所</div>
      <div class="branch"></div>
      <div class="branch two"></div>
      <div class="branch three"></div>
      <div class="branch four"></div>
      <div class="nucleus-label">cell核</div>

      <div class="items">
        <p>核膜：双层，外膜</p>
        <p>核仁：与某种 RNA 的合成以及核糖</p>
        <p class="indent">体的形成有关</p>
        <p class="chromatin">染色质：由 DNA 和 protein 组成</p>
        <p class="down-info">↓ 遗传信息的载体</p>
        <p class="pore">核孔：实现核质之间频繁的物质交</p>
        <p class="pore-next">换和信息交流</p>
      </div>
    </section>
  </main>
</body>
</html>
