<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高频考点汇总</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      height: 720px;
      overflow: hidden;
    }
    body {
      background: #a7bd9d;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      color: #121212;
    }
    .page {
      position: relative;
      width: 504px;
      height: 678px;
      margin: 21px 18px;
      background: #fff;
      overflow: hidden;
      padding: 17px 17px 10px 17px;
    }
    h1 {
      margin: 0 0 4px 0;
      text-align: center;
      font-size: 27px;
      line-height: 34px;
      letter-spacing: 1px;
      font-weight: 800;
      color: #8f5f54;
      text-shadow: 1px 1px 0 #eed8cc;
    }
    .section-title {
      position: relative;
      z-index: 2;
      margin: 2px 0 2px 0;
      font-size: 23px;
      line-height: 31px;
      font-weight: 600;
      letter-spacing: .4px;
      color: #78b1b4;
      text-shadow: 1px 1px 0 #d8eeee;
    }
    .line {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 20px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: .6px;
      white-space: nowrap;
    }
    .tight { line-height: 37px; }
    .indent { padding-left: 0; }
    .stars {
      position: absolute;
      right: 105px;
      top: 376px;
      z-index: 1;
      color: #f58028;
      font-family: Arial, sans-serif;
      font-size: 39px;
      line-height: 45px;
      letter-spacing: 2px;
      font-weight: bold;
      transform: rotate(-4deg);
    }
    .placeholder {
      position: absolute;
      z-index: 1;
      color: transparent;
      font-size: 1px;
      overflow: hidden;
    }
    .bear-top {
      top: -17px;
      right: 111px;
      width: 88px;
      height: 95px;
      border-radius: 45% 45% 38% 38%;
      background:
        radial-gradient(circle at 27px 41px, #4c3429 0 2px, transparent 3px),
        radial-gradient(circle at 54px 41px, #4c3429 0 2px, transparent 3px),
        radial-gradient(ellipse at 41px 55px, #f3d3bd 0 10px, transparent 11px),
        radial-gradient(circle at 16px 9px, #be7d52 0 14px, transparent 15px),
        radial-gradient(circle at 68px 10px, #be7d52 0 14px, transparent 15px),
        #d99a6b;
      transform: rotate(10deg);
    }
    .cloud {
      top: 158px;
      right: 116px;
      width: 158px;
      height: 99px;
      border: 6px solid #b9b9b6;
      border-radius: 52px;
      background: #fffdf9;
    }
    .cloud:before, .cloud:after {
      content: "";
      position: absolute;
      background: #fffdf9;
      border: 6px solid #b9b9b6;
      border-bottom: 0;
      border-radius: 50px 50px 0 0;
    }
    .cloud:before {
      width: 68px;
      height: 56px;
      left: 20px;
      top: -30px;
    }
    .cloud:after {
      width: 58px;
      height: 45px;
      right: 17px;
      top: -20px;
    }
    .bottom-bear {
      right: 12px;
      bottom: -22px;
      width: 159px;
      height: 125px;
      border: 6px solid #a8aaa8;
      border-radius: 75px 75px 30px 30px;
      background:
        radial-gradient(circle at 53px 50px, #65a2ca 0 3px, transparent 4px),
        radial-gradient(circle at 105px 50px, #65a2ca 0 3px, transparent 4px),
        radial-gradient(circle at 75px 66px, #f4c2b5 0 8px, transparent 9px),
        radial-gradient(circle at 126px 66px, #f1c0b4 0 8px, transparent 9px),
        #fcf8ee;
    }
    .bottom-bear:before, .bottom-bear:after {
      content: "";
      position: absolute;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #80644f;
      top: -16px;
    }
    .bottom-bear:before { left: 27px; }
    .bottom-bear:after { right: 21px; }
    .footer {
      position: absolute;
      z-index: 3;
      right: 8px;
      bottom: 2px;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 9px;
      text-shadow: 0 1px 1px #849983;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder bear-top">[插图：顶部右侧小熊]</div>
    <div class="placeholder cloud">[插图：中部右侧云朵小熊]</div>
    <div class="placeholder bottom-bear">[插图：右下角小熊]</div>

    <h1>高频考点汇总</h1>

    <div class="section-title">(五)设计选项卡考点</div>
    <p class="line">1.设计—设置背景格式</p>
    <p class="line">2.设计幻灯片主题，调整主题字体</p>
    <p class="line">和主题颜色</p>

    <div class="section-title">(六)切换考点</div>
    <p class="line">1.基础考点</p>
    <p class="line">2.设置幻灯片自动放映：切换—</p>
    <p class="line">勾选【设置自动换片时间】</p>
    <p class="line">—设置时间—点击应用到全部</p>

    <div class="section-title">(七)动画考点</div>
    <div class="stars">★ ★ ★ ★ ★</div>
    <p class="line">1.常规考点，动画效果，设置多个动画，</p>
    <p class="line">利用【动画窗格】选择调整动画顺序</p>
    <p class="line">2.设置动画计时</p>

    <div class="section-title">(八)视图选项卡考点</div>
    <p class="line">1.颜色，灰度，黑白模式的调整</p>

    <div class="section-title">(九)幻灯片放映</div>
    <p class="line">设置幻灯片放映等</p>

    <div class="footer">From 小红书</div>
  </main>
</body>
</html>
