<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments - (Happiness of) Midsummer</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #faf9f3;
      color: #2878b8;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 540px;
      min-height: 720px;
      padding-top: 20px;
      overflow: hidden;
      background: #faf9f3;
    }

    .masthead {
      height: 84px;
      position: relative;
      width: 408px;
      margin: 0 auto;
      text-align: center;
      color: #2d7db9;
    }

    .masthead .the {
      display: block;
      margin-bottom: -2px;
      font-size: 17px;
      line-height: 17px;
      font-style: italic;
    }

    .masthead .happiness {
      display: block;
      font-size: 25px;
      line-height: 24px;
      font-style: italic;
    }

    .masthead .midsummer {
      display: block;
      margin-top: 1px;
      font-size: 26px;
      line-height: 27px;
    }

    .section-label,
    .season-label {
      position: absolute;
      bottom: 1px;
      font-size: 8px;
      line-height: 9px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }

    .section-label {
      left: 0;
    }

    .season-label {
      right: 0;
      font-style: italic;
    }

    .photo {
      width: 408px;
      height: 543px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background-color: #9ec5e2;
      background-image:
        linear-gradient(to bottom, rgba(61, 137, 199, .72) 0 43%, rgba(219, 233, 238, .95) 43% 51%, rgba(51, 55, 55, .98) 51% 67%, rgba(18, 22, 25, 1) 67% 100%);
    }

    .photo::before {
      content: "";
      position: absolute;
      left: -35px;
      top: 288px;
      width: 490px;
      height: 18px;
      background: #4b4f4d;
      transform: rotate(16deg);
      box-shadow: 0 18px 0 #1e2527, 0 36px 0 #111719;
    }

    .photo::after {
      content: "";
      position: absolute;
      right: 0;
      top: 15px;
      width: 42px;
      height: 350px;
      background: #172b1c;
      clip-path: polygon(75% 0, 100% 0, 100% 100%, 48% 100%, 62% 78%, 32% 62%, 60% 47%, 27% 30%, 58% 18%);
      opacity: .95;
    }

    .photo-caption {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 3px 5px;
      color: rgba(255, 255, 255, .75);
      font: 9px Arial, sans-serif;
      text-align: center;
      background: rgba(0, 0, 0, .18);
    }

    .footer {
      width: 408px;
      margin: 10px auto 0;
      text-align: center;
      color: #2c83c4;
    }

    .footer .title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 20px;
      font-weight: bold;
      letter-spacing: .2px;
    }

    .footer .subtitle {
      margin-top: 4px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      line-height: 10px;
      font-weight: bold;
    }

    .footer .poem {
      margin: 1px auto 0;
      width: 360px;
      font-size: 6.5px;
      line-height: 7px;
      color: #2875ad;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span class="the">The</span>
      <span class="happiness">(Happiness of)</span>
      <span class="midsummer">Midsummer®</span>
      <span class="section-label">MOMENTS</span>
      <span class="season-label">S/S 2023</span>
    </header>

    <figure class="photo placeholder">
      <figcaption class="photo-caption">[Photo: urban overpass beneath a blue sky]</figcaption>
    </figure>

    <footer class="footer">
      <div class="title">【2023仲夏 正在进行时】</div>
      <div class="subtitle">HAVE A GOOD ONE</div>
      <div class="poem">
        Through field do wander every where, Suffer the moon's sphere, To dew her orbs<br>
        upon the green: The cowslips full their pens? in their gold coats spots you see, Farewell, The gone
      </div>
    </footer>
  </main>
</body>
</html>
