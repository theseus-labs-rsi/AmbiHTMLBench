<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur The King Poster</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #171815;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poster {
      position: relative;
      width: min(100vw, 510px);
      height: min(147.85vw, 754px);
      min-height: 600px;
      margin: 0 auto;
      overflow: hidden;
      background: #6e7657;
      color: #fff;
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(23,31,18,.35), rgba(233,239,216,.08) 68%, rgba(244,240,202,.22)),
        linear-gradient(160deg, #566745 0%, #89916d 35%, #c5bea0 57%, #596b45 100%);
      color: rgba(255,255,255,.72);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 0;
    }
    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(7,10,7,.45), transparent 46%, rgba(255,255,255,.04)),
        linear-gradient(180deg, rgba(0,0,0,.11), transparent 40%, rgba(0,0,0,.12));
    }
    .actor {
      position: absolute;
      z-index: 2;
      top: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(13px, 3.7vw, 19px);
      font-weight: 700;
      letter-spacing: clamp(7px, 2.3vw, 12px);
      padding-left: 10px;
      white-space: nowrap;
    }
    .tagline {
      position: absolute;
      z-index: 2;
      top: 35.7%;
      left: 8.5%;
      font-size: clamp(8px, 1.85vw, 10px);
      line-height: 1.28;
      font-weight: 400;
      text-transform: uppercase;
    }
    .title {
      position: absolute;
      z-index: 2;
      top: 41.7%;
      left: 8.2%;
      width: 84%;
      color: #ffbe00;
      font-size: clamp(45px, 13.2vw, 68px);
      font-weight: 800;
      letter-spacing: clamp(8px, 3.1vw, 16px);
      line-height: 1;
    }
    .title span {
      display: block;
      margin-bottom: 1.12em;
      white-space: nowrap;
    }
    .title span:last-child { margin-bottom: 0; }
    .true-story {
      position: absolute;
      z-index: 2;
      right: 8.1%;
      bottom: 5.25%;
      width: 38%;
      text-align: center;
      font-size: clamp(9px, 2.1vw, 11px);
      line-height: 1.06;
      text-transform: uppercase;
    }
    .coming {
      position: absolute;
      z-index: 2;
      right: 9.8%;
      bottom: 2.55%;
      width: 31%;
      text-align: center;
      font-size: clamp(7px, 1.45vw, 8px);
      font-weight: 700;
      text-transform: uppercase;
    }
    .studio {
      position: absolute;
      z-index: 2;
      right: 10.2%;
      bottom: 1.15%;
      width: 30%;
      text-align: center;
      font-size: clamp(5px, 1.1vw, 6px);
      font-weight: 700;
      color: rgba(255,255,255,.82);
    }
    .rating {
      position: absolute;
      z-index: 2;
      left: 8.8%;
      bottom: 1.35%;
      border: 1px solid rgba(255,255,255,.45);
      width: 47px;
      height: 20px;
      color: rgba(255,255,255,.78);
      text-align: center;
      font-size: 7px;
      line-height: 18px;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Arthur The King film poster">
    <div class="placeholder">[Photo: man standing behind a golden dog outdoors]</div>
    <div class="shade"></div>

    <div class="actor">MARK WAHLBERG</div>

    <div class="tagline">
      AN UNEXPECTED ENCOUNTER<br>
      AN UNLIKELY BOND<br>
      AN UNFORGETTABLE ADVENTURE
    </div>

    <div class="title">
      <span>ARTHUR</span>
      <span>THE</span>
      <span>KING</span>
    </div>

    <div class="true-story">
      BASED ON THE<br>
      INCREDIBLE TRUE STORY
    </div>
    <div class="coming">COMING SOON</div>
    <div class="studio">LIONSGATE</div>
    <div class="rating">PG-13</div>
  </main>
</body>
</html>
