<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固化的做题思维</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #d8d1c3;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .photo {
      width: 540px;
      height: 405px;
      margin: 0 auto;
      padding: 9px 8px 10px;
      background: #151612;
      transform: rotate(0.6deg);
      box-shadow: 0 1px 5px rgba(0,0,0,.65);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(115deg, rgba(255,255,255,.22), transparent 43%),
        linear-gradient(145deg, transparent 70%, rgba(214,218,213,.25) 70.2%, transparent 70.5%),
        #f6f6f3;
      border: 1px solid #b3b6ae;
    }
    .status {
      position: absolute;
      top: 2px;
      left: 4px;
      color: #202020;
      font-family: Arial, sans-serif;
      font-size: 8px;
      line-height: 1;
    }
    .floating {
      position: absolute;
      top: 8px;
      left: 151px;
      width: 39px;
      height: 38px;
      border-radius: 9px;
      background: rgba(63, 67, 69, .64);
    }
    .floating::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      top: 7px;
      left: 10px;
      border-radius: 7px;
      background: rgba(160,164,163,.35);
    }
    .webcam {
      position: absolute;
      z-index: 2;
      top: 1px;
      right: 3px;
      width: 94px;
      height: 55px;
      border-left: 2px solid #293136;
      border-bottom: 2px solid #293136;
      background: linear-gradient(135deg, #7690a0 0 27%, #d8d3bc 27% 50%, #5f4733 50% 69%, #364140 69%);
      color: transparent;
    }
    .webcam::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 30px;
      top: 10px;
      left: 38px;
      border-radius: 50% 50% 42% 42%;
      background: #d5a38d;
      box-shadow: 0 -9px 0 4px #171515, 0 22px 0 6px #403037;
    }
    .content {
      position: absolute;
      left: 55px;
      top: 79px;
      width: 413px;
      color: #e02a2a;
      font-size: 13px;
      line-height: 1.15;
      font-weight: 400;
    }
    .heading {
      margin: 0 0 18px 0;
      font-size: 14px;
    }
    .line {
      height: 34px;
      white-space: nowrap;
    }
    .titleline {
      position: relative;
      height: 37px;
      color: #171717;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 19px;
      letter-spacing: 1px;
      text-align: center;
      padding-top: 1px;
    }
    .rule {
      position: absolute;
      left: 0;
    }
    .r6 {
      position: absolute;
      left: 193px;
      top: 0;
    }
    .note {
      position: absolute;
      left: 214px;
      top: 30px;
    }
  </style>
</head>
<body>
  <div class="photo">
    <main class="screen">
      <div class="status">19:29　5月14日周五</div>
      <div class="floating"></div>
      <div class="webcam placeholder">[视频画面]</div>

      <section class="content">
        <div class="heading">固化的做题思维：</div>
        <div class="line">1. 喜欢忠于自己的内心和感觉。</div>

        <div class="titleline">2017年 12月第一套 Text 1</div>

        <div class="line">2. 喜欢选符合常识的选项。　20年左右的常识和经验的累积</div>

        <div class="line">
          <span class="rule">3.　喜欢选自己认识的选项。</span>
          <span class="r6">6. 圈图看英译法</span>
        </div>

        <div class="line">
          <span class="rule">4. 喜欢选自己不认识的选项。</span>
          <span class="note">（有逃避，有厌烦）</span>
        </div>

        <div class="line">5. 火急火燎一把火</div>
      </section>
    </main>
  </div>
</body>
</html>
