<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.双脚打开，膝盖并拢</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      background: #f7f4df;
      color: #161616;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    .page {
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      padding: 51px 51px 70px;
      position: relative;
    }
    .topmark {
      height: 25px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }
    .brand {
      margin-top: 3px;
    }
    .number {
      width: 24px;
      height: 24px;
      margin-left: 6px;
      border: 2px solid #141414;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }
    h1 {
      margin: 46px 0 55px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
    }
    p {
      margin: 0;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0;
    }
    .emphasis {
      margin-top: 32px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topmark">
      <span class="brand">© NANAO_</span>
      <span class="number">12</span>
    </div>

    <h1>A.双脚打开，膝盖并拢</h1>

    <p>
      采用这种坐姿的人大多比较内敛，性格上不太主<br>
      动，随波逐流，没有太多的规划。他们的心理年<br>
      龄比较小，会给人一种幼稚单纯的感觉，不过也<br>
      很善良。这种人往往有着非常生动的想象力，内<br>
      心世界很丰富，有着有趣的灵魂。深入接触以后<br>
      会给人一种自在舒适的体验。
    </p>

    <p class="emphasis">
      这类人在爱情中往往处于被动的一方，不太会表达自<br>
      己的感受，需要别人照顾，喜欢成熟一点的异性。他<br>
      们一旦付出真情实感，就很容易全身心投入，也经常<br>
      受伤。但是他们有时候又很自我对自己没有兴趣的异<br>
      性完全不会给他们面子。如果遇到了合适的人，他们<br>
      会很幸福，在婚姻中也属于被照顾的一方，完全不用<br>
      操心。
    </p>
  </main>
</body>
</html>
