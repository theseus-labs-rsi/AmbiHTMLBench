<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五大学科竞赛国家集训队名单</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #fbfdf9;
      background-image:
        linear-gradient(rgba(113, 192, 199, .26) 1px, transparent 1px),
        linear-gradient(90deg, rgba(113, 192, 199, .26) 1px, transparent 1px),
        linear-gradient(rgba(113, 192, 199, .12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(113, 192, 199, .12) 1px, transparent 1px);
      background-size: 16px 16px, 16px 16px, 4px 4px, 4px 4px;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", cursive;
      color: #202020;
    }
    .page {
      width: 540px;
      min-height: 720px;
      position: relative;
      padding-top: 2px;
      overflow: hidden;
    }
    h1 {
      margin: 0 0 12px 25px;
      color: #262070;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 29px;
      line-height: 1.05;
      letter-spacing: 4px;
      font-weight: bold;
      white-space: nowrap;
      transform: rotate(-1deg);
    }
    .content {
      position: relative;
      padding-left: 38px;
      padding-right: 24px;
      color: #e95858;
      font-size: 27px;
      font-weight: bold;
      line-height: 1.55;
      letter-spacing: 2px;
    }
    .line {
      position: relative;
      min-height: 42px;
    }
    .line::before {
      content: "";
      position: absolute;
      left: -23px;
      top: 15px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #9eabb5;
    }
    .indent { padding-left: 8px; }
    .sticky {
      position: absolute;
      right: 27px;
      top: 46px;
      width: 136px;
      height: 158px;
      padding: 11px 13px;
      background: #fff5bd;
      border: 1px solid #c8ba76;
      box-shadow: 2px 3px 4px rgba(80, 70, 30, .3);
      color: #111;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.65;
      transform: rotate(2deg);
      z-index: 2;
    }
    .sticky::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 0;
      height: 0;
      border-top: 24px solid #e6d995;
      border-left: 24px solid transparent;
    }
    .table-wrap {
      margin: 38px 16px 0 43px;
      position: relative;
    }
    .table-wrap::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 9px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #9eabb5;
      box-shadow:
        0 46px #9eabb5,
        0 91px #9eabb5,
        0 136px #9eabb5,
        0 181px #9eabb5;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 19px;
      text-align: center;
      background: rgba(255,255,255,.55);
    }
    th, td {
      border: 1px solid #a6b76a;
      height: 29px;
      padding: 1px 5px;
    }
    th {
      background: #91b34b;
      color: #f8f7de;
      font-weight: normal;
      height: 30px;
    }
    tbody tr:nth-child(odd) td {
      background: rgba(196, 216, 151, .55);
    }
    tbody tr:nth-child(even) td {
      background: rgba(255, 255, 250, .65);
    }
  </style>
</head>
<body>
  <main class="page">

    <aside class="sticky">

      数竞64人<br>
      化竞47人<br>
      物竞43人

    <section class="content">

      <div class="line">学科奥赛国家集训队</div>

      <div class="line">人数为274人。其中</div>
      <div class="line indent">生物学科人数最多</div>
      <div class="line indent">为67人；其次是数学学科，为64</div>

      <div class="line">43人！</div>

            <th>2022年</th>
            <th>2021年</th>

        </thead>
        <tbody>
          <tr>
            <td>数学</td>
            <td>19</td>
            <td>32</td>
            <td>13</td>
            <td>64</td>
          </tr>
          <tr>
            <td>化学</td>
            <td>47</td>
            <td></td>
            <td></td>
            <td>47</td>
          </tr>
          <tr>
            <td>物理</td>
            <td>37</td>
            <td>6</td>
            <td></td>
            <td>43</td>
          </tr>
          <tr>
            <td>生物</td>
            <td>58</td>
            <td>9</td>
            <td></td>
            <td>67</td>
          </tr>
          <tr>
            <td>信息学</td>
            <td>34</td>
            <td>13</td>
            <td></td>
            <td>53</td>
          </tr>
          <tr>
            <td>合计</td>
            <td></td>
            <td></td>
            <td></td>
            <td>274</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
