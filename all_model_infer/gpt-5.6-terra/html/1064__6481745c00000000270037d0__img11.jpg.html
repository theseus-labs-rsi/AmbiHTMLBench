<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>话题、主题意义、主题的联系与区别</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef0f2;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", SimHei, Arial, sans-serif;
      color: #151515;
    }
    .page {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(to bottom, #f4f5f5 0 47.8%, #ffffff 47.8% 60.4%, #e9eaec 60.4% 100%);
    }

    .title-box {
      width: 476px;
      height: 74px;
      margin: 18px auto 23px;
      border: 2px solid #555;
      background: #fcfcfc;
      text-align: center;
      font-size: 21px;
      line-height: 25px;
      padding-top: 9px;
      font-weight: 400;
    }

    .comparison {
      width: 506px;
      margin: 0 auto;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 16px;
      background: rgba(255,255,255,.45);
    }
    .comparison col:first-child { width: 92px; }
    .comparison col:nth-child(2) { width: 121px; }
    .comparison col:nth-child(3) { width: 150px; }
    .comparison col:nth-child(4) { width: 143px; }
    .comparison th, .comparison td {
      border: 1px solid rgba(255,255,255,.75);
      height: 43px;
      padding: 4px 6px;
      vertical-align: middle;
      text-align: left;
      white-space: nowrap;
    }
    .comparison thead th {
      height: 47px;
      color: white;
      background: #b1b613;
      text-align: center;
      font-weight: normal;
    }
    .comparison thead th:first-child {
      text-align: left;
      padding-left: 8px;
      position: relative;
    }
    .comparison thead th:first-child .concept {
      display: block;
      text-align: center;
      margin-top: -12px;
    }
    .comparison thead th:first-child .dimension {
      position: absolute;
      left: 7px;
      bottom: 6px;
    }
    .comparison tbody th {
      color: white;
      background: #b5b914;
      text-align: center;
      font-weight: normal;
    }
    .comparison tbody td {
      background: rgba(247,247,224,.72);
    }
    .comparison tbody tr:nth-child(odd) td {
      background: rgba(235,238,208,.74);
    }
    .comparison .small { font-size: 15px; white-space: normal; line-height: 18px; }

    .middle-title {
      height: 100px;
      padding-top: 23px;
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      line-height: 34px;
      letter-spacing: -1px;
      color: #fbf32e;
      text-shadow:
        -2px -2px 0 #111,
        2px -2px 0 #111,
        -2px 2px 0 #111,
        2px 2px 0 #111,
        3px 3px 0 #111;
      transform: skewX(-4deg);
    }

    .bottom-title {
      width: 366px;
      height: 58px;
      margin: 11px auto 0;
      border: 1.6px solid #444;
      background: #fbfbfb;
      text-align: center;
      font-size: 17px;
      line-height: 21px;
      padding-top: 8px;
    }

    .diagram {
      position: relative;
      width: 520px;
      height: 197px;
      margin: 20px auto 0;
      font-size: 16px;
    }
    .step {
      position: absolute;
      color: #202020;
    }
    .step .white {
      background: #f9f9f4;
      border-top: 8px solid #b3b714;
      padding: 8px 10px 4px;
      height: 50px;
      line-height: 20px;
    }
    .step .bar {
      color: white;
      background: #28799e;
      text-align: center;
      height: 41px;
      padding-top: 4px;
      line-height: 19px;
    }
    .step .bar small {
      font-size: 10px;
      display: block;
      color: white;
      line-height: 11px;
    }

    .s1 { left: 0; top: 48px; width: 174px; }
    .s1:before {
      content: "";
      position: absolute;
      top: -16px;
      right: 0;
      border-bottom: 16px solid #b3b714;
      border-left: 29px solid transparent;
    }
    .s1 .white { width: 164px; }
    .s1 .bar { width: 174px; }

    .s2 { left: 177px; top: 25px; width: 177px; }
    .s2:before {
      content: "";
      position: absolute;
      top: -16px;
      right: 4px;
      border-bottom: 16px solid #b3b714;
      border-left: 29px solid transparent;
    }
    .s2 .white { width: 164px; margin-left: 10px; height: 58px; padding-top: 7px; }
    .s2 .bar { width: 177px; background: #e7b80c; height: 53px; padding-top: 4px; }
    .s2 .bar small { color: #fff9d3; }

    .s3 { left: 356px; top: 0; width: 172px; }
    .s3 .white {
      width: 162px;
      margin-left: 10px;
      height: 58px;
      border-top-width: 8px;
      padding-top: 6px;
    }
    .s3 .white:after {
      content: "";
      position: absolute;
      top: 35px;
      right: 0;
      border-top: 18px solid transparent;
      border-left: 18px solid #b3b714;
    }
    .s3 .bar {
      width: 162px;
      margin-left: 10px;
      background: #b6b915;
      height: 43px;
      padding-top: 4px;
    }
    .s3 .bar small {
      font-size: 9px;
      color: #fffde6;
      white-space: nowrap;
    }

    .arrow-base {
      position: absolute;
      z-index: 0;
      height: 18px;
      left: 0;
      bottom: 14px;
      width: 487px;
      background: #28799e;
    }
    .arrow-base:after {
      content: "";
      position: absolute;
      top: -13px;
      right: -27px;
      border-left: 27px solid #28799e;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
    }
    .yellow-arrow {
      position: absolute;
      z-index: 1;
      left: 178px;
      top: 91px;
      width: 306px;
      height: 41px;
      background: #e7b80c;
      color: white;
      text-align: center;
      padding-top: 7px;
      line-height: 15px;
    }
    .yellow-arrow:after {
      content: "";
      position: absolute;
      right: -25px;
      top: 0;
      border-left: 25px solid #e7b80c;
      border-top: 20px solid transparent;
      border-bottom: 21px solid transparent;
    }
    .yellow-arrow small {
      display: block;
      color: #fff8ca;
      font-size: 10px;
      line-height: 11px;
    }
    .source {
      position: absolute;
      right: 39px;
      bottom: -7px;
      font-size: 11px;
      color: #5c5c5c;
    }
    .corner-mark {
      position: absolute;
      right: -1px;
      bottom: -9px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4ca1d4;
      color: white;
      font-size: 8px;
      text-align: center;
      line-height: 16px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title-box">
      话题、主题意义、主题的联系与区别<br>
      （读者视角）
    </div>

    <table class="comparison" aria-label="话题主题比较表">
      <colgroup><col><col><col><col></colgroup>
      <thead>
        <tr>
          <th><span class="concept">概念</span><span class="dimension">维度</span></th>
          <th>话题</th>
          <th>主题意义</th>
          <th>主题</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>意义特征</th>
          <td>具体</td>
          <td>界于二者之间</td>
          <td>抽象</td>
        </tr>
        <tr>
          <th>表达方式</th>
          <td>直接</td>
          <td>蕴含</td>
          <td>拓展</td>
        </tr>
        <tr>
          <th>核心意义</th>
          <td>语篇讨论的中心</td>
          <td>语篇的寓意</td>
          <td>语篇寓意所隐的范畴</td>
        </tr>
        <tr>
          <th>本质特征</th>
          <td>特定性</td>
          <td class="small">由语篇内容延伸的普<br>遍性（公理性的）</td>
          <td>普遍性</td>
        </tr>
      </tbody>
    </table>

    <div class="middle-title">
      话题，主题意义，主题<br>
      与学习活动的层次息息相关
    </div>

    <div class="bottom-title">
      话题、主题意义、主题的联系与区别<br>
      （学习视角）
    </div>

    <div class="diagram">
      <div class="arrow-base"></div>

      <div class="step s1">
        <div class="white">基于语篇的学习<br>为主</div>
        <div class="bar">话题<small>What+How</small></div>
      </div>

      <div class="step s2">
        <div class="white">深入语篇的学习<br>为主</div>
        <div class="bar">主题意义<small>Why+How</small></div>
      </div>

      <div class="step s3">
        <div class="white">超越语篇的学习<br>为主</div>
        <div class="bar">主题<small>What+Why+How+So what (else)</small></div>
      </div>

      <div class="yellow-arrow">主题意义<small>Why+How</small></div>
      <div class="source">（陈晓芳，2022：出版中）</div>
      <div class="corner-mark">图</div>
    </div>
  </div>
</body>
</html>
