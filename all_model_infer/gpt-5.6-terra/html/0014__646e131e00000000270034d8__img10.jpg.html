<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老吴の创业随笔</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      background: #d7b184;
      color: #16120e;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "FangSong", serif;
    }
    .page {
      position: relative;
      width: min(540px, 100vw);
      min-height: 720px;
      overflow: hidden;
      padding: 35px 24px 28px;
      background-color: #d9b88e;
      background-image:
        radial-gradient(circle at 14% 9%, rgba(102, 60, 29, .22) 0 1px, transparent 2px),
        radial-gradient(circle at 77% 21%, rgba(98, 55, 28, .18) 0 1px, transparent 2px),
        radial-gradient(circle at 34% 79%, rgba(115, 70, 34, .15) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 88%, rgba(91, 52, 26, .14) 0 1px, transparent 2px),
        linear-gradient(90deg, rgba(116, 71, 34, .09), transparent 16%, transparent 84%, rgba(116, 71, 34, .10));
      background-size: 17px 19px, 23px 29px, 31px 27px, 19px 23px, 100% 100%;
      box-shadow: inset 0 0 28px rgba(89, 47, 20, .20);
    }
    .title {
      margin: 0;
      text-align: center;
      font-size: 27px;
      line-height: 1.1;
      font-weight: 500;
    }
    .quote {
      margin: 39px 0 0;
      font-size: 39px;
      line-height: 1.9;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .quote .line {
      display: block;
    }
    .footer {
      position: absolute;
      right: 0;
      bottom: 27px;
      left: 0;
      text-align: center;
      font-size: 23px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    @media (max-width: 500px) {
      .page { min-height: 133.33vw; }
      .quote { font-size: 7.22vw; }
      .footer { font-size: 4.26vw; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">老吴の创业随笔</h1>
    <div class="quote">
      <span class="line">《易经》中说：“小财</span>
      <span class="line">靠勤，大财靠德，德不厚</span>
      <span class="line">，无以载物。” 靠出卖时</span>
      <span class="line">间和劳动力 赚钱的人，</span>
      <span class="line">只能发点小财。一个人每</span>
      <span class="line">天，时间有限，精力有限</span>
      <span class="line">，分身乏术。</span>
    </div>
    <div class="footer">商业思维|个人提升|创业心得|认知觉醒</div>
  </main>
</body>
</html>
