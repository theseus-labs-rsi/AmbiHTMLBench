<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asgari Ücret Poster</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 78px 20px 110px;
      background:
        radial-gradient(ellipse at 15% 25%, rgba(85,78,63,.18) 0 1px, transparent 2px),
        radial-gradient(ellipse at 74% 60%, rgba(60,55,43,.15) 0 1px, transparent 2px),
        radial-gradient(ellipse at 32% 86%, rgba(110,98,75,.13) 0 2px, transparent 3px),
        linear-gradient(100deg, #aaa999, #c5c3af 35%, #b0b09f 68%, #cfcebc);
      background-size: 19px 22px, 27px 31px, 42px 38px, auto;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poster {
      width: 560px;
      height: 810px;
      overflow: hidden;
      position: relative;
      transform: rotate(1deg);
      background: #f4f4f1;
      box-shadow: 0 1px 1px rgba(0,0,0,.12);
    }
    .top {
      height: 330px;
      position: relative;
      padding: 27px 30px 20px 82px;
      background:
        linear-gradient(105deg, rgba(255,255,255,.08), transparent 35%, rgba(180,130,0,.04)),
        #f4e52a;
    }
    .headline-list {
      position: relative;
      z-index: 2;
      width: 285px;
    }
    .bullet-row {
      position: relative;
      font-family: Arial Black, Arial, sans-serif;
      color: #282525;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1.7px;
      line-height: 1.13;
      margin: 0 0 21px;
    }
    .bullet-row:last-child { margin-top: 5px; }
    .pin {
      position: absolute;
      left: -48px;
      top: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #bb3335;
      box-shadow: 3px 4px 0 #702b2c, 1px 16px 0 -4px #e3e5db;
    }
    .pin:after {
      content: "";
      position: absolute;
      width: 5px;
      height: 15px;
      background: #90383a;
      transform: rotate(-42deg);
      left: 8px;
      top: 9px;
      border-radius: 4px;
    }
    .placeholder {
      display: flex;
      justify-content: center;
      align-items: center;
      color: transparent;
      overflow: hidden;
    }
    .chart {
      position: absolute;
      right: 26px;
      top: 34px;
      width: 220px;
      height: 207px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(0deg, transparent 0 32px, rgba(255,235,141,.34) 33px 36px),
        repeating-linear-gradient(90deg, transparent 0 53px, rgba(255,235,141,.22) 54px 56px),
        #d7753c;
      opacity: .95;
    }
    .chart .rising-line {
      position: absolute;
      width: 145px;
      height: 12px;
      left: 38px;
      top: 95px;
      background: #bd3131;
      transform: rotate(-39deg);
      transform-origin: left center;
      box-shadow: 0 0 0 6px #34302c;
    }
    .chart .rising-line:after {
      content: "";
      position: absolute;
      right: -15px;
      top: -11px;
      width: 0;
      height: 0;
      border-left: 29px solid #bd3131;
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
    }
    .chart .coin {
      position: absolute;
      left: 27px;
      bottom: 24px;
      width: 68px;
      height: 68px;
      border: 7px solid #41352c;
      border-radius: 50%;
      background: #ddc831;
      color: #eee7a8;
      font: bold 38px Georgia, serif;
      text-align: center;
      line-height: 55px;
    }
    .chart .notes {
      position: absolute;
      width: 76px;
      height: 51px;
      right: 26px;
      bottom: 25px;
      border: 4px solid #d2b735;
      background: repeating-linear-gradient(0deg, #e7cf3c 0 11px, #fff0b1 12px 16px);
      box-shadow: 6px -3px 0 #f6e797, 11px -6px 0 #d5c43e;
    }
    .mid {
      height: 175px;
      padding: 25px 31px 15px;
      background: #f2f3f0;
    }
    .red-message {
      color: #bc3030;
      font-family: Arial Black, Arial, sans-serif;
      font-size: 50px;
      line-height: 1.26;
      letter-spacing: -2.8px;
      font-weight: 900;
    }
    .banner {
      height: 108px;
      display: flex;
      align-items: center;
      padding-left: 31px;
      background:
        linear-gradient(10deg, rgba(255,255,255,.05), transparent 45%),
        #ba2928;
    }
    .banner span {
      font-family: Arial Black, Arial, sans-serif;
      font-size: 57px;
      font-weight: 900;
      color: #f3f2ed;
      letter-spacing: -3.4px;
      white-space: nowrap;
    }
    .bottom {
      height: 197px;
      position: relative;
      background: #f1f2ef;
      padding-top: 33px;
    }
    .party {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      color: #b5292d;
    }
    .emblem {
      position: relative;
      width: 91px;
      height: 91px;
      flex: 0 0 91px;
    }
    .emblem .gear {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 13px dashed #b52c2f;
      transform: rotate(6deg);
    }
    .emblem .core {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 52px;
      height: 52px;
      border: 2px solid #b52c2f;
      border-radius: 50%;
      background: #d7cf29;
      color: #b52c2f;
      font-family: Arial Black, Arial, sans-serif;
      font-size: 17px;
      font-weight: 900;
      line-height: 48px;
      text-align: center;
    }
    .party-name {
      font-family: Arial Black, Arial, sans-serif;
      font-weight: 900;
      color: #b52d2e;
      font-size: 27px;
      line-height: 1.12;
      letter-spacing: -.8px;
    }
    .party-name small {
      display: block;
      font-size: 17px;
      letter-spacing: -.4px;
      margin-top: 3px;
    }
    .contact {
      position: absolute;
      left: 31px;
      bottom: 26px;
      display: flex;
      align-items: center;
      gap: 24px;
      color: #ad3034;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .contact-item { display: flex; align-items: center; gap: 7px; }
    .social-icon {
      width: 29px;
      height: 29px;
      border: 3px solid #ad3034;
      border-radius: 4px;
      color: #ad3034;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: bold 21px Arial, sans-serif;
      line-height: 1;
    }
    .instagram { border-radius: 8px; font-size: 0; position: relative; }
    .instagram:before {
      content: "";
      width: 9px;
      height: 9px;
      border: 3px solid #ad3034;
      border-radius: 50%;
    }
    .instagram:after {
      content: "";
      position: absolute;
      right: 4px;
      top: 4px;
      width: 4px;
      height: 4px;
      background: #ad3034;
      border-radius: 50%;
    }
    .phone {
      border-radius: 50%;
      font-size: 19px;
      transform: rotate(-20deg);
    }
  </style>
</head>
<body>
  <main class="poster">
    <section class="top">
      <div class="headline-list">
        <div class="bullet-row"><span class="pin"></span>Enflasyon<br>yükseliyor</div>
        <div class="bullet-row"><span class="pin"></span>TL değer<br>kaybediyor</div>
        <div class="bullet-row"><span class="pin"></span>Ücretler eriyor</div>
      </div>
      <div class="placeholder chart" aria-label="[Illustration: rising inflation arrow, coin and banknotes]">
        <div class="rising-line"></div>
        <div class="coin">1</div>
        <div class="notes"></div>
      </div>
    </section>

    <section class="mid">
      <div class="red-message">Vergiden muaf,<br>İnsanca yaşanacak</div>
    </section>

    <section class="banner">
      <span>ASGARİ ÜCRET!</span>
    </section>

    <section class="bottom">
      <div class="party">
        <div class="emblem placeholder" aria-label="[Emek Partisi emblem]">
          <div class="gear"></div>
          <div class="core">EMEP</div>
        </div>
        <div class="party-name">EMEK<br>PARTİSİ<small>Ankara İl Örgütü</small></div>
      </div>
      <div class="contact">
        <div class="contact-item"><span class="social-icon">f</span><span>/ankaraemep</span></div>
        <div class="contact-item"><span class="social-icon instagram"></span><span>@emepankara</span></div>
        <div class="contact-item"><span class="social-icon phone">⌕</span><span>0 (312) 232 41 97</span></div>
      </div>
    </section>
  </main>
</body>
</html>
