<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨读笔记</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ece8dc;
      color: #857d6d;
      font-family: "Songti SC", "SimSun", serif;
    }
    .page {
      width: 540px;
      min-height: 769px;
      margin: 0 auto;
      padding: 0 7px 17px;
      background-color: #f4f1e6;
      background-image:
        linear-gradient(rgba(183,174,152,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(183,174,152,.07) 1px, transparent 1px);
      background-size: 9px 9px;
    }
    .topnav {
      height: 24px;
      margin: 0 -7px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      background: rgba(192,177,145,.57);
      border-bottom: 1px solid #aaa18f;
      color: #897f6c;
      font-size: 10px;
      letter-spacing: 2px;
    }
    .topnav span {
      text-align: center;
      padding-top: 6px;
      border-right: 1px solid rgba(133,124,106,.38);
    }
    .topnav span:nth-child(6) {
      background: rgba(162,143,105,.18);
    }
    .title {
      height: 41px;
      display: flex;
      align-items: center;
      padding-left: 4px;
      font-size: 16px;
      letter-spacing: 4px;
      color: #777062;
    }
    .title b {
      font-size: 13px;
      padding-right: 8px;
      font-weight: normal;
    }
    .sheet {
      width: 100%;
      border: 1px solid #c8c2b4;
      border-bottom: none;
      font-size: 10px;
      color: #8c8474;
    }
    .line {
      height: 30px;
      border-bottom: 1px solid #cbc5b7;
      padding: 8px 20px;
      letter-spacing: 1px;
    }
    .comment-row {
      height: 30px;
      padding: 8px 20px;
      border-bottom: 1px solid #c8c2b4;
      letter-spacing: 1px;
    }
    .issue-area {
      display: grid;
      grid-template-columns: 60px 1fr;
      height: 111px;
      border-bottom: 1px solid #c8c2b4;
    }
    .issue-list {
      padding: 8px 7px;
      border-right: 1px solid #cbc5b7;
      line-height: 24px;
      white-space: nowrap;
    }
    .radio {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 5px;
      border: 1px solid #c9c2b4;
      border-radius: 50%;
      vertical-align: -1px;
    }
    .writing {
      background-image:
        linear-gradient(rgba(194,186,166,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(194,186,166,.07) 1px, transparent 1px);
      background-size: 9px 9px;
    }
    .analysis-head {
      height: 30px;
      display: grid;
      grid-template-columns: 1.1fr 1.1fr .9fr;
      border-bottom: 1px solid #c8c2b4;
    }
    .analysis-head div {
      padding-top: 8px;
      text-align: center;
      border-right: 1px solid #c8c2b4;
      letter-spacing: 1px;
    }
    .analysis-head div:last-child { border-right: none; }
    .analysis-body {
      height: 193px;
      display: grid;
      grid-template-columns: 1.1fr 1.1fr .9fr;
      border-bottom: 1px solid #c8c2b4;
    }
    .analysis-body div {
      border-right: 1px solid #c8c2b4;
    }
    .analysis-body div:last-child { border-right: none; }
    .transfer {
      height: 89px;
      display: grid;
      grid-template-columns: 60px 1fr;
      border-bottom: 1px solid #c8c2b4;
    }
    .transfer-label {
      padding: 32px 8px;
      border-right: 1px solid #c8c2b4;
      white-space: nowrap;
      letter-spacing: 1px;
    }
    .method {
      height: 81px;
      display: grid;
      grid-template-columns: 60px 1fr;
      border-bottom: 1px solid #c8c2b4;
    }
    .method .transfer-label {
      padding-top: 30px;
    }
    .summary {
      height: 31px;
      padding: 8px 18px;
      letter-spacing: 2px;
      border-bottom: 1px solid #c8c2b4;
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="topnav">
      <span>行测</span>
      <span>常识</span>
      <span>言语</span>
      <span>数量</span>
      <span>判断</span>
      <span>资料</span>
      <span>申论</span>
      <span>联系</span>
      <span>计划</span>
    </nav>

    <div class="title"><b>·</b>晨读笔记</div>

    <section class="sheet">
      <div class="line">主题</div>
      <div class="line">应用领域</div>
      <div class="line">热门事件</div>
      <div class="line">宏观政策</div>
      <div class="comment-row">媒体评论</div>

      <div class="issue-area">
        <div class="issue-list">
          <div><span class="radio"></span>意义</div>
          <div><span class="radio"></span>原因</div>
          <div><span class="radio"></span>问题</div>
          <div><span class="radio"></span>危害</div>
        </div>
        <div class="writing"></div>
      </div>

      <div class="analysis-head">
        <div><span class="radio"></span>问题分析</div>
        <div><span class="radio"></span>现象分析</div>
        <div>对策分析</div>
      </div>

      <div class="analysis-body writing">
        <div></div>
        <div></div>
        <div></div>
      </div>

      <div class="transfer">
        <div class="transfer-label">句子迁移</div>
        <div class="writing"></div>
      </div>

      <div class="method">
        <div class="transfer-label">方法迁移</div>
        <div class="writing"></div>
      </div>

      <div class="summary">总结</div>
    </section>
  </main>
</body>
</html>
