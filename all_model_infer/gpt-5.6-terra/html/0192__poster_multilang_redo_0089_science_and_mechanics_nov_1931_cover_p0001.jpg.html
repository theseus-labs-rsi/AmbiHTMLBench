<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science and Mechanics Cover</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #ee310c;
      color: #fff8df;
      font-family: Georgia, "Times New Roman", serif;
    }
    .cover {
      position: relative;
      width: min(100vw, 760px);
      aspect-ratio: 0.75;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: #f1310b;
    }
    .topline {
      position: absolute;
      top: 1.1%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #f5d35f;
      font: bold 2.25vw/1 Arial, sans-serif;
      letter-spacing: .44em;
      text-indent: .44em;
      text-shadow: 1px 1px 0 #9f2a19;
    }
    .date {
      position: absolute;
      top: 1.25%;
      right: 4.6%;
      color: #f3d75f;
      font: italic bold 1.55vw Georgia, serif;
      text-shadow: 1px 1px 0 #4f3528;
    }
    .masthead {
      position: absolute;
      z-index: 2;
      left: 2%;
      top: 2%;
      width: 83%;
      color: #f8f4df;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: bold;
      line-height: .7;
      letter-spacing: -.08em;
      text-shadow: 2px 2px 0 #11172b, -1px -1px 0 #11172b, 3px 3px 0 #b3301b;
    }
    .masthead .science {
      display: block;
      font-size: 12.6vw;
      transform: skew(-3deg);
    }
    .masthead .and {
      position: absolute;
      top: 24%;
      left: 73%;
      white-space: nowrap;
      font-size: 7.6vw;
      font-style: italic;
      transform: skew(-7deg);
    }
    .masthead .mechanics {
      display: block;
      margin-top: .06em;
      margin-left: 13%;
      font-size: 11.7vw;
      transform: skew(-2deg);
    }
    .editor {
      position: absolute;
      top: 23.2%;
      left: 31%;
      width: 30%;
      color: #efd56a;
      text-align: center;
      font: bold 1.5vw/1.25 Arial, sans-serif;
      letter-spacing: .06em;
      text-shadow: 1px 1px #673226;
    }
    .editor span {
      display: block;
      font-size: 1.7vw;
      letter-spacing: .08em;
    }
    .badge {
      position: absolute;
      z-index: 3;
      top: 5.4%;
      right: 2.2%;
      width: 11%;
      height: 9.5%;
      border: .33vw solid #2b2a24;
      border-radius: 42% 42% 48% 48%;
      background: #d59d47;
      color: #222;
      text-align: center;
      padding-top: 1.25vw;
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 .35vw #e4d78a;
      font: bold 1.05vw/1.05 Georgia, serif;
    }
    .badge b { display: block; font-size: 1.26vw; }
    .price {
      position: absolute;
      z-index: 3;
      top: 18.1%;
      right: 4.7%;
      color: #f2d55d;
      font: bold italic 2.25vw/1 Georgia, serif;
      text-align: center;
      text-shadow: 1px 1px #5d4533;
      transform: rotate(7deg);
    }
    .price span { display: block; font-size: 1.65vw; }
    .left-copy {
      position: absolute;
      z-index: 3;
      top: 45.3%;
      left: 2%;
      width: 23%;
      color: #ffe88c;
      text-align: center;
      font: bold 1.78vw/1.35 "Trebuchet MS", Arial, sans-serif;
      text-shadow: 1px 1px #943b1d;
    }
    .left-copy .page {
      display: block;
      margin-top: 1.4vw;
      color: #fff6e2;
    }
    .issue {
      position: absolute;
      z-index: 3;
      top: 65%;
      right: 3.5%;
      width: 32%;
      color: #ffe682;
      text-align: center;
      font: 1.8vw/1.2 Georgia, serif;
      text-shadow: 1px 1px #963219;
    }
    .issue strong {
      display: block;
      margin-top: 1.35vw;
      color: #fff5df;
      font: 3vw/1.08 "Trebuchet MS", Arial, sans-serif;
      letter-spacing: .03em;
    }
    .placeholder {
      position: absolute;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
    }
    .rocket {
      top: 15%;
      left: 12%;
      width: 86%;
      height: 62%;
      transform: rotate(-27deg);
    }
    .rocket .body {
      position: absolute;
      width: 39%;
      height: 86%;
      border: .55vw solid #172635;
      border-radius: 50% 50% 43% 43%;
      background:
        repeating-linear-gradient(90deg, transparent 0 13%, rgba(14, 29, 52, .9) 14% 18%, transparent 19% 32%),
        linear-gradient(90deg, #bfc1ba 0 16%, #f7f2dc 17% 38%, #173456 39% 53%, #e6e1ce 54% 73%, #6c7c80 74% 100%);
      box-shadow: inset 1.2vw 0 1.2vw rgba(255,255,255,.5), inset -1vw 0 1vw rgba(0,0,0,.3);
    }
    .rocket .nose {
      position: absolute;
      top: -5%;
      left: 18%;
      width: 64%;
      height: 29%;
      border: .55vw solid #172635;
      border-bottom: 0;
      border-radius: 50% 50% 20% 20%;
      background: linear-gradient(90deg, #d7d4c7, #153354 54%, #d6d3c8);
    }
    .rocket .ring {
      position: absolute;
      z-index: 2;
      width: 55%;
      height: 10%;
      border: .45vw solid #191b20;
      border-radius: 48%;
      background: repeating-linear-gradient(90deg, #cbc8ba 0 13%, #172945 14% 18%, #efebd9 19% 29%);
    }
    .rocket .r1 { top: 23%; left: -8%; }
    .rocket .r2 { top: 48%; right: -10%; }
    .rocket .r3 { top: 66%; left: -9%; }
    .rocket .fin {
      position: absolute;
      bottom: 7%;
      width: 38%;
      height: 23%;
      background: #17355a;
      border: .5vw solid #172635;
    }
    .rocket .fin.left { left: -25%; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .rocket .fin.right { right: -25%; clip-path: polygon(0 0, 100% 100%, 0 100%); }
    .rocket .flame {
      position: absolute;
      bottom: -24%;
      width: 16%;
      height: 31%;
      border-radius: 0 0 50% 50%;
      background: linear-gradient(90deg, #fffce6 0 20%, #f4c425 35% 70%, #fff5b0 100%);
      box-shadow: 0 0 1.6vw .8vw rgba(255,241,158,.75);
    }
    .rocket .f1 { left: 10%; }
    .rocket .f2 { left: 41%; height: 38%; }
    .rocket .f3 { right: 8%; }
    .landscape {
      position: absolute;
      z-index: 0;
      bottom: 4.7%;
      left: 0;
      width: 100%;
      height: 15.2%;
      background:
        radial-gradient(ellipse at 28% 35%, #e3e8d5 0 2%, transparent 2.2%),
        radial-gradient(ellipse at 54% 42%, #e8dfb5 0 1.8%, transparent 2%),
        linear-gradient(174deg, transparent 0 20%, #293936 21% 27%, #677d78 28% 34%, #2e6b80 35% 100%);
      border-top: .5vw solid #d6d4bd;
    }
    .landscape:after {
      content: "";
      position: absolute;
      right: 0;
      top: 3%;
      width: 31%;
      height: 90%;
      background: repeating-linear-gradient(115deg, #26352e 0 .65vw, #596347 .7vw 1.4vw, #1e312c 1.5vw 2vw);
      clip-path: polygon(30% 0, 100% 5%, 100% 100%, 0 100%);
    }
    .footer {
      position: absolute;
      z-index: 4;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 5.2%;
      padding: .45vw 1vw .2vw;
      background: #075b96;
      border-top: .35vw solid #e9e5cb;
      color: #fff9dc;
      text-align: center;
      font: 2.05vw/1.16 "Trebuchet MS", Arial, sans-serif;
      letter-spacing: .02em;
      text-shadow: 1px 1px #172d48;
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="Science and Mechanics magazine cover">
    <div class="topline">EVERYDAY</div>
    <div class="date">Nov.</div>

    <div class="masthead">
      <span class="science">Science</span>
      <span class="and">and</span>
      <span class="mechanics">Mechanics</span>
    </div>

    <div class="editor">HUGO GERNSBACK<span>Editor</span></div>

    <div class="badge">GERNSBACK<b>PUBLICATIONS</b></div>
    <div class="price">25<span>Cents</span></div>

    <div class="left-copy">
      Berlin to New York<br>in One Hour
      <span class="page">See Page 648</span>
    </div>

    <div class="placeholder rocket" aria-label="[Illustration: large futuristic rocket flying diagonally upward toward the upper right]">
      <div class="body"></div>
      <div class="nose"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="fin left"></div>
      <div class="fin right"></div>
      <div class="flame f1"></div>
      <div class="flame f2"></div>
      <div class="flame f3"></div>
    </div>

    <div class="issue">In This Issue<strong>MONEY MAKING<br>INVENTIONS</strong></div>
    <div class="placeholder landscape" aria-label="[Illustration: coastline and water at bottom of cover]"></div>

    <footer class="footer">
      LATEST INVENTIONS, AERO-MECHANICS, SHOP KINKS, TELEVISION, EXPERIMENTS<br>
      FORMULAS, CHEMISTRY, WOOD AND METAL CRAFTS, RADIO KINKS
    </footer>
  </main>
</body>
</html>
