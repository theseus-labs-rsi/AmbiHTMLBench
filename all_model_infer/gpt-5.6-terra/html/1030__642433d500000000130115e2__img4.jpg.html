<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>江雪</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f2f3f7;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: "KaiTi", "STKaiti", "Songti SC", "SimSun", serif;
      color: #17151a;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 5%, rgba(245,203,216,.38) 0 4%, transparent 15%),
        radial-gradient(ellipse at 64% 0%, rgba(235,182,204,.30) 0 4%, transparent 16%),
        radial-gradient(ellipse at 92% 45%, rgba(218,223,235,.42) 0 10%, transparent 21%),
        linear-gradient(180deg, #fffefd 0%, #fffefd 77%, #f7f5f6 100%);
    }
    .wash {
      position: absolute;
      pointer-events: none;
      opacity: .58;
    }
    .wash.top-left {
      top: -6px; left: -15px; width: 168px; height: 94px;
      background:
        radial-gradient(ellipse at 35% 26%, rgba(244,193,210,.52), transparent 45%),
        radial-gradient(ellipse at 70% 13%, rgba(244,213,223,.55), transparent 46%);
      transform: rotate(-8deg);
      filter: blur(3px);
    }
    .mountain-left {
      position: absolute;
      left: -43px;
      top: 123px;
      width: 168px;
      height: 267px;
      opacity: .43;
      background: linear-gradient(139deg, transparent 0 28%, #e6dfe8 28.5% 31%, transparent 31.5% 49%, #ebe4ed 49.5% 52%, transparent 52.5%);
      transform: skewY(11deg);
    }
    .ink-wave-left {
      position: absolute;
      left: -18px;
      top: 222px;
      width: 118px;
      height: 171px;
      border-left: 4px solid #332445;
      border-bottom: 22px solid #3c284d;
      border-radius: 55% 10% 40% 55%;
      transform: rotate(-23deg);
      opacity: .88;
      box-shadow: 25px 14px 0 -13px #8c79b0, 44px 36px 0 -18px #38244e;
    }
    .ink-wave-right {
      position: absolute;
      right: -18px;
      top: 322px;
      width: 156px;
      height: 106px;
      border-top: 2px solid #5d536c;
      border-radius: 60% 0 0 0;
      transform: rotate(-13deg);
      opacity: .73;
    }
    .ink-wave-right:after {
      content: "";
      position: absolute;
      right: 2px;
      top: 46px;
      width: 78px;
      height: 32px;
      background: #3a2750;
      border-radius: 0 6px 55px 48px;
      transform: rotate(-9deg);
      box-shadow: 28px 11px 0 -10px #927daf;
    }

    .poem {
      position: absolute;
      top: 26px;
      left: 0;
      width: 100%;
      text-align: center;
    }
    .pinyin {
      font-family: "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 2px;
      line-height: 18px;
      white-space: nowrap;
    }
    .title {
      margin-top: 0;
      font-size: 34px;
      line-height: 41px;
      letter-spacing: 13px;
      padding-left: 13px;
      font-weight: normal;
    }
    .author-pinyin { margin-top: 4px; font-size: 14px; }
    .author {
      font-size: 23px;
      line-height: 28px;
      letter-spacing: 5px;
      padding-left: 5px;
      margin-bottom: 13px;
    }
    .verse-group { margin: 0 0 8px; }
    .verse {
      font-size: 28px;
      letter-spacing: 6px;
      line-height: 34px;
      padding-left: 6px;
      white-space: nowrap;
    }
    .verse .punct {
      letter-spacing: 0;
      padding-left: 2px;
    }

    .translation {
      position: absolute;
      left: 104px;
      top: 394px;
      width: 330px;
      font-size: 19px;
      line-height: 23px;
      letter-spacing: 1px;
    }
    .tag {
      display: inline-block;
      margin-bottom: 4px;
      padding: 1px 5px 1px 4px;
      background: #bd6445;
      color: #fff8e9;
      font-size: 17px;
      line-height: 22px;
      letter-spacing: 2px;
      transform: rotate(-1deg);
    }

    .water {
      position: absolute;
      left: 4px;
      bottom: 72px;
      width: 532px;
      height: 98px;
      overflow: hidden;
      opacity: .78;
    }
    .water .streak {
      position: absolute;
      height: 14px;
      border-radius: 50%;
      background: #c5bee9;
    }
    .s1 { left: 3px; top: 38px; width: 117px; transform: rotate(-4deg); }
    .s2 { left: 65px; top: 58px; width: 142px; }
    .s3 { left: 152px; top: 43px; width: 126px; }
    .s4 { left: 13px; top: 75px; width: 235px; height: 11px !important; }
    .s5 { right: 30px; top: 75px; width: 205px; height: 9px !important; }
    .s6 { right: 78px; top: 48px; width: 100px; height: 12px !important; }
    .water:before, .water:after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.9);
      border-radius: 50%;
    }
    .water:before { width: 62px; height: 20px; left: 76px; top: 43px; }
    .water:after { width: 91px; height: 17px; right: 4px; top: 19px; }

    .boat-art {
      position: absolute;
      right: 48px;
      bottom: 82px;
      width: 192px;
      height: 98px;
    }
    .boat {
      position: absolute;
      right: 11px;
      bottom: 0;
      width: 130px;
      height: 31px;
      background: #7c3e61;
      border-radius: 7px 7px 55% 48%;
      transform: skewX(-12deg);
    }
    .boat:after {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      top: 7px;
      border-top: 2px solid #e1c3d1;
      opacity: .72;
    }
    .fisher {
      position: absolute;
      right: 67px;
      bottom: 22px;
      width: 35px;
      height: 56px;
      background: #713552;
      border-radius: 45% 48% 8px 8px;
      transform: rotate(-8deg);
    }
    .fisher:before {
      content: "";
      position: absolute;
      left: -7px;
      top: -13px;
      width: 43px;
      height: 15px;
      background: #c45677;
      border-radius: 50% 50% 16% 16%;
      transform: rotate(5deg);
      box-shadow: 16px -6px 0 -6px #9b3c61;
    }
    .fisher:after {
      content: "";
      position: absolute;
      left: -8px;
      top: 18px;
      width: 43px;
      height: 24px;
      border-top: 4px solid #d7a7bb;
      border-radius: 50%;
      transform: rotate(21deg);
    }
    .rod {
      position: absolute;
      width: 139px;
      height: 2px;
      right: 85px;
      top: 26px;
      background: #4b3945;
      transform: rotate(16deg);
      transform-origin: right center;
    }
    .rod:after {
      content: "";
      position: absolute;
      left: -9px;
      top: 0;
      height: 38px;
      border-left: 1px solid #4b3945;
      transform: rotate(-35deg);
      transform-origin: top;
    }
    .snow {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.93);
      box-shadow:
        28px 10px 0 1px rgba(255,255,255,.82),
        98px 3px 0 0 rgba(255,255,255,.82),
        143px 23px 0 1px rgba(255,255,255,.85),
        48px -21px 0 0 rgba(255,255,255,.75),
        -48px 22px 0 0 rgba(255,255,255,.72);
      bottom: 13px;
      left: 5px;
    }
    .placeholder .caption {
      visibility: hidden;
      font-size: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="wash top-left"></div>
    <div class="mountain-left"></div>
    <div class="ink-wave-left"></div>
    <div class="ink-wave-right"></div>

    <section class="poem" aria-label="江雪">
      <div class="pinyin">jiāng　xuě</div>
      <div class="title">江 雪</div>

      <div class="pinyin author-pinyin">táng　liǔ zōng yuán</div>
      <div class="author">[唐] 柳 宗 元</div>

      <div class="verse-group">
        <div class="pinyin">qiān　shān　niǎo　fēi　jué</div>
        <div class="verse">千 山 鸟 飞 绝<span class="punct">，</span></div>
      </div>

      <div class="verse-group">
        <div class="pinyin">wàn　jìng　rén　zōng　miè</div>
        <div class="verse">万 径 人 踪 灭<span class="punct">。</span></div>
      </div>

      <div class="verse-group">
        <div class="pinyin">gū　zhōu　suō　lì　wēng</div>
        <div class="verse">孤 舟 蓑 笠 翁<span class="punct">，</span></div>
      </div>

      <div class="verse-group">
        <div class="pinyin">dú　diào　hán　jiāng　xuě</div>
        <div class="verse">独 钓 寒 江 雪<span class="punct">。</span></div>
      </div>
    </section>

    <section class="translation">
      <div class="tag">译文:</div><br>
      群山之间，没有一只鸟儿飞过。<br>
      纵横的小路上，见不到行人的踪<br>
      迹。只有一位身披蓑衣、头戴笠<br>
      帽的渔翁，架着小船，冒着风<br>
      雪，在寒冷的江上独自垂钓。
    </section>

    <div class="water placeholder" aria-label="水面与雪景插图">
      <span class="streak s1"></span>
      <span class="streak s2"></span>
      <span class="streak s3"></span>
      <span class="streak s4"></span>
      <span class="streak s5"></span>
      <span class="streak s6"></span>
      <span class="caption">[Illustration: bottom water and snow]</span>
    </div>

    <figure class="boat-art placeholder" aria-label="江上渔翁插图">
      <div class="rod"></div>
      <div class="fisher"></div>
      <div class="boat"></div>
      <div class="snow"></div>
      <figcaption class="caption">[Illustration: fisherman in boat at bottom-right]</figcaption>
    </figure>
  </main>
</body>
</html>
