<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      height: 720px;
      overflow: hidden;
    }
    body {
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", Arial, sans-serif;
      color: #080808;
      background:
        radial-gradient(ellipse at 58% 94%, rgba(155, 207, 255, .78) 0%, rgba(215, 236, 255, .5) 29%, rgba(255,255,255,0) 57%),

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      padding-left: 26px;
      padding-top: 40px;
    }
    .title {
      display: inline-flex;
      align-items: center;
      height: 50px;
      padding: 0 22px;
      background: #0873ec;
      color: #fff;

      font-weight: 700;
      letter-spacing: 3px;
      line-height: 50px;
      white-space: nowrap;
    }
    .intro {
      margin-top: 12px;
      width: 490px;

      font-weight: 600;

      letter-spacing: .15px;
    }

    .content {
      margin-top: 27px;
      margin-left: 6px;
      width: 505px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.63;
      letter-spacing: .1px;
    }
    .content p {
      margin: 0;
    }
    .content .blue {
      color: #0873ec;
      font-weight: 700;
    }
    .second {
      margin-top: 31px !important;
    }
    .last {
      margin-top: 2px !important;
    }
    .diagram-area {
      position: absolute;
      left: 60px;
      top: 567px;
      width: 400px;
      height: 180px;
    }
    .placeholder {
      position: absolute;
      overflow: hidden;
    }
    .wheel {
      left: 0;
      top: 7px;
      width: 194px;
      height: 164px;
    }
    .bars {
      left: 225px;
      top: 0;
      width: 174px;
      height: 160px;
    }
    .caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .brown {
      stroke: #987342;
      fill: none;
      stroke-width: 1.45;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .fillbrown {
      fill: url(#hatch);
      stroke: #987342;
      stroke-width: 1.3;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="title">报名和考试</div>

    <div class="intro">
      个人参赛，由所在中学进行统一报名；<br>
      均为笔试考试，预赛为各省市自行组织、自主命题；<br>
      剩余考试环节均为全国统一命题。
    </div>

    <div class="question-title">可以自学吗？</div>

    <div class="content">
      <p>1、<span class="blue">高中课本内容可以自学</span>，当然我们也有初高中基础<br>知识课程，让你快速掌握竞赛考点。</p>

      <p class="second">2、一些难的知识点和不知道如何规划学习进度的时候<br>，最好选择报课，大部分学生在有人一起学的情况下<br>会比较好。</p>

      <p class="last">有时候你认为自己自学学的挺好，但是很多竞赛技巧<br>、思维是需要老师来指导的。时间和钱，不能兼得。</p>
    </div>
