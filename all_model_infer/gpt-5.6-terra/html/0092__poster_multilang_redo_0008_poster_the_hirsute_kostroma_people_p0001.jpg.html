<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Middlesex Music Hall Poster</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #121210;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 18px 10px;
      font-family: "Courier New", Courier, monospace;
    }
    .poster {
      position: relative;
      width: min(96vw, 1030px);
      min-height: 1570px;
      overflow: hidden;
      color: #211d18;
      text-align: center;
      background:
        radial-gradient(ellipse at 20% 4%, rgba(130,94,45,.14), transparent 19%),
        radial-gradient(ellipse at 84% 86%, rgba(155,100,31,.11), transparent 24%),
        repeating-linear-gradient(2deg, rgba(93,67,34,.025) 0 1px, transparent 1px 5px),
        #eee4c9;
      box-shadow: 0 0 2px #887c62, 0 1px 12px rgba(0,0,0,.8);
      padding: 18px 74px 54px;
    }
    .poster:before,
    .poster:after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: .45;
    }
    .poster:before {
      inset: 0;
      border-left: 11px solid rgba(133,109,72,.13);
      border-bottom: 9px solid rgba(120,88,48,.10);
      box-shadow: inset 0 0 38px rgba(90,67,39,.15);
    }
    .poster:after {
      width: 230px;
      height: 105px;
      top: -19px;
      left: -17px;
      background: rgba(88,71,47,.15);
      clip-path: polygon(0 0,100% 0,84% 45%,56% 73%,29% 65%,0 100%);
    }
    .top {
      position: relative;
      z-index: 1;
    }
    .hall {
      margin: 0;
      font-family: Rockwell, "Roboto Slab", Georgia, serif;
      font-weight: 900;
      letter-spacing: 7px;
      font-size: clamp(34px, 5.1vw, 61px);
      line-height: .95;
      text-shadow: 1px 1px 0 #776e60;
      white-space: nowrap;
    }
    .drury {
      margin: 0 0 6px;
      font-family: Georgia, serif;
      font-size: clamp(20px, 2.2vw, 30px);
      letter-spacing: 4px;
      line-height: .85;
    }
    .rule {
      height: 2px;
      margin: 8px 82px 12px;
      background: #2e2922;
    }
    .benefit {
      margin: 0;
      font-family: Rockwell, Georgia, serif;
      font-weight: 900;
      font-size: clamp(39px, 5.9vw, 73px);
      letter-spacing: 1px;
      line-height: 1;
      white-space: nowrap;
    }
    .date {
      margin: 5px 0 0;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: clamp(36px, 4.8vw, 57px);
      line-height: 1;
    }
    .only {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(17px, 2.25vw, 28px);
      font-weight: 700;
      letter-spacing: 5px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .hirsute {
      margin: 23px 0 0;
      font-family: Georgia, serif;
      font-size: clamp(16px, 2.2vw, 27px);
      font-weight: bold;
      letter-spacing: 6px;
      line-height: 1;
    }
    .title {
      margin: 1px 0 0;
      color: #c84f2e;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: clamp(57px, 9.3vw, 112px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: .95;
      transform: scaleX(.88);
      white-space: nowrap;
    }
    .subtitle {
      margin: 4px 0 8px;
      font-family: Georgia, serif;
      font-size: clamp(16px, 2.15vw, 27px);
      font-weight: bold;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .placeholder {
      position: relative;
      width: 100%;
      height: 910px;
      margin: 0 auto 10px;
      border: 18px solid #d8af28;
      outline: 2px solid #d6a51d;
      outline-offset: -11px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: rgba(37,30,21,.76);
      background:
        linear-gradient(120deg, transparent 0 43%, rgba(65,49,24,.10) 43.1% 43.3%, transparent 43.5%),
        repeating-linear-gradient(146deg, transparent 0 14px, rgba(74,56,26,.12) 14px 16px, transparent 16px 23px),
        radial-gradient(ellipse at center, #f0ca38 0%, #e7bb27 80%, #dca91f 100%);
    }
    .placeholder:before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 4px double rgba(255,246,188,.88);
      box-shadow: inset 0 0 0 3px rgba(154,112,22,.33);
    }
    .placeholder span {
      position: relative;
      z-index: 2;
      width: 58%;
      padding: 16px;
      background: rgba(239,193,43,.72);
      border: 1px solid rgba(92,63,24,.32);
      font-family: Georgia, serif;
      font-size: 22px;
      font-style: italic;
      line-height: 1.35;
    }
    .bottom-line {
      height: 2px;
      margin: 0 10px;
      background: #312b24;
    }
    .bottom {
      margin: 0 0 0;
      padding-top: 5px;
      font-family: Georgia, serif;
      font-size: clamp(17px, 2.15vw, 27px);
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    @media (max-width: 650px) {
      .poster { padding: 16px 34px 40px; min-height: 0; }
      .rule { margin-left: 30px; margin-right: 30px; }
      .placeholder { height: 76vw; border-width: 11px; }
      .placeholder span { font-size: 14px; }
      .only, .subtitle { letter-spacing: 2px; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <header class="top">
      <h1 class="hall">MIDDLESEX&nbsp; MUSIC&nbsp; HALL,</h1>
      <p class="drury">DRURY LANE,</p>
      <div class="rule"></div>
      <h2 class="benefit">S. EMANUEL'S BENEFIT</h2>
      <p class="date">Wednesday, Feb. 25th.</p>
      <p class="only">POSITIVELY FOR THIS NIGHT ONLY.</p>
    </header>

    <section>
      <p class="hirsute">THE HIRSUTE</p>
      <div class="title">KOSTROMA PEOPLE</div>
      <p class="subtitle">FROM THE PRIMEVAL FORESTS OF CENTRAL RUSSIA.</p>

      <figure class="placeholder" aria-label="Illustration of a large bearded man seated beside a small wild-haired child against a yellow background">
        <span>[Illustration: a large bearded man seated beside a small wild-haired child, on a yellow field]</span>
      </figure>

      <p class="bottom">THE FIRST OF THEIR KIND EVER SEEN IN ENGLAND.</p>
      <div class="bottom-line"></div>
    </section>
  </main>
</body>
</html>
