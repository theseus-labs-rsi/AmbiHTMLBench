<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算思维二：分解思维</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 540px;
      min-height: 720px;
      background: #ffffff;
    }

    body {
      color: #111111;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
    }

    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .corner {
      position: absolute;
      width: 67px;
      height: 77px;
      border-color: #a8bdb7;
      border-style: solid;
    }

    .corner.top-left {
      top: 29px;
      left: 27px;
      border-width: 2px 0 0 2px;
    }

    .corner.top-right {
      top: 29px;
      right: 27px;
      border-width: 2px 2px 0 0;
    }

    .corner.bottom-left {
      bottom: 27px;
      left: 27px;
      border-width: 0 0 2px 2px;
    }

    .corner.bottom-right {
      right: 27px;
      bottom: 27px;
      border-width: 0 2px 2px 0;
    }

    h1 {
      position: absolute;
      top: 49px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 29px;
      line-height: 42px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .content {
      position: absolute;
      top: 119px;
      left: 65px;
      width: 410px;
      font-size: 18px;
      line-height: 1.42;
    }

    .intro {
      margin: 0 0 24px;
    }

    .red {
      color: #e21c23;
    }

    .section {
      margin: 0 0 21px;
    }

    .section-title {
      margin: 0 0 20px;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
    }

    .section-text {
      margin: 0;
      line-height: 1.42;
    }

    .section:last-child {
      margin-top: 4px;
    }

    .section:last-child .section-title {
      margin-bottom: 21px;
    }

    .credit {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 14px;
      line-height: 20px;
    }

    .next-page {
      position: absolute;
      right: 39px;
      bottom: 54px;
      width: 75px;
      height: 41px;
      background: #000;
      color: #fff;
      font-size: 15px;
      line-height: 41px;
      text-align: center;
      font-weight: 700;
    }

    .next-page::after {
      content: "";
      position: absolute;
      top: -13px;
      right: -14px;
      width: 0;
      height: 0;
      border-top: 33px solid transparent;
      border-bottom: 33px solid transparent;
      border-left: 30px solid #000;
    }

    .next-page span {
      position: relative;
      z-index: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <h1>计算思维二：分解思维</h1>

    <section class="content">
      <p class="intro">
        分解思维是指<span class="red">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）</span>。
      </p>

      <section class="section">
        <h2 class="section-title">1、问题梳理</h2>
        <p class="section-text">先明确这个复杂问题到底是什么，最终要达到什么目的或效果。</p>
      </section>

      <section class="section">
        <h2 class="section-title">2、问题分解</h2>
        <p class="section-text">将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。</p>
      </section>

      <section class="section">
        <h2 class="section-title">3、整合方案</h2>
        <p class="section-text">制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。</p>
      </section>
    </section>

    <div class="next-page"><span>翻页</span></div>
    <div class="credit">原创：学习方法针</div>
  </main>
</body>
</html>
