<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Document</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }
    body {
      color: #4a4a4a;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.55;
    }
    .page {
      width: 540px;
      min-height: 875px;
      padding: 2px 28px 0 35px;
    }
    .term {
      margin: 0;
      font-weight: 700;
      line-height: 1.45;
    }
    .definition {
      margin: 0;
      line-height: 1.48;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="term">审核：</p>
    <p class="definition">指进入语c群时，被群主审看人设、皮气等<br>行为。</p>

    <p class="term">新人：</p>
    <p class="definition">指初入某个圈子的人。</p>

    <p class="term">纯白：</p>
    <p class="definition">完全不了解语c的人或刚接触语c。</p>

    <p class="term">小白：</p>
    <p class="definition">指出入语c圈或对语c一无所知的人。</p>

    <p class="term">小窗：</p>
    <p class="definition">指聊天会话的窗口（与QQ的私聊差不多）</p>

    <p class="term">隔壁：</p>
    <p class="definition">指代另一个地方（隔壁群，隔壁平台）</p>

    <p class="term">首页：</p>
    <p class="definition">在语c平台中，上皮发言互动的地方。</p>

    <p class="term">水区：</p>
    <p class="definition">在语c平台中，皮下发言探讨问题或闲聊的<br>地方。</p>

    <p class="term">扩列：</p>
    <p class="definition">扩充列表，即加好友的意思。</p>

    <p class="term">掌控：</p>
    <p class="definition">指开戏文字超过七百一段的人。</p>

    <p class="term">字控：</p>
    <p class="definition">夸张手法，指一次开几个字为一段的人。</p>

    <p class="term">句控：</p>
    <p class="definition">指开戏只开一行~三行为一段的人。</p>
  </main>
</body>
</html>
