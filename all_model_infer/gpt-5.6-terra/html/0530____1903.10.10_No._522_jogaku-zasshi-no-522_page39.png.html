<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[illegible]</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #fff;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif CJK JP", serif;
      overflow-x: hidden;
    }
    .scan {
      position: relative;
      width: 100vw;
      min-width: 1500px;
      height: 1750px;
      padding-top: 85px;
      background: #fff;
    }
    .faint-mark {
      position: absolute;
      top: 12px;
      left: 72px;
      width: 22px;
      height: 175px;
      border-left: 8px solid rgba(130,112,55,.48);
      opacity: .7;
    }
    .frame {
      position: relative;
      width: 88%;
      height: 1450px;
      margin: 0 auto;
      border: 6px solid #237b28;
      border-bottom-width: 7px;
      color: #277e29;
    }
    .side {
      position: absolute;
      top: 110px;
      font-family: "Yu Mincho", serif;
      color: #207929;
      font-weight: 700;
      font-size: 31px;
      line-height: 1.35;
      letter-spacing: .05em;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .side.left { left: -54px; }
    .side.right { right: -60px; }
    .header {
      position: absolute;
      top: 83px;
      left: 9%;
      right: 9%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: start;
      text-align: center;
      color: #5ca447;
      font-size: 100px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .header div { min-height: 220px; }
    .header small {
      display: block;
      margin-top: 14px;
      font-size: 46px;
      font-weight: 400;
    }
    .title-rule {
      position: absolute;
      top: 545px;
      left: 18%;
      right: 18%;
      height: 19px;
      background:
        linear-gradient(135deg, transparent 0 28%, #4a9b35 29% 50%, transparent 51% 78%, #4a9b35 79%) 0 0 / 46px 17px repeat-x;
      opacity: .85;
    }
    .main-title {
      position: absolute;
      top: 650px;
      left: 7%;
      right: 7%;
      text-align: center;
      color: #ed4e20;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(52px, 5.1vw, 135px);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: .16em;
      white-space: nowrap;
    }
    .main-title .line2 {
      display: block;
      margin-top: 14px;
      letter-spacing: .20em;
    }
    .watermark {
      position: absolute;
      bottom: 18px;
      left: 18%;
      right: 18%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: #777;
      font-family: Arial, sans-serif;
      opacity: .84;
      white-space: nowrap;
    }
    .watermark .digitized { font-size: 35px; }
    .watermark .google {
      font-family: Georgia, serif;
      font-size: 82px;
      color: #555;
    }
    .watermark .original {
      margin-left: 260px;
      text-align: center;
      font-size: 31px;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="scan">
    <div class="faint-mark" aria-hidden="true"></div>
    <section class="frame">
      <div class="side left">新潟市立新潟市立図書館</div>
      <div class="side right">[illegible]</div>

      <div class="header">
        <div>[illegible]</div>
        <div>新潟<small>[illegible]</small></div>
        <div>新潟<small>[illegible]</small></div>
      </div>

      <div class="title-rule" aria-hidden="true"></div>

      <div class="main-title">
        ラテン語からイタリア語へ
        <span class="line2">そしてフランス語へ</span>
      </div>
    </section>

    <div class="watermark">
      <span class="digitized">Digitized by</span>
      <span class="google">Google</span>
      <span class="original">Original from<br>CORNELL UNIVERSITY</span>
    </div>
  </div>
</body>
</html>
