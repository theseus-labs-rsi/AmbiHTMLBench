<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Museum Day 2021</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #d8d9d2;
    }

    body {
      font-family: "Songti SC", "STSong", "SimSun", serif;
      color: #093f37;
    }

    .poster {
      position: relative;
      width: 440px;
      height: 622px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 91% 7%, rgba(119, 130, 117, .20) 0 8%, transparent 8.5%),
        radial-gradient(ellipse at 103% 72%, transparent 0 12%, rgba(119, 130, 117, .16) 12.5% 13%, transparent 13.5%),
        radial-gradient(ellipse at 4% 51%, transparent 0 13%, rgba(119, 130, 117, .13) 13.5% 14%, transparent 14.5%),
        linear-gradient(135deg, #e7e8e1 0%, #dfe1db 48%, #e6e5dc 100%);
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: -40px -25px;
      opacity: .20;
      background:
        radial-gradient(ellipse at 73% 8%, transparent 0 34px, #7c887b 35px 37px, transparent 38px 58px, #7c887b 59px 61px, transparent 62px),
        radial-gradient(ellipse at 99% 62%, transparent 0 45px, #7c887b 46px 48px, transparent 49px 76px, #7c887b 77px 79px, transparent 80px),
        radial-gradient(ellipse at 1% 45%, transparent 0 40px, #7c887b 41px 43px, transparent 44px 67px, #7c887b 68px 70px, transparent 71px);
      transform: rotate(-8deg);
    }

    .poster::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 155px;
      opacity: .16;
      background:
        repeating-radial-gradient(ellipse at 82% -25%, transparent 0 18px, #778278 19px 21px, transparent 22px 32px);
    }

    .title {
      position: absolute;
      z-index: 4;
      left: 27px;
      top: 18px;
      color: #073f37;
      font-size: 56px;
      font-weight: 500;
      line-height: .98;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .english-title {
      position: absolute;
      z-index: 5;
      top: 24px;
      left: 161px;
      width: 76px;
      color: #153f38;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 19px;
      letter-spacing: .7px;
    }

    .seal {
      position: absolute;
      z-index: 6;
      top: 44px;
      left: 230px;
      width: 35px;
      height: 37px;
      padding-top: 2px;
      border-radius: 7px;
      background: #c51f2d;
      color: #f6d9c9;
      font-family: "Songti SC", "STSong", serif;
      font-size: 16px;
      line-height: 16px;
      text-align: center;
      writing-mode: vertical-rl;
      box-shadow: inset 0 0 0 1px rgba(255, 236, 211, .28);
    }

    .top-vertical {
      position: absolute;
      z-index: 5;
      top: 22px;
      height: 67px;
      padding: 2px 5px;
      border-left: 1px solid rgba(31, 60, 53, .45);
      border-right: 1px solid rgba(31, 60, 53, .45);
      color: #173d36;
      font-size: 12px;
      line-height: 16px;
      writing-mode: vertical-rl;
      letter-spacing: 1px;
    }

    .top-vertical.one {
      left: 378px;
    }

    .top-vertical.two {
      left: 407px;
    }

    .date-block {
      position: absolute;
      z-index: 5;
      left: 16px;
      top: 178px;
      width: 76px;
      color: #143e37;
    }

    .date-block::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 28px;
      width: 1px;
      height: 61px;
      background: #244a42;
    }

    .date-label {
      margin-left: 11px;
      font-size: 20px;
      line-height: 25px;
    }

    .year {
      margin-left: 15px;
      font-size: 17px;
      line-height: 25px;
    }

    .date-numbers {
      display: flex;
      align-items: flex-start;
      height: 55px;
      margin-left: 13px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      line-height: 25px;
    }

    .date-numbers .five {
      width: 22px;
    }

    .date-numbers .slash {
      width: 1px;
      height: 43px;
      margin: 1px 7px 0 0;
      background: #244a42;
      transform: rotate(13deg);
      transform-origin: top;
    }

    .date-numbers .eighteen {
      padding-top: 22px;
    }

    .date-notes {
      margin-left: 25px;
      margin-top: 2px;
      font-size: 14px;
      line-height: 35px;
      white-space: nowrap;
    }

    .date-notes span {
      display: block;
    }

    .tiny-info {
      position: absolute;
      z-index: 5;
      top: 143px;
      right: 15px;
      width: 58px;
      height: 120px;
      display: flex;
      justify-content: space-between;
      color: #253f39;
      font-size: 6px;
      line-height: 9px;
      opacity: .92;
    }

    .tiny-info span {
      writing-mode: vertical-rl;
      white-space: nowrap;
    }

    .left-rule {
      position: absolute;
      z-index: 5;
      left: 19px;
      top: 414px;
      width: 1px;
      height: 93px;
      background: #315048;
    }

    .left-bullet {
      position: absolute;
      z-index: 5;
      left: 15px;
      top: 510px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #173f37;
    }

    .left-caption {
      position: absolute;
      z-index: 5;
      left: 24px;
      top: 537px;
      color: #123d36;
      font-size: 15px;
      line-height: 22px;
      letter-spacing: .2px;
    }

    .left-caption .latin {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .right-caption {
      position: absolute;
      z-index: 5;
      left: 364px;
      top: 536px;
      color: #123d36;
      font-size: 15px;
      line-height: 22px;
      letter-spacing: .2px;
    }

    .right-caption .latin {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .placeholder {
      position: absolute;
      color: transparent;
      overflow: hidden;
    }

    .placeholder .caption {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      color: #000;
      font-size: 1px;
    }

    .artifact {
      z-index: 2;
      left: 107px;
      top: 173px;
      width: 244px;
      height: 420px;
    }

    .artifact .rim {
      position: absolute;
      left: 58px;
      top: 1px;
      width: 134px;
      height: 27px;
      border-radius: 13px 13px 8px 8px;
      background:
        linear-gradient(#587b70 0 18%, #194d45 21% 54%, #0b3935 57% 76%, #638277 80% 100%);
      box-shadow:
        0 2px 3px rgba(20, 39, 34, .55),
        inset 7px 4px 8px rgba(152, 173, 158, .36),
        inset -9px -5px 8px rgba(0, 18, 19, .43);
      transform: perspective(60px) rotateX(-8deg);
    }

    .artifact .neck {
      position: absolute;
      left: 55px;
      top: 20px;
      width: 140px;
      height: 72px;
      border-radius: 18px 18px 12px 12px;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(139, 159, 139, .42) 0 8%, transparent 9%),
        repeating-linear-gradient(0deg, rgba(2, 34, 33, .35) 0 5px, rgba(83, 121, 108, .34) 6px 10px),
        linear-gradient(90deg, #174b43, #6b8878 20%, #16463e 43%, #739080 62%, #17463e);
      border: 2px solid #315e52;
      box-shadow: inset 7px 0 8px rgba(135, 158, 141, .3), inset -9px 0 9px rgba(0, 22, 22, .48);
    }

    .artifact .shoulders {
      position: absolute;
      left: 40px;
      top: 70px;
      width: 169px;
      height: 92px;
      border-radius: 26px 26px 35px 35px;
      background:
        radial-gradient(ellipse at 50% 24%, transparent 0 18px, rgba(156, 170, 144, .34) 19px 22px, transparent 23px),
        repeating-linear-gradient(165deg, rgba(5, 40, 38, .3) 0 5px, rgba(91, 126, 108, .27) 6px 11px),
        linear-gradient(90deg, #0e413b, #5d7c6d 20%, #174941 44%, #6b8978 66%, #113e39);
      border: 2px solid #315d50;
      box-shadow: inset 11px 4px 12px rgba(129, 153, 132, .3), inset -11px -7px 13px rgba(0, 23, 23, .49);
    }

    .artifact .body {
      position: absolute;
      left: 17px;
      top: 125px;
      width: 211px;
      height: 270px;
      clip-path: polygon(16% 0, 84% 0, 91% 16%, 96% 52%, 88% 76%, 78% 90%, 67% 96%, 32% 96%, 21% 90%, 11% 76%, 4% 53%, 9% 16%);
      background:
        radial-gradient(ellipse at 31% 34%, transparent 0 19px, rgba(142, 161, 139, .4) 20px 24px, transparent 25px),
        radial-gradient(ellipse at 69% 34%, transparent 0 19px, rgba(142, 161, 139, .4) 20px 24px, transparent 25px),
        radial-gradient(ellipse at 50% 55%, rgba(112, 145, 125, .45) 0 12px, transparent 13px),
        repeating-radial-gradient(ellipse at 50% 43%, rgba(8, 46, 42, .48) 0 4px, rgba(94, 126, 108, .27) 5px 10px, transparent 11px 18px),
        linear-gradient(90deg, #123f3a 0%, #557967 17%, #1a4c42 36%, #6e8875 50%, #17473e 66%, #698878 82%, #123d38 100%);
      border: 3px solid #315d50;
      box-shadow: inset 16px 0 16px rgba(129, 156, 132, .29), inset -16px 0 15px rgba(0, 23, 23, .55);
    }

    .artifact .handles {
      position: absolute;
      top: 73px;
      width: 38px;
      height: 68px;
      border: 7px solid #315e51;
      border-radius: 55% 45% 60% 40%;
      background: linear-gradient(135deg, #698979, #17463f 58%, #6c8977);
      box-shadow: inset 4px 2px 5px rgba(161, 177, 147, .3), 0 2px 4px rgba(0, 25, 23, .35);
    }

    .artifact .handle-left {
      left: 15px;
      transform: rotate(21deg);
    }

    .artifact .handle-right {
      right: 15px;
      transform: scaleX(-1) rotate(21deg);
    }

    .artifact .base {
      position: absolute;
      left: 29px;
      bottom: 1px;
      width: 185px;
      height: 39px;
      border-radius: 10px 10px 16px 16px;
      background:
        repeating-linear-gradient(0deg, rgba(5, 31, 29, .35) 0 4px, rgba(91, 123, 103, .34) 5px 8px),
        linear-gradient(90deg, #153f39, #718b78 22%, #214e43 52%, #78907c 75%, #143c37);
      border: 3px solid #315849;
      box-shadow: inset 12px 3px 12px rgba(137, 157, 132, .27), inset -10px -7px 11px rgba(0, 20, 21, .52);
    }

    .small-artifact {
      z-index: 3;
      left: 34px;
      top: 423px;
      width: 43px;
      height: 69px;
    }

    .small-artifact::before {
      content: "";
      position: absolute;
      left: 11px;
      top: 3px;
      width: 21px;
      height: 60px;
      border-radius: 6px 6px 11px 11px;
      background:
        repeating-linear-gradient(0deg, rgba(5, 30, 28, .37) 0 3px, rgba(93, 129, 106, .35) 4px 7px),
        linear-gradient(90deg, #16453e, #76907b 32%, #1b4a40 62%, #607d6b);
      border: 2px solid #315a4e;
      box-shadow: inset 4px 0 5px rgba(151, 169, 141, .25), inset -4px 0 5px rgba(0, 23, 22, .5);
    }

    .small-artifact::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 53px;
      width: 31px;
      height: 11px;
      border-radius: 4px 4px 8px 8px;
      background: #28584c;
      border: 2px solid #416858;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="International Museum Day 2021 poster">
    <div class="title">国际<br>博物馆日</div>

    <div class="english-title">
      International<br>
      Museum<br>
      Day
    </div>

    <div class="seal">重塑</div>

    <div class="top-vertical one">追梦今古</div>
    <div class="top-vertical two">穿越古今</div>

    <div class="date-block">
      <div class="date-label">时间:</div>
      <div class="year">2021</div>
      <div class="date-numbers">
        <span class="five">5</span>
        <span class="slash"></span>
        <span class="eighteen">18</span>
      </div>
      <div class="date-notes">
        <span>一 两</span>
        <span>处 处</span>
        <span>文 情</span>
        <span>物 怀</span>
      </div>
    </div>

    <div class="tiny-info" aria-label="Unreadable small vertical text">
      <span>国际博物馆日</span>
      <span>每年5月18日</span>
      <span>[illegible]</span>
      <span>[illegible]</span>
      <span>[illegible]</span>
      <span>[illegible]</span>
    </div>

    <figure class="placeholder artifact" aria-label="Centered bronze ritual vessel">
      <span class="caption">[Artifact: centered bronze ritual vessel]</span>
      <div class="rim"></div>
      <div class="neck"></div>
      <div class="shoulders"></div>
      <div class="handles handle-left"></div>
      <div class="handles handle-right"></div>
      <div class="body"></div>
      <div class="base"></div>
    </figure>

    <figure class="placeholder small-artifact" aria-label="Small bronze vessel at lower left">
      <span class="caption">[Artifact: small vessel, lower-left]</span>
    </figure>

    <div class="left-rule"></div>
    <div class="left-bullet">•</div>

    <div class="left-caption">
      与历史相遇<br>
      <span class="latin">MING</span><br>
      明兴亡
    </div>

    <div class="right-caption">
      打开时代<br>
      <span class="latin">DE</span><br>
      任意门
    </div>
  </main>
</body>
</html>
