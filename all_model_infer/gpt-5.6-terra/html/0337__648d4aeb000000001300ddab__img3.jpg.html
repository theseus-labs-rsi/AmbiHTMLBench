<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忽视你的需求，内耗你的精力</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 540px;
      background: #f7f7f7;
    }

    body {
      width: 540px;
      min-height: 720px;
      padding: 87px 35px 0;
      color: #426c61;
      font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.58;
    }

    .top {
      position: relative;
      height: 40px;
      margin-bottom: 29px;
    }

    .title {
      width: 364px;
      height: 40px;
      padding: 4px 0 0 30px;
      border-radius: 7px;
      background: #427766;
      color: #ffffff;
      font-size: 20px;
      line-height: 32px;
      white-space: nowrap;
    }

    .icon {
      position: absolute;
      top: -18px;
      right: 26px;
      width: 49px;
      height: 63px;
    }

    .icon-body {
      position: absolute;
      top: 6px;
      left: 8px;
      width: 39px;
      height: 55px;
      border: 2px solid #1f2526;
      background: #9bd4f4;
    }

    .icon-body::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 11px;
      width: 14px;
      height: 8px;
      border: 2px solid #1f2526;
      border-bottom: 0;
      background: #9bd4f4;
    }

    .icon-screen {
      position: absolute;
      top: 13px;
      left: 14px;
      width: 27px;
      height: 14px;
      border: 2px solid #1f2526;
      background: #71c8df;
    }

    .icon-bolt {
      position: absolute;
      z-index: 2;
      top: 13px;
      left: 1px;
      width: 45px;
      height: 38px;
      background: #ed91af;
      border: 2px solid #1f2526;
      clip-path: polygon(38% 0, 100% 0, 62% 40%, 94% 40%, 15% 100%, 42% 52%, 7% 52%);
    }

    p {
      margin: 0 0 18px;
    }

    .emphasis {
      font-weight: 800;
    }

    .check {
      position: relative;
      margin-top: 30px;
      margin-bottom: 22px;
      padding-left: 27px;
    }

    .check::before {
      content: "✓";
      position: absolute;
      top: -1px;
      left: 0;
      color: #3f7564;
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .final {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">3. 忽视你的需求，内耗你的精力</div>
    <div class="icon" aria-label="图标">
      <div class="icon-body"></div>
      <div class="icon-screen"></div>
      <div class="icon-bolt"></div>
    </div>
  </div>

  <p>这一种人，不仅可能是身边的朋友，<span class="emphasis">亲密关系中</span><br>
  也会出现。爱我们的人，也可能会“害”我们。</p>

  <p><span class="emphasis">忽视需求，是关系中隐藏的一把刀，</span>对人的伤害<br>
  就像刻在木头上的刀痕，再也恢复不到原样。</p>

  <p>而忽视一次，就是给对方的内心，套上一层不透<br>
  气的薄膜，直到最后无法呼吸，内耗倒下。</p>

  <p><span class="emphasis">经常忽视你需求的人，他们或许真的在乎你，但<br>
  这种错误方式，</span>只会让你越来越疲惫。</p>

  <p class="check">面对关系亲近的人的控制，先做出必要的沟通，<br>
  坦诚表达自己的感受，必要时保持适当距离。</p>

  <p class="final"><span class="emphasis">与人交往需要衡量，更需要智慧，</span>愿你在前行路上<br>
  <span class="emphasis">看清他人、做好自己。</span></p>
</body>
</html>
