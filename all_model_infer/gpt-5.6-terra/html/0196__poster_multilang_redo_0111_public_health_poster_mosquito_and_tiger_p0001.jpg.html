<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Public Health Poster</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 52px 20px 58px;
      background: #f5f4f1;
      color: #171717;
      font-family: "Times New Roman", "Noto Serif Thai", serif;
    }
    .page {
      width: min(810px, 100%);
      margin: 0 auto;
    }
    .poster {
      width: 100%;
      border: 5px solid #202020;
      background: #eee;
    }
    .poster-title {
      height: 156px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 5px solid #202020;
      background: #f7f7f5;
      font-family: "Noto Serif Thai", "Tahoma", serif;
      font-size: 65px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      color: #1d1d1d;
    }
    .placeholder {
      overflow: hidden;
      position: relative;
      background-color: #d1d1d1;
      background-image:
        radial-gradient(circle at 11% 18%, #b6b6b6 0 1px, transparent 1.6px),
        radial-gradient(circle at 76% 28%, #ababab 0 1px, transparent 1.5px),
        radial-gradient(circle at 41% 68%, #b8b8b8 0 1px, transparent 1.5px),
        radial-gradient(circle at 89% 76%, #b3b3b3 0 1px, transparent 1.6px);
      background-size: 53px 47px, 71px 63px, 61px 57px, 67px 51px;
      color: #222;
    }
    .tiger-panel {
      height: 466px;
      border-bottom: 5px solid #202020;
    }
    .tiger-shape {
      position: absolute;
      left: 13%;
      top: 25%;
      width: 67%;
      height: 46%;
      background: #252525;
      border-radius: 54% 48% 35% 34%;
      transform: skewX(-8deg);
    }
    .tiger-head {
      position: absolute;
      width: 105px;
      height: 110px;
      right: 12%;
      top: 16%;
      background: #202020;
      border-radius: 45% 45% 40% 40%;
    }
    .tiger-head::before,
    .tiger-head::after {
      content: "";
      position: absolute;
      top: -12px;
      width: 31px;
      height: 34px;
      background: #242424;
    }
    .tiger-head::before { left: 4px; transform: rotate(-25deg); }
    .tiger-head::after { right: 3px; transform: rotate(25deg); }
    .tiger-tail {
      position: absolute;
      left: 1%;
      top: 56%;
      width: 175px;
      height: 58px;
      border-top: 29px solid #252525;
      border-radius: 90% 0 0 0;
      transform: rotate(-27deg);
    }
    .tiger-legs {
      position: absolute;
      left: 27%;
      top: 60%;
      width: 53%;
      height: 95px;
      border-bottom: 35px solid #252525;
      border-left: 27px solid #252525;
      border-right: 27px solid #252525;
    }
    .mosquito-panel {
      height: 462px;
      border-bottom: 5px solid #202020;
    }
    .mosquito {
      position: absolute;
      left: 23%;
      top: 38%;
      width: 270px;
      height: 130px;
      transform: rotate(-17deg);
    }
    .mosquito-body {
      position: absolute;
      left: 97px;
      top: 43px;
      width: 134px;
      height: 35px;
      background: #222;
      border-radius: 55% 75% 60% 45%;
    }
    .mosquito-head {
      position: absolute;
      left: 62px;
      top: 47px;
      width: 45px;
      height: 45px;
      background: #242424;
      border-radius: 50%;
    }
    .mosquito-beak {
      position: absolute;
      left: -35px;
      top: 67px;
      width: 104px;
      border-top: 4px solid #1f1f1f;
      transform: rotate(-14deg);
    }
    .wing {
      position: absolute;
      width: 153px;
      height: 48px;
      border: 5px solid #222;
      border-radius: 90% 15% 90% 15%;
      background: rgba(240,240,240,.22);
    }
    .wing.one { left: 109px; top: 1px; transform: rotate(-8deg); }
    .wing.two { left: 105px; top: 75px; transform: rotate(33deg); }
    .legs {
      position: absolute;
      left: 30px;
      top: 71px;
      width: 180px;
      height: 105px;
      border-left: 3px solid #222;
      border-bottom: 3px solid #222;
      transform: skewX(-35deg) rotate(20deg);
    }
    .small-tiger {
      position: absolute;
      width: 78px;
      height: 35px;
      right: 10%;
      bottom: 17%;
      background: #252525;
      border-radius: 55% 40% 35% 35%;
    }
    .small-tiger::before {
      content: "";
      position: absolute;
      width: 28px;
      height: 17px;
      left: -20px;
      bottom: -4px;
      border-top: 6px solid #252525;
      transform: rotate(-28deg);
    }
    .thai-copy {
      height: 146px;
      padding: 9px 16px 5px;
      background: #f7f7f5;
      font-family: "Noto Serif Thai", "Tahoma", serif;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.33;
      text-align: center;
      white-space: nowrap;
    }
    .caption {
      padding-top: 27px;
      text-align: center;
      color: #252525;
    }
    .caption-title {
      margin-bottom: 15px;
      font-size: 39px;
      letter-spacing: 3px;
    }
    .caption-text {
      font-size: 27px;
      line-height: 1.4;
      letter-spacing: .4px;
    }
    @media (max-width: 700px) {
      body { padding: 25px 10px 35px; }
      .poster-title { height: 19vw; font-size: 8vw; }
      .tiger-panel { height: 57vw; }
      .mosquito-panel { height: 56vw; }
      .thai-copy { height: 18vw; padding-top: 1vw; font-size: 5.15vw; }
      .caption { padding-top: 20px; }
      .caption-title { font-size: 7vw; }
      .caption-text { font-size: 4.8vw; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="poster" aria-label="Thai public health poster">
      <div class="poster-title">ยุงร้ายกว่าเสือตั้งพันเท่า</div>

      <div class="placeholder tiger-panel" aria-label="[Illustration: tiger, upper panel]">
        <div class="tiger-tail"></div>
        <div class="tiger-shape"></div>
        <div class="tiger-legs"></div>
        <div class="tiger-head"></div>
      </div>

      <div class="placeholder mosquito-panel" aria-label="[Illustration: mosquito and small tiger, lower panel]">
        <div class="mosquito">
          <div class="mosquito-body"></div>
          <div class="mosquito-head"></div>
          <div class="mosquito-beak"></div>
          <div class="wing one"></div>
          <div class="wing two"></div>
          <div class="legs"></div>
        </div>
        <div class="small-tiger"></div>
      </div>

      <div class="thai-copy">
        ในกรุงสยาม เสือกัดคนตายปีละ๕๐คน<br>
        ยุงกัดคนเป็นไข้ตายปีละ ๕๐,๐๐๐ คน
      </div>
    </section>

    <section class="caption">
      <div class="caption-title">A Public Health Poster.</div>
      <div class="caption-text">
        Top — &nbsp;&nbsp; The Mosquito is a Thousand Times<br>
        more deadly than the Tiger !<br>
        Bottom— In Siam, Tigers kill fifty persons a year, and<br>
        Mosquitoes cause fifty thousand deaths annually.
      </div>
    </section>
  </main>
</body>
</html>
