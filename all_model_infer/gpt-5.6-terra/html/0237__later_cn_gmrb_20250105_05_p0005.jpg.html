<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公益广告 05</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #111;
    }
    .page {
      width: min(100vw, 1260px);
      margin: 0 auto;
      padding: 20px;
      overflow: hidden;
    }
    .top-rule {
      height: 9px;
      background: #255b91;
      margin-bottom: 7px;
    }
    .header {
      height: 80px;
      border-bottom: 1px solid #777;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .paper-name {
      color: #a70c32;
      font-family: "STKaiti", "KaiTi", cursive;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 2px;
      transform: skew(-7deg);
      line-height: 1;
      margin-top: -4px;
    }
    .header-right {
      display: flex;
      align-items: end;
      gap: 16px;
      height: 100%;
      padding-bottom: 9px;
    }
    .date {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      margin-bottom: 5px;
    }
    .section-title {
      font-family: "STSong", "SimSun", serif;
      color: #24588d;
      font-size: 43px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: .95;
      white-space: nowrap;
    }
    .page-no {
      font-family: Arial, sans-serif;
      font-size: 41px;
      font-weight: 300;
      line-height: .9;
      color: #111;
    }

    .poster {
      position: relative;
      height: min(1648px, calc((100vw - 40px) * 1.353));
      min-height: 760px;
      margin-top: 29px;
      overflow: hidden;
      background-color: #edf8ca;
      background-image:
        repeating-linear-gradient(42deg, transparent 0 29px, rgba(95,133,77,.19) 30px 31px, transparent 32px 56px),
        repeating-linear-gradient(132deg, transparent 0 31px, rgba(95,133,77,.18) 32px 33px, transparent 34px 63px),
        repeating-linear-gradient(86deg, transparent 0 35px, rgba(95,133,77,.14) 36px 37px, transparent 38px 68px);
      background-size: 250px 250px, 280px 280px, 210px 210px;
    }
    .series {
      position: absolute;
      top: 3.1%;
      left: 5.1%;
      color: #008b4a;
      font-size: clamp(14px, 2.05vw, 29px);
      font-weight: 800;
      letter-spacing: 1px;
    }
    .headline {
      position: absolute;
      top: 13.7%;
      left: 59.2%;
      color: #00a851;
      font-size: clamp(32px, 5.65vw, 82px);
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -3px;
      white-space: nowrap;
    }
    .headline strong {
      font-weight: 900;
      display: block;
    }

    .placeholder {
      position: absolute;
    }
    .illustration {
      width: 91%;
      height: 52%;
      left: 4%;
      top: 21%;
    }
    .illustration svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .caption {
      display: none;
    }

    .copy {
      position: absolute;
      left: 11%;
      top: 73.1%;
      width: 52%;
      font-family: "SimSun", "Songti SC", serif;
      font-size: clamp(12px, 1.66vw, 23px);
      line-height: 2.35;
      letter-spacing: .2px;
    }
    .copy p { margin: 0; }

    .bottom-design {
      position: absolute;
      left: -2%;
      bottom: -1px;
      width: 105%;
      height: 19%;
      overflow: hidden;
    }
    .bottom-dark {
      position: absolute;
      left: -2%;
      top: 21%;
      width: 109%;
      height: 82%;
      background: linear-gradient(105deg, #268c34 0%, #227e30 40%, #6acb11 100%);
      clip-path: polygon(0 28%, 34% 35%, 71% 12%, 100% 0, 100% 100%, 0 100%);
    }
    .bottom-light {
      position: absolute;
      left: -3%;
      top: 0;
      width: 109%;
      height: 52%;
      background: linear-gradient(100deg, #258c34 0%, #39a12a 44%, #8bdc0e 100%);
      clip-path: polygon(0 31%, 28% 54%, 62% 41%, 100% 0, 100% 19%, 63% 57%, 30% 75%, 0 48%);
    }
    .publisher {
      position: absolute;
      right: 6.7%;
      bottom: 5.1%;
      color: #fff;
      font-family: "STKaiti", "KaiTi", cursive;
      font-weight: bold;
      font-size: clamp(25px, 4vw, 58px);
      letter-spacing: 5px;
      transform: skew(-8deg);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .page { padding: 10px; }
      .top-rule { height: 5px; }
      .header { height: 50px; }
      .paper-name { font-size: 24px; }
      .header-right { gap: 7px; padding-bottom: 4px; }
      .date { font-size: 5px; margin-bottom: 2px; }
      .section-title { font-size: 24px; }
      .page-no { font-size: 23px; }
      .poster { margin-top: 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-rule"></div>
    <header class="header">
      <div class="paper-name">光明日报</div>
      <div class="header-right">
        <div class="date">2025年1月5日　星期日</div>
        <div class="section-title">公益广告</div>
        <div class="page-no">05</div>
      </div>
    </header>

    <section class="poster" aria-label="绿色生活系列公益广告">
      <div class="series">绿色生活系列公益广告</div>

      <div class="headline">
        <strong>绿色出行</strong>
        低碳环保
      </div>

      <div class="placeholder illustration">
        <svg viewBox="0 0 1000 930" xmlns="http://www.w3.org/2000/svg" aria-label="绿色自行车、骑行人物和叶子图案">
          <defs>
            <linearGradient id="leafGreen" x1="0" x2="1">
              <stop offset="0" stop-color="#64be1c"/>
              <stop offset="1" stop-color="#227d31"/>
            </linearGradient>
            <linearGradient id="wheelGreen" x1="0" x2="1">
              <stop offset="0" stop-color="#8cdb00"/>
              <stop offset="1" stop-color="#79c900"/>
            </linearGradient>
            <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="17"/>
            </filter>
          </defs>

          <ellipse cx="500" cy="791" rx="255" ry="35" fill="#4f8637" opacity=".3" filter="url(#shadow)"/>

          <circle cx="290" cy="425" r="100" fill="none" stroke="url(#wheelGreen)" stroke-width="29"/>
          <circle cx="611" cy="425" r="100" fill="none" stroke="url(#wheelGreen)" stroke-width="29"/>

          <path d="M367 323 C396 296 409 267 409 229 C422 248 443 274 472 291 C500 310 542 328 596 338 C553 355 516 360 476 349 C447 341 425 323 405 301 C395 321 378 339 351 351 C322 365 292 370 255 372 C306 349 340 338 367 323Z" fill="#000"/>
          <ellipse cx="382" cy="190" rx="24" ry="34" transform="rotate(25 382 190)" fill="#000"/>
          <path d="M435 365 C467 355 507 354 544 365 C508 376 481 391 474 416 C468 441 494 467 536 496 C566 517 590 532 625 552 C567 540 520 525 481 503 C450 486 414 460 410 425 C407 395 419 377 435 365Z" fill="#000"/>

          <path d="M86 644 L172 543 L768 543 L811 612 L590 584 L254 587 L172 621 L742 614 C701 688 646 746 574 774 C486 808 394 782 304 732 L86 644Z" fill="url(#leafGreen)"/>
          <path d="M173 622 C290 621 439 602 562 602 C501 657 421 688 345 704 C436 670 489 643 522 614 C420 621 325 642 173 622Z" fill="#eaf8c8"/>
          <path d="M509 732 C612 713 694 657 733 616 C749 636 754 651 756 667 C714 704 646 726 509 732Z" fill="#eaf8c8"/>
          <path d="M751 620 C819 624 897 640 974 680" fill="none" stroke="#287c30" stroke-width="26" stroke-linecap="round"/>
          <path d="M420 610 C385 634 349 651 300 665" fill="none" stroke="#eaf8c8" stroke-width="6"/>
        </svg>
        <span class="caption">[Diagram: green bicycle rider above a leaf]</span>
      </div>

      <div class="copy">
        <p>选择绿色出行方式，既节约能源、减少污染，又益于健<br>康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具，或<br>者选择步行、骑自行车等出行方式，降低出行中产生的能<br>耗和污染，绿色出行、低碳出行、文明出行。</p>
      </div>

      <div class="bottom-design" aria-hidden="true">
        <div class="bottom-dark"></div>
        <div class="bottom-light"></div>
      </div>
      <div class="publisher">光明日报社</div>
    </section>
  </main>
</body>
</html>
