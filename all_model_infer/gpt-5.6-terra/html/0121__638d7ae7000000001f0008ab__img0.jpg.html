<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞吉欧 Reggio</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #171713;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #fff;
    }
    .page {
      position: relative;
      width: min(540px, 100vw);
      min-height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background:
        linear-gradient(rgba(11, 11, 9, .58), rgba(17, 14, 10, .63)),
        repeating-linear-gradient(0deg, rgba(126, 104, 69, .12) 0 2px, transparent 2px 47px),
        linear-gradient(145deg, #484339 0%, #70634c 35%, #40382e 63%, #27231e 100%);
    }
    .placeholder {
      position: absolute;
      inset: 0;
      z-index: 0;
      color: transparent;
      font-size: 1px;
      background:
        radial-gradient(ellipse at 21% 30%, rgba(178, 151, 104, .32) 0 4%, transparent 4.4%),
        radial-gradient(ellipse at 54% 33%, rgba(188, 154, 101, .26) 0 7%, transparent 7.5%),
        radial-gradient(ellipse at 78% 42%, rgba(154, 127, 86, .31) 0 8%, transparent 8.6%),
        radial-gradient(ellipse at 13% 73%, rgba(120, 93, 62, .29) 0 9%, transparent 9.5%),
        radial-gradient(ellipse at 70% 80%, rgba(133, 104, 69, .25) 0 10%, transparent 10.5%);
      filter: blur(2px);
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 57px 5px 10px;
      text-align: center;
      text-shadow: 1px 1px 2px #000;
    }
    h1 {
      display: inline-block;
      margin: 0 0 27px;
      padding: 1px 8px 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, .78);
      font-size: 39px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: 0;
    }
    .line {
      display: table;
      max-width: 100%;
      margin: 0 auto 6px;
      padding: 0 5px 2px;
      background: rgba(0, 0, 0, .77);
      font-size: 22px;
      line-height: 1.23;
      font-weight: 600;
      white-space: nowrap;
    }
    .indent { margin-top: 7px; }
    .gap { margin-top: 13px; }
    .yellow {
      position: relative;
      display: table;
    }
    .yellow::after {
      content: "";
      position: absolute;
      left: 13%;
      right: 13%;
      bottom: -6px;
      height: 8px;
      background:
        radial-gradient(circle at 4px 0, #ffea00 0 4px, transparent 4.4px) 0 0 / 15px 8px repeat-x;
    }
    .yellow.short::after { left: 20%; right: 20%; }
    .bullet { margin-right: 2px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="placeholder">[Photo: classroom activity background]</div>
    <section class="content">
      <h1>瑞吉欧Reggio</h1>

      <div class="line"><span class="bullet">●</span>基于皮亚杰和维果斯基等心理学家的</div>
      <div class="line yellow short">建构主义心理学。</div>

      <div class="line gap yellow"><span class="bullet">●</span>走进儿童心灵的儿童观，以孩子的思维、</div>
      <div class="line">孩子的立场来看待一场</div>
      <div class="line">不压制孩子，让其充分表现潜能</div>

      <div class="line gap yellow"><span class="bullet">●</span>弹性课程，从儿童的兴趣和需要出发</div>
      <div class="line">不让孩子生活在成人的包围之中。</div>

      <div class="line gap"><span class="bullet">●</span>教师必须尽可能地减少介入，更不可过度介入。</div>
      <div class="line yellow">与其牵着儿童的手，不如让他们用自己的双脚站立。</div>

      <div class="line gap yellow"><span class="bullet">●</span>儿童的自我表达和相互交流特别重要，是儿童探索、</div>
      <div class="line">研究、解决问题过程中的基本活动。</div>

      <div class="line gap yellow"><span class="bullet">●</span>在共同分享中，每个人均可提出最好的想法，</div>
      <div class="line">提升和加强团队间意见交流、</div>
      <div class="line">并刺激新奇或出乎意料的事情发生。</div>
    </section>
  </main>
</body>
</html>
