<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>追梦</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "SimSun", "Songti SC", serif;
    }
    body {
      background: #ddd;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 540px;
      height: 720px;
      overflow: hidden;
      position: relative;
      background: #42405e;
      color: #f2e3bd;
    }
    .top {
      height: 295px;
      position: relative;
      padding: 76px 0 0 57px;
      color: #313447;
      background: #ead19c;
    }
    .write-title {
      font-size: 31px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
    }
    .red-o {
      display: inline-block;
      width: 68px;
      height: 68px;
      margin-left: 24px;
      vertical-align: middle;
      border: 14px solid #c90000;
      border-radius: 50%;
      position: relative;
      top: -2px;
    }
    .top-text {
      margin-top: 29px;
      font-size: 21px;
      font-weight: bold;
      line-height: 2;
      letter-spacing: 1px;
    }
    .watermark {
      position: absolute;
      left: 148px;
      top: 143px;
      color: rgba(255,255,255,.24);
      font-size: 31px;
      font-weight: bold;
      transform: rotate(-18deg);
      white-space: nowrap;
    }
    .photo {
      position: absolute;
      right: 34px;
      top: 82px;
      width: 133px;
      height: 213px;
      border: 5px solid #42405e;
      border-radius: 45% 43% 12% 12%;
      background: #78674e;
      color: transparent;
      overflow: hidden;
    }
    .photo:before {
      content: "";
      position: absolute;
      width: 83px;
      height: 116px;
      left: 23px;
      top: 21px;
      border-radius: 45% 45% 42% 42%;
      background: #d49a70;
      box-shadow: inset 0 25px 0 #54321f;
    }
    .photo:after {
      content: "[Photo: crying child]";
      position: absolute;
      inset: auto 0 5px 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      color: rgba(255,255,255,.12);
    }
    .meme-caption {
      position: absolute;
      z-index: 2;
      right: 1px;
      bottom: 1px;
      color: white;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      text-shadow: 1px 1px 1px #555;
      white-space: nowrap;
    }
    .bottom {
      height: 425px;
      position: relative;
      padding: 55px 51px 0 57px;
      background: #42405e;
    }
    .people-title {
      color: #f1dfb6;
      font-size: 31px;
      font-weight: bold;
      letter-spacing: 2px;
      white-space: nowrap;
      line-height: 1;
    }
    .check {
      display: inline-block;
      color: #81ca3d;
      font-family: Arial, sans-serif;
      font-size: 79px;
      font-weight: bold;
      line-height: 20px;
      margin-left: 13px;
      vertical-align: 9px;
      transform: rotate(-8deg);
    }
    .quote {
      width: 436px;
      margin-top: 28px;
      color: #f1dfb6;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.92;
      letter-spacing: .6px;
    }
    .source {
      position: absolute;
      right: 37px;
      bottom: 14px;
      color: #f3ead4;
      font-size: 14px;
      font-family: Arial, "SimSun", serif;
      font-weight: bold;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <div class="write-title">我写的：<span class="red-o"></span></div>
      <div class="top-text">我们民族的追梦史充满<br>艰辛。</div>
      <div class="watermark">省考女纸</div>
      <div class="photo placeholder">[Photo: crying child]</div>
      <div class="meme-caption">学习使我妈快乐</div>
    </section>

    <section class="bottom">
      <div class="people-title">人民日报写的:<span class="check">✓</span></div>
      <div class="quote">
        我们这个民族，有数千年辉煌文明，有数百年<br>
        深重苦难，也有百年不息奋斗，追寻梦想的<br>
        道路尤其艰难曲折。百余年来的救亡图存、道<br>
        路探索，多少仁人志士留下“有心杀贼，无力<br>
        回天”的悲愤，付出“春云碧血，秋雨黄花”<br>
        的牺牲，发出“拼将十万头颅血，须把乾坤力<br>
        挽回”的呐喊。
      </div>
      <div class="source">——2013.4.1《筑就民族复兴的“中国梦”》</div>
    </section>
  </main>
</body>
</html>
