<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国家名</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #fdf4ef;
      color: #292929;
      font-family: "STSong", "Songti SC", "SimSun", serif;
    }

    .page {
      width: min(100%, 540px);
      min-height: 720px;
      margin: 0 auto;
      padding-top: 48px;
    }

    h1 {
      margin: 0 0 34px;
      color: #d66b24;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 58px;
      width: 374px;
      margin: 0 auto;
    }

    .column {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 23px;
      line-height: 1;
    }

    .column li {
      height: 41px;
      white-space: nowrap;
    }

    @media (max-width: 430px) {
      .page {
        padding-top: 42px;
      }

      .columns {
        width: 78%;
        column-gap: 12%;
      }

      .column {
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>国家名</h1>
    <section class="columns" aria-label="国家名列表">
      <ul class="column">
        <li>弘昼国</li>
        <li>安平国</li>
        <li>苍狼国</li>
        <li>黑鹰国</li>
        <li>古木国</li>
        <li>临越国</li>
        <li>临月国</li>
        <li>逸水国</li>
        <li>飞虎国</li>
        <li>静月国</li>
        <li>火凤国</li>
        <li>长风国</li>
        <li>凤临国</li>
      </ul>
      <ul class="column">
        <li>金鹏国</li>
        <li>玄龙国</li>
        <li>夜莲国</li>
        <li>北冥国</li>
        <li>绮霞国</li>
        <li>银霜国</li>
        <li>轩辕国</li>
        <li>真北国</li>
        <li>碧潭国</li>
        <li>青果国</li>
        <li>鸿熙国</li>
        <li>阳明国</li>
        <li>落霞国</li>
      </ul>
    </section>
  </main>
</body>
</html>
