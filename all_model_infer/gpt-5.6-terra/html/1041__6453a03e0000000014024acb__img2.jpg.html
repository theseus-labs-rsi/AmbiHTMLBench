<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用暗示的积极力量养出优秀孩子</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      min-height: 720px;
      background: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    .page {
      width: 540px;
      min-height: 720px;
      padding-top: 32px;
      color: #333;
    }
    .title {
      width: 462px;
      height: 50px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #9aa9b8;
      border-radius: 8px;
      background: linear-gradient(to bottom, #e4edf8 0%, #d8e4f2 100%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.9);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .title .purple { color: #6d3a86; }
    .subtitle {
      margin: 31px 0 25px 44px;
      font-size: 20px;
      line-height: 27px;
      font-weight: 400;
      color: #383838;
      letter-spacing: .4px;
    }
    .panel {
      width: 468px;
      height: 516px;
      margin-left: 40px;
      padding: 7px 8px 5px 8px;
      border: 1px solid #adb5c1;
      background: linear-gradient(135deg, #eaf0fc 0%, #d7ddf1 45%, #c7cee1 100%);
      box-shadow: 1px 2px 2px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.9);
    }
    .row {
      display: flex;
      align-items: center;
      height: 36px;
      white-space: nowrap;
      font-size: 20px;
      line-height: 36px;
      font-weight: 400;
      letter-spacing: -.25px;
    }
    .symbol {
      width: 26px;
      flex: 0 0 26px;
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: bold;
      line-height: 36px;
    }
    .negative .symbol { color: #d00816; }
    .positive .symbol {
      color: #6eaa54;
      font-size: 22px;
      font-weight: normal;
    }
    .negative .text { color: #323232; }
    .positive .text { color: #71428b; }
  </style>
</head>
<body>
  <main class="page">
    <div class="title">用<span class="purple">暗示</span>的积极力量养出优秀孩子</div>
    <div class="subtitle">学习上，让孩子体验一个个小成功</div>

    <section class="panel">
      <div class="row negative"><span class="symbol">✖</span><span class="text">你磨蹭半天了，没写几个字，再磨下去就别睡了</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">越早完成作业，休息的时间就越多！</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">这么简单的题都不会做？</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">这道题你觉得难，不太会是吗？</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">赶紧写作业，一点都不自觉</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">你很少忘记写作业的，如果需要帮助就告诉我。</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">你这孩子怎么这么犟呢，你要听话</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">你可以说“不”，但我想听听你的理由理解你。</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">你怎么这么烦人呢，就不能安静一会儿吗？</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">你自己先去玩一会，妈妈忙完就马上找你。</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">勇敢点，这有什么的啊？</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">我相信你行的，再试试看，我陪着你</span></div>
      <div class="row negative"><span class="symbol">✖</span><span class="text">快点走，再拖拖拉拉你就别出去了。</span></div>
      <div class="row positive"><span class="symbol">✓</span><span class="text">我们来比一比，看谁更快出门。</span></div>
    </section>
  </main>
</body>
</html>
