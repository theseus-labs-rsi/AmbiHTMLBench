<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>句段结构作用好处赏析</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #d7d4c8;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      color: #7b1022;
      background-color: #deddd1;
      background-image:
        linear-gradient(rgba(72, 82, 77, .30) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 82, 77, .30) 1px, transparent 1px),
        linear-gradient(rgba(72, 82, 77, .10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 82, 77, .10) 1px, transparent 1px);
      background-size: 21px 21px, 21px 21px, 5px 5px, 5px 5px;
      box-shadow: inset 12px 0 18px rgba(40, 35, 25, .20);
    }
    .title {
      position: absolute;
      top: 45px;
      left: 96px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 2px;
      transform: rotate(-1.5deg);
      white-space: nowrap;
    }
    .vertical {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 7px;
      line-height: 1.12;
      font-weight: 700;
    }
    .questions-label {
      position: absolute;
      top: 122px;
      left: 63px;
      height: 172px;
      font-size: 28px;
      transform: rotate(1deg);
    }
    .questions {
      position: absolute;
      top: 119px;
      left: 117px;
      right: 22px;
      font-size: 23px;
      line-height: 1;
      transform: rotate(-1deg);
    }
    .questions p {
      margin: 0 0 27px 0;
      white-space: nowrap;
    }
    .formula-label {
      position: absolute;
      top: 335px;
      left: 66px;
      height: 155px;
      font-size: 28px;
      transform: rotate(1deg);
    }
    .formula {
      position: absolute;
      top: 320px;
      left: 123px;
      color: #17191a;
      font-size: 25px;
      line-height: 1.8;
      letter-spacing: 1px;
      transform: rotate(-.4deg);
    }
    .formula .red { color: #7b1022; }
    .formula .line1 { white-space: nowrap; }
    .formula .line2 {
      margin-left: 29px;
      white-space: nowrap;
    }
    .formula .line3 { white-space: nowrap; margin-top: 12px; }
    .formula .line4 { white-space: nowrap; margin-top: 12px; }
    .seal {
      position: absolute;
      top: 332px;
      right: 28px;
      width: 65px;
      height: 105px;
      border-radius: 46% 51% 44% 48%;
      background: #8a1020;
      color: #e1d4c6;
      border: 2px solid #8a1020;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      transform: rotate(4deg);
    }
    .mnemonic {
      position: absolute;
      top: 526px;
      left: 79px;
      color: #10141c;
      font-size: 29px;
      font-weight: 700;
      white-space: nowrap;
      transform: rotate(-1.2deg);
    }
    .mnemonic .red {
      color: #7b1022;
      margin-left: 7px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="title">句段结构作用好处赏析</div>

    <div class="vertical questions-label">常见问法</div>
    <section class="questions" aria-label="常见问法">
      <p>1. 请分析这句话的作用是什么?</p>
      <p>2. 这句话这样描写有什么好处!</p>
      <p>3. 请分析这句话这样描写的表达效果?</p>
    </section>

    <div class="vertical formula-label">满分公式</div>
    <section class="formula" aria-label="满分公式">
      <div class="line1">① 这是（　）描写</div>
      <div class="line2">生动形象地写出（　）</div>
      <div class="line3">② 更突出了（　）.</div>
      <div class="line4">③ 前后文呼应/为后文（　）做了铺垫</div>
    </section>

    <div class="seal">字<br>真</div>

    <div class="mnemonic">口诀：<span class="red">生动形象　感情共鸣 手</span></div>
  </main>
</body>
</html>
