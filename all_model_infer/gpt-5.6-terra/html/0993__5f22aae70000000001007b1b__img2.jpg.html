<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    body {
      background: #45d4cd;
      display: flex;
      justify-content: center;
      padding: 6px;
    }
    .page {
      position: relative;
      width: 528px;
      height: 708px;
      overflow: hidden;
      color: white;
      background:

        #439ddc;
      border-top: 2px solid rgba(255,255,255,.24);
      box-shadow: inset 0 0 0 1px rgba(22,126,191,.25);
    }
    .page:before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      background:
        linear-gradient(90deg, transparent 25%, rgba(51,137,195,.3) 25.5%, transparent 26.3%),
        repeating-linear-gradient(0deg, transparent 0 48px, rgba(50,132,190,.22) 49px 51px);
      pointer-events: none;
    }
    .header {
      position: absolute;
      top: 20px;
      right: -5px;
      width: 252px;
      height: 50px;
      border-radius: 28px 0 0 28px;
      background: #ffd500;
      color: #182e49;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      line-height: 50px;
      text-shadow: 1px 1px 0 rgba(255,255,255,.4);
    }
    .list {
      position: absolute;
      top: 80px;
      left: 20px;
      right: 18px;
    }
    .entry {
      min-height: 203px;
      display: grid;
      grid-template-columns: 144px 1fr;
      column-gap: 28px;
      padding: 0 0 13px 13px;
      position: relative;
    }
    .entry + .entry {
      padding-top: 11px;
      border-top: 2px dashed rgba(255,255,255,.48);
    }
    .cover {
      width: 135px;
      height: 187px;
      border: 4px solid white;
      border-radius: 17px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 2px 2px rgba(0,43,84,.3);
      color: white;
    }
    .cover .caption {
      position: absolute;
      bottom: 4px;
      width: 100%;
      text-align: center;
      font-size: 7px;
      color: rgba(255,255,255,.92);
      letter-spacing: .3px;
      z-index: 2;
    }
    .cover.one {
      background:
        radial-gradient(ellipse at 49% 64%, #0a7c93 0 16%, transparent 17%),
        linear-gradient(174deg, #65b5de 0 33%, #103246 34% 39%, #0e879e 40% 70%, #103941 100%);
    }
    .cover.one:before {
      content: "BLUE PLANET II";
      position: absolute; top: 16px; left: 0; width: 100%;
      text-align: center; font-size: 10px; letter-spacing: 1.6px;
    }
    .cover.one:after {
      content: "A NEW WORLD of hidden DEPTHS";
      position: absolute; top: 34px; left: 0; width: 100%;
      text-align: center; font-size: 4px; letter-spacing: .4px;
    }
    .cover.two {
      background:
        radial-gradient(circle at 48% 59%, #97c878 0 25%, #367a58 26% 29%, #e5eef3 30% 34%, transparent 35%),
        radial-gradient(circle at 50% 58%, #1a7898 0 40%, #0d4266 41% 51%, transparent 52%),
        linear-gradient(#6d9dc9, #254c79 55%, #141d4e);
    }
    .cover.two:before {
      content: "PLANET EARTH II";
      position: absolute; top: 17px; left: 0; width: 100%;
      text-align: center; font-size: 10px; letter-spacing: 1.5px;
    }
    .cover.three {
      background:
        radial-gradient(circle at 55% 27%, rgba(72,188,183,.8), transparent 23%),
        radial-gradient(circle at 36% 74%, #d8a058 0 12%, transparent 13%),
        radial-gradient(circle at 66% 73%, #c6d1c8 0 14%, transparent 15%),
        linear-gradient(150deg, #173d45 0 42%, #29594c 43% 55%, #7e4b2d 56% 100%);
    }
    .cover.three:before {
      content: "SEVEN WORLDS ONE PLANET";
      position: absolute; top: 35px; left: 18px; width: 95px;
      text-align: center; font-size: 8px; line-height: 11px; letter-spacing: 1px;
    }
    .details { padding-top: 16px; min-width: 0; }
    .entry:nth-child(2) .details { padding-top: 14px; }
    .entry:nth-child(3) .details { padding-top: 13px; }
    .title {
      margin: 0 0 11px;
      font-size: 27px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.7px;
      white-space: nowrap;
      text-shadow: 1px 2px 0 rgba(31,111,170,.42);
    }
    .rating, .platform {
      font-size: 15px;
      line-height: 23px;
      font-weight: 500;
      text-shadow: 1px 1px 0 rgba(30,111,170,.38);
    }
    .score {
      color: #ffdc00;
      font-size: 24px;
      font-weight: 900;
      padding-left: 5px;
      vertical-align: -1px;
    }
    .info {
      width: 308px;
      min-height: 60px;
      margin-top: 11px;
      padding: 10px 15px 8px 18px;
      border: 3px solid #ffe17a;
      border-radius: 16px;
      background: #fff;
      color: #292929;
      font-size: 16px;
      font-weight: 600;
      line-height: 19px;
      box-shadow: 0 2px 2px rgba(33,115,171,.15);
    }
    .info b { font-weight: 900; margin-right: 6px; }
    .red { color: #ff4852; }
    .entry:nth-child(2) .info { margin-top: 9px; }
    .entry:nth-child(3) .info { margin-top: 10px; }
  </style>
</head>

</body>
</html>
