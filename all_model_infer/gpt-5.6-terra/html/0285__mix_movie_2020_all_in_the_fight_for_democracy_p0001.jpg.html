<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All In: The Fight for Democracy</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }
    .poster {
      position: relative;
      width: 513px;
      height: 755px;
      overflow: hidden;
      background: #fff;
    }
    .amazon-original {
      position: absolute;
      top: 31px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 8px;
      white-space: nowrap;
    }
    .title-area {
      position: absolute;
      top: 216px;
      left: 38px;
      width: 438px;
      color: #1667c5;
    }
    .tagline {
      margin-left: 46px;
      margin-bottom: 7px;
      font-size: 25px;
      line-height: 1;
      font-weight: 800;
      font-stretch: condensed;
      letter-spacing: -1.4px;
      white-space: nowrap;
      transform: scaleX(.82);
      transform-origin: left center;
      width: 530px;
    }
    .main-title {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }
    .all-in {
      margin-top: 0;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 167px;
      line-height: .75;
      letter-spacing: -5px;
      color: #1768c6;
      white-space: nowrap;
    }
    .fight {
      margin-left: 14px;
      margin-top: 8px;
      width: 192px;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-size: 38px;
      line-height: 1.46;
      letter-spacing: -.4px;
      color: #1768c6;
      white-space: nowrap;
    }
    .red-rule {
      display: block;
      height: 11px;
      width: 191px;
      margin: 1px 0 2px 0;
      background: #ed3940;
    }
    .laurel {
      position: absolute;
      top: 511px;
      left: 207px;
      width: 99px;
      height: 48px;
      text-align: center;
      color: #4b94df;
      font-family: "Times New Roman", serif;
      font-size: 10px;
      line-height: 11px;
    }
    .laurel::before,
    .laurel::after {
      position: absolute;
      top: 0;
      color: #4b94df;
      font-size: 42px;
      line-height: 42px;
      font-family: Georgia, serif;
    }
    .laurel::before { content: "❮"; left: 0; }
    .laurel::after { content: "❯"; right: 0; }
    .laurel .festival {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      line-height: 10px;
    }
    .credits {
      position: absolute;
      top: 571px;
      width: 100%;
      text-align: center;
      color: #3d83d1;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -.2px;
      transform: scaleX(.88);
    }
    .credits .small {
      font-size: 5px;
      vertical-align: 1px;
      margin-right: 3px;
    }
    .coming {
      position: absolute;
      top: 607px;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: -.4px;
    }
    .release {
      position: absolute;
      top: 639px;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      font-size: 20px;
      letter-spacing: .4px;
    }
    .divider {
      display: inline-block;
      height: 31px;
      margin: 0 10px -8px 8px;
      border-left: 2px solid #171717;
    }
    .prime {
      display: inline-block;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -1.2px;
      vertical-align: 1px;
    }
    .smile {
      position: absolute;
      top: 671px;
      left: 306px;
      width: 69px;
      height: 17px;
      border-bottom: 4px solid #111;
      border-radius: 0 0 55px 55px;
      transform: rotate(4deg);
    }
    .smile::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -6px;
      width: 0;
      height: 0;
      border-left: 8px solid #111;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transform: rotate(-15deg);
    }
    .hashtag {
      position: absolute;
      top: 695px;
      left: 179px;
      width: 155px;
      text-align: center;
      color: #1269c3;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
      border-top: 4px solid #ef3b42;
      border-bottom: 4px solid #ef3b42;
      padding: 2px 0 3px;
    }
    .rating {
      position: absolute;
      left: 39px;
      bottom: 33px;
      width: 40px;
      height: 16px;
      border: 1px solid #555;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 4px;
      line-height: 4px;
      padding: 2px;
      text-align: left;
    }
    .rating b {
      display: block;
      font-size: 6px;
      line-height: 6px;
    }
    .amazon-studios {
      position: absolute;
      right: 37px;
      bottom: 31px;
      color: #111;
      text-align: center;
      font-size: 5px;
      font-weight: 700;
      line-height: 6px;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="amazon-original">AMAZON ORIGINAL</div>

    <section class="title-area">
      <div class="tagline">HOW THE RIGHT TO VOTE WENT WRONG</div>
      <div class="main-title">
        <div class="all-in">ALL IN</div>
        <div class="fight">
          THE FIGHT FOR
          <span class="red-rule"></span>
          DEMOCRACY
          <span class="red-rule"></span>
        </div>
      </div>
    </section>

    <div class="laurel">
      <span class="festival">Telluride<br>Film Festival</span><br>
      2020
    </div>

    <div class="credits">
      <span class="small">WRITTEN BY</span> JACK YOUNGELSON
      &nbsp;&nbsp;&nbsp;
      <span class="small">DIRECTED BY</span> LIZ GARBUS <span class="small">AND</span> LISA CORTÉS
    </div>

    <div class="coming">COMING SOON TO THEATERS</div>
    <div class="release">SEPTEMBER 18<span class="divider"></span><span class="prime">prime video</span></div>
    <div class="smile"></div>

    <div class="hashtag">#ALLINF0RVOTING</div>

    <div class="rating"><b>PG-13</b>PARENTS STRONGLY<br>CAUTIONED</div>
    <div class="amazon-studios">AMAZON<br>STUDIOS</div>
  </main>
</body>
</html>
