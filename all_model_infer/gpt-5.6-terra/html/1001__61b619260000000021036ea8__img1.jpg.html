<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界气候类型的分布</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #fff;
    }
    body {
      color: #474747;
      font-family: "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 13px;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      padding-top: 47px;
    }
    .content {
      width: 432px;
      margin-left: 53px;
    }
    h1 {
      margin: 0 0 7px 1px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
      line-height: 18px;
    }
    .intro {
      width: 414px;
      margin: 0;
      font-size: 13px;
      line-height: 18px;
      text-align: left;
      text-indent: 2em;
    }
    .highlight {
      background: linear-gradient(to bottom, transparent 35%, #efd1a7 35%, #efd1a7 91%, transparent 91%);
    }
    .gallery {
      display: grid;
      grid-template-columns: 193px 193px;
      column-gap: 22px;
      row-gap: 8px;
      width: 408px;
      margin-top: 8px;
    }
    figure {
      width: 193px;
      margin: 0;
    }
    .placeholder {
      position: relative;
      width: 193px;
      height: 130px;
      overflow: hidden;
    }
    .placeholder span {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    .rainforest {
      background:
        radial-gradient(ellipse at 25% 30%, #304c32 0 12%, transparent 13%),
        radial-gradient(ellipse at 60% 30%, #243d28 0 18%, transparent 19%),
        radial-gradient(ellipse at 82% 22%, #66885d 0 16%, transparent 17%),
        radial-gradient(ellipse at 35% 70%, #183322 0 25%, transparent 26%),
        linear-gradient(115deg, #a2b3a7 0%, #637e67 35%, #153421 62%, #3b5835 100%);
    }
    .savanna {
      background:
        linear-gradient(to bottom, #5d91b4 0%, #96bdd2 38%, #d4a941 39%, #b5872c 70%, #756720 100%);
    }
    .savanna:before {
      content: "";
      position: absolute;
      left: 113px;
      top: 25px;
      width: 49px;
      height: 16px;
      border-radius: 50%;
      background: #435a30;
      box-shadow: -25px 14px 0 -5px #40572d, 18px 10px 0 -7px #455f31;
    }
    .savanna:after {
      content: "";
      position: absolute;
      left: 137px;
      top: 37px;
      width: 3px;
      height: 48px;
      background: #4e4221;
      transform: rotate(4deg);
    }
    .forest {
      background:
        repeating-linear-gradient(94deg, transparent 0 12px, #34271e 13px 17px, transparent 18px 29px),
        linear-gradient(to bottom, #86a4bb 0%, #d0a233 34%, #9b681c 65%, #4b3321 100%);
    }
    .polar {
      background:
        repeating-linear-gradient(174deg, #edf5fa 0 11px, #b5d5e7 12px 17px, #fbfdff 18px 29px, #6d9db8 30px 35px),
        linear-gradient(to bottom, #587e99, #f8fbfc);
    }
    .polar:after {
      content: "";
      position: absolute;
      right: 40px;
      bottom: 29px;
      width: 13px;
      height: 8px;
      background: #dedfcf;
      border-radius: 65% 45% 45% 55%;
      box-shadow: 5px 5px 0 -3px #565651;
    }
    figcaption {
      margin-top: 3px;
      color: #5b5146;
      font-size: 11.5px;
      line-height: 15px;
      letter-spacing: -0.15px;
    }
    .number {
      color: #16865a;
      font-family: Arial, sans-serif;
      font-weight: bold;
      margin-right: 2px;
    }
    .cap-highlight {
      background: linear-gradient(to bottom, transparent 27%, #efd1a7 27%, #efd1a7 91%, transparent 91%);
    }
    .figure-label {
      margin: 4px 0 0 1px;
      color: #656565;
      font-size: 11px;
      line-height: 15px;
    }
    .lower-text {
      width: 276px;
      margin: 14px 0 0 142px;
      color: #555;
      font-size: 13px;
      line-height: 18px;
      text-align: justify;
      text-indent: 2em;
    }
    footer {
      position: absolute;
      left: 53px;
      bottom: 42px;
      color: #777;
      font-size: 11px;
      line-height: 14px;
    }
    footer .page-no {
      margin-right: 13px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="content">
      <h1>世界气候类型的分布</h1>
      <p class="intro">
        虽然世界的气候复杂多样（图3.27），但是它们的分布有一定规律。例如，<br>
        <span class="highlight">由赤道地区到极地地区，有规律地分布着热带的、亚热带的、温带的和寒带的<br>气候。</span>不同的气候类型呈现出不同的自然景观。
      </p>

      <section class="gallery" aria-label="不同气候类型的自然景观">
        <figure>
          <div class="placeholder rainforest"><span>[Photo: 热带雨林]</span></div>
          <figcaption>
            <span class="number">①</span><span class="cap-highlight">热带雨林气候主要分布在赤道附近地区，</span><br>
            <span class="cap-highlight">这里全年高温多雨，植物终年常绿，</span><br>
            多地分布着茂密的热带雨林。
          </figcaption>
        </figure>
        <figure>
          <div class="placeholder savanna"><span>[Photo: 热带草原]</span></div>
          <figcaption>
            <span class="number">②</span><span class="cap-highlight">热带草原气候主要分布在热带雨林气候</span><br>
            <span class="cap-highlight">的南北两侧。这里终年高温，年内有明</span><br>
            <span class="cap-highlight">显的干季和雨季。地面上树木稀疏、长着</span><br>
            较高的草。
          </figcaption>
        </figure>
        <figure>
          <div class="placeholder forest"><span>[Photo: 温带落叶阔叶林]</span></div>
          <figcaption>
            <span class="number">③</span><span class="cap-highlight">温带季风气候主要分布在温带地区的亚</span><br>
            <span class="cap-highlight">欧大陆东部。这里夏季高温、多雨，冬季寒</span><br>
            <span class="cap-highlight">冷、干燥。生长着落叶阔叶林。</span>
          </figcaption>
        </figure>
        <figure>
          <div class="placeholder polar"><span>[Photo: 寒带冰原]</span></div>
          <figcaption>
            <span class="number">④</span><span class="cap-highlight">寒带气候主要分布在极圈以内，大部分</span><br>
            <span class="cap-highlight">地区是冰原，地面被厚厚的冰雪覆盖。</span>
          </figcaption>
        </figure>
      </section>

      <div class="figure-label">图3.27&nbsp; 不同气候类型的自然景观</div>

      <p class="lower-text">
        其中，热带的气候大致分布在南、北回归线之间，寒带的气候大致分布在南、北极圈内，亚热带和温带的气候大致分布在北回归线与北极圈、南回归线与南极圈之间。在中纬度地区，由大陆东岸、大陆西岸向大陆内部，气候类型的分布也是有规律的。
      </p>
    </main>

    <footer><span class="page-no">64</span>第三章　天气与气候</footer>
  </div>
</body>
</html>
