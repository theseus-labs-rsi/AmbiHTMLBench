<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专四写作规律</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }
    .page {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .topbar {
      height: 63px;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      padding: 0 13px;
      color: #252525;
      position: relative;
    }
    .edit {
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .cloud {
      width: 32px;
      height: 29px;
      margin-left: 28px;
      position: relative;
    }
    .cloud .cloud-line {
      position: absolute;
      left: 0;
      top: 5px;
      width: 25px;
      height: 18px;
      border: 2px solid #202020;
      border-radius: 12px;
    }
    .cloud .cloud-line:before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border: 2px solid #202020;
      border-right: 0;
      border-bottom: 0;
      border-radius: 50%;
      left: 3px;
      top: -8px;
      background: white;
    }
    .cloud .check {
      position: absolute;
      right: 0;
      bottom: 2px;
      width: 12px;
      height: 12px;
      background: #20b665;
      border-radius: 50%;
    }
    .cloud .check:after {
      content: "";
      position: absolute;
      left: 3px;
      top: 2px;
      width: 5px;
      height: 3px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg);
    }
    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .grid-icon {
      width: 25px;
      height: 25px;
      display: grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(2, 10px);
      gap: 4px;
    }
    .grid-icon i {
      border: 2px solid #222;
      display: block;
    }
    .one-icon {
      width: 24px;
      height: 25px;
      border: 2px solid #222;
      border-radius: 2px;
      text-align: center;
      line-height: 21px;
      font-size: 17px;
      font-family: Arial, sans-serif;
    }
    .close-icon {
      width: 25px;
      height: 25px;
      position: relative;
    }
    .close-icon:before,
    .close-icon:after {
      content: "";
      position: absolute;
      top: 11px;
      left: 0;
      width: 28px;
      height: 2px;
      background: #222;
    }
    .close-icon:before { transform: rotate(45deg); }
    .close-icon:after { transform: rotate(-45deg); }

    main {
      padding: 29px 18px 0;
    }
    .headline {
      margin: 1px 0 32px;
      text-align: center;
      font-family: Impact, "Microsoft YaHei", sans-serif;
      font-size: 39px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -2px;
      color: #fff263;
      line-height: 1;
      transform: skewX(-4deg);
      text-shadow:
        -2px -2px 0 #090909,
         2px -2px 0 #090909,
        -2px  2px 0 #090909,
         2px  2px 0 #090909,
         3px  3px 0 #090909;
    }

    .section-label {
      width: fit-content;
      min-width: 124px;
      margin: 0 auto 3px;
      padding: 3px 11px 2px;
      background: #c9dea6;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 14px;
    }
    .history-table {
      border-top: 2px solid #1f1f1f;
    }
    .history-table th,
    .history-table td {
      height: 30px;
      padding: 3px 4px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 1px solid #9d9d9d;
      vertical-align: middle;
    }
    .history-table th {
      height: 30px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 2px solid #888;
    }
    .history-table col:nth-child(1) { width: 16%; }
    .history-table col:nth-child(2) { width: 42%; }
    .history-table col:nth-child(3) { width: 19%; }
    .history-table col:nth-child(4) { width: 23%; }

    .pink-bracket {
      position: absolute;
      right: 8px;
      width: 11px;
      border-right: 4px solid #ea6aab;
      border-radius: 0 9px 9px 0;
    }
    .pink-bracket:before,
    .pink-bracket:after {
      content: "";
      position: absolute;
      right: -4px;
      width: 9px;
      height: 4px;
      background: #ea6aab;
      border-radius: 3px;
    }
    .pink-bracket:before { top: -1px; }
    .pink-bracket:after { bottom: -1px; }
    .bracket-one { top: 243px; height: 53px; }
    .bracket-two { top: 307px; height: 88px; }

    .suggestion-circle {
      position: absolute;
      right: 51px;
      top: 419px;
      width: 61px;
      height: 32px;
      border: 4px dashed #ff805f;
      border-radius: 48%;
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .headline.second {
      margin: 29px 0 29px;
      font-size: 42px;
      letter-spacing: -3px;
    }

    .prediction-wrap {
      border-top: 2px solid #222;
      padding-top: 3px;
    }
    .prediction-wrap .section-label {
      min-width: 129px;
      margin-bottom: 3px;
    }
    .prediction-table {
      font-size: 14px;
      border-top: 2px solid #222;
    }
    .prediction-table td {
      height: 30px;
      padding: 3px 4px;
      border-bottom: 1px solid #999;
      vertical-align: middle;
      white-space: nowrap;
    }
    .prediction-table td:first-child {
      width: 23%;
      font-weight: 700;
    }
    .prediction-table td:nth-child(2) {
      width: 43%;
      color: #a94b79;
    }
    .prediction-table td:last-child {
      width: 34%;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="edit">编辑</div>
      <div class="cloud" aria-hidden="true">
        <div class="cloud-line"></div>
        <div class="check"></div>
      </div>
      <div class="toolbar-right" aria-hidden="true">
        <div class="grid-icon"><i></i><i></i><i></i><i></i></div>
        <div class="one-icon">1</div>
        <div class="close-icon"></div>
      </div>
    </header>

    <main>
      <div class="headline">-专四写作规律-</div>

      <div class="section-label">专四写作历年真题</div>
      <table class="history-table">
        <colgroup><col><col><col><col></colgroup>
        <thead>
          <tr>
            <th>年份</th>
            <th>题目</th>
            <th>类别</th>
            <th>题型</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2016</td>
            <td>上学期间外出旅游是否该禁止</td>
            <td>教育类</td>
            <td>立场类（二选一）</td>
          </tr>
          <tr>
            <td>2017</td>
            <td>人工智能是否会取代人脑</td>
            <td>科技类</td>
            <td>立场类（二选一）</td>
          </tr>
          <tr>
            <td>2018</td>
            <td>土著权益和环境保护负面作用</td>
            <td>人文+环保类</td>
            <td>论述类（给定观点）</td>
          </tr>
          <tr>
            <td>2019</td>
            <td>儿童屏幕使用时间</td>
            <td>科技+教育类</td>
            <td>论述类（给定观点）</td>
          </tr>
          <tr>
            <td>2020(未考)</td>
            <td>/</td>
            <td>/</td>
            <td>/</td>
          </tr>
          <tr>
            <td>2021</td>
            <td>孤独与智慧的关系</td>
            <td>心理类</td>
            <td>论述类（两者关系）</td>
          </tr>
          <tr>
            <td>2022</td>
            <td>如何提高环保意识</td>
            <td>环保类</td>
            <td>提议类</td>
          </tr>
        </tbody>
      </table>

      <div class="pink-bracket bracket-one" aria-hidden="true"></div>
      <div class="pink-bracket bracket-two" aria-hidden="true"></div>
      <div class="suggestion-circle" aria-hidden="true"></div>

      <div class="headline second">-2023专四写作-</div>

      <div class="prediction-wrap">
        <div class="section-label">2023 年专四写作</div>
        <table class="prediction-table">
          <tbody>
            <tr>
              <td>热门类别</td>
              <td>科技类、教育类、人文类</td>
              <td>连续年份不会考同类话题</td>
            </tr>
            <tr>
              <td>热门题型</td>
              <td>提议类</td>
              <td>连续年份具有延续性</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
