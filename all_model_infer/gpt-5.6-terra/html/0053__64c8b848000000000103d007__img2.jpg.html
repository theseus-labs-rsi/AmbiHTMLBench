<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>为什么选择新概念动画版？</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    body {
      background: #bee1f5;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 540px;
      min-height: 720px;
      position: relative;
      padding-top: 21px;
      overflow: hidden;
    }
    .title {
      width: 382px;
      height: 42px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffc54b;
      border-radius: 25px;
      color: white;
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      -webkit-text-stroke: 1.6px #222;
      text-shadow: 2px 2px 0 #222;
      transform: rotate(-1deg);
    }
    .paper {
      position: relative;
      width: 508px;
      height: 625px;
      margin: 0 auto;
      padding: 13px 16px;
      background: #fff;
      overflow: hidden;
    }
    .section {
      margin: 0 0 8px;
      color: #252525;
      font-size: 19px;
      line-height: 1.85;
      font-weight: 400;
    }
    .section-title {
      color: #ef1212;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 3px;
    }
    .text {
      white-space: normal;
    }
    .indent {
      padding-left: 10px;
    }
    .books {
      position: absolute;
      right: -3px;
      bottom: -9px;
      width: 184px;
      height: 146px;
      z-index: 2;
      transform: rotate(1deg);
    }
    .book {
      position: absolute;
      bottom: 0;
      width: 45px;
      height: 137px;
      border: 3px solid white;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 1px 1px 3px rgba(0,0,0,.25);
      background: linear-gradient(90deg, #157c68 0 17%, #ee4923 17% 27%, #e0a40b 27% 100%);
    }
    .book::before {
      content: "新概念英语\A NEW CONCEPT ENGLISH";
      white-space: pre-line;
      position: absolute;
      top: 7px;
      left: 5px;
      right: 3px;
      color: #fff400;
      font-size: 7px;
      line-height: 1.2;
      font-weight: 900;
      text-shadow: 1px 1px 0 #9c3f00;
    }
    .book::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #ffd430;
      background: #ff9c14;
      right: 7px;
      bottom: 13px;
      box-shadow: 0 -37px 0 -3px #fa8817, 0 -74px 0 -3px #ffa512;
    }
    .book.one { left: 2px; height: 135px; transform: rotate(-2deg); }
    .book.two { left: 24px; height: 141px; transform: rotate(-1deg); }
    .book.three { left: 48px; height: 143px; }
    .book.four { left: 73px; height: 145px; transform: rotate(1deg); }
    .book.five { left: 100px; width: 75px; height: 143px; background: #159478; }
    .book.five::before { font-size: 8px; color: #ffeb22; }
    .book.five::after { width: 29px; height: 29px; right: 12px; bottom: 14px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="title">为什么选择新概念动画版？</div>
    <section class="paper">
      <div class="section">
        <div class="section-title">一、无需死记硬背</div>
        <div class="text">打破枯燥学习方式😴，用动画通俗易懂掌握听说读写<br>能力</div>
      </div>

      <div class="section">
        <div class="section-title">二、融入生活场景</div>
        <div class="text">💪加入幽默段子、人文历史，生动形象又很好理解</div>
      </div>

      <div class="section">
        <div class="section-title">三、螺旋式教学</div>
        <div class="text">从基础层层提高，不怕孩子基础差跟不上👍</div>
      </div>

      <div class="section">
        <div class="section-title">四、闭环学习</div>
        <div class="text">👉预热→精讲→巩固→个性报告</div>
        <div class="text indent">“听说读写练” 覆盖式讲解，看完有题干巩固基础</div>
      </div>

      <div class="section">
        <div class="section-title">五、内容优质放心</div>
        <div class="text">有多年经验，《新概念英语》原创班底深度参与，原汁<br>原味诠释精髓☝</div>
      </div>

      <div class="section">
        <div class="section-title">六、时间恰当</div>
        <div class="text">每天只需花20min⏱左右防止时间<br>过长产生厌恶感</div>
      </div>

      <div class="placeholder books" aria-label="[图书封面图片：右下角]">
        <div class="book one"></div>
        <div class="book two"></div>
        <div class="book three"></div>
        <div class="book four"></div>
        <div class="book five"></div>
      </div>
    </section>
  </main>
</body>
</html>
