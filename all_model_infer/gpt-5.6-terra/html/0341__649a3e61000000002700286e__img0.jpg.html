<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人成长语录</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 540px;
      background: #f1f0ed;
    }

    body {
      color: #111;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-weight: 700;
    }

    .page {
      width: 540px;
      min-height: 722px;
      padding: 25px 34px 20px;
      background: #f1f0ed;
    }

    .section {
      margin: 0 0 35px;
      font-size: 24px;
      line-height: 1.59;
      letter-spacing: 0;
    }

    .section:last-of-type {
      margin-bottom: 42px;
    }

    .number {
      display: inline-block;
      width: 40px;
      vertical-align: top;
    }

    .content {
      display: inline;
    }

    .teal {
      color: #4b958e;
    }

    .footer {
      color: #4b958e;
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      white-space: nowrap;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="section">
      <span class="number">1、</span><span class="content"><span class="teal">你开始炫耀自己，往往都是灾难的开始。</span><br>
      就像老子在《道德经》里写到：“光而不耀，<br>
      静水流深。”意思就是，无论身处什么位置，<br>
      什么环境，嘴上不逞强、不炫耀、不狂妄才能<br>
      兜住自己的福气。</span>
    </p>

    <p class="section">
      <span class="number">2、</span><span class="content">一个冷知识：<span class="teal">屏蔽力是一个人最顶级<br>
      的能力，</span>任何消耗你的人和事，多看一眼<br>
      都是你的不对。</span>
    </p>

    <p class="section">
      <span class="number">3、</span><span class="content">大学时辅导员说了一句受益一生的<br>
      话：“<span class="teal">你不用变得很外向，内向挺好的，</span><br>
      但需要你发言的时候，一定要勇敢。”正<br>
      所谓：君子可内敛不可懦弱，面不公可起<br>
      而论之。</span>
    </p>

    <footer class="footer">商业思维｜底层逻辑｜个人提升</footer>
  </main>
</body>
</html>
