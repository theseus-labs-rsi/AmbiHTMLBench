<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缓解痛经</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #161616;
    }
    .page {
      width: 100%;
      max-width: 540px;
      min-height: 720px;
      margin: 0 auto;
      position: relative;
      padding: 17px 121px 36px;
    }
    .status {
      height: 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #555;
      padding: 0 2px;
    }
    .status-left {
      font-size: 9px;
      letter-spacing: 1px;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .battery {
      width: 17px;
      height: 8px;
      border: 1px solid #777;
      border-radius: 2px;
      padding: 1px;
      position: relative;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 3px;
      background: #777;
    }
    .battery-fill {
      width: 10px;
      height: 4px;
      background: #777;
    }
    .topbar {
      height: 44px;
      position: relative;
    }
    .close {
      position: absolute;
      top: 10px;
      left: -1px;
      width: 14px;
      height: 14px;
    }
    .close::before,
    .close::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 1px;
      top: 6px;
      left: -1px;
      background: #111;
    }
    .close::before { transform: rotate(45deg); }
    .close::after { transform: rotate(-45deg); }
    .intro-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #7054b5;
      font-size: 15px;
      font-weight: 600;
      line-height: 24px;
      margin-bottom: 7px;
    }
    .five {
      width: 26px;
      height: 22px;
      color: #7658b7;
      background: #e8898c;
      border-radius: 3px 3px 0 0;
      text-align: center;
      line-height: 22px;
      font-size: 15px;
      font-weight: 500;
    }
    p {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      letter-spacing: .2px;
    }
    .intro-copy {
      width: 300px;
    }
    .chapter {
      margin-top: 78px;
      height: 53px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chapter-box {
      width: 114px;
      height: 30px;
      border: 1px solid #aaa3b3;
      color: #7354b5;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      padding-left: 25px;
    }
    .chapter-number {
      position: absolute;
      left: 10px;
      top: -18px;
      font-size: 43px;
      line-height: 43px;
      color: #7051b5;
      font-weight: 700;
      background: white;
      padding: 0 2px;
    }
    .chapter-number::after {
      content: "·";
      margin-left: 1px;
    }
    .main-copy {
      margin-top: 34px;
    }
    .label {
      display: inline-block;
      color: #fff;
      background: #7254b5;
      font-size: 16px;
      line-height: 29px;
      height: 29px;
      padding: 0 15px 0 8px;
      margin-top: 8px;
      margin-bottom: 8px;
      position: relative;
      font-weight: 600;
    }
    .label::after {
      content: "";
      position: absolute;
      top: 0;
      right: -14px;
      border-top: 14.5px solid transparent;
      border-bottom: 14.5px solid transparent;
      border-left: 14px solid #7254b5;
    }
    .explanation {
      margin-bottom: 25px;
    }
    .lead {
      margin-bottom: 26px;
    }
    .methods p {
      margin-bottom: 25px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="status">
      <div class="status-left">HD&nbsp;&nbsp;5G&nbsp;&nbsp;⌁</div>
      <div class="status-right">
        <span class="battery"><span class="battery-fill"></span></span>
        <span>19:43</span>
      </div>
    </div>

    <div class="topbar">
      <span class="close" aria-label="关闭"></span>
    </div>

    <section>
      <div class="intro-title">
        <span class="five">5</span>
        <span>月经来潮需停药</span>
      </div>
      <p class="intro-copy">药物推迟月经可能会失败，服药过程中如月经来潮需停药。</p>
    </section>

    <section class="chapter">
      <div class="chapter-box">
        <span class="chapter-number">2</span>
        缓解痛经
      </div>
    </section>

    <section class="main-copy">
      <p>如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。</p>

      <div class="label">常用方案</div>

      <p class="explanation">痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。</p>

      <p class="lead">以下三种方法，选其中一种方法即可：</p>

      <div class="methods">
        <p>1. 布洛芬　首剂 800 mg，之后根据需要400 ~ 800 mg 每8小时一次，可在月经来潮前1天开始服用，连续服用3天。</p>
        <p>2. 甲芬那酸首剂 500 mg，之后根据需要250 mg 每6小时一次。</p>
      </div>
    </section>
  </main>
</body>
</html>
