<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十一月-任务</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #1d1d1d;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
    }
    .page {
      width: 540px;
      min-height: 405px;
      padding: 62px 19px 0 8px;
    }
    h1 {
      margin: 0 0 7px 6px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0;
    }
    table {
      width: 513px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
      text-align: center;
    }
    th, td {
      border: 1px solid #59636b;
      height: 31px;
      padding: 3px 2px;
      vertical-align: middle;
      font-weight: 400;
      white-space: nowrap;
    }
    th {
      height: 29px;
      font-weight: 600;
      background: #ffffff;
    }
    tbody tr:nth-child(odd) td {
      background: #dceaf5;
    }
    .c1 { width: 37px; }
    .c2 { width: 105px; }
    .c3 { width: 65px; }
    .c4 { width: 134px; }
    .c5 { width: 65px; }
    .c6 { width: 107px; }
  </style>
</head>
<body>
  <main class="page">
    <h1>十一月-任务(必做:支付管理费+拨款)</h1>
    <table>
      <colgroup>
        <col class="c1">
        <col class="c2">
        <col class="c3">
        <col class="c4">
        <col class="c5">
        <col class="c6">
      </colgroup>
      <thead>
        <tr>
          <th>序号</th>
          <th>任务描述</th>
          <th>岗位</th>
          <th>操作动作</th>
          <th>开始时间</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>柔性线推进</td>
          <td>生产</td>
          <td>申请200W推进</td>
          <td>11月1日</td>
          <td>柔性线推进</td>
        </tr>
        <tr>
          <td>2</td>
          <td>订购原材料</td>
          <td>采购</td>
          <td>4份P3+4份P5</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>3</td>
          <td>九月订购的原料入库</td>
          <td>采购</td>
          <td>申请资金入库</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>申请货款</td>
          <td>财务</td>
          <td>没钱就申请,有钱就不申请</td>
          <td>11月1日</td>
          <td>申请四季货贷</td>
        </tr>
        <tr>
          <td>5</td>
          <td>生产线预配</td>
          <td>生产</td>
          <td>全线开产</td>
          <td>11月1日</td>
          <td>收下9月的产品</td>
        </tr>
        <tr>
          <td>6</td>
          <td>交货</td>
          <td>销售</td>
          <td>交第三个订单</td>
          <td>11月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>7</td>
          <td>应收账款</td>
          <td>财务</td>
          <td>收钱</td>
          <td>11月</td>
          <td>尽量不拖现</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
