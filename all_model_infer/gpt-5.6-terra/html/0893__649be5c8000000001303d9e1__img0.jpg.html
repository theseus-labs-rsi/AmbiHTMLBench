<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富人眼中的富人是咋样?</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #e9edf7;
      background:
        radial-gradient(ellipse at 55% 8%, rgba(130,151,212,.42) 0%, rgba(65,89,159,.25) 31%, transparent 59%),
        linear-gradient(125deg, rgba(0,20,72,.88), rgba(13,47,115,.88) 50%, rgba(0,18,63,.94));
    }
    .page {
      position: relative;
      width: 540px;
      height: 722px;
      padding: 137px 18px 0;
      overflow: hidden;
      background:
        linear-gradient(to bottom, rgba(12,43,111,.17), rgba(0,11,49,.62)),
        radial-gradient(ellipse at 71% 45%, rgba(57,89,165,.39), transparent 42%);
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .22;
      background:
        repeating-radial-gradient(ellipse at 80% 53%, transparent 0 8px, rgba(166,185,229,.38) 9px 10px, transparent 11px 15px),
        linear-gradient(118deg, transparent 0 47%, rgba(205,218,247,.2) 48%, transparent 49% 100%);
      transform: scale(1.48) translate(17%, 15%);
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 0 0 27px 7px;
      color: #fff;
      font-family: "Songti SC", "STSong", serif;
      font-size: 42px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -1.8px;
      white-space: nowrap;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: rgba(239,243,255,.83);
      font-size: 16px;
      font-weight: 300;
      background: rgba(5,28,83,.19);
    }
    col.question { width: 63.3%; }
    col.answer { width: 36.7%; }
    th, td {
      border: 1px solid rgba(239,245,255,.83);
      vertical-align: middle;
    }
    th {
      height: 35px;
      text-align: center;
      font-weight: 400;
      color: rgba(239,243,255,.8);
    }
    td {
      height: 52px;
      padding: 0 8px;
      line-height: 1.25;
    }
    td.answer {
      text-align: center;
      white-space: nowrap;
    }
    tr.note td {
      height: 42px;
      text-align: right;
      padding-right: 9px;
      white-space: nowrap;
    }
    tr.long td {
      height: 53px;
    }
    .small-note {
      font-size: 16px;
      letter-spacing: -.2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <h1>富人眼中的富人是咋样?</h1>
      <table aria-label="富人眼中的富人调查">
        <colgroup>
          <col class="question">
          <col class="answer">
        </colgroup>
        <thead>
          <tr>
            <th>问题</th>
            <th>回答</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1.您觉得高净值人群资产拥有多少钱才算是?</td>
            <td class="answer">1亿7,388.4万元</td>
          </tr>
          <tr class="note">
            <td colspan="2">本次调研的平均家庭资产:2,265.8万元</td>
          </tr>
          <tr>
            <td>2.请问您每天工作小时数是?</td>
            <td class="answer">8.2小时</td>
          </tr>
          <tr>
            <td>3.您预计退休年龄?</td>
            <td class="answer">59岁</td>
          </tr>
          <tr>
            <td>4.您希望能活到多少岁?</td>
            <td class="answer">88.2岁</td>
          </tr>
          <tr class="note">
            <td colspan="2" class="small-note">小知识:2021年中国平均寿命:77.3岁</td>
          </tr>
          <tr class="long">
            <td>5.请问您曾去过国家数量（包括商务出差）</td>
            <td class="answer">6.2个国家</td>
          </tr>
          <tr>
            <td>6.请问您平均每月阅读书籍数量</td>
            <td class="answer">2.4本书</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
