<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指读（Pointing Reading）</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #d7d4ca;
      color: #45433d;
      font-family: "Songti SC", "SimSun", serif;
    }
    .page {
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      padding: 18px 42px 25px;
      background: #e8e5da;
      background-image: linear-gradient(to right, rgba(130,126,113,.045) 1px, transparent 1px);
      background-size: 5px 5px;
      box-shadow: 0 0 14px rgba(0,0,0,.22);
      overflow: hidden;
    }
    .topline {
      margin-left: 18px;
      font-size: 10px;
      color: #57554e;
    }
    .tag {
      width: 258px;
      margin: 3px 0 -1px 46px;
      padding: 3px 10px 2px;
      text-align: center;
      color: #3e3d39;
      font-size: 14px;
      letter-spacing: 2px;
      background: #d8d6cf;
      border: 1px solid #89877f;
      transform: rotate(-1deg);
    }
    .header {
      height: 57px;
      margin-top: 0;
      display: flex;
      align-items: center;
      color: #dddcd5;
      background: #1c1e20;
      border: 2px solid #777878;
      transform: rotate(-.8deg);
    }
    .method {
      width: 70px;
      height: 43px;
      padding: 11px 6px;
      font-size: 13px;
      border-right: 1px solid #777;
    }
    .heading {
      padding-left: 14px;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .heading span {
      margin-left: 10px;
      font-size: 25px;
      letter-spacing: 1px;
    }
    .content {
      padding: 60px 8px 0;
      font-size: 16px;
      line-height: 1.85;
    }
    .highlight {
      display: inline-block;
      margin-left: -8px;
      padding: 0 8px;
      line-height: 1.55;
      color: #3d3d38;
      background: #4b4c4b;
      box-shadow: 0 0 0 5px #ff8c31;
      color: #eee;
    }
    .answer {
      margin: 15px 0 25px 28px;
    }
    .second {
      margin-top: 4px;
    }
    .paragraph {
      margin: 15px 0 0;
      text-indent: 2em;
    }
    .orange-line {
      border-bottom: 5px solid #ff8b2b;
      line-height: 1.72;
    }
    .bottom {
      display: flex;
      align-items: flex-start;
      margin-top: 4px;
    }
    .short-text {
      width: 204px;
      padding-left: 7px;
      line-height: 1.82;
    }
    .short-text span {
      border-bottom: 5px solid #ff8b2b;
    }
    .placeholder {
      width: 188px;
      height: 205px;
      margin: 1px 0 0 7px;
      position: relative;
      color: #45433d;
      border: 0;
    }
    .placeholder::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 8px;
      width: 137px;
      height: 166px;
      border: 3px solid #403e37;
      border-radius: 46% 48% 43% 42%;
      transform: rotate(5deg);
    }
    .placeholder::after {
      content: "[Drawing: cat reading a book]";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 9px;
      color: transparent;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">安培 Plain reading</div>
    <div class="tag">用手指来指引读书的方向</div>

    <header class="header">
      <div class="method">方法 40</div>
      <div class="heading">指读 <span>（Pointing Reading）</span></div>
    </header>

    <section class="content">
      <div class="highlight">①用手指或是笔尖指着当前读到的位置</div>
      <div class="answer">视线聚焦在手指或笔尖。</div>

      <div class="highlight second">②沿着阅读的方向移动手指或笔尖</div>

      <p class="paragraph">
        <span class="orange-line">一边往下读，一边移动手指或笔尖。此时视线依然聚焦在</span><br>
        <span class="orange-line">手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相</span><br>
        <span class="orange-line">同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速</span><br>
        <span class="orange-line">度的制约，但是可以保证不会出现倒退或是看错行的情况。</span>
      </p>

      <div class="bottom">
        <div class="short-text">
          <span>大家也可以试着将</span><br>
          <span>这种方式与朗读结合起</span><br>
          <span>来，将指着的内容出声</span><br>
          <span>读出来。</span>
        </div>
        <div class="placeholder">[Drawing: cat reading a book]</div>
      </div>
    </section>
  </main>
</body>
</html>
