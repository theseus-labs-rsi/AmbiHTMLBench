<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祥除帖・昨表帖</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f6f2;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 53px 0 51px;
      font-family: "KaiTi", "STKaiti", "DFKai-SB", "Noto Serif TC", serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 1050px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(133,108,76,.08), transparent 15%, transparent 83%, rgba(133,108,76,.06)),
        repeating-linear-gradient(0deg, rgba(110,88,61,.025) 0, rgba(110,88,61,.025) 1px, transparent 1px, transparent 5px),
        #d8cab4;
      box-shadow: inset 0 0 20px rgba(101,73,46,.12);
    }
    .paper-lines {
      position: absolute;
      inset: 18px 36px 20px 42px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 42px,
        rgba(123,99,70,.13) 43px,
        transparent 44px
      );
      opacity: .63;
      pointer-events: none;
    }
    .top-rule {
      position: absolute;
      top: 20px;
      left: 29px;
      right: 70px;
      border-top: 1px solid rgba(127,102,73,.17);
    }
    .writing {
      position: absolute;
      top: 28px;
      right: 72px;
      bottom: 25px;
      display: flex;
      flex-direction: row;
      gap: 18px;
      align-items: flex-start;
      direction: rtl;
    }
    .column {
      writing-mode: vertical-rl;
      text-orientation: upright;
      direction: ltr;
      color: #1b1613;
      font-size: 30px;
      line-height: 1.55;
      letter-spacing: 2px;
      white-space: nowrap;
      text-align: left;
      text-shadow: .25px .25px .1px rgba(0,0,0,.3);
    }
    .column.c1 { margin-top: 0; }
    .column.c2 { margin-top: 3px; }
    .column.c3 { margin-top: 0; }
    .column.c4 { margin-top: 0; }
    .column.c5 { margin-top: 3px; }
    .column.c6 { margin-top: 4px; }
    .heading {
      position: absolute;
      top: 73px;
      right: 31px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 18px;
      line-height: 1.5;
      letter-spacing: 2px;
      color: #302821;
    }
    .date-note {
      position: absolute;
      left: 47px;
      top: 197px;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 28px;
      line-height: 1.48;
      letter-spacing: 2px;
      color: #211b17;
      transform: rotate(1deg);
    }
    .seal {
      position: absolute;
      left: 50px;
      width: 27px;
      height: 29px;
      border: 2px solid #b6492d;
      color: #b6492d;
      background: rgba(206,91,51,.08);
      font-family: "SimSun", serif;
      font-size: 17px;
      font-weight: bold;
      line-height: 11px;
      text-align: center;
      padding-top: 2px;
      opacity: .86;
    }
    .seal.one { top: 711px; }
    .seal.two { top: 768px; height: 30px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="paper-lines"></div>
    <div class="top-rule"></div>

    <div class="heading">祥除帖<br>昨表帖</div>

    <section class="writing" aria-label="書法正文">
      <div class="column c1">臣廢言臣祥除以復五月窮思永遠肝心寸截甘霖應時嚴寒奉被</div>
      <div class="column c2">手詔伏承聖體御膳勝常以慰下情臣故患匆漏氣上頓之勿勿惹</div>
      <div class="column c3">恩無既每見尉問感戴屏營不勝衝遇謹表陳聞臣廢誠惶頓首</div>
      <div class="column c4">頓首死罪死罪　臣廢言昨表不宣奉賜手詔伏承聖體勝常以</div>
      <div class="column c5">慰下情不審宿昔復何如承鄭夫人乃爾妾頓今復增損伏惟哀匕</div>
      <div class="column c6">慈存益勞聖心謹附永動靜臣廢言</div>
    </section>

    <div class="date-note">歲在癸卯暮春襄陽書於未央</div>
    <div class="seal one">白<br>雲</div>
    <div class="seal two">襄<br>陽</div>
  </main>
</body>
</html>
