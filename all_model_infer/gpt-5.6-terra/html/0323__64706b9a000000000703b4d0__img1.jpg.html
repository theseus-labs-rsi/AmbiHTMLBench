<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      background: #fbf0d2;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #111;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #fbf0d2;
    }
    .ribbon {
      position: absolute;
      top: 0;
      right: 75px;
      width: 49px;
      height: 72px;
      background: #9a9d00;
      color: #fffde2;
      clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      line-height: 24px;
      padding-top: 4px;
      letter-spacing: 1px;
      text-shadow: 0 1px 1px rgba(0,0,0,.18);
    }
    .rainbow {
      position: absolute;
      top: 71px;
      left: 17px;
      width: 478px;
      height: 151px;
      overflow: hidden;
    }
    .arc {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50% 50% 0 0;
      border-style: solid;
      border-bottom: 0;
    }
    .arc.one {
      width: 470px;
      height: 140px;
      top: 1px;
      border-width: 11px;
      border-color: #d6e6d9;
    }
    .arc.two {
      width: 430px;
      height: 128px;
      top: 19px;
      border-width: 11px;
      border-color: #f1b8ae;
    }
    .arc.three {
      width: 382px;
      height: 112px;
      top: 38px;
      border-width: 12px;
      border-color: #d9d3c8;
    }
    .arc.four {
      width: 410px;
      height: 122px;
      top: 29px;
      border-width: 10px;
      border-color: #d9e5bd;
    }
    .title {
      position: absolute;
      top: 119px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      z-index: 2;
    }
    .content {
      position: absolute;
      top: 241px;
      left: 54px;
      width: 435px;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.42;
      letter-spacing: 0;
      z-index: 2;
    }
    .item {
      margin: 0 0 10px 0;
    }
    .item:nth-child(2) {
      margin-bottom: 10px;
    }
    .item:nth-child(3) {
      margin-bottom: 10px;
    }
    .highlight {
      color: #b8a900;
      font-weight: 700;
    }
    .watermark {
      position: absolute;
      left: 214px;
      top: 533px;
      color: rgba(165, 155, 130, .22);
      font-family: Arial, sans-serif;
      font-size: 19px;
      transform: rotate(-31deg);
      white-space: nowrap;
      z-index: 1;
    }
    .watermark.top {
      left: 206px;
      top: 209px;
      font-size: 17px;
      opacity: .72;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="ribbon">心<br>理</div>

    <div class="rainbow" aria-hidden="true">
      <div class="arc one"></div>
      <div class="arc two"></div>
      <div class="arc four"></div>
      <div class="arc three"></div>
    </div>

    <div class="title">如何避免/减少巴纳姆效应？</div>

    <div class="content">
      <div class="item">
        1、要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻<br>
        易相信一些模糊的描述。
      </div>
      <div class="item">
        2、我们的自我认知在往往是主观的，我们需要保持<br>
        <span class="highlight">谦虚和开放</span>的心态，不要<span class="highlight">过分自信或者自卑</span>。我<br>
        们需要认识到自己的优点和缺点，不断学习和成<br>
        长，才能更好地适应社会的变化。
      </div>
      <div class="item">
        3、<span class="highlight">听取他人的评价</span>。全面而完整地听取他人的<br>
        评价，对正确认识自我十分重要，同时，也能很<br>
        好地反映自我认识的能力。
      </div>
      <div class="item">
        4、我们需要保持警惕，不要被一些虚假的信息所<br>
        迷惑。我们需要<span class="highlight">学会辨别真假信息</span>，不要轻易相<br>
        信一些没有依据的描述，避免被骗或者误导。
      </div>
    </div>

    <div class="watermark top">PPT by 觅知</div>
    <div class="watermark">PPT by 觅知</div>
  </main>
</body>
</html>
