<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句摘抄</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5e8df;
    }
    body {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      color: #302d2b;
    }
    .page {
      width: 540px;
      min-height: 720px;
      margin: 0 auto;
      overflow: hidden;
      background: #d8c9b4;
    }
    .masthead {
      height: 174px;
      position: relative;
      background: #f9eee7;
      border-bottom: 3px solid #eee4db;
    }
    .paper-logo {
      position: absolute;
      left: 25px;
      top: 30px;
      width: 260px;
      height: 122px;
    }
    .people {
      position: absolute;
      left: 0;
      top: 0;
      color: #d51e28;
      font-family: "STKaiti", "KaiTi", "FangSong", cursive;
      font-size: 75px;
      font-weight: bold;
      letter-spacing: -12px;
      line-height: 1;
      transform: skew(-8deg);
      white-space: nowrap;
    }
    .renmin {
      position: absolute;
      top: 109px;
      left: 59px;
      color: #9b6063;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .right-head {
      position: absolute;
      top: 31px;
      left: 359px;
      width: 181px;
      color: #262321;
    }
    .right-head .small-title {
      font-size: 29px;
      font-weight: 700;
      line-height: 1.18;
      white-space: nowrap;
      padding-left: 2px;
      border-bottom: 2px solid #322e2b;
      padding-bottom: 5px;
    }
    .right-head .topic {
      margin-top: 22px;
      margin-left: -43px;
      width: 224px;
      font-size: 31px;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
      border-bottom: 2px solid #322e2b;
      padding-bottom: 6px;
    }
    .content {
      padding: 8px 27px 24px;
    }
    .quote {
      text-align: center;
      font-size: 47px;
      line-height: 1.23;
      letter-spacing: 1px;
      font-weight: 500;
      margin: 0;
    }
    .quote.first {
      margin-top: 0;
    }
    .example-label {
      margin: 5px 0 22px;
      font-size: 19px;
      line-height: 1;
    }
    .example-text {
      margin: 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: 0;
    }
    .second {
      margin-top: 38px;
      font-size: 46px;
      line-height: 1.25;
    }
    .second-label {
      margin-top: 30px;
      margin-left: 7px;
      margin-bottom: 23px;
    }
    .second-text {
      margin-left: 7px;
      font-size: 18px;
      line-height: 1.38;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="paper-logo">
        <div class="people">人民日报</div>
        <div class="renmin">RENMIN RIBAO</div>
      </div>
      <div class="right-head">
        <div class="small-title">金句&nbsp;|&nbsp;摘抄</div>
        <div class="topic">坚持奋斗主题</div>
      </div>
    </header>

    <section class="content">
      <p class="quote first">夜色难免黑凉<br>前行必有曙光</p>

      <div class="example-label">举例:</div>
      <p class="example-text">夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，<br>只要勇敢向前必定成功!</p>

      <p class="quote second">道固远，笃行可至<br>事虽巨，坚为必成</p>

      <div class="example-label second-label">举例:</div>
      <p class="example-text second-text">道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个<br>国家也好，最可贵的就是心中有梦想，并且为实现梦想<br>不惧风雨、实干笃行、砥砺奋斗</p>
    </section>
  </main>
</body>
</html>
