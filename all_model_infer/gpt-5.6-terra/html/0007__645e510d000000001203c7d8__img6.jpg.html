<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Document</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #1c2749;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      color: #202020;
    }
    .pattern {
      height: 99px;
      background-color: #1d294c;
      background-image:
        radial-gradient(circle at 14px 16px, transparent 0 13px, #090d1f 14px 17px, transparent 18px),
        radial-gradient(circle at 42px 16px, transparent 0 13px, #090d1f 14px 17px, transparent 18px),
        radial-gradient(circle at 28px 38px, transparent 0 13px, #090d1f 14px 17px, transparent 18px);
      background-size: 56px 44px;
      background-position: 0 0;
      border-bottom: 1px solid #25345c;
    }
    .page {
      min-height: 544px;
      background: #fff;
      padding: 21px 21px 16px;
    }
    .title {
      margin: 0;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
    }
    .content {
      margin: 43px 0 0;
      font-size: 20px;
      line-height: 1.82;
      letter-spacing: .15px;
    }
    .content p { margin: 0; }
    .content .gap { margin-top: 38px; }
    .content .final { margin-top: 38px; }
    .marked {
      position: relative;
      display: inline;
    }
    .marked::after {
      content: "";
      position: absolute;
      left: -9px;
      right: -6px;
      bottom: -8px;
      height: 8px;
      background: #e20b0b;
      border-radius: 42% 58% 45% 55%;
      transform: rotate(.2deg);
      z-index: 0;
    }
    .marked > span { position: relative; z-index: 1; }
    .bottom {
      height: 77px;
      border-top: 5px solid #e20b0b;
      background-color: #1d294c;
      background-image:
        radial-gradient(circle at 14px 16px, transparent 0 13px, #090d1f 14px 17px, transparent 18px),
        radial-gradient(circle at 42px 16px, transparent 0 13px, #090d1f 14px 17px, transparent 18px),
        radial-gradient(circle at 28px 38px, transparent 0 13px, #090d1f 14px 17px, transparent 18px);
      background-size: 56px 44px;
      background-position: 0 0;
    }
  </style>
</head>
<body>
  <div class="pattern"></div>
  <main class="page">
    <h1 class="title">2、为新疆人民打出一个民主联合政府</h1>

    <section class="content">
      <p>受到长期迫害的新疆各族人民奋勇反抗，发动了伊犁、<br>塔城、阿山三区人民革命。革命军队很快占领了以上三<br>个地区，成立了临时革命政府。</p>

      <p class="gap">三区人民革命让盛世才感受到了各族人民抗争的力量。<br>最终在革命力量和国民政府的双重压力下败走新疆。<br>1945年日本投降以后，国民政府在全国各族人民的多<br>方压力下，与临时革命政府开启谈判，假借谈判的手段<br>分化瓦解革命力量。</p>

      <p class="final"><span class="marked"><span>恐怕谈判桌上的所有人都不会想到，赛福鼎以后会成为</span></span><br><span class="marked"><span>新中国的副国级领导人。</span></span></p>
    </section>
  </main>
  <div class="bottom"></div>
</body>
</html>
