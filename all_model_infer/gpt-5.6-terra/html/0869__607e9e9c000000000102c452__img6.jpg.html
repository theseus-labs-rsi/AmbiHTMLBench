<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4.语法</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #79b29a;
      font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
      color: #292929;
    }
    .sheet {
      position: relative;
      width: 416px;
      height: 672px;
      padding: 55px 16px 22px;
      overflow: hidden;
      background-color: #fff;
      background-image:
        linear-gradient(#edf1ee 1px, transparent 1px),
        linear-gradient(90deg, #edf1ee 1px, transparent 1px);
      background-size: 21px 21px;
    }
    .binding {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: #79b29a;
    }
    .binding::after {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: -2px;
      height: 26px;
      background: radial-gradient(circle at 11px 0, #fff 0 9px, transparent 10px) repeat-x;
      background-size: 32px 26px;
    }
    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 31px;
      line-height: 1.1;
      font-weight: 600;
    }
    p {
      margin: 0 0 25px;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.48;
      letter-spacing: 1px;
    }
    .p2 { margin-bottom: 28px; }
    .p3 { margin-bottom: 27px; }
    .flower {
      position: absolute;
      right: 12px;
      bottom: 10px;
      width: 58px;
      height: 58px;
    }
    .petal {
      position: absolute;
      width: 20px;
      height: 27px;
      border: 3px solid #d97869;
      border-radius: 55% 55% 45% 45%;
      transform-origin: 50% 40px;
      left: 19px;
      top: 2px;
    }
    .p1 { transform: rotate(0deg); }
    .p2f { transform: rotate(60deg); }
    .p3f { transform: rotate(120deg); }
    .p4f { transform: rotate(180deg); }
    .p5f { transform: rotate(240deg); }
    .p6f { transform: rotate(300deg); }
    .center {
      position: absolute;
      left: 21px;
      top: 22px;
      width: 15px;
      height: 15px;
      border: 3px solid #d97869;
      border-radius: 50%;
      background: #fff8da;
    }
    .leaves {
      position: absolute;
      right: -4px;
      bottom: -2px;
      color: #75ad91;
      font-family: sans-serif;
      font-size: 34px;
      transform: rotate(-25deg);
    }
    @media (max-width: 440px) {
      .sheet { transform: scale(.93); transform-origin: center; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="binding" aria-hidden="true"></div>
    <h1>4.语法</h1>
    <p>语法是语言的框架。光知道单词却不懂<br>语法，你就无法完整地说出一个句子，<br>有时候还可能让人产生误解；单词都认<br>识，但是凑在一起就不知道句子是什么<br>意思，也会感到尴尬。</p>
    <p class="p2">虽然提起学语法，大家都是感觉兴都<br>奋，各种时态错综复杂怎么记？但是任<br>何一门学科都是由浅入深的，英语也不<br>例外。</p>
    <p class="p3">学习语法就像造房子，首先要把基础的<br>语法脉络理清，打好根基，之后再慢慢<br>补充和拓展，让知识巩固起来。</p>
    <p>零基础的同学在学习英语语法时可以先<br>从简单的开始。比如基本句型和八<br><span style="display:block;text-align:center;">大时态等。</span></p>
    <div class="flower" aria-label="[Flower decoration: bottom-right]">
      <i class="petal p1"></i><i class="petal p2f"></i><i class="petal p3f"></i>
      <i class="petal p4f"></i><i class="petal p5f"></i><i class="petal p6f"></i><i class="center"></i>
      <span class="leaves">♧</span>
    </div>
  </main>
</body>
</html>
