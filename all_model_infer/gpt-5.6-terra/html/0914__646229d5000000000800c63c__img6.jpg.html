<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录 - Building Thinking Classrooms</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #deddd8;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: "Noto Serif CJK SC", "Songti SC", "STSong", serif;
      color: #292929;
    }
    .page {
      width: 540px;
      height: 720px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(121,113,96,.11) 0, rgba(255,255,255,.15) 5%, transparent 13%),
        linear-gradient(180deg, #eeeeeb 0%, #e8e7e2 100%);
      box-shadow: inset 26px 0 18px rgba(92,80,63,.08);
      padding-top: 54px;
    }
    .header {
      margin-left: 73px;
      height: 112px;
      position: relative;
    }
    .brand {
      height: 65px;
      position: relative;
      display: flex;
      align-items: flex-end;
    }
    .bmark {
      font-family: Georgia, serif;
      font-size: 51px;
      font-style: italic;
      line-height: 1;
      margin-right: 7px;
      margin-bottom: -3px;
      letter-spacing: -8px;
    }
    .headtext {
      width: 178px;
      position: relative;
      padding-left: 28px;
      padding-bottom: 1px;
      border-bottom: 1px solid #777;
    }
    .contents {
      position: absolute;
      top: 0;
      left: 68px;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 13px;
      white-space: nowrap;
    }
    .english {
      font-family: Georgia, serif;
      font-size: 14px;
      font-style: italic;
      white-space: nowrap;
      margin-top: 28px;
      margin-left: -1px;
      letter-spacing: -.35px;
    }
    .chapter-list {
      margin-top: 2px;
    }
    .chapter {
      height: 76px;
      margin-bottom: 6px;
      position: relative;
      display: flex;
      align-items: center;
      background: linear-gradient(100deg, rgba(113,113,105,.28), rgba(183,183,178,.31) 51%, rgba(224,223,217,.16));
    }
    .chapter::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 100%;
      background: rgba(112,108,101,.10);
    }
    .icon {
      width: 49px;
      height: 49px;
      margin-left: 49px;
      margin-right: 12px;
      border: 1.5px solid #5a5a56;
      border-radius: 50%;
      position: relative;
      flex: 0 0 auto;
      background: rgba(231,231,226,.24);
    }
    .icon .shade {
      position: absolute;
      width: 30px;
      height: 30px;
      right: -2px;
      bottom: 2px;
      border-radius: 50%;
      background: rgba(81,81,77,.40);
    }
    .icon .glyph {
      position: absolute;
      z-index: 1;
      left: 9px;
      top: 7px;
      font-family: Arial, sans-serif;
      color: #474743;
      font-size: 25px;
      line-height: 1;
      transform: rotate(-12deg);
    }
    .icon.two .glyph { font-size: 28px; left: 10px; top: 6px; }
    .icon.three .glyph { font-size: 28px; top: 8px; left: 12px; }
    .icon.four .glyph { font-size: 24px; top: 10px; left: 10px; transform: rotate(0deg); }
    .icon.five .glyph { font-family: Georgia, serif; font-size: 35px; top: 4px; left: 15px; transform: none; }
    .icon.six .glyph { font-size: 24px; top: 11px; left: 12px; transform: none; }
    .icon.seven .glyph { font-size: 26px; top: 8px; left: 10px; }
    .chapter-text {
      height: 51px;
      width: 325px;
      padding-top: 6px;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 22px;
      white-space: nowrap;
    }
    .subtitle {
      padding-left: 57px;
      letter-spacing: .15px;
    }
    .number {
      margin-left: auto;
      width: 59px;
      padding-top: 17px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #242424;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand">
        <div class="bmark">B</div>
        <div class="headtext">
          <div class="contents">目 录</div>
          <div class="english">uilding Thinking Classrooms</div>
        </div>
      </div>
    </header>

    <section class="chapter-list">
      <div class="chapter">
        <div class="icon one"><span class="shade"></span><span class="glyph">▤</span></div>
        <div class="chapter-text">
          第一章｜激发学习兴趣<br>
          <span class="subtitle">——布置思考题</span>
        </div>
        <div class="number">001</div>
      </div>

      <div class="chapter">
        <div class="icon two"><span class="shade"></span><span class="glyph">◈</span></div>
        <div class="chapter-text">
          第二章｜探索课堂合作<br>
          <span class="subtitle">——频繁地进行透明化的随机分组</span>
        </div>
        <div class="number">019</div>
      </div>

      <div class="chapter">
        <div class="icon three"><span class="shade"></span><span class="glyph">✎</span></div>
        <div class="chapter-text">
          第三章｜改变被动的行为习惯<br>
          <span class="subtitle">——运用白板</span>
        </div>
        <div class="number">037</div>
      </div>

      <div class="chapter">
        <div class="icon four"><span class="shade"></span><span class="glyph">▰</span></div>
        <div class="chapter-text">
          第四章｜打造自由思考的空间<br>
          <span class="subtitle">——课桌椅随意摆放</span>
        </div>
        <div class="number">051</div>
      </div>

      <div class="chapter">
        <div class="icon five"><span class="shade"></span><span class="glyph">?</span></div>
        <div class="chapter-text">
          第五章｜应对学生的提问<br>
          <span class="subtitle">——只回答持续思考的问题</span>
        </div>
        <div class="number">063</div>
      </div>

      <div class="chapter">
        <div class="icon six"><span class="shade"></span><span class="glyph">♣</span></div>
        <div class="chapter-text">
          第六章｜提高课堂参与度<br>
          <span class="subtitle">——站着口述题目</span>
        </div>
        <div class="number">079</div>
      </div>

      <div class="chapter">
        <div class="icon seven"><span class="shade"></span><span class="glyph">▤</span></div>
        <div class="chapter-text">
          第七章｜布置有效果的作业<br>
          <span class="subtitle">——布置自测题</span>
        </div>
        <div class="number">097</div>
      </div>
    </section>
  </main>
</body>
</html>
