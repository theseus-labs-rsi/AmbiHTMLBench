<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>疑惑点三：赛场上如何发挥</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    body {
      min-height: 720px;
      background: #c8ed79;
      display: flex;
      justify-content: center;
      padding-top: 23px;
      color: #eff2cf;
    }
    .page {
      position: relative;
      width: 505px;
      min-height: 674px;
      padding: 8px 23px 12px;
      background: #fffefb;
      overflow: hidden;
    }
    .title-area {
      position: relative;
      height: 94px;
      text-align: center;
    }
    .flower {
      position: absolute;
      left: 37px;
      top: 3px;
      width: 83px;
      height: 87px;
    }
    .flower .petal,
    .flower .leaf {
      position: absolute;
      display: block;
    }
    .flower .petal {
      width: 36px;
      height: 39px;
      background: #ef4d48;
      border-radius: 48% 48% 52% 52%;
    }
    .flower .p1 { left: 17px; top: 5px; transform: rotate(-21deg); }
    .flower .p2 { left: 1px; top: 18px; transform: rotate(-32deg); }
    .flower .p3 { left: 31px; top: 20px; transform: rotate(26deg); }
    .flower .p4 { left: 47px; top: 9px; transform: rotate(22deg); }
    .flower .center {
      position: absolute;
      left: 29px;
      top: 27px;
      width: 22px;
      height: 20px;
      border-radius: 50%;
      background: #e94645;
      z-index: 2;
    }
    .flower .face {
      position: absolute;
      z-index: 3;
      left: 32px;
      top: 34px;
      font-size: 8px;
      color: #753f32;
      letter-spacing: 1px;
    }
    .flower .leaf {
      width: 27px;
      height: 31px;
      background: #4d9a39;
      border-radius: 45% 50% 45% 50%;
      top: 56px;
    }
    .flower .l1 { left: 10px; transform: rotate(25deg); }
    .flower .l2 { left: 47px; transform: rotate(-25deg); }
    .flower-caption {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .headline {
      display: inline-block;
      margin-top: 0;
      padding: 0 12px 5px;
      background: linear-gradient(90deg, transparent 0%, #5eff30 12%, #8cff49 88%, transparent 100%);
      color: #090909;
      font-size: 30px;
      line-height: 1.16;
      font-weight: 900;
      text-align: center;
      text-shadow: 1px 1px 0 #fff;
    }
    .headline span { display: block; }
    .mark {
      position: absolute;
      right: 49px;
      top: -4px;
      width: 22px;
      height: 22px;
      border: 1.8px solid #111;
      border-radius: 50%;
      color: #111;
      background: #fff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 15px;
      line-height: 19px;
    }
    .intro {
      width: 425px;
      margin: 4px 0 4px 0;
      font-size: 19px;
      line-height: 1.28;
      font-weight: 900;
      color: #c1c994;
      text-shadow: 1px 1px 0 #71855c, -1px -1px 0 #fff;
    }
    .section {
      margin: 0 0 24px 0;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
      color: #d0d9aa;
      text-shadow: 1px 1px 0 #6e8465, -1px -1px 0 #fff;
    }
    .section.compact { margin-bottom: 23px; }
    .number {
      display: inline-block;
      width: 19px;
      height: 19px;
      margin-right: 3px;
      vertical-align: 1px;
      border-radius: 4px;
      background: linear-gradient(#8eb5c4, #557a8d);
      color: #fff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 14px;
      line-height: 19px;
      text-align: center;
      text-shadow: none;
      box-shadow: inset 0 0 0 1px #91a5a6;
    }
    .red-circle {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-left: 4px;
      vertical-align: -3px;
      border: 3px solid #dd0000;
      border-radius: 50%;
      text-shadow: none;
    }
    .red-x {
      color: #de0000;
      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 0;
      vertical-align: -3px;
      text-shadow: none;
    }
    .battle {
      margin-bottom: 24px;
      line-height: 1.34;
    }
    .battle div { white-space: nowrap; }
    .battle .icon {
      display: inline-block;
      width: 20px;
      text-align: center;
      font-size: 17px;
      text-shadow: none;
    }
    .last {
      margin-top: 0;
      margin-bottom: 0;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="title-area">
      <figure class="flower placeholder" aria-label="红色花朵图标">
        <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span>
        <span class="center"></span><span class="face">⌁⌁</span><span class="leaf l1"></span><span class="leaf l2"></span>
        <figcaption class="flower-caption">[红色花朵图标]</figcaption>
      </figure>
      <div class="headline"><span>疑惑点三</span><span>赛场上如何发挥</span></div>
      <div class="mark">R</div>
    </div>

    <div class="intro">最快上手辩论方式：打一场堂堂正正的辩论赛<br>注意点：</div>

    <section class="section">
      <div><span class="number">1</span>咬字清晰，表达流畅，保持头脑清醒🤔</div>
      <div>输出观点注意!!重音/停顿/起伏/气势</div>
    </section>

    <section class="section compact">
      <div><span class="number">2</span>笔不能停，记关键词📝</div>
      <div>用不同颜色的笔画框标注<span class="red-circle"></span></div>
    </section>

    <section class="section compact">
      <div><span class="number">3</span>反驳思维（挖掘机）</div>
      <div>挖前提、拆前提；拆逻辑关系；拆数据、削弱效力；</div>
    </section>

    <section class="section compact">
      <div><span class="number">4</span>推论思维（推土机）</div>
      <div>重申+延伸论点；举出不同论据；铺陈辩论价值；</div>
    </section>

    <section class="section battle">
      <div><span class="number">5</span>战场意识</div>
      <div><span class="icon">🙅</span>不恋战（不要为了反驳而反驳但是已经离题）</div>
      <div><span class="icon">🙅</span>不怕死（进攻有利战场和充分准备的战场）</div>
      <div><span class="icon">🙅</span>不保守（不要刻意回避不利战场，也要克服准备）</div>
      <div>漫无目的的反驳<span class="red-x">×</span>毫无结局的追杀<span class="red-x">×</span>突如其来的攻击<span class="red-x">×</span></div>
    </section>

    <section class="section last">
      <div><span class="number">6</span>小结意识🔒</div>
      <div>说给谁要听，结束已经攻下的战场</div>
    </section>
  </main>
</body>
</html>
