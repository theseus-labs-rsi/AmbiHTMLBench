<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回避行为</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center;
      background: #ffffff;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      overflow: hidden;
      background: #fff;
      color: #000;
    }
    .blue {
      position: absolute;
      background: #123dc0;
      z-index: 0;
    }
    .top-left {
      top: 0;
      left: 0;
      width: 139px;
      height: 12px;
    }
    .top-left::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 0;
      border-bottom: 12px solid #123dc0;
      border-right: 10px solid transparent;
    }
    .left-upper {
      top: 12px;
      left: 0;
      width: 19px;
      height: 180px;
    }
    .left-upper::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: 0;
      border-top: 18px solid #123dc0;
      border-right: 19px solid transparent;
    }
    .right-middle {
      top: 192px;
      right: 0;
      width: 15px;
      height: 119px;
    }
    .right-middle::before {
      content: "";
      position: absolute;
      top: -9px;
      right: 0;
      border-bottom: 9px solid #123dc0;
      border-left: 15px solid transparent;
    }
    .right-middle::after {
      content: "";
      position: absolute;
      bottom: -18px;
      right: 0;
      border-top: 18px solid #123dc0;
      border-left: 15px solid transparent;
    }
    .left-lower {
      left: 0;
      bottom: 17px;
      width: 19px;
      height: 119px;
    }
    .left-lower::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 0;
      border-bottom: 18px solid #123dc0;
      border-right: 19px solid transparent;
    }
    .right-lower {
      right: 0;
      bottom: 15px;
      width: 15px;
      height: 96px;
    }
    .right-lower::before {
      content: "";
      position: absolute;
      top: -9px;
      right: 0;
      border-bottom: 9px solid #123dc0;
      border-left: 15px solid transparent;
    }
    .bottom {
      left: 0;
      bottom: 0;
      width: 299px;
      height: 14px;
    }
    .bottom::after {
      content: "";
      position: absolute;
      right: -12px;
      bottom: 0;
      border-top: 14px solid #123dc0;
      border-right: 12px solid transparent;
    }
    .bottom-right {
      right: 0;
      bottom: 0;
      width: 136px;
      height: 14px;
    }
    .bottom-right::before {
      content: "";
      position: absolute;
      left: -11px;
      bottom: 0;
      border-top: 14px solid #123dc0;
      border-left: 11px solid transparent;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 61px 32px 0;
    }
    .number {
      margin: 0;
      font-size: 64px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }
    h1 {
      margin: 20px 0 0;
      font-size: 62px;
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: 0;
    }
    .definition {
      margin: 110px 0 0;
      font-size: 28px;
      line-height: 1.5;
      font-weight: 900;
      letter-spacing: 0;
    }
    .example {
      margin: 18px 0 0;
      color: #272727;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 28px;
      line-height: 1.58;
      font-weight: 400;
      letter-spacing: 0;
    }
    @media (max-width: 540px) {
      .page {
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="blue top-left"></div>
    <div class="blue left-upper"></div>
    <div class="blue right-middle"></div>
    <div class="blue left-lower"></div>
    <div class="blue right-lower"></div>
    <div class="blue bottom"></div>
    <div class="blue bottom-right"></div>

    <section class="content">
      <p class="number">03</p>
      <h1>回避行为</h1>
      <p class="definition">自觉或不自觉地回避曾经的某些人、<br>事、物。</p>
      <p class="example">比如，学生时代受过伤，可能回避同<br>学聚会，不再听某些歌、看某些电影、<br>去某家餐厅……</p>
    </section>
  </main>
</body>
</html>
