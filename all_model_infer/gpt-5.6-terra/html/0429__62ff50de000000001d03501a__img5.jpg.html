<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桂花露 荷花露</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 540px;
      height: 720px;
      overflow: hidden;
    }
    body {
      background: #e4c7d0;
      color: #606064;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", SimSun, sans-serif;
    }
    .page {
      position: relative;
      width: 540px;
      height: 720px;
      background: #e4c7d0;
      padding-top: 21px;
    }
    .border-box {
      position: relative;
      width: 500px;
      height: 651px;
      margin-left: 21px;
      border: 1px solid #666268;
      padding: 61px 43px 35px 44px;
    }
    .entry {
      margin: 0;
    }
    .title {
      margin: 0 0 24px 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .line {
      margin: 0 0 23px 9px;
      font-size: 20px;
      line-height: 1.38;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .method {
      margin: 0 0 46px 9px;
      width: 396px;
      font-size: 20px;
      line-height: 1.38;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .entry.second .title {
      margin-bottom: 26px;
    }
    .entry.second .method {
      margin-bottom: 0;
    }
    .footer-left {
      position: absolute;
      left: 23px;
      bottom: 23px;
      font-family: SimSun, serif;
      font-size: 11px;
      color: #626065;
      letter-spacing: 1px;
    }
    .footer-right {
      position: absolute;
      right: 23px;
      bottom: 22px;
      font-size: 13px;
      color: rgba(255,255,255,.77);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="border-box">
      <article class="entry">
        <h1 class="title">△桂花露</h1>
        <p class="line">【功用】开胃消食，宽胸化痰</p>
        <p class="line">【药物】桂花500克</p>
        <p class="method">【制法】于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</p>
      </article>

      <article class="entry second">
        <h1 class="title">△荷花露</h1>
        <p class="line">【功用】清暑凉营</p>
        <p class="line">【药物】白荷花500克</p>
        <p class="method">【制法】取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</p>
      </article>
    </section>

    <div class="footer-left">【中国色·静荷】</div>
    <div class="footer-right">图智AIAPP</div>
  </main>
</body>
</html>
