<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA Should Be Less Than 40%</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #647f72 0%, #4e6e60 49%, #254c3d 100%);
      overflow: hidden;
    }
    .slide {
      width: 1024px;
      height: 576px;
      margin: 0 auto;
      position: relative;
      padding-top: 25px;
    }
    .banner {
      width: 913px;
      height: 65px;
      margin-left: 65px;
      padding: 4px 10px 0;
      background: linear-gradient(to bottom, #70c8d8 0%, #42a9bd 46%, #16869e 100%);
      box-shadow: inset 0 0 7px rgba(255,255,255,.48);
      color: #fff600;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 61px;
      white-space: nowrap;
    }
    .content {
      position: absolute;
      left: 120px;
      top: 164px;
      width: 734px;
      height: 381px;
      background: linear-gradient(to bottom, #f5f8fa 0%, #ffffff 22%, #ffffff 100%);
      padding: 67px 0 0 109px;
    }
    .formula-row {
      display: flex;
      align-items: center;
      height: 104px;
      color: #0b36c8;
      font-weight: bold;
    }
    .pta {
      font-size: 28px;
      margin-right: 27px;
      padding-top: 10px;
    }
    .fraction {
      width: 165px;
      text-align: center;
      font-size: 28px;
      line-height: 1.15;
      margin-right: 69px;
    }
    .numerator {
      padding-bottom: 9px;
      border-bottom: 3px solid #0b36c8;
      white-space: nowrap;
    }
    .denominator {
      padding-top: 9px;
    }
    .limit {
      color: #b71c22;
      font-size: 22px;
      padding-top: 4px;
      white-space: nowrap;
    }
    .definitions {
      margin-top: 33px;
      color: #0b36c8;
      font-size: 29px;
      font-weight: bold;
      line-height: 1;
    }
    .definitions div {
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <main class="slide">
    <header class="banner">PTA SHOULD BE LESS THAN 40 %</header>
    <section class="content" aria-label="PTA formula and definitions">
      <div class="formula-row">
        <div class="pta">PTA =</div>
        <div class="fraction">
          <div class="numerator">(FT + AD)</div>
          <div class="denominator">CCT</div>
        </div>
        <div class="limit">&lt; 40%</div>
      </div>
      <div class="definitions">
        <div>FT = flap thickness</div>
        <div>AD = ablation depth</div>
        <div>CCT = central corneal thickness</div>
      </div>
    </section>
  </main>
</body>
</html>
