<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习建议</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: #171717;
    }
    .page {
      position: relative;
      width: 540px;
      min-height: 721px;
      margin: 0 auto;
      overflow: hidden;
      padding: 27px 28px 24px;
      background: #fff;
    }

    .top {
      height: 143px;
      text-align: center;
      position: relative;
    }
    .tiny-pencil {
      position: absolute;
      left: 140px;
      top: -12px;
      transform: rotate(-12deg);
      color: #72a8d0;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: -3px;
    }
    .star {
      position: absolute;
      top: -16px;
      right: 151px;
      color: #f6d15a;
      font-size: 25px;
      transform: rotate(17deg);
    }
    .main-title {
      display: inline-block;
      margin-top: 3px;
      color: #fff;
      font-size: 43px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      -webkit-text-stroke: 3px #78a9cf;
      text-shadow:
        2px 2px 0 #78a9cf,
        -1px -1px 0 #78a9cf,
        2px 3px 0 #d9e7ef;
    }
    .wave {
      position: absolute;
      left: 77px;
      top: 59px;
      width: 319px;
      height: 20px;
      overflow: hidden;
    }
    .wave:before,
    .wave:after {
      content: "";
      position: absolute;
      left: 0;
      width: 319px;
      height: 9px;
      border-top: 3px solid #efca5f;
      border-radius: 50%;
    }
    .wave:before {
      top: 2px;
      transform: skewY(-3deg);
      box-shadow: 0 5px 0 -1px #f6d777, 0 10px 0 -1px #f2d06b;
    }
    .wave:after {
      top: 0;
      opacity: .58;
      transform: skewY(3deg);
    }
    .small-spark {
      position: absolute;
      left: 78px;
      top: 61px;
      color: #8ba9c2;
      font-size: 19px;
    }

    .section {
      position: relative;
      margin-top: 0;
    }
    .section-number {
      position: absolute;
      left: 0;
      top: 0;
      color: #bd65ae;
      font-family: Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: 26px;
    }
    .section-title {
      margin-left: 97px;
      color: #bd65ae;
      font-weight: 700;
      font-size: 20px;
      line-height: 27px;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .content {
      margin-top: 22px;
      font-size: 20px;
      line-height: 2.05;
      letter-spacing: .15px;
    }
    .content p {
      margin: 0;
    }
    .highlight {
      background: #ffe680;
      border-radius: 11px;
      padding: 1px 4px 2px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .author {
      margin-top: 3px !important;
      padding-right: 1px;
      text-align: right;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.7;
      letter-spacing: -.2px;
    }

    .section.second {
      margin-top: 48px;
    }
    .second .content {
      margin-top: 21px;
      line-height: 2.05;
    }
    .emphasis {
      color: #d52246;
      font-weight: 800;
    }

    .placeholder {
      position: absolute;
      right: 18px;
      bottom: -2px;
      width: 84px;
      height: 84px;
      color: transparent;
      font-size: 0;
      border: 0;
    }
    .placeholder:before {
      content: "";
      position: absolute;
      left: 31px;
      bottom: 1px;
      width: 19px;
      height: 31px;
      background: #f0b88c;
      border-radius: 9px 9px 5px 5px;
      box-shadow: -5px 30px 0 -4px #f5c89e, 8px 30px 0 -4px #f5c89e;
    }
    .placeholder:after {
      content: "";
      position: absolute;
      left: 14px;
      top: 21px;
      width: 49px;
      height: 31px;
      background: #e94c31;
      border-radius: 48% 46% 42% 44%;
      transform: rotate(-14deg);
      box-shadow: 21px 26px 0 -16px #4d9bb3;
    }
    .girl-head {
      position: absolute;
      right: 35px;
      bottom: 46px;
      z-index: 2;
      width: 20px;
      height: 20px;
      background: #f2bd91;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="tiny-pencil">✎</div>
      <div class="star">✧</div>
      <div class="main-title">学习建议</div>
      <div class="small-spark">✦</div>
      <div class="wave"></div>
    </header>

    <section class="section">
      <div class="section-number">09</div>
      <div class="section-title">「教材远比练习册重要」</div>
      <div class="content">
        <p>教材远比练习册重要。</p>
        <p>教材就是我们做题之前所要构建的一个框架，<span class="highlight">先熟<br>悉框架，然后不断地练题，才能将自己学习的这座<br>大厦构建得更加完整。</span></p>
        <p class="author">——陈哲峰(被北京大学物理学院录取)</p>
      </div>
    </section>

    <section class="section second">
      <div class="section-number">10</div>
      <div class="section-title">「有关数学与英语的学习方法」</div>
      <div class="content">
        <p>数学压轴大题的第二问我没有做出来，但这并没有<br>影响接下来的考试中我的发挥。</p>
        <p>我要保证的， <span class="emphasis">不是做出难题，而是做到容易题不丢<br>分，难题多得分。</span>最后，我数学只有压轴题扣了<br>分。</p>
      </div>
    </section>

    <div class="placeholder">[Illustration: girl holding sign, bottom-right]</div>
    <div class="girl-head"></div>
  </main>
</body>
</html>
