<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贝果食谱</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffab60;
      color: #704214;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
    }
    .page {
      width: min(94vw, 720px);
      aspect-ratio: 540 / 720;
      overflow: hidden;
      position: relative;
      padding: 12px;
      border: 6px solid #e98316;
      border-radius: 4px;
      background-color: #fffdf8;
      background-image:
        linear-gradient(90deg, rgba(245, 196, 126, .26) 50%, transparent 50%),
        linear-gradient(rgba(245, 196, 126, .26) 50%, transparent 50%);
      background-size: 24px 24px;
      box-shadow: inset 0 0 0 2px #ffcf87;
    }
    .top, .bottom {
      position: relative;
      height: 50%;
    }
    .divider {
      position: absolute;
      left: 0;
      right: 0;
      top: 49.15%;
      border-top: 6px dashed #df820d;
      z-index: 3;
    }
    .stamp {
      position: absolute;
      top: -1px;
      left: 2px;
      width: 74px;
      height: 75px;
      padding-top: 9px;
      text-align: center;
      color: #63738d;
      font-weight: 900;
      font-size: 24px;
      line-height: 1.08;
      transform: rotate(-12deg);
      border: 4px solid #72849c;
      border-radius: 5px 16px 8px 18px;
      background: rgba(255,255,250,.91);
    }
    h1 {
      margin: 0;
      padding-left: 92px;
      color: #7a4213;
      font-size: 36px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    h1 .bagel {
      display: inline-block;
      width: 35px;
      height: 25px;
      margin-left: 5px;
      vertical-align: 3px;
      background: radial-gradient(circle at 48% 46%, #fff1cf 0 18%, #c27a31 20% 31%, #f0b562 34% 59%, #a96224 61% 66%, transparent 68%);
      border-radius: 50%;
      transform: rotate(-18deg);
    }
    .subtitle {
      margin: 4px 0 0 162px;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 5px;
    }
    .ingredients {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 19px;
      margin: 3px 0 3px 122px;
      height: 70px;
    }
    .ingredient {
      width: 64px;
      text-align: center;
      font-size: 15px;
      line-height: 1.1;
      font-weight: bold;
    }
    .icon {
      height: 48px;
      margin-bottom: 2px;
      position: relative;
    }
    .cream {
      width: 58px;
      height: 34px;
      top: 10px;
      left: 3px;
      border-radius: 5px;
      background: linear-gradient(#d8f0fa 0 28%, #f7f7f2 28% 72%, #c8dce8 72%);
      border: 1px solid #83a4b4;
    }
    .cream:after {
      content: "Cream Cheese";
      position: absolute;
      left: 2px; right: 2px; top: 12px;
      font: bold 6px Arial;
      color: #cd4c36;
    }
    .mini-bagel, .bagel-large {
      border-radius: 50%;
      background: radial-gradient(circle at 51% 48%, #9c5923 0 17%, #f5c06c 19% 43%, #b76527 45% 49%, #e3a354 51% 100%);
      box-shadow: inset -8px -6px 8px rgba(95,45,10,.15);
    }
    .mini-bagel {
      width: 51px;
      height: 40px;
      margin: 5px auto 0;
    }
    .walnut {
      width: 40px;
      height: 44px;
      margin: 2px auto 0;
      border-radius: 48% 42% 50% 45%;
      background:
        radial-gradient(ellipse at 35% 37%, #efcb70 0 8%, transparent 9%),
        radial-gradient(ellipse at 64% 58%, #d49c3f 0 9%, transparent 10%),
        #a87528;
      transform: rotate(15deg);
    }
    .steps {
      margin: 3px 0 0 162px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
      letter-spacing: 2px;
    }
    .top-bagel {
      position: absolute;
      width: 161px;
      height: 116px;
      left: 0;
      top: 83px;
      border-radius: 53% 49% 47% 49%;
      background:
        radial-gradient(ellipse at center, #8d4b1d 0 15%, transparent 16%),
        radial-gradient(ellipse at 46% 46%, #f0c06c 0 50%, #a95b24 51% 56%, transparent 57%),
        #e6ad5c;
      transform: rotate(13deg);
      box-shadow: inset -14px -10px 15px rgba(99,49,9,.18);
    }
    .top-bagel:before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 5px;
      bottom: -19px;
      width: 148px;
      height: 49px;
      border-radius: 45%;
      background: repeating-linear-gradient(130deg, #5d3820 0 11px, #f8f0d4 12px 21px, #d7ad62 22px 27px);
    }
    .girl {
      position: absolute;
      left: 0;
      bottom: 7px;
      width: 120px;
      height: 130px;
    }
    .girl .head {
      position: absolute;
      left: 22px;
      top: 0;
      width: 74px;
      height: 82px;
      border: 4px solid #754017;
      border-radius: 49% 48% 42% 44%;
      background: #a96743;
    }
    .girl .face {
      position: absolute;
      z-index: 1;
      left: 31px;
      top: 23px;
      width: 53px;
      height: 48px;
      border-radius: 45%;
      background: #ffe6ae;
    }
    .girl .face:after {
      content: "●   ●";
      color: #55301d;
      font-size: 15px;
      letter-spacing: 6px;
      position: absolute;
      left: 9px;
      top: 13px;
    }
    .girl .body {
      position: absolute;
      left: 28px;
      top: 72px;
      width: 60px;
      height: 53px;
      border: 3px solid #754017;
      border-radius: 12px 12px 25px 25px;
      background: #f7edc7;
    }
    .oven {
      position: absolute;
      left: 178px;
      bottom: 16px;
      width: 91px;
      height: 77px;
      border: 3px solid #87908a;
      border-radius: 4px;
      background: #f9f6e8;
    }
    .oven:before {
      content: "••••••";
      position: absolute;
      top: 6px;
      left: 8px;
      width: 53px;
      height: 12px;
      padding-left: 4px;
      color: white;
      line-height: 11px;
      font: 9px monospace;
      border-radius: 3px;
      background: #232a26;
    }
    .oven:after {
      content: "";
      position: absolute;
      left: 11px;
      bottom: 8px;
      width: 62px;
      height: 29px;
      border: 2px solid #a8a391;
      background: linear-gradient(#5c3219 0 32%, #d58c36 34% 74%, #572e18 76%);
    }
    .bowls {
      position: absolute;
      left: 289px;
      right: 0;
      bottom: 19px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      color: #7a491a;
    }
    .arrow { font: bold 35px Arial; }
    .bowl {
      width: 82px;
      height: 42px;
      border: 2px solid #8b5b24;
      border-top: 2px solid #8b5b24;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 40% 75%, #dda72e 0 3px, transparent 4px), #fffdf4;
    }
    .bowl:last-child { transform: rotate(-7deg); background: radial-gradient(circle at 30% 35%, #dda72e 0 3px, transparent 4px), #fff1c8; }
    .bottom h1 {
      padding: 6px 0 0 102px;
      font-size: 37px;
    }
    .bottom .subtitle {
      margin: 7px 0 0 4px;
      font-size: 21px;
      letter-spacing: 4px;
    }
    .brand-note {
      position: absolute;
      right: 4px;
      top: 62px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .bottom .ingredients {
      margin: 10px 0 0 3px;
      justify-content: start;
      gap: 12px;
      height: 69px;
    }
    .banana {
      width: 26px;
      height: 47px;
      margin: 0 auto;
      border: 7px solid #f5c623;
      border-top-color: #e5a213;
      border-left-color: #ffe56e;
      border-radius: 15px 8px 19px 17px;
      transform: rotate(-15deg);
    }
    .cocoa {
      width: 49px;
      height: 43px;
      margin: 4px auto 0;
      border: 1px solid #c9b4a0;
      background: linear-gradient(#f6f3e9 0 24%, #d35f40 25% 72%, #f4eee0 73%);
    }
    .cocoa:after {
      content: "可可粉";
      position: absolute;
      color: #805736;
      font-size: 11px;
      top: 18px;
      left: 7px;
    }
    .bottom .steps {
      margin: 5px 0 0 4px;
      max-width: 390px;
      font-size: 20px;
      line-height: 1.35;
    }
    .red-tag {
      position: absolute;
      right: 83px;
      top: 121px;
      width: 68px;
      height: 72px;
      padding-top: 9px;
      text-align: center;
      color: white;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.08;
      letter-spacing: 2px;
      background: #ed5947;
      border-radius: 7px;
      transform: rotate(-10deg);
    }
    .stick {
      position: absolute;
      width: 3px;
      height: 76px;
      right: 83px;
      top: 181px;
      background: #c5934a;
      transform: rotate(-18deg);
      transform-origin: top;
    }
    .bottom-bowls {
      position: absolute;
      display: flex;
      gap: 13px;
      left: 9px;
      bottom: 11px;
      align-items: end;
    }
    .cocoa-bowl, .banana-bowl {
      width: 76px;
      height: 45px;
      border-radius: 50% 50% 47% 47%;
      border: 2px solid #794818;
      background: #fffdf4;
    }
    .cocoa-bowl:after {
      content: "";
      display: block;
      width: 58px;
      height: 28px;
      margin: 10px auto;
      border-radius: 50%;
      background: #805027;
    }
    .banana-bowl {
      width: 82px;
      height: 53px;
      background: repeating-radial-gradient(ellipse at center, #f5cd48 0 4px, #e3a91d 5px 8px, #fff6cc 9px 11px);
    }
    .flow-arrow {
      font: bold 37px Arial;
      transform: rotate(-16deg);
      color: #764615;
      margin-bottom: 9px;
    }
    .fruit {
      position: absolute;
      right: 167px;
      bottom: 81px;
      width: 34px;
      height: 14px;
      border-radius: 50%;
      background: #ffd43d;
      transform: rotate(11deg);
      box-shadow: 6px 9px 0 #ffe15e;
    }
    .bottom-bagel {
      position: absolute;
      width: 159px;
      height: 111px;
      right: -3px;
      bottom: -5px;
      z-index: 1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 52% 45%, #9b5421 0 16%, transparent 17%),
        radial-gradient(ellipse at 49% 47%, #e5a851 0 48%, #a95721 49% 55%, transparent 56%),
        #e9af5d;
      box-shadow: inset -12px -9px 13px rgba(86,42,7,.2);
    }
    .bottom-bagel:before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 3px;
      bottom: -17px;
      width: 151px;
      height: 70px;
      border-radius: 40%;
      background: repeating-linear-gradient(175deg, #683b1e 0 11px, #f1ca43 12px 24px, #f8edba 25px 34px, #79451d 35px 43px);
    }
    .placeholder span {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <div class="stamp">元气<br>满满</div>
      <h1>核桃奶酪贝果<span class="bagel"></span></h1>
      <div class="subtitle">1.准备材料</div>

      <div class="ingredients">
        <div class="ingredient"><div class="icon cream"></div>奶酪</div>
        <div class="ingredient"><div class="icon mini-bagel"></div>贝果</div>
        <div class="ingredient"><div class="icon walnut"></div>核桃仁</div>
      </div>

      <div class="steps">2.核桃仁烤2分钟左右，搓掉皮<br>3.奶酪和贝果混合到一起，涂抹<br>　在贝果上</div>

      <div class="top-bagel placeholder"><span>[贝果图片：左侧]</span></div>
      <div class="girl placeholder"><span>[女孩插图：左下]</span><div class="head"></div><div class="face"></div><div class="body"></div></div>
      <div class="oven placeholder"><span>[烤箱插图：下方中央]</span></div>
      <div class="bowls">
        <span class="arrow">⌁</span>
        <div class="bowl placeholder"><span>[碗：中间]</span></div>
        <span class="arrow">→</span>
        <div class="bowl placeholder"><span>[碗：右侧]</span></div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="bottom">
      <h1>香蕉可可贝果<span class="bagel"></span></h1>
      <div class="subtitle">1.准备材料</div>
      <div class="brand-note">@哎呀牌绿豆汤</div>

      <div class="ingredients">
        <div class="ingredient"><div class="icon cream"></div>奶酪</div>
        <div class="ingredient"><div class="icon mini-bagel"></div>贝果</div>
        <div class="ingredient"><div class="icon banana"></div>香蕉</div>
        <div class="ingredient"><div class="icon cocoa"></div>可可粉</div>
      </div>

      <div class="steps">2.奶酪加入可可粉，搅拌均匀涂<br>抹在贝果上摆上水果</div>

      <div class="red-tag">平安<br>喜乐</div>
      <div class="stick"></div>
      <div class="fruit placeholder"><span>[香蕉片：右中]</span></div>

      <div class="bottom-bowls">
        <div class="cocoa-bowl placeholder"><span>[可可碗：左下]</span></div>
        <div class="flow-arrow">→</div>
        <div class="cocoa-bowl placeholder"><span>[可可奶酪碗：中下]</span></div>
        <div class="flow-arrow">→</div>
        <div class="banana-bowl placeholder"><span>[香蕉片碗：右下]</span></div>
      </div>

      <div class="bottom-bagel placeholder"><span>[香蕉可可贝果图片：右下]</span></div>
    </section>
  </main>
</body>
</html>
