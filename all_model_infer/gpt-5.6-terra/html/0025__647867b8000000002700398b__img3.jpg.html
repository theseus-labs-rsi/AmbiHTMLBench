<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天记录</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    body {
      background: #e9e9e9;
      overflow: hidden;
    }
    .chat-screen {
      width: 540px;
      height: 720px;
      margin: 0 auto;
      padding: 4px 32px 0;
      background:
        radial-gradient(circle at 18% 28%, rgba(255,255,255,.48), transparent 25%),
        radial-gradient(circle at 76% 57%, rgba(255,255,255,.3), transparent 33%),
        linear-gradient(115deg, #e5e5e5, #f0f0f0 44%, #e4e4e4);
      position: relative;
    }
    .message {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      margin-bottom: 13px;
      width: 100%;
    }
    .avatar {
      flex: 0 0 51px;
      width: 51px;
      height: 51px;
      border-radius: 3px;
      margin-top: 0;
      background:
        linear-gradient(to bottom, rgba(52,103,153,.86) 0 57%, rgba(164,190,203,.86) 58% 75%, rgba(35,74,91,.95) 76% 100%),
        #6a9ec1;
      position: relative;
      overflow: hidden;
    }
    .avatar::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 16px;
      background: linear-gradient(165deg, transparent 0 52%, rgba(19,42,53,.92) 53% 100%);
    }
    .avatar::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 11px;
      right: 1px;
      bottom: 2px;
      background: rgba(247,247,239,.73);
      clip-path: polygon(0 100%, 55% 0, 100% 100%);
    }
    .bubble {
      max-width: 347px;
      background: rgba(255,255,255,.97);
      border-radius: 3px;
      padding: 9px 15px 8px;
      color: #111;
      font-size: 20px;
      line-height: 1.59;
      letter-spacing: .1px;
      box-shadow: 0 0 1px rgba(0,0,0,.03);
    }
    .number {
      display: inline-flex;
      width: 26px;
      height: 26px;
      margin-right: 8px;
      vertical-align: 1px;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 18px;
      line-height: 1;
      border-radius: 5px;
      background: linear-gradient(135deg, #9cc0d0, #557d95);
      border: 1px solid rgba(58,103,125,.45);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.6);
    }
    .msg6 { margin-bottom: 14px; }
    .msg6 .bubble { min-height: 236px; }
    .msg7 { margin-bottom: 13px; }
    .msg7 .bubble { min-height: 143px; }
    .msg8 { margin-bottom: 14px; }
    .msg8 .bubble { min-height: 177px; }
    .short .bubble {
      padding: 9px 16px 8px;
      min-height: 53px;
      max-width: 180px;
      line-height: 1.6;
    }
    .reply-row {
      position: absolute;
      right: 32px;
      bottom: -2px;
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }
    .reply {
      background: #92e879;
      color: #111;
      padding: 10px 16px 8px;
      font-size: 20px;
      line-height: 1.55;
      border-radius: 4px;
      white-space: nowrap;
    }
    .reply-avatar {
      width: 51px;
      height: 51px;
      border-radius: 2px;
      background: linear-gradient(135deg, #9b703e 0 25%, #473327 26% 52%, #c7a778 53% 68%, #3b281f 69%);
      position: relative;
      overflow: hidden;
    }
    .reply-avatar::after {
      content: "";
      position: absolute;
      inset: 5px 10px 4px 12px;
      background: radial-gradient(circle at 50% 24%, #d1aa7e 0 18%, transparent 19%), linear-gradient(140deg, transparent 0 36%, rgba(230,216,191,.8) 37% 58%, transparent 59%);
      opacity: .8;
    }
  </style>
</head>
<body>
  <main class="chat-screen">
    <div class="message msg6">
      <div class="avatar" aria-label="头像"></div>
      <div class="bubble"><span class="number">6</span>这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。</div>
    </div>

    <div class="message msg7">
      <div class="avatar" aria-label="头像"></div>
      <div class="bubble"><span class="number">7</span>最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰</div>
    </div>

    <div class="message msg8">
      <div class="avatar" aria-label="头像"></div>
      <div class="bubble"><span class="number">8</span>尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。</div>
    </div>

    <div class="message short">
      <div class="avatar" aria-label="头像"></div>
      <div class="bubble">你重新写吧</div>
    </div>

    <div class="reply-row">
      <div class="reply">好的，谢谢老师</div>
      <div class="reply-avatar" aria-label="头像"></div>
    </div>
  </main>
</body>
</html>
