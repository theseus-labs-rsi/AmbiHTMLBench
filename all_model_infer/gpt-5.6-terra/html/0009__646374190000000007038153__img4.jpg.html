<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Document</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f5f3e9;
    }
    body {
      display: flex;
      justify-content: center;
      font-family: "KaiTi", "STKaiti", "Songti SC", serif;
      color: #363231;
    }
    .page {
      width: 540px;
      min-height: 500px;
      overflow: hidden;
      background: #fffef6;
    }
    .text {
      padding: 4px 25px 0;
      font-size: 20px;
      line-height: 1.55;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .scene {
      position: relative;
      height: 365px;
      margin-top: 1px;
      border-top: 3px solid #477c61;
      background: linear-gradient(to bottom, #f8f6d9 0%, #fffbd9 77%, #d8e6ac 100%);
      overflow: hidden;
    }
    .window {
      position: absolute;
      top: -2px;
      width: 71px;
      height: 352px;
      border: 8px solid #437b5f;
      background: linear-gradient(130deg, #dbf0ef 0%, #f8fff7 50%, #cce8ed 100%);
    }
    .window.left {
      left: -22px;
      transform: skewY(4deg);
    }
    .window.right {
      right: -22px;
      transform: skewY(-4deg);
    }
    .window::before,
    .window::after {
      content: "";
      position: absolute;
      z-index: 1;
      background: #437b5f;
    }
    .window::before {
      top: 0;
      bottom: 0;
      left: 27px;
      width: 5px;
    }
    .window::after {
      left: 0;
      right: 0;
      top: 104px;
      height: 5px;
      box-shadow: 0 103px 0 #437b5f;
    }
    .center-window {
      position: absolute;
      left: 194px;
      top: 0;
      width: 144px;
      height: 352px;
      border: 8px solid #437b5f;
      background:
        repeating-linear-gradient(45deg, transparent 0 19px, rgba(68, 114, 89, .82) 20px 23px, transparent 24px 40px),
        repeating-linear-gradient(-45deg, transparent 0 19px, rgba(68, 114, 89, .82) 20px 23px, transparent 24px 40px),
        linear-gradient(145deg, #e7f3ed, #fbfaf0);
    }
    .curtain {
      position: absolute;
      top: 0;
      height: 54px;
      background: rgba(255, 255, 230, .92);
      border-bottom: 3px solid #e5e3bc;
    }
    .curtain.left { left: 50px; width: 144px; }
    .curtain.right { right: 50px; width: 152px; }
    .curtain::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      height: 13px;
      background: radial-gradient(circle at 7px 0, transparent 7px, #e5e3bc 7px 8px, transparent 8px) repeat-x;
      background-size: 14px 13px;
    }
    .vine {
      position: absolute;
      z-index: 4;
      top: -25px;
      left: 205px;
      width: 325px;
      height: 105px;
      border-top: 5px solid #527e49;
      border-radius: 45% 0 0 0;
      transform: rotate(7deg);
    }
    .vine::after {
      content: "❀  ❀  ❀  ❀  ❀  ❀  ❀";
      position: absolute;
      top: -9px;
      left: 21px;
      color: #ad675b;
      font-family: serif;
      font-size: 30px;
      letter-spacing: 8px;
      text-shadow: 3px 9px 0 #6e984a, 12px 4px 0 #a7c85a;
      white-space: nowrap;
    }
    .placeholder {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(80, 86, 67, .52);
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-align: center;
    }
    .characters {
      left: 62px;
      right: 54px;
      bottom: 5px;
      height: 178px;
      color: rgba(80, 86, 67, .46);
    }
    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 11px;
      background: #4a7b5d;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="text">
      “胖胖，中午好！”丫丫一进屋就看见了胖胖，<br>
      胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微<br>
      笑来和我打招呼的！”听到丫丫的话，<br>
      大家都笑了起来。
    </div>

    <section class="scene" aria-label="插图">
      <div class="vine" aria-hidden="true"></div>
      <div class="window left" aria-hidden="true"></div>
      <div class="window right" aria-hidden="true"></div>
      <div class="center-window" aria-hidden="true"></div>
      <div class="curtain left" aria-hidden="true"></div>
      <div class="curtain right" aria-hidden="true"></div>
      <div class="placeholder characters">[Illustration: duck child, chick, mother pig, and pig child standing inside an open green-framed window]</div>
      <div class="floor" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
