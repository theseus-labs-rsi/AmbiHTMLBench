    <h1 class="title">什么是审计？</h1>

    <section class="section definition">
      <h2 class="section-heading"><span class="star">★</span>审计定义</h2>
      <p>审计是对资料作出证据搜集及分析，以评估企业财务状况，然后就资料及一般公认准则之间的相关程度作出结论及报告。</p>
    </section>

    <section class="section elements">
      <h2 class="section-heading"><span class="star">★</span>审计的基本要素</h2>
      <p>任何审计都具有三个基本要素，即审计主体、审计客体和审计授权或委托人。</p>
      <p><span class="label subject">审计主体：</span>指审计行为的执行者，即审计机构和审计人员，为审计第一关系人；</p>
      <p><span class="label object">审计客体：</span>指审计行为的接受者，即指被审计的资产代管或经营者，为审计第二关系人；</p>
      <p><span class="label principal">审计授权或委托人：</span>指依法授权或委托审计主体行使审计职责的单位或人员，为审计第三关系人。</p>
    </section>

    <section class="section">
      <h2 class="section-heading"><span class="star">★</span>审计本质</h2>
      <p>审计本质是一项具有独立性的经济监督活动。</p>
    </section>
