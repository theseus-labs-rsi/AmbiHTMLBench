<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原则模板</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #292827;
      color: #eeeeee;
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
    }
    .page {
      position: relative;
      width: 540px;
      min-height: 675px;
      margin: 0 auto;
      overflow: hidden;
      padding: 42px 33px 23px;
      background-color: #292827;
      background-image:
        radial-gradient(rgba(255,255,255,.025) .6px, transparent .7px);
      background-size: 6px 6px;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 17px;
      color: #f5bf23;
      font-size: 29px;
      line-height: 1.95;
      font-weight: 700;
      letter-spacing: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      font-size: 21px;
      line-height: 1.95;
      font-weight: 400;
      letter-spacing: 0;
    }
    .item {
      margin: 0 0 4px;
    }
    .indent {
      padding-left: 10px;
    }
    .watermark {
      position: absolute;
      z-index: 0;
      color: rgba(0, 128, 79, .34);
      font-size: 43px;
      font-weight: 700;
      white-space: nowrap;
      transform: rotate(-35deg);
      pointer-events: none;
    }
    .watermark.one {
      left: 157px;
      top: 319px;
    }
    .watermark.two {
      left: 208px;
      top: 550px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="watermark one">[illegible]</div>
    <div class="watermark two">[illegible]</div>

    <h1>7.当题目中出现“原则”时，可用<br>以下模板：</h1>

    <section class="content">
      <div class="item">（一）教育性原则。…体现教育目标，有利于幼儿<br>身的全面发展</div>
      <div class="item">（二）个别差异性原则。每个幼儿不一样，教师要<br>因材施教</div>
      <div class="item indent">（三）科学性原则。…能给幼儿正确的启蒙教<br>育</div>
      <div class="item">（四）发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点</div>
      <div class="item indent">（五）整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展</div>
      <div class="item indent">（六）活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主</div>
    </section>
  </main>
</body>
</html>
