<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-controller vs. Micro-processor</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-width: 1024px;
      height: 768px;
      overflow: hidden;
      background: #ffffff;
      font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
      color: #070707;
    }
    .slide {
      position: relative;
      width: 1024px;
      height: 768px;
      background: #fff;
    }

    .header {
      position: absolute;
      top: 14px;
      left: 0;
      width: 100%;
      height: 47px;
      background: linear-gradient(90deg, #17196d 0, #333780 54%, #c8c8d1 76%, #ffffff 100%);
    }
    .header-squares {
      position: absolute;
      left: 0;
      top: 0;
      width: 78px;
      height: 47px;
    }
    .sq { position: absolute; width: 16px; height: 16px; }
    .s1 { left: 15px; top: 1px; background: #08146d; }
    .s2 { left: 31px; top: 0; background: #aeb1d2; }
    .s3 { left: 47px; top: 0; background: #c9cadc; }
    .s4 { left: 31px; top: 16px; background: #a8abd0; }
    .s5 { left: 47px; top: 16px; background: #6268a7; }
    .s6 { left: 0; top: 31px; background: #ececf2; }
    .s7 { left: 31px; top: 32px; background: #aaadd0; }
    .header-title {
      position: absolute;
      left: 86px;
      top: 0px;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 29px;
      line-height: 38px;
      font-weight: bold;
      letter-spacing: -.7px;
      text-shadow: 1px 1px 1px #4d4d4d;
    }

    .main-box {
      position: absolute;
      left: 78px;
      top: 197px;
      width: 856px;
      height: 388px;
      border: 2px solid #d0d0d0;
      border-radius: 26px;
      background: #eeeeee;
    }
    .section-title {
      position: absolute;
      top: 10px;
      font-size: 25px;
      font-weight: bold;
      text-decoration: underline;
      line-height: 32px;
    }
    .one-chip-title { left: 95px; }
    .many-chip-title { left: 470px; }

    .microcontroller {
      position: absolute;
      left: 15px;
      top: 69px;
      width: 267px;
      height: 275px;
      border: 2px solid #101010;
      background: #0b9ddd;
      padding-top: 5px;
    }
    .mc-heading {
      height: 34px;
      text-align: center;
      font-size: 25px;
      line-height: 30px;
      font-weight: bold;
    }
    .mc-row {
      display: flex;
      gap: 7px;
      margin: 3px 13px 10px 12px;
      height: 51px;
    }
    .mc-row.r2 { margin-top: 0; margin-bottom: 10px; }
    .mc-row.r3 { margin-top: 0; margin-bottom: 10px; }
    .mc-row.r4 { margin-top: 0; }
    .mini {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 51px;
      border: 2px solid #101010;
      background: #fff;
      font-weight: bold;
      font-size: 23px;
      white-space: nowrap;
    }
    .cpu { width: 61px; }
    .timer-small { width: 170px; font-size: 22px; }
    .memory-small { width: 143px; }
    .clock-small { width: 89px; }
    .io-small { width: 143px; font-size: 22px; }
    .usart-small { width: 89px; }
    .peripheral-small { width: 237px; font-size: 22px; }

    .right-blocks {
      position: absolute;
      left: 349px;
      top: 67px;
      width: 463px;
      height: 277px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 25px;
      height: 76px;
    }
    .row.second { margin-bottom: 26px; }
    .row.third { margin-bottom: 0; }
    .chip {
      height: 76px;
      border: 2px solid #101010;
      display: flex;
      align-items: center;
      padding-left: 18px;
      font-weight: bold;
      font-size: 29px;
      white-space: nowrap;
    }
    .microprocessor {
      width: 223px;
      background: #21af50;
      color: white;
      padding-left: 18px;
      font-size: 29px;
    }
    .clock {
      width: 86px;
      background: #bb805e;
      color: white;
      padding-left: 12px;
    }
    .usart {
      width: 122px;
      background: #91d0df;
      padding-left: 17px;
    }
    .memory {
      width: 222px;
      background: #0b9ddd;
      color: white;
      padding-left: 23px;
    }
    .io {
      width: 227px;
      background: #f1e7b3;
      padding-left: 15px;
    }
    .timer {
      width: 222px;
      background: #c9c9c9;
      padding-left: 5px;
      font-size: 28px;
    }
    .other {
      width: 227px;
      padding-left: 9px;
      background:
        linear-gradient(to right,
          #bdb7dc 0%, #bdb7dc 29%,
          #f1e6b3 29%, #f1e6b3 55%,
          #b4e70d 55%, #b4e70d 78%,
          #f2a7c0 78%, #f2a7c0 100%);
      font-size: 26px;
    }
    .other span {
      display: inline-block;
      background: transparent;
      white-space: nowrap;
    }
    .other-lines {
      position: absolute;
      right: 98px;
      bottom: 1px;
      width: 2px;
      height: 64px;
      background: #fff8d1;
      box-shadow: 60px 0 0 #fff8d1;
      pointer-events: none;
    }

    .footer {
      position: absolute;
      left: 0;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
    }
    .page-number {
      position: absolute;
      right: 61px;
      bottom: 21px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="header">
      <div class="header-squares" aria-hidden="true">
        <div class="sq s1"></div><div class="sq s2"></div><div class="sq s3"></div>
        <div class="sq s4"></div><div class="sq s5"></div><div class="sq s6"></div><div class="sq s7"></div>
      </div>
      <div class="header-title">Micro-controller vs. Micro-processor</div>
    </div>

    <section class="main-box" aria-label="Microcontroller and microprocessor comparison">
      <div class="section-title one-chip-title">One Chip</div>
      <div class="section-title many-chip-title">Many Different Chips</div>

      <div class="microcontroller">
        <div class="mc-heading">Microcontroller</div>
        <div class="mc-row">
          <div class="mini cpu">CPU</div>
          <div class="mini timer-small">Timer/Counter</div>
        </div>
        <div class="mc-row r2">
          <div class="mini memory-small">Memory</div>
          <div class="mini clock-small">Clock</div>
        </div>
        <div class="mc-row r3">
          <div class="mini io-small">I/O Interface</div>
          <div class="mini usart-small">USART</div>
        </div>
        <div class="mc-row r4">
          <div class="mini peripheral-small">Other Peripherals</div>
        </div>
      </div>

      <div class="right-blocks">
        <div class="row">
          <div class="chip microprocessor">Microprocessor</div>
          <div class="chip clock">Clock</div>
          <div class="chip usart">USART</div>
        </div>
        <div class="row second">
          <div class="chip memory">Memory</div>
          <div class="chip io">I/O Interfaces</div>
        </div>
        <div class="row third">
          <div class="chip timer">Timer/Counter</div>
          <div class="chip other"><span>Other Peripherals</span></div>
        </div>
        <div class="other-lines" aria-hidden="true"></div>
      </div>
    </section>

    <div class="footer">© 2015 by Eng. Mohamed Tarek.</div>
    <div class="page-number">7</div>
  </div>
</body>
</html>
