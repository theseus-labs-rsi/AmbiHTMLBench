<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2017 无校园艺术节</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #d2d2d2;
    padding: 51px 32px 50px;
    display: flex;
    justify-content: center;
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", SimSun, serif;
  }

  .poster {
    position: relative;
    width: 960px;
    height: 1441px;
    overflow: hidden;
    color: #080808;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(255,255,255,.62), transparent 42%),
      radial-gradient(ellipse at 78% 70%, rgba(217,211,193,.19), transparent 47%),
      repeating-linear-gradient(112deg, rgba(142,133,112,.025) 0 1px, transparent 1px 7px),
      #f5f3ec;
  }

  .poster:after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .22;
    background:
      radial-gradient(circle at 12% 16%, #c9c0ad 0 1px, transparent 2px),
      radial-gradient(circle at 67% 25%, #c7bdaa 0 1px, transparent 2px),
      radial-gradient(circle at 38% 64%, #d0c7b6 0 1px, transparent 2px),
      radial-gradient(circle at 90% 81%, #c7beac 0 1px, transparent 2px);
    background-size: 83px 97px, 117px 109px, 143px 131px, 101px 119px;
    mix-blend-mode: multiply;
  }

  .top-wave,
  .bottom-wave {
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }

  .top-wave {
    width: 730px;
    height: 700px;
    right: -400px;
    top: -180px;
    border-radius: 50%;
    background: repeating-radial-gradient(
      ellipse at 50% 47%,
      #142662 0 4px,
      transparent 4px 8px
    );
  }

  .bottom-wave {
    width: 800px;
    height: 800px;
    left: -230px;
    bottom: -160px;
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle at 48% 57%,
      #142662 0 4px,
      transparent 4px 8px
    );
  }

  .bottom-wave .core {
    position: absolute;
    left: 368px;
    top: 441px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #f5f3ec;
    border: 3px solid #142662;
  }

  .ghost-lines {
    position: absolute;
    z-index: 2;
    left: 355px;
    top: 116px;
    width: 350px;
    height: 735px;
    opacity: .24;
  }

  .left-head,
  .left-info,
  .central-title,
  .right-info,
  .slogan {
    position: absolute;
    z-index: 3;
  }

  .year {
    position: absolute;
    left: 35px;
    top: 70px;
    font-size: 24px;
    letter-spacing: 10px;
    white-space: nowrap;
  }

  .left-head {
    left: 32px;
    top: 101px;
    height: 232px;
  }

  .left-head .blue-column,
  .left-head .black-column {
    position: absolute;
    top: 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    line-height: 1;
  }

  .left-head .blue-column {
    left: 0;
    color: #123a86;
    font-size: 36px;
    letter-spacing: 4px;
  }

  .left-head .black-column {
    left: 50px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 3px;
  }

  .left-info {
    left: 31px;
    top: 333px;
    height: 337px;
    width: 235px;
  }

  .left-info .description {
    position: absolute;
    left: 0;
    top: 1px;
    height: 330px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .left-info .steve,
  .left-info .pascal {
    position: absolute;
    top: 0;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    white-space: nowrap;
    color: #133878;
    font-size: 47px;
    line-height: 1;
  }

  .left-info .steve { left: 29px; }
  .left-info .pascal { left: 124px; }

  .left-info .small-cn {
    position: absolute;
    left: 96px;
    top: 2px;
    height: 205px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .central-title {
    left: 390px;
    top: 165px;
    width: 210px;
    height: 660px;
    text-align: center;
    font-family: "STSong", "Songti SC", SimSun, serif;
  }

  .central-title .character {
    position: absolute;
    left: 0;
    width: 205px;
    color: #050505;
    font-size: 177px;
    line-height: 1;
    font-weight: 700;
  }

  .central-title .yi { top: 0; }
  .central-title .shu { top: 224px; }
  .central-title .jie { top: 454px; }

  .central-title .dot {
    position: absolute;
    left: 90px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #090909;
  }

  .central-title .dot.one { top: 202px; }
  .central-title .dot.two { top: 432px; }

  .right-info {
    right: 33px;
    top: 484px;
    width: 250px;
    text-align: center;
  }

  .date {
    color: #16336c;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 75px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    white-space: nowrap;
  }

  .month {
    margin-top: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .music {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
  }

  .event {
    margin-top: 84px;
    text-align: right;
    padding-right: 3px;
  }

  .event .code {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    line-height: .95;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .event .time {
    margin-top: 8px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    letter-spacing: 4px;
  }

  .event .place {
    margin-top: 10px;
    font-size: 23px;
    line-height: 1.18;
    font-weight: 700;
  }

  .event.second {
    margin-top: 24px;
  }

  .slogan {
    left: 617px;
    top: 1090px;
    width: 310px;
  }

  .slogan .cn {
    display: inline-block;
    padding-bottom: 8px;
    border-bottom: 2px solid #151515;
    font-size: 39px;
    line-height: 1.05;
    font-weight: 700;
    white-space: nowrap;
  }

  .slogan .en {
    margin-top: 10px;
    font-size: 39px;
    line-height: 1.02;
    font-weight: 400;
  }

  .slogan .en strong {
    font-weight: 800;
  }

  .slogan .boxed {
    display: inline-block;
    margin-top: 21px;
    padding: 5px 4px 4px;
    border: 2px solid #143975;
    color: #143975;
    font-size: 21px;
    line-height: 1;
    font-weight: 700;
    white-space: nowrap;
  }

  .slogan .sub-en {
    margin-top: 8px;
    color: #152b5f;
    font-size: 20px;
    line-height: 1.35;
    font-weight: 700;
  }

  @media (max-width: 960px) {
    body { padding: 0; }
    .poster {
      width: 100vw;
      height: calc(100vw * 1441 / 960);
    }
    .poster > * {
      transform-origin: top left;
    }
  }
</style>
</head>
<body>

    <div class="top-wave" aria-hidden="true"></div>

    <div class="bottom-wave" aria-hidden="true">
      <div class="core"></div>

    <div class="year">2 0 1 7</div>

    <section class="left-head" aria-label="活动名称">
      <div class="blue-column">无∞极∞限</div>
      <div class="black-column">校园艺术节</div>
    </section>

    <section class="left-info" aria-label="艺术家信息">
      <div class="description">艺术设计教父经典作品震撼展</div>

      <div class="small-cn">国际当代[?]术大师</div>

    </section>

      <div class="character yi">艺</div>

      <div class="cn">期待你的挑战</div>
      <div class="en">Look forward to<br><strong>your challenge</strong></div>
      <div class="boxed">是困守原地，还是突破重生！</div>
      <div class="sub-en">To be stuck in the same place,<br>or to break out of rebirth!</div>
