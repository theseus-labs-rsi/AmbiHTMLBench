<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抖音 VS 快手 产品小课堂</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #edcb98;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: #402222;
    }
    .page {
      position: relative;
      width: 540px;
      height: 717px;
      overflow: hidden;
      background: #edcb98;
    }
    .top-bar {
      position: absolute;
      top: 79px;
      left: 125px;
      width: 378px;
      height: 42px;
      background: #fbbd35;
    }
    .main-title {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 1px;
      font-weight: 900;
      color: #fff7e8;
      -webkit-text-stroke: 5px #482526;
      paint-order: stroke fill;
      text-shadow: 1px 2px 0 #482526;
      z-index: 2;
    }
    .sheet {
      position: absolute;
      top: 142px;
      left: 50px;
      width: 439px;
      height: 528px;
      background: #fff;
    }
    .bottom-strip {
      position: absolute;
      left: 54px;
      bottom: 24px;
      width: 434px;
      height: 23px;
      background: #fcbc24;
    }
    .brush {
      position: absolute;
      z-index: 5;
      left: 53px;
      top: 123px;
      width: 69px;
      height: 90px;
      transform: rotate(-38deg);
    }
    .brush .bristle {
      position: absolute;
      left: 4px;
      top: 1px;
      width: 36px;
      height: 50px;
      border-radius: 55% 55% 35% 35%;
      background: linear-gradient(90deg, #f6c49e 0%, #fff0d6 42%, #d69c74 100%);
      transform: rotate(-20deg);
    }
    .brush .metal {
      position: absolute;
      left: 19px;
      top: 41px;
      width: 30px;
      height: 19px;
      background: linear-gradient(90deg, #a5dddd, #ecffff, #91cfc9);
      border-radius: 2px;
    }
    .brush .handle {
      position: absolute;
      left: 25px;
      top: 57px;
      width: 21px;
      height: 42px;
      background: linear-gradient(90deg, #eac5a6, #fff0de, #ca9978);
      border-radius: 3px 3px 10px 10px;
    }
    .lesson-label {
      position: absolute;
      z-index: 4;
      top: 139px;
      left: 92px;
      width: 328px;
      height: 61px;
      border-radius: 34px;
      background: #ffe093;
      border: 2px solid #8f713a;
      box-shadow: 5px 5px 0 #78602d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      font-weight: 900;
      color: #fff8ed;
      -webkit-text-stroke: 3px #482526;
      paint-order: stroke fill;
      letter-spacing: 1px;
    }
    .section {
      position: absolute;
      left: 50px;
      width: 439px;
      z-index: 3;
    }
    .section.one { top: 232px; }
    .section.two { top: 432px; }
    .heading {
      height: 54px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .badge {
      position: absolute;
      left: -19px;
      top: 0;
      width: 95px;
      height: 38px;
      border-radius: 22px;
      background: #572a27;
      color: #f7d891;
      text-align: center;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 38px;
    }
    .heading-text {
      margin-left: 88px;
      display: inline-block;
      font-size: 24px;
      font-weight: 900;
      color: #4b2928;
      line-height: 30px;
      background: linear-gradient(transparent 53%, #ffdc85 53%, #ffdc85 92%, transparent 92%);
      padding-right: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      color: #292020;
      font-size: 12px;
      text-align: center;
    }
    .comparison th {
      height: 18px;
      color: white;
      font-size: 11px;
      font-weight: 700;
      border-right: 1px solid #ffeabd;
      background: #fbb800;
    }
    .comparison th:first-child { width: 80px; }
    .comparison td {
      height: 29px;
      padding: 2px 3px;
      line-height: 13px;
      border-right: 1px solid #fff;
      border-bottom: 2px solid #fff;
      background: #fae4c4;
    }
    .comparison tr:nth-child(3) td { background: #f8dfbc; }
    .comparison td:first-child {
      text-align: left;
      padding-left: 7px;
      font-size: 12px;
    }
    .commerce th {
      height: 20px;
      color: #fff;
      background: #fbb700;
      border-right: 1px solid #ffe9b7;
      font-size: 13px;
      font-weight: 700;
    }
    .commerce th:first-child { width: 80px; }
    .commerce td {
      height: 31px;
      padding: 2px 5px;
      line-height: 14px;
      background: #f9e0bd;
      border-right: 1px solid #fff;
      border-bottom: 2px solid #fff;
      font-size: 14px;
    }
    .commerce tr:nth-child(3) td { background: #f6d9b1; }
    .commerce td:first-child {
      text-align: left;
      padding-left: 8px;
    }
    .dash {
      position: absolute;
      bottom: 52px;
      left: 196px;
      color: #e1a824;
      font-size: 20px;
      line-height: 15px;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top-bar"></div>
    <h1 class="main-title">抖音 VS 快手</h1>

    <div class="sheet"></div>
    <div class="bottom-strip"></div>

    <div class="brush placeholder" aria-label="[Brush illustration: upper-left of lesson label]">
      <div class="bristle"></div>
      <div class="metal"></div>
      <div class="handle"></div>
    </div>

    <div class="lesson-label">产品小课堂</div>

    <section class="section one">
      <div class="heading">
        <div class="badge">03</div>
        <div class="heading-text">抖音与快手</div>
      </div>
      <table class="comparison">
        <thead>
          <tr>
            <th></th>
            <th>slogan</th>
            <th>产品定位</th>
            <th>策略</th>
            <th>变现</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>抖音</td>
            <td>记录美好生活</td>
            <td>短视频社交</td>
            <td>以优质内容为中心</td>
            <td>广告收入、电商</td>
          </tr>
          <tr>
            <td>快手</td>
            <td>拥抱每一种生活</td>
            <td>短视频社区</td>
            <td>以社交为中心，大<br>部分流量</td>
            <td>直播收入、电商</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="section two">
      <div class="heading">
        <div class="badge">04</div>
        <div class="heading-text">抖音电商与快手电商</div>
      </div>
      <table class="commerce">
        <thead>
          <tr>
            <th></th>
            <th>产品定位</th>
            <th>重点指标</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>抖音电商</td>
            <td>兴趣逻辑，内容场景刺激需<br>求</td>
            <td>直播间GPM</td>
          </tr>
          <tr>
            <td>快手电商</td>
            <td>信任逻辑，头部主播优势</td>
            <td>复购</td>
          </tr>
        </tbody>
      </table>
    </section>

    <div class="dash">——————</div>
  </main>
</body>
</html>
