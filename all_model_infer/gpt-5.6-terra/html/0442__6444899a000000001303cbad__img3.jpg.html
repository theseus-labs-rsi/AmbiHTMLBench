<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金句合集</title>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", Arial, sans-serif;
      color: #3d3d3d;
    }
    .page {
      width: 100%;
      max-width: 540px;
      min-height: 720px;
      margin: 0 auto;
      padding: 31px 35px 35px;
      background: #fff;
    }
    .toolbar {
      height: 47px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #c4ae26;
    }
    .back-title {
      display: flex;
      align-items: center;
      font-size: 24px;
      line-height: 32px;
      font-weight: 400;
      letter-spacing: .4px;
    }
    .back {
      font-family: Arial, sans-serif;
      font-size: 49px;
      line-height: 25px;
      font-weight: 200;
      transform: scaleX(.55);
      transform-origin: left center;
      width: 13px;
      margin-right: 2px;
      margin-top: -3px;
    }
    .tools {
      display: flex;
      align-items: center;
      gap: 28px;
      padding-top: 1px;
      font-family: Arial, sans-serif;
      color: #c2aa21;
    }
    .people {
      position: relative;
      width: 37px;
      height: 33px;
    }
    .people .head1,
    .people .head2 {
      position: absolute;
      border: 3px solid #c2aa21;
      border-radius: 50%;
    }
    .people .head1 {
      width: 15px;
      height: 15px;
      top: 1px;
      left: 15px;
    }
    .people .head2 {
      width: 12px;
      height: 12px;
      top: 9px;
      left: 0;
    }
    .people .body1,
    .people .body2 {
      position: absolute;
      border: 3px solid #c2aa21;
      border-top: 0;
      border-radius: 0 0 13px 13px;
    }
    .people .body1 {
      width: 23px;
      height: 15px;
      top: 16px;
      left: 13px;
    }
    .people .body2 {
      width: 17px;
      height: 11px;
      top: 20px;
      left: 0;
    }
    .share {
      position: relative;
      width: 27px;
      height: 34px;
      border: 2px solid #c2aa21;
      border-top: 0;
      border-radius: 2px;
      margin-top: 2px;
    }
    .share:before {
      content: "↑";
      position: absolute;
      left: 4px;
      top: -17px;
      font-size: 31px;
      font-weight: 300;
      line-height: 25px;
      color: #c2aa21;
    }
    .more {
      width: 32px;
      height: 32px;
      border: 2px solid #c2aa21;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      letter-spacing: 1px;
      padding-bottom: 7px;
    }
    .entry {
      margin-top: 32px;
    }
    .entry.second {
      margin-top: 79px;
    }
    .heading {
      display: flex;
      align-items: center;
      margin-bottom: 39px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
      color: #424242;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .check {
      width: 32px;
      height: 32px;
      margin-right: 20px;
      border-radius: 50%;
      background: #f5bd0b;
      color: #fff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      line-height: 32px;
      text-align: center;
      flex: 0 0 32px;
    }
    .quote {
      margin: 0;
      font-size: 23px;
      line-height: 1.54;
      font-weight: 400;
      letter-spacing: .2px;
      color: #424242;
    }
    .source {
      white-space: nowrap;
    }
    .second .heading {
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="toolbar">
      <div class="back-title"><span class="back">‹</span><span>金句合集</span></div>
      <div class="tools" aria-hidden="true">
        <span class="people"><i class="head1"></i><i class="head2"></i><i class="body1"></i><i class="body2"></i></span>
        <span class="share"></span>
        <span class="more">•••</span>
      </div>
    </header>

    <section class="entry">
      <div class="heading"><span class="check">✓</span><span>他写「成长」，正是你所亲历</span></div>
      <p class="quote">“我经由光阴，经由山水，经由乡村和城<br>市，同样我也经由别人，经由一切他者以<br>及由之引生的思绪和梦想而走成了我。那<br>路途中的一切，有些与我擦肩而过从此天<br>各一方，有些便永久驻进我的心魂，雕琢<br>我、塑造我、锤炼我、融入我而成为我。”<br><span class="source">——《病隙碎笔》</span></p>
    </section>

    <section class="entry second">
      <div class="heading"><span class="check">✓</span><span>他写「磨难」，报之以歌</span></div>
      <p class="quote">“大劫大难之后人不该失去锐气，不该失去<br>热度，你镇定了但仍在燃烧，你平稳了却<br>更加浩荡。”——《好运设计》</p>
    </section>
  </main>
</body>
</html>
