<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报名和考试 - 可以自学吗？</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .poster-card {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, #d2e8fb 0%, #edf5fd 18%, #ffffff 45%, #eff6fd 80%, #b2d7f8 100%);
      padding: 36px 30px 20px 30px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }
    .badge-title {
      display: inline-block;
      background-color: #1765e3;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      padding: 4px 16px;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
    }
    .section-1 {
      margin-bottom: 36px;
    }
    .section-1 p {
      font-size: 16px;
      line-height: 1.7;
      color: #111111;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }
    .section-2 {
      margin-bottom: 25px;
    }
    .content-block {
      margin-top: 18px;
    }
    .content-item {
      font-size: 15.5px;
      line-height: 1.65;
      color: #111111;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: justify;
      letter-spacing: 0.2px;
    }
    .highlight-blue {
      color: #266bca;
    }
    .illustrations-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      height: 140px;
      margin-top: 10px;
      padding: 0 10px;
    }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.4);
      border: 1px dashed rgba(60, 110, 170, 0.4);
      color: #4a75a0;
      font-size: 12px;
      text-align: center;
      box-sizing: border-box;
    }
    .chart-circle {
      width: 140px;
      height: 130px;
    }
    .chart-bar {
      width: 150px;
      height: 140px;
    }
  </style>
</head>
<body>

  <main class="poster-card">
    <!-- Section 1 -->
    <section class="section-1">
      <div class="badge-title">报名和考试</div>
      <p>个人参赛，由所在中学进行统一报名；</p>
      <p>均为笔试考试，预赛为各省市自行组织、自主命题；</p>
      <p>剩余考试环节均为全国统一命题。</p>
    </section>

    <!-- Section 2 -->
    <section class="section-2">
      <div class="badge-title">可以自学吗？</div>
      <div class="content-block">
        <p class="content-item">
          1、<span class="highlight-blue">高中课本内容可以自学</span>，当然我们也有初高中基础知识课程，让你快速掌握竞赛考点。
        </p>
        <p class="content-item">
          2、一些难的知识点和不知道如何规划学习进度的时候，最好选择报课，大部分学生在有人一起学的情况下会比较好。<br>
          有时候你以为自己自学学的挺好，但是很多竞赛技巧、思维是需要老师来指导的。时间和钱，不能兼得。
        </p>
      </div>
    </section>

    <!-- Visual Placeholders at Bottom -->
    <div class="illustrations-container">
      <figure class="placeholder chart-circle">
        [Diagram: Circular Sunburst / Network Chart]
      </figure>
      <figure class="placeholder chart-bar">
        [Chart: 3D Isometric Bar Chart]
      </figure>
    </div>
  </main>

</body>
</html>
