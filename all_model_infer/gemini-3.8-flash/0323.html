<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何避免/减少巴纳姆效应?</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0ede6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }

  .card {
    position: relative;
    width: 540px;
    background-color: #fbf7ee;
    padding: 120px 48px 80px 48px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }

  /* Top Right Bookmark Ribbon */
  .bookmark {
    position: absolute;
    top: 0;
    right: 70px;
    width: 52px;
    height: 72px;
    background-color: #dfb226;
    color: #ffffff;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
    padding-bottom: 8px;
  }

  /* Rainbow Arch Decoration */
  .rainbow-container {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 240px;
    pointer-events: none;
    overflow: hidden;
  }

  .rainbow-arch {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 260px 260px 0 0;
  }

  .arch-1 {
    width: 440px;
    height: 140px;
    border: 14px solid #bce1db;
    border-bottom: none;
  }

  .arch-2 {
    width: 412px;
    height: 126px;
    border: 14px solid #f9e8b8;
    border-bottom: none;
  }

  .arch-3 {
    width: 384px;
    height: 112px;
    border: 14px solid #f4c6bd;
    border-bottom: none;
  }

  /* Title */
  .title-wrapper {
    position: relative;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 56px;
    z-index: 2;
  }

  .title-wrapper h1 {
    font-size: 28px;
    font-weight: 800;
    color: #111111;
    letter-spacing: 0.5px;
  }

  /* Content List */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .item {
    font-size: 17.5px;
    line-height: 1.6;
    color: #1a1a1a;
    font-weight: 500;
    text-align: justify;
  }

  .highlight {
    color: #cca028;
    font-weight: 600;
  }

  /* Subtle Watermarks */
  .watermark {
    position: absolute;
    color: rgba(220, 180, 140, 0.28);
    font-size: 15px;
    font-weight: bold;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }

  .wm-1 {
    top: 265px;
    left: 200px;
    transform: rotate(-35deg);
  }

  .wm-2 {
    bottom: 275px;
    left: 120px;
    transform: rotate(-35deg);
  }

  .wm-3 {
    bottom: 95px;
    right: 140px;
    transform: rotate(-35deg);
  }
</style>
</head>
<body>

<div class="card">
  <!-- Top Right Ribbon -->
  <div class="bookmark">
    <span>心</span>
    <span>理</span>
  </div>

  <!-- Background Rainbow Arch -->
  <div class="rainbow-container">
    <div class="rainbow-arch arch-1"></div>
    <div class="rainbow-arch arch-2"></div>
    <div class="rainbow-arch arch-3"></div>
  </div>

  <!-- Watermarks -->
  <div class="watermark wm-1">@小颖</div>
  <div class="watermark wm-2">@小颖</div>
  <div class="watermark wm-3">PPT by @小颖</div>

  <!-- Header Title -->
  <div class="title-wrapper">
    <h1>如何避免/减少巴纳姆效应?</h1>
  </div>

  <!-- Numbered Points -->
  <div class="content">
    <div class="item">
      1、要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。
    </div>

    <div class="item">
      2、我们的自我认知往往是主观的，我们需要保持<span class="highlight">谦虚和开放</span>的心态，不要<span class="highlight">过分自信或者自卑</span>。我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。
    </div>

    <div class="item">
      3、<span class="highlight">听取他人的评价。</span>全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。
    </div>

    <div class="item">
      4、我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要<span class="highlight">学会辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。
    </div>
  </div>
</div>

</body>
</html>
