<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城 - 李白</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #2b2f3e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 540px;
    height: 720px;
    background-color: #515b85;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    overflow: hidden;
  }
  .main-content {
    flex: 1;
    position: relative;
    padding: 40px;
  }
  .poem-group-right {
    position: absolute;
    top: 105px;
    right: 50px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 38px;
    line-height: 1.8;
    letter-spacing: 12px;
    color: rgba(255, 255, 255, 0.28);
    font-weight: 500;
  }
  .poem-group-center {
    position: absolute;
    top: 180px;
    right: 200px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 32px;
    line-height: 1.7;
    letter-spacing: 10px;
    color: #ffffff;
    font-weight: normal;
  }
  .meta-left {
    position: absolute;
    top: 105px;
    left: 40px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 14px;
    letter-spacing: 6px;
    color: rgba(255, 255, 255, 0.85);
    display: flex;
    gap: 20px;
  }
  .meta-left span {
    display: inline-block;
  }
  .footer-bar {
    height: 38px;
    background-color: #fbedd2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }
  .footer-text {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    font-size: 11.5px;
    color: #4a3c31;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="card">
  <div class="main-content">
    <div class="meta-left">
      <span>唐</span>
      <span>李白</span>
      <span>早发白帝城</span>
    </div>

    <div class="poem-group-center">
      <div>两岸猿声啼不住，</div>
      <div>轻舟已过万重山。</div>
    </div>

    <div class="poem-group-right">
      <div>朝辭白帝彩云間</div>
      <div>千里江陵一日還</div>
    </div>
  </div>

  <div class="footer-bar">
    <p class="footer-text">两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。</p>
  </div>
</div>

</body>
</html>
