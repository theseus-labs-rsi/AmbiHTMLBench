<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2017年 12月第一套 Text 1</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }
  .screen-frame {
    position: relative;
    width: 960px;
    height: 720px;
    background-color: #eceee9;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    overflow: hidden;
    color: #a8382c;
  }
  /* Status Bar */
  .status-bar {
    position: absolute;
    top: 8px;
    left: 12px;
    font-size: 13px;
    color: #4a4a4a;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }
  /* Top camera indicator / pill */
  .notch {
    position: absolute;
    top: 6px;
    left: 295px;
    width: 70px;
    height: 90px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
  }
  /* Webcam Inset */
  .webcam-inset {
    position: absolute;
    top: 0;
    right: 0;
    width: 180px;
    height: 140px;
    background-color: #1e1e1e;
    border-left: 2px solid #555;
    border-bottom: 2px solid #555;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #aaa;
    font-size: 12px;
    z-index: 10;
  }
  .webcam-inset .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #333;
    color: #ddd;
    font-size: 13px;
    text-align: center;
  }
  /* Slide Content Area */
  .slide-container {
    padding: 70px 60px 40px 105px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .header-group {
    margin-bottom: 35px;
  }
  .header-group .title {
    font-size: 23px;
    line-height: 1.6;
    font-weight: 500;
  }
  .header-group .item-1 {
    font-size: 23px;
    line-height: 1.6;
    margin-top: 15px;
    font-weight: 500;
  }
  /* Main Centered Title */
  .center-heading {
    text-align: center;
    font-size: 38px;
    color: #111111;
    letter-spacing: 1px;
    margin-top: 10px;
    margin-bottom: 30px;
    font-weight: 400;
    margin-right: 45px;
  }
  /* Body Content */
  .list-section {
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-size: 22px;
    font-weight: 500;
  }
  .row-flex {
    display: flex;
    align-items: baseline;
  }
  .item-2-wrap {
    display: flex;
    align-items: baseline;
    gap: 15px;
  }
  .red-underline {
    position: relative;
    display: inline-block;
  }
  .red-underline::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 100%;
    height: 4px;
    background-color: #d81e06;
    border-radius: 2px;
  }
  .columns-wrap {
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
  }
  .left-col {
    width: 440px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .right-col {
    margin-left: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .right-col .item-6 {
    font-size: 22px;
  }
  .right-col .sub-note {
    font-size: 22px;
    padding-left: 36px;
  }
</style>
</head>
<body>

<div class="screen-frame">
  <!-- Tablet Status Bar -->
  <div class="status-bar">
    <span>19:29</span>
    <span>5月14日周五</span>
  </div>

  <div class="notch"></div>

  <!-- Webcam stream placeholder in upper-right corner -->
  <div class="webcam-inset">
    <div class="placeholder">[Video: Lecturer]</div>
  </div>

  <!-- Presentation Slide -->
  <div class="slide-container">
    <div class="header-group">
      <div class="title">固化的做题思维:</div>
      <div class="item-1">1. 喜欢忠于自己的内心和感觉。</div>
    </div>

    <div class="center-heading">
      2017年 12月第一套 Text 1
    </div>

    <div class="list-section">
      <!-- Item 2 -->
      <div class="item-2-wrap">
        <span>2. 喜欢选<span class="red-underline">符合常识的选项。</span></span>
        <span>20年左右的常识和经验的累积</span>
      </div>

      <!-- Parallel Columns for 3, 4, 5 and 6 -->
      <div class="columns-wrap">
        <div class="left-col">
          <div>3. 喜欢选自己认识的选项。</div>
          <div>4. 喜欢选自己不认识的选项。</div>
          <div>5. 火急火燎一把火</div>
        </div>

        <div class="right-col">
          <div class="item-6">6. 囫囵吞枣选择法</div>
          <div class="sub-note">(有逃避，有厌烦)</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
