<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色出行 低碳环保 - 光明日报</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #333;
        }

        .newspaper-page {
            width: 800px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Bar */
        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 12px 24px 8px;
            border-bottom: 2px solid #005b82;
            background: #ffffff;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .masthead-logo {
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", serif;
            font-size: 30px;
            font-weight: bold;
            color: #d11a2a;
            letter-spacing: 2px;
            line-height: 1;
        }

        .header-center {
            font-size: 11px;
            color: #333333;
            letter-spacing: 0.5px;
            padding-bottom: 2px;
        }

        .header-right {
            display: flex;
            align-items: baseline;
            gap: 12px;
            color: #0b4971;
            font-weight: bold;
        }

        .section-name {
            font-size: 26px;
            letter-spacing: 3px;
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
        }

        .page-number {
            font-size: 26px;
            font-family: Arial, sans-serif;
        }

        /* Poster Area */
        .poster-container {
            position: relative;
            background-color: #e4f3d2;
            background-image: 
                linear-gradient(30deg, rgba(160, 205, 130, 0.25) 12%, transparent 12.5%, transparent 87%, rgba(160, 205, 130, 0.25) 87.5%, rgba(160, 205, 130, 0.25)),
                linear-gradient(150deg, rgba(160, 205, 130, 0.25) 12%, transparent 12.5%, transparent 87%, rgba(160, 205, 130, 0.25) 87.5%, rgba(160, 205, 130, 0.25)),
                linear-gradient(60deg, rgba(160, 205, 130, 0.15) 25%, transparent 25.5%, transparent 75%, rgba(160, 205, 130, 0.15) 75.5%, rgba(160, 205, 130, 0.15)),
                linear-gradient(60deg, rgba(160, 205, 130, 0.15) 25%, transparent 25.5%, transparent 75%, rgba(160, 205, 130, 0.15) 75.5%, rgba(160, 205, 130, 0.15));
            background-size: 40px 70px;
            margin: 14px;
            height: 1040px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top-Left Tag */
        .series-tag {
            position: absolute;
            top: 28px;
            left: 38px;
            font-size: 19px;
            font-weight: 800;
            color: #1a7a38;
            letter-spacing: 1px;
        }

        /* Main Headline */
        .main-headline {
            position: absolute;
            top: 110px;
            right: 80px;
            text-align: right;
            line-height: 1.25;
        }

        .main-headline h1 {
            font-size: 54px;
            font-weight: 900;
            color: #0c7b39;
            letter-spacing: 4px;
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
        }

        /* Illustration Center */
        .artwork-container {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 650px;
            height: 520px;
            pointer-events: none;
        }

        /* Content Text Paragraph */
        .body-text-block {
            position: absolute;
            top: 720px;
            left: 80px;
            width: 380px;
            font-size: 13.5px;
            line-height: 1.9;
            color: #222222;
            text-align: justify;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Footer Waves and Sign-off */
        .footer-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
        }

        .footer-logo {
            position: absolute;
            bottom: 22px;
            right: 50px;
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", serif;
            font-size: 28px;
            color: #ffffff;
            letter-spacing: 3px;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="newspaper-page">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="masthead-logo">光明日報</span>
        </div>
        <div class="header-center">
            2025年 1月5日 星期日
        </div>
        <div class="header-right">
            <span class="section-name">公益广告</span>
            <span class="page-number">05</span>
        </div>
    </header>

    <!-- Main Advertisement Body -->
    <div class="poster-container">
        <!-- Series Title -->
        <div class="series-tag">绿色生活系列公益广告</div>

        <!-- Headline -->
        <div class="main-headline">
            <h1>绿色出行</h1>
            <h1>低碳环保</h1>
        </div>

        <!-- Central Vector Illustration -->
        <div class="artwork-container">
            <svg viewBox="0 0 650 520" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="leafGradTop" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3fa844"/>
                        <stop offset="50%" stop-color="#46a337"/>
                        <stop offset="100%" stop-color="#2c7229"/>
                    </linearGradient>
                    <linearGradient id="leafGradBottom" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#3aa13e"/>
                        <stop offset="100%" stop-color="#236624"/>
                    </linearGradient>
                </defs>

                <!-- Cyclist Silhouette -->
                <g id="cyclist" fill="#000000">
                    <!-- Head -->
                    <circle cx="240" cy="135" r="14" />
                    
                    <!-- Body / Back (Stylized angular swooshes) -->
                    <path d="M 252 142 
                             C 260 160, 275 180, 310 185
                             L 350 190
                             L 295 160
                             C 275 145, 260 140, 252 142 Z" />
                             
                    <!-- Torso & Arms reaching forward -->
                    <path d="M 248 147 
                             L 200 190 
                             L 225 190 
                             L 260 160 
                             L 280 180
                             L 320 220
                             L 330 205
                             L 290 170 Z" />

                    <!-- Lower Body / Legs / Pedaling motion -->
                    <path d="M 270 175 
                             C 255 190, 250 205, 255 220 
                             C 260 235, 280 250, 310 270 
                             L 350 285
                             C 315 275, 290 260, 280 240
                             C 270 220, 285 200, 305 185 Z" />
                </g>

                <!-- Wheels (Green rings / infinity loops) -->
                <!-- Front Wheel (Left) -->
                <ellipse cx="215" cy="235" rx="58" ry="68" fill="none" stroke="#85c418" stroke-width="20" transform="rotate(-15 215 235)" />
                <!-- Back Wheel (Right) -->
                <ellipse cx="370" cy="240" rx="58" ry="68" fill="none" stroke="#8ec823" stroke-width="20" transform="rotate(15 370 240)" />

                <!-- Shadow under leaf -->
                <ellipse cx="350" cy="385" rx="200" ry="20" fill="rgba(60, 110, 40, 0.15)" />

                <!-- Base Leaf Graphic -->
                <g id="leaf" transform="translate(10, 280)">
                    <!-- Leaf Top Section -->
                    <path d="M 65 35 
                             L 470 35 
                             C 490 55, 485 85, 440 100
                             C 360 125, 240 135, 80 75
                             C 70 60, 65 45, 65 35 Z" 
                          fill="url(#leafGradTop)" />

                    <!-- Leaf Main/Bottom Body -->
                    <path d="M 80 75 
                             C 220 130, 350 120, 440 100
                             C 495 95, 520 98, 590 115
                             C 595 120, 595 128, 580 130
                             C 520 125, 490 120, 450 128
                             C 420 180, 340 230, 215 230
                             C 145 230, 100 180, 80 75 Z" 
                          fill="url(#leafGradBottom)" />

                    <!-- Leaf Vein (Center Stem) -->
                    <path d="M 90 75 
                             C 220 130, 370 118, 450 100
                             C 510 90, 550 105, 590 118
                             L 590 123
                             C 545 110, 490 102, 440 115
                             C 360 135, 220 140, 90 78 Z" 
                          fill="#ffffff" opacity="0.9" />

                    <!-- Leaf Veins (Branching Ribs) -->
                    <path d="M 185 108 C 220 145, 275 165, 335 178" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
                    <path d="M 285 123 C 340 145, 385 155, 440 152" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
                    <path d="M 230 70 C 275 60, 330 65, 375 75" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
                    <path d="M 330 70 C 370 65, 410 70, 440 82" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
                </g>
            </svg>
        </div>

        <!-- Text Description -->
        <div class="body-text-block">
            选择绿色出行方式，既节约能源、减少污染，又益于健康、兼顾效率。多乘坐公共汽车、地铁等公共交通工具，或者选择步行、骑自行车等出行方式，降低出行中产生的能耗和污染，绿色出行、低碳出行、文明出行。
        </div>

        <!-- Decorative Bottom Green Waves -->
        <svg class="footer-waves" viewBox="0 0 772 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Light green bottom accent curve -->
            <path d="M 0 110 C 200 140, 480 130, 772 30 L 772 160 L 0 160 Z" fill="#69b829" opacity="0.8" />
            <!-- Middle green curve -->
            <path d="M 0 115 C 220 155, 520 110, 772 50 L 772 160 L 0 160 Z" fill="#4ea52b" />
            <!-- Deep green wave banner -->
            <path d="M 0 140 C 240 160, 480 120, 772 75 L 772 160 L 0 160 Z" fill="#2d7e2f" />
        </svg>

        <!-- Bottom Signature -->
        <div class="footer-logo">光明日報社</div>
    </div>
</div>

</body>
</html>
