<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题模板</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #222222;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 40px 30px;
    box-sizing: border-box;
    color: #ffffff;
    font-size: 19px;
    line-height: 1.65;
    letter-spacing: 0.5px;
  }

  .title {
    color: #e5a73b;
    font-size: 25px;
    font-weight: bold;
    line-height: 1.45;
    margin-bottom: 24px;
  }

  .section-item {
    margin-bottom: 20px;
  }

  p {
    margin: 0;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">
    7.当题自中出现“原则”时，可用<br>
    以下模板：
  </div>

  <div class="section-item">
    <p>(一)教育性原则。...体现教育目标，有利于幼儿</p>
    <p>身 的全面发展</p>
  </div>

  <div class="section-item">
    <p>(二)个别差异性原则。每个幼儿不一样，教师要</p>
    <p>因材施教</p>
  </div>

  <div class="section-item">
    <p>(三) 科学性原则 。...能给幼儿正确的启蒙教</p>
    <p>育</p>
  </div>

  <div class="section-item">
    <p>(四)发展适宜性原则。考虑到不同年龄阶段孩子</p>
    <p>的特点</p>
  </div>

  <div class="section-item">
    <p>(五) 整体性原则 。考虑到多方面的要素，促</p>
    <p>进幼儿整体的发展</p>
  </div>

  <div class="section-item">
    <p>(六) 活动性原则 。注重幼儿亲身体验，直接</p>
    <p>参与，以各种游戏活动为主</p>
  </div>
</div>

</body>
</html>
