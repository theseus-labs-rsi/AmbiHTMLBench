<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL IN: The Fight for Democracy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      color: #000;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .poster-container {
      width: 100%;
      max-width: 600px;
      min-height: 900px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 30px 25px 30px;
      position: relative;
    }

    /* Top Banner */
    .top-header {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #000000;
      margin-top: 5px;
    }

    /* Main Center Title Section */
    .title-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 150px;
      margin-bottom: 50px;
    }
    .subtitle-top {
      font-family: 'Oswald', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #125ecc;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2px;
      align-self: flex-start;
      margin-left: 55px;
    }
    .title-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 16px;
    }
    .title-left {
      font-family: 'Oswald', sans-serif;
      font-size: 125px;
      font-weight: 700;
      line-height: 0.82;
      color: #125ecc;
      letter-spacing: -0.01em;
      transform: scaleY(1.15);
      transform-origin: top;
      white-space: nowrap;
    }
    .title-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 0 14px 0;
      width: 200px;
    }
    .right-fight {
      font-family: 'Oswald', sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 0.95;
      color: #125ecc;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .red-bar {
      height: 7px;
      background-color: #e32232;
      width: 100%;
    }
    .right-democracy {
      font-family: 'Oswald', sans-serif;
      font-size: 35px;
      font-weight: 700;
      line-height: 0.95;
      color: #125ecc;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    /* Middle Laurel & Credits */
    .middle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .festival-laurel {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #5587be;
      position: relative;
    }
    .laurel-inner {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .laurel-svg {
      width: 32px;
      height: 60px;
      fill: none;
      stroke: #5587be;
      stroke-width: 1.5;
    }
    .festival-text {
      text-align: center;
      font-family: 'Georgia', serif;
      line-height: 1.1;
      padding: 0 4px;
    }
    .fest-title {
      font-size: 15px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: 0.02em;
    }
    .fest-year {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      margin-top: 4px;
    }
    .credits-line {
      font-family: 'Oswald', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #5892cc;
      text-transform: uppercase;
      display: flex;
      gap: 14px;
    }
    .credits-line span {
      display: inline-block;
    }
    .credit-role {
      font-weight: 500;
      opacity: 0.9;
    }

    /* Release Info */
    .release-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }
    .coming-soon {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #000;
    }
    .date-stream-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .release-date {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.06em;
      color: #000;
    }
    .vertical-sep {
      width: 2px;
      height: 28px;
      background-color: #000;
    }
    .prime-video-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .prime-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .prime-smile {
      width: 68px;
      height: 12px;
      margin-top: -2px;
    }

    /* Campaign Hashtag */
    .hashtag-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      margin: 15px 0 10px 0;
    }
    .hashtag-bar {
      height: 3px;
      background-color: #e32232;
      width: 100%;
    }
    .hashtag-text {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #125ecc;
      letter-spacing: 0.04em;
      margin: 3px 0;
    }

    /* Footer Info */
    .footer-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 15px;
      padding: 0 10px;
    }
    .rating-box {
      border: 1px solid #111;
      padding: 2px 5px;
      font-size: 7px;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      width: 50px;
    }
    .rating-top {
      font-weight: 900;
      font-size: 9px;
      border-bottom: 1px solid #111;
      padding-bottom: 1px;
      margin-bottom: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rating-desc {
      font-size: 4px;
      line-height: 1.1;
      text-transform: uppercase;
    }
    .amazon-studios {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 7px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: right;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <!-- Top Amazon Original Header -->
    <div class="top-header">
      Amazon Original
    </div>

    <!-- Main Title Block -->
    <div class="title-section">
      <div class="subtitle-top">How the Right to Vote Went Wrong</div>
      <div class="title-row">
        <div class="title-left">ALL IN</div>
        <div class="title-right">
          <div class="right-fight">The Fight For</div>
          <div class="red-bar"></div>
          <div class="right-democracy">Democracy</div>
          <div class="red-bar"></div>
        </div>
      </div>
    </div>

    <!-- Festival Laurel & Credits -->
    <div class="middle-section">
      <div class="festival-laurel">
        <div class="laurel-inner">
          <!-- Left Laurel Leaf Branch -->
          <svg class="laurel-svg" viewBox="0 0 30 60">
            <path d="M26,55 C22,46 14,40 10,28 C8,21 8,12 18,5" />
            <path d="M12,48 C7,46 4,40 7,35 C9,36 12,41 12,48 Z" fill="#5587be" />
            <path d="M9,36 C4,33 2,26 6,22 C8,24 10,29 9,36 Z" fill="#5587be" />
            <path d="M8,24 C3,20 2,13 7,9 C9,11 10,16 8,24 Z" fill="#5587be" />
            <path d="M11,13 C8,8 9,3 15,1 C16,4 14,9 11,13 Z" fill="#5587be" />
            <path d="M17,54 C13,48 11,43 15,38 C17,42 17,47 17,54 Z" fill="#5587be" />
            <path d="M13,42 C10,36 9,31 13,26 C15,30 15,35 13,42 Z" fill="#5587be" />
            <path d="M12,30 C10,24 10,19 14,14 C15,18 15,23 12,30 Z" fill="#5587be" />
          </svg>

          <div class="festival-text">
            <div class="fest-title">Telluride<br>Film Festival</div>
            <div class="fest-year">2020</div>
          </div>

          <!-- Right Laurel Leaf Branch -->
          <svg class="laurel-svg" viewBox="0 0 30 60" style="transform: scaleX(-1);">
            <path d="M26,55 C22,46 14,40 10,28 C8,21 8,12 18,5" />
            <path d="M12,48 C7,46 4,40 7,35 C9,36 12,41 12,48 Z" fill="#5587be" />
            <path d="M9,36 C4,33 2,26 6,22 C8,24 10,29 9,36 Z" fill="#5587be" />
            <path d="M8,24 C3,20 2,13 7,9 C9,11 10,16 8,24 Z" fill="#5587be" />
            <path d="M11,13 C8,8 9,3 15,1 C16,4 14,9 11,13 Z" fill="#5587be" />
            <path d="M17,54 C13,48 11,43 15,38 C17,42 17,47 17,54 Z" fill="#5587be" />
            <path d="M13,42 C10,36 9,31 13,26 C15,30 15,35 13,42 Z" fill="#5587be" />
            <path d="M12,30 C10,24 10,19 14,14 C15,18 15,23 12,30 Z" fill="#5587be" />
          </svg>
        </div>
      </div>

      <div class="credits-line">
        <div><span class="credit-role">WRITTEN BY</span> JACK YOUNGELSON</div>
        <div><span class="credit-role">DIRECTED BY</span> LIZ GARBUS <span class="credit-role">AND</span> LISA CORTÉS</div>
      </div>
    </div>

    <!-- Release Info -->
    <div class="release-section">
      <div class="coming-soon">COMING SOON TO THEATERS</div>
      <div class="date-stream-row">
        <div class="release-date">SEPTEMBER 18</div>
        <div class="vertical-sep"></div>
        <div class="prime-video-brand">
          <div class="prime-text">prime video</div>
          <svg class="prime-smile" viewBox="0 0 100 20">
            <path d="M 5 6 Q 52 24 95 6" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" />
            <path d="M 88 12 L 96 6 L 94 15 Z" fill="#000" />
          </svg>
        </div>
      </div>

      <!-- Campaign Hashtag -->
      <div class="hashtag-block">
        <div class="hashtag-bar"></div>
        <div class="hashtag-text">#ALLINFORVOTING</div>
        <div class="hashtag-bar"></div>
      </div>
    </div>

    <!-- Bottom Metadata / Logos -->
    <div class="footer-row">
      <div class="rating-box">
        <div class="rating-top">
          <span>PG-13</span>
        </div>
        <div class="rating-desc">
          Parents Strongly Cautioned
        </div>
      </div>

      <div class="amazon-studios">
        Amazon<br>Studios
      </div>
    </div>
  </div>

</body>
</html>
