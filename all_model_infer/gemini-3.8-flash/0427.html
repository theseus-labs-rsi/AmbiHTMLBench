<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业长图 设计分享</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #000;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .container {
    width: 520px;
    background-color: #b3f802;
    border: 3px solid #000;
    overflow: hidden;
  }

  /* Header */
  .header {
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .header-center {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: normal;
  }
  .design-pill {
    border: 1.5px solid #fff;
    border-radius: 20px;
    padding: 1px 12px;
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* Main Split Layout */
  .content {
    display: flex;
    border-top: 2px solid #000;
  }
  .col-left {
    width: 50%;
    border-right: 2px solid #000;
    display: flex;
    flex-direction: column;
    position: relative;
    background-color: #b3f802;
  }
  .col-right {
    width: 50%;
    display: flex;
    flex-direction: column;
    position: relative;
    background-color: #b3f802;
  }

  /* Lined Text Areas */
  .ruled-paper {
    padding: 12px 10px;
    line-height: 24px;
    font-size: 13px;
    font-weight: 700;
    color: #000;
  }
  .ruled-line {
    border-bottom: 1.5px solid #234d05;
    min-height: 24px;
    display: flex;
    align-items: flex-end;
  }

  /* Middle Graphic Block Left */
  .fight-box {
    position: relative;
    background: radial-gradient(circle, #e9fa75 25%, #b3f802 75%);
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
    padding: 15px 8px 30px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  .label-tag {
    background: #fff;
    border: 2px solid #000;
    padding: 2px 8px;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
    z-index: 2;
  }
  .gloves-container {
    position: relative;
    width: 100%;
    height: 70px;
    margin: 5px 0;
  }
  .glove {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: 2px 2px 0 #000;
  }
  .glove-blue {
    background: #5650eb;
    left: 4px;
    top: 5px;
  }
  .glove-pink {
    background: #ff1269;
    right: 4px;
    top: 5px;
  }

  .pk-stage {
    position: relative;
    width: 100%;
    height: 140px;
    margin-top: 5px;
  }
  .ring-ropes {
    position: absolute;
    width: 90%;
    height: 70px;
    left: 5%;
    top: 0;
    border: 2px solid #ff1269;
    border-radius: 4px;
    transform: perspective(100px) rotateX(25deg);
  }
  .pk-text {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 10px;
    font-size: 54px;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    z-index: 3;
    display: flex;
    justify-content: center;
  }
  .pk-p {
    color: #5650eb;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    transform: rotate(-5deg);
  }
  .pk-k {
    color: #ff1269;
    text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    transform: rotate(5deg);
  }

  .banner-slanted {
    position: absolute;
    bottom: -15px;
    left: -10px;
    right: -10px;
    display: flex;
    transform: rotate(-4deg);
    z-index: 10;
  }
  .banner-blue {
    background-color: #5650eb;
    color: #fff;
    font-weight: 900;
    font-size: 18px;
    padding: 6px 10px;
    border: 2px solid #000;
    flex: 1.2;
    text-align: center;
  }
  .banner-magenta {
    background-color: #e5005d;
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    padding: 6px 8px;
    border: 2px solid #000;
    border-left: none;
    flex: 1.4;
    text-align: center;
    letter-spacing: 1px;
  }

  /* PK Notice Card */
  .notice-card {
    margin: 25px 8px 10px 8px;
    border: 2px solid #000;
    background: #fff;
    display: flex;
  }
  .card-sidebar {
    width: 24px;
    border-right: 2px solid #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 4px 0;
    font-size: 12px;
  }
  .card-body {
    flex: 1;
    padding: 6px;
    text-align: center;
  }
  .card-title {
    font-size: 12px;
    font-weight: 900;
    border-bottom: 1.5px solid #000;
    padding-bottom: 4px;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .card-desc {
    font-size: 9.5px;
    line-height: 1.35;
    font-weight: bold;
    color: #222;
  }
  .card-pill {
    background-color: #000;
    color: #fff;
    font-size: 8.5px;
    padding: 2px 4px;
    margin-top: 5px;
    border-radius: 2px;
    display: inline-block;
  }

  /* Bottom Details Left */
  .reward-details {
    padding: 8px 10px;
  }
  .reward-badge {
    background-color: #5650eb;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 2px;
    display: inline-block;
  }
  .reward-pill-outline {
    border: 1.5px solid #5650eb;
    border-radius: 12px;
    padding: 0 6px;
    color: #5650eb;
    font-size: 11px;
    font-weight: 900;
    display: inline-block;
    background: #fff;
  }
  .barcode {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin: 15px 0 10px 0;
    transform: rotate(-30deg);
  }
  .bar {
    background-color: #000;
    height: 18px;
  }

  /* Right Column Styling */
  .bracelet-stage {
    position: relative;
    height: 160px;
    margin: 15px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .bracelet {
    position: absolute;
    border: 16px solid #6c5ce7;
    border-radius: 50%;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bracelet-1 {
    width: 140px;
    height: 140px;
    transform: rotateX(60deg) rotateZ(-20deg);
    border-color: #6352ea;
    box-shadow: 0 6px 0 #3c2eb5;
  }
  .bracelet-2 {
    width: 130px;
    height: 130px;
    transform: rotateX(60deg) rotateZ(35deg) translateY(-20px);
    border-color: #7b6cf6;
    box-shadow: 0 6px 0 #4f3fd4;
  }

  /* Sparkles and Checkers */
  .checker-line {
    height: 8px;
    background-image: linear-gradient(45deg, #000 25%, transparent 25%), 
                      linear-gradient(-45deg, #000 25%, transparent 25%), 
                      linear-gradient(45deg, transparent 75%, #000 75%), 
                      linear-gradient(-45deg, transparent 75%, #000 75%);
    background-size: 6px 6px;
    background-position: 0 0, 0 3px, 3px -3px, -3px 0px;
    margin: 4px 12px;
  }
  .sparkle-icon {
    font-size: 26px;
    line-height: 1;
    color: #000;
  }

  .huge-heading {
    text-align: center;
    margin: 10px 0;
  }
  .huge-title {
    font-size: 38px;
    font-weight: 900;
    color: #000;
    line-height: 1.15;
    letter-spacing: 1px;
  }

  .tag-highlight {
    background-color: #6c5ce7;
    color: #fff;
    padding: 0 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header Bar -->
  <header class="header">
    <div>商业长图</div>
    <div class="header-center">
      <span>&larr;</span>
      <span class="design-pill">DESIGN</span>
      <span>&rarr;</span>
    </div>
    <div>设计分享</div>
  </header>

  <!-- Two Column Content -->
  <div class="content">
    
    <!-- Left Column -->
    <div class="col-left">
      <!-- Top Text Block -->
      <div class="ruled-paper">
        <div class="ruled-line" style="justify-content: flex-end; padding-right: 15px;">两大征稿专栏</div>
        <div class="ruled-line" style="justify-content: flex-start;">将在本期</div>
        <div class="ruled-line" style="justify-content: center;">与大家做个正式的告别</div>
      </div>

      <!-- Comic PK Area -->
      <div class="fight-box">
        <div class="label-tag">江湖从不缺传奇</div>
        
        <div class="gloves-container">
          <div class="glove glove-blue" title="蓝拳套"></div>
          <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 12px; z-index: 2;">
            <div class="label-tag" style="padding: 1px 12px; margin: 0; font-size: 15px;">这一 次</div>
          </div>
          <div class="glove glove-pink" title="红拳套"></div>
        </div>

        <div class="label-tag" style="margin-top: 4px;">TA燃情出炉,战力拉满</div>

        <!-- Ring Stage with PK -->
        <div class="pk-stage">
          <div class="ring-ropes"></div>
          <div class="pk-text">
            <span class="pk-p">P</span><span class="pk-k">K</span>
          </div>

          <!-- Bottom Overlapping Banner -->
          <div class="banner-slanted">
            <div class="banner-blue">天都擂台</div>
            <div class="banner-magenta">专栏今日上线</div>
          </div>
        </div>
      </div>

      <!-- Card Section -->
      <div class="notice-card">
        <div class="card-sidebar">
          <span>&#x2198;</span>
          <span>&#x1F381;</span>
          <span>&#x263A;</span>
          <span>&#x2197;</span>
        </div>
        <div class="card-body">
          <div class="card-title">正反两派 互相PK</div>
          <div class="card-desc">征稿玩法大升级, 狂掀对垒浪潮</div>
          <div class="card-desc" style="margin-top: 3px;">注意! 注意! 注意!</div>
          <div class="card-pill">入选参赛的投稿者都将收获礼品一份</div>
        </div>
      </div>

      <!-- Bottom Rules / Underlines -->
      <div class="ruled-paper reward-details">
        <div class="ruled-line" style="justify-content: center; font-size: 12px;">但!</div>
        <div class="ruled-line" style="justify-content: flex-start; gap: 4px;">
          <span class="reward-badge">胜者一方</span>
        </div>
        <div class="ruled-line" style="justify-content: flex-end;">
          <span class="reward-pill-outline">将抢走更加超值的奖励</span>
        </div>
        <div class="ruled-line" style="justify-content: flex-start; letter-spacing: 2px;">!!!!!</div>
        <div class="ruled-line" style="justify-content: flex-end; padding-right: 10px;">具体怎么参与?</div>
      </div>

      <!-- Barcode Accent -->
      <div class="barcode">
        <div class="bar" style="width: 12px;"></div>
        <div class="bar" style="width: 8px;"></div>
        <div class="bar" style="width: 14px;"></div>
        <div class="bar" style="width: 6px;"></div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-right">
      <!-- 3D Ribbons / Bracelets Graphic -->
      <div class="bracelet-stage">
        <div class="bracelet bracelet-2"></div>
        <div class="bracelet bracelet-1"></div>
        <!-- Bracelet Text Indicators -->
        <div style="position: absolute; top: 18px; right: 28px; color: #fff; font-size: 9px; font-weight: bold; transform: rotate(25deg);">重磅升级 02</div>
        <div style="position: absolute; bottom: 30px; left: 32px; color: #fff; font-size: 9px; font-weight: bold; transform: rotate(-20deg);">重磅升级 02</div>
      </div>

      <!-- Sparkle & Checker Decors -->
      <div style="display: flex; justify-content: flex-end; padding-right: 18px;">
        <span class="sparkle-icon">&#10022;</span>
      </div>

      <div class="checker-line"></div>

      <!-- Big Typography Header -->
      <div class="huge-heading">
        <div class="huge-title">擂台大比拼</div>
        <div class="huge-title">一切“我”掌控</div>
      </div>

      <div class="checker-line"></div>

      <div style="display: flex; justify-content: flex-start; padding-left: 18px; margin-top: 4px;">
        <span class="sparkle-icon" style="font-size: 18px;">&#10022;</span>
      </div>

      <!-- Bottom Pink Arrows -->
      <div style="display: flex; justify-content: flex-end; padding-right: 20px; gap: 4px; color: #ff85be; font-size: 20px; font-weight: 900;">
        <span>&#8678;</span>
        <span>&#8678;</span>
      </div>

      <!-- Bottom Ruled Lines -->
      <div class="ruled-paper" style="margin-top: 5px;">
        <div class="ruled-line" style="justify-content: center;">
          公众号每期的<span class="tag-highlight">「次条福利文」</span>
        </div>
        <div class="ruled-line" style="justify-content: flex-start;">
          都向家人们抛出了各种
        </div>
        <div class="ruled-line" style="justify-content: flex-end; padding-right: 15px;">
          热议的话题
        </div>
        <div class="ruled-line" style="justify-content: flex-start;">
          送出了一轮又一轮的奖励
        </div>
        <div class="ruled-line" style="justify-content: center;">
          而“侃侃而谈”和“开店风云”
        </div>
        <div class="ruled-line" style="justify-content: center;">
          两大征稿专栏
        </div>
        <div class="ruled-line" style="justify-content: flex-start;">
          将在本期
        </div>
        <div class="ruled-line" style="justify-content: flex-end; padding-right: 15px;">
          与大家做个正式的告别
        </div>
      </div>

    </div>

  </div>
</div>

</body>
</html>
