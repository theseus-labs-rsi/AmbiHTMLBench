<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瑞吉欧Reggio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1614;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      min-height: 720px;
      /* Simulated background representing the exhibition of clay figurines */
      background: 
        linear-gradient(rgba(20, 16, 12, 0.72), rgba(10, 8, 6, 0.82)),
        radial-gradient(circle at 50% 20%, #4a3b32 0%, #2b221b 50%, #15110e 100%);
      background-size: cover;
      background-position: center;
      padding: 50px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .title-box {
      background-color: rgba(15, 15, 15, 0.95);
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      padding: 6px 20px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .text-line {
      background-color: rgba(18, 18, 18, 0.95);
      color: #ffffff;
      font-size: 17.5px;
      font-weight: 500;
      line-height: 1.5;
      padding: 2px 10px;
      text-align: center;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .bullet {
      font-size: 14px;
      vertical-align: 1px;
      margin-right: 3px;
    }

    .wavy {
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #ffd800;
      text-decoration-thickness: 3px;
      text-underline-offset: 6px;
    }

    /* Small gap between conceptual groups */
    .group-gap {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Title -->
    <div class="title-box">
      瑞吉欧Reggio
    </div>

    <!-- Content Lines -->
    <div class="content">
      <div class="text-line">
        <span class="bullet">●</span>基于皮亚杰和维果斯基等心理学家的
      </div>
      <div class="text-line group-gap">
        <span class="wavy">建构主义心理学</span>。
      </div>

      <div class="text-line">
        <span class="bullet">●</span><span class="wavy">走进儿童心灵</span>的儿童观，以孩子的思维、
      </div>
      <div class="text-line">
        孩子的立场来看待一场
      </div>
      <div class="text-line group-gap">
        不压制孩子，让其充分表现潜能
      </div>

      <div class="text-line">
        <span class="bullet">●</span>弹性课程，<span class="wavy">从儿童的兴趣和需要出发</span>
      </div>
      <div class="text-line group-gap">
        不让孩子生活在成人的包围之中。
      </div>

      <div class="text-line">
        <span class="bullet">●</span>教师必须<span class="wavy">尽可能地减少介入</span>，更不可过度介入。
      </div>
      <div class="text-line group-gap">
        与其牵着儿童的手，不如让他们用自己的双脚站立。
      </div>

      <div class="text-line">
        <span class="bullet">●</span><span class="wavy">儿童的自我表达和相互交流特别重要</span>，是儿童探索、
      </div>
      <div class="text-line group-gap">
        研究、解决问题过程中的基本活动。
      </div>

      <div class="text-line">
        <span class="bullet">●</span>在共同分享中，每个人均可提出最好的想法，
      </div>
      <div class="text-line">
        提升和加强团队间意见交流、
      </div>
      <div class="text-line">
        并刺激新奇或出乎意料的事情发生。
      </div>
    </div>
  </div>

</body>
</html>
