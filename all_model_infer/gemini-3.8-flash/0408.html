<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals & Objectives</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #381f25;
    }

    .slide {
      width: 960px;
      min-height: 720px;
      padding: 50px 70px 60px 70px;
      position: relative;
      background-color: #ffffff;
    }

    .header {
      text-align: right;
      margin-bottom: 60px;
    }

    .header h1 {
      font-size: 50px;
      font-weight: 400;
      color: #482329;
      letter-spacing: -0.5px;
    }

    .intro-text {
      font-size: 27px;
      font-weight: 400;
      color: #331e23;
      margin-bottom: 65px;
      letter-spacing: -0.2px;
    }

    .content-section {
      display: flex;
      flex-direction: column;
      gap: 55px;
    }

    .group-row {
      display: grid;
      grid-template-columns: 460px 140px 1fr;
      align-items: center;
    }

    /* Goals list styling */
    .goals-list {
      color: #17717d;
      font-size: 29px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .goals-list-top {
      gap: 28px;
    }

    .goals-list-bottom {
      gap: 28px;
    }

    .goal-item {
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Diagram connector (bracket + arrow) */
    .connector {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .connector svg {
      overflow: visible;
    }

    /* Label on the right */
    .group-label {
      text-align: center;
      font-size: 29px;
      line-height: 1.3;
      color: #331e23;
      font-weight: 400;
      padding-left: 10px;
    }
  </style>
</head>
<body>

  <div class="slide">
    <header class="header">
      <h1>Goals & Objectives</h1>
    </header>

    <div class="intro-text">
      From January 1, 2016 – December 31, 2018, we will:
    </div>

    <main class="content-section">
      <!-- Top Group: Goals 1-3 -->
      <div class="group-row">
        <div class="goals-list goals-list-top">
          <div class="goal-item">Goal 1: XX</div>
          <div class="goal-item">Goal 2: XX</div>
          <div class="goal-item">Goal 3: XX</div>
        </div>

        <div class="connector">
          <svg width="130" height="190" viewBox="0 0 130 190" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Teal Left Arrow -->
            <polygon points="12,95 56,64 56,80 120,80 120,110 56,110 56,126" fill="#18767f" />
            <!-- Brown Square Bracket with Rounded Corners -->
            <path d="M 12 10 L 70 10 Q 82 10 82 22 L 82 168 Q 82 180 70 180 L 12 180" 
                  stroke="#3e1d23" stroke-width="7" stroke-linecap="round" fill="none" />
          </svg>
        </div>

        <div class="group-label">
          Theory<br>
          of<br>
          Change<br>
          Goals
        </div>
      </div>

      <!-- Bottom Group: Goals 4-5 -->
      <div class="group-row">
        <div class="goals-list goals-list-bottom">
          <div class="goal-item">Goal 4: Money</div>
          <div class="goal-item">Goal 5: People & Infrastructure</div>
        </div>

        <div class="connector">
          <svg width="130" height="136" viewBox="0 0 130 136" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Teal Left Arrow -->
            <polygon points="12,68 56,37 56,53 120,53 120,83 56,83 56,99" fill="#18767f" />
            <!-- Brown Square Bracket with Rounded Corners -->
            <path d="M 12 10 L 70 10 Q 82 10 82 22 L 82 114 Q 82 126 70 126 L 12 126" 
                  stroke="#3e1d23" stroke-width="7" stroke-linecap="round" fill="none" />
          </svg>
        </div>

        <div class="group-label">
          Organization<br>
          Goals
        </div>
      </div>
    </main>
  </div>

</body>
</html>
