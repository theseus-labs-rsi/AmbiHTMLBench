<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物笔记 - 细胞的生物膜系统与细胞核</title>
<style>
  body {
    background-color: #f7f7f5;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    color: #1a1a1a;
  }

  .notebook-page {
    width: 100%;
    max-width: 680px;
    background-color: #fff;
    padding: 30px 40px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  /* Header row */
  .top-flow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  /* Branching structures */
  .branch-container {
    display: flex;
    align-items: center;
    margin: 8px 0;
  }

  .branch-root {
    white-space: nowrap;
    padding-right: 4px;
  }

  .branch-bracket {
    display: flex;
    align-items: center;
  }

  .branch-bracket svg {
    display: block;
  }

  .branch-items {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding-left: 6px;
    line-height: 1.4;
  }

  .arrow-down {
    margin-left: 50px;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  /* Ordered list style notes */
  .note-item {
    margin-top: 8px;
    margin-bottom: 8px;
    text-align: justify;
  }

  .sub-text {
    margin-left: 24px;
    margin-top: 4px;
    text-align: justify;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid #777;
    margin: 22px 0 18px 0;
  }

  /* Correction tape effect */
  .correction-mark {
    background-color: #f2f2f2;
    padding: 1px 4px;
    border-radius: 2px;
  }

  /* Lower section layout */
  .bottom-tree {
    display: flex;
    align-items: flex-start;
    margin-top: 15px;
  }

  .bottom-tree-root {
    padding-top: 55px;
    white-space: nowrap;
  }

  .bottom-tree-lines {
    flex-shrink: 0;
    width: 45px;
    height: 230px;
  }

  .bottom-tree-items {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-left: 6px;
  }

  .tree-node-desc {
    margin-top: 2px;
  }

  .indent-sub {
    margin-left: 14px;
  }
</style>
</head>
<body>

<div class="notebook-page">

  <!-- Top Note -->
  <div class="top-flow">
    <span>内质网</span>
    <span>到</span>
    <span>&rarr;</span>
    <span>高尔基体，</span>
  </div>

  <!-- Membrane System Tree -->
  <div class="branch-container">
    <div class="branch-root">cell 的生物膜系统</div>
    <div class="branch-bracket">
      <svg width="20" height="60" viewBox="0 0 20 60">
        <path d="M 0 30 Q 8 30 10 10 L 18 6 M 0 30 L 18 30 M 0 30 Q 8 30 10 50 L 18 54" fill="none" stroke="#222" stroke-width="1.2" />
      </svg>
    </div>
    <div class="branch-items" style="height: 60px;">
      <div>cell 膜</div>
      <div>cell 器膜</div>
      <div>核膜</div>
    </div>
  </div>

  <div class="arrow-down">&darr; 作用</div>

  <!-- Points 1, 2, 3 -->
  <div class="note-item">
    <span>&empty;</span> ① 使 cell 具有相对稳定的内部环境
    <div class="sub-text">
      同时，在 cell 与外部环境进行物质运输、能量转换、信息传递的过程中起决定性作用。
    </div>
  </div>

  <div class="note-item">
    ② 广阔的膜面积为许多酶提供了附着位点。
  </div>

  <div class="note-item">
    ③ 分隔 &rarr; 保证了 cell 生命活动高效、有序的进行。
  </div>

  <!-- Horizontal divider -->
  <hr class="divider">

  <!-- Cell Nucleus Section -->
  <div style="margin-bottom: 8px;">
    <span class="correction-mark">cell 核</span>控制着 cell 的代谢和遗传
  </div>

  <div class="bottom-tree">
    <div class="bottom-tree-root">cell 核</div>
    
    <!-- SVG Lines radiating from cell 核 -->
    <svg class="bottom-tree-lines" viewBox="0 0 45 230">
      <!-- To Nuclear Membrane -->
      <path d="M 5 70 L 40 18" fill="none" stroke="#222" stroke-width="1.2" />
      <!-- To Nucleolus -->
      <path d="M 5 70 L 40 65" fill="none" stroke="#222" stroke-width="1.2" />
      <!-- To Chromatin -->
      <path d="M 5 70 L 40 120" fill="none" stroke="#222" stroke-width="1.2" />
      <!-- To Nuclear Pore -->
      <path d="M 5 70 L 30 185" fill="none" stroke="#222" stroke-width="1.2" />
    </svg>

    <div class="bottom-tree-items">
      <!-- Branch 1 -->
      <div>核膜：双层，分隔</div>

      <!-- Branch 2 -->
      <div style="margin-top: 2px;">
        核仁：与某种 RNA 的合成以及核糖<br>
        <span class="indent-sub">体的形成有关</span>
      </div>

      <!-- Branch 3 -->
      <div style="margin-top: 4px;">
        染色质 &rarr; 由 DNA 和 Pro 组成
        <div style="margin-left: 38px; margin-top: 3px;">
          &darr; 遗传信息的载体
        </div>
      </div>

      <!-- Branch 4 -->
      <div style="margin-top: 6px;">
        核孔：实现核质之间频繁的物质交换<br>
        <span class="indent-sub"><span class="correction-mark">和信息交流</span></span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
