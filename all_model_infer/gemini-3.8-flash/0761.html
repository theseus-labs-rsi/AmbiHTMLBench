<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写笔记 - 侦探能量站</title>
    <style>
        body {
            background-color: #e6e5e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "SimKai", "楷体", cursive, serif;
        }

        .notebook-page {
            background-color: #f7f3ec;
            width: 100%;
            max-width: 580px;
            min-height: 750px;
            padding: 40px 45px 60px 45px;
            box-shadow: 2px 3px 15px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            position: relative;
            color: #2b2b2b;
            line-height: 1.85;
            letter-spacing: 1px;
            font-size: 19px;
        }

        .header-title {
            font-size: 21px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        .paragraph {
            margin-bottom: 20px;
            text-align: justify;
        }

        .indent-2 {
            text-indent: 2em;
        }

        .underlined {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .red-text {
            color: #8c242b;
            font-weight: 500;
            margin-top: 25px;
        }

        .red-text .line-1 {
            text-indent: 1.5em;
        }

        .red-text .line-2 {
            text-indent: 6.5em;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="notebook-page">
    <div class="header-title">侦探能量站</div>

    <div class="paragraph indent-2">
        当偏见裹挟认知，无视事实，操纵舆论的事发生，我们该如何对待？
    </div>

    <div class="paragraph indent-2">
        如果我不害怕人微言轻，也许你就不会经历人言可畏，用心辨别真相，用爱和真诚可以消融流言，正如各位侦探所言，“千军万马踩过的时候，小小的一脚都有可能是致命伤，我们谁都不想成为这样的人，我们也不要成为加害的人”，<span class="underlined">遭遇</span>不公时，隐忍不是唯一道路，我们可以向不公平呐喊，只有大家都勇敢起来，加害者才会觉得我们没有那么好欺负.
    </div>

    <div class="red-text">
        <div class="line-1">愿你笔尖下皆自由之风，一笔一画，</div>
        <div class="line-2">一字一句，黑白分明。</div>
    </div>
</div>

</body>
</html>
