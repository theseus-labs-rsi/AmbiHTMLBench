<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兰州旅行文案</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 900px;
      padding: 40px 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 36px 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-header {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .pin-icon {
      color: #c83834;
      font-size: 13px;
      line-height: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      letter-spacing: 0.5px;
    }

    .card-quote {
      font-size: 11px;
      color: #555555;
      margin-bottom: 12px;
      height: 16px;
      line-height: 16px;
    }

    /* 3x3 Photo Collage Grid */
    .photo-grid {
      width: 100%;
      max-width: 220px;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background-color: #f0f0f0;
      padding: 2px;
      border-radius: 2px;
    }

    .photo-item {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: #ddd;
    }

    /* Specific tonal colors for the photo collages to resemble the document */
    /* 金城兰州 */
    .grid-1 .p1 { background-color: #2b3a55; }
    .grid-1 .p2 { background-color: #8c7365; }
    .grid-1 .p3 { background-color: #1e3a6a; }
    .grid-1 .p4 { background-color: #a49187; }
    .grid-1 .p5 { background-color: #432b4e; }
    .grid-1 .p6 { background-color: #3a5c88; }
    .grid-1 .p7 { background-color: #242a38; }
    .grid-1 .p8 { background-color: #798694; }
    .grid-1 .p9 { background-color: #28446b; }

    /* 中山桥 */
    .grid-2 .p1 { background-color: #7c9399; }
    .grid-2 .p2 { background-color: #4b6a7a; }
    .grid-2 .p3 { background-color: #59616e; }
    .grid-2 .p4 { background-color: #5c7b5b; }
    .grid-2 .p5 { background-color: #647d8b; }
    .grid-2 .p6 { background-color: #768f9a; }
    .grid-2 .p7 { background-color: #887e74; }
    .grid-2 .p8 { background-color: #6688a4; }
    .grid-2 .p9 { background-color: #6a92b2; }

    /* 兰州美食 */
    .grid-3 .p1 { background-color: #b5492d; }
    .grid-3 .p2 { background-color: #d19f6a; }
    .grid-3 .p3 { background-color: #aa4d28; }
    .grid-3 .p4 { background-color: #c98e57; }
    .grid-3 .p5 { background-color: #df9e48; }
    .grid-3 .p6 { background-color: #e6b896; }
    .grid-3 .p7 { background-color: #d6ba9e; }
    .grid-3 .p8 { background-color: #ca8c4c; }
    .grid-3 .p9 { background-color: #a84725; }

    /* 骆驼巷 */
    .grid-4 .p1 { background-color: #845e52; }
    .grid-4 .p2 { background-color: #71605a; }
    .grid-4 .p3 { background-color: #697471; }
    .grid-4 .p4 { background-color: #92756a; }
    .grid-4 .p5 { background-color: #a57868; }
    .grid-4 .p6 { background-color: #667073; }
    .grid-4 .p7 { background-color: #9c685b; }
    .grid-4 .p8 { background-color: #8b685c; }
    .grid-4 .p9 { background-color: #7b6d65; }

    /* 甘肃省博物馆 */
    .grid-6 .p1 { background-color: #8f6e52; }
    .grid-6 .p2 { background-color: #9d806a; }
    .grid-6 .p3 { background-color: #8b5f47; }
    .grid-6 .p4 { background-color: #79665b; }
    .grid-6 .p5 { background-color: #243534; }
    .grid-6 .p6 { background-color: #85534f; }
    .grid-6 .p7 { background-color: #9e7f67; }
    .grid-6 .p8 { background-color: #947e68; }
    .grid-6 .p9 { background-color: #81726a; }

    /* 白塔山公园 */
    .grid-7 .p1 { background-color: #556c4d; }
    .grid-7 .p2 { background-color: #4b6b47; }
    .grid-7 .p3 { background-color: #64768c; }
    .grid-7 .p4 { background-color: #774c43; }
    .grid-7 .p5 { background-color: #7d6b5e; }
    .grid-7 .p6 { background-color: #65403e; }
    .grid-7 .p7 { background-color: #537452; }
    .grid-7 .p8 { background-color: #4f664a; }
    .grid-7 .p9 { background-color: #58696b; }

    /* 兰山公园 */
    .grid-8 .p1 { background-color: #3f526b; }
    .grid-8 .p2 { background-color: #2c2937; }
    .grid-8 .p3 { background-color: #2e1d3e; }
    .grid-8 .p4 { background-color: #38344e; }
    .grid-8 .p5 { background-color: #2f2a41; }
    .grid-8 .p6 { background-color: #382c4d; }
    .grid-8 .p7 { background-color: #25283f; }
    .grid-8 .p8 { background-color: #332338; }
    .grid-8 .p9 { background-color: #272236; }

    /* 正宁路小吃街 */
    .grid-9 .p1 { background-color: #8e7a68; }
    .grid-9 .p2 { background-color: #9d5d3e; }
    .grid-9 .p3 { background-color: #4c4c68; }
    .grid-9 .p4 { background-color: #82666a; }
    .grid-9 .p5 { background-color: #9f4937; }
    .grid-9 .p6 { background-color: #48616c; }
    .grid-9 .p7 { background-color: #7a6659; }
    .grid-9 .p8 { background-color: #a44f37; }
    .grid-9 .p9 { background-color: #6e6459; }

    /* Center Block */
    .center-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .vertical-title {
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 12px;
      font-size: 24px;
      font-weight: 700;
      color: #ad2a25;
      font-family: "Kaiti", "STKaiti", "SimSun", serif;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Row 1, Col 1 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">金城兰州</span>
      </div>
      <div class="card-quote">“淌不完的黄河水向东流”</div>
      <div class="photo-grid grid-1" aria-label="金城兰州照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 1, Col 2 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">中山桥</span>
      </div>
      <div class="card-quote">“陌生的人 请给我一支兰州”</div>
      <div class="photo-grid grid-2" aria-label="中山桥照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 1, Col 3 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">兰州美食</span>
      </div>
      <div class="card-quote">“四方食事 不过一碗人间烟火”</div>
      <div class="photo-grid grid-3" aria-label="兰州美食照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 2, Col 1 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">骆驼巷</span>
      </div>
      <div class="card-quote">“繁华城市背后的另一面”</div>
      <div class="photo-grid grid-4" aria-label="骆驼巷照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 2, Col 2: Center Title -->
    <div class="card center-card">
      <div class="vertical-title">兰州旅行文案</div>
    </div>

    <!-- Row 2, Col 3 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">甘肃省博物馆</span>
      </div>
      <div class="card-quote">“守河西魂魄 传丝路文明”</div>
      <div class="photo-grid grid-6" aria-label="甘肃省博物馆照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 3, Col 1 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">白塔山公园</span>
      </div>
      <div class="card-quote">“行走在西北 看尽黄河水”</div>
      <div class="photo-grid grid-7" aria-label="白塔山公园照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 3, Col 2 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">兰山公园</span>
      </div>
      <div class="card-quote">“白天阿富汗 晚上曼哈顿”</div>
      <div class="photo-grid grid-8" aria-label="兰山公园照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>

    <!-- Row 3, Col 3 -->
    <div class="card">
      <div class="card-header">
        <span class="pin-icon">📍</span>
        <span class="card-title">正宁路小吃街</span>
      </div>
      <div class="card-quote">“人间烟火气 最抚凡人心”</div>
      <div class="photo-grid grid-9" aria-label="正宁路小吃街照片集">
        <div class="photo-item p1"></div>
        <div class="photo-item p2"></div>
        <div class="photo-item p3"></div>
        <div class="photo-item p4"></div>
        <div class="photo-item p5"></div>
        <div class="photo-item p6"></div>
        <div class="photo-item p7"></div>
        <div class="photo-item p8"></div>
        <div class="photo-item p9"></div>
      </div>
    </div>
  </div>

</body>
</html>
