<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 VS 快手 - 产品小课堂</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #e5b975;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
    color: #3d2314;
  }
  .container {
    width: 100%;
    max-width: 520px;
    position: relative;
  }
  
  /* Top Title Section */
  .header-title-wrap {
    position: relative;
    text-align: center;
    margin-bottom: 25px;
  }
  .title-highlight-bg {
    position: absolute;
    right: 35px;
    top: 25px;
    width: 175px;
    height: 38px;
    background-color: #f6c878;
    z-index: 1;
  }
  .main-title {
    position: relative;
    z-index: 2;
    font-size: 46px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 
      -3px -3px 0 #3d2314,
       3px -3px 0 #3d2314,
      -3px  3px 0 #3d2314,
       3px  3px 0 #3d2314,
       4px  4px 0 #3d2314,
       0px  4px 0 #3d2314;
    letter-spacing: 2px;
  }
  .main-title .vs {
    font-size: 40px;
    font-style: italic;
    margin: 0 4px;
  }

  /* Subtitle Pill */
  .subtitle-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 35px;
  }
  .brush-icon {
    position: absolute;
    left: 45px;
    top: -22px;
    width: 55px;
    height: 70px;
    z-index: 4;
    transform: rotate(-10deg);
  }
  .subtitle-pill {
    position: relative;
    z-index: 2;
    background-color: #fff1ce;
    border: 3px solid #3d2314;
    border-radius: 40px;
    padding: 8px 45px;
    box-shadow: 4px 5px 0 #3d2314;
  }
  .subtitle-text {
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 
      -2px -2px 0 #3d2314,
       2px -2px 0 #3d2314,
      -2px  2px 0 #3d2314,
       2px  2px 0 #3d2314,
       3px  3px 0 #3d2314;
    letter-spacing: 2px;
  }

  /* Main White Content Card */
  .card {
    background-color: #ffffff;
    padding: 24px 20px 40px 20px;
    position: relative;
  }

  /* Section Styling */
  .section {
    position: relative;
    margin-bottom: 45px;
  }
  .section-header {
    display: flex;
    align-items: center;
    margin-left: -32px;
    margin-bottom: 15px;
    position: relative;
  }
  .badge-num {
    background-color: #3d2314;
    color: #ffffff;
    font-size: 20px;
    font-weight: bold;
    padding: 3px 22px;
    border-radius: 20px;
    margin-right: 12px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .section-title-wrap {
    position: relative;
    display: inline-block;
  }
  .section-title {
    font-size: 22px;
    font-weight: 800;
    color: #3d2314;
    position: relative;
    z-index: 2;
  }
  .section-title-bar {
    position: absolute;
    right: -25px;
    bottom: 3px;
    height: 10px;
    width: 100px;
    background-color: #f7d286;
    z-index: 1;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    color: #333333;
    table-layout: fixed;
  }
  th {
    background-color: #ffa800;
    color: #ffffff;
    font-weight: bold;
    padding: 6px 2px;
    text-align: center;
    border: 1px solid #ffffff;
    font-size: 11px;
  }
  td {
    padding: 8px 4px;
    text-align: center;
    border: 1px solid #ffffff;
    line-height: 1.4;
    vertical-align: middle;
    word-break: break-all;
  }
  .col-label {
    font-weight: bold;
    color: #333333;
  }
  
  /* Row Tinting */
  .row-light {
    background-color: #fff2df;
  }
  .row-dark {
    background-color: #fae4c3;
  }

  /* Table 1 Column Widths */
  .table-1 th:nth-child(1), .table-1 td:nth-child(1) { width: 14%; }
  .table-1 th:nth-child(2), .table-1 td:nth-child(2) { width: 22%; }
  .table-1 th:nth-child(3), .table-1 td:nth-child(3) { width: 18%; }
  .table-1 th:nth-child(4), .table-1 td:nth-child(4) { width: 26%; }
  .table-1 th:nth-child(5), .table-1 td:nth-child(5) { width: 20%; }

  /* Table 2 Column Widths */
  .table-2 th:nth-child(1), .table-2 td:nth-child(1) { width: 20%; }
  .table-2 th:nth-child(2), .table-2 td:nth-child(2) { width: 48%; }
  .table-2 th:nth-child(3), .table-2 td:nth-child(3) { width: 32%; }

  /* Bottom dashed divider */
  .dashed-bottom {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 50px;
    margin-bottom: 10px;
  }
  .dashed-bottom span {
    display: inline-block;
    width: 120px;
    border-bottom: 2.5px dashed #ffa800;
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- Main Title -->
  <div class="header-title-wrap">
    <div class="title-highlight-bg"></div>
    <div class="main-title">抖音 <span class="vs">VS</span> 快手</div>
  </div>

  <!-- Subtitle with Brush -->
  <div class="subtitle-container">
    <!-- SVG Paint Brush Placeholder -->
    <svg class="brush-icon" viewBox="0 0 70 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Brush Handle -->
      <path d="M12 5 C10 2, 2 8, 5 15 L22 45 C25 50, 32 50, 35 45 L25 15 Z" fill="#E8C3B0"/>
      <path d="M22 45 L35 45 L38 52 L20 52 Z" fill="#91D6D4"/>
      <!-- Bristles -->
      <path d="M20 52 L38 52 L55 78 C52 82, 38 88, 30 85 L15 65 Z" fill="#C99E82" opacity="0.8"/>
      <line x1="26" y1="56" x2="38" y2="76" stroke="#AA7F65" stroke-width="2"/>
    </svg>
    <div class="subtitle-pill">
      <span class="subtitle-text">产品小课堂</span>
    </div>
  </div>

  <!-- Content Card -->
  <div class="card">
    
    <!-- Section 03 -->
    <div class="section">
      <div class="section-header">
        <div class="badge-num">03</div>
        <div class="section-title-wrap">
          <div class="section-title">抖音与快手</div>
          <div class="section-title-bar"></div>
        </div>
      </div>
      
      <table class="table-1">
        <thead>
          <tr>
            <th></th>
            <th>slogan</th>
            <th>产品定位</th>
            <th>策略</th>
            <th>变现</th>
          </tr>
        </thead>
        <tbody>
          <tr class="row-light">
            <td class="col-label">抖音</td>
            <td>记录美好生活</td>
            <td>短视频媒体</td>
            <td>以优质内容为中心</td>
            <td>广告收入、电商</td>
          </tr>
          <tr class="row-light">
            <td class="col-label">快手</td>
            <td>拥抱每一种生活</td>
            <td>短视频社区</td>
            <td>以社交中心，大部分流量</td>
            <td>直播收入、电商</td>
          </tr>
          <tr class="row-dark" style="height: 12px;">
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Section 04 -->
    <div class="section" style="margin-bottom: 20px;">
      <div class="section-header">
        <div class="badge-num">04</div>
        <div class="section-title-wrap">
          <div class="section-title">抖音电商与快手电商</div>
          <div class="section-title-bar"></div>
        </div>
      </div>

      <table class="table-2">
        <thead>
          <tr>
            <th></th>
            <th>产品定位</th>
            <th>重点指标</th>
          </tr>
        </thead>
        <tbody>
          <tr class="row-light">
            <td class="col-label">抖音电商</td>
            <td>兴趣逻辑，内容场景刺激需求</td>
            <td>直播间GPM</td>
          </tr>
          <tr class="row-light">
            <td class="col-label">快手电商</td>
            <td>信任逻辑，头部主播优势</td>
            <td>复购</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Bottom Dashed Line -->
    <div class="dashed-bottom">
      <span></span>
    </div>

  </div>

</div>

</body>
</html>
