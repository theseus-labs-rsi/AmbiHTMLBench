<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儿童绘本页面</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "KaiTi", "STKaiti", "楷体", serif;
    }

    .page-container {
        background-color: #fdfaf3;
        width: 100%;
        max-width: 580px;
        padding: 24px 28px 20px 28px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
    }

    .text-content {
        font-size: 1.15rem;
        line-height: 1.7;
        color: #2b2b2b;
        letter-spacing: 0.05em;
        margin-bottom: 12px;
    }

    .text-content p {
        margin: 0;
    }

    .text-content .first-line {
        text-indent: 2em;
    }

    .placeholder {
        width: 100%;
        height: 480px;
        border: 2px dashed #8fa886;
        border-radius: 6px;
        background-color: #f4f8f2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #4b6643;
        padding: 20px;
        font-size: 0.95rem;
        line-height: 1.6;
        position: relative;
    }

    .placeholder-title {
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1.05rem;
    }

    .placeholder-desc {
        color: #6a7c66;
        max-width: 80%;
    }
</style>
</head>
<body>

<div class="page-container">
    <!-- 顶部文字故事内容 -->
    <div class="text-content">
        <p class="first-line">“胖胖，中午好！”丫丫一进屋就看见了胖胖，</p>
        <p>胖胖害羞地冲丫丫笑。“阿姨，胖胖是用微</p>
        <p>笑来和我打招呼的！”听到丫丫的话，</p>
        <p>大家都笑了 起来。</p>
    </div>

    <!-- 下方绘本插图区域 -->
    <div class="placeholder">
        <div class="placeholder-title">[插图：透过绿框窗户互致问候的小动物们]</div>
        <div class="placeholder-desc">
            画面主体为一个绿色木质方格窗，右上角探入一枝开满浅色花朵的花枝；<br>
            窗外左侧是戴着帽子的鹅妈妈和黄色小鸭（丫丫），右侧是系着围裙的猪妈妈和穿着背带裤的小猪（胖胖）。
        </div>
    </div>
</div>

</body>
</html>
