<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一张图搞定HMO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #70c3f7;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    /* Hanging links / springs */
    .spring-left, .spring-right {
      position: absolute;
      top: 65px;
      width: 10px;
      height: 48px;
      background: repeating-linear-gradient(
        0deg,
        #f5f5f5,
        #f5f5f5 3px,
        #888 3px,
        #888 5px
      );
      border-radius: 4px;
      z-index: 5;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    .spring-left {
      left: 42px;
    }
    .spring-right {
      right: 48px;
    }

    /* Top banner */
    .top-banner {
      background: #ffffff;
      border-radius: 40px;
      padding: 14px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
      margin: 0 15px 25px 15px;
    }

    .top-title {
      font-size: 34px;
      font-weight: 900;
      color: #e64c3c;
      letter-spacing: 2px;
      position: relative;
      display: inline-block;
      text-shadow: 
        -1.5px -1.5px 0 #fff,
         1.5px -1.5px 0 #fff,
        -1.5px  1.5px 0 #fff,
         1.5px  1.5px 0 #fff,
         0 2px 4px rgba(230, 76, 60, 0.3);
    }

    .top-title::before, .top-title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 18px;
      height: 3px;
      background-color: #e64c3c;
      border-radius: 2px;
    }
    .top-title::before {
      left: -28px;
    }
    .top-title::after {
      right: -28px;
    }

    /* Mascot placeholder */
    .cow-placeholder {
      position: absolute;
      right: 5px;
      top: 75px;
      width: 58px;
      height: 70px;
      background-color: #ffffff;
      border: 2px solid #333;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #333;
      text-align: center;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Main board */
    .main-board {
      background: #ffffff;
      border-radius: 36px;
      padding: 24px 16px 28px 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* Blue Highlight Box */
    .blue-card {
      background: #71d0f6;
      border-radius: 24px;
      padding: 16px 14px;
      color: #ffffff;
      font-size: 14.5px;
      line-height: 1.65;
      font-weight: bold;
      text-align: justify;
      letter-spacing: 0.5px;
      text-shadow: 
        -1px -1px 0 #2a3b4c,
         1px -1px 0 #2a3b4c,
        -1px  1px 0 #2a3b4c,
         1px  1px 0 #2a3b4c,
         0 2px 2px rgba(0,0,0,0.4);
    }

    /* Sections */
    .section-card {
      background: #f4f5f7;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      background: #f98a33;
      padding: 7px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pill-inner {
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 3px 14px;
      width: 100%;
      text-align: center;
    }

    .pill-title {
      color: #ffffff;
      font-size: 15.5px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 
        -1px -1px 0 #b34a00,
         1px -1px 0 #b34a00,
        -1px  1px 0 #b34a00,
         1px  1px 0 #b34a00;
    }

    .pill-title sup {
      font-size: 10px;
      vertical-align: super;
      margin-left: 2px;
    }

    .section-body {
      background: #ffffff;
      padding: 14px 16px;
      text-align: center;
      color: #ffffff;
      font-size: 13.5px;
      line-height: 1.55;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 
        -1px -1px 0 #222222,
         1px -1px 0 #222222,
        -1px  1px 0 #222222,
         1px  1px 0 #222222,
         0 1px 2px rgba(0,0,0,0.3);
    }

    .section-body sup {
      font-size: 9px;
      vertical-align: super;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Hanging loops -->
    <div class="spring-left"></div>
    <div class="spring-right"></div>

    <!-- Cartoon Mascot Placeholder -->
    <figure class="placeholder cow-placeholder">
      [Cartoon Cow]
    </figure>

    <!-- Top Floating Header -->
    <header class="top-banner">
      <h1 class="top-title">一张图搞定HMO</h1>
    </header>

    <!-- Main White Card -->
    <main class="main-board">

      <!-- Blue Overview Box -->
      <section class="blue-card">
        HMO-中文“母乳低聚糖”，是源乳中的第一大免疫活性营养¹，而且含量还是乳铁蛋白的12倍²，在牛乳、羊乳中都没有这个成分，被誉为“乳黄金”。
      </section>

      <!-- Section 1 -->
      <section class="section-card">
        <div class="section-header">
          <div class="pill-inner">
            <span class="pill-title">HMO具有调节肠道菌群平衡作用<sup>3-6</sup></span>
          </div>
        </div>
        <div class="section-body">
          肠道是人体第一大免疫器官，宝宝70%的免疫细胞来自于肠道，因此呵护好宝宝肠道对提升保护力非常重要。<br>
          而HMO可以促进有益菌生长，提高保护力。
        </div>
      </section>

      <!-- Section 2 -->
      <section class="section-card">
        <div class="section-header">
          <div class="pill-inner">
            <span class="pill-title">HMO为宝宝建立一道健康防护屏障<sup>5-6</sup></span>
          </div>
        </div>
        <div class="section-body">
          HMO能够为宝宝建立一道健康防护屏障，<br>
          防止有害菌侵扰。
        </div>
      </section>

      <!-- Section 3 -->
      <section class="section-card">
        <div class="section-header">
          <div class="pill-inner">
            <span class="pill-title">HMO激发免疫系统，提高宝宝保护力<sup>6</sup></span>
          </div>
        </div>
        <div class="section-body">
          HMO能够双倍激发宝宝体内的活性抗体，大大提高宝宝保护力，增强宝宝体质。<sup>7-8</sup>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
