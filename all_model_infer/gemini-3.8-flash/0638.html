<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读笔记</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #dcd6cc;
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", STSong, serif;
    color: #635345;
    display: flex;
    justify-content: center;
    padding: 0 0 40px 0;
  }

  .page-wrapper {
    width: 100%;
    max-width: 820px;
    background-color: #f7f3eb;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }

  /* Top Navigation Bar */
  .top-nav {
    background-color: #bfaea0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 16px;
    height: 32px;
    font-size: 11px;
    color: #6e5b4b;
    border-bottom: 1px solid #b29f90;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 22px;
    padding-bottom: 6px;
  }

  .nav-left span {
    cursor: default;
  }

  .nav-right {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 100%;
  }

  .nav-tab {
    padding: 6px 14px 5px 14px;
    cursor: default;
  }

  .nav-tab.active {
    background-color: #aa9787;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
    color: #4a3b2c;
    font-weight: 500;
  }

  .nav-side-items {
    display: flex;
    gap: 20px;
    padding-bottom: 6px;
    padding-left: 12px;
  }

  /* Page Content Container */
  .main-content {
    padding: 16px 20px 24px 20px;
    background-color: #f7f3eb;
    background-image: 
      linear-gradient(to right, rgba(215, 204, 190, 0.45) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(215, 204, 190, 0.45) 1px, transparent 1px);
    background-size: 15px 15px;
    position: relative;
  }

  /* Title */
  .title-area {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #635244;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
  }

  .title-dot {
    margin-right: 6px;
    font-size: 14px;
  }

  /* Table Grid */
  .grid-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid #cfc2b2;
    border-radius: 6px;
    background-color: transparent;
  }

  .grid-table td, .grid-table th {
    border: 1px solid #cfc2b2;
    padding: 0;
    font-weight: normal;
  }

  .label-cell {
    width: 110px;
    background-color: rgba(238, 230, 220, 0.65);
    text-align: center;
    color: #6a594b;
    font-size: 12px;
    letter-spacing: 1.5px;
    height: 32px;
    vertical-align: middle;
  }

  .content-cell {
    background-color: transparent;
  }

  /* Upper Rows */
  .row-single {
    height: 32px;
  }

  /* Checkbox Labels Column */
  .circle-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: flex-start;
    padding-left: 20px;
    height: 100%;
    box-sizing: border-box;
    font-size: 12px;
    color: #6a594b;
  }

  .circle-item {
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 2px;
  }

  .circle-icon {
    display: inline-block;
    width: 11px;
    height: 11px;
    border: 1px solid #9c8a79;
    border-radius: 50%;
  }

  /* Middle Split Section */
  .sub-header-row {
    height: 30px;
    background-color: rgba(238, 230, 220, 0.4);
    font-size: 12px;
    color: #6a594b;
    letter-spacing: 1.5px;
  }

  .sub-header-left {
    width: 55%;
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 100%;
    padding: 0 10px;
  }

  .sub-header-right {
    text-align: center;
    vertical-align: middle;
  }

  .analysis-body-left {
    height: 195px;
    width: 55%;
  }

  .analysis-body-right {
    height: 195px;
    width: 45%;
  }

  /* Lower Rows */
  .row-medium {
    height: 82px;
  }

  .row-small {
    height: 36px;
  }

  /* Footer */
  .footer-bar {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    color: #a89888;
    letter-spacing: 1px;
    padding: 0 6px;
  }

  .footer-center {
    flex-grow: 1;
    text-align: center;
    transform: scale(0.85);
  }

  .footer-logo {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: #b8a898;
    font-family: sans-serif;
    letter-spacing: 0.5px;
  }

  .footer-logo-icon {
    font-size: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="page-wrapper">
  <!-- Top Navigation Bar -->
  <div class="top-nav">
    <div class="nav-left">
      <span>行测 &gt;</span>
      <span>常识</span>
      <span>言语</span>
      <span>数量</span>
      <span>判断</span>
      <span>资料</span>
    </div>
    <div class="nav-right">
      <div class="nav-tab active">申论</div>
      <div class="nav-side-items">
        <span>纸张</span>
        <span>计划</span>
      </div>
    </div>
  </div>

  <!-- Main Content Sheet -->
  <div class="main-content">
    <div class="title-area">
      <span class="title-dot">•</span> 晨读笔记
    </div>

    <table class="grid-table">
      <!-- 1. 主题 -->
      <tr class="row-single">
        <td class="label-cell">主 题</td>
        <td class="content-cell" colspan="2"></td>
      </tr>
      <!-- 2. 应用领域 -->
      <tr class="row-single">
        <td class="label-cell">应用领域</td>
        <td class="content-cell" colspan="2"></td>
      </tr>
      <!-- 3. 热门事件 -->
      <tr class="row-single">
        <td class="label-cell">热门事件</td>
        <td class="content-cell" colspan="2"></td>
      </tr>
      <!-- 4. 宏观政策 -->
      <tr class="row-single">
        <td class="label-cell">宏观政策</td>
        <td class="content-cell" colspan="2"></td>
      </tr>
      <!-- 5. 媒体评论 -->
      <tr class="row-single">
        <td class="label-cell">媒体评论</td>
        <td class="content-cell" colspan="2"></td>
      </tr>

      <!-- 6. 意义 / 原因 / 问题 / 危害 -->
      <tr style="height: 104px;">
        <td class="label-cell" style="padding: 6px 0;">
          <div class="circle-labels">
            <div class="circle-item"><span class="circle-icon"></span> 意 义</div>
            <div class="circle-item"><span class="circle-icon"></span> 原 因</div>
            <div class="circle-item"><span class="circle-icon"></span> 问 题</div>
            <div class="circle-item"><span class="circle-icon"></span> 危 害</div>
          </div>
        </td>
        <td class="content-cell" colspan="2"></td>
      </tr>

      <!-- 7. 分析区 Header -->
      <tr class="sub-header-row">
        <td colspan="2" style="border-right: 1px solid #cfc2b2;">
          <div class="sub-header-left">
            <div class="circle-item"><span class="circle-icon"></span> 问题分析</div>
            <div class="circle-item"><span class="circle-icon"></span> 原因分析</div>
          </div>
        </td>
        <td class="sub-header-right">对策分析</td>
      </tr>

      <!-- 8. 分析区 Body -->
      <tr>
        <td class="analysis-body-left" colspan="2"></td>
        <td class="analysis-body-right"></td>
      </tr>

      <!-- 9. 句子迁移 -->
      <tr class="row-medium">
        <td class="label-cell">句子迁移</td>
        <td class="content-cell" colspan="2"></td>
      </tr>

      <!-- 10. 方法迁移 -->
      <tr class="row-medium">
        <td class="label-cell">方法迁移</td>
        <td class="content-cell" colspan="2"></td>
      </tr>

      <!-- 11. 备注 -->
      <tr class="row-small">
        <td class="label-cell">备 注</td>
        <td class="content-cell" colspan="2"></td>
      </tr>
    </table>

    <!-- Bottom Footer -->
    <div class="footer-bar">
      <div style="width: 60px;"></div>
      <div class="footer-center">• THE ORIGINAL •</div>
      <div class="footer-logo">
        <span class="footer-logo-icon">凡</span>凡想笔记
      </div>
    </div>
  </div>
</div>

</body>
</html>
