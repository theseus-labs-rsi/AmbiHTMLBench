<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #faf9f8;
    background-image: 
      linear-gradient(#ecdcdb 1px, transparent 1px),
      linear-gradient(90deg, #ecdcdb 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #111;
    display: flex;
    justify-content: center;
    padding: 24px 12px 40px 12px;
  }

  .container {
    width: 100%;
    max-width: 500px;
  }

  /* 顶部大标题 */
  .header-title {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #0d276b;
    margin-bottom: 24px;
  }

  /* 行程区域网格 */
  .timeline-container {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .timeline-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    column-gap: 14px;
    align-items: center;
  }

  /* 左侧路线流 */
  .left-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* 天数标签 */
  .day-badge {
    background-color: #bbf2cb;
    font-size: 20px;
    font-weight: 800;
    color: #0b1a0e;
    padding: 3px 14px;
    border-radius: 2px;
    display: inline-block;
    margin-bottom: 6px;
  }

  /* 地点名称 */
  .station-name {
    font-size: 21px;
    font-weight: 800;
    color: #111;
    letter-spacing: 0.5px;
    margin: 4px 0;
  }

  /* 换乘行 (交通方式 - 箭头 - 耗时) */
  .transit-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin: 4px 0;
  }

  .transit-pill {
    background-color: #fcedea;
    font-size: 15px;
    font-weight: 600;
    color: #222;
    padding: 2px 5px;
    border-radius: 3px;
    white-space: nowrap;
  }

  /* 黄色向下箭头 SVG */
  .arrow-icon {
    width: 16px;
    height: 26px;
    display: block;
  }

  .arrow-icon-small {
    width: 15px;
    height: 24px;
    display: block;
    margin: 2px 0;
  }

  /* 右侧信息说明框 */
  .right-col {
    display: flex;
    align-items: center;
  }

  .info-card {
    background-color: #ffffff;
    border: 2px solid #8e181b;
    padding: 10px 10px;
    font-size: 14px;
    line-height: 1.5;
    color: #111;
    font-weight: 500;
    width: 100%;
  }

  .card-highlight {
    color: #1a4f8b;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 大标题 -->
  <h1 class="header-title">第三天路线规划</h1>

  <div class="timeline-container">
    
    <!-- 节点 1: 磁器口 -->
    <div class="timeline-row">
      <div class="left-col">
        <div class="day-badge">第三天</div>
        <svg class="arrow-icon-small" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 0H13V15H18L10 27L2 15H7V0Z" fill="#F6C343" stroke="#A26B12" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div class="station-name">磁器口</div>
      </div>
      <div class="right-col">
        <div class="info-card">
          <span class="card-highlight">磁器口（免费）</span>：汇聚美食、重庆特色伴手礼，始建于宋代“一江两洗三山四巷”独特地貌
        </div>
      </div>
    </div>

    <!-- 节点 2: 罗中立美术馆 -->
    <div class="timeline-row">
      <div class="left-col">
        <div class="transit-wrap">
          <span class="transit-pill">1号线</span>
          <svg class="arrow-icon" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 0H13V15H18L10 27L2 15H7V0Z" fill="#F6C343" stroke="#A26B12" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="transit-pill">30分钟</span>
        </div>
        <div class="station-name">罗中立美术馆</div>
      </div>
      <div class="right-col">
        <div class="info-card">
          <span class="card-highlight">罗中立美术馆（免费）</span>：拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
        </div>
      </div>
    </div>

    <!-- 节点 3: 山城步道 -->
    <div class="timeline-row">
      <div class="left-col">
        <div class="transit-wrap">
          <span class="transit-pill">1号线</span>
          <svg class="arrow-icon" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 0H13V15H18L10 27L2 15H7V0Z" fill="#F6C343" stroke="#A26B12" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="transit-pill">80分钟</span>
        </div>
        <div class="station-name">山城步道</div>
      </div>
      <div class="right-col">
        <div class="info-card">
          <span class="card-highlight">山城步道（免费）</span>：建在悬崖边的临江步道，汇聚老重庆特色步道
        </div>
      </div>
    </div>

    <!-- 节点 4: 观音桥 -->
    <div class="timeline-row">
      <div class="left-col">
        <div class="transit-wrap">
          <span class="transit-pill">公交</span>
          <svg class="arrow-icon" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 0H13V15H18L10 27L2 15H7V0Z" fill="#F6C343" stroke="#A26B12" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="transit-pill">32分钟</span>
        </div>
        <div class="station-name">观音桥</div>
      </div>
      <div class="right-col">
        <div class="info-card">
          <span class="card-highlight">观音桥（免费）</span>：超大商圈，还有很多地道重庆小吃
        </div>
      </div>
    </div>

    <!-- 节点 5: 九街 -->
    <div class="timeline-row">
      <div class="left-col">
        <div class="transit-wrap">
          <span class="transit-pill">步行</span>
          <svg class="arrow-icon" viewBox="0 0 20 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 0H13V15H18L10 27L2 15H7V0Z" fill="#F6C343" stroke="#A26B12" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="transit-pill">15分钟</span>
        </div>
        <div class="station-name">九街</div>
      </div>
      <div class="right-col">
        <div class="info-card">
          <span class="card-highlight">九街（免费）</span>：酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
