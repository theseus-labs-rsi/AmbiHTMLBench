<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王廙 祥除帖 昨表帖</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: #d1c7b7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;
      -webkit-font-smoothing: antialiased;
    }

    .scroll-container {
      background-color: #eee4d3;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      padding: 40px 30px 45px 35px;
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      justify-content: center;
      position: relative;
      border-radius: 2px;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 100%),
        linear-gradient(to bottom, #e8dcce 0%, #eee5d6 8%, #efe7d9 92%, #e5d8c8 100%);
    }

    .content-area {
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      flex-direction: column;
      height: 780px;
      user-select: none;
    }

    /* Small header at top right */
    .title-col {
      font-size: 14px;
      letter-spacing: 0.25em;
      color: #222;
      margin-left: 20px;
      margin-right: -10px;
      padding-top: 50px;
      font-weight: 500;
      line-height: 1.8;
    }

    .title-col span {
      margin-left: 12px;
    }

    /* Main calligraphy columns */
    .main-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 24px;
      line-height: 1.6;
      color: #161616;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .col {
      white-space: nowrap;
    }

    /* In-line gaps */
    .col-4-space {
      display: inline-block;
      height: 0.8em;
    }

    /* Colophon column */
    .colophon-col {
      font-size: 19px;
      color: #202020;
      margin-right: 35px;
      padding-top: 135px;
      letter-spacing: 0.06em;
      line-height: 1.5;
      font-weight: 600;
    }

    /* Seals */
    .seals-container {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .seal {
      width: 22px;
      height: 22px;
      border: 1.5px solid #b83324;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      line-height: 1;
      border-radius: 2px;
      box-sizing: border-box;
      transform: rotate(0.5deg);
    }

    .seal-white {
      background-color: #b83324;
      color: #eee4d3;
      font-weight: bold;
    }

    .seal-red {
      background-color: transparent;
      color: #b83324;
      font-weight: bold;
      border-width: 1.5px;
    }
  </style>
</head>
<body>

  <div class="scroll-container">
    <div class="content-area">
      <!-- Title on the upper right margin -->
      <div class="title-col">
        祥除帖<span>昨表帖</span>
      </div>

      <!-- Main Columns -->
      <div class="main-text">
        <div class="col">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時巖寒奉被</div>
        <div class="col">手詔伏承聖體御膳勝常以慰下情臣故患旬涌氣上頓乏匆匆慈</div>
        <div class="col">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>
        <div class="col">頓首死罪死罪<span class="col-4-space"></span>臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
        <div class="col">慰下情不審宿昔復如何承鄭夫人乃至委頓今復增損伏惟哀匕</div>
        <div class="col">愍存益勞聖心謹附承動靜臣廙言</div>
      </div>

      <!-- Colophon and Signature -->
      <div class="colophon-col">
        歲在癸卯春耀陽書於未央雲舍
        <div class="seals-container">
          <div class="seal seal-white">肖</div>
          <div class="seal seal-red">印</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
