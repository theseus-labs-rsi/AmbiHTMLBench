<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语C术语解释</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            color: #333333;
            line-height: 1.5;
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .item {
            margin-bottom: 8px;
        }

        .term {
            font-weight: 500;
            color: #222222;
        }

        .desc {
            color: #333333;
            margin-top: 1px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            <div class="term">审核：</div>
            <div class="desc">指进入语c群时，被群主审看人设、皮气等行为。</div>
        </div>

        <div class="item">
            <div class="term">新人：</div>
            <div class="desc">指初入某个圈子的人。</div>
        </div>

        <div class="item">
            <div class="term">纯白：</div>
            <div class="desc">完全不了解语c的人或刚接触语c。</div>
        </div>

        <div class="item">
            <div class="term">小白：</div>
            <div class="desc">指出入语c圈或对语c一无所知的人。</div>
        </div>

        <div class="item">
            <div class="term">小窗：</div>
            <div class="desc">指聊天会话的窗口（与QQ的私聊差不多）</div>
        </div>

        <div class="item">
            <div class="term">隔壁：</div>
            <div class="desc">指代另一个地方（隔壁群，隔壁平台）</div>
        </div>

        <div class="item">
            <div class="term">首页：</div>
            <div class="desc">在语c平台中，上皮发言互动的地方。</div>
        </div>

        <div class="item">
            <div class="term">水区：</div>
            <div class="desc">在语c平台中，皮下发言探讨问题或闲聊的地方。</div>
        </div>

        <div class="item">
            <div class="term">扩列：</div>
            <div class="desc">扩充列表，即加好友的意思。</div>
        </div>

        <div class="item">
            <div class="term">掌控：</div>
            <div class="desc">指开戏文字超过七百一段的人。</div>
        </div>

        <div class="item">
            <div class="term">字控：</div>
            <div class="desc">夸张手法，指一次开几个字为一段的人。</div>
        </div>

        <div class="item">
            <div class="term">句控：</div>
            <div class="desc">指开戏只开一行～三行为一段的人。</div>
        </div>
    </div>
</body>
</html>
