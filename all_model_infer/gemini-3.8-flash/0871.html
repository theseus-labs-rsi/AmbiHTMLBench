<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster - I Love You Three Thousand</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=Noto+Serif+SC:wght@600;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #eae6e1;
    font-family: 'Playfair Display', serif;
  }

  .poster {
    position: relative;
    width: 550px;
    height: 770px;
    background-color: #faf6f0;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
  }

  /* Abstract watercolor-like background swooshes */
  .bg-shape-1 {
    position: absolute;
    top: -60px;
    left: -80px;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(247, 203, 169, 0.75) 0%, rgba(250, 219, 193, 0.45) 55%, transparent 75%);
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    filter: blur(12px);
    pointer-events: none;
  }

  .bg-shape-2 {
    position: absolute;
    top: 100px;
    right: -60px;
    width: 380px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(248, 207, 172, 0.7) 0%, rgba(252, 226, 204, 0.35) 60%, transparent 80%);
    border-radius: 50% 50% 40% 60% / 60% 30% 70% 40%;
    transform: rotate(25deg);
    filter: blur(16px);
    pointer-events: none;
  }

  .bg-shape-3 {
    position: absolute;
    bottom: -80px;
    left: -40px;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, rgba(247, 206, 175, 0.65) 0%, rgba(251, 226, 205, 0.3) 60%, transparent 75%);
    border-radius: 60% 40% 50% 50% / 40% 60% 50% 60%;
    filter: blur(10px);
    pointer-events: none;
  }

  /* Texture overlay */
  .poster::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 0);
    background-size: 4px 4px;
    pointer-events: none;
  }

  /* Top Left Section */
  .top-left {
    position: absolute;
    top: 26px;
    left: 28px;
    color: #eb6112;
    z-index: 2;
  }

  .date {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1;
    margin-bottom: 5px;
  }

  .designer {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.3;
  }

  /* Top Right Section */
  .top-right {
    position: absolute;
    top: 24px;
    right: 28px;
    text-align: right;
    color: #eb6112;
    z-index: 2;
  }

  .main-heading {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.05;
    text-transform: uppercase;
  }

  .sub-heading {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1.5px;
    margin-top: 5px;
    text-transform: uppercase;
  }

  .chinese-quote {
    font-family: 'Noto Serif SC', serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: 14px;
    line-height: 1.6;
  }

  .chinese-sub {
    font-family: 'Noto Serif SC', serif;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 9px;
    margin-top: 4px;
  }

  /* Left Vertical Big Typography */
  .vertical-left-outer {
    position: absolute;
    top: 150px;
    left: 24px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    z-index: 2;
  }

  .vertical-left-inner {
    position: absolute;
    top: 150px;
    left: 104px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    z-index: 2;
  }

  .vertical-huge {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #eb6112;
    font-family: 'Playfair Display', serif;
  }

  .vertical-med {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #eb6112;
    font-family: 'Playfair Display', serif;
  }

  /* Right Vertical Thin Typography & Line */
  .vertical-right {
    position: absolute;
    top: 200px;
    right: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  .augenstern {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 8px;
    font-weight: 700;
    color: #eb6112;
    letter-spacing: 8px;
    margin-bottom: 8px;
  }

  .vertical-line {
    width: 1px;
    height: 180px;
    background-color: #eb6112;
    opacity: 0.7;
  }

  /* Bottom Right Section */
  .bottom-right {
    position: absolute;
    bottom: 30px;
    right: 28px;
    text-align: right;
    z-index: 2;
  }

  .chocolates-quote {
    font-size: 10.5px;
    color: #eb6112;
    line-height: 1.6;
    letter-spacing: 0.2px;
    font-weight: 600;
    margin-bottom: 12px;
    text-align: left;
  }

  .faith-banner {
    display: inline-block;
    background-color: #eb6112;
    color: #faf6f0;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.2px;
    padding: 3px 8px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Decorative Background Swirls -->
  <div class="bg-shape-1"></div>
  <div class="bg-shape-2"></div>
  <div class="bg-shape-3"></div>

  <!-- Top Left Info -->
  <div class="top-left">
    <div class="date">11/07</div>
    <div class="designer">
      DESIGNED BY<br>
      KERRLEE
    </div>
  </div>

  <!-- Top Right Main Typography -->
  <div class="top-right">
    <div class="main-heading">BRIFE IS LIFE</div>
    <div class="sub-heading">BUT LOVE IS LONG</div>
    <div class="chinese-quote">你要知道生命虽短，但爱却绵长</div>
    <div class="chinese-sub">爱你三千遍</div>
  </div>

  <!-- Big Vertical Typography (Left) -->
  <div class="vertical-left-outer">
    <div class="vertical-huge">'THREE THOUSAND</div>
  </div>

  <div class="vertical-left-inner">
    <div class="vertical-med">I LOVE YOU</div>
  </div>

  <!-- Vertical Fine Typography & Line (Right) -->
  <div class="vertical-right">
    <div class="augenstern">AUGENSTERN</div>
    <div class="vertical-line"></div>
  </div>

  <!-- Bottom Right Info & Banner -->
  <div class="bottom-right">
    <div class="chocolates-quote">
      Life was like a box of chocolates,<br>
      you never know what you are gonna get.
    </div>
    <div class="faith-banner">
      YOU GOTTA HAVE LITTLE FAITH
    </div>
  </div>
</div>

</body>
</html>
