<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忽视你的需求，内耗你的精力</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f6f6f4;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 16px;
  }

  .card-container {
    width: 100%;
    max-width: 480px;
    background-color: #f6f6f4;
    padding: 24px 8px;
  }

  .header-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .badge-title {
    background-color: #4b6f5d;
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    letter-spacing: 0.5px;
    display: inline-block;
  }

  .battery-icon {
    width: 40px;
    height: 58px;
    position: relative;
    flex-shrink: 0;
    margin-right: 6px;
  }

  .content-block {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .paragraph {
    color: #3b3b3b;
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.65;
    letter-spacing: 0.3px;
    text-align: justify;
  }

  .action-point {
    display: flex;
    align-items: flex-start;
    color: #41584b;
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.65;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }

  .check-icon {
    font-family: Arial, sans-serif;
    font-weight: 900;
    color: #41584b;
    margin-right: 8px;
    font-size: 17px;
    line-height: 1.65;
    flex-shrink: 0;
  }

  .footer-summary {
    color: #405c4c;
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.65;
    letter-spacing: 0.3px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="card-container">
  <!-- Top Header with Title Pill and Battery Graphic -->
  <div class="header-section">
    <div class="badge-title">3. 忽视你的需求，内耗你的精力</div>
    
    <div class="battery-icon">
      <svg viewBox="0 0 46 68" width="46" height="68" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Battery Terminal -->
        <rect x="16" y="2" width="14" height="6" rx="2" fill="#81d3f8" stroke="#1d1d1d" stroke-width="2.5" />
        <!-- Battery Body -->
        <rect x="5" y="8" width="36" height="56" rx="4" fill="#a4e4fd" stroke="#1d1d1d" stroke-width="2.5" />
        <!-- Inner level line / shading -->
        <line x1="5" y1="20" x2="41" y2="20" stroke="#7ecbf0" stroke-width="2" />
        <!-- Lightning bolt -->
        <polygon points="26,11 11,36 22,36 17,59 36,31 24,31" fill="#ff7f96" stroke="#1d1d1d" stroke-width="2" stroke-linejoin="round" />
        <!-- Diagonal strike accent lines -->
        <line x1="3" y1="57" x2="8" y2="67" stroke="#1d1d1d" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
  </div>

  <!-- Main Body Content -->
  <div class="content-block">
    <p class="paragraph">
      这一种人，不仅可能是身边的朋友，亲密关系中也会出现。爱我们的人，也可能会“害”我们。
    </p>

    <p class="paragraph">
      忽视需求，是关系中隐藏的一把刀，对人的伤害就像刻在木头上的刀痕，再也恢复不到原样。
    </p>

    <p class="paragraph">
      而忽视一次，就是给对方的内心，套上一层不透气的薄膜，直到最后无法呼吸，内耗倒下。
    </p>

    <p class="paragraph">
      经常忽视你需求的人，他们或许真的在乎你，但这种错误方式，只会让你越来越疲惫。
    </p>

    <div class="action-point">
      <span class="check-icon">✔</span>
      <div>面对关系亲近的人的控制，先做出必要的沟通，坦诚表达自己的感受，必要时保持适当距离。</div>
    </div>

    <p class="footer-summary">
      与人交往需要衡量，更需要智慧，愿你在前行路上看清他人、做好自己。
    </p>
  </div>
</div>

</body>
</html>
