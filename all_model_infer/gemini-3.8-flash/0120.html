<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语文学习笔记</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #7b5ea7;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .page-container {
    width: 100%;
    max-width: 540px;
    background-color: #ffffff;
    border-radius: 18px;
    position: relative;
    padding: 40px 30px 50px 36px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }
  
  /* Top-left decorative illustration */
  .deco-top-left {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 100px;
    height: 100px;
    pointer-events: none;
  }

  /* Bottom-right decorative illustration */
  .deco-bottom-right {
    position: absolute;
    bottom: -10px;
    right: -10px;
    width: 130px;
    height: 130px;
    pointer-events: none;
  }

  /* Watermark */
  .watermark {
    position: absolute;
    right: 30px;
    top: 55%;
    font-size: 11px;
    color: rgba(180, 180, 180, 0.5);
    text-align: left;
    line-height: 1.3;
    pointer-events: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Content typography */
  .section {
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }
  .section:first-of-type {
    margin-top: 80px;
  }

  .section-title {
    font-size: 26px;
    font-weight: 900;
    color: #2b0d61;
    display: inline-block;
    border-bottom: 3px solid #2b0d61;
    padding-bottom: 4px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .content-text {
    font-size: 15.5px;
    line-height: 1.6;
    color: #111111;
    font-weight: 500;
    text-align: justify;
  }

  .list-item {
    margin-bottom: 3px;
    line-height: 1.55;
  }

  /* Placeholders styling */
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px dashed #bba8d8;
    background-color: #f6f2fb;
    color: #7b5ea7;
    font-size: 11px;
    text-align: center;
    border-radius: 12px;
    padding: 6px;
  }
</style>
</head>
<body>

<div class="page-container">

  <!-- Top-left Illustration Placeholder -->
  <div class="placeholder deco-top-left">
    [Magic Book: Jenny]
  </div>

  <!-- Watermark on the middle right -->
  <div class="watermark">
    <span>🤍</span>
    <div>
      <div>@小琪妈妈小宇宙</div>
      <div style="font-size: 9px;">From 小红书</div>
    </div>
  </div>

  <!-- Section 4 -->
  <div class="section">
    <div class="section-title">四，句式练习</div>
    <div class="content-text">
      仿写、修改病句、把字句变被字句、反问句变陈述句、陈述句变感叹句、缩句扩句等等
    </div>
  </div>

  <!-- Section 5 -->
  <div class="section">
    <div class="section-title">五，阅读理解</div>
    <div class="content-text">
      <div class="list-item">课内阅读理解：主要复习课文笔记、中心思想以及课后习题。</div>
      <div class="list-item">课外阅读理解：主要是要掌握好答题技巧。</div>
    </div>
  </div>

  <!-- Section 6 -->
  <div class="section" style="margin-bottom: 0;">
    <div class="section-title">六，阅读训练</div>
    <div class="content-text">
      <div class="list-item">1，圈出题目里面的关键词。</div>
      <div class="list-item">2，记住答案的宗旨就是答案都在原文里。</div>
      <div class="list-item">3，掌握表达方式，修辞手法的运用，解释词语，找近反义词。</div>
      <div class="list-item">4，概括主要内容就是，时间，地点，人物，事情。</div>
      <div class="list-item" style="max-width: 82%;">5，答题技巧，人物评价围绕品质，景物围绕热爱之情来答。</div>
    </div>
  </div>

  <!-- Bottom-right Illustration Placeholder -->
  <div class="placeholder deco-bottom-right">
    [Cute character with cotton candy]
  </div>

</div>

</body>
</html>
