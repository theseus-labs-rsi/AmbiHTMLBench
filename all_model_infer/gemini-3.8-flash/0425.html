<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRADA Shoes Guide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e5e7eb;
      font-family: "Didot", "Bodoni MT", "Cinzel", "Songti SC", "SimSun", "Noto Serif SC", serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .poster-container {
      width: 580px;
      background-color: #ffffff;
      padding: 30px 24px 40px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    /* Header */
    .header-box {
      border: 1px dashed #71717a;
      width: 440px;
      margin: 0 auto 15px auto;
      padding: 6px 0;
      text-align: center;
    }

    .header-box h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #000000;
      line-height: 1.1;
      font-family: "Bodoni MT", "Didot", "Times New Roman", serif;
    }

    /* Staggered Grid Container */
    .grid-container {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-top: 10px;
    }

    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32%;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    /* Placeholders for shoe images */
    .placeholder {
      background-color: #f4f4f5;
      border: 1px solid #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #71717a;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 4px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Specific image aspect ratios / footprints */
    .img-slingback {
      width: 155px;
      height: 110px;
    }

    .img-maryjane {
      width: 155px;
      height: 105px;
    }

    .img-chocolate {
      width: 155px;
      height: 110px;
    }

    .img-triangolo {
      width: 160px;
      height: 85px;
    }

    .img-monolith-derby {
      width: 145px;
      height: 85px;
    }

    .img-monolith-sandal {
      width: 155px;
      height: 90px;
    }

    .img-double-wheel {
      width: 155px;
      height: 85px;
    }

    .img-gabardine {
      width: 160px;
      height: 85px;
    }

    .img-downtown {
      width: 155px;
      height: 100px;
    }

    /* Product Typography */
    .product-title {
      font-size: 12.5px;
      color: #3f3f46;
      line-height: 1.4;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* Column Specific Offsets for Staggered Visual Alignment */
    .col-left {
      padding-top: 85px;
    }

    .col-center {
      padding-top: 0px;
    }

    .col-right {
      padding-top: 100px;
    }

    .col-left .product-card:nth-child(1) {
      margin-bottom: 45px;
    }

    .col-left .product-card:nth-child(2) {
      margin-bottom: 45px;
    }

    .col-center .product-card:nth-child(1) {
      margin-bottom: 30px;
    }

    .col-center .product-card:nth-child(2) {
      margin-bottom: 30px;
    }

    .col-right .product-card:nth-child(1) {
      margin-bottom: 40px;
    }

    .col-right .product-card:nth-child(2) {
      margin-bottom: 35px;
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <!-- Header Box -->
    <header class="header-box">
      <h1>PRADA</h1>
    </header>

    <!-- Layout Grid -->
    <main class="grid-container">
      
      <!-- Left Column -->
      <section class="column col-left">
        <!-- Item 1: Mary Jane -->
        <article class="product-card">
          <figure class="placeholder img-maryjane">
            [Photo: 玛丽珍鞋]
          </figure>
          <div class="product-title">
            玛丽珍鞋
          </div>
        </article>

        <!-- Item 2: Monolith Derby -->
        <article class="product-card">
          <figure class="placeholder img-monolith-derby">
            [Photo: MONOLITH 亮面皮革系带鞋]
          </figure>
          <div class="product-title">
            MONOLITH 亮面<br>皮革系带鞋
          </div>
        </article>

        <!-- Item 3: Gabardine Sneaker -->
        <article class="product-card">
          <figure class="placeholder img-gabardine">
            [Photo: 华达呢织物运动鞋]
          </figure>
          <div class="product-title">
            华达呢织物运动鞋
          </div>
        </article>
      </section>

      <!-- Center Column -->
      <section class="column col-center">
        <!-- Item 1: Slingback Heels -->
        <article class="product-card">
          <figure class="placeholder img-slingback">
            [Photo: 亮面皮革后饰带高跟鞋]
          </figure>
          <div class="product-title">
            亮面皮革后饰带<br>高跟鞋
          </div>
        </article>

        <!-- Item 2: Triangolo Loafers -->
        <article class="product-card">
          <figure class="placeholder img-triangolo">
            [Photo: TRIANGOLO 亮面皮革乐福鞋]
          </figure>
          <div class="product-title">
            TRIANGOLO 亮面<br>皮革乐福鞋
          </div>
        </article>

        <!-- Item 3: Double Wheel Sneaker -->
        <article class="product-card">
          <figure class="placeholder img-double-wheel">
            [Photo: DOUBLE WHEEL]
          </figure>
          <div class="product-title">
            DOUBLE WHEEL
          </div>
        </article>
      </section>

      <!-- Right Column -->
      <section class="column col-right">
        <!-- Item 1: Chocolate Loafers -->
        <article class="product-card">
          <figure class="placeholder img-chocolate">
            [Photo: CHOCOLATE 亮面皮革乐福鞋]
          </figure>
          <div class="product-title">
            CHOCOLATE 亮面<br>皮革乐福鞋
          </div>
        </article>

        <!-- Item 2: Monolith Sandal -->
        <article class="product-card">
          <figure class="placeholder img-monolith-sandal">
            [Photo: MONOLITH 亮面皮革凉鞋]
          </figure>
          <div class="product-title">
            MONOLITH 亮面<br>皮革凉鞋
          </div>
        </article>

        <!-- Item 3: Downtown Sneaker -->
        <article class="product-card">
          <figure class="placeholder img-downtown">
            [Photo: DOWNTOWN 穿孔皮革运动鞋]
          </figure>
          <div class="product-title">
            DOWNTOWN 穿孔<br>皮革运动鞋
          </div>
        </article>
      </section>

    </main>
  </div>

</body>
</html>
