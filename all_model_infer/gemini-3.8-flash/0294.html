<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur the King - Movie Poster</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .poster {
    position: relative;
    width: 600px;
    height: 900px;
    background: linear-gradient(135deg, #1c2b22 0%, #3e4f3a 35%, #7a6e4d 60%, #a29161 80%, #d8ca95 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    color: #fff;
  }

  /* Placeholder representation for the background photography */
  .photo-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
      radial-gradient(circle at 90% 25%, rgba(255, 245, 200, 0.45) 0%, transparent 40%),
      radial-gradient(circle at 50% 30%, rgba(90, 60, 40, 0.4) 0%, transparent 60%),
      radial-gradient(circle at 35% 75%, rgba(180, 110, 50, 0.5) 0%, transparent 60%),
      linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, transparent 40%, rgba(0,0,0,0.4) 100%);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-placeholder-label {
    position: absolute;
    top: 25%;
    right: 15%;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.25);
    text-transform: uppercase;
    border: 1px dashed rgba(255, 255, 255, 0.2);
    padding: 6px 12px;
    border-radius: 4px;
    pointer-events: none;
  }

  .content-layer {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 35px 35px 25px 35px;
  }

  /* Header */
  .actor-name {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 11px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    padding-left: 11px; /* visual center balance for letter-spacing */
  }

  /* Center Area */
  .main-block {
    margin-top: 190px;
  }

  .tagline {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    line-height: 1.45;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    margin-bottom: 22px;
    margin-left: 15px;
  }

  .movie-title {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.18;
    color: #f7b71d;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    margin-left: 10px;
  }

  .title-line {
    display: flex;
    letter-spacing: 24px;
  }

  /* Footer */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: auto;
  }

  .rating-box {
    display: flex;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 2px 4px;
    background: rgba(0, 0, 0, 0.3);
    font-size: 8px;
    font-weight: bold;
    color: #fff;
    width: fit-content;
  }

  .rating-pg {
    font-size: 11px;
    font-weight: 900;
    border-right: 1px solid rgba(255, 255, 255, 0.6);
    padding-right: 5px;
    margin-right: 5px;
  }

  .rating-text {
    font-size: 6.5px;
    line-height: 1.1;
    text-transform: uppercase;
  }

  .credits-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .based-on {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.25;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    margin-bottom: 12px;
  }

  .coming-soon {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #ffffff;
  }

  .studio-logo {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #d1d1d1;
    margin-top: 1px;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Visual background placeholder representing Mark Wahlberg and Arthur -->
  <div class="photo-placeholder">
    <div class="photo-placeholder-label">[Photo: Mark Wahlberg and Arthur the dog]</div>
  </div>

  <div class="content-layer">
    <!-- Top Actor Header -->
    <div class="actor-name">MARK WAHLBERG</div>

    <!-- Middle Tagline & Major Title -->
    <div class="main-block">
      <div class="tagline">
        AN UNEXPECTED ENCOUNTER<br>
        AN UNLIKELY BOND<br>
        AN UNFORGETTABLE ADVENTURE
      </div>

      <div class="movie-title">
        <div class="title-line">ARTHUR</div>
        <div class="title-line">THE</div>
        <div class="title-line">KING</div>
      </div>
    </div>

    <!-- Bottom Credits & Ratings -->
    <div class="footer">
      <div class="rating-box">
        <span class="rating-pg">PG-13</span>
        <span class="rating-text">SOME STRONG<br>LANGUAGE</span>
      </div>

      <div class="credits-right">
        <div class="based-on">
          BASED ON THE<br>
          INCREDIBLE TRUE STORY
        </div>
        <div class="coming-soon">COMING SOON</div>
        <div class="studio-logo">LIONSGATE</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
