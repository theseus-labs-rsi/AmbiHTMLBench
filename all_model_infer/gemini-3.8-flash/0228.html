<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Sustainability Summit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e6e6e6;
      font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .poster {
      width: 700px;
      height: 990px;
      background-color: #035a2b;
      position: relative;
      display: flex;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    /* Left Column */
    .left-col {
      width: 51%;
      height: 100%;
      background-color: #035a2b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* Top Cream Section */
    .top-card {
      background-color: #f5f2e8;
      border-radius: 0 0 175px 175px;
      padding: 60px 40px 65px 45px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .title-vertical-container {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 10px;
      height: 420px;
      margin-left: 10px;
    }

    .vertical-title {
      writing-mode: vertical-rl;
      color: #035a2b;
      font-size: 45px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .divider-line {
      width: 170px;
      height: 1.5px;
      background-color: #035a2b;
      margin: 22px 0 28px 10px;
    }

    .section-label {
      color: #3bb34a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-left: 10px;
      margin-bottom: 12px;
    }

    .reg-item {
      margin-left: 10px;
      margin-bottom: 16px;
    }

    .reg-item:last-child {
      margin-bottom: 0;
    }

    .reg-title {
      color: #231f20;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .reg-price {
      color: #035a2b;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* Bottom Cream Section */
    .bottom-card {
      background-color: #f5f2e8;
      border-radius: 0 0 175px 175px;
      padding: 30px 40px 65px 45px;
      margin-top: 15px;
    }

    .visit-text {
      color: #231f20;
      font-size: 13px;
      line-height: 1.5;
      margin-left: 10px;
      font-weight: 500;
    }

    /* Right Column */
    .right-col {
      width: 49%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Top Right - Dark Green */
    .top-right {
      height: 61%;
      background-color: #035a2b;
      position: relative;
      padding: 35px 35px 0 0;
    }

    .logo-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }

    .logo-text {
      text-align: right;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    /* Tree Illustration Placeholder */
    .tree-wrapper.placeholder {
      position: absolute;
      width: 380px;
      height: 520px;
      top: 130px;
      left: -20px;
      z-index: 10;
      pointer-events: none;
    }

    .placeholder-caption {
      position: absolute;
      bottom: 12px;
      right: 15px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Bottom Right - Light Green with Dark Circle */
    .bottom-right {
      height: 39%;
      background-color: #3bb34a;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .date-location-circle {
      width: 295px;
      height: 295px;
      border-radius: 50%;
      background-color: #035a2b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 55px;
      box-sizing: border-box;
      z-index: 5;
    }

    .circle-label {
      color: #3bb34a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .circle-text {
      color: #ffffff;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    .circle-group {
      margin-bottom: 24px;
    }

    .circle-group:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="poster">
    
    <!-- Left Column -->
    <div class="left-col">
      <!-- Upper Section -->
      <div class="top-card">
        <!-- Rotated Title -->
        <div class="title-vertical-container">
          <div class="vertical-title">Global</div>
          <div class="vertical-title">Sustainability</div>
          <div class="vertical-title">Summit</div>
        </div>

        <div class="divider-line"></div>

        <!-- Registration Info -->
        <div class="section-label">REGISTRATION</div>

        <div class="reg-item">
          <div class="reg-title">General Admission</div>
          <div class="reg-price">$350</div>
        </div>

        <div class="reg-item">
          <div class="reg-title">Students & Nonprofits</div>
          <div class="reg-price">$200</div>
        </div>
      </div>

      <!-- Lower Visit Section -->
      <div class="bottom-card">
        <div class="section-label">VISIT</div>
        <div class="visit-text">
          www.yourwebsite.com for more<br>
          details and to register today!
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="right-col">
      <!-- Dark Green Upper Area -->
      <div class="top-right">
        <!-- Logo -->
        <div class="logo-container">
          <div class="logo-text">Your<br><strong>LOGO</strong></div>
          <svg class="logo-icon" viewBox="0 0 24 24">
            <path d="M12 2C10.5 2 9.2 3.1 9 4.6C8 3.5 6.4 3 5 3.8C3.3 4.8 2.8 7 3.8 8.6C4.4 9.6 5.5 10.2 6.6 10.4C5.1 10.7 4 12 4 13.5C4 15.2 5.3 16.5 7 16.5C7.5 16.5 8 16.3 8.5 16.1C8.2 17.5 9 19 10.4 19.6C11.9 20.2 13.6 19.5 14.2 18C14.5 17.3 14.5 16.6 14.3 16C15.5 16.6 17 16.3 18 15.3C19.2 14.1 19.2 12.1 18 10.9C17.4 10.3 16.6 10 15.8 10C16.8 9.2 17.2 7.7 16.6 6.5C15.8 4.8 13.7 4.1 12 5.2V2Z"/>
          </svg>
          <span style="font-size: 8px; vertical-align: super; margin-top: -8px; font-weight: bold;">®</span>
        </div>
      </div>

      <!-- Tree Image Placeholder -->
      <div class="tree-wrapper placeholder">
        <svg viewBox="0 0 350 500" width="100%" height="100%" style="overflow: visible;">
          <defs>
            <radialGradient id="foliageGrad1" cx="45%" cy="40%" r="55%">
              <stop offset="0%" stop-color="#4ea332"/>
              <stop offset="45%" stop-color="#2a661c"/>
              <stop offset="85%" stop-color="#143b0c"/>
              <stop offset="100%" stop-color="#091d06"/>
            </radialGradient>
            <radialGradient id="foliageGrad2" cx="50%" cy="30%" r="60%">
              <stop offset="0%" stop-color="#62ba38"/>
              <stop offset="50%" stop-color="#34751f"/>
              <stop offset="90%" stop-color="#16380c"/>
            </radialGradient>
            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3b2416"/>
              <stop offset="35%" stop-color="#6e4d30"/>
              <stop offset="70%" stop-color="#4a311d"/>
              <stop offset="100%" stop-color="#21130b"/>
            </linearGradient>
          </defs>

          <!-- Trunk and Branches -->
          <g id="trunk">
            <!-- Main Trunk -->
            <path d="M 175 480 
                     C 177 430, 182 370, 172 320 
                     C 165 280, 155 240, 178 200 
                     C 183 190, 186 170, 186 150
                     L 194 150
                     C 192 180, 194 210, 185 240
                     C 198 270, 195 330, 193 380
                     C 191 420, 194 450, 192 480 Z" 
                  fill="url(#trunkGrad)" />
            
            <!-- Bark texture lines -->
            <path d="M 179 460 C 182 400, 185 350, 178 300" stroke="#2a180e" stroke-width="2.5" fill="none" opacity="0.6"/>
            <path d="M 186 470 C 189 420, 187 370, 187 320" stroke="#7d5a3c" stroke-width="2" fill="none" opacity="0.5"/>
            <path d="M 175 350 C 170 320, 163 290, 172 260" stroke="#22130b" stroke-width="2" fill="none" opacity="0.7"/>

            <!-- Left Branches -->
            <path d="M 170 250 C 145 235, 110 225, 75 220 L 78 214 C 115 218, 148 228, 173 242 Z" fill="#3d2717"/>
            <path d="M 160 220 C 135 195, 95 180, 50 170 L 52 165 C 100 173, 140 190, 164 213 Z" fill="#362214"/>
            <path d="M 125 215 C 105 190, 80 175, 55 160 L 58 156 C 85 170, 110 186, 128 210 Z" fill="#2c1a0e"/>

            <!-- Right Branches -->
            <path d="M 183 235 C 215 220, 255 210, 295 205 L 293 211 C 255 216, 218 226, 186 242 Z" fill="#422b1a"/>
            <path d="M 185 200 C 215 180, 255 170, 305 160 L 303 155 C 255 164, 215 174, 182 194 Z" fill="#362214"/>
            <path d="M 230 195 C 255 175, 280 160, 310 145 L 308 140 C 275 155, 250 170, 226 190 Z" fill="#2c1a0e"/>
            
            <!-- Canopy Support Shoots -->
            <path d="M 178 180 C 160 140, 130 120, 95 105 L 98 100 C 135 116, 165 137, 182 175 Z" fill="#362214"/>
            <path d="M 185 175 C 205 135, 235 115, 275 100 L 273 95 C 230 111, 200 132, 182 170 Z" fill="#2c1a0e"/>
          </g>

          <!-- Foliage Canopy -->
          <g id="canopy">
            <!-- Base Silhouette for Density -->
            <ellipse cx="180" cy="115" rx="165" ry="85" fill="url(#foliageGrad1)"/>
            
            <!-- Cloud-like overlapping foliage lobes -->
            <ellipse cx="65" cy="140" rx="60" ry="40" fill="url(#foliageGrad1)"/>
            <ellipse cx="300" cy="140" rx="55" ry="38" fill="url(#foliageGrad1)"/>
            <ellipse cx="110" cy="80" rx="75" ry="50" fill="url(#foliageGrad2)"/>
            <ellipse cx="250" cy="80" rx="80" ry="52" fill="url(#foliageGrad2)"/>
            <ellipse cx="180" cy="65" rx="95" ry="55" fill="url(#foliageGrad2)"/>
            
            <!-- Fluffy umbrella pine perimeter clusters -->
            <circle cx="35" cy="130" r="30" fill="#1b4611"/>
            <circle cx="65" cy="110" r="38" fill="#2d6e1d"/>
            <circle cx="105" cy="60" r="45" fill="#46932c"/>
            <circle cx="150" cy="45" r="45" fill="#4ea332"/>
            <circle cx="205" cy="42" r="48" fill="#58ab37"/>
            <circle cx="260" cy="55" r="45" fill="#448f2a"/>
            <circle cx="305" cy="95" r="40" fill="#2f711e"/>
            <circle cx="330" cy="130" r="28" fill="#1c4411"/>

            <!-- Textured Highlights on Top -->
            <ellipse cx="130" cy="50" rx="50" ry="25" fill="#6bc441" opacity="0.6"/>
            <ellipse cx="220" cy="45" rx="55" ry="26" fill="#6bc441" opacity="0.7"/>
            <ellipse cx="175" cy="38" rx="40" ry="20" fill="#7ed453" opacity="0.8"/>
            <ellipse cx="80" cy="85" rx="40" ry="22" fill="#58ad35" opacity="0.6"/>
            <ellipse cx="280" cy="85" rx="45" ry="24" fill="#56ab34" opacity="0.6"/>

            <!-- Underside Deep Shadows -->
            <ellipse cx="180" cy="155" rx="130" ry="35" fill="#081805" opacity="0.9"/>
            <ellipse cx="100" cy="160" rx="65" ry="25" fill="#091b06" opacity="0.85"/>
            <ellipse cx="260" cy="160" rx="65" ry="25" fill="#091b06" opacity="0.85"/>
          </g>
        </svg>
        <div class="placeholder-caption">[Photo: Stone pine tree]</div>
      </div>

      <!-- Bright Green Lower Area -->
      <div class="bottom-right">
        <!-- Dark Green Date & Location Circle -->
        <div class="date-location-circle">
          <div class="circle-group">
            <div class="circle-label">DATE</div>
            <div class="circle-text">
              27 January 2026<br>
              10:00 PM
            </div>
          </div>

          <div class="circle-group">
            <div class="circle-label">LOCATION</div>
            <div class="circle-text">
              Grand Hall, Convention<br>
              Center, Chicago, IL
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
