<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新手佩戴水晶 常见30个问题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b2b2b;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Phone / Card Outer Frame */
        .card-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 36px;
            padding: 28px 24px 36px 24px;
            box-shadow: 
                0 0 0 2px #d8d8d8,
                0 0 0 8px #1f1f1f,
                0 0 0 10px #4a4a4a,
                0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            color: #222;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding-top: 10px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "Songti SC", serif;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #111;
            margin-bottom: 4px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .header h2 {
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h2 .highlight {
            color: #e64a19;
            font-style: italic;
            margin-left: 2px;
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff,
                 2px 2px 4px rgba(230, 74, 25, 0.4);
        }

        /* Divider */
        .divider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0 22px 0;
            position: relative;
        }

        .divider-line {
            flex-grow: 1;
            height: 2px;
            background-color: #d19f56;
        }

        .divider-icon {
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ribbon-icon {
            width: 24px;
            height: 16px;
            border: 2px solid #b87b28;
            position: relative;
            background: #fff;
            clip-path: polygon(0 0, 100% 0, 85% 50%, 100% 100%, 0 100%, 15% 50%);
        }

        /* Section Layout */
        .qa-section {
            margin-bottom: 22px;
        }

        .question-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 21px;
            font-weight: 800;
            color: #111;
            letter-spacing: 0.5px;
            font-family: "STKaiti", "Kaiti", "PingFang SC", sans-serif;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Crystal Bead Elements */
        .crystal-bead {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-left: 8px;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 
                inset -4px -4px 8px rgba(0, 0, 0, 0.5),
                inset 4px 4px 8px rgba(255, 255, 255, 0.8),
                2px 3px 6px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .crystal-bead::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 8px;
            width: 8px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            transform: rotate(-30deg);
        }

        /* Individual Bead Color Styles */
        .bead-rutile {
            background: radial-gradient(circle at 35% 35%, #fce79f, #b37416 60%, #5c3803 100%);
        }

        .bead-strawberry {
            background: radial-gradient(circle at 35% 35%, #ff8b94, #c9182b 60%, #680510 100%);
        }

        .bead-rose {
            background: radial-gradient(circle at 35% 35%, #ffe6ea, #e8a7b5 60%, #b86e80 100%);
        }

        .bead-garden {
            background: radial-gradient(circle at 35% 35%, #f2d5cf, #ad4a43 60%, #4a2c2c 100%);
        }

        /* Content Text */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 15.5px;
            color: #333;
            line-height: 1.5;
            font-weight: 600;
        }

        .numbered-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 3px;
        }

        .badge-num {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 17px;
            height: 17px;
            background: linear-gradient(180deg, #4b78a4, #315882);
            color: #fff;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 6px;
            margin-top: 3px;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .text-body {
            color: #2b2b2b;
            font-weight: 600;
            letter-spacing: 0.2px;
            word-break: break-word;
        }

        .stone-grid {
            color: #333;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
            letter-spacing: 0.5px;
            padding-left: 2px;
        }

        .stone-row {
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- Header -->
    <header class="header">
        <h1>新手佩戴水晶</h1>
        <h2>常见<span class="highlight">30个问题</span></h2>
    </header>

    <!-- Divider -->
    <div class="divider-container">
        <div class="divider-line"></div>
        <div class="divider-icon">
            <div class="ribbon-icon"></div>
        </div>
        <div class="divider-line"></div>
    </div>

    <!-- Question 1 -->
    <section class="qa-section">
        <div class="question-row">
            <span class="question-text">Q: 水晶戴左手还是右手？</span>
            <div class="crystal-bead bead-rutile" title="金发晶"></div>
        </div>
        <div class="item-list">
            <div class="numbered-row">
                <span class="badge-num">1</span>
                <span class="text-body">黄水晶、草莓晶、紫水晶、海蓝宝、粉晶、月光石、萤石等常佩戴在左手;</span>
            </div>
            <div class="numbered-row">
                <span class="badge-num">2</span>
                <span class="text-body">黑/银曜石、白水晶、虎眼石等常佩戴在右手。</span>
            </div>
        </div>
    </section>

    <!-- Question 2 -->
    <section class="qa-section">
        <div class="question-row">
            <span class="question-text">Q: 哪些水晶不能碰水？</span>
            <div class="crystal-bead bead-strawberry" title="草莓晶"></div>
        </div>
        <div class="stone-grid">
            <div class="stone-row">太阳石、方解石、萤石、孔雀石、天青石</div>
            <div class="stone-row">青金石、海纹石、月光石、天河石、绿松石</div>
            <div class="stone-row">蓝铜矿、蓝晶石、堇青石、紫龙晶、紫锂辉石</div>
            <div class="stone-row">透石膏、灰月光、赤铁矿、紫锂云母</div>
        </div>
    </section>

    <!-- Question 3 -->
    <section class="qa-section">
        <div class="question-row">
            <span class="question-text">Q: 水晶怎么消磁？</span>
            <div class="crystal-bead bead-rose" title="粉晶"></div>
        </div>
        <div class="stone-grid">
            <div class="stone-row">碎石消磁、海盐消磁、鼠尾草消磁、月光消磁</div>
            <div class="stone-row">流水消磁</div>
        </div>
    </section>

    <!-- Question 4 -->
    <section class="qa-section" style="margin-bottom: 8px;">
        <div class="question-row">
            <span class="question-text">Q: 不佩戴水晶的时候放哪里？</span>
            <div class="crystal-bead bead-garden" title="幽灵水晶"></div>
        </div>
        <div class="item-list">
            <div class="numbered-row">
                <span class="badge-num">1</span>
                <span class="text-body">可以放在装有消磁石的盒子里面存放起来;</span>
            </div>
            <div class="numbered-row">
                <span class="badge-num">2</span>
                <span class="text-body">可以放在水晶簇或水晶洞里面;</span>
            </div>
            <div class="numbered-row">
                <span class="badge-num">3</span>
                <span class="text-body">可以放一个软布在木盒，然后将水晶放里面。</span>
            </div>
        </div>
    </section>
</div>

</body>
</html>
