<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok运营 48个必备工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }

    .poster {
      width: 540px;
      height: 720px;
      background-color: #27493b;
      color: #ffffff;
      padding: 60px 36px 45px 36px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      margin-bottom: 22px;
    }

    .title-main {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 1px;
    }

    .title-sub {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 2px;
    }

    .badge-container {
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background-color: #e5a712;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 5px 12px;
      letter-spacing: 1px;
    }

    .grid-container {
      display: flex;
      gap: 14px;
      flex: 1;
    }

    .column-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Left Group Cards */
    .left-cards {
      background-color: #638467;
    }

    /* Right Group Cards */
    .right-cards {
      background-color: #559e5e;
    }

    .card {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }

    .part-tag {
      font-family: "Courier New", Courier, monospace, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      opacity: 0.95;
    }

    .card-text {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.5px;
    }

    /* Left Column Specific Layout */
    .left-top-row {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .part-01 {
      flex: 1;
    }

    .left-mid-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .part-02, .part-03 {
      flex: 1;
    }

    .part-04 {
      height: 70px;
    }

    /* Right Column Specific Layout */
    .part-05 {
      height: 100px;
    }

    .right-bottom-row {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .part-06 {
      flex: 1;
    }

    .right-mid-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .part-07, .part-08 {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="poster">
    <!-- Header Titles -->
    <div class="header">
      <div class="title-main">TikTok运营</div>
      <div class="title-sub">48个必备工具</div>
    </div>

    <!-- Author Badge -->
    <div class="badge-container">
      <div class="badge">@ 徐徐教你做TikTok</div>
    </div>

    <!-- Main Content Cards -->
    <div class="grid-container">
      <!-- Left Column Group -->
      <div class="column-group">
        <div class="left-top-row">
          <div class="card left-cards part-01">
            <div class="part-tag">Part 01</div>
            <div class="card-text">7个TK<br>数据平台</div>
          </div>
          <div class="left-mid-stack">
            <div class="card left-cards part-02">
              <div class="part-tag">Part 02</div>
              <div class="card-text">3个好用<br>选品网站</div>
            </div>
            <div class="card left-cards part-03">
              <div class="part-tag">Part 03</div>
              <div class="card-text">5个视频<br>素材网站</div>
            </div>
          </div>
        </div>
        <div class="card left-cards part-04">
          <div class="part-tag">Part 04</div>
          <div class="card-text">6个TK数据分析网站</div>
        </div>
      </div>

      <!-- Right Column Group -->
      <div class="column-group">
        <div class="card right-cards part-05">
          <div class="part-tag">Part 05</div>
          <div class="card-text">4个剪辑<br>4个翻译软件</div>
        </div>
        <div class="right-bottom-row">
          <div class="card right-cards part-06">
            <div class="part-tag">Part 06</div>
            <div class="card-text">8个TK<br>传输管理<br>网站</div>
          </div>
          <div class="right-mid-stack">
            <div class="card right-cards part-07">
              <div class="part-tag">Part 07</div>
              <div class="card-text">5个BGM<br>网站</div>
            </div>
            <div class="card right-cards part-08">
              <div class="part-tag">Part 08</div>
              <div class="card-text">7个投放<br>联盟网站</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
