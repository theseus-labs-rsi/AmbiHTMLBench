<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高频考点汇总</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #92a787;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: #ffffff;
            border-radius: 4px;
            padding: 30px 24px 40px 28px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Illustrations / Placeholders */
        .placeholder {
            position: absolute;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Top-right girl illustration */
        .sticker-top-right {
            top: -5px;
            right: 15px;
            width: 110px;
            height: 120px;
            z-index: 2;
        }

        /* Middle-right cloud character */
        .sticker-middle-right {
            top: 235px;
            right: 25px;
            width: 140px;
            height: 120px;
            z-index: 1;
        }

        /* Bottom-right monster character */
        .sticker-bottom-right {
            bottom: -10px;
            right: 10px;
            width: 150px;
            height: 140px;
            z-index: 1;
        }

        /* Header / Title */
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            padding-right: 60px;
        }

        .title-badge {
            display: inline-block;
            background: #fbd6dc;
            padding: 4px 18px;
            border-radius: 20px 25px 22px 20px;
            font-size: 23px;
            font-weight: 900;
            color: #533329;
            letter-spacing: 2px;
            position: relative;
        }

        /* Headings */
        .section-title {
            font-size: 19px;
            font-weight: 900;
            color: #4da6b7;
            text-shadow: 
                -1px -1px 0 #ffffff,  
                 1px -1px 0 #ffffff,
                -1px  1px 0 #ffffff,
                 1px  1px 0 #ffffff;
            margin-top: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        /* Section text list */
        .item-text {
            font-size: 16.5px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.6;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .indent-line {
            margin-left: 0px;
        }

        /* Orange Stars */
        .stars {
            display: inline-flex;
            gap: 4px;
            margin-left: 10px;
            color: #f78841;
            font-size: 22px;
            line-height: 1;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .watermark-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Right Character Placeholder -->
    <div class="placeholder sticker-top-right">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- Girl with pencil illustration representation -->
            <path d="M20,60 C20,30 80,30 80,60" fill="#f7cfb8" />
            <circle cx="50" cy="45" r="30" fill="#fbe0cb"/>
            <path d="M25,35 C20,10 40,5 45,20 C55,5 80,10 75,35" fill="#ba7c59"/>
            <!-- Bear ears -->
            <circle cx="30" cy="18" r="8" fill="#ba7c59"/>
            <circle cx="70" cy="18" r="8" fill="#ba7c59"/>
            <!-- Pencil -->
            <path d="M65,70 L85,25 L75,20 L55,65 Z" fill="#fcd25c" stroke="#533329" stroke-width="2"/>
            <polygon points="55,65 52,73 60,70" fill="#f8a287"/>
        </svg>
    </div>

    <!-- Middle Right Cloud Placeholder -->
    <div class="placeholder sticker-middle-right">
        <svg viewBox="0 0 120 100" width="100%" height="100%">
            <!-- Cloud body -->
            <path d="M30,65 C15,65 10,45 25,35 C25,20 45,15 55,25 C65,15 85,20 85,35 C100,45 95,65 80,65 Z" fill="#ffffff" stroke="#c0d2df" stroke-width="3"/>
            <!-- Face -->
            <circle cx="43" cy="42" r="3" fill="#2d6ea6"/>
            <circle cx="67" cy="42" r="3" fill="#2d6ea6"/>
            <ellipse cx="55" cy="44" rx="4" ry="5" fill="#f58071"/>
            <ellipse cx="37" cy="48" rx="4" ry="2.5" fill="#ffb4a2"/>
            <ellipse cx="73" cy="48" rx="4" ry="2.5" fill="#ffb4a2"/>
            <!-- Yellow Flower -->
            <circle cx="28" cy="62" r="7" fill="#f5b335"/>
            <circle cx="24" cy="58" r="5" fill="#f09e2b"/>
            <path d="M30,67 Q32,78 37,80" stroke="#71864e" stroke-width="4" fill="none" stroke-linecap="round"/>
            <ellipse cx="40" cy="74" rx="5" ry="3" fill="#71864e"/>
        </svg>
    </div>

    <!-- Bottom Right Monster Placeholder -->
    <div class="placeholder sticker-bottom-right">
        <svg viewBox="0 0 130 110" width="100%" height="100%">
            <!-- Fluffy white character peeking -->
            <path d="M15,110 C15,60 115,60 115,110 Z" fill="#ffffff" stroke="#c0d2df" stroke-width="3"/>
            <!-- Horns / ears -->
            <path d="M32,60 C25,48 30,40 38,48" stroke="#8b6544" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M98,60 C105,48 100,40 92,48" stroke="#8b6544" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Face -->
            <circle cx="55" cy="78" r="3" fill="#2d6ea6"/>
            <circle cx="75" cy="78" r="3" fill="#2d6ea6"/>
            <ellipse cx="65" cy="83" rx="4" ry="3" fill="#f58071"/>
            <ellipse cx="48" cy="84" rx="4" ry="2" fill="#ffb4a2"/>
            <ellipse cx="82" cy="84" rx="4" ry="2" fill="#ffb4a2"/>
        </svg>
    </div>

    <!-- Title Header -->
    <div class="header">
        <span class="title-badge">高频考点汇总</span>
    </div>

    <!-- Content Sections -->
    <div class="section-title">(五)设计选项卡考点</div>
    <div class="item-text">1.设计—设置背景格式</div>
    <div class="item-text">2.设计幻灯片主题，调整主题字体</div>
    <div class="item-text">和主题颜色</div>

    <div class="section-title" style="margin-top: 18px;">(六)切换考点</div>
    <div class="item-text">1.基础考点</div>
    <div class="item-text">2.设置幻灯片自动放映：切换—</div>
    <div class="item-text">勾选【设置自动换片时间】</div>
    <div class="item-text">—设置时间—点击应用到全部</div>

    <div class="section-title" style="margin-top: 18px;">
        <span>(七)动画考点</span>
        <span class="stars">★★★★★</span>
    </div>
    <div class="item-text">1.常规考点，动画效果，设置多个动画，</div>
    <div class="item-text">利用【动画窗格】选择调整动画顺序</div>
    <div class="item-text">2.设置动画计时</div>

    <div class="section-title" style="margin-top: 18px;">(八)视图选项卡考点</div>
    <div class="item-text">1.颜色，灰度，黑白模式的调整</div>

    <div class="section-title" style="margin-top: 18px;">(九)幻灯片放映</div>
    <div class="item-text">设置幻灯片放映等</div>

    <!-- Bottom watermark info -->
    <div class="watermark">
        <span class="watermark-dot"></span>
        <span>From 小红书</span>
    </div>
</div>

</body>
</html>
