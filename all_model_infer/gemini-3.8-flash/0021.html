<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOW TO MAKE PROGRESS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 50px 40px 40px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        .header {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 110px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .list-item {
            display: flex;
            align-items: center;
            font-size: 1.25rem;
            line-height: 1.2;
        }

        .number {
            font-weight: 800;
            width: 70px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .text {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 110px;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            HOW TO MAKE PROGRESS
        </div>

        <div class="list">
            <div class="list-item">
                <span class="number">01</span>
                <span class="text">设定明确的目标</span>
            </div>
            <div class="list-item">
                <span class="number">02</span>
                <span class="text">学习新知识</span>
            </div>
            <div class="list-item">
                <span class="number">03</span>
                <span class="text">发展技能</span>
            </div>
            <div class="list-item">
                <span class="number">04</span>
                <span class="text">持续反思和改进</span>
            </div>
            <div class="list-item">
                <span class="number">05</span>
                <span class="text">与优秀的人合作</span>
            </div>
            <div class="list-item">
                <span class="number">06</span>
                <span class="text">克服困难</span>
            </div>
            <div class="list-item">
                <span class="number">07</span>
                <span class="text">坚持努力</span>
            </div>
            <div class="list-item">
                <span class="number">08</span>
                <span class="text">接受反馈</span>
            </div>
            <div class="list-item">
                <span class="number">09</span>
                <span class="text">健康生活方式</span>
            </div>
            <div class="list-item">
                <span class="number">10</span>
                <span class="text">保持积极心态</span>
            </div>
        </div>

        <div class="footer">
            @ THE LAB C
        </div>
    </div>
</body>
</html>
