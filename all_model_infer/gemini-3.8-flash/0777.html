<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫言手书信札</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #d8d8d8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "Xingkai SC", "STKaiti", "KaiTi", "SimSun", cursive, serif;
  }

  .page-container {
    position: relative;
    width: 820px;
    height: 600px;
    background-color: #f7f6f2;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    display: flex;
  }

  /* Center page fold / shadow */
  .page-fold {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 370px;
    width: 25px;
    background: linear-gradient(to right, rgba(0,0,0,0.06), rgba(0,0,0,0.18) 45%, rgba(0,0,0,0.02) 80%, transparent);
    z-index: 5;
    pointer-events: none;
  }

  /* Floating "第三页" badge */
  .badge-header {
    position: absolute;
    top: 25px;
    left: 48px;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #fffb8f;
    -webkit-text-stroke: 1.5px #111;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
    z-index: 10;
    user-select: none;
  }

  /* Manuscript Grid Area */
  .grid-paper {
    position: absolute;
    top: 50px;
    left: 25px;
    right: 35px;
    bottom: 45px;
    display: grid;
    grid-template-columns: repeat(16, 42px);
    direction: rtl; /* Right-to-left layout for columns */
    justify-content: end;
  }

  .grid-column {
    border-left: 1px solid #9fb4cb;
    border-right: 1px solid #9fb4cb;
    margin: 0 3px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .grid-cell {
    width: 100%;
    height: 38px;
    border-bottom: 1px solid #9fb4cb;
    position: relative;
  }

  .grid-column .grid-cell:first-child {
    border-top: 1px solid #9fb4cb;
  }

  /* Handwritten Text Layer */
  .text-layer {
    position: absolute;
    top: 50px;
    left: 25px;
    right: 35px;
    bottom: 45px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 27px;
    line-height: 48px;
    color: #1a1a1a;
    letter-spacing: 4px;
    z-index: 8;
  }

  .line {
    display: inline-block;
    vertical-align: top;
    margin-left: 2px;
  }

  .col-1 { margin-right: 35px; }
  .col-5 { margin-bottom: 20px; }
  
  .col-10 {
    margin-top: 100px;
  }

  .col-11 {
    margin-top: 180px;
  }

  .col-12 {
    margin-top: 200px;
  }

  /* Signature & Seal */
  .signature-block {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
  }

  .seal {
    width: 38px;
    height: 38px;
    margin-top: 10px;
    border: 2px solid #b82d28;
    border-radius: 4px;
    color: #b82d28;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 13px;
    line-height: 1.1;
    font-family: "SimSun", "STSong", serif;
    font-weight: bold;
    background-color: rgba(184, 45, 40, 0.08);
    box-shadow: inset 0 0 2px rgba(184, 45, 40, 0.5);
    transform: rotate(-1deg);
  }
</style>
</head>
