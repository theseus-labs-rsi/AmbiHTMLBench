<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对比色配色</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f7f7f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .container {
    width: 480px;
    background-color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    position: relative;
    padding-bottom: 24px;
    overflow: hidden;
  }

  /* Header Section */
  .header {
    background-color: #e85800;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    padding: 16px 20px 14px 20px;
    position: relative;
    color: #000;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .copyright-icon {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 22px;
    height: 22px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    line-height: 1;
  }
  .header-year {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .header-main {
    display: flex;
    align-items: center;
    margin-top: 6px;
  }
  .diamonds {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-right: 14px;
    margin-left: 2px;
  }
  .diamond {
    width: 7px;
    height: 7px;
    background-color: #ffffff;
    transform: rotate(45deg);
  }
  .header-title {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .header-stamp {
    position: absolute;
    right: 20px;
    bottom: 8px;
    font-size: 20px;
    font-weight: bold;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  }

  /* Content Section */
  .intro-text {
    padding: 16px 24px 20px 24px;
    font-size: 11.5px;
    line-height: 1.5;
    color: #222222;
    text-align: justify;
  }

  /* Card Styles */
  .card-container {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .card {
    border: 2px solid #e85800;
    border-radius: 14px;
    padding: 14px 16px 14px 16px;
    background: #ffffff;
    box-shadow: 0 4px 12px rgba(232, 88, 0, 0.08);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 800;
    color: #111111;
  }
  .card-icon {
    width: 7px;
    height: 7px;
    background-color: #e85800;
    transform: rotate(45deg);
    display: inline-block;
  }
  .color-palette-box {
    width: 100%;
    height: 112px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .color-palette-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .card-desc {
    font-size: 10.5px;
    color: #9e8e7c;
    line-height: 1.45;
    text-align: justify;
  }

  /* Bottom Bar */
  .footer-bar {
    margin-top: 24px;
    height: 8px;
    background-color: #e85800;
    width: 100%;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="copyright-icon">&copy;</div>
      <div class="header-year">2023</div>
    </div>
    <div class="header-main">
      <div class="diamonds">
        <span class="diamond"></span>
        <span class="diamond"></span>
        <span class="diamond"></span>
        <span class="diamond"></span>
        <span class="diamond"></span>
      </div>
      <h1 class="header-title">对比色配色</h1>
    </div>
    <div class="header-stamp">瑞</div>
  </div>

  <!-- Intro -->
  <p class="intro-text">
    对比色配色是有意识的使用相反色以及明暗对比进行色彩搭配的方法。因为色相和色调都使用对比强烈的色彩，所以配色清晰而有力。
  </p>

  <!-- Cards -->
  <div class="card-container">
    <!-- Card 1 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">富有朝气的配色</span>
        <span class="card-icon"></span>
      </div>
      <div class="color-palette-box">
        <svg viewBox="0 0 400 120" preserveAspectRatio="none">
          <!-- Yellow Base -->
          <rect width="400" height="120" fill="#ffeb00" />
          <!-- Green Shape (Left) -->
          <path d="M 0,0 L 105,0 C 95,20 120,40 135,50 C 150,60 125,90 100,105 C 80,115 50,118 0,120 Z" fill="#009c48" />
          <path d="M 0,0 L 105,0 C 100,10 135,15 140,30 C 145,50 110,65 95,80 C 80,95 120,105 180,120 L 0,120 Z" fill="#009c48" />
          <!-- Blue Shape (Right) -->
          <path d="M 400,0 L 200,0 C 215,10 240,15 280,15 C 320,15 320,35 270,42 C 240,46 250,75 285,80 C 310,83 255,105 245,120 L 400,120 Z" fill="#0062b0" />
        </svg>
      </div>
      <p class="card-desc">
        以明亮色调的黄色为中心在与鲜艳色调的绿色和蓝紫色进行组合，给人未来充满希望的感觉。
      </p>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">视觉冲击强烈的配色</span>
        <span class="card-icon"></span>
      </div>
      <div class="color-palette-box">
        <svg viewBox="0 0 400 120" preserveAspectRatio="none">
          <!-- Lime Green Base / Left -->
          <rect width="400" height="120" fill="#8dc21f" />
          <!-- Hot Pink Shape (Right) -->
          <path d="M 400,0 L 210,0 C 215,10 230,12 250,15 C 290,20 300,50 350,60 C 380,66 310,95 260,120 L 400,120 Z" fill="#ff1a53" />
          <!-- Black Fluid Flow (Center) -->
          <path d="M 145,0 C 145,15 140,25 115,35 C 90,45 130,65 115,85 C 105,100 140,115 175,120 L 265,120 C 285,115 305,95 280,75 C 255,55 305,45 280,25 C 265,10 235,5 210,0 Z" fill="#000000" />
        </svg>
      </div>
      <p class="card-desc">
        黄绿色相中选择华丽鲜艳的色调，同时在相反色中选择活泼的深红色调在与黑色进行组合，视觉冲击强烈。
      </p>
    </div>
  </div>

  <!-- Footer Bar -->
  <div class="footer-bar"></div>
</div>

</body>
</html>
