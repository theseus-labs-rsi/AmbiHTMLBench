<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIMAGE 双拼高光 & 恋爱魔镜粉霜 测评</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0ebe4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 580px;
      background-color: #f2ede7;
      position: relative;
      padding: 30px 24px 40px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* Top Left Decorative Lamp Base */
    .lamp-placeholder {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 60%, #e0c29f 0%, #caa77e 70%);
      box-shadow: 0 10px 25px rgba(160, 130, 95, 0.3);
      z-index: 1;
    }

    .lamp-shade {
      position: absolute;
      top: -30px;
      left: -20px;
      width: 180px;
      height: 100px;
      background: #ffffff;
      border-bottom: 3px solid #eee;
      transform: rotate(-10deg);
      border-radius: 4px;
      box-shadow: 2px 5px 15px rgba(0, 0, 0, 0.05);
      z-index: 2;
    }

    /* Content Area */
    .content-layer {
      position: relative;
      z-index: 3;
    }

    /* Section 1: TIMAGE */
    .timage-section {
      margin-top: 170px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .timage-title-group {
      width: 32%;
      padding-top: 10px;
    }

    .timage-brand {
      font-size: 19px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.5px;
      color: #111;
      margin-bottom: 4px;
    }

    .timage-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: #222;
      padding-left: 12px;
    }

    .timage-text {
      width: 66%;
      font-size: 13px;
      line-height: 1.75;
      color: #1f1f1f;
      text-align: center;
      word-break: break-word;
    }

    .timage-text p {
      margin-bottom: 2px;
    }

    /* Products Middle Display */
    .products-display {
      position: relative;
      height: 240px;
      margin-top: 15px;
    }

    .swatch-timage {
      position: absolute;
      left: 15px;
      top: 25px;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #e9e1d8;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #8c7e72;
      overflow: hidden;
      text-align: center;
    }

    .compact-timage {
      position: absolute;
      left: 115px;
      top: 15px;
      width: 125px;
      height: 125px;
      border-radius: 28px;
      border: 3px solid #c2dbe6;
      background: #fbf6ec;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #7b6d61;
      text-align: center;
    }

    /* Watermark */
    .watermark {
      position: absolute;
      left: 215px;
      top: 98px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 7px;
      border-radius: 10px;
      backdrop-filter: blur(2px);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Foundation Tube */
    .tube-foundation {
      position: absolute;
      right: 120px;
      top: 85px;
      width: 80px;
      height: 140px;
      background: #fdfaf4;
      border: 2px solid #e2dac9;
      border-radius: 10px 10px 16px 16px;
      transform: rotate(26deg);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #9c8a77;
      text-align: center;
      padding: 6px;
    }

    .swatch-foundation {
      position: absolute;
      right: 25px;
      top: 140px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #ede3dc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #8c7e72;
      overflow: hidden;
      text-align: center;
    }

    /* Section 2: Majolica Majorca */
    .foundation-title-wrap {
      margin-top: 15px;
      margin-left: 25px;
    }

    .foundation-title {
      font-size: 16px;
      font-weight: 800;
      font-style: italic;
      color: #151515;
      letter-spacing: 0.5px;
    }

    .foundation-desc {
      margin-top: 28px;
      font-size: 13.5px;
      line-height: 1.8;
      color: #1f1f1f;
      padding: 0 8px;
    }

    .foundation-desc p {
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Decorative background elements -->
    <div class="lamp-shade"></div>
    <div class="lamp-placeholder"></div>

    <div class="content-layer">
      <!-- Top Text Block -->
      <div class="timage-section">
        <div class="timage-title-group">
          <div class="timage-brand">TIMAGE</div>
          <div class="timage-subtitle">| 双拼高光</div>
        </div>
        <div class="timage-text">
          <p>基本每天都在用，挺实用的粉<strong>+</strong>膏的双拼组合</p>
          <p>两个质地都轻薄又细腻，不用担心妆感重</p>
          <p>高光膏是奶油质地，滋润服帖，提亮泪沟或者面中</p>
          <p>高光粉可以提亮鼻梁 鼻头等，妈生立体感</p>
          <p>清透粉感不重，一个神仙单品</p>
        </div>
      </div>

      <!-- Mid Visual Elements Layer -->
      <div class="products-display">
        <!-- TIMAGE Swatch -->
        <div class="swatch-timage">
          [高光试色]
        </div>

        <!-- TIMAGE Compact Box -->
        <div class="compact-timage">
          [TIMAGE 双拼高光盘]
        </div>

        <!-- Watermark -->
        <div class="watermark">
          <span>@狄小姐</span> | <span>小红书</span>
        </div>

        <!-- Foundation Tube -->
        <div class="tube-foundation">
          <div style="font-size: 8px; font-weight: bold; margin-bottom: 2px;">Milky<br>Wrapping<br>Foundation</div>
          <div>[恋爱魔镜粉霜]</div>
        </div>

        <!-- Foundation Swatch -->
        <div class="swatch-foundation">
          [粉霜试色]
        </div>
      </div>

      <!-- Bottom Title -->
      <div class="foundation-title-wrap">
        <div class="foundation-title">恋爱魔镜粉霜</div>
      </div>

      <!-- Bottom Description -->
      <div class="foundation-desc">
        <p>坠白的00我都觉得不白，唯一的缺点了，希望出个白一点的色号呀！</p>
        <p>可以用提亮粉饼来拯救，我用的e大饼~自然细腻的奶油肌妆感</p>
        <p>给人天生好底子的感觉，妆效挺自然的，百元粉霜里的三好学生</p>
      </div>
    </div>
  </div>

</body>
</html>
