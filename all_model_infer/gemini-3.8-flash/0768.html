<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 爱的分类 - 模型</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #2b2b2b;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .container {
    width: 600px;
    background-color: #d8d8d8;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    overflow: hidden;
    position: relative;
  }

  /* Header Section */
  .header {
    background-color: #383838;
    color: #fff;
    padding: 12px 18px 16px;
    position: relative;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed #666;
    padding-bottom: 8px;
  }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .avatar-box {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #e6c280;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #d4a359;
  }
  .avatar-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #4a4a4a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-tag {
    position: absolute;
    left: -4px;
    top: 2px;
    background: #c88a35;
    color: #fff;
    font-size: 8px;
    padding: 1px 3px;
    border-radius: 3px;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .title-group {
    display: flex;
    flex-direction: column;
  }
  .main-channel {
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .highlight-orange {
    color: #f39800;
  }
  .sub-channel {
    font-size: 9px;
    color: #bbb;
    letter-spacing: 0.5px;
    transform: scale(0.9);
    transform-origin: left;
  }
  .rating-group {
    font-size: 9px;
    line-height: 1.35;
    color: #fff;
  }
  .rating-item {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .stars {
    color: #f39800;
  }

  /* Title Row */
  .title-area {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 20px;
    margin: 12px 0 6px;
  }
  .number-tag {
    font-size: 42px;
    font-weight: 900;
    color: #5599c8;
    font-family: Arial, Helvetica, sans-serif;
  }
  .big-title {
    font-size: 44px;
    font-weight: 900;
    color: #5599c8;
    letter-spacing: 3px;
  }

  /* Subtitle Quote */
  .quote {
    text-align: center;
    font-size: 13px;
    color: #ffffff;
    font-weight: 500;
    margin-top: 2px;
  }

  /* Tab Header */
  .model-tab-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: -12px;
    z-index: 10;
  }
  .model-tab {
    background-color: #2b2b2b;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 34px;
    border-radius: 1px;
    letter-spacing: 2px;
  }

  /* Grid Area */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 22px 10px;
    padding: 24px 16px 28px;
    background-color: #d8d8d8;
  }

  .grid-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .icon-wrapper {
    width: 70px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .item-label {
    font-size: 12px;
    font-weight: 700;
    color: #333333;
    margin-top: 8px;
    white-space: nowrap;
  }

  /* SVG Icons Inline */
  svg {
    overflow: visible;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="top-bar">
      <div class="user-badge">
        <div class="avatar-box">

            <circle cx="12" cy="8" r="4" />
            <path d="M12 14c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z" />
          </svg>
        </div>
        <div class="title-group">
          <div class="main-channel">打造<span class="highlight-orange">超级学习个体</span> 
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f39800" stroke-width="2.5"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/></svg>
          </div>
          <div class="sub-channel">- To build Super charged individual -</div>
        </div>
      </div>
      <div class="rating-group">
        <div class="rating-item"><span>学习难易</span><span class="stars">★★★</span></div>
        <div class="rating-item"><span>理解难易</span><span class="stars">★★★</span></div>
        <div class="rating-item"><span>应用难易</span><span class="stars">★★★</span></div>
      </div>
    </div>

    <!-- Title -->
    <div class="title-area">
      <span class="number-tag">25</span>
      <span class="big-title">爱的分类</span>
    </div>

    <!-- Quote -->
    <div class="quote">为爱而爱，是神；为被爱而爱，是人。拜伦</div>
  </div>

  <!-- Center Tab -->
  <div class="model-tab-wrapper">
    <div class="model-tab">模型</div>
  </div>

  <!-- Grid of 24 Love Models -->
  <div class="grid-container">

    <!-- Row 1 -->
    <!-- 1 -->
