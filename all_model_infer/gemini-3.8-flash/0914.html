<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目录 - Building Thinking Classrooms</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimHei", sans-serif;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .page-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 60px 45px 80px 45px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    /* Header Section */
    .header {
      margin-bottom: 50px;
      position: relative;
    }

    .main-title {
      font-family: "Songti SC", "SimSun", "STSong", serif;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 14px;
      text-indent: 14px;
      text-align: center;
      margin-bottom: 5px;
      color: #1a1a1a;
    }

    .subtitle-wrapper {
      position: relative;
      margin-left: 20px;
      height: 48px;
    }

    .initial-b {
      position: absolute;
      left: 0;
      top: -24px;
      font-family: "Georgia", "Bickham Script Pro", "Brush Script MT", "Times New Roman", cursive, serif;
      font-size: 56px;
      font-weight: bold;
      font-style: italic;
      color: #1a1a1a;
      line-height: 1;
    }

    .header-line {
      position: absolute;
      left: 45px;
      right: 100px;
      top: 10px;
      height: 1px;
      background-color: #8c8c8c;
    }

    .english-title {
      position: absolute;
      left: 48px;
      top: 14px;
      font-family: "Brush Script MT", "Bickham Script Pro", "Segoe Script", cursive, serif;
      font-size: 19px;
      color: #2b2b2b;
      letter-spacing: 0.5px;
    }

    /* TOC List */
    .toc-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .toc-item {
      display: flex;
      align-items: center;
      position: relative;
      height: 64px;
    }

    /* Gray Background Banner */
    .toc-banner {
      position: absolute;
      left: 24px;
      right: 0;
      top: 0;
      bottom: 0;
      background-color: #d6d9d8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 48px;
      padding-right: 32px;
    }

    /* Circular Icon Badge */
    .icon-badge {
      position: absolute;
      left: 0;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: #e2e4e3;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 1px #d6d9d8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .icon-badge svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: #333333;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Content Styling */
    .content-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      z-index: 1;
    }

    .chapter-title {
      font-size: 15px;
      font-weight: 700;
      color: #222222;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
    }

    .chapter-title .divider {
      margin: 0 6px;
      font-weight: 400;
      color: #555555;
    }

    .chapter-subtitle {
      font-size: 14px;
      color: #333333;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .page-number {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: #2b2b2b;
      letter-spacing: 0.5px;
      z-index: 1;
    }
  </style>
</head>
