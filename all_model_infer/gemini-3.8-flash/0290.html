<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anything's Possible - Movie Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #e5e5e5;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Poster Outer Frame */
  .poster-frame {
    width: 512px;
    height: 760px;
    background-color: #f6d8df;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
  }

  /* Poster Inner Content Area */
  .poster-content {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* Prime Video Header */
  .header {
    width: 100%;
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  .prime-video-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #000;
  }

  .prime-video-text {
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -1.2px;
    line-height: 1;
    font-family: 'Arial Rounded MT Bold', 'Montserrat', sans-serif;
  }

  .prime-smile {
    width: 110px;
    height: 18px;
    margin-top: 4px;
  }

  /* Subtitles under header */
  .director-tagline {
    margin-top: 14px;
    text-align: center;
  }

  .director-title {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #172458;
    text-transform: uppercase;
  }

  .director-name {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2.2px;
    color: #162463;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .quote-tagline {
    margin-top: 8px;
    font-size: 9.5px;
    line-height: 1.35;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-align: center;
    color: #b5517e;
    text-transform: uppercase;
  }

  /* Characters Placeholder Representation */
  .visual-area {
    position: absolute;
    top: 120px;
    bottom: 120px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  .placeholder-graphic {
    width: 90%;
    height: 100%;
    background: radial-gradient(circle at 40% 45%, rgba(255, 235, 240, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #a3959c;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px dashed rgba(200, 160, 180, 0.4);
    border-radius: 8px;
  }

  /* Title Block */
  .title-wrapper {
    position: absolute;
    bottom: 92px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: baseline;
    z-index: 10;
    white-space: nowrap;
  }

  .title-anythings {
    font-family: 'Dancing Script', cursive;
    font-size: 68px;
    font-weight: 700;
    color: #1b2664;
    transform: rotate(-6deg);
    margin-right: -14px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    display: inline-block;
  }

  .title-possible {
    font-family: 'Montserrat', sans-serif;
    font-size: 47px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #d12274;
    display: inline-block;
  }

  /* Credits */
  .credits-block {
    position: absolute;
    bottom: 66px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .credit-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #162463;
  }

  .credit-role {
    font-size: 6px;
    font-weight: 700;
    line-height: 1.1;
    text-align: right;
    color: #55628a;
  }

  /* Bottom Release & Studio Info */
  .bottom-bar {
    position: absolute;
    bottom: 14px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    padding: 0 6px;
  }

  .logos-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .orion-logo {
    font-family: 'Open Sans', sans-serif;
    font-weight: 800;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #5d6b8b;
    border-bottom: 1px solid #5d6b8b;
    padding-bottom: 1px;
  }

  .ua-logo {
    font-weight: 900;
    font-size: 11px;
    color: #7b88aa;
    letter-spacing: -0.5px;
  }

  .release-date {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #0b112c;
  }

  .divider {
    width: 1.5px;
    height: 22px;
    background-color: #0b112c;
  }

  .logos-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rating-badge {
    border: 1px solid #a0a6b8;
    padding: 1px 3px;
    font-size: 5px;
    font-weight: 700;
    color: #5d6b8b;
    text-align: center;
    line-height: 1.1;
    letter-spacing: 0.5px;
  }

  .amazon-studios {
    font-size: 6px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #4b587a;
    line-height: 1.1;
    text-align: center;
  }
</style>
</head>
<body>

<div class="poster-frame">
  <div class="poster-content">
    
    <!-- Top Brand Header -->
    <div class="header">
      <div class="prime-video-logo">
        <span class="prime-video-text">prime video</span>
        <!-- Prime Video Smile Curve -->
        <svg class="prime-smile" viewBox="0 0 112 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4C28 17 84 17 106 5" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M100 2L108 5.5L103 12" fill="#000"/>
        </svg>
      </div>

      <div class="director-tagline">
        <div class="director-title">From the Heart &amp; Soul of Director</div>
        <div class="director-name">Billy Porter</div>
      </div>

      <div class="quote-tagline">
        When It<br>
        Comes<br>
        To Love...
      </div>
    </div>

    <!-- Central Key Art Area -->
    <div class="visual-area">
      <div class="placeholder placeholder-graphic">
        [Photo: Eva Reign as Kelsa &amp; Abubakr Ali as Oliver]
      </div>
    </div>

    <!-- Title Treatment -->
    <div class="title-wrapper">
      <span class="title-anythings">anything's</span>
      <span class="title-possible">possible</span>
    </div>

    <!-- Credits -->
    <div class="credits-block">
      <div class="credit-item">
        <span class="credit-role">WRITTEN<br>BY</span>
        <span>XIMENA GARC&Iacute;A LECUONA</span>
      </div>
      <div class="credit-item">
        <span class="credit-role">DIRECTED<br>BY</span>
        <span>BILLY PORTER</span>
      </div>
    </div>

    <!-- Bottom Metadata Bar -->
    <div class="bottom-bar">
      <div class="logos-left">
        <span class="orion-logo">ORION</span>
        <span class="ua-logo">U|A</span>
      </div>

      <div class="release-date">
        <span>JULY 22</span>
        <div class="divider"></div>
        <span>NEW MOVIE</span>
      </div>

      <div class="logos-right">
        <div class="rating-badge">
          PG-13
        </div>
        <div class="amazon-studios">
          AMAZON<br>STUDIOS
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
