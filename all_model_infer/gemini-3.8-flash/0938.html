<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takumi Sen9 vs Streakfly</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .comparison-card {
            width: 100%;
            max-width: 540px;
            background: linear-gradient(to right, #ffffff 50%, #000000 50%);
            position: relative;
            padding: 24px 0 40px 0;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Top Header */
        .top-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            white-space: nowrap;
        }

        .channel-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.2;
            background: linear-gradient(to right, #000 50%, #fff 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .channel-sub {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #000 50%, #fff 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Logos Header Row */
        .brands-row {
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            margin-top: 6px;
            height: 48px;
            align-items: center;
        }

        .brand-logo-left svg {
            width: 52px;
            height: 36px;
            fill: #000;
        }

        .brand-logo-right svg {
            width: 56px;
            height: 24px;
            fill: #fff;
        }

        /* VS Graphic */
        .vs-badge {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: 900;
            font-style: italic;
            font-family: Impact, sans-serif;
            color: #2b2b2b;
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff,
                 2px 3px 6px rgba(0,0,0,0.6);
            z-index: 5;
            user-select: none;
        }

        /* Product Showcase */
        .shoes-row {
            display: flex;
            width: 100%;
            margin-top: 14px;
            margin-bottom: 24px;
        }

        .shoe-col {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
        }

        .placeholder-shoe {
            width: 100%;
            height: 125px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
        }

        .left-shoe {
            color: #444;
        }

        .right-shoe {
            color: #bbb;
        }

        .shoe-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Category Header (5-10KM) */
        .category-header {
            text-align: center;
            font-size: 19px;
            font-weight: 900;
            margin-bottom: 24px;
            background: linear-gradient(to right, #000 50%, #fff 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Comparison Specs Table/List */
        .specs-table {
            display: flex;
            flex-direction: column;
            gap: 18px;
            font-size: 16px;
            font-weight: 800;
        }

        .spec-row {
            display: flex;
            width: 100%;
            line-height: 1.2;
        }

        .spec-left {
            flex: 1;
            text-align: right;
            padding-right: 18px;
            color: #000;
            white-space: nowrap;
        }

        .spec-right {
            flex: 1;
            text-align: left;
            padding-left: 18px;
            color: #fff;
            white-space: nowrap;
        }

        .model-name {
            font-size: 17px;
            font-weight: 900;
        }

        .price {
            font-size: 18px;
            font-weight: 900;
        }
    </style>
</head>
<body>

<div class="comparison-card">
    <!-- Center Top Account Header -->
    <div class="top-header">
        <div class="channel-title">奔跑的小小宇</div>
        <div class="channel-sub">RUNNING XIAOYU</div>
    </div>

    <!-- Brands Logo Row -->
    <div class="brands-row">
        <div class="brand-logo-left">
            <!-- Adidas 3-Bars Logo -->
            <svg viewBox="0 0 54 36">
                <path d="M0 29.5 L10.5 29.5 L6.8 19.5 L0 29.5 Z" />
                <path d="M12.5 29.5 L23 29.5 L14.5 9 L4 23.5 L12.5 29.5 Z" />
                <path d="M25 29.5 L35.5 29.5 L22.5 0 L12 14.5 L25 29.5 Z" />
            </svg>
        </div>
        <div class="brand-logo-right">
            <!-- Nike Swoosh -->
            <svg viewBox="0 0 100 40">
                <path d="M96.5 4.8 C78.2 16.3 51.5 33.6 35.8 33.6 C23.5 33.6 15.6 27.2 15.6 17.6 C15.6 10.3 20.8 3.5 29.8 0.5 C24.1 2.3 8.2 8.7 8.2 22.4 C8.2 34.3 20.3 40 34.5 40 C57.3 40 85.5 17.5 96.5 4.8 Z" />
            </svg>
        </div>
    </div>

    <!-- Central VS element -->
    <div class="vs-badge">VS</div>

    <!-- Shoes Images / Placeholders -->
    <div class="shoes-row">
        <div class="shoe-col">
            <figure class="placeholder placeholder-shoe left-shoe">
                <svg viewBox="0 0 200 90" width="100%" height="90">
                    <!-- Stylized Adidas Takumi Sen 9 profile -->
                    <path d="M15,62 C30,62 45,67 75,67 C115,67 150,65 175,55 C185,50 190,44 185,46 C165,58 135,58 75,58 C45,58 25,52 15,62 Z" fill="#eee"/>
                    <path d="M20,58 C40,58 60,63 90,63 C140,63 175,54 182,46 C160,32 140,32 120,38 C90,44 70,30 50,33 C35,36 20,45 20,58 Z" fill="#8ca5b5" opacity="0.6"/>
                    <path d="M60,40 L70,57 M80,38 L90,57 M100,37 L110,57" stroke="#bcee00" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </figure>
        </div>
        <div class="shoe-col">
            <figure class="placeholder placeholder-shoe right-shoe">
                <svg viewBox="0 0 200 90" width="100%" height="90">
                    <!-- Stylized Nike Streakfly profile -->
                    <path d="M185,60 C170,60 155,67 125,67 C85,67 50,65 25,55 C15,50 10,44 15,46 C35,58 65,58 125,58 C155,58 175,52 185,60 Z" fill="#eee"/>
                    <path d="M180,58 C160,58 140,63 110,63 C60,63 25,54 18,46 C40,32 60,32 80,38 C110,44 130,30 150,33 C165,36 180,45 180,58 Z" fill="#ffffff"/>
                    <!-- Swoosh -->
                    <path d="M160,40 C140,43 125,48 115,55 C130,52 145,46 160,40 Z" fill="#000"/>
                </svg>
            </figure>
        </div>
    </div>

    <!-- Category Header -->
    <div class="category-header">5-10KM</div>

    <!-- Comparison Details Table -->
    <div class="specs-table">
        <div class="spec-row">
            <div class="spec-left model-name">Takumi Sen9</div>
            <div class="spec-right model-name">Streakfly</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">181g</div>
            <div class="spec-right">165g</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">(27/33) &nbsp;6mm</div>
            <div class="spec-right">8mm &nbsp;(26/32)</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">LIGHTWEIGHT MESH</div>
            <div class="spec-right">织物鞋面</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">Lightstrike Pro</div>
            <div class="spec-right">ZoomX</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">ENERGYROD玻纤柱</div>
            <div class="spec-right">半掌碳板</div>
        </div>

        <div class="spec-row">
            <div class="spec-left">Continental™</div>
            <div class="spec-right">贴片橡胶</div>
        </div>

        <div class="spec-row">
            <div class="spec-left price">1499</div>
            <div class="spec-right price">999</div>
        </div>
    </div>
</div>

</body>
</html>
