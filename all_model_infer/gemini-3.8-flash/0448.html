<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际博物馆日 - International Museum Day</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "SimSun", "STSong", "Songti SC", "Noto Serif SC", serif;
            color: #2b332f;
        }

        .poster {
            width: 500px;
            height: 700px;
            background-color: #dfdbd2;
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(255,255,255,0.4) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(200,195,185,0.5) 0%, transparent 50%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px 25px;
        }

        /* Decorative cloud-like patterns in background */
        .poster::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 85% 12%, rgba(215, 210, 200, 0.8) 0%, rgba(215, 210, 200, 0) 40%),
                radial-gradient(ellipse at 10% 50%, rgba(215, 210, 200, 0.6) 0%, rgba(215, 210, 200, 0) 35%),
                radial-gradient(ellipse at 90% 70%, rgba(215, 210, 200, 0.6) 0%, rgba(215, 210, 200, 0) 40%);
            pointer-events: none;
            z-index: 1;
        }

        /* Header area */
        .header {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: flex-start;
        }

        .main-title-wrap {
            display: flex;
            flex-direction: column;
        }

        .title-row-1 {
            display: flex;
            align-items: center;
        }

        .main-title {
            font-size: 52px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: 2px;
            color: #10342e;
            font-family: "SimSun", "STSong", "Songti SC", serif;
        }

        .en-title-wrap {
            margin-left: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .en-title {
            font-family: "Georgia", serif;
            font-size: 14px;
            line-height: 1.15;
            color: #222;
        }

        .stamp-red {
            border: 2px solid #b92b27;
            background-color: #b92b27;
            color: #dfdbd2;
            font-size: 11px;
            line-height: 1.1;
            padding: 2px 3px;
            font-weight: bold;
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
            border-radius: 3px;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.2);
            letter-spacing: 0;
            transform: scale(0.9);
        }

        /* Top Right Badge */
        .top-right-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 3;
            border: 1px solid #737373;
            padding: 4px 3px;
            display: flex;
            flex-direction: row-reverse;
            gap: 4px;
            background: rgba(223, 219, 210, 0.5);
        }

        .badge-col {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 13px;
            letter-spacing: 3px;
            color: #333;
            font-weight: 500;
        }

        /* Right Intro Text (Vertical) */
        .right-text-vertical {
            position: absolute;
            top: 160px;
            right: 22px;
            writing-mode: vertical-rl;
            font-size: 8.5px;
            line-height: 1.6;
            letter-spacing: 1.5px;
            color: #4a4a4a;
            z-index: 3;
            height: 230px;
            text-align: justify;
        }

        /* Left Side Info Area */
        .left-col {
            position: absolute;
            left: 25px;
            top: 195px;
            width: 80px;
            z-index: 3;
            display: flex;
            flex-direction: column;
        }

        .date-section {
            position: relative;
            padding-left: 12px;
        }

        .date-section::before {
            content: "•";
            position: absolute;
            left: -2px;
            top: -2px;
            font-size: 16px;
            color: #333;
        }

        .time-label {
            font-size: 16px;
            font-weight: bold;
            color: #1a1a1a;
            line-height: 1.2;
        }

        .year {
            font-size: 15px;
            font-family: Arial, sans-serif;
            color: #333;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        .day-slash {
            display: flex;
            align-items: baseline;
            font-family: Arial, sans-serif;
            margin-top: -2px;
            margin-bottom: 15px;
        }

        .day-5 {
            font-size: 30px;
            line-height: 1;
            font-weight: 400;
            color: #222;
        }

        .day-div {
            font-size: 20px;
            margin: 0 1px;
            color: #555;
            transform: translateY(-2px);
        }

        .day-18 {
            font-size: 16px;
            line-height: 1;
            font-weight: 400;
            color: #222;
            transform: translateY(2px);
        }

        .couplet-text {
            display: flex;
            gap: 8px;
            margin-left: 20px;
            margin-bottom: 20px;
        }

        .couplet-col {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 11px;
            letter-spacing: 5px;
            color: #333;
        }

        .timeline-line {
            position: relative;
            height: 110px;
            width: 1px;
            background-color: #7d7d7d;
            margin-left: 3px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timeline-line::after {
            content: "•";
            position: absolute;
            bottom: -8px;
            left: -3px;
            font-size: 14px;
            color: #333;
        }

        .vessel-thumb {
            width: 38px;
            height: 60px;
            background: radial-gradient(circle, #2d453e 0%, #172420 100%);
            border-radius: 4px;
            margin-top: 15px;
            margin-left: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a4b3ad;
            font-size: 7px;
            text-align: center;
            padding: 2px;
            border: 1px solid #1a2c27;
        }

        /* Central Artifact Visual Placeholder */
        .artifact-container {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -46%);
            width: 270px;
            height: 470px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .artifact-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: 
                radial-gradient(ellipse at center, rgba(38, 70, 61, 0.95) 0%, rgba(18, 38, 33, 0.98) 70%, rgba(10, 24, 20, 1) 100%);
            clip-path: polygon(
                25% 0%, 75% 0%, 
                80% 6%, 70% 6%, 70% 12%,
                90% 18%, 100% 28%, 85% 35%,
                85% 42%, 95% 58%, 100% 75%, 
                88% 90%, 92% 96%, 8% 96%, 12% 90%,
                0% 75%, 5% 58%, 15% 42%, 
                15% 35%, 0% 28%, 10% 18%,
                30% 12%, 30% 6%, 20% 6%
            );
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .artifact-placeholder::before {
            content: "";
            position: absolute;
            width: 70%;
            height: 80%;
            border: 2px solid rgba(111, 158, 142, 0.3);
            border-radius: 50%;
        }

        .artifact-label {
            color: #9cbdb1;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            z-index: 2;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
        }

        /* Bottom texts */
        .bottom-left {
            position: absolute;
            bottom: 30px;
            left: 28px;
            z-index: 3;
            line-height: 1.35;
        }

        .bottom-left .zh-line {
            font-size: 13px;
            color: #2b332f;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .bottom-left .en-line {
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #2b332f;
            letter-spacing: 0.5px;
            margin: 2px 0;
            font-weight: bold;
        }

        .bottom-right {
            position: absolute;
            bottom: 30px;
            right: 28px;
            z-index: 3;
            text-align: left;
            line-height: 1.35;
        }

        .bottom-right .zh-line {
            font-size: 13px;
            color: #2b332f;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .bottom-right .en-line {
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: #2b332f;
            letter-spacing: 0.5px;
            margin: 2px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="poster">
    <!-- Top Right Framed Badge -->
    <div class="top-right-badge">
        <div class="badge-col">穿越千古</div>
        <div class="badge-col">追梦今古</div>
    </div>

    <!-- Header Section -->
    <div class="header">
        <div class="main-title-wrap">
            <div class="title-row-1">
                <div class="main-title">国际</div>
                <div class="en-title-wrap">
                    <div class="en-title">
                        International<br>
                        Museum<br>
                        Day
                    </div>
                    <div class="stamp-red">
                        <span>重</span><span>恢</span>
                        <span>塑</span><span>复</span>
                    </div>
                </div>
            </div>
            <div class="main-title">博物馆日</div>
        </div>
    </div>

    <!-- Right Side Long Description (Vertical) -->
    <div class="right-text-vertical">
        国际博物馆日定于每年的5月18日，是由国际博物馆协会(ICOM)发起并创立的。1977年国际博物馆协会为促进全球博物馆事业的健康发展，吸引全社会公众对博物馆事业的了解、参与和关注，向全世界宣告1977年5月18日为第一个国际博物馆日，并每年为国际博物馆日确定活动主题
    </div>

    <!-- Left Side Meta Info -->
    <div class="left-col">
        <div class="date-section">
            <div class="time-label">时间:</div>
            <div class="year">2021</div>
            <div class="day-slash">
                <span class="day-5">5</span>
                <span class="day-div">/</span>
                <span class="day-18">18</span>
            </div>
        </div>

        <div class="couplet-text">
            <div class="couplet-col">一处文物</div>
            <div class="couplet-col">两处情怀</div>
        </div>

        <div class="timeline-line">
            <div class="vessel-thumb placeholder">
                [文物]
            </div>
        </div>
    </div>

    <!-- Center Artifact (Bronze Vessel) -->
    <div class="artifact-container">
        <div class="artifact-placeholder placeholder">
            <div class="artifact-label">
                [青铜器文物造形]<br>
                Ancient Bronze Vessel
            </div>
        </div>
    </div>

    <!-- Bottom Left -->
    <div class="bottom-left">
        <div class="zh-line">与历史相遇</div>
        <div class="en-line">MING</div>
        <div class="zh-line">明兴亡</div>
    </div>

    <!-- Bottom Right -->
    <div class="bottom-right">
        <div class="zh-line">打开时代</div>
        <div class="en-line">DE</div>
        <div class="zh-line">任意门</div>
    </div>
</div>

</body>
</html>
