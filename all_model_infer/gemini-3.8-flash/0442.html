<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句合集</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #2b2b2d;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            line-height: 1.6;
            padding: 16px 20px;
            max-width: 540px;
            margin: 0 auto;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            margin-bottom: 24px;
        }
        .nav-left {
            display: flex;
            align-items: center;
            color: #d7a12e;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
        }
        .back-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-left: 2.5px solid #d7a12e;
            border-bottom: 2.5px solid #d7a12e;
            transform: rotate(45deg);
            margin-right: 8px;
            margin-left: 2px;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .nav-icon {
            width: 26px;
            height: 26px;
            color: #d7a12e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-icon svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
        }

        /* Content Sections */
        .section {
            margin-bottom: 36px;
        }
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }
        .check-badge {
            width: 22px;
            height: 22px;
            background-color: #e5a93b;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .check-badge svg {
            width: 12px;
            height: 12px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #2c2c2e;
            letter-spacing: 0.5px;
        }
        .section-content {
            font-size: 19px;
            line-height: 1.65;
            color: #3a3a3c;
            text-align: justify;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="nav-left">
            <span class="back-icon"></span>
            <span>金句合集</span>
        </div>
        <div class="nav-right">
            <!-- Collab / Person Icon -->
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" stroke-width="1.8">
                    <circle cx="10" cy="8" r="4"></circle>
                    <path d="M3 19c0-3.3 2.7-6 6-6h2c3.3 0 6 2.7 6 6"></path>
                    <circle cx="17.5" cy="17.5" r="4.5" fill="#ffffff" stroke-width="1.6"></circle>
                    <polyline points="15.5 17.5 17 19 20 16" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline>
                </svg>
            </div>
            <!-- Share Icon -->
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
            </div>
            <!-- More (Three Dots) Icon -->
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" stroke-width="1.8">
                    <circle cx="12" cy="12" r="9" fill="none"></circle>
                    <circle cx="8" cy="12" r="0.9" fill="currentColor"></circle>
                    <circle cx="12" cy="12" r="0.9" fill="currentColor"></circle>
                    <circle cx="16" cy="12" r="0.9" fill="currentColor"></circle>
                </svg>
            </div>
        </div>
    </header>

    <!-- First Block -->
    <article class="section">
        <div class="section-header">
            <span class="check-badge">
                <svg viewBox="0 0 14 14">
                    <polyline points="2.5 7 5.5 10 11.5 3.5"></polyline>
                </svg>
            </span>
            <h2 class="section-title">他写「成长」，正是你所亲历</h2>
        </div>
        <p class="section-content">
            “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”——《病隙碎笔》
        </p>
    </article>

    <!-- Second Block -->
    <article class="section">
        <div class="section-header">
            <span class="check-badge">
                <svg viewBox="0 0 14 14">
                    <polyline points="2.5 7 5.5 10 11.5 3.5"></polyline>
                </svg>
            </span>
            <h2 class="section-title">他写「磨难」，报之以歌</h2>
        </div>
        <p class="section-content">
            “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。”——《好运设计》
        </p>
    </article>

</body>
</html>
