<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五大学科竞赛国家集训队名单</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #e6edf0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "KaiTi", "STKaiti", "FangSong", "SimSun", "Microsoft YaHei", cursive, sans-serif;
  }

  /* Notebook page container */
  .page-container {
    position: relative;
    width: 540px;
    background-color: #f7fafc;
    /* Grid paper pattern */
    background-image: 
      linear-gradient(to right, rgba(160, 205, 225, 0.45) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(160, 205, 225, 0.45) 1px, transparent 1px);
    background-size: 21px 21px;
    padding: 12px 18px 24px 38px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }

  /* Left binder punch holes / decorative dots */
  .binder-dots {
    position: absolute;
    left: 12px;
    top: 15px;
    bottom: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }

  .binder-dot {
    width: 11px;
    height: 11px;
    background-color: #9cbcc9;
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  /* Header Title */
  .title-area {
    margin-bottom: 16px;
    padding-left: 2px;
  }

  .title-text {
    font-size: 24px;
    font-weight: 900;
    color: #1e2474;
    letter-spacing: 2px;
    font-family: "STKaiti", "KaiTi", cursive, sans-serif;
    text-shadow: 0.5px 0.5px 1px rgba(30, 36, 116, 0.2);
  }

  /* Content section with sticky note */
  .content-wrapper {
    position: relative;
    min-height: 290px;
  }

  /* Sticky Post-it Note */
  .sticky-note {
    position: absolute;
    top: -6px;
    right: 0px;
    width: 140px;
    background: #fff8bf;
    padding: 14px 10px 18px 14px;
    box-shadow: 
      -2px 4px 8px rgba(0, 0, 0, 0.15),
      2px 4px 10px rgba(0, 0, 0, 0.1);
    transform: rotate(0.5deg);
    z-index: 2;
    border-radius: 1px 1px 16px 1px;
  }

  .sticky-note::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 25px;
    height: 25px;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.12) 50%, rgba(220,210,140,0.9) 60%, #fff099 100%);
    box-shadow: -1px -1px 2px rgba(0,0,0,0.1);
  }

  .sticky-note ul {
    list-style: none;
  }

  .sticky-note li {
    font-size: 19px;
    font-weight: bold;
    color: #111;
    line-height: 1.55;
    letter-spacing: 0.5px;
    font-family: "STKaiti", "KaiTi", cursive, sans-serif;
  }

  /* Handwritten Main Body */
  .handwritten-body {
    font-size: 21.5px;
    line-height: 1.52;
    color: #e25448;
    font-weight: bold;
    letter-spacing: 1px;
    word-break: break-all;
    font-family: "STKaiti", "KaiTi", cursive, sans-serif;
    text-shadow: 0.2px 0.2px 0 rgba(226, 84, 72, 0.3);
  }

  /* First lines wrap around the sticky note */
  .note-spacer {
    float: right;
    width: 148px;
    height: 180px;
  }

  /* Data Table */
  .table-container {
    margin-top: 18px;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    background-color: #ffffff;
    font-family: "STKaiti", "KaiTi", "SimSun", sans-serif;
  }

  th {
    background-color: #92ab58;
    color: #ffffff;
    font-weight: normal;
    font-size: 16px;
    padding: 4px 6px;
    border: 1px solid #7c9545;
    letter-spacing: 0.5px;
  }

  td {
    border: 1px solid #9cb569;
    padding: 3.5px 6px;
    font-size: 16.5px;
    color: #2b3b18;
    height: 27px;
  }

  /* Alternating row colors matching the document */
  tr.alt-row td {
    background-color: #eaf1da;
  }

  tr td:first-child {
    font-size: 16px;
  }

  .clear {
    clear: both;
  }
</style>
</head>
<body>

<div class="page-container">
  <!-- Left margin binder punched holes -->
  <div class="binder-dots">
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
    <div class="binder-dot"></div>
  </div>

  <!-- Header -->
  <div class="title-area">
    <h1 class="title-text">五大学科竞赛国家集训队名单</h1>
  </div>

  <!-- Content section -->
  <div class="content-wrapper">
    <!-- Sticky Note positioned on the right -->
    <div class="sticky-note">
      <ul>
        <li>生竞67人</li>
        <li>数竞64人</li>
        <li>化竞47人</li>
        <li>物竞43人</li>
      </ul>
    </div>

    <!-- Clear space so text wraps neatly beside sticky note -->
    <div class="note-spacer"></div>

    <!-- Handwritten text -->
    <div class="handwritten-body">
      2023年进入国际五项学科奥赛国家集训队符合保送生资格的总人数为274人。其中生物学科人数最多为67人；其次是数学学科，为64人信息学学科有53人；化学学科有47人；物理学科人数最少，为43人！
    </div>
    
    <div class="clear"></div>
  </div>

  <!-- Bottom Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 20%;">学科</th>
          <th style="width: 20%;">2023 年</th>
          <th style="width: 20%;">2022 年</th>
          <th style="width: 20%;">2021 年</th>
          <th style="width: 20%;">小计</th>
        </tr>
      </thead>
      <tbody>
        <tr class="alt-row">
          <td>数学</td>
          <td>19</td>
          <td>32</td>
          <td>13</td>
          <td>64</td>
        </tr>
        <tr>
          <td>化学</td>
          <td>47</td>
          <td></td>
          <td></td>
          <td>47</td>
        </tr>
        <tr class="alt-row">
          <td>物理</td>
          <td>37</td>
          <td>6</td>
          <td></td>
          <td>43</td>
        </tr>
        <tr>
          <td>生物</td>
          <td>58</td>
          <td>9</td>
          <td></td>
          <td>67</td>
        </tr>
        <tr class="alt-row">
          <td>信息学</td>
          <td>34</td>
          <td>13</td>
          <td></td>
          <td>53</td>
        </tr>
        <tr>
          <td>合计</td>
          <td></td>
          <td></td>
          <td></td>
          <td>274</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
