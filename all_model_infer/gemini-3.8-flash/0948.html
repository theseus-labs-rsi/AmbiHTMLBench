<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会被无缘无故讨厌的原因有哪些？</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #d8d4cd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            color: #2b2b2b;
        }

        .paper-container {
            width: 100%;
            max-width: 520px;
            background-color: #ece8df;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 0),
                radial-gradient(rgba(255, 255, 255, 0.6) 1px, transparent 0);
            background-size: 8px 8px, 12px 12px;
            background-position: 0 0, 4px 4px;
            padding: 65px 36px 80px 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            position: relative;
        }

        .title {
            color: #2e6030;
            font-size: 21px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 38px;
            letter-spacing: 0.5px;
        }

        .content {
            font-size: 16.5px;
            line-height: 1.8;
            letter-spacing: 0.2px;
            text-align: justify;
        }

        .intro {
            margin-bottom: 8px;
            text-indent: 0;
        }

        .item {
            margin-bottom: 8px;
        }

        .highlight-green {
            color: #2e6030;
            font-weight: 500;
        }

        .conclusion {
            margin-top: 14px;
        }

        .quote {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body>
    <div class="paper-container">
        <h1 class="title">1、会被无缘无故讨厌的原因有哪些？</h1>
        
        <div class="content">
            <p class="intro">“无缘无故的讨厌”有很多原因，比如:</p>
            <p class="item">①长相凶狠的人让我们害怕(承认吧，我们都是外貌协会);</p>
            <p class="item">②刻板印象让你对一个人产生先入为主的偏见:印象里重庆人火爆，上海人爱计较。于是你真去到重庆，并且正好遇到重庆人当街斗殴，你的大脑就会激活“重庆人火爆”的认知并加强;</p>
            <p class="item">
                ③心理学上认为的:对一个人的好恶可能<br>
                <span class="highlight-green">是“投射效应”在起作用。</span>
            </p>
            <p class="conclusion">那么，“投射效应”到底是如何会让别人无缘无故讨厌你的呢？</p>
        </div>
    </div>
</body>
</html>
