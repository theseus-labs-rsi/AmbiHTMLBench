<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宿建议</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f7f6f2;
    background-image: 
      radial-gradient(#e8e6df 10%, transparent 11%),
      radial-gradient(#ebe9e2 10%, transparent 11%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    line-height: 1.8;
  }
  .card {
    max-width: 580px;
    width: 100%;
    padding: 20px 10px;
  }
  h1 {
    text-align: center;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .subtitle {
    text-align: center;
    font-size: 1.45rem;
    font-weight: 500;
    letter-spacing: 3px;
    margin-bottom: 40px;
  }
  .content-block {
    margin-bottom: 26px;
    font-size: 1.02rem;
    text-align: justify;
    line-height: 1.85;
    letter-spacing: 0.5px;
  }
  
  /* Handwritten style underlines */
  .u-red {
    border-bottom: 2px solid #df4d4a;
    padding-bottom: 1px;
  }
  .u-wavy {
    text-decoration: underline wavy #df4d4a;
    text-underline-offset: 4px;
  }
  .dots-container {
    position: relative;
    display: inline-block;
  }
  .dots-container::after {
    content: "ᵕ   ᵕ   ᵕ";
    position: absolute;
    left: 2px;
    bottom: -13px;
    font-size: 12px;
    font-weight: bold;
    color: #df4d4a;
    letter-spacing: 12px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="card">
  <h1>住宿<span class="u-red">建议</span></h1>
  
  <div class="subtitle">
    [选酒店<span class="dots-container">关注点</span>]
  </div>

  <div class="content-block">
    <span class="u-wavy"><strong>[沙滩]</strong></span>：亲子家庭出行游，<span class="u-red">对沙滩的质量和海水</span>的选择上要干净、清澈，<span class="u-red">沙子细软不扎脚</span>的。有私人海滩更佳
  </div>

  <div class="content-block">
    <strong>[酒店设施]</strong>：针对酒店的洗护有没有提供宝宝专用，以及宝宝专用的洗漱台和马桶等等，以及<span class="u-red">有没有婴儿床、床围</span>等床上用品提供
  </div>

  <div class="content-block">
    <span class="u-wavy"><strong>[房间]</strong></span>：房间主题最好有小朋友喜欢的主题，比如太空主题的房间或者星空主题的房间；以及房间有没有提供儿童帐篷、滑梯等玩乐设施。房型<span class="u-red">面积最好大一些，有足够的空间</span>给小朋友跑跳玩乐
  </div>

  <div class="content-block">
    <span class="u-wavy"><strong>[儿童玩乐设施]</strong></span>：<span class="u-red">看酒店儿童玩乐设施室内还是室外.设施是不是每日一消毒</span>，看空间宽不宽敞。有没有家长休息区。有没有<span class="u-red">托管服务</span>，托管时间，托管玩的项目等具体小朋友玩乐细节
  </div>
</div>

</body>
</html>
