<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女學雜誌 第五百二十二號</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f7f5f0;
    font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .page-container {
    background-color: #fffdf7;
    width: 680px;
    height: 980px;
    padding: 24px 20px;
    display: flex;
    flex-direction: row;
    position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  /* Margins outside the border */
  .margin-left {
    writing-mode: vertical-rl;
    font-size: 11px;
    color: #333;
    letter-spacing: 2px;
    display: flex;
    justify-content: flex-start;
    padding-top: 40px;
    width: 25px;
  }

  .main-frame {
    flex: 1;
    border: 1.5px solid #2f7142;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 10px 15px;
  }

  .margin-right {
    writing-mode: vertical-rl;
    font-size: 13px;
    color: #2f7142;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    width: 35px;
  }

  .margin-right .issue-date {
    font-size: 10.5px;
    color: #2f7142;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  /* Top Section */
  .top-section {
    height: 44%;
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    align-items: center;
    gap: 38px;
    writing-mode: vertical-rl;
    color: #2f7142;
  }

  .top-col {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-col.spread {
    letter-spacing: 40px;
  }

  ruby {
    ruby-position: over;
  }

  rt {
    font-size: 12px;
    font-weight: normal;
    letter-spacing: 0;
  }

  .lion-parentheses {
    font-size: 38px;
    letter-spacing: 16px;
    position: relative;
  }

  .lion-parentheses rt {
    font-size: 11px;
  }

  /* Divider */
  .divider-container {
    width: 90%;
    margin: 0 auto;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .divider-svg {
    width: 100%;
    height: 10px;
  }

  /* Bottom Section */
  .bottom-section {
    height: 52%;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    justify-content: center;
    writing-mode: vertical-rl;
    padding: 10px 10px 0 10px;
    position: relative;
  }

  .ad-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #c0392b;
    margin: 0 15px;
  }

  .ad-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 8px;
    margin: 15px 0;
  }

  .ornament-line {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c0392b;
    font-size: 10px;
    letter-spacing: -2px;
  }

  .ornament-line::before, .ornament-line::after {
    content: "";
    display: inline-block;
    width: 1px;
    height: 40px;
    background-color: #c0392b;
  }

  .poem-container {
    display: flex;
    flex-direction: row-reverse;
    gap: 12px;
    margin: 0 20px;
  }

  .poem-line {
    font-size: 20px;
    line-height: 1.8;
    color: #c0392b;
    letter-spacing: 3px;
    font-weight: 700;
  }

  .poem-line rt {
    font-size: 10px;
    color: #c0392b;
  }

  /* Bottom page number */
  .page-number {
    position: absolute;
    bottom: 12px;
    left: 12px;
    font-size: 14px;
    color: #2f7142;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
    font-weight: bold;
  }

  /* Footer Google Watermark */
  .google-watermark {
    position: absolute;
    bottom: -32px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #777;
    padding: 0 40px;
    box-sizing: border-box;
  }

  .google-watermark .google-logo {
    font-weight: bold;
    color: #555;
  }
</style>
</head>
<body>

<div class="page-container">
  <!-- Left Margin Text -->
  <div class="margin-left">
    （明治三十六年六月十七日第三種郵便物認可）
  </div>

  <!-- Main Framed Content -->
  <div class="main-frame">
    <!-- Top Section (Green) -->
    <div class="top-section">
      <div class="top-col">
        市川團
      </div>
      <div class="top-col">
        十郎の
      </div>
      <div class="top-col spread">
        <ruby>石<rt>しやく</rt></ruby><ruby>橋<rt>けう</rt></ruby>
      </div>
      <div class="top-col lion-parentheses">
        （<ruby>獅<rt>ライ</rt></ruby><ruby>子<rt>オン</rt></ruby>）
      </div>
    </div>

    <!-- Wavy Divider -->
    <div class="divider-container">
      <svg class="divider-svg" viewBox="0 0 400 8" preserveAspectRatio="none">
        <path d="M0,4 Q10,0 20,4 T40,4 T60,4 T80,4 T100,4 T120,4 T140,4 T160,4 T180,4 T200,4 T220,4 T240,4 T260,4 T280,4 T300,4 T320,4 T340,4 T360,4 T380,4 T400,4" 
              fill="none" stroke="#2f7142" stroke-width="1.8" />
      </svg>
    </div>

    <!-- Bottom Section (Red) -->
    <div class="bottom-section">
      <!-- Right Ad Column -->
      <div class="ad-column">
        <svg width="6" height="40"><line x1="3" y1="0" x2="3" y2="40" stroke="#c0392b" stroke-width="1.5"/><circle cx="3" cy="20" r="2.5" fill="none" stroke="#c0392b" stroke-width="1"/></svg>
        <div class="ad-title">ライオン齒磨</div>
        <svg width="6" height="40"><line x1="3" y1="0" x2="3" y2="40" stroke="#c0392b" stroke-width="1.5"/><circle cx="3" cy="20" r="2.5" fill="none" stroke="#c0392b" stroke-width="1"/></svg>
      </div>

      <!-- Poem Lines -->
      <div class="poem-container">
        <div class="poem-line">花にたはぶれ、杖に伏しまろび、</div>
        <div class="poem-line">げにも上なき獅子王のいきほ</div>
        <div class="poem-line">ひ、なびかぬ草木もなき時なれ</div>
        <div class="poem-line">や。萬歲千秋と舞ひをさめ、萬</div>
        <div class="poem-line">歲千秋と舞ひをさめ、<ruby>獅子<rt>ライオン</rt></ruby>の座</div>
        <div class="poem-line">にこそなほりけれ。</div>
      </div>

      <!-- Left Ad Column -->
      <div class="ad-column">
        <svg width="6" height="40"><line x1="3" y1="0" x2="3" y2="40" stroke="#c0392b" stroke-width="1.5"/><circle cx="3" cy="20" r="2.5" fill="none" stroke="#c0392b" stroke-width="1"/></svg>
        <div class="ad-title">ライオン齒磨</div>
        <svg width="6" height="40"><line x1="3" y1="0" x2="3" y2="40" stroke="#c0392b" stroke-width="1.5"/><circle cx="3" cy="20" r="2.5" fill="none" stroke="#c0392b" stroke-width="1"/></svg>
      </div>

      <!-- Page Number -->
      <div class="page-number">
        （五二二）
      </div>
    </div>
  </div>

  <!-- Right Margin Text -->
  <div class="margin-right">
    <div>女學雜誌第五百二十二號</div>
    <div class="issue-date">（明治卅六年十月十日發行）（毎月一回廿五日）</div>
  </div>

  <!-- Google Watermark Footer -->
  <div class="google-watermark">
    <div>Digitized by <span class="google-logo">Google</span></div>
    <div>Original from<br>CORNELL UNIVERSITY</div>
  </div>
</div>

</body>
</html>
