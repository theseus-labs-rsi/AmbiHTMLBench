<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奔驰 大G - 普通人 赚一辆豪车 需要多久？</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f7f7f7;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 10px;
    color: #111;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background-color: #ffffff;
    padding: 24px 20px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .placeholder {
    width: 280px;
    height: 190px;
    background: #f0f0f0;
    border: 1px dashed #bbb;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 8px;
    position: relative;
  }
  .main-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-top: 6px;
    margin-bottom: 8px;
    text-align: center;
  }
  .sub-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    text-align: center;
  }
  .table-wrapper {
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .watermark {
    position: absolute;
    right: -25px;
    bottom: -15px;
    width: 190px;
    height: 190px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 1;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    position: relative;
    z-index: 2;
  }
  th, td {
    border: 1px solid #d9d9d9;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: bold;
    color: #111;
    text-align: left;
  }
  th {
    background-color: #dce0e4;
    font-weight: 900;
    font-size: 15px;
  }
  td:first-child, th:first-child {
    width: 32%;
  }
  td:nth-child(2), th:nth-child(2) {
    width: 38%;
  }
  td:nth-child(3), th:nth-child(3) {
    width: 30%;
  }
  .footer-note {
    width: 100%;
    text-align: right;
    font-size: 11px;
    color: #8c8c8c;
    margin-top: 8px;
    padding-right: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="placeholder">
    [照片: 黑色奔驰大G越野车 / Black Mercedes-Benz G-Class SUV]
  </div>

  <h1 class="main-title">奔驰 大G</h1>
  <h2 class="sub-title">普通人 赚一辆豪车 需要多久？</h2>

  <div class="table-wrapper">
    <!-- Mercedes-Benz Star Logo Watermark -->
    <svg class="watermark" viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="2.5">
      <circle cx="50" cy="50" r="47" stroke-width="2.8"/>
      <path d="M50 50 L50 4" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M50 50 L10 74" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M50 50 L90 74" stroke-width="2.8" stroke-linecap="round"/>
      <polygon points="50,4 47,50 50,45" fill="#000"/>
      <polygon points="50,4 53,50 50,45" fill="#000"/>
      <polygon points="10,74 50,48 45,52" fill="#000"/>
      <polygon points="90,74 50,48 55,52" fill="#000"/>
    </svg>

    <table>
      <thead>
        <tr>
          <th>职业</th>
          <th>月薪</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>外卖员</td>
          <td>5000元/月</td>
          <td>大约45年</td>
        </tr>
        <tr>
          <td>建筑工人</td>
          <td>6000元/月</td>
          <td>大约38年</td>
        </tr>
        <tr>
          <td>出租车司机</td>
          <td>6500元/月</td>
          <td>大约35年</td>
        </tr>
        <tr>
          <td>教师</td>
          <td>8000元/月</td>
          <td>大约28年</td>
        </tr>
        <tr>
          <td>医生</td>
          <td>10000元/月</td>
          <td>大约23年</td>
        </tr>
        <tr>
          <td>互联网职工</td>
          <td>15000元/月</td>
          <td>大约15年</td>
        </tr>
        <tr>
          <td>银行职员</td>
          <td>20000元/月</td>
          <td>大约11年</td>
        </tr>
        <tr>
          <td>销售</td>
          <td>25000元/月</td>
          <td>大约9年</td>
        </tr>
        <tr>
          <td>私企老板</td>
          <td>50000元/月</td>
          <td>大约5年</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer-note">
    *月薪资30%作为日常基本开销
  </div>
</div>

</body>
</html>
