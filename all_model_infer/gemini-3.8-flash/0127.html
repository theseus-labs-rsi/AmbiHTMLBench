<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民日报金句合集系列</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e6e6e6;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
      font-family: "SimSun", "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      color: #1a1a1a;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background-color: #d9bc97;
      background-image: 
        radial-gradient(#cdae86 15%, transparent 16%),
        radial-gradient(#c5a47a 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 24px 28px 40px 28px;
      position: relative;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 2px solid #1a1a1a;
      margin-bottom: 30px;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .masthead-title {
      font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "Ma Shan Zheng", cursive, serif;
      font-size: 46px;
      font-weight: bold;
      color: #c92323;
      line-height: 1.1;
      letter-spacing: 2px;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
    }

    .pinyin {
      font-family: "Times New Roman", Times, serif;
      font-size: 11px;
      font-weight: 600;
      color: #9d5f57;
      letter-spacing: 4px;
      margin-top: 4px;
      margin-left: 2px;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      padding-top: 4px;
    }

    .tags {
      font-size: 16px;
      letter-spacing: 1.5px;
      color: #1a1a1a;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #1a1a1a;
      display: inline-block;
      width: fit-content;
    }

    .series-title {
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #1a1a1a;
      margin-top: 10px;
    }

    /* Content Items */
    .item {
      margin-bottom: 32px;
    }

    .quote-title {
      font-size: 23px;
      font-weight: bold;
      line-height: 1.45;
      color: #111;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .quote-second-line {
      display: block;
      margin-left: 42px;
    }

    .explanation {
      font-size: 13px;
      line-height: 1.55;
      color: #2b2b2b;
      margin-top: 4px;
    }

    .explanation-label {
      display: block;
      margin-bottom: 2px;
      font-size: 12.5px;
    }

    .explanation-text {
      display: block;
      text-align: justify;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="masthead-title">人民日報</div>
        <div class="pinyin">RENMIN RIBAO</div>
      </div>
      <div class="header-right">
        <div class="tags">金句 | 素材 | 摘抄</div>
        <div class="series-title">金句合集系列</div>
      </div>
    </header>

    <!-- Item 1 -->
    <article class="item">
      <h2 class="quote-title">
        1、愿你千山暮雪海棠依旧，<br>
        <span class="quote-second-line">不为岁月惊扰平添忧愁。</span>
      </h2>
      <div class="explanation">
        <span class="explanation-label">释义:</span>
        <span class="explanation-text">希望你不论经过多少事都能如往昔依然不变,不因为时间的流逝与琐事而烦恼忧愁。</span>
      </div>
    </article>

    <!-- Item 2 -->
    <article class="item">
      <h2 class="quote-title">
        2、总有人间一两风，<br>
        <span class="quote-second-line">填我十万八千梦。</span>
      </h2>
      <div class="explanation">
        <span class="explanation-label">释义:</span>
        <span class="explanation-text">人间总有那么几处善良和美好的事情，满足你对世界的所有遐想，成全你的理想。</span>
      </div>
    </article>

    <!-- Item 3 -->
    <article class="item">
      <h2 class="quote-title">
        3、日出有盼， 日落有思，<br>
        <span class="quote-second-line">平平安安， 所遇皆甜。</span>
      </h2>
      <div class="explanation">
        <span class="explanation-label">释义:</span>
        <span class="explanation-text">只要日出就会有盼头，只要有日落就会有思念，祈祷大家平平安安，遇到的都是美好。</span>
      </div>
    </article>
  </div>

</body>
</html>
