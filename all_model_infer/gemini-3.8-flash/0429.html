<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国色 · 藕荷 - 桂花露 荷花露</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }
  .card-container {
    width: 100%;
    max-width: 540px;
    background-color: #ddc6cf;
    padding: 24px 22px 14px 22px;
    display: flex;
    flex-direction: column;
    color: #4b4246;
  }
  .inner-border {
    border: 1px solid #75656b;
    padding: 55px 40px 60px 42px;
    flex-grow: 1;
  }
  .section {
    margin-bottom: 50px;
  }
  .section:last-child {
    margin-bottom: 0;
  }
  .title {
    font-size: 19px;
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .item {
    font-size: 17px;
    line-height: 1.85;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
    font-weight: 500;
  }
  .item:last-child {
    margin-bottom: 0;
  }
  .item-label {
    letter-spacing: 0;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 11px;
    color: #7b6f74;
    padding: 0 2px;
  }
  .footer-left {
    letter-spacing: 1px;
  }
  .footer-right {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0.7;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="inner-border">
    <!-- 桂花露 -->
    <div class="section">
      <div class="title">△桂花露</div>
      <div class="item">
        <span class="item-label">〔功用〕</span>开胃消食，宽胸化痰
      </div>
      <div class="item">
        <span class="item-label">〔药物〕</span>桂花500克
      </div>
      <div class="item">
        <span class="item-label">〔制法〕</span>于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液
      </div>
    </div>

    <!-- 荷花露 -->
    <div class="section">
      <div class="title">△荷花露</div>
      <div class="item">
        <span class="item-label">〔功用〕</span>清暑凉营
      </div>
      <div class="item">
        <span class="item-label">〔药物〕</span>白荷花500克
      </div>
      <div class="item">
        <span class="item-label">〔制法〕</span>取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">〔 中国色 · 藕荷 〕</div>
    <div class="footer-right">
      <span>图怪兽 APP</span>
    </div>
  </div>
</div>

</body>
</html>
