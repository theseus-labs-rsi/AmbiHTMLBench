<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓解痛经</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #2b2b2b;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 12px 24px 40px;
            position: relative;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #333;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-icons svg {
            fill: #333;
        }

        .close-btn {
            font-size: 20px;
            color: #333;
            line-height: 1;
            margin-bottom: 24px;
            cursor: pointer;
            font-weight: 300;
        }

        /* Section 5 Header */
        .header-item-5 {
            display: inline-block;
            margin-bottom: 12px;
            position: relative;
        }

        .header-item-5 .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-5 {
            width: 20px;
            height: 20px;
            background-color: #e57a82;
            color: #fff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .title-5 {
            font-size: 16px;
            font-weight: 600;
            color: #5c4b8b;
            letter-spacing: 0.5px;
        }

        .header-underline {
            height: 4px;
            background: linear-gradient(to right, rgba(229, 122, 130, 0.4), rgba(92, 75, 139, 0.1), transparent);
            border-radius: 2px;
            margin-top: 4px;
            width: 100%;
        }

        /* Common Paragraph */
        .content-p {
            font-size: 15px;
            line-height: 1.7;
            color: #333333;
            margin-bottom: 24px;
            text-align: justify;
        }

        /* Section 2 Banner Box */
        .section-2-wrapper {
            display: flex;
            justify-content: center;
            margin: 36px 0 24px;
        }

        .section-2-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            border: 1.5px solid #a395c8;
            padding: 8px 16px 8px 36px;
            background: #fff;
        }

        .section-2-num {
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 46px;
            font-weight: 900;
            color: #5c4b8b;
            background: #fff;
            padding: 0 4px;
            line-height: 1;
        }

        .section-2-dot {
            width: 7px;
            height: 7px;
            background-color: #5c4b8b;
            margin-right: 6px;
            align-self: flex-start;
            margin-top: 2px;
        }

        .section-2-title {
            font-size: 18px;
            font-weight: bold;
            color: #5c4b8b;
            letter-spacing: 1px;
        }

        /* Arrow Badge */
        .badge-scheme {
            display: inline-flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .badge-scheme-inner {
            background-color: #634f9a;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px 4px 8px;
            position: relative;
            clip-path: polygon(0% 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 0% 100%);
            padding-right: 18px;
        }

        .badge-scheme-arrow {
            margin-left: -4px;
            width: 14px;
            height: 25px;
            position: relative;
        }

        .badge-scheme-arrow::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-top: 2px solid #634f9a;
            border-right: 2px solid #634f9a;
            transform: rotate(45deg);
        }

        /* List Items */
        .list-section {
            margin-top: 18px;
        }

        .list-intro {
            font-size: 15px;
            color: #333333;
            margin-bottom: 16px;
        }

        .list-item {
            font-size: 15px;
            line-height: 1.7;
            color: #333333;
            margin-bottom: 16px;
            text-align: justify;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Status Bar -->
    <div class="status-bar">
        <div style="width: 20px;"></div>
        <div class="status-icons">
            <!-- HD Icon -->
            <svg width="22" height="12" viewBox="0 0 24 14">
                <rect x="0.5" y="0.5" width="23" height="13" rx="2" fill="none" stroke="#333" stroke-width="1"/>
                <text x="3" y="10" font-size="8" font-family="sans-serif" font-weight="bold" fill="#333">HD</text>
            </svg>
            <!-- 5G / Signal Icon -->
            <svg width="14" height="12" viewBox="0 0 16 14">
                <text x="0" y="7" font-size="6" font-family="sans-serif" fill="#333">5G</text>
                <rect x="7" y="10" width="1.5" height="4" fill="#333"/>
                <rect x="9.5" y="7.5" width="1.5" height="6.5" fill="#333"/>
                <rect x="12" y="5" width="1.5" height="9" fill="#333"/>
                <rect x="14.5" y="2" width="1.5" height="12" fill="#333"/>
            </svg>
            <!-- Wifi Icon -->
            <svg width="14" height="12" viewBox="0 0 16 14">
                <path d="M8 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-4.2-4.2a6 6 0 0 1 8.4 0l-1.1 1.1a4.5 4.5 0 0 0-6.2 0L3.8 7.8zm-2.8-2.8a10 10 0 0 1 14 0l-1.1 1.1a8.5 8.5 0 0 0-11.8 0L1 5z" fill="#333"/>
            </svg>
        </div>
        <div class="status-icons" style="gap: 4px;">
            <!-- Battery Icon -->
            <svg width="22" height="12" viewBox="0 0 24 12">
                <rect x="1" y="1" width="19" height="10" rx="2" fill="none" stroke="#333" stroke-width="1.2"/>
                <rect x="2.5" y="2.5" width="11" height="7" fill="#333"/>
                <path d="M21 4.5h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1v-3z" fill="#333"/>
            </svg>
            <span>19:43</span>
        </div>
    </div>

    <!-- Close button -->
    <div class="close-btn">✕</div>

    <!-- Item 5 -->
    <div class="header-item-5">
        <div class="title-row">
            <span class="badge-5">5</span>
            <span class="title-5">月经来潮需停药</span>
        </div>
        <div class="header-underline"></div>
    </div>

    <p class="content-p">
        药物推迟月经可能会失败，服药过程中如月经来潮需停药。
    </p>

    <!-- Large Section 2 Header -->
    <div class="section-2-wrapper">
        <div class="section-2-box">
            <div class="section-2-num">2</div>
            <div class="section-2-dot"></div>
            <div class="section-2-title">缓解痛经</div>
        </div>
    </div>

    <p class="content-p">
        如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。
    </p>

    <!-- Subheading Tag -->
    <div class="badge-scheme">
        <div class="badge-scheme-inner">常用方案</div>
        <div class="badge-scheme-arrow"></div>
    </div>

    <p class="content-p" style="margin-bottom: 20px;">
        痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。
    </p>

    <!-- Ordered List Section -->
    <div class="list-section">
        <p class="list-intro">以下三种方法，选其中一种方法即可：</p>
        
        <p class="list-item">
            1.布洛芬 首剂 800 mg，之后根据需要 400～800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。
        </p>

        <p class="list-item">
            2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。
        </p>
    </div>
</div>

</body>
</html>
