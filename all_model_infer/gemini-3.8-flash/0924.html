<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 做好竞品分析</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #9b958f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 15px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }

  .card-container {
    width: 100%;
    max-width: 440px;
    background-color: #fbf7ee;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Main content area */
  .card-body {
    padding: 32px 30px 24px 30px;
    position: relative;
  }

  /* Top tag / badge */
  .tag-wrapper {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
  }

  .tag-bar {
    width: 4px;
    height: 22px;
    background-color: #7d4428;
    margin-right: 4px;
  }

  .tag {
    position: relative;
    background-color: #a46747;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    line-height: 22px;
    padding: 0 16px 0 8px;
    letter-spacing: 0.5px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%);
  }

  /* Heading */
  .main-title {
    font-size: 28px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 1px;
    margin-bottom: 28px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .main-title .num {
    font-size: 30px;
    font-family: "Arial Black", Impact, sans-serif;
  }

  /* Text sections */
  .text-group {
    font-size: 14.5px;
    line-height: 1.7;
    color: #262422;
    margin-bottom: 22px;
  }

  .text-group p {
    margin-bottom: 3px;
  }

  .bold-intro {
    font-weight: 700;
  }

  /* List items */
  .list-section {
    font-size: 14.5px;
    line-height: 1.75;
    color: #262422;
  }

  .list-item-title {
    font-weight: 700;
  }

  .list-item-content {
    padding-left: 20px;
    color: #383431;
    font-weight: 500;
    margin-bottom: 5px;
  }

  /* Perforation & ticket notch divider */
  .divider-container {
    position: relative;
    height: 16px;
    background-color: #fbf7ee;
    display: flex;
    align-items: center;
  }

  .notch-left, .notch-right {
    position: absolute;
    width: 14px;
    height: 14px;
    background-color: #9b958f;
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }

  .notch-left {
    left: -7px;
  }

  .notch-right {
    right: -7px;
  }

  .perforated-line {
    width: 100%;
    height: 0;
    border-bottom: 2px dashed #ded6c9;
    margin: 0 14px;
  }

  /* Footer */
  .card-footer {
    background-color: #ede5d8;
    padding: 16px 20px 20px 20px;
    text-align: center;
  }

  .footer-text {
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "SimSun", cursive, sans-serif;
    font-size: 16.5px;
    font-weight: bold;
    font-style: italic;
    color: #22201e;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="card-body">
    <!-- Top badge -->
    <div class="tag-wrapper">
      <div class="tag-bar"></div>
      <div class="tag">新媒体账号运营6种方法</div>
    </div>

    <!-- Main Title -->
    <h1 class="main-title">
      <span class="num">03</span>
      <span>做好竞品分析</span>
    </h1>

    <!-- Intro paragraphs -->
    <div class="text-group">
      <p class="bold-intro">前期的竞品分析</p>
      <p class="bold-intro">一定要花大量的时间和精力去收集信息</p>
    </div>

    <div class="text-group">
      <p class="bold-intro">仔细分析</p>
      <p class="bold-intro">可以从以下几个方面来看</p>
    </div>

    <!-- Numbered points -->
    <div class="list-section">
      <div class="list-item-title">1、账号人设标 签</div>
      <div class="list-item-title">2、账号选题规划</div>
      <div class="list-item-title">3、内容脚本拆解：</div>
      <div class="list-item-content">结构、矛盾点、金句、痒点</div>

      <div class="list-item-title">4、内容形式：</div>
      <div class="list-item-content">场景道具服装，拍摄剪辑节奏</div>

      <div class="list-item-title">5、运营策略：</div>
      <div class="list-item-content" style="margin-bottom: 0;">
        发布时间和频率，封面，文案，线上互动<br>
        用户运营，引流途径
      </div>
    </div>
  </div>

  <!-- Ticket notch divider -->
  <div class="divider-container">
    <div class="notch-left"></div>
    <div class="perforated-line"></div>
    <div class="notch-right"></div>
  </div>

  <!-- Bottom Footer -->
  <div class="card-footer">
    <div class="footer-text">@新媒体运营的十万个为什么</div>
  </div>
</div>

</body>
</html>
