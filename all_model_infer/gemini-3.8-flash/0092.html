<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middlesex Music Hall - Kostroma People</title>
<style>
  body {
    background-color: #2b2b2b;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Times New Roman", Times, Georgia, serif;
    box-sizing: border-box;
  }

  .poster {
    background-color: #f3ebda;
    width: 680px;
    max-width: 100%;
    padding: 25px 25px 35px 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    box-sizing: border-box;
    text-align: center;
    color: #111;
    position: relative;
  }

  /* Header Section */
  .venue-title {
    font-family: "Impact", "Arial Black", "Rockwell Extra Bold", serif;
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
    text-transform: uppercase;
    font-weight: 900;
    margin: 0;
  }

  .venue-subtitle {
    font-family: "Georgia", serif;
    font-size: 14px;
    letter-spacing: 3px;
    margin-top: 4px;
    margin-bottom: 8px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .divider-line {
    border-top: 1px solid #111;
    width: 90%;
    margin: 6px auto;
  }

  /* Benefit Heading */
  .benefit-title {
    font-family: "Impact", "Arial Black", serif;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.05;
    margin: 6px 0 2px 0;
    text-transform: uppercase;
  }

  .date-title {
    font-family: "Georgia", serif;
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin: 4px 0;
  }

  .night-only {
    font-family: "Georgia", serif;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 6px 0 16px 0;
    font-weight: bold;
  }

  /* Kostroma Section */
  .the-hirsute {
    font-family: "Arial", sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .kostroma-title {
    font-family: "Impact", "Arial Narrow", sans-serif;
    font-size: 64px;
    font-weight: normal;
    color: #be432f;
    letter-spacing: 3px;
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0;
    transform: scaleY(1.15);
    margin-bottom: 6px;
  }

  .origin-text {
    font-family: "Arial", sans-serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 8px 0 12px 0;
  }

  /* Illustration Placeholder */
  .image-container {
    margin: 0 auto;
    width: 530px;
    max-width: 95%;
    background-color: #ebd349;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #c9b036;
  }

  .image-inner-border {
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    padding: 4px;
    position: relative;
    box-sizing: border-box;
  }

  .illustration-placeholder {
    width: 100%;
    height: 480px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: transparent;
    color: #4a4220;
    font-style: italic;
    font-size: 15px;
    line-height: 1.5;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }

  /* Footer */
  .footer-banner {
    width: 530px;
    max-width: 95%;
    margin: 14px auto 0 auto;
    border-top: 1.5px solid #111;
    border-bottom: 1.5px solid #111;
    padding: 5px 0;
  }

  .footer-text {
    font-family: "Georgia", serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Venue Header -->
  <div class="venue-title">Middlesex Music Hall,</div>
  <div class="venue-subtitle">Drury Lane,</div>

  <div class="divider-line"></div>

  <!-- Benefit Announcement -->
  <div class="benefit-title">S. Emanuel's Benefit</div>
  <div class="date-title">Wednesday, Feb. 25th.</div>
  <div class="night-only">Positively for this Night Only.</div>

  <!-- Attraction Titles -->
  <div class="the-hirsute">The Hirsute</div>
  <div class="kostroma-title">Kostroma People</div>
  <div class="origin-text">From the Primeval Forests of Central Russia.</div>

  <!-- Central Colored Illustration -->
  <div class="image-container">
    <div class="image-inner-border">
      <figure class="illustration-placeholder placeholder">
        [Woodcut/lithograph depicting two hirsute people (an adult and child with thick facial hair) in 19th-century Russian attire—blue tunics, red inner shirts, red trousers, and high boots—against a yellow backdrop]
      </figure>
    </div>
  </div>

  <!-- Bottom Tagline -->
  <div class="footer-banner">
    <div class="footer-text">The First of Their Kind Ever Seen in England.</div>
  </div>
</div>

</body>
</html>
