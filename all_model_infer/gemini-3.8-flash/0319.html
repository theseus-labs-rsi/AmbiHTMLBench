<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 回避行为</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }

  .card-container {
    position: relative;
    width: 440px;
    height: 586px;
    background-color: #0d46c7;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Inner white card with decorative tech/cyber cuts */
  .card-inner {
    position: relative;
    width: 416px;
    height: 562px;
    background-color: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
  }

  /* Blue frame decorations */
  .deco-tl-outer {
    position: absolute;
    top: 0;
    left: 0;
    width: 14px;
    height: 170px;
    background-color: #0d46c7;
  }

  .deco-tl-outer::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 0;
    width: 0;
    height: 0;
    border-top: 14px solid #0d46c7;
    border-right: 14px solid transparent;
  }

  .deco-tl-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 130px;
    height: 12px;
    background-color: #0d46c7;
  }

  .deco-tl-top::after {
    content: '';
    position: absolute;
    top: 0;
    right: -12px;
    width: 0;
    height: 0;
    border-top: 12px solid #0d46c7;
    border-right: 12px solid transparent;
  }

  .deco-right {
    position: absolute;
    right: 0;
    top: 155px;
    width: 12px;
    height: 110px;
    background-color: #0d46c7;
  }

  .deco-right::before {
    content: '';
    position: absolute;
    top: -12px;
    right: 0;
    width: 0;
    height: 0;
    border-bottom: 12px solid #0d46c7;
    border-left: 12px solid transparent;
  }

  .deco-bl-corner {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 14px;
    height: 35px;
    background-color: #0d46c7;
  }

  .deco-bl-corner::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 0;
    width: 0;
    height: 0;
    border-bottom: 14px solid #0d46c7;
    border-right: 14px solid transparent;
  }

  .deco-br-corner {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 14px;
    height: 35px;
    background-color: #0d46c7;
  }

  .deco-br-corner::before {
    content: '';
    position: absolute;
    top: -14px;
    right: 0;
    width: 0;
    height: 0;
    border-bottom: 14px solid #0d46c7;
    border-left: 14px solid transparent;
  }

  .deco-bottom-notch {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 10px;
    background-color: #0d46c7;
  }

  .deco-bottom-notch::before {
    content: '';
    position: absolute;
    top: 0;
    left: -10px;
    width: 0;
    height: 0;
    border-bottom: 10px solid #0d46c7;
    border-left: 10px solid transparent;
  }

  .deco-bottom-notch::after {
    content: '';
    position: absolute;
    top: 0;
    right: -10px;
    width: 0;
    height: 0;
    border-bottom: 10px solid #0d46c7;
    border-right: 10px solid transparent;
  }

  /* Content typography */
  .number {
    font-size: 54px;
    font-weight: 900;
    color: #000000;
    line-height: 1;
    letter-spacing: -1px;
    margin-top: 10px;
    margin-bottom: 16px;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }

  .title {
    font-size: 44px;
    font-weight: 900;
    color: #000000;
    line-height: 1.15;
    letter-spacing: 1px;
    margin-bottom: 96px;
  }

  .highlight {
    font-size: 21px;
    font-weight: 800;
    color: #000000;
    line-height: 1.45;
    letter-spacing: 0.5px;
    margin-bottom: 24px;
  }

  .body-text {
    font-family: "Songti SC", "SimSun", "Noto Serif CJK SC", "STSong", serif;
    font-size: 19px;
    color: #000000;
    line-height: 1.7;
    letter-spacing: 0.5px;
    text-align: justify;
  }
</style>
</head>
<body>

<div class="card-container">
  <div class="card-inner">
    <!-- Blue decorative overlays -->
    <div class="deco-tl-outer"></div>
    <div class="deco-tl-top"></div>
    <div class="deco-right"></div>
    <div class="deco-bl-corner"></div>
    <div class="deco-br-corner"></div>
    <div class="deco-bottom-notch"></div>

    <!-- Main Content -->
    <div class="number">03</div>
    <div class="title">回避行为</div>
    
    <div class="highlight">
      自觉或不自觉地回避曾经的某些人、事、物。
    </div>
    
    <div class="body-text">
      比如，学生时代受过伤，可能回避同学聚会，不再听某些歌、看某些电影、去某家餐厅……
    </div>
  </div>
</div>

</body>
</html>
