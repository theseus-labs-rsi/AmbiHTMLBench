<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业思维与个人提升</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f0ede7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }
  .card {
    background-color: #eae5de;
    width: 100%;
    max-width: 480px;
    padding: 48px 36px 40px 36px;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.62;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  .highlight {
    color: #4d8482;
  }
  .section {
    margin-bottom: 38px;
    text-align: justify;
  }
  .footer {
    margin-top: 52px;
    text-align: center;
    font-size: 17px;
    color: #4d8482;
    letter-spacing: 1px;
    word-spacing: 2px;
  }
  .footer .divider {
    display: inline-block;
    margin: 0 8px;
    color: #a4bebd;
    font-weight: 300;
  }
</style>
</head>
<body>

<div class="card">
  <div class="section">
    1、<span class="highlight">你开始炫耀自己，往往都是灾难的开始。</span>就像老子在《道德经》里写到：“光而不耀，静水流深。”意思就是，无论身处什么位置，什么环境，嘴上不逞强、不炫耀、不狂妄才能兜住自己的福气。
  </div>

  <div class="section">
    2、一个冷知识：<span class="highlight">屏蔽力是一个人最顶级的能力</span>，任何消耗你的人和事，多看一眼都是你的不对。
  </div>

  <div class="section">
    3、大学时辅导员说了一句受益一生的话：“<span class="highlight">你不用变得很外向，内向挺好的，但需要你发言的时候，一定要勇敢。</span>”正所谓：君子可内敛不可懦弱，面不公可起而论之。
  </div>

  <div class="footer">
    商业思维<span class="divider">|</span>底层逻辑<span class="divider">|</span>个人提升
  </div>
</div>

</body>
</html>
