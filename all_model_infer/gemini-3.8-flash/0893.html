<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富人眼中的富人是咋样？</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: radial-gradient(circle at 50% 30%, #173061 0%, #0c1c3f 60%, #060e22 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
  }
  .card {
    width: 100%;
    max-width: 540px;
    padding: 30px 15px 40px;
  }
  .title-container {
    text-align: center;
    margin-bottom: 25px;
  }
  .title {
    font-family: "SimSun", "Songti SC", "STSong", "Songti", serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    display: inline-block;
    padding-bottom: 8px;
    border-bottom: 2px solid #ffffff;
    line-height: 1.3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(10, 25, 55, 0.25);
  }
  th, td {
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 12px 10px;
    font-size: 14.5px;
    font-weight: 400;
    line-height: 1.5;
  }
  th {
    text-align: center;
    font-weight: 400;
    padding: 10px;
  }
  .col-question {
    width: 63%;
    text-align: left;
    padding-left: 12px;
  }
  .col-answer {
    width: 37%;
    text-align: center;
  }
  .note-row {
    text-align: right;
    padding-right: 15px;
    font-size: 13.5px;
    color: #e2e8f0;
  }
</style>
</head>
<body>

<div class="card">
  <div class="title-container">
    <h1 class="title">富人眼中的富人是咋样？</h1>
  </div>

  <table>
    <thead>
      <tr>
        <th>问题</th>
        <th>回答</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="col-question">1.您觉得高净值人群资产拥有多少钱才算是？</td>
        <td class="col-answer">1亿7,388,4万元</td>
      </tr>
      <tr>
        <td colspan="2" class="note-row">本次调研的平均家庭资产:2,265.8万元</td>
      </tr>
      <tr>
        <td class="col-question">2.请问您每天工作小时数是？</td>
        <td class="col-answer">8.2小时</td>
      </tr>
      <tr>
        <td class="col-question">3.您预计退休年龄？</td>
        <td class="col-answer">59岁</td>
      </tr>
      <tr>
        <td class="col-question">4.您希望能活到多少岁？</td>
        <td class="col-answer">88.2岁</td>
      </tr>
      <tr>
        <td colspan="2" class="note-row">小知识:2021年中国平均寿命:77.3岁</td>
      </tr>
      <tr>
        <td class="col-question">5.请问您曾去过国家数量（包括商务出差）</td>
        <td class="col-answer">6.2个国家</td>
      </tr>
      <tr>
        <td class="col-question">6.请问您平均每月阅读书籍数量</td>
        <td class="col-answer">2.4本书</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
