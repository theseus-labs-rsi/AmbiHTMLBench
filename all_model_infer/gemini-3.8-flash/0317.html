<!DOCTYPE html>

    <style>
        * {

            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;

        }

        .subtitle {
            font-size: 15px;
            color: #333333;
            margin-bottom: 16px;
        }

        .lead {
            font-size: 15px;
            color: #333333;
        }

        .content-list {
            list-style: none;
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .content-list li {

    <div class="slide-container">

            <div class="lead">根据经验分享会总结的：</div>
        </div>

        <ol class="content-list">
            <li>1. 常识：李梦娇讲的挺好，如果时间富裕可以好好准备，王军涛，粉笔</li>
            <li>2. 言语理解：郭熙老师，小宝，欣说</li>
            <li>3. 数资：花生十三，齐麟，唐宋</li>
            <li>4. 判断：花生十三，勾沉老师、赵佳、徐来、龙飞、蔡金龙</li>
