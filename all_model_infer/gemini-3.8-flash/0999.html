<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写笔记 - 列车效应</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #e6e6e6;
    display: flex;
    justify-content: center;
    padding: 20px 10px;
    font-family: "Kaiti SC", "STKaiti", "楷体", "SimKai", "PingFang SC", "Microsoft YaHei", cursive, sans-serif;
  }

  .notebook-page {
    position: relative;
    width: 680px;
    background-color: #fcfbf7;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border-radius: 4px;
    overflow: hidden;
    padding: 30px 45px 50px 35px;
  }

  /* Watermark at top right */
  .watermark {
    position: absolute;
    top: 18px;
    right: 40px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(0, 0, 0, 0.18);
    padding: 2px 8px;
    border-radius: 10px;
    font-family: sans-serif;
    transform: rotate(28deg);
    pointer-events: none;
    z-index: 10;
  }

  /* Binder holes along the right margin */
  .binder-holes {
    position: absolute;
    top: 10px;
    bottom: 10px;
    right: 12px;
    width: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    pointer-events: none;
  }

  .hole {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background-color: #d6d5d0;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.25);
  }

  /* Header elements */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-left: 10px;
    font-size: 12px;
    color: #a0a0a0;
    font-family: sans-serif;
  }

  /* Ruled lines area */
  .ruled-content {
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 35px,
      #dcd9d2 35px,
      #dcd9d2 36px
    );
    line-height: 36px;
    padding-top: 2px;
  }

  .line {
    min-height: 36px;
    font-size: 18.5px;
    color: #2b2b2b;
    letter-spacing: 0.5px;
    padding-left: 10px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* Indent for definition explanation */
  .indent {
    padding-left: 135px;
  }

  /* Pen style variations */
  .blue-tag {
    color: #2b5cb0;
    font-weight: 500;
  }

  .blue-circle {
    display: inline-block;
    border: 1.5px solid #3366cc;
    border-radius: 14px 18px 16px 14px;
    padding: 0 5px;
    margin: 0 1px;
    line-height: 1.2;
    transform: rotate(-1deg);
  }

  .blue-underline {
    border-bottom: 2px solid #2b5cb0;
    padding-bottom: 1px;
  }

  /* Footer logo */
  .page-footer {
    position: absolute;
    bottom: 18px;
    left: 35px;
    font-family: "Arial", sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #8f9298;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>

<div class="notebook-page">
  <!-- Top Watermark -->
  <div class="watermark">@田三角要争气呀☀️ | 小红书</div>

  <!-- Binder Holes on Right Edge -->
  <div class="binder-holes">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <!-- Header -->
  <div class="page-header">
    <span class="date-label">Date</span>
  </div>

  <!-- Lined Content -->
  <div class="ruled-content">
    <div class="line">了东南季风，形成强降水。</div>
    <div class="line">(3.) 受台风“烟花”逼近，带来了大量水汽</div>
    <div class="line">(4.) 这次的降水过程中，中小尺度对流反复在伏牛山前地</div>
    <div class="line">区发展并向郑州方向移动，也就形成了“<span class="blue-circle">列车效应</span>”，</div>
    <div class="line">导致降水强度大、维持时间长，引起局地极端降水。</div>
    <div class="line"><span class="blue-tag">△列车效应</span>：指<span class="blue-underline">长时间的降水</span>并不是因为一块稳定不动的</div>
    <div class="line indent">降雨云团造成，而是对流系统反复生成发展，</div>
    <div class="line indent">使很多降水云团<span class="blue-underline">先后经过同一个地方</span>，造成同</div>
    <div class="line indent">一地区出现长时间降水情况。就像列车的</div>
    <div class="line indent">不同车厢先后经过<span class="blue-underline">同一块铁轨</span>一样，这种情</div>
    <div class="line indent">况叫做列车效应。</div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <!-- Brand logo at bottom -->
  <div class="page-footer">Campus</div>
</div>

</body>
</html>
