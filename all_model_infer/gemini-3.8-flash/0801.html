<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loneliness Quote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2e2343;
      color: #caa676;
      font-family: -apple-system, BlinkMacSystemFont, "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Emblem / Logo */
    .emblem-container {
      width: 160px;
      height: 160px;
      margin-bottom: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .emblem-svg {
      width: 100%;
      height: 100%;
    }

    /* English Text Section */
    .en-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin-bottom: 42px;
      opacity: 0.9;
    }

    .star {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      fill: #d8b382;
    }

    .en-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.2px;
      color: #d1b084;
    }

    /* Chinese Text Section */
    .cn-section {
      font-size: 21px;
      line-height: 1.85;
      font-weight: 600;
      letter-spacing: 2px;
      color: #deb98a;
      text-shadow: 0 0 1px rgba(222, 185, 138, 0.2);
    }

    .quote-mark {
      font-family: "Songti SC", "SimSun", serif;
      font-size: 19px;
      vertical-align: top;
      margin-right: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Center Emblem -->
    <div class="emblem-container">
      <svg class="emblem-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Sunburst Arc at top -->
        <path d="M 38 78 A 46 46 0 0 1 122 78" stroke="#caa676" stroke-width="1.2" fill="none" />
        <path d="M 44 78 A 40 40 0 0 1 116 78" stroke="#caa676" stroke-width="0.8" fill="none" />
        <!-- Radial rays -->
        <line x1="43" y1="64" x2="38" y2="60" stroke="#caa676" stroke-width="1.2" />
        <line x1="51" y1="52" x2="46" y2="46" stroke="#caa676" stroke-width="1.2" />
        <line x1="63" y1="43" x2="60" y2="37" stroke="#caa676" stroke-width="1.2" />
        <line x1="77" y1="38" x2="77" y2="32" stroke="#caa676" stroke-width="1.2" />
        <line x1="91" y1="41" x2="94" y2="35" stroke="#caa676" stroke-width="1.2" />
        <line x1="104" y1="49" x2="109" y2="44" stroke="#caa676" stroke-width="1.2" />
        <line x1="113" y1="61" x2="119" y2="57" stroke="#caa676" stroke-width="1.2" />

        <!-- Outer Diamond -->
        <rect x="80" y="27" width="66" height="66" transform="rotate(45 80 27)" stroke="#caa676" stroke-width="1.4" fill="#2e2343" />
        <!-- Inner Diamond -->
        <rect x="80" y="32" width="59" height="59" transform="rotate(45 80 32)" stroke="#caa676" stroke-width="1" />

        <!-- Venus Symbol -->
        <circle cx="80" cy="69" r="13" stroke="#caa676" stroke-width="2" fill="none" />
        <line x1="80" y1="82" x2="80" y2="104" stroke="#caa676" stroke-width="2" />
        <line x1="73" y1="94" x2="87" y2="94" stroke="#caa676" stroke-width="2" />
      </svg>
    </div>

    <!-- English Subtitle with Stars -->
    <div class="en-section">
      <svg class="star" viewBox="0 0 24 24">
        <path d="M12 0 C12 6.6 6.6 12 0 12 C6.6 12 12 17.4 12 24 C12 17.4 17.4 12 24 12 C17.4 12 12 6.6 12 0 Z" />
      </svg>
      <div class="en-text">
        I think the so-called loneliness refers to the person you are facing,<br>
        whose emotions are not on the same frequency as your own.
      </div>
      <svg class="star" viewBox="0 0 24 24">
        <path d="M12 0 C12 6.6 6.6 12 0 12 C6.6 12 12 17.4 12 24 C12 17.4 17.4 12 24 12 C17.4 12 12 6.6 12 0 Z" />
      </svg>
    </div>

    <!-- Chinese Main Text -->
    <div class="cn-section">
      <span class="quote-mark">“</span>我想所谓孤独，<br>
      就是你面对的那个人，<br>
      他的情绪和你自己的情绪，<br>
      不在同一个频率。”
    </div>
  </div>

</body>
</html>
