<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房注意事项</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #5d755c;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
  }

  .card-container {
    background-color: #ffffff;
    width: 100%;
    max-width: 500px;
    padding: 35px 28px 40px 28px;
    position: relative;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }

  .title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #4b6649;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.1);
  }

  .section-header {
    display: flex;
    align-items: center;
    margin-top: 15px;
    margin-bottom: 12px;
  }

  .red-ring {
    width: 20px;
    height: 20px;
    border: 3.5px solid #d82b2b;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 22px;
    font-weight: 900;
    color: #000000;
    letter-spacing: 2px;
    border-bottom: 1.5px solid #333333;
    padding-bottom: 1px;
    line-height: 1.2;
  }

  .list-group {
    list-style: none;
    margin-bottom: 20px;
  }

  .list-item {
    font-size: 15.5px;
    line-height: 2.0;
    color: #1a1a1a;
    letter-spacing: 0.5px;
    font-weight: 500;
  }

  .inline-items {
    display: flex;
    gap: 18px;
  }

  /* Watermark style */
  .watermark {
    position: absolute;
    top: 45%;
    right: 90px;
    display: flex;
    align-items: center;
    opacity: 0.25;
    pointer-events: none;
    user-select: none;
    transform: translateY(-50%);
  }

  .watermark-heart {
    width: 38px;
    height: 38px;
    margin-right: 8px;
    fill: none;
    stroke: #888;
    stroke-width: 2.5;
  }

  .watermark-text {
    font-family: sans-serif;
    color: #777;
    font-size: 13px;
    line-height: 1.3;
    font-weight: bold;
  }

  /* Cat Illustration Placeholder */
  .cat-illustration {
    position: absolute;
    right: 15px;
    bottom: 28px;
    width: 100px;
    height: 135px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="card-container">
  <!-- Title -->
  <h1 class="title">租房注意事项</h1>

  <!-- Watermark -->
  <div class="watermark">
    <svg class="watermark-heart" viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <div class="watermark-text">
      @带毛的栗子<br>
      From 小红书
    </div>
  </div>

  <!-- Cat Graphic -->
  <div class="cat-illustration">
    <svg viewBox="0 0 110 150" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Tail -->
      <path d="M92 90 C108 95, 110 115, 96 118" stroke="#222" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Body -->
      <path d="M30 65 C25 80, 20 110, 26 122 C30 128, 42 127, 44 122 C48 118, 55 118, 58 122 C61 127, 72 128, 76 121 C82 110, 80 85, 70 65" fill="#fff" stroke="#222" stroke-width="2"/>
      <!-- Head -->
      <path d="M30 65 C28 50, 32 38, 40 35 C42 32, 45 35, 52 35 C60 35, 63 32, 65 35 C73 38, 76 50, 72 65" fill="#fff" stroke="#222" stroke-width="2"/>
      <!-- Face details -->
      <ellipse cx="44" cy="46" rx="1.5" ry="1.5" fill="#222"/>
      <ellipse cx="60" cy="46" rx="1.5" ry="1.5" fill="#222"/>
      <path d="M50 49 Q52 52 54 49" stroke="#222" stroke-width="1.5" fill="none"/>
      <!-- Blush -->
      <ellipse cx="41" cy="49" rx="3" ry="1.5" fill="#ffb4b4"/>
      <ellipse cx="63" cy="49" rx="3" ry="1.5" fill="#ffb4b4"/>
      <!-- Headphones band -->
      <path d="M29 45 C28 26, 75 26, 74 45" stroke="#444" stroke-width="2.5" fill="none"/>
      <!-- Earmuffs -->
      <ellipse cx="28" cy="46" rx="4" ry="7" fill="#d82b2b" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="74" cy="46" rx="4" ry="7" fill="#d82b2b" stroke="#222" stroke-width="1.5"/>
      <!-- Arms -->
      <path d="M32 75 C36 78, 42 85, 48 78" stroke="#222" stroke-width="2" fill="#fff"/>
      <path d="M68 75 C64 78, 58 85, 52 78" stroke="#222" stroke-width="2" fill="#fff"/>
      <!-- Device/Object held -->
      <rect x="47" y="74" width="8" height="11" rx="2" fill="#888" stroke="#222" stroke-width="1.5"/>
    </svg>
  </div>

  <!-- Section 1: Bedroom -->
  <div class="section-header">
    <span class="red-ring"></span>
    <span class="section-title">卧室</span>
  </div>
  <ul class="list-group">
    <li class="list-item">1.空调是否正常使用，空调排水位置，外机位置</li>
    <li class="list-item">2.所有电灯，插座是否ok</li>
    <li class="list-item">3.床都否OK，躺下翻身是否有响声</li>
    <li class="list-item">4.卧室地板情况</li>
    <li class="list-item">5.衣柜是否完好</li>
    <li class="list-item">6.各个房间是否能反锁</li>
    <li class="list-item">7.装修情况，不要太新，也不要太久</li>
    <li class="list-item">8.排查针孔摄像头</li>
    <li class="list-item">9.wifi信号情况</li>
  </ul>

  <!-- Section 2: Others -->
  <div class="section-header">
    <span class="red-ring"></span>
    <span class="section-title">其他</span>
  </div>
  <ul class="list-group">
    <li class="list-item inline-items">
      <span>1.各类遥控器清点</span>
      <span>2.所有钥匙清点</span>
    </li>
    <li class="list-item">3.所有墙面情况，有无裂痕掉漆，脱皮</li>
    <li class="list-item">4.所有水龙头一起打开，看水压是否足够</li>
    <li class="list-item">5.如果是燃气热水器，也留意下安全使用情况</li>
  </ul>
</div>

</body>
</html>
