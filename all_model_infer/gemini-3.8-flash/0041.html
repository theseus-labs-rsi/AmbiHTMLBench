<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角形的稳定性</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 40px 20px;
        background-color: #f0f0f0;
        font-family: "SimSun", "STSong", "Songti SC", serif;
        color: #222;
        display: flex;
        justify-content: center;
    }
    .page {
        width: 680px;
        background-color: #fff;
        padding: 50px 60px 40px 60px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: relative;
        font-size: 15px;
        line-height: 1.85;
    }
    p {
        margin: 0 0 12px 0;
        text-indent: 2em;
        text-align: justify;
    }
    .figure-row {
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        margin: 18px 0 6px 0;
    }
    .figure-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .figure-img-placeholder {
        background-color: #f4f6f8;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }
    .caption {
        font-size: 13px;
        margin-top: 6px;
        color: #333;
        font-family: "SimHei", "STHeiti", sans-serif;
    }
    .figure-group-label {
        text-align: center;
        font-size: 13px;
        color: #444;
        margin: 6px 0 16px 0;
        font-family: "Times New Roman", "SimSun", serif;
    }

    /* Exercise Box */
    .exercise-container {
        position: relative;
        margin-top: 28px;
    }
    .exercise-badge {
        position: absolute;
        top: -14px;
        left: 30px;
        background-color: #e69138;
        color: #fff;
        font-family: "SimHei", "STHeiti", sans-serif;
        font-size: 14px;
        font-weight: bold;
        padding: 2px 20px;
        border-radius: 12px;
        z-index: 2;
        letter-spacing: 2px;
    }
    .exercise-box {
        border: 1.5px dashed #e69138;
        border-radius: 16px;
        padding: 24px 20px 16px 20px;
        position: relative;
    }
    .exercise-title {
        font-family: "SimKai", "KaiTi", serif;
        font-size: 15px;
        margin-bottom: 12px;
        text-indent: 0;
    }
    .exercise-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 20px;
        text-align: center;
    }
    .exercise-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
    }
    .shape-svg {
        width: 100px;
        height: 60px;
    }
    .exercise-label {
        font-size: 13px;
        color: #555;
        margin-top: 4px;
        font-family: "Times New Roman", serif;
    }

    /* Footer */
    .footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 35px;
        font-size: 13px;
        color: #333;
        font-family: "SimSun", "STSong", serif;
        gap: 20px;
    }
</style>
</head>
<body>

<div class="page">
    <p>
        还可以发现，斜钉一根木条的四边形木架的形状不会改变. 这是因为斜钉一根木条后，四边形变成两个三角形，由于三角形有稳定性，斜钉一根木条的窗框在未安装好之前也不会变形.
    </p>
    <p>
        三角形的稳定性有广泛的应用，图 11.1-8 表示其中一些例子. 你能再举一些例子吗？
    </p>

    <!-- Figure 11.1-8 -->
    <div class="figure-row">
        <div class="figure-item">
            <div class="figure-img-placeholder" style="width: 220px; height: 110px;">
                <svg width="220" height="110" viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
                    <rect width="220" height="110" fill="#e9eff5"/>
                    <path d="M 10 95 C 60 40 160 40 210 95" stroke="#718096" stroke-width="4" fill="none"/>
                    <line x1="10" y1="95" x2="210" y2="95" stroke="#4a5568" stroke-width="3"/>
                    <line x1="10" y1="35" x2="210" y2="35" stroke="#4a5568" stroke-width="3"/>
                    <!-- Trusses -->
                    <path d="M 20 35 L 40 95 L 60 35 L 80 95 L 100 35 L 120 95 L 140 35 L 160 95 L 180 35 L 200 95" stroke="#4a5568" stroke-width="1.5" fill="none"/>
                    <path d="M 20 95 L 40 35 L 60 95 L 80 35 L 100 95 L 120 35 L 140 95 L 160 35 L 180 95 L 200 35" stroke="#4a5568" stroke-width="1.5" fill="none"/>
                </svg>
            </div>
            <div class="caption">钢架桥</div>
        </div>
        <div class="figure-item">
            <div class="figure-img-placeholder" style="width: 200px; height: 110px;">
                <svg width="200" height="110" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="110" fill="#fdfdfd"/>
                    <!-- Crane base / body -->
                    <rect x="40" y="80" width="55" height="15" fill="#f6ad55" rx="2"/>
                    <circle cx="48" cy="97" r="4" fill="#4a5568"/>
                    <circle cx="60" cy="97" r="4" fill="#4a5568"/>
                    <circle cx="72" cy="97" r="4" fill="#4a5568"/>
                    <circle cx="84" cy="97" r="4" fill="#4a5568"/>
                    <rect x="65" y="70" width="25" height="12" fill="#ed8936"/>
                    <!-- Boom arm (lattice) -->
                    <line x1="75" y1="75" x2="165" y2="15" stroke="#dd6b20" stroke-width="3"/>
                    <line x1="82" y1="78" x2="168" y2="18" stroke="#dd6b20" stroke-width="2"/>
                    <!-- Lattice work -->
                    <path d="M 80 75 L 86 65 L 94 67 L 100 57 L 108 59 L 115 48 L 123 51 L 130 40 L 138 43 L 146 31 L 153 34 L 160 22" stroke="#dd6b20" stroke-width="1" fill="none"/>
                    <!-- Cable & hook -->
                    <line x1="166" y1="17" x2="166" y2="35" stroke="#718096" stroke-width="1.5"/>
                    <circle cx="166" cy="38" r="3" fill="none" stroke="#4a5568" stroke-width="1.5"/>
                </svg>
            </div>
            <div class="caption">起重机</div>
        </div>
    </div>
    <div class="figure-group-label">图 11. 1-8</div>

    <p>
        四边形的不稳定性也有广泛的应用，图 11. 1-9 表示其中一些例子.
    </p>

    <!-- Figure 11.1-9 -->
    <div class="figure-row">
        <div class="figure-item">
            <div class="figure-img-placeholder" style="width: 200px; height: 110px;">
                <svg width="200" height="110" viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="110" fill="#fff"/>
                    <!-- Expandable coat rack (diamonds) -->
                    <g stroke="#d69e2e" stroke-width="6" stroke-linecap="round" opacity="0.9">
                        <!-- Cross slats -->
                        <line x1="30" y1="55" x2="60" y2="15"/>
                        <line x1="60" y1="15" x2="90" y2="55"/>
                        <line x1="90" y1="55" x2="120" y2="15"/>
                        <line x1="120" y1="15" x2="150" y2="55"/>
                        <line x1="150" y1="55" x2="170" y2="30"/>

                        <line x1="30" y1="55" x2="60" y2="95"/>
                        <line x1="60" y1="95" x2="90" y2="55"/>
                        <line x1="90" y1="55" x2="120" y2="95"/>
                        <line x1="120" y1="95" x2="150" y2="55"/>
                        <line x1="150" y1="55" x2="170" y2="80"/>

                        <line x1="15" y1="35" x2="30" y2="55"/>
                        <line x1="15" y1="75" x2="30" y2="55"/>
                    </g>
                    <!-- Pegs -->
                    <circle cx="30" cy="55" r="5" fill="#b7791f"/>
                    <circle cx="60" cy="15" r="5" fill="#b7791f"/>
                    <circle cx="60" cy="95" r="5" fill="#b7791f"/>
                    <circle cx="90" cy="55" r="5" fill="#b7791f"/>
                    <circle cx="120" cy="15" r="5" fill="#b7791f"/>
                    <circle cx="120" cy="95" r="5" fill="#b7791f"/>
                    <circle cx="150" cy="55" r="5" fill="#b7791f"/>
                </svg>
            </div>
            <div class="caption">活动挂架</div>
        </div>
        <div class="figure-item">
            <div class="figure-img-placeholder" style="width: 220px; height: 110px;">
                <svg width="220" height="110" viewBox="0 0 220 110" xmlns="http://www.w3.org/2000/svg">
                    <rect width="220" height="110" fill="#e2e8f0"/>
                    <!-- Retractable folding gate -->
                    <rect x="175" y="20" width="30" height="75" fill="#cbd5e0" stroke="#718096" stroke-width="1.5"/>
                    <rect x="180" y="25" width="20" height="20" fill="#4a5568"/>
                    <!-- Scissors lattice -->
                    <g stroke="#a0aec0" stroke-width="2">
                        <line x1="20" y1="25" x2="50" y2="90"/><line x1="50" y1="25" x2="20" y2="90"/>
                        <line x1="45" y1="25" x2="75" y2="90"/><line x1="75" y1="25" x2="45" y2="90"/>
                        <line x1="70" y1="25" x2="100" y2="90"/><line x1="100" y1="25" x2="70" y2="90"/>
                        <line x1="95" y1="25" x2="125" y2="90"/><line x1="125" y1="25" x2="95" y2="90"/>
                        <line x1="120" y1="25" x2="150" y2="90"/><line x1="150" y1="25" x2="120" y2="90"/>
                        <line x1="145" y1="25" x2="175" y2="90"/><line x1="175" y1="25" x2="145" y2="90"/>
                    </g>
                    <!-- Wheels -->
                    <circle cx="35" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="60" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="85" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="110" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="135" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="160" cy="95" r="3" fill="#2d3748"/>
                    <circle cx="182" cy="97" r="4" fill="#2d3748"/>
                    <circle cx="198" cy="97" r="4" fill="#2d3748"/>
                </svg>
            </div>
            <div class="caption">伸缩门</div>
        </div>
    </div>
    <div class="figure-group-label">图 11. 1-9</div>

    <!-- Exercise Box -->
    <div class="exercise-container">
        <div class="exercise-badge">练习</div>
        <div class="exercise-box">
            <div class="exercise-title">下列图形中哪些具有稳定性？</div>
            <div class="exercise-grid">
                <!-- (1) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 60">
                        <!-- Parallelogram with diagonal -->
                        <polygon points="30,10 85,10 65,50 10,50" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="30" y1="10" x2="65" y2="50" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 1 )</div>
                </div>
                <!-- (2) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 60">
                        <!-- Rectangle divided by vertical line -->
                        <rect x="15" y="10" width="70" height="40" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="50" y1="10" x2="50" y2="50" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 2 )</div>
                </div>
                <!-- (3) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 60">
                        <!-- House shape (pentagon: rectangle + roof triangle) -->
                        <rect x="25" y="24" width="50" height="28" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <polyline points="25,24 50,8 75,24" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 3 )</div>
                </div>
                <!-- (4) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 65">
                        <!-- Pentagon with bracing from top apex to bottom corners -->
                        <polygon points="50,8 85,22 72,58 28,58 15,22" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="50" y1="8" x2="28" y2="58" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="50" y1="8" x2="72" y2="58" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 4 )</div>
                </div>
                <!-- (5) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 65">
                        <!-- Hexagon divided by diagonal -->
                        <polygon points="50,8 85,22 80,55 50,62 20,55 15,22" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="50" y1="8" x2="50" y2="62" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 5 )</div>
                </div>
                <!-- (6) -->
                <div class="exercise-item">
                    <svg class="shape-svg" viewBox="0 0 100 65">
                        <!-- Hexagon with central spoke triangles -->
                        <polygon points="50,8 85,22 80,55 50,62 20,55 15,22" fill="none" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="50" y1="8" x2="50" y2="62" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="15" y1="22" x2="80" y2="55" stroke="#4a5568" stroke-width="1.2"/>
                        <line x1="85" y1="22" x2="20" y2="55" stroke="#4a5568" stroke-width="1.2"/>
                    </svg>
                    <div class="exercise-label">( 6 )</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Footer -->
    <div class="footer">
        <span>第十一章&emsp;三角形</span>
        <span style="font-weight: bold;">7</span>
    </div>
</div>

</body>
</html>
