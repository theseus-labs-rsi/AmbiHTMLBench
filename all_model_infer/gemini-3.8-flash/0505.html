<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京剧艺术节</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Source Han Serif CN", "Noto Serif SC", "Songti SC", "SimSun", serif;
            color: #111;
        }

        .poster {
            width: 540px;
            height: 960px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* --- Right Graphic Area (Geometric & Mask Elements) --- */
        .graphic-layer {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Top Right Icon */
        .brand-icon {
            position: absolute;
            top: 55px;
            right: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .diamond-grid {
            display: grid;
            grid-template-columns: repeat(3, 7px);
            grid-gap: 3px;
            transform: rotate(45deg);
            margin-bottom: 12px;
        }

        .diamond-cell {
            width: 7px;
            height: 7px;
            background-color: #c8161d;
        }

        .diamond-grid .empty {
            background-color: transparent;
        }

        .brand-text {
            font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
            font-size: 15px;
            line-height: 1.4;
            color: #111;
            text-align: center;
        }

        /* Geometric Abstract Face/Shapes */
        .pink-circle-top {
            position: absolute;
            top: 238px;
            right: 135px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #db5976;
        }

        .red-circle-mid {
            position: absolute;
            top: 372px;
            right: 188px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #cc1b21;
        }

        .red-dot-bottom {
            position: absolute;
            top: 668px;
            right: 202px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #c9181e, #961115);
        }

        .red-bar {
            position: absolute;
            top: 492px;
            right: 121px;
            width: 27px;
            height: 270px;
            background-color: #c9161d;
        }

        /* Large SVG for geometric mask & ink mountains */
        .svg-graphics {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }

        /* --- Left Typography Layout --- */
        .content-layer {
            position: relative;
            z-index: 2;
            height: 100%;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-section {
            display: flex;
            align-items: flex-start;
        }

        /* Vertical Role Circles (生 旦 净 末 丑) */
        .roles-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-right: 18px;
        }

        .role-circle {
            width: 44px;
            height: 44px;
            border: 1px solid #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 300;
            line-height: 1;
        }

        .vertical-sub {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 19px;
            letter-spacing: 4px;
            font-weight: 400;
            margin-top: 50px;
            margin-left: 12px;
            color: #111;
        }

        /* Main Big Title (京剧艺术节) */
        .main-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 68px;
            font-weight: 600;
            letter-spacing: 12px;
            line-height: 1;
            margin-top: 2px;
        }

        .title-red {
            color: #cc1b21;
        }

        .title-black {
            color: #111111;
        }

        /* --- Bottom Left Info Block --- */
        .bottom-info {
            margin-bottom: 95px;
        }

        .info-row {
            font-size: 21px;
            line-height: 1.8;
            letter-spacing: 1px;
            color: #111;
        }

        .info-label {
            font-weight: 400;
        }

        .date-section {
            margin: 15px 0 12px 0;
        }

        .date-label {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: -2px;
        }

        .date-display {
            font-family: "Didot", "Bodoni MT", "Times New Roman", serif;
            font-size: 40px;
            font-weight: 500;
            display: flex;
            align-items: baseline;
            color: #000;
        }

        .day-label {
            font-size: 13px;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-weight: 400;
            margin-left: 6px;
            margin-right: 14px;
        }

        .date-slash {
            font-weight: 200;
            margin-right: 14px;
            font-size: 38px;
        }
    </style>
</head>
<body>

<div class="poster">
    <!-- SVG and Graphic Background Elements -->
    <div class="graphic-layer">
        <svg class="svg-graphics" viewBox="0 0 540 960" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f8b6cc"/>
                    <stop offset="60%" stop-color="#ffffff"/>
                </linearGradient>
                <linearGradient id="mountainFade" x1="0" y1="0" x2="0" y2="100%">
                    <stop offset="0%" stop-color="#555555" stop-opacity="0.9"/>
                    <stop offset="70%" stop-color="#888888" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
            </defs>

            <!-- Opera Face Abstract Shapes (Top Right) -->
            <!-- Magenta/Red Angular Patch -->
            <path d="M504 173 L540 137 L540 216 L504 216 Z" fill="#cc0052"/>
            
            <!-- Black Headpiece Angles -->
            <polygon points="419,308 540,177 540,373 480,317" fill="#111111"/>
            <polygon points="351,514 419,450 419,308" fill="#111111"/>
            <polygon points="419,450 351,514 419,514" fill="#111111"/>

            <!-- Pink Gradient Face Base -->
            <polygon points="419,317 480,317 540,373 540,550 419,550" fill="url(#pinkGrad)"/>
            
            <!-- Triangular Nose/Eye Graphic Detail -->
            <polygon points="432,428 474,428 460,455" fill="#f48aa6"/>
            <polygon points="459,437 474,458 460,458" fill="#111111"/>
            <polygon points="518,536 540,558 540,536" fill="#f48aa6"/>

            <!-- Flying Birds Silhouette (Right) -->
            <g fill="#2b2b2b" transform="translate(440, 680) scale(0.9)">
                <!-- Bird 1 -->
                <path d="M72,12 Q80,5 88,14 Q96,5 104,13 Q93,9 88,20 Q84,9 72,12 Z" transform="scale(0.8) translate(0, -10)"/>
                <!-- Bird 2 -->
                <path d="M35,16 Q43,8 52,18 Q60,9 68,17 Q57,13 52,24 Q47,13 35,16 Z" transform="scale(0.7) translate(30, 25)"/>
                <!-- Bird 3 -->
                <path d="M5,42 Q14,35 22,43 Q30,35 37,42 Q28,39 23,49 Q18,39 5,42 Z" transform="scale(0.7) translate(-10, 10)"/>
                <!-- Bird 4 -->
                <path d="M30,52 Q37,46 44,53 Q50,47 57,53 Q49,50 45,58 Q40,50 30,52 Z" transform="scale(0.6) translate(35, 20)"/>
                <!-- Bird 5 -->
                <path d="M60,65 Q66,60 72,66 Q77,61 83,66 Q76,64 73,70 Q69,63 60,65 Z" transform="scale(0.6) translate(25, 45)"/>
                <!-- Bird 6 -->
                <path d="M85,55 Q90,50 96,55 Q101,51 106,56 Q100,54 97,60 Q94,54 85,55 Z" transform="scale(0.5) translate(60, 40)"/>
            </g>

            <!-- Traditional Ink Wash Landscape Mountains at Bottom -->
            <!-- Distant Mist Mountains -->
            <path d="M390 855 Q420 805 450 820 Q485 780 520 825 L540 835 L540 890 L390 890 Z" fill="#b0b5b9" opacity="0.6"/>
            <path d="M420 860 Q460 790 500 810 Q530 790 540 805 L540 920 L400 920 Z" fill="#9ba1a6" opacity="0.6"/>

            <!-- Mid-layer Ink Peaks -->
            <path d="M225 940 Q285 825 320 870 Q350 840 380 890 Q410 880 435 940 Z" fill="#6f7579" opacity="0.85"/>
            <path d="M250 920 Q290 830 330 890 Q365 850 400 930 Z" fill="#585c5f" opacity="0.7"/>

            <!-- Foreground Dark Chinese Ink Mountains -->
            <path d="M-20 980 Q40 950 80 910 Q105 925 125 965 Q170 960 210 980 Q240 960 270 980 L-20 980 Z" fill="#18191b"/>
            <path d="M30 960 Q95 915 120 960 L180 980 L10 980 Z" fill="#0c0d0e"/>

            <!-- Small Winter Trees Silhouette -->
            <g stroke="#262729" stroke-width="1.5" stroke-linecap="round">
                <line x1="358" y1="968" x2="358" y2="945"/>
                <line x1="358" y1="955" x2="351" y2="940"/>
                <line x1="358" y1="952" x2="365" y2="938"/>
                <line x1="351" y1="945" x2="346" y2="935"/>
                <line x1="351" y1="943" x2="355" y2="934"/>
                <line x1="365" y1="945" x2="369" y2="934"/>

                <line x1="375" y1="968" x2="375" y2="940"/>
                <line x1="375" y1="952" x2="369" y2="935"/>
                <line x1="375" y1="948" x2="381" y2="933"/>
                <line x1="369" y1="940" x2="364" y2="930"/>
                <line x1="381" y1="940" x2="386" y2="930"/>
            </g>
        </svg>

        <!-- Red Geometric Grid Icon Top Right -->
        <div class="brand-icon">
            <div class="diamond-grid">
                <div class="diamond-cell"></div>
                <div class="diamond-cell"></div>
                <div class="diamond-cell empty"></div>
                <div class="diamond-cell"></div>
                <div class="diamond-cell"></div>
                <div class="diamond-cell"></div>
                <div class="diamond-cell empty"></div>
                <div class="diamond-cell"></div>
                <div class="diamond-cell"></div>
            </div>
            <div class="brand-text">
                Gao<br>Ding<br>Yi<br>Shu
            </div>
        </div>

        <!-- Solid Geometric Accents -->
        <div class="pink-circle-top"></div>
        <div class="red-circle-mid"></div>
        <div class="red-bar"></div>
        <div class="red-dot-bottom"></div>
    </div>

    <!-- Main Content Layer -->
    <div class="content-layer">
        <!-- Top Section: Roles + Main Title -->
        <div class="top-section">
            <div class="roles-column">
                <div class="role-circle">生</div>
                <div class="role-circle">旦</div>
                <div class="role-circle">净</div>
                <div class="role-circle">末</div>
                <div class="role-circle">丑</div>
                <div class="vertical-sub">稿定艺术展</div>
            </div>

            <div class="main-title">
                <span class="title-red">京剧</span><span class="title-black">艺术节</span>
            </div>
        </div>

        <!-- Bottom Section: Event Info -->
        <div class="bottom-info">
            <div class="info-row">
                <span class="info-label">主办方：稿定集团</span>
            </div>
            <div class="info-row">
                <span class="info-label">地点：厦门市稿定剧院</span>
            </div>

            <div class="date-section">
                <span class="date-label">DATE.</span>
                <div class="date-display">
                    <span>12.20</span>
                    <span class="day-label">SUN</span>
                    <span class="date-slash">/</span>
                    <span>12.30</span>
                    <span class="day-label">SAT</span>
                </div>
            </div>

            <div class="info-row">
                <span class="info-label">联系电话：0592-8888888</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
