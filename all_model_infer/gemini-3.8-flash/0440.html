<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内知名设计工作室的官网</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  .poster {
    width: 540px;
    background-color: #ffffff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Top Bar */
  .header {
    padding: 16px 20px 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .logo-svg {
    height: 38px;
    vertical-align: bottom;
  }

  .logo-text {
    font-size: 20px;
    font-weight: 800;
    color: #000;
  }

  .vol {
    font-size: 14px;
    font-weight: 700;
    position: relative;
    top: -12px;
    margin-left: 2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    border: 2px solid #000;
    padding: 3px 8px;
    background: #fff;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .folder-icon {
    width: 18px;
    height: 14px;
    background: #666;
    border-radius: 2px 2px 0 0;
    position: relative;
    box-shadow: inset 0 2px 0 #aaa;
  }

  .header-line {
    height: 3px;
    background-color: #000;
    margin: 0 18px;
  }

  /* Folder Area */
  .folder-stage {
    position: relative;
    height: 250px;
    margin: 10px 18px 20px 18px;
  }

  /* Folder Component Styles */
  .folder-card {
    position: absolute;
    background: #f2f2f4;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
  }

  .folder-tab {
    position: absolute;
    top: -10px;
    left: 8px;
    width: 44px;
    height: 11px;
    background: #f2f2f4;
    border: 1px solid #d0d0d5;
    border-bottom: none;
    border-radius: 4px 4px 0 0;
  }

  .num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #dedede;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
  }

  /* Folder 1 */
  .f1 {
    top: 50px;
    left: -10px;
    width: 140px;
    height: 95px;
    transform: rotate(40deg);
    padding: 10px 10px;
    justify-content: space-between;
  }
  .f1 .f-title {
    font-size: 22px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
  }
  .f1 .f-sub {
    font-size: 9px;
    font-weight: 800;
    line-height: 1.1;
    text-transform: uppercase;
    width: 75px;
    align-self: flex-end;
    text-align: right;
  }

  /* Folder 2 */
  .f2 {
    top: 15px;
    left: 185px;
    width: 125px;
    height: 85px;
    padding: 12px 10px 8px 10px;
  }
  .f2 .f-title {
    font-size: 19px;
    font-weight: 900;
    color: #000;
    letter-spacing: -0.5px;
  }
  .f2 .f-sub-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .f2 .f-sub-text {
    font-size: 10px;
    font-weight: 900;
    line-height: 1.1;
  }

  /* Folder 3 */
  .f3 {
    top: 35px;
    right: -10px;
    width: 145px;
    height: 95px;
    transform: rotate(-35deg);
    padding: 8px 10px;
  }
  .f3-top {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.1;
  }
  .f3 .f-title {
    font-size: 23px;
    font-weight: 900;
    margin-top: 4px;
    letter-spacing: -0.5px;
  }

  /* Folder 4 */
  .f4 {
    bottom: -5px;
    left: 100px;
    width: 125px;
    height: 80px;
    padding: 10px;
    justify-content: space-between;
  }
  .f4-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .f4 .f-title {
    font-size: 20px;
    font-weight: 900;
  }
  .f4 .f-bottom {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  /* Folder 5 */
  .f5 {
    bottom: -5px;
    right: 95px;
    width: 125px;
    height: 80px;
    padding: 8px 10px;
    justify-content: space-between;
  }
  .f5-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .f5 .f-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }
  .f5-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .f5-bottom .f-sub {
    font-size: 7.5px;
    font-weight: 800;
    line-height: 1.1;
  }
  .f5-bottom .f-big {
    font-size: 22px;
    font-weight: 900;
    line-height: 0.9;
  }

  /* Middle Divider Bar */
  .blue-bar {
    height: 34px;
    background-color: #2737ea;
    width: 100%;
  }

  /* Bottom Cyan Section */
  .bottom-section {
    background-color: #98f5f6;
    padding: 24px 18px 16px 18px;
    display: flex;
    flex-direction: column;
  }

  .huge-title {
    font-size: 46px;
    font-weight: 900;
    color: #000;
    letter-spacing: 2px;
    line-height: 1.15;
    text-align: justify;
    text-align-last: justify;
  }

  .section-divider {
    height: 2.5px;
    background-color: #000;
    margin: 14px 0;
  }

  /* Footer Area */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 10px;
  }

  .footer-left {
    font-size: 14px;
    font-weight: 800;
    color: #000;
    line-height: 1.25;
  }

  .footer-left .row-1 {
    display: flex;
    gap: 30px;
  }

  .footer-center {
    margin-bottom: 2px;
  }

  .triangle-badge {
    width: 28px;
    height: 25px;
  }

  .footer-right {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .barcode {
    width: 145px;
    height: 30px;
  }

  .barcode-text {
    font-size: 7.5px;
    font-weight: 800;
    color: #000;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <!-- Custom Calligraphy Representation for '几点' -->
      <svg class="logo-svg" viewBox="0 0 130 45" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 5 28 C 15 28, 30 5, 45 22 C 52 28, 60 22, 70 20 C 78 18, 85 24, 95 24" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 50 14 L 62 14 M 52 24 L 75 24 M 78 12 L 78 28 M 90 12 L 90 28" stroke="#000" stroke-width="3" stroke-linecap="round"/>
        <circle cx="98" cy="14" r="2" fill="#000"/>
        <circle cx="58" cy="30" r="1.5" fill="#000"/>
        <circle cx="68" cy="30" r="1.5" fill="#000"/>
        <circle cx="78" cy="30" r="1.5" fill="#000"/>
        <circle cx="88" cy="30" r="1.5" fill="#000"/>
      </svg>
      <span class="logo-text">(分享)</span>
      <span class="vol">Vol.07</span>
    </div>
    <div class="header-right">
      <div class="folder-icon"></div>
      <span>Design studio web</span>
    </div>
  </div>

  <div class="header-line"></div>

  <!-- Folder Stage -->
  <div class="folder-stage">
    <!-- Folder 1 -->
    <div class="folder-card f1">
      <div class="folder-tab"></div>
      <div class="f-title">
        <span class="num-badge">1</span>
        <span>ABCD</span>
      </div>
      <div class="f-sub">
        A BLACK<br>COVER DESIGN
      </div>
    </div>

    <!-- Folder 2 -->
    <div class="folder-card f2">
      <div class="folder-tab"></div>
      <div class="f-title">条件反射</div>
      <div class="f-sub-row">
        <span class="num-badge">2</span>
        <div class="f-sub-text">
          REFLEX<br>DESIGN
        </div>
      </div>
    </div>

    <!-- Folder 3 -->
    <div class="folder-card f3">
      <div class="folder-tab"></div>
      <div class="f3-top">
        <div>STUDIO<br>NA.</div>
        <div style="display:flex; align-items:center; gap:4px;">
          <span>EO</span>
          <span class="num-badge">3</span>
        </div>
      </div>
      <div class="f-title">立入禁止</div>
    </div>

    <!-- Folder 4 -->
    <div class="folder-card f4">
      <div class="folder-tab"></div>
      <div class="f4-top">
        <div class="f-title">王志弘</div>
        <span class="num-badge">4</span>
      </div>
      <div class="f-bottom">WANG ZHI HONG</div>
    </div>

    <!-- Folder 5 -->
    <div class="folder-card f5">
      <div class="folder-tab"></div>
      <div class="f5-top">
        <div class="f-title">NICE</div>
        <span class="num-badge">5</span>
      </div>
      <div class="f5-bottom">
        <div class="f-sub">NICE LAB<br>STUDIO</div>
        <div class="f-big">LAB</div>
      </div>
    </div>
  </div>

  <!-- Blue Middle Bar -->
  <div class="blue-bar"></div>

  <!-- Cyan Bottom Section -->
  <div class="bottom-section">
    <div class="huge-title">国内知名设计</div>
    <div class="section-divider"></div>
    <div class="huge-title">工作室的官网</div>
    <div class="section-divider"></div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-left">
        <div class="row-1">
          <span>Copyright© 2023</span>
          <span>(官网)</span>
        </div>
        <div>Jidn share all rights reserved.</div>
      </div>

      <div class="footer-center">
        <!-- Triangle with A icon -->
        <svg class="triangle-badge" viewBox="0 0 32 30">
          <polygon points="16,2 30,27 2,27" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
          <text x="16" y="23" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#000">A</text>
        </svg>
      </div>

      <div class="footer-right">
        <!-- Barcode SVG -->
        <svg class="barcode" viewBox="0 0 150 32" preserveAspectRatio="none">
          <rect x="0" y="0" width="3" height="32" fill="#000"/>
          <rect x="5" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="8" y="0" width="4" height="32" fill="#000"/>
          <rect x="14" y="0" width="2" height="32" fill="#000"/>
          <rect x="18" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="22" y="0" width="5" height="32" fill="#000"/>
          <rect x="29" y="0" width="2" height="32" fill="#000"/>
          <rect x="33" y="0" width="3" height="32" fill="#000"/>
          <rect x="38" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="42" y="0" width="3.5" height="32" fill="#000"/>
          <rect x="48" y="0" width="2" height="32" fill="#000"/>
          <rect x="52" y="0" width="4.5" height="32" fill="#000"/>
          <rect x="59" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="63" y="0" width="3" height="32" fill="#000"/>
          <rect x="68" y="0" width="2" height="32" fill="#000"/>
          <rect x="72" y="0" width="4" height="32" fill="#000"/>
          <rect x="78" y="0" width="2.5" height="32" fill="#000"/>
          <rect x="83" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="87" y="0" width="3.5" height="32" fill="#000"/>
          <rect x="93" y="0" width="2" height="32" fill="#000"/>
          <rect x="97" y="0" width="4" height="32" fill="#000"/>
          <rect x="103" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="107" y="0" width="3" height="32" fill="#000"/>
          <rect x="112" y="0" width="2" height="32" fill="#000"/>
          <rect x="116" y="0" width="4.5" height="32" fill="#000"/>
          <rect x="123" y="0" width="2" height="32" fill="#000"/>
          <rect x="127" y="0" width="3.5" height="32" fill="#000"/>
          <rect x="133" y="0" width="1.5" height="32" fill="#000"/>
          <rect x="137" y="0" width="4" height="32" fill="#000"/>
          <rect x="143" y="0" width="2" height="32" fill="#000"/>
          <rect x="147" y="0" width="3" height="32" fill="#000"/>
        </svg>
        <div class="barcode-text">&lt;&lt;&lt; JIDN SHARE @2023 &gt;&gt;&gt;</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
