<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地球自然篇 (一)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #55cf9e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background-color: #5bb3f6;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.08) 70px, transparent 71px),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      border: 14px solid #55cf9e;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
      padding-bottom: 24px;
    }

    /* Top Header Pill */
    .header-pill-wrapper {
      display: flex;
      justify-content: flex-end;
      padding-top: 18px;
      margin-bottom: 8px;
    }

    .header-pill {
      background-color: #ffd014;
      color: #2b2b2b;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 8px 24px 8px 30px;
      border-top-left-radius: 28px;
      border-bottom-left-radius: 28px;
      box-shadow: -2px 3px 6px rgba(0, 0, 0, 0.1);
    }

    /* Section Items */
    .item-section {
      padding: 16px 20px;
      position: relative;
    }

    .item-section:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.65);
    }

    .card-content {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    /* Poster Placeholders */
    .poster {
      width: 135px;
      height: 188px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      padding: 10px 8px;
      text-align: center;
      position: relative;
    }

    .poster-1 {
      background: linear-gradient(180deg, #164f84 0%, #082954 38%, #03142e 70%, #010814 100%);
    }

    .poster-2 {
      background: radial-gradient(circle at 50% 45%, #2c5980 0%, #0f2b4c 45%, #051329 100%);
    }

    .poster-3 {
      background: linear-gradient(180deg, #1b3844 0%, #30545f 40%, #7d4422 75%, #3d1704 100%);
    }

    .poster-inner-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.95;
    }

    .poster-subtitle {
      font-size: 6px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .poster-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      opacity: 0.85;
      font-style: italic;
    }

    .poster-footer {
      font-size: 6px;
      opacity: 0.65;
      line-height: 1.2;
    }

    /* Detail Right Side */
    .details {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .title-row {
      margin-bottom: 6px;
    }

    .title {
      color: #ffffff;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
      display: inline-block;
      border-bottom: 2px solid rgba(255, 255, 255, 0.9);
      padding-bottom: 2px;
    }

    .meta-info {
      color: #ffffff;
      font-size: 13px;
      margin-top: 4px;
      font-weight: 500;
      line-height: 1.4;
    }

    .rating-value {
      color: #ffd014;
      font-size: 18px;
      font-weight: 800;
      margin-left: 4px;
    }

    .platform {
      color: #ffffff;
      font-size: 13px;
      margin-top: 2px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    /* Description Box */
    .desc-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 12px;
      position: relative;
      border-top: 3.5px solid #ffcf1c;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .desc-label {
      font-size: 13px;
      font-weight: 900;
      color: #1a1a1a;
      white-space: nowrap;
      align-self: center;
    }

    .desc-text {
      font-size: 11.5px;
      color: #333333;
      line-height: 1.45;
      font-weight: 500;
    }

    .highlight {
      color: #eb4d4b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Badge -->
    <div class="header-pill-wrapper">
      <div class="header-pill">地球自然篇 (一)</div>
    </div>

    <!-- Item 1 -->
    <div class="item-section">
      <div class="card-content">
        <figure class="poster poster-1" aria-label="Blue Planet II Poster">
          <div class="poster-inner-title">Blue Planet II<div class="poster-subtitle">A New World of Hidden Depths</div></div>
          <div class="poster-art">[Poster: Ocean & Marine Life]</div>
          <div class="poster-footer">JAMES HONEYBORNE<br>MARK BROWNLOW<br>BBC EARTH</div>
        </figure>
        <div class="details">
          <div class="title-row">
            <h2 class="title">《 蓝色星球2 》</h2>
          </div>
          <div class="meta-info">
            豆瓣评分: <span class="rating-value">9.9</span>
          </div>
          <div class="platform">
            观看平台: 腾 xun 视频
          </div>
          <div class="desc-box">
            <span class="desc-label">简介</span>
            <div class="desc-text">
              <span class="highlight">BBC史上最美</span>纪录片，和孩子一起<br>
              <span class="highlight">探索奇妙、未知的海底世界</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="item-section">
      <div class="card-content">
        <figure class="poster poster-2" aria-label="Planet Earth II Poster">
          <div class="poster-inner-title">Planet Earth II</div>
          <div class="poster-art">[Poster: Earth Globe in Space]</div>
          <div class="poster-footer">BBC EARTH</div>
        </figure>
        <div class="details">
          <div class="title-row">
            <h2 class="title">《 地球脉动 2 》</h2>
          </div>
          <div class="meta-info">
            豆瓣评分: <span class="rating-value">9.9</span>
          </div>
          <div class="platform">
            观看平台: 腾 xun 视频
          </div>
          <div class="desc-box">
            <span class="desc-label">简介</span>
            <div class="desc-text">
              绚丽多彩，属于孩子的第一堂<span class="highlight">自然启蒙</span>课
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Item 3 -->
    <div class="item-section">
      <div class="card-content">
        <figure class="poster poster-3" aria-label="Seven Worlds One Planet Poster">
          <div class="poster-inner-title">BBC<br>Seven Worlds<br>One Planet</div>
          <div class="poster-art">[Poster: Golden Snub-nosed Monkeys]</div>
          <div class="poster-footer">DAVID ATTENBOROUGH</div>
        </figure>
        <div class="details">
          <div class="title-row">
            <h2 class="title">《 七个世界一个星球 》</h2>
          </div>
          <div class="meta-info">
            豆瓣评分: <span class="rating-value">9.7</span>
          </div>
          <div class="platform">
            观看平台: 腾 xun 视频
          </div>
          <div class="desc-box">
            <span class="desc-label">简介</span>
            <div class="desc-text">
              BBC与CCTV联合巨制，用全新的自然视野，<span class="highlight">带给孩子思考与感动</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
