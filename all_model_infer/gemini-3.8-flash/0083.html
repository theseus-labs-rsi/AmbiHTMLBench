<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藝術攝影展 - 瞬息之間</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    .poster {
      background-color: #c4c4c4;
      width: 100%;
      max-width: 680px;
      padding: 40px 35px 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 30px;
    }

    .title-cn {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 2px;
    }

    .title-en {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .header-right {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 2px;
      background-color: #000;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      padding: 35px 0 30px;
      column-gap: 20px;
    }

    .col-left {
      display: flex;
      flex-direction: column;
    }

    .huge-cn-1 {
      font-size: 130px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -4px;
      margin-bottom: 45px;
    }

    .artist-section {
      margin-bottom: 12px;
    }

    .artist-label {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: 1px;
    }

    .artist-names {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: 1px;
    }

    .date {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .en-tagline {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.5px;
      padding-top: 5px;
    }

    .huge-cn-2 {
      font-size: 138px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -6px;
      text-align: right;
    }

    /* Footer Section */
    .quote-section {
      padding: 30px 0 25px;
    }

    .quote-text {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .info-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .info-footer .separator {
      margin: 0 12px;
      font-weight: 400;
    }

    .brand {
      margin-left: 6px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .poster {
        padding: 24px 18px 20px;
      }
      .title-cn {
        font-size: 28px;
      }
      .title-en {
        font-size: 18px;
      }
      .header-right {
        font-size: 16px;
      }
      .huge-cn-1, .huge-cn-2 {
        font-size: 80px;
      }
      .en-tagline {
        font-size: 28px;
      }
      .date {
        font-size: 46px;
      }
      .artist-label, .artist-names {
        font-size: 18px;
      }
      .info-footer {
        font-size: 11px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .brand {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="poster">
    <!-- Top Header -->
    <header class="header">
      <div class="header-left">
        <div class="title-cn">
          藝術<br>攝影展
        </div>
        <div class="title-en">
          ARTIST<br>PHOTO<br>EXHIBITION
        </div>
      </div>
      <div class="header-right">
        定格光影
      </div>
    </header>

    <!-- Top Rule -->
    <div class="divider"></div>

    <!-- Center Typography Grid -->
    <main class="main-content">
      <!-- Left Column -->
      <div class="col-left">
        <div class="huge-cn-1">瞬息</div>
        <div class="artist-section">
          <div class="artist-label">藝術家</div>
          <div class="artist-names">森蘭 王沐春</div>
        </div>
        <div class="date">08/14</div>
      </div>

      <!-- Right Column -->
      <div class="col-right">
        <div class="en-tagline">
          IN THE<br>
          BLINK OF<br>
          AN EYE
        </div>
        <div class="huge-cn-2">之間</div>
      </div>
    </main>

    <!-- Bottom Rule -->
    <div class="divider"></div>

    <!-- Quote -->
    <div class="quote-section">
      <p class="quote-text">
        IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
        YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
        EVERYTHING IN MY MIND AS AN EXERCISE.
      </p>
    </div>

    <!-- Bottom Info -->
    <footer class="info-footer">
      <div>
        <span>活動地址:濱江路西溪街二十七號</span>
        <span class="separator">|</span>
        <span>主辦單位:壹畫咖啡館</span>
        <span class="brand">ONE COFFEE</span>
      </div>
    </footer>
  </div>

</body>
</html>
