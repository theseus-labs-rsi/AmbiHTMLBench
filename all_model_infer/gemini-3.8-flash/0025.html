<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Screenshot</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #ededed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .chat-container {
    width: 100%;
    max-width: 450px;
    background-color: #ebebeb;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .message-row.left {
    flex-direction: row;
  }
  .message-row.right {
    flex-direction: row-reverse;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 4px;
    flex-shrink: 0;
    overflow: hidden;
    background-color: #ccc;
  }
  .avatar-left {
    background: linear-gradient(to bottom, #6d93ba 0%, #a4b9cf 45%, #627b94 65%, #304353 100%);
    position: relative;
  }
  .avatar-left::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: #395066;
  }
  .avatar-right {
    background: #7a543b;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-right-inner {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #e0be9b 20%, #4a2c17 70%);
  }
  .bubble {
    position: relative;
    max-width: 290px;
    padding: 10px 12px;
    font-size: 16px;
    line-height: 1.45;
    color: #111;
    word-break: break-word;
    border-radius: 4px;
  }
  .bubble-left {
    background-color: #ffffff;
  }
  .bubble-left::before {
    content: "";
    position: absolute;
    top: 14px;
    left: -5px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-right: 6px solid #ffffff;
  }
  .bubble-right {
    background-color: #95ec69;
  }
  .bubble-right::before {
    content: "";
    position: absolute;
    top: 14px;
    right: -5px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #95ec69;
  }
  .emoji-num {
    display: inline-block;
    vertical-align: -1px;
    margin-right: 4px;
  }
</style>
</head>
<body>

<div class="chat-container">
  <!-- Message 1 -->
  <div class="message-row left">
    <div class="avatar avatar-left"></div>
    <div class="bubble bubble-left">
      6️⃣ 这个精读的过程可能要重复几遍，好的文献不是读一遍就完事，每读一遍你都会获取新的信息。读第二第三遍的时候，在电脑打开word，开始一遍读一边记录要写进你文献综述的部分，注意要用自己的话重述。
    </div>
  </div>

  <!-- Message 2 -->
  <div class="message-row left">
    <div class="avatar avatar-left"></div>
    <div class="bubble bubble-left">
      7️⃣ 最后将所有文献进行整理引用，把同一小主题的贴在同一段中，也可以加上小标题，使自己的文章更有逻辑，条理更清晰
    </div>
  </div>

  <!-- Message 3 -->
  <div class="message-row left">
    <div class="avatar avatar-left"></div>
    <div class="bubble bubble-left">
      8️⃣ 尽量找出不同论文中矛盾冲突的点，凸显出学术圈思维碰撞的火花，学会用however,on thecontrary,in contrast这类连接词。
    </div>
  </div>

  <!-- Message 4 -->
  <div class="message-row left">
    <div class="avatar avatar-left"></div>
    <div class="bubble bubble-left">
      你重新写吧
    </div>
  </div>

  <!-- Message 5 -->
  <div class="message-row right">
    <div class="avatar avatar-right">
      <div class="avatar-right-inner"></div>
    </div>
    <div class="bubble bubble-right">
      好的，谢谢老师
    </div>
  </div>
</div>

</body>
</html>
