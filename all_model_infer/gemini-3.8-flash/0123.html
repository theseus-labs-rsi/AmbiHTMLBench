<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是好的开始</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "SimSun", serif;
        }

        .notebook-page {
            width: 100%;
            max-width: 580px;
            background-color: #f7f6f2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            padding: 15px 25px 40px 25px;
            box-sizing: border-box;
            position: relative;
        }

        /* Top header section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #333;
            padding-bottom: 4px;
            border-bottom: 2px solid #555;
            margin-bottom: 0px;
        }

        .days-box {
            display: inline-flex;
            border: 1px solid #333;
            border-right: none;
        }

        .day {
            padding: 1px 3px;
            border-right: 1px solid #333;
            font-size: 9px;
            line-height: 1.1;
        }

        .date-box {
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* Ruled lines area */
        .lines-container {
            width: 100%;
        }

        .ruled-line {
            height: 38px;
            border-bottom: 1px solid #777;
            display: flex;
            align-items: flex-end;
            padding-bottom: 2px;
            box-sizing: border-box;
            font-size: 20px;
            font-weight: bold;
            color: #111;
            letter-spacing: 1px;
        }

        .title-line {
            font-size: 24px;
            padding-left: 50px;
            letter-spacing: 3px;
        }

        .content-line {
            padding-left: 35px;
        }

        .blank-line {
            height: 38px;
            border-bottom: 1px solid #777;
        }
    </style>
</head>
<body>

<div class="notebook-page">
    <!-- Header -->
    <div class="header">
        <div class="days-box">
            <div class="day">Tu</div>
            <div class="day">We</div>
            <div class="day">Th</div>
            <div class="day">Fr</div>
            <div class="day">Sa</div>
            <div class="day">Su</div>
        </div>
        <div class="date-box">
            Date.&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/
        </div>
    </div>

    <!-- Notebook Ruled Content -->
    <div class="lines-container">
        <div class="ruled-line title-line">这是好的开始</div>
        <div class="blank-line"></div>
        <div class="ruled-line content-line">从你看到这篇文章开始.</div>
        <div class="ruled-line content-line">你会越来越有钱</div>
        <div class="ruled-line content-line">越来越好看.</div>
        <div class="ruled-line content-line">生活和心态也会越来越好.</div>
        <div class="ruled-line content-line">请相信大数据.</div>
        <div class="ruled-line content-line">是你自己把一切美好的东西.</div>
        <div class="ruled-line content-line">都吸引了过来</div>
        <div class="ruled-line content-line">你已经调到了接收钱的频率</div>
        <div class="ruled-line content-line">接收美的频率.</div>
        <div class="ruled-line content-line">你的能量频率对了才接收到这</div>
        <div class="ruled-line content-line">条信息.</div>
        <div class="ruled-line content-line">留下一句“全收到”</div>
        <div class="ruled-line content-line">愿所有的愿望全能实现！</div>
        <div class="blank-line"></div>
    </div>
</div>

</body>
</html>
