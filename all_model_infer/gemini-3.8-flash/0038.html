<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十一月-任务(必做:支付管理费+拨款)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            color: #1a1a1a;
        }

        th, td {
            border: 1px solid #5b6571;
            padding: 10px 8px;
            vertical-align: middle;
        }

        thead th {
            background-color: #ffffff;
            font-weight: normal;
            color: #000000;
        }

        tbody td {
            background-color: #e2edf7;
        }

        /* Column proportions */
        col.col-seq { width: 8%; }
        col.col-task { width: 22%; }
        col.col-role { width: 14%; }
        col.col-action { width: 27%; }
        col.col-time { width: 13%; }
        col.col-notes { width: 21%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">十一月-任务(必做:支付管理费+拨款)</div>
        <table>
            <colgroup>
                <col class="col-seq">
                <col class="col-task">
                <col class="col-role">
                <col class="col-action">
                <col class="col-time">
                <col class="col-notes">
            </colgroup>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>任务描述</th>
                    <th>岗位</th>
                    <th>操作动作</th>
                    <th>开始时间</th>
                    <th>备注</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>柔性线推进</td>
                    <td>生产</td>
                    <td>申请200w推进</td>
                    <td>11月1日</td>
                    <td>柔性线推进</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>订购原材料</td>
                    <td>采购</td>
                    <td>4份P3+4份P5</td>
                    <td>11月1日</td>
                    <td></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>九月订购的原料入库</td>
                    <td>采购</td>
                    <td>申请资金入库</td>
                    <td>11月1日</td>
                    <td></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>申请贷款</td>
                    <td>财务</td>
                    <td>没钱就申请,有钱就不申请</td>
                    <td>11月1日</td>
                    <td>申请四季短贷</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>生产线预配</td>
                    <td>生产</td>
                    <td>全线开产</td>
                    <td>11月1日</td>
                    <td>收下9月的产品</td>
                </tr>
                <tr>
                    <td>6</td>
                    <td>交货</td>
                    <td>销售</td>
                    <td>交第三个订单</td>
                    <td>11月1日</td>
                    <td></td>
                </tr>
                <tr>
                    <td>7</td>
                    <td>应收账款</td>
                    <td>财务</td>
                    <td>收钱</td>
                    <td>11月</td>
                    <td>尽量不贴现</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
