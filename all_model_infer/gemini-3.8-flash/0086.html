<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTA Slide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #4b6255;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .slide-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at center, #556e60 0%, #3e5246 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .header-banner {
      width: 90%;
      background: linear-gradient(to right, #2b98ab, #52b3c4, #2b98ab);
      padding: 10px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      margin-bottom: 40px;
    }

    .header-banner h1 {
      color: #f7ee28;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
    }

    .content-card {
      background-color: #ffffff;
      width: 78%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 60px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .formula-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
      color: #1e3a8a;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .formula-lhs {
      display: flex;
      align-items: center;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      vertical-align: middle;
      padding: 0 4px;
    }

    .numerator {
      border-bottom: 2.5px solid #1e3a8a;
      padding: 0 8px 4px 8px;
      width: 100%;
    }

    .denominator {
      padding: 4px 8px 0 8px;
      width: 100%;
    }

    .formula-rhs {
      color: #c82333;
      font-weight: bold;
      font-size: 1.3rem;
      margin-left: 20px;
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #1e3a8a;
      font-size: 1.35rem;
      font-weight: bold;
      padding-left: 10%;
    }

    .legend-item {
      display: flex;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .header-banner h1 {
        font-size: 1.3rem;
      }
      .formula-row {
        font-size: 1.1rem;
        gap: 8px;
      }
      .formula-rhs {
        font-size: 1rem;
        margin-left: 10px;
      }
      .legend-list {
        font-size: 0.95rem;
        padding-left: 0;
      }
      .content-card {
        padding: 20px;
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <div class="header-banner">
      <h1>PTA SHOULD BE LESS THAN 40 %</h1>
    </div>

    <div class="content-card">
      <div class="formula-row">
        <div class="formula-lhs">PTA =</div>
        <div class="fraction">
          <div class="numerator">(FT + AD)</div>
          <div class="denominator">CCT</div>
        </div>
        <div class="formula-rhs">&lt; 40%</div>
      </div>

      <div class="legend-list">
        <div class="legend-item">
          <span>FT = flap thickness</span>
        </div>
        <div class="legend-item">
          <span>AD = ablation depth</span>
        </div>
        <div class="legend-item">
          <span>CCT = central corneal thickness</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
