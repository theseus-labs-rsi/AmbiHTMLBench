<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The (Happiness of) Midsummer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      background-color: #fcfbfa;
      width: 100%;
      max-width: 580px;
      padding: 36px 44px 44px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    /* Header Section */
    .header {
      width: 100%;
      text-align: center;
      color: #2b74b8;
    }

    .title-script {
      font-family: "Bickham Script Pro", "Brush Script MT", "Snell Roundhand", "Playfair Display", Georgia, cursive, serif;
      font-style: italic;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 500;
    }

    .title-main {
      font-family: "Didot", "Bodoni MT", "Cinzel", "Playfair Display", "Times New Roman", serif;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.15;
    }

    .title-main sup {
      font-size: 16px;
      font-weight: normal;
      top: -0.4em;
    }

    .sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      margin-top: 14px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #2b74b8;
      letter-spacing: 0.5px;
    }

    /* Photo Container */
    .placeholder {
      width: 100%;
      aspect-ratio: 4 / 4.75;
      background: linear-gradient(180deg, #4b92db 0%, #7dbbf0 45%, #9ec9eb 60%, #30373c 75%, #181d22 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      font-size: 13px;
    }

    .placeholder-content {
      background: rgba(0, 0, 0, 0.45);
      padding: 16px 20px;
      border-radius: 4px;
      max-width: 80%;
      line-height: 1.5;
    }

    /* Footer Section */
    .footer {
      width: 100%;
      text-align: center;
      color: #2b74b8;
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .chinese-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .action-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .quote {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 7.5px;
      line-height: 1.4;
      font-weight: 500;
      opacity: 0.9;
      max-width: 95%;
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Header -->
    <header class="header">
      <div class="title-script">The</div>
      <div class="title-main">(Happiness of)</div>
      <div class="title-main">Midsummer&reg;</div>
      
      <div class="sub-bar">
        <span>MOMENTS</span>
        <span>s/s 2023</span>
      </div>
    </header>

    <!-- Center Image / Non-text Element -->
    <figure class="placeholder">
      <div class="placeholder-content">
        [Photo: Urban overpass cutting across a bright summer sky with dramatic white clouds, traffic lights glowing green with "01 01", and leafy green tree branches along the right side]
      </div>
    </figure>

    <!-- Footer -->
    <footer class="footer">
      <div class="chinese-title">「2023仲夏 正在进行时」</div>
      <div class="action-text">HAVE A GOOD ONE</div>
      <div class="quote">
        Thorough fire! do wander every where, Swifter than the moon's sphere; To dew her orbs<br>
        upon the green: The cowslips tall her pensioners be; in their gold coats spots you see; Farewell, I'll be gone
      </div>
    </footer>
  </main>

</body>
</html>
