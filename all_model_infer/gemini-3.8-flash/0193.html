<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emek Partisi Asgari Ücret Bildirisi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e0e0e0;
      font-family: 'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .poster {
      width: 100%;
      max-width: 500px;
      background-color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Yellow Section */
    .top-section {
      background-color: #F8E737;
      padding: 30px 24px 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .top-left-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 2;
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .pin {
      width: 18px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .bullet-text {
      font-size: 24px;
      line-height: 1.15;
      font-weight: 900;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .top-right-illustration {
      width: 140px;
      height: 140px;
      margin-left: 10px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .illustration-circle {
      width: 130px;
      height: 130px;
      background-color: #DE9343;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Middle White Section */
    .middle-section {
      background-color: #ffffff;
      padding: 24px 24px 16px 24px;
    }

    .headline {
      color: #C62828;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    /* Red Banner Section */
    .banner-section {
      background-color: #C62828;
      padding: 12px 20px;
      display: flex;
      align-items: center;
    }

    .banner-text {
      color: #ffffff;
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Bottom White Section */
    .bottom-section {
      background-color: #ffffff;
      padding: 24px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .party-block {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .emep-logo {
      width: 65px;
      height: 65px;
      flex-shrink: 0;
    }

    .party-info {
      display: flex;
      flex-direction: column;
    }

    .party-name {
      color: #C62828;
      font-size: 26px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .party-sub {
      color: #C62828;
      font-size: 14px;
      font-weight: 800;
      margin-top: 4px;
      letter-spacing: -0.2px;
    }

    /* Social / Contact Footer */
    .footer-contacts {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #C62828;
      font-size: 13px;
      font-weight: 700;
      padding-top: 6px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .social-icon {
      width: 18px;
      height: 18px;
      fill: #C62828;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="poster">
    
    <!-- Top Yellow Section -->
    <div class="top-section">
      <div class="top-left-text">
        <div class="bullet-item">
          <!-- Pushpin Icon -->
          <svg class="pin" viewBox="0 0 24 32">
            <path d="M12 2C8 2 7 5 7 8C7 11 9 12 9 15L8 16C6 17 6 18 6 19L11 19L11 30L13 30L13 19L18 19C18 18 18 17 16 16L15 15C15 12 17 11 17 8C17 5 16 2 12 2Z" fill="#B71C1C"/>
            <ellipse cx="12" cy="7" rx="4" ry="2" fill="#E57373"/>
          </svg>
          <div class="bullet-text">
            Enflasyon<br>yükseliyor
          </div>
        </div>

        <div class="bullet-item">
          <svg class="pin" viewBox="0 0 24 32">
            <path d="M12 2C8 2 7 5 7 8C7 11 9 12 9 15L8 16C6 17 6 18 6 19L11 19L11 30L13 30L13 19L18 19C18 18 18 17 16 16L15 15C15 12 17 11 17 8C17 5 16 2 12 2Z" fill="#B71C1C"/>
            <ellipse cx="12" cy="7" rx="4" ry="2" fill="#E57373"/>
          </svg>
          <div class="bullet-text">
            TL değer<br>kaybediyor
          </div>
        </div>

        <div class="bullet-item">
          <svg class="pin" viewBox="0 0 24 32">
            <path d="M12 2C8 2 7 5 7 8C7 11 9 12 9 15L8 16C6 17 6 18 6 19L11 19L11 30L13 30L13 19L18 19C18 18 18 17 16 16L15 15C15 12 17 11 17 8C17 5 16 2 12 2Z" fill="#B71C1C"/>
            <ellipse cx="12" cy="7" rx="4" ry="2" fill="#E57373"/>
          </svg>
          <div class="bullet-text">
            Ücretler eriyor
          </div>
        </div>
      </div>

      <!-- Graphic Placeholder: Inflation chart, arrow, coin, money -->
      <div class="top-right-illustration">
        <div class="illustration-circle">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- Graph Line / Pencil Arrow -->
            <path d="M 0 35 L 25 50 L 45 35 L 60 52 L 85 20" fill="none" stroke="#B71C1C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <polygon points="85,12 92,26 78,24" fill="#B71C1C"/>
            
            <!-- Diagonal Pencil -->
            <g transform="rotate(-45 30 35)">
              <rect x="18" y="30" width="12" height="34" fill="#C62828"/>
              <polygon points="18,64 30,64 24,74" fill="#E0E0E0"/>
              <polygon points="22,71 26,71 24,74" fill="#212121"/>
              <rect x="18" y="24" width="12" height="6" fill="#F5F5F5"/>
            </g>
            
            <!-- Stack of Money/Gold -->
            <g transform="translate(48, 55)">
              <rect x="0" y="8" width="30" height="18" rx="2" fill="#FDD835" stroke="#E65100" stroke-width="1.5"/>
              <line x1="8" y1="8" x2="8" y2="26" stroke="#ffffff" stroke-width="1.5"/>
              <line x1="22" y1="8" x2="22" y2="26" stroke="#ffffff" stroke-width="1.5"/>
            </g>

            <!-- 1 TL Coin -->
            <g transform="translate(18, 52)">
              <circle cx="15" cy="15" r="14" fill="#FDD835" stroke="#FBC02D" stroke-width="2"/>
              <circle cx="15" cy="15" r="10" fill="#FFF9C4"/>
              <text x="15" y="20" font-size="14" font-weight="900" fill="#C62828" text-anchor="middle" font-family="sans-serif">1</text>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- Middle White Section -->
    <div class="middle-section">
      <div class="headline">
        Vergiden muaf,<br>İnsanca yaşanacak
      </div>
    </div>

    <!-- Red Banner Section -->
    <div class="banner-section">
      <div class="banner-text">
        ASGARİ ÜCRET!
      </div>
    </div>

    <!-- Bottom White Section -->
    <div class="bottom-section">
      <div class="party-block">
        <!-- EMEP Logo SVG -->
        <svg class="emep-logo" viewBox="0 0 100 100">
          <!-- Cogwheel Outer -->
          <path d="M 50 10 L 54 18 L 62 14 L 63 23 L 72 22 L 70 31 L 79 33 L 74 41 L 82 46 L 75 52 L 81 59 L 73 63 L 76 72 L 67 73 L 67 82 L 59 80 L 56 89 L 48 85 L 43 93 L 37 87 L 30 92 L 27 84 L 19 86 L 19 77 L 11 76 L 14 67 L 7 64 L 12 56 L 7 50 L 14 45 L 10 37 L 19 35 L 18 26 L 27 27 L 29 18 L 37 21 L 40 12 Z" fill="#C62828"/>
          <!-- Inner Circle / Globe Grid -->
          <circle cx="50" cy="50" r="28" fill="#FDD835"/>
          <ellipse cx="50" cy="50" rx="14" ry="28" fill="none" stroke="#C62828" stroke-width="1.5"/>
          <line x1="22" y1="50" x2="78" y2="50" stroke="#C62828" stroke-width="1.5"/>
          <line x1="25" y1="36" x2="75" y2="36" stroke="#C62828" stroke-width="1"/>
          <line x1="25" y1="64" x2="75" y2="64" stroke="#C62828" stroke-width="1"/>
          <!-- Red Banner with EMEP -->
          <rect x="18" y="41" width="64" height="18" fill="#B71C1C"/>
          <text x="50" y="55" font-size="13" font-weight="900" fill="#FDD835" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="1">EMEP</text>
        </svg>

        <div class="party-info">
          <div class="party-name">EMEK<br>PARTİSİ</div>
          <div class="party-sub">Ankara İl Örgütü</div>
        </div>
      </div>

      <!-- Social / Contacts -->
      <div class="footer-contacts">
        <!-- Facebook -->
        <div class="contact-item">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M19 3H5C3.89 3 3 3.89 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.89 20.1 3 19 3M18 7H15.5C14.7 7 14 7.7 14 8.5V10.5H17.5L17 13H14V20H11V13H9V10.5H11V8C11 6.3 12.3 5 14 5H18V7Z"/>
          </svg>
          <span>/ankaraemep</span>
        </div>

        <!-- Instagram -->
        <div class="contact-item">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span>@emepankara</span>
        </div>

        <!-- Phone -->
        <div class="contact-item">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.15 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span>0 (312) 232 41 97</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
