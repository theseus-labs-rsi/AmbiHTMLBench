<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家长需要关注什么</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #d1c7b7;
      display: flex;
      justify-content: center;
      padding: 20px 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      color: #333;
    }

    .presentation-container {
      width: 580px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: #000;
      border: 1px solid #1a1a1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .slide {
      position: relative;
      background-color: #f0e6d6;
      height: 290px;
      overflow: hidden;
    }

    /* Seal Stamp */
    .seal {
      position: absolute;
      left: 20px;
      bottom: 12px;
      width: 16px;
      height: 18px;
      border: 1.5px solid #b93a2b;
      color: #b93a2b;
      font-size: 8px;
      line-height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1px;
      font-weight: bold;
      opacity: 0.85;
      letter-spacing: -1px;
    }

    /* Tag styles */
    .tag {
      display: inline-block;
      background: #5b8e89;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 1px 10px;
      border-radius: 10px 10px 10px 2px;
      margin-bottom: 5px;
      transform: scale(0.9);
      transform-origin: left;
    }

    /* SLIDE 1 STYLES */
    .slide-1 {
      display: flex;
      align-items: center;
      background: #e8dcce;
    }

    .slide-1-deer-placeholder {
      position: absolute;
      left: 45px;
      top: 15px;
      width: 190px;
      height: 220px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .deer-svg {
      width: 100%;
      height: 100%;
    }

    .banner-right {
      position: absolute;
      right: 0;
      top: 45px;
      width: 440px;
      height: 135px;
      background: #477b73;
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.15);
      z-index: 1;
      padding-left: 60px;
    }

    .banner-right h1 {
      color: #f7eed9;
      font-family: "STKaiti", "KaiTi", "SimSun", serif;
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: 500;
      margin-bottom: 12px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
    }

    .banner-right .chapter {
      color: #d1e2df;
      font-size: 13px;
      letter-spacing: 6px;
      font-family: "STKaiti", "KaiTi", serif;
    }

    /* SLIDE 2 & 3 COMMON STYLES */
    .content-slide {
      padding: 18px 24px;
      background-color: #f3ede2;
    }

    .inner-frame {
      width: 100%;
      height: 100%;
      border: 1px solid #d5c8b5;
      position: relative;
      display: flex;
      justify-content: space-between;
      padding: 14px 18px;
    }

    .column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .column.left {
      width: 155px;
    }

    .column.right {
      width: 185px;
    }

    .item {
      font-size: 11px;
      line-height: 1.45;
      color: #2b2b2b;
    }

    .item-title {
      font-weight: bold;
      font-size: 11.5px;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .item-sub {
      color: #333;
      font-size: 10.5px;
    }

    .highlight-red {
      color: #be4836;
      font-weight: bold;
    }

    /* Center Circular Window Motif */
    .center-circle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 154px;
      height: 154px;
      border-radius: 50%;
      border: 4px solid #947253;
      box-shadow: inset 0 0 0 2px #d3beaa, 0 0 0 1px rgba(0,0,0,0.05);
      background: #faf7f2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    .lattice-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, #947253 1px, transparent 1px),
        linear-gradient(to bottom, #947253 1px, transparent 1px);
      background-size: 14px 14px;
      opacity: 0.75;
    }

    .lattice-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #faf7f2;
      box-sizing: border-box;
    }

    .vertical-signboard {
      position: relative;
      z-index: 2;
      background: #faf7f2;
      width: 44px;
      height: 100%;
      border-left: 2px solid #5d8e85;
      border-right: 2px solid #5d8e85;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: "STKaiti", "KaiTi", "SimSun", serif;
      font-size: 17px;
      letter-spacing: 5px;
      font-weight: 600;
    }

    .text-green {
      color: #447b72;
    }

    .slide-3 .column.left, .slide-3 .column.right {
      justify-content: space-around;
    }

    .slide-3 .item-bold {
      font-weight: bold;
      font-size: 11.5px;
      color: #1a1a1a;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="presentation-container">

    <!-- SLIDE 1: Title -->
    <div class="slide slide-1">
      <!-- Decorative Deer & Cloud Art Placeholder -->
      <div class="slide-1-deer-placeholder">
        <svg class="deer-svg" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Abstract waves/clouds background -->
          <path d="M-10 190 C40 160, 110 230, 200 170 C160 220, 70 230, -10 210 Z" fill="#4d8276" opacity="0.8" />
          <path d="M20 205 C80 180, 130 220, 190 190 C150 230, 80 235, 20 215 Z" fill="#9ec5ab" opacity="0.7" />
          <path d="M60 215 C100 195, 140 220, 170 205 C140 235, 90 235, 60 220 Z" fill="#ecd599" opacity="0.8" />
          <!-- Deer Silhouette Illustration -->
          <g transform="translate(15, 15)">
            <!-- Antlers -->
            <path d="M95 40 C95 20, 80 5, 82 2 C85 8, 90 15, 98 25 C102 15, 105 8, 108 5 C106 12, 104 22, 102 32 C110 20, 115 15, 120 12 C116 20, 110 30, 105 40 Z" fill="#cfb288" />
            <!-- Head & Neck -->
            <path d="M98 38 C90 40, 75 48, 70 55 C65 60, 68 64, 73 63 C80 62, 85 58, 92 65 C95 72, 95 85, 90 100 C78 108, 68 118, 65 130 C60 148, 75 165, 95 160 C115 155, 130 140, 135 125 C132 110, 122 100, 110 98 C108 85, 108 65, 104 42 Z" fill="#fcf8ed" />
            <!-- Deer Body Marks (Dunhuang Style) -->
            <path d="M88 115 C85 110, 88 105, 92 108 C90 115, 87 118, 88 115 Z" fill="#e06a4b" />
            <path d="M98 112 C95 108, 100 102, 104 107 C100 114, 96 116, 98 112 Z" fill="#4a7c73" />
            <!-- Forelegs (Leaping) -->
            <path d="M78 122 C62 135, 45 150, 32 165 C30 167, 33 169, 36 166 C50 152, 68 138, 82 128 Z" fill="#fcf8ed" />
            <path d="M85 125 C75 145, 65 170, 52 190 C50 193, 53 194, 56 191 C68 172, 80 148, 90 130 Z" fill="#fcf8ed" />
            <!-- Hindlegs -->
            <path d="M125 135 C122 155, 115 175, 95 205 C93 208, 96 210, 99 207 C118 178, 128 155, 132 135 Z" fill="#fcf8ed" />
            <path d="M132 125 C142 140, 150 150, 155 160 C157 162, 159 160, 158 158 C152 148, 142 135, 135 122 Z" fill="#fcf8ed" />
            <!-- Hoof tips color -->
            <path d="M32 165 L36 166 L33 170 Z" fill="#4a7c73"/>
            <path d="M52 190 L56 191 L53 195 Z" fill="#4a7c73"/>
            <path d="M95 205 L99 207 L96 212 Z" fill="#4a7c73"/>
          </g>
        </svg>
      </div>

      <!-- Teal Banner -->
      <div class="banner-right">
        <h1>家长需要关注什么</h1>
        <div class="chapter">章 · 节 · 肆</div>
      </div>

      <div class="seal">家庭<br>教育</div>
    </div>

    <!-- SLIDE 2: 成绩怎么看 -->
    <div class="slide content-slide">
      <div class="inner-frame">
        <!-- Left Column -->
        <div class="column left">
          <div class="item">
            <div class="tag">壹</div>
            <div class="item-title">看单科成绩</div>
            <div class="item-sub">分析优势与劣势科目</div>
          </div>

          <div class="item">
            <div class="tag">贰</div>
            <div class="item-title">看进步</div>
            <div class="item-sub">横向整体水平</div>
            <div class="item-sub">纵向看进退情况</div>
          </div>

          <div class="item">
            <div class="tag">叁</div>
            <div class="item-title">分析错题</div>
          </div>
        </div>

        <!-- Center Motif -->
        <div class="center-circle-container">
          <div class="lattice-pattern"></div>
          <div class="lattice-overlay"></div>
          <div class="vertical-signboard">
            <span class="vertical-text text-green">成绩怎么看</span>
          </div>
        </div>

        <!-- Right Column -->
        <div class="column right">
          <div class="item">
            <div class="tag">肆</div>
            <div class="item-title">分析题错：</div>
            <div class="item-sub">是遗憾丢分？是模糊丢分？</div>
            <div class="item-sub">是不会做丢分？</div>
            <div class="item-sub" style="margin-top: 2px;">
              <span class="highlight-red">策略：</span>消除遗憾、纠正模糊、力争突破
            </div>
          </div>

          <div class="item">
            <div class="tag">伍</div>
            <div class="item-title" style="margin-left: 14px;">分析考试技巧</div>
            <div class="item-sub" style="margin-left: 14px;">策略是否得当？</div>
            <div class="item-sub" style="margin-left: 14px;">是否按标准答题？</div>
            <div class="item-sub" style="margin-left: 14px;">是否摆正心态？</div>
          </div>
        </div>
      </div>

      <div class="seal">家庭<br>教育</div>
    </div>

    <!-- SLIDE 3: 家长五不要 -->
    <div class="slide content-slide slide-3">
      <div class="inner-frame">
        <!-- Left Column -->
        <div class="column left" style="width: 175px;">
          <div class="item">
            <div class="tag">壹</div>
            <div class="item-bold">不要过度焦虑</div>
          </div>

          <div class="item">
            <div class="tag">贰</div>
            <div class="item-bold">不要过度关注孩子</div>
          </div>

          <div class="item">
            <div class="tag">叁</div>
            <div class="item-bold">不要给孩子过高的期望</div>
          </div>
        </div>

        <!-- Center Motif -->
        <div class="center-circle-container">
          <div class="lattice-pattern"></div>
          <div class="lattice-overlay"></div>
          <div class="vertical-signboard">
            <span class="vertical-text text-green">家长五不要</span>
          </div>
        </div>

        <!-- Right Column -->
        <div class="column right" style="width: 175px;">
          <div class="item">
            <div class="tag">肆</div>
            <div class="item-bold">不要过度唠叨</div>
          </div>

          <div class="item" style="margin-top: 15px;">
            <div class="tag">伍</div>
            <div class="item-bold">不要盲目攀比和迷信</div>
          </div>
        </div>
      </div>

      <div class="seal">家庭<br>教育</div>
    </div>

  </div>

</body>
</html>
