<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲线式构图 - 版式设计</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", serif;
      padding: 20px;
    }

    .poster {
      width: 540px;
      height: 720px;
      background-color: #ffffff;
      position: relative;
      padding: 24px 34px 20px 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      height: 40px;
    }

    .header-left .title-cn {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #111;
      line-height: 1.2;
    }

    .header-left .title-en {
      font-size: 8px;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 1px;
      color: #444;
      margin-top: 3px;
    }

    .header-right {
      text-align: right;
    }

    .header-right .category {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #111;
      line-height: 1.2;
    }

    .header-right .date {
      font-size: 9px;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 2px;
      color: #333;
      margin-top: 4px;
    }

    /* Canvas / Main layout body */
    .content-area {
      position: relative;
      flex: 1;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    /* Common box styles */
    .box-yellow {
      background-color: #ffde00;
    }

    .box-black {
      background-color: #0c0c0c;
    }

    /* Top Left Box: 酷 */
    .box-ku {
      position: absolute;
      top: 0;
      left: 0;
      width: 136px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box-ku span {
      font-size: 90px;
      color: #0c0c0c;
      font-weight: 900;
      line-height: 1;
    }

    /* Top Right Box: 酷设而遇 COOLS */
    .box-kueshe {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .box-kueshe .cn {
      color: #ffde00;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .box-kueshe .en {
      color: #ffde00;
      font-size: 32px;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 14px;
      line-height: 1;
      margin-left: 14px;
    }

    /* Bar below 酷 */
    .bar-mid-left {
      position: absolute;
      top: 144px;
      left: 28px;
      width: 75px;
      height: 18px;
    }

    /* Middle Left Box: 构图的重要性 */
    .box-goutu {
      position: absolute;
      top: 184px;
      left: 0;
      width: 136px;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .box-goutu span {
      font-size: 34px;
      font-weight: 900;
      color: #0c0c0c;
      line-height: 1.15;
      letter-spacing: 2px;
    }

    /* Middle Right Box: 酷设 永远 */
    .box-forever {
      position: absolute;
      top: 152px;
      right: 0;
      width: 160px;
      height: 152px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .box-forever span {
      color: #ffde00;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 4px;
      line-height: 1.15;
    }

    /* Lower Left Box: THE IMPORTANCE OF COMPOSITION */
    .box-importance {
      position: absolute;
      top: 328px;
      left: 0;
      width: 136px;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      text-align: center;
    }

    .box-importance span {
      color: #ffde00;
      font-size: 11px;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 2px;
      line-height: 1.4;
      font-weight: 600;
    }

    /* Bar below 酷设永远 */
    .bar-mid-right {
      position: absolute;
      top: 320px;
      right: 32px;
      width: 80px;
      height: 18px;
    }

    /* Box: 在顶点 */
    .box-dingdian {
      position: absolute;
      top: 350px;
      right: 0;
      width: 310px;
      height: 104px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box-dingdian span {
      color: #ffde00;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 6px;
    }

    /* Small yellow bar on lower left */
    .bar-bottom-left {
      position: absolute;
      top: 464px;
      left: 28px;
      width: 70px;
      height: 18px;
    }

    /* Yellow Circle on bottom left */
    .circle-bottom-left {
      position: absolute;
      top: 498px;
      left: 10px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
    }

    /* Right side tiny tags area */
    .tags-container {
      position: absolute;
      top: 464px;
      right: 0;
      width: 310px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }

    .tag-item {
      background-color: #0c0c0c;
      color: #a0a0a0;
      font-size: 6.5px;
      padding: 2px 5px;
      letter-spacing: 0.5px;
    }

    /* Black pill: COOL SET IS ALWAYS AT THE TOP */
    .pill-cool-set {
      position: absolute;
      top: 544px;
      left: 116px;
      background-color: #0c0c0c;
      padding: 4px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pill-cool-set span {
      color: #ffde00;
      font-size: 10px;
      font-family: "Times New Roman", Times, serif;
      letter-spacing: 1.5px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* Yellow square bottom right */
    .box-bottom-right {
      position: absolute;
      top: 532px;
      right: 0;
      width: 72px;
      height: 48px;
    }

    /* Footer Text */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #111;
      letter-spacing: 1px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="poster">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="title-cn">曲线式构图</div>
        <div class="title-en">CURVILINEAR COMPOSITION</div>
      </div>
      <div class="header-right">
        <div class="category">版式设计</div>
        <div class="date">2023 / 6 / 07</div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="content-area">
      <!-- Top Left: 酷 -->
      <div class="box-yellow box-ku">
        <span>酷</span>
      </div>

      <!-- Top Right: 酷设而遇 COOLS -->
      <div class="box-black box-kueshe">
        <div class="cn">酷设而遇</div>
        <div class="en">COOLS</div>
      </div>

      <!-- Small black bar -->
      <div class="box-black bar-mid-left"></div>

      <!-- Middle Left: 构图的重要性 -->
      <div class="box-yellow box-goutu">
        <span>构图的</span>
        <span>重要性</span>
      </div>

      <!-- Middle Right: 酷设永远 -->
      <div class="box-black box-forever">
        <span>酷设</span>
        <span>永远</span>
      </div>

      <!-- Lower Left: THE IMPORTANCE OF COMPOSITION -->
      <div class="box-black box-importance">
        <span>THE IMPORTANCE<br>OF COMPOSITION</span>
      </div>

      <!-- Small black bar below 酷设永远 -->
      <div class="box-black bar-mid-right"></div>

      <!-- Box: 在顶点 -->
      <div class="box-black box-dingdian">
        <span>在顶点</span>
      </div>

      <!-- Bottom Left: Small yellow bar -->
      <div class="box-yellow bar-bottom-left"></div>

      <!-- Bottom Left: Yellow Circle -->
      <div class="box-yellow circle-bottom-left"></div>

      <!-- Tag badges (3 rows) -->
      <div class="tags-container">
        <div class="tag-row">
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以</div>
        </div>
        <div class="tag-row">
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以</div>
        </div>
        <div class="tag-row">
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以是图片</div>
          <div class="tag-item">都可以</div>
        </div>
      </div>

      <!-- Pill: COOL SET IS ALWAYS AT THE TOP -->
      <div class="pill-cool-set">
        <span>COOL SET IS ALWAYS AT THE TOP</span>
      </div>

      <!-- Bottom Right Yellow Box -->
      <div class="box-yellow box-bottom-right"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>我</span>
      <span>/</span>
      <span>看</span>
      <span>/</span>
      <span>不</span>
      <span>/</span>
      <span>懂</span>
      <span>/</span>
      <span>但</span>
      <span>/</span>
      <span>大</span>
      <span>/</span>
      <span>受</span>
      <span>/</span>
      <span>震</span>
      <span>/</span>
      <span>撼</span>
    </div>
  </div>

</body>
</html>
