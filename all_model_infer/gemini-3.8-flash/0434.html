<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作对比</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  }
  .card-container {
    width: 540px;
    max-width: 100%;
    background-color: #fff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Section */
  .top-section {
    background-color: #e8d5b5;
    padding: 40px 30px 0 35px;
    position: relative;
    min-height: 290px;
    overflow: hidden;
  }
  .header-row {
    display: flex;
    align-items: center;
    margin-bottom: 30px;
  }
  .title-text {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #403b57;
  }
  .circle-icon {
    display: inline-block;
    width: 38px;
    height: 38px;
    border: 9px solid #b80d0d;
    border-radius: 50%;
    margin-left: 14px;
    background: transparent;
  }
  .top-body {
    font-size: 20px;
    line-height: 1.6;
    color: #403b57;
    font-weight: 800;
    width: 60%;
  }

  /* Gavin Meme Placeholder */
  .meme-container {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 210px;
    height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .placeholder-figure {
    width: 195px;
    height: 220px;
    background: #403b57;
    border-top-left-radius: 40px;
    border-top-right-radius: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    position: relative;
    text-align: center;
    padding: 10px;
  }
  .placeholder-caption {
    font-size: 13px;
    color: #ccc;
    margin-bottom: auto;
    margin-top: 20px;
  }
  .meme-text {
    position: absolute;
    bottom: 8px;
    right: 5px;
    left: 5px;
    font-size: 23px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
    text-align: center;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* Bottom Section */
  .bottom-section {
    background-color: #423c58;
    padding: 35px 35px 25px 35px;
    color: #f6efe2;
    flex: 1;
  }
  .bottom-section .title-text {
    color: #ffffff;
  }
  .check-icon {
    display: inline-block;
    margin-left: 14px;
    width: 48px;
    height: 38px;
  }
  .check-icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }
  .content-paragraph {
    font-size: 19px;
    line-height: 1.8;
    text-align: justify;
    font-weight: 700;
    margin-top: 18px;
    letter-spacing: 0.8px;
    color: #faeed7;
  }
  .source-citation {
    text-align: right;
    margin-top: 20px;
    font-size: 14px;
    color: #faeed7;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="card-container">
  <!-- Top: 我写的 -->
  <div class="top-section">
    <div class="header-row">
      <span class="title-text">我写的:</span>
      <span class="circle-icon"></span>
    </div>
    <div class="top-body">
      我们民族的追梦史充满<br>
      艰辛。
    </div>
    <!-- Right side illustration / meme -->
    <div class="meme-container">
      <div class="placeholder placeholder-figure">
        <span class="placeholder-caption">[Photo: 假笑男孩 Gavin Thomas]</span>
        <div class="meme-text">学习使我妈快乐</div>
      </div>
    </div>
  </div>

  <!-- Bottom: 人民日报写的 -->
  <div class="bottom-section">
    <div class="header-row">
      <span class="title-text">人民日报写的:</span>
      <span class="check-icon">
        <svg viewBox="0 0 52 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 21L19 35L47 5" stroke="#7ac143" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
    <p class="content-paragraph">
      我们这个民族，有数千年辉煌文明、有数百年深重苦难，也有百余年不息奋斗，追寻梦想的道路尤其艰难曲折。百余年来的救亡图存、道路探索，多少仁人志士留下“有心杀贼，无力回天”的悲愤，付出“春云碧血，秋雨黄花”的牺牲，发出“拼将十万头颅血，须把乾坤力挽回”的呐喊。
    </p>
    <div class="source-citation">
      ——2013.4.1《筑就民族复兴的“中国梦”》
    </div>
  </div>
</div>

</body>
</html>
