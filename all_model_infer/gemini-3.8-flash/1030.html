<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江雪 - 柳宗元</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #f0f0f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimSun", serif;
  }
  .page-container {
    width: 100%;
    max-width: 540px;
    background: linear-gradient(180deg, #fcecee 0%, #fefafe 35%, #ffffff 65%, #f4f3fb 100%);
    position: relative;
    padding: 30px 25px 60px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  /* Decorative Background Mountains (CSS/SVG Shapes) */
  .bg-mountain-left {
    position: absolute;
    bottom: 350px;
    left: -40px;
    width: 200px;
    height: 180px;
    background: linear-gradient(135deg, rgba(240, 220, 230, 0.4) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
  }
  .mountain-ill-left {
    position: absolute;
    top: 250px;
    left: -20px;
    width: 160px;
    height: 220px;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
  }
  .mountain-ill-right {
    position: absolute;
    top: 420px;
    right: -20px;
    width: 180px;
    height: 180px;
    opacity: 0.85;
    z-index: 1;
    pointer-events: none;
  }

  /* Content Wrapper */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Poetry Pinyin + Hanzi Block */
  .char-unit {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    margin: 0 6px;
    vertical-align: bottom;
  }
  .pinyin {
    font-family: Arial, "Helvetica Neue", sans-serif;
    font-size: 14px;
    color: #2b2b2b;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .hanzi {
    font-family: "STKaiti", "KaiTi", "BiauKai", "SimSun", serif;
    font-size: 30px;
    font-weight: 500;
    color: #111;
    line-height: 1.1;
  }
  .punctuation {
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 26px;
    display: inline-block;
    align-self: flex-end;
    margin-bottom: 2px;
    margin-left: 2px;
    margin-right: 6px;
  }

  /* Title Section */
  .title-group {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    margin-bottom: 16px;
  }
  .title-group .pinyin {
    font-size: 15px;
    margin-bottom: 4px;
  }
  .title-group .hanzi {
    font-size: 34px;
    letter-spacing: 2px;
  }
  .title-group .char-unit {
    margin: 0 16px;
  }

  /* Author Section */
  .author-group {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 30px;
  }
  .author-prefix {
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 18px;
    line-height: 1.2;
    margin-right: 4px;
    margin-bottom: 1px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .author-prefix .pinyin {
    font-size: 12px;
    margin-bottom: 3px;
  }
  .author-group .char-unit {
    margin: 0 4px;
  }
  .author-group .pinyin {
    font-size: 12px;
    margin-bottom: 3px;
  }
  .author-group .hanzi {
    font-size: 18px;
  }

  /* Poem Lines */
  .poem-line {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 18px;
  }

  /* Translation Section */
  .translation-container {
    width: 86%;
    margin-top: 14px;
    align-self: center;
  }
  .badge {
    display: inline-block;
    background-color: #a85832;
    color: #ffffff;
    font-family: "STKaiti", "KaiTi", serif;
    font-size: 15px;
    padding: 1px 7px;
    border-radius: 4px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .trans-text {
    font-family: "STKaiti", "KaiTi", "BiauKai", serif;
    font-size: 17px;
    line-height: 1.55;
    color: #222;
    text-align: justify;
    letter-spacing: 0.5px;
  }

  /* Bottom Artwork Area */
  .illustration-area {
    width: 100%;
    margin-top: 35px;
    position: relative;
    height: 120px;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    padding-right: 30px;
  }
  .water-waves {
    position: absolute;
    bottom: 10px;
    left: 20px;
    right: 20px;
    height: 40px;
    background: linear-gradient(90deg, #d8d3f2 0%, #c8c0ec 40%, #dedaf5 80%, transparent 100%);
    border-radius: 20px;
    opacity: 0.6;
    z-index: 1;
  }
  .boat-placeholder {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .boat-caption {
    font-size: 12px;
    color: #7b7393;
    font-family: "STKaiti", "KaiTi", serif;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="page-container">
  <!-- Subtle background art accents -->
  <svg class="mountain-ill-left" viewBox="0 0 200 260" fill="none">
    <path d="M-20 260 L60 80 L110 160 L140 120 L200 260 Z" fill="#e2dcf0" opacity="0.4"/>
    <path d="M-10 260 L45 100 L75 170 L120 260 Z" fill="#2d283e" opacity="0.65"/>
    <path d="M20 160 L45 100 L80 170 L60 260 Z" fill="#ffffff" opacity="0.8"/>
  </svg>

  <svg class="mountain-ill-right" viewBox="0 0 220 200" fill="none">
    <path d="M0 200 L90 70 L150 140 L220 200 Z" fill="#e8e4f4" opacity="0.5"/>
    <path d="M40 200 L110 85 L160 150 L220 200 Z" fill="#4a4259" opacity="0.75"/>
    <path d="M80 140 L110 85 L145 145 L130 200 Z" fill="#ffffff" opacity="0.85"/>
  </svg>

  <div class="content">
    <!-- Title -->
    <div class="title-group">
      <div class="char-unit">
        <span class="pinyin">jiāng</span>
        <span class="hanzi">江</span>
      </div>
      <div class="char-unit">
        <span class="pinyin">xuě</span>
        <span class="hanzi">雪</span>
      </div>
    </div>

    <!-- Author -->
    <div class="author-group">
      <div class="author-prefix">
        <span class="pinyin">táng</span>
        <span>[唐]</span>
      </div>
      <div class="char-unit">
        <span class="pinyin">liǔ</span>
        <span class="hanzi">柳</span>
      </div>
      <div class="char-unit">
        <span class="pinyin">zōng</span>
        <span class="hanzi">宗</span>
      </div>
      <div class="char-unit">
        <span class="pinyin">yuán</span>
        <span class="hanzi">元</span>
      </div>
    </div>

    <!-- Poem Line 1 -->
    <div class="poem-line">
      <div class="char-unit"><span class="pinyin">qiān</span><span class="hanzi">千</span></div>
      <div class="char-unit"><span class="pinyin">shān</span><span class="hanzi">山</span></div>
      <div class="char-unit"><span class="pinyin">niǎo</span><span class="hanzi">鸟</span></div>
      <div class="char-unit"><span class="pinyin">fēi</span><span class="hanzi">飞</span></div>
      <div class="char-unit"><span class="pinyin">jué</span><span class="hanzi">绝</span></div>
      <span class="punctuation">，</span>
    </div>

    <!-- Poem Line 2 -->
    <div class="poem-line">
      <div class="char-unit"><span class="pinyin">wàn</span><span class="hanzi">万</span></div>
      <div class="char-unit"><span class="pinyin">jìng</span><span class="hanzi">径</span></div>
      <div class="char-unit"><span class="pinyin">rén</span><span class="hanzi">人</span></div>
      <div class="char-unit"><span class="pinyin">zōng</span><span class="hanzi">踪</span></div>
      <div class="char-unit"><span class="pinyin">miè</span><span class="hanzi">灭</span></div>
      <span class="punctuation">。</span>
    </div>

    <!-- Poem Line 3 -->
    <div class="poem-line">
      <div class="char-unit"><span class="pinyin">gū</span><span class="hanzi">孤</span></div>
      <div class="char-unit"><span class="pinyin">zhōu</span><span class="hanzi">舟</span></div>
      <div class="char-unit"><span class="pinyin">suō</span><span class="hanzi">蓑</span></div>
      <div class="char-unit"><span class="pinyin">lì</span><span class="hanzi">笠</span></div>
      <div class="char-unit"><span class="pinyin">wēng</span><span class="hanzi">翁</span></div>
      <span class="punctuation">，</span>
    </div>

    <!-- Poem Line 4 -->
    <div class="poem-line">
      <div class="char-unit"><span class="pinyin">dú</span><span class="hanzi">独</span></div>
      <div class="char-unit"><span class="pinyin">diào</span><span class="hanzi">钓</span></div>
      <div class="char-unit"><span class="pinyin">hán</span><span class="hanzi">寒</span></div>
      <div class="char-unit"><span class="pinyin">jiāng</span><span class="hanzi">江</span></div>
      <div class="char-unit"><span class="pinyin">xuě</span><span class="hanzi">雪</span></div>
      <span class="punctuation">。</span>
    </div>

    <!-- Translation Block -->
    <div class="translation-container">
      <span class="badge">译文:</span>
      <p class="trans-text">
        群山之间，没有一只鸟儿飞过。纵横的小路上，看不到行人的踪迹。只有一位身披蓑衣、头戴笠帽的渔翁，架着小船，冒着风雪，在寒冷的江上独自垂钓。
      </p>
    </div>

    <!-- Bottom Illustration -->
    <div class="illustration-area">
      <div class="water-waves"></div>
      <figure class="placeholder boat-placeholder">
        <svg width="150" height="70" viewBox="0 0 150 70">
          <!-- Fishing Rod Line -->
          <path d="M 25 15 Q 60 5 95 25" stroke="#5c4e4e" stroke-width="1.2" fill="none"/>
          <line x1="25" y1="15" x2="25" y2="45" stroke="#8c8282" stroke-width="0.8"/>
          <!-- Fisherman -->
          <circle cx="103" cy="22" r="5" fill="#f5c7b3"/>
          <path d="M 94 20 L 112 20 L 103 14 Z" fill="#c46a62"/>
          <path d="M 97 26 C 94 30, 93 42, 107 40 C 113 40, 114 30, 107 26 Z" fill="#87535c"/>
          <!-- Boat -->
          <path d="M 40 45 L 135 45 L 122 58 L 55 58 Z" fill="#694d4d"/>
          <!-- Snow highlights -->
          <ellipse cx="106" cy="40" rx="3" ry="2" fill="#fff"/>
          <ellipse cx="65" cy="46" rx="6" ry="1.5" fill="#fff" opacity="0.8"/>
          <ellipse cx="120" cy="46" rx="5" ry="1.5" fill="#fff" opacity="0.8"/>
        </svg>
        <figcaption class="boat-caption">[插图：孤舟蓑笠翁]</figcaption>
      </figure>
    </div>
  </div>
</div>

</body>
</html>
