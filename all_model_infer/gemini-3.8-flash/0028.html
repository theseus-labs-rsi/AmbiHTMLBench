<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都自由行美食推荐</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #faf6eb;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", -apple-system, sans-serif;
  }

  .container {
    width: 100%;
    max-width: 520px;
    padding: 40px 30px 60px 35px;
    box-sizing: border-box;
  }

  /* Header Section */
  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  .main-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #1a1a1a;
    margin: 0 0 8px 0;
    line-height: 1.2;
    font-family: "Impact", "SimHei", "Microsoft YaHei", sans-serif;
  }

  .sub-title {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 2px;
    margin: 0;
  }

  /* Section Styles */
  .section {
    margin-top: 22px;
  }

  .category-badge {
    display: inline-block;
    background-color: #fce881;
    color: #1a1a1a;
    font-size: 19px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 12px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }

  /* Item List Styles */
  .item-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .item {
    font-size: 16.5px;
    line-height: 1.4;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .item-name {
    color: #9c2d2a;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }

  .item-address {
    color: #222222;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Top Header -->
  <header class="header">
    <h1 class="main-title">成都自由行美食推荐</h1>
    <div class="sub-title">第一次来成都旅游必备手册！</div>
  </header>

  <!-- Section 1: 火锅 -->
  <section class="section">
    <div class="category-badge">来成都必吃火锅:</div>
    <div class="item-list">
      <div class="item">
        <span class="item-name">【楠火锅】</span>
        <span class="item-address">下东大街166号</span>
      </div>
      <div class="item">
        <span class="item-name">【天星正源火锅】</span>
        <span class="item-address">成华区地勘路1号附48</span>
      </div>
      <div class="item">
        <span class="item-name">【罗二火锅】</span>
        <span class="item-address">蓥华寺街34号</span>
      </div>
      <div class="item">
        <span class="item-name">【青年火锅】</span>
        <span class="item-address">白云街2号附6</span>
      </div>
      <div class="item">
        <span class="item-name">【五里关老火锅】</span>
        <span class="item-address">小关庙街45号附12号</span>
      </div>
      <div class="item">
        <span class="item-name">【巷巷火锅】</span>
        <span class="item-address">北书院街72号</span>
      </div>
    </div>
  </section>

  <!-- Section 2: 川菜 -->
  <section class="section">
    <div class="category-badge">来成都必吃川菜:</div>
    <div class="item-list">
      <div class="item">
        <span class="item-name">【明婷饭店】</span>
        <span class="item-address">外曹家巷26号附15号</span>
      </div>
      <div class="item">
        <span class="item-name">【回水镇】</span>
        <span class="item-address">建设路53号附13</span>
      </div>
      <div class="item">
        <span class="item-name">【陶德砂锅】</span>
        <span class="item-address">二环路东二段7号附24号</span>
      </div>
      <div class="item">
        <span class="item-name">【鸡毛店】</span>
        <span class="item-address">华油路6号</span>
      </div>
    </div>
  </section>

  <!-- Section 3: 小吃 -->
  <section class="section">
    <div class="category-badge">来成都必吃小吃:</div>
    <div class="item-list">
      <div class="item">
        <span class="item-name">【龙抄手】</span>
        <span class="item-address">春熙路中山广场东侧城守街63号</span>
      </div>
      <div class="item">
        <span class="item-name">【钟水饺】</span>
        <span class="item-address">建设路53号胡同文化音体商场</span>
      </div>
      <div class="item">
        <span class="item-name">【洞子口陈氏凉粉】</span>
        <span class="item-address">福德路42号</span>
      </div>
    </div>
  </section>
</div>

</body>
</html>
