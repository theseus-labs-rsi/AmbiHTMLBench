<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头孢菌素分类</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #175844;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 800px;
    background-color: #175844;
  }
  .title-bar {
    color: #e2f845;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .star {
    font-size: 24px;
    line-height: 1;
  }
  
  /* Tables */
  table {
    border-collapse: collapse;
    width: 100%;
    color: #ffffff;
    font-size: 16px;
  }
  th, td {
    border: 1.5px solid #a8c7b8;
    padding: 6px 8px;
    text-align: center;
    vertical-align: middle;
  }
  .top-table td.content-col {
    text-align: left;
    line-height: 1.5;
  }
  
  /* Handwritten/Highlighted Annotations */
  .mark {
    color: #ffffff;
    position: relative;
    display: inline-block;
  }
  .mark::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 0;
    right: 0;
    height: 3px;
    background-color: #d8ee34;
    border-radius: 2px;
  }
  .circle-mark {
    display: inline-block;
    border: 2px solid #d8ee34;
    border-radius: 50%;
    padding: 1px 3px;
    line-height: 1;
  }

  /* Bottom Split Layout */
  .bottom-section {
    display: flex;
    margin-top: 4px;
    border-top: 1.5px solid #a8c7b8;
  }
  .bottom-left {
    flex: 6.5;
  }
  .bottom-left table {
    height: 100%;
  }
  .bottom-left td.header-row {
    background: transparent;
    font-weight: normal;
  }
  .bottom-left td.mnemonic-text {
    text-align: left;
    padding-left: 10px;
  }
  .bottom-right {
    flex: 3.5;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    border-left: 1.5px solid #a8c7b8;
    background: #2b5e4e;
  }
  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #ffffff;
    color: #333333;
    font-size: 11px;
    border: 1px solid #a8c7b8;
    overflow: hidden;
    text-align: center;
    padding: 4px;
  }
  .placeholder-img {
    background-color: #eaeaea;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Title -->
  <div class="title-bar">
    <span>1.头孢菌素分类</span>
    <span class="star">☆</span>
  </div>

  <!-- Top Table -->
  <table class="top-table">
    <tbody>
      <tr>
        <td rowspan="4" style="width: 15%; font-size: 18px; line-height: 1.4;">
          头孢<br>菌素类
        </td>
        <td style="width: 15%;">第一代</td>
        <td class="content-col">
          头孢<span class="mark">唑</span>林、氨<span class="mark">苄</span>、羟氨<span class="mark">苄</span>、拉<span class="mark">定</span>、硫<span class="mark">眯</span>、噻<span class="mark">吩</span>
        </td>
      </tr>
      <tr>
        <td>第二代</td>
        <td class="content-col">
          头孢<span class="mark">呋</span>辛、<span class="mark">孟</span>多、<span class="mark">替</span>安、<span class="mark">克</span>洛、<span class="mark">丙</span>烯
        </td>
      </tr>
      <tr>
        <td>
          第<span class="circle-mark">三</span>代
        </td>
        <td class="content-col">
          头孢<span class="mark">他</span>啶、<span class="mark">他</span>美、<span class="mark">匹</span>胺、<span class="mark">哌</span>酮、<span class="mark">曲</span>松、噻<span class="mark">肟</span>、<br>
          克肟、唑肟、甲肟、泊肟、<span class="circle-mark">地</span>尼
        </td>
      </tr>
      <tr>
        <td>第四代</td>
        <td class="content-col">
          头孢<span class="mark">匹罗</span>、<span class="mark">吡</span>肟
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Bottom Section -->
  <div class="bottom-section">
    <!-- Left Table -->
    <div class="bottom-left">
      <table>
        <tbody>
          <tr>
            <td colspan="2" class="header-row" style="text-align: center; font-size: 17px;">记忆一下</td>
          </tr>
          <tr>
            <td style="width: 23%; color: #d8ee34;">第一代</td>
            <td class="mnemonic-text">
              一头坐便拉定，米<span class="mark">粉</span>吃多了
            </td>
          </tr>
          <tr>
            <td style="color: #d8ee34;">第二代</td>
            <td class="mnemonic-text">
              二<span class="mark">呋孟</span>多，替俺克丙
            </td>
          </tr>
          <tr>
            <td style="color: #d8ee34;">第三代</td>
            <td class="mnemonic-text">
              他胺哌曲肟三妹<span class="mark">地</span>
            </td>
          </tr>
          <tr>
            <td style="color: #d8ee34;">第四代</td>
            <td class="mnemonic-text">
              四<span class="mark">匹罗</span>子吡肟牛
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Right Image Grid Placeholders -->
    <div class="bottom-right">
      <div class="placeholder placeholder-img" title="拉肚子找马桶插图">
        [插图: 急找马桶]
      </div>
      <div class="placeholder placeholder-img" title="吃撑/捂肚子剧照">
        [配图: 影视剧照]
      </div>
      <div class="placeholder placeholder-img" title="结婚新郎抱新娘插图">
        [插图: 结婚抱妹]
      </div>
      <div class="placeholder placeholder-img" title="骡子/驴卡通插图">
        [插图: 骡子骑乘]
      </div>
    </div>
  </div>
</div>

</body>
</html>
