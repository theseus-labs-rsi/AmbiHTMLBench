<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四、类比推理</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background-color: #ffffff;
    color: #434c2b;
    margin: 0;
    padding: 24px 20px;
    font-size: 15px;
    line-height: 1.6;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
  }

  /* Title Box */
  .title-box {
    display: inline-block;
    border: 1.5px solid #829864;
    background-color: #f7f9f2;
    color: #4b6228;
    font-size: 18px;
    font-weight: bold;
    padding: 3px 14px;
    margin-bottom: 20px;
  }

  /* Section Title */
  .section-title {
    display: flex;
    align-items: center;
    font-weight: bold;
    font-size: 15px;
    color: #4a5c21;
    margin-top: 14px;
    margin-bottom: 3px;
  }

  .badge {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    background-color: #3b73af;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    width: 17px;
    height: 17px;
    border-radius: 4px;
    margin-right: 4px;
    flex-shrink: 0;
  }

  /* Content rows */
  .content-row {
    padding-left: 2px;
    margin-bottom: 3px;
  }

  .flex-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .highlight-green {
    color: #4a5c21;
    font-weight: bold;
  }

  .indent-sub {
    margin-left: 14px;
  }

  .hand-pointer {
    display: inline-block;
    margin-right: 2px;
  }

  .col-right {
    margin-left: auto;
    padding-left: 15px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 标题 -->
  <div class="title-box">
    四、类比推理
  </div>

  <!-- 1 语义关系 -->
  <div class="section-title">
    <span class="badge">1</span>语义关系
  </div>
  <div class="content-row">
    ①近反义词②比喻象征
  </div>
  <div class="content-row">
    ③谦词，敬词，语体色彩（褒义词，贬义词）
  </div>

  <!-- 2 逻辑关系 -->
  <div class="section-title" style="margin-top: 18px;">
    <span class="badge">2</span>逻辑关系
  </div>
  <div class="content-row">
    ①并列关系②矛盾关系（非此即彼）③反对关系（存在小三）
  </div>
  <div class="content-row flex-row" style="margin-top: 12px; margin-bottom: 12px;">
    <div>
      <span class="hand-pointer">👉</span>二级辨析：同一范畴
    </div>
    <div class="col-right highlight-green" style="padding-right: 90px;">
      并列+对应考察
    </div>
  </div>

  <!-- 3 包容关系 -->
  <div class="section-title">
    <span class="badge">3</span>包容关系
  </div>
  <div class="content-row">
    种属：①...是... ②特指
  </div>
  <div class="content-row">
    ③...不是...
  </div>
  <div class="content-row flex-row">
    <div>
      ④主要/次要，必然/或然
    </div>
    <div class="col-right highlight-green" style="padding-right: 125px;">
      组成：零部件
    </div>
  </div>

  <!-- 4 交叉关系 -->
  <div class="section-title" style="margin-top: 16px;">
    <span class="badge">4</span>交叉关系：
  </div>
  <div class="content-row">
    从不同角度描述同一事物，有交集，用有的是有的不是造句
  </div>

  <!-- 5 对应关系 -->
  <div class="section-title" style="margin-top: 16px;">
    <span class="badge">5</span>对应关系
  </div>
  <div class="content-row indent-sub">
    1.材料
  </div>
  <div class="content-row indent-sub">
    2.工艺，二级辨析：物理化学变化，是否有新生物质生成
  </div>
  <div class="content-row indent-sub">
    3.功能：主要/次要
  </div>
  <div class="content-row indent-sub">
    4.属性：必然/或然
  </div>
  <div class="content-row indent-sub">
    5.时间顺序
  </div>
  <div class="content-row flex-row" style="margin-top: 4px;">
    <div>
      <span class="hand-pointer">👉</span>二级辨析：行为发出主体
    </div>
    <div class="col-right highlight-green" style="padding-right: 70px;">
      必要条件、因果
    </div>
  </div>

  <!-- 6 语法关系 -->
  <div class="section-title" style="margin-top: 16px;">
    <span class="badge">6</span>语法关系
  </div>
  <div class="content-row">
    主谓/主宾/动宾
  </div>
</div>

</body>
</html>
