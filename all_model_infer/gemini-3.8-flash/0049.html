<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易被忽视的养生小动作</title>
<style>
  body {
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
    font-family: "SimSun", "Songti SC", "STSong", serif;
  }
  .newspaper-column {
    background-color: #d8d8d6;
    background-image: radial-gradient(#ccc 10%, transparent 11%);
    background-size: 3px 3px;
    width: 280px;
    padding: 16px 14px 24px 14px;
    box-sizing: border-box;
    border-right: 2px solid #222;
    color: #1a1a1a;
  }
  h1 {
    font-size: 23px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 2px;
    margin: 0 0 14px 0;
    line-height: 1.2;
    transform: scaleY(1.1);
  }
  p {
    font-size: 17.5px;
    line-height: 1.32;
    text-align: justify;
    text-justify: inter-ideograph;
    margin: 0 0 10px 0;
    text-indent: 2em;
    letter-spacing: -0.2px;
    word-break: break-all;
  }
  .bold-title {
    font-weight: bold;
    font-family: "SimHei", "STHeiti", sans-serif;
    letter-spacing: 1px;
    margin-right: 0.6em;
  }
</style>

<body>

<div class="newspaper-column">
  <h1>易被忽视的养生小动作</h1>
  <p><span class="bold-title">梳头</span>梳头是脑部运动最理想的项目,它可以刺激穴位,增强分泌活动,改善血液循环,促进新陈代谢。此外,梳头还是治疗失眠、眩晕、心悸、中风后遗症和青少年白发的辅助手段。平时每天可梳头3至5次,每次不少于3至5分钟,其中晚上睡前必须要梳一次。</p>
  <p><span class="bold-title">伸懒腰</span>伸懒腰会使人体的脏器对心、肺产生挤压。持续几秒钟的伸懒腰,使很多淤积的血液被赶回心脏,改善血液循环,使更多的含氧量的血液供给大脑,还可带走肌肉的一些废物,从而消除人体的疲劳。</p>
</div>

</body>
