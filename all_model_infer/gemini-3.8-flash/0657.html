<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专四写作规律</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    color: #1a1a1a;
    display: flex;
    justify-content: center;
    padding: 10px 16px 40px;
  }
  .container {
    width: 100%;
    max-width: 600px;
  }
  /* Top Navigation Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 16px;
    border-bottom: 1px solid #f0f0f0;
    margin-bottom: 24px;
    color: #333;
  }
  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top-bar-left .title-edit {
    font-size: 18px;
    font-weight: 500;
  }
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .icon-btn {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .page-box {
    border: 1.5px solid #333;
    border-radius: 3px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  /* Big Pop Titles */
  .section-title {
    text-align: center;
    margin: 20px 0 14px;
  }
  .pop-text {
    display: inline-block;
    font-size: 32px;
    font-weight: 900;
    color: #fcf18d;
    -webkit-text-stroke: 1.8px #111;
    text-shadow: 
      2.5px 2.5px 0px #111,
      -1px -1px 0 #111,
      1px -1px 0 #111,
      -1px 1px 0 #111,
      0px 3px 0 #111;
    letter-spacing: 2px;
  }

  /* Badge Labels */
  .badge-container {
    text-align: center;
    margin-bottom: 12px;
  }
  .badge {
    display: inline-block;
    background-color: #c8d8b1;
    color: #1a2810;
    font-size: 13px;
    font-weight: bold;
    padding: 3px 12px;
    border-radius: 4px;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: center;
    margin-bottom: 24px;
  }
  th {
    border-top: 2px solid #222;
    border-bottom: 1.5px solid #222;
    padding: 8px 4px;
    font-weight: bold;
    color: #000;
  }
  td {
    padding: 7.5px 4px;
    border-bottom: 1px solid #e2e2e2;
    color: #222;
    vertical-align: middle;
  }
  .table-main tr td:nth-child(2) {
    text-align: center;
  }
  
  /* Annotations & Highlights */
  .orange-dashed {
    display: inline-block;
    border: 2px dashed #f38656;
    border-radius: 12px;
    padding: 1px 6px;
    font-weight: bold;
    color: #333;
  }
  .highlight-tag {
    display: inline-block;
    background-color: #f7dedc;
    color: #4a2825;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .underlined-text {
    border-bottom: 1.5px solid #d96969;
    padding-bottom: 1px;
    display: inline-block;
  }

  /* Bracket Column */
  .bracket-cell {
    border-bottom: none;
    padding: 0;
    width: 14px;
    position: relative;
  }
  .curly-brace {
    width: 12px;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .curly-brace svg {
    width: 10px;
    height: 90%;
  }

  /* Table 2 Styles */
  .table-pred {
    border-bottom: 2px solid #222;
  }
  .table-pred th, .table-pred td {
    padding: 9px 8px;
  }
  .table-pred td:first-child {
    font-weight: bold;
    text-align: left;
    width: 20%;
  }
  .table-pred td:nth-child(2) {
    text-align: left;
    width: 40%;
  }
  .table-pred td:nth-child(3) {
    text-align: left;
    width: 40%;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Top App Navigation -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="title-edit">编辑</span>
      <span class="icon-btn">
        <!-- Cloud Sync Icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8">
          <path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" />
          <path d="M9 13.5l2 2 4-4" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
    <div class="top-bar-right">
      <span class="icon-btn">
        <!-- Grid/Squares Icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
      </span>
      <div class="page-box">1</div>
      <span class="icon-btn">
        <!-- Close (X) Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- Main Section 1 -->
  <div class="section-title">
    <span class="pop-text">-专四写作规律-</span>
  </div>

  <div class="badge-container">
    <div class="badge">专四写作历年真题</div>
  </div>

  <!-- Historical Table -->
  <table class="table-main">
    <thead>
      <tr>
        <th style="width: 14%;">年份</th>
        <th style="width: 44%;">题目</th>
        <th style="width: 18%;">类别</th>
        <th style="width: 20%;">题型</th>
        <th style="width: 4%; border: none;"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>2016</td>
        <td>上学期间外出旅游是否该禁止</td>
        <td>教育类</td>
        <td>立场类（二选一）</td>
        <td rowspan="2" class="bracket-cell">
          <!-- Pink Curly Brace 1 -->
          <div class="curly-brace">
            <svg viewBox="0 0 10 50" preserveAspectRatio="none">
              <path d="M 1 2 Q 8 2 8 13 Q 8 25 10 25 Q 8 25 8 37 Q 8 48 1 48" fill="none" stroke="#e06287" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
        </td>
      </tr>
      <tr>
        <td>2017</td>
        <td>人工智能是否会取代人脑</td>
        <td>科技类</td>
        <td>立场类（二选一）</td>
      </tr>
      <tr>
        <td>2018</td>
        <td>土著权益和环境保护负面作用</td>
        <td>人文+环保类</td>
        <td>论述类（给定观点）</td>
        <td rowspan="4" class="bracket-cell">
          <!-- Pink Curly Brace 2 -->
          <div class="curly-brace">
            <svg viewBox="0 0 10 90" preserveAspectRatio="none">
              <path d="M 1 2 Q 8 2 8 23 Q 8 45 10 45 Q 8 45 8 67 Q 8 88 1 88" fill="none" stroke="#e06287" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
        </td>
      </tr>
      <tr>
        <td>2019</td>
        <td>儿童屏幕使用时间</td>
        <td>科技+教育类</td>
        <td>论述类（给定观点）</td>
      </tr>
      <tr>
        <td>2020(未考)</td>
        <td>/</td>
        <td>/</td>
        <td>/</td>
      </tr>
      <tr>
        <td>2021</td>
        <td>孤独与智慧的关系</td>
        <td>心理类</td>
        <td>论述类（两者关系）</td>
      </tr>
      <tr>
        <td>2022</td>
        <td>如何提高环保意识</td>
        <td>环保类</td>
        <td>
          <span class="orange-dashed">提议类</span>
        </td>
        <td class="bracket-cell"></td>
      </tr>
    </tbody>
  </table>

  <!-- Main Section 2 -->
  <div class="section-title" style="margin-top: 36px;">
    <span class="pop-text">-2023专四写作-</span>
  </div>

  <div class="badge-container">
    <div class="badge">2023 年专四写作</div>
  </div>

  <!-- Prediction Table -->
  <table class="table-pred">
    <thead>
      <tr>
        <th colspan="3" style="display: none;"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>热门类别</td>
        <td>
          <span class="highlight-tag">科技类、教育类、人文类</span>
        </td>
        <td>
          <span class="underlined-text">连续年份不会考同类话题</span>
        </td>
      </tr>
      <tr>
        <td>热门题型</td>
        <td>
          <span class="highlight-tag">提议类</span>
        </td>
        <td>
          <span class="underlined-text">连续年份具有延续性</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
