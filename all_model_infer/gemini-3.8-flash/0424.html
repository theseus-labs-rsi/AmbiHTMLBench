<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>While Visiting The Fair - Sea Cliff L.I. Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Montserrat:wght@800;900&family=Playfair+Display:ital,wght@1,600&family=Josefin+Sans:wght@700&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #121212;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: sans-serif;
  }

  /* Poster Frame */
  .poster-container {
    position: relative;
    width: 100%;
    max-width: 620px;
    aspect-ratio: 1 / 1.52;
    background-color: #1a3c94;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    user-select: none;
  }

  /* SVG Artwork Layer */
  .poster-art {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Typography Layer */
  .content-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: auto;
  }

  /* Top Section */
  .header-group {
    padding-top: 14px;
    text-align: center;
    color: #f7b318;
  }

  .header-visiting {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 2.7rem;
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #000;
  }

  .header-fair {
    font-family: 'Fredoka', 'Montserrat', sans-serif;
    font-size: 3.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    line-height: 1.1;
    text-shadow: 1px 1px 0 #000;
  }

  /* Middle Section */
  .commute-group {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    color: #f7b318;
    padding-left: 30px;
  }

  .commute-title {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1.05;
  }

  .commute-sub {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  /* Bottom Section Overlay */
  .bottom-group {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 0 16px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .to-beautiful {
    align-self: flex-start;
    margin-left: 42px;
    margin-bottom: -10px;
    color: #fdf5d7;
    font-family: 'Fredoka', sans-serif;
    line-height: 1;
  }

  .to-txt {
    font-size: 2.8rem;
    font-weight: 700;
    display: block;
    line-height: 0.8;
  }

  .beautiful-txt {
    font-size: 3.3rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .brand-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    width: 100%;
    padding: 0 10px;
    color: #fdf5d7;
    margin-bottom: 2px;
  }

  .sea-cliff {
    font-family: 'Montserrat', 'Impact', sans-serif;
    font-size: 5.6rem;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 0.9;
    transform: scaleY(1.15);
    transform-origin: bottom;
  }

  .state-li {
    font-family: 'Montserrat', sans-serif;
    font-size: 3.6rem;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: 2px;
    margin-left: 10px;
  }

  .attributes {
    color: #fdf5d7;
    font-family: 'Fredoka', 'Josefin Sans', sans-serif;
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-align: center;
    margin-top: 6px;
    word-spacing: 2px;
  }

  .activities {
    color: #fdf5d7;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 2.15rem;
    font-weight: 600;
    text-align: center;
    margin-top: -2px;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .sponsor {
    color: #fdf5d7;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-align: center;
  }

  .wpa-credit {
    color: #fdf5d7;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-align: center;
    margin-top: 3px;
  }
</style>
</head>
<body>

<div class="poster-container" role="img" aria-label="Vintage WPA Poster: While visiting THE FAIR commute by land or water to beautiful SEA CLIFF L.I.">
  <!-- Illustrated Graphic Background matching original screenprint -->
  <svg class="poster-art" viewBox="0 0 620 940" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Deep Blue Sea/Sky Base -->
    <rect width="620" height="940" fill="#1b3c94" />

    <!-- 1939 World's Fair Skyline (Trylon & Perisphere + Buildings) -->
    <!-- Trylon Obelisk -->
    <polygon points="540,5 572,5 595,245 545,245" fill="#fdf5d7" />
    <!-- Perisphere Sphere & Ramp -->
    <circle cx="535" cy="195" r="58" fill="#fdf5d7" />
    <path d="M465,190 Q540,230 618,225 C615,232 540,240 455,198 Z" fill="#1b3c94" />
    <path d="M445,188 Q540,235 620,230 L620,240 Q540,245 440,194 Z" fill="#fdf5d7" />

    <!-- Distant Fair Exhibition Buildings & Pavilions -->
    <path d="M225,240 L225,195 L250,195 L250,170 L268,170 L272,130 L285,130 L290,170 L300,170 L302,142 L315,142 L318,170 L330,170 L330,240 Z" fill="#fdf5d7" opacity="0.9" />
    <!-- Center Hall with Arches & Colonnade -->
    <path d="M330,240 L330,185 L350,185 L350,155 L365,155 L370,165 L385,165 L387,140 L400,140 L405,175 L435,175 L438,150 L470,150 L475,175 L500,175 L505,240 Z" fill="#fdf5d7" />
    <path d="M380,185 H450 V225 H380 Z" fill="#1b3c94" opacity="0.4" />
    <circle cx="415" cy="175" r="16" fill="#1b3c94" />

    <!-- Foreground Water Reflections & Harbor Boats -->
    <path d="M210,242 L620,242 L620,265 C580,260 480,262 430,250 C370,252 290,248 210,255 Z" fill="#fdf5d7" />
    <path d="M245,225 L290,225 L305,242 L230,242 Z" fill="#1b3c94" />
    <path d="M330,225 L365,225 L380,242 L315,242 Z" fill="#1b3c94" />

    <!-- Water Ripples -->
    <path d="M490,270 C540,268 590,272 615,268 L620,278 C580,283 520,276 485,280 Z" fill="#fdf5d7" />
    <path d="M480,290 C530,288 590,295 620,288 L620,312 C570,320 500,305 470,315 Z" fill="#fdf5d7" />
    <path d="M530,320 C570,325 610,322 620,328 L620,350 C580,360 540,335 520,345 Z" fill="#fdf5d7" />

    <!-- Steamboat / Ferry Boat -->
    <g transform="translate(320, 420)">
      <!-- Smoke Plume -->
      <path d="M230,70 C240,40 280,20 235,-20 C220,-30 180,-10 145,20 C130,35 135,55 125,75 Z" fill="#fdf5d7" opacity="0.95" />
      <!-- Hull -->
      <path d="M125,80 L210,95 C220,135 150,200 45,230 L-2,190 C60,160 110,120 125,80 Z" fill="#1a3c94" stroke="#fdf5d7" stroke-width="3" />
      <path d="M45,230 C120,205 180,165 210,110 L220,120 C180,180 110,230 35,250 Z" fill="#3c5b20" />
      <!-- Decks & Cabin -->
      <polygon points="120,80 205,95 185,130 90,110" fill="#f7b318" />
      <polygon points="80,110 180,125 155,160 50,135" fill="#fdf5d7" />
      <polygon points="40,135 155,160 135,185 20,150" fill="#f7b318" />
      <!-- Smokestack -->
      <rect x="105" y="45" width="22" height="75" fill="#f7b318" transform="rotate(-15 105 45)" stroke="#1a3c94" stroke-width="2" />
      <!-- Cabin Windows -->
      <line x1="75" y1="120" x2="165" y2="135" stroke="#1a3c94" stroke-width="4" stroke-dasharray="6,4" />
      <!-- Flagpole & Flag -->
      <line x1="210" y1="95" x2="210" y2="55" stroke="#fdf5d7" stroke-width="2" />
      <polygon points="210,55 235,62 210,70" fill="#fdf5d7" />
      <!-- Water Wakes -->
      <path d="M220,125 Q250,150 260,185" stroke="#fdf5d7" stroke-width="3" fill="none" />
      <path d="M180,180 Q225,200 240,240" stroke="#fdf5d7" stroke-width="3" fill="none" />
      <path d="M80,230 Q120,250 140,285" stroke="#fdf5d7" stroke-width="2" fill="none" />
    </g>

    <!-- Left Green Foliage (Tree Canopies) -->
    <path d="M-20,-20 L240,-20 C240,40 210,50 230,80 C250,110 200,140 230,175 C200,195 210,250 180,280 C150,300 130,260 100,310 C70,270 30,300 -20,280 Z" fill="#3c5b20" />
    <!-- Leaf Clusters Cutouts / Highlights -->
    <path d="M10,20 C60,20 80,70 120,60 C150,50 140,110 110,130 C80,150 60,120 20,150 Z" fill="#1b3c94" opacity="0.3" />

    <!-- Cliff / Hillside Descending Diagonally to Right -->
    <path d="M-20,380 Q100,450 150,510 T370,680 L640,750 L640,960 L-20,960 Z" fill="#3c5b20" />

    <!-- Stone Monument / Sundial on Edge of Cliff -->
    <g transform="translate(18, 305)">
      <!-- Sundial Gnomon & Plate -->
      <polygon points="65,15 90,60 40,60" fill="#f7b318" stroke="#1b3c94" stroke-width="2" />
      <ellipse cx="65" cy="62" rx="45" ry="14" fill="#fdf5d7" stroke="#3c5b20" stroke-width="2" />
      <ellipse cx="65" cy="66" rx="35" ry="10" fill="#f7b318" />
      <!-- Stone Baluster / Pedestal Column -->
      <path d="M40,72 C40,72 30,110 40,150 C45,170 30,190 30,230 L100,230 C100,190 85,170 90,150 C100,110 90,72 90,72 Z" fill="#fdf5d7" />
      <path d="M35,160 Q65,175 95,160" stroke="#1a3c94" stroke-width="3" fill="none" opacity="0.4" />
      <!-- Pedestal Fluting / Shading -->
      <path d="M50,180 C50,210 40,230 40,230 L90,230 C90,230 80,210 80,180 Z" fill="#3c5b20" opacity="0.15" />
    </g>

    <!-- Path / Wall on Cliffside -->
    <polygon points="105,445 130,470 180,515 220,535 240,560 215,570 170,545 110,490 90,460" fill="#f7b318" opacity="0.9" />
    <rect x="140" y="470" width="16" height="20" fill="#fdf5d7" />
    <rect x="160" y="488" width="16" height="20" fill="#fdf5d7" />
    <rect x="185" y="508" width="16" height="20" fill="#fdf5d7" />

    <!-- Yellow Wildflower/Rock Accents on Green Hill -->
    <circle cx="45" cy="635" r="12" fill="#f7b318" />
    <circle cx="28" cy="650" r="8" fill="#f7b318" />
    <circle cx="68" cy="665" r="9" fill="#f7b318" />
    <polygon points="120,630 135,640 125,655 110,645" fill="#f7b318" />
    <polygon points="225,635 240,642 232,652 218,645" fill="#f7b318" />
  </svg>

  <!-- Verbatim Text Layer -->
  <div class="content-layer">
    <!-- Top Header -->
    <div class="header-group">
      <div class="header-visiting">While visiting</div>
      <div class="header-fair">THE FAIR</div>
    </div>

    <!-- Center Callout -->
    <div class="commute-group">
      <div class="commute-title">commute</div>
      <div class="commute-sub">by land or water</div>
    </div>

    <!-- Bottom Destination & Amenities Block -->
    <div class="bottom-group">
      <div class="to-beautiful">
        <span class="to-txt">to</span>
        <span class="beautiful-txt">beautiful</span>
      </div>

      <div class="brand-title">
        <span class="sea-cliff">SEA CLIFF</span>
        <span class="state-li">L.I.</span>
      </div>

      <div class="attributes">
        250 feet above sea level. NO MOSQUITOS
      </div>

      <div class="activities">
        golf and bathing
      </div>

      <div class="sponsor">
        SPONSORED BY THE VILLAGE OF SEA CLIFF
      </div>

      <div class="wpa-credit">
        WPA FEDERAL ART PROJECT DIV. 4
      </div>
    </div>
  </div>
</div>

</body>
</html>
