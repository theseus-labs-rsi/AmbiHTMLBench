<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一月-任务</title>
  <style>
    body {
      margin: 0;
      padding: 60px 40px;
      background-color: #ffffff;
      font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
      color: #000000;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      margin: 0 0 30px 0;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #555555;
      padding: 10px 8px;
      vertical-align: middle;
      font-weight: normal;
    }

    th {
      background-color: #ffffff;
    }

    /* Column widths approximation */
    th:nth-child(1), td:nth-child(1) { width: 7%; }
    th:nth-child(2), td:nth-child(2) { width: 19%; }
    th:nth-child(3), td:nth-child(3) { width: 12%; }
    th:nth-child(4), td:nth-child(4) { width: 24%; }
    th:nth-child(5), td:nth-child(5) { width: 12%; }
    th:nth-child(6), td:nth-child(6) { width: 26%; }

    /* Alternating row colors: rows with data 1, 3, 5 are shaded light blue */
    tr.shaded {
      background-color: #dce7f5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>一月-任务</h1>
    <table>
      <thead>
        <tr>
          <th>序号</th>
          <th>任务描述</th>
          <th>岗位</th>
          <th>操作动作</th>
          <th>开始时间</th>
          <th>备注</th>
        </tr>
      </thead>
      <tbody>
        <tr class="shaded">
          <td>1</td>
          <td>租厂房</td>
          <td>总经理</td>
          <td>申请60w 租厂房</td>
          <td>1月1日</td>
          <td>花60w租A厂房</td>
        </tr>
        <tr>
          <td>2</td>
          <td>资质开发</td>
          <td>总经理</td>
          <td>P3资质开发</td>
          <td>1月1日</td>
          <td>申请20w 资质开发</td>
        </tr>
        <tr class="shaded">
          <td>3</td>
          <td>批拨款</td>
          <td>财务</td>
          <td>批准</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr>
          <td>4</td>
          <td>支付管理费</td>
          <td>财务</td>
          <td>5w管理费</td>
          <td>1月1日</td>
          <td></td>
        </tr>
        <tr class="shaded">
          <td>5</td>
          <td>建设生产线</td>
          <td>生产</td>
          <td>4条自动线生产P3</td>
          <td>1月1日</td>
          <td>申请200w资金建线</td>
        </tr>
        <tr>
          <td>6</td>
          <td>iso开发</td>
          <td>总经理</td>
          <td>两个iso的开发</td>
          <td>1月1日</td>
          <td>申请资金开发</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
