<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民日报 金句摘抄</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0ece9;
      font-family: "STSong", "Songti SC", "SimSun", "STKaiti", "KaiTi", serif;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .card-container {
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    /* Top Header Section */
    .header-section {
      background-color: #fbf9f5;
      padding: 16px 24px 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-text {
      font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "Ma Shan Zheng", cursive, serif;
      font-size: 52px;
      line-height: 1;
      color: #d81e06;
      letter-spacing: 2px;
      font-weight: bold;
      transform: scaleY(1.05);
    }
    .logo-sub {
      font-family: "Times New Roman", Times, serif;
      font-size: 11px;
      letter-spacing: 3.5px;
      color: #8c827a;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .header-titles {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-bottom: 2px;
    }
    .title-row-1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      border-bottom: 2px solid #222;
      padding-bottom: 4px;
      margin-bottom: 12px;
      display: inline-block;
      line-height: 1.1;
    }
    .title-row-1 .separator {
      font-weight: normal;
      margin: 0 2px;
      color: #666;
    }
    .title-row-2 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      border-bottom: 2.5px solid #222;
      padding-bottom: 4px;
      display: inline-block;
      line-height: 1.1;
    }

    /* Content Body Section */
    .content-section {
      background-color: #dfd1c3;
      padding: 36px 28px 48px 28px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .quote-block {
      display: flex;
      flex-direction: column;
    }
    .quote-headline {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 3px;
      color: #222;
      margin-bottom: 18px;
    }
    .example-label {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    .example-body {
      font-size: 15px;
      line-height: 1.6;
      color: #2e2e2e;
      text-align: justify;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Header -->
    <div class="header-section">
      <div class="logo-area">
        <div class="logo-text">人民日報</div>
        <div class="logo-sub">RENMIN RIBAO</div>
      </div>
      <div class="header-titles">
        <div class="title-row-1">金句<span class="separator">｜</span>摘抄</div>
        <div class="title-row-2">坚持奋斗主题</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content-section">
      <!-- Item 1 -->
      <div class="quote-block">
        <div class="quote-headline">
          夜色难免黑凉<br>
          前行必有曙光
        </div>
        <div class="example-label">举例:</div>
        <div class="example-body">
          夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功！
        </div>
      </div>

      <!-- Item 2 -->
      <div class="quote-block">
        <div class="quote-headline">
          道固远，笃行可至<br>
          事虽巨，坚为必成
        </div>
        <div class="example-label">举例:</div>
        <div class="example-body">
          道固远，笃行可至;事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
        </div>
      </div>
    </div>
  </div>

</body>
</html>
