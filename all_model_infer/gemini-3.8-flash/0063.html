<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heath Ceramics - Architecture California Advertisement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .page {
      background-color: #fff;
      width: 100%;
      max-width: 820px;
      padding: 36px 36px 24px 36px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .ad-frame {
      border: 3px solid #000;
      display: flex;
      flex-direction: column;
    }

    .placeholder {
      width: 100%;
      height: 590px;
      background-color: #d8d3c5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #333;
      font-size: 15px;
      line-height: 1.5;
      border-bottom: 3px solid #000;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      font-size: 19px;
      font-weight: 300;
      letter-spacing: 0.2px;
      color: #111;
      border-bottom: 2px solid #000;
    }

    .content-area {
      padding: 56px 20px 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
    }

    .headline {
      text-align: center;
      font-size: 44px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #111;
      margin-bottom: 60px;
    }

    .headline span.italic {
      font-style: italic;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }

    .company-info {
      font-size: 20px;
      color: #111;
      line-height: 1.5;
    }

    .company-name {
      font-weight: 800;
    }

    .company-sub {
      margin-top: 10px;
      font-size: 19px;
      font-weight: 400;
      color: #222;
    }

    .contact-info {
      text-align: right;
      font-size: 20px;
      line-height: 1.35;
      color: #111;
    }

    .page-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      margin-top: 14px;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 12px;
      color: #222;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="ad-frame">
      <figure class="placeholder">
        [Photograph: High-angle view of the multi-story interior atrium of the Transpacific Building in Oakland, California, featuring expansive geometric hexagonal tile floor patterns, tiered balconies, glass railings, escalators, and central planter]
      </figure>

      <div class="meta-bar">
        <div>Transpacific Building — Oakland, CA</div>
        <div>Wong &amp; Tung International Architects</div>
      </div>

      <div class="content-area">
        <div class="headline">
          &ldquo;<span class="italic">tile that humanizes</span>&rdquo;
        </div>

        <div class="footer-row">
          <div class="company-info">
            <div><span class="company-name">Heath Ceramics</span>, Sausalito, CA 94965</div>
            <div class="company-sub">(Custom-made by people—not automated)</div>
          </div>

          <div class="contact-info">
            <div>Phone (415) 332-3732</div>
            <div>Edith Heath</div>
            <div>Jon Brooder</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-footer">
      <span>September/October 1983</span>
      <span>Architecture California</span>
      <span>3</span>
    </div>
  </div>

</body>
</html>
