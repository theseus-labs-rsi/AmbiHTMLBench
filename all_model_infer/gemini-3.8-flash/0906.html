<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句段结构作用好处赏析</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    font-family: "KaiTi", "STKaiti", "BiauKai", "楷体", "SimSun", serif;
  }

  /* Notebook page simulation */
  .notebook-page {
    width: 600px;
    min-height: 800px;
    background-color: #f7f9f8;
    /* Grid background */
    background-image: 
      linear-gradient(to right, rgba(160, 180, 195, 0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(160, 180, 195, 0.4) 1px, transparent 1px);
    background-size: 30px 30px;
    background-position: -1px -1px;
    padding: 40px 35px;
    box-shadow: 2px 4px 15px rgba(0,0,0,0.15);
    box-sizing: border-box;
    position: relative;
    color: #82111f; /* Handwritten red ink */
  }

  .title {
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 35px;
    color: #851322;
  }

  .section {
    display: flex;
    margin-bottom: 25px;
    position: relative;
  }

  /* Vertical headers on the left */
  .vertical-label {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 10px;
    margin-right: 25px;
    color: #851322;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-top: 5px;
    flex-shrink: 0;
  }

  .content-list {
    flex-grow: 1;
    font-size: 20px;
    line-height: 1.8;
  }

  .content-list p {
    margin: 0 0 16px 0;
    letter-spacing: 1px;
  }

  .underline {
    border-bottom: 1.5px solid #851322;
    padding: 0 4px;
  }

  .indent-line {
    padding-left: 28px;
  }

  /* Red seal stamp */
  .seal {
    position: absolute;
    right: 25px;
    top: 30px;
    width: 48px;
    height: 80px;
    border: 3px solid #aa1c29;
    border-radius: 25px;
    background-color: #aa1c29;
    color: #f7f9f8;
    writing-mode: vertical-rl;
    text-orientation: upright;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 6px;
    transform: rotate(2deg);
    opacity: 0.92;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
    user-select: none;
  }

  .footer-formula {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    padding-left: 10px;
  }

  .blue-text {
    color: #1e355b; /* Dark blue ink */
  }

  .red-text {
    color: #851322;
    margin-left: 12px;
    letter-spacing: 6px;
  }
</style>
</head>
<body>

<div class="notebook-page">
  <!-- Title -->
  <div class="title">句段结构作用好处赏析</div>

  <!-- Section 1: 常见问法 -->
  <div class="section" style="margin-bottom: 35px;">
    <div class="vertical-label">常见问法</div>
    <div class="content-list" style="padding-top: 6px;">
      <p>1. 请分析这句话的作用是什么？</p>
      <p>2. 这句话这样描写有什么好处？</p>
      <p>3. 请分析这句话这样描写的表达效果.</p>
    </div>
  </div>

  <!-- Section 2: 满分公式 -->
  <div class="section">
    <div class="vertical-label">满分公式</div>
    <div class="content-list" style="position: relative;">
      <p>① 这是（&nbsp;&nbsp;&nbsp;&nbsp;）描写</p>
      <p class="indent-line">生动形象地写出（&nbsp;&nbsp;&nbsp;&nbsp;），</p>
      <p>② 更突出了（&nbsp;&nbsp;&nbsp;&nbsp;）.</p>
      <p>③ 前后文呼应/为后文（&nbsp;&nbsp;&nbsp;&nbsp;）做了铺垫.</p>

      <!-- Stamp -->
      <div class="seal" aria-label="印章：李真">李真</div>
    </div>
  </div>

  <!-- Footer: 口诀 -->
  <div class="footer-formula">
    <span class="blue-text">口诀：</span>
    <span class="red-text">生动秀&nbsp;&nbsp;感心头&nbsp;&nbsp;勾勾手</span>
  </div>
</div>

</body>
</html>
