<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算思维二：分解思维</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      padding: 20px;
    }

    .card {
      position: relative;
      background: #ffffff;
      width: 540px;
      padding: 55px 48px 45px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    /* Decorative corner borders */
    .corner {
      position: absolute;
      border-color: #9cb0a4;
      border-style: solid;
      pointer-events: none;
    }

    .corner-tl {
      top: 28px;
      left: 28px;
      width: 65px;
      height: 70px;
      border-width: 2px 0 0 2px;
    }

    .corner-tr {
      top: 28px;
      right: 28px;
      width: 65px;
      height: 70px;
      border-width: 2px 2px 0 0;
    }

    .corner-bl {
      bottom: 24px;
      left: 28px;
      width: 150px;
      height: 70px;
      border-width: 0 0 2px 2px;
    }

    .corner-br {
      bottom: 24px;
      right: 28px;
      width: 150px;
      height: 70px;
      border-width: 0 2px 2px 0;
    }

    /* Header */
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      letter-spacing: 1px;
      margin-top: 10px;
      margin-bottom: 34px;
    }

    /* Content */
    .content {
      color: #1f1f1f;
      font-size: 15.5px;
      line-height: 1.68;
    }

    .intro {
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .highlight {
      color: #b8362d;
    }

    .section-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-top: 22px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .section-desc {
      color: #222222;
      letter-spacing: 0.2px;
    }

    /* Bottom section */
    .bottom-action {
      display: flex;
      justify-content: flex-end;
      margin-top: 40px;
      margin-bottom: 20px;
      padding-right: 12px;
    }

    .page-turn {
      display: flex;
      align-items: center;
    }

    .footer {
      text-align: center;
      font-size: 13.5px;
      color: #222222;
      font-weight: 500;
      letter-spacing: 0.5px;
      position: relative;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Decorative corners -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Title -->
    <h1 class="title">计算思维二：分解思维</h1>

    <!-- Main Content -->
    <div class="content">
      <p class="intro">
        分解思维是指<span class="highlight">将复杂的问题（或任务）拆解成一个个更易于解决的小问题（或任务）。</span>
      </p>

      <div class="section-title">1、问题梳理</div>
      <p class="section-desc">
        先明确这个复杂问题到底是什么，最终要达到什么目的或效果。
      </p>

      <div class="section-title">2、问题分解</div>
      <p class="section-desc">
        将复杂问题进行分解，梳理解决这个问题需要哪几步，每一步需要干什么事情，具体要怎么做，这就是一个个的小任务。
      </p>

      <div class="section-title">3、整合方案</div>
      <p class="section-desc">
        制定方案去解决每个小任务，然后将解决方案整合起来，就能轻松解决这个复杂问题了。
      </p>
    </div>

    <!-- Page turn icon -->
    <div class="bottom-action">
      <div class="page-turn">
        <svg viewBox="0 0 66 38" width="66" height="38" xmlns="http://www.w3.org/2000/svg">
          <path d="M 0,8 L 40,8 L 40,0 L 66,19 L 40,38 L 40,30 L 0,30 Z" fill="#000000" />
          <text x="21" y="23" fill="#ffffff" font-size="12" font-family="-apple-system, sans-serif" font-weight="bold" text-anchor="middle">翻页</text>
        </svg>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      原创：学习方法社
    </div>
  </div>

</body>
</html>
