<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.语法</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #6d9c88;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    font-family: "KaiTi", "STKaiti", "FangSong", "SimSun", "Comic Sans MS", cursive, sans-serif;
  }

  .outer-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background-color: #ffffff;
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }

  /* Notebook grid background */
  .grid-bg {
    background-image: 
      linear-gradient(to right, #edf3f5 1px, transparent 1px),
      linear-gradient(to bottom, #edf3f5 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: center top;
  }

  /* Tear-off holes along the top */
  .binder-holes {
    display: flex;
    justify-content: space-around;
    padding: 18px 12px 10px 12px;
    position: relative;
  }

  .hole {
    width: 16px;
    height: 16px;
    background-color: #6d9c88;
    border-radius: 50%;
    position: relative;
  }

  .hole::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 4px;
    width: 8px;
    height: 18px;
    background-color: #6d9c88;
  }

  .content {
    padding: 15px 24px 35px 24px;
    text-align: center;
    color: #2b2b2b;
    position: relative;
  }

  h1 {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 24px;
    color: #1a1a1a;
  }

  p {
    font-size: 15.5px;
    line-height: 1.75;
    letter-spacing: 1.2px;
    margin-bottom: 22px;
    text-align: center;
    word-break: break-all;
  }

  /* Decorative elements (yellow doodle & floral doodle) */
  .doodle-yellow-highlight {
    position: absolute;
    top: 220px;
    right: 65px;
    width: 28px;
    height: 60px;
    background: radial-gradient(ellipse at center, rgba(255, 220, 80, 0.45) 0%, rgba(255, 220, 80, 0) 70%);
    pointer-events: none;
    z-index: 1;
    transform: rotate(15deg);
  }

  .doodle-star {
    position: absolute;
    bottom: 50px;
    left: 42px;
    width: 24px;
    height: 24px;
    opacity: 0.6;
  }

  .doodle-flower {
    position: absolute;
    bottom: 12px;
    right: 20px;
    width: 58px;
    height: 58px;
    opacity: 0.75;
  }
</style>
</head>
<body>

<div class="outer-card grid-bg">
  <!-- Spiral / Tear-off punch holes -->
  <div class="binder-holes">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <div class="content">
    <div class="doodle-yellow-highlight"></div>

    <h1>4.语法</h1>

    <p>
      语法是语言的框架。光知道单词却不懂语法，你就无法完整地说出一个句子，有时候还可能让人产生误解；单词都认识，但是凑在一起就不知道句子是什么意思，也会感到尴尬。
    </p>

    <p>
      虽然提起学语法，大家都是感觉头都大，各种时态错综复杂怎么记？但是任何一门学科都是由浅入深的，英语也不例外。
    </p>

    <p>
      学习语法就像造房子，首先要把基础的语法脉络理清，打好根基，之后再慢慢补充和拓展，让知识巩固起来。
    </p>

    <p style="margin-bottom: 10px;">
      零基础的同学在学习英语语法时可以先从简单的开始。比如五大基本句型和八大时态等。
    </p>

    <!-- Doodle: Star bottom left -->
    <svg class="doodle-star" viewBox="0 0 24 24" fill="none" stroke="#f4c244" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
    </svg>

    <!-- Doodle: Flower bottom right -->
    <svg class="doodle-flower" viewBox="0 0 60 60" fill="none">
      <!-- Petals -->
      <circle cx="30" cy="22" r="7" stroke="#e06363" stroke-width="2.5" fill="#fce8e8"/>
      <circle cx="38" cy="28" r="7" stroke="#e06363" stroke-width="2.5" fill="#fce8e8"/>
      <circle cx="35" cy="38" r="7" stroke="#e06363" stroke-width="2.5" fill="#fce8e8"/>
      <circle cx="25" cy="38" r="7" stroke="#e06363" stroke-width="2.5" fill="#fce8e8"/>
      <circle cx="22" cy="28" r="7" stroke="#e06363" stroke-width="2.5" fill="#fce8e8"/>
      <!-- Center -->
      <circle cx="30" cy="30" r="6" stroke="#e06363" stroke-width="2.5" fill="#ffffff"/>
      <!-- Small green leaf doodle -->
      <path d="M42 45 C48 42, 50 48, 45 52 C42 50, 40 47, 42 45 Z" stroke="#6d9c88" stroke-width="2" fill="none"/>
      <path d="M46 51 C52 50, 52 56, 47 57 C44 55, 44 53, 46 51 Z" stroke="#6d9c88" stroke-width="2" fill="none"/>
    </svg>
  </div>
</div>

</body>
</html>
