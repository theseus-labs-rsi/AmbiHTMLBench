<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 26</title>
<style>
  body {
    background-color: #d8c29d;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .page-container {
    background-color: #fcfbf7;
    width: 100%;
    max-width: 650px;
    padding: 45px 50px 60px 45px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border-radius: 2px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* Right-edge peek of next page/column */
  .page-container::after {
    content: "为一个\A你知道";
    white-space: pre-wrap;
    position: absolute;
    right: 10px;
    top: 55px;
    font-size: 11px;
    color: #999;
    line-height: 1.8;
    pointer-events: none;
    opacity: 0.6;
  }

  .question-header {
    display: flex;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .question-number {
    font-size: 30px;
    font-weight: 300;
    font-family: Georgia, serif;
    color: #2b2b2b;
    line-height: 1;
    margin-right: 12px;
    transform: translateY(-2px);
  }

  .prompt-text {
    font-size: 12px;
    color: #333;
    line-height: 1.5;
  }

  .prompt-subtext {
    margin-top: 4px;
  }

  .lined-section {
    margin-top: 10px;
  }

  .write-line {
    border-bottom: 1px dashed #b5b5b5;
    min-height: 44px;
    display: flex;
    align-items: flex-end;
    padding-bottom: 2px;
  }

  .handwritten {
    font-family: "KaiTi", "STKaiti", "BiauKai", "楷体", cursive;
    font-size: 26px;
    color: #1a1a1a;
    font-weight: 500;
    letter-spacing: 2px;
    line-height: 1.2;
    transform: translateY(4px);
    width: 100%;
  }

  .indent {
    margin-left: 36px;
  }
</style>
</head>
<body>

<div class="page-container">
  <div class="question-header">
    <div class="question-number">26</div>
    <div class="prompt-text">
      <div>你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</div>
      <div class="prompt-subtext">她看到了什么呢？</div>
    </div>
  </div>

  <div class="lined-section">
    <div class="write-line">
      <div class="handwritten indent">我蹲下来，“这根肋骨让你感</div>
    </div>
    <div class="write-line">
      <div class="handwritten">到不舒服吗？”</div>
    </div>
    <div class="write-line">
      <div class="handwritten indent">展览台上是一尊白玉莹莹的肋</div>
    </div>
    <div class="write-line">
      <div class="handwritten">骨，下面的文字介绍引用了夏娃</div>
    </div>
    <div class="write-line">
      <div class="handwritten">的来历，说女人都是由肋骨所化。</div>
    </div>
  </div>
</div>

</body>
</html>
