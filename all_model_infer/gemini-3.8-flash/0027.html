<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贝果食谱 - 核桃奶酪贝果 & 香蕉可可贝果</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f7f7f7;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* Main Card Container */
  .recipe-card {
    width: 560px;
    background-color: #fffaf4;
    /* Gingham / plaid pattern */
    background-image: 
      linear-gradient(rgba(247, 217, 186, 0.45) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247, 217, 186, 0.45) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 14px solid #f3983e;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
    padding: 20px 18px;
    color: #4a2c11;
  }

  /* Typography */
  .section-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    color: #4a2711;
  }

  .step-label {
    font-size: 15px;
    font-weight: bold;
    color: #532c14;
    margin: 6px 0;
  }

  .step-desc {
    font-size: 13.5px;
    line-height: 1.5;
    color: #532c14;
    font-weight: 500;
    margin: 6px 0 10px 0;
  }

  /* Placeholders & Visual Elements */
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: #8c6239;
    background: rgba(255, 255, 255, 0.75);
    border: 1.5px dashed #df9f68;
    border-radius: 8px;
    position: relative;
  }

  /* Section 1: Walnut Cream Cheese Bagel */
  .section-top {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .top-left-col {
    width: 155px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* "元气满满" Tag */
  .tag-yuanqi {
    border: 2px solid #5a381e;
    background: #fff;
    border-radius: 8px;
    padding: 4px 8px;
    font-weight: 900;
    font-size: 15px;
    line-height: 1.2;
    text-align: center;
    color: #486884;
    box-shadow: 2px 2px 0px #5a381e;
    position: absolute;
    top: -5px;
    left: 2px;
    z-index: 2;
  }
  .tag-yuanqi span {
    display: block;
  }

  .bagel-fig-top {
    width: 145px;
    height: 130px;
    border-radius: 50%;
    margin-top: 35px;
  }

  .girl-fig {
    width: 95px;
    height: 145px;
    margin-top: 5px;
    align-self: flex-start;
    margin-left: 10px;
  }

  .top-right-col {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Ingredients row */
  .ingredient-row {
    display: flex;
    gap: 16px;
    margin: 6px 0 8px 0;
  }

  .ingredient-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: #532c14;
    font-weight: 600;
  }

  .ing-box {
    width: 54px;
    height: 48px;
    margin-bottom: 4px;
  }

  .ing-box.round {
    border-radius: 50%;
    width: 50px;
    height: 50px;
  }

  /* Flow Steps */
  .flow-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .arrow {
    font-size: 16px;
    color: #4a2711;
    font-weight: bold;
  }

  .oven-box {
    width: 80px;
    height: 75px;
  }

  .bowl-box {
    width: 72px;
    height: 50px;
    border-radius: 0 0 35px 35px;
  }

  .spread-bagel-box {
    width: 65px;
    height: 65px;
    border-radius: 50%;
  }

  /* Dashed Divider */
  .divider {
    border-top: 2.5px dashed #f3983e;
    margin: 10px 0 14px 0;
  }

  /* Section 2: Banana Cocoa Bagel */
  .section-bottom {
    display: flex;
    flex-direction: column;
  }

  .bottom-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .author-tag {
    font-size: 13.5px;
    font-weight: bold;
    color: #4a2711;
  }

  .bottom-content {
    display: flex;
    justify-content: space-between;
  }

  .bottom-left-col {
    flex: 1;
  }

  .bottom-right-col {
    width: 175px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }

  /* "平安喜乐" Tag */
  .tag-pingan {
    background-color: #ed4040;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 900;
    line-height: 1.2;
    text-align: center;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    transform: rotate(6deg);
    position: absolute;
    top: 5px;
    right: 25px;
    z-index: 2;
  }

  .tag-stick {
    position: absolute;
    top: 45px;
    right: 58px;
    width: 2px;
    height: 35px;
    background-color: #cca474;
    transform: rotate(6deg);
  }

  .banana-slice-drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 11px;
    margin-left: 6px;
  }

  .bagel-fig-bottom {
    width: 155px;
    height: 145px;
    border-radius: 50%;
    margin-top: 50px;
  }

  .bagel-icon {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #d48c46;
    border-radius: 50%;
    margin-left: 6px;
    position: relative;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
    vertical-align: middle;
  }
  .bagel-icon::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fffaf4;
    border-radius: 50%;
    top: 9px;
    left: 9px;
  }
</style>
</head>
<body>

<div class="recipe-card">

  <!-- TOP SECTION: 核桃奶酪贝果 -->
  <div class="section-top">
    <!-- Left column: Tags, Bagel, Character -->
    <div class="top-left-col">
      <div class="tag-yuanqi">
        <span>元气</span>
        <span>满满</span>
      </div>
      <div class="placeholder bagel-fig-top">
        [插图: 核桃奶酪贝果成品]
      </div>
      <div class="placeholder girl-fig">
        [插图: 卡通女孩]
      </div>
    </div>

    <!-- Right column: Recipe Steps -->
    <div class="top-right-col">
      <div class="section-title">
        核桃奶酪贝果 <span class="bagel-icon"></span>
      </div>

      <div class="step-label">1. 准备材料</div>
      <div class="ingredient-row">
        <div class="ingredient-item">
          <div class="placeholder ing-box">[图: 奶酪]</div>
          <span>奶酪</span>
        </div>
        <div class="ingredient-item">
          <div class="placeholder ing-box round">[图: 贝果]</div>
          <span>贝果</span>
        </div>
        <div class="ingredient-item">
          <div class="placeholder ing-box">[图: 核桃]</div>
          <span>核桃仁</span>
        </div>
      </div>

      <div class="step-desc">
        2. 核桃仁烤2分钟左右，搓掉皮，捣碎后和奶酪混合到一起，涂抹在贝果上
      </div>

      <div class="flow-row">
        <div class="placeholder oven-box">[烤箱烘烤]</div>
        <div class="arrow">➔</div>
        <div class="placeholder bowl-box">[混合搅拌]</div>
        <div class="arrow">➔</div>
        <div class="placeholder spread-bagel-box">[抹在贝果]</div>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div class="divider"></div>

  <!-- BOTTOM SECTION: 香蕉可可贝果 -->
  <div class="section-bottom">
    <div class="bottom-header-row">
      <div class="section-title">
        香蕉可可贝果 <span class="bagel-icon"></span>
      </div>
      <div class="author-tag">@哎呀牌绿豆汤</div>
    </div>

    <div class="bottom-content">
      <!-- Steps & Flow on Left -->
      <div class="bottom-left-col">
        <div class="step-label">1. 准备材料</div>
        <div class="ingredient-row">
          <div class="ingredient-item">
            <div class="placeholder ing-box">[图: 奶酪]</div>
            <span>奶酪</span>
          </div>
          <div class="ingredient-item">
            <div class="placeholder ing-box round">[图: 贝果]</div>
            <span>贝果</span>
          </div>
          <div class="ingredient-item">
            <div class="placeholder ing-box">[图: 香蕉]</div>
            <span>香蕉</span>
          </div>
          <div class="ingredient-item">
            <div class="placeholder ing-box">[图: 可可粉]</div>
            <span>可可粉</span>
          </div>
        </div>

        <div class="step-desc">
          2. 奶酪加入可可粉，搅拌均匀涂抹在贝果上摆上水果
        </div>

        <div class="flow-row" style="margin-top: 15px;">
          <div class="placeholder bowl-box">[可可奶酪]</div>
          <div class="arrow">➔</div>
          <div class="placeholder spread-bagel-box" style="background:#5c3a21; color:#fff;">[涂抹贝果]</div>
          <div class="arrow">➔</div>
          <div style="position: relative;">
            <div class="placeholder spread-bagel-box" style="border-radius: 50%;">[铺香蕉片]</div>
          </div>
        </div>
      </div>

      <!-- Final Result Bagel on Right -->
      <div class="bottom-right-col">
        <div class="tag-pingan">
          平安<br>喜乐
        </div>
        <div class="tag-stick"></div>
        <div class="placeholder bagel-fig-bottom">
          [插图: 香蕉可可贝果成品]
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
