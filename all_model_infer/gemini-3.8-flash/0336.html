<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大纲列表</title>
<style>
  body {
    margin: 0;
    padding: 12px 16px;
    background-color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #262626;
    font-size: 15px;
    line-height: 1.5;
  }

  .outline-tree, .outline-tree ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .outline-tree ul {
    position: relative;
    margin-left: 19px;
    padding-left: 15px;
  }

  /* Vertical tree line */
  .outline-tree ul::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 8px;
    width: 1px;
    background-color: #e5e5e5;
  }

  .outline-node {
    position: relative;
    margin: 3px 0;
  }

  .node-content {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 3px 0;
  }

  .node-left {
    display: flex;
    align-items: flex-start;
    flex: 1;
  }

  .bullet {
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: #737373;
    border-radius: 50%;
    margin-top: 8px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .text {
    flex: 1;
    word-break: break-word;
  }

  .text-highlight {
    color: #9d3e35;
  }

  .arrow {
    color: #999999;
    font-size: 9px;
    padding-left: 10px;
    padding-right: 4px;
    margin-top: 5px;
    cursor: default;
    user-select: none;
    transform: scaleY(0.85);
  }
</style>
</head>
<body>

<div class="outline-tree">
  <div class="outline-node">
    <div class="node-content">
      <div class="node-left">
        <span class="bullet"></span>
        <span class="text text-highlight">第三阶段 认识自我，找到自我</span>
      </div>
      <span class="arrow">▼</span>
    </div>
    <ul>
      <li class="outline-node">
        <div class="node-content">
          <div class="node-left">
            <span class="bullet"></span>
            <span class="text">不同国家的妆容模仿</span>
          </div>
          <span class="arrow">▼</span>
        </div>
        <ul>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">不同国家妆容特点分析</span>
              </div>
            </div>
          </li>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">逐个部位模仿</span>
              </div>
            </div>
          </li>
        </ul>
      </li>
      <li class="outline-node">
        <div class="node-content">
          <div class="node-left">
            <span class="bullet"></span>
            <span class="text">明星出圈妆容模仿</span>
          </div>
          <span class="arrow">▼</span>
        </div>
        <ul>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">鞠婧祎妆容</span>
              </div>
            </div>
          </li>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">虞书欣妆容</span>
              </div>
            </div>
          </li>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">宋慧乔妆容</span>
              </div>
            </div>
          </li>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">女团妆容</span>
              </div>
            </div>
          </li>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">日本杂志妆容</span>
              </div>
            </div>
          </li>
        </ul>
      </li>
      <li class="outline-node">
        <div class="node-content">
          <div class="node-left">
            <span class="bullet"></span>
            <span class="text">找到适合自己的风格和妆容</span>
          </div>
          <span class="arrow">▼</span>
        </div>
        <ul>
          <li class="outline-node">
            <div class="node-content">
              <div class="node-left">
                <span class="bullet"></span>
                <span class="text">根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</span>
              </div>
            </div>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</div>

</body>
</html>
