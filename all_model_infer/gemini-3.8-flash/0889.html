<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香水浓度</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", "Times New Roman", serif;
      color: #4a3424;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 580px;
      padding: 35px 20px 30px 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .title {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 25px;
      color: #4a3424;
    }

    /* Main comparison table layout */
    .table-layout {
      display: grid;
      grid-template-columns: 42px repeat(5, 1fr);
      row-gap: 24px;
      align-items: center;
      text-align: center;
    }

    /* Row Headers on the left */
    .row-label {
      font-size: 16px;
      font-weight: bold;
      text-align: left;
      white-space: nowrap;
      color: #4a3424;
      line-height: 1.2;
    }

    /* Illustration Row */
    .bottle-cell {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 95px;
    }

    .bottle-cell svg {
      width: 65px;
      height: 90px;
    }

    /* Categories Row */
    .cat-cell {
      font-size: 16px;
      font-weight: bold;
      color: #4a3424;
    }

    /* Names Row */
    .name-cell {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      color: #4a3424;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Abbreviations Row */
    .abbr-cell {
      font-size: 15px;
      font-weight: 600;
      color: #4a3424;
    }

    /* Concentration Row */
    .conc-cell {
      font-size: 15px;
      font-weight: 600;
      color: #4a3424;
    }

    /* Longevity Row */
    .time-cell {
      font-size: 16px;
      font-weight: 600;
      color: #4a3424;
    }

    /* Footer Tips */
    .tips-section {
      margin-top: 40px;
      padding-left: 20px;
      font-size: 12px;
      line-height: 1.7;
      color: #4a3424;
    }

    .tips-section .tips-title {
      font-size: 13px;
      font-style: italic;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">香水浓度</h1>

    <div class="table-layout">
      <!-- 1. Bottles Row -->
      <div></div> <!-- Empty top-left cell -->
      
      <!-- Bottle 1: 15-20% -->
      <div class="bottle-cell">
        <svg viewBox="0 0 70 90">
          <circle cx="35" cy="18" r="9" fill="#e83838" stroke="#222" stroke-width="1.2"/>
          <rect x="32" y="27" width="6" height="4" fill="#222"/>
          <!-- Bow Ribbon -->
          <path d="M26 31 C15 25, 12 28, 28 32 M44 31 C55 25, 58 28, 42 32 M30 32 C20 37, 16 38, 28 33 M40 32 C50 37, 54 38, 42 33" fill="none" stroke="#555" stroke-width="0.8"/>
          <!-- Bottle Body & Liquid -->
          <clipPath id="clip1">
            <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z"/>
          </clipPath>
          <rect x="10" y="52" width="50" height="40" fill="#c4c7c9" clip-path="url(#clip1)"/>
          <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z" fill="none" stroke="#222" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- Bottle 2: 10-15% -->
      <div class="bottle-cell">
        <svg viewBox="0 0 70 90">
          <circle cx="35" cy="18" r="9" fill="#e83838" stroke="#222" stroke-width="1.2"/>
          <rect x="32" y="27" width="6" height="4" fill="#222"/>
          <path d="M26 31 C15 25, 12 28, 28 32 M44 31 C55 25, 58 28, 42 32 M30 32 C20 37, 16 38, 28 33 M40 32 C50 37, 54 38, 42 33" fill="none" stroke="#555" stroke-width="0.8"/>
          <clipPath id="clip2">
            <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z"/>
          </clipPath>
          <rect x="10" y="60" width="50" height="30" fill="#c4c7c9" clip-path="url(#clip2)"/>
          <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z" fill="none" stroke="#222" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- Bottle 3: 5-10% -->
      <div class="bottle-cell">
        <svg viewBox="0 0 70 90">
          <circle cx="35" cy="18" r="9" fill="#e83838" stroke="#222" stroke-width="1.2"/>
          <rect x="32" y="27" width="6" height="4" fill="#222"/>
          <path d="M26 31 C15 25, 12 28, 28 32 M44 31 C55 25, 58 28, 42 32 M30 32 C20 37, 16 38, 28 33 M40 32 C50 37, 54 38, 42 33" fill="none" stroke="#555" stroke-width="0.8"/>
          <clipPath id="clip3">
            <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z"/>
          </clipPath>
          <rect x="10" y="66" width="50" height="25" fill="#c4c7c9" clip-path="url(#clip3)"/>
          <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z" fill="none" stroke="#222" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- Bottle 4: 3-5% -->
      <div class="bottle-cell">
        <svg viewBox="0 0 70 90">
          <circle cx="35" cy="18" r="9" fill="#e83838" stroke="#222" stroke-width="1.2"/>
          <rect x="32" y="27" width="6" height="4" fill="#222"/>
          <path d="M26 31 C15 25, 12 28, 28 32 M44 31 C55 25, 58 28, 42 32 M30 32 C20 37, 16 38, 28 33 M40 32 C50 37, 54 38, 42 33" fill="none" stroke="#555" stroke-width="0.8"/>
          <clipPath id="clip4">
            <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z"/>
          </clipPath>
          <rect x="10" y="73" width="50" height="20" fill="#c4c7c9" clip-path="url(#clip4)"/>
          <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z" fill="none" stroke="#222" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- Bottle 5: <3% -->
      <div class="bottle-cell">
        <svg viewBox="0 0 70 90">
          <circle cx="35" cy="18" r="9" fill="#e83838" stroke="#222" stroke-width="1.2"/>
          <rect x="32" y="27" width="6" height="4" fill="#222"/>
          <path d="M26 31 C15 25, 12 28, 28 32 M44 31 C55 25, 58 28, 42 32 M30 32 C20 37, 16 38, 28 33 M40 32 C50 37, 54 38, 42 33" fill="none" stroke="#555" stroke-width="0.8"/>
          <clipPath id="clip5">
            <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z"/>
          </clipPath>
          <rect x="10" y="80" width="50" height="15" fill="#c4c7c9" clip-path="url(#clip5)"/>
          <path d="M12 34 L58 34 L51 84 Q50 87 46 87 L24 87 Q20 87 19 84 Z" fill="none" stroke="#222" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- 2. 分类 Row -->
      <div class="row-label">分类</div>
      <div class="cat-cell">浓香精</div>
      <div class="cat-cell">淡香精</div>
      <div class="cat-cell">淡香水</div>
      <div class="cat-cell">古龙水</div>
      <div class="cat-cell">清香水</div>

      <!-- 3. 名称 Row -->
      <div class="row-label">名称</div>
      <div class="name-cell">
        Parfum
      </div>
      <div class="name-cell">
        <span>Eau</span>
        <span>De</span>
        <span>Parfum</span>
      </div>
      <div class="name-cell">
        <span>Eau</span>
        <span>De</span>
        <span>Toilette</span>
      </div>
      <div class="name-cell">
        <span>Eau</span>
        <span>De</span>
        <span>Cologne</span>
      </div>
      <div class="name-cell">
        <span>Eau</span>
        <span>Fraiche</span>
      </div>

      <!-- 4. 缩写 Row -->
      <div class="row-label">缩写</div>
      <div class="abbr-cell">(P)</div>
      <div class="abbr-cell">(EDP)</div>
      <div class="abbr-cell">(EDT)</div>
      <div class="abbr-cell">(EDC)</div>
      <div class="abbr-cell">(EF)</div>

      <!-- 5. 浓度 Row -->
      <div class="row-label">浓度</div>
      <div class="conc-cell">15-20%</div>
      <div class="conc-cell">10-15%</div>
      <div class="conc-cell">5-10%</div>
      <div class="conc-cell">3-5%</div>
      <div class="conc-cell">&lt;3%</div>

      <!-- 6. 留香 Row -->
      <div class="row-label">留香</div>
      <div class="time-cell">5-8H</div>
      <div class="time-cell">3-5H</div>
      <div class="time-cell">3-4H</div>
      <div class="time-cell">2-3H</div>
      <div class="time-cell">&lt;1h</div>
    </div>

    <!-- Tips Note -->
    <div class="tips-section">
      <div class="tips-title">tips:</div>
      <div>浓度高的香水不代表留香时间长,主要取决于香料种类</div>
      <div>在相同的浓度比较下, 木质香的留香时间是碾压花果香的</div>
    </div>
  </div>

</body>
</html>
