<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频剪辑素材</title>
<style>
  body {
    margin: 0;
    padding: 30px 15px 40px;
    background-color: #fdfae7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #333333;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .main-title {

    font-weight: bold;
    color: #1a1a1a;
    letter-spacing: 2px;
    margin: 0 0 24px 0;
    text-align: center;
  }

  .content-card {
    background-color: #ffffff;
    border-radius: 24px;
    width: 100%;
    max-width: 500px;
    box-sizing: border-box;
    padding: 30px 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .item {
    margin-bottom: 24px;
    width: 100%;
  }

  .item:last-child {
    margin-bottom: 10px;
  }

  .item-title {
    font-size: 16px;
    font-weight: 500;
    color: #222222;
    margin-bottom: 6px;
  }

  .item-desc {
    font-size: 13.5px;
    color: #4a4a4a;
    line-height: 1.6;
    margin: 0;

<body>

  <div class="content-card">

    <div class="item">

</html>
