<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老吴の创业随笔</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2b2b2b;
            font-family: "STKaiti", "KaiTi", "楷体", "BiauKai", serif;
        }
        .card {
            width: 100%;
            max-width: 540px;
            min-height: 720px;
            padding: 40px 30px;
            background-color: #dfc2a1;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(245, 230, 210, 0.4) 0%, rgba(180, 140, 100, 0.4) 100%),
                radial-gradient(circle at 10% 20%, rgba(139, 90, 43, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(100, 60, 20, 0.2) 0%, transparent 50%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #1a1512;
            position: relative;
        }
        .header {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 10px;
            font-family: "STKaiti", "KaiTi", "楷体", sans-serif;
        }
        .content {
            font-size: 31px;
            line-height: 1.65;
            letter-spacing: 3px;
            font-weight: bold;
            padding: 10px 15px;
            word-break: break-all;
        }
        .footer {
            text-align: center;
            font-size: 17px;
            letter-spacing: 1.5px;
            color: #2a201a;
            margin-bottom: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            老吴の创业随笔
        </div>

        <div class="content">
            《易经》中说：“小财<br>
            靠勤，大财靠德，德不厚<br>
            ，无以载物。”靠出卖时<br>
            间和劳动力&nbsp;赚钱的人，<br>
            只能发点小财。一个人每<br>
            天，时间有限，精力有限<br>
            ，分身乏术。
        </div>

        <div class="footer">
            商业思维 | 个人提升 | 创业心得 | 认知觉醒
        </div>
    </div>
</body>
</html>
