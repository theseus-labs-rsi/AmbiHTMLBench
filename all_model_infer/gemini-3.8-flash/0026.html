<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指读 (Pointing Reading)</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 20px;
    background-color: #f0eee9;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimSun", serif;
    color: #2b2b2b;
    display: flex;
    justify-content: center;
  }
  .page-container {
    width: 100%;
    max-width: 650px;
    background-color: #fdfbf7;
    padding: 30px 40px 60px 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    position: relative;
    line-height: 1.8;
  }
  /* Right edge bookmark tab */
  .edge-tab {
    position: absolute;
    right: 0;
    top: 260px;
    background-color: #2b333c;
    color: #ffffff;
    font-size: 11px;
    padding: 4px 6px 4px 8px;
    border-radius: 4px 0 0 4px;
    writing-mode: vertical-lr;
    letter-spacing: 1px;
  }
  /* Top header */
  .header-category {
    font-size: 13px;
    color: #333;
    margin-bottom: 8px;
  }
  .header-category .en {
    font-family: Arial, sans-serif;
    margin-left: 4px;
  }
  .header-speech-bubble {
    display: inline-block;
    border: 1px solid #7d8590;
    border-radius: 20px;
    padding: 2px 24px;
    font-size: 13px;
    color: #333;
    margin-left: 30px;
    margin-bottom: -6px;
    position: relative;
    background-color: #fdfbf7;
    z-index: 2;
  }
  /* Main title block */
  .title-banner {
    background-color: #232c37;
    color: #ffffff;
    padding: 10px 18px;
    border: 1px solid #232c37;
    outline: 1px solid #232c37;
    outline-offset: 2px;
    display: flex;
    align-items: baseline;
    margin-bottom: 45px;
  }
  .title-banner .method-num {
    font-size: 14px;
    padding-right: 14px;
    border-right: 1px solid rgba(255,255,255,0.4);
    margin-right: 16px;
    font-weight: normal;
  }
  .title-banner .main-title {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .title-banner .main-title .en {
    font-family: Georgia, serif;
    font-size: 20px;
    font-weight: normal;
    margin-left: 8px;
    letter-spacing: 0;
  }

  /* Step blocks */
  .step-section {
    margin-bottom: 30px;
  }
  .step-badge {
    display: inline-block;
    background-color: #2b333c;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    padding: 3px 12px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .step-content {
    font-size: 15px;
    text-align: justify;
    text-indent: 2em;
    margin: 0;
    color: #222;
  }

  /* Content area with illustration layout */
  .bottom-layout {
    position: relative;
    min-height: 260px;
  }
  .text-flow {
    width: 60%;
  }
  .text-flow p {
    text-indent: 2em;
    margin: 0 0 12px 0;
    font-size: 15px;
    text-align: justify;
  }

  /* Illustration placeholder */
  .illustration-container {
    position: absolute;
    right: 15px;
    bottom: 0;
    width: 170px;
    height: 180px;
    border: 1px dashed #aaa;
    background-color: #f7f5f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>

<div class="page-container">
  <div class="edge-tab">方法 40</div>

  <!-- Top bar -->
  <div class="header-category">平读 <span class="en">Plain reading</span></div>
  <div style="text-align: center; margin-bottom: 2px;">
    <div class="header-speech-bubble">用手指来指引读书的方向</div>
  </div>

  <!-- Main Banner Title -->
  <div class="title-banner">
    <div class="method-num">方法 40</div>
    <div class="main-title">
      指读 <span class="en">(Pointing Reading)</span>
    </div>
  </div>

  <!-- Step 1 -->
  <div class="step-section">
    <div class="step-badge">❶ 用手指或是笔尖指着当前读到的位置</div>
    <p class="step-content">视线聚焦在手指或笔尖。</p>
  </div>

  <!-- Step 2 -->
  <div class="step-section">
    <div class="step-badge">❷ 沿着阅读的方向移动手指或笔尖</div>
    <p class="step-content">
      一边往下读，一边移动手指或笔尖。此时视线依然聚焦在手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。
    </p>
  </div>

  <!-- Split content & illustration -->
  <div class="bottom-layout">
    <div class="text-flow">
      <p>大家也可以试着将这种方式与朗读结合起来，将指着的内容出声读出来。</p>
    </div>

    <!-- Illustration placeholder -->
    <div class="illustration-container placeholder">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
        <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path>
        <path d="M9 10h.01"></path>
        <path d="M15 10h.01"></path>
        <path d="M9.5 15a3.5 3.5 0 0 0 5 0"></path>
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5z"></path>
      </svg>
      <div>[插图：手绘大眼睛小猫伏案指读看书]</div>
    </div>
  </div>
</div>

</body>
</html>
