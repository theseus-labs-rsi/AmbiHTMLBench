<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新中式女装品牌盘点</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: #ffffff;
      padding: 20px 16px 28px;
    }

    /* Top Header Section */
    .header-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .badge {
      background-color: #000000;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      letter-spacing: 0.5px;
    }

    .main-title {
      display: flex;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
      color: #000000;
      margin-bottom: 16px;
    }

    .main-title .arrow {
      font-family: monospace;
      font-weight: normal;
      margin-right: 6px;
      font-size: 14px;
    }

    /* 2x2 Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      border: 1px dashed #999999;
      padding: 10px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #ffffff;
    }

    /* Brand Header within Card */
    .brand-header {
      min-height: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 6px;
    }

    .brand-header.text-logo {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #333333;
      font-family: "STSong", "SimSun", "Songti SC", serif;
    }

    .brand-header.ting-tang {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 600;
      color: #222;
    }

    .brand-header.shi-bai {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .shi-bai .latin {
      font-size: 6px;
      line-height: 1;
      letter-spacing: 0.5px;
      text-align: center;
      font-weight: 700;
      color: #333;
    }

    .shi-bai .chinese {
      font-size: 14px;
      font-family: "STSong", "SimSun", "Songti SC", serif;
      letter-spacing: 2px;
      color: #333;
    }

    .brand-header.heco {
      text-align: center;
      line-height: 1.1;
    }

    .heco .brand-name {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      font-family: "Georgia", serif;
      color: #222;
    }

    .heco .sub-text {
      font-size: 6px;
      letter-spacing: 1px;
      color: #666;
      transform: scale(0.9);
    }

    /* Placeholder for Images */
    .placeholder {
      width: 100%;
      height: 155px;
      background-color: #eae7e2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #888888;
      text-align: center;
      padding: 8px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* Brand Footer Info */
    .brand-title {
      color: #b51c1c;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 5px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .brand-desc {
      font-size: 9.5px;
      color: #333333;
      text-align: center;
      line-height: 1.45;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Black Tag -->
    <div class="header-top">
      <div class="badge">&#9670; 40个「新中式」女装品牌盘点</div>
    </div>

    <!-- Main Section Header -->
    <div class="main-title">
      <span class="arrow">&gt;</span>
      <span>「新中式」：东方优雅熟女篇——中高端</span>
    </div>

    <!-- 2x2 Grid of Brands -->
    <div class="grid">
      <!-- Item 1: 轮廓 -->
      <div class="card">
        <div class="brand-header text-logo">輪廓</div>
        <figure class="placeholder">
          [Photo: 3 models wearing 輪廓 designs]
        </figure>
        <div class="brand-title">轮廓 (南京)</div>
        <div class="brand-desc">
          打造中国最美民族品牌<br>
          将传统民族文化注入现代设计中<br>
          创造立于世界之林的中华服饰
        </div>
      </div>

      <!-- Item 2: 厅唐 -->
      <div class="card">
        <div class="brand-header ting-tang">TING TÁNG</div>
        <figure class="placeholder">
          [Photo: 3 models wearing TING TÁNG designs]
        </figure>
        <div class="brand-title">厅唐TINGTANG (台州)</div>
        <div class="brand-desc">
          以家居服拓展到日常服饰<br>
          融合中式元素与现代审美<br>
          演绎东方美学松弛度
        </div>
      </div>

      <!-- Item 3: 拾白 -->
      <div class="card">
        <div class="brand-header shi-bai">
          <div class="latin">SHI<br>BAI</div>
          <div class="chinese">拾白</div>
        </div>
        <figure class="placeholder">
          [Photo: 3 models wearing 拾白 designs]
        </figure>
        <div class="brand-title">拾白SHIBAI (广州)</div>
        <div class="brand-desc">
          原创新中式女装品牌<br>
          传承东方古典美的气韵<br>
          把女性的温婉柔美刻画的淋漓尽致
        </div>
      </div>

      <!-- Item 4: HECO -->
      <div class="card">
        <div class="brand-header heco">
          <div class="brand-name">HECO</div>
          <div class="sub-text">中 式 艺 术 家</div>
        </div>
        <figure class="placeholder">
          [Photo: 3 models wearing HECO designs]
        </figure>
        <div class="brand-title">HECO (佛山)</div>
        <div class="brand-desc">
          中式艺术家品牌<br>
          融合中国古典文化与当代时装<br>
          呈现出时髦、日常的新中式服装
        </div>
      </div>
    </div>
  </div>

</body>
</html>
