<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用合理的标点符号</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      color: #333333;
    }

    .poster {
      background-color: #ffffff;
      width: 100%;
      max-width: 540px;
      padding: 45px 36px 25px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .header-left {
      flex: 1;
    }

    .title-line {
      display: inline-block;
      background-color: #f6ec3b;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.15;
      padding: 2px 8px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: #333333;
      letter-spacing: 0.2px;
    }

    .header-right {
      margin-left: 20px;
    }

    .number-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1.5px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #222222;
    }

    /* Cards */
    .card {
      position: relative;
      border-radius: 2px;
      padding: 30px 32px 35px;
      margin-bottom: 24px;
    }

    .card-top {
      background-color: #faf4f0;
    }

    .card-bottom {
      background-color: #f1f6fc;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .circle-icon {
      width: 18px;
      height: 18px;
      border: 2px solid #e0aa89;
      border-radius: 50%;
      display: inline-block;
    }

    .cross-icon {
      font-size: 20px;
      line-height: 1;
      color: #8faed3;
      font-weight: 300;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #222222;
    }

    .content-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Example Styles */
    .example-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 500;
      color: #222222;
    }

    .example-divider {
      margin-bottom: 22px;
    }

    .example-row {
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
    }

    .label-bold {
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sep {
      color: #999999;
      font-weight: 300;
    }

    .badge {
      background-color: #df6459;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 2px;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .label-colon {
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Placeholder figures */
    .placeholder {
      position: absolute;
      right: 28px;
      bottom: 20px;
      width: 72px;
      height: 72px;
      border: 1px dashed #c0b8b2;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 10px;
      color: #777777;
      padding: 4px;
    }

    .card-bottom .placeholder {
      bottom: 15px;
      border-color: #b5c4d6;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 36px;
      padding-top: 10px;
    }

    .footer-left {
      font-size: 9px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      color: #555555;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .footer-right {
      display: flex;
      align-items: center;
    }

    .brand-box {
      border: 1px solid #333333;
      padding: 2px 4px;
      font-size: 7px;
      line-height: 1.1;
      text-align: center;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .brand-box .top-text {
      border-bottom: 0.5px solid #333333;
      padding-bottom: 1px;
      width: 100%;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <div class="poster">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div><span class="title-line">使用合理的</span></div>
        <div><span class="title-line">标点符号</span></div>
        <p class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</p>
      </div>
      <div class="header-right">
        <div class="number-circle">01</div>
      </div>
    </header>

    <!-- Card 1: Straight lines and borders -->
    <section class="card card-top">
      <div class="card-title-row">
        <span class="circle-icon"></span>
        <h2 class="card-title">使用直线或外框</h2>
      </div>

      <div class="content-block">
        <!-- Sub-example 1 -->
        <div class="example-group example-divider">
          <div class="example-row">
            <span class="label-bold">地点</span>
            <span class="sep">|</span>
            <span>武汉国际会展中心</span>
          </div>
          <div class="example-row">
            <span class="label-bold">时间</span>
            <span class="sep">|</span>
            <span>2018年8月20日</span>
          </div>
        </div>

        <!-- Sub-example 2 -->
        <div class="example-group">
          <div class="example-row">
            <span class="badge">地点</span>
            <span>武汉国际会展中心</span>
          </div>
          <div class="example-row">
            <span class="badge">时间</span>
            <span>2018年8月20日</span>
          </div>
        </div>
      </div>

      <figure class="placeholder">
        [Illustration: Cool chick wearing sunglasses]
      </figure>
    </section>

    <!-- Card 2: Colons -->
    <section class="card card-bottom">
      <div class="card-title-row">
        <span class="cross-icon">&#x2715;</span>
        <h2 class="card-title">使用冒号</h2>
      </div>

      <div class="content-block" style="margin-top: 15px; margin-bottom: 15px;">
        <div class="example-group">
          <div class="example-row">
            <span class="label-colon">地点：</span>
            <span>武汉国际会展中心</span>
          </div>
          <div class="example-row">
            <span class="label-colon">时间：</span>
            <span>2018年8月20日</span>
          </div>
        </div>
      </div>

      <figure class="placeholder">
        [Illustration: Angry chick crossing arms]
      </figure>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <div>ADVERTISING CREATIVITY</div>
        <div>2023.05</div>
      </div>
      <div class="footer-right">
        <div class="brand-box">
          <span class="top-text">CREATIVE DESIGN</span>
          <span>大猫设计屋</span>
        </div>
      </div>
    </footer>
  </div>

</body>
</html>
