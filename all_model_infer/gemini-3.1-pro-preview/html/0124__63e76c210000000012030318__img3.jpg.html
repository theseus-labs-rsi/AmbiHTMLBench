<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Notes</title>
<style>
    body {
        background-color: #1e1e1e;
        display: flex;
        justify-content: center;
        padding: 20px;
        margin: 0;
    }
    .notebook-page {
        background-color: #e8e2d5;
        width: 100%;
        max-width: 600px;
        padding: 20px 0 40px 0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
        font-size: 22px;
        color: #1a1a1a;
        position: relative;
        overflow: hidden;
    }
    /* Simulate the notebook binding shadow on the right */
    .notebook-page::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 40px;
        background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.15) 100%);
        pointer-events: none;
    }
    .line {
        border-bottom: 1px solid #c4bcae;
        height: 48px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 240px 1fr;
        align-items: end;
        padding-bottom: 6px;
    }
    .empty-line {
        border-bottom: 1px solid #c4bcae;
        height: 48px;
        box-sizing: border-box;
    }
    .en {
        padding-left: 45px;
        letter-spacing: 0.5px;
    }
    .cn {
        padding-left: 10px;
        padding-right: 20px;
    }
    .ink-black {
        color: #222222;
    }
    .ink-blue {
        color: #3b4d8c;
    }
</style>
</head>
<body>

<div class="notebook-page">
    <div class="empty-line"></div>
    
    <!-- Group 1 -->
    <div class="line ink-black">
        <div class="en">charity</div>
        <div class="cn">n. 慈善机构</div>
    </div>
    <div class="line ink-black">
        <div class="en">clarity</div>
        <div class="cn">n. (思路，图像)清晰</div>
    </div>
    <div class="line ink-black">
        <div class="en">clarify</div>
        <div class="cn">v. 阐明，阐释</div>
    </div>
    
    <div class="empty-line"></div>
    
    <!-- Group 2 -->
    <div class="line ink-blue">
        <div class="en">consistent</div>
        <div class="cn">adj. 一贯的，与...一致的</div>
    </div>
    <div class="line ink-blue">
        <div class="en">resist</div>
        <div class="cn">v. 抵制</div>
    </div>
    <div class="line ink-blue">
        <div class="en">insist</div>
        <div class="cn">v. 坚持</div>
    </div>
    
    <div class="empty-line"></div>
    
    <!-- Group 3 -->
    <div class="line ink-black">
        <div class="en">insert</div>
        <div class="cn">v. 插入，嵌入</div>
    </div>
    <div class="line ink-black">
        <div class="en">assert</div>
        <div class="cn">v. 断言；坚持主张</div>
    </div>
    
    <div class="empty-line"></div>
    
    <!-- Group 4 -->
    <div class="line ink-blue">
        <div class="en">eminent</div>
        <div class="cn">adj. 杰出的</div>
    </div>
    <div class="line ink-blue">
        <div class="en">prominent</div>
        <div class="cn">adj. 杰出的，重要的</div>
    </div>
    <div class="line ink-blue">
        <div class="en">eliminate</div>
        <div class="cn">v. 消除；淘汰</div>
    </div>
    
    <div class="empty-line"></div>
    
    <!-- Group 5 -->
    <div class="line ink-black">
        <div class="en">integral</div>
        <div class="cn">adj. 必不可少的</div>
    </div>
    <div class="line ink-black">
        <div class="en">integrity</div>
        <div class="cn">n. 诚实，正直</div>
    </div>
    <div class="line ink-black">
        <div class="en">integrate</div>
        <div class="cn">v. (使)融入</div>
    </div>
    
    <div class="empty-line"></div>
    
    <!-- Group 6 -->
    <div class="line ink-blue">
        <div class="en">fabricate</div>
        <div class="cn">v. 捏造</div>
    </div>
    <div class="line ink-blue">
        <div class="en">fluctuate</div>
        <div class="cn">v. 波动，上下浮动</div>
    </div>
    
    <div class="empty-line"></div>
    <div class="empty-line"></div>
</div>

</body>
</html>
