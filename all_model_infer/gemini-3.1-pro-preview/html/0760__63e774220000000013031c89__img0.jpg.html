<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类比推理</title>
    <style>
        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            color: #333333;
            line-height: 1.6;
            padding: 30px;
            margin: 0;
            background-color: #ffffff;
            font-size: 16px;
        }
        .main-title {
            display: inline-block;
            border: 1.5px solid #668b42;
            color: #668b42;
            padding: 6px 14px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .badge {
            background-color: #728cb1;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            padding: 0px 5px;
            border-radius: 3px;
            margin-right: 8px;
            height: 20px;
            min-width: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .section-title {
            color: #668b42;
            font-weight: bold;
            font-size: 17px;
        }
        .content-line {
            margin-bottom: 4px;
        }
        .flex-row {
            display: flex;
            align-items: flex-start;
            margin-top: 10px;
        }
        .flex-row-s2 {
            margin-top: 15px;
        }
        .col-left {
            width: 250px;
            flex-shrink: 0;
        }
        .col-left-wide {
            width: 280px;
            flex-shrink: 0;
        }
        .text-green-bold {
            color: #668b42;
            font-weight: bold;
        }
        .text-black-bold {
            color: #222222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-title">四、类比推理</div>

    <div class="section">
        <div class="section-header">
            <span class="badge">1</span>
            <span class="section-title">语义关系</span>
        </div>
        <div class="content-line">①近反义词②比喻象征</div>
        <div class="content-line">③谦词，敬词，语体色彩（褒义词，贬义词）</div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="badge">2</span>
            <span class="section-title">逻辑关系</span>
        </div>
        <div class="content-line">①并列关系②矛盾关系（非此即彼）③反对关系（存在小三）</div>
        <div class="flex-row flex-row-s2">
            <div class="col-left text-green-bold">👉二级辨析：同一范畴</div>
            <div class="text-black-bold">并列+对应考察</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="badge">3</span>
            <span class="section-title">包容关系</span>
        </div>
        <div class="content-line">种属：①...是... ②特指</div>
        <div class="content-line">③...不是...</div>
        <div class="flex-row">
            <div class="col-left">④主要/次要，必然/或然</div>
            <div>组成：零部件</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="badge">4</span>
            <span class="section-title">交叉关系：</span>
        </div>
        <div class="content-line">从不同角度描述同一事物，有交集，用有的是有的不是造句</div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="badge">5</span>
            <span class="section-title">对应关系</span>
        </div>
        <div class="content-line">1.材料</div>
        <div class="content-line">2.工艺，二级辨析：物理化学变化，是否有新生物质生成</div>
        <div class="content-line">3.功能：主要/次要</div>
        <div class="content-line">4.属性：必然/或然</div>
        <div class="content-line">5.时间顺序</div>
        <div class="flex-row">
            <div class="col-left-wide text-green-bold">👉二级辨析：行为发出主体</div>
            <div class="text-black-bold">必要条件、因果</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="badge">6</span>
            <span class="section-title">语法关系</span>
        </div>
        <div class="content-line">主谓/主宾/动宾</div>
    </div>

</body>
</html>
