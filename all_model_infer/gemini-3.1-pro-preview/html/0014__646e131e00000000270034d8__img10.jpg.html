<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老吴の创业随笔</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #d1b493; 
        background-image: linear-gradient(135deg, #e3cdb2 0%, #c4a17a 100%);
        color: #1a1a1a;
        font-family: "KaiTi", "楷体", "STKaiti", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        width: 100%;
        max-width: 600px;
        padding: 50px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 90vh;
    }
    .header {
        text-align: center;
        font-size: 22px;
        letter-spacing: 2px;
        margin-bottom: 50px;
        font-weight: normal;
    }
    .content {
        font-size: 38px;
        line-height: 2.2;
        letter-spacing: 4px;
        margin: 0 auto;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .content div {
        white-space: nowrap;
    }
    .footer {
        text-align: center;
        font-size: 18px;
        margin-top: 50px;
        font-family: "SimHei", "黑体", sans-serif;
        letter-spacing: 1.5px;
        color: #222;
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        老吴の创业随笔
    </div>
    <div class="content">
        <div>　　《易经》中说：“小财</div>
        <div>靠勤，大财靠德，德不厚</div>
        <div>，无以载物。”靠出卖时</div>
        <div>间和劳动力赚钱的人，</div>
        <div>只能发点小财。一个人每</div>
        <div>天，时间有限，精力有限</div>
        <div>，分身乏术。</div>
    </div>
    <div class="footer">
        商业思维 | 个人提升 | 创业心得 | 认知觉醒
    </div>
</div>
</body>
</html>
