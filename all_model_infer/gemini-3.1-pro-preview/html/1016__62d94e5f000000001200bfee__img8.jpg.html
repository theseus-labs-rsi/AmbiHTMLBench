<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宿建议</title>
    <style>
        body {
            background-color: #fdfaf4;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            color: #1a1a1a;
            margin: 0;
        }

        .document-container {
            width: 400px;
            max-width: 100%;
        }

        .main-title {
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .sub-title {
            text-align: center;
            font-size: 17px;
            margin-bottom: 45px;
            letter-spacing: 2px;
        }

        .highlight-underline {
            border-bottom: 2px solid #a83232;
            padding-bottom: 2px;
        }

        .highlight-emphasis {
            text-emphasis: open circle #a83232;
            -webkit-text-emphasis: open circle #a83232;
            text-emphasis-position: under;
            -webkit-text-emphasis-position: under;
        }

        .content-block {
            font-size: 15px;
            line-height: 2.1;
            margin-bottom: 35px;
            text-align: justify;
            word-break: break-all;
        }

        .bold-label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="document-container">
        <div class="main-title">住宿<span class="highlight-underline">建议</span></div>
        <div class="sub-title">[ 选酒店<span class="highlight-emphasis">关注点</span> ]</div>

        <div class="content-block">
            <span class="bold-label">[沙滩]</span>：亲子家庭出行游，<span class="highlight-underline">对沙滩的质量和海水的选择上要干净、清澈，沙子细软不扎脚的</span>。有私人海滩更佳
        </div>

        <div class="content-block">
            <span class="bold-label">[酒店设施]</span>：针对酒店的洗护有没有提供宝宝专用，以及宝宝专用的洗漱台和马桶等等，以及<span class="highlight-underline">有没有婴儿床、床围等</span>床上用品提供
        </div>

        <div class="content-block">
            <span class="bold-label">[房间]</span>：房间主题最好有小朋友喜欢的主题，<span class="highlight-underline">比如太空主题</span>的房间或者星空主题的房间；以及房间<span class="highlight-underline">有没有提供儿童帐篷、</span>滑梯等玩乐设施。房型<span class="highlight-underline">面积最好大一些，有足够的空间给小</span>朋友跑跳玩乐
        </div>

        <div class="content-block">
            <span class="bold-label">[儿童玩乐设施]</span>：看酒店儿童玩乐设施<span class="highlight-underline">室内还是室外.设施是不是每日一消毒</span>，看空间宽不宽敞。有没有家长休息区。有没有<span class="highlight-underline">托管服务</span>，托管时间，托管玩的项目等具体小朋友玩乐细节
        </div>
    </div>
</body>
</html>
