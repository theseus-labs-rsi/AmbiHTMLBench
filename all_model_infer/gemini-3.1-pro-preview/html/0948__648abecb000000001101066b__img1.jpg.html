<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会被无缘无故讨厌的原因有哪些</title>
<style>
    body {
        /* Approximate the textured, light grey paper background */
        background-color: #ebebeb;
        background-image: radial-gradient(circle, #f0f0f0 0%, #e0e0e0 100%);
        display: flex;
        justify-content: center;
        padding: 50px 20px;
        margin: 0;
        /* Use standard Chinese calligraphic/serif fonts to match the image's style */
        font-family: 'KaiTi', 'STKaiti', 'SimKai', 'BiauKai', serif;
        color: #1a1a1a;
    }
    .document-container {
        /* Restrict width to maintain the exact line breaks naturally if needed, but we use <br> for precision */
        width: max-content;
        max-width: 100%;
        padding: 20px;
    }
    .title {
        color: #2e6c31; /* Dark green matching the image */
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 35px;
        letter-spacing: 1px;
    }
    .text-block {
        font-size: 20px;
        line-height: 1.8;
        letter-spacing: 1.5px;
        /* Slight padding to align the text block correctly relative to the title */
        padding-left: 5px; 
    }
    .indent {
        display: inline-block;
        width: 2em;
    }
    .highlight-green {
        color: #2e6c31;
    }
</style>
</head>
<body>
    <div class="document-container">
        <div class="title">
            1、会被无缘无故讨厌的原因有哪些？
        </div>
        <div class="text-block">
            <span class="indent"></span>“无缘无故的讨厌”有很多原因，比如：<br>
            ①长相凶狠的人让我们害怕(承认吧，我<br>
            们都是外貌协会)；<br>
            ②刻板印象让你对一个人产生先入为主<br>
            的偏见:印象里重庆人火爆，上海人爱计<br>
            较。于是你真去到重庆，并且正好遇到<br>
            重庆人当街斗殴，你的大脑就会激活“<br>
            重庆人火爆”的认知并加强；<br>
            ③心理学上认为的:对一个人的好恶可能<br>
            是<span class="highlight-green">“投射效应”在起作用。</span><br>
            <span class="indent"></span>那么，“投射效应”到底是如何会让别<br>
            人无缘无故讨厌你的呢？
        </div>
    </div>
</body>
</html>
