<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音 VS 快手</title>
<style>
    body {
        background-color: #e8c396;
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 100%;
        max-width: 600px;
        position: relative;
    }
    .header-section {
        text-align: center;
        position: relative;
        margin-bottom: 20px;
    }
    .main-title-wrapper {
        position: relative;
        display: inline-block;
        margin-top: 20px;
    }
    .main-title-bg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #f5b942;
        height: 45px;
        width: 130%;
        z-index: 1;
    }
    .main-title {
        font-size: 52px;
        font-weight: 900;
        color: white;
        -webkit-text-stroke: 2.5px #4a2511;
        text-shadow: 3px 3px 0 #4a2511;
        position: relative;
        z-index: 2;
        margin: 0;
        letter-spacing: 4px;
    }
    .subtitle-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
        z-index: 3;
    }
    .paintbrush-placeholder {
        width: 90px;
        height: 110px;
        position: absolute;
        left: 5%;
        top: -40px;
        transform: rotate(-20deg);
        z-index: 4;
        background-color: rgba(255, 255, 255, 0.6);
        border: 2px dashed #4a2511;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #4a2511;
        text-align: center;
        border-radius: 10px;
    }
    .subtitle {
        background-color: #fdf3d0;
        border: 3px solid #4a2511;
        border-radius: 40px;
        padding: 10px 50px;
        font-size: 32px;
        font-weight: 900;
        color: white;
        -webkit-text-stroke: 1.5px #4a2511;
        text-shadow: 2px 2px 0 #4a2511;
        position: relative;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        letter-spacing: 2px;
    }
    .content-board {
        background-color: white;
        border-radius: 12px;
        padding: 60px 20px 40px 20px;
        margin-top: -35px;
        position: relative;
        z-index: 2;
        box-shadow: 0 8px 16px rgba(0,0,0,0.05);
    }
    .section {
        margin-bottom: 50px;
    }
    .section-header {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
        position: relative;
        left: -35px;
    }
    .section-number {
        background-color: #4a2511;
        color: white;
        font-size: 28px;
        font-weight: bold;
        padding: 8px 30px;
        border-radius: 30px;
        margin-right: 20px;
        letter-spacing: 1px;
    }
    .section-title {
        font-size: 24px;
        font-weight: bold;
        color: #4a2511;
        position: relative;
        display: inline-block;
        letter-spacing: 1px;
    }
    .section-title::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #f5b942;
        opacity: 0.6;
        z-index: -1;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        font-size: 14px;
        color: #333;
        table-layout: fixed;
    }
    th {
        background-color: #f5b942;
        color: white;
        padding: 12px 8px;
        font-weight: normal;
        border: 2px solid white;
    }
    td {
        padding: 15px 8px;
        border: 2px solid white;
        line-height: 1.4;
    }
    tr.row-bg-1 td {
        background-color: #fdf3d0;
    }
    tr.row-bg-2 td {
        background-color: #ffffff;
    }
    .footer-line {
        border-bottom: 3px dashed #f5b942;
        width: 30%;
        margin: 20px auto 0 auto;
    }
    
    .t1-col1 { width: 12%; }
    .t1-col2 { width: 22%; }
    .t1-col3 { width: 18%; }
    .t1-col4 { width: 26%; }
    .t1-col5 { width: 22%; }

    .t2-col1 { width: 18%; }
    .t2-col2 { width: 52%; }
    .t2-col3 { width: 30%; }

</style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <div class="main-title-wrapper">
            <div class="main-title-bg"></div>
            <h1 class="main-title">抖音 VS 快手</h1>
        </div>
        
        <div class="subtitle-wrapper">
            <div class="paintbrush-placeholder placeholder">[Image:<br>Paintbrush]</div>
            <div class="subtitle">产品小课堂</div>
        </div>
    </div>

    <div class="content-board">
        <div class="section">
            <div class="section-header">
                <div class="section-number">03</div>
                <div class="section-title">抖音与快手</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="t1-col1"></th>
                        <th class="t1-col2">slogan</th>
                        <th class="t1-col3">产品定位</th>
                        <th class="t1-col4">策略</th>
                        <th class="t1-col5">变现</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="row-bg-1">
                        <td>抖音</td>
                        <td>记录美好生活</td>
                        <td>短视频媒体</td>
                        <td>以优质内容为中心</td>
                        <td>广告收入、电商</td>
                    </tr>
                    <tr class="row-bg-2">
                        <td>快手</td>
                        <td>拥抱每一种生活</td>
                        <td>短视频社区</td>
                        <td>以社交中心，大部分流量</td>
                        <td>直播收入、电商</td>
                    </tr>
                    <tr class="row-bg-1">
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-number">04</div>
                <div class="section-title">抖音电商与快手电商</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="t2-col1"></th>
                        <th class="t2-col2">产品定位</th>
                        <th class="t2-col3">重点指标</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="row-bg-1">
                        <td>抖音电商</td>
                        <td>兴趣逻辑，内容场景刺激需求</td>
                        <td>直播间GPM</td>
                    </tr>
                    <tr class="row-bg-2">
                        <td>快手电商</td>
                        <td>信任逻辑，头部主播优势</td>
                        <td>复购</td>
                    </tr>
                    <tr class="row-bg-1">
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                        <td>&nbsp;</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="footer-line"></div>
    </div>
</div>

</body>
</html>
