<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten Note</title>
<style>
  body {
    background-color: #2b2b2b;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .page {
    background-color: #f4ecdc;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
    color: #1a1a1a;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 15px 20px 5px 20px;
    border-bottom: 2px solid #222;
    position: relative;
    font-family: 'Arial', sans-serif;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    right: 0;
    border-bottom: 1px solid #222;
  }
  .days-box {
    display: flex;
    border: 1px solid #222;
    border-right: none;
    font-size: 11px;
    color: #222;
  }
  .days-box span {
    padding: 2px 5px;
    border-right: 1px solid #222;
  }
  .date-box {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #222;
    padding-bottom: 2px;
  }
  .content {
    margin-top: 6px;
    background-image: repeating-linear-gradient(
      transparent,
      transparent 47px,
      #b5b5b5 47px,
      #b5b5b5 48px
    );
    background-size: 100% 48px;
    padding: 0 20px 20px 20px;
    min-height: 750px;
  }
  .line {
    height: 48px;
    line-height: 48px;
    font-size: 26px;
    white-space: pre-wrap;
    letter-spacing: 1px;
  }
  .indent {
    margin-left: 1.5em;
  }
  u {
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 2px;
    text-decoration-skip-ink: none;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="days-box">
        <span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
      <div class="date-box">Date. &nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;&nbsp;</div>
    </div>
    <div class="content">
      <div class="line indent"><u>这是好的开始</u></div>
      <div class="line"></div>
      <div class="line">从你看到<u>这篇文章</u>开始.</div>
      <div class="line">你会<u>越来越</u>有钱</div>
      <div class="line"><u>越来越</u>好看.</div>
      <div class="line"><u>生活和心态</u>、也会<u>越来越好</u>.</div>
      <div class="line">请相信大数据.</div>
      <div class="line">是你自己<u>把一切美好的东西</u>.</div>
      <div class="line">都<u>吸引</u>了过来</div>
      <div class="line">你已经调到了<u>接收钱的频率</u></div>
      <div class="line">接收<u>美的频率</u>.</div>
      <div class="line">你的能量频率<u>对了才接收到这</u></div>
      <div class="line">条信息.</div>
      <div class="line">留下一句“全收到”</div>
      <div class="line"><u>愿所有的愿望全能实现！</u></div>
    </div>
  </div>
</body>
</html>
