<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f7f7f7;
            margin: 0;
            padding: 30px 25px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #3b3b3b;
            font-size: 17px;
            line-height: 1.6;
        }
        .entry {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="entry">审核：<br>指进入语c群时，被群主审看人设、皮气等<br>行为。</div>
    <div class="entry">新人：<br>指初入某个圈子的人。</div>
    <div class="entry">纯白：<br>完全不了解语c的人或刚接触语c。</div>
    <div class="entry">小白：<br>指出入语c圈或对语c一无所知的人。</div>
    <div class="entry">小窗：<br>指聊天会话的窗口（与QQ的私聊差不多）</div>
    <div class="entry">隔壁：<br>指代另一个地方（隔壁群，隔壁平台）</div>
    <div class="entry">首页：<br>在语c平台中，上皮发言互动的地方。</div>
    <div class="entry">水区：<br>在语c平台中，皮下发言探讨问题或闲聊的<br>地方。</div>
    <div class="entry">扩列：<br>扩充列表，即加好友的意思。</div>
    <div class="entry">掌控：<br>指开戏文字超过七百一段的人。</div>
    <div class="entry">字控：<br>夸张手法，指一次开几个字为一段的人。</div>
    <div class="entry">句控：<br>指开戏只开一行~三行为一段的人。</div>
</body>
</html>
