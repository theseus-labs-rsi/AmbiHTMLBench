<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部交易抵销</title>
<style>
  body {
    background-color: #fdf5e6;
    background-image: linear-gradient(90deg, rgba(139, 90, 43, 0.05) 1px, transparent 1px);
    background-size: 20px 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: #333;
  }
  .card {
    background-color: #ffffff;
    border: 1.5px solid #8b5a2b;
    border-radius: 12px;
    width: 540px;
    min-height: 700px;
    position: relative;
    padding: 50px 40px 160px 40px;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .placeholder {
    border: 2px dashed #ccc;
    background-color: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 12px;
    color: #999;
    position: absolute;
    box-sizing: border-box;
    padding: 5px;
  }
  .header {
    text-align: center;
    color: #8b5a2b;
    margin-bottom: 40px;
  }
  .title-1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .title-2 {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .content-area {
    padding-left: 10px;
    position: relative;
  }
  .highlight-box {
    display: inline-block;
    background: linear-gradient(to right, #fdf0d5, #fce4b5, #fdf0d5);
    color: #8b5a2b;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 16px;
    margin-bottom: 35px;
  }
  .section-title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 12px;
  }
  .calc-block {
    display: flex;
    align-items: center;
    margin-left: 30px;
    margin-bottom: 35px;
    font-size: 14px;
  }
  .calc-left {
    text-align: right;
    line-height: 1.8;
  }
  .brace-svg {
    margin: 0 10px;
  }
  .arrow-group {
    position: absolute;
    right: 10px;
    top: 115px;
    display: flex;
    align-items: center;
  }
  .arrow-text {
    margin-left: 10px;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
  }
  .accounting {
    margin-top: 50px;
    font-size: 15px;
    color: #444;
  }
  .acc-line-1 {
    margin-bottom: 10px;
  }
  .acc-line-2 {
    margin-left: 75px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Top Paw Placeholders -->
  <div class="placeholder" style="top: 35px; left: 130px; width: 40px; height: 35px; border-radius: 50%; border-color: #e6cba8; background: transparent; color: #d2a679;">[Paw Icon]</div>
  <div class="placeholder" style="top: 25px; right: 110px; width: 45px; height: 40px; border-radius: 50%; border-color: #e6cba8; background: transparent; color: #d2a679;">[Paw Icon]</div>

  <!-- Header -->
  <div class="header">
    <div class="title-1">内部交易抵销</div>
    <div class="title-2">第③步：调整所得税</div>
  </div>

  <div class="content-area">
    <!-- Subheader -->
    <div class="highlight-box">若实现60%对外销售</div>

    <!-- Section 1 -->
    <div class="section-title">个别报表层面因为存货跌价准备：</div>
    <div class="calc-block">
      <div class="calc-left">
        <div>账面价值 900</div>
        <div>计税基础 1200</div>
      </div>
      <svg class="brace-svg" width="14" height="44" viewBox="0 0 14 44">
        <path d="M 2 2 Q 10 2 10 12 T 12 22 Q 10 22 10 32 T 2 42" fill="none" stroke="#7a93b2" stroke-width="1.5"/>
      </svg>
      <div>递延所得税资产300*25%=75</div>
    </div>

    <!-- Section 2 -->
    <div class="section-title">合并报表层面因为存货跌价准备：</div>
    <div class="calc-block">
      <div class="calc-left">
        <div>账面价值800</div>
        <div>计税基础1200</div>
      </div>
      <svg class="brace-svg" width="14" height="44" viewBox="0 0 14 44">
        <path d="M 2 2 Q 10 2 10 12 T 12 22 Q 10 22 10 32 T 2 42" fill="none" stroke="#7a93b2" stroke-width="1.5"/>
      </svg>
      <div>递延所得税资产400*25%=100</div>
    </div>

    <!-- Arrow Group -->
    <div class="arrow-group">
      <svg width="20" height="110" viewBox="0 0 20 110">
        <rect x="8" y="0" width="4" height="95" fill="#5b9bd5" />
        <polygon points="0,95 20,95 10,110" fill="#5b9bd5" />
      </svg>
      <div class="arrow-text">
        <div>【集团角度】</div>
        <div>调增25</div>
      </div>
    </div>

    <!-- Accounting Treatment -->
    <div class="accounting">
      <div class="acc-line-1">会计处理：借：递延所得税资产25</div>
      <div class="acc-line-2">贷：所得税费用25</div>
    </div>
  </div>

  <!-- Bottom Cat Placeholders -->
  <div class="placeholder" style="bottom: 20px; left: 20px; width: 140px; height: 100px; border-radius: 10px;">[Sleeping Cat Illustration]</div>
  <div class="placeholder" style="bottom: 20px; right: 20px; width: 120px; height: 140px; border-radius: 10px;">[Fishing Cat Illustration]</div>

</div>

</body>
</html>
