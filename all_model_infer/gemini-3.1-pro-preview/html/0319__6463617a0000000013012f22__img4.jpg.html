<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回避行为</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #e5e5e5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: sans-serif;
    }

    .card-container {
        width: 480px;
        height: 640px;
        background-color: #ffffff;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }

    /* Blue Decorative Accents */
    .deco {
        position: absolute;
        background-color: #1221b0;
    }

    .deco-tl {
        top: 0;
        left: 0;
        width: 120px;
        height: 160px;
        clip-path: polygon(0 0, 100% 0, 100% 12%, 18% 18%, 12% 100%, 0 100%);
    }

    .deco-r {
        right: 0;
        top: 260px;
        width: 15px;
        height: 120px;
        clip-path: polygon(100% 0, 100% 100%, 0 85%, 0 15%);
    }

    .deco-bl {
        bottom: 0;
        left: 0;
        width: 60px;
        height: 60px;
        clip-path: polygon(0 100%, 0 15%, 100% 100%);
    }

    .deco-br {
        bottom: 0;
        right: 0;
        width: 60px;
        height: 60px;
        clip-path: polygon(100% 100%, 100% 15%, 0 100%);
    }

    .deco-bm {
        bottom: 0;
        left: 70px;
        right: 70px;
        height: 12px;
        clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 100%, 0 100%);
    }

    /* Text Content */
    .content {
        position: relative;
        z-index: 10;
        padding: 70px 45px 40px 45px;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .number {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-size: 54px;
        font-weight: 900;
        color: #000000;
        line-height: 1;
        margin-bottom: 5px;
        letter-spacing: 1px;
    }

    .title {
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif;
        font-size: 48px;
        font-weight: 900;
        color: #000000;
        line-height: 1.1;
        margin-bottom: 95px;
        letter-spacing: 2px;
    }

    .definition {
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #000000;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .example {
        font-family: 'STSong', 'SimSun', 'Songti SC', serif;
        font-size: 21px;
        font-weight: 400;
        color: #111111;
        line-height: 2.2;
    }
</style>
</head>
<body>

<div class="card-container">
    <!-- Blue Borders / Accents -->
    <div class="deco deco-tl"></div>
    <div class="deco deco-r"></div>
    <div class="deco deco-bl"></div>
    <div class="deco deco-bm"></div>
    <div class="deco deco-br"></div>

    <!-- Main Content -->
    <div class="content">
        <div class="number">03</div>
        <div class="title">回避行为</div>
        
        <div class="definition">
            自觉或不自觉地回避曾经的某些人、<br>
            事、物。
        </div>
        
        <div class="example">
            比如，学生时代受过伤，可能回避同<br>
            学聚会，不再听某些歌、看某些电影、<br>
            去某家餐厅……
        </div>
    </div>
</div>

</body>
</html>
