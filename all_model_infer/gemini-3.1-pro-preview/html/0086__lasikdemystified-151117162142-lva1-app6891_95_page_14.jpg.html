<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTA Formula</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #4f6b58;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .title-container {
            background: linear-gradient(to bottom, #45b6c6, #2a9eb0);
            width: 92%;
            max-width: 1200px;
            margin-top: 40px;
            padding: 15px 30px;
            box-sizing: border-box;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .title {
            color: #fff200;
            font-size: 42px;
            font-weight: 900;
            text-align: left;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }
        .content-box {
            background-color: #ffffff;
            width: 75%;
            max-width: 900px;
            margin-top: 80px;
            padding: 70px 50px;
            box-sizing: border-box;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .formula-container {
            text-align: center;
            margin-bottom: 60px;
            font-size: 28px;
        }
        .definitions {
            color: #283593;
            font-size: 26px;
            font-weight: bold;
            line-height: 2.2;
            margin-left: 15%;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1 class="title">PTA SHOULD BE LESS THAN 40 %</h1>
    </div>
    <div class="content-box">
        <div class="formula-container">
            $$ \color{#283593}{\textbf{\textsf{PTA = }}} \frac{\color{#283593}{\textbf{\textsf{(FT + AD)}}}}{\color{#283593}{\textbf{\textsf{CCT}}}} \hspace{1.5cm} \color{#c62828}{\textbf{\textsf{< 40\%}}} $$
        </div>
        <div class="definitions">
            <div>FT = flap thickness</div>
            <div>AD = ablation depth</div>
            <div>CCT = central corneal thickness</div>
        </div>
    </div>
</body>
</html>
