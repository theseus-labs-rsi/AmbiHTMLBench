<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Into The Darkness - Soulful Film</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .poster-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .presents-line {
            text-transform: uppercase;
            letter-spacing: 0.45em;
            font-size: 1rem;
            margin-top: 60px;
            margin-bottom: 35px;
            text-align: center;
        }

        .movie-title {
            color: #ce4040;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 7.5rem;
            font-weight: normal;
            text-align: center;
            line-height: 1.05;
            margin: 0 0 50px 0;
            letter-spacing: 0.02em;
        }

        .placeholder {
            width: 100%;
            height: 480px;
            background-color: #1a1a1a;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777777;
            font-style: italic;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        .sign-overlay {
            position: absolute;
            right: 13%;
            top: 25%;
            background-color: #f4f4f4;
            color: #000000;
            padding: 3px 8px;
            font-family: 'Arial Narrow', 'Helvetica Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
            font-style: normal;
            /* Slight transform to approximate perspective in the image */
            transform: skewX(-2deg) rotate(-1deg);
        }

        .director-line {
            color: #ce4040;
            font-size: 1.6rem;
            margin-top: 55px;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .event-details {
            text-align: center;
            font-size: 1.35rem;
            line-height: 1.6;
            letter-spacing: 0.04em;
            margin-bottom: 70px;
        }
    </style>
</head>
<body>
    <div class="poster-wrapper">
        <div class="presents-line">
            Soulful Film Presents
        </div>
        
        <h1 class="movie-title">
            INTO THE<br>DARKNESS
        </h1>
        
        <div class="placeholder">
            [Photograph: Black and white perspective shot looking down a parking garage ramp]
            <div class="sign-overlay">SELF PARK 6'-0'' CLEARANCE</div>
        </div>
        
        <div class="director-line">
            Directed by Levi Stanford
        </div>
        
        <div class="event-details">
            May 23, 2019 | 2:00 pm<br>
            Michael Hopper Auditorium<br>
            Oreixs university, OH
        </div>
    </div>
</body>
</html>
