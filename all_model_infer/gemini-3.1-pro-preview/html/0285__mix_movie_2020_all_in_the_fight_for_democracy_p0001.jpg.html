<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All In: The Fight For Democracy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }
        .poster-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .amazon-original {
            margin-top: 20px;
            font-size: 22px;
            letter-spacing: 12px;
            font-weight: bold;
            color: #000000;
            text-align: center;
        }
        .main-title-section {
            margin-top: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .tagline {
            color: #1a56c8;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            text-align: center;
        }
        .title-flex {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .all-in {
            color: #1a56c8;
            font-size: 110px;
            font-weight: bold;
            font-family: 'Impact', 'Arial Narrow', sans-serif;
            transform: scaleY(1.85);
            transform-origin: bottom;
            margin-right: 25px;
            line-height: 0.8;
            letter-spacing: -1px;
        }
        .fight-for-democracy {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 2px;
        }
        .title-line-text {
            color: #1a56c8;
            font-size: 46px;
            font-weight: bold;
            font-family: 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 1px;
            line-height: 1;
        }
        .red-bar {
            height: 9px;
            background-color: #e62429;
            width: 100%;
            margin: 6px 0;
        }
        .placeholder {
            border: 1px dashed #cccccc;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #666666;
            font-size: 12px;
        }
        .telluride-logo {
            width: 140px;
            height: 110px;
            margin-top: 90px;
        }
        .credits {
            color: #3b73d4;
            margin-top: 25px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .credits .small-text {
            font-size: 10px;
            vertical-align: middle;
        }
        .coming-soon {
            margin-top: 50px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #000000;
        }
        .date-prime-section {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        .date {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #000000;
        }
        .separator {
            font-size: 45px;
            font-weight: 300;
            margin: 0 20px;
            line-height: 1;
            color: #000000;
        }
        .prime-logo {
            width: 180px;
            height: 45px;
        }
        .hashtag-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }
        .hashtag-bar {
            height: 5px;
            background-color: #e62429;
            width: 100%;
        }
        .hashtag-text {
            color: #1a56c8;
            font-size: 24px;
            font-weight: bold;
            margin: 8px 0;
            letter-spacing: 1px;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 80px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .pg13-logo {
            width: 70px;
            height: 30px;
        }
        .amazon-studios-logo {
            width: 90px;
            height: 35px;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="amazon-original">AMAZON ORIGINAL</div>
        
        <div class="main-title-section">
            <div class="tagline">HOW THE RIGHT TO VOTE WENT WRONG</div>
            <div class="title-flex">
                <div class="all-in">ALL IN</div>
                <div class="fight-for-democracy">
                    <div class="title-line-text">THE FIGHT FOR</div>
                    <div class="red-bar"></div>
                    <div class="title-line-text">DEMOCRACY</div>
                    <div class="red-bar" style="margin-bottom: 0;"></div>
                </div>
            </div>
        </div>

        <div class="placeholder telluride-logo">
            [Logo: Telluride Film Festival 2020]
        </div>

        <div class="credits">
            <span class="small-text">WRITTEN BY</span> JACK YOUNGELSON &nbsp;&nbsp;&nbsp;&nbsp; <span class="small-text">DIRECTED BY</span> LIZ GARBUS <span class="small-text">AND</span> LISA CORTÉS
        </div>

        <div class="coming-soon">COMING SOON TO THEATERS</div>

        <div class="date-prime-section">
            <div class="date">SEPTEMBER 18</div>
            <div class="separator">|</div>
            <div class="placeholder prime-logo">
                [Logo: prime video]
            </div>
        </div>

        <div class="hashtag-section">
            <div class="hashtag-bar"></div>
            <div class="hashtag-text">#ALLINFORVOTING</div>
            <div class="hashtag-bar"></div>
        </div>

        <div class="footer">
            <div class="placeholder pg13-logo">
                [Logo: PG-13]
            </div>
            <div class="placeholder amazon-studios-logo">
                [Logo: AMAZON STUDIOS]
            </div>
        </div>
    </div>
</body>
</html>
