<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金句合集</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f6f6f6;
        display: flex;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
    }
    .mobile-container {
        width: 100%;
        max-width: 414px;
        background-color: #ffffff;
        min-height: 100vh;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
    }
    .header-left {
        display: flex;
        align-items: center;
        color: #d1b13b;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0.5px;
    }
    .header-right {
        display: flex;
        align-items: center;
        gap: 18px;
    }
    .content-area {
        padding: 30px 22px;
    }
    .quote-block {
        margin-bottom: 56px;
    }
    .quote-header {
        display: flex;
        align-items: center;
        margin-bottom: 22px;
    }
    .quote-icon {
        width: 22px;
        height: 22px;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .quote-title {
        font-size: 17px;
        font-weight: 600;
        color: #333333;
        letter-spacing: 0.5px;
    }
    .quote-body {
        padding-left: 34px; 
    }
    .quote-text {
        font-size: 16px;
        line-height: 1.85;
        color: #4a4a4a;
        margin: 0;
        text-align: justify;
        letter-spacing: 0.5px;
    }
</style>
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <div class="header-left">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d1b13b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; margin-left: -4px;">
                    <polyline points="14 18 8 12 14 6"></polyline>
                </svg>
                金句合集
            </div>
            <div class="header-right">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="7" r="4.5" stroke="#d1b13b" stroke-width="1.8"/>
                    <path d="M4 19c0-3.5 3-6.5 7-6.5h0" stroke="#d1b13b" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="18" cy="15" r="5" fill="#d1b13b" stroke="#ffffff" stroke-width="1.5"/>
                    <path d="M15.5 15l1.5 1.5 2.5-2.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d1b13b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 11v7a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-7" />
                    <path d="M12 15V3" />
                    <path d="M8 7l4-4 4 4" />
                </svg>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d1b13b" stroke-width="1.5">
                    <circle cx="12" cy="12" r="9.5" />
                    <circle cx="8" cy="12" r="1.2" fill="#d1b13b" stroke="none" />
                    <circle cx="12" cy="12" r="1.2" fill="#d1b13b" stroke="none" />
                    <circle cx="16" cy="12" r="1.2" fill="#d1b13b" stroke="none" />
                </svg>
            </div>
        </header>

        <main class="content-area">
            <section class="quote-block">
                <div class="quote-header">
                    <div class="quote-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="12" fill="#f8c219"/>
                            <path d="M7 12.5l3.5 3.5 6.5-6.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="quote-title">他写「成长」，正是你所亲历</div>
                </div>
                <div class="quote-body">
                    <p class="quote-text">
                        “我经由光阴，经由山水，经由乡村和城市，同样我也经由别人，经由一切他者以及由之引生的思绪和梦想而走成了我。那路途中的一切，有些与我擦肩而过从此天各一方，有些便永久驻进我的心魂，雕琢我，塑造我，锤炼我，融入我而成为我。”<br>
                        —— 《病隙碎笔》
                    </p>
                </div>
            </section>

            <section class="quote-block">
                <div class="quote-header">
                    <div class="quote-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="12" fill="#f8c219"/>
                            <path d="M7 12.5l3.5 3.5 6.5-6.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="quote-title">他写「磨难」，报之以歌</div>
                </div>
                <div class="quote-body">
                    <p class="quote-text">
                        “大劫大难之后人不该失去锐气，不该失去热度，你镇定了但仍在燃烧，你平稳了却更加浩荡。” —— 《好运设计》
                    </p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
