<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早发白帝城</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .poster {
        position: relative;
        width: 600px;
        height: 800px;
        background-color: #4b577a;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        overflow: hidden;
    }
    .watermark {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .wm-char {
        position: absolute;
        font-size: 380px;
        color: rgba(255, 255, 255, 0.03);
        font-family: "STXingkai", "Xingkai SC", "KaiTi", serif;
        line-height: 1;
        user-select: none;
    }
    .wm-li {
        right: 10%;
        top: 15%;
    }
    .wm-bai {
        left: 5%;
        top: 35%;
    }
    .col-large {
        position: absolute;
        right: 12%;
        top: 15%;
        display: flex;
        flex-direction: row-reverse;
        gap: 35px;
        z-index: 2;
    }
    .col-large .line {
        writing-mode: vertical-rl;
        text-orientation: upright;
        color: #2a314a;
        font-size: 48px;
        font-family: "STXingkai", "Xingkai SC", "KaiTi", serif;
        letter-spacing: 14px;
    }
    .col-medium {
        position: absolute;
        right: 42%;
        top: 26%;
        display: flex;
        flex-direction: row-reverse;
        gap: 25px;
        z-index: 2;
    }
    .col-medium .line {
        writing-mode: vertical-rl;
        text-orientation: upright;
        color: #e6e9f0;
        font-size: 26px;
        font-family: "SimSun", "STSong", serif;
        letter-spacing: 8px;
    }
    .col-small {
        position: absolute;
        left: 8%;
        top: 15%;
        writing-mode: vertical-rl;
        text-orientation: upright;
        color: #e6e9f0;
        font-size: 14px;
        font-family: "SimSun", "STSong", serif;
        letter-spacing: 2px;
        z-index: 2;
    }
    .col-small .author {
        margin-top: 40px;
        margin-bottom: 60px;
    }
    .bottom-band {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background-color: #fcf9f0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 3;
    }
    .bottom-text {
        color: #555555;
        font-size: 13px;
        font-family: "SimSun", "STSong", serif;
        letter-spacing: 1.5px;
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="watermark">
            <div class="wm-char wm-li">李</div>
            <div class="wm-char wm-bai">白</div>
        </div>
        
        <div class="col-large">
            <div class="line">朝辭白帝彩雲間</div>
            <div class="line">千里江陵一日還</div>
        </div>
        
        <div class="col-medium">
            <div class="line">两岸猿声啼不住，</div>
            <div class="line">轻舟已过万重山。</div>
        </div>
        
        <div class="col-small">
            <span>唐</span>
            <span class="author">李白</span>
            <span>早发白帝城</span>
        </div>
        
        <div class="bottom-band">
            <div class="bottom-text">两岸猿声，还在耳边不停地啼叫不知不觉，轻舟已穿过万重青山。</div>
        </div>
    </div>
</body>
</html>
