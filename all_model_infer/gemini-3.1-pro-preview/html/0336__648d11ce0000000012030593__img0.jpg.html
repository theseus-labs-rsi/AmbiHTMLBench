<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makeup Outline</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #ffffff;
        display: flex;
        justify-content: flex-start;
    }

    .tree-container {
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #333;
        font-size: 15px;
        line-height: 1.6;
        width: 100%;
        max-width: 600px;
    }

    ul {
        list-style: none;
        margin: 0;
        padding: 0;
        position: relative;
    }

    li {
        position: relative;
    }

    ul.level-2::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 11px;
        width: 1px;
        background-color: #e6e6e6;
        z-index: 1;
    }

    ul.level-3::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 35px;
        width: 1px;
        background-color: #e6e6e6;
        z-index: 1;
    }

    ul.level-2 > li:last-child::after {
        content: '';
        position: absolute;
        top: 20px;
        bottom: 0;
        left: 0;
        width: 24px;
        background-color: #ffffff;
        z-index: 2;
    }

    ul.level-3 > li:last-child::after {
        content: '';
        position: absolute;
        top: 20px;
        bottom: 0;
        left: 24px;
        width: 24px;
        background-color: #ffffff;
        z-index: 2;
    }

    .row {
        display: flex;
        align-items: stretch;
        position: relative;
        z-index: 3;
        background-color: transparent;
        min-height: 32px;
    }

    .content-wrapper {
        display: flex;
        flex-grow: 1;
        align-items: flex-start;
        padding: 6px 0;
    }

    .indent {
        flex-shrink: 0;
    }

    .bullet-container {
        width: 24px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        padding-top: 9px;
        background-color: #ffffff;
        height: 24px;
        box-sizing: border-box;
    }

    .bullet {
        width: 6px;
        height: 6px;
        background-color: #888;
        border-radius: 50%;
    }

    .text {
        flex-grow: 1;
        padding: 0 8px 0 4px;
        word-break: break-word;
    }

    .text.highlight {
        color: #a34343;
    }

    .toggle-container {
        width: 32px;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        padding-top: 12px;
        background-color: #fafafa;
        border-left: 1px solid #f0f0f0;
    }

    .toggle {
        color: #ccc;
        font-size: 10px;
    }
</style>
</head>
<body>

<div class="tree-container">
  <ul class="tree level-1">
    <li>
      <div class="row">
        <div class="content-wrapper">
            <div class="indent" style="width: 0px;"></div>
            <div class="bullet-container"><div class="bullet"></div></div>
            <div class="text highlight">第三阶段 认识自我，找到自我</div>
        </div>
        <div class="toggle-container"><div class="toggle">▼</div></div>
      </div>
      <ul class="level-2">
        <li>
          <div class="row">
            <div class="content-wrapper">
                <div class="indent" style="width: 24px;"></div>
                <div class="bullet-container"><div class="bullet"></div></div>
                <div class="text">不同国家的妆容模仿</div>
            </div>
            <div class="toggle-container"><div class="toggle">▼</div></div>
          </div>
          <ul class="level-3">
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">不同国家妆容特点分析</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">逐个部位模仿</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
          </ul>
        </li>
        <li>
          <div class="row">
            <div class="content-wrapper">
                <div class="indent" style="width: 24px;"></div>
                <div class="bullet-container"><div class="bullet"></div></div>
                <div class="text">明星出圈妆容模仿</div>
            </div>
            <div class="toggle-container"><div class="toggle">▼</div></div>
          </div>
          <ul class="level-3">
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">鞠婧祎妆容</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">虞书欣妆容</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">宋慧乔妆容</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">女团妆容</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">日本杂志妆容</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
          </ul>
        </li>
        <li>
          <div class="row">
            <div class="content-wrapper">
                <div class="indent" style="width: 24px;"></div>
                <div class="bullet-container"><div class="bullet"></div></div>
                <div class="text">找到适合自己的风格和妆容</div>
            </div>
            <div class="toggle-container"><div class="toggle">▼</div></div>
          </div>
          <ul class="level-3">
            <li>
              <div class="row">
                <div class="content-wrapper">
                    <div class="indent" style="width: 48px;"></div>
                    <div class="bullet-container"><div class="bullet"></div></div>
                    <div class="text">根据自己的穿衣风格，职业，谈吐等<br>确定自己适合的风格</div>
                </div>
                <div class="toggle-container"></div>
              </div>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
</div>

</body>
</html>
