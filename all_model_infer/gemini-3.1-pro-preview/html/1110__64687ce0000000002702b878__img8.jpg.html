<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok运营 48个必备工具</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    background-color: #2b4c3b;
    color: #ffffff;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
  }
  .poster {
    width: 100%;
    max-width: 600px;
  }
  .header {
    margin-bottom: 35px;
  }
  .title {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .tag {
    display: inline-block;
    background-color: #dca11d;
    color: #ffffff;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 2px;
  }
  .grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(12, minmax(25px, 1fr));
    gap: 12px;
  }
  .box {
    background-color: #6a9c64;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .part-num {
    font-size: 14px;
    font-weight: normal;
    margin-bottom: 12px;
    opacity: 0.9;
  }
  .box-title {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.35;
  }
  
  .box-1 { grid-area: 1 / 1 / 7 / 2; }
  .box-2 { grid-area: 1 / 2 / 5 / 3; }
  .box-3 { grid-area: 5 / 2 / 10 / 3; }
  .box-4 { grid-area: 10 / 1 / 13 / 3; }
  .box-5 { grid-area: 1 / 3 / 6 / 5; }
  .box-6 { grid-area: 6 / 3 / 13 / 4; }
  .box-7 { grid-area: 6 / 4 / 9 / 5; }
  .box-8 { grid-area: 9 / 4 / 13 / 5; }
</style>
</head>
<body>

<div class="poster">
  <div class="header">
    <div class="title">
      TikTok运营<br>
      48个必备工具
    </div>
    <div class="tag">
      @ 徐徐教你做TikTok
    </div>
  </div>

  <div class="grid-container">
    <div class="box box-1">
      <div class="part-num">Part 01</div>
      <div class="box-title">7个TK<br>数据平台</div>
    </div>
    <div class="box box-2">
      <div class="part-num">Part 02</div>
      <div class="box-title">3个好用<br>选品网站</div>
    </div>
    <div class="box box-3">
      <div class="part-num">Part 03</div>
      <div class="box-title">5个视频<br>素材网站</div>
    </div>
    <div class="box box-4">
      <div class="part-num">Part 04</div>
      <div class="box-title">6个TK数据分析网站</div>
    </div>
    <div class="box box-5">
      <div class="part-num">Part 05</div>
      <div class="box-title">4个剪辑<br>4个翻译软件</div>
    </div>
    <div class="box box-6">
      <div class="part-num">Part 06</div>
      <div class="box-title">8个TK<br>传输管理<br>网站</div>
    </div>
    <div class="box box-7">
      <div class="part-num">Part 07</div>
      <div class="box-title">5个BGM<br>网站</div>
    </div>
    <div class="box box-8">
      <div class="part-num">Part 08</div>
      <div class="box-title">7个投放<br>联盟网站</div>
    </div>
  </div>
</div>

</body>
</html>
