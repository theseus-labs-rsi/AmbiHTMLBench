<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography Guide</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fff;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #333;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 600px;
        padding: 50px;
        box-sizing: border-box;
    }
    /* Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 40px;
    }
    .title-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    .highlight {
        background-color: #fff143;
        font-size: 36px;
        font-weight: 900;
        padding: 4px 8px;
        line-height: 1.1;
        margin-bottom: 2px;
        color: #111;
    }
    .subtitle {
        font-size: 14px;
        color: #444;
        margin-top: 15px;
    }
    .circle-number {
        width: 64px;
        height: 64px;
        border: 1px solid #e0e0e0;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: 900;
        color: #222;
    }

    /* Blocks */
    .block {
        padding: 40px;
        margin-bottom: 20px;
        position: relative;
        border-radius: 2px;
    }
    .block-pink {
        background-color: #fff6f3;
    }
    .block-blue {
        background-color: #f2f8ff;
    }
    .block-title {
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        margin-bottom: 40px;
        color: #222;
    }
    .icon-circle {
        width: 24px;
        height: 24px;
        border: 2px solid #dca888;
        border-radius: 50%;
        margin-right: 15px;
        box-sizing: border-box;
    }
    .icon-cross {
        font-size: 28px;
        color: #88aadd;
        margin-right: 15px;
        font-weight: 300;
        line-height: 1;
    }
    .block-content {
        padding-left: 80px;
    }
    .line-group {
        margin-bottom: 35px;
    }
    .line-group:last-child {
        margin-bottom: 0;
    }
    .line-item {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        color: #222;
    }
    .label-bold {
        font-weight: bold;
        letter-spacing: 2px;
    }
    .sep {
        margin: 0 12px;
        color: #aaa;
        font-weight: 300;
    }
    .box-label {
        background-color: #f07878;
        color: white;
        padding: 2px 6px;
        border-radius: 3px;
        margin-right: 12px;
        font-size: 14px;
        font-weight: bold;
    }

    /* Placeholders */
    .placeholder {
        position: absolute;
        border: 1px dashed #aaa;
        background-color: rgba(240, 240, 240, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        color: #666;
        text-align: center;
        padding: 5px;
        box-sizing: border-box;
    }
    .char-1 {
        width: 90px;
        height: 100px;
        bottom: -15px;
        right: 20px;
    }
    .char-2 {
        width: 90px;
        height: 100px;
        bottom: -15px;
        right: 20px;
    }

    /* Footer */
    .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 40px;
    }
    .footer-text {
        font-size: 10px;
        font-weight: bold;
        color: #222;
        line-height: 1.4;
    }
    .footer-logo {
        width: 60px;
        height: 30px;
        position: static;
    }
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title-container">
            <div class="highlight">使用合理的</div>
            <div class="highlight">标点符号</div>
            <div class="subtitle">利用斜线、外框或直线会让整体更具视觉风格。</div>
        </div>
        <div class="circle-number">01</div>
    </div>

    <!-- Pink Block -->
    <div class="block block-pink">
        <div class="block-title">
            <div class="icon-circle"></div> 使用直线或外框
        </div>
        <div class="block-content">
            <div class="line-group">
                <div class="line-item">
                    <span class="label-bold">地点</span><span class="sep">|</span>武汉国际会展中心
                </div>
                <div class="line-item">
                    <span class="label-bold">时间</span><span class="sep">|</span>2018 年 8 月 20 日
                </div>
            </div>
            <div class="line-group">
                <div class="line-item">
                    <span class="box-label">地点</span>武汉国际会展中心
                </div>
                <div class="line-item">
                    <span class="box-label">时间</span>2018 年 8 月 20 日
                </div>
            </div>
        </div>
        <div class="placeholder char-1">[Cartoon Chicken: bottom-right]</div>
    </div>

    <!-- Blue Block -->
    <div class="block block-blue">
        <div class="block-title">
            <div class="icon-cross">✕</div> 使用冒号
        </div>
        <div class="block-content">
            <div class="line-group">
                <div class="line-item">
                    <span class="label-bold">地点：</span>武汉国际会展中心
                </div>
                <div class="line-item">
                    <span class="label-bold">时间：</span>2018 年 8 月 20 日
                </div>
            </div>
        </div>
        <div class="placeholder char-2">[Angry Chicken: bottom-right]</div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-text">
            ADVERTISING CREATIVITY<br>
            2023.05
        </div>
        <div class="placeholder footer-logo">[Logo: CREATIVE DESIGN 大橘 设计圈]</div>
    </div>
</div>

</body>
</html>
