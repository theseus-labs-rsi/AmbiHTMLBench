<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富人眼中的富人是咋样？</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111b3d;
            background-image: linear-gradient(to bottom, #1c2b59, #0b122a);
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
        }

        .title-container {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            display: inline-block;
            font-family: "SimSun", "Songti SC", "STSong", serif;
            font-size: 2.8em;
            font-weight: normal;
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.1em;
            background-color: rgba(255, 255, 255, 0.05); /* Slight transparent background for table area */
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 18px 20px;
            line-height: 1.5;
        }

        th {
            text-align: center;
            font-weight: normal;
            color: #e0e0e0;
        }

        th:first-child {
            width: 65%;
        }

        th:last-child {
            width: 35%;
        }

        td:first-child {
            text-align: left;
        }

        td:last-child {
            text-align: center;
        }

        .merged-row {
            text-align: right !important;
            font-size: 0.95em;
            color: #d0d0d0;
            padding-right: 20px;
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <h1>富人眼中的富人是咋样？</h1>
        </div>
        <table>
            <tr>
                <th>问题</th>
                <th>回答</th>
            </tr>
            <tr>
                <td>1.您觉得高净值人群资产拥有多少钱才算是？</td>
                <td>1亿7,388.4万元</td>
            </tr>
            <tr>
                <td colspan="2" class="merged-row">本次调研的平均家庭资产:2,265.8万元</td>
            </tr>
            <tr>
                <td>2.请问您每天工作小时数是？</td>
                <td>8.2小时</td>
            </tr>
            <tr>
                <td>3.您预计退休年龄？</td>
                <td>59岁</td>
            </tr>
            <tr>
                <td>4.您希望能活到多少岁？</td>
                <td>88.2岁</td>
            </tr>
            <tr>
                <td colspan="2" class="merged-row">小知识:2021年中国平均寿命:77.3岁</td>
            </tr>
            <tr>
                <td>5.请问您曾去过国家数量（包括商务出差）</td>
                <td>6.2个国家</td>
            </tr>
            <tr>
                <td>6.请问您平均每月阅读书籍数量</td>
                <td>2.4本书</td>
            </tr>
        </table>
    </div>
</body>
</html>
