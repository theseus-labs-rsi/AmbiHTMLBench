<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五大学科竞赛国家集训队名单</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Kaiti", "Comic Sans MS", cursive, sans-serif;
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 15px 11px, #93b9d6 3px, transparent 4px),
                linear-gradient(#e4f0f8 2px, transparent 2px),
                linear-gradient(90deg, #e4f0f8 2px, transparent 2px);
            background-size: 100% 22px, 22px 22px, 22px 22px;
            background-position: 0 0, 0 0, 0 0;
            display: flex;
            justify-content: center;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 520px;
            position: relative;
            background: transparent;
            padding-left: 20px;
        }
        .title-container {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            margin-left: -15px;
        }
        .dot {
            color: #79a1cc;
            font-size: 20px;
            margin-right: 5px;
            line-height: 1;
        }
        .title {
            color: #2b1f80;
            font-size: 22px;
            font-weight: bold;
            background-color: rgba(214, 233, 246, 0.8);
            padding: 2px 8px;
            letter-spacing: 1px;
        }
        .main-content {
            position: relative;
            margin-bottom: 30px;
            padding-left: 10px;
        }
        .red-text {
            color: #d85c5c;
            font-size: 19px;
            line-height: 2.15;
            letter-spacing: 1.5px;
        }
        .sticky-note {
            position: absolute;
            top: -20px;
            right: 10px;
            background-color: #faefaf;
            padding: 15px 25px 15px 20px;
            box-shadow: 4px 5px 12px rgba(0,0,0,0.25);
            font-size: 18px;
            color: #000;
            line-height: 1.8;
            font-weight: bold;
            border-bottom-right-radius: 10px 5px;
            transform: rotate(1deg);
        }
        .table-wrapper {
            padding: 0 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            border: 2px solid #8eb36b;
            background-color: #fff;
            box-shadow: 0 0 0 2px #fff inset;
        }
        th, td {
            border: 1px solid #8eb36b;
            padding: 8px 4px;
            font-size: 16px;
            height: 26px;
        }
        th {
            background-color: #8eb36b;
            color: #ffffff;
            font-weight: normal;
        }
        tr:nth-child(odd) td {
            background-color: #dfecd5;
        }
        tr:nth-child(even) td {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-container">
            <span class="dot">●</span>
            <span class="title">五大学科竞赛国家集训队名单</span>
        </div>
        
        <div class="main-content">
            <div class="sticky-note">
                生竞67人<br>
                数竞64人<br>
                化竞47人<br>
                物竞43人
            </div>
            <div class="red-text">
                2023年进入国际五项<br>
                学科奥赛国家集训队<br>
                符合保送生资格的总<br>
                人数为274人。其中<br>
                生物学科人数最多<br>
                为67人；其次是数学学科，为64<br>
                人信息学学科有53人；化学学科<br>
                有47人；物理学科人数最少，为<br>
                43人！
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>学科</th>
                        <th>2023年</th>
                        <th>2022年</th>
                        <th>2021年</th>
                        <th>小计</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>数学</td>
                        <td>19</td>
                        <td>32</td>
                        <td>13</td>
                        <td>64</td>
                    </tr>
                    <tr>
                        <td>化学</td>
                        <td>47</td>
                        <td></td>
                        <td></td>
                        <td>47</td>
                    </tr>
                    <tr>
                        <td>物理</td>
                        <td>37</td>
                        <td>6</td>
                        <td></td>
                        <td>43</td>
                    </tr>
                    <tr>
                        <td>生物</td>
                        <td>58</td>
                        <td>9</td>
                        <td></td>
                        <td>67</td>
                    </tr>
                    <tr>
                        <td>信息学</td>
                        <td>34</td>
                        <td>13</td>
                        <td></td>
                        <td>53</td>
                    </tr>
                    <tr>
                        <td>合计</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>274</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
