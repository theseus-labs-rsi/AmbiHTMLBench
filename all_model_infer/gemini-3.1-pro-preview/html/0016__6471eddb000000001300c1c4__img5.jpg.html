<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓解痛经</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 15px 25px 40px 25px;
            box-sizing: border-box;
            color: #333;
        }
        
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #666;
            margin-bottom: 25px;
            font-family: sans-serif;
        }
        
        /* Close Button */
        .close-btn {
            font-size: 22px;
            font-weight: 300;
            color: #333;
            margin-bottom: 25px;
            cursor: pointer;
            line-height: 1;
        }
        
        /* Section 5 Header */
        .sec-5-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .sec-5-num {
            background-color: #d185b0;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            z-index: 2;
        }
        .sec-5-title {
            background: linear-gradient(90deg, #f8e5ee 0%, rgba(255,255,255,0) 100%);
            color: #5c4280;
            padding: 2px 25px 2px 15px;
            margin-left: -10px;
            font-size: 15px;
            font-weight: bold;
            z-index: 1;
        }
        
        /* Section 2 Header */
        .sec-2-header-container {
            text-align: center;
            margin: 70px 0 40px;
        }
        .sec-2-header {
            display: inline-flex;
            align-items: baseline;
            position: relative;
            padding: 0 5px;
        }
        .sec-2-header::before {
            content: "";
            position: absolute;
            top: -5px;
            left: -12px;
            width: 30px;
            bottom: -5px;
            border-top: 1.5px solid #7d5e9b;
            border-left: 1.5px solid #7d5e9b;
            border-bottom: 1.5px solid #7d5e9b;
        }
        .sec-2-header::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 18px;
            right: -12px;
            border-bottom: 1.5px solid #7d5e9b;
        }
        .sec-2-num {
            font-size: 46px;
            font-weight: bold;
            color: #7d5e9b;
            line-height: 0.8;
            font-family: Arial, sans-serif;
        }
        .sec-2-title {
            font-size: 16px;
            font-weight: bold;
            color: #7d5e9b;
            margin-left: 8px;
        }
        
        /* Tag styling with double chevron effect */
        .tag-wrapper {
            display: inline-flex;
            align-items: center;
            margin-bottom: 15px;
            height: 26px;
        }
        .tag-text {
            background-color: #7d5e9b;
            color: white;
            padding: 0 16px 0 10px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%);
        }
        .tag-chevron {
            width: 17px;
            height: 17px;
            border-top: 1.5px solid #7d5e9b;
            border-right: 1.5px solid #7d5e9b;
            transform: rotate(45deg);
            margin-left: -7px;
        }

        /* Typography */
        .paragraph {
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #222;
            letter-spacing: 0.5px;
            text-align: justify;
        }
        .list-text {
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
            color: #222;
            letter-spacing: 0.5px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div>HD 5G</div>
            <div>19:43</div>
        </div>

        <!-- Close Button -->
        <div class="close-btn">✕</div>

        <!-- Section 5 -->
        <div class="sec-5-header">
            <div class="sec-5-num">5</div>
            <div class="sec-5-title">月经来潮需停药</div>
        </div>
        <div class="paragraph">
            药物推迟月经可能会失败，服药过程中如月经来潮需停药。
        </div>

        <!-- Section 2 -->
        <div class="sec-2-header-container">
            <div class="sec-2-header">
                <span class="sec-2-num">2</span>
                <span class="sec-2-title">缓解痛经</span>
            </div>
        </div>
        <div class="paragraph">
            如果上述方法推迟月经失败，对于痛经明显的，我们可以使用缓解痛经的方法来减少痛经对考试状态的影响。
        </div>

        <!-- Tag -->
        <div class="tag-wrapper">
            <div class="tag-text">常用方案</div>
            <div class="tag-chevron"></div>
        </div>
        
        <div class="paragraph">
            痛经的发生与月经来潮时子宫内膜前列腺素含量增高有关，因此，可以通过服用前列腺素合成酶抑制剂来缓解痛经。
        </div>
        
        <div class="paragraph">
            以下三种方法，选其中一种方法即可：
        </div>

        <div class="list-text">
            1.布洛芬 首剂 800 mg，之后根据需要 400 ~ 800 mg 每8小时一次，可在月经来潮前 1 天开始服用，连续服用 3 天。
        </div>

        <div class="list-text">
            2.甲芬那酸首剂 500 mg，之后根据需要 250 mg 每6小时一次。
        </div>
    </div>
</body>
</html>
