<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asgari Ücret Afişi</title>
    <style>
        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .poster-container {
            width: 750px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Top Section (Yellow) */
        .top-section {
            background-color: #fbe63d;
            padding: 60px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bullet-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
        }

        .pin-icon {
            font-size: 32px;
            margin-right: 20px;
            margin-top: 4px;
            color: #d32f2f;
        }

        .item-text {
            font-size: 46px;
            font-weight: 800;
            color: #2a2a2a;
            line-height: 1.15;
            letter-spacing: -1px;
        }

        .placeholder.graphic-main {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background-color: #f3ca85;
            border: 2px dashed #b71c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            color: #b71c1c;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
            margin-left: 20px;
        }

        /* First White Text Section */
        .middle-white-section {
            padding: 45px 30px;
            text-align: center;
            background-color: #ffffff;
        }

        .middle-white-section h1 {
            color: #c92424;
            font-size: 58px;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* Red Banner Section */
        .red-banner-section {
            background-color: #c92424;
            padding: 30px 20px;
            text-align: center;
        }

        .red-banner-section h2 {
            color: #ffffff;
            font-size: 75px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* Bottom Section */
        .bottom-section {
            padding: 45px 50px 55px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
        }

        .brand-container {
            display: flex;
            align-items: center;
            margin-bottom: 50px;
        }

        .placeholder.logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px dashed #c92424;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #c92424;
            font-weight: bold;
            font-size: 14px;
            margin-right: 25px;
            background-color: #f9f9f9;
        }

        .party-text {
            color: #c92424;
            text-align: left;
        }

        .party-text-main {
            font-size: 45px;
            font-weight: 900;
            margin: 0;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .party-text-sub {
            font-size: 24px;
            font-weight: 800;
            margin: 8px 0 0 0;
            letter-spacing: -0.5px;
        }

        /* Footer Social Info */
        .footer-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #c92424;
            font-size: 18px;
            font-weight: 700;
        }

        .contact-item {
            display: flex;
            align-items: center;
        }

        .placeholder.icon {
            width: 28px;
            height: 28px;
            border: 1px solid #c92424;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            margin-right: 10px;
            color: #c92424;
            background-color: #f9f9f9;
        }

        .icon-round {
            border-radius: 8px;
        }

        .icon-circle {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        
        <div class="top-section">
            <div class="bullet-list">
                <div class="list-item">
                    <span class="pin-icon">📌</span>
                    <div class="item-text">Enflasyon<br>yükseliyor</div>
                </div>
                <div class="list-item">
                    <span class="pin-icon">📌</span>
                    <div class="item-text">TL değer<br>kaybediyor</div>
                </div>
                <div class="list-item">
                    <span class="pin-icon">📌</span>
                    <div class="item-text">Ücretler eriyor</div>
                </div>
            </div>
            <div class="placeholder graphic-main">
                [Diagram: Rising red arrow, pencil, and coins]
            </div>
        </div>

        <div class="middle-white-section">
            <h1>Vergiden muaf,<br>İnsanca yaşanacak</h1>
        </div>

        <div class="red-banner-section">
            <h2>ASGARİ ÜCRET!</h2>
        </div>

        <div class="bottom-section">
            <div class="brand-container">
                <div class="placeholder logo">
                    [Logo: EMEP gear and globe]
                </div>
                <div class="party-text">
                    <p class="party-text-main">EMEK<br>PARTİSİ</p>
                    <p class="party-text-sub">Ankara İl Örgütü</p>
                </div>
            </div>

            <div class="footer-info">
                <div class="contact-item">
                    <div class="placeholder icon">[f]</div>
                    <span>/ankaraemep</span>
                </div>
                <div class="contact-item">
                    <div class="placeholder icon icon-round">[ig]</div>
                    <span>@emepankara</span>
                </div>
                <div class="contact-item">
                    <div class="placeholder icon icon-circle">[tel]</div>
                    <span>0 (312) 232 41 97</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
