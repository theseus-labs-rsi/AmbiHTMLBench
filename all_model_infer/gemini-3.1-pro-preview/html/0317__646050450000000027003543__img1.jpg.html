<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人经验总结</title>
    <style>
        body {
            background-color: #2c2c2c; /* Simulating dark room environment */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .projector-screen {
            background-color: #eef2f5; /* Light greyish-blue to mimic projection screen */
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 5% 8%;
            box-sizing: border-box;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            overflow: hidden;
        }

        .header-section {
            margin-bottom: 4%;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            font-weight: normal;
            color: #444;
        }

        p.subtitle {
            font-size: 1rem;
            margin: 0;
            color: #444;
        }

        ol.content-list {
            margin: 0;
            padding-left: 6%; /* Mimicking the indentation seen on the slide */
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
        }

        ol.content-list li {
            margin-bottom: 12px;
            padding-left: 5px;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="projector-screen">
        <div class="header-section">
            <h1>个人经验总结</h1>
            <h2>学习资料——备考攻略</h2>
            <p class="subtitle">根据经验分享会总结的：</p>
        </div>
        
        <ol class="content-list">
            <li>常识: 李梦娇讲的挺好，如果时间富裕可以好好准备，王军涛，某笔</li>
            <li>言语理解: 郭熙老师，小宝，欣说</li>
            <li>数量: 花生十三，齐麟，唐宋</li>
            <li>判断: 花生十三，阿不了沉老师，聂佳，徐来，龙飞，蔡金龙</li>
            <li>申论: 站长，李梦圆，张小龙，小飞仔，申论大湿（浙江超级好申论）（申论需要精做而不是刷题，复盘材料逻辑，积累底层用语。名言事例的积累不要贪多，分适用模块。今天一句名言，明天一个事例，能坚持两个月已经非常多了。）</li>
            <li>浙江省选调必须死磕数量关系</li>
        </ol>
    </div>

</body>
</html>
