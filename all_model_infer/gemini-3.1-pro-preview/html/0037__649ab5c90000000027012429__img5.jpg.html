<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学语文期末质量分析会</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background-color: #e0e0e0;
    display: flex;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .slide-container {
    width: 800px;
    min-height: 600px;
    background-color: #f6f4ed;
    position: relative;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    overflow: hidden;
    padding-bottom: 50px;
  }
  
  /* Decorative Placeholders */
  .placeholder {
    position: absolute;
    background-color: rgba(200, 220, 210, 0.3);
    border: 1px dashed #7a9c8e;
    color: #555;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    text-align: center;
    z-index: 1;
  }
  .decor-top-right {
    top: -20px;
    right: -20px;
    width: 300px;
    height: 250px;
    border-bottom-left-radius: 150px;
  }
  .decor-bottom-left {
    top: 250px;
    left: -20px;
    width: 300px;
    height: 200px;
    border-top-right-radius: 100px;
    border-bottom-right-radius: 100px;
  }

  /* Watermarks */
  .watermark {
    position: absolute;
    color: #000;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff, 0px 0px 3px #fff;
    z-index: 10;
    pointer-events: none;
  }
  .wm1 {
    top: 90px;
    right: 240px;
    transform: rotate(-25deg);
  }
  .wm2 {
    top: 275px;
    left: 210px;
    font-size: 20px;
  }
  
  /* Header Section */
  .header {
    text-align: center;
    margin-top: 100px;
    position: relative;
    z-index: 5;
  }
  .academic-year {
    color: #003366;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 25px;
  }
  .main-title {
    color: #003366;
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 25px;
    letter-spacing: 2px;
  }
  .sub-title {
    color: #cc0000;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
  .school-info {
    color: #003366;
    font-size: 16px;
    margin-bottom: 15px;
  }
  .author {
    color: #003366;
    font-size: 16px;
  }

  /* Mid Section */
  .mid-section {
    margin-top: 50px;
    margin-left: 80px;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 5;
  }
  .icon-placeholder {
    width: 30px;
    height: 40px;
    background-color: #e9e9e9;
    border: 1px dashed #999;
    margin-right: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #666;
  }
  .mid-text {
    font-size: 18px;
    font-weight: bold;
    color: #333;
  }
  .wm3 {
    position: relative;
    display: inline-block;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff;
    transform: rotate(-10deg);
    margin-left: 5px;
    top: -5px;
    background: linear-gradient(to top, rgba(255,255,0,0.7) 40%, transparent 40%);
    padding: 0 2px;
  }

  /* Flowchart Section */
  .flowchart {
    margin-top: 40px;
    padding: 0 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    z-index: 5;
  }
  
  .flow-headers {
    display: flex;
    gap: 12px;
  }
  .header-item {
    flex: 1;
    background-color: #008080;
    color: #fff;
    padding: 12px 5px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    position: relative;
  }
  .header-item.arrow {
    clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 0 100%);
    padding-right: 15px;
  }

  .flow-contents {
    display: flex;
    gap: 12px;
  }
  .content-item {
    flex: 1;
    border: 2px solid #008080;
    border-radius: 12px;
    padding: 15px 10px;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
    background-color: #f6f4ed;
    position: relative;
    box-sizing: border-box;
  }
  .content-item::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px;
    height: 10px;
    background-color: #f6f4ed;
    border-top: 2px solid #008080;
    border-left: 2px solid #008080;
  }
</style>
</head>
<body>

<div class="slide-container">
  
  <!-- Decorative Placeholders -->
  <div class="placeholder decor-top-right">[Leaves Decoration]</div>
  <div class="placeholder decor-bottom-left">[Leaves & Bird Decoration]</div>

  <!-- Watermarks -->
  <div class="watermark wm1">@海淀小萌</div>
  <div class="watermark wm2">@海淀小萌</div>

  <!-- Header -->
  <div class="header">
    <div class="academic-year">2022--2023学年第二学期</div>
    <div class="main-title">追光而遇有思 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 沐光而行致远</div>
    <div class="sub-title">小学语文期末质量分析会</div>
    <div class="school-info">红薯街道实验XXXX</div>
    <div class="author">海淀小萌</div>
  </div>

  <!-- Mid Section -->
  <div class="mid-section">
    <div class="icon-placeholder">[Icon]</div>
    <span class="mid-text">期末考试成绩</span>
    <span class="wm3">@海淀小萌</span>
  </div>

  <!-- Flowchart -->
  <div class="flowchart">
    <div class="flow-headers">
      <div class="header-item arrow">注重基础和积累</div>
      <div class="header-item arrow">重视运用</div>
      <div class="header-item arrow">联系生活原则</div>
      <div class="header-item">难易程度适中</div>
    </div>
    <div class="flow-contents">
      <div class="content-item">尤其是古诗文和名言警句积累占的比例很大，反映了对传统文化的重视。</div>
      <div class="content-item">突出能力，重视运用。阅读题体现了核心素养中重视思维发展与提升的要求。</div>
      <div class="content-item">写作的安排正是学生生活中外出的经历，易于选材，适合个性发展。</div>
      <div class="content-item">只要认真积累和复习的孩子基本上可以取得不错的成绩。</div>
    </div>
  </div>

</div>

</body>
</html>
