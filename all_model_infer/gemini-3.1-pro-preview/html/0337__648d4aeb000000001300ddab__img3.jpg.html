<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled Document</title>
<style>
    body {
        margin: 0;
        padding: 50px 20px;
        background-color: #F8F6F7;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 460px;
    }
    .header {
        display: flex;
        align-items: center;
        margin-bottom: 35px;
    }
    .title-box {
        background-color: #486A55;
        color: #FFFFFF;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    .placeholder {
        background-color: #E2E2E2;
        border: 2px dashed #999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        font-size: 10px;
        text-align: center;
        box-sizing: border-box;
    }
    .battery-icon {
        width: 45px;
        height: 55px;
        margin-left: 25px;
    }
    .content-text {
        color: #4C6253;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.9;
        margin-top: 0;
        margin-bottom: 26px;
        letter-spacing: 0.5px;
    }
    .check-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 26px;
    }
    .check-mark {
        color: #4C6253;
        margin-right: 8px;
        font-size: 18px;
        font-weight: bold;
        line-height: 1.8;
    }
    .check-text {
        color: #4C6253;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.9;
        letter-spacing: 0.5px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-box">3. 忽视你的需求，内耗你的精力</div>
            <div class="placeholder battery-icon">[Battery<br>Icon]</div>
        </div>
        
        <p class="content-text">
            这一种人，不仅可能是身边的朋友，亲密关系中<br>也会出现。爱我们的人，也可能会“害”我们。
        </p>
        
        <p class="content-text">
            忽视需求，是关系中隐藏的一把刀，对人的伤害<br>就像刻在木头上的刀痕，再也恢复不到原样。
        </p>
        
        <p class="content-text">
            而忽视一次，就是给对方的内心，套上一层不透<br>气的薄膜，直到最后无法呼吸，内耗倒下。
        </p>
        
        <p class="content-text">
            经常忽视你需求的人，他们或许真的在乎你，但<br>这种错误方式，只会让你越来越疲惫。
        </p>
        
        <div class="check-item">
            <div class="check-mark">✔</div>
            <div class="check-text">面对关系亲近的人的控制，先做出必要的沟通，<br>坦诚表达自己的感受，必要时保持适当距离。</div>
        </div>
        
        <p class="content-text" style="margin-bottom: 0;">
            与人交往需要衡量，更需要智慧，愿你在前行路上<br>看清他人、做好自己。
        </p>
    </div>
</body>
</html>
