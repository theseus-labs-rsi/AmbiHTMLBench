<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Layout</title>
    <style>
        body {
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            background-color: #2c2c2c;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .container {
            width: 640px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .top-section {
            background-color: #e4d4b4;
            padding: 60px 50px;
            position: relative;
            min-height: 220px;
            box-sizing: border-box;
        }

        .bottom-section {
            background-color: #3b3a50;
            padding: 60px 50px;
            position: relative;
            box-sizing: border-box;
        }

        .watermark-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .watermark {
            position: absolute;
            font-size: 54px;
            font-weight: bold;
            transform: rotate(-15deg);
            white-space: nowrap;
            letter-spacing: 2px;
        }

        .top-section .watermark {
            color: rgba(255, 255, 255, 0.4);
            top: 45%;
            left: 20%;
        }

        .bottom-section .watermark {
            color: rgba(255, 255, 255, 0.06);
            top: 35%;
            left: 25%;
        }

        .content-layer {
            position: relative;
            z-index: 2;
        }

        .heading-row {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .heading {
            font-size: 38px;
            font-weight: bold;
            color: #313140;
            letter-spacing: 1px;
        }

        .red-circle {
            display: inline-block;
            width: 45px;
            height: 45px;
            border: 14px solid #c00000;
            border-radius: 50%;
            margin-left: 15px;
            box-sizing: border-box;
        }

        .top-text {
            font-size: 26px;
            font-weight: bold;
            line-height: 1.8;
            color: #313140;
            letter-spacing: 1px;
        }

        .kid-container {
            position: absolute;
            bottom: -25px;
            right: 0;
            width: 260px;
            height: 280px;
            z-index: 10;
        }

        .placeholder.kid-image {
            width: 100%;
            height: 100%;
            background-color: #d9cbb3;
            border: 4px solid #5c5470;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
            color: #555;
            font-size: 14px;
            padding: 20px;
            clip-path: polygon(25% 0%, 75% 0%, 95% 25%, 100% 60%, 90% 100%, 10% 100%, 0% 60%, 5% 25%);
        }

        .kid-text {
            position: absolute;
            bottom: 15px;
            right: 10px;
            color: white;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 
                -2px -2px 0 #b31b1b,  
                 2px -2px 0 #b31b1b,
                -2px  2px 0 #b31b1b,
                 2px  2px 0 #b31b1b,
                 0px  3px 0 #b31b1b;
            z-index: 11;
        }

        .bottom-heading-row {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
        }

        .bottom-heading {
            font-size: 38px;
            font-weight: bold;
            color: #f2e8d5;
            letter-spacing: 1px;
        }

        .green-check {
            display: inline-block;
            width: 25px;
            height: 45px;
            border-bottom: 12px solid #8cc63f;
            border-right: 12px solid #8cc63f;
            transform: rotate(45deg);
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .bottom-text {
            font-size: 21px;
            line-height: 1.9;
            margin-bottom: 40px;
            color: #f2e8d5;
            text-align: justify;
            letter-spacing: 1px;
        }

        .citation {
            text-align: right;
            font-size: 16px;
            color: #f2e8d5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <div class="watermark-container">
                <div class="watermark">看报的美女纸</div>
            </div>
            <div class="content-layer">
                <div class="heading-row">
                    <span class="heading">我写的：</span>
                    <span class="red-circle"></span>
                </div>
                <div class="top-text">
                    我们民族的追梦史充满<br>艰辛。
                </div>
            </div>
            <div class="kid-container">
                <div class="placeholder kid-image">[Photo: Kid looking strained with purple outline]</div>
                <div class="kid-text">学习使我妈快乐</div>
            </div>
        </div>
        
        <div class="bottom-section">
            <div class="watermark-container">
                <div class="watermark">看报的美女纸</div>
            </div>
            <div class="content-layer">
                <div class="bottom-heading-row">
                    <span class="bottom-heading">人民日报写的：</span>
                    <span class="green-check"></span>
                </div>
                <div class="bottom-text">
                    我们这个民族，有数千年辉煌文明、有数百年<br>
                    深重苦难，也有百余年不息奋斗，追寻梦想的<br>
                    道路尤其艰难曲折。百余年来的救亡图存、道<br>
                    路探索，多少仁人志士留下“有心杀贼，无力<br>
                    回天”的悲愤，付出“春云碧血，秋雨黄花”<br>
                    的牺牲，发出“拼将十万头颅血，须把乾坤力<br>
                    挽回”的呐喊。
                </div>
                <div class="citation">
                    ——2013.4.1《筑就民族复兴的“中国梦”》
                </div>
            </div>
        </div>
    </div>
</body>
</html>
