<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用暗示的积极力量养出优秀孩子</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
    }
    .container {
        width: 100%;
        max-width: 600px;
    }
    .header-box {
        background-color: #e4ebf5;
        border: 1px solid #b5c2d9;
        border-radius: 6px;
        padding: 12px 30px;
        text-align: center;
        margin: 0 auto 30px auto;
        width: fit-content;
        box-sizing: border-box;
    }
    .header-box h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        color: #1a1a1a;
        letter-spacing: 1px;
    }
    .header-box h1 span.highlight {
        color: #8b228b;
        font-weight: 600;
    }
    .subheading {
        font-size: 16px;
        color: #333333;
        margin-bottom: 20px;
        margin-left: 5px;
    }
    .content-box {
        background-color: #eaeaf4;
        border: 1px solid #ccc;
        padding: 25px 20px;
        box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.25);
    }
    .item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 14px;
        line-height: 1.6;
    }
    .item:last-child {
        margin-bottom: 0;
    }
    .icon {
        font-size: 18px;
        margin-right: 10px;
        flex-shrink: 0;
        width: 20px;
        text-align: center;
        font-weight: bold;
    }
    .icon-x {
        color: #c00000;
    }
    .icon-check {
        color: #7ab547;
    }
    .text {
        font-size: 17px;
    }
    .text-negative {
        color: #333333;
    }
    .text-positive {
        color: #6a3d9a;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>用<span class="highlight">暗示</span>的积极力量养出优秀孩子</h1>
        </div>
        
        <div class="subheading">
            学习上，让孩子体验一个个小成功
        </div>

        <div class="content-box">
            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">你磨蹭半天了，没写几个字，再磨下去就别睡了</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">越早完成作业，休息的时间就越多！</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">这么简单的题都不会做？</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">这道题你觉得难，不太会是吗？</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">赶紧写作业，一点都不自觉</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">你很少忘记写作业的，如果需要帮助就告诉我。</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">你这孩子怎么这么犟呢，你要听话</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">你可以说“不”，但我想听听你的理由理解你。</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">你怎么这么烦人呢，就不能安静一会儿吗？</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">你自己先去玩一会，妈妈忙完就马上找你。</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">勇敢点，这有什么的啊？</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">我相信你行的，再试试看，我陪着你</div>
            </div>

            <div class="item">
                <div class="icon icon-x">✖</div>
                <div class="text text-negative">快点走，再拖拖拉拉你就别出去了。</div>
            </div>
            <div class="item">
                <div class="icon icon-check">✓</div>
                <div class="text text-positive">我们来比一比，看谁更快出门。</div>
            </div>
        </div>
    </div>
</body>
</html>
