<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞吉欧Reggio</title>
<style>
    body {
        background-color: #3a3a3a;
        color: #ffffff;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 20px;
        margin: 0;
    }
    .title {
        font-size: 48px;
        font-weight: normal;
        background-color: rgba(0, 0, 0, 0.8);
        padding: 10px 30px;
        margin-bottom: 40px;
    }
    .content-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 25px;
    }
    .line {
        background-color: rgba(0, 0, 0, 0.8);
        padding: 8px 16px;
        margin: 4px 0;
        font-size: 22px;
        line-height: 1.2;
        white-space: nowrap;
    }
    .wavy-underline {
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: #ffe600;
        text-decoration-thickness: 4px;
        text-underline-offset: 6px;
    }
    .bullet {
        margin-right: 8px;
    }
</style>
</head>
<body>

    <div class="title">瑞吉欧Reggio</div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span>基于皮亚杰和维果斯基等心理学家的</div>
        <div class="line"><span class="wavy-underline">建构主义心理学。</span></div>
    </div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span><span class="wavy-underline">走进儿童心灵的儿童观，以孩子的思维、</span></div>
        <div class="line">孩子的立场来看待一场</div>
        <div class="line">不压制孩子，让其充分表现潜能</div>
    </div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span><span class="wavy-underline">弹性课程，从儿童的兴趣和需要出发</span></div>
        <div class="line">不让孩子生活在成人的包围之中。</div>
    </div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span><span class="wavy-underline">教师必须尽可能地减少介入，更不可过度介入。</span></div>
        <div class="line">与其牵着儿童的手，不如让他们用自己的双脚站立。</div>
    </div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span><span class="wavy-underline">儿童的自我表达和相互交流特别重要，是儿童探索、</span></div>
        <div class="line">研究、解决问题过程中的基本活动。</div>
    </div>

    <div class="content-block">
        <div class="line"><span class="bullet">●</span><span class="wavy-underline">在共同分享中，每个人均可提出最好的想法，</span></div>
        <div class="line">提升和加强团队间意见交流、</div>
        <div class="line">并刺激新奇或出乎意料的事情发生。</div>
    </div>

</body>
</html>
