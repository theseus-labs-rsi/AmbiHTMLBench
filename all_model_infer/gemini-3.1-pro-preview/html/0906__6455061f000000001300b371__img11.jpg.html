<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>句段结构作用好处赏析</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #f7f7f7;
            background-image: 
                linear-gradient(rgba(180, 180, 180, 0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 180, 180, 0.6) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            color: #9e1423;
            font-size: 22px;
        }

        .grid-doc {
            display: grid;
            grid-template-columns: 60px 700px;
            grid-auto-rows: 30px;
            position: relative;
        }

        .cell {
            line-height: 30px;
            white-space: pre-wrap;
        }

        .title {
            grid-column: 2;
            grid-row: 2;
            font-size: 26px;
            font-weight: bold;
            padding-left: 30px;
        }

        .lbl {
            grid-column: 1;
            text-align: center;
            font-weight: bold;
            font-size: 24px;
        }

        .r4 { grid-row: 4; }
        .r5 { grid-row: 5; }
        .r6 { grid-row: 6; }
        .r7 { grid-row: 7; }
        .r8 { grid-row: 8; }
        
        .r11 { grid-row: 11; }
        .r12 { grid-row: 12; }
        .r13 { grid-row: 13; }
        .r14 { grid-row: 14; }
        .r15 { grid-row: 15; }
        .r16 { grid-row: 16; }
        .r17 { grid-row: 17; }
        .r19 { grid-row: 19; }

        .c2 { grid-column: 2; }
        
        .indent {
            padding-left: 30px;
        }

        .blue-text {
            color: #101557;
        }

        .placeholder {
            position: absolute;
            left: 420px;
            top: 315px; 
            width: 70px;
            height: 110px;
            border: 3px dashed #9e1423;
            background-color: rgba(255, 255, 255, 0.7);
            color: #9e1423;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-align: center;
            border-radius: 40px;
            font-family: sans-serif;
            line-height: 1.2;
            padding: 5px;
            box-sizing: border-box;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="grid-doc">
        <div class="cell title">句段结构作用好处赏析</div>

        <div class="cell lbl r4">常</div>
        <div class="cell c2 r4">1. 请分析这句话的作用是什么？</div>
        
        <div class="cell lbl r5">见</div>
        
        <div class="cell lbl r6">问</div>
        <div class="cell c2 r6">2. 这句话这样描写有什么好处？</div>
        
        <div class="cell lbl r7">法</div>
        
        <div class="cell c2 r8">3. 请分析这句话这样描写的表达效果。</div>

        <div class="cell lbl r11">满</div>
        <div class="cell c2 r11">① 这是( 　　 )描写</div>
        
        <div class="cell lbl r13">分</div>
        <div class="cell c2 r13 indent">生动形象地写出( 　　 ),</div>
        
        <div class="cell lbl r15">公</div>
        <div class="cell c2 r15">② 更突出了( 　　 ).</div>
        
        <div class="cell lbl r17">式</div>
        <div class="cell c2 r17">③ 前后文呼应 / 为后文( 　　 )做了铺垫.</div>

        <div class="cell c2 r19"><span class="blue-text">口诀：</span>生动秀 感心头 勾勾手</div>

        <div class="placeholder">
            [Stamp: Red Oval,<br>李真]
        </div>
    </div>
</body>
</html>
