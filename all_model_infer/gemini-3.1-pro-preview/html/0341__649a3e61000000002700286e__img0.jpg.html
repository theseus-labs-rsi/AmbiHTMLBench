<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
  body {
    background-color: #f1f1ec;
    display: flex;
    justify-content: center;
    padding: 50px 20px;
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #111;
  }
  .container {
    width: 460px;
    font-size: 21px;
    line-height: 1.75;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .teal {
    color: #4a8b82;
  }
  .paragraph {
    margin-bottom: 45px;
  }
  .footer {
    text-align: center;
    color: #4a8b82;
    font-size: 19px;
    margin-top: 70px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="paragraph">
      1、 <span class="teal">你开始炫耀自己，往往都是灾难的开始。</span><br>
      就像老子在《道德经》里写到：“光而不耀，<br>
      静水流深。”意思就是，无论身处什么位置，<br>
      什么环境，嘴上不逞强、不炫耀、不狂妄才能<br>
      兜住自己的福气。
    </div>
    
    <div class="paragraph">
      2、一个冷知识：<span class="teal">屏蔽力是一个人最顶级<br>
      的能力，</span>任何消耗你的人和事，多看一眼<br>
      都是你的不对。
    </div>
    
    <div class="paragraph">
      3、大学时辅导员说了一句受益一生的<br>
      话：“<span class="teal">你不用变得很外向，内向挺好的，</span><br>
      但需要你发言的时候，一定要勇敢。”正<br>
      所谓：君子可内敛不可懦弱，面不公可起<br>
      而论之。
    </div>
    
    <div class="footer">
      商业思维 | 底层逻辑 | 个人提升
    </div>
  </div>
</body>
</html>
