<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古诗词</title>
<style>
    body {
        background-color: #f3b98e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        padding: 20px;
        box-sizing: border-box;
    }
    .grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        background-color: #f3b98e;
        width: 100%;
        max-width: 800px;
    }
    .cell {
        background-color: #ffffff;
        background-image: 
            linear-gradient(#f0f0f0 1px, transparent 1px), 
            linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
        background-size: 12px 12px;
        padding: 30px 20px;
        text-align: center;
        box-sizing: border-box;
    }
    .title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #000;
        letter-spacing: 2px;
    }
    .content-wrapper {
        display: inline-block;
        text-align: left;
    }
    .author {
        text-align: right;
        font-size: 15px;
        margin-bottom: 15px;
        color: #000;
    }
    .poem {
        font-size: 22px;
        line-height: 1.6;
        color: #000;
        letter-spacing: 1px;
    }
    @media (max-width: 600px) {
        .grid-container {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

<div class="grid-container">
    <div class="cell">
        <div class="title">《登鹳雀楼》</div>
        <div class="content-wrapper">
            <div class="author">(唐-王之涣)</div>
            <div class="poem">
                白日依山尽，<br>
                黄河入海流。<br>
                欲穷千里目，<br>
                更上一层楼。
            </div>
        </div>
    </div>

    <div class="cell">
        <div class="title">《静夜思》</div>
        <div class="content-wrapper">
            <div class="author">(唐-李白)</div>
            <div class="poem">
                床前明月光，<br>
                疑是地上霜。<br>
                举头望明月，<br>
                低头思故乡。
            </div>
        </div>
    </div>

    <div class="cell">
        <div class="title">《古朗月行》</div>
        <div class="content-wrapper">
            <div class="author">(唐-李白)</div>
            <div class="poem">
                小时不识月，<br>
                呼作白玉盘。<br>
                又疑瑶台镜，<br>
                飞在青云端。
            </div>
        </div>
    </div>

    <div class="cell">
        <div class="title">《寻隐者不遇》</div>
        <div class="content-wrapper">
            <div class="author">(唐-贾岛)</div>
            <div class="poem">
                松下问童子，<br>
                言师采药去。<br>
                只在此山中，<br>
                云深不知处。
            </div>
        </div>
    </div>

    <div class="cell">
        <div class="title">《咏鹅》</div>
        <div class="content-wrapper">
            <div class="author">(唐-骆宾王)</div>
            <div class="poem">
                鹅鹅鹅，<br>
                曲项向天歌。<br>
                白毛浮绿水，<br>
                红掌拨清波。
            </div>
        </div>
    </div>

    <div class="cell">
        <div class="title">《草》</div>
        <div class="content-wrapper">
            <div class="author">(唐-白居易)</div>
            <div class="poem">
                离离原上草，<br>
                一岁一枯荣。<br>
                野火烧不尽，<br>
                春风吹又生。
            </div>
        </div>
    </div>
</div>

</body>
</html>
