<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原则模板</title>
<style>
    body {
        background-color: #222222;
        background-image: radial-gradient(#3a3a3a 1px, transparent 1px);
        background-size: 4px 4px;
        color: #ffffff;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        width: 100%;
        max-width: 450px;
        padding: 10px;
        box-sizing: border-box;
    }
    .title {
        color: #e5b80b;
        font-size: 22px;
        font-weight: bold;
        line-height: 1.5;
        margin-bottom: 20px;
    }
    .content {
        font-size: 16px;
        line-height: 1.8;
    }
    .item {
        margin-bottom: 15px;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="title">
            7.当题干中出现“原则”时，可用<br>以下模板：
        </div>
        <div class="content">
            <div class="item">
                (一)教育性原则。...体现教育目标，有利于幼儿<br>身的全面发展
            </div>
            <div class="item">
                (二)个别差异性原则。每个幼儿不一样，教师要<br>因材施教
            </div>
            <div class="item">
                (三) 科学性原则。...能给幼儿正确的启蒙教<br>育
            </div>
            <div class="item">
                (四)发展适宜性原则。考虑到不同年龄阶段孩子<br>的特点
            </div>
            <div class="item">
                (五) 整体性原则。考虑到多方面的要素，促<br>进幼儿整体的发展
            </div>
            <div class="item">
                (六) 活动性原则。注重幼儿亲身体验，直接<br>参与，以各种游戏活动为主
            </div>
        </div>
    </div>
</body>
</html>
