<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Note</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f2ede9; /* Approximating the paper color */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .page {
            background-color: #f7f3f0;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            position: relative;
            line-height: 2.2;
            font-size: 18px;
        }
        .header {
            color: #4a6b8c; /* Blue ink color */
            font-size: 20px;
            margin-bottom: 15px;
        }
        .paragraph {
            text-indent: 2em;
            margin-bottom: 10px;
        }
        .underlined {
            text-decoration: underline;
        }
        .red-text {
            color: #a33b3b; /* Red ink color */
            text-indent: 2em;
        }
        .red-text-centered {
            color: #a33b3b;
            text-align: center;
            margin-top: 10px;
        }
        
        /* Simulating the left edge binding/cut-off text */
        .left-margin-text {
            position: absolute;
            left: 5px;
            top: 65%;
            font-size: 16px;
            line-height: 2;
            color: #333;
        }
        .left-margin-text-bottom {
             position: absolute;
             left: 5px;
             bottom: 50px;
             font-size: 16px;
             color: #333;
        }

    </style>
</head>
<body>
    <div class="page">
        <!-- Left margin fragments -->
        <div class="left-margin-text">
            右移<br>
            [?]则
        </div>
        <div class="left-margin-text-bottom">
            ]房.
        </div>

        <!-- Main Content -->
        <div class="header">
            侦探能量站
        </div>
        
        <div class="paragraph">
            当偏见裹挟认知，无视事实，操纵舆论的事发<br>
            生，我们该如何对待？
        </div>
        
        <div class="paragraph">
            如果我不害怕人微言轻，也许你就不会经历<br>
            人言可畏，用心辨别真相，用爱和真诚可以消<br>
            融流言。正如各位侦探所言，“千军万马踩过的<br>
            时候，小小的一脚都有可能是致命伤，我们<br>
            谁都不想成为这样的人，我们也不要成为加<br>
            害的人”，<span class="underlined">遭遇</span>不公时，隐忍不是唯一道路，<br>
            我们可以向不公平呐喊，只有大家都勇敢<br>
            起来，加害者才会觉得我们没有那么好<br>
            欺负。
        </div>

        <div class="red-text">
            愿你笔尖下皆自由之风，一笔一画，
        </div>
        
        <div class="red-text-centered">
            一字一句，黑白分明。
        </div>
    </div>
</body>
</html>
