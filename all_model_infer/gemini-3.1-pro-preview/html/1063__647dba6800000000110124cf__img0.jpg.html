<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普通人赚豪车需要多久</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "PingFang SC", "Microsoft YaHei";
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
        }

        .document-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
        }

        .placeholder {
            width: 100%;
            height: 280px;
            background-color: #f5f5f5;
            border: 2px dashed #cccccc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666666;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .title-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 900;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            position: relative;
        }

        .data-table th, 
        .data-table td {
            border: 1px solid #dcdcdc;
            padding: 16px 20px;
            text-align: left;
            font-size: 17px;
            font-weight: 700;
        }

        .data-table th {
            background-color: #e6e6e6;
            border-top: 1px solid #dcdcdc;
            border-bottom: 1px solid #dcdcdc;
        }

        .footer-note {
            text-align: right;
            font-size: 12px;
            color: #666666;
            margin-top: 5px;
            padding-right: 15px;
        }
    </style>
</head>
<body>
    <div class="document-container">
        
        <div class="placeholder">
            [Photo: Centered top, Black Mercedes-Benz G-Class SUV]
        </div>

        <div class="title-container">
            <h1 class="main-title">奔驰 大G</h1>
            <h2 class="sub-title">普通人 赚一辆豪车 需要多久？</h2>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>职业</th>
                    <th>月薪</th>
                    <th>时间</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>外卖员</td>
                    <td>5000元/月</td>
                    <td>大约45年</td>
                </tr>
                <tr>
                    <td>建筑工人</td>
                    <td>6000元/月</td>
                    <td>大约38年</td>
                </tr>
                <tr>
                    <td>出租车司机</td>
                    <td>6500元/月</td>
                    <td>大约35年</td>
                </tr>
                <tr>
                    <td>教师</td>
                    <td>8000元/月</td>
                    <td>大约28年</td>
                </tr>
                <tr>
                    <td>医生</td>
                    <td>10000元/月</td>
                    <td>大约23年</td>
                </tr>
                <tr>
                    <td>互联网职工</td>
                    <td>15000元/月</td>
                    <td>大约15年</td>
                </tr>
                <tr>
                    <td>银行职员</td>
                    <td>20000元/月</td>
                    <td>大约11年</td>
                </tr>
                <tr>
                    <td>销售</td>
                    <td>25000元/月</td>
                    <td>大约9年</td>
                </tr>
                <tr>
                    <td>私企老板</td>
                    <td>50000元/月</td>
                    <td>大约5年</td>
                </tr>
            </tbody>
        </table>

        <div class="footer-note">
            *月薪资30%作为日常基本开销
        </div>

    </div>
</body>
</html>
