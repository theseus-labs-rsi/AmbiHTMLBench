<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一月-任务</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            margin: 40px;
            color: #000;
            background-color: #fff;
        }
        h1 {
            font-size: 36px;
            font-weight: normal;
            margin-bottom: 20px;
            margin-left: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #000;
            padding: 15px 10px;
        }
        th {
            font-weight: bold;
            background-color: #fff;
        }
        tbody tr:nth-child(odd) {
            background-color: #dbe5f1;
        }
        tbody tr:nth-child(even) {
            background-color: #fff;
        }
        th:nth-child(1) { width: 6%; }
        th:nth-child(2) { width: 18%; }
        th:nth-child(3) { width: 12%; }
        th:nth-child(4) { width: 28%; }
        th:nth-child(5) { width: 12%; }
        th:nth-child(6) { width: 24%; }
    </style>
</head>
<body>

    <h1>一月-任务</h1>

    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>任务描述</th>
                <th>岗位</th>
                <th>操作动作</th>
                <th>开始时间</th>
                <th>备注</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>租厂房</td>
                <td>总经理</td>
                <td>申请60w 租厂房</td>
                <td>1月1日</td>
                <td>花60w租A厂房</td>
            </tr>
            <tr>
                <td>2</td>
                <td>资质开发</td>
                <td>总经理</td>
                <td>P3资质开发</td>
                <td>1月1日</td>
                <td>申请20w 资质开发</td>
            </tr>
            <tr>
                <td>3</td>
                <td>批拨款</td>
                <td>财务</td>
                <td>批准</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>支付管理费</td>
                <td>财务</td>
                <td>5w管理费</td>
                <td>1月1日</td>
                <td></td>
            </tr>
            <tr>
                <td>5</td>
                <td>建设生产线</td>
                <td>生产</td>
                <td>4条自动线生产P3</td>
                <td>1月1日</td>
                <td>申请200w资金建线</td>
            </tr>
            <tr>
                <td>6</td>
                <td>iso开发</td>
                <td>总经理</td>
                <td>两个iso的开发</td>
                <td>1月1日</td>
                <td>申请资金开发</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
