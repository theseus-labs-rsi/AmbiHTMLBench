<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Layout</title>
<style>
    body {
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page {
        background-color: #fcfcfc;
        width: 90%;
        max-width: 800px;
        padding: 40px 50px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
        border-radius: 2px;
    }
    .header {
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px;
    }
    .number {
        font-size: 42px;
        font-family: "Kaiti", "STKaiti", serif;
        color: #333;
        margin-right: 15px;
        line-height: 0.8;
        margin-top: 5px;
    }
    .prompt {
        font-size: 15px;
        color: #222;
        line-height: 1.6;
    }
    .prompt-line-2 {
        margin-top: 5px;
    }
    .handwriting-area {
        margin-top: 30px;
    }
    .line {
        border-bottom: 2px dotted #a0a0a0;
        min-height: 50px;
        margin-bottom: 15px;
        font-size: 32px;
        font-family: "Kaiti", "STKaiti", serif;
        color: #111;
        line-height: 50px;
        letter-spacing: 2px;
        position: relative;
    }
    .line span {
        position: relative;
        top: 8px; 
    }
    .right-margin-text {
        position: absolute;
        right: 10px;
        top: 50px;
        font-size: 12px;
        color: #888;
        line-height: 1.8;
    }
</style>
</head>
<body>

<div class="page">
    <div class="right-margin-text">
        为一个<br>
        怎么
    </div>
    
    <div class="header">
        <div class="number">26</div>
        <div class="prompt">
            <div>你的女儿在国家展览馆上看到了某样让她十分不舒服的东西。</div>
            <div class="prompt-line-2">她看到了什么呢？</div>
        </div>
    </div>
    
    <div class="handwriting-area">
        <div class="line"><span>我蹲下来，“这根肋骨让你感</span></div>
        <div class="line"><span>到不舒服吗？”</span></div>
        <div class="line"><span>展览台上是一尊白玉莹莹的肋</span></div>
        <div class="line"><span>骨，下面的文字介绍引用了夏娃</span></div>
        <div class="line"><span>的来历，说女人都是由肋骨所化。</span></div>
    </div>
</div>

</body>
</html>
