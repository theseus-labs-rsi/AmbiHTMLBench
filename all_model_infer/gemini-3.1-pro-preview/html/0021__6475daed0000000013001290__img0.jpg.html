<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How To Make Progress</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 120px;

        }

        }

        .list-item {
            display: flex;
            align-items: baseline;
            font-size: 20px;
        }

        .number {
            font-weight: 700;
            width: 60px;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        .text {
            font-weight: 400;
            letter-spacing: 1px;
        }

        .footer {
            margin-top: auto;
            font-size: 12px;
            color: #b3b3b3;
            letter-spacing: 0.5px;
            padding-bottom: 20px;
        }

<body>

    <div class="list-container">

            <span class="number">01</span>

        </div>
        <div class="list-item">
            <span class="number">02</span>

        </div>

        </div>
        <div class="list-item">
            <span class="number">05</span>
            <span class="text">与优秀的人合作</span>
        </div>
        <div class="list-item">
            <span class="number">06</span>
            <span class="text">克服困难</span>
        </div>
        <div class="list-item">
            <span class="number">07</span>
            <span class="text">坚持努力</span>
        </div>
        <div class="list-item">
            <span class="number">08</span>
            <span class="text">接受反馈</span>
        </div>
        <div class="list-item">
            <span class="number">09</span>
            <span class="text">健康生活方式</span>
        </div>
        <div class="list-item">
            <span class="number">10</span>
            <span class="text">保持积极心态</span>
        </div>

    <div class="footer">@ THE LAB C</div>
