<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Studio Web Poster</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .poster {
        width: 600px;
        height: 820px;
        background-color: #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        overflow: hidden;
        position: relative;
    }
    
    /* Header Styles */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px 15px 30px;
    }
    .logo-area {
        display: flex;
        align-items: center;
    }
    .logo-text {
        font-size: 38px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -3px;
        margin-right: 2px;
    }
    .logo-reg {
        font-size: 12px;
        align-self: flex-start;
        margin-top: 5px;
    }
    .logo-share {
        font-size: 22px;
        font-weight: bold;
        margin-left: 5px;
    }
    .logo-vol {
        font-size: 14px;
        font-weight: bold;
        margin-left: 5px;
        align-self: flex-start;
        margin-top: 5px;
    }
    .header-right-box {
        border: 3px solid #000;
        padding: 4px 10px;
        display: flex;
        align-items: center;
    }
    .header-divider {
        height: 3px;
        background-color: #000;
        margin: 0 30px;
    }
    
    /* Folders Area */
    .folders-area {
        height: 260px;
        position: relative;
        width: 100%;
    }
    .folder {
        position: absolute;
        background: linear-gradient(to bottom, #fcfcfc, #ebebeb);
        border: 1px solid #d0d0d0;
        border-radius: 0 6px 6px 6px;
        padding: 12px;
        box-shadow: 2px 3px 8px rgba(0,0,0,0.08);
        color: #000;
    }
    .f-tab {
        position: absolute;
        top: -11px;
        left: -1px;
        width: 45px;
        height: 11px;
        background: #fcfcfc;
        border: 1px solid #d0d0d0;
        border-bottom: none;
        border-radius: 5px 5px 0 0;
        z-index: 1;
    }
    .folder::after {
        content: '';
        position: absolute;
        top: -1px;
        left: 0;
        width: 43px;
        height: 2px;
        background: #fcfcfc;
        z-index: 2;
    }
    .circle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #d0d0d0;
        color: #fff;
        font-size: 11px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
    }
    
    /* Specific Folders Positioning */
    .f1 { top: 40px; left: 30px; transform: rotate(-32deg); }
    .f2 { top: 25px; left: 220px; }
    .f3 { top: 25px; right: 30px; transform: rotate(32deg); }
    .f4 { top: 145px; left: 110px; }
    .f5 { top: 135px; right: 110px; }
    
    /* Blue Band */
    .blue-band {
        height: 45px;
        background-color: #3b38f6;
        width: 100%;
    }
    
    /* Cyan Section */
    .cyan-section {
        flex-grow: 1;
        background-color: #a8f5f5;
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }
    .main-text-container {
        display: flex;
        justify-content: space-between;
        width: 100%;
    }
    .main-text-char {
        font-size: 78px;
        font-weight: 900;
        color: #000;
        line-height: 1;
    }
    .thick-line {
        height: 5px;
        background-color: #000;
        margin: 18px 0;
        width: 100%;
    }
    
    /* Footer */
    .footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    .footer-left {
        color: #000;
    }
    .barcode {
        width: 150px;
        height: 35px;
        background: linear-gradient(to right, 
            #000 0%, #000 2%, transparent 2%, transparent 4%, 
            #000 4%, #000 5%, transparent 5%, transparent 8%, 
            #000 8%, #000 11%, transparent 11%, transparent 13%, 
            #000 13%, #000 14%, transparent 14%, transparent 16%, 
            #000 16%, #000 19%, transparent 19%, transparent 21%, 
            #000 21%, #000 22%, transparent 22%, transparent 25%, 
            #000 25%, #000 28%, transparent 28%, transparent 30%, 
            #000 30%, #000 31%, transparent 31%, transparent 34%, 
            #000 34%, #000 37%, transparent 37%, transparent 39%, 
            #000 39%, #000 40%, transparent 40%, transparent 43%, 
            #000 43%, #000 46%, transparent 46%, transparent 48%, 
            #000 48%, #000 49%, transparent 49%, transparent 52%, 
            #000 52%, #000 55%, transparent 55%, transparent 57%, 
            #000 57%, #000 58%, transparent 58%, transparent 61%, 
            #000 61%, #000 64%, transparent 64%, transparent 66%, 
            #000 66%, #000 67%, transparent 67%, transparent 70%, 
            #000 70%, #000 73%, transparent 73%, transparent 75%, 
            #000 75%, #000 76%, transparent 76%, transparent 79%, 
            #000 79%, #000 82%, transparent 82%, transparent 84%, 
            #000 84%, #000 85%, transparent 85%, transparent 88%, 
            #000 88%, #000 91%, transparent 91%, transparent 93%, 
            #000 93%, #000 94%, transparent 94%, transparent 97%, 
            #000 97%, #000 100%
        );
    }
</style>
</head>
<body>

<div class="poster">
    
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <span class="logo-text">N气</span>
            <span class="logo-reg">®</span>
            <span class="logo-share">(分享)</span>
            <span class="logo-vol">Vol.07</span>
        </div>
        <div class="header-right-box">
            <svg width="16" height="14" viewBox="0 0 16 14" fill="black">
                <path d="M0 2C0 0.9 0.9 0 2 0H6L8 2H14C15.1 0 16 0.9 16 2V12C16 13.1 15.1 14 14 14H2C0.9 14 0 13.1 0 12V2Z"/>
            </svg>
            <span style="margin-left: 8px; font-weight: bold; font-size: 15px;">Design studio web</span>
        </div>
    </div>
    <div class="header-divider"></div>
    
    <!-- Folders Area -->
    <div class="folders-area">
        
        <div class="folder f1">
            <div class="f-tab"></div>
            <div style="display: flex; align-items: center;">
                <div class="circle">1</div>
                <div style="font-size: 26px; font-weight: bold; margin: 0 8px; letter-spacing: 1px;">ABCD</div>
                <div style="display: flex; align-items: center;">
                    <div style="font-size: 14px; font-weight: bold; margin-right: 4px;">A</div>
                    <div style="font-size: 9px; font-weight: bold; line-height: 1.1;">
                        <div>BLACK</div>
                        <div>COVER DESIGN</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="folder f2">
            <div class="f-tab"></div>
            <div style="text-align: center;">
                <div style="font-size: 22px; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px;">条件反射</div>
                <div style="display: flex; align-items: center; justify-content: center;">
                    <div class="circle">2</div>
                    <div style="font-size: 11px; font-weight: bold; line-height: 1.1; text-align: left; margin-left: 6px;">
                        <div>REFLEX</div>
                        <div>DESIGN</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="folder f3">
            <div class="f-tab"></div>
            <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                    <div style="font-size: 11px; font-weight: bold; line-height: 1.1;">
                        <div>STUDIO</div>
                        <div>NA.</div>
                        <div>EO</div>
                    </div>
                    <div class="circle">3</div>
                </div>
                <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">立入禁止</div>
            </div>
        </div>
        
        <div class="folder f4">
            <div class="f-tab"></div>
            <div>
                <div style="display: flex; align-items: center; margin-bottom: 6px;">
                    <div style="font-size: 24px; font-weight: bold; letter-spacing: 1px;">王志弘</div>
                    <div class="circle" style="margin-left: 8px;">4</div>
                </div>
                <div style="font-size: 11px; font-weight: bold; letter-spacing: 0.5px;">WANG ZHI HONG</div>
            </div>
        </div>
        
        <div class="folder f5">
            <div class="f-tab"></div>
            <div>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                    <div style="font-size: 26px; font-weight: bold; letter-spacing: 1px;">NICE</div>
                    <div class="circle">5</div>
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <div style="font-size: 10px; font-weight: bold; line-height: 1.1; margin-right: 6px;">
                        <div>NICE LAB</div>
                        <div>STUDIO</div>
                    </div>
                    <div style="font-size: 26px; font-weight: bold; line-height: 0.8;">LAB</div>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- Blue Band -->
    <div class="blue-band"></div>
    
    <!-- Cyan Section -->
    <div class="cyan-section">
        <div class="main-text-container">
            <span class="main-text-char">国</span>
            <span class="main-text-char">内</span>
            <span class="main-text-char">知</span>
            <span class="main-text-char">名</span>
            <span class="main-text-char">设</span>
            <span class="main-text-char">计</span>
        </div>
        <div class="thick-line"></div>
        <div class="main-text-container">
            <span class="main-text-char">工</span>
            <span class="main-text-char">作</span>
            <span class="main-text-char">室</span>
            <span class="main-text-char">的</span>
            <span class="main-text-char">官</span>
            <span class="main-text-char">网</span>
        </div>
        <div class="thick-line"></div>
        
        <!-- Footer -->
        <div class="footer">
            <div class="footer-left">
                <div style="margin-bottom: 5px;">
                    <span style="font-size: 18px; font-weight: bold;">Copyright© 2023</span>
                    <span style="font-size: 18px; font-weight: bold; margin-left: 30px;">(官网)</span>
                </div>
                <div style="font-size: 18px; font-weight: bold; letter-spacing: -0.5px;">Jidn share all rights reserved.</div>
            </div>
            
            <div class="footer-center">
                <svg width="45" height="45" viewBox="0 0 100 100">
                    <polygon points="50,10 90,90 10,90" fill="none" stroke="black" stroke-width="6" stroke-linejoin="round"/>
                    <text x="50" y="75" font-size="45" text-anchor="middle" font-family="sans-serif" font-weight="bold">A</text>
                </svg>
            </div>
            
            <div class="footer-right">
                <div class="barcode"></div>
                <div style="font-size: 10px; font-weight: bold; text-align: center; margin-top: 4px; letter-spacing: 1px;">((( JIDN SHARE @2023 )))</div>
            </div>
        </div>
    </div>
    
</div>

</body>
</html>
