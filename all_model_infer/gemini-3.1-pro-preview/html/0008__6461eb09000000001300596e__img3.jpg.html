<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Dialog</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #5a6b66;
    background-image: radial-gradient(circle at center, #6a7b76 0%, #3a4b46 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #ffffff;
  }

  .dialog-wrapper {
    position: relative;
    width: 720px;
    background-color: rgba(40, 50, 45, 0.85);
    border-top: 1px solid rgba(180, 220, 200, 0.4);
    border-bottom: 1px solid rgba(180, 220, 200, 0.4);
    box-shadow: 0 0 20px rgba(150, 200, 180, 0.2);
    padding: 35px 40px;
    display: flex;
    box-sizing: border-box;
  }

  /* Decorative side borders */
  .dialog-wrapper::before,
  .dialog-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 12px;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(180, 220, 200, 0.6) 4px,
      rgba(180, 220, 200, 0.6) 8px
    );
  }

  .dialog-wrapper::before {
    left: 0;
  }

  .dialog-wrapper::after {
    right: 0;
  }

  .left-column {
    width: 140px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-right: 20px;
  }

  .placeholder.mask-image {
    width: 120px;
    height: 120px;
    background-color: rgba(0, 0, 0, 0.3);
    border: 1px dashed rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 12px;
    color: #cccccc;
    box-shadow: 0 0 15px rgba(255, 200, 50, 0.3); /* Simulate the glow */
  }

  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .item-title {
    font-size: 24px;
    font-weight: normal;
    margin: 0 0 12px 0;
    letter-spacing: 2px;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
  }

  .item-stats {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
  }

  .placeholder.icon-armor {
    width: 22px;
    height: 22px;
    background-color: rgba(255, 255, 255, 0.15);
    margin-right: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #dddddd;
  }

  .stat-value {
    background-color: rgba(0, 0, 0, 0.6);
    padding: 2px 12px;
    font-size: 16px;
    font-weight: bold;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .item-description {
    font-size: 15px;
    line-height: 1.7;
    color: #dcdcdc;
    text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8);
  }

  .item-description p {
    margin: 0 0 6px 0;
  }

  .action-prompt {
    position: absolute;
    bottom: 15px;
    right: 30px;
    font-size: 14px;
    display: flex;
    align-items: center;
    color: #ffffff;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
  }

  .placeholder.button-icon {
    width: 20px;
    height: 20px;
    background-color: rgba(255, 255, 255, 0.2);
    border: 1.5px solid #ffffff;
    border-radius: 50%;
    margin-left: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="dialog-wrapper">
  <div class="left-column">
    <div class="placeholder mask-image">[Image: Majora's Mask glowing]</div>
  </div>
  
  <div class="right-column">
    <h1 class="item-title">魔吉拉的面具</h1>
    
    <div class="item-stats">
      <div class="placeholder icon-armor">[Icon]</div>
      <div class="stat-value">1</div>
    </div>
    
    <div class="item-description">
      <p>从太古时期流传下来的面具。</p>
      <p>戴上它的话，有些怪物就不容易发现自己。</p>
      <p>这样的珍品并非轻易就能得到。</p>
    </div>
  </div>

  <div class="action-prompt">
    打开袋子 <div class="placeholder button-icon">+</div>
  </div>
</div>

</body>
</html>
