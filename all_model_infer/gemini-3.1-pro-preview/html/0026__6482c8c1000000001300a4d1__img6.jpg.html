<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointing Reading</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #333;
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            background-color: #e9e9e9;
            display: flex;
            justify-content: center;
        }
        .page {
            width: 100%;
            max-width: 700px;
            background-color: #f7f7f7; /* Matching the off-white page color */
            padding: 40px 50px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header-top {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .subtitle-container {
            padding-left: 45px;
            margin-bottom: -12px; /* Pull banner up to overlap slightly */
            position: relative;
            z-index: 10;
        }
        .subtitle {
            display: inline-block;
            border: 1px solid #a0a0a0;
            border-radius: 20px;
            padding: 4px 20px;
            font-size: 15px;
            background-color: #f7f7f7;
            color: #444;
        }
        .title-banner {
            background-color: #2b2e35;
            color: #fff;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
            border: 2px solid #2b2e35;
        }
        .title-banner::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
        .method-num {
            font-size: 15px;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .divider {
            margin: 0 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
        }
        .method-title {
            font-size: 26px;
            letter-spacing: 1px;
        }
        
        /* Annotation Styles */
        .orange-box-annotation {
            border: 4px solid #ff914d;
            display: inline-block;
            padding: 2px;
            margin-bottom: 15px;
            margin-left: 20px;
        }
        .dark-item-box {
            background-color: #3b3b3b;
            color: #fff;
            padding: 4px 12px;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .orange-underline {
            text-decoration: underline;
            text-decoration-color: #ff914d;
            text-decoration-thickness: 4px;
            text-underline-offset: 6px;
            text-decoration-skip-ink: none;
        }

        /* Content Layout */
        .content-block {
            margin-bottom: 25px;
        }
        .indented-text {
            margin-left: 45px;
            font-size: 16px;
            color: #444;
            line-height: 2.4; /* Generous line height for underlines */
        }
        .paragraph-text {
            text-indent: 2em;
            margin-left: 20px;
            margin-right: 20px;
            font-size: 16px;
            color: #444;
            line-height: 2.6;
            text-align: justify;
        }

        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 10px;
            margin-left: 20px;
        }
        .bottom-text {
            width: 50%;
            text-indent: 2em;
            font-size: 16px;
            line-height: 2.6;
            color: #444;
            padding-top: 10px;
        }
        .placeholder {
            width: 220px;
            height: 220px;
            border: 2px dashed #999;
            background-color: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            box-sizing: border-box;
            margin-right: 20px;
        }

        /* Side Tab */
        .side-tab {
            position: absolute;
            right: -5px;
            top: 260px;
            background-color: #2b2e35;
            color: #fff;
            padding: 8px 12px 8px 15px;
            border-radius: 8px 0 0 8px;
            font-size: 14px;
            border: 1px solid #fff;
            border-right: none;
        }
    </style>
</head>
<body>

<div class="page">
    <div class="side-tab">方法 4...</div>

    <div class="header-top">平读 Plain reading</div>

    <div class="subtitle-container">
        <div class="subtitle">用手指来指引读书的方向</div>
    </div>

    <div class="title-banner">
        <span class="method-num">方法 40</span>
        <span class="divider">|</span>
        <span class="method-title">指读 (Pointing Reading)</span>
    </div>

    <div class="content-block">
        <div class="orange-box-annotation">
            <div class="dark-item-box">① 用手指或是笔尖指着当前读到的位置</div>
        </div>
        <div class="indented-text">
            <span class="orange-underline">视线聚焦在手指或笔尖。</span>
        </div>
    </div>

    <div class="content-block">
        <div class="orange-box-annotation">
            <div class="dark-item-box">② 沿着阅读的方向移动手指或笔尖</div>
        </div>
        <div class="paragraph-text">
            <span class="orange-underline">一边往下读，一边移动手指或笔尖。此时视线依然聚焦在手指或笔尖。手指（或笔尖）的移动速度与我们阅读的速度相同。这样一来，我们的阅读速度会受到手指（或笔尖）移动速度的制约，但是可以保证不会出现倒退或是看错行的情况。</span>
        </div>
    </div>

    <div class="bottom-section">
        <div class="bottom-text">
            <span class="orange-underline">大家也可以试着将这种方式与朗读结合起来，将指着的内容出声读出来。</span>
        </div>
        <figure class="placeholder">
            [Illustration: Line drawing of a wide-eyed cat character reading a book]
        </figure>
    </div>
</div>

</body>
</html>
