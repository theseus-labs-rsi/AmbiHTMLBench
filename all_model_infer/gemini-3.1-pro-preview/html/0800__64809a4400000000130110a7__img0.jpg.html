<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curvilinear Composition</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .poster {
        position: relative;
        width: 640px;
        height: 900px;
        background-color: #ffffff;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    
    .bg-yellow { background-color: #ffe600; }
    .bg-black { background-color: #080808; }
    .text-yellow { color: #ffe600; }
    .text-gold { color: #d4c06b; }
    .font-serif { font-family: 'Times New Roman', Times, serif; }

    /* Header */
    .header-left { position: absolute; top: 35px; left: 35px; }
    .header-left .title { font-size: 18px; font-weight: bold; letter-spacing: 1px; color: #111; }
    .header-left .subtitle { font-size: 10px; color: #666; margin-top: 4px; letter-spacing: 0.5px; }
    
    .header-right { position: absolute; top: 35px; right: 35px; text-align: right; }
    .header-right .title { font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #111; }
    .header-right .subtitle { font-size: 10px; color: #666; margin-top: 4px; letter-spacing: 3px; }

    /* Main Elements */
    .box-ku { 
        position: absolute; top: 100px; left: 35px; width: 110px; height: 110px; 
        display: flex; justify-content: center; align-items: center; 
    }
    .box-ku span { font-size: 70px; font-weight: 900; color: #111; }

    .box-cools { 
        position: absolute; top: 85px; left: 175px; width: 430px; height: 130px; 
        padding: 20px 35px; box-sizing: border-box; 
    }
    .box-cools .row-1 { display: flex; justify-content: space-between; font-size: 46px; font-weight: bold; }
    .box-cools .row-2 { display: flex; justify-content: space-between; font-size: 34px; margin-top: 5px; padding: 0 10px; }

    .dash-1 { position: absolute; top: 240px; left: 60px; width: 60px; height: 12px; }

    .box-goutu { 
        position: absolute; top: 280px; left: 35px; width: 140px; height: 140px; 
        display: flex; justify-content: center; align-items: center; text-align: center; 
    }
    .box-goutu div { font-size: 32px; font-weight: bold; line-height: 1.25; color: #111; }

    .box-yongyuan { 
        position: absolute; top: 260px; right: 35px; width: 160px; height: 160px; 
        display: flex; justify-content: center; align-items: center; 
    }
    .box-yongyuan div { font-size: 42px; font-weight: bold; line-height: 1.3; text-align: center; }

    .dash-2 { position: absolute; top: 440px; right: 75px; width: 80px; height: 18px; }

    .box-importance { 
        position: absolute; top: 460px; left: 35px; width: 155px; height: 155px; 
        display: flex; justify-content: center; align-items: center; text-align: center; 
    }
    .box-importance div { font-size: 11px; letter-spacing: 1px; line-height: 1.6; padding: 10px; }

    .box-dingdian { 
        position: absolute; top: 490px; left: 205px; width: 400px; height: 120px; 
        display: flex; justify-content: center; align-items: center; 
    }
    .box-dingdian div { font-size: 60px; font-weight: bold; letter-spacing: 15px; margin-left: 15px; }

    /* Lower Section */
    .dash-3 { position: absolute; top: 645px; left: 85px; width: 55px; height: 18px; }
    .circle-yellow { position: absolute; top: 690px; left: 60px; width: 100px; height: 100px; border-radius: 50%; }

    .repeating-text { 
        position: absolute; top: 640px; left: 205px; width: 400px; 
        font-size: 10px; font-weight: bold; line-height: 2; 
    }
    .repeating-text .row { display: flex; justify-content: space-between; }
    .repeating-text .row-inverted { background-color: #080808; color: #ffe600; padding: 1px 0; }

    .double-line { 
        position: absolute; top: 715px; left: 205px; width: 400px; 
        border-top: 3px solid #080808; border-bottom: 3px solid #080808; height: 4px; 
    }

    .banner { 
        position: absolute; top: 750px; left: 165px; padding: 8px 15px; 
        font-size: 13px; letter-spacing: 1px; 
    }
    .square-small { position: absolute; top: 730px; right: 35px; width: 60px; height: 60px; }

    /* Footer */
    .footer { 
        position: absolute; bottom: 35px; width: 100%; text-align: center; 
        font-size: 16px; font-weight: bold; letter-spacing: 14px; color: #111; 
    }
</style>
</head>
<body>

<div class="poster">
    <!-- Header -->
    <div class="header-left">
        <div class="title">曲线式构图</div>
        <div class="subtitle">CURVILINEAR COMPOSITION</div>
    </div>
    <div class="header-right">
        <div class="title">版式设计</div>
        <div class="subtitle">2023 / 6 / 0 7</div>
    </div>

    <!-- Row 1 -->
    <div class="box-ku bg-yellow">
        <span>酷</span>
    </div>
    <div class="box-cools bg-black text-yellow">
        <div class="row-1">
            <span>酷</span><span>设</span><span>而</span><span>遇</span>
        </div>
        <div class="row-2 font-serif">
            <span>C</span><span>O</span><span>O</span><span>L</span><span>S</span>
        </div>
    </div>

    <!-- Separator 1 -->
    <div class="dash-1 bg-black"></div>

    <!-- Row 2 -->
    <div class="box-goutu bg-yellow">
        <div>构图的<br>重要性</div>
    </div>
    <div class="box-yongyuan bg-black text-yellow">
        <div>酷设<br>永远</div>
    </div>

    <!-- Separator 2 -->
    <div class="dash-2 bg-black"></div>

    <!-- Row 3 -->
    <div class="box-importance bg-black">
        <div class="text-gold font-serif">THE IMPORTANCE<br>OF COMPOSITION</div>
    </div>
    <div class="box-dingdian bg-black text-yellow">
        <div>在顶点</div>
    </div>

    <!-- Lower Section Elements -->
    <div class="dash-3 bg-yellow"></div>
    <div class="circle-yellow bg-yellow"></div>

    <!-- Repeating Text Block -->
    <div class="repeating-text">
        <div class="row">
            <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span>
        </div>
        <div class="row row-inverted">
            <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span>
        </div>
        <div class="row">
            <span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span><span>都可以是图片</span>
        </div>
    </div>

    <!-- Lines and Banner -->
    <div class="double-line"></div>
    <div class="banner bg-black text-gold font-serif">
        COOL SET IS ALWAYS AT THE TOP
    </div>
    <div class="square-small bg-yellow"></div>

    <!-- Footer -->
    <div class="footer">
        我 / 看 / 不 / 懂 / 但 / 大 / 受 / 震 / 撼
    </div>
</div>

</body>
</html>
