<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三天路线规划</title>
<style>
  body {
    background-color: #ffffff;
    background-image: 
      linear-gradient(#e8f0f8 1px, transparent 1px),
      linear-gradient(90deg, #e8f0f8 1px, transparent 1px);
    background-size: 15px 15px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 520px;
    background: transparent;
  }
  .title {
    text-align: center;
    color: #001a66;
    font-size: 46px;
    font-weight: 900;
    margin-top: 0;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  .timeline-row {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
  }
  .arrow-row {
    margin-bottom: 8px;
    margin-top: 8px;
  }
  .left-col {
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .right-col {
    flex-grow: 1;
    display: flex;
    align-items: center;
  }
  .day-badge {
    background-color: #bdf0cc;
    color: #000;
    font-size: 24px;
    font-weight: bold;
    padding: 6px 18px;
    margin-bottom: 5px;
  }
  .location-name {
    font-size: 22px;
    font-weight: bold;
    color: #000;
  }
  .desc-box {
    border: 2px solid #800000;
    background-color: #fff;
    padding: 10px 12px;
    font-size: 15px;
    line-height: 1.6;
    width: 100%;
    box-sizing: border-box;
  }
  .blue-text {
    color: #0056b3;
  }
  .arrow-with-text {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .arrow-text-left, .arrow-text-right {
    font-size: 15px;
    color: #000;
    background-color: #fae3e3;
    padding: 2px 6px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">第三天路线规划</div>
  
  <!-- Start -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="day-badge">第三天</div>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Arrow 0 -->
  <div class="timeline-row arrow-row">
    <div class="left-col">
      <svg width="18" height="32" viewBox="0 0 18 32">
        <path d="M 6 0 L 12 0 L 12 20 L 18 20 L 9 32 L 0 20 L 6 20 Z" fill="#ffda44" stroke="#000" stroke-width="1"/>
      </svg>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Stop 1 -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="location-name">磁器口</div>
    </div>
    <div class="right-col">
      <div class="desc-box">
        <span class="blue-text">磁器口 (免费)</span> : 汇聚美食、重庆特色伴手礼，始建于宋代“一江两溪三山四巷”独特地貌
      </div>
    </div>
  </div>

  <!-- Arrow 1 -->
  <div class="timeline-row arrow-row">
    <div class="left-col">
      <div class="arrow-with-text">
        <span class="arrow-text-left">1号线</span>
        <svg width="18" height="32" viewBox="0 0 18 32">
          <path d="M 6 0 L 12 0 L 12 20 L 18 20 L 9 32 L 0 20 L 6 20 Z" fill="#ffda44" stroke="#000" stroke-width="1"/>
        </svg>
        <span class="arrow-text-right">30分钟</span>
      </div>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Stop 2 -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="location-name">罗中立美术馆</div>
    </div>
    <div class="right-col">
      <div class="desc-box">
        <span class="blue-text">罗中立美术馆 (免费)</span> : 拍照超级出片，墙体比较花，拍照尽量穿不花或者饱和度低的衣服
      </div>
    </div>
  </div>

  <!-- Arrow 2 -->
  <div class="timeline-row arrow-row">
    <div class="left-col">
      <div class="arrow-with-text">
        <span class="arrow-text-left">1号线</span>
        <svg width="18" height="32" viewBox="0 0 18 32">
          <path d="M 6 0 L 12 0 L 12 20 L 18 20 L 9 32 L 0 20 L 6 20 Z" fill="#ffda44" stroke="#000" stroke-width="1"/>
        </svg>
        <span class="arrow-text-right">80分钟</span>
      </div>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Stop 3 -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="location-name">山城步道</div>
    </div>
    <div class="right-col">
      <div class="desc-box">
        <span class="blue-text">山城步道 (免费)</span> : 建在悬崖边的临江步道，汇聚老重庆特色步道
      </div>
    </div>
  </div>

  <!-- Arrow 3 -->
  <div class="timeline-row arrow-row">
    <div class="left-col">
      <div class="arrow-with-text">
        <span class="arrow-text-left">公交</span>
        <svg width="18" height="32" viewBox="0 0 18 32">
          <path d="M 6 0 L 12 0 L 12 20 L 18 20 L 9 32 L 0 20 L 6 20 Z" fill="#ffda44" stroke="#000" stroke-width="1"/>
        </svg>
        <span class="arrow-text-right">32分钟</span>
      </div>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Stop 4 -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="location-name">观音桥</div>
    </div>
    <div class="right-col">
      <div class="desc-box">
        <span class="blue-text">观音桥 (免费)</span> : 超大商圈，还有很多地道重庆小吃
      </div>
    </div>
  </div>

  <!-- Arrow 4 -->
  <div class="timeline-row arrow-row">
    <div class="left-col">
      <div class="arrow-with-text">
        <span class="arrow-text-left">步行</span>
        <svg width="18" height="32" viewBox="0 0 18 32">
          <path d="M 6 0 L 12 0 L 12 20 L 18 20 L 9 32 L 0 20 L 6 20 Z" fill="#ffda44" stroke="#000" stroke-width="1"/>
        </svg>
        <span class="arrow-text-right">15分钟</span>
      </div>
    </div>
    <div class="right-col"></div>
  </div>

  <!-- Stop 5 -->
  <div class="timeline-row">
    <div class="left-col">
      <div class="location-name">九街</div>
    </div>
    <div class="right-col">
      <div class="desc-box">
        <span class="blue-text">九街 (免费)</span> : 酒吧一条街，娱乐夜生活开启地，和式风格的酒吧都有
      </div>
    </div>
  </div>

</div>

</body>
</html>
