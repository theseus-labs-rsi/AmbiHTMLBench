<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当你开始看纪录片</title>
    <style>
        body {
            background-color: #a4a9ad;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .notebook-page {
            width: 550px;
            background-color: #f7f9f2;
            background-image: repeating-linear-gradient(
                transparent 0px, 
                transparent 39px, 
                #ccd1cd 39px, 
                #ccd1cd 40px
            );
            background-size: 100% 40px;
            background-position: 0 50px; 
            padding: 50px 30px 60px 50px; 
            box-shadow: inset 8px 0 15px rgba(0,0,0,0.04), 5px 5px 20px rgba(0,0,0,0.15);
            border-radius: 2px 8px 8px 2px;
            font-family: 'Kaiti', 'STKaiti', 'KaiTi_GB2312', '楷体', 'PingFang SC', cursive, serif;
            color: #1a1a1a;
            position: relative;
            box-sizing: border-box;
        }

        .row {
            height: 40px;
            display: flex;
            align-items: flex-end; 
            padding-bottom: 3px; 
            box-sizing: border-box;
        }

        .c-red { color: #823e42; }
        .c-green { color: #8b9a2c; }

        .title-row {
            font-size: 26px;
            font-weight: bold;
        }
        
        .circle-num {
            font-size: 22px;
            margin-left: 8px;
            margin-bottom: 2px;
        }

        .section-header {
            font-size: 22px;
            font-weight: bold;
            justify-content: flex-start;
        }

        .section-title {
            width: 260px; 
        }

        .tag {
            font-size: 24px;
        }

        .list-item {
            font-size: 19px;
            margin-left: 15px; 
        }

        .idx {
            width: 25px;
            display: inline-block;
        }

        .book-title {
            width: 220px;
            display: inline-block;
        }

        .score {
            display: inline-block;
        }

        .footer-row {
            justify-content: flex-end;
            padding-right: 50px;
            font-size: 19px;
        }

        .watermark {
            position: absolute;
            bottom: 12px;
            right: 25px;
            color: #79aacc;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div class="notebook-page">
        <div class="row title-row c-red">
            <span>当你开始看纪录片！！！</span><span class="c-green circle-num">③</span>
        </div>
        
        <div class="row"></div>
        
        <div class="row section-header">
            <span class="c-green section-title">风俗美食篇：</span>
            <span class="c-red tag">格局炸裂</span>
        </div>
        
        <div class="row list-item">
            <span class="idx">1.</span><span class="book-title">《舌尖上的中国》</span><span class="score">9.4分</span>
        </div>
        <div class="row list-item">
            <span class="idx">2.</span><span class="book-title">《风味人间》</span><span class="score">9.1分</span>
        </div>
        <div class="row list-item">
            <span class="idx">3.</span><span class="book-title">《人生一串》</span><span class="score">9.0分</span>
        </div>
        <div class="row list-item">
            <span class="idx">4.</span><span class="book-title">《寻味顺德》</span><span class="score">9.0分</span>
        </div>
        <div class="row list-item">
            <span class="idx">5.</span><span class="book-title">《早餐中国》</span><span class="score">8.9分</span>
        </div>
        <div class="row list-item">
            <span class="idx">6.</span><span class="book-title">《奶奶最懂得》</span><span class="score">8.9分</span>
        </div>
        <div class="row list-item">
            <span class="idx">7.</span><span class="book-title">《水果传》</span><span class="score">8.6分</span>
        </div>
        
        <div class="row"></div>
        
        <div class="row section-header">
            <span class="c-green section-title">心理学篇：</span>
        </div>
        
        <div class="row list-item">
            <span class="idx">1.</span><span class="book-title">《积极心理学》</span><span class="score">9.6分</span>
        </div>
        <div class="row list-item">
            <span class="idx">2.</span><span class="book-title">《他乡的童年》</span><span class="score">8.9分</span>
        </div>
        <div class="row list-item">
            <span class="idx">3.</span><span class="book-title">《你看不见的我》</span><span class="score">8.6分</span>
        </div>
        <div class="row list-item">
            <span class="idx">4.</span><span class="book-title">《幸福实验室》</span><span class="score">8.4分</span>
        </div>
        <div class="row list-item">
            <span class="idx">5.</span><span class="book-title">《梦的解析》</span><span class="score">8.3分</span>
        </div>
        
        <div class="row"></div>
        
        <div class="row section-header">
            <span class="c-green section-title">艺术审美篇：</span>
        </div>
        
        <div class="row list-item">
            <span class="idx">1.</span><span class="book-title">《艺术的力量》</span><span class="score">9.3分</span>
        </div>
        <div class="row list-item">
            <span class="idx">2.</span><span class="book-title">《旷世杰作的秘密》</span><span class="score">9.2分</span>
        </div>
        <div class="row list-item">
            <span class="idx">3.</span><span class="book-title">《摄影艺术百年史》</span><span class="score">9.1分</span>
        </div>
        <div class="row list-item">
            <span class="idx">4.</span><span class="book-title">《寻找手艺》</span><span class="score">9.1分</span>
        </div>
        <div class="row list-item">
            <span class="idx">5.</span><span class="book-title">《博物馆的秘密》</span><span class="score">8.8分</span>
        </div>
        
        <div class="row"></div>
        
        <div class="row footer-row">
            <span class="c-red">来源：楠里</span>
        </div>
        
        <div class="watermark">KOKUYO</div>
    </div>
</body>
</html>
