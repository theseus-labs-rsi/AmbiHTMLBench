<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京剧艺术节海报 Layout</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .poster-container {
        width: 800px;
        height: 1422px;
        background-color: #ffffff;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        overflow: hidden;
        font-family: 'Songti SC', 'STSong', 'SimSun', serif;
        color: #000;
    }

    /* Placeholders for Graphic Elements */
    .placeholder {
        position: absolute;
        background-color: rgba(200, 200, 200, 0.15);
        border: 1px dashed rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #777;
        z-index: 1;
    }

    .ph-logo {
        top: 55px;
        right: 60px;
        width: 45px;
        height: 45px;
    }

    .ph-right-art {
        top: -50px;
        right: -50px;
        width: 450px;
        height: 750px;
        border-radius: 0 0 0 50%; /* Rough shape approximation */
    }

    .ph-red-circle {
        top: 540px;
        left: 410px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
    }

    .ph-red-bar {
        top: 720px;
        right: 180px;
        width: 45px;
        height: 400px;
    }

    .ph-small-dot {
        top: 985px;
        left: 470px;
        width: 25px;
        height: 25px;
        border-radius: 50%;
    }

    .ph-landscape {
        bottom: 0;
        left: 0;
        width: 100%;
        height: 350px;
    }

    /* Text Layer */
    .text-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none; /* Let clicks pass through to placeholders if needed */
    }

    /* Top Right English */
    .top-right-en {
        position: absolute;
        top: 130px;
        right: 63px;
        text-align: center;
        font-family: 'Times New Roman', Times, serif;
        font-size: 24px;
        line-height: 1.5;
        letter-spacing: 1px;
    }

    /* Main Title Section */
    .title-section {
        position: absolute;
        top: 80px;
        left: 65px;
    }

    /* Role Circles Left Column */
    .role-column {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .role-circle {
        width: 52px;
        height: 52px;
        border: 1px solid #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
    }

    /* Vertical Subtitle */
    .subtitle-column {
        position: absolute;
        top: 510px;
        left: 25px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .subtitle-char {
        font-size: 26px;
        letter-spacing: 2px;
    }

    /* Vertical Main Title */
    .maintitle-column {
        position: absolute;
        top: 0;
        left: 100px;
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .maintitle-char {
        font-size: 135px;
        line-height: 1.05;
        letter-spacing: -5px;
    }

    .text-red {
        color: #d61821;
    }

    /* Bottom Details Section */
    .details-section {
        position: absolute;
        bottom: 250px;
        left: 65px;
        display: flex;
        flex-direction: column;
    }

    .detail-text {
        font-size: 28px;
        margin-bottom: 18px;
        letter-spacing: 1.5px;
    }

    /* Date Layout */
    .date-container {
        margin: 25px 0 35px 0;
        display: flex;
        flex-direction: column;
    }

    .date-label {
        font-family: Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 1px;
        margin-bottom: 2px;
    }

    .date-row {
        display: flex;
        align-items: baseline;
    }

    .date-number {
        font-family: 'Times New Roman', Times, serif;
        font-size: 80px;
        line-height: 1;
        letter-spacing: -2px;
    }

    .date-day {
        font-family: 'Times New Roman', Times, serif;
        font-size: 22px;
        margin-left: 10px;
        margin-right: 15px;
    }

    .date-slash {
        font-family: Arial, sans-serif;
        font-size: 70px;
        font-weight: 200;
        color: #777;
        margin: 0 15px;
    }

    .phone-text {
        font-family: 'Times New Roman', 'Songti SC', serif;
    }
</style>
</head>
<body>

<div class="poster-container">

    <!-- Graphical Elements (Placeholders) -->
    <div class="placeholder ph-logo">[Logo: Red Pattern]</div>
    <div class="placeholder ph-right-art">[Abstract Graphic: Triangles/Circles]</div>
    <div class="placeholder ph-red-circle">[Red Circle]</div>
    <div class="placeholder ph-red-bar">[Red Rectangle]</div>
    <div class="placeholder ph-small-dot">[Red Dot]</div>
    <div class="placeholder ph-landscape">[Landscape Painting: Mountains/Birds]</div>

    <!-- Text Elements -->
    <div class="text-content">
        
        <div class="top-right-en">
            Gao<br>Ding<br>Yi<br>Shu
        </div>

        <div class="title-section">
            <div class="role-column">
                <div class="role-circle">生</div>
                <div class="role-circle">旦</div>
                <div class="role-circle">净</div>
                <div class="role-circle">末</div>
                <div class="role-circle">丑</div>
            </div>

            <div class="subtitle-column">
                <div class="subtitle-char">稿</div>
                <div class="subtitle-char">定</div>
                <div class="subtitle-char">艺</div>
                <div class="subtitle-char">术</div>
                <div class="subtitle-char">展</div>
            </div>

            <div class="maintitle-column">
                <div class="maintitle-char text-red">京</div>
                <div class="maintitle-char text-red">剧</div>
                <div class="maintitle-char">艺</div>
                <div class="maintitle-char">术</div>
                <div class="maintitle-char">节</div>
            </div>
        </div>

        <div class="details-section">
            <div class="detail-text">主办方： 稿定集团</div>
            <div class="detail-text">地点： 厦门市稿定剧院</div>
            
            <div class="date-container">
                <div class="date-label">DATE.</div>
                <div class="date-row">
                    <span class="date-number">12.20</span>
                    <span class="date-day">SUN</span>
                    <span class="date-slash">/</span>
                    <span class="date-number">12.30</span>
                    <span class="date-day">SAT</span>
                </div>
            </div>

            <div class="detail-text phone-text">联系电话： 0592-8888888</div>
        </div>

    </div>

</div>

</body>
</html>
