<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Layout</title>
    <style>
        body {
            background-color: #2a2139;
            color: #c5a87c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            width: 100%;
        }
        .placeholder {
            border: 1px dashed #c5a87c;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #c5a87c;
            font-size: 12px;
            box-sizing: border-box;
            padding: 10px;
        }
        .logo-placeholder {
            width: 180px;
            height: 180px;
            margin-bottom: 60px;
        }
        .english-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
        }
        .star {
            font-size: 20px;
        }
        .english-text {
            margin: 0;
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
            letter-spacing: 0.5px;
            font-weight: 300;
        }
        .chinese-text {
            font-family: "Songti SC", "SimSun", "STSong", serif;
            font-size: 22px;
            line-height: 2.2;
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="placeholder logo-placeholder">
            [Logo: Diamond shape with Venus symbol inside]
        </div>
        
        <div class="english-container">
            <span class="star">✦</span>
            <p class="english-text">
                I think the so-called loneliness refers to the person you are facing,<br>
                whose emotions are not on the same frequency as your own.
            </p>
            <span class="star">✦</span>
        </div>

        <div class="chinese-text">
            “ 我想所谓孤独，<br>
            就是你面对的那个人，<br>
            他的情绪和你自己的情绪，<br>
            不在同一个频率。 ”
        </div>
    </div>
</body>
</html>
