<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国色·藕荷</title>
    <style>
        body {
            background-color: #dfc4cd;
            font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
            color: #4a4a4a;
            margin: 0;
            padding: 4% 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .container {
            border: 1px solid #4a4a4a;
            padding: 12% 8%;
            width: 100%;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .section {
            margin-bottom: 15%;
        }
        .section:last-child {
            margin-bottom: 0;
        }
        .title {
            font-size: 1.2rem;
            margin-bottom: 6%;
            letter-spacing: 2px;
        }
        .item {
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 5%;
            letter-spacing: 1px;
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 3%;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1px;
        }
        .footer-right {
            display: flex;
            align-items: center;
        }
        .placeholder {
            width: 16px;
            height: 16px;
            border: 1px solid #888;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            margin-right: 5px;
            color: #888;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="section">
                <div class="title">△桂花露</div>
                <div class="item">〔功用〕开胃消食，宽胸化痰</div>
                <div class="item">〔药物〕桂花500克</div>
                <div class="item">〔制法〕于9月底开花时采收，阴干，拣去杂质。先加水浸泡2小时，放入蒸馏器蒸2次，收集蒸馏液</div>
            </div>

            <div class="section">
                <div class="title">△荷花露</div>
                <div class="item">〔功用〕清暑凉营</div>
                <div class="item">〔药物〕白荷花500克</div>
                <div class="item">〔制法〕取含花未放的大花蕾或开放的花，阴干切碎，加水浸泡2小时。放入蒸馏器蒸2小时，收集蒸馏液</div>
            </div>
        </div>
        <div class="footer">
            <div>【中国色·藕荷】</div>
            <div class="footer-right">
                <div class="placeholder">[Logo]</div>
                图虫APP
            </div>
        </div>
    </div>
</body>
</html>
