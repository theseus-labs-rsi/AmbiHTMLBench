<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology Notes Layout</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #2c2c2c;
            line-height: 1.6;
        }
        .page-container {
            background-color: #fff;
            width: 750px;
            padding: 40px 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 4px;
            font-size: 17px;
        }
        .arrow-above {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 8px;
        }
        .arrow-above span {
            font-size: 0.7em;
            line-height: 1;
            margin-bottom: -4px;
        }
        .tree-layout {
            display: flex;
            align-items: flex-start;
            margin: 15px 0 25px 0;
        }
        .tree-root {
            display: flex;
            flex-direction: column;
            margin-right: 20px;
        }
        .tree-root-action {
            margin-top: 5px;
            margin-left: 20px;
            font-size: 0.95em;
        }
        .tree-branches {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .branch-item {
            display: flex;
            align-items: center;
        }
        .line-symbol {
            font-family: monospace;
            margin-right: 12px;
            color: #555;
            user-select: none;
        }
        .list-item {
            display: flex;
            margin-bottom: 15px;
        }
        .list-number {
            width: 25px;
            flex-shrink: 0;
        }
        .list-content {
            flex-grow: 1;
        }
        .indent-text {
            margin-left: 2em;
        }
        .divider-line {
            border-top: 1px solid #444;
            margin: 35px 0;
        }
        .complex-tree {
            display: flex;
            align-items: center;
            margin-top: 25px;
        }
        .complex-root {
            font-size: 1.15em;
            margin-right: 40px;
            margin-left: 20px;
            flex-shrink: 0;
        }
        .complex-branches {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .complex-branch-item {
            display: flex;
            align-items: flex-start;
        }
        .complex-line {
            font-family: monospace;
            margin-right: 15px;
            color: #555;
            margin-top: 2px;
        }
        .complex-content {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Top Section -->
        <div>内质网 <div class="arrow-above"><span>到</span>&rarr;</div> 高尔基体</div>
        
        <div class="tree-layout">
            <div class="tree-root">
                <div>cell的生物膜系统</div>
                <div class="tree-root-action">&darr; 作用</div>
            </div>
            <div class="tree-branches">
                <div class="branch-item"><span class="line-symbol">\&nbsp;</span> cell膜</div>
                <div class="branch-item"><span class="line-symbol">&mdash;&nbsp;</span> cell器膜</div>
                <div class="branch-item"><span class="line-symbol">/&nbsp;</span> 核膜</div>
            </div>
        </div>
        
        <div class="list-item">
            <div class="list-number">①</div>
            <div class="list-content">
                使cell具有相对稳定的内部环境<br>
                <div class="indent-text">
                    同时，在cell与外部环境进行物质运输、能量转<br>
                    化、信息传递的过程中起决定性作用.
                </div>
            </div>
        </div>
        
        <div class="list-item">
            <div class="list-number">②</div>
            <div class="list-content">
                广阔的膜面积为许多酶提供了附着位点.
            </div>
        </div>
        
        <div class="list-item">
            <div class="list-number">③</div>
            <div class="list-content">
                分隔 &rarr; 保证了cell生命活动高效，有序的<br>
                <div class="indent-text">进行.</div>
            </div>
        </div>
        
        <!-- Divider -->
        <div class="divider-line"></div>
        
        <!-- Bottom Section -->
        <div style="margin-bottom: 25px;">cell核控制着cell的代谢和遗传</div>
        
        <div class="complex-tree">
            <div class="complex-root">
                cell核
            </div>
            <div class="complex-branches">
                <div class="complex-branch-item">
                    <div class="complex-line">/</div>
                    <div class="complex-content">核膜 · 双层 · 外隔</div>
                </div>
                <div class="complex-branch-item">
                    <div class="complex-line">&mdash;</div>
                    <div class="complex-content">
                        <div>核仁：与某种RNA的合成以及核糖</div>
                        <div style="margin-left: 3.5em;">体的形成有关</div>
                    </div>
                </div>
                <div class="complex-branch-item">
                    <div class="complex-line">\&nbsp;</div>
                    <div class="complex-content">
                        <div>染色质 &rarr; 由DNA和Pro组成</div>
                        <div style="margin-left: 4.5em;">&darr; 遗传信息的载体</div>
                    </div>
                </div>
                <div class="complex-branch-item">
                    <div class="complex-line" style="margin-left: -5px;">\&nbsp;</div>
                    <div class="complex-content">
                        <div>核孔：实现核质之间频繁的物质交</div>
                        <div style="margin-left: 2.5em;">和信息交流</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
