<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Recommendations</title>
<style>
  body {
    background-color: #f6f4fa;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: #333333;
  }
  .container {
    width: 100%;
    max-width: 520px;
    background-color: transparent;
    padding: 40px 20px;
    box-sizing: border-box;
  }
  .section {
    margin-bottom: 50px;
  }
  .title-banner {
    background-color: #ead1d1;
    text-align: center;
    font-weight: 900;
    font-size: 22px;
    padding: 12px 0;
    margin-bottom: 30px;
    color: #000;
    letter-spacing: 1px;
  }
  .content-row {
    display: flex;
    gap: 20px;
  }
  .placeholder {
    width: 155px;
    height: 220px;
    background-color: #e0e0e0;
    border: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    color: #666;
    flex-shrink: 0;
    box-sizing: border-box;
    padding: 10px;
  }
  .text-content {
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 15.5px;
    line-height: 1.6;
    justify-content: flex-start;
  }
  .text-content p {
    margin: 0;
  }
  .footer {
    text-align: center;
    font-size: 14px;
    color: #555;
    margin-top: 60px;
    margin-bottom: 20px;
    font-family: "Comic Sans MS", cursive, sans-serif;
  }
</style>
</head>
<body>
  <div class="container">
    
    <div class="section">
      <div class="title-banner">《达摩流浪者》</div>
      <div class="content-row">
        <div class="placeholder">
          [Book Cover:<br>The Dharma Bums]
        </div>
        <div class="text-content">
          <p>评分：8.5</p>
          <p>永远年轻，永远热泪盈眶</p>
          <p>相信每个理想主义的nfper，每个<br>
          在庸碌生活中迷茫的人，每个还<br>
          没被社会总开关控制的人，都会<br>
          被书中纯净又赤诚的灵魂打动。</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="title-banner">《深时之旅》</div>
      <div class="content-row">
        <div class="placeholder">
          [Book Cover:<br>Underland A Deep Time Journey]
        </div>
        <div class="text-content">
          <p>评分：8.7</p>
          <p>地下，有另外一个世界！</p>
          <p>作者以充满灵性的语言，描绘了地<br>
          下世界一个又一个奇妙的科学现<br>
          象，神秘的传说和感人的故事。<br>
          天呐！惊叹，将是你的主旋律</p>
        </div>
      </div>
    </div>

    <div class="footer">
      分&nbsp;&nbsp;享&nbsp;&nbsp;好&nbsp;&nbsp;书&nbsp;&nbsp;的&nbsp;&nbsp;Grit
    </div>

  </div>
</body>
</html>
