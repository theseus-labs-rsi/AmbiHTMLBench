<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #dcd6d2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .document {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 40px 20px;
            border-left: 1px solid #777;
            border-right: 4px double #777;
            max-width: 800px;
        }
        .banners {
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin-right: 30px;
            align-items: flex-start;
        }
        .banner {
            background-color: #333;
            color: #fff;
            writing-mode: vertical-rl;
            text-orientation: upright;
            padding: 20px 8px;
            font-size: 22px;
            font-family: "SimSun", "Songti SC", serif;
            letter-spacing: 4px;
            line-height: 1;
        }
        .banner.left {
            margin-top: 30px;
        }
        .banner.right {
            margin-top: 0;
        }
        .content {
            display: flex;
            flex-direction: column;
            color: #222;
            font-size: 18px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            line-height: 1.8;
        }
        .content p {
            margin: 12px 0;
        }
        .indent {
            text-indent: 2em;
        }
    </style>
</head>
<body>
    <div class="document">
        <div class="banners">
            <div class="banner left">福国王夫人震怒欲逐之</div>
            <div class="banner right">国朝妻管严疑有私生子</div>
        </div>
        <div class="content">
            <p class="indent">
                瞳孔地震！将王安石抬进孔庙的好女婿蔡卞<br>
                近日疑似陷入私生子风波。蔡卞妻福国夫人王氏<br>
                闻之震怒，欲除妾生子，因故生病。
            </p>
            <p class="indent">
                本消息来自翰林医官院药方笔录：
            </p>
            <p>
                《香术散》：治妊娠五个月已后。常胸腹间气刺满痛，<br>
                或肠鸣，以至呕逆减食。此由喜怒忧虑过度、饮食失<br>
                节之所致。蔡元度宠人有子，夫人怒，欲逐之，遂病<br>
                。医官王师复处此方三服而愈，后用果验。
            </p>
        </div>
    </div>
</body>
</html>
