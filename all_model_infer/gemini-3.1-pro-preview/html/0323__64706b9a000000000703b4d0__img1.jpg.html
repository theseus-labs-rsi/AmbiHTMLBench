<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如何避免/减少巴纳姆效应？</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fcf4d9;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        justify-content: center;
        color: #111;
    }
    .container {
        width: 600px;
        min-height: 800px;
        position: relative;
        padding: 60px 45px;
        box-sizing: border-box;
        overflow: hidden;
    }
    .badge {
        position: absolute;
        top: 0;
        right: 90px;
        width: 56px;
        height: 95px;
        background-color: #d1ab10;
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        padding-top: 15px;
        box-sizing: border-box;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
        line-height: 1.3;
        z-index: 10;
    }
    .watermark {
        position: absolute;
        font-size: 16px;
        color: rgba(0, 0, 0, 0.06);
        transform: rotate(-30deg);
        pointer-events: none;
        z-index: 10;
        white-space: nowrap;
    }
    .wm1 { top: 290px; left: 240px; }
    .wm2 { top: 660px; left: 150px; }
    .wm3 { top: 800px; left: 340px; }
    
    .header-section {
        position: relative;
        text-align: center;
        margin-top: 130px;
        margin-bottom: 55px;
    }
    .rainbow-placeholder {
        position: absolute;
        top: -90px;
        left: 5%;
        width: 90%;
        height: 160px;
        border: 1px dashed #bbb;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 25px;
        color: #999;
        font-size: 14px;
        z-index: 1;
        box-sizing: border-box;
    }
    .main-title {
        position: relative;
        z-index: 2;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }
    .content-list {
        font-size: 17.5px;
        line-height: 1.6;
        position: relative;
        z-index: 5;
    }
    .list-item {
        margin-bottom: 25px;
        text-align: justify;
    }
    .highlight {
        color: #d1ab10;
    }
</style>
</head>
<body>

<div class="container">
    <div class="badge">心<br>理</div>

    <div class="watermark wm1">@小颖</div>
    
    <div class="header-section">
        <div class="rainbow-placeholder placeholder">
            [Graphic: Rainbow Arch]
        </div>
        <div class="main-title">如何避免/减少巴纳姆效应？</div>
    </div>

    <div class="content-list">
        <div class="list-item">
            1、要学会用<span class="highlight">理性的思维</span>去分析和判断，不要轻易相信一些模糊的描述。
        </div>
        
        <div class="list-item">
            2、我们的自我认知往往是主观的，我们需要保持<span class="highlight">谦虚和开放的心态</span>，不要<span class="highlight">过分自信或者自卑</span>。我们需要认识到自己的优点和缺点，不断学习和成长，才能更好地适应社会的变化。
        </div>
        
        <div class="watermark wm2">@小颖</div>

        <div class="list-item">
            3、<span class="highlight">听取他人的评价。</span>全面而完整地听取他人的评价，对正确认识自我十分重要，同时，也能很好地反映自我认识的能力。
        </div>
        
        <div class="list-item">
            4、我们需要保持警惕，不要被一些虚假的信息所迷惑。我们需要<span class="highlight">学会辨别真假信息</span>，不要轻易相信一些没有依据的描述，避免被骗或者误导。
        </div>
    </div>
    
    <div class="watermark wm3">PPT by @小颖</div>
</div>

</body>
</html>
