<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫砂都有哪些款</title>
<style>
  body {
    background-color: #f4e8e6;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .container {
    background-color: #ffffff;
    border: 6px solid #d4e9e5;
    border-radius: 20px;
    padding: 30px 20px;
    width: 100%;
    max-width: 600px;
    box-sizing: border-box;
  }
  .title-container {
    text-align: center;
    margin-bottom: 30px;
  }
  .title {
    font-size: 32px;
    font-weight: 900;
    color: #333;
    text-shadow: 
      -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
      -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .title-icon {
    display: inline-block;
    width: 32px;
    height: 32px;
    background-color: #f4d03f;
    border: 3px solid #333;
    border-radius: 4px;
    font-size: 24px;
    font-weight: bold;
    line-height: 26px;
    text-align: center;
    margin-left: 10px;
    box-shadow: 2px 2px 0 #333;
    color: #333;
    text-shadow: none;
  }
  .section {
    margin-bottom: 30px;
  }
  .subtitle-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 20px;
    font-weight: 900;
    color: #333;
    text-shadow: 
      -1.5px -1.5px 0 #f4d03f, 1.5px -1.5px 0 #f4d03f, -1.5px 1.5px 0 #f4d03f, 1.5px 1.5px 0 #f4d03f;
    display: flex;
    align-items: center;
  }
  .subtitle-icon {
    color: #d9534f;
    margin-right: 5px;
    text-shadow: none;
    font-size: 22px;
  }
  .summary-box {
    background-color: #9b3a26;
    color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid #7a2d1d;
    margin-bottom: 2px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 14px;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #e0e0e0;
    padding: 12px 4px;
    vertical-align: middle;
  }
  .table1 th {
    background-color: #7a828e;
    color: #fff;
    font-weight: normal;
  }
  .table2 th {
    background-color: #3b7a7a;
    color: #fff;
    font-weight: normal;
  }
  .circle-highlight {
    border: 2px solid #d9534f;
    border-radius: 50% 40% 60% 50% / 50% 50% 40% 60%;
    padding: 4px 10px;
    display: inline-block;
    position: relative;
    color: #333;
  }
  .annotation-text {
    position: absolute;
    white-space: nowrap;
    font-weight: bold;
    color: #333;
    text-shadow: 
      -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff,
      -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
    z-index: 10;
  }
  .anno-1 {
    top: 75%;
    left: 50%;
    transform: translateX(-30%) rotate(-5deg);
    font-style: italic;
    font-size: 14px;
  }
  .anno-2 {
    top: 75%;
    left: 50%;
    transform: translateX(-15%);
    font-size: 13px;
    display: flex;
    align-items: center;
  }
  .icon-up {
    background-color: #7a828e;
    color: white;
    font-size: 10px;
    padding: 1px 3px;
    border-radius: 2px;
    margin-right: 2px;
    text-shadow: none;
  }
  .icon-check {
    color: #5cb85c;
    font-size: 14px;
    margin-left: 2px;
    text-shadow: none;
  }
  .text-red {
    color: #d9534f;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title-container">
    <div class="title">猫砂都有哪些款<div class="title-icon">?</div></div>
  </div>

  <div class="section">
    <div class="subtitle-row">
      <div class="subtitle"><span class="subtitle-icon">📍</span>三种猫砂尺寸哪个是你最爱</div>
    </div>
    <table class="table1">
      <thead>
        <tr>
          <th style="width: 20%;">尺寸</th>
          <th style="width: 20%;">重量</th>
          <th style="width: 20%;">结团效果</th>
          <th style="width: 40%;">其他</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1.5mm</td>
          <td>轻</td>
          <td>上</td>
          <td>易带出，价格<br>略高</td>
        </tr>
        <tr>
          <td style="position: relative;">
            <span class="circle-highlight">2mm</span>
            <div class="annotation-text anno-1">综合性价比推荐</div>
          </td>
          <td>中</td>
          <td>中</td>
          <td>综合性价比高</td>
        </tr>
        <tr>
          <td>3mm</td>
          <td>重</td>
          <td>差</td>
          <td>推荐度低，但<br>价格也低</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <div class="subtitle-row">
      <div class="subtitle"><span class="subtitle-icon">📍</span>猫砂都有哪些种类</div>
      <div class="summary-box">总结：2mm混合砂yyds</div>
    </div>
    <table class="table2">
      <thead>
        <tr>
          <th style="width: 22%;">种类</th>
          <th style="width: 38%;">优点</th>
          <th style="width: 40%;">其他</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>膨润土</td>
          <td>价格低廉</td>
          <td>粉尘大</td>
        </tr>
        <tr>
          <td>豆腐猫砂</td>
          <td>原料更安全，闻起来<br>也比较好</td>
          <td>价格偏高，纯豆腐结团略差</td>
        </tr>
        <tr>
          <td style="position: relative;">
            <span class="circle-highlight">混合猫砂</span>
            <div class="annotation-text anno-2">
              <span class="icon-up">⬆</span>普通养宠家庭足以满足需求<span class="icon-check">✅</span>
            </div>
          </td>
          <td>结合上述优点，价格<br>适中</td>
          <td>比例推荐<span class="text-red">7:3或6:4</span>，结团<br>快且用量省</td>
        </tr>
        <tr>
          <td>沸石</td>
          <td>可循环利用</td>
          <td>需要自己洗</td>
        </tr>
        <tr>
          <td>其他新型原料</td>
          <td>价格高，新颖</td>
          <td>效果待考核，贵</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
