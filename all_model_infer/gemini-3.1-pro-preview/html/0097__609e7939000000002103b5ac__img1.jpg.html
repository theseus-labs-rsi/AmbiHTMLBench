<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Layout Reconstruction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c; /* Dark background to frame the slide */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .slide-container {
            position: relative;
            width: 1024px;
            height: 768px;
            background-color: #e5e5e5; /* Light grey background of the slide */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Top-left status text */
        .status-text {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 14px;
            color: #555;
            letter-spacing: 1px;
        }

        /* Top-center Assistive Touch Icon Placeholder */
        .icon-placeholder {
            position: absolute;
            top: 25px;
            left: 310px;
            width: 70px;
            height: 70px;
            background-color: rgba(120, 120, 120, 0.4);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 12px;
            text-align: center;
        }

        /* Top-right Video Placeholder */
        .video-placeholder {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 180px;
            height: 100px;
            background-color: #999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            border: 2px solid #555;
        }

        /* Main Content Area */
        .content-area {
            position: absolute;
            top: 170px;
            left: 175px;
            width: 800px;
        }

        .red-text {
            color: #d32f2f;
            font-size: 26px;
            line-height: 1.5;
        }

        .heading {
            margin-bottom: 25px;
        }

        .list-item {
            margin-bottom: 25px;
        }

        /* The large central black text */
        .large-title {
            color: #111;
            font-size: 38px;
            font-weight: 500;
            margin-left: 155px;
            margin-top: 40px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Flex rows for side-by-side content */
        .flex-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 25px;
        }

        .flex-row-indented {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .col-left {
            width: 360px;
        }

        .col-right {
            margin-left: 0px;
        }

        .small-red-text {
            font-size: 18px;
            color: #d32f2f;
            margin-left: 10px;
        }

        .col-right-item {
            font-size: 26px;
            color: #d32f2f;
            margin-left: 20px;
        }
        
        .col-right-subitem {
            font-size: 24px;
            color: #d32f2f;
            margin-left: 60px;
            margin-top: 5px;
        }

        /* Specific underline style */
        .custom-underline {
            text-decoration: underline;
            text-decoration-color: #d32f2f;
            text-decoration-thickness: 3px;
            text-underline-offset: 6px;
        }

    </style>
</head>
<body>

    <div class="slide-container">
        <!-- Top UI Elements -->
        <div class="status-text">19:29 5月14日周五</div>
        
        <div class="icon-placeholder placeholder">
            [Icon: Assistive Touch]
        </div>

        <div class="video-placeholder placeholder">
            [Video: Presenter]
        </div>

        <!-- Main Slide Content -->
        <div class="content-area">
            
            <div class="red-text heading">
                固化的做题思维：
            </div>
            
            <div class="red-text list-item">
                1. 喜欢忠于自己的内心和感觉。
            </div>

            <div class="large-title">
                2017年 12月第一套 Text 1
            </div>

            <!-- Row for item 2 and side text -->
            <div class="flex-row">
                <div class="red-text">
                    2. 喜欢选符合<span class="custom-underline">常识的选项。</span>
                </div>
                <div class="small-red-text">
                    20年左右的常识和经验的累积
                </div>
            </div>

            <!-- Row for item 3 and item 6 -->
            <div class="flex-row">
                <div class="red-text col-left">
                    3. 喜欢选自己认识的选项。
                </div>
                <div class="col-right-item">
                    6. 囫囵吞枣选择法
                </div>
            </div>

            <!-- Row for item 4 and note under item 6 -->
            <div class="flex-row-indented">
                <div class="red-text col-left">
                    4. 喜欢选自己不认识的选项。
                </div>
                <div class="col-right-subitem">
                    (有逃避，有厌烦)
                </div>
            </div>

            <!-- Row for item 5 -->
            <div class="red-text list-item">
                5. 火急火燎一把火
            </div>

        </div>
    </div>

</body>
</html>
