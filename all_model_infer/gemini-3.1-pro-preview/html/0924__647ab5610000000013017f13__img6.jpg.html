<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 做好竞品分析 - 新媒体账号运营</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #dfc7b4;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background-color: #fbf8f5;
            border-radius: 16px 16px 12px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-body {
            padding: 28px 28px 24px 28px;
            flex: 1;
        }

        /* Ribbon / Tag */
        .ribbon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }

        .ribbon-underlay {
            position: absolute;
            top: 2px;
            left: -6px;
            height: 100%;
            width: calc(100% + 14px);
            background-color: #be9779;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
            z-index: 1;
        }

        .ribbon {
            position: relative;
            background-color: #935d39;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 5px 22px 5px 12px;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* Main Title */
        .main-title {
            font-size: 34px;
            font-weight: 900;
            color: #222222;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .main-title .num {
            font-family: "Impact", "Arial Black", sans-serif;
            font-weight: 900;
            font-size: 36px;
        }

        /* Content Paragraphs */
        .section-text {
            font-size: 15px;
            line-height: 1.7;
            color: #222222;
            margin-bottom: 22px;
        }

        .section-text p {
            margin: 0;
        }

        /* Key Points List */
        .list-container {
            font-size: 15px;
            line-height: 1.6;
            color: #222222;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .list-item-title {
            font-weight: bold;
            color: #1a1a1a;
        }

        .list-item-desc {
            padding-left: 24px;
            color: #333333;
            margin-bottom: 4px;
        }

        /* Tear line effect */
        .tear-divider {
            position: relative;
            height: 16px;
            background-color: #fbf8f5;
            display: flex;
            align-items: center;
        }

        .tear-divider::before,
        .tear-divider::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #dfc7b4;
            border-radius: 50%;
            top: 1px;
            z-index: 3;
        }

        .tear-divider::before {
            left: -7px;
        }

        .tear-divider::after {
            right: -7px;
        }

        .perforation {
            width: 100%;
            height: 6px;
            background-image: radial-gradient(#eadacf 40%, transparent 45%);
            background-size: 8px 8px;
            background-repeat: repeat-x;
            background-position: center;
        }

        /* Footer */
        .card-footer {
            background-color: #ebdcd2;
            padding: 16px 20px 20px;
            text-align: center;
        }

        .footer-text {
            font-size: 15px;
            font-weight: 600;
            color: #242424;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-body">
            <!-- Ribbon Badge -->
            <div class="ribbon-wrapper">
                <div class="ribbon-underlay"></div>
                <div class="ribbon">新媒体账号运营6种方法</div>
            </div>

            <!-- Title -->
            <h1 class="main-title">
                <span class="num">03</span>
                <span>做好竞品分析</span>
            </h1>

            <!-- Intro Paragraph 1 -->
            <div class="section-text">
                <p>前期的竞品分析</p>
                <p>一定要花大量的时间和精力去收集信息</p>
            </div>

            <!-- Intro Paragraph 2 -->
            <div class="section-text">
                <p>仔细分析</p>
                <p>可以从以下几个方面来看</p>
            </div>

            <!-- Analysis Points List -->
            <div class="list-container">
                <div class="list-item-title">1、账号人设标签</div>
                
                <div class="list-item-title">2、账号选题规划</div>
                
                <div class="list-item-title">3、内容脚本拆解：</div>
                <div class="list-item-desc">结构、矛盾点、金句、痒点</div>
                
                <div class="list-item-title">4、内容形式：</div>
                <div class="list-item-desc">场景道具服装，拍摄剪辑节奏</div>
                
                <div class="list-item-title">5、运营策略：</div>
                <div class="list-item-desc">发布时间和频率，封面，文案，线上互动</div>
                <div class="list-item-desc">用户运营，引流途径</div>
            </div>
        </div>

        <!-- Perforated Ticket Edge -->
        <div class="tear-divider">
            <div class="perforation"></div>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <div class="footer-text">@新媒体运营的十万个为什么</div>
        </div>
    </div>

</body>
</html>
