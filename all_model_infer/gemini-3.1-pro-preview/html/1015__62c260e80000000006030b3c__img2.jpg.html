<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建议、提案格式</title>
    <style>
        body {
            font-family: 'Kaiti', 'STKaiti', 'KaiTi_GB2312', serif;
            background-color: #F4F1E9; /* Light beige background */
            color: #000;
            line-height: 1.8;
            padding: 40px 60px 40px 40px;
            max-width: 700px;
            margin: 0 auto;
            font-size: 19px;
            letter-spacing: 1px;
        }
        
        .main-title {
            color: #D31D24;
            text-align: center;
            font-weight: bold;
            font-size: 1.25em;
            margin-bottom: 25px;
        }
        
        .intro-text {
            text-indent: 2em;
            margin-bottom: 40px;
            text-align: justify;
        }
        
        .format-label {
            color: #CF4E27;
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        .template-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .template-note {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .greeting {
            margin-bottom: 15px;
        }
        
        .opening-para {
            text-indent: 2em;
            margin-bottom: 15px;
            line-height: 2;
        }
        
        .list-item {
            padding-left: 2em;
            margin-bottom: 12px;
            line-height: 2;
        }
        
        .blue-note {
            color: #4075AE;
        }
        
        u {
            text-underline-offset: 4px;
            text-decoration-thickness: 1px;
        }
        
        .closing-section {
            display: flex;
            justify-content: flex-end;
            margin-top: 40px;
            padding-right: 10px;
        }
        
        .closing-box {
            text-align: center;
        }
        
        .closing-box div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="main-title">二、建议、提案</div>
    
    <div class="intro-text">
        建议是指下级部门因为某个重要事项的解决，需要向上级提出解决问题想法的文体。具体写作技巧包括以下几个方面。提案一般为政协提案，具体格式见示例。
    </div>
    
    <div class="format-label">格式：</div>
    
    <div class="template-title">关于 xxxxx 的建议</div>
    
    <div class="template-note">（“发文机关+关于+内容+文种”）</div>
    
    <div class="greeting">
        <u>各级领导(称谓要根据具体题目要求分析得出)：</u>
    </div>
    
    <div class="opening-para">
        <u>当前，...等问题比较突出(或做了什么工作)，为了做好......工作，提出以下建议：</u><u class="blue-note">(开头为背景分析，指出存在的主要问题和目的意义)</u>
    </div>
    
    <div class="list-item">
        <u>一、......</u>
    </div>
    
    <div class="list-item">
        <u>二、......</u>
    </div>
    
    <div class="list-item">
        <u>三、......</u><u class="blue-note">(主体内容还原为对策题,提出解决问题的措施)</u>
    </div>
    
    <div class="closing-section">
        <div class="closing-box">
            <div><u>发文机关</u></div>
            <div><u>xx 年 xx 月 xx 日</u></div>
        </div>
    </div>

</body>
</html>
