<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金句摘抄</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #555;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .page-container {
            width: 100%;
            max-width: 600px;
            background-color: #e5d7c3;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }
        .header {
            background-color: #fdfaf5;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-zh {
            font-family: "KaiTi", "STKaiti", serif;
            font-size: 56px;
            font-weight: 900;
            color: #d11a20;
            letter-spacing: 2px;
            line-height: 1.1;
            transform: skewX(-5deg);
        }
        .logo-en {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #d11a20;
            letter-spacing: 5px;
            margin-top: 5px;
            margin-left: 5px; 
        }
        .title-section {
            display: flex;
            flex-direction: column;
            width: 220px; 
        }
        .title-top-wrapper {
            border-bottom: 1px solid #111;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: right;
        }
        .title-top-text {
            font-family: "SimSun", "STSong", serif;
            font-size: 24px;
            font-weight: 900;
            color: #222;
        }
        .title-separator {
            font-family: sans-serif;
            font-weight: normal;
            font-size: 20px;
            margin: 0 6px;
            color: #222;
        }
        .title-bottom-wrapper {
            border-bottom: 3px solid #111;
            padding-bottom: 6px;
            text-align: right;
        }
        .title-bottom-text {
            font-family: "SimSun", "STSong", serif;
            font-size: 30px;
            font-weight: 900;
            color: #222;
        }
        .content-section {
            padding: 40px 40px 60px 40px;
            display: flex;
            flex-direction: column;
            gap: 50px;
        }
        .quote-block {
            display: flex;
            flex-direction: column;
        }
        .main-quote {
            font-family: "SimSun", "STSong", serif;
            font-size: 38px;
            text-align: center;
            color: #222;
            line-height: 1.4;
            margin-bottom: 35px;
        }
        .example-title {
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
        }
        .example-paragraph {
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            text-align: justify;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <div class="logo-section">
                <div class="logo-zh">人民日報</div>
                <div class="logo-en">RENMIN RIBAO</div>
            </div>
            <div class="title-section">
                <div class="title-top-wrapper">
                    <span class="title-top-text">金句</span>
                    <span class="title-separator">|</span>
                    <span class="title-top-text">摘抄</span>
                </div>
                <div class="title-bottom-wrapper">
                    <span class="title-bottom-text">坚持奋斗主题</span>
                </div>
            </div>
        </div>
        
        <div class="content-section">
            <div class="quote-block">
                <div class="main-quote">
                    夜色难免黑凉<br>
                    前行必有曙光
                </div>
                <div class="example-title">举例：</div>
                <div class="example-paragraph">
                    夜色难免黑凉，前行必有曙光。无论遇到什么艰难困苦，只要勇敢向前必定成功！
                </div>
            </div>
            
            <div class="quote-block">
                <div class="main-quote">
                    道固远，&nbsp;&nbsp;笃行可至<br>
                    事虽巨，&nbsp;&nbsp;坚为必成
                </div>
                <div class="example-title">举例：</div>
                <div class="example-paragraph">
                    道固远，笃行可至；事虽巨，坚为必成。一个人也好，一个国家也好，最可贵的就是心中有梦想，并且为实现梦想不惧风雨、实干笃行、砥砺奋斗。
                </div>
            </div>
        </div>
    </div>
</body>
</html>
