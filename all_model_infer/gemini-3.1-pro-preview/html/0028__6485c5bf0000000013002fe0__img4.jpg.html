<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成都自由行美食推荐</title>
<style>
    body {
        background-color: #fdf8e5;
        font-family: "Kaiti", "STKaiti", "Comic Sans MS", sans-serif;
        color: #111;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 500px;
        width: 100%;
    }
    .title {
        text-align: center;
        font-size: 36px;
        font-weight: 900;
        font-family: "Heiti SC", "Microsoft YaHei", sans-serif;
        margin-bottom: 5px;
        letter-spacing: 1px;
    }
    .subtitle {
        text-align: center;
        font-size: 22px;
        margin-bottom: 35px;
        font-weight: bold;
    }
    .section {
        margin-bottom: 25px;
    }
    .section-heading {
        display: inline-block;
        background-color: #fce883;
        padding: 4px 12px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    .item {
        font-size: 18px;
        margin-bottom: 16px;
        font-weight: bold;
        line-height: 1.3;
    }
    .restaurant-name {
        color: #a31d1d;
    }
</style>
</head>
<body>
<div class="container">
    <div class="title">成都自由行美食推荐</div>
    <div class="subtitle">第一次来成都旅游必备手册！</div>

    <div class="section">
        <div class="section-heading">来成都必吃火锅：</div>
        <div class="item"><span class="restaurant-name">【楠火锅】</span>下东大街166号</div>
        <div class="item"><span class="restaurant-name">【天星正源火锅】</span>成华区地勘路1号附48</div>
        <div class="item"><span class="restaurant-name">【蜀二火锅】</span>蓥华寺街34号</div>
        <div class="item"><span class="restaurant-name">【青年火锅】</span>白云街2号附6</div>
        <div class="item"><span class="restaurant-name">【五里关老火锅】</span>小关庙街45号附12号</div>
        <div class="item"><span class="restaurant-name">【巷巷火锅】</span>北书院街72号</div>
    </div>

    <div class="section">
        <div class="section-heading">来成都必吃川菜：</div>
        <div class="item"><span class="restaurant-name">【明婷饭店】</span>外曹家巷26号附15号</div>
        <div class="item"><span class="restaurant-name">【回水镇】</span>建设路53号附13</div>
        <div class="item"><span class="restaurant-name">【陶德砂锅】</span>二环路东二段7号附24号</div>
        <div class="item"><span class="restaurant-name">【鸡毛店】</span>华油路6号</div>
    </div>

    <div class="section">
        <div class="section-heading">来成都必吃小吃：</div>
        <div class="item"><span class="restaurant-name">【龙抄手】</span>春熙路中山广场东侧城守街63号</div>
        <div class="item"><span class="restaurant-name">【钟水饺】</span>建设路53号胡同文化音体商场</div>
        <div class="item"><span class="restaurant-name">【洞子口陈氏凉粉】</span>福德路42号</div>
    </div>
</div>
</body>
</html>
