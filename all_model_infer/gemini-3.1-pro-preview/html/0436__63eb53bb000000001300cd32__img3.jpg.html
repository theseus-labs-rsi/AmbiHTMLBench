    body {
        font-family: "Microsoft YaHei", Arial, sans-serif;

        margin-bottom: 30px;
    }
    p {
        font-size: 18px;

        margin-bottom: 30px;

    }
    .placeholder {
        border: 1px dashed #999;
        background-color: #f9f9f9;

    .diagram-1 {
        width: 100%;
        max-width: 700px;

        max-width: 700px;

<body>
<div class="container">
    <h1>NF-kB信号通路</h1>
    <p>相对于RTK相关信号通路，NF-kB信号通路的功能也更加特化一些，与TGF-β和Wnt信号相比高度集中于炎症反应。</p>
    
    <div class="placeholder diagram-1">
        [Diagram: 经典NF-kB信号的功能 flowchart centered]
    </div>

    <h1>Notch信号通路</h1>
    <p>通过膜蛋白作为配体和受体，介导两个细胞相互靠近接触之后的活化效应。Notch 与配体结合，经过 ADAM 剪切释放胞外段与配体一同降解，经 y-secretase 剪切释放胞内段传导信号 Notch 胞内段进入细胞质传导信号。</p>

    <div class="placeholder diagram-2">
        [Diagram: Notch信号通路的调控 centered]
    </div>
</div>
