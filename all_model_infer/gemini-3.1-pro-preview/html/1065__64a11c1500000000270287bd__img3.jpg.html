<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你能接受孩子的平庸吗？</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 500;
            color: #121212;
        }
        .back-btn {
            font-size: 22px;
            color: #333;
            margin-right: 8px;
            font-weight: 300;
        }
        .header-right {
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #06f;
        }
        .edit-icon {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            fill: currentColor;
        }
        .more-btn {
            color: #121212;
            font-size: 20px;
            margin-left: 16px;
            letter-spacing: 1px;
            font-weight: bold;
            line-height: 1;
            margin-top: -8px;
        }

        /* Content Styles */
        .content {
            padding: 20px 16px;
            flex-grow: 1;
            font-size: 17px;
            line-height: 1.7;
            color: #333333;
        }
        .content p {
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .author-link {
            color: #06f;
            text-decoration: none;
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .search-icon {
            width: 12px;
            height: 12px;
            margin-left: 2px;
            stroke: #06f;
            stroke-width: 2;
            fill: none;
        }
        .highlight {
            background-color: #fce4e4;
            padding: 2px 0;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        .meta-info {
            font-size: 13px;
            color: #999999;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        /* Footer Styles */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-top: 1px solid #f0f0f0;
            background-color: #ffffff;
        }
        .share-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #666666;
        }
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: transparent; /* Hide text, use background color to simulate icon */
            margin-right: 6px;
        }
        .icon-wechat {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #07c160;
        }
        .icon-moments {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: conic-gradient(#ff4b4b, #fadb14, #52c41a, #1890ff, #ff4b4b);
        }
        .icon-qq {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #12b7f5;
        }
        .icon-image {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background-color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="back-btn">〈</span>
                <span>你能接受孩子的平庸吗？</span>
            </div>
            <div class="header-right">
                <svg class="edit-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span>写回答</span>
                <span class="more-btn">...</span>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <p>以上是我最近在读的一本书，作家<span class="author-link">刘继荣<svg class="search-icon" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"></circle><line x1="15" y1="15" x2="20" y2="20"></line></svg></span><br>《坐在路边鼓掌的人》里面讲的小故事。</p>
            
            <p><span class="highlight">天下有多少雄心勃勃的父母，奢望自己的孩<br>子既能做顶天立地的栋梁，又能开繁花结硕<br>果。我们的欲望有多深，孩子就有多累。</span></p>
            
            <p>如果孩子能自己找到出路，快乐与成就兼<br>得，如果能平庸而幸福地过一生，父母又何<br>必强求。</p>
            
            <p>如果他们健康、快乐，如果那是他们想要的<br>生活，我们的孩子，又何妨做一个普通人。</p>
            
            <div class="meta-info">编辑于 2023-03-03 10:44 · IP 属地江苏</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="share-item">
                <div class="placeholder icon-wechat" title="[WeChat Icon]">[W]</div>
                <span>微信</span>
            </div>
            <div class="share-item">
                <div class="placeholder icon-moments" title="[Moments Icon]">[M]</div>
                <span>朋友圈</span>
            </div>
            <div class="share-item">
                <div class="placeholder icon-qq" title="[QQ Icon]">[Q]</div>
                <span>QQ</span>
            </div>
            <div class="share-item">
                <div class="placeholder icon-image" title="[Image Share Icon]">[I]</div>
                <span>图片分享</span>
            </div>
        </div>
    </div>

</html>
