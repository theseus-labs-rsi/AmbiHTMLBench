<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题、主题意义、主题的联系与区别</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', SimHei, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #f4f5f7;
        }
        .title-box {
            background-color: white;
            border: 2px solid #333;
            padding: 15px 20px;
            text-align: center;
            width: 80%;
            margin: 0 auto 30px auto;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
            text-align: left;
        }
        th, td {
            border: 1px solid white;
            padding: 15px;
            font-size: 16px;
        }
        th {
            background-color: #aeb135;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        td:first-child {
            background-color: #aeb135;
            color: white;
            font-weight: bold;
            text-align: center;
            width: 120px;
        }
        td {
            background-color: #f5f7e6;
            color: #333;
        }
        .diag-cell {
            background: linear-gradient(to top right, transparent 49%, white 49%, white 51%, transparent 51%), #aeb135;
            position: relative;
            height: 60px;
            padding: 0 !important;
        }
        .diag-concept {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-weight: bold;
        }
        .diag-dimension {
            position: absolute;
            bottom: 10px;
            left: 15px;
            color: white;
            font-weight: bold;
        }
        .middle-text {
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            font-style: italic;
            color: #ffffe0;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 3px  3px 5px rgba(0,0,0,0.5);
            margin: 40px 0;
            line-height: 1.3;
            letter-spacing: 2px;
        }
        .diagram-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin: 30px auto;
        }
        .diag-block {
            position: absolute;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-sizing: border-box;
        }
        .diag-block span {
            font-size: 14px;
            font-weight: normal;
            margin-top: 5px;
        }
        .block-blue {
            background-color: #2b7eb3;
            left: 5%;
            bottom: 10%;
            width: 45%;
            z-index: 1;
        }
        .block-yellow {
            background-color: #ffb612;
            left: 32%;
            bottom: 35%;
            width: 45%;
            z-index: 2;
        }
        .block-green {
            background-color: #aeb135;
            left: 59%;
            bottom: 60%;
            width: 35%;
            z-index: 3;
        }
        .block-green::after {
            content: '';
            position: absolute;
            right: -35px;
            top: 0;
            border-top: 35px solid transparent;
            border-bottom: 35px solid transparent;
            border-left: 35px solid #aeb135;
        }
        .white-box {
            position: absolute;
            background-color: white;
            padding: 12px 15px;
            font-size: 16px;
            color: #333;
            z-index: 4;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.1);
            line-height: 1.4;
        }
        .wb-1 {
            left: 5%;
            bottom: calc(10% + 70px);
            width: 22%;
        }
        .wb-2 {
            left: 32%;
            bottom: calc(35% + 70px);
            width: 22%;
        }
        .wb-3 {
            left: 59%;
            bottom: calc(60% + 70px);
            width: 22%;
        }
        .footer {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            padding-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">
            话题、主题意义、主题的联系与区别<br>
            （读者视角）
        </div>

        <table>
            <tr>
                <th class="diag-cell">
                    <div class="diag-concept">概念</div>
                    <div class="diag-dimension">维度</div>
                </th>
                <th>话题</th>
                <th>主题意义</th>
                <th>主题</th>
            </tr>
            <tr>
                <td>意义特征</td>
                <td>具体</td>
                <td>介于二者之间</td>
                <td>抽象</td>
            </tr>
            <tr>
                <td>表达方式</td>
                <td>直接</td>
                <td>蕴含</td>
                <td>拓展</td>
            </tr>
            <tr>
                <td>核心意义</td>
                <td>语篇讨论的中心</td>
                <td>语篇的寓意</td>
                <td>语篇寓意所属的范畴</td>
            </tr>
            <tr>
                <td>本质特征</td>
                <td>特定性</td>
                <td>由语篇内容延伸的普适性（去细节的）</td>
                <td>普遍性</td>
            </tr>
        </table>

        <div class="middle-text">
            话题，主题意义，主题<br>
            与学习活动的层次息息相关
        </div>

        <div class="title-box">
            话题、主题意义、主题的联系与区别<br>
            （学习视角）
        </div>

        <div class="diagram-container">
            <!-- White Boxes -->
            <div class="white-box wb-1">基于语篇的学习<br>为主</div>
            <div class="white-box wb-2">深入语篇的学习<br>为主</div>
            <div class="white-box wb-3">超越语篇的学习<br>为主</div>

            <!-- Colored Blocks -->
            <div class="diag-block block-blue">
                话题<br>
                <span>What+How</span>
            </div>
            <div class="diag-block block-yellow">
                主题意义<br>
                <span>Why+How</span>
            </div>
            <div class="diag-block block-green">
                主题<br>
                <span>What+Why+How+So what (else)</span>
            </div>
        </div>

        <div class="footer">
            (葛炳芳，2022：出版中)
        </div>
    </div>
</body>
</html>
