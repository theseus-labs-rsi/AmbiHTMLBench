<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten Document</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    }

    .document-wrapper {
        position: relative;
        width: 900px;
        height: 650px;
        background-color: #f8f9fa;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        overflow: hidden;
    }

    /* Grid background simulating the paper */
    .grid-bg {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
            linear-gradient(to right, #a0c8e0 1px, transparent 1px),
            linear-gradient(to bottom, #a0c8e0 1px, transparent 1px);
        background-size: 45px 45px;
        background-position: 0 0;
        z-index: 1;
    }

    /* Top left title styling */
    .page-number {
        position: absolute;
        top: 20px;
        left: 30px;
        font-family: "Heiti SC", "SimHei", sans-serif;
        font-size: 38px;
        font-weight: 900;
        color: #ffe600;
        -webkit-text-stroke: 1.5px #000;
        text-shadow: 2px 2px 0px #000;
        z-index: 10;
        transform: skewX(-10deg);
        letter-spacing: 2px;
    }

    /* Main content area for vertical text */
    .content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* Padding to align text perfectly within the grid cells */
        padding-top: 9px; 
        padding-right: 9px; 
        writing-mode: vertical-rl;
    }

    /* Individual columns of text */
    .column {
        margin: 0;
        width: 45px; /* Matches grid width */
        font-size: 26px;
        line-height: 45px; /* Centers text horizontally in grid */
        letter-spacing: 19px; /* (45px grid height - 26px font size) to align vertically */
        color: #1a1a1a;
    }

    /* Spacer for empty columns */
    .empty-col {
        margin: 0;
        width: 45px;
    }

    /* Specific vertical indentations for the signature area */
    .indent-1 { padding-top: 270px; } /* 此致 */
    .indent-2 { padding-top: 360px; } /* 莫言 */
    .indent-3 { padding-top: 450px; } /* 日期 */

    /* Seal placeholder styling */
    .placeholder {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 35px;
        height: 35px;
        border: 2px solid #d32f2f;
        color: #d32f2f;
        font-size: 10px;
        font-family: sans-serif;
        writing-mode: horizontal-tb; /* Forces text inside to be horizontal */
        letter-spacing: normal;
        margin-top: 15px;
        background-color: rgba(255, 255, 255, 0.8);
        line-height: 1.2;
        text-align: center;
        border-radius: 2px;
    }
</style>
</head>
<body>

<div class="document-wrapper">
    <div class="grid-bg"></div>
    <div class="page-number">第三页</div>
    
    <div class="content">
        <p class="column">因为牛的构造是这样，就比较</p>
        <p class="column">清楚了。一般情况下，牛羊是不会</p>
        <p class="column">用舌头卷水的（用舌头卷水的是</p>
        <p class="column">狗与猫），它们会把嘴贴到水面</p>
        <p class="column">上往里吸水。</p>
        
        <p class="empty-col"></p>
        
        <p class="column">总之，必须注意观察细</p>
        <p class="column">节，也要注意训练思考线的</p>
        <p class="column">基础，极度细致的观察。</p>
        
        <p class="empty-col"></p>
        
        <p class="column">拉杂写来，都是老生常谈，</p>
        <p class="column">请谅吧。</p>
        
        <p class="empty-col"></p>
        
        <p class="column indent-1">此致　　笔健！</p>
        
        <p class="empty-col"></p>
        
        <p class="column indent-2">莫言<span class="placeholder">[Seal:<br>red]</span></p>
        
        <p class="empty-col"></p>
        
        <p class="column indent-3">癸卯五月七日晚</p>
    </div>
</div>

</body>
</html>
