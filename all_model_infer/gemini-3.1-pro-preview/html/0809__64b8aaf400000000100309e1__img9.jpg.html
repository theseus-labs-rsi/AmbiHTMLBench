<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calligraphy Transcription</title>
<style>
    body {
        background-color: #f0eadd;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .document {
        background-color: #e8dcc7;
        padding: 40px 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-family: "Kaiti SC", "Kaiti TC", KaiTi, serif;
        font-size: 28px;
        line-height: 1.8;
        color: #1a1a1a;
        height: 850px;
    }
    .col {
        display: inline-block;
        vertical-align: top;
        margin: 0 10px;
        letter-spacing: 0.15em;
    }
    .title {
        font-size: 18px;
        padding-top: 100px;
        margin-right: 20px;
        letter-spacing: 0.2em;
    }
    .title-gap {
        display: inline-block;
        height: 2em;
    }
    .text-gap {
        display: inline-block;
        height: 1.5em;
    }
    .signature {
        padding-top: 300px;
        margin-left: 20px;
    }
    .seals {
        writing-mode: horizontal-tb;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
        gap: 8px;
    }
    .seal {
        width: 22px;
        height: 22px;
        border: 2px solid #b33;
        color: #b33;
        font-size: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        opacity: 0.85;
    }
    .placeholder {
        background-color: rgba(179, 51, 51, 0.1);
    }
</style>
</head>
<body>

<div class="document">
    <div class="col title">祥除帖<span class="title-gap"></span>昨表帖</div>
    <div class="col">臣廙言臣祥除以復五日窮思永遠肝心寸截甘雪應時歲嚴寒奉被</div>
    <div class="col">手詔伏承聖體御膳勝常以慰下情臣故患匈涌氣上頓乏勿勿慈</div>
    <div class="col">恩垂愍每見慰問感戴屏營不勝銜遇謹表陳聞臣廙誠惶頓首</div>
    <div class="col">頓首死罪死罪<span class="text-gap"></span>臣廙言昨表不宣奉賜手詔伏承聖體勝常以</div>
    <div class="col">慰下情不審宿昔復何如承鄭夫人乃尔委頓今復增損伏惟哀匕</div>
    <div class="col">愍存益勞聖心謹附承動靜臣廙言</div>
    <div class="col signature">
        歲在癸卯春耀陽書於未央雲舍
        <div class="seals">
            <div class="placeholder seal">[Seal]</div>
            <div class="placeholder seal">[Seal]</div>
        </div>
    </div>
</div>

</body>
</html>
