<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球自然篇（一）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #38c89c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .document-container {
            width: 620px;
            background: linear-gradient(180deg, #62a8fc 0%, #68acff 50%, #76b7ff 100%);
            border: 12px solid #55e3a5;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            padding-top: 60px;
            padding-bottom: 25px;
        }

        /* Top Right Header Banner */
        .header-badge {
            position: absolute;
            top: 20px;
            right: -10px;
            background-color: #fccc14;
            color: #2b304c;
            font-size: 26px;
            font-weight: 900;
            padding: 10px 30px 10px 25px;
            border-radius: 30px 0 0 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }

        /* Content List */
        .item-row {
            display: flex;
            align-items: stretch;
            padding: 25px 30px;
            position: relative;
        }

        .item-row:not(:last-child)::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 30px;
            right: 30px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.6);
        }

        /* Left Poster Placeholder */
        .poster-wrapper {
            flex-shrink: 0;
            width: 145px;
            height: 205px;
            margin-right: 20px;
        }

        .placeholder {
            width: 100%;
            height: 100%;
            background-color: #173860;
            border: 3px solid #ffffff;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 13px;
            text-align: center;
            padding: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        /* Right Details Section */
        .details-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 5px;
        }

        .title-block {
            margin-bottom: 8px;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .title-divider {
            height: 2px;
            background-color: rgba(255, 255, 255, 0.85);
            width: 100%;
        }

        .info-block {
            color: rgba(255, 255, 255, 0.95);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .rating-num {
            color: #ffca00;
            font-size: 20px;
            font-weight: bold;
            margin-left: 4px;
        }

        /* Speech Bubble Description */
        .desc-bubble {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: flex-start;
            position: relative;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            border-top: 3px solid #ffeba0;
            border-left: 3px solid #ffeba0;
        }

        .desc-label {
            font-weight: bold;
            color: #555555;
            font-size: 15px;
            margin-right: 12px;
            white-space: nowrap;
            line-height: 1.4;
        }

        .desc-text {
            font-size: 14px;
            color: #444444;
            line-height: 1.5;
        }

        .highlight-orange {
            color: #f15a38;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="document-container">
    <!-- Header Badge -->
    <div class="header-badge">
        地球自然篇（一）
    </div>

    <!-- Item 1 -->
    <div class="item-row">
        <div class="poster-wrapper">
            <div class="placeholder">
                [Poster: BLUE PLANET II]
            </div>
        </div>
        <div class="details-wrapper">
            <div class="title-block">
                <div class="title">《蓝色星球2》</div>
                <div class="title-divider"></div>
            </div>
            <div class="info-block">
                <div>豆瓣评分：<span class="rating-num">9.9</span></div>
                <div>观看平台：腾 xun 视频</div>
            </div>
            <div class="desc-bubble">
                <div class="desc-label">简介</div>
                <div class="desc-text">
                    <span class="highlight-orange">BBC史上最美纪录片，和孩子一起<br>探索奇妙、未知的海底世界</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Item 2 -->
    <div class="item-row">
        <div class="poster-wrapper">
            <div class="placeholder">
                [Poster: PLANET EARTH II]
            </div>
        </div>
        <div class="details-wrapper">
            <div class="title-block">
                <div class="title">《地球脉动 2》</div>
                <div class="title-divider"></div>
            </div>
            <div class="info-block">
                <div>豆瓣评分：<span class="rating-num">9.9</span></div>
                <div>观看平台：腾 xun 视频</div>
            </div>
            <div class="desc-bubble">
                <div class="desc-label">简介</div>
                <div class="desc-text">
                    绚丽多彩，属于孩子的第一堂<span class="highlight-orange">自<br>然启蒙课</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Item 3 -->
    <div class="item-row">
        <div class="poster-wrapper">
            <div class="placeholder">
                [Poster: SEVEN WORLDS ONE PLANET]
            </div>
        </div>
        <div class="details-wrapper">
            <div class="title-block">
                <div class="title">《七个世界一个星球》</div>
                <div class="title-divider"></div>
            </div>
            <div class="info-block">
                <div>豆瓣评分：<span class="rating-num">9.7</span></div>
                <div>观看平台：腾 xun 视频</div>
            </div>
            <div class="desc-bubble">
                <div class="desc-label">简介</div>
                <div class="desc-text">
                    BBC与CCTV联合巨制，用全新的<br>自然视野，带给孩子思考与感动
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
