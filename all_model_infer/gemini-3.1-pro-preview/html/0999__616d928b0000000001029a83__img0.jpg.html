<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Notes - 列车效应</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: "Kaiti", "STKaiti", "KaiTi_GB2312", "SimSun", "Songti SC", serif;
        }
        .notebook-page {
            background-color: #fcfbf7;
            width: 100%;
            max-width: 680px;
            min-height: 900px;
            padding: 30px 40px 50px 35px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            overflow: hidden;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 31px,
                #dcdfe3 31px,
                #dcdfe3 32px
            );
            background-position: 0 48px;
        }
        /* Top header section */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            margin-bottom: 16px;
            font-family: sans-serif;
            color: #999;
            font-size: 13px;
        }
        .date-label {
            letter-spacing: 1px;
        }
        /* Watermark style top right */
        .watermark {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.15);
            padding: 2px 8px;
            border-radius: 10px;
        }
        /* Main handwritten content area */
        .content-area {
            line-height: 32px;
            font-size: 17px;
            color: #2b2b2b;
            font-weight: 500;
        }
        .content-line {
            min-height: 32px;
            position: relative;
        }
        /* Text styling */
        .blue-text {
            color: #1e62a8;
            font-weight: bold;
        }
        .blue-underline {
            text-decoration: underline;
            text-decoration-color: #1e62a8;
            text-underline-offset: 4px;
            text-decoration-thickness: 1.5px;
        }
        .blue-circle {
            border: 1.5px solid #1e62a8;
            border-radius: 12px 14px 10px 16px;
            padding: 1px 4px;
            margin: 0 1px;
            display: inline-block;
            line-height: 1.1;
        }
        .indent-1 {
            padding-left: 20px;
        }
        .indent-2 {
            padding-left: 36px;
        }
        /* Page footer */
        .page-footer {
            position: absolute;
            bottom: 25px;
            left: 35px;
            font-family: "Calibri", "Arial", sans-serif;
            font-size: 15px;
            font-weight: bold;
            color: #9da3a6;
            letter-spacing: 0.5px;
        }
        /* Binding right indicators */
        .binding-edge {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            opacity: 0.25;
            font-family: monospace;
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="notebook-page">
    <!-- Header -->
    <div class="page-header">
        <span class="date-label">Date</span>
        <span class="watermark">@田三争要争气哦 | 小红书</span>
    </div>

    <!-- Content -->
    <div class="content-area">
        <div class="content-line">了东南季风，形成强降水。</div>
        <div class="content-line">(3.) 受台风“烟花”逼近，带来了大量水汽</div>
        <div class="content-line">(4.) 这次的降水过程中，中小尺度对流反复在伏牛山前地</div>
        <div class="content-line indent-1">区发展并向郑州方向移动，也就形成了<span class="blue-circle">“列车效应”</span>，</div>
        <div class="content-line indent-1">导致降水强度大、维持时间长，引起局地极端降水。</div>
        <div class="content-line"><span class="blue-text">△列车效应：</span>指<span class="blue-underline">长时间的降水</span>并不是因为一块稳定不动的</div>
        <div class="content-line indent-2">降雨云团造成，而是对流系统反复生成发展，</div>
        <div class="content-line indent-2">使很多降水云团先后经过同一个地方，造成同</div>
        <div class="content-line indent-2">一地区出现长时间降水情况。就像列车的</div>
        <div class="content-line indent-2">不同车厢先后经过同一块铁轨一样，这种情</div>
        <div class="content-line indent-2">况叫做列车效应。</div>
    </div>

    <!-- Right Margin Simulation -->
    <div class="binding-edge">
        <span>F1</span>
        <span>F2</span>
        <span>F20</span>
        <span>21</span>
        <span>217</span>
        <span>221</span>
        <span>225</span>
        <span>228</span>
        <span>229</span>
        <span>231</span>
    </div>

    <!-- Footer -->
    <div class="page-footer">Campus</div>
</div>

</body>
</html>
