<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Photo Exhibition</title>
<style>
    body {
        background-color: #d1d1d1;
        color: #111;
        font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
        margin: 0;
        padding: 40px;
        display: flex;
        justify-content: center;
    }
    .poster {
        width: 100%;
        max-width: 720px;
        position: relative;
    }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 40px;
    }
    .header-left {
        display: flex;
        gap: 25px;
    }
    .header-zh {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 2px;
    }
    .header-en {
        font-size: 28px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 1px;
    }
    .header-right {
        writing-mode: vertical-rl;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 5px;
        margin-top: 5px;
    }
    .divider {
        border-top: 2px solid #111;
        margin: 0 0 40px 0;
    }
    .middle-row-1 {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .title-zh-1 {
        font-size: 160px;
        font-weight: 900;
        line-height: 0.8;
        letter-spacing: 5px;
        margin-left: -5px;
    }
    .title-en {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 1px;
        padding-top: 5px;
    }
    .middle-row-2 {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 20px;
    }
    .artist-info {
        display: flex;
        flex-direction: column;
    }
    .artist-label {
        font-size: 20px;
        font-weight: 900;
        margin-bottom: 5px;
    }
    .artist-name {
        font-size: 24px;
        font-weight: 900;
        margin-bottom: 10px;
    }
    .date {
        font-size: 90px;
        font-weight: 400;
        line-height: 0.8;
        letter-spacing: -2px;
    }
    .title-zh-2 {
        font-size: 180px;
        font-weight: 900;
        line-height: 0.75;
        letter-spacing: 10px;
        margin-right: -10px;
    }
    .footer {
        position: relative;
    }
    .quote {
        font-size: 12px;
        font-weight: 900;
        line-height: 1.5;
        letter-spacing: 0.5px;
        margin-bottom: 40px;
    }
    .footer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }
    .footer-text {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1px;
    }
    .footer-logo {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
    }
    .watermark-pill {
        position: absolute;
        bottom: 35px;
        right: 10px;
        width: 70px;
        height: 26px;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: #ff2442;
        z-index: 10;
    }
    .watermark-text {
        position: absolute;
        bottom: 2px;
        right: -5px;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.85);
        z-index: 10;
        pointer-events: none;
    }
</style>
</head>
<body>
    <div class="poster">
        <div class="header">
            <div class="header-left">
                <div class="header-zh">藝術<br>攝影展</div>
                <div class="header-en">ARTIST<br>PHOTO<br>EXHIBITION</div>
            </div>
            <div class="header-right">定格光影</div>
        </div>

        <div class="divider"></div>

        <div class="middle-row-1">
            <div class="title-zh-1">瞬息</div>
            <div class="title-en">IN THE<br>BLINK OF<br>AN EYE</div>
        </div>

        <div class="middle-row-2">
            <div class="artist-info">
                <div class="artist-label">藝術家</div>
                <div class="artist-name">森蘭 王沐春</div>
                <div class="date">08/14</div>
            </div>
            <div class="title-zh-2">之間</div>
        </div>

        <div class="divider" style="margin-top: 40px;"></div>

        <div class="footer">
            <div class="quote">
                IF YOUR PHOTOS AREN'T GOOD ENOUGH, IT'S BECAUSE<br>
                YOU'RE NOT CLOSE ENOUGH.I ALWAYS SHOOT<br>
                EVERYTHING IN MY MIND AS AN EXERCISE.
            </div>
            <div class="footer-bottom">
                <div class="footer-text">活動地址：濱江路西溪街二十七號 &nbsp;|&nbsp; 主辦單位：壹晝咖啡館</div>
                <div class="footer-logo">ONE COFFEE</div>
            </div>
            
            <div class="watermark-pill placeholder">
                小红书
            </div>
            <div class="watermark-text">
                小红书号: heyu11221
            </div>
        </div>
    </div>
</body>
</html>
